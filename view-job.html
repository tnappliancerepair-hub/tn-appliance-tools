<body>
<div class="container">
  <div class="header">
    <h1>📋 Job Attachments Viewer</h1>
    <div class="controls">
      <input type="number" id="job-id" placeholder="Enter job ID (e.g. 195)" value="195">
      <button id="load-btn" onclick="loadJob()">Load</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="summary" class="summary" style="display:none;"></div>
  <div id="content"></div>
</div>

<script>
const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const NETLIFY_BASE = window.location.origin;

async function loadJob() {
  const jobId = parseInt(document.getElementById('job-id').value, 10);
  const btn = document.getElementById('load-btn');
  const statusEl = document.getElementById('status');
  const summaryEl = document.getElementById('summary');
  const contentEl = document.getElementById('content');

  if (!jobId || jobId < 1) {
    showStatus('Please enter a valid job ID.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Loading...';
  statusEl.innerHTML = '';
  summaryEl.style.display = 'none';
  contentEl.innerHTML = '';

  try {
    // Step 1: Get attachments list from Xano
    const xanoRes = await fetch(`${XANO_BASE}/get_job_attachments?job_id=${jobId}`);
    if (!xanoRes.ok) {
      throw new Error(`Xano error: ${xanoRes.status}`);
    }
    const xanoData = await xanoRes.json();

    if (!xanoData.success) {
      throw new Error('Could not fetch attachments');
    }

    if (xanoData.count === 0) {
      contentEl.innerHTML = '<div class="empty">No attachments found for this job.</div>';
      showStatus(`Loaded job #${jobId} — 0 attachments`, 'info');
      return;
    }

    showStatus(`Loaded job #${jobId} — ${xanoData.count} attachments. Generating view URLs...`, 'info');

    // Step 2: Get signed view URLs from Netlify
    const s3Keys = xanoData.attachments.map(a => a.s3_key);
    const signRes = await fetch(`${NETLIFY_BASE}/.netlify/functions/s3-view-url`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ s3_keys: s3Keys })
    });
    if (!signRes.ok) {
      throw new Error(`Sign error: ${signRes.status}`);
    }
    const signData = await signRes.json();

    if (!signData.success) {
      throw new Error('Could not sign URLs');
    }

    // Map s3_key → view_url
    const urlMap = {};
    signData.signed_urls.forEach(s => {
      urlMap[s.s3_key] = s.view_url;
    });

    // Step 3: Render
    renderSummary(xanoData.attachments);
    renderGrid(xanoData.attachments, urlMap);
    showStatus(`✓ Loaded job #${jobId} — ${xanoData.count} attachments (links expire in 15 min)`, 'success');

  } catch (err) {
    console.error(err);
    showStatus(`Error: ${err.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Load';
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

function renderSummary(attachments) {
  const el = document.getElementById('summary');
  const photos = attachments.filter(a => a.file_type === 'photo').length;
  const videos = attachments.filter(a => a.file_type === 'video').length;
  const intake = attachments.filter(a => a.attachment_type === 'intake').length;
  const completion = attachments.filter(a => a.attachment_type === 'completion').length;
  const totalBytes = attachments.reduce((s, a) => s + (a.file_size_bytes || 0), 0);
  const totalMB = (totalBytes / 1048576).toFixed(1);

  el.innerHTML = `
    <div class="stat"><div class="num">${attachments.length}</div><div class="label">Total Files</div></div>
    <div class="stat"><div class="num">${photos}</div><div class="label">Photos</div></div>
    <div class="stat"><div class="num">${videos}</div><div class="label">Videos</div></div>
    <div class="stat"><div class="num">${intake}</div><div class="label">Intake</div></div>
    <div class="stat"><div class="num">${completion}</div><div class="label">Completion</div></div>
    <div class="stat"><div class="num">${totalMB} MB</div><div class="label">Total Size</div></div>
  `;
  el.style.display = 'flex';
}

function renderGrid(attachments, urlMap) {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="grid" id="card-grid"></div>';
  const grid = document.getElementById('card-grid');

  attachments.forEach(a => {
    const url = urlMap[a.s3_key];
    const sizeMB = ((a.file_size_bytes || 0) / 1048576).toFixed(2);
    const date = new Date(a.created_at).toLocaleString();

    let mediaHtml;
    if (!url) {
      mediaHtml = '<div class="placeholder">No URL</div>';
    } else if (a.file_type === 'video') {
      mediaHtml = `<video controls preload="metadata" src="${url}"></video>`;
    } else {
      mediaHtml = `<img src="${url}" alt="${escapeHtml(a.original_filename)}" loading="lazy">`;
    }

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="media-wrap">${mediaHtml}</div>
      <div class="info">
        <div class="filename">${escapeHtml(a.original_filename || 'unnamed')}</div>
        <div>
          <span class="badge ${a.attachment_type}">${a.attachment_type}</span>
          <span class="badge ${a.file_type}">${a.file_type}</span>
        </div>
        <div class="meta">
          ${sizeMB} MB • by ${a.uploaded_by}<br>
          ${date}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// Auto-load on page open
window.addEventListener('DOMContentLoaded', () => {
  loadJob();
});
</script>
