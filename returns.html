<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>SquareTrade Returns</title>
<style>
  :root { --bg:#0c0f15; --card:#141922; --line:#232c3a; --ink:#eef2f8; --ink2:#9fb0c8; --red:#ff5c6c; --amb:#e9a23b; --grn:#2ecc71; --blu:#3a86ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system,system-ui,sans-serif; padding:14px; max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:2px 0; }
  .sub { color:var(--ink2); font-size:13px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:8px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px 12px; text-align:center; }
  .tile .n { font-size:28px; font-weight:900; line-height:1.05; font-variant-numeric:tabular-nums; }
  .tile .l { font-size:11px; color:var(--ink2); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }
  .rate { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px 15px; }
  .rate .big { font-size:26px; font-weight:900; }
  .bar { height:9px; border-radius:6px; background:#1e2836; overflow:hidden; flex:1; margin:0 12px; }
  .bar > i { display:block; height:100%; background:var(--grn); }
  h2 { font-size:15px; margin:20px 0 8px; display:flex; align-items:center; gap:8px; }
  .pill { font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
  .row.risk { border-color:#5a2530; background:#1a1013; }
  .row .part { font-size:17px; font-weight:800; }
  .row .meta { font-size:12.5px; color:var(--ink2); margin-top:2px; }
  .age { margin-left:auto; text-align:right; flex:0 0 auto; }
  .age .d { font-size:20px; font-weight:900; }
  .age .d.hot { color:var(--red); }
  .print { display:inline-block; margin-top:6px; padding:9px 12px; border-radius:9px; background:var(--grn); color:#052; font-weight:800; font-size:13px; text-decoration:none; }
  .ship { margin-top:6px; margin-left:7px; padding:9px 12px; border-radius:9px; background:transparent; color:var(--grn); border:1px solid var(--grn); font-weight:800; font-size:13px; cursor:pointer; }
  .ship:disabled { opacity:.7; }
  .linkbtn { padding:9px 12px; border-radius:9px; background:var(--blu); color:#031; font-weight:800; font-size:13px; border:none; cursor:pointer; }
  .linkbtn:disabled { opacity:.7; }
  .muted { color:var(--ink2); font-size:13px; padding:14px 4px; }
  #spin { text-align:center; padding:40px; color:var(--ink2); }
  a.link { color:var(--blu); text-decoration:none; }
</style>
<body>
  <h1>📦 SquareTrade Returns</h1>
  <div class="sub">Work it down: <b>🖨 print</b> the label, box it, tap <b>✓ Shipped it</b> → watch Owed drop. Pulled from the weekly Allstate RMA report. <a class="link" href="/return-finder.html?v=6" target="_blank">open finder →</a> · <a class="link" href="#" onclick="load();return false;">refresh</a></div>
  <div id="spin">📊 Loading the scoreboard…</div>
  <div id="out"></div>
  <div id="techflag"></div>
  <div id="unmatched"></div>

<script>
var F='/.netlify/functions';
var SECRET = localStorage.getItem('tn_social_secret') || '';
function need(){ if(SECRET) return true; var s=prompt('Enter the password:'); if(!s) return false; SECRET=s.trim(); localStorage.setItem('tn_social_secret',SECRET); return true; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var out=document.getElementById('out'), spin=document.getElementById('spin');

async function load(){
  if(!need()) return;
  spin.style.display='block'; out.innerHTML='';
  try{
    var r=await fetch(F+'/squaretrade-returns?secret='+encodeURIComponent(SECRET)+'&weeks=10');
    if(r.status===401){ localStorage.removeItem('tn_social_secret'); SECRET=''; spin.style.display='none'; out.innerHTML='<div class="muted">Password wasn\'t right — refresh and re-enter.</div>'; return; }
    render(await r.json());
  }catch(e){ out.innerHTML='<div class="muted">Couldn\'t load — try refresh.</div>'; }
  spin.style.display='none';
  loadTechFlagged();   // additive — the tech's at-stop Unused flags, before any email
  loadUnmatched();     // additive — supplied-parts emails we couldn't tie to a job
}

function findLink(i){ return '/return-finder.html?v=6&q='+encodeURIComponent(i.claim+(i.part?(' '+i.part):'')); }

function rowHtml(i, hot){
  var days=(i.held_days||0);
  return '<div class="row'+(hot?' risk':'')+'">'
    +'<div style="flex:1"><div class="part">'+esc(i.part||'—')+'</div>'
    +'<div class="meta">'+esc(i.name||'')+(i.distributor?' · ↩ '+esc(i.distributor):'')+(i.exception?' · ⚠️ '+esc(i.exception):'')+'</div>'
    +'<div style="display:flex;flex-wrap:wrap;align-items:center">'
    +'<a class="print" href="'+findLink(i)+'" target="_blank" rel="noopener">🖨 Find &amp; print</a>'
    +'<button class="ship" data-claim="'+esc(i.claim||'')+'" data-part="'+esc(i.part||'')+'" data-dist="'+esc(i.distributor||'')+'" data-rma="'+esc(i.rma||'')+'">✓ Shipped it</button>'
    +'</div></div>'
    +'<div class="age"><div class="d'+(hot?' hot':'')+'">'+days+'</div><div class="meta">days held</div></div></div>';
}

// Mark a return shipped straight from the scoreboard — logs it (mark-return-shipped),
// drops it off Owed → In transit, and reloads so the counts fall live. This is the
// blitz: print → box → tap Shipped → watch Owed drop toward zero. (Teddy 2026-07-28)
async function markShipped(b){
  b.disabled=true; b.textContent='Saving…';
  try{
    var r=await fetch(F+'/mark-return-shipped',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({secret:SECRET,job_id:b.dataset.job||undefined,claim:b.dataset.claim,part:b.dataset.part,distributor:b.dataset.dist,rma:b.dataset.rma,by:'office'})});
    var d=await r.json();
    if(d&&d.ok){
      var row=b.closest('.row'); if(row) row.style.opacity=.4;
      b.textContent='✅ Shipped'; b.style.background='var(--grn)'; b.style.color='#052';
      setTimeout(load,900);   // reload → Owed count drops, item moves to In transit
    } else { b.disabled=false; b.textContent='✓ Shipped it — retry'; }
  }catch(_){ b.disabled=false; b.textContent='✓ Shipped it — retry'; }
}

function render(d){
  if(!d||!d.ok){ out.innerHTML='<div class="muted">'+esc((d&&d.error)||'No data yet.')+'</div>'; return; }
  var s=d.scoreboard||{};
  var pct=Math.max(0,Math.min(100,s.return_rate||0));
  var h='<div class="grid">'
    +'<div class="tile"><div class="n" style="color:var(--red)">'+(s.owed||0)+'</div><div class="l">Owed</div></div>'
    +'<div class="tile"><div class="n" style="color:var(--amb)">'+(s.in_transit||0)+'</div><div class="l">In transit</div></div>'
    +'<div class="tile"><div class="n" style="color:var(--grn)">'+(s.received||0)+'</div><div class="l">Received ✓</div></div>'
    +'<div class="rate"><div><div class="l" style="font-size:11px;color:var(--ink2)">RETURN RATE</div><div class="big" style="color:'+(pct>=80?'var(--grn)':'var(--amb)')+'">'+pct+'%</div></div>'
      +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<div style="text-align:right"><div class="l" style="font-size:11px;color:var(--ink2)">GOAL</div><div class="big" style="font-size:18px;color:var(--ink2)">'+(s.goal||80)+'%</div></div></div>'
    +'</div>';

  var risk=d.at_risk||[];
  h+='<h2>⚠️ At risk — ship these first <span class="pill" style="background:#3a1620;color:var(--red)">'+risk.length+'</span></h2>';
  h+= risk.length ? risk.map(function(i){return rowHtml(i,true);}).join('') : '<div class="muted">Nothing sitting 7+ days. 🎉</div>';

  var owed=(d.owed||[]).filter(function(i){return (i.held_days||0)<7;});
  h+='<h2>❌ Owed (under 7 days) <span class="pill" style="background:#20262f;color:var(--ink2)">'+owed.length+'</span></h2>';
  h+= owed.length ? owed.map(function(i){return rowHtml(i,false);}).join('') : '<div class="muted">None.</div>';

  if((d.exceptions||[]).length){
    h+='<h2>⚠️ Exceptions (SquareTrade flagged) <span class="pill" style="background:#3a1620;color:var(--red)">'+d.exceptions.length+'</span></h2>';
    h+= d.exceptions.map(function(i){return rowHtml(i,true);}).join('');
  }
  out.innerHTML=h;
  out.querySelectorAll('.ship').forEach(function(b){ b.onclick=function(){ markShipped(b); }; });
}
// Tech-flagged returns (Unused at the stop) that don't have an emailed label yet —
// pulled from the connected returns loader so the office acts on the tech's real-time
// knowledge instead of waiting on the RMA email. Guarded so it can never break the
// main board. (Teddy 2026-08-04: "the tech knows what he isn't using.")
async function loadTechFlagged(){
  var el=document.getElementById('techflag'); if(!el) return;
  try{
    var r=await fetch(F+'/parts-returns?all=1&secret='+encodeURIComponent(SECRET));
    if(!r.ok){ el.innerHTML=''; return; }
    var d=await r.json();
    var pend=((d&&d.returns)||[]).filter(function(i){return i.label_pending;});
    if(!pend.length){ el.innerHTML=''; return; }
    var h='<h2 style="margin-top:24px">🔖 Tech flagged at the stop — label pending <span class="pill" style="background:#20262f;color:var(--ink2)">'+pend.length+'</span></h2>'
      +'<div class="muted" style="margin:-4px 0 8px">A tech marked these <b>Unused</b> in the field. Pull the label (finder), box it, ship it — before the vendor even emails one.</div>';
    h+=pend.map(function(i){
      var who=[i.customer||'', i.distributor?('↩ '+i.distributor):''].filter(Boolean).join(' · ') || ('job #'+(i.job_id||'?'));
      var dleft=(i.days_left==null?0:i.days_left);
      return '<div class="row">'
        +'<div style="flex:1"><div class="part">'+esc(i.part||'—')+'</div>'
        +'<div class="meta">'+esc(who)+(i.tech_id?(' · tech '+esc(i.tech_id)):'')+'</div>'
        +'<div style="display:flex;flex-wrap:wrap;align-items:center">'
        +'<a class="print" href="'+findLink(i)+'" target="_blank" rel="noopener">🔎 Find label</a>'
        +'<button class="ship" data-job="'+esc(i.job_id||'')+'" data-claim="'+esc(i.claim||'')+'" data-part="'+esc(i.part||'')+'" data-dist="'+esc(i.distributor||'')+'" data-rma="'+esc(i.rma||'')+'">✓ Shipped it</button>'
        +'</div></div>'
        +'<div class="age"><div class="d'+(dleft<0?' hot':'')+'">'+dleft+'</div><div class="meta">days left</div></div></div>';
    }).join('');
    el.innerHTML=h;
    el.querySelectorAll('.ship').forEach(function(b){ b.onclick=function(){ markShipped(b); }; });
  }catch(_){ el.innerHTML=''; }
}

// Unmatched supplied parts — the safety net. The parts watchers now record a
// warranty_part_unmatched event for any part in a supplied email they couldn't tie to
// a job (instead of silently dropping it). List them here so the office types the job #
// and taps Link — which records it as a supplied part on that job (lands on the tile,
// its return auto-links later). Nothing sent to us ever vanishes. (Teddy 2026-08-04)
async function loadUnmatched(){
  var el=document.getElementById('unmatched'); if(!el) return;
  try{
    var r=await fetch(F+'/unmatched-parts?secret='+encodeURIComponent(SECRET));
    if(!r.ok){ el.innerHTML=''; return; }
    var d=await r.json();
    var items=(d&&d.items)||[];
    if(!items.length){ el.innerHTML=''; return; }
    var h='<h2 style="margin-top:24px">🧩 Supplied — no matching job <span class="pill" style="background:#3a1620;color:var(--red)">'+items.length+'</span></h2>'
      +'<div class="muted" style="margin:-4px 0 8px">A parts email named these but we couldn\'t auto-match the job. Type the job # and tap <b>Link</b> — it lands on that job\'s tile (and its return links itself later). None are lost.</div>';
    h+=items.map(function(i){
      var who=[i.vendor||'', i.call?('call '+i.call):'', i.distributor?('↩ '+i.distributor):''].filter(Boolean).join(' · ');
      return '<div class="row">'
        +'<div style="flex:1"><div class="part">'+esc(i.part||'—')+(i.description?(' <span class="meta">'+esc(i.description)+'</span>'):'')+'</div>'
        +'<div class="meta">'+esc(who)+(i.tracking?(' · '+esc(i.tracking)):'')+'</div>'
        +'<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px">'
        +'<a class="print" href="'+findLink({claim:i.call,part:i.part})+'" target="_blank" rel="noopener">🔎 Find in emails</a>'
        +'<input class="jobin" data-key="'+esc(i.key)+'" inputmode="numeric" placeholder="job #" style="width:88px;padding:8px;border-radius:8px;border:1px solid var(--line,#2a2f3a);background:#111827;color:#e5e7eb;font-size:15px">'
        +'<button class="linkbtn" data-key="'+esc(i.key)+'">🔗 Link</button>'
        +'</div></div></div>';
    }).join('');
    el.innerHTML=h;
    el.querySelectorAll('.linkbtn').forEach(function(b){ b.onclick=function(){ linkUnmatched(b); }; });
  }catch(_){ el.innerHTML=''; }
}
async function linkUnmatched(b){
  var row=b.closest('.row'); var inp=row&&row.querySelector('.jobin');
  var job=(inp&&inp.value||'').replace(/[^0-9]/g,'');
  if(!job){ if(inp) inp.focus(); return; }
  b.disabled=true; b.textContent='Linking…';
  try{
    var r=await fetch(F+'/unmatched-parts',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({secret:SECRET,key:b.dataset.key,job_id:Number(job),by:'office'})});
    var d=await r.json();
    if(d&&d.ok){ if(row) row.style.opacity=.4; b.textContent='✅ Linked to #'+job; b.style.background='var(--grn)'; b.style.color='#052'; setTimeout(loadUnmatched,900); }
    else { b.disabled=false; b.textContent='🔗 Link — retry'; }
  }catch(_){ b.disabled=false; b.textContent='🔗 Link — retry'; }
}
load();
</script>
</body>
