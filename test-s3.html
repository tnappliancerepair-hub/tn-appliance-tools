<!DOCTYPE html>
<html>
<head>
  <title>S3 Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    button { padding: 15px 30px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
    button:hover { background: #0056b3; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; word-wrap: break-word; white-space: pre-wrap; font-size: 12px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>S3 Presign Test</h1>
  <p>Tap the button to test S3 signing.</p>
  <button onclick="runTest()">Test S3 Signing</button>
  <h3>Response:</h3>
  <pre id="result">Tap button to test...</pre>

  <script>
    async function runTest() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = 'Testing...';
      resultEl.className = '';

      try {
        const response = await fetch('/.netlify/functions/s3-presign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            s3_key: 'jobs/195/intake/test_file.jpg',
            mime_type: 'image/jpeg'
          })
        });

        const data = await response.json();
        
        if (data.success) {
          resultEl.className = 'success';
          resultEl.textContent = 'SUCCESS!\n\n' + JSON.stringify(data, null, 2);
        } else {
          resultEl.className = 'error';
          resultEl.textContent = 'ERROR:\n\n' + JSON.stringify(data, null, 2);
        }
      } catch (err) {
        resultEl.className = 'error';
        resultEl.textContent = 'NETWORK ERROR:\n\n' + err.message;
      }
    }
  </script>
</body>
</html>
