  <div class="kicker" id="kicker">Confirming your Quick Check…</div>
  <h1 id="head">One sec…</h1>
  <p id="msg">Locking in your $50 Quick Check.</p>
  <div class="muted">TN Appliance Exchange · <a href="/appliance-ai.html">Back to Ant</a></div>
<script>
const sid = new URLSearchParams(location.search).get('session_id');
const orb=document.getElementById('orb'), head=document.getElementById('head'), msg=document.getElementById('msg'), kicker=document.getElementById('kicker');
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function verifyOnce(){
  // absolute canonical origin so a www load never 301s the POST cross-domain
  const r=await fetch('https://tnapplianceexchange.net/.netlify/functions/verify-quickcheck',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid})});
  return await r.json();
}
async function go(){
  if(!sid){ head.textContent='Hmm —'; msg.textContent='We couldn\'t find your payment session. If you were charged, text us at 615-280-2949 and we\'ll sort it instantly.'; return; }
  let d=null, lastStatus='';
  for(let i=0;i<5;i++){            // Stripe payment_status can lag a beat on redirect — poll briefly
    try{ d=await verifyOnce(); }catch(_){ d=null; }
    if(d&&d.ok&&d.paid) break;
    lastStatus=(d&&d.payment_status)||lastStatus;
    if(i<4) await sleep(1600);
  }
  if(d&&d.ok&&d.paid){
    // 💰 Conversion — the $50 Quick Check sale. This is what the Google Ads
    // "$50 Quick Check" Performance Max campaign optimizes toward. Fired once
    // per session_id (Stripe transaction id) so a page refresh can't double-count.
    try{ if(!d.already) gtag('event','purchase',{ transaction_id: sid, value: Number(d.amount)||50, currency:'USD', items:[{item_id:'quick_check', item_name:'$50 Quick Check'}] }); }catch(_){}
    // Google Ads paid conversion — deduped per Stripe session so a refresh can't double-count.
    try{ if(!d.already) gtag('event','conversion',{ send_to:'AW-11509905666/YM7jCPDK3skcEILyrPAq', value: Number(d.amount)||50, currency:'USD', transaction_id: sid }); }catch(_){}
    const LG=(d.language||'en').toLowerCase(); const ES=LG==='es';
    orb.classList.add('ok');
    kicker.textContent= ES?'Pago recibido':'Payment received';
    head.innerHTML= ES ? ('¡<span class="a">Todo listo'+(d.first_name?(', '+d.first_name):'')+'!</span>') : ('You\'re <span class="a">all set'+(d.first_name?(', '+d.first_name):'')+'!</span>');
    // NEW cash flow (pay first): no video yet — send them into the polished warranty
    // intake (video → model → availability → waiver) bound to the job we just created,
    // carrying their language so the whole flow stays in it.
    const langq = (d.language && d.language!=='en') ? ('&lang='+encodeURIComponent(d.language)) : '';
    if(d.job_id){
      msg.innerHTML= ES
        ? 'Recibimos tu Revisión Rápida de $50 ✅ — <b>ahora unos pasos rápidos</b> para que nuestro técnico te dé una respuesta honesta. Te llevamos ahí…'
        : 'Got your $50 Quick Check ✅ — <b>next, a couple quick things</b> so our tech can give you an honest answer. Taking you there now…';
      setTimeout(function(){ location.href='/warranty-intake.html?job_id='+encodeURIComponent(d.job_id)+langq; }, 1600);
    } else {
      msg.innerHTML= ES
        ? 'Recibimos tu Revisión Rápida de $50 ✅ — envíanos un video corto de lo que está pasando + una foto del número de modelo al <b>615-280-2949</b> y tendrás tu respuesta honesta en un par de horas.'
        : 'Got your $50 Quick Check ✅ — text us a quick video of what it\'s doing + a photo of the model number at <b>615-280-2949</b> and you\'ll have your honest answer within a couple hours.';
    }
  } else {
    head.textContent='Almost —';
    msg.innerHTML='We didn\'t see the payment complete yet'+(lastStatus?(' (status: '+lastStatus+')'):'')+'. If you were charged, text <b>615-280-2949</b> and we\'ll take care of you right away.';
  }
}
go();
</script>
