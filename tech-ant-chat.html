<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ant — Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    width: 100%;
    max-width: 100vw;
    overflow: hidden;
    background: #000000;
    color: #e8edf5;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Wrap-with-cutout palette: pure black wrap, stainless steel cutout,
     LED-white accent (Cybertruck headlight feel — not blue, not cyan, pure cold white). */
  :root {
    --bg-0: #000000;       /* matte black wrap */
    --bg-1: #050505;
    --bg-2: #0a0a0a;
    --led: #f0f5ff;        /* LED cold white */
    --led-dim: rgba(240,245,255,0.5);
    --led-glow: rgba(240,245,255,0.18);
    --steel-1: #f5f7fa;
    --steel-2: #cfd4dd;
    --steel-3: #7a8190;
    --steel-4: #1a1d24;
    --text: #e8edf5;
    --text-dim: #7a8190;
    --line: rgba(240,245,255,0.06);
  }

  /* ── 1. Background canvas: deep space + faint grid + radial glow ───── */
  /* Pure-black wrap base. Subtle radial highlight ONLY behind the ANT so
     it looks like LED ambient bleed from behind a milled-steel cutout. */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 50%, rgba(240,245,255,0.08), transparent 65%),
      #000000;
    z-index: -3;
  }
  /* Subtle brushed-metal noise texture across the page */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0px, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 3px);
    z-index: -2;
    pointer-events: none;
  }

  /* ── 2. Hero backdrop: massive chrome ANT text + ant silhouette ───── */
  .hero-backdrop {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    width: 100vw;
    max-width: 100vw;
  }
  /* Stainless-steel ANT cutout: brushed steel gradient inside the letters,
     LED ambient glow bleeding from behind (as if light is leaking through
     a milled-out section of the black wrap). */
  .hero-ant-text {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    letter-spacing: 0.02em;
    /* Constrain so 3 letters + letter-spacing fit ≤90vw — no horizontal shift */
    font-size: clamp(160px, 28vw, 420px);
    line-height: 0.9;
    max-width: 90vw;
    text-align: center;
    background:
      /* highlight band (top of letter polish) */
      linear-gradient(
        180deg,
        #ffffff 0%,
        #e8eef5 8%,
        #cfd4dd 22%,
        #7a8190 42%,
        #1a1d24 58%,
        #7a8190 72%,
        #cfd4dd 86%,
        #f0f2f5 96%,
        #ffffff 100%
      );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    opacity: 0.85;
    /* dual drop shadows = inner LED bleed + carved-edge depth */
    filter:
      drop-shadow(0 0 80px rgba(240,245,255,0.25))
      drop-shadow(0 0 30px rgba(240,245,255,0.12))
      drop-shadow(0 6px 0 rgba(0,0,0,0.9));
    user-select: none;
    text-align: center;
    animation: ledPulse 5s ease-in-out infinite;
  }
  @keyframes ledPulse {
    0%, 100% {
      filter:
        drop-shadow(0 0 80px rgba(240,245,255,0.25))
        drop-shadow(0 0 30px rgba(240,245,255,0.12))
        drop-shadow(0 6px 0 rgba(0,0,0,0.9));
    }
    50% {
      filter:
        drop-shadow(0 0 120px rgba(240,245,255,0.45))
        drop-shadow(0 0 50px rgba(240,245,255,0.22))
        drop-shadow(0 6px 0 rgba(0,0,0,0.9));
    }
  }

  /* Brushed-metal stripe overlay across the ANT letters (subtle) */
  .hero-backdrop::before {
    content: '';
    position: absolute;
    inset: 25% 5% 25% 5%;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 1px,
      rgba(255,255,255,0.03) 1px,
      rgba(255,255,255,0.03) 2px
    );
    pointer-events: none;
    mix-blend-mode: overlay;
  }
  /* Single thin LED sweep across the ANT (slow horizontal pass) */
  .hero-backdrop::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,245,255,0.7), transparent);
    box-shadow: 0 0 12px rgba(240,245,255,0.6);
    animation: ledSweep 8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes ledSweep {
    0%   { transform: translateX(-100%); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateX(100%); opacity: 0; }
  }

  /* ── HUD frame: corner brackets that frame the entire viewport ───── */
  .hud-corners {
    position: fixed; inset: 8px;
    z-index: 5;
    pointer-events: none;
  }
  .hud-corners::before,
  .hud-corners::after,
  .hud-corners .br,
  .hud-corners .bl {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    border-color: rgba(240,245,255,0.4);
    border-style: solid;
    border-width: 0;
  }
  .hud-corners::before { top: 0; left: 0;  border-top-width: 2px; border-left-width: 2px; }
  .hud-corners::after  { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
  .hud-corners .bl     { bottom: 0; left: 0;  border-bottom-width: 2px; border-left-width: 2px; }
  .hud-corners .br     { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }

  /* HUD status bar at the very top — 2090 system readout */
  .hud-statusbar {
    position: fixed;
    top: 12px; left: 32px; right: 32px;
    z-index: 6;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    color: rgba(240,245,255,0.55);
    text-transform: uppercase;
    pointer-events: none;
  }
  .hud-statusbar .group { display: flex; gap: 14px; align-items: center; }
  .hud-statusbar .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--led);
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 6px var(--led-glow), 0 0 12px var(--led-glow);
    animation: dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }
  .hud-statusbar .signal { color: rgba(240,245,255,0.7); }

  /* ── 3. App shell ──────────────────────────────────────────────── */
  .app {
    position: relative;
    height: 100dvh;
    height: 100vh;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    z-index: 1;
    padding-top: 26px;  /* room for HUD statusbar */
  }

  /* ── 3.5 Primary action bar — NAV + OTW + CALL + START JOB ── */
  .action-bar {
    padding: 8px 10px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1.4fr;
    gap: 6px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    width: 100%;
    max-width: 100vw;
    box-sizing: border-box;
    overflow: hidden;
  }
  .action-btn {
    position: relative;
    min-width: 0;
    height: 44px;
    background: linear-gradient(180deg, rgba(30,38,55,0.85), rgba(14,22,40,0.85));
    border: 1px solid rgba(255,255,255,0.10);
    color: var(--text);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.10em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 0 6px;
    /* Cybertruck angular cut corners (smaller for narrow phones) */
    clip-path: polygon(
      8px 0,
      calc(100% - 8px) 0,
      100% 8px,
      100% calc(100% - 8px),
      calc(100% - 8px) 100%,
      8px 100%,
      0 calc(100% - 8px),
      0 8px
    );
    transition: all 0.15s;
    -webkit-appearance: none;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .action-btn .emoji {
    font-size: 14px;
    filter: drop-shadow(0 0 4px rgba(240,245,255,0.4));
  }
  .action-btn:active { transform: scale(0.98); }
  .action-btn.primary {
    background: linear-gradient(180deg, rgba(240,245,255,0.18), rgba(54,205,255,0.10));
    border-color: rgba(240,245,255,0.55);
    color: var(--cyan);
    text-shadow: 0 0 6px rgba(240,245,255,0.4);
    box-shadow:
      0 0 0 1px rgba(240,245,255,0.10),
      0 0 18px rgba(240,245,255,0.18) inset,
      0 0 22px rgba(240,245,255,0.18);
  }
  .action-btn.primary:hover { box-shadow: 0 0 0 1px rgba(240,245,255,0.20), 0 0 28px rgba(240,245,255,0.28); }

  /* Header */
  .topbar {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.72) 100%);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    width: 100%;
    max-width: 100vw;
    box-sizing: border-box;
    overflow: hidden;
  }
  .topbar-row1 {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ant-mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1a1f2c, #0a1020);
    border: 1px solid rgba(240,245,255,0.35);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 0 12px rgba(240,245,255,0.22);
    flex-shrink: 0;
    position: relative;
  }
  .ant-mark::before {
    content: '🐜';
    font-size: 20px;
    filter: drop-shadow(0 0 4px rgba(240,245,255,0.6));
  }
  .ant-mark::after {
    content: '';
    position: absolute; inset: -2px;
    border-radius: 12px;
    border: 1px solid rgba(240,245,255,0.18);
    animation: pulseRing 2.8s ease-in-out infinite;
  }
  @keyframes pulseRing {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%      { opacity: 0.8; transform: scale(1.06); }
  }
  .topbar-title-block { flex: 1; min-width: 0; }
  .topbar-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.12em;
    background: linear-gradient(180deg, #ffffff 0%, #d8dde6 50%, #8a93aa 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .topbar-tagline {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 2px;
    font-family: 'Inter', monospace;
  }
  .topbar-tagline .cyan { color: var(--cyan); }
  .topbar-row2 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .topbar-row2::-webkit-scrollbar { display: none; }
  .ctx-pill {
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .ctx-pill.cyan {
    border-color: rgba(240,245,255,0.30);
    color: var(--cyan);
    background: rgba(240,245,255,0.06);
  }
  .ctx-pill .label {
    color: rgba(138,147,170,0.7);
    margin-right: 4px;
    font-weight: 500;
  }

  /* Quick action chips inside header */
  .topbar-actions {
    display: flex;
    gap: 6px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .topbar-action {
    width: 34px; height: 34px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .topbar-action:hover { border-color: var(--cyan-dim); background: rgba(240,245,255,0.08); }
  .topbar-action:active { transform: scale(0.94); }

  /* ── 4. Chat area ──────────────────────────────────────────────── */
  .chat-stage {
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 18px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .chat-stage::-webkit-scrollbar { width: 3px; }
  .chat-stage::-webkit-scrollbar-thumb { background: rgba(240,245,255,0.18); border-radius: 2px; }

  /* Empty state — sits centered in the chat area when there are no messages */
  .empty-state {
    margin: auto;
    max-width: 320px;
    text-align: center;
    color: var(--text-dim);
    padding: 30px 12px;
    user-select: none;
  }
  .empty-state .glyph {
    font-size: 36px;
    margin-bottom: 12px;
    opacity: 0.5;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  .empty-state .line1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(240,245,255,0.7);
    margin-bottom: 8px;
  }
  .empty-state .line2 {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  /* Message bubble (template — for later wiring) */
  .msg {
    display: flex;
    gap: 10px;
    animation: msgIn 0.3s ease forwards;
    max-width: 92%;
  }
  .msg.ant { align-self: flex-start; }
  .msg.you { align-self: flex-end; flex-direction: row-reverse; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg-av {
    width: 28px; height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    margin-top: 2px;
  }
  .msg.ant .msg-av {
    background: linear-gradient(135deg, rgba(240,245,255,0.16), rgba(240,245,255,0.06));
    border: 1px solid rgba(240,245,255,0.35);
  }
  .msg.you .msg-av {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .msg-bubble {
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.ant .msg-bubble {
    background: linear-gradient(180deg, rgba(20,28,46,0.94), rgba(14,20,34,0.94));
    border: 1px solid rgba(240,245,255,0.18);
    border-top-left-radius: 4px;
    color: var(--text);
    box-shadow: 0 2px 12px rgba(240,245,255,0.06);
  }
  .msg.you .msg-bubble {
    background: linear-gradient(180deg, rgba(240,245,255,0.92), rgba(54,205,255,0.92));
    border-top-right-radius: 4px;
    color: #03060c;
    font-weight: 500;
  }

  /* ── 5. Composer ──────────────────────────────────────────────── */
  /* Composer goes edge-to-edge across the bottom — full bleed bar */
  .composer {
    padding: 0 0 env(safe-area-inset-bottom) 0;
    border-top: 1px solid rgba(240,245,255,0.18);
    background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.98) 100%);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    width: 100%;
    max-width: 100vw;
    box-sizing: border-box;
  }
  .composer-inner {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 8px 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
    max-width: 100vw;
    box-sizing: border-box;
  }
  .composer-inner:focus-within {
    border-color: var(--cyan-dim);
    box-shadow: 0 0 0 3px var(--cyan-glow);
  }
  .composer-btn {
    width: 38px; height: 38px;
    flex-shrink: 0;
    border-radius: 11px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .composer-btn:hover { border-color: var(--cyan-dim); }
  .composer-btn:active { transform: scale(0.94); }
  .composer-btn.send {
    background: linear-gradient(135deg, #4af5ff, #36cdff);
    color: #03060c;
    border-color: #4af5ff;
    box-shadow: 0 0 16px rgba(240,245,255,0.4);
  }
  .composer-input {
    flex: 1;
    min-width: 0;
    background: rgba(10,16,32,0.6);
    border: 1px solid rgba(240,245,255,0.10);
    border-radius: 12px;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.4;
    padding: 10px 12px;
    resize: none;
    max-height: 120px;
    min-height: 40px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .composer-input:focus {
    border-color: rgba(240,245,255,0.50);
    box-shadow: 0 0 0 2px rgba(240,245,255,0.10);
  }
  .composer-input::placeholder { color: rgba(138,147,170,0.5); }

  /* Reduced-motion respect */
  @media (prefers-reduced-motion: reduce) {
    .hero-ant-text, .ant-mark::after, .empty-state .glyph { animation: none !important; }
  }
</style>
</head>
<body>

<!-- HUD frame: corner brackets + top status bar — 2090 sci-fi readout -->
<div class="hud-corners" aria-hidden="true"><i class="bl"></i><i class="br"></i></div>
<div class="hud-statusbar" aria-hidden="true">
  <div class="group">
    <span><span class="dot"></span>ONLINE</span>
  </div>
  <div class="group">
    <span id="hud-time">--:--</span>
  </div>
</div>

<!-- Hero backdrop: giant centered stainless ANT cutout with LED bleed -->
<div class="hero-backdrop" aria-hidden="true">
  <div class="hero-ant-text">ANT</div>
</div>

<!-- App shell -->
<div class="app">

  <!-- Header -->
  <header class="topbar">
    <div class="topbar-row1">
      <div class="ant-mark" aria-hidden="true"></div>
      <div class="topbar-title-block">
        <div class="topbar-title">ANT</div>
        <div class="topbar-tagline">your <span class="cyan">field partner</span> &middot; everything you need to know</div>
      </div>
    </div>
    <div class="topbar-row2" id="ctx-pills">
      <span class="ctx-pill cyan"><span class="label">JOB</span>#18270</span>
      <span class="ctx-pill"><span class="label">CUST</span>Shenouda Kaleeny</span>
      <span class="ctx-pill"><span class="label">APPL</span>—</span>
      <span class="ctx-pill"><span class="label">TIME</span>11:00 AM</span>
    </div>
  </header>

  <!-- Primary action bar — NAV + OTW + CALL + START JOB -->
  <div class="action-bar">
    <button class="action-btn" id="btn-nav" title="Navigate">
      <span class="emoji">📍</span><span>NAV</span>
    </button>
    <button class="action-btn" id="btn-otw" title="On My Way">
      <span class="emoji">🚗</span><span>OTW</span>
    </button>
    <button class="action-btn" id="btn-call" title="Call customer">
      <span class="emoji">📞</span><span>CALL</span>
    </button>
    <button class="action-btn primary" id="btn-start" title="Start Job">
      <span class="emoji">▶</span><span>START</span>
    </button>
  </div>

  <!-- Chat stage -->
  <main class="chat-stage" id="chat-stage">
    <div class="empty-state" id="empty-state">
      <div class="glyph">🐜</div>
      <div class="line1">ready when you are</div>
      <div class="line2">talk to me. snap a photo. ask anything.<br>i&rsquo;ve got the rest.</div>
    </div>

  <!-- Composer -->
  <footer class="composer">
    <div class="composer-inner">
      <button class="composer-btn" title="Camera" aria-label="Camera">📷</button>
      <button class="composer-btn" title="Voice" aria-label="Voice">🎤</button>

        rows="1"

        aria-label="Talk to Ant"></textarea>

    </div>

</div>

<script>
// SHELL ONLY — no backend wiring yet. Visual frame for review.
// HUD time ticker + textarea autogrow.
(function () {
  'use strict';
  const ta = document.getElementById('composer-input');
  if (ta) {
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
    });
  }
  // 2090 HUD: live time + uptime feel (CT timezone)
  const hudTime = document.getElementById('hud-time');
  function tick() {
    if (!hudTime) return;
    const now = new Date();
    const t = now.toLocaleTimeString('en-US', {
      timeZone: 'America/Chicago',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    hudTime.textContent = t + ' CT';
  }
  tick(); setInterval(tick, 1000);
})();
</script>
