<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>🎬 Video Studio — TN Appliance</title>
<style>
  :root{ --bg:#0b0c10; --card:#14161d; --ink:#f4f1ea; --dim:#98a1ad; --gold:#e7c255; --line:rgba(231,194,85,.22); --ok:#34d399; --warn:#f59e0b; --bad:#ef4444; }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#13161d,#0a0b0f);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;padding-bottom:64px}
  h1{font:800 26px/1.1 Georgia,serif;color:var(--gold);margin:6px 0 2px;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
  label{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
  input,select,textarea,button{font:inherit}
  input[type=text],select,textarea{width:100%;background:#0e1016;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px}
  textarea{min-height:78px;resize:vertical}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1a1400;border:none;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line)}
  .pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .p-processing{background:rgba(245,158,11,.15);color:var(--warn)} .p-ready{background:rgba(52,211,153,.15);color:var(--ok)}
  .p-failed{background:rgba(239,68,68,.15);color:var(--bad)} .p-posted{background:rgba(231,194,85,.15);color:var(--gold)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--dim);font-size:13px}
  video{width:100%;border-radius:12px;background:#000;margin-top:10px;max-height:420px}
  .chk{display:inline-flex;align-items:center;gap:6px;background:#0e1016;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;user-select:none}
  .chk input{width:auto;margin:0}
  .banner{border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:14px}
  .banner.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3)}
  .banner.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3)}
  .prog{height:8px;background:#0e1016;border-radius:999px;overflow:hidden;margin-top:8px}
  .prog>i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
  .res{font-size:12px;margin-top:8px;white-space:pre-wrap;color:var(--dim)}
  .jt{font-weight:700;margin-bottom:2px}
  a{color:var(--gold)}
</style>
</head>
<body>
  <h1>🎬 Video Studio</h1>
  <div class="sub">Shoot on the tripod → auto-caption + hook → post everywhere. 🐜</div>
  <div id="setup"></div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>➕ New clip</strong>
      <span class="muted">MP4/MOV · vertical is best</span>
    </div>
    <label>Raw clip from the tripod</label>
    <input type="file" id="file" accept="video/*">
    <div class="prog" id="progWrap" style="display:none"><i id="prog"></i></div>
    <div id="upmsg" class="muted"></div>

    <div id="form" style="display:none">
      <label>Title (what's this clip?)</label>
      <input type="text" id="title" placeholder="Whirlpool dryer won't heat — fix or not?">
      <div class="row">
        <div style="flex:1;min-width:150px">
          <label>Series (the franchise)</label>
          <select id="series">
            <option value="hero">⭐ Hero — you/tech on camera</option>
            <option value="fix_or_toss">⚖️ Fix or Toss?</option>
            <option value="what_killed_it">💀 What killed this appliance?</option>
            <option value="model_to_part">🔎 Model # → the exact part</option>
            <option value="fault_code">🚨 Fault-code explainer</option>
            <option value="quick_tip">🔧 Quick tip / how-to</option>
          </select>
        </div>
        <div style="flex:1;min-width:110px">
          <label>Appliance</label>
          <select id="appliance">
            <option value="">(auto-detect)</option>
            <option>Refrigerator</option><option>Washer</option><option>Dryer</option>
            <option>Dishwasher</option><option>Range/Oven</option><option>Microwave</option>
          </select>
        </div>
        <div style="flex:1;min-width:110px">
          <label>Brand <span class="muted">(optional)</span></label>
          <input type="text" id="brand" placeholder="Whirlpool">
        </div>
      </div>
      <label>Hook (big text burned on screen, second 1)</label>
      <div class="row" style="gap:8px;align-items:stretch">
        <input type="text" id="hook" placeholder="Your dryer isn't broken — it's THIS 👀" style="flex:1">
        <button class="btn ghost" id="sughook" style="padding:8px 12px;white-space:nowrap" title="Ant writes a scroll-stopping hook grounded in our real repair data">🎣 Suggest hook</button>
      </div>
      <div id="hooksug" class="muted" style="margin-top:6px"></div>
      <div class="row" style="margin-top:10px">
        <div style="flex:1;min-width:150px">
          <label>Caption style</label>
          <select id="tmpl">
            <option value="Hormozi 2">Bold (Hormozi 2)</option>
            <option value="">Clean (auto)</option>
          </select>
        </div>
      </div>
      <div style="margin-top:14px"><button class="btn" id="submit">✨ Caption &amp; build it</button></div>
      <div id="submsg" class="muted" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>🎬 Long video → auto-clip</strong>
      <span class="muted">a ride-along / full job → the best shorts</span>
    </div>
    <div id="clipsetup" class="muted" style="margin-top:6px"></div>
    <label>Long clip (a walkthrough, a ride-along with John…)</label>
    <input type="file" id="longfile" accept="video/*">
    <div class="prog" id="lprogWrap" style="display:none"><i id="lprog"></i></div>
    <div id="lupmsg" class="muted"></div>
    <div id="lform" style="display:none">
      <label>What is this? (names the clips)</label>
      <input type="text" id="lname" placeholder="Ride-along with John — Whirlpool fridge">
      <label>Captions</label>
      <select id="lmode">
        <option value="vizard">⚡ Vizard — free &amp; instant (uses your Creator credits) — best for volume</option>
        <option value="premium">✨ Submagic — premium look (uses Submagic minutes) — for hero clips</option>
      </select>
      <div style="margin-top:12px"><button class="btn" id="lsubmit">🎬 Cut it into shorts</button></div>
      <div id="lsubmsg" class="muted" style="margin-top:8px"></div>
    </div>
    <div id="clipjobs"></div>
  </div>

  <div class="row" style="justify-content:space-between;margin:4px 2px 10px">
    <strong>🗂 The queue</strong>
    <div class="row" style="gap:8px">
      <button class="btn ghost" id="punchup" style="padding:7px 12px" title="Write scroll-stopping hooks + YouTube SEO for every clip at once">✨ Punch up everything</button>
      <button class="btn ghost" id="loadfb" style="padding:7px 12px" title="Pull the 2013–2016 good ol days videos off our Facebook Page into the Studio">📼 Load Facebook archive</button>
      <button class="btn ghost" id="refresh" style="padding:7px 12px">↻ Refresh</button>
    </div>
  </div>
  <div id="jobs"><div class="muted">Loading…</div></div>

<script>
const F='/.netlify/functions';
let SECRET = localStorage.getItem('tn_social_secret') || '';
function need(){ if(SECRET) return true; const s=prompt('Enter admin secret for the Video Studio:'); if(!s) return false; SECRET=s.trim(); localStorage.setItem('tn_social_secret',SECRET); return true; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function jget(url){ const r=await fetch(url,{cache:'no-store'}); if(r.status===401){localStorage.removeItem('tn_social_secret');SECRET='';throw new Error('unauthorized');} return r.json(); }
async function jpost(fn,body){ const r=await fetch(F+'/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:SECRET,...body})}); return r.json(); }

async function checkSetup(){
  try{
    const s=await jget(F+'/submagic-check?secret='+encodeURIComponent(SECRET));
    const el=document.getElementById('setup');
    if(s.ok){ el.innerHTML='<div class="banner ok">✅ Submagic connected ('+esc(s.key||'')+') — captions engine ready.</div>'; }
    else if(s.configured){ el.innerHTML='<div class="banner warn">⚠️ Submagic key present but auth was rejected — re-check the key in the vault.</div>'; }
    else { el.innerHTML='<div class="banner warn">⚠️ Submagic not connected yet. Sign up (Business plan = API), then add <b>SUBMAGIC_API_KEY</b> in admin-secrets.html. You can still upload clips — they\'ll build once the key is in.</div>'; }
  }catch(e){ document.getElementById('setup').innerHTML='<div class="banner warn">Enter the admin secret to continue.</div>'; }
}

// ---- upload a raw clip straight to S3 (presigned PUT) ----
let RAW_KEY='';
document.getElementById('file').addEventListener('change', async function(){
  const f=this.files&&this.files[0]; if(!f) return;
  if(!need()) return;
  const mime=f.type||'video/mp4';
  const ext=(f.name.match(/\.(mp4|mov|m4v)$/i)||['','mp4'])[1].toLowerCase();
  const key='social/raw/'+Date.now()+'-'+Math.floor(Math.random()*1e6)+'.'+ext;
  document.getElementById('upmsg').textContent='Getting upload link…';
  let pre; try{ pre=await jpost('s3-presign',{s3_key:key,mime_type:mime}); }catch(e){ document.getElementById('upmsg').textContent='Upload link failed.'; return; }
  if(!pre||!pre.upload_url){ document.getElementById('upmsg').textContent='Upload link failed.'; return; }
  document.getElementById('progWrap').style.display='block';
  await new Promise((res,rej)=>{
    const x=new XMLHttpRequest(); x.open('PUT',pre.upload_url);
    x.setRequestHeader('Content-Type',mime);
    x.upload.onprogress=e=>{ if(e.lengthComputable) document.getElementById('prog').style.width=Math.round(e.loaded/e.total*100)+'%'; };
    x.onload=()=> x.status>=200&&x.status<300?res():rej(new Error('PUT '+x.status));
    x.onerror=()=>rej(new Error('network')); x.send(f);
  }).then(()=>{
    RAW_KEY=key;
    document.getElementById('upmsg').innerHTML='✅ Uploaded ('+Math.round(f.size/1048576)+' MB). Now caption it 👇';
    document.getElementById('form').style.display='block';
    if(!document.getElementById('title').value) document.getElementById('title').value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  }).catch(e=>{ document.getElementById('upmsg').textContent='Upload failed: '+e.message; });
});

// 🎣 Suggest hook — BEFORE building, so the grounded, scroll-stopping line gets
// BURNED on screen (not just used in the caption after the fact).
document.getElementById('sughook').addEventListener('click', async function(){
  const t=document.getElementById('title').value.trim();
  const el=document.getElementById('hooksug');
  if(!t){ el.textContent='Type a title first so Ant knows the clip.'; return; }
  this.disabled=true; const old=this.textContent; this.textContent='Thinking…'; el.textContent='';
  const r=await jpost('hook-doctor',{ title:t, series:document.getElementById('series').value, appliance:document.getElementById('appliance').value, brand:document.getElementById('brand').value });
  this.disabled=false; this.textContent=old;
  if(r&&r.ok){
    if(r.on_screen_hook) document.getElementById('hook').value=r.on_screen_hook;
    let h='<div style="background:#111;border:1px solid #262626;border-radius:10px;padding:8px 10px;white-space:normal;line-height:1.5">';
    if(r.on_screen_hook) h+='<div><b style="color:#e9c46a">✅ On screen:</b> '+esc(r.on_screen_hook)+' <span class="muted">(filled in above — edit freely)</span></div>';
    if(r.proof_line) h+='<div style="margin-top:5px"><b style="color:#e9c46a">🐜 Proof line:</b> '+esc(r.proof_line)+'</div>';
    if(r.facts&&r.facts.has_stat) h+='<div style="margin-top:5px;color:#9aa">📊 grounded in '+(r.facts.based_on_n||0)+' real '+esc((r.facts.appliance||'').toLowerCase())+' repairs'+(r.facts.top_component?' · most common: '+esc(r.facts.top_component):'')+'</div>';
    if(r.hook_formats&&r.hook_formats.length){ h+='<div style="margin-top:6px"><b style="color:#e9c46a">Other angles</b> <span class="muted">(tap to use)</span><br>'+r.hook_formats.map(function(x){return '<span onclick="document.getElementById(\'hook\').value=this.dataset.h" data-h="'+esc(x.text).replace(/"/g,'&quot;')+'" style="cursor:pointer;display:inline-block;margin:3px 0"><b style="color:#7fb">'+esc(x.format)+':</b> '+esc(x.text)+'</span>';}).join('<br>')+'</div>'; }
    h+='</div>'; el.innerHTML=h;
  } else el.textContent='⚠️ '+((r&&r.error)||'could not write a hook — try again');
});

document.getElementById('submit').addEventListener('click', async function(){
  if(!RAW_KEY) return;
  this.disabled=true; const msg=document.getElementById('submsg'); msg.textContent='Sending to the captions engine…';
  const sv=document.getElementById('series').value;
  const r=await jpost('video-submit',{ s3_key:RAW_KEY, title:document.getElementById('title').value, hook:document.getElementById('hook').value, series:sv, content_type:sv, appliance:document.getElementById('appliance').value, brand:document.getElementById('brand').value, template:document.getElementById('tmpl').value });
  this.disabled=false;
  if(r&&r.ok){ msg.innerHTML='✅ Building your short — it\'ll appear in the queue below as <b>Ready</b> in a few minutes.'; RAW_KEY=''; document.getElementById('form').style.display='none'; document.getElementById('file').value=''; document.getElementById('progWrap').style.display='none'; document.getElementById('prog').style.width='0'; document.getElementById('upmsg').textContent=''; loadJobs(); }
  else { msg.textContent='⚠️ '+(r&&(r.error||r.note)||'failed')+(r&&r.detail?(' — '+JSON.stringify(r.detail).slice(0,160)):''); }
});

// ---- long video -> auto-clip (Vizard) ----
let LONG_KEY='';
async function s3upload(file, wrapId, barId, msgId){
  const mime=file.type||'video/mp4';
  const ext=(file.name.match(/\.(mp4|mov|m4v)$/i)||['','mp4'])[1].toLowerCase();
  const key='social/raw/'+Date.now()+'-'+Math.floor(Math.random()*1e6)+'.'+ext;
  document.getElementById(msgId).textContent='Getting upload link…';
  const pre=await jpost('s3-presign',{s3_key:key,mime_type:mime});
  if(!pre||!pre.upload_url) throw new Error('no upload link');
  document.getElementById(wrapId).style.display='block';
  await new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('PUT',pre.upload_url); x.setRequestHeader('Content-Type',mime);
    x.upload.onprogress=e=>{ if(e.lengthComputable) document.getElementById(barId).style.width=Math.round(e.loaded/e.total*100)+'%'; };
    x.onload=()=> x.status>=200&&x.status<300?res():rej(new Error('PUT '+x.status)); x.onerror=()=>rej(new Error('network')); x.send(file); });
  return key;
}
document.getElementById('longfile').addEventListener('change', async function(){
  const f=this.files&&this.files[0]; if(!f||!need()) return;
  try{ LONG_KEY=await s3upload(f,'lprogWrap','lprog','lupmsg');
    document.getElementById('lupmsg').innerHTML='✅ Uploaded ('+Math.round(f.size/1048576)+' MB). Now cut it 👇';
    document.getElementById('lform').style.display='block';
    if(!document.getElementById('lname').value) document.getElementById('lname').value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  }catch(e){ document.getElementById('lupmsg').textContent='Upload failed: '+e.message; }
});
document.getElementById('lsubmit').addEventListener('click', async function(){
  if(!LONG_KEY) return; this.disabled=true; const m=document.getElementById('lsubmsg'); m.textContent='Sending to the auto-clipper…';
  const r=await jpost('video-clip-submit',{ s3_key:LONG_KEY, project_name:document.getElementById('lname').value, content_type:'hero', mode:document.getElementById('lmode').value });
  this.disabled=false;
  if(r&&r.ok){ m.innerHTML='✅ Cutting into shorts — each finished clip appears in the queue below in a few minutes.'; LONG_KEY=''; document.getElementById('lform').style.display='none'; document.getElementById('longfile').value=''; document.getElementById('lprogWrap').style.display='none'; document.getElementById('lprog').style.width='0'; document.getElementById('lupmsg').textContent=''; loadJobs(true); }
  else { m.textContent='⚠️ '+(r&&(r.error||r.note)||'failed'); }
});
function renderClipJobs(list){
  const el=document.getElementById('clipjobs'); if(!list||!list.length){ el.innerHTML=''; return; }
  const junk=list.filter(c=>c.status!=='clipping'&&c.status!=='done').length;
  const clearBtn = junk ? '<div style="margin-top:10px"><button onclick="clearClipTimeouts(this)" style="background:#3a1414;color:#ff8080;border:1px solid #5a1e1e;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer">🧹 Clear all '+junk+' timed-out</button></div>' : '';
  el.innerHTML='<div style="margin-top:12px">'+list.map(c=>{
    const s=c.status==='clipping'?'<span class="pill p-processing">clipping…</span>':(c.status==='done'?'<span class="pill p-ready">'+c.clip_count+' shorts</span>':'<span class="pill p-failed">'+esc(c.status)+'</span>');
    // Any row that's no longer working (done/timeout/failed) gets a 🗑 so it can be cleared.
    const del = c.status==='clipping' ? '' : '<button title="Remove from list" onclick="delClipJob('+JSON.stringify(String(c.id))+',this)" style="background:none;border:none;color:#e57373;font-size:16px;cursor:pointer;padding:0 4px;margin-left:8px">🗑</button>';
    return '<div class="row" style="justify-content:space-between;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)"><span class="muted">'+esc(c.project_name||'Long video')+'</span><span style="display:flex;align-items:center">'+s+del+'</span></div>';
  }).join('')+'</div>'+clearBtn;
}
async function delClipJob(id,btn){
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  try{
    const r=await fetch(F+'/video-prune',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:SECRET,clip_ids:[String(id)]})});
    const d=await r.json();
    if(d&&d.ok){ loadJobs(); } else { if(btn){btn.disabled=false;btn.textContent='🗑';} alert('Could not remove — '+((d&&d.error)||'try again')); }
  }catch(e){ if(btn){btn.disabled=false;btn.textContent='🗑';} alert('Network hiccup — try again.'); }
}
async function clearClipTimeouts(btn){
  if(btn){ btn.disabled=true; btn.textContent='Clearing…'; }
  try{
    const r=await fetch(F+'/video-prune',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:SECRET,clip_status:['timeout','failed','error']})});
    const d=await r.json();
    if(d&&d.ok){ loadJobs(); } else { if(btn){btn.disabled=false;btn.textContent='🧹 Clear all timed-out';} alert('Could not clear — '+((d&&d.error)||'try again')); }
  }catch(e){ if(btn){btn.disabled=false;btn.textContent='🧹 Clear all timed-out';} alert('Network hiccup — try again.'); }
}

// ---- the queue ----
// The "good ol days" voice (Teddy 2026-07-20): proud, redneck, name-forward,
// omnipresent. "good ol days" is spelled that way ON PURPOSE. Archive clips post
// in this voice; you can still edit before posting.
const GOODOL=[
  "😂 The good ol days at TN Appliance Exchange LLC — back when we had NO business bein' on camera and did it anyway. Been fixin' appliances (and embarrassin' ourselves) since 2012. Still here, still honest, still a little ridiculous. Middle TN & South Louisiana — you'll see us everywhere. 🐜\n📞 615-280-2949 · tnapplianceexchange.net\n\n#GoodOlDays #TNApplianceExchange #familyowned #appliancerepair",
  "Dug this outta the vault 🤦‍♂️ TN Appliance Exchange LLC in the good ol days — a couple of us, a busted appliance, and zero idea what we were doin' on camera. Fixed it right anyway. Family-owned since 2012, still cuttin' up, still everywhere across TN & LA.\n📞 615-280-2949\n\n#GoodOlDays #TNApplianceExchange #familyowned #supportlocal",
  "The good ol days 😅 Proof TN Appliance Exchange LLC has ALWAYS been a little ridiculous — and always fixed your stuff right. At it since 2012, same family, same shenanigans. We're everywhere, y'all. 🐜\n📞 615-280-2949 · tnapplianceexchange.net\n\n#GoodOlDays #TNApplianceExchange #familyowned #appliancerepair",
  "Man, we were somethin' back then 🤠 TN Appliance Exchange LLC — the good ol days, before we figured out the camera (jury's still out on that one). Honest appliance fixes since 2012, Middle TN to South Louisiana. Can't get away from us 😄\n📞 615-280-2949\n\n#GoodOlDays #TNApplianceExchange #familyowned #Nashville #Louisiana",
  "😂 Throwin' it back to the good ol days. TN Appliance Exchange LLC — we've never taken OURSELVES too serious, but we take your appliances dead serious. Family-owned since 2012, still everywhere, still clownin' around. 🐜\n📞 615-280-2949\n\n#GoodOlDays #TNApplianceExchange #familyowned #appliancerepair",
];
function suggestCaption(j){
  // LEAD with the strongest hook, and fold the grounded proof line in right under it
  // (the real-data trust signal is the moat) before the base caption.
  var lead=(j.on_screen_hook||(j.hooks&&j.hooks[0])||'').replace(/^["']|["']$/g,'');
  var parts=[]; if(lead) parts.push(lead); if(j.proof_line) parts.push(j.proof_line);
  var top=parts.join("\n\n");
  return (top?top+"\n\n":"")+baseCaption(j);
}
function baseCaption(j){
  // Spanish-dubbed clips get a Spanish caption
  if((j.source||'').indexOf('dub')===0){
    return "😅 Los viejos tiempos en TN Appliance Exchange LLC — reparando electrodomésticos con honestidad desde 2012. Familia, sin rodeos, y estamos en todas partes: Tennessee y Luisiana.\n📞 615-280-2949 · tnapplianceexchange.net\n\n#TNApplianceExchange #reparaciondeelectrodomesticos #electrodomesticos #familia";
  }
  // how-to / tip clips get a PRACTICAL, saveable caption (title leads)
  if(j.content_type==='quick_tip'){
    const t=(j.title||'Appliance tip').replace(/\s+/g,' ').trim();
    return "🔧 "+t+"\n\nReal techs, straight to the point. Save this one 📌 TN Appliance Exchange LLC — fixin' appliances the honest way since 2012, all over TN & LA.\n📞 615-280-2949 · tnapplianceexchange.net\n\n#howto #DIY #appliancerepair #dryerrepair #TNApplianceExchange #familyowned";
  }
  // archive (Vizard- or Facebook-sourced) clips get the good ol days voice, rotated by id so no two match
  if(j.source==='vizard'||j.source==='fb-archive'){ let h=0; const s=String(j.id); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return GOODOL[h%GOODOL.length]; }
  const t=j.title||'Broken appliance?';
  return t+"\n\nReal techs, honest fixes — TN Appliance Exchange LLC, Middle TN & South Louisiana. 24/7: text a quick video, get a real answer. 🐜\n📞 615-280-2949\n\n#TNApplianceExchange #familyowned #appliancerepair";
}
function proxSrc(j){ return F+'/video-proxy?secret='+encodeURIComponent(SECRET)+'&job='+encodeURIComponent(j.id); }
function player(j){
  // hosted clips play natively from S3; un-hosted (still re-hosting) use the proxy.
  const base = j.hosted ? esc(j.download_url) : proxSrc(j);
  // #t=0.5 makes the browser render the frame at 0.5s as a PREVIEW (faststart keeps it cheap)
  const src = base + (base.indexOf('#')>=0 ? '' : '#t=0.5');
  const note = j.hosted ? '' : '<div class="muted" style="font-size:12px;margin-top:4px">⏳ optimizing this clip for smooth playback — refresh in a moment</div>';
  // LAZY MOUNT: a phone can only load a few videos at once. We render a light
  // placeholder and only mount the real <video> when it scrolls into view (or is
  // tapped) — so the page never chokes and each in-view clip shows a real frame.
  return '<div class="vlazy" data-src="'+src+'" onclick="mountOne(this)" '
    +'style="position:relative;width:100%;min-height:230px;max-height:430px;aspect-ratio:9/16;margin-top:10px;'
    +'background:radial-gradient(circle at 50% 40%,#1b1b1b,#0a0a0a);border:1px solid #2a2a2a;border-radius:12px;'
    +'display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden">'
    +'<div style="text-align:center;padding:0 14px"><div style="font-size:42px;line-height:1;color:#e9c46a">▶</div><div class="muted" style="font-size:13px;margin-top:8px">Tap to play</div></div></div>'
    +note+'<div style="margin-top:4px"><a href="'+esc(j.download_url||'#')+'" target="_blank" class="muted" style="font-size:12px">▶ Open the clip ↗</a></div>'; }
function mountVideo(el){
  if(!el||el.dataset.mounted) return;
  el.dataset.mounted='1';
  const src=el.getAttribute('data-src');
  // muted preload lets iOS decode + SEEK to paint a real still frame without a tap;
  // it un-mutes the moment you actually hit play, so previewing still has sound.
  el.innerHTML='<video src="'+src+'" controls playsinline muted preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;border-radius:12px"></video>';
  const v=el.querySelector('video');
  if(v){
    v.addEventListener('loadedmetadata',function(){ try{ if(v.currentTime<0.1) v.currentTime=0.5; }catch(_){} }); // force the poster frame
    v.addEventListener('play',function(){ v.muted=false; }, {once:true});                                          // sound on when they play
  }
}
function mountOne(el){ mountVideo(el); const v=el&&el.querySelector('video'); if(v){ v.muted=false; try{ v.play(); }catch(_){} } }
async function delClip(id,btn){
  if(!confirm('Delete this clip from the Studio? It comes off the list for good.')) return;
  if(btn){ btn.disabled=true; btn.textContent='Deleting…'; }
  try{
    const r=await fetch(F+'/video-prune',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:SECRET,ids:[String(id)]})});
    const d=await r.json();
    if(d&&d.ok){ loadJobs(); }
    else { if(btn){btn.disabled=false;btn.textContent='🗑 Delete clip';} alert('Could not delete — '+((d&&d.error)||'try again')); }
  }catch(e){ if(btn){btn.disabled=false;btn.textContent='🗑 Delete clip';} alert('Network hiccup — try again.'); }
}
let _vio;
function observeLazy(){
  // Clips stay as clean gold "▶ Tap to play" cards and only load the real video when
  // TAPPED (mountOne). Auto-mounting many videos on a phone painted black boxes for
  // clips whose poster frame didn't decode — this keeps every card clean + readable
  // so you can tell them apart to pick or delete. (Teddy feedback 2026-07-26.)
}
function jobCard(j){
  const pill='<span class="pill p-'+esc(j.status)+'">'+esc(j.status)+'</span>';
  let body='';
  if(j.status==='ready'){
    const posted=j.posted&&Object.keys(j.posted).length?('<div class="res">'+Object.entries(j.posted).map(([k,v])=>k+': '+(v.ok?'✅':'✗ '+(v.reason||''))).join('  ·  ')+'</div>'):'';
    body=player(j)
      +'<label>Caption</label><textarea id="cap-'+j.id+'">'+esc(suggestCaption(j))+'</textarea>'
      +enrichBlock(j)
      +'<div class="row" style="margin:10px 0">'
      +['facebook','instagram','tiktok','youtube'].map(p=>'<label class="chk"><input type="checkbox" data-p="'+p+'" data-j="'+j.id+'" checked> '+({facebook:'Facebook',instagram:'IG Reel',tiktok:'TikTok draft',youtube:'YouTube'}[p])+'</label>').join('')
      +'</div>'
      +'<button class="btn" onclick="postAll(\''+j.id+'\',this)">🚀 Post everywhere</button>'
      +'<div class="muted" style="margin-top:6px">FB + IG go live · TikTok lands in your drafts · YouTube uploads private (flip to public).</div>'
      +'<div class="row" style="margin-top:10px">'
      +'<button class="btn ghost" style="padding:8px 12px" onclick="genHook(\''+j.id+'\',this)">🎣 Hook Doctor</button>'
      +'<button class="btn ghost" style="padding:8px 12px" onclick="dubEs(\''+j.id+'\',this)">🌎 Spanish version</button>'
      +'<button class="btn ghost" style="padding:8px 12px" onclick="genSeo(\''+j.id+'\',this)">📈 YouTube SEO</button>'
      +'</div><div id="hook-'+j.id+'" class="muted" style="margin-top:6px"></div><div id="seo-'+j.id+'" class="muted" style="margin-top:6px"></div>'+posted;
  } else if(j.status==='posted'){
    body=player(j)+'<div class="res">'+Object.entries(j.posted||{}).map(([k,v])=>k+': '+(v.ok?('✅ '+(v.url?'<a href="'+esc(v.url)+'" target="_blank">view</a>':'done')):'✗ '+(v.reason||''))).join('  ·  ')+'</div><button class="btn ghost" style="margin-top:8px" onclick="reopen(\''+j.id+'\')">Post again / to more</button>';
  } else if(j.status==='failed'){
    body='<div class="muted">Build failed — re-upload the clip.</div>';
  } else {
    body='<div class="muted">✨ Captioning & rendering… (auto-refreshes)</div>'+(j.raw_preview?'<video src="'+esc(j.raw_preview)+'" controls preload="metadata" style="max-height:220px"></video>':'');
  }
  const delBtn='<div style="margin-top:12px;text-align:right;border-top:1px solid var(--line);padding-top:10px"><button class="btn ghost" style="padding:6px 12px;font-size:13px;color:#f87171;border-color:#3a2626" onclick="delClip(\''+j.id+'\',this)">🗑 Delete clip</button></div>';
  return '<div class="card"><div class="row" style="justify-content:space-between"><div class="jt">'+esc(j.title||'Untitled')+'</div>'+pill+'</div>'+body+delBtn+'</div>';
}
window._jobs=[];
function enrichBlock(j){
  if(!j.enriched || !(j.hooks||j.seo)){
    return '<div class="muted" style="font-size:12px;margin:2px 0 8px">✨ not punched up yet — tap 🎣 Hook Doctor / 📈 YouTube SEO below, or "Punch up everything" up top.</div>';
  }
  var h='';
  if(j.proof_line){ h+='<div style="margin-top:2px;background:#1a1608;border:1px solid #3a2f0e;border-radius:8px;padding:6px 9px"><b style="color:#e9c46a">🐜 Proof line:</b> '+esc(j.proof_line)+(j.facts&&j.facts.has_stat?' <span style="color:#7fb">(from '+(j.facts.based_on_n||0)+' real repairs)</span>':'')+'</div>'; }
  var fmts=j.hook_formats&&j.hook_formats.length?j.hook_formats:null;
  if(fmts){
    if(j.on_screen_hook) h+='<div style="margin-top:6px"><b style="color:#e9c46a">✅ On-screen hook:</b> '+esc(j.on_screen_hook)+'</div>';
    h+='<div style="margin-top:4px"><b style="color:#e9c46a">🎣 Hook angles</b><br>'+fmts.map(function(x){return '<b style="color:#7fb">'+esc(x.format)+':</b> '+esc(x.text);}).join('<br>')+'</div>';
    if(j.hook_payoff) h+='<div style="margin-top:6px"><b style="color:#e9c46a">🎬 Payoff:</b> '+esc(j.hook_payoff)+'</div>';
    if(j.hook_middle) h+='<div style="margin-top:4px;color:#9aa"><b>👉 Point the camera at:</b> '+esc(j.hook_middle)+'</div>';
  } else if(j.hooks&&j.hooks.length){
    h+='<div style="margin-top:2px"><b style="color:#e9c46a">🎣 Hook options</b><br>'+j.hooks.map(function(x,i){return (i+1)+'. '+esc(x);}).join('<br>')+'</div>';
    if(j.hook_payoff) h+='<div style="margin-top:6px"><b style="color:#e9c46a">🎬 Payoff:</b> '+esc(j.hook_payoff)+'</div>';
    if(j.hook_middle) h+='<div style="margin-top:4px;color:#9aa"><b>👉 Point the camera at:</b> '+esc(j.hook_middle)+'</div>';
  }
  if(j.seo){
    var t=(j.seo.titles&&j.seo.titles[0])||''; var tags=(j.seo.tags||[]).slice(0,8).join(', ');
    h+='<div style="margin-top:8px"><b style="color:#8ecae6">📈 YouTube:</b> '+esc(t)+'</div>';
    if(tags) h+='<div style="margin-top:2px;color:#9aa;font-size:12px">tags: '+esc(tags)+'</div>';
    if(j.seo.description) h+='<div style="margin-top:4px"><button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="copyDesc(this)" data-d="'+esc(j.seo.description).replace(/"/g,"&quot;")+'">📋 Copy YouTube description</button></div>';
  }
  return '<details style="margin:4px 0 8px;background:#111;border:1px solid #262626;border-radius:10px;padding:8px 10px"><summary style="cursor:pointer;color:#e9c46a;font-weight:600">✅ Punched up — hooks + SEO ready</summary><div class="muted" style="white-space:normal;margin-top:8px;line-height:1.5">'+h+'</div></details>';
}
function copyDesc(btn){ try{ var d=btn.getAttribute('data-d'); navigator.clipboard.writeText(d.replace(/&quot;/g,'"')); btn.textContent='✓ Copied'; setTimeout(function(){btn.textContent='📋 Copy YouTube description';},1500);}catch(_){}}
function render(){ document.getElementById('jobs').innerHTML = window._jobs.length? window._jobs.map(jobCard).join('') : '<div class="muted">No clips yet — upload one above.</div>'; observeLazy(); }
function reopen(id){ const j=window._jobs.find(x=>String(x.id)===String(id)); if(j){ j.status='ready'; render(); } }

async function dubEs(id,btn){
  btn.disabled=true; btn.textContent='Dubbing…';
  const r=await jpost('video-dub-submit',{job_id:id,lang:'es'});
  btn.disabled=false; btn.textContent='🌎 Spanish version';
  alert(r&&r.ok ? '✅ Dubbing to Spanish — the Español version lands in the queue in a few minutes.' : '⚠️ '+(r&&(r.error||r.note)||'failed'));
}
async function genHook(id,btn){
  const j=(window._jobs||[]).find(x=>String(x.id)===String(id)); const el=document.getElementById('hook-'+id);
  const who=prompt('Any character/person in this clip? (Paw, Andre, a customer… leave blank if none)','')||'';
  el.textContent='Doctoring the hook…';
  const r=await jpost('hook-doctor',{title:(j&&j.title)||'',character:who,series:(j&&(j.series||j.content_type))||'',appliance:(j&&j.appliance)||'',brand:(j&&j.brand)||'',model:(j&&j.model)||'',symptom:(j&&j.symptom)||''});
  if(r&&r.ok){
    // persist onto the job so the caption + card pick it up
    if(j){ j.on_screen_hook=r.on_screen_hook||j.on_screen_hook; j.hooks=r.hooks||j.hooks; j.hook_formats=r.hook_formats||j.hook_formats; j.proof_line=r.proof_line||j.proof_line; j.hook_middle=r.middle; j.hook_payoff=r.payoff; j.facts=r.facts||j.facts; }
    var angles=(r.hook_formats&&r.hook_formats.length)?r.hook_formats.map(x=>'<b style="color:#7fb">'+esc(x.format)+':</b> '+esc(x.text)).join('<br>'):(r.hooks||[]).map((h,i)=>(i+1)+'. '+esc(h)).join('<br>');
    el.innerHTML='<div class="res" style="white-space:normal">'
      +(r.on_screen_hook?'<b>✅ On-screen:</b> '+esc(r.on_screen_hook)+'<br><br>':'')
      +(r.proof_line?'<b>🐜 Proof line:</b> '+esc(r.proof_line)+(r.facts&&r.facts.has_stat?' <span style="color:#7fb">(from '+(r.facts.based_on_n||0)+' real repairs)</span>':'')+'<br><br>':'')
      +'<b>🎣 Hook angles:</b><br>'+angles
      +'<br><br><b>👉 Point the camera at:</b><br>'+esc(r.middle||'')
      +'<br><br><b>🎬 Payoff (last second):</b><br>'+esc(r.payoff||'')
      +((r.notes&&r.notes.length)?('<br><br><b>Production:</b><br>'+r.notes.map(n=>'• '+esc(n)).join('<br>')):'')+'</div>';
  } else el.textContent='⚠️ Hook error: '+(r&&(r.error)||'failed');
}
async function genSeo(id,btn){
  const j=(window._jobs||[]).find(x=>String(x.id)===String(id)); const el=document.getElementById('seo-'+id);
  el.textContent='Writing SEO…';
  const r=await jpost('youtube-seo',{title:(j&&j.title)||'',is_long:false});
  if(r&&r.ok){
    el.innerHTML='<div class="res" style="white-space:normal"><b>📈 Title options:</b><br>'+r.titles.map(t=>'• '+esc(t)).join('<br>')
      +'<br><br><b>Description:</b><br>'+esc(r.description).replace(/\n/g,'<br>')
      +'<br><br><b>Tags:</b> '+esc((r.tags||[]).join(', '))+'</div>';
  } else el.textContent='⚠️ SEO error: '+(r&&(r.error)||'failed');
}
async function postAll(id,btn){
  btn.disabled=true; btn.textContent='Writing title + posting…';
  const cap=(document.getElementById('cap-'+id)||{}).value||'';
  const plats=[...document.querySelectorAll('input[data-j="'+id+'"]:checked')].map(c=>c.getAttribute('data-p'));
  // one-approve fan-out: honest title from the clip's real content, posts everywhere,
  // returns one-tap publish links + X/Truth paste copy
  const r=await jpost('post-everywhere',{ job_id:id, platforms:plats, caption:cap });
  btn.disabled=false; btn.textContent='🚀 Post everywhere';
  if(r&&r.ok&&r.bundle){
    const bd=r.bundle, y=bd.one_tap&&bd.one_tap.youtube, t=bd.one_tap&&bd.one_tap.tiktok;
    let h='<div class="res" style="white-space:normal;line-height:1.6">';
    h+='<b>🚀 '+esc(bd.honest_title||'')+'</b><br>';
    h+='✅ Live: '+[(bd.auto.facebook&&bd.auto.facebook.ok)?'Facebook':'', (bd.auto.instagram&&bd.auto.instagram.ok)?'Instagram':''].filter(Boolean).join(' + ')||'—';
    if(y&&y.publish_here) h+='<br>▶️ <a href="'+y.publish_here+'" target="_blank">YouTube — tap to publish</a> (set Visibility → Public)';
    if(t&&t.status==='in_drafts') h+='<br>🎵 TikTok — in your drafts, tap Post in the app';
    if(bd.paste){
      h+='<br><br><b>✍️ X / Twitter</b> <button class="btn" onclick="navigator.clipboard.writeText(this.nextSibling.textContent);this.textContent=\'Copied\'">Copy</button><span style="display:block;font-size:12px;color:#9aa">'+esc(bd.paste.x||'')+'</span>';
      h+='<br><b>✍️ Truth Social</b> <button class="btn" onclick="navigator.clipboard.writeText(this.nextSibling.textContent);this.textContent=\'Copied\'">Copy</button><span style="display:block;font-size:12px;color:#9aa">'+esc(bd.paste.truthsocial||'')+'</span>';
    }
    h+='</div>';
    const card=btn.closest('.card')||btn.parentElement; const box=document.createElement('div'); box.innerHTML=h; card.appendChild(box);
    loadJobs();
  } else { alert('Post error: '+(r&&r.error||'failed')); }
}

async function loadJobs(refresh){
  try{
    const d=await jget(F+'/video-jobs?secret='+encodeURIComponent(SECRET)+(refresh?'&refresh=1':''));
    window._jobs=d.jobs||[]; window._clipjobs=d.clip_jobs||[]; render(); renderClipJobs(window._clipjobs);
    const cs=document.getElementById('clipsetup'); if(cs) cs.innerHTML = d.clipper? '' : '⚠️ Auto-clipper not connected — add <b>VIZARDAI_API_KEY</b> in the vault to cut long videos.';
    // hands-off: if any ready clip isn't punched up yet, fire enrichment once per load
    if(!window._enrichFired && window._jobs.some(j=>j.status==='ready'&&!j.enriched)){ window._enrichFired=true; jpost('video-enrich',{}).catch(()=>{}); }
  }catch(e){ document.getElementById('jobs').innerHTML='<div class="muted">Enter the admin secret to load the queue.</div>'; }
}
document.getElementById('refresh').addEventListener('click',()=>loadJobs(true));
document.getElementById('punchup').addEventListener('click',async function(){
  this.disabled=true; const o=this.textContent; this.textContent='Punching up…';
  const r=await jpost('video-enrich',{});
  this.disabled=false; this.textContent=o;
  if(r&&r.ok){ alert('✨ Writing hooks + YouTube SEO for '+(r.punching_up||0)+' clips — they\'ll fill in over the next couple minutes. Keep refreshing.'); setTimeout(()=>loadJobs(true),10000); }
  else alert('⚠️ '+(r&&(r.error||r.note)||'failed'));
});
document.getElementById('loadfb').addEventListener('click',async function(){
  this.disabled=true; const o=this.textContent; this.textContent='Loading archive…';
  const r=await jpost('fb-archive-import',{});
  this.disabled=false; this.textContent=o;
  if(r&&r.ok){ alert('📼 Pulling '+(r.will_import||0)+' good ol days videos off the Facebook Page — they\'ll appear in the queue below in a minute (hosted & playable). '+(r.already_have?('(' +r.already_have+ ' already loaded)'):'')); setTimeout(()=>loadJobs(true),8000); }
  else alert('⚠️ '+(r&&(r.error||r.note)||'failed'));
});

(function init(){ if(!need()){ document.getElementById('jobs').innerHTML='<div class="muted">Admin secret required.</div>'; return; } checkSetup(); loadJobs(true);
  // auto-refresh while anything is still building
  setInterval(()=>{ const busy=window._jobs.some(j=>j.status!=='ready'&&j.status!=='posted'&&j.status!=='failed')||(window._clipjobs||[]).some(c=>c.status==='clipping'); if(busy) loadJobs(true); }, 20000);
})();
