<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money · Ant Office</title>
<style>
  :root{--blue:#1f6fed;--ink:#1d2530;--ink2:#5b6573;--dim:#8a93a1;--bg:#eef1f5;--card:#fff;--line:#e4e8ee;--ok:#1faa6b;--bad:#e24d4d;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px;}
  .top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:11px 14px;padding-top:max(11px,env(safe-area-inset-top));}
  .top-row{display:flex;align-items:center;gap:10px;}
  .top .t{font-size:17px;font-weight:800;flex:1;}
  .top .r{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;}
  .period{display:flex;align-items:center;gap:10px;margin-top:9px;}
  .period button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:17px;cursor:pointer;}
  .period .pinfo{flex:1;text-align:center;}
  .period .pinfo .rng{font-size:14px;font-weight:700;} .period .pinfo .pd{font-size:12px;color:var(--ink2);}
  .tabs{display:flex;gap:6px;margin-top:10px;}
  .tabs .tab{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;}
  .tabs .tab.on{background:#eef4fe;border-color:#bcd5fb;color:var(--blue);}
  .pl-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f3f7;font-size:15px;}
  .pl-row:last-child{border-bottom:0;} .pl-row .v{font-weight:800;font-family:ui-monospace,monospace;}
  .pl-row.neg .v{color:var(--bad);} .pl-row.net{font-size:18px;font-weight:900;border-top:2px solid var(--ink);margin-top:4px;}
  .pl-note{font-size:11px;color:var(--dim);padding:10px 2px 0;}
  .wrap{max-width:680px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
  .summary{background:linear-gradient(135deg,#1f6fed,#3b86ff);color:#fff;border-radius:14px;padding:16px;display:flex;justify-content:space-around;text-align:center;}
  .summary .b .v{font-size:22px;font-weight:900;} .summary .b .k{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:.04em;}
  .tech{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .tech-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .tech-h .nm{font-size:16px;font-weight:800;flex:1;} .tech-h .pay{font-size:18px;font-weight:900;color:var(--ok);}
  .jrow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #f3f5f8;color:var(--ink2);}
  .jrow:last-of-type{border-bottom:0;} .jrow .p{font-weight:700;color:var(--ink);}
  .bonus{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;}
  .bonus label{color:var(--ink2);} .bonus input{width:80px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:right;}
  .payout{display:flex;align-items:center;gap:10px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
  .payout .lbl{flex:1;font-weight:800;font-size:15px;} .payout .amt{font-weight:900;font-size:17px;}
  .payout button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:800;cursor:pointer;}
  .payout button:disabled{background:var(--ok);}
  .empty{padding:30px 14px;text-align:center;color:var(--dim);font-size:13px;}
  .loading{padding:50px;text-align:center;color:var(--ink2);}
  .spinner{width:30px;height:30px;border:3px solid #d7dde5;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .auth.hidden{display:none;}
  .auth-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;width:100%;max-width:340px;text-align:center;}
  .auth-card h2{font-size:18px;margin-bottom:5px;} .auth-card .sub{color:var(--ink2);font-size:13px;margin-bottom:16px;}
  .auth-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:16px;text-align:center;margin-bottom:11px;}
  .auth-card button{width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}
  .auth-card .err{color:var(--bad);font-size:13px;margin-top:9px;min-height:17px;}
  .exp-scrim{position:fixed;inset:0;background:rgba(18,26,38,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;}
  .exp-scrim.open{opacity:1;pointer-events:auto;}
  .exp-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:71;background:#fff;border-radius:16px;padding:20px;width:min(380px,92%);box-shadow:0 12px 40px rgba(20,30,50,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-height:90vh;overflow-y:auto;}
  .exp-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .exp-modal h3{font-size:16px;font-weight:800;margin-bottom:10px;}
  .exp-modal label{display:block;font-size:12px;color:var(--ink2);margin:9px 0 3px;font-weight:600;}
  .exp-modal select,.exp-modal input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;}
  .exp-modal .row2{display:flex;gap:8px;}
  .exp-modal .acts{display:flex;gap:8px;margin-top:15px;}
  .exp-modal .acts button{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;}
  .exp-modal .acts .save{background:var(--blue);color:#fff;border:0;}
  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#1d2530;color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:9998;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="auth" id="auth">
  <div class="auth-card">
    <h2>🐜 Money</h2>
    <div class="sub">enter office password</div>
    <input id="pw" type="password" autocomplete="current-password">
    <button onclick="submitAuth()">Open</button>
    <div class="err" id="auth-err"></div>
  </div>
</div>

<div class="top">
  <div class="top-row">
    <div class="t">💰 Payroll</div>
    <button class="r" onclick="load()" title="Refresh">↻</button>
  </div>
  <div class="period">
    <button onclick="shift(-1)">‹</button>
    <div class="pinfo"><div class="rng" id="p-range">—</div><div class="pd" id="p-pay">—</div></div>
    <button onclick="shift(1)">›</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="payroll" onclick="setTab('payroll')">Payroll</button>
    <button class="tab" data-tab="tax" onclick="setTab('tax')">Sales Tax</button>
    <button class="tab" data-tab="pl" onclick="setTab('pl')">P&amp;L</button>
    <button class="tab" data-tab="books" onclick="setTab('books')">Books</button>
  </div>
</div>

<div id="content"><div class="loading"><div class="spinner"></div>Loading…</div></div>
<div class="exp-scrim" id="exp-scrim" onclick="closeExpense()"></div>
<div class="exp-modal" id="exp-modal">
  <h3>Log expense</h3>
  <label>Category</label>
  <select id="exp-cat"><option value="gas">Gas</option><option value="truck">Truck fee</option><option value="other">Other fee</option></select>
  <label>Label (optional)</label>
  <input id="exp-label" placeholder="e.g. Truck #2 oil change">
  <div class="row2">
    <div style="flex:1"><label>Amount $</label><input id="exp-amount" inputmode="decimal" placeholder="0.00"></div>
    <div style="flex:1"><label>Date</label><input id="exp-date" type="date"></div>
  </div>
  <label>Applies to</label>
  <select id="exp-scope"><option value="monthly">Monthly / overhead</option><option value="tech">Per tech</option><option value="job">Per job</option></select>
  <label>Tech name or Job # (only if per-tech / per-job)</label>
  <input id="exp-ref" placeholder="optional">
  <div class="acts"><button onclick="closeExpense()">Cancel</button><button class="save" id="exp-save" onclick="saveExpense()">Save</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const OFFICE_AUTH_KEY='tn_office_auth_v1';
const TECH_NAME={1:'Teddy',2:'Jimmy',3:'Andre',4:'Lee',5:'Billy',6:'John'};
let cur=null; // {year,month,half}
let lastData=null,lastPr=null,activeTab='payroll';
const TECH_REGION={1:'TN',2:'TN',4:'TN',3:'LA',5:'LA',6:'LA'};

function authValid(){return localStorage.getItem(OFFICE_AUTH_KEY)==='1';}
function initAuth(){
  if(authValid()){document.getElementById('auth').classList.add('hidden');startPeriod();load();return;}
  document.getElementById('pw').focus();
}
async function submitAuth(){
  const v=(document.getElementById('pw').value||'').trim();const err=document.getElementById('auth-err');
  if(!v){err.textContent='Enter password';return;}
  try{
    const r=await fetch(XANO+'/verify_office_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v})});
    const d=await r.json();
    if(d&&d.success){localStorage.setItem(OFFICE_AUTH_KEY,'1');document.getElementById('auth').classList.add('hidden');startPeriod();load();}
    else{err.textContent='Wrong password.';}
  }catch(_){err.textContent='Connection error.';}
}
document.getElementById('pw').addEventListener('keypress',e=>{if(e.key==='Enter')submitAuth();});

// Semi-monthly periods: half 0 = 1st-15th (paid the 18th), half 1 = 16th-end (paid the 3rd next month)
function startPeriod(){const n=new Date();cur={year:n.getFullYear(),month:n.getMonth(),half:n.getDate()<=15?0:1};}
function shift(dir){
  if(dir>0){ if(cur.half===0){cur.half=1;} else {cur.half=0;cur.month++;if(cur.month>11){cur.month=0;cur.year++;}} }
  else { if(cur.half===1){cur.half=0;} else {cur.half=1;cur.month--;if(cur.month<0){cur.month=11;cur.year--;}} }
  load();
}
function periodRange(){
  const y=cur.year,m=cur.month,h=cur.half;
  const start=new Date(y,m,h===0?1:16,0,0,0,0);
  const end=h===0?new Date(y,m,15,23,59,59,999):new Date(y,m+1,0,23,59,59,999);
  const payday=h===0?new Date(y,m,18):new Date(y,m+1,3);
  const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return {start:start.getTime(),end:end.getTime(),label:f(start)+' – '+f(end),payday:'paid '+payday.toLocaleDateString('en-US',{month:'short',day:'numeric'})};
}

async function load(){
  const pr=periodRange();
  document.getElementById('p-range').textContent=pr.label;
  document.getElementById('p-pay').textContent=pr.payday;
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Loading…</div>';
  try{
    const r=await fetch('/.netlify/functions/payroll-rollup?start_ms='+pr.start+'&end_ms='+pr.end,{cache:'no-store'});
    const d=await r.json();
    if(!d.success)throw new Error(d.error||'failed');
    lastData=d;lastPr=pr;renderActive();
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty">Couldn’t load payroll — '+esc(e.message)+'</div>';
  }
}

function setTab(t){activeTab=t;document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));renderActive();}
function renderActive(){
  if(!lastData)return;
  if(activeTab==='books')return renderBooks(lastPr);
  if(activeTab==='tax')return renderTax(lastData,lastPr);
  if(activeTab==='pl')return renderPL(lastData,lastPr);
  return renderPayroll(lastData,lastPr);
}
function ymd(ms){const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
async function renderBooks(pr){
  const c=document.getElementById('content');
  c.innerHTML='<div class="loading"><div class="spinner"></div>Pulling your books from Digits…</div>';
  try{
    const r=await fetch('/.netlify/functions/digits-pnl?start='+ymd(pr.start)+'&end='+ymd(pr.end)+'&interval=Month',{cache:'no-store'});
    const d=await r.json();
    if(!d.configured){
      c.innerHTML='<div class="wrap"><div class="tech"><div style="font-weight:800;font-size:15px;margin-bottom:8px">📚 Connect Digits</div>'
        +'<div class="pl-note" style="padding:0 0 10px">Pull your real P&amp;L (income + card/bill expenses) straight from Digits:</div>'
        +'<ol style="font-size:13px;color:var(--ink2);line-height:1.7;padding-left:18px"><li>In Digits → Developer → Create App (redirect <code>…/digits-oauth-callback</code>, scopes ledger:read + source:sync)</li><li>Put <b>DIGITS_CLIENT_ID</b> + <b>DIGITS_CLIENT_SECRET</b> in Netlify env</li><li>Visit <a href="/.netlify/functions/digits-oauth-start">/digits-oauth-start</a> &amp; approve → paste the token into <b>DIGITS_REFRESH_TOKEN</b></li></ol>'
        +'<a href="/.netlify/functions/digits-oauth-start" style="display:inline-block;margin-top:8px;background:var(--blue);color:#fff;padding:10px 16px;border-radius:9px;text-decoration:none;font-weight:700">Connect Digits</a></div></div>';
      return;
    }
    if(!d.success){c.innerHTML='<div class="wrap"><div class="empty">Digits: '+esc(d.error||'error')+'</div></div>';return;}
    const rows=d.rows||[];
    if(!rows.length){c.innerHTML='<div class="wrap"><div class="empty">No P&amp;L rows for this period.</div></div>';return;}
    const html=rows.map(rw=>`<div class="pl-row ${rw.amount<0?'neg':''}"><span>${esc(rw.label)}</span><span class="v">$${(rw.amount||0).toFixed(2)}</span></div>`).join('');
    c.innerHTML='<div class="wrap"><div class="tech"><div class="pl-note" style="padding:0 0 8px">📚 Live from Digits — '+esc(pr.label)+'</div>'+html+'</div></div>';
  }catch(e){c.innerHTML='<div class="wrap"><div class="empty">Couldn’t reach Digits — '+esc(e.message)+'</div></div>';}
}

const SETASIDE_RATE=0.25; // income/business-tax set-aside estimate (% of take-home) — tune with CPA
async function renderTax(d,pr){
  const techs=d.techs||[];
  let tn=0,la=0,rev=0,pay=0;
  techs.forEach(t=>{ const reg=TECH_REGION[t.technician_id]||'TN'; if(reg==='LA')la+=t.tax; else tn+=t.tax; rev+=t.amount; pay+=(t.tech_pay-(t.addon_pay||0)-(t.tip_pay||0)); });
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Building tax view…</div>';
  // Add-on sales tax collected at checkout (tax-added), split by region.
  let addonTaxTn=0,addonTaxLa=0;
  try{
    const at=await fetch('/.netlify/functions/addon-tax-rollup?start_ms='+pr.start+'&end_ms='+pr.end,{cache:'no-store'}).then(r=>r.json());
    if(at&&at.ok){ addonTaxTn=at.tn||0; addonTaxLa=at.la||0; tn+=addonTaxTn; la+=addonTaxLa; }
  }catch(_){}
  const addonTax=addonTaxTn+addonTaxLa;
  const salesTax=tn+la;
  // pull parts cost + logged expenses to get a real take-home for the set-aside
  let partsCost=0,expTotal=0;
  try{
    const days=Math.max(1,Math.ceil((Date.now()-pr.start)/86400000)+1);
    const pr1=await fetch(XANO+'/get_parts_cost_analysis?days_back='+days,{cache:'no-store'}).then(r=>r.json());
    if(pr1&&pr1.success)(pr1.orders||[]).forEach(o=>{const t=Number(o.ordered_at||0);if(t>=pr.start&&t<=pr.end)partsCost+=((Number(o.cost_cents)||0)+(Number(o.shipping_cents)||0))/100;});
  }catch(_){}
  try{
    const er=await fetch('/.netlify/functions/expenses-rollup?start_ms='+pr.start+'&end_ms='+pr.end,{cache:'no-store'}).then(r=>r.json());
    if(er&&er.success)expTotal=er.total;
  }catch(_){}
  const net=rev-salesTax-pay-partsCost-expTotal;
  const incomeSetAside=Math.max(0,net*SETASIDE_RATE);
  const totalSetAside=salesTax+incomeSetAside;
  document.getElementById('content').innerHTML=`
    <div class="wrap">
      <div class="summary">
        <div class="b"><div class="v">$${salesTax.toFixed(0)}</div><div class="k">Sales tax owed</div></div>
        <div class="b"><div class="v">$${incomeSetAside.toFixed(0)}</div><div class="k">Income set-aside</div></div>
        <div class="b"><div class="v">$${totalSetAside.toFixed(0)}</div><div class="k">Set aside total</div></div>
      </div>
      <div class="tech">
        <div class="pl-note" style="padding:0 0 6px">Sales tax collected — owed to the state</div>
        <div class="pl-row"><span>Tennessee</span><span class="v">$${tn.toFixed(2)}</span></div>
        <div class="pl-row"><span>Louisiana</span><span class="v">$${la.toFixed(2)}</span></div>
        ${addonTax>0?`<div class="pl-row"><span>· incl. add-on tax collected</span><span class="v" style="color:var(--dim)">$${addonTax.toFixed(2)}</span></div>`:''}
        <div class="pl-row net"><span>Sales tax to remit</span><span class="v">$${salesTax.toFixed(2)}</span></div>
      </div>
      <div class="tech">
        <div class="pl-note" style="padding:0 0 6px">Set aside for income / business tax (est.)</div>
        <div class="pl-row"><span>Take-home this period</span><span class="v">$${net.toFixed(2)}</span></div>
        <div class="pl-row"><span>× ${(SETASIDE_RATE*100).toFixed(0)}% set-aside</span><span class="v">$${incomeSetAside.toFixed(2)}</span></div>
        <div class="pl-row net"><span>Total to set aside (tax + income)</span><span class="v">$${totalSetAside.toFixed(2)}</span></div>
        <div class="pl-note">Park this much so taxes never surprise the cash. Sales tax is owed to the state; the ${(SETASIDE_RATE*100).toFixed(0)}% income set-aside is an estimate — confirm your rate with the CPA. Replaces the Sales Tax Calculator sheet.</div>
      </div>
    </div>`;
}

async function renderPL(d,pr){
  const techs=d.techs||[];
  let rev=0,labor=0,partsBilled=0,tax=0,pay=0;
  techs.forEach(t=>{rev+=t.amount;labor+=t.labor;partsBilled+=t.parts;tax+=t.tax;pay+=(t.tech_pay-(t.addon_pay||0)-(t.tip_pay||0));}); // invoice tech pay only; add-on cut in margin line; tips are pass-through to tech
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Building P&amp;L…</div>';
  // Real parts COST + margin from the parts ledger (parts_orders) for this period.
  let partsCost=0,partsSold=0,costKnown=false;
  try{
    const days=Math.max(1,Math.ceil((Date.now()-pr.start)/86400000)+1);
    const r=await fetch(XANO+'/get_parts_cost_analysis?days_back='+days,{cache:'no-store'});
    const pd=await r.json();
    if(pd&&pd.success){
      costKnown=true;
      (pd.orders||[]).forEach(o=>{
        const t=Number(o.ordered_at||0);
        if(t>=pr.start&&t<=pr.end){
          partsCost+=((Number(o.cost_cents)||0)+(Number(o.shipping_cents)||0))/100;
          partsSold+=(Number(o.sold_to_customer_cents)||0)/100;
        }
      });
    }
  }catch(_){}
  const partsMargin=partsSold-partsCost;
  // Logged expenses (gas / truck / other) for the period.
  let exp={total:0,by_category:{gas:0,truck:0,other:0}};
  try{
    const er=await fetch('/.netlify/functions/expenses-rollup?start_ms='+pr.start+'&end_ms='+pr.end,{cache:'no-store'});
    const ed=await er.json(); if(ed&&ed.success) exp=ed;
  }catch(_){}
  // Add-on program margin for the period (revenue - tech cut - part cost).
  let addon={count:0,revenue:0,tech_cut:0,part_cost:0,margin:0};
  try{
    const ar=await fetch('/.netlify/functions/addons-rollup?start_ms='+pr.start+'&end_ms='+pr.end,{cache:'no-store'});
    const ad=await ar.json(); if(ad&&ad.success) addon=ad;
  }catch(_){}
  // Real cash collected via card (Stripe) this period — invoices + add-ons + tips.
  let collected={total:0,invoice:0,addon:0,tip:0,count:0};
  try{
    const cr=await fetch('/.netlify/functions/payments-rollup?start_ms='+pr.start+'&end_ms='+pr.end,{cache:'no-store'});
    const cd=await cr.json(); if(cd&&cd.ok) collected=cd;
  }catch(_){}
  const net=rev-tax-pay-partsCost-exp.total+addon.margin; // owner take-home (+ add-on margin)
  const collectedLine=collected.count>0
    ? `<div class="pl-row"><span>💳 Card payments collected (${collected.count} · inv $${collected.invoice.toFixed(0)} · add-ons $${collected.addon.toFixed(0)} · tips $${collected.tip.toFixed(0)})</span><span class="v" style="color:var(--ok)">$${collected.total.toFixed(2)}</span></div>`
    : `<div class="pl-row"><span>💳 Card payments collected</span><span class="v" style="color:var(--dim)">none yet</span></div>`;
  const addonLine=addon.count>0
    ? `<div class="pl-row"><span>+ Add-on sales (${addon.count} · margin after part + tech cut)</span><span class="v" style="color:var(--ok)">$${addon.margin.toFixed(2)}</span></div>`
    : `<div class="pl-row"><span>Add-on sales</span><span class="v" style="color:var(--dim)">none yet</span></div>`;
  const costLine=costKnown
    ? `<div class="pl-row neg"><span>− Parts cost (paid)</span><span class="v">$${partsCost.toFixed(2)}</span></div>`
    : `<div class="pl-row"><span>Parts cost</span><span class="v" style="color:var(--dim)">ledger empty</span></div>`;
  const marginLine=costKnown&&partsSold>0
    ? `<div class="pl-row"><span>Parts margin (sold − cost)</span><span class="v" style="color:var(--ok)">$${partsMargin.toFixed(2)}</span></div>`
    : '';
  const expBreak=exp.total>0
    ? `<div class="pl-row neg"><span>− Expenses (gas $${exp.by_category.gas.toFixed(0)} · truck $${exp.by_category.truck.toFixed(0)} · other $${exp.by_category.other.toFixed(0)})</span><span class="v">$${exp.total.toFixed(2)}</span></div>`
    : `<div class="pl-row"><span>Expenses (gas/truck/fees)</span><span class="v" style="color:var(--dim)">none logged</span></div>`;
  document.getElementById('content').innerHTML=`
    <div class="wrap">
      <div class="summary"><div class="b"><div class="v">$${rev.toFixed(0)}</div><div class="k">Revenue</div></div>
        <div class="b"><div class="v">$${partsCost.toFixed(0)}</div><div class="k">Parts cost</div></div>
        <div class="b"><div class="v">$${net.toFixed(0)}</div><div class="k">Take-home</div></div></div>
      <div class="tech">
        <div class="pl-row"><span>Revenue (invoiced)</span><span class="v">$${rev.toFixed(2)}</span></div>
        <div class="pl-row"><span>· of which labor</span><span class="v">$${labor.toFixed(2)}</span></div>
        <div class="pl-row"><span>· of which parts billed</span><span class="v">$${partsBilled.toFixed(2)}</span></div>
        ${costLine}
        ${marginLine}
        <div class="pl-row neg"><span>− Tech pay</span><span class="v">$${pay.toFixed(2)}</span></div>
        <div class="pl-row neg"><span>− Sales tax (owed to state)</span><span class="v">$${tax.toFixed(2)}</span></div>
        ${expBreak}
        ${addonLine}
        <div class="pl-row net"><span>Take-home (owner net)</span><span class="v">$${net.toFixed(2)}</span></div>
        <div style="height:8px"></div>
        ${collectedLine}
        <div class="pl-note" style="padding-top:2px">Take-home is accrual (work done). Card payments collected is real cash in via Stripe — they won't match until invoices are paid.</div>
        <div style="text-align:center;margin-top:12px"><button onclick="openExpense()" style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;color:var(--blue);cursor:pointer">+ Log expense</button></div>
        <div class="pl-note">Parts cost = real spend from the Parts ledger. Gas/truck/fees: log them with the button (or pull from Digits once production's live). Business taxes layer in next.</div>
      </div>
    </div>`;
}

// ── expense logger ──
function openExpense(){
  const d=new Date();
  document.getElementById('exp-date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  document.getElementById('exp-scrim').classList.add('open');
  document.getElementById('exp-modal').classList.add('open');
}
function closeExpense(){document.getElementById('exp-scrim').classList.remove('open');document.getElementById('exp-modal').classList.remove('open');}
async function saveExpense(){
  const category=document.getElementById('exp-cat').value;
  const label=document.getElementById('exp-label').value.trim();
  const amount=document.getElementById('exp-amount').value.trim();
  const scope=document.getElementById('exp-scope').value;
  const ref=document.getElementById('exp-ref').value.trim();
  const dv=document.getElementById('exp-date').value;
  if(!amount||isNaN(parseFloat(amount))){toast('Enter an amount');return;}
  const date_ms=dv?new Date(dv+'T12:00:00').getTime():Date.now();
  const btn=document.getElementById('exp-save');btn.disabled=true;btn.textContent='Saving…';
  try{
    const r=await fetch('/.netlify/functions/record-expense',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category,label,amount,scope,ref,date_ms})});
    const d=await r.json();
    if(d.success){toast('Logged $'+parseFloat(amount).toFixed(2)+' '+category);closeExpense();document.getElementById('exp-amount').value='';document.getElementById('exp-label').value='';document.getElementById('exp-ref').value='';renderActive();}
    else{toast('⚠ '+(d.error||'failed'));}
  }catch(_){toast('⚠ connection error');}
  finally{btn.disabled=false;btn.textContent='Save';}
}

async function renderPayroll(d,pr){
  const techs=d.techs||[];
  if(!techs.length){document.getElementById('content').innerHTML='<div class="wrap"><div class="empty">No billed jobs in this period yet. As the office logs invoices, each tech’s pay shows here.</div></div>';return;}
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Loading payroll…</div>';
  // Which jobs are warranty-PAID (Danielle marked, or the watcher) -> ready to release.
  const allIds=[]; techs.forEach(t=>t.jobs.forEach(j=>{ if(!j.addon && !j.tip) allIds.push(j.job_id); }));
  let paidMap={};
  try{
    const wr=await fetch(XANO+'/list_warranty_submissions_for_jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_ids_csv:allIds.join(',')})});
    const wd=await wr.json();
    (wd&&wd.submissions||[]).forEach(s=>{ if(String(s.status||'').toLowerCase()==='paid') paidMap[String(s.job_id)]=true; });
  }catch(_){}
  window.__paidMap=paidMap;
  let grandRemaining=0,grandTax=0,grandReady=0;
  const cards=techs.map(t=>{
    const remaining=(t.remaining!=null?t.remaining:t.tech_pay);
    grandRemaining+=remaining;grandTax+=t.tax;
    let readyCount=0,readyAmt=0;
    const rows=t.jobs.map(j=>{
      const pay=(j.pay||0); const isPaid=paidMap[String(j.job_id)]===true;
      if(isPaid&&!j.released){readyCount++;readyAmt+=pay;}
      const right=j.released
        ? '<span style="color:var(--ok);font-size:12px;font-weight:700">✓ paid</span>'
        : `<button onclick="releaseJob(${t.technician_id},'${esc(String(j.job_id))}',${pay},'${esc(pr.label)}')" style="background:${isPaid?'#e3f6ec':'#eef4fe'};border:1px solid ${isPaid?'#9fdcbb':'#bcd5fb'};color:${isPaid?'var(--ok)':'var(--blue)'};border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">Release${isPaid?' 💰':''}</button>`;
      const labelHtml=(j.addon||j.tip)?esc(String(j.label||(j.tip?'Tip':'Add-on'))):('Job #'+esc(String(j.job_id))+(isPaid?' <span title="warranty paid">💰</span>':'')+(j.labor?(' · labor $'+j.labor.toFixed(0)):''));
      return `<div class="jrow"><span>${labelHtml}</span><span style="display:flex;align-items:center;gap:9px"><span class="p">$${pay.toFixed(2)}</span>${right}</span></div>`;
    }).join('');
    grandReady+=readyAmt;
    const nm=TECH_NAME[t.technician_id]||('Tech '+t.technician_id);
    const paidNote=(t.released_total>0)?`<div style="font-size:11px;color:var(--ok);text-align:right;margin-top:4px">$${t.released_total.toFixed(2)} already paid this period</div>`:'';
    const readyBtn=readyCount>0?`<button onclick="releaseAllPaid(${t.technician_id},'${esc(pr.label)}')" style="background:var(--ok);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer">Release paid 💰 $${readyAmt.toFixed(0)}</button>`:'';
    return `<div class="tech" data-tid="${t.technician_id}" data-pay="${remaining}">
      <div class="tech-h"><div class="nm">${esc(nm)}</div><div class="pay" id="payout-${t.technician_id}">$${remaining.toFixed(2)}</div></div>
      ${rows}
      ${paidNote}
      <div class="bonus"><label>5★ bonus $ ${t.review_count?('<span style="color:var(--ok)">('+t.review_count+'×$10 auto)</span>'):''}</label><input type="number" min="0" step="10" value="${(t.review_bonus||0)}" id="bonus-${t.technician_id}" oninput="recalc(${t.technician_id})"><span style="color:var(--dim);font-size:11px">$10 each</span></div>
      <div class="payout"><div class="lbl">Pay remaining</div><div class="amt" id="amt-${t.technician_id}">$${(remaining+(t.review_bonus||0)).toFixed(2)}</div>
        ${readyBtn}
        <button id="paybtn-${t.technician_id}" onclick="markPaid(${t.technician_id},'${esc(pr.label)}')">Pay all</button></div>
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML=`
    <div class="wrap">
      <div class="summary">
        <div class="b"><div class="v">$${grandRemaining.toFixed(0)}</div><div class="k">Owed (unpaid)</div></div>
        <div class="b"><div class="v" style="color:${grandReady>0?'var(--ok)':'inherit'}">$${grandReady.toFixed(0)}</div><div class="k">Ready 💰</div></div>
        <div class="b"><div class="v">$${grandTax.toFixed(0)}</div><div class="k">Tax collected</div></div>
      </div>
      ${grandReady>0?`<div style="text-align:center;margin:0 0 14px"><button onclick="releaseAllPaidEveryone('${esc(pr.label)}')" style="background:var(--ok);color:#fff;border:0;border-radius:11px;padding:12px 20px;font-size:15px;font-weight:800;cursor:pointer">Release all warranty-paid 💰 $${grandReady.toFixed(0)}</button></div>`:''}
      ${cards}
    </div>`;
}

function recalc(tid){
  const card=document.querySelector('.tech[data-tid="'+tid+'"]');
  const base=parseFloat(card.dataset.pay)||0;
  const bonus=parseFloat(document.getElementById('bonus-'+tid).value)||0;
  document.getElementById('amt-'+tid).textContent='$'+(base+bonus).toFixed(2);
}
async function releaseJob(tid,jobId,amount,period){
  if(!confirm('Release $'+Number(amount).toFixed(2)+' to '+(TECH_NAME[tid]||'tech')+' for job #'+jobId+'?'))return;
  try{
    const r=await fetch('/.netlify/functions/record-payout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({technician_id:tid,amount:Number(amount),job_id:String(jobId),period,note:'job #'+jobId})});
    const d=await r.json();
    if(d.success){toast('Released $'+Number(amount).toFixed(2));load();}else{toast('⚠ '+(d.error||'failed'));}
  }catch(_){toast('⚠ connection error');}
}
async function releaseAllPaid(tid,period){
  const tech=(lastData&&lastData.techs||[]).find(t=>t.technician_id===tid);
  const pm=window.__paidMap||{};
  const jobs=(tech?tech.jobs:[]).filter(j=>!j.released && pm[String(j.job_id)]===true);
  const total=jobs.reduce((s,j)=>s+(j.pay||0),0);
  if(!jobs.length){toast('No warranty-paid jobs to release');return;}
  if(!confirm('Release $'+total.toFixed(2)+' to '+(TECH_NAME[tid]||('tech '+tid))+' for '+jobs.length+' warranty-paid job'+(jobs.length===1?'':'s')+'?'))return;
  try{
    for(const j of jobs){ await fetch('/.netlify/functions/record-payout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({technician_id:tid,amount:j.pay,job_id:j.job_id,period,note:'warranty-paid job #'+j.job_id})}); }
    toast('Released $'+total.toFixed(2)+' to '+(TECH_NAME[tid]||'tech'));load();
  }catch(_){toast('⚠ connection error');}
}
async function releaseAllPaidEveryone(period){
  const pm=window.__paidMap||{};
  const tasks=[];let total=0,techCount=0;
  for(const t of (lastData&&lastData.techs||[])){
    const jobs=(t.jobs||[]).filter(j=>!j.released && pm[String(j.job_id)]===true);
    if(!jobs.length)continue; techCount++;
    for(const j of jobs){ total+=(j.pay||0); tasks.push({tid:t.technician_id,job_id:j.job_id,pay:j.pay}); }
  }
  if(!tasks.length){toast('Nothing warranty-paid to release');return;}
  if(!confirm('Release $'+total.toFixed(2)+' across '+techCount+' tech'+(techCount===1?'':'s')+' for '+tasks.length+' warranty-paid job'+(tasks.length===1?'':'s')+'?'))return;
  try{
    for(const x of tasks){ await fetch('/.netlify/functions/record-payout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({technician_id:x.tid,amount:x.pay,job_id:x.job_id,period,note:'warranty-paid job #'+x.job_id})}); }
    toast('Released $'+total.toFixed(2)+' to '+techCount+' tech'+(techCount===1?'':'s'));load();
  }catch(_){toast('⚠ connection error');}
}
async function markPaid(tid,period){
  const bonus=parseFloat(document.getElementById('bonus-'+tid).value)||0;
  const tech=(lastData&&lastData.techs||[]).find(t=>t.technician_id===tid);
  const unrel=(tech?tech.jobs:[]).filter(j=>!j.released);
  const remaining=unrel.reduce((s,j)=>s+(j.pay||0),0);
  const total=remaining+bonus;
  if(total<=0){toast('Nothing left to pay');return;}
  if(!confirm('Pay '+(TECH_NAME[tid]||('tech '+tid))+' $'+total.toFixed(2)+'  ('+unrel.length+' job'+(unrel.length===1?'':'s')+(bonus>0?(' + $'+bonus.toFixed(2)+' bonus'):'')+')?'))return;
  const btn=document.getElementById('paybtn-'+tid);btn.disabled=true;btn.textContent='…';
  try{
    for(const j of unrel){ await fetch('/.netlify/functions/record-payout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({technician_id:tid,amount:j.pay,job_id:j.job_id,period,note:'job #'+j.job_id})}); }
    if(bonus>0){ await fetch('/.netlify/functions/record-payout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({technician_id:tid,amount:bonus,period,note:'5-star bonus'})}); }
    toast((TECH_NAME[tid]||'Tech')+' paid $'+total.toFixed(2));load();
  }catch(_){btn.disabled=false;btn.textContent='Pay all';toast('⚠ connection error');}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let tt=null;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
initAuth();
</script>
