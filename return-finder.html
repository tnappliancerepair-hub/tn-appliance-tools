<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta charset="utf-8">
<title>Return Label Finder</title>
<style>
  :root { --bg:#0c0f15; --card:#141922; --line:#232c3a; --ink:#eef2f8; --ink2:#9fb0c8; --grn:#2ecc71; --blu:#3a86ff; --amb:#e9a23b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system,system-ui,sans-serif; padding:14px; }
  h1 { font-size:19px; margin:2px 0 2px; }
  .sub { color:var(--ink2); font-size:13px; margin-bottom:14px; }
  .big { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:22px; border:0; border-radius:16px; background:var(--blu); color:#fff; font-size:20px; font-weight:800; cursor:pointer; }
  .big.grn { background:var(--grn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:14px; }
  .lbl { font-size:12px; color:var(--ink2); text-transform:uppercase; letter-spacing:.06em; }
  .val { font-size:17px; font-weight:700; margin:1px 0 8px; }
  .print { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:18px; border:0; border-radius:14px; background:var(--grn); color:#062; font-size:19px; font-weight:900; text-decoration:none; margin-top:8px; }
  .ghost { display:inline-block; padding:10px 14px; border:1px solid var(--line); border-radius:10px; color:var(--blu); text-decoration:none; font-weight:700; font-size:14px; background:transparent; margin-top:8px; }
  .warn { background:#2a2110; border:1px solid #4a3a12; color:var(--amb); border-radius:12px; padding:12px; margin-top:12px; font-size:14px; }
  .muted { color:var(--ink2); font-size:13px; }
  .part { font-size:26px; font-weight:900; letter-spacing:.01em; margin:2px 0 6px; word-break:break-all; }
  .dist { display:inline-block; background:#12233a; border:1px solid #244; color:#7fd7ff; border-radius:999px; padding:5px 12px; font-size:14px; font-weight:800; margin:2px 0 4px; }
  .who { color:var(--ink2); font-size:14px; margin:4px 0 10px; }
  .ribbon { background:var(--grn); color:#052; font-weight:900; border-radius:10px 10px 0 0; padding:9px 12px; font-size:15px; margin:-14px -14px 12px; }
  .shipbtn { width:100%; margin-top:10px; padding:13px; border:1px solid #2b3b4f; border-radius:11px; background:#0f1a12; color:#7ee6a6; font-weight:800; font-size:15px; cursor:pointer; }
  .shipbtn.done { background:#123; color:#7ee6a6; border-color:#1c5; opacity:.85; }
  #spin { display:none; text-align:center; padding:26px; color:var(--ink2); font-size:16px; }
  #cam { display:none; }
</style>
<body>
  <h1>📦 Return Label Finder <a href="#" onclick="resetPw();return false;" style="float:right;font-size:12px;color:var(--ink2);text-decoration:none;font-weight:400">🔑 password</a></h1>
  <div class="sub">Snap the box → get the prepaid label to print. No label on the box? Type the <b>claim #</b> or the <b>part #</b> below.</div>

  <button class="big" id="shoot">📷 Take a photo of the box</button>
  <input type="file" id="cam" accept="image/*" capture="environment">
  <div style="display:flex;gap:8px;margin-top:10px">
    <input id="typed" placeholder="…or type a claim # OR a part # (e.g. W10721967)" style="flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0f141c;color:var(--ink);font-size:16px">
    <button class="big" id="find" style="width:auto;padding:14px 18px;font-size:16px">Find</button>
  </div>
  <div id="spin">🔎 Looking…</div>
  <div id="out"></div>

<script>
var F='/.netlify/functions';
var SECRET = localStorage.getItem('tn_social_secret') || '';
function need(){ if(SECRET) return true; var s=prompt('Enter the password:'); if(!s) return false; SECRET=s.trim(); localStorage.setItem('tn_social_secret',SECRET); return true; }
function resetPw(){ localStorage.removeItem('tn_social_secret'); SECRET=''; if(need()) alert('Saved. Try again.'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var shoot=document.getElementById('shoot'), cam=document.getElementById('cam'), out=document.getElementById('out'), spin=document.getElementById('spin');

shoot.addEventListener('click', function(){ if(!need()) return; cam.value=''; cam.click(); });

async function lookup(payload,_retried){
  if(!SECRET && !need()){ shoot.style.display='flex'; return; }
  out.innerHTML=''; spin.style.display='block'; shoot.style.display='none';
  try {
    var r=await fetch(F+'/return-label-find',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({secret:SECRET},payload))});
    if(r.status===401){
      spin.style.display='none';
      localStorage.removeItem('tn_social_secret'); SECRET='';
      if(!_retried && need()) return lookup(payload,true);   // wrong password → re-enter → retry once
      out.innerHTML='<div class="warn">Password wasn’t right. Tap “🔑 password” up top and enter it again.</div>';
      shoot.style.display='flex'; return;
    }
    render(await r.json());
  } catch(e){ out.innerHTML='<div class="warn">Network hiccup — check signal and try again.</div><button class="big grn" style="margin-top:12px" onclick="reset()">↻ Try again</button>'; }
  spin.style.display='none';
}
document.getElementById('find').addEventListener('click', function(){
  if(!need()) return; var v=document.getElementById('typed').value.trim(); if(!v) return; lookup({query:v});
});
document.getElementById('typed').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('find').click(); });

// Deep-link from the Returns board: ?q=<claim> (and part) auto-runs the lookup.
(function(){
  var q=new URLSearchParams(location.search).get('q'); if(!q) return;
  var t=document.getElementById('typed'); if(t) t.value=q;
  if(need()) lookup({query:q});
})();

cam.addEventListener('change', async function(){
  var f=this.files && this.files[0]; if(!f) return;
  var b64; try { b64=await downscale(f, 2000, 0.78); } catch(e){ out.innerHTML='<div class="warn">Couldn’t read that photo — try again.</div>'; return; }
  lookup({image_b64:b64});
});

function render(d){
  var again='<button class="big grn" style="margin-top:16px" onclick="reset()">📷 Next box</button>';
  if(!d || !d.ok){ out.innerHTML='<div class="warn">'+esc((d&&d.error)||'Could not read that — try a clearer photo of the label.')+'</div>'+again; return; }
  var o=d.ocr||{};
  var head='<div class="card"><div class="lbl">What I read off the box</div>'
    +(o.part_number?'<div class="val">Part '+esc(o.part_number)+'</div>':'')
    +(o.claim_number?'<div class="muted">Claim '+esc(o.claim_number)+'</div>':'')
    +(o.customer_name?'<div class="muted">'+esc(o.customer_name)+'</div>':'')
    +(o.distributor?'<div class="muted">'+esc(o.distributor)+'</div>':'')
    +'</div>';

  // one card per label — part # is the big heading, distributor is the "return-to"
  // chip (each part goes back to a DIFFERENT place), so Alec can eyeball the box,
  // match it, print, and move on.
  function labelCard(l,isMatch,leadName){
    var ribbon = isMatch ? '<div class="ribbon">✅ Matches your box — print this one</div>' : '';
    var cls = isMatch ? 'card" style="border:2px solid var(--grn)' : 'card';
    // leadName: same part # across several customers — the NAME is the distinguishing
    // field, so lead with it and drop the part # to a sub-line.
    var partLine;
    if(leadName){
      partLine = '<div class="part">'+esc(l.customer_name||o.customer_name||'(no name on label)')+'</div>'
        +'<div class="muted">Part '+esc(l.part_number||'')+(l.claim?' · Claim '+esc(l.claim):'')+'</div>';
    } else {
      partLine = l.part_number ? '<div class="part">'+esc(l.part_number)+'</div>' : '<div class="part" style="color:var(--ink2)">Part not listed</div>';
    }
    var distChip = l.distributor ? '<div class="dist">↩ Return to '+esc(l.distributor)+'</div>' : '';
    var whoBits=[];
    if(!leadName && (l.customer_name||o.customer_name)) whoBits.push(esc(l.customer_name||o.customer_name));
    if(l.return_desc) whoBits.push(esc(l.return_desc));
    if(l.rma) whoBits.push('RMA '+esc(l.rma));
    // Prefer the real label PNG (prints clean). Fall back to SquareTrade's viewer,
    // then the email, only if we couldn't pull the image.
    var action;
    if(l.has_image){
      var printHref='/label-print.html?u='+encodeURIComponent(l.label_image_url);
      action = '<img src="'+esc(l.label_image_url)+'" alt="return label" style="width:100%;border-radius:8px;border:1px solid var(--line);margin:6px 0 8px;background:#fff">'
        +'<a class="print" href="'+esc(printHref)+'" target="_blank" rel="noopener">🖨 Print this label</a>'
        +'<div style="text-align:center"><a class="ghost" href="'+esc(l.label_url||l.gmail_link)+'" target="_blank" rel="noopener">trouble printing? open in SquareTrade</a></div>';
    } else if(l.has_label){
      action = '<a class="print" href="'+esc(l.label_url)+'" target="_blank" rel="noopener">📄 Print my return label</a>'
        +'<div style="text-align:center"><a class="ghost" href="'+esc(l.gmail_link)+'" target="_blank" rel="noopener">✉️ open the email</a></div>';
    } else {
      action = '<div class="warn" style="margin:0">Couldn’t grab the label — open the email:</div>'
        +'<div style="text-align:center"><a class="ghost" href="'+esc(l.gmail_link)+'" target="_blank" rel="noopener">✉️ open the email</a></div>';
    }
    var shipBtn = (l.claim||o.claim_number||l.part_number)
      ? '<button class="shipbtn" data-claim="'+esc(l.claim||o.claim_number||'')+'" data-part="'+esc(l.part_number||'')+'" data-rma="'+esc(l.rma||'')+'" data-tracking="'+esc(l.fedex_tracking||'')+'" data-dist="'+esc(l.distributor||'')+'" onclick="markShipped(this)">✓ Shipped it — count it down</button>'
      : '';
    return '<div class="'+cls+'">'+ribbon
      +partLine
      +distChip
      +(whoBits.length?'<div class="who">'+whoBits.join(' · ')+'</div>':'')
      +action+shipBtn+'</div>';
  }

  var body='';
  var labels=(d.labels||[]);
  var match=labels.filter(function(l){return l.part_match;});
  var others=labels.filter(function(l){return !l.part_match;});
  var withLink=labels.filter(function(l){return l.has_label;});
  var noLink=labels.filter(function(l){return !l.has_label;});

  if(d.matched_on==='part' && labels.length>1){
    // Same part number, several different customers returning it. The part is the same
    // on every card, so lead each with the CUSTOMER NAME. Tell Teddy whether they're
    // interchangeable (all one distributor → identical unused parts) or must be matched.
    var dset={}; labels.forEach(function(l){ if(l.distributor) dset[l.distributor.toUpperCase().trim()]=1; });
    var sameDist=Object.keys(dset).length<=1;
    var pnum=esc(d.box_part||o.part_number||'this part');
    body+='<div class="warn"><b>'+labels.length+' returns for part '+pnum+'</b> — different customers.'
      +(sameDist
        ? ' Same part, same distributor, so the parts are identical — print all '+labels.length+', put <b>one label on each box</b>, and ship. It doesn’t matter which of these boxes gets which label; just use each label once and ship the right count.'
        : ' ⚠️ These go to <b>different distributors</b> — match each box to the right label by the distributor + customer name shown on each.')
      +'</div>';
    body+=labels.map(function(l){return labelCard(l,false,true);}).join('');
  } else if(match.length){
    // We know exactly which label goes with this box.
    body+=match.map(function(l){return labelCard(l,true);}).join('');
    if(others.length){
      body+='<div class="lbl" style="margin:14px 2px 2px">Other parts on this claim ('+others.length+')</div>';
      body+=others.map(function(l){return labelCard(l,false);}).join('');
    }
  } else if(d.box_part && labels.length){
    // Read a part off the box but none of the claim's labels matched it.
    body+='<div class="warn">Read part <b>'+esc(d.box_part)+'</b> off the box but it didn’t match any label on this claim — pick the right one below (part # is on each), or retake the photo of the part sticker.</div>';
    body+=labels.map(function(l){return labelCard(l,false);}).join('');
  } else if(withLink.length){
    if(labels.length>1) body+='<div class="warn">'+labels.length+' parts on this claim — I couldn’t read the part # off the box to pick one. Match by the Part # shown on each card (it’s printed on your box too):</div>';
    body+=labels.map(function(l){return labelCard(l,false);}).join('');
  } else if(noLink.length){
    body+='<div class="warn">Found the RMA email'+(noLink[0].rma?' (RMA '+esc(noLink[0].rma)+')':'')+' but couldn’t grab the print link. Open it in Gmail:</div>'
      +noLink.map(function(l){return '<div style="text-align:center"><a class="ghost" href="'+esc(l.gmail_link)+'" target="_blank" rel="noopener">✉️ '+esc(l.subject||'open the email')+'</a></div>';}).join('');
  } else {
    var msg = d.note || 'No return label found for this box yet — it may not have been issued.';
    body+='<div class="warn">'+esc(msg)+'</div>'
      +'<div style="margin-top:10px" class="muted">👇 Type the <b>claim #</b> off the paperwork (add the part # if it’s a multi-part claim):</div>'
      +(d.gmail_search?'<div style="text-align:center;margin-top:8px"><a class="ghost" href="'+esc(d.gmail_search)+'" target="_blank" rel="noopener">🔎 search Gmail</a></div>':'');
    setTimeout(function(){ var t=document.getElementById('typed'); if(t){ t.focus(); t.scrollIntoView({block:'center'}); } },60);
  }
  out.innerHTML=head+body+again;
}
async function markShipped(btn){
  var d=btn.dataset;
  btn.disabled=true; var was=btn.textContent; btn.textContent='Saving…';
  try{
    var r=await fetch(F+'/mark-return-shipped',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:SECRET,claim:d.claim,part:d.part,rma:d.rma,tracking:d.tracking,distributor:d.dist,by:'return-finder'})});
    var j=await r.json();
    if(r.ok&&j&&j.ok){ btn.className='shipbtn done'; btn.textContent='✅ Shipped — counted down'; }
    else { btn.disabled=false; btn.textContent=was; }
  }catch(e){ btn.disabled=false; btn.textContent=was; }
}
function reset(){ out.innerHTML=''; shoot.style.display='flex'; }

// Downscale + JPEG so the upload is fast on a phone.
function downscale(file, maxW, q){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1, maxW/Math.max(img.width,img.height));
      var c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q||0.72));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}
</script>
</body>
