<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f8fb; color: #1a1f2c; min-height: 100vh; padding: 24px 18px; max-width: 920px; margin: 0 auto; }
  :root { --green: #00b377; --orange: #e08b00; --red: #d94545; --muted: #6b7280; --brand: #ff8a00; --panel: #ffffff; --border: #e2e6f0; }
  .header { text-align: center; padding: 20px 0 30px; }
  .header .ant { font-size: 42px; margin-bottom: 8px; }
  .header h1 { font-size: 28px; font-weight: 800; }
  .header p { color: var(--muted); margin-top: 8px; font-size: 14px; }
  .check-bar { display: flex; gap: 8px; max-width: 480px; margin: 0 auto 30px; }
  .check-bar input { flex: 1; padding: 14px 18px; border: 2px solid var(--border); border-radius: 10px; font-size: 16px; outline: none; }
  .check-bar input:focus { border-color: var(--brand); }
  .check-bar button { background: var(--brand); color: white; border: none; padding: 14px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .result { max-width: 480px; margin: 0 auto 30px; padding: 16px 20px; border-radius: 10px; font-weight: 600; }
  .result.yes { background: rgba(0,179,119,0.1); color: var(--green); border: 1px solid var(--green); }
  .result.no { background: rgba(217,69,69,0.1); color: var(--red); border: 1px solid var(--red); }
  .result.unsure { background: rgba(224,139,0,0.1); color: var(--orange); border: 1px solid var(--orange); }
  .markets { padding: 0 0 30px; }
  .market { margin-bottom: 30px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .market h2 { font-size: 18px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .market h2 .badge { font-size: 11px; background: var(--green); color: white; padding: 2px 8px; border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .zips { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; font-family: monospace; font-size: 13px; }
  .zip { background: rgba(0,179,119,0.06); border: 1px solid rgba(0,179,119,0.2); padding: 8px 10px; border-radius: 6px; text-align: center; color: var(--green); }
  .zip.not-accepting { background: rgba(224,139,0,0.06); border-color: rgba(224,139,0,0.2); color: var(--orange); }
  .footer { text-align: center; padding: 30px 0 12px; color: var(--muted); font-size: 12px; }
  .footer a { color: var(--brand); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <div class="ant">🐜</div>
  <h1>Service Area</h1>
  <p>TN Appliance Exchange covers Middle Tennessee + Southeast Louisiana.</p>
</div>

<div class="check-bar">
  <input id="zip" type="tel" inputmode="numeric" maxlength="5" placeholder="Your zip code">
  <button id="checkBtn">Check</button>
</div>
<div id="result"></div>

<div class="markets" id="markets">Loading…</div>

<div class="footer">
  Not in our area? <a href="tel:+18662680111">Call 866-268-0111</a> — we may know someone.<br>
  <span style="font-size:11px">🐜 ANT · TN Appliance Exchange LLC</span>
</div>

<script>
(function() {
  'use strict';
  const XANO = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
  const $ = (id) => document.getElementById(id);

  let zonesByMarket = {};

  async function loadZones() {
    try {
      const res = await fetch(`${XANO}/list_service_zones`);
      const data = await res.json();
      if (!data || !data.success) throw new Error('load failed');
      const grouped = {};
      for (const z of data.zones || []) {
        const k = z.market || 'Other';
        if (!grouped[k]) grouped[k] = [];
        grouped[k].push(z);
      }
      zonesByMarket = grouped;
      renderMarkets();
    } catch (err) {
      $('markets').innerHTML = `<div style="text-align:center;color:#d94545">${escapeHtml(err.message || 'load failed')}</div>`;
    }
  }

  function renderMarkets() {
    const markets = Object.keys(zonesByMarket).sort();
    $('markets').innerHTML = markets.map(m => {
      const zones = zonesByMarket[m].sort((a, b) => String(a.zip_code || '').localeCompare(String(b.zip_code || '')));
      const acc = zones.filter(z => z.accept_new_jobs).length;
      const total = zones.length;
      return `
        <div class="market">
          <h2>${escapeHtml(m)} <span class="badge">${acc}/${total} accepting</span></h2>
          <div class="zips">
            ${zones.map(z => {
              const cls = z.accept_new_jobs ? 'zip' : 'zip not-accepting';
              return `<div class="${cls}" title="${escapeAttr(z.zone || '')}">${escapeHtml(z.zip_code || '')}</div>`;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  $('checkBtn').addEventListener('click', checkZip);
  $('zip').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkZip(); });

  async function checkZip() {
    const z = $('zip').value.trim().replace(/\D/g, '').slice(0, 5);
    if (z.length !== 5) { $('result').className = 'result unsure'; $('result').textContent = 'Please enter a 5-digit zip.'; return; }
    $('result').className = 'result unsure';
    $('result').textContent = 'Checking…';
    try {
      const res = await fetch(`${XANO}/check_service_zone?zip_code=${z}`);
      const data = await res.json();
      if (!data) throw new Error('no response');
      if (data.covered === true && data.accepting_new_jobs === true) {
        $('result').className = 'result yes';
        $('result').textContent = `✓ We cover ${z} (${data.market || 'your area'}) and are accepting new jobs.`;
      } else if (data.covered === true && data.accepting_new_jobs === false) {
        $('result').className = 'result unsure';
        $('result').textContent = `Zip ${z} is in our service area (${data.market || ''}) but currently full. Call 866-268-0111 to check availability.`;
      } else {
        $('result').className = 'result no';
        $('result').textContent = `We don't currently service ${z}. Call 866-268-0111 — we may know someone in your area.`;
      }
    } catch (err) {
      $('result').className = 'result unsure';
      $('result').textContent = `Check failed (${err.message}). Try again or call 866-268-0111.`;
    }
  }

  function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s) { return escapeHtml(s); }

  loadZones();
})();
</script>
</body>
</html>
