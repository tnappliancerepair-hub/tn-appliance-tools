<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  :root {
    --bg: #0e1118;
    --panel: #131720;
    --panel-2: #1a1f2c;
    --border: #2a3040;
    --muted: #8a93aa;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* Auth gate */
  .auth-gate { position: fixed; inset: 0; background: rgba(14,17,24,0.97); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .auth-gate.show { display: flex; }
  .auth-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; max-width: 360px; width: 100%; text-align: center; }
  .auth-card .ant { font-size: 36px; }
  .auth-card .title { font-size: 18px; font-weight: 700; margin-top: 6px; }
  .auth-card .sub { font-size: 12px; color: var(--muted); margin: 6px 0 20px; font-family: var(--mono); }
  .auth-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; color: #fff; font-size: 16px; outline: none; font-family: var(--mono); text-align: center; letter-spacing: 2px; }
  .auth-input:focus { border-color: #f5a623; }
  .auth-submit { margin-top: 14px; width: 100%; background: #f5a623; color: #1a1100; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .auth-err { color: #ff6b6b; font-size: 12px; min-height: 16px; margin-top: 10px; font-family: var(--mono); }

  /* Topbar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(180deg, #0e1118 0%, #0e1118 88%, rgba(14,17,24,0));
    padding: 12px 14px 8px;
  }
  .row1 {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .row1 .title { font-size: 17px; font-weight: 800; flex: 1; }
  .row1 .title .ant { margin-right: 6px; }
  .nav-btn {
    background: var(--panel); border: 1px solid var(--border); color: #e8edf5;
    width: 36px; height: 36px; border-radius: 10px; font-size: 16px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .nav-btn:active { transform: scale(0.94); }
  .today-btn { background: #f5a623; border-color: #f5a623; color: #1a1100; font-weight: 700; padding: 0 12px; width: auto; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
  .week-range {
    font-family: var(--mono); font-size: 12px;
    color: var(--muted); padding: 0 6px;
    flex-grow: 1;
  }

  /* View toggle */
  .view-toggle {
    display: inline-flex; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 2px; gap: 2px;
  }
  .view-btn {
    background: transparent; border: none; color: var(--muted);
    padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
    border-radius: 6px; letter-spacing: 0.04em;
  }
  .view-btn.active { background: #f5a623; color: #1a1100; }

  /* Month header (separator between weeks in month view) */
  .month-week-sep {
    font-family: var(--mono); font-size: 10px;
    color: var(--muted); padding: 8px 4px 4px;
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* Tech filter row */
  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  }
  .filter-label { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-right: 4px; }
  .tech-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
    cursor: pointer; user-select: none;
    border: 1.5px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    opacity: 0.6;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .tech-chip .swatch {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--swatch);
  }
  .tech-chip.on {
    background: var(--swatch-bg);
    color: #fff;
    border-color: var(--swatch);
    opacity: 1;
  }
  .tech-chip.on .swatch { box-shadow: 0 0 0 2px rgba(255,255,255,0.2); }
  .quick-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 6px 10px; border-radius: 999px;
    font-size: 11px; cursor: pointer; font-family: var(--mono);
  }
  .quick-btn:active { transform: scale(0.95); }

  /* Body */
  .body { padding: 6px 14px 12px; }
  .day {
    margin-bottom: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .day.today { border-color: #f5a623; box-shadow: 0 0 0 1px #f5a623; }
  .day-header {
    padding: 10px 14px;
    background: var(--panel-2);
    display: flex; align-items: baseline; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .day-header .dow { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; font-family: var(--mono); }
  .day-header .date { font-size: 14px; font-weight: 700; flex: 1; }
  .day-header .count { font-size: 11px; color: var(--muted); font-family: var(--mono); }

  .jobs-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .job-card {
    display: block; text-decoration: none; color: #e8edf5;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--tech-color);
    border-radius: 8px;
    padding: 10px 12px;
    transition: transform 0.1s;
  }
  .job-card:active { transform: scale(0.985); background: var(--panel-2); }
  .job-line1 { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .job-time { font-weight: 700; font-size: 14px; font-family: var(--mono); }
  .job-tech {
    font-size: 10px; padding: 2px 8px; border-radius: 999px;
    background: var(--tech-bg); color: var(--tech-color);
    font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .job-status {
    font-size: 10px; padding: 2px 7px; border-radius: 999px;
    background: rgba(138,147,170,0.15); color: var(--muted);
    font-family: var(--mono);
  }
  .job-status.in_progress { background: rgba(74,158,255,0.18); color: #4a9eff; }
  .job-status.completed { background: rgba(0,214,143,0.15); color: #00d68f; }
  .job-customer { font-size: 14px; font-weight: 700; }
  .job-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .job-meta .dot { opacity: 0.5; margin: 0 5px; }

  .unassigned { color: #ff6b6b; }
  .empty-day { padding: 14px; text-align: center; color: var(--muted); font-size: 12px; font-style: italic; }
  .no-techs-banner {
    padding: 16px; text-align: center; color: var(--muted); font-size: 13px;
    background: var(--panel); border: 1px dashed var(--border); border-radius: 10px;
    margin: 14px;
  }

  /* Loading */
  .loading { padding: 60px 20px; text-align: center; color: var(--muted); }
  .loading .ant { font-size: 28px; }
  .loading .msg { font-size: 13px; margin-top: 8px; font-family: var(--mono); }

  /* Errors */
  .err-banner {
    margin: 14px; padding: 14px; background: rgba(255,107,107,0.1); border: 1px solid #ff6b6b;
    border-radius: 10px; color: #ff6b6b; font-size: 13px; text-align: center;
  }
  .err-banner button { display: block; margin: 10px auto 0; background: #ff6b6b; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
</style>

<body>

<!-- Auth gate -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="ant">🐜</div>

    <input type="password" class="auth-input" id="authInput" autocomplete="current-password" inputmode="text">
    <button class="auth-submit" id="authSubmit">Unlock</button>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- App -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="row1">
      <span class="title"><span class="ant">📅</span>Schedule</span>
      <button class="nav-btn" id="prevWeek" title="Previous">‹</button>

      <div class="view-toggle">

      <span class="week-range" id="weekRange">—</span>

      <span class="filter-label">Techs:</span>

  <div class="body">

  <div class="ant">🐜</div>

</div>

<script>
(function() {
  'use strict';

  const OFFICE_AUTH_KEY = 'tn_office_auth_v1';
  const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
  const HIDDEN_TECHS_KEY = 'office_schedule_hidden_techs_v1';
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Per-tech color palette — maximally distinct hues
  const TECH_COLORS = {
    1: { fg: '#4a9eff', bg: 'rgba(74,158,255,0.15)' },   // Teddy — blue
    2: { fg: '#ff7a1a', bg: 'rgba(255,122,26,0.15)' },   // Jimmy — orange
    3: { fg: '#e8252f', bg: 'rgba(232,37,47,0.15)' },    // Andre — red
    4: { fg: '#9b59b6', bg: 'rgba(155,89,182,0.18)' },   // Lee — purple
    5: { fg: '#f1c40f', bg: 'rgba(241,196,15,0.15)' },   // Billy — gold
    6: { fg: '#27ae60', bg: 'rgba(39,174,96,0.16)' },    // John — green
  };
  const FALLBACK_COLOR = { fg: '#8a93aa', bg: 'rgba(138,147,170,0.15)' };
  function techColor(tid) { return TECH_COLORS[tid] || FALLBACK_COLOR; }

  // URL params + view mode
  const params = new URLSearchParams(window.location.search);
  let currentWeekStart = params.get('week') || null;
  let serverTodayCT = null;
  let lastData = null;
  let currentView = params.get('view') === 'month' ? 'month' : (localStorage.getItem('office_schedule_view_v1') === 'month' ? 'month' : 'week');
  let hiddenTechIds = new Set();
  try {
    const raw = localStorage.getItem(HIDDEN_TECHS_KEY);
    if (raw) hiddenTechIds = new Set(JSON.parse(raw).map(Number));
  } catch {}

  function persistHidden() {
    try { localStorage.setItem(HIDDEN_TECHS_KEY, JSON.stringify(Array.from(hiddenTechIds))); } catch {}
  }

  // DOM
  const $ = (id) => document.getElementById(id);
  const authGate = $('authGate'), authInput = $('authInput'), authSubmit = $('authSubmit'), authErr = $('authErr');
  const app = $('app'), loading = $('loading'), content = $('content');
  const weekRange = $('weekRange'), prevWeek = $('prevWeek'), nextWeek = $('nextWeek'), todayBtn = $('todayBtn');
  const techFilters = $('techFilters');
  const viewWeekBtn = $('viewWeekBtn'), viewMonthBtn = $('viewMonthBtn');

  function syncViewButtons() {
    viewWeekBtn.classList.toggle('active',  currentView === 'week');
    viewMonthBtn.classList.toggle('active', currentView === 'month');
  }
  syncViewButtons();
  viewWeekBtn.addEventListener('click',  () => { if (currentView === 'week') return;  currentView = 'week';  localStorage.setItem('office_schedule_view_v1','week');  syncViewButtons(); loadRange(); });
  viewMonthBtn.addEventListener('click', () => { if (currentView === 'month') return; currentView = 'month'; localStorage.setItem('office_schedule_view_v1','month'); syncViewButtons(); loadRange(); });

  // Auth helper
  async function __verifyOfficePassword(pw) {
    if (!pw) return false;
    try {
      const r = await fetch(XANO_BASE + '/verify_office_password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const d = await r.json();
      return d && d.success === true;
    } catch { return false; }
  }

  function unlock() {
    authGate.classList.remove('show');
    app.style.display = 'block';
    loadRange();
  }
  function tryUnlock() {
    if (localStorage.getItem(OFFICE_AUTH_KEY) === 'ok') unlock();
    else { authGate.classList.add('show'); authInput.focus(); }
  }
  async function submitAuth() {
    const v = authInput.value;
    authSubmit.disabled = true;
    authSubmit.textContent = 'Authenticating…';
    try {
      if (await __verifyOfficePassword(v)) {
        localStorage.setItem(OFFICE_AUTH_KEY, 'ok');
        authErr.textContent = ''; unlock();
      } else {
        authErr.textContent = 'wrong password.'; authInput.value = ''; authInput.focus();
      }
    } finally {
      authSubmit.disabled = false;
      authSubmit.textContent = 'Unlock';
    }
  }
  authSubmit.addEventListener('click', submitAuth);
  authInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); });

  // Week nav
  function offsetWeek(currentYMD, days) {
    const [Y,M,D] = currentYMD.split('-').map(Number);
    const dt = new Date(Date.UTC(Y, M-1, D));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.getUTCFullYear() + '-' + String(dt.getUTCMonth()+1).padStart(2,'0') + '-' + String(dt.getUTCDate()).padStart(2,'0');
  }
  prevWeek.addEventListener('click', () => { if (!lastData) return; currentWeekStart = offsetWeek(lastData.week_start_ct, currentView === 'month' ? -28 : -7); loadRange(); });
  nextWeek.addEventListener('click', () => { if (!lastData) return; currentWeekStart = offsetWeek(lastData.week_start_ct, currentView === 'month' ?  28 :  7); loadRange(); });
  todayBtn.addEventListener('click',  () => { currentWeekStart = null; loadRange(); });

  async function fetchWeek(weekStart) {
    let url = XANO_BASE + '/get_office_calendar_week';
    if (weekStart) url += '?week_start=' + encodeURIComponent(weekStart);
    const r = await fetch(url);
    const d = await r.json();
    if (!d || d.success !== true) throw new Error(d && d.error ? d.error : 'failed to load');
    return d;
  }

  async function loadRange() {
    loading.style.display = 'block';
    content.innerHTML = '';
    try {
      const first = await fetchWeek(currentWeekStart);
      serverTodayCT = first.today_ct;
      currentWeekStart = first.week_start_ct;
      if (currentView === 'week') {
        lastData = first;
        render(first);
      } else {
        // Month view: fetch 4 weeks total (anchor + 3 forward). Parallel.
        const starts = [];
        for (let i = 1; i <= 3; i++) starts.push(offsetWeek(first.week_start_ct, i * 7));
        const rest = await Promise.all(starts.map(fetchWeek));
        const combined = {
          success: true,
          today_ct: first.today_ct,
          week_start_ct: first.week_start_ct,
          week_end_ct: rest[2].week_end_ct,
          technicians: first.technicians,
          jobs: [].concat(first.jobs || [], ...rest.map(r => r.jobs || [])),
        };
        lastData = combined;
        render(combined);
      }
    } catch (e) {
      console.error(e); showError('network error: ' + e.message);
    } finally {
      loading.style.display = 'none';
    }
  }

  function showError(msg) {
    content.innerHTML = '<div class="err-banner">' + escapeHtml(msg) + '<br><button onclick="location.reload()">retry</button></div>';
  }

  function escapeHtml(s) {
    return String(s||'').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function fmtRange(startYMD, endYMD) {
    const [Y1,M1,D1] = startYMD.split('-').map(Number);
    const [Y2,M2,D2] = endYMD.split('-').map(Number);
    const s = MONTHS[M1-1] + ' ' + D1;
    const e = (M1 === M2) ? D2 : MONTHS[M2-1] + ' ' + D2;
    const yr = Y1 === Y2 ? Y1 : Y1 + '–' + Y2;
    return s + ' – ' + e + ', ' + yr;
  }

  function fmtTime(ms) {
    if (!ms) return '';
    // ms is Xano timestamp (already UTC). Show CT (UTC-5)
    const d = new Date(ms);
    // Format in America/Chicago via toLocaleString
    try {
      return d.toLocaleString('en-US', { timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit' });
    } catch {
      const h = d.getUTCHours() - 5;
      const hh = ((h % 12) || 12);
      const mm = String(d.getUTCMinutes()).padStart(2,'0');
      return hh + ':' + mm + (h >= 12 ? ' PM' : ' AM');
    }
  }

  function dayKey(ms) {
    const d = new Date(ms);
    try {
      // Build YYYY-MM-DD in America/Chicago
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(d);
      const y = parts.find(p => p.type === 'year').value;
      const m = parts.find(p => p.type === 'month').value;
      const dd = parts.find(p => p.type === 'day').value;
      return y + '-' + m + '-' + dd;
    } catch {
      const h = d.getUTCHours() - 5;
      const adj = new Date(d.getTime() - 5*3600*1000);
      return adj.toISOString().slice(0,10);
    }
  }

  function render(d) {
    if (currentView === 'month') {
      const [Y1,M1] = d.week_start_ct.split('-').map(Number);
      weekRange.textContent = MONTHS[M1-1] + ' ' + d.week_start_ct.slice(8,10) + ' – ' + fmtRange(d.week_start_ct, d.week_end_ct).split(' – ')[1];
    } else {
      weekRange.textContent = fmtRange(d.week_start_ct, d.week_end_ct);
    }
    renderTechFilters(d.technicians);
    renderDays(d);
  }

  function renderTechFilters(techs) {
    techFilters.innerHTML = '<span class="filter-label">Techs:</span>';
    techs.forEach(t => {
      const c = techColor(t.id);
      const chip = document.createElement('button');
      chip.className = 'tech-chip';
      chip.dataset.techId = t.id;
      chip.style.setProperty('--swatch', c.fg);
      chip.style.setProperty('--swatch-bg', c.bg);
      if (!hiddenTechIds.has(t.id)) chip.classList.add('on');
      chip.innerHTML = '<span class="swatch"></span><span>' + escapeHtml(t.first_name) + '</span>';
      chip.addEventListener('click', () => {
        if (hiddenTechIds.has(t.id)) hiddenTechIds.delete(t.id);
        else hiddenTechIds.add(t.id);
        persistHidden();
        chip.classList.toggle('on');
        renderDays(lastData);
      });
      techFilters.appendChild(chip);
    });
    // also chip for unassigned (technician_id = 0/null)
    const u = document.createElement('button');
    u.className = 'tech-chip';
    u.dataset.techId = '0';
    const uc = { fg: '#ff6b6b', bg: 'rgba(255,107,107,0.15)' };
    u.style.setProperty('--swatch', uc.fg);
    u.style.setProperty('--swatch-bg', uc.bg);
    if (!hiddenTechIds.has(0)) u.classList.add('on');
    u.innerHTML = '<span class="swatch"></span><span>Unassigned</span>';
    u.addEventListener('click', () => {
      if (hiddenTechIds.has(0)) hiddenTechIds.delete(0);
      else hiddenTechIds.add(0);
      persistHidden();
      u.classList.toggle('on');
      renderDays(lastData);
    });
    techFilters.appendChild(u);

    // quick All / None
    const allBtn = document.createElement('button');
    allBtn.className = 'quick-btn';
    allBtn.textContent = 'all';
    allBtn.addEventListener('click', () => { hiddenTechIds.clear(); persistHidden(); renderTechFilters(techs); renderDays(lastData); });
    techFilters.appendChild(allBtn);

    const noneBtn = document.createElement('button');
    noneBtn.className = 'quick-btn';
    noneBtn.textContent = 'none';
    noneBtn.addEventListener('click', () => {
      hiddenTechIds = new Set(techs.map(t => t.id));
      hiddenTechIds.add(0);
      persistHidden();
      renderTechFilters(techs);
      renderDays(lastData);
    });
    techFilters.appendChild(noneBtn);
  }

  function renderDays(data) {
    if (!data) return;
    // Group jobs by day_key
    const byDay = {};
    (data.jobs || []).forEach(j => {
      if (!j.scheduled_start) return;
      const tid = j.technician_id || 0;
      if (hiddenTechIds.has(tid)) return;
      const k = dayKey(j.scheduled_start);
      if (!byDay[k]) byDay[k] = [];
      byDay[k].push(j);
    });

    // Build window from week_start_ct (7 days in week mode, 28 in month mode)
    const days = [];
    const [Y,M,D] = data.week_start_ct.split('-').map(Number);
    const len = currentView === 'month' ? 28 : 7;
    for (let i = 0; i < len; i++) {
      const dt = new Date(Date.UTC(Y, M-1, D + i));
      const y = dt.getUTCFullYear();
      const m = String(dt.getUTCMonth()+1).padStart(2,'0');
      const d = String(dt.getUTCDate()).padStart(2,'0');
      const key = y + '-' + m + '-' + d;
      days.push({ key, dt, weekIdx: Math.floor(i/7) });
    }

    let lastWeekIdx = -1;
    const html = days.map(({ key, dt, weekIdx }) => {
      let sep = '';
      if (currentView === 'month' && weekIdx !== lastWeekIdx) {
        lastWeekIdx = weekIdx;
        sep = '<div class="month-week-sep">— week of ' + MONTHS[dt.getUTCMonth()] + ' ' + dt.getUTCDate() + ' —</div>';
      }
      const dow = DOW[dt.getUTCDay()];
      const dateStr = MONTHS[dt.getUTCMonth()] + ' ' + dt.getUTCDate();
      const isToday = (key === serverTodayCT);
      const list = (byDay[key] || []).sort((a,b) => (a.scheduled_start||0) - (b.scheduled_start||0));
      const count = list.length;
      const headTxt = isToday ? 'TODAY' : dow.toUpperCase();
      const body = count === 0
        ? '<div class="empty-day">no jobs scheduled</div>'
        : '<div class="jobs-list">' + list.map(renderJob).join('') + '</div>';
      return sep + '<div class="day' + (isToday ? ' today' : '') + '">'
           +   '<div class="day-header">'
           +     '<span class="dow">' + headTxt + '</span>'
           +     '<span class="date">' + dateStr + '</span>'
           +     '<span class="count">' + count + ' job' + (count === 1 ? '' : 's') + '</span>'
           +   '</div>'
           +   body
           + '</div>';
    }).join('');

    content.innerHTML = html;
  }

  function renderJob(j) {
    const tid = j.technician_id || 0;
    const c = techColor(tid);
    const tname = techNameById(tid);
    const time = fmtTime(j.scheduled_start);
    const cust = (j.customer_first_name || '') + ' ' + (j.customer_last_name || '');
    const custClean = cust.trim() || '(no name)';
    const appliance = [j.brand, j.appliance_type].filter(Boolean).join(' ').trim();
    const status = (j.scheduling_status || '').toLowerCase();
    const statusBadge = status && status !== 'scheduled'
      ? '<span class="job-status ' + escapeHtml(status) + '">' + escapeHtml(status.replace(/_/g,' ')) + '</span>'
      : '';
    const techBadge = tid === 0
      ? '<span class="job-tech unassigned">unassigned</span>'
      : '<span class="job-tech">' + escapeHtml(tname) + '</span>';
    const meta = [appliance, j.service_city, j.problem_summary && j.problem_summary.slice(0,60)].filter(Boolean).join(' · ');
    return '<a class="job-card" href="/job-detail.html?job_id=' + j.id + '"'
         +   ' style="--tech-color:' + c.fg + ';--tech-bg:' + c.bg + ';">'
         +   '<div class="job-line1">'
         +     '<span class="job-time">' + escapeHtml(time) + '</span>'
         +     techBadge
         +     statusBadge
         +   '</div>'
         +   '<div class="job-customer">' + escapeHtml(custClean) + '</div>'
         +   '<div class="job-meta">' + escapeHtml(meta || '—') + '</div>'
         + '</a>';
  }

  function techNameById(tid) {
    if (!lastData) return '';
    const t = (lastData.technicians || []).find(x => x.id === tid);
    return t ? t.first_name : '';
  }

  tryUnlock();
})();
</script>
<script src="/office-home-button.js?v=1"></script>
