<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pay your invoice — TN Appliance Exchange</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --ink:#182028; --ink2:#5c6672; --line:#e6e9ee;
    --green:#137a43; --green2:#0e6338; --gold:#b6862c; --shadow:0 2px 4px #0b141d0d,0 12px 34px #0b141d12; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,'Segoe UI',system-ui,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;padding:22px 16px 48px}
  .brand{display:flex;align-items:center;gap:9px;justify-content:center;margin:6px 0 18px}
  .brand .ant{font-size:26px}
  .brand b{font-size:16px;letter-spacing:.02em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 20px;text-align:center}
  .hi{color:var(--ink2);font-size:14px;margin:0 0 2px}
  .lead{font-size:15px;margin:0 0 18px}
  .due-label{font-size:12px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink2);font-weight:700}
  .due{font-size:46px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
  .items{text-align:left;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
  .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--ink2)}
  .row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .row.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:16px}
  .row.tot span,.row.tot b{color:var(--ink);font-weight:800}
  .pay{display:block;width:100%;margin-top:20px;padding:16px;border:0;border-radius:13px;
    background:linear-gradient(var(--green),var(--green2));color:#fff;font-size:18px;font-weight:800;
    cursor:pointer;box-shadow:0 6px 18px #137a4340}
  .pay:active{transform:translateY(1px)}
  .pay[disabled]{opacity:.6;cursor:default}
  .sub{font-size:12px;color:var(--ink2);margin-top:12px;line-height:1.45}
  .lock{display:inline-block;vertical-align:-1px;margin-right:3px}
  .state{padding:30px 8px}
  .big-ok{font-size:44px}
  .msg{font-size:17px;font-weight:700;margin:10px 0 4px}
  .muted{color:var(--ink2);font-size:14px}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:s 1s linear infinite;margin:8px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .foot{text-align:center;color:var(--ink2);font-size:12px;margin-top:22px;line-height:1.6}
  .foot a{color:var(--green);text-decoration:none}
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e1216; --card:#161c22; --ink:#e9edf1; --ink2:#95a1ad; --line:#252d35; --shadow:0 2px 4px #0007,0 12px 34px #0006; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="ant">🐜</span><b>TN Appliance Exchange</b></div>
  <div class="card" id="card">
    <div class="state"><div class="spin"></div><div class="muted">Loading your invoice…</div></div>
  </div>
  <div class="foot">
    Secure payment by Stripe · card &amp; Apple Pay<br>
    Questions? Text us at <a href="sms:+16155889500">615-588-9500</a>
  </div>
</div>
<script>
(function(){
  var FN='/.netlify/functions';
  var qs=new URLSearchParams(location.search);
  var JOB=(qs.get('job')||'').replace(/\D/g,''); var T=qs.get('t')||'';
  var card=document.getElementById('card');
  function fmt(c){ return '$'+(c/100).toFixed(2); }
  function esc(s){ return String(s==null?'':s).replace(/[<&>"]/g,function(x){return{'<':'&lt;','&':'&amp;','>':'&gt;','"':'&quot;'}[x];}); }

  function stateOK(msg,sub){ card.innerHTML='<div class="state"><div class="big-ok">✅</div><div class="msg">'+msg+'</div>'+(sub?'<div class="muted">'+sub+'</div>':'')+'</div>'; }
  function stateErr(msg){ card.innerHTML='<div class="state"><div class="big-ok">🔗</div><div class="msg">'+msg+'</div><div class="muted">If you think this is a mistake, text us at 615-588-9500 and we\'ll send a fresh link.</div></div>'; }

  function render(d){
    if(d.paid){ stateOK('Paid in full','Thank you — nothing else is due on this job.'); return; }
    if(d.nothing_due){ stateOK('No balance due','There\'s nothing to pay on this job right now.'); return; }
    var rows=(d.items||[]).map(function(it){ return '<div class="row"><span>'+esc(it.label)+'</span><b>'+fmt(it.cents)+'</b></div>'; }).join('');
    card.innerHTML=''
      +'<p class="hi">Hi '+esc(d.first)+'</p>'
      +'<p class="lead">Here\'s the balance for your'+(d.appliance?' '+esc(d.appliance):'')+' repair.</p>'
      +'<div class="due-label">Amount due</div>'
      +'<div class="due">'+fmt(d.owed_cents)+'</div>'
      +'<div class="items">'+rows+'<div class="row tot"><span>Total</span><b>'+fmt(d.owed_cents)+'</b></div></div>'
      +'<button class="pay" id="payBtn"><span class="lock">🔒</span>Pay '+fmt(d.owed_cents)+'</button>'
      +'<div class="sub">You\'ll go to a secure Stripe checkout. This link doesn\'t expire — come back and pay anytime.</div>';
    document.getElementById('payBtn').addEventListener('click',function(){ pay(d); });
  }

  function pay(d){
    var btn=document.getElementById('payBtn'); btn.disabled=true; btn.innerHTML='Opening secure checkout…';
    var body={ job_id:Number(JOB), kind:d.pay_kind, metadata:{ source:'pay_link' } };
    if(d.pay_kind==='addon') body.amount_cents=d.addon_base_cents;
    fetch(FN+'/create-stripe-payment-link',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
      .then(function(r){return r.json();})
      .then(function(j){
        if(j&&j.ok&&j.url){ location.href=j.url; }
        else { btn.disabled=false; btn.innerHTML='Try again'; alert((j&&j.error==='covered_by_warranty')?'Good news — this repair is covered by your warranty, no payment needed.':'Sorry, we couldn\'t start checkout. Please text us at 615-588-9500.'); }
      })
      .catch(function(){ btn.disabled=false; btn.innerHTML='Try again'; alert('Network hiccup — please try again.'); });
  }

  if(!JOB||!T){ stateErr('This payment link is incomplete'); return; }
  fetch(FN+'/pay-owed?job='+encodeURIComponent(JOB)+'&t='+encodeURIComponent(T))
    .then(function(r){return r.json();})
    .then(function(d){ if(d&&d.ok){ render(d); } else { stateErr(d&&d.error==='bad_link'?'This payment link isn\'t valid':'We couldn\'t load your invoice'); } })
    .catch(function(){ stateErr('We couldn\'t load your invoice'); });
})();
</script>
</body>
</html>
