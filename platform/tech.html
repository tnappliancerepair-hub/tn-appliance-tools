<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My Jobs — Ant</title>
<!--
  Ant platform — TECH APP (multi-tenant reference surface).
  A tech signs in; RLS scopes to their shop, and the app filters to the jobs
  assigned to THEM (via technician.app_user_id → their login). In the field they
  move a job's status (Start / Awaiting parts / Complete) and text the customer —
  which posts into the same thread the customer sees in their portal. Same core as
  the office board + portal; a third lens.
-->
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd;
    --brand:#3f8f24; --brand-ink:#fff; --chip:#eef2e8; --shadow:0 1px 2px rgba(20,30,10,.06),0 6px 18px rgba(20,30,10,.06);
    --new:#6b7280; --scheduled:#2563eb; --in_progress:#b45309; --awaiting_parts:#7c3aed; --completed:#3f8f24; --canceled:#9ca3af;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .brand{font-weight:800}
  header .who{color:var(--muted);font-weight:600;font-size:14px}
  header .sp{flex:1}
  .shell{max-width:620px;margin:0 auto;padding:14px 14px 48px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:700}
  button.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  button:disabled{opacity:.5;cursor:default}
  .daylabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:6px 2px 12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
  .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .cust{font-weight:800;font-size:17px}
  .unit{color:var(--muted);font-size:14px;margin-top:2px}
  .badge{flex:0 0 auto;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;white-space:nowrap}
  .prob{margin-top:9px;font-size:14.5px}
  .intake{margin-top:10px;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13.5px}
  .intake .irow{color:var(--ink)}
  .intake .imedia{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .intake .ilink{font-weight:700;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--panel)}
  .intake .ithumb img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .brainbtn{margin-top:9px;font-size:13px;font-weight:700;color:var(--brand);background:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer}
  .brainbox{margin-top:9px;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;display:none}
  .brainbox.open{display:block}
  .brainbox .bh{font-weight:800;margin-bottom:6px}
  .brainrow{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
  .brainrow:first-of-type{border-top:none}
  .brainrow .bp{color:var(--muted);font-size:12px}
  .tdr{margin-top:11px;display:none;flex-direction:column;gap:8px}
  .tdr.open{display:flex}
  .tdr input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .tdr .two{display:flex;gap:8px}
  .tdr .outc{display:flex;flex-direction:column;gap:4px;font-size:14px}
  .tdr .outc label{display:flex;gap:8px;align-items:center}
  .tdrdone{margin-top:9px;background:var(--chip);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--muted)}
  .tdr .cameback{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
  .links{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .links a{font-size:13px;font-weight:700;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .actions button{flex:1;min-width:96px}
  .msg{margin-top:11px;display:none;gap:8px}
  .msg.open{display:flex}
  .msg textarea{flex:1;resize:none;min-height:42px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .msgbtn{margin-top:11px;font-size:13px;font-weight:700;color:var(--muted);background:none;border:none;padding:2px;cursor:pointer}
  .gate{max-width:380px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
  .gate h1{margin:0 0 4px;font-size:20px}.gate p{margin:0 0 16px;color:var(--muted);font-size:14px}
  .gate label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .gate button{width:100%;margin-top:18px}
  .err{color:#c0392b;font-size:13px;margin-top:12px;min-height:1.2em}
  :root[data-theme="dark"] .err,:root:not([data-theme="light"]) .err{color:#ff8a7a}
  .empty{color:var(--muted);text-align:center;padding:32px 12px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--chip);padding:1px 5px;border-radius:5px}
  .note{background:var(--chip);border-radius:10px;padding:11px 13px;color:var(--muted);font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<div id="app"><div class="shell"><div class="empty">🐜 Loading…</div></div></div>

<script src="/platform/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var cfg = window.ANT_SUPABASE || {};
  var sb = null, me = null, myTech = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function fullName(c){ return c ? [c.first_name, c.last_name].filter(Boolean).join(' ').trim() : ''; }
  var STATUS = {
    new:{l:'New',c:'var(--new)'}, scheduled:{l:'Scheduled',c:'var(--scheduled)'},
    in_progress:{l:'In progress',c:'var(--in_progress)'}, awaiting_parts:{l:'Awaiting parts',c:'var(--awaiting_parts)'},
    completed:{l:'Completed',c:'var(--completed)'}, canceled:{l:'Canceled',c:'var(--canceled)'}
  };
  function st(k){ return STATUS[k] || {l:(k||'Open'),c:'var(--new)'}; }

  if (!cfg.url || !cfg.anonKey) {
    app.innerHTML = '<div class="gate"><h1>🐜 Connect your project</h1><p>Fill <span class="mono">platform/config.js</span> with your Supabase URL + anon key, then reload.</p></div>';
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  function renderSignIn(msg) {
    app.innerHTML = '<div class="gate"><h1>🐜 My jobs</h1><p>Sign in to see your day.</p>' +
      '<label>Email</label><input id="em" type="email" autocomplete="username">' +
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password">' +
      '<button class="primary" id="go">Sign in</button><div class="err" id="err">' + esc(msg||'') + '</div></div>';
    var go = document.getElementById('go');
    function submit(){
      var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
      if(!em||!pw){document.getElementById('err').textContent='Enter your email and password.';return;}
      go.disabled=true; go.textContent='Signing in…';
      sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){ if(r.error) renderSignIn(r.error.message); else boot(); });
    }
    go.onclick=submit;
    document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  }

  function shell(inner){
    app.innerHTML = '<header><span class="brand">🐜 Ant</span><span class="who" id="who">' + esc(myTech ? myTech.name : (me ? (me.name||'') : '')) + '</span>' +
      '<span class="sp"></span><button id="refresh">Refresh</button><button id="out">Sign out</button></header>' +
      '<div class="shell" id="body">' + inner + '</div>';
    document.getElementById('out').onclick=function(){ sb.auth.signOut().then(renderSignIn); };
    document.getElementById('refresh').onclick=loadJobs;
  }

  function setStatus(jobId, status){
    sb.from('job').update({ status: status }).eq('id', jobId).then(function(r){ if(!r.error) loadJobs(); });
  }

  // Save the completion report (TDR) — the brain-food. Upsert one per job, then move the
  // job's status by the outcome (fixed -> completed, needs a part -> awaiting parts).
  function saveTdr(id, btn){
    var job = jobsCache.filter(function(x){return String(x.id)===String(id);})[0]; if(!job) return;
    var v = function(pre){ var e=document.getElementById(pre+id); return e?e.value.trim():''; };
    var comp = v('tc'); if(!comp){ var e=document.getElementById('tc'+id); if(e){e.focus();} return; }
    var outcome = 'fixed'; var rs = document.getElementsByName('o'+id);
    for (var i=0;i<rs.length;i++){ if(rs[i].checked) outcome = rs[i].value; }
    if (btn){ btn.disabled=true; btn.textContent='Saving…'; }
    var row = { company_id: me.company_id, job_id: id,
      appliance: (job.unit&&job.unit.label)||'', brand: v('tb'), model: v('tm'), symptom: job.problem||'',
      failed_component: comp, part_number: v('tp'), root_cause: v('tr'),
      outcome: outcome, held: !(document.getElementById('tcb'+id) && document.getElementById('tcb'+id).checked),
      tech: myTech ? myTech.name : (me.name||'') };
    if (row.held === false) row.reopened_at = new Date().toISOString();
    sb.from('job_tdr').upsert(row, { onConflict: 'job_id' }).then(function(r){
      if (r.error){ if(btn){btn.disabled=false;btn.textContent='Save report + finish';} return; }
      var newStatus = outcome === 'return_needed' ? 'awaiting_parts' : 'completed';
      sb.from('job').update({ status: newStatus }).eq('id', id).then(function(){ loadJobs(); });
    });
  }

  // Ask the brain (across ALL shops) what usually fixes this brand/model/symptom.
  function brainLookup(id){
    var job = jobsCache.filter(function(x){return String(x.id)===String(id);})[0]; if(!job) return;
    var box = document.getElementById('brain_'+id); if(!box) return;
    box.classList.add('open'); box.innerHTML = '<div class="bh">🧠 Checking across shops…</div>';
    var attrs = (job.unit && job.unit.attributes) || {};
    sb.rpc('brain_lookup', { p_brand: attrs.brand||'', p_model: attrs.model||'', p_symptom: job.problem||'' }).then(function(r){
      if (r.error){ box.innerHTML = '<div class="bh">🧠 Not available yet</div>'; return; }
      var rows = r.data || [];
      if (!rows.length){ box.innerHTML = '<div class="bh">🧠 No data yet</div><div class="bp">As shops file reports, this fills in with what usually fixes this model.</div>'; return; }
      box.innerHTML = '<div class="bh">🧠 What usually fixes this — across '+ (rows[0].shops||0) +'+ shops</div>' + rows.map(function(x){
        return '<div class="brainrow"><div><b>'+esc(x.failed_component||'')+'</b>'+(x.part_number?' <span class="bp">'+esc(x.part_number)+'</span>':'')+'</div>'+
          '<div class="bp">'+(x.fixes||0)+' fixed'+(x.comebacks?' · '+x.comebacks+' came back':'')+'</div></div>';
      }).join('');
    });
  }
  function sendToCustomer(job, body, btn){
    if(!body.trim()) return;
    btn.disabled = true;
    sb.from('thread_message').insert({
      company_id: me.company_id, customer_id: job.customer_id, job_id: job.id,
      direction: 'out', channel: 'sms', sender: 'tech:' + (myTech ? myTech.name : (me.name||'Tech')),
      body: body.trim()
    }).then(function(r){ btn.disabled=false; if(!r.error){ var t=document.getElementById('m_'+job.id); if(t){t.value='';} var w=document.getElementById('mw_'+job.id); if(w) w.classList.remove('open'); } });
  }

  function intakeHtml(j){
    var bits = [];
    if (j.availability) bits.push('📅 <b>'+esc(j.availability)+'</b>');
    if (j.waiver_signed_at) bits.push('✍️ Waiver signed'+(j.waiver_name?' — '+esc(j.waiver_name):''));
    var media = j.media || [];
    var mediaHtml = '';
    media.filter(function(m){return m.kind==='video'&&m.provider==='cfstream';}).forEach(function(m){
      mediaHtml += '<a class="ilink" target="_blank" rel="noopener" href="https://iframe.cloudflarestream.com/'+esc(m.ref)+'">🎥 Watch video</a>';
    });
    media.filter(function(m){return m.kind==='photo'&&m.provider==='storage';}).forEach(function(m){
      var u = (cfg.url||'')+'/storage/v1/object/public/intake-photos/'+m.ref;
      mediaHtml += '<a class="ithumb" target="_blank" rel="noopener" href="'+esc(u)+'"><img src="'+esc(u)+'" alt="photo"></a>';
    });
    if (!bits.length && !mediaHtml) return '';
    return '<div class="intake">'+(bits.length?'<div class="irow">'+bits.join(' &nbsp;·&nbsp; ')+'</div>':'')+(mediaHtml?'<div class="imedia">'+mediaHtml+'</div>':'')+'</div>';
  }
  function cardHtml(j){
    var s = st(j.status);
    var unit = j.unit && j.unit.label ? j.unit.label : '';
    var cust = j.customer || {};
    var addr = [cust.address, cust.city, cust.state].filter(Boolean).join(', ');
    var phone = (cust.phone||'').replace(/[^0-9+]/g,'');
    var links = '';
    if (phone) links += '<a href="tel:'+esc(phone)+'">📞 Call</a>';
    if (addr) links += '<a target="_blank" rel="noopener" href="https://maps.google.com/?q='+encodeURIComponent(addr)+'">🧭 Navigate</a>';
    var attrs = (j.unit && j.unit.attributes) || {};
    var brand = attrs.brand || '', model = attrs.model || '';
    var tdr = (j.tdr && j.tdr[0]) || null;
    // contextual actions
    var acts = '';
    if (j.status !== 'in_progress' && j.status !== 'completed') acts += '<button class="primary" data-act="in_progress" data-id="'+j.id+'">Start</button>';
    if (j.status !== 'awaiting_parts' && j.status !== 'completed') acts += '<button data-act="awaiting_parts" data-id="'+j.id+'">Awaiting parts</button>';
    acts += '<button class="primary" data-tdr="'+j.id+'">'+(tdr?'Edit report':'Complete + report')+'</button>';
    // the TDR (completion report) — structured so it feeds the brain
    var tdrPanel = '<div class="tdr" id="tdr_'+j.id+'">' +
      '<div class="two"><input id="tb'+j.id+'" placeholder="Brand" value="'+esc(tdr?tdr.brand||brand:brand)+'"><input id="tm'+j.id+'" placeholder="Model #" value="'+esc(tdr?tdr.model||model:model)+'"></div>' +
      '<input id="tc'+j.id+'" placeholder="Failed component (e.g. heating element)" value="'+esc(tdr?tdr.failed_component||'':'')+'">' +
      '<input id="tp'+j.id+'" placeholder="Part number used" value="'+esc(tdr?tdr.part_number||'':'')+'">' +
      '<input id="tr'+j.id+'" placeholder="Root cause (short)">' +
      '<div class="outc">' +
        '<label><input type="radio" name="o'+j.id+'" value="fixed"'+(!tdr||tdr.outcome==='fixed'?' checked':'')+'> Fixed today</label>' +
        '<label><input type="radio" name="o'+j.id+'" value="return_needed"'+(tdr&&tdr.outcome==='return_needed'?' checked':'')+'> Needs a return / part</label>' +
        '<label><input type="radio" name="o'+j.id+'" value="not_fixable"'+(tdr&&tdr.outcome==='not_fixable'?' checked':'')+'> Not fixable</label>' +
      '</div>' +
      (tdr ? '<label class="cameback"><input type="checkbox" id="tcb'+j.id+'"'+(tdr.held===false?' checked':'')+'> This came back — the last fix didn\'t hold</label>' : '') +
      '<button class="primary" data-savetdr="'+j.id+'">Save report + finish</button></div>';
    var tdrDone = tdr ? '<div class="tdrdone">📋 Report: <b>'+esc(tdr.failed_component||'')+'</b>'+(tdr.part_number?' · '+esc(tdr.part_number):'')+' · '+esc(tdr.outcome)+(tdr.held===false?' · came back':'')+'</div>' : '';
    return '<div class="card" data-card="'+j.id+'">' +
      '<div class="row1"><div><div class="cust">'+esc(fullName(cust)||'Customer')+'</div>'+(unit?'<div class="unit">'+esc(unit)+'</div>':'')+'</div>' +
      '<span class="badge" style="background:'+s.c+'">'+esc(s.l)+'</span></div>' +
      (j.problem?'<div class="prob">'+esc(j.problem)+'</div>':'') +
      intakeHtml(j) +
      '<button class="brainbtn" data-brain="'+j.id+'">🧠 What usually fixes this</button>' +
      '<div class="brainbox" id="brain_'+j.id+'"></div>' +
      (links?'<div class="links">'+links+'</div>':'') +
      tdrDone +
      '<div class="actions">'+acts+'</div>' +
      tdrPanel +
      '<button class="msgbtn" data-msg="'+j.id+'">📩 Text the customer</button>' +
      '<div class="msg" id="mw_'+j.id+'"><textarea id="m_'+j.id+'" placeholder="Message to '+esc((cust.first_name||'the customer'))+'…"></textarea><button class="primary" data-send="'+j.id+'">Send</button></div>' +
      '</div>';
  }

  var jobsCache = [];
  function renderJobs(jobs){
    jobsCache = jobs || [];
    var today = new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
    var note = myTech ? '' : '<div class="note">Your login isn\'t linked to a technician yet, so this shows all the shop\'s open jobs. Ask the office to link you as a tech.</div>';
    var body = '<div class="daylabel">'+esc(today)+' · '+jobs.length+' job'+(jobs.length===1?'':'s')+'</div>' + note +
      (jobs.length ? jobs.map(cardHtml).join('') : '<div class="empty">No open jobs right now. 🎉</div>');
    document.getElementById('body').innerHTML = body;
    // wire actions
    var b = document.getElementById('body');
    b.querySelectorAll('button[data-act]').forEach(function(el){ el.onclick=function(){ setStatus(el.getAttribute('data-id'), el.getAttribute('data-act')); }; });
    b.querySelectorAll('button[data-msg]').forEach(function(el){ el.onclick=function(){ var w=document.getElementById('mw_'+el.getAttribute('data-msg')); if(w) w.classList.toggle('open'); }; });
    b.querySelectorAll('button[data-send]').forEach(function(el){ el.onclick=function(){ var id=el.getAttribute('data-send'); var job=jobsCache.filter(function(x){return String(x.id)===String(id);})[0]; var t=document.getElementById('m_'+id); if(job&&t) sendToCustomer(job, t.value, el); }; });
    b.querySelectorAll('button[data-tdr]').forEach(function(el){ el.onclick=function(){ var p=document.getElementById('tdr_'+el.getAttribute('data-tdr')); if(p) p.classList.toggle('open'); }; });
    b.querySelectorAll('button[data-savetdr]').forEach(function(el){ el.onclick=function(){ saveTdr(el.getAttribute('data-savetdr'), el); }; });
    b.querySelectorAll('button[data-brain]').forEach(function(el){ el.onclick=function(){ brainLookup(el.getAttribute('data-brain')); }; });
  }

  function loadJobs(){
    var q = sb.from('job').select(
      'id,status,problem,scheduled_day,availability,waiver_name,waiver_signed_at,customer_id,' +
      'customer:customer_id(first_name,last_name,phone,address,city,state),unit:unit_id(label,attributes),' +
      'media:job_media(kind,provider,ref,label),tdr:job_tdr(failed_component,part_number,outcome,held)'
    ).not('status','in','(completed,canceled)').order('scheduled_day',{ascending:true,nullsFirst:false});
    if (myTech) q = q.eq('technician_id', myTech.id);   // my jobs; else (owner/office demo) all open jobs
    q.then(function(r){
      if (r.error) { document.getElementById('body').innerHTML = '<div class="note">Couldn\'t load jobs: '+esc(r.error.message)+'</div>'; return; }
      renderJobs(r.data||[]);
    });
  }

  function boot(){
    // resolve "me" (RLS lets me read my own company's app_users → my row) + my technician link
    sb.auth.getUser().then(function(u){
      var uid = u && u.data && u.data.user ? u.data.user.id : null;
      sb.from('app_user').select('id,name,role,company_id').eq('auth_user_id', uid).limit(1).then(function(r){
        me = (r.data && r.data[0]) || null;
        if (!me) { shell('<div class="note">Your login isn\'t attached to a shop yet. Ask the office to add you.</div>'); return; }
        sb.from('technician').select('id,name').eq('app_user_id', me.id).limit(1).then(function(t){
          myTech = (t.data && t.data[0]) || null;
          shell('<div class="empty">Loading your day…</div>');
          loadJobs();
        });
      });
    });
  }

  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) boot(); else renderSignIn(); });
})();
</script>
</body>
</html>
