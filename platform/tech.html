<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My Jobs — Ant</title>
<!--
  Ant platform — TECH APP (multi-tenant reference surface).
  A tech signs in; RLS scopes to their shop, and the app filters to the jobs
  assigned to THEM (via technician.app_user_id → their login). In the field they
  move a job's status (Start / Awaiting parts / Complete) and text the customer —
  which posts into the same thread the customer sees in their portal. Same core as
  the office board + portal; a third lens.
-->
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd;
    --brand:#3f8f24; --brand-ink:#fff; --chip:#eef2e8; --shadow:0 1px 2px rgba(20,30,10,.06),0 6px 18px rgba(20,30,10,.06);
    --new:#6b7280; --scheduled:#2f6bff; --in_progress:#f59e0b; --awaiting_parts:#8b5cf6; --completed:#12c256; --canceled:#9ca3af;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .brand{font-weight:800}
  header .who{color:var(--muted);font-weight:600;font-size:14px}
  header .sp{flex:1}
  .shell{max-width:620px;margin:0 auto;padding:14px 14px 48px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:700}
  button.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  button:disabled{opacity:.5;cursor:default}
  .daylabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:6px 2px 12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
  .torow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600} .torow:first-of-type{border-top:0}
  .tox{border:0;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 6px}
  .toadd{border:0;background:var(--ink);color:var(--panel);font-weight:800;border-radius:9px;padding:9px 14px;cursor:pointer;white-space:nowrap}
  .stopno{display:inline-block;font-size:12px;font-weight:800;color:var(--panel);background:var(--brand,#2f6bff);border-radius:999px;padding:1px 8px;vertical-align:middle}
  .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .opencard{text-decoration:none;color:inherit;display:block}
  .cust{font-weight:800;font-size:17px}
  .chev{color:var(--brand)}
  .openbtn{display:block;text-align:center;margin-top:11px;background:var(--brand);color:#fff;border-radius:10px;padding:11px 12px;font-weight:800;font-size:14.5px;text-decoration:none}
  .unit{color:var(--muted);font-size:14px;margin-top:2px}
  .badge{flex:0 0 auto;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;white-space:nowrap}
  .prob{margin-top:9px;font-size:14.5px}
  .intake{margin-top:10px;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13.5px}
  .intake .irow{color:var(--ink)}
  .intake .imedia{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .mtile{position:relative;display:inline-flex;width:68px;height:68px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0b0d08;align-items:center;justify-content:center;flex:0 0 auto}
  .mtile img{width:100%;height:100%;object-fit:cover;display:block}
  .vtile .vcover{position:absolute;inset:0}
  .vtile .play{position:absolute;color:#fff;font-size:22px;line-height:1;text-shadow:0 1px 5px rgba(0,0,0,.7);pointer-events:none}
  .brainbtn{margin-top:9px;font-size:13px;font-weight:700;color:var(--brand);background:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer}
  .brainbox{margin-top:9px;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;display:none}
  .brainbox.open{display:block}
  .brainbox .bh{font-weight:800;margin-bottom:6px}
  .brainrow{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
  .brainrow:first-of-type{border-top:none}
  .brainrow .bp{color:var(--muted);font-size:12px}
  .tdr{margin-top:11px;display:none;flex-direction:column;gap:8px}
  .tdr.open{display:flex}
  .tdr input:not([type="radio"]):not([type="checkbox"]){width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .tdr input[type="radio"],.tdr input[type="checkbox"]{width:auto;flex:0 0 auto;margin:0}
  .tdr .two{display:flex;gap:8px}
  .tdr .outc{display:flex;flex-direction:column;gap:4px;font-size:14px}
  .tdr .outc label{display:flex;gap:8px;align-items:center}
  .tdrdone{margin-top:9px;background:var(--chip);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--muted)}
  .earnchip{display:inline-flex;align-items:center;gap:7px;margin-top:9px;background:linear-gradient(135deg,#0f7a34,#0b5f28);color:#fff;border:none;border-radius:11px;padding:10px 14px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(16,120,50,.28)}
  .earnchip.pending{background:var(--chip);color:var(--muted);box-shadow:none;border:1px solid var(--line);font-weight:700}
  .lbowed{background:linear-gradient(135deg,rgba(16,120,50,.12),transparent);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:12px}
  .lbowed .big{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;color:#12a150}
  .lbowed .eta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tdr .cameback{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
  .tdr select,.tdr textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .tdr textarea{resize:none;min-height:54px}
  .needpart{width:100%;background:#c2571f;color:#fff;border:none;border-radius:11px;padding:12px;font-weight:800;font-size:14.5px;box-shadow:0 0 0 1px rgba(194,87,31,.35),0 6px 16px rgba(194,87,31,.22)}
  .findpart{background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .findpart .fh{font-weight:800;color:var(--brand);font-size:13.5px;margin-bottom:7px}
  .findpart input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
  .findpart .fg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .findpart .fg button{font-size:12.5px;font-weight:700;padding:9px 6px;border-radius:9px}
  .findpart .fg button.supcfg{grid-column:1/-1;background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:600}
  .findpart .fg button.supcfg:hover{color:var(--ink);border-color:var(--brand)}
  .rel{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rel.signed{background:var(--chip);color:var(--muted)}
  .rel.unsigned{background:rgba(194,87,31,.13);color:#c2571f;border:1px solid rgba(194,87,31,.4)}
  .rel .relbtn{margin-left:auto;background:#c2571f;color:#fff;border:none;border-radius:9px;padding:8px 12px;font-weight:800;font-size:12.5px}
  .links{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .links a{font-size:13px;font-weight:700;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .actions button{flex:1;min-width:96px}
  .msg{margin-top:11px;display:none;gap:8px}
  .msg.open{display:flex}
  .msg textarea{flex:1;resize:none;min-height:42px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .msgbtn{margin-top:11px;font-size:13px;font-weight:700;color:var(--muted);background:none;border:none;padding:2px;cursor:pointer}
  .gate{max-width:380px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
  .gate h1{margin:0 0 4px;font-size:20px}.gate p{margin:0 0 16px;color:var(--muted);font-size:14px}
  .gate label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .gate button{width:100%;margin-top:18px}
  .err{color:#c0392b;font-size:13px;margin-top:12px;min-height:1.2em}
  :root[data-theme="dark"] .err,:root:not([data-theme="light"]) .err{color:#ff8a7a}
  .empty{color:var(--muted);text-align:center;padding:32px 12px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--chip);padding:1px 5px;border-radius:5px}
  .note{background:var(--chip);border-radius:10px;padding:11px 13px;color:var(--muted);font-size:13px;margin-bottom:14px}
  /* Ant dock (tech) */
  .antfab{position:fixed;right:18px;bottom:18px;z-index:60;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;font-size:26px;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent);display:grid;place-items:center}
  .antpanel{position:fixed;right:18px;bottom:84px;z-index:60;width:min(380px,calc(100vw - 36px));max-height:min(72vh,640px);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden}
  .antpanel.open{display:flex}
  .aph{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--panel)),var(--panel))}
  .aph .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#e0a63e);display:grid;place-items:center;font-size:18px;flex:none}
  .aph h4{margin:0;font-size:14px;font-weight:800}.aph p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
  .aph .x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .athread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;min-height:150px}
  .abub{max-width:88%;padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.45}
  .abub.ant{align-self:flex-start;background:var(--chip);border-bottom-left-radius:4px}
  .abub.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;border-bottom-right-radius:4px}
  .abub.ant b,.abub.ant strong{color:var(--brand)}
  .atype{align-self:flex-start;display:flex;gap:4px;padding:11px 13px;background:var(--chip);border-radius:13px;border-bottom-left-radius:4px}
  .atype span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ab 1.2s infinite}.atype span:nth-child(2){animation-delay:.2s}.atype span:nth-child(3){animation-delay:.4s}
  @keyframes ab{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .aquick{display:flex;gap:6px;flex-wrap:wrap;padding:2px 12px 10px}
  .aquick button{border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer}
  .acomp{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line)}
  .acomp input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:10px 12px;font-size:13px}
  .acomp .s{width:40px;height:40px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;font-size:16px;font-weight:800;cursor:pointer;flex:none}
</style>
<link rel="stylesheet" href="/platform/ant-theme.css">
</head>
<body>
<div id="app"><div class="shell"><div class="empty">🐜 Loading…</div></div></div>

<script src="/platform/config.js"></script>
<script src="/platform/pay-calc.js"></script>
<script src="/platform/vendor/supabase-js.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>
<script src="/platform/vendor/supa-guard.js"></script>
<script src="/platform/media-sign.js"></script>
<script src="/platform/ant-suppliers.js"></script>
<script src="/ant-sounds.js"></script>
<script src="/ant-celebrate.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var cfg = window.ANT_SUPABASE || {};
  var sb = null, me = null, myTech = null, companySettings = {}, companyTrade = '';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function fullName(c){ return c ? [c.first_name, c.last_name].filter(Boolean).join(' ').trim() : ''; }
  var STATUS = {
    new:{l:'New',c:'var(--new)'}, scheduled:{l:'Scheduled',c:'var(--scheduled)'},
    in_progress:{l:'In progress',c:'var(--in_progress)'}, awaiting_parts:{l:'Awaiting parts',c:'var(--awaiting_parts)'},
    completed:{l:'Completed',c:'var(--completed)'}, canceled:{l:'Canceled',c:'var(--canceled)'}
  };
  function st(k){ return STATUS[k] || {l:(k||'Open'),c:'var(--new)'}; }

  if (!cfg.url || !cfg.anonKey) {
    app.innerHTML = '<div class="gate"><h1>🐜 Connect your project</h1><p>Fill <span class="mono">platform/config.js</span> with your Supabase URL + anon key, then reload.</p></div>';
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  function renderSignIn(msg) {
    app.innerHTML = '<div class="gate"><h1>🐜 My jobs</h1><p>Sign in to see your day.</p>' +
      '<label>Email</label><input id="em" type="email" autocomplete="username">' +
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password">' +
      '<button class="primary" id="go">Sign in</button><div class="err" id="err">' + esc(msg||'') + '</div></div>';
    var go = document.getElementById('go');
    function submit(){
      var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
      if(!em||!pw){document.getElementById('err').textContent='Enter your email and password.';return;}
      go.disabled=true; go.textContent='Signing in…';
      sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){ if(r.error) renderSignIn(r.error.message); else boot(); });
    }
    go.onclick=submit;
    document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  }

  function shell(inner){
    app.innerHTML = '<header><span class="brand">🐜 Ant</span><span class="who" id="who">' + esc(myTech ? myTech.name : (me ? (me.name||'') : '')) + '</span>' +
      '<span class="sp"></span><button id="refresh">Refresh</button><button id="out">Sign out</button></header>' +
      '<div class="shell" id="body">' + inner + '</div>';
    document.getElementById('out').onclick=function(){ sb.auth.signOut().then(renderSignIn); };
    document.getElementById('refresh').onclick=loadJobs;
  }

  function setStatus(jobId, status){
    var upd = { status: status }; if(status==='completed') upd.completed_at = new Date().toISOString();
    sb.from('job').update(upd).eq('id', jobId).then(function(r){ if(!r.error){ if(status==='completed') partyJobDone(jobId); loadJobs(); } });
  }

  // 🎉 Job-done celebration — the dopamine pop, same as TN. Fires on any complete. If his cut
  // is already known (office billed it), flash "YOU EARNED $X"; else a clean job-done pop.
  function partyJobDone(jobId){
    if(!window.antCelebrate) return;
    if(earnByJob[jobId]){ celebrateEarned(jobId); return; }
    var job = jobsCache.filter(function(x){return String(x.id)===String(jobId);})[0] || {};
    var nm = (job.customer && ((job.customer.first_name||'')+' '+(job.customer.last_name||'')).trim()) || (job.unit&&job.unit.label) || '';
    try{ window.antCelebrate({ tag:'Job complete', big:'JOB DONE! 🎉', sub:nm, cue:'win', sound:'both' }); }catch(_){ }
  }

  // Save the completion report (TDR) — the brain-food. Upsert one per job, then move the
  // job's status by the outcome (fixed -> completed, needs a part -> awaiting parts).
  function saveTdr(id, btn){
    var job = jobsCache.filter(function(x){return String(x.id)===String(id);})[0]; if(!job) return;
    var v = function(pre){ var e=document.getElementById(pre+id); return e?e.value.trim():''; };
    var comp = v('tc'); if(!comp){ var e=document.getElementById('tc'+id); if(e){e.focus();} return; }
    var outcome = 'fixed'; var rs = document.getElementsByName('o'+id);
    for (var i=0;i<rs.length;i++){ if(rs[i].checked) outcome = rs[i].value; }
    if (btn){ btn.disabled=true; btn.textContent='Saving…'; }
    var lhe = document.getElementById('th'+id); var lh = lhe ? parseFloat(lhe.value) : NaN;
    var row = { company_id: me.company_id, job_id: id,
      appliance: (job.unit&&job.unit.label)||'', brand: v('tb'), model: v('tm'), symptom: job.problem||'',
      failed_component: comp, part_number: v('tp'), root_cause: v('tr'),
      part_status: v('tps')||null, labor_hours: isNaN(lh)?null:lh, notes: v('tno')||null,
      outcome: outcome, held: !(document.getElementById('tcb'+id) && document.getElementById('tcb'+id).checked),
      tech: myTech ? myTech.name : (me.name||'') };
    if (row.held === false) row.reopened_at = new Date().toISOString();
    sb.from('job_tdr').upsert(row, { onConflict: 'job_id' }).then(function(r){
      if (r.error){ if(btn){btn.disabled=false;btn.textContent='Save report + finish';} return; }
      var newStatus = outcome === 'return_needed' ? 'awaiting_parts' : 'completed';
      var jobUpd = { status: newStatus };
      if (newStatus==='completed') jobUpd.completed_at = new Date().toISOString();
      if (newStatus==='completed' && !job.waiver_signed_at && window.confirm('Release isn\'t signed. Confirm the customer signed it?')){
        var by = myTech ? myTech.name : (me.name||'');
        jobUpd.waiver_signed_at = new Date().toISOString();
        jobUpd.waiver_name = (fullName(job.customer)||'Customer')+(by?' (confirmed by '+by+')':'');
      }
      sb.from('job').update(jobUpd).eq('id', id).then(function(){ if(newStatus==='completed') partyJobDone(id); loadJobs(); });
    });
  }

  // Capture the liability release on site — signed here, or the tech confirms the customer
  // signed it. Stamps who + when so the office/portal shows it as covered.
  function confirmRelease(id){
    var job = jobsCache.filter(function(x){return String(x.id)===String(id);})[0]; if(!job) return;
    var who = prompt('Who signed the release?', (fullName(job.customer)||'Customer'));
    if(who==null) return; who=(who||'').trim()||'Customer';
    var by = myTech ? myTech.name : (me.name||'');
    sb.from('job').update({ waiver_signed_at:new Date().toISOString(), waiver_name: who+(by?' (confirmed by '+by+')':'') }).eq('id', id).then(function(r){
      if(r.error){ alert('Couldn\'t save the release: '+r.error.message); return; }
      loadJobs();
    });
  }

  // 🔩 Find the part — open the model/part # on a supplier's site (no login needed).
  // 🔩 Find the part — buttons come from the shared, INTERCHANGEABLE supplier catalog
  // (per-device tech choice ▸ shop default ▸ built-in). "Guys have different suppliers."
  function supplierBtnsHtml(id){
    var subs = (window.AntSuppliers ? AntSuppliers.list(companySettings) : [{key:'sears',label:'Sears PartsDirect',icon:'🔩'}]);
    return subs.map(function(s){ return '<button type="button" data-find="'+s.key+'" data-find-id="'+id+'">'+s.icon+' '+esc(s.label)+'</button>'; }).join('') +
      '<button type="button" class="supcfg" data-supcfg="'+id+'" title="Choose your suppliers">⚙️ Suppliers</button>';
  }
  function findPart(id, key){
    var inp = document.getElementById('fp'+id); var q = inp ? inp.value.trim() : '';
    if(!q){ if(inp) inp.focus(); return; }
    if(window.AntSuppliers) AntSuppliers.open(key, q, companySettings);
  }
  // Re-render the supplier buttons on one card after the tech changes their set.
  function refreshSuppliers(id){
    var g = document.querySelector('.findpart button[data-find-id="'+id+'"]');
    var fg = g ? g.parentNode : null; if(!fg) return;
    fg.innerHTML = supplierBtnsHtml(id);
    fg.querySelectorAll('button[data-find]').forEach(function(el){ el.onclick=function(){ findPart(el.getAttribute('data-find-id'), el.getAttribute('data-find')); }; });

  var jobsCache = [];
  var earnByJob = {};      // jobId -> PayCalc pay row (his cut), for the "You earned" flash
  var payState = null;     // {paid_cents, owed_cents, pending_cents} from loadPay
  var stopByJob = {};      // job_id -> route stop number (only on multi-stop days)
  // 🧭 Same route heuristic the dispatch board uses (nearest-neighbor by 5-digit ZIP), so the
  // numbers agree. Groups a day's stops by area + sweeps low→high; no geocoding, deterministic.
  function zip5(z){ var m=String(z||'').match(/\d{5}/); return m?parseInt(m[0],10):null; }
  function jZip(j){ return (j&&j.customer&&j.customer.zip)||''; }
  function routeOrder(stops){
    var pool=stops.slice(); if(pool.length<3) return pool;
    var start=null; pool.forEach(function(s){ var z=zip5(jZip(s)); if(z!=null&&(start==null||z<start)) start=z; });
    var out=[], cur=start;
    while(pool.length){ var bi=0,bd=Infinity; for(var i=0;i<pool.length;i++){ var z=zip5(jZip(pool[i])); var d=(cur==null)?0:(z==null?1e12:Math.abs(z-cur)); if(d<bd){bd=d;bi=i;} }
      var nx=pool.splice(bi,1)[0]; out.push(nx); var nz=zip5(jZip(nx)); if(nz!=null) cur=nz; }
    return out;
  }
  // Reorder open jobs so each scheduled day runs in route order; number the stops of any 3+ day.
  function routeSequence(jobs){
    stopByJob={};
    var byDay={}, order=[];
    jobs.forEach(function(j){ var k=j.scheduled_day||'~'; if(!byDay[k]){ byDay[k]=[]; order.push(k); } byDay[k].push(j); });
    var out=[];
    order.forEach(function(k){
      var open=byDay[k].filter(function(j){ return j.status!=='completed'; });
      var done=byDay[k].filter(function(j){ return j.status==='completed'; });
      var seq=routeOrder(open);
      if(k!=='~' && seq.length>=3){ seq.forEach(function(j,i){ stopByJob[j.id]=i+1; }); }
      out=out.concat(seq, done);
    });
    return out;
  }

  // The tech's OWN pay, derived (PayCalc) from his completed jobs' invoices + his rule.
  // earned (pending) -> collected & owed to you -> paid. Never a fabricated number.
  function loadPay(){
    var card=document.getElementById('payCard'); if(!card||!myTech) return;
    var rule=window.PayCalc.ruleFor(myTech, window.PayCalc.companyDefault(companySettings));
    var jobsP=sb.from('job').select('id,completed_at,customer:customer_id(first_name,last_name)').eq('technician_id',myTech.id).eq('status','completed').order('completed_at',{ascending:false,nullsFirst:false}).limit(500);
    var invP=sb.from('invoice').select('job_id,labor_cents,status').limit(3000);
    var payP=sb.from('tech_payout').select('job_id,amount_cents').eq('technician_id',myTech.id).limit(3000);
    Promise.all([jobsP,invP,payP]).then(function(res){
      var jobs=(res[0].data)||[], invs=(res[1].data)||[], pays=(res[2].data)||[];
      var invByJob={}; invs.forEach(function(v){ if(v.job_id) invByJob[v.job_id]=v; });
      var paidByJob={}; pays.forEach(function(p){ paidByJob[p.job_id]=(paidByJob[p.job_id]||0)+(p.amount_cents||0); });
      var rows=[]; earnByJob={}; jobs.forEach(function(j){ var inv=invByJob[j.id]; if(!inv) return; var pj=window.PayCalc.jobPay(j, inv, rule, paidByJob[j.id]||0); pj._cust=j.customer; pj._jobId=j.id; rows.push(pj); earnByJob[j.id]=pj; });
      var t=window.PayCalc.totals(rows);
      var pendingEarned = Math.max(0, t.earned_cents - t.collectible_cents);
      payState = { paid_cents:t.paid_cents, owed_cents:t.owed_now_cents, pending_cents:pendingEarned };
      var list = rows.slice(0,8).map(function(r){ var nm=r._cust?((r._cust.first_name||'')+' '+(r._cust.last_name||'')).trim():'Job'; var badge=r.state==='paid'?'<span style="color:var(--muted)">paid</span>':(r.collected?'<span style="color:#12a150;font-weight:700">collected</span>':'<span style="color:#b45309">pending</span>'); return '<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px"><span>'+esc(nm||'Job')+'</span><span style="display:flex;gap:10px"><span>'+badge+'</span><b style="font-variant-numeric:tabular-nums">'+money(r.earned_cents)+'</b></span></div>'; }).join('');
      var cell=function(k,v,hi){ return '<div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em">'+k+'</div><div style="font-size:21px;font-weight:800;font-variant-numeric:tabular-nums'+(hi?';color:#12a150':'')+'">'+v+'</div></div>'; };
      var needsRate = rule.type==='labor_pct' && !rule.pct && !myTech.commission_type;
      // Gold stat tiles + a per-job list styled to read on the green "in the bank" hero.
      var tile=function(k,v){ return '<div class="moneytile" style="flex:1;min-width:0"><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.72">'+k+'</div><div class="n">'+v+'</div></div>'; };
      var glist = rows.slice(0,8).map(function(r){ var nm=r._cust?((r._cust.first_name||'')+' '+(r._cust.last_name||'')).trim():'Job'; var badge=r.state==='paid'?'<span style="opacity:.72">paid</span>':(r.collected?'<span style="color:#bbf7d0;font-weight:700">collected</span>':'<span style="color:#ffe08a;font-weight:700">pending</span>'); return '<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.16);font-size:13.5px"><span>'+esc(nm||'Job')+'</span><span style="display:flex;gap:10px;align-items:center"><span>'+badge+'</span><b style="font-variant-numeric:tabular-nums;font-family:\'IBM Plex Mono\',ui-monospace,monospace">'+money(r.earned_cents)+'</b></span></div>'; }).join('');
      card.innerHTML='<div class="card bankcard">'+
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><b style="font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.85">💰 In the bank</b><span style="font-size:11.5px;opacity:.82">'+esc(window.PayCalc.ruleLabel(rule))+'</span></div>'+
        '<div class="big">'+money(t.owed_now_cents)+'</div>'+
        '<div style="font-size:12.5px;opacity:.86;margin:1px 0 13px">owed to you right now'+(pendingEarned>0?' · '+money(pendingEarned)+' more earning':'')+'</div>'+
        '<div style="display:flex;gap:10px">'+tile('Earned (pending)',money(pendingEarned))+tile('Paid out',money(t.paid_cents))+'</div>'+
        (rows.length? '<div style="margin-top:12px">'+glist+'</div>' : '<div style="margin-top:10px;font-size:13px;opacity:.85">No billed jobs yet — your pay shows here as the office bills your completed jobs.</div>')+
        (needsRate? '<div style="margin-top:10px;font-size:13px;color:#ffe08a">Your commission rate isn\'t set yet — ask the office.</div>':'')+
      '</div>';
      paintEarnChips(); renderLbOwed(); maybeCelebratePayout();
    }).catch(function(){});
  }

  // Fill the "You earned $X" chip on each completed card once pay data is in. Tap = confetti.
  function paintEarnChips(){
    Object.keys(earnByJob).forEach(function(id){
      var slot=document.getElementById('earn_'+id); if(!slot) return;
      var r=earnByJob[id];
      slot.innerHTML='<button class="earnchip" data-earn="'+id+'">💰 You earned '+money(r.earned_cents)+'</button>';
      var b=slot.querySelector('button[data-earn]'); if(b) b.onclick=function(){ celebrateEarned(id); };
    });
    // completed cards with no invoice yet → gentle pending chip
    Array.prototype.forEach.call(document.querySelectorAll('.earnslot'), function(slot){
      var id=slot.id.replace('earn_',''); if(earnByJob[id] || slot.firstChild) return;
      slot.innerHTML='<span class="earnchip pending">💰 Pay lands when the office bills this</span>';
    });
  }
  function celebrateEarned(id){
    var r=earnByJob[id]; if(!r || !window.antCelebrate) return;
    var nm=r._cust?((r._cust.first_name||'')+' '+(r._cust.last_name||'')).trim():'';
    var state=r.state==='paid'?'Paid — in your pocket':(r.collected?'Collected — owed to you now':'Pending — pays when the customer pays');
    try{ window.antCelebrate({ tag:'Your pay', big:'YOU EARNED '+money(r.earned_cents)+' 💰', sub:nm,
      tiles:[{value:money(r.earned_cents),label:'Your cut',accent:'#4ade80'},{value:state.split(' — ')[0],label:'Status',accent:'#22d3ee'}], cue:'win', sound:'both' }); }catch(_){ }
  }

  // Running tally of money owed + payment ETA, painted onto the leaderboard's owed strip.
  function renderLbOwed(){
    var el=document.getElementById('lbOwed'); if(!el||!payState) return;
    var owed=payState.owed_cents||0, pend=payState.pending_cents||0;
    el.innerHTML='<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Money owed to you</div>'+
      '<div class="big">'+money(owed)+'</div>'+
      '<div class="eta">'+(owed>0?'✅ Collected — ready for your next payout':'Nothing collected & unpaid right now')+
      (pend>0?' · ⏳ '+money(pend)+' pending (pays when the customer pays)':'')+'</div>';
  }

  // 🏆 Leaderboard — built to LIFT. Only the crowns we have real data for today
  // (Workhorse = jobs done, First-Stop King = first-time-fix rate); the rest are honest
  // "coming soon". Performance only — never pay. Company-scoped (all techs).
  function loadLeaderboard(){
    var el=document.getElementById('lbCard'); if(!el) return;
    var d=new Date(); var mStart=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)).toISOString();
    Promise.all([
      sb.from('job').select('technician_id,first_stop,completed_at').eq('status','completed').limit(5000),
      sb.rpc('company_roster')
    ]).then(function(res){
      var jobs=(res[0].data)||[], techs=(res[1].data)||[];
      var name={}; techs.forEach(function(t){ name[t.id]=t.name; });
      var agg={};
      jobs.forEach(function(j){
        if(!j.technician_id) return;
        if(j.completed_at && j.completed_at < mStart) return;
        var a=agg[j.technician_id]||(agg[j.technician_id]={done:0,fsK:0,fsY:0});
        a.done++; if(j.first_stop===true||j.first_stop===false){ a.fsK++; if(j.first_stop===true) a.fsY++; }
      });
      var ids=Object.keys(agg); if(!ids.length){ crownState=[]; el.innerHTML='<div class="card"><div class="lbowed" id="lbOwed"></div></div>'; renderLbOwed(); maybeCelebratePayout(); return; }
      var work=ids.map(function(id){return {id:id,name:name[id]||'—',v:agg[id].done};}).sort(function(a,b){return b.v-a.v;});
      var fs=ids.filter(function(id){return agg[id].fsK>=5;}).map(function(id){return {id:id,name:name[id]||'—',v:Math.round(100*agg[id].fsY/agg[id].fsK)};}).sort(function(a,b){return b.v-a.v;});
      // crowns THIS tech leads (rank #1) — powers the payday fireworks + achievement flash
      crownState=[]; if(myTech){ if(work[0]&&String(work[0].id)===String(myTech.id)) crownState.push({icon:'⚡',title:'Workhorse',value:''+work[0].v}); if(fs[0]&&String(fs[0].id)===String(myTech.id)) crownState.push({icon:'🥇',title:'First-Stop King',value:fs[0].v+'%'}); }
      function myRank(list){ if(!myTech) return null; for(var i=0;i<list.length;i++){ if(String(list[i].id)===String(myTech.id)) return i+1; } return null; }
      function crown(icon,title,list,unit){
        if(!list.length) return '';
        var top=list.slice(0,3).map(function(r,i){ var me=myTech&&String(r.id)===String(myTech.id); return '<div style="display:flex;justify-content:space-between;padding:3px 0;'+(me?'font-weight:800':'')+'"><span>'+['🥇','🥈','🥉'][i]+' '+esc(r.name)+'</span><span style="font-variant-numeric:tabular-nums">'+r.v+unit+'</span></div>'; }).join('');
        var mr=myRank(list); var meNote=(mr&&mr>3)?'<div style="color:var(--muted);font-size:12px;margin-top:2px">You: #'+mr+'</div>':'';
        return '<div style="flex:1;min-width:150px"><div style="font-weight:700;font-size:13px;margin-bottom:4px">'+icon+' '+title+'</div>'+top+meNote+'</div>';
      }
      el.innerHTML='<div class="card"><div class="lbowed" id="lbOwed"></div>'+
        '<div style="font-weight:800;margin-bottom:10px">🏆 Leaderboard <span style="color:var(--muted);font-size:12px;font-weight:400">this month</span></div>'+
        '<div style="display:flex;gap:18px;flex-wrap:wrap">'+crown('⚡','Workhorse',work,'')+crown('🥇','First-Stop King',fs,'%')+'</div>'+
        '<div style="color:var(--muted);font-size:12px;margin-top:10px">More crowns — cleanest work, top upseller, customer favorite, sharpest diagnosis — unlock as that data flows in.</div></div>';
      renderLbOwed(); maybeCelebratePayout();
    }).catch(function(){ el.innerHTML=''; });
  }

  // 📊 Vivid 2-week chart of the tech's STOPS (scheduled visits) + COMPLETIONS per day.
  // Self-contained inline SVG — no chart library, CSP-safe.
  function loadStats(){
    var el=document.getElementById('statsCard'); if(!el||!myTech) return;
    sb.from('job').select('scheduled_day,completed_at,status').eq('technician_id',myTech.id).limit(3000).then(function(r){
      var jobs=r.data||[]; var days=[], idx={}, today=new Date();
      for(var i=13;i>=0;i--){ var d=new Date(today); d.setDate(d.getDate()-i); var key=d.toISOString().slice(0,10); var o={key:key,dom:d.getDate(),stops:0,done:0}; days.push(o); idx[key]=o; }
      jobs.forEach(function(j){
        if(j.scheduled_day && idx[j.scheduled_day]) idx[j.scheduled_day].stops++;
        if(j.completed_at){ var ck=String(j.completed_at).slice(0,10); if(idx[ck]) idx[ck].done++; }
      });
      var totStops=0,totDone=0; days.forEach(function(o){ totStops+=o.stops; totDone+=o.done; });
      if(totStops+totDone===0){ el.innerHTML='<div class="card"><b>📊 Your last 2 weeks</b><div style="margin-top:8px;color:var(--muted);font-size:13px">Your stops and completions chart here as you work your days.</div></div>'; return; }
      var rate=totStops?Math.round(100*totDone/totStops):0;
      el.innerHTML='<div class="card">'+
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><b>📊 Your last 2 weeks</b>'+
        '<span style="font-size:12px;color:var(--muted)"><b style="color:#12a150">'+totDone+'</b> done · '+totStops+' stops · '+rate+'% closed</span></div>'+
        '<div style="display:flex;gap:14px;font-size:11.5px;font-weight:800;margin-bottom:6px"><span style="color:#12a150">■ Completions</span><span style="color:#0aa5c4">■ Stops</span></div>'+
        buildStatsChart(days)+'</div>';
    }).catch(function(){ el.innerHTML=''; });
  }
  function buildStatsChart(days){
    var maxV=1; days.forEach(function(o){ maxV=Math.max(maxV,o.stops,o.done); });
    var GW=26, BW=9, GAP=3, H=150, PAD=22, top=10, plotH=H-PAD-top, W=days.length*GW+8;
    var bars='', labels='';
    days.forEach(function(o,i){
      var x=6+i*GW;
      var sH=Math.round(o.stops/maxV*plotH), dH=Math.round(o.done/maxV*plotH);
      bars+='<rect x="'+x+'" y="'+(top+plotH-sH)+'" width="'+BW+'" height="'+sH+'" rx="2" fill="url(#gStop)"/>';
      bars+='<rect x="'+(x+BW+GAP)+'" y="'+(top+plotH-dH)+'" width="'+BW+'" height="'+dH+'" rx="2" fill="url(#gDone)"/>';
      if(i%2===0) labels+='<text x="'+(x+BW)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" fill="#8a95a0">'+o.dom+'</text>';
    });
    return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:100%;min-width:'+Math.min(W,360)+'px;height:auto;display:block" role="img" aria-label="Stops and completions over the last two weeks">'+
      '<defs>'+
        '<linearGradient id="gDone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ef07a"/><stop offset="1" stop-color="#0f9e46"/></linearGradient>'+
        '<linearGradient id="gStop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ddcf5"/><stop offset="1" stop-color="#0a91b1"/></linearGradient>'+
      '</defs>'+
      '<line x1="0" y1="'+(top+plotH)+'" x2="'+W+'" y2="'+(top+plotH)+'" stroke="#8a95a044" stroke-width="1"/>'+
      bars+labels+'</svg></div>';
  }

  // 💸 Payday celebration: fires when this tech's PAID total rises since last view. Baseline
  // is set silently on first load (no false pop). If he's the leaderboard leader → fireworks
  // + his achievements flash; otherwise a solid "You got paid" confetti pop.
  function maybeCelebratePayout(){
    if(!myTech || !payState || !crownState || _payoutDone) return;
    _payoutDone = true;
    var key='tn_paid_'+myTech.id, cur=payState.paid_cents||0;
    var last; try{ last=parseInt(localStorage.getItem(key),10); }catch(e){ last=NaN; }
    try{ localStorage.setItem(key,String(cur)); }catch(e){}
    if(isNaN(last) || cur<=last) return;            // first load = baseline only; no rise = nothing
    var delta=cur-last; if(!window.antCelebrate) return;
    var leader=crownState.length>0;
    var tiles=[{value:money(delta),label:'Just paid',accent:'#4ade80'}];
    if(leader) tiles.unshift({value:'🥇 #1',label:crownState[0].icon+' '+crownState[0].title,accent:'#ffd400'});
    try{ window.antCelebrate({
      tag: leader?'CHAMPION PAYDAY':'Payday',
      big: leader?'💥 PAID & #1! 💥':'YOU GOT PAID '+money(delta)+' 💸',
      sub: leader?('Top of the board — '+crownState.map(function(c){return c.title;}).join(' + ')):'Nice work — keep it rolling',
      tiles: tiles.slice(0,2), cue:'win', sound:'both' }); }catch(_){ }
  }

  // 🌴 Days off — the tech marks their own PTO; the office dispatch board greys those days so
  // they never get booked when they're not working. Same tenant table the board reads.
  function loadTimeOff(){
    var card=document.getElementById('timeoffCard'); if(!card||!myTech) return;
    var todayIso=new Date(new Date().getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
    sb.from('tech_time_off').select('id,day').eq('technician_id',myTech.id).gte('day',todayIso).order('day').then(function(r){
      if(r.error){ card.innerHTML=''; return; }   // table not migrated yet → hide silently
      var rows=r.data||[];
      var list=rows.length ? rows.map(function(o){ var d=new Date(o.day+'T12:00:00');
        return '<div class="torow"><span>'+esc(d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))+'</span><button class="tox" data-tooff="'+esc(o.id)+'">✕</button></div>'; }).join('')
        : '<div class="note" style="margin:0">No days off scheduled. Add one so the office won\'t book you.</div>';
      card.innerHTML='<div class="card"><div style="font-weight:800;margin-bottom:9px">🌴 Your days off</div>'+list+
        '<div class="torow" style="margin-top:10px;gap:8px"><input type="date" id="toDay" min="'+todayIso+'" style="flex:1;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit"><button class="toadd" id="toAdd">Add day off</button></div></div>';
      var add=document.getElementById('toAdd'); if(add) add.onclick=function(){
        var d=document.getElementById('toDay').value; if(!d) return; add.disabled=true; add.textContent='Adding…';
        sb.from('tech_time_off').insert({company_id:me.company_id, technician_id:myTech.id, day:d}).then(function(rr){
          add.disabled=false; add.textContent='Add day off';
          if(rr.error && !/duplicate|unique/i.test(rr.error.message||'')){ alert(rr.error.message); return; } loadTimeOff();
        });
      };
      Array.prototype.forEach.call(card.querySelectorAll('[data-tooff]'), function(b){ b.onclick=function(){
        sb.from('tech_time_off').delete().eq('id',b.getAttribute('data-tooff')).then(function(rr){ if(rr.error){ alert(rr.error.message); return; } loadTimeOff(); });
      }; });
    });
  }
  function loadJobs(){
    var q = sb.from('job').select(
      'id,status,problem,scheduled_day,availability,waiver_name,waiver_signed_at,customer_id,' +
      'customer:customer_id(first_name,last_name,phone,address,city,state,zip),unit:unit_id(label,attributes),' +
      'media:job_media(kind,provider,ref,label),tdr:job_tdr(brand,model,failed_component,part_number,part_status,root_cause,labor_hours,notes,outcome,held)'
    ).not('status','in','(completed,canceled)').order('scheduled_day',{ascending:true,nullsFirst:false});
    if (myTech) q = q.eq('technician_id', myTech.id);   // my jobs; else (owner/office demo) all open jobs
    q.then(function(r){
      if (r.error) { document.getElementById('body').innerHTML = '<div class="note">Couldn\'t load jobs: '+esc(r.error.message)+'</div>'; return; }
      renderJobs(r.data||[]);
    });
  }

  function boot(){
    // resolve "me" (RLS lets me read my own company's app_users → my row) + my technician link
    sb.auth.getUser().then(function(u){
      var uid = u && u.data && u.data.user ? u.data.user.id : null;
      sb.from('app_user').select('id,name,role,company_id').eq('auth_user_id', uid).limit(1).then(function(r){
        me = (r.data && r.data[0]) || null;
        if (!me) { shell('<div class="note">Your login isn\'t attached to a shop yet. Ask the office to add you.</div>'); return; }
        sb.from('technician').select('id,name,commission_type,commission_pct,commission_flat_cents').eq('app_user_id', me.id).limit(1).then(function(t){
          myTech = (t.data && t.data[0]) || null;
          shell('<div class="empty">Loading your day…</div>');
          mountAntDock();
          sb.from('company').select('settings,trade').limit(1).then(function(c){ var co=(c.data&&c.data[0])||{}; companySettings = co.settings || {}; companyTrade = co.trade || ''; loadJobs(); });
        });
      });
    });
  }

  // ---- Ant dock (tech / money-maker): your money, your day, and "what usually fixes this."
  // Can also put in a day-off request for you. Talks to platform-ant (tech-scoped, your data only).
  var antHist=[];
  function sessTok(){ return sb.auth.getSession().then(function(s){ return (s&&s.data&&s.data.session&&s.data.session.access_token)||''; }); }
  function antAsk(message){ return sessTok().then(function(tok){ return fetch('/.netlify/functions/platform-ant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:tok,message:message,history:antHist.slice(-8)})}).then(function(r){return r.json();}).catch(function(){return {ok:false,error:'network'};}); }); }
  function mountAntDock(){
    if(window.__antMounted) return; window.__antMounted=true;
    var fab=document.createElement('button'); fab.className='antfab'; fab.title='Ask Ant'; fab.textContent='🐜'; document.body.appendChild(fab);
    var pan=document.createElement('div'); pan.className='antpanel';
    pan.innerHTML=
      '<div class="aph"><div class="m">🐜</div><div><h4>Ant</h4><p>Your money, your day, your fixes</p></div><button class="x" title="Close">×</button></div>'+
      '<div class="athread" id="athread"><div class="abub ant">What\'s up 🐜 — I\'ve got your back. Ask me <b>“how much have I made this month?”</b>, <b>“what\'s owed to me?”</b>, or <b>“what usually fixes a Whirlpool dryer with no heat?”</b> Need a day off? Just tell me and I\'ll put it in.</div></div>'+
      '<div class="aquick"><button data-say="How much have I made this month, and what\'s owed to me?">My money</button><button data-say="What\'s on my plate today?">My day</button><button data-say="What usually fixes a dryer that won\'t heat?">Fix help</button></div>'+
      '<form class="acomp" id="acomp"><input id="aask" placeholder="Ask Ant…" autocomplete="off"><button class="s" type="submit" title="Send">↑</button></form>';
    document.body.appendChild(pan);
    var thread=pan.querySelector('#athread');
    fab.onclick=function(){ pan.classList.toggle('open'); if(pan.classList.contains('open')) pan.querySelector('#aask').focus(); };
    pan.querySelector('.x').onclick=function(){ pan.classList.remove('open'); };
    function bub(html,who){ var d=document.createElement('div'); d.className='abub '+who; d.innerHTML=html; thread.appendChild(d); thread.scrollTop=thread.scrollHeight; return d; }
    function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
    function send(text){
      if(!text) return; antHist.push({role:'user',content:text}); bub(esc(text),'me');
      var typing=document.createElement('div'); typing.className='atype'; typing.innerHTML='<span></span><span></span><span></span>'; thread.appendChild(typing); thread.scrollTop=thread.scrollHeight;
      antAsk(text).then(function(r){ typing.remove(); if(!r||!r.ok){ bub('Sorry — snag: '+esc((r&&r.error)||'try again')+'.','ant'); return; } antHist.push({role:'assistant',content:r.reply||''}); bub(md(r.reply||'Got it.'),'ant'); });
    }
    Array.prototype.forEach.call(pan.querySelectorAll('.aquick button'), function(b){ b.onclick=function(){ pan.classList.add('open'); send(b.getAttribute('data-say')); }; });
    pan.querySelector('#acomp').addEventListener('submit',function(e){ e.preventDefault(); var i=pan.querySelector('#aask'); var v=i.value.trim(); i.value=''; send(v); });
  }

  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) boot(); else renderSignIn(); });
})();
</script>
<script src="/platform/ant-nav.js"></script>
