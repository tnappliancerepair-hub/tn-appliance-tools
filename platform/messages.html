<!doctype html><html lang="en" data-live="1"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Messages — Ant</title>
<!--
  Ant platform — MESSAGES (the shared conversation, Supabase / ANT Platforms).

  Danielle's ask, verbatim: "there's no place to make or see a scroll of all of our text
  messages between us and the customer." The office board only ever showed a per-JOB slice
  inside a drawer. This is the whole scroll: every conversation with a person, across all
  their jobs, in one living page — and a box to text anyone freely, job or no job.

  ONE THREAD, THREE SEATS. Everything here writes to thread_message, the same table the
  tech's job page and the customer's portal read. Office texts, tech texts, and the
  customer's own replies all land in one scroll all three can read back later.

  Left = conversations (whoever spoke last floats up, and a customer reply is flagged so
  nobody's text sits unanswered). Right = the thread + the compose box. Polls every 15s so
  it stays live while it's open.
-->
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:9px;padding:11px 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header .brand{font-weight:800}
  header .sp{flex:1}
  nav.hop{display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
  nav.hop a{color:var(--brand);text-decoration:none;font-weight:700}
  .gate{max-width:340px;margin:60px auto;padding:0 18px}
  .gate label{display:block;margin:10px 0 4px;font-size:13px;font-weight:700}
  .gate input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
  button.primary{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;font-size:15px;cursor:pointer}
  .err{color:#b91c1c;font-size:13px;margin-top:8px;min-height:18px}

  .split{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 96px)}
  @media (max-width:820px){ .split{grid-template-columns:1fr} .split.viewing .listcol{display:none} .split:not(.viewing) .threadcol{display:none} }

  .listcol{border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .srch{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:9px}
  .conv{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--card,var(--bg));padding:10px 12px;margin-bottom:7px;cursor:pointer;color:inherit}
  .conv:hover{border-color:var(--brand)}
  .conv.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--ring,rgba(120,90,255,.25))}
  .conv .top{display:flex;align-items:baseline;gap:8px}
  .conv .nm{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .ago{font-size:11.5px;opacity:.65;flex:0 0 auto}
  .conv .pv{font-size:13px;opacity:.78;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .conv .flag{display:inline-block;font-size:11px;font-weight:800;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;border-radius:999px;padding:1px 7px;margin-top:5px}

  .threadcol{display:flex;flex-direction:column;min-width:0}
  .thead{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .thead .who{font-weight:800;font-size:17px}
  .thead .meta{font-size:12.5px;opacity:.7}
  .thead a{color:var(--brand);text-decoration:none;font-weight:700;font-size:13px}
  .scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:76%;padding:8px 11px;border-radius:13px;font-size:14px;line-height:1.42;white-space:pre-wrap;word-break:break-word}
  .bub .by{display:block;font-size:11px;font-weight:800;opacity:.72;margin-bottom:2px}
  .bub .at{display:block;font-size:10.5px;opacity:.55;margin-top:3px}
  .b-in{align-self:flex-start;background:#e5edff;color:#12224a;border-bottom-left-radius:4px}
  .b-out{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .b-sys{align-self:center;background:transparent;border:1px dashed var(--line);opacity:.8;font-size:12.5px;max-width:88%;text-align:center}
  .daysep{align-self:center;font-size:11.5px;font-weight:800;opacity:.55;margin:6px 0 2px}
  .composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;min-height:44px;max-height:150px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;resize:vertical}
  .cmsg{font-size:12.5px;padding:0 12px 8px;min-height:18px}
  .empty{padding:36px 18px;text-align:center;opacity:.7}
</style>
<link rel="stylesheet" href="/platform/ant-theme.css">
<link rel="stylesheet" href="/platform/skin-jackpot.css">
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<script src="/platform/config.js"></script>
<script src="/platform/vendor/supabase-js.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>
<script src="/platform/vendor/supa-guard.js"></script>
<script src="/platform/vendor/boot-watchdog.js"></script>
<script>
(function(){
  var app=document.getElementById('app');
  var cfg=window.ANT_SUPABASE||{}; var sb=null;
  var convs=[], curId=null, curName='', poll=null, sending=false;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function tokenThen(fn){ sb.auth.getSession().then(function(s){ var t=s&&s.data&&s.data.session&&s.data.session.access_token; if(t) fn(t); }); }
  function api(doo, payload){
    return new Promise(function(res){
      tokenThen(function(tok){
        fetch('/.netlify/functions/platform-messages?do='+doo,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify(Object.assign({access_token:tok},payload||{}))})
          .then(function(r){return r.json();}).then(res).catch(function(){ res({ok:false,error:'network'}); });
      });
    });
  }
  function ago(iso){
    var t=Date.parse(iso); if(isNaN(t)) return '';
    var m=Math.floor((Date.now()-t)/60000);
    if(m<1) return 'now'; if(m<60) return m+'m'; var h=Math.floor(m/60);
    if(h<24) return h+'h'; var d=Math.floor(h/24); if(d<7) return d+'d';
    return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  function clock(iso){ try{ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }catch(_){ return ''; } }
  function dayKey(iso){ try{ return new Date(iso).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}); }catch(_){ return ''; } }

  // Who spoke — the whole point of one shared thread is knowing which of the three seats
  // said it. sender is 'office:Name' / 'tech:Name' / 'customer' / 'system' / 'ann'.
  function speaker(m){
    var s=String(m.sender||'').trim();
    if(m.direction==='in') return s && s!=='customer' ? s : 'Customer';
    if(/^office:/i.test(s)) return '🏢 '+s.slice(7);
    if(/^tech:/i.test(s))   return '🔧 '+s.slice(5);
    if(s==='office') return '🏢 Office';
    if(s==='tech')   return '🔧 Tech';
    if(s==='ann')    return '🐜 Ann';
    if(s==='system') return 'Ant';
    return s||'Us';
  }
  function isSystem(m){ var s=String(m.sender||''); return m.direction==='out' && (s==='system'||s==='ann'); }

  function bubble(m){
    var cls = isSystem(m) ? 'b-sys' : (m.direction==='in' ? 'b-in' : 'b-out');
    return '<div class="bub '+cls+'">'+
      (cls==='b-sys' ? '' : '<span class="by">'+esc(speaker(m))+'</span>')+
      esc(m.body||'')+
      '<span class="at">'+esc(clock(m.created_at))+'</span></div>';
  }

  // ── the conversation list ──
  function convRow(c){
    return '<button class="conv'+(c.customer_id===curId?' on':'')+'" data-c="'+esc(c.customer_id)+'">'+
      '<div class="top"><span class="nm">'+esc(c.name)+'</span><span class="ago">'+esc(ago(c.last_at))+'</span></div>'+
      '<div class="pv">'+esc(c.last_body||'')+'</div>'+
      (c.needs_reply?'<span class="flag">← they replied</span>':'')+
    '</button>';
  }
  function paintList(){
    var box=document.getElementById('convlist'); if(!box) return;
    box.innerHTML = convs.length ? convs.map(convRow).join('')
      : '<div class="empty">No conversations yet.<br>Search a name above to text someone.</div>';
    box.querySelectorAll('.conv[data-c]').forEach(function(el){
      el.onclick=function(){ openThread(el.getAttribute('data-c')); };
    });
  }
  function loadList(){
    api('list',{}).then(function(d){
      if(!d.ok) return;
      convs=d.conversations||[]; paintList();
    });
  }

  // ── one person's whole scroll ──
  function openThread(cid){
    curId=cid;
    document.querySelector('.split').classList.add('viewing');
    paintList();
    var head=document.getElementById('thead'), sc=document.getElementById('scroll');
    if(sc) sc.innerHTML='<div class="empty">Loading…</div>';
    api('thread',{customer:cid}).then(function(d){
      if(!d.ok){ if(sc) sc.innerHTML='<div class="empty">Couldn\'t open that conversation.</div>'; return; }
      var c=d.customer||{}; curName=c.name||'Customer';
      var openJob=(d.jobs||[]).filter(function(j){ return j.status!=='completed'&&j.status!=='canceled'; })[0];
      if(head) head.innerHTML=
        '<button id="backlist" style="border:0;background:transparent;color:var(--brand);font-weight:800;cursor:pointer;font-size:15px">‹</button>'+
        '<div style="min-width:0"><div class="who">'+esc(curName)+'</div>'+
        '<div class="meta">'+esc(c.phone||'no phone on file')+(c.city?' · '+esc(c.city):'')+' · '+(d.jobs||[]).length+' job'+((d.jobs||[]).length===1?'':'s')+'</div></div>'+
        '<span class="sp" style="flex:1"></span>'+
        (openJob?'<a href="/platform/office-board.html?job='+esc(openJob.id)+'">Open the job ↗</a>':'');
      var bk=document.getElementById('backlist');
      if(bk) bk.onclick=function(){ document.querySelector('.split').classList.remove('viewing'); };
      renderScroll(d.messages||[]);
      var ta=document.getElementById('ctext'); if(ta) ta.focus();
    });
  }
  function renderScroll(msgs){
    var sc=document.getElementById('scroll'); if(!sc) return;
    if(!msgs.length){ sc.innerHTML='<div class="empty">Nothing yet — send the first text below.</div>'; return; }
    var out='', lastDay='';
    msgs.forEach(function(m){
      var dk=dayKey(m.created_at);
      if(dk!==lastDay){ out+='<div class="daysep">'+esc(dk)+'</div>'; lastDay=dk; }
      out+=bubble(m);
    });
    sc.innerHTML=out; sc.scrollTop=sc.scrollHeight;
  }

  function send(){
    if(sending||!curId) return;
    var ta=document.getElementById('ctext'); var msg=document.getElementById('cmsg');
    var text=(ta.value||'').trim(); if(!text) return;
    sending=true; var btn=document.getElementById('csend'); btn.disabled=true; btn.textContent='Sending…';
    if(msg) msg.textContent='';
    api('send',{customer:curId, body:text}).then(function(d){
      sending=false; btn.disabled=false; btn.textContent='Send';
      if(!d.ok){ if(msg) msg.textContent='Did NOT send — '+esc(d.error||'try again'); return; }
      ta.value='';
      // Say plainly when it was filed but the carrier didn't take it — a text nobody
      // received must never look delivered.
      if(msg) msg.textContent = d.texted ? '' :
        (d.no_phone ? 'Saved to the thread — no phone on file, so nothing was texted.'
                    : 'Saved to the thread, but the text did NOT go out.');
      openThread(curId); loadList();
    });
  }

  // ── search anyone, job or no job ──
  function wireSearch(){
    var s=document.getElementById('srch'); if(!s) return; var t=null;
    s.oninput=function(){
      clearTimeout(t);
      var q=(s.value||'').trim();
      if(q.length<2){ loadList(); return; }
      t=setTimeout(function(){
        api('search',{q:q}).then(function(d){
          if(!d.ok) return;
          var box=document.getElementById('convlist'); if(!box) return;
          box.innerHTML=(d.customers||[]).length
            ? (d.customers||[]).map(function(c){
                return '<button class="conv" data-c="'+esc(c.id)+'"><div class="top"><span class="nm">'+esc(c.name)+'</span></div>'+
                       '<div class="pv">'+esc(c.phone||'no phone')+(c.city?' · '+esc(c.city):'')+'</div></button>'; }).join('')
            : '<div class="empty">Nobody by that name.</div>';
          box.querySelectorAll('.conv[data-c]').forEach(function(el){ el.onclick=function(){ openThread(el.getAttribute('data-c')); }; });
        });
      },260);
    };
  }

  function shell(){
    app.innerHTML=
      '<header><span class="brand">💬 Messages</span><span class="sp"></span>'+
        '<button id="refresh" style="border:1px solid var(--line);background:transparent;color:inherit;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer">Refresh</button></header>'+
      '<nav class="hop" aria-label="Jump to">'+
        '<a href="/platform/office-board.html">🗂 Board</a>'+
        '<a href="/platform/dispatch.html">📅 Dispatch</a>'+
        '<a href="/platform/needs-scheduled.html">🗓 Needs Scheduled</a>'+
        '<a href="/platform/comms.html">⚙️ Auto-texts</a>'+
        '<a href="/platform/owner.html">💰 Owner</a>'+
      '</nav>'+
      '<div class="split">'+
        '<div class="listcol">'+
          '<input class="srch" id="srch" type="search" autocomplete="off" placeholder="🔍 Search anyone to text — name or phone">'+
          '<div id="convlist"><div class="empty">Loading…</div></div>'+
        '</div>'+
        '<div class="threadcol">'+
          '<div class="thead" id="thead"><div class="meta">Pick a conversation, or search anyone to start one.</div></div>'+
          '<div class="scroll" id="scroll"><div class="empty">The whole conversation with a customer shows here — office, tech, and their replies, in one scroll.</div></div>'+
          '<div class="composer"><textarea id="ctext" placeholder="Write a text…"></textarea><button class="primary" id="csend">Send</button></div>'+
          '<div class="cmsg" id="cmsg"></div>'+
        '</div>'+
      '</div>';
    document.getElementById('refresh').onclick=function(){ loadList(); if(curId) openThread(curId); };
    document.getElementById('csend').onclick=send;
    document.getElementById('ctext').addEventListener('keydown',function(e){
      if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); send(); }
    });
    wireSearch();
  }

  function renderSignIn(msg){
    app.innerHTML='<div class="gate"><h1>💬 Messages</h1><p>Sign in to your shop.</p>'+
      '<label>Email</label><input id="em" type="email" autocomplete="username">'+
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password">'+
      '<button class="primary" id="go">Sign in</button><div class="err" id="err">'+esc(msg||'')+'</div></div>';
    var go=document.getElementById('go');
    function submit(){
      var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
      if(!em||!pw){ document.getElementById('err').textContent='Enter email and password.'; return; }
      go.disabled=true; go.textContent='Signing in…';
      sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){ if(r.error) renderSignIn(r.error.message); else boot(); });
    }
    go.onclick=submit;
    document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  }

  function boot(){
    shell(); loadList();
    // Deep-link straight into one person: messages.html?customer=<id>
    var m=(location.search||'').match(/[?&]customer=([0-9a-f-]{36})/i);
    if(m) openThread(m[1]);
    // A living document — keep the open thread and the list current while it's up.
    if(poll) clearInterval(poll);
    poll=setInterval(function(){
      if(document.hidden) return;
      loadList();
      var ta=document.getElementById('ctext');
      if(curId && !(ta && ta.value.trim())) openThread(curId);   // never wipe a draft mid-type
    },15000);
  }

  sb=window.supabase.createClient(cfg.url,cfg.anonKey);
  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) boot(); else renderSignIn(); });
})();
</script>
</body>
</html>
