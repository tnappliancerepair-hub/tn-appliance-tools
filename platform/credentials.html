<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credentials &amp; Insurance</title>
<style>
  :root{ --bg:#f6f7f4; --panel:#fff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd; --brand:#3f8f24; --brand-ink:#fff; --chip:#eef2e8; --good:#3f8f24; --warn:#b45309; --bad:#b4472e; --shadow:0 1px 2px rgba(20,30,10,.06),0 4px 14px rgba(20,30,10,.05); }
  @media(prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --brand:#5bb537; --chip:#20281a; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); } }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:5}
  .brand{font-weight:800} .who{color:var(--muted);font-size:13px} .sp{flex:1}
  header button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  .lede{color:var(--muted);font-size:14px;margin:2px 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 4px;font-size:15px} .card .h-sub{color:var(--muted);font-size:13px;margin-bottom:12px}
  label{display:block;font-weight:700;font-size:12.5px;margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
  input[type=file]{padding:8px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .primary{background:var(--brand);color:var(--brand-ink);border:none;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;font-size:14px;margin-top:12px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 11px;font-weight:700;font-size:12.5px;cursor:pointer}
  .btn.bad{color:var(--bad)}
  .cred{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)} .cred:first-child{border-top:0}
  .cred .info{flex:1;min-width:0} .cred .k{font-weight:700} .cred .fn{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .s-good{color:var(--good);background:var(--chip)} .s-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)} .s-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)} .s-none{color:var(--muted);background:var(--chip)}
  .share{display:flex;gap:8px;align-items:center} .share input{font-size:12.5px;background:var(--chip)}
  .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em} .ok{color:var(--good)}
  .empty{color:var(--muted);font-size:13.5px;padding:8px 0}
  .gate{max-width:340px;margin:64px auto;padding:0 20px;text-align:center} .gate input{margin-bottom:8px;text-align:left}
  .badge-pitch{font-size:12.5px;color:var(--muted);margin-top:8px}
</style></head>
<body>
<div id="app"></div>
<script src="/platform/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var app=document.getElementById('app');
  var cfg=window.ANT_SUPABASE||{}; var sb=null, company=null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  var KIND={ coi_gl:'General Liability (COI)', coi_wc:"Workers' Comp (COI)", coi_auto:'Commercial Auto (COI)', license:'Business License', w9:'W-9', cert:'Certification', other:'Other' };

  if(!cfg.url||!cfg.anonKey){ app.innerHTML='<div class="gate"><h1>🐜 Not connected</h1><p>config.js needs the Supabase URL + key.</p></div>'; return; }
  sb=window.supabase.createClient(cfg.url,cfg.anonKey);

  function token(){ return sb.auth.getSession().then(function(r){ return (r.data&&r.data.session&&r.data.session.access_token)||''; }); }
  function api(doo, body){ return token().then(function(tok){ return fetch('/.netlify/functions/platform-credentials?do='+doo,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({access_token:tok},body||{}))}).then(function(r){return r.json();}); }); }

  function renderSignIn(msg){
    app.innerHTML='<div class="gate"><h1>🐜 Credentials &amp; Insurance</h1><p>Sign in to manage your shop\'s documents.</p>'+
      '<label>Email</label><input id="em" type="email" autocomplete="username">'+
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password">'+
      '<button class="primary" id="go" style="width:100%">Sign in</button><div class="err" id="err">'+esc(msg||'')+'</div></div>';
    var go=document.getElementById('go');
    function submit(){ var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value; if(!em||!pw){document.getElementById('err').textContent='Enter your email and password.';return;} go.disabled=true; go.textContent='Signing in…'; sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){ if(r.error) renderSignIn(r.error.message); else boot(); }); }
    go.onclick=submit; document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  }

  function statusOf(exp){
    if(!exp) return {c:'s-none',t:'No expiry'};
    var d=new Date(exp+'T12:00:00').getTime(), now=Date.now();
    var days=Math.ceil((d-now)/86400000);
    if(days<0) return {c:'s-bad',t:'Expired'};
    if(days<=30) return {c:'s-warn',t:'Expires in '+days+'d'};
    return {c:'s-good',t:'Current · exp '+new Date(exp+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
  }

  function render(items){
    var slug=(company&&company.slug)||'';
    var verifyUrl=location.origin+'/verify.html?c='+encodeURIComponent(slug);
    var rows=(items||[]).map(function(k){
      var s=statusOf(k.expires_on);
      return '<div class="cred"><div class="info"><div class="k">'+esc(KIND[k.kind]||k.kind)+(k.label?' — '+esc(k.label):'')+'</div><div class="fn">'+esc(k.file_name||'')+'</div></div>'+
        '<span class="status '+s.c+'">'+esc(s.t)+'</span>'+
        '<button class="btn" data-dl="'+k.id+'">Download</button><button class="btn bad" data-del="'+k.id+'">✕</button></div>';
    }).join('') || '<div class="empty">No documents yet. Add your COI, license, and W-9 above.</div>';

    app.innerHTML=
      '<header><span class="brand">🐜 Credentials &amp; Insurance</span><span class="who">'+esc((company&&company.name)||'')+'</span><span class="sp"></span><button id="out">Sign out</button></header>'+
      '<div class="wrap">'+
        '<div class="lede">Keep your COI, license, and W-9 current here — then share proof in one tap to win property-manager and home-warranty work.</div>'+

        '<div class="card"><h2>📤 Add a document</h2><div class="h-sub">Certificate of Insurance (GL / Workers\' Comp / Auto), business license, W-9, or a certification.</div>'+
          '<label>Type</label><select id="f-kind"><option value="coi_gl">General Liability (COI)</option><option value="coi_wc">Workers\' Comp (COI)</option><option value="coi_auto">Commercial Auto (COI)</option><option value="license">Business License</option><option value="w9">W-9</option><option value="cert">Certification</option><option value="other">Other</option></select>'+
          '<div class="row2"><div><label>Label (optional)</label><input id="f-label" placeholder="e.g. Hiscox GL"></div><div><label>Expires on</label><input id="f-exp" type="date"></div></div>'+
          '<label>Policy # (optional, private)</label><input id="f-pol" placeholder="never shown publicly">'+
          '<label>File (PDF or image, 8MB max)</label><input id="f-file" type="file" accept="application/pdf,image/*">'+
          '<button class="primary" id="f-go">Upload</button><div class="err" id="f-err"></div>'+
        '</div>'+

        '<div class="card"><h2>🔗 Share your proof of insurance</h2><div class="h-sub">Send this link to a property manager or warranty company to get approved as a vendor.</div>'+
          '<div class="share"><input id="verify-url" readonly value="'+esc(verifyUrl)+'"><button class="btn" id="copy">Copy</button></div>'+
          '<div class="badge-pitch">This shows what you carry and that it\'s current — never your policy numbers or the files themselves.</div>'+
        '</div>'+

        '<div class="card"><h2>📁 Your documents</h2>'+rows+'</div>'+
      '</div>';

    document.getElementById('out').onclick=function(){ sb.auth.signOut().then(renderSignIn); };
    document.getElementById('copy').onclick=function(){ var i=document.getElementById('verify-url'); i.select(); try{document.execCommand('copy');}catch(_){} this.textContent='Copied ✓'; var b=this; setTimeout(function(){b.textContent='Copy';},1500); };
    document.getElementById('f-go').onclick=upload;
    Array.prototype.forEach.call(document.querySelectorAll('[data-dl]'),function(b){ b.onclick=function(){ b.disabled=true; b.textContent='…'; api('download',{id:b.getAttribute('data-dl')}).then(function(d){ b.disabled=false; b.textContent='Download'; if(d&&d.ok&&d.url) window.open(d.url,'_blank'); }); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){ b.onclick=function(){ if(!confirm('Remove this document?'))return; b.disabled=true; api('delete',{id:b.getAttribute('data-del')}).then(function(d){ if(d&&d.ok) load(); else b.disabled=false; }); }; });
  }

  function upload(){
    var err=document.getElementById('f-err'); err.textContent=''; err.className='err';
    var fileEl=document.getElementById('f-file'); var file=fileEl.files&&fileEl.files[0];
    if(!file){ err.textContent='Choose a file first.'; return; }
    if(file.size>8*1024*1024){ err.textContent='File is over 8MB — please upload a smaller PDF/image.'; return; }
    var btn=document.getElementById('f-go'); btn.disabled=true; btn.textContent='Uploading…';
    var reader=new FileReader();
    reader.onload=function(){
      api('upload',{ kind:document.getElementById('f-kind').value, label:document.getElementById('f-label').value,
        expires_on:document.getElementById('f-exp').value, policy_number:document.getElementById('f-pol').value,
        file_b64:reader.result, file_name:file.name, content_type:file.type||'application/octet-stream' })
      .then(function(d){ btn.disabled=false; btn.textContent='Upload';
        if(d&&d.ok){ err.className='ok'; err.textContent='Added ✓'; load(); }
        else { err.textContent=(d&&d.error)||'Upload failed — try again.'; } });
    };
    reader.onerror=function(){ btn.disabled=false; btn.textContent='Upload'; err.textContent='Couldn\'t read that file.'; };
    reader.readAsDataURL(file);
  }

  function load(){ api('list',{}).then(function(d){ render((d&&d.items)||[]); }); }

  function boot(){
    sb.from('company').select('id,name,slug').limit(1).then(function(r){
      if(!r.error&&r.data&&r.data[0]) company=r.data[0];
      load();
    });
  }

  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) boot(); else renderSignIn(); });
})();
</script>
</body></html>
