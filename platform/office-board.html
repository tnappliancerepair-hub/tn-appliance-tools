      var m0=new Date(); m0=new Date(m0.getFullYear(),m0.getMonth(),1).getTime();
      var collected=0,invoiced=0,tax=0,due=0,tips=0,n=0;
      Object.keys(invByJob).forEach(function(k){ var iv=invByJob[k]; var t=iv.paid_at?new Date(iv.paid_at).getTime():new Date(iv.created_at||0).getTime();
        if(per==='month' && t<m0) return; n++;
        var tip=iv.tip_cents||0; var net=(iv.total_cents||0)-tip;   // tips pass through to the tech — not shop revenue
        tips+=tip; invoiced+=net; tax+=iv.tax_cents||0; if(iv.status==='paid'){collected+=net;} else {due+=net;}
      });
      var tipRow = tips>0 ? '<div class="tr" style="color:#12a150"><span>Tips (to techs · not revenue)</span><span>'+money(tips)+'</span></div>' : '';
      document.getElementById('finBody').innerHTML='<div class="totals"><div class="tr"><span>Invoices</span><span>'+n+'</span></div><div class="tr"><span>Collected</span><span>'+money(collected)+'</span></div><div class="tr"><span>Outstanding</span><span>'+money(due)+'</span></div><div class="tr"><span>Sales tax collected</span><span>'+money(tax)+'</span></div>'+tipRow+'<div class="tr grand"><span>Invoiced (shop revenue)</span><span>'+money(invoiced)+'</span></div></div><div class="sub" style="margin-top:8px;font-size:12.5px;color:var(--muted)">Tips pass 100% to the tech and are excluded from shop revenue. Export the CSV for your bookkeeper — one row per invoice with labor, parts, tax, tips and net totals.</div>';
    };
    document.getElementById('finPer').onchange=render; render();
    document.getElementById('finCsv').onclick=exportCsv;
  }

  function exportCsv(){
    // pull line detail across all invoices, then build a per-invoice CSV
    var ids=Object.keys(invByJob).map(function(k){return invByJob[k].id;});
    sb.from('invoice_line').select('invoice_id,kind,unit_cents,qty').in('invoice_id', ids.length?ids:['00000000-0000-0000-0000-000000000000']).then(function(r){
      var byInv={}; (r.data||[]).forEach(function(l){ var b=byInv[l.invoice_id]=byInv[l.invoice_id]||{labor:0,part:0,fee:0,shipping:0}; b[l.kind]=(b[l.kind]||0)+Math.round((l.unit_cents||0)*(l.qty||1)); });
      var head=['Date','Customer','Appliance','Labor','Parts','Shipping','Fee','Subtotal','Tax','Tip','Total','Net (shop)','Status','Method'];
      var rows=[head.join(',')];
      jobsCache.forEach(function(j){ var iv=invByJob[j.id]; if(!iv) return; var b=byInv[iv.id]||{labor:0,part:0,fee:0,shipping:0};
        var d=iv.paid_at||iv.created_at||''; d=d?new Date(d).toISOString().slice(0,10):'';
        var cust=(fullName(j.customer)||'Customer').replace(/"/g,'""');
        var appl=((j.unit&&j.unit.label)||'').replace(/"/g,'""');
        var tip=iv.tip_cents||0; var net=(iv.total_cents||0)-tip;   // shop revenue excludes the tip
        rows.push([d,'"'+cust+'"','"'+appl+'"',(b.labor/100).toFixed(2),(b.part/100).toFixed(2),((b.shipping||0)/100).toFixed(2),(b.fee/100).toFixed(2),((iv.subtotal_cents||0)/100).toFixed(2),((iv.tax_cents||0)/100).toFixed(2),(tip/100).toFixed(2),((iv.total_cents||0)/100).toFixed(2),(net/100).toFixed(2),iv.status||'',iv.paid_method||''].join(','));
      });
      var blob=new Blob([rows.join('\n')],{type:'text/csv'}); var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=(shopName||'shop').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-invoices.csv'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); try{document.body.removeChild(a);}catch(e){} },1500);
    });
  }

  // The shop's techs — loaded once at boot so the drawer can assign/reassign a job.
  var techsCache = [];
  function loadTechs() {
    sb.rpc('company_roster').then(function (r) {
      if (r.error) return; techsCache = (r.data || []).filter(function (t) { return t.active !== false; });
    });
  }
  function techOptions(sel) {
    return techsCache.map(function (t) {
      return '<option value="' + t.id + '"' + (String(t.id) === String(sel) ? ' selected' : '') + '>' + esc(t.name || ('Tech ' + t.id)) + '</option>';
    }).join('');
  }

  function loadBoard() {
    // RLS scopes every query to the logged-in user's company — we never pass company_id.
    // The dense card needs the warranty/parts/report/stop columns; customer.city rides along
    // for the 📍 chip. All are from applied migrations (033/044/020/019/004).
    var baseMin  = 'id,status,problem,source,scheduled_day,created_at,office_notes,customer_id,technician_id,warranty_company,';
    var baseRich = baseMin + 'board_stage,claim_number,dispatch_id,service_window,parts_status,parts_eta,tdr_diagnosis,tdr_failed_component,tdr_part_number,stop_id,availability,scheduled_start,checklist,customer_cutoff,';
    var tailRich = 'customer:customer_id(first_name,last_name,phone,city,state),unit:unit_id(label),technician:technician_id(name)';
    var tailMin  = 'customer:customer_id(first_name,last_name,phone),unit:unit_id(label),technician:technician_id(name)';
    var proceed = function (r) {
      if (r.error) { document.getElementById('board').innerHTML = '<div class="empty">Couldn\'t load the board: ' + esc(r.error.message) + '</div>'; return; }
      jobsCache = r.data || [];
      var jids = jobsCache.map(function(j){ return j.id; });
      var none = Promise.resolve({ data: [] });
      // batch the customer's uploaded media so the office sees video + model photo right on
      // the tile — needed to process the warranty claim by hand (until a claim API lands).
      var mediaP = jids.length ? sb.from('job_media').select('job_id,kind,provider,ref').in('job_id', jids) : none;
      // latest inbound customer message per job → the green message bubble on the tile
      var msgP   = jids.length ? sb.from('thread_message').select('job_id,body,direction,created_at').eq('direction','in').in('job_id', jids).order('created_at',{ascending:false}) : none;
      // the parts the tech logged → the 🔧 part-# chip (fallback when the job row has none)
      var partsP = jids.length ? sb.from('job_part').select('job_id,number,name,disposition').in('job_id', jids) : none;
      // the colorful tags on each job + the shop's editable tag library
      var tagP = jids.length ? sb.from('job_tag').select('job_id,tag:tag_id(id,label,color)').in('job_id', jids) : none;
      var libP = sb.from('tag').select('id,label,color').order('created_at');
      Promise.all([
        sb.from('invoice').select('id,job_id,status,subtotal_cents,tax_cents,total_cents,tip_cents,collected_cents,paid_at,paid_method,created_at'),
        mediaP, msgP, partsP, tagP, libP
      ]).then(function (res) {
        var ir = res[0] || {}, mr = res[1] || {}, sr = res[2] || {}, pr = res[3] || {}, tgr = res[4] || {}, lbr = res[5] || {};
        invByJob = {};
        (ir.data || []).forEach(function (iv) { if (iv.job_id) { var p = invByJob[iv.job_id]; if (!p || new Date(iv.created_at) > new Date(p.created_at)) invByJob[iv.job_id] = iv; } });
        mediaByJob = {};
        (mr.data || []).forEach(function (m) { if (!m.job_id) return; (mediaByJob[m.job_id] = mediaByJob[m.job_id] || []).push(m); });
        // ordered newest-first → keep the first seen per job (the latest inbound)
        msgByJob = {};
        (sr.data || []).forEach(function (m) { if (!m.job_id || msgByJob[m.job_id]) return; if (String(m.body||'').trim()) msgByJob[m.job_id] = m; });
        partsByJob = {};
        (pr.data || []).forEach(function (p) { if (!p.job_id || !String(p.number||'').trim()) return; var d=String(p.disposition||''); if (d==='return'||d==='not_here') return; (partsByJob[p.job_id] = partsByJob[p.job_id] || []).push({ number:p.number, name:p.name }); });
        tagsByJob = {};
        (tgr.data || []).forEach(function (t) { if (!t.job_id || !t.tag) return; (tagsByJob[t.job_id] = tagsByJob[t.job_id] || []).push(t.tag); });
        tagLibrary = lbr.data || [];
        renderMoneyBar(); renderRegionToggle(); renderFilters(); renderBoard();
      });
    };
    // Try enriched + scheduling flags → enriched only → the minimal legacy select. So a
    // missing new column can never blank the board.
    sb.from('job').select(baseRich + 'needs_two_techs,long_job,' + tailRich).order('created_at', { ascending: false }).then(function (r) {
      if (!r.error) { proceed(r); return; }
      sb.from('job').select(baseRich + tailRich).order('created_at', { ascending: false }).then(function (r2) {
        if (!r2.error) { proceed(r2); return; }
        sb.from('job').select(baseMin + tailMin).order('created_at', { ascending: false }).then(proceed);
      });
    });
  }

  function subscribeRealtime() {
    try {
      rt = sb.channel('office-board')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'job' }, loadBoard)
        .subscribe();
    } catch (e) { /* realtime optional — Refresh still works */ }
  }

  function boot() {
    renderShell();
    // Company (RLS returns only this shop's row via the company_self policy).
    sb.from('company').select('id,name,trade,settings,features').limit(1).then(function (r) {
      if (!r.error && r.data && r.data[0]) { companyId = r.data[0].id; shopSettings = r.data[0].settings || {}; features = r.data[0].features || {}; shopName = r.data[0].name; var el = document.getElementById('shop'); if (el) el.textContent = shopName; }
      // 🎰 Board skin — default-on Jackpot; a shop can flip settings.skin to 'clean'.
      applySkin(shopSettings.skin==='clean'?'clean':'jackpot');
      // Feature gate: the job board is the Full Office Platform (database/scheduling). Default-open
      // on an empty features map so demo/unpopulated shops load normally; an Answering-only shop
      // gets an upgrade nudge instead of an empty board.
      var PF = window.PlatformFeatures || { has: function(){ return true; } };
      if(!(PF.has(features,'database') || PF.has(features,'scheduling'))){
        app.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:0 20px;text-align:center">'+
          '<h2 style="margin:0 0 10px">The job board is part of the Full Office Platform</h2>'+
          '<p style="color:#64748b;line-height:1.6">You’re on the <b>AI Answering</b> plan — Ann is answering your calls and capturing leads. Upgrade to run scheduling, the job board, invoicing, and tech pay here too.</p>'+
          '<a href="/platform/signup.html?plan=office" style="display:inline-block;margin-top:14px;padding:12px 20px;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;text-decoration:none">See the Full Office Platform →</a></div>';
        return;
      }
      loadBoard();
      loadTechs();
      subscribeRealtime();
    });
  }

  // Resume an existing session, else sign-in.
  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) boot(); else renderSignIn();
  });
})();
</script>
