  // ── warranty remittance (the accuracy hinge) ────────────────────────────────
  // A warranty vendor pays a batch EFT/check covering several claims, often LESS than
  // billed. Split it back to each job: set the REAL collected on each invoice. The shop's
  // collected + take-home become accurate; the tech still earns his full labor cut (the
  // shop absorbs the warranty haircut).
  function openRemittance(){
    var pending = jobsCache.filter(function(j){
      if(!j.warranty_company) return false;
      var iv=invByJob[j.id]; if(!iv || !(iv.total_cents>0)) return false;
      return (iv.collected_cents||0) < iv.total_cents;
    });
    var ov=document.createElement('div'); ov.className='ov';
    var rows = pending.map(function(j){
      var iv=invByJob[j.id]; var rem=iv.total_cents-(iv.collected_cents||0);
      return '<tr data-inv="'+iv.id+'">'+
        '<td class="nm">'+esc(fullName(j.customer)||'Customer')+'<div class="hint">'+esc(j.warranty_company||'')+' · billed '+money(iv.total_cents)+(((iv.collected_cents||0)>0)?' · already '+money(iv.collected_cents):'')+'</div></td>'+
        '<td style="text-align:right"><input class="remAmt" inputmode="decimal" style="width:96px" placeholder="'+(rem/100).toFixed(2)+'"></td></tr>';
    }).join('');
    ov.innerHTML='<div class="sheet"><h2>💵 Warranty remittance</h2>'+
      '<div class="hint">A warranty company paid a batch (EFT/check) covering several claims — often less than billed. Enter the reference, then the amount they actually paid on each job (blank = skip). Collected + take-home update to the real money; the tech still earns his full labor cut.</div>'+
      '<label>Reference (EFT # / check #)</label><input id="remRef" placeholder="EFT 1157090212">'+
      '<label>Total received <span class="hint">(optional — to reconcile)</span></label><input id="remTotal" inputmode="decimal" placeholder="0.00">'+
      '<div id="remRecon" class="hint" style="margin-top:6px"></div>'+
      (pending.length? '<div class="ptwrap" style="margin-top:10px;max-height:48vh;overflow:auto"><table class="pt"><thead><tr><th>Job</th><th style="text-align:right">Paid on this job</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        : '<div class="empty" style="margin-top:12px">No warranty jobs waiting on payment. As you bill warranty jobs, they show here.</div>')+
      '<div class="err" id="remErr"></div>'+
      '<div class="srow" style="margin-top:12px"><button id="remSave">Record remittance</button><button id="remCancel">Close</button></div></div>';
    document.body.appendChild(ov);
    var close=function(){ try{document.body.removeChild(ov);}catch(e){} };
    ov.onclick=function(e){ if(e.target===ov) close(); };
    document.getElementById('remCancel').onclick=close;
    function recompute(){
      var alloc=0; Array.prototype.forEach.call(ov.querySelectorAll('.remAmt'),function(i){ alloc+=cents(i.value||i.placeholder); });
      var recv=cents(document.getElementById('remTotal').value);
      var el=document.getElementById('remRecon');
      if(recv>0){ var diff=recv-alloc; el.textContent='Allocated '+money(alloc)+' of '+money(recv)+' received'+(diff===0?' ✓ balanced':(diff>0?' · '+money(diff)+' unallocated':' · over by '+money(-diff))); el.style.color=diff===0?'#12a150':'#c77700'; }
      else { el.textContent='Allocated '+money(alloc); el.style.color=''; }
    }
    Array.prototype.forEach.call(ov.querySelectorAll('.remAmt'),function(i){ i.oninput=recompute; });
    document.getElementById('remTotal').oninput=recompute; recompute();
    document.getElementById('remSave').onclick=function(){
      var ref=document.getElementById('remRef').value.trim();
      var updates=[];
      Array.prototype.forEach.call(ov.querySelectorAll('tr[data-inv]'),function(tr){
        var raw=tr.querySelector('.remAmt').value.trim(); if(!raw) return;
        var amt=cents(raw); if(amt<=0) return;
        updates.push({ invId:tr.getAttribute('data-inv'), amt:amt });
      });
      if(!updates.length){ document.getElementById('remErr').textContent='Enter the amount paid on at least one job (leave the rest blank).'; return; }
      var btn=document.getElementById('remSave'); btn.disabled=true; btn.textContent='Recording…';
      var now=new Date().toISOString();
      Promise.all(updates.map(function(u){
        return sb.from('invoice').update({ collected_cents:u.amt, status:'paid', paid_method:'warranty_eft', paid_ref:ref||null, paid_at:now }).eq('id',u.invId);
      })).then(function(rs){
        var err=rs.filter(function(r){return r.error;})[0];
        if(err){ btn.disabled=false; btn.textContent='Retry'; document.getElementById('remErr').textContent=err.error.message; return; }
        try{ if(window.AntMagic){ AntMagic.award('paid'); AntMagic.train(); } }catch(_){}   // 💰 warranty batch collected
        close(); loadBoard();
      });
    };
  }

  // ── money helpers ───────────────────────────────────────────────────────────
  function money(c){ c=Math.round(c||0); return '$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function cents(v){ var n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); return isNaN(n)?0:Math.round(n*100); }
  var ALLSTATUS = COLS.concat([{ key:'canceled', label:'Canceled', color:'var(--canceled)' }]);
  function statusMeta(k){ for(var i=0;i<ALLSTATUS.length;i++){ if(ALLSTATUS[i].key===k) return ALLSTATUS[i]; } return { key:k, label:(k||'').replace(/_/g,' '), color:'var(--canceled)' }; }

  // ── board state ──────────────────────────────────────────────────────────────
  var activeFilter = 'all', jobsCache = [], invByJob = {}, mediaByJob = {}, msgByJob = {}, partsByJob = {}, tagsByJob = {}, tagLibrary = [], stopCounts = {};
  // bright tag palette for new tags + readable text color for any tag chip
  var TAG_COLORS = ['#e5484d','#d6409f','#f76808','#ffb224','#8bd450','#46a758','#12a594','#3e63dd','#8e4ec6','#6b7280'];
  function tagText(hex){ hex=String(hex||'').replace('#',''); if(hex.length===3) hex=hex.replace(/(.)/g,'$1$1'); var r=parseInt(hex.slice(0,2),16)||0,g=parseInt(hex.slice(2,4),16)||0,b=parseInt(hex.slice(4,6),16)||0; return (0.299*r+0.587*g+0.114*b)>150 ? '#1a1206' : '#fff'; }
  function tagChip(t, cls){ var c=t.color||'#6b7280'; return '<span class="'+(cls||'jtag')+'" style="background:'+esc(c)+';color:'+tagText(c)+'">'+esc(t.label||'')+'</span>'; }
  var tagEditMode = false;   // drawer: reveal the ✕ to delete a tag from the shop library

  function renderFilters(){
    var counts = { all: jobsCache.length };
    jobsCache.forEach(function(j){ counts[j.status]=(counts[j.status]||0)+1; });
    var chips = [{ key:'all', label:'All' }].concat(ALLSTATUS.filter(function(s){ return (counts[s.key]||0)>0 || s.key!=='canceled'; }));
    document.getElementById('filters').innerHTML = chips.map(function(c){
      return '<button data-f="'+c.key+'" class="'+(activeFilter===c.key?'on':'')+'">'+esc(c.label)+' '+(counts[c.key]||0)+'</button>';
    }).join('');
    document.querySelectorAll('#filters button[data-f]').forEach(function(b){ b.onclick=function(){ activeFilter=b.getAttribute('data-f'); renderFilters(); renderBoard(); }; });
  }

  function renderMoneyBar(){
    var now=new Date(), m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
    var collected=0, invoiced=0, tax=0, due=0;
    Object.keys(invByJob).forEach(function(k){ var iv=invByJob[k];
      var net=(iv.total_cents||0)-(iv.tip_cents||0);   // tips pass to the tech — not shop revenue
      invoiced+=net; tax+=iv.tax_cents||0;
      if(iv.status==='paid'){ collected+=net; } else { due+=net; }
    });
    document.getElementById('money').innerHTML =
      '<div class="jackpot">' +
        '<div class="jp-label">💰 Collected this month</div>' +
        '<div class="jp-num" id="jpNum">'+money(lastCollected==null?collected:lastCollected)+'</div>' +
        '<div class="jp-reels">' +
          reel('Outstanding', money(due)) + reel('Tax', money(tax)) + reel('Invoiced', money(invoiced)) +
          '<div class="reel go" id="finBtn"><span class="rl">Reports</span><span class="rv">💵 Statements</span></div>' +
        '</div>' +
      '</div>';
    var fb=document.getElementById('finBtn'); if(fb) fb.onclick=openFinancials;
    animateJackpot(collected);
  }
  function reel(l,v){ return '<div class="reel"><span class="rl">'+esc(l)+'</span><span class="rv">'+esc(v)+'</span></div>'; }
  // The jackpot number rolls up like a slot reel when the collected total climbs (a payment
  // landed) — gold flash on an increase. Sound is left to the paid celebration.
  var lastCollected=null;
  function animateJackpot(to){
    var el=document.getElementById('jpNum'); if(!el){ lastCollected=to; return; }
    var from=(lastCollected==null)?to:lastCollected; lastCollected=to;
    if(from===to){ el.textContent=money(to); return; }
    if(to>from){ el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); },800); }
    var start=null, dur=850;
    function step(ts){ if(start==null) start=ts; var p=Math.min(1,(ts-start)/dur); var e=1-Math.pow(1-p,3); el.textContent=money(Math.round(from+(to-from)*e)); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  // Compact media strip on the board tile (video first), so the office can eyeball the
  // customer's video + model-# photo without opening the job — the inputs for filing the
  // warranty claim by hand. Tiles stop propagation so a tap opens the media, not the drawer.
  function cardMediaHtml(j){
    var media = mediaByJob[j.id] || []; if(!media.length) return '';
    var tiles='', n=0;
    media.filter(function(m){return m.kind==='video'&&m.provider==='cfstream';}).forEach(function(v){ if(n>=4) return; n++; var uid=esc(v.ref);
      tiles += '<a class="mtile vtile" onclick="event.stopPropagation()" target="_blank" rel="noopener" href="https://iframe.cloudflarestream.com/'+uid+'"><img class="vcover" src="https://videodelivery.net/'+uid+'/thumbnails/thumbnail.jpg?time=1s&height=140" alt="" onerror="this.style.display=\'none\'"><span class="play">▶</span></a>'; });
    media.filter(function(m){return m.kind==='photo'&&(m.provider==='storage'||m.provider==='r2');}).forEach(function(p){ if(n>=4) return; n++;
      tiles += '<a class="mtile ptile" onclick="event.stopPropagation()" target="_blank" rel="noopener" data-phhref="'+esc(p.ref)+'"><img data-ph="'+esc(p.ref)+'" alt="photo"></a>'; });
    return tiles ? '<div class="cardmedia">'+tiles+'</div>' : '';
  }

  // ── DENSE-CARD helpers — the legacy TN board's information design, on this theme ──
  // A small copyable chip: the office grabs a claim # / part # for the warranty portal
  // straight off the tile. Copy is wired after render so it stops propagation (won't open
  // the drawer) — the raw value rides on data-copy.
  function copyChip(label, value, kind){
    return '<span class="copychip cc-'+kind+'" data-copy="'+esc(value)+'" title="Tap to copy">'+esc(label)+' <span class="cc-ico">⧉</span></span>';
  }
  // Normalize the warranty vendor to a tidy badge (AHS / SquareTrade / ServicePower / NSA).
  function vendorBadge(co){
    co = String(co||'').trim(); if(!co) return '';
    var n = co.toLowerCase(), lbl = co;
    if(/ahs|american\s*home|frontdoor/.test(n)) lbl='AHS';
    else if(/square\s*trade|allstate/.test(n)) lbl='SquareTrade';
    else if(/service\s*power/.test(n)) lbl='ServicePower';
    else if(/\bnsa\b|national\s*service/.test(n)) lbl='NSA';
    return '<span class="vbadge" title="'+esc(co)+'">'+esc(lbl)+'</span>';
  }
  // 🔒 Customer available — the day/window the customer agreed to (texted availability, else
  // the vendor-promised service window on the scheduled day). Locked blue like the legacy tile.
  function availChip(j){
    var a = String(j.availability||'').trim();
    if(a) return '<div class="availc">🔒 Customer available '+esc(a.slice(0,120))+'</div>';
    var win = String(j.service_window||'').trim();
    if(win){ var day = j.scheduled_day ? schDay(j.scheduled_day) : ''; return '<div class="availc">🔒 Customer available '+(day?esc(day)+': ':'')+esc(win.slice(0,60))+'</div>'; }
    return '';
  }
  function todayCT(){ try{ return new Date().toLocaleDateString('en-CA',{timeZone:'America/Chicago'}); }catch(e){ return new Date().toISOString().slice(0,10); } }
  var PARTS_WAIT_RE = /to_order|await|order|need|backorder/i;
  // OVERDUE — the job slipped its expected timing (not merely old): parts past their ETA, or a
  // scheduled day that already passed without completing. ISO YYYY-MM-DD compares as strings.
  function isOverdue(j){
    if(j.status==='completed'||j.status==='canceled') return false;
    var today = todayCT();
    var eta = String(j.parts_eta||'').trim();
    if((j.status==='awaiting_parts' || PARTS_WAIT_RE.test(String(j.parts_status||''))) && eta && eta < today) return true;
    var sd = String(j.scheduled_day||'').trim();
    if(sd && sd < today) return true;
    return false;
  }
  function hasReport(j){ return !!(j.tdr_diagnosis || j.tdr_failed_component || j.tdr_part_number); }
  // The compact flag set — only what actually applies to this job.
  function buildFlags(j, iv, terminal){
    var f=[];
    var n = j.stop_id ? (stopCounts[j.stop_id]||0) : 0;
    if(n>1) f.push('<span class="fchip fmm" title="Multi-appliance stop — each machine has its own report">🧩 '+n+' machines</span>');
    if(isOverdue(j)) f.push('<span class="fchip fover">⏰ OVERDUE</span>');
    if(j.customer_cutoff && String(j.customer_cutoff).trim()) f.push('<span class="fchip fover" title="Customer has a hard cutoff — must leave by this time">⏰ Leave by '+esc(String(j.customer_cutoff).trim().slice(0,12))+'</span>');
    var needsParts = j.status==='awaiting_parts' || PARTS_WAIT_RE.test(String(j.parts_status||''));
    if(needsParts && !terminal) f.push('<span class="fchip fparts">🔧 NEEDS PARTS</span>');
    if(j.status==='completed' && !iv) f.push('<span class="fchip fclose" title="Completed but no invoice — finish the paperwork">⚠️ NOT CLOSED OUT</span>');
    if(!hasReport(j) && (j.status==='scheduled'||j.status==='in_progress')) f.push('<span class="fchip fdiag" title="No tech report on file yet">🔍 DIAGNOSIS</span>');
    if(j.office_notes && String(j.office_notes).trim()) f.push('<span class="fchip fnote" title="Office note on this job">📋 NOTE</span>');
    if(j.needs_two_techs) f.push('<span class="fchip">🧑‍🤝‍🧑 2-man</span>');
    if(j.long_job) f.push('<span class="fchip">⏳ Long job</span>');
    return f.join('');
  }
  // Inline actions by status — wired after render (stopPropagation).
  function buildActions(j, terminal){
    var out='';
    if(j.status==='scheduled' || j.status==='in_progress') out += '<button type="button" class="cardact act-complete" data-job="'+j.id+'">✓ Mark complete</button>';
    if(!hasReport(j) && !terminal && (j.technician && j.technician.name) && (j.status==='in_progress'||j.status==='completed')) out += '<button type="button" class="cardact act-report" data-job="'+j.id+'">📋 Request report</button>';
    return out ? '<div class="cardacts">'+out+'</div>' : '';
  }

  // Move a card to another board column. Optimistic (the card jumps immediately), then
  // persists job.board_stage; on error we reload to revert. board_stage is orthogonal to
  // status — moving a card never changes the job's status, tech, or invoice.
  function moveJobToStage(id, stage){
    if(!stage) return;
    var j=null; for(var i=0;i<jobsCache.length;i++){ if(String(jobsCache[i].id)===String(id)){ j=jobsCache[i]; break; } }
    if(!j || String(j.board_stage||'')===String(stage)) return;
    j.board_stage=stage; renderBoard();
    try{ if(window.AntMagic){ AntMagic.award('file', window.innerWidth/2, 120); } }catch(_){}
    sb.from('job').update({ board_stage:stage }).eq('id',id).then(function(r){ if(r.error){ loadBoard(); } });
  }
  // Wire the per-card "Move →" picker (mobile) + desktop drag-and-drop between columns.
  function wireBoardMoves(b){
    b.querySelectorAll('select.mv[data-job]').forEach(function(sel){
      sel.addEventListener('click', function(ev){ ev.stopPropagation(); });
      sel.addEventListener('mousedown', function(ev){ ev.stopPropagation(); });
      sel.onchange=function(ev){ ev.stopPropagation(); moveJobToStage(sel.getAttribute('data-job'), sel.value); };
    });
    b.querySelectorAll('.card[draggable]').forEach(function(card){
      card.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', card.getAttribute('data-job')); ev.dataTransfer.effectAllowed='move'; }catch(_){} card.classList.add('dragging'); });
      card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
    });
    b.querySelectorAll('.col[data-stage]').forEach(function(col){
      col.addEventListener('dragover', function(ev){ ev.preventDefault(); try{ ev.dataTransfer.dropEffect='move'; }catch(_){} col.classList.add('dragover'); });
      col.addEventListener('dragleave', function(){ col.classList.remove('dragover'); });
      col.addEventListener('drop', function(ev){ ev.preventDefault(); col.classList.remove('dragover'); var id=''; try{ id=ev.dataTransfer.getData('text/plain'); }catch(_){} if(id) moveJobToStage(id, col.getAttribute('data-stage')); });
    });
  }

  // Top slider ⇄ board: drag the slider and the WHOLE board slides across; scroll the board and
  // the slider follows. Wired once; updateSlide() re-fits the range after each render / resize.
  function updateSlide(){
    var s=document.getElementById('boardslide'), b=document.getElementById('board'); if(!s||!b) return;
    var max=Math.max(0, b.scrollWidth - b.clientWidth);
    s.max=max; s.value=Math.min(b.scrollLeft, max);
    s.style.display = max>2 ? 'block' : 'none';
  }
  function wireSlide(){
    var s=document.getElementById('boardslide'), b=document.getElementById('board'); if(!s||!b||s._wired) return; s._wired=true;
    s.addEventListener('input', function(){ b.scrollLeft = +s.value; });
    b.addEventListener('scroll', function(){ if(document.activeElement!==s) s.value = b.scrollLeft; });
    window.addEventListener('resize', updateSlide);
  }

  // ── ⋯ PER-COLUMN SORT — the MeisterTask "Sort section" menu on each column header. Sort the
  // cards WITHIN a column by a field; the choice persists per device (localStorage). ──
  var SORT_FIELDS = [
    ['name',    '🔤 Customer name'],
    ['tech',    '🔧 Tech (assignee)'],
    ['created', '🆕 Date created'],
    ['due',     '📅 Scheduled day'],
    ['status',  '📊 Status'],
    ['vendor',  '🏷️ Warranty company'],
    ['city',    '📍 City']
  ];
  var colSort = (function(){ try{ return JSON.parse(localStorage.getItem('ant_office_colsort')||'{}')||{}; }catch(_){ return {}; } })();
  function saveColSort(){ try{ localStorage.setItem('ant_office_colsort', JSON.stringify(colSort)); }catch(_){} }
  function sortFieldLabel(by){ for(var i=0;i<SORT_FIELDS.length;i++){ if(SORT_FIELDS[i][0]===by) return SORT_FIELDS[i][1].replace(/^[^ ]+ /,''); } return by; }
  function jobSortVal(j, by){
    switch(by){
      case 'name':    return (fullName(j.customer)||'').toLowerCase();
      case 'tech':    return (j.technician&&j.technician.name?j.technician.name:'').toLowerCase();
      case 'created': return j.created_at ? new Date(j.created_at).getTime() : 0;
      case 'due':     return j.scheduled_day ? String(j.scheduled_day) : '';
      case 'status':  return (statusMeta(j.status).label||'').toLowerCase();
      case 'vendor':  return (j.warranty_company||'').toLowerCase();
      case 'city':    return (j.customer&&j.customer.city?String(j.customer.city):'').toLowerCase();
    }
    return '';
  }
  function sortList(list, s){
    if(!s||!s.by) return list;
    var dir = s.dir==='desc' ? -1 : 1;
    return list.slice().sort(function(a,b){
      var va=jobSortVal(a,s.by), vb=jobSortVal(b,s.by);
      var ea=(va===''||va==null||va===0&&s.by==='created'), eb=(vb===''||vb==null||vb===0&&s.by==='created');
      if(ea&&!eb) return 1; if(eb&&!ea) return -1;    // blanks always to the bottom
      if(va<vb) return -1*dir; if(va>vb) return 1*dir; return 0;
    });
  }
  function closeColMenu(){ var e=document.getElementById('ant-colmenu'); if(e){ try{ e.parentNode.removeChild(e); }catch(_){} } document.removeEventListener('click', colMenuOutside, true); }
  function colMenuOutside(ev){ var e=document.getElementById('ant-colmenu'); if(e && !e.contains(ev.target) && !(ev.target.classList&&ev.target.classList.contains('colmenu'))) closeColMenu(); }
  function openColMenu(stageKey, anchor){
    closeColMenu();
    var s = colSort[stageKey] || {};
    var pop=document.createElement('div'); pop.className='colmenu-pop'; pop.id='ant-colmenu';
    var fields = SORT_FIELDS.map(function(f){ var on=s.by===f[0]; return '<button type="button" data-by="'+f[0]+'">'+esc(f[1])+(on?'<span class="ck">✓</span>':'')+'</button>'; }).join('');
    var dir = s.dir==='desc'?'desc':'asc';
    pop.innerHTML='<div class="cmh">Sort section</div>'+fields+
      '<div class="cmdiv"></div>'+
      '<div class="cmdir"><button type="button" data-dir="asc" class="'+(dir==='asc'?'on':'')+'">A → Z</button><button type="button" data-dir="desc" class="'+(dir==='desc'?'on':'')+'">Z → A</button></div>'+
      '<div class="cmdiv"></div>'+
      '<button type="button" data-clear="1">↩︎ Manual order (clear)</button>';
    document.body.appendChild(pop);
    // position under the ⋯, kept on-screen
    var r=anchor.getBoundingClientRect(); var w=pop.offsetWidth||200, h=pop.offsetHeight||260;
    var left=Math.min(r.left, window.innerWidth-w-8); if(left<8) left=8;
    var top=r.bottom+6; if(top+h>window.innerHeight-8) top=Math.max(8, r.top-h-6);
    pop.style.left=left+'px'; pop.style.top=top+'px';
    pop.querySelectorAll('button[data-by]').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation(); var by=b.getAttribute('data-by'); var cur=colSort[stageKey]||{}; colSort[stageKey]={ by:by, dir:cur.dir||'asc' }; saveColSort(); closeColMenu(); renderBoard(); }; });
    pop.querySelectorAll('button[data-dir]').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation(); var d=b.getAttribute('data-dir'); var cur=colSort[stageKey]||{}; if(!cur.by){ return; } colSort[stageKey]={ by:cur.by, dir:d }; saveColSort(); closeColMenu(); renderBoard(); }; });
    var cb=pop.querySelector('button[data-clear]'); if(cb) cb.onclick=function(ev){ ev.stopPropagation(); delete colSort[stageKey]; saveColSort(); closeColMenu(); renderBoard(); };
    setTimeout(function(){ document.addEventListener('click', colMenuOutside, true); }, 0);
  }

  function renderBoard(){
    // multi-machine: count jobs sharing a stop_id, computed from the loaded set (no query).
    stopCounts = {};
    jobsCache.forEach(function(j){ if(j.stop_id){ stopCounts[j.stop_id]=(stopCounts[j.stop_id]||0)+1; } });
    if(region!=='TN' && region!=='LA') region = defaultRegion(jobsCache);   // scope the board to the selected region
    var jobs = jobsCache.filter(function(j){ return jobRegion(j)===region && (activeFilter==='all' ? j.status!=='canceled' : j.status===activeFilter); });
    var cols = boardStages();
    // one <select> option per column — the mobile-friendly "move this card" control
    var moveOpts = '<option value="" selected disabled>Move →</option>' + cols.map(function(c){ return '<option value="'+esc(c.key)+'">'+esc(c.label)+'</option>'; }).join('');
    var byStage = {}; cols.forEach(function(c){ byStage[c.key]=[]; });
    jobs.forEach(function(j){ var k=stageOf(j, cols); (byStage[k]=byStage[k]||[]).push(j); });
    var html = cols.map(function(col){
      var k=col.key, list=sortList(byStage[k]||[], colSort[k]), m=col;   // render EVERY column (even empty) as a drop target, honoring its ⋯ sort
      var cards = list.map(function(j){
        var unit = j.unit && j.unit.label ? j.unit.label : '';
        var tech = j.technician && j.technician.name ? j.technician.name : 'Unassigned';
        var iv = invByJob[j.id];
        var terminal = (j.status==='completed'||j.status==='canceled');
        var badge = iv ? '<span class="money-badge '+(iv.status==='paid'?'paid':'due')+'">'+(iv.status==='paid'?'PAID ':'')+money(iv.total_cents)+'</span>' : '';

        // top row: mono status pill (theme .spill) + days-waiting chip (colors as it ages)
        var age = j.created_at ? Math.floor((Date.now()-new Date(j.created_at).getTime())/86400000) : -1;
        var ageChip = (!terminal && age>=1) ? '<span class="agechip" style="'+(age>30?'color:#ff6a52':(age>14?'color:var(--gold)':''))+'">⏳ '+age+'d</span>' : '';
        var topRow = '<div class="ctop"><span class="spill s-'+esc(j.status)+'">'+esc(statusMeta(j.status).label)+'</span>'+ageChip+'</div>';

        // header chips: claim/dispatch ref (copyable) · part # (copyable) · vendor · city
        var refChip='', claim=String(j.claim_number||'').trim(), disp=String(j.dispatch_id||'').trim();
        if(claim) refChip = copyChip('Claim '+claim, claim, 'ref');
        else if(disp) refChip = copyChip('Disp '+disp, disp, 'ref');
        var pnum = String(j.tdr_part_number||'').trim();
        if(!pnum){ var jp=partsByJob[j.id]; if(jp && jp.length){ pnum=String(jp[0].number||'').trim(); } }
        var partChip = pnum ? copyChip('🔧 '+pnum, pnum, 'part') : '';
        var vendor = vendorBadge(j.warranty_company);
        var city = j.customer && j.customer.city ? String(j.customer.city).trim() : '';
        var cityChip = city ? '<span class="citychip">📍 '+esc(city)+'</span>' : '';
        var hdr = (refChip||partChip||vendor||cityChip) ? '<div class="chdr">'+refChip+partChip+vendor+cityChip+'</div>' : '';

        // the booked date — shown right on the card so it's visible in the column view
        var schChip = (String(j.scheduled_day||'').trim() && j.status!=='canceled')
          ? '<div class="schedc">📅 Scheduled '+esc(schDay(j.scheduled_day))+(j.technician&&j.technician.name?' · '+esc(firstName(j.technician.name)):'')+'</div>' : '';
        // customer-agreed availability / promised window
        var avail = availChip(j);
        // latest inbound customer message — green bubble, 2-line clamp
        var msg = msgByJob[j.id];
        var msgHtml = (msg && msg.body) ? '<div class="cmsg">💬 '+esc(String(msg.body).slice(0,160))+'</div>' : '';
        // status / urgency flags (only what applies)
        var flags = buildFlags(j, iv, terminal);
        var actions = buildActions(j, terminal);

        var jtags = tagsByJob[j.id]||[];
        var tagsHtml = jtags.length ? '<div class="jtags">'+jtags.map(function(t){ return tagChip(t,'jtag'); }).join('')+'</div>' : '';
        return '<div class="card'+(iv&&iv.status==='paid'?' paidcard':'')+'" data-job="'+j.id+'" draggable="true" style="--sc:'+m.color+'">' +
          topRow +
          '<div class="name">'+esc(fullName(j.customer)||'Customer')+'</div>' +
          tagsHtml +
          hdr +
          (unit?'<div class="unit">'+esc(unit)+'</div>':'') +
          (j.problem?'<div class="prob">'+esc(j.problem)+'</div>':'') +
          schChip +
          avail +
          msgHtml +
          (flags?'<div class="flags">'+flags+'</div>':'') +
          cardMediaHtml(j) +
          actions +
          '<div class="foot"><span class="tech">'+esc(tech)+'</span>'+(badge||'')+'</div>' +
          '<select class="mv" data-job="'+j.id+'" title="Move to another column">'+moveOpts+'</select>' +
          '</div>';
      }).join('');
      var s=colSort[k]; var sLbl = (s&&s.by) ? '<span class="sortlbl">↕ '+esc(sortFieldLabel(s.by))+(s.dir==='desc'?' ↓':' ↑')+'</span>' : '';
      return '<div class="col" data-stage="'+esc(k)+'"><h3><span class="dot" style="background:'+m.color+'"></span>'+esc(m.label)+'<span class="n">'+list.length+'</span>'+sLbl+'<button type="button" class="colmenu'+((s&&s.by)?' on':'')+'" data-stage="'+esc(k)+'" title="Sort this column">⋯</button></h3>'+cards+'</div>';
    }).join('') || '<div class="empty">Nothing here yet.</div>';
    var b=document.getElementById('board'); b.innerHTML=html;
    // ⋯ per-column sort menu (MeisterTask-style "Sort section")
    b.querySelectorAll('.colmenu[data-stage]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation(); openColMenu(el.getAttribute('data-stage'), el); }; });
    wireBoardMoves(b);
    wireSlide(); updateSlide();   // top slider follows the board's scroll range
    // copy chips — grab claim/part # for the warranty portal without opening the drawer
    b.querySelectorAll('.copychip[data-copy]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation(); var t=el.getAttribute('data-copy'); try{ if(navigator.clipboard) navigator.clipboard.writeText(t); }catch(_){} var ico=el.querySelector('.cc-ico'); if(ico){ var old=ico.textContent; ico.textContent='✓'; setTimeout(function(){ ico.textContent=old; },1000); } }; });
    // ✓ Mark complete — set the job completed straight from the tile (a card moving column = a "file")
    b.querySelectorAll('.act-complete[data-job]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation(); var id=el.getAttribute('data-job'); try{ if(window.AntMagic){ var rc=el.getBoundingClientRect(); AntMagic.award('file', rc.left+rc.width/2, rc.top); } }catch(_){} el.disabled=true; el.textContent='Saving…'; sb.from('job').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',id).then(function(r){ if(r.error){ el.disabled=false; el.textContent='✓ Mark complete'; return; } loadBoard(); }); }; });
    // 📋 Request report — flag the tech (office note) that the report is needed
    b.querySelectorAll('.act-report[data-job]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation(); var id=el.getAttribute('data-job'); var j=jobsCache.filter(function(x){return String(x.id)===String(id);})[0]; el.disabled=true; el.textContent='Requested ✓'; var line='📋 Tech report requested — '+new Date().toLocaleDateString(); var prev=(j&&j.office_notes)?j.office_notes+'\n':''; sb.from('job').update({office_notes:prev+line}).eq('id',id).then(function(){ if(j) j.office_notes=prev+line; }); }; });
    b.querySelectorAll('.card[data-job]').forEach(function(c){ c.onclick=function(){ var j=jobsCache.filter(function(x){return x.id===c.getAttribute('data-job');})[0]; if(j) openJob(j); }; });
    hydratePics(b);
    // 🎰 The Great Hall — badge + garland + once-a-day welcome; an owl for a genuinely-new job.
    try{ if(window.AntMagic){
      AntMagic.init();
      var ids={}; jobsCache.forEach(function(j){ ids[j.id]=1; });
      if(_knownJobIds){ var fresh=false; for(var k in ids){ if(!_knownJobIds[k]){ fresh=true; break; } } if(fresh) AntMagic.owl(); }
      _knownJobIds=ids;
    } }catch(_){}
  }

  // ── Customer intake relay — the owner's "Teddy Tool" view: what the customer sent
  // in from the link Ann texted them (video, model photo, availability, signed release,
  // and the wear-item / floor-protection choices), pulled straight from the tenant DB.
  // ── SCHEDULE HANDSHAKE (office side): see the customer's day requests (one-tap book) and
  // offer a day back to them (they accept from their portal). Three sides, everyone helps.
  function schWin(w){ return w==='am'?'mornings':(w==='pm'?'afternoons':'anytime'); }
  function schDay(d){ try{ return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }catch(e){ return d; } }
  function loadSched(job){
    var box=document.getElementById('jsched'); if(!box) return;
    sb.from('schedule_offer').select('id,direction,proposed_day,win,note,status').eq('job_id',job.id).eq('status','pending').order('created_at',{ascending:false}).then(function(r){
      var offers=(r.data)||[]; var html='';
      if(job.scheduled_day) html+='<div class="hint" style="margin-bottom:8px">Booked: <b>'+esc(schDay(job.scheduled_day))+'</b></div>';
      offers.filter(function(o){return o.direction==='customer';}).forEach(function(o){
        html+='<div class="offrow"><div class="ot">🙋 Customer wants <b>'+esc(schDay(o.proposed_day))+'</b> · '+schWin(o.win)+(o.note?' — '+esc(o.note):'')+'</div><button class="book" data-book="'+esc(o.id)+'" data-day="'+esc(o.proposed_day)+'">Book it</button></div>';
      });
      offers.filter(function(o){return o.direction==='shop';}).forEach(function(o){
        html+='<div class="offrow pend"><div class="ot">📤 You offered <b>'+esc(schDay(o.proposed_day))+'</b> · '+schWin(o.win)+' — waiting on customer</div><button class="wd" data-withdraw="'+esc(o.id)+'">Withdraw</button></div>';
      });
      html+='<div class="offform"><input type="date" id="soDay" min="'+new Date().toISOString().slice(0,10)+'"><select id="soWin"><option value="any">Wide open</option><option value="am">Mornings</option><option value="pm">Afternoons</option></select><button class="primary" id="soSend">Offer to customer</button></div>';
      box.innerHTML=html;
      box.querySelectorAll('button[data-book]').forEach(function(b){ b.onclick=function(){ bookRequest(job, b.getAttribute('data-book'), b.getAttribute('data-day'), b); }; });
      box.querySelectorAll('button[data-withdraw]').forEach(function(b){ b.onclick=function(){ b.disabled=true; sb.from('schedule_offer').update({status:'withdrawn',decided_at:new Date().toISOString()}).eq('id',b.getAttribute('data-withdraw')).then(function(){ loadSched(job); }); }; });
      var ss=document.getElementById('soSend'); if(ss) ss.onclick=function(){ sendOffer(job, ss); };
    });
  }
  function bookRequest(job, offerId, day, btn){
    btn.disabled=true; btn.textContent='Booking…';
    sb.from('schedule_offer').update({status:'accepted',decided_at:new Date().toISOString()}).eq('id',offerId)
      .then(function(){ return sb.from('job').update({scheduled_day:day, status:(job.status==='new'||!job.status)?'scheduled':job.status}).eq('id',job.id); })
      .then(function(){ return sb.from('thread_message').insert({company_id:companyId, customer_id:job.customer_id||null, job_id:job.id, direction:'out', channel:'portal', sender:'office', body:'✅ Booked you for '+day}); })
      .then(function(){ job.scheduled_day=day; loadSched(job); loadBoard(); });
  }
  function sendOffer(job, btn){
    var day=document.getElementById('soDay').value, win=document.getElementById('soWin').value||'any';
    if(!day){ document.getElementById('soDay').focus(); return; }
    btn.disabled=true; btn.textContent='Sending…';
    // Server-side: records the shop offer AND texts the customer the day + a one-tap portal
    // link to confirm (or pick another). One atomic call so the customer hears about it.
    sb.auth.getSession().then(function(s){
      var tok=(s&&s.data&&s.data.session&&s.data.session.access_token)||'';
      return fetch('/.netlify/functions/platform-tech-notify?do=schedule_offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:job.id,access_token:tok,day:day,win:win})}).then(function(r){return r.json();});
    }).then(function(res){
      btn.disabled=false; btn.textContent='Offer to customer';
      if(!res||!res.ok){ alert((res&&res.error)||'Could not send.'); return; }
      loadSched(job);
    }).catch(function(){ btn.disabled=false; btn.textContent='Offer to customer'; alert('Could not send — try again.'); });
  }

  // Fire-and-forget: text the newly-assigned tech that a job is on their plate.
  function notifyAssigned(jobId){
    sb.auth.getSession().then(function(s){
      var tok=(s&&s.data&&s.data.session&&s.data.session.access_token)||'';
      fetch('/.netlify/functions/platform-tech-notify?do=notify_assigned',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:jobId,access_token:tok})}).catch(function(){});
    });
  }

  // 📲 Office texts the ASSIGNED tech the actual job-tile link + a note ("need the part # for
  // this one — what happened?"). Server resolves the tech's cell + logs the ask to the thread.
  function textTileToTech(jobId, note, btn, msgEl){
    var orig=btn.textContent; btn.disabled=true; btn.textContent='Sending…'; if(msgEl) msgEl.textContent='';
    sb.auth.getSession().then(function(s){
      var tok=(s&&s.data&&s.data.session&&s.data.session.access_token)||'';
      if(!tok){ btn.disabled=false; btn.textContent=orig; if(msgEl) msgEl.textContent='Session expired — sign in again.'; return; }
      return fetch('/.netlify/functions/platform-tech-notify?do=tech_job_link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:jobId,access_token:tok,body:note})})
        .then(function(r){return r.json();}).then(function(d){
          btn.disabled=false; btn.textContent=orig;
          if(d&&d.ok&&d.texted){ if(msgEl) msgEl.textContent='✓ Texted '+(d.tech||'the tech')+' the job tile.'; var ni=document.getElementById('jtileNote'); if(ni) ni.value=''; }
          else if(d&&d.error==='no_tech'){ if(msgEl) msgEl.textContent='Assign a tech first, then text them the tile.'; }
          else if(d&&d.error==='no_tech_phone'){ if(msgEl) msgEl.textContent='No cell on file for '+(d.tech||'that tech')+'.'; }
          else { if(msgEl) msgEl.textContent=(d&&d.error)||'Couldn\'t send — try again.'; }
        });
    }).catch(function(){ btn.disabled=false; btn.textContent=orig; if(msgEl) msgEl.textContent='Couldn\'t reach the server — try again.'; });
  }

  // R2 photos are tenant-scoped behind a signer — batch-sign refs with the staff session
  // token and drop the real URL into each <img src> (and its wrapping link).
  function hydratePics(scope){
    var root = scope || document;
    var imgs = root.querySelectorAll('img[data-ph]'); if(!imgs.length) return;
    var refs=[]; Array.prototype.forEach.call(imgs,function(el){ var r=el.getAttribute('data-ph'); if(r&&refs.indexOf(r)<0) refs.push(r); });
    sb.auth.getSession().then(function(s){
      var tok = s && s.data && s.data.session && s.data.session.access_token; if(!tok) return;
      fetch('/.netlify/functions/platform-media-urls',{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok}, body: JSON.stringify({ refs: refs }) })
        .then(function(x){ return x.json(); }).then(function(d){
          var urls=(d&&d.urls)||{};
          Array.prototype.forEach.call(root.querySelectorAll('img[data-ph]'),function(el){ var u=urls[el.getAttribute('data-ph')]; if(!u) return; el.src=u; var a=el.closest('a[data-phhref]'); if(a) a.href=u; });
        }).catch(function(){});
    });
  }

  function loadIntake(job){
    var box=document.getElementById('jintake'); if(!box) return;
    var L='style="font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;display:inline-block"';
    Promise.all([
      sb.from('job_media').select('kind,provider,ref,label').eq('job_id',job.id),
      sb.from('job').select('availability,waiver_signed_at,waiver_name').eq('id',job.id).limit(1).single(),
      sb.from('thread_message').select('body').eq('job_id',job.id).eq('direction','in').order('created_at',{ascending:false}).limit(25)
    ]).then(function(res){
      var media=(res[0]&&res[0].data)||[];
      var jj=(res[1]&&res[1].data)||{};
      var msgs=((res[2]&&res[2].data)||[]).map(function(m){return String(m.body||'');});
      var vids=media.filter(function(m){return m.kind==='video'&&m.provider==='cfstream';});
      var pics=media.filter(function(m){return m.kind==='photo'&&(m.provider==='storage'||m.provider==='r2');});
      var choices=msgs.filter(function(b){return /🔧|🛟/.test(b);});
      var mediaHtml='';
      vids.forEach(function(m){ var uid=esc(m.ref); mediaHtml+='<a class="mtile vtile" target="_blank" rel="noopener" href="https://iframe.cloudflarestream.com/'+uid+'"><img class="vcover" src="https://videodelivery.net/'+uid+'/thumbnails/thumbnail.jpg?time=1s&height=140" alt="" onerror="this.style.display=\'none\'"><span class="play">▶</span></a> '; });
      pics.forEach(function(m){ mediaHtml+='<a class="mtile ptile" target="_blank" rel="noopener" data-phhref="'+esc(m.ref)+'"><img data-ph="'+esc(m.ref)+'" alt="model"></a> '; });
      var bits=[];
      if(jj.availability) bits.push('📅 '+esc(jj.availability));
      if(jj.waiver_signed_at) bits.push('✍️ Release signed'+(jj.waiver_name?' — '+esc(jj.waiver_name):''));
      if(!media.length && !bits.length && !choices.length){
        box.innerHTML='<div class="sec">📩 Customer intake</div><div style="font-size:12.5px;color:var(--muted)">Waiting on the customer — Ann texted them the link to send a video + model photo, pick their days, and sign the release.</div>';
        return;
      }
      box.innerHTML='<div class="sec">📩 Customer intake</div>'+
        (mediaHtml?'<div style="margin-bottom:8px">'+mediaHtml+'</div>':'')+
        (bits.length?'<div style="font-size:13px;color:var(--muted);margin-bottom:'+(choices.length?'6px':'0')+'">'+bits.join(' &nbsp;·&nbsp; ')+'</div>':'')+
        (choices.length?'<div style="font-size:13px;line-height:1.5">'+choices.map(function(c){return esc(c);}).join('<br>')+'</div>':'');
      hydratePics(box);
    }).catch(function(){ if(box) box.innerHTML=''; });

  // ── 📷 PHOTOS & VIDEOS — the shared media gallery. Every video (Cloudflare Stream) + photo
  // (signed) the customer or tech uploaded, viewable here and open/copy-link-able so the office
  // can attach them to a warranty claim. Same files every surface (tech/customer) sees. ──
  function loadMedia(job){
    var box=document.getElementById('jmedia'); if(!box) return;
    box.innerHTML='<div class="sec">📷 Photos &amp; videos</div><div class="hint">Loading…</div>';
    sb.from('job_media').select('id,kind,provider,ref,label,created_at').eq('job_id',job.id).order('created_at').then(function(r){
      if(r.error){ box.innerHTML='<div class="sec">📷 Photos &amp; videos</div><div class="hint">Couldn\'t load media.</div>'; return; }
      var media=(r&&r.data)||[];
      if(!media.length){ box.innerHTML='<div class="sec">📷 Photos &amp; videos</div><div class="hint">No photos or videos yet — they land here the moment the customer or tech uploads them.</div>'; return; }
      var items=media.map(function(m){
        if(m.kind==='video'&&m.provider==='cfstream'){ var uid=esc(m.ref); var href='https://iframe.cloudflarestream.com/'+uid;
          return '<div class="mgitem"><a class="mgthumb" target="_blank" rel="noopener" href="'+href+'"><img src="https://videodelivery.net/'+uid+'/thumbnails/thumbnail.jpg?time=1s&height=200" alt="" onerror="this.style.display=\'none\'"><span class="play">▶</span></a>'+
            '<div class="mglabel">🎥 '+esc(m.label||'Video')+'</div>'+
            '<div class="mgacts"><a target="_blank" rel="noopener" href="'+href+'">▶ Open</a><button type="button" class="mgcopy" data-link="'+href+'">Copy link</button></div></div>';
        }
        // photo — signed by hydratePics (sets the thumb anchor href + img src)
        return '<div class="mgitem"><a class="mgthumb" data-phhref="'+esc(m.ref)+'" target="_blank" rel="noopener"><img data-ph="'+esc(m.ref)+'" alt="photo"></a>'+
          '<div class="mglabel">📷 '+esc(m.label||'Photo')+'</div>'+
          '<div class="mgacts"><button type="button" class="mgopen" data-ph="'+esc(m.ref)+'">Open / save</button><button type="button" class="mgcopy" data-ph="'+esc(m.ref)+'">Copy link</button></div></div>';
      }).join('');
      box.innerHTML='<div class="sec">📷 Photos &amp; videos <span class="hint" style="font-weight:400">— shared with the tech &amp; customer · open or copy a link to attach to a warranty claim</span></div><div class="mgal">'+items+'</div>';
      hydratePics(box);
      var linkFor=function(b){ var l=b.getAttribute('data-link'); if(l) return l; var ref=b.getAttribute('data-ph'); var a=ref?box.querySelector('a[data-phhref="'+ref+'"]'):null; return (a&&a.getAttribute('href'))||''; };
      box.querySelectorAll('.mgopen').forEach(function(b){ b.onclick=function(){ var u=linkFor(b); if(u) window.open(u,'_blank','noopener'); }; });
      box.querySelectorAll('.mgcopy').forEach(function(b){ b.onclick=function(){ var u=linkFor(b); if(!u){ b.textContent='Not ready'; setTimeout(function(){b.textContent='Copy link';},1200); return; }
        var done=function(){ b.textContent='Copied ✓'; setTimeout(function(){ b.textContent='Copy link'; },1400); };
        try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(done,done); } else { done(); } }catch(_){ done(); } }; });
    }).catch(function(){ if(box) box.innerHTML='<div class="sec">📷 Photos &amp; videos</div><div class="hint">Couldn\'t load media.</div>'; });
  }

  // ── 🏷️ TAGS — the shop's own editable, colorful labels. Assign several to a job (they show
  // as bright chips on the card), create new ones, and (in Edit mode) delete ones you no longer
  // use. Everything is company-scoped via RLS, so each shop builds its own set. ──
  function loadTags(job){
    var box=document.getElementById('jtags'); if(!box) return;
    box.innerHTML='<div class="sec">🏷️ Tags</div><div class="hint">Loading…</div>';
    Promise.all([
      sb.from('job_tag').select('id,tag_id,tag:tag_id(id,label,color)').eq('job_id',job.id),
      sb.from('tag').select('id,label,color').order('created_at')
    ]).then(function(res){
      if((res[0]&&res[0].error)||(res[1]&&res[1].error)){ box.innerHTML='<div class="sec">🏷️ Tags</div><div class="hint">Tags aren\'t set up yet.</div>'; return; }
      var assignedRows=(res[0]&&res[0].data)||[], lib=(res[1]&&res[1].data)||[];
      var assignedByTag={}; assignedRows.forEach(function(a){ if(a.tag) assignedByTag[a.tag_id]=a.id; });
      var selColor=TAG_COLORS[0], editMode=tagEditMode;
      var assignedHtml=assignedRows.filter(function(a){return a.tag;}).map(function(a){ var t=a.tag,c=t.color||'#6b7280';
        return '<span class="tgassigned" style="background:'+esc(c)+';color:'+tagText(c)+'">'+esc(t.label||'')+'<span class="x" data-unassign="'+esc(a.id)+'">✕</span></span>'; }).join('');
      var pickHtml=lib.map(function(t){ var c=t.color||'#6b7280', on=!!assignedByTag[t.id];
        return '<span class="tgpick'+(on?' on':'')+'" style="background:'+esc(c)+';color:'+tagText(c)+'" data-tag="'+esc(t.id)+'">'+esc(t.label||'')+(editMode?'<span class="del" data-deltag="'+esc(t.id)+'">✕</span>':'')+'</span>'; }).join('');
      var sw=TAG_COLORS.map(function(c,i){ return '<button type="button" data-c="'+c+'" style="background:'+c+'"'+(i===0?' class="on"':'')+'></button>'; }).join('');
      box.innerHTML='<div class="sec">🏷️ Tags <span class="hint" style="font-weight:400">— your shop\'s labels; show on the card</span><button type="button" class="tgedit" id="tg_edit">'+(editMode?'Done':'Edit tags')+'</button></div>'+
        (assignedHtml?'<div class="tglist">'+assignedHtml+'</div>':'<div class="hint" style="margin:0 0 8px">No tags on this job yet — tap one below to add it.</div>')+
        (lib.length?'<div class="tglist" id="tg_lib">'+pickHtml+'</div>':'')+
        '<div class="tgnew"><input id="tg_new_label" placeholder="New tag name" maxlength="40"><div class="tgsw" id="tg_sw">'+sw+'</div><button type="button" class="tgadd" id="tg_add">+ Create</button></div>'+
        '<div class="hint" id="tg_msg" style="margin-top:5px"></div>';
      var eb=document.getElementById('tg_edit'); if(eb) eb.onclick=function(){ tagEditMode=!tagEditMode; loadTags(job); };
      box.querySelectorAll('[data-unassign]').forEach(function(x){ x.onclick=function(ev){ ev.stopPropagation(); x.style.opacity='.4'; sb.from('job_tag').delete().eq('id',x.getAttribute('data-unassign')).then(function(){ loadTags(job); loadBoard(); }); }; });
      box.querySelectorAll('.tgpick[data-tag]').forEach(function(el){ el.onclick=function(ev){ if(ev.target&&ev.target.getAttribute&&ev.target.getAttribute('data-deltag')) return; var tid=el.getAttribute('data-tag'); el.style.opacity='.4';
        if(assignedByTag[tid]){ sb.from('job_tag').delete().eq('id',assignedByTag[tid]).then(function(){ loadTags(job); loadBoard(); }); }
        else { sb.from('job_tag').insert({company_id:companyId,job_id:job.id,tag_id:tid}).then(function(){ loadTags(job); loadBoard(); }); } }; });
      box.querySelectorAll('[data-deltag]').forEach(function(d){ d.onclick=function(ev){ ev.stopPropagation(); var tid=d.getAttribute('data-deltag'); if(!confirm('Delete this tag from your shop? It will be removed from every job.')) return; sb.from('tag').delete().eq('id',tid).then(function(){ loadTags(job); loadBoard(); }); }; });
      box.querySelectorAll('#tg_sw button[data-c]').forEach(function(b){ b.onclick=function(){ selColor=b.getAttribute('data-c'); box.querySelectorAll('#tg_sw button').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); }; });
      var ab=document.getElementById('tg_add'); if(ab) ab.onclick=function(){ var lbl=(document.getElementById('tg_new_label').value||'').trim(); if(!lbl){ document.getElementById('tg_new_label').focus(); return; } ab.disabled=true;
        sb.from('tag').insert({company_id:companyId,label:lbl,color:selColor}).select('id').then(function(r){ if(r.error||!r.data||!r.data[0]){ ab.disabled=false; var m=document.getElementById('tg_msg'); if(m)m.textContent='Couldn\'t create — try again.'; return; }
          sb.from('job_tag').insert({company_id:companyId,job_id:job.id,tag_id:r.data[0].id}).then(function(){ loadTags(job); loadBoard(); }); }); };
    }).catch(function(){ if(box) box.innerHTML='<div class="sec">🏷️ Tags</div><div class="hint">Couldn\'t load tags.</div>'; });
  }

        var ops=[];

        if(j.unit_id) ops.push(sb.from('unit').update({label:gv('d_appl')||null,attributes:attrs}).eq('id',j.unit_id));

  // ── 💰 PAYMENT panel (warranty-aware) ───────────────────────────────────────
  // Warranty jobs → nothing due. Cash jobs → the amount from the saved invoice + three
  // ways to collect. Reuses existing paths: card + pay-link ride the "Text invoice" send
  // (the hosted invoice takes a card); cash/check marks the saved invoice paid. No new
  // Stripe wiring, no dead buttons.
  function renderPaymentPanel(job){
    var box=document.getElementById('jpayment'); if(!box) return;
    if(job.warranty_company){
      box.innerHTML='<div class="paycovered">🛡 Covered by warranty — nothing due</div>';
      return;
    }
    var iv=invByJob[job.id]||null;
    var dueTxt = iv ? (iv.status==='paid' ? 'Paid — '+money(iv.total_cents) : 'Amount due '+money(iv.total_cents)) : 'Save the invoice above to set the amount due';
    box.innerHTML=
      '<div class="paydue">'+esc(dueTxt)+'</div>'+
      '<div class="cardacts" style="margin-top:0">'+
        '<button type="button" class="cardact" id="payCard">💳 Take card</button>'+
        '<button type="button" class="cardact" id="payCash">💵 Mark cash/check</button>'+
        '<button type="button" class="cardact" id="payLink">📲 Text pay link</button>'+
      '</div>'+
      '<div id="payCashConfirm" style="display:none;margin-top:8px;align-items:center;gap:7px;flex-wrap:wrap"></div>'+
      '<span class="hint" id="payMsg" style="display:block;margin-top:6px"></span>';
    var pc=document.getElementById('payCard'); if(pc) pc.onclick=function(){ sendInvoice(job); };   // hosted invoice takes a card
    var pl=document.getElementById('payLink'); if(pl) pl.onclick=function(){ sendInvoice(job); };   // same durable pay link
    var pcash=document.getElementById('payCash');
    if(pcash) pcash.onclick=function(){
      var iv2=invByJob[job.id]||null, msg=document.getElementById('payMsg');
      if(!iv2){ if(msg) msg.textContent='Save the invoice above first, then mark it paid.'; return; }
      var cf=document.getElementById('payCashConfirm'); if(!cf) return;
      cf.style.display='flex';
      cf.innerHTML='<span class="hint">Mark paid:</span>'+
        '<button type="button" class="cardact" data-m="Cash" style="flex:0 0 auto;min-width:0">💵 Cash</button>'+
        '<button type="button" class="cardact" data-m="Check" style="flex:0 0 auto;min-width:0">🧾 Check</button>'+
        '<button type="button" class="cardact" data-m="" style="flex:0 0 auto;min-width:0">Cancel</button>';
      cf.querySelectorAll('button[data-m]').forEach(function(b){ b.onclick=function(){
        var m=b.getAttribute('data-m');
        if(!m){ cf.style.display='none'; cf.innerHTML=''; return; }
        b.disabled=true;
        var now=new Date().toISOString();
        sb.from('invoice').update({status:'paid',paid_method:m,collected_cents:iv2.total_cents,paid_at:now}).eq('id',iv2.id).then(function(r){
          if(r.error){ b.disabled=false; if(msg) msg.textContent=r.error.message; return; }
          invByJob[job.id]=Object.assign({},iv2,{status:'paid',paid_method:m,collected_cents:iv2.total_cents,paid_at:now});
          try{ if(window.AntMagic){ AntMagic.award('paid'); AntMagic.train(); } }catch(_){}   // 💰 money in — jackpot
          // reflect in the invoice worksheet controls if present
          var jp=document.getElementById('jpaid'); if(jp) jp.checked=true;
          var jm=document.getElementById('jmethod'); if(jm) jm.value=m;
          renderPaymentPanel(job); loadBoard();
        });
      }; });
    };
  }

  // ── ✅ OFFICE CHECKLIST — shared, persisted to job.checklist (jsonb) ─────────
  // Stored as { "<key>": true } — ticked keys only; unticking drops the key. Using the
  // column (not localStorage) is the point: any office person on any device sees the same ticks.
  var CHECKLIST_STEPS = [
    { k:'info_captured',       l:'Info captured' },
    { k:'video_prediag',       l:'Video call / prediag' },
    { k:'collect_payment',     l:'Collect payment due' },
    { k:'schedule_appt',       l:'Schedule appointment' },
    { k:'report_tech',         l:'Report from technician' },
    { k:'order_parts',         l:'Order the parts' },
    { k:'part_tracking',       l:'Add to part list / tracking' },
    { k:'report_warranty',     l:'Report to warranty / estimate' },
    { k:'call_text_status',    l:'Call & text customer w/ status' },
    { k:'schedule_completion', l:'Schedule completion (if needed)' },
    { k:'follow_up',           l:'Follow up with customer' },
    { k:'return_parts',        l:'Return any parts (if needed)' },
    { k:'invoice',             l:'Invoice' },
    { k:'payout_deductible',   l:'Pay out deductible (payroll)' },
    { k:'payout_invoice',      l:'Pay out invoice (payroll)' },
  ];
  function checklistState(job){ var c=job.checklist; return (c && typeof c==='object') ? c : {}; }
  function checklistProgress(st){ var d=0; CHECKLIST_STEPS.forEach(function(s){ if(st[s.k]) d++; }); return d; }
  function setChecklistProg(st){ var ph=document.getElementById('jchecklistProg'); if(ph) ph.textContent=checklistProgress(st)+' / '+CHECKLIST_STEPS.length+' done'; }
  function renderChecklist(job){
    var box=document.getElementById('jchecklist'); if(!box) return;
    var st=checklistState(job);
    box.innerHTML='<div class="cklist">'+CHECKLIST_STEPS.map(function(s,i){
      return '<div class="ckrow'+(st[s.k]?' on':'')+'" data-k="'+esc(s.k)+'"><span class="cknum">'+(i+1)+'</span><span class="ckbox">✓</span><span class="cklab">'+esc(s.l)+'</span></div>';
    }).join('')+'</div>';
    setChecklistProg(st);
    box.querySelectorAll('.ckrow[data-k]').forEach(function(el){ el.onclick=function(){ toggleChecklist(job, el.getAttribute('data-k'), el); }; });
  }
  function toggleChecklist(job, key, el){
    var cur=checklistState(job), next=Object.assign({}, cur), willBeOn=!next[key];
    if(willBeOn) next[key]=true; else delete next[key];
    var wasOn=el.classList.contains('on');
    // optimistic
    el.classList.toggle('on', willBeOn); setChecklistProg(next); el.style.pointerEvents='none';
    if(willBeOn){ try{ if(window.AntMagic){ var rc=el.getBoundingClientRect(); AntMagic.award('check', rc.left+rc.width/2, rc.top); } }catch(_){} }   // 🎰 points for keeping the board current
    sb.from('job').update({ checklist: next }).eq('id', job.id).then(function(r){
      el.style.pointerEvents='';
      if(r.error){ el.classList.toggle('on', wasOn); setChecklistProg(cur); return; }  // revert on error
      job.checklist=next;
    });
  }

  // ── JOB DRAWER — status buttons, notes, pay, statement ──────────────────────
  // ── 📋 TDR — the office's claim surface. Reads the tech's job_tdr + parts + media and lets
  // the office view/complete it (model · failure · multiple part #s · labor · 5 outcomes). ──
  var TDR_OUTCOMES = [
    ['fixed','✅','Job complete'],
    ['return_needed','🔁','Needs another stop'],
    ['not_fixable','♻️','Needs replacement'],
    ['second_opinion','👁️','Second opinion'],
    ['no_failure','🚫','No failure found']
  ];
  function loadTdr(job){
    var box=document.getElementById('jtdr'); if(!box) return;
    box.innerHTML='<div class="sec">📋 TDR — technician report</div><div class="hint">Loading…</div>';
    Promise.all([
      sb.from('job_tdr').select('*').eq('job_id',job.id).limit(1),
      sb.from('job').select('unit_id,unit:unit_id(id,label,attributes)').eq('id',job.id).limit(1).single()
    ]).then(function(res){
      var t=((res[0]&&res[0].data)||[])[0]||{};
      var jj=(res[1]&&res[1].data)||{}; var unitRow=jj.unit||{}; var attrs=unitRow.attributes||{};
      var unitId=jj.unit_id||unitRow.id||null;
      var curModel=t.model||attrs.model||'';
      var IN='class="tinp"';
      var outs=TDR_OUTCOMES.map(function(o){ return '<button type="button" class="tout'+(t.outcome===o[0]?' on':'')+'" data-o="'+o[0]+'"><span>'+o[1]+'</span>'+o[2]+'</button>'; }).join('');
      box.innerHTML=
        '<div class="sec">📋 TDR — technician report <span class="hint" style="font-weight:400">— what the office files the claim from</span></div>'+
        '<span class="tlab">Model #</span><input '+IN+' id="t_model" value="'+esc(curModel)+'" placeholder="off the sticker" style="font-family:ui-monospace,Menlo,monospace">'+
        '<span class="tlab">What failed</span><input '+IN+' id="t_fc" value="'+esc(t.failed_component||'')+'" placeholder="e.g. heating element">'+
        '<span class="tlab">What happened to the machine</span><textarea '+IN+' id="t_rc" placeholder="Details for the claim" style="min-height:56px;resize:vertical">'+esc(t.root_cause||'')+'</textarea>'+
        '<span class="tlab">Labor hours</span><input '+IN+' id="t_lh" inputmode="decimal" value="'+esc(t.labor_hours!=null?t.labor_hours:'')+'" placeholder="e.g. 1.5">'+
        '<span class="tlab">Outcome — how the job ended (for the claim)</span>'+
        '<div class="touts" id="t_outs">'+outs+'</div>'+
        '<div class="srow" style="justify-content:flex-start"><button class="primary" id="t_save">💾 Save report</button><span class="hint" id="t_msg" style="align-self:center"></span></div>';

      // outcome — save immediately
      box.querySelectorAll('#t_outs .tout[data-o]').forEach(function(btn){ btn.onclick=function(){
        var o=btn.getAttribute('data-o');
        box.querySelectorAll('#t_outs .tout').forEach(function(x){ x.classList.remove('on'); }); btn.classList.add('on');
        sb.from('job_tdr').upsert({ company_id:companyId, job_id:job.id, outcome:o },{onConflict:'job_id'}).then(function(){ var m=document.getElementById('t_msg'); if(m){ m.textContent='Outcome saved ✓'; setTimeout(function(){ if(m)m.textContent=''; },1500); } });
      }; });
      // save report — job_tdr fields + model onto the unit
      var sv=document.getElementById('t_save');
      if(sv) sv.onclick=function(){
        var msg=document.getElementById('t_msg'); sv.disabled=true; sv.textContent='Saving…'; if(msg) msg.textContent='';
        var onBtn=box.querySelector('#t_outs .tout.on'); var cur=onBtn?onBtn.getAttribute('data-o'):(t.outcome||'fixed');
        var lhv=(document.getElementById('t_lh').value||'').trim();
        var row={ company_id:companyId, job_id:job.id, model:(document.getElementById('t_model').value||'').trim()||null, failed_component:(document.getElementById('t_fc').value||'').trim()||null, root_cause:(document.getElementById('t_rc').value||'').trim()||null, outcome:cur };
        if(lhv && !isNaN(parseFloat(lhv))) row.labor_hours=parseFloat(lhv);
        var ops=[ sb.from('job_tdr').upsert(row,{onConflict:'job_id'}) ];
        if(unitId){ var na=Object.assign({},attrs,{model:row.model}); ops.push(sb.from('unit').update({attributes:na}).eq('id',unitId)); }
        Promise.all(ops).then(function(rr){ var err=rr.filter(function(x){return x&&x.error;})[0]; sv.disabled=false; sv.textContent='💾 Save report'; if(err){ if(msg) msg.textContent=(err.error.message||'save failed'); return; } if(msg){ msg.textContent='Saved ✓'; setTimeout(function(){ if(msg)msg.textContent=''; },2000); } loadBoard(); });
      };
    }).catch(function(){ if(box) box.innerHTML='<div class="sec">📋 TDR — technician report</div><div class="hint">Couldn\'t load the report.</div>'; });
  }

  // ── 🔩 PARTS — the office parts editor, directly under Status. Add / remove / adjust the part
  // numbers on the job (job_part). Add + remove are immediate; an inline edit saves on change. ──
  // Route the part travels: pick it up from the distributor, or it ships to the customer's home.
  function shipSel(v){ v=v||'';
    return '<select class="tp_ship">'+
      '<option value=""'+(v===''?' selected':'')+'>Route…</option>'+
      '<option value="distributor"'+(v==='distributor'?' selected':'')+'>🏭 Pick up from distributor</option>'+

  function loadTparts(job){
    var box=document.getElementById('jtparts'); if(!box) return;

    // datalist of common part sources — a dropdown of suggestions that still allows free write-in
    var SRC_LIST='<datalist id="ant_part_srcs"><option value="American Home Shield (warranty)"><option value="Warranty company"><option value="ServicePower"><option value="Marcone"><option value="Reliable Parts"><option value="Encompass"><option value="Amazon"><option value="Distributor / parts warehouse"></datalist>';
    sb.from('job_part').select('id,number,name,source,ship_to,eta').eq('job_id',job.id).order('created_at').then(function(r){

          '<div class="tprow">'+shipSel(p.ship_to)+'<label class="tpeta">ETA <input class="tp_eta" type="date" value="'+esc(p.eta||'')+'"></label></div>'+
        '</div>';
      }).join('');

        '<div id="jtp_rows">'+rows+'</div>'+
        '<div class="tpcard" id="jtp_new">'+
          '<div class="tprow"><input id="jtp_num" placeholder="Part #" style="font-family:ui-monospace,Menlo,monospace"><input id="jtp_name" placeholder="Name (optional)"><button type="button" class="tpadd" id="jtp_add">+ Add</button></div>'+
          '<div class="tprow"><input id="jtp_src" list="ant_part_srcs" placeholder="Where it\'s coming from (e.g. American Home Shield)"></div>'+
          '<div class="tprow">'+shipSel('').replace('class="tp_ship"','id="jtp_ship" class="tp_ship"')+'<label class="tpeta">ETA <input id="jtp_eta" class="tp_eta" type="date"></label></div>'+

        '<div class="hint" id="jtp_msg" style="margin-top:4px"></div>';

      box.querySelectorAll('#jtp_rows .del[data-del]').forEach(function(b){ b.onclick=function(){ b.disabled=true; sb.from('job_part').delete().eq('id',b.getAttribute('data-del')).then(function(){ loadTparts(job); loadBoard(); }); }; });
      // add a part (carries source / route / ETA)
      var ab=document.getElementById('jtp_add');
      if(ab) ab.onclick=function(){
        var gv=function(id){ var e=document.getElementById(id); return e?(e.value||'').trim():''; };
        var num=gv('jtp_num'), nm=gv('jtp_name'); if(!num && !nm) return; ab.disabled=true;
        sb.from('job_part').insert({ company_id:companyId, job_id:job.id, number:num||null, name:nm||null, source:gv('jtp_src')||null, ship_to:gv('jtp_ship')||null, eta:gv('jtp_eta')||null }).then(function(rr){ if(rr.error){ ab.disabled=false; var m=document.getElementById('jtp_msg'); if(m)m.textContent='Couldn\'t add — try again.'; return; } loadTparts(job); loadBoard(); }); };
      // inline edits — any field on a saved part card writes all five on change
      box.querySelectorAll('#jtp_rows .tpcard[data-pid]').forEach(function(rowEl){ var pid=rowEl.getAttribute('data-pid');
        var save=function(){
          var g=function(sel){ var e=rowEl.querySelector(sel); return e?(e.value||'').trim():''; };
          sb.from('job_part').update({ number:g('.tp_num')||null, name:g('.tp_name')||null, source:g('.tp_src')||null, ship_to:g('.tp_ship')||null, eta:g('.tp_eta')||null }).eq('id',pid).then(function(){ var m=document.getElementById('jtp_msg'); if(m){m.textContent='Saved ✓'; setTimeout(function(){if(m)m.textContent='';},1200);} loadBoard(); });
        };
        rowEl.querySelectorAll('input,select').forEach(function(inp){ inp.onchange=save; });
      });
    }).catch(function(){ if(box) box.innerHTML='<div class="sec">🔩 Parts</div><div class="hint">Couldn\'t load parts.</div>'; });

        rows.forEach(function(l){ if(l.kind==='credit'){ hasCredit=true; return; } if(l.kind==='tip') return; if(l.kind==='fee') hasFee=true; sums[l.kind]=(sums[l.kind]||0)+Math.round((l.unit_cents||0)*(l.qty||1)); });
        if(sums.labor) document.getElementById('labor').value=(sums.labor/100).toFixed(2);
        if(sums.part)  document.getElementById('parts').value=(sums.part/100).toFixed(2);
        if(sums.fee)   document.getElementById('fee').value=(sums.fee/100).toFixed(2);
        if(sums.shipping && !document.getElementById('ship').value) document.getElementById('ship').value=(sums.shipping/100).toFixed(2);
        // restore the checkbox: credit line present = applied; a lone fee (no credit) = it was billed on top
        document.getElementById('jtripapply').checked = hasCredit || !hasFee;
        var taxBase=sums.labor+sums.part+sums.shipping+(hasCredit?0:sums.fee);
        if(inv.tax_cents && taxBase) document.getElementById('tax').value=(Math.round(inv.tax_cents/taxBase*10000)/100);
        recompute();
      });
    } else { recompute(); }

    // 🔧 Parts the tech logged in the field → enter COST, the owner's margin fills the customer
    // price. The retail sum feeds Parts $ and each part becomes its own receipt line. Nobody asks
    // "what do we charge" and nobody re-keys it — the margin does the pricing.
    (function loadInvoiceParts(){
      var box=document.getElementById('jparts'); if(!box) return;
      // customer cost = our cost + markup %, floored so the margin is never under $10 (mAdd).
      var retail=function(costC){ costC=+costC||0; if(costC<=0) return 0; return Math.max(Math.round(costC*(1+mPct/100)), costC+mAdd); };
      var pmUpd=function(pid){ var c=box.querySelector('.pc[data-part="'+pid+'"]'), p=box.querySelector('.pp[data-part="'+pid+'"]'), m=box.querySelector('.pm[data-part="'+pid+'"]'); if(!c||!p||!m) return; var mar=cents(p.value)-cents(c.value); m.textContent=(cents(p.value)||cents(c.value))?('margin '+money(mar)):''; m.style.color=mar<0?'#e5484d':'#1f7a37'; };
      sb.from('job_part').select('id,name,number,cost_cents,sell_cents,disposition').eq('job_id',job.id).order('created_at').then(function(r){
        var parts=(r.data||[]).filter(function(p){ var d=(p.disposition||''); return d!=='return'&&d!=='unused'&&d!=='missing'; }); // don't bill returned/unused/missing
        if(!parts.length){ box.innerHTML=''; return; }
        box.innerHTML='<div class="sec" style="margin-top:2px">🔧 Parts the tech used <span class="hint" style="font-weight:400">— enter your cost; customer pays cost + '+mPct+'%'+(mAdd>0?' (min '+money(mAdd)+' margin)':'')+'</span></div>'+
          parts.map(function(p){ var nm=(p.name||'Part');
            var costV=p.cost_cents?(p.cost_cents/100).toFixed(2):'';
            var sellV=(p.sell_cents!=null?p.sell_cents:retail(p.cost_cents)); sellV=sellV?(sellV/100).toFixed(2):'';
            return '<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px"><span class="k" style="flex:1 1 140px;min-width:120px">'+esc(nm)+(p.number?' <span class="mono">'+esc(p.number)+'</span>':'')+'</span>'+
              '<span class="v" style="font-size:12px;color:var(--muted)">Our cost $<input class="pc" data-part="'+esc(p.id)+'" inputmode="decimal" style="width:66px" value="'+costV+'"></span>'+
              '<span class="v" style="font-size:12px">Customer $<input class="pp" data-part="'+esc(p.id)+'" data-name="'+esc(nm)+'" inputmode="decimal" style="width:74px" value="'+sellV+'"></span>'+
              '<span class="pm" data-part="'+esc(p.id)+'" style="font-size:11.5px;font-weight:700;flex:1 1 100%;margin-left:2px"></span></div>'; }).join('');
        var sumParts=function(){ var s=0; box.querySelectorAll('.pp').forEach(function(i){ s+=cents(i.value); }); document.getElementById('parts').value=s?(s/100).toFixed(2):''; recompute(); };
        box.querySelectorAll('.pm').forEach(function(m){ pmUpd(m.getAttribute('data-part')); });
        // typing cost auto-fills the customer price from the owner's margin; the price stays editable (override).
        box.querySelectorAll('.pc').forEach(function(i){ i.oninput=function(){ var pid=i.getAttribute('data-part'); var sc=retail(cents(i.value)); var ppi=box.querySelector('.pp[data-part="'+pid+'"]'); if(ppi){ ppi.value=sc?(sc/100).toFixed(2):''; } pmUpd(pid); sumParts(); }; });
        box.querySelectorAll('.pp').forEach(function(i){ i.oninput=function(){ pmUpd(i.getAttribute('data-part')); sumParts(); }; });
        var pre=0; parts.forEach(function(p){ pre+=(p.sell_cents!=null?p.sell_cents:retail(p.cost_cents))||0; });
        if(pre>0){ document.getElementById('parts').value=(pre/100).toFixed(2); recompute(); }
      });
    })();

    document.getElementById('jpaySave').onclick=function(){ savePay(job); };
    document.getElementById('jstmt').onclick=function(){ openStatement(job); };
    document.getElementById('jsend').onclick=function(){ sendInvoice(job); };
    function g(id){ return document.getElementById(id).value; }

  function savePay(job){
    var btn=document.getElementById('jpaySave'); btn.disabled=true; btn.textContent='Saving…';
    document.getElementById('jerr').textContent='';
    var g=function(id){ return document.getElementById(id).value; };
    var laborC=cents(g('labor')), partsC=cents(g('parts')), feeC=cents(g('fee'));
    // the tech's parts, priced in the drawer → itemized lines + persist cost + price back on each part
    var pricedParts=[]; Array.prototype.forEach.call(document.querySelectorAll('#jparts .pp'), function(i){
      var pid=i.getAttribute('data-part');
      var costI=document.querySelector('#jparts .pc[data-part="'+pid+'"]');
      pricedParts.push({id:pid, name:i.getAttribute('data-name'), cents:cents(i.value), costC:costI?cents(costI.value):0});
    });
    pricedParts.forEach(function(p){ if(p.id) sb.from('job_part').update({sell_cents:p.cents>0?p.cents:null, cost_cents:p.costC>0?p.costC:null}).eq('id',p.id).then(function(){}); });
    var shipC=cents(g('ship')), tipC=cents(g('tip')), techPayC=cents(g('techpay'));
    var partsCostC=0; document.querySelectorAll('#jparts .pc').forEach(function(i){ partsCostC+=cents(i.value); });
    var tripApply=document.getElementById('jtripapply'); var applied=tripApply&&tripApply.checked && (laborC+partsC)>0;
    var sub=laborC+partsC+shipC+(applied?0:feeC), taxp=parseFloat(g('tax'))||0, taxC=Math.round(sub*taxp/100), tot=sub+taxC+tipC;
    var paid=document.getElementById('jpaid').checked, method=document.getElementById('jmethod').value||null;
    var inv=invByJob[job.id]||null;
    var row={ company_id:companyId, job_id:job.id, customer_id:job.customer_id||null, labor_cents:laborC, shipping_cents:shipC, tip_cents:tipC, tech_pay_cents:techPayC>0?techPayC:null, parts_cost_cents:partsCostC>0?partsCostC:null, subtotal_cents:sub, tax_cents:taxC, total_cents:tot, status:paid?'paid':'draft', paid_method:paid?method:null, paid_at:paid?(inv&&inv.paid_at?inv.paid_at:new Date().toISOString()):null, collected_cents:paid?tot:(inv?inv.collected_cents||0:0) };
    var done=function(invoiceId){
      var newlyPaid = paid && !(inv && inv.status==='paid');
      invByJob[job.id]=Object.assign({ id:invoiceId, job_id:job.id, created_at:(inv&&inv.created_at)||new Date().toISOString() }, row);
      btn.disabled=false; btn.textContent='Saved ✓'; setTimeout(function(){ btn.textContent='Save invoice'; },1600);
      // 🎰 an invoice filed = an estimate; a fresh payment = paid + the Express.
      try{ if(window.AntMagic){ AntMagic.award('estimate'); if(newlyPaid){ AntMagic.award('paid'); AntMagic.train(); } } }catch(_){}
      // 💵 Money in — celebrate the first time it flips to paid.
      if(newlyPaid && window.antCelebrate){ try{ window.antCelebrate({ tag:'Payment', big:'JACKPOT! 💰', sub:fullName(job.customer)||'', tiles:[{value:money(tot),label:'Collected',accent:'#f7b500'}], sound:'both' }); }catch(_){ } }
      loadBoard();
    };
    var writeLines=function(invoiceId){
      sb.from('invoice_line').delete().eq('invoice_id',invoiceId).then(function(){
        var lines=[]; if(laborC)lines.push({company_id:companyId,invoice_id:invoiceId,kind:'labor',description:'Labor',qty:1,unit_cents:laborC});
        // itemize the tech's priced parts as their own lines; fall back to one lump "Parts" line
        var pp=pricedParts.filter(function(p){return p.cents>0;});
        if(pp.length){ pp.forEach(function(p){ lines.push({company_id:companyId,invoice_id:invoiceId,kind:'part',description:p.name||'Part',qty:1,unit_cents:p.cents}); }); }
        else if(partsC){ lines.push({company_id:companyId,invoice_id:invoiceId,kind:'part',description:'Parts',qty:1,unit_cents:partsC}); }
        if(feeC)lines.push({company_id:companyId,invoice_id:invoiceId,kind:'fee',description:'Trip charge',qty:1,unit_cents:feeC});

        if(lines.length) sb.from('invoice_line').insert(lines).then(function(){ done(invoiceId); }); else done(invoiceId);
      });
    };
    if(inv){ sb.from('invoice').update(row).eq('id',inv.id).then(function(r){ if(r.error){btn.disabled=false;btn.textContent='Save invoice';document.getElementById('jerr').textContent=r.error.message;return;} writeLines(inv.id); }); }

  }
