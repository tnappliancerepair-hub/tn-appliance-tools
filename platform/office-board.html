<!doctype html>
<html lang="en" data-live="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Office Board — Ant</title>
<!--
  Ant platform — OFFICE BOARD (multi-tenant reference surface).
  Runs against the Supabase platform project (docs/sql/004_multitenant_core.sql).
  Auth → the board shows ONLY this shop's jobs (Row-Level Security does the scoping;
  the page never sends a company_id). Realtime keeps it live. This same pattern —
  sign in, query, RLS scopes to your tenant — is what the tech app + customer portal
  reuse. One codebase, three lenses, every shop.
-->
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd;
    --brand:#3f8f24; --brand-ink:#ffffff; --chip:#eef2e8; --shadow:0 1px 2px rgba(20,30,10,.06),0 4px 14px rgba(20,30,10,.05);
    --new:#6b7280; --scheduled:#2563eb; --in_progress:#b45309; --awaiting_parts:#7c3aed; --completed:#3f8f24; --canceled:#9ca3af;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .brand{font-weight:800;letter-spacing:.2px}
  header .shop{color:var(--muted);font-weight:600}
  header .sp{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 12px;font-weight:600}
  button.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  button:disabled{opacity:.55;cursor:default}
  .wrap{padding:14px;max-width:720px;margin:0 auto}
  /* vertical board — no side-scroll */
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
  .filters button{white-space:nowrap;border-radius:999px;padding:7px 13px;font-size:13px}
  .filters button.on{background:var(--ink);color:var(--bg);border-color:transparent}
  .board{display:block}
  .col{width:auto;margin-bottom:6px}
  .money{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;margin-bottom:2px}
  .stat{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
  .stat .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .stat .val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .card{cursor:pointer}
  .card .money-badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
  .money-badge.paid{background:#dcfce7;color:#166534}
  .money-badge.due{background:#fef3c7;color:#92400e}
  .flag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe;margin:5px 5px 0 0}
  .schedflags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .schedflags button.on{background:#e0e7ff;color:#3730a3;border-color:#c7d2fe;font-weight:800}
  :root:not([data-theme="light"]) .money-badge.paid,:root[data-theme="dark"] .money-badge.paid{background:#14351f;color:#8ff0b0}
  :root:not([data-theme="light"]) .money-badge.due,:root[data-theme="dark"] .money-badge.due{background:#3a2e0c;color:#f2ce7a}
  .col h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
  .col h3 .n{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px}
  .col h3 .dot{width:8px;height:8px;border-radius:50%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .card .name{font-weight:700}
  .card .unit{color:var(--muted);font-size:13px;margin-top:1px}
  .card .prob{margin-top:7px;font-size:13.5px}
  .card .foot{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
  .tech{color:var(--muted);font-size:12px;font-weight:600}
  .empty{color:var(--muted);font-size:13px;padding:8px 2px}
  /* auth / connect gates */
  .gate{max-width:380px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
  .gate h1{margin:0 0 4px;font-size:20px}
  .gate p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .gate label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .gate button{width:100%;margin-top:18px}
  .err{color:#c0392b;font-size:13px;margin-top:12px;min-height:1.2em}
  :root[data-theme="dark"] .err,:root:not([data-theme="light"]) .err{color:#ff8a7a}
  .ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,6,.5);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;overflow:auto}
  .sheet{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .sheet h2{margin:0 0 6px;font-size:19px}
  .sheet label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin:15px 0 5px}
  .sheet label .hint{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
  .sheet input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .sheet .srow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .sheet.drawer{max-width:520px}
  .sheet .sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:18px 0 8px}
  .sheet .sec button.supcfg{float:right;text-transform:none;letter-spacing:0;margin-top:-3px;padding:2px 8px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer}
  .sheet .sec button.supcfg:hover{color:var(--ink);border-color:var(--brand)}
  .jfindg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .jfindg button{font-size:12.5px;font-weight:700;padding:9px 6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer}
  .jfindg button:hover{border-color:var(--brand)}
  .sheet .custname{font-size:20px;font-weight:800}
  .sheet .sub{color:var(--muted);font-size:14px;margin-top:1px}
  .statusbtns{display:flex;flex-wrap:wrap;gap:7px}
  .statusbtns button{font-size:12.5px;padding:7px 11px;font-weight:700}
  .statusbtns button.on{color:#fff;border-color:transparent}
  .sheet textarea{width:100%;min-height:70px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
  .pay{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .pay .fld{display:flex;flex-direction:column;gap:4px}
  .pay .fld label{font-size:11.5px;font-weight:700;color:var(--muted)}
  .pay .fld input{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
  .totals{background:var(--chip);border-radius:11px;padding:11px 13px;margin-top:11px;font-variant-numeric:tabular-nums}
  .totals .tr{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
  .totals .tr.grand{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:5px;padding-top:8px}
  .paidrow{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
  .paidrow select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
  /* schedule handshake (office) */
  #jsched .offrow{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:8px}
  #jsched .offrow.pend{opacity:.85}
  #jsched .offrow .ot{font-size:13px;line-height:1.35}
  #jsched .offrow .book{background:var(--accent,#2f7d32);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-weight:800;font-size:12.5px;white-space:nowrap;cursor:pointer}
  #jsched .offrow .wd{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12px;white-space:nowrap;cursor:pointer}
  #jsched .offform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
  #jsched .offform input,#jsched .offform select{flex:1 1 auto;min-width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
  #jsched .offform .primary{background:var(--ink);color:var(--bg);border:none;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
  /* printable statement */
  @media print{ body *{visibility:hidden} #stmt,#stmt *{visibility:visible} #stmt{position:absolute;inset:0;padding:24px} .noprint{display:none!important} }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--chip);padding:1px 5px;border-radius:5px}
  .banner{background:#fff7e6;border:1px solid #f0d59a;color:#7a5b00;padding:10px 14px;border-radius:10px;margin:16px;font-size:13px}
  :root[data-theme="dark"] .banner,:root:not([data-theme="light"]) .banner{background:#2a2410;border-color:#5a4a1a;color:#e6c766}
  /* ── SLOT-MACHINE DOPAMINE (TN colors): a gold jackpot hero + glowing reels + status-lit tiles ── */
  .money{display:block !important;overflow:visible;padding-bottom:0}
  .jackpot{position:relative;overflow:hidden;border-radius:18px;padding:17px 18px 15px;margin-bottom:14px;background:linear-gradient(135deg,#151d10,#0b1006);border:1px solid #2d3d1a;box-shadow:0 12px 36px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05)}
  .jackpot::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 130% at 100% 0%, rgba(247,181,0,.18), transparent 55%);pointer-events:none}
  .jp-label{position:relative;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#c6d2b2}
  .jp-num{position:relative;font-family:'Bricolage Grotesque',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.04;margin-top:3px;background:linear-gradient(180deg,#ffe98a 0%,#f6b01f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(247,181,0,.28));letter-spacing:-.01em}
  .jp-num.flash{animation:jpFlash .8s ease}
  @keyframes jpFlash{0%{filter:drop-shadow(0 2px 14px rgba(247,181,0,.28))}28%{filter:drop-shadow(0 0 22px rgba(247,181,0,.85)) brightness(1.25)}100%{filter:drop-shadow(0 2px 14px rgba(247,181,0,.28))}}
  .jp-reels{position:relative;display:flex;gap:8px;overflow-x:auto;margin-top:13px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .reel{flex:0 0 auto;background:rgba(0,0,0,.34);border:1px solid #35461f;border-radius:11px;padding:8px 13px;min-width:98px}
  .reel .rl{display:block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#93a37c}
  .reel .rv{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:#eef4e3;margin-top:2px}
  .reel.go{cursor:pointer;border-color:#5f7f31}.reel.go .rv{color:#8ff0b0}
  .reel.go:hover{transform:translateY(-1px)}
  .board .card{ box-shadow: inset 4px 0 0 var(--sc,var(--line)), var(--shadow) !important; transition:transform .13s ease, box-shadow .18s ease; }
  .board .card:hover{ transform:translateY(-2px); }
  .board .card.paidcard{ box-shadow: inset 4px 0 0 #f7b500, 0 0 0 1px rgba(247,181,0,.32), 0 8px 22px rgba(247,181,0,.14) !important; }
  @media (prefers-reduced-motion: reduce){ .jp-num.flash{animation:none} .board .card{transition:none} .board .card:hover{transform:none} }
  .mtile{position:relative;display:inline-flex;width:62px;height:62px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#0b0d08;align-items:center;justify-content:center;vertical-align:middle;margin-right:6px}
  .mtile img{width:100%;height:100%;object-fit:cover;display:block}
  .vtile .vcover{position:absolute;inset:0}
  .vtile .play{position:absolute;color:#fff;font-size:20px;line-height:1;text-shadow:0 1px 5px rgba(0,0,0,.7);pointer-events:none}
  .cardmedia{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  .cardmedia .mtile{width:44px;height:44px;border-radius:7px;margin-right:0}
  .cardmedia .vtile .play{font-size:15px}
  /* ── DENSE CARDS: legacy TN information design on the platform's dark-vivid theme ── */
  .card .ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .card .agechip{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  .card .chdr{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
  .copychip{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:7px;white-space:nowrap;cursor:pointer;border:1px solid;background:var(--chip);color:var(--ink)}
  .copychip .cc-ico{opacity:.55;font-size:10px}
  .copychip.cc-ref{background:rgba(90,169,255,.14);color:#5aa9ff;border-color:rgba(90,169,255,.42)}
  .copychip.cc-part{background:rgba(0,214,143,.14);color:#00d68f;border-color:rgba(0,214,143,.42)}
  .vbadge{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:var(--gold-grad,linear-gradient(135deg,#ffd75a,#f5a623));color:#231a02;border:1px solid transparent}
  .citychip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:2px 2px}
  .card .availc{margin-top:7px;padding:7px 10px;border-radius:9px;background:rgba(90,169,255,.12);border:1px solid rgba(90,169,255,.42);color:#4b93e6;font-size:12.5px;font-weight:800;line-height:1.4}
  :root:not([data-theme="light"]) .card .availc,:root[data-theme="dark"] .card .availc{color:#8cc0ff}
  .card .cmsg{margin-top:7px;padding:7px 10px;border-radius:10px;background:rgba(26,158,70,.10);border:1px solid rgba(26,158,70,.34);color:var(--ink);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .fchip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);background:var(--chip);color:var(--muted)}
  .fchip.fover{background:rgba(255,90,70,.16);color:#ff6a52;border-color:rgba(255,90,70,.46)}
  .fchip.fparts{background:rgba(245,166,35,.16);color:#f5a623;border-color:rgba(245,166,35,.46)}
  .fchip.fclose{background:rgba(255,120,70,.14);color:#ff8a52;border-color:rgba(255,120,70,.42)}
  .fchip.fdiag{background:rgba(90,169,255,.14);color:#5aa9ff;border-color:rgba(90,169,255,.42)}
  .fchip.fmm{background:rgba(180,140,255,.16);color:#b48cff;border-color:rgba(180,140,255,.46)}
  .fchip.fnote{background:rgba(245,166,35,.14);color:#e0a11a;border-color:rgba(245,166,35,.4)}
  .cardacts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .cardact{flex:1;min-width:118px;font-size:12px;font-weight:800;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
  .card .act-complete{background:rgba(0,214,143,.14);color:#00d68f;border-color:rgba(0,214,143,.42)}
  .card .act-report{background:rgba(245,166,35,.14);color:#e0a11a;border-color:rgba(245,166,35,.42)}
  /* ── ✅ OFFICE CHECKLIST (shared, saved to job.checklist) ── */
  .cklist{display:flex;flex-direction:column;gap:5px}
  .ckrow{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);user-select:none;-webkit-user-select:none}
  .ckrow .cknum{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;min-width:15px;text-align:right}
  .ckrow .ckbox{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:transparent;background:var(--panel)}
  .ckrow .cklab{flex:1}
  .ckrow.on{background:rgba(0,214,143,.10);border-color:rgba(0,214,143,.42)}
  .ckrow.on .ckbox{background:#00d68f;border-color:#00d68f;color:#06231a}
  .ckrow.on .cklab{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .sec .ckprog{font-weight:600;color:var(--muted);font-size:11px;margin-left:6px;letter-spacing:0}
  /* ── 💰 PAYMENT panel + ⏰ cutoff ── */
  .paycovered{padding:9px 12px;border-radius:10px;background:rgba(90,169,255,.12);border:1px solid rgba(90,169,255,.42);color:#4b93e6;font-size:13px;font-weight:700}
  :root:not([data-theme="light"]) .paycovered,:root[data-theme="dark"] .paycovered{color:#8cc0ff}
  .paydue{font-weight:800;font-size:15px;margin-bottom:8px;font-variant-numeric:tabular-nums}
  /* ── 🎰 JACKPOT HEADER STRUCTURE — neutral layout that works in BOTH skins ──
     The header carries class="topbar" so ant-magic can hang its 💰 house-points
     badge + garland on it. These rules only lay it out (title row + region toggle
     + a quick-hop nav); all the casino coloring lives in skin-jackpot.css. */
  header.topbar{display:block;align-items:initial}
  header.topbar .tb-row{display:flex;align-items:center;gap:12px}
  header.topbar .seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
  header.topbar .seg button{border:0;background:none;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:none;white-space:nowrap}
  header.topbar .seg button.on{background:var(--panel);color:var(--brand);box-shadow:0 1px 3px rgba(20,30,50,.12)}
  header.topbar .hop{display:flex;gap:7px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  header.topbar .hop::-webkit-scrollbar{display:none}
  header.topbar .hop a{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;text-decoration:none;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
</style>
  <link rel="stylesheet" href="/platform/ant-theme.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/platform/skin-jackpot.css">
</head>
<body>
<div id="app"></div>

<script src="/platform/config.js"></script>
<script src="/platform/features.js"></script>
<script src="/platform/vendor/supabase-js.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>
<script src="/platform/vendor/supa-guard.js"></script>
<script src="/platform/vendor/boot-watchdog.js"></script>
<script src="/platform/media-sign.js"></script>
<script src="/platform/ant-suppliers.js"></script>
<script src="/ant-sounds.js"></script>
<script src="/ant-magic.js"></script>
<script src="/ant-celebrate.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var cfg = window.ANT_SUPABASE || {};
  var sb = null, rt = null, companyId = null, shopSettings = {}, features = {};

  // ── STATUS COLUMNS ─────────────────────────────────────────────────────────
  var COLS = [
    { key: 'new',            label: 'New',            color: 'var(--new)' },
    { key: 'scheduled',      label: 'Scheduled',      color: 'var(--scheduled)' },
    { key: 'in_progress',    label: 'In progress',    color: 'var(--in_progress)' },
    { key: 'awaiting_parts', label: 'Awaiting parts', color: 'var(--awaiting_parts)' },
    { key: 'completed',      label: 'Completed',      color: 'var(--completed)' },
  ];
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function fullName(c){ return c ? [c.first_name, c.last_name].filter(Boolean).join(' ').trim() : ''; }

  // ── TN / NOLA region split (ported from platform/dispatch.html) ──────────────
  // Route a job to a region by the customer's state, falling back to a known LA city
  // when the state is blank. Powers the header TN/NOLA toggle that scopes the board.
  var region = '';   // 'TN' | 'LA' — defaults to the busier region on first render
  var LA_CITIES = {'new orleans':1,'metairie':1,'kenner':1,'gretna':1,'chalmette':1,'harvey':1,'marrero':1,'westwego':1,'slidell':1,'hammond':1,'covington':1,'mandeville':1,'ponchatoula':1,'baton rouge':1,'denham springs':1,'walker':1,'laplace':1};
  function jobRegion(j){ var c=(j&&j.customer)||{}; var st=String(c.state||'').trim().toUpperCase(); if(st==='LA'||st==='LOUISIANA') return 'LA'; if(st==='TN'||st==='TENNESSEE') return 'TN'; if(!st){ var city=String(c.city||'').trim().toLowerCase(); if(LA_CITIES[city]) return 'LA'; } return 'TN'; }
  function defaultRegion(list){ var tn=0,la=0; (list||[]).forEach(function(j){ if(jobRegion(j)==='LA') la++; else tn++; }); return la>tn?'LA':'TN'; }

  // ── Board skin (per-shop settings.skin) ──────────────────────────────────────
  // Default-on 🎰 Jackpot (cream/gold/red + the ant-magic points engine); a shop can
  // flip settings.skin to 'clean' for the platform's dark-vivid look. Jackpot also
  // stamps data-theme="light" so a dark-OS office can't fight the cream skin.
  function applySkin(sk){
    try{
      var root=document.documentElement;
      if(sk==='clean'){ root.setAttribute('data-skin',''); root.removeAttribute('data-theme'); }
      else { root.setAttribute('data-skin','jackpot'); root.setAttribute('data-theme','light'); }
    }catch(_){}
  }
  var _knownJobIds = null;   // baseline of job ids → an owl swoops in when a NEW one lands

  // ── CONNECT GATE — no project wired yet ────────────────────────────────────
  if (!cfg.url || !cfg.anonKey) {
    app.innerHTML =
      '<div class="gate"><h1>🐜 Connect your project</h1>' +
      '<p>This is the Ant office board. Point it at your Supabase platform project to bring it alive.</p>' +
      '<p>Fill <span class="mono">platform/config.js</span> with your project URL and the <b>anon public</b> key ' +
      '(Supabase → Settings → API), then reload. The anon key is safe in the browser — Row-Level Security protects every shop\'s data.</p></div>';
    return;
  }

  sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  // ── SIGN-IN VIEW ───────────────────────────────────────────────────────────
  function renderSignIn(msg) {
    app.innerHTML =
      '<div class="gate"><h1>🐜 Office board</h1><p>Sign in to your shop.</p>' +
      '<label>Email</label><input id="em" type="email" autocomplete="username" placeholder="you@shop.com">' +
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">' +
      '<button class="primary" id="go">Sign in</button>' +
      '<div class="err" id="err">' + esc(msg || '') + '</div></div>';
    var go = document.getElementById('go');
    function submit() {
      var em = document.getElementById('em').value.trim();
      var pw = document.getElementById('pw').value;
      if (!em || !pw) { document.getElementById('err').textContent = 'Enter your email and password.'; return; }
      go.disabled = true; go.textContent = 'Signing in…';
      sb.auth.signInWithPassword({ email: em, password: pw }).then(function (r) {
        if (r.error) { renderSignIn(r.error.message); }
        else { boot(); }
      });
    }
    go.onclick = submit;
    document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  }

  // ── BOARD VIEW ─────────────────────────────────────────────────────────────
  var shopName = '';
  function renderShell() {
    // header carries class="topbar" + an inner .tb-row so ant-magic can hang the 💰
    // house-points badge (it inserts right before the .seg region toggle) and the garland.
    app.innerHTML =
      '<header class="topbar">' +
        '<div class="tb-row">' +
          '<span class="brand">🐜 Ant</span><span class="shop" id="shop">' + esc(shopName || '…') + '</span>' +
          '<span class="sp"></span>' +
          '<div class="seg" id="region-seg"></div>' +
          '<button id="remit">💵 Remittance</button><button id="settings">⚙️ Settings</button><button id="refresh">Refresh</button><button id="out">Sign out</button>' +
        '</div>' +
        '<nav class="hop" aria-label="Jump to">' +
          '<a href="/platform/dispatch.html">📅 Dispatch</a>' +
          '<a href="/platform/needs-scheduled.html">🗓 Needs Scheduled</a>' +
          '<a href="/platform/comms.html">💬 Messages</a>' +
          '<a href="/platform/owner.html">💰 Owner</a>' +
          '<a href="/platform/office-overview.html">🗂 Overview</a>' +
        '</nav>' +
      '</header>' +
      '<div class="wrap"><div class="money" id="money"></div><div class="filters" id="filters"></div><div class="board" id="board"></div></div>';
    document.getElementById('out').onclick = function () { if (rt) { try { sb.removeChannel(rt); } catch (e) {} } sb.auth.signOut().then(renderSignIn); };
    document.getElementById('refresh').onclick = loadBoard;
    document.getElementById('settings').onclick = openSettings;
    var rm = document.getElementById('remit'); if (rm) rm.onclick = openRemittance;
    renderRegionToggle();
  }

  // The TN / NOLA region toggle — lives in .tb-row (as the .seg element ant-magic
  // hangs its badge before). Counts + on-state refresh from jobsCache each board load.
  function renderRegionToggle(){
    var seg = document.getElementById('region-seg'); if(!seg) return;
    var tn=0, la=0; jobsCache.forEach(function(j){ if(jobRegion(j)==='LA') la++; else tn++; });
    if(region!=='TN' && region!=='LA' && jobsCache.length) region = defaultRegion(jobsCache);   // busier region on first load
    seg.innerHTML =
      '<button data-r="TN" class="'+(region==='TN'?'on':'')+'">TN'+(tn?' '+tn:'')+'</button>' +
      '<button data-r="LA" class="'+(region==='LA'?'on':'')+'">NOLA'+(la?' '+la:'')+'</button>';
    seg.querySelectorAll('button[data-r]').forEach(function(b){ b.onclick=function(){ region=b.getAttribute('data-r'); renderRegionToggle(); renderBoard(); }; });
  }

  // ── PAYMENTS (self-serve): the shop's OWN ways to get paid. Their money, their
  // accounts — we never touch it, never process it, it never lands in our bank. They add
  // or change these anytime; they show on the customer's invoice so customers pay them
  // directly. Structured in settings.pay.methods + an auto-built pay_instructions text so
  // the hosted invoice keeps working.
  var PAY_TYPES = [
    { t:'zelle',    l:'Zelle',            ph:'email or phone on your Zelle' },
    { t:'cashapp',  l:'Cash App',         ph:'$YourCashtag' },
    { t:'venmo',    l:'Venmo',            ph:'@your-venmo' },
    { t:'applepay', l:'Apple Pay',        ph:'phone # to send Apple Pay to' },
    { t:'paypal',   l:'PayPal',           ph:'your PayPal.me link or email' },
    { t:'link',     l:'Card / pay link',  ph:'https://square.link/… or your Stripe link' },
    { t:'check',    l:'Check payable to', ph:'Your Business LLC' },
    { t:'other',    l:'Other',            ph:'how to pay' },
  ];
  function payTypeMeta(t){ for(var i=0;i<PAY_TYPES.length;i++){ if(PAY_TYPES[i].t===t) return PAY_TYPES[i]; } return PAY_TYPES[PAY_TYPES.length-1]; }
  function payRowHtml(m){
    m = m || {};
    var opts = PAY_TYPES.map(function(p){ return '<option value="'+p.t+'"'+(m.type===p.t?' selected':'')+'>'+esc(p.l)+'</option>'; }).join('');
    var ph = payTypeMeta(m.type||'zelle').ph;
    var IST='padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;box-sizing:border-box';
    return '<div class="payrow" style="display:flex;gap:6px;margin-bottom:7px;align-items:center">' +
      '<select class="pm-type" style="'+IST+';flex:0 0 40%">'+opts+'</select>' +
      '<input class="pm-val" style="'+IST+';flex:1" placeholder="'+esc(ph)+'" value="'+esc(m.value||'')+'">' +
      '<button type="button" class="pm-del" title="Remove" style="flex:0 0 auto;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);cursor:pointer">✕</button>' +
    '</div>';
  }
  function wirePayRow(row){
    var typeSel=row.querySelector('.pm-type'), val=row.querySelector('.pm-val'), del=row.querySelector('.pm-del');
    if(typeSel) typeSel.onchange=function(){ if(!val.value.trim()) val.placeholder=payTypeMeta(typeSel.value).ph; };
    if(del) del.onclick=function(){ try{ row.parentNode.removeChild(row); }catch(e){} };
  }
  function renderPayMethods(methods){
    var box=document.getElementById('payMethods'); if(!box) return;
    var list=(methods&&methods.length)?methods:[{type:'zelle',value:''}];
    box.innerHTML=list.map(payRowHtml).join('');
    box.querySelectorAll('.payrow').forEach(wirePayRow);
  }
  function collectPayMethods(){
    var out=[]; var box=document.getElementById('payMethods'); if(!box) return out;
    box.querySelectorAll('.payrow').forEach(function(row){
      var t=row.querySelector('.pm-type').value, v=row.querySelector('.pm-val').value.trim();
      if(v) out.push({ type:t, value:v, label:payTypeMeta(t).l });
    });
    return out;
  }
  function payInstructionsText(methods, note){
    var lines=(methods||[]).map(function(m){ return m.label + ': ' + m.value; });
    if(note) lines.push(note);
    return lines.join('\n');
  }

  // ── SETTINGS (per-shop config: review link + parts distributor) ─────────────
  function openSettings() {
    var s = shopSettings || {};
    var ov = document.createElement('div'); ov.className = 'ov';
    var b = s.business || {};
    ov.innerHTML =
      '<div class="sheet"><h2>⚙️ Shop settings</h2>' +
      '<div class="sec">Your business (shown on invoices)</div>' +
      '<label>Business name <span class="hint">appears at the top of every invoice</span></label>' +
      '<input id="b_name" placeholder="' + esc(shopName || 'Your Appliance Repair LLC') + '" value="' + esc(b.name || '') + '">' +
      '<label>Address</label><input id="b_addr" placeholder="123 Main St, City, ST 00000" value="' + esc(b.address || '') + '">' +
      '<label>Phone</label><input id="b_phone" placeholder="(555) 123-4567" value="' + esc(b.phone || '') + '">' +
      '<label>Email</label><input id="b_email" placeholder="office@yourshop.com" value="' + esc(b.email || '') + '">' +
      '<label>Tax ID / EIN <span class="hint">for the customer\'s records</span></label>' +
      '<input id="b_tax" placeholder="00-0000000" value="' + esc(b.tax_id || '') + '">' +
      '<label>License #</label><input id="b_lic" placeholder="optional" value="' + esc(b.license || '') + '">' +
      '<div class="sec">💳 How your customers pay you</div>' +
      '<div class="hint" style="margin:-4px 0 8px">Your accounts, your money — we never touch it. Add your own Zelle, Cash App, Apple Pay, or a card link (Square / Stripe / PayPal). These show on your invoice so customers pay <b>you</b> directly. Change them anytime.</div>' +
      '<div id="payMethods"></div>' +
      '<button type="button" id="payAdd" style="width:100%;margin-top:2px">＋ Add a way to get paid</button>' +
      '<label style="margin-top:10px">Anything else about paying <span class="hint">(optional)</span></label>' +
      '<textarea id="b_paynote" placeholder="e.g. Deposit due before we order parts" style="width:100%;min-height:44px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical">' + esc((s.pay && s.pay.note) || '') + '</textarea>' +
      '<div class="sec">Sales tax</div>' +
      '<label>Sales tax % <span class="hint">default rate on invoices</span></label>' +
      '<input id="s_tax" inputmode="decimal" placeholder="9.75" value="' + esc(s.tax_rate != null ? s.tax_rate : '') + '">' +
      '<div class="sec">🔌 Connected accounts</div>' +
      '<div class="hint" style="margin:-4px 0 8px">Plug in your own warranty + parts logins (AHS, ServicePower, Marcone…) and Ant runs the automations on <b>your</b> accounts. Encrypted, private to your shop, never shared. You can connect or disconnect anytime.</div>' +
      '<a href="/platform/integrations.html" style="display:block;text-align:center;text-decoration:none;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-weight:650">Connect your vendor accounts →</a>' +
      '<div class="sec">Board skin</div>' +
      '<label>Look of this board <span class="hint">🎰 Jackpot = the casino board (house points + celebrations) · ✨ Clean = plain</span></label>' +
      '<select id="s_skin" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit">' +
        '<option value="jackpot"'+(s.skin!=='clean'?' selected':'')+'>🎰 Jackpot</option>' +
        '<option value="clean"'+(s.skin==='clean'?' selected':'')+'>✨ Clean</option>' +
      '</select>' +
      '<div class="sec">Tools</div>' +
      '<label>Review link <span class="hint">Google, Facebook, Yelp — wherever you collect reviews. This is the link customers tap to review you.</span></label>' +
      '<input id="s_review" placeholder="https://g.page/r/…/review — or your Facebook / Yelp review URL" value="' + esc(s.review_url || '') + '">' +
      '<label>Parts distributor <span class="hint">the name on the tech\'s parts button</span></label>' +
      '<input id="s_dname" placeholder="Marcone" value="' + esc(s.distributor_name || '') + '">' +
      '<label>Distributor search link <span class="hint">use <b>{q}</b> where the model/part goes</span></label>' +
      '<input id="s_durl" placeholder="https://yoursupplier.com/search?q={q}" value="' + esc(s.distributor_search_url || '') + '">' +
      '<div class="sec">Your login</div>' +
      '<label>New password <span class="hint">change the temporary one you were given</span></label>' +
      '<div style="display:flex;gap:8px"><input id="np" type="password" autocomplete="new-password" placeholder="at least 6 characters" style="flex:1"><button type="button" id="np_go">Update</button></div>' +
      '<div class="hint" id="np_msg" style="margin-top:6px"></div>' +
      '<div class="srow"><button id="s_cancel">Cancel</button><button class="primary" id="s_save">Save</button></div>' +
      '<div class="err" id="s_err"></div></div>';
    document.body.appendChild(ov);
    var close = function () { try { document.body.removeChild(ov); } catch (e) {} };
    ov.onclick = function (e) { if (e.target === ov) close(); };
    document.getElementById('s_cancel').onclick = close;
    // Payment methods: render the shop's own list (seed legacy free-text into the note).
    renderPayMethods(s.pay && s.pay.methods);
    if (!(s.pay && s.pay.note) && !(s.pay && s.pay.methods) && s.pay_instructions) { var pn=document.getElementById('b_paynote'); if(pn) pn.value=s.pay_instructions; }
    var payAdd = document.getElementById('payAdd');
    if (payAdd) payAdd.onclick = function(){ var box=document.getElementById('payMethods'); var d=document.createElement('div'); d.innerHTML=payRowHtml({type:'zelle',value:''}); var row=d.firstChild; box.appendChild(row); wirePayRow(row); row.querySelector('.pm-val').focus(); };
    var npGo = document.getElementById('np_go');
    if (npGo) npGo.onclick = function () {
      var pw = (document.getElementById('np').value || '').trim();
      var msg = document.getElementById('np_msg');
      if (pw.length < 6) { msg.textContent = 'Use at least 6 characters.'; return; }
      npGo.disabled = true; npGo.textContent = 'Updating…';
      sb.auth.updateUser({ password: pw }).then(function (r) {
        npGo.disabled = false; npGo.textContent = 'Update';
        if (r.error) { msg.textContent = r.error.message; return; }
        document.getElementById('np').value = ''; msg.textContent = '✓ Password updated.';
      });
    };
    document.getElementById('s_save').onclick = function () {
      var btn = document.getElementById('s_save'); btn.disabled = true; btn.textContent = 'Saving…';
      var taxRaw = document.getElementById('s_tax').value.trim();
      var gv = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; };
      var payMethods = collectPayMethods();
      var payNote = gv('b_paynote');
      var skinEl = document.getElementById('s_skin');
      var skinVal = (skinEl && skinEl.value === 'clean') ? 'clean' : 'jackpot';
      var next = Object.assign({}, shopSettings, {
        review_url: gv('s_review'),
        distributor_name: gv('s_dname'),
        distributor_search_url: gv('s_durl'),
        tax_rate: taxRaw === '' ? null : (parseFloat(taxRaw) || 0),
        skin: skinVal,
        pay: { methods: payMethods, note: payNote },
        pay_instructions: payInstructionsText(payMethods, payNote),   // keep text in sync for the invoice
        business: {
          name: gv('b_name'), address: gv('b_addr'), phone: gv('b_phone'),
          email: gv('b_email'), tax_id: gv('b_tax'), license: gv('b_lic'),
        },
      });
      sb.from('company').update({ settings: next }).eq('id', companyId).then(function (r) {
        if (r.error) { btn.disabled = false; btn.textContent = 'Save'; document.getElementById('s_err').textContent = r.error.message; return; }
        shopSettings = next; applySkin(skinVal); close();   // flip the look live
      });
    };
  }

  // ── warranty remittance (the accuracy hinge) ────────────────────────────────
  // A warranty vendor pays a batch EFT/check covering several claims, often LESS than
  // billed. Split it back to each job: set the REAL collected on each invoice. The shop's
  // collected + take-home become accurate; the tech still earns his full labor cut (the
  // shop absorbs the warranty haircut).
  function openRemittance(){
    var pending = jobsCache.filter(function(j){
      if(!j.warranty_company) return false;
      var iv=invByJob[j.id]; if(!iv || !(iv.total_cents>0)) return false;
      return (iv.collected_cents||0) < iv.total_cents;
    });
    var ov=document.createElement('div'); ov.className='ov';
    var rows = pending.map(function(j){
      var iv=invByJob[j.id]; var rem=iv.total_cents-(iv.collected_cents||0);
      return '<tr data-inv="'+iv.id+'">'+
        '<td class="nm">'+esc(fullName(j.customer)||'Customer')+'<div class="hint">'+esc(j.warranty_company||'')+' · billed '+money(iv.total_cents)+(((iv.collected_cents||0)>0)?' · already '+money(iv.collected_cents):'')+'</div></td>'+
        '<td style="text-align:right"><input class="remAmt" inputmode="decimal" style="width:96px" placeholder="'+(rem/100).toFixed(2)+'"></td></tr>';
    }).join('');
    ov.innerHTML='<div class="sheet"><h2>💵 Warranty remittance</h2>'+
      '<div class="hint">A warranty company paid a batch (EFT/check) covering several claims — often less than billed. Enter the reference, then the amount they actually paid on each job (blank = skip). Collected + take-home update to the real money; the tech still earns his full labor cut.</div>'+
      '<label>Reference (EFT # / check #)</label><input id="remRef" placeholder="EFT 1157090212">'+
      '<label>Total received <span class="hint">(optional — to reconcile)</span></label><input id="remTotal" inputmode="decimal" placeholder="0.00">'+
      '<div id="remRecon" class="hint" style="margin-top:6px"></div>'+
      (pending.length? '<div class="ptwrap" style="margin-top:10px;max-height:48vh;overflow:auto"><table class="pt"><thead><tr><th>Job</th><th style="text-align:right">Paid on this job</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        : '<div class="empty" style="margin-top:12px">No warranty jobs waiting on payment. As you bill warranty jobs, they show here.</div>')+
      '<div class="err" id="remErr"></div>'+
      '<div class="srow" style="margin-top:12px"><button id="remSave">Record remittance</button><button id="remCancel">Close</button></div></div>';
    document.body.appendChild(ov);
    var close=function(){ try{document.body.removeChild(ov);}catch(e){} };
    ov.onclick=function(e){ if(e.target===ov) close(); };
    document.getElementById('remCancel').onclick=close;
    function recompute(){
      var alloc=0; Array.prototype.forEach.call(ov.querySelectorAll('.remAmt'),function(i){ alloc+=cents(i.value||i.placeholder); });
      var recv=cents(document.getElementById('remTotal').value);
      var el=document.getElementById('remRecon');
      if(recv>0){ var diff=recv-alloc; el.textContent='Allocated '+money(alloc)+' of '+money(recv)+' received'+(diff===0?' ✓ balanced':(diff>0?' · '+money(diff)+' unallocated':' · over by '+money(-diff))); el.style.color=diff===0?'#12a150':'#c77700'; }
      else { el.textContent='Allocated '+money(alloc); el.style.color=''; }
    }
    Array.prototype.forEach.call(ov.querySelectorAll('.remAmt'),function(i){ i.oninput=recompute; });
    document.getElementById('remTotal').oninput=recompute; recompute();
    document.getElementById('remSave').onclick=function(){
      var ref=document.getElementById('remRef').value.trim();
      var updates=[];
      Array.prototype.forEach.call(ov.querySelectorAll('tr[data-inv]'),function(tr){
        var raw=tr.querySelector('.remAmt').value.trim(); if(!raw) return;
        var amt=cents(raw); if(amt<=0) return;
        updates.push({ invId:tr.getAttribute('data-inv'), amt:amt });
      });
      if(!updates.length){ document.getElementById('remErr').textContent='Enter the amount paid on at least one job (leave the rest blank).'; return; }
      var btn=document.getElementById('remSave'); btn.disabled=true; btn.textContent='Recording…';
      var now=new Date().toISOString();
      Promise.all(updates.map(function(u){
        return sb.from('invoice').update({ collected_cents:u.amt, status:'paid', paid_method:'warranty_eft', paid_ref:ref||null, paid_at:now }).eq('id',u.invId);
      })).then(function(rs){
        var err=rs.filter(function(r){return r.error;})[0];
        if(err){ btn.disabled=false; btn.textContent='Retry'; document.getElementById('remErr').textContent=err.error.message; return; }
        try{ if(window.AntMagic){ AntMagic.award('paid'); AntMagic.train(); } }catch(_){}   // 💰 warranty batch collected
        close(); loadBoard();
      });
    };
  }

  // ── money helpers ───────────────────────────────────────────────────────────
  function money(c){ c=Math.round(c||0); return '$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function cents(v){ var n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); return isNaN(n)?0:Math.round(n*100); }
  var ALLSTATUS = COLS.concat([{ key:'canceled', label:'Canceled', color:'var(--canceled)' }]);
  function statusMeta(k){ for(var i=0;i<ALLSTATUS.length;i++){ if(ALLSTATUS[i].key===k) return ALLSTATUS[i]; } return { key:k, label:(k||'').replace(/_/g,' '), color:'var(--canceled)' }; }

  // ── board state ──────────────────────────────────────────────────────────────
  var activeFilter = 'all', jobsCache = [], invByJob = {}, mediaByJob = {}, msgByJob = {}, partsByJob = {}, stopCounts = {};

  function renderFilters(){
    var counts = { all: jobsCache.length };
    jobsCache.forEach(function(j){ counts[j.status]=(counts[j.status]||0)+1; });
    var chips = [{ key:'all', label:'All' }].concat(ALLSTATUS.filter(function(s){ return (counts[s.key]||0)>0 || s.key!=='canceled'; }));
    document.getElementById('filters').innerHTML = chips.map(function(c){
      return '<button data-f="'+c.key+'" class="'+(activeFilter===c.key?'on':'')+'">'+esc(c.label)+' '+(counts[c.key]||0)+'</button>';
    }).join('');
    document.querySelectorAll('#filters button[data-f]').forEach(function(b){ b.onclick=function(){ activeFilter=b.getAttribute('data-f'); renderFilters(); renderBoard(); }; });
  }

  function renderMoneyBar(){
    var now=new Date(), m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
    var collected=0, invoiced=0, tax=0, due=0;
    Object.keys(invByJob).forEach(function(k){ var iv=invByJob[k];
      invoiced+=iv.total_cents||0; tax+=iv.tax_cents||0;
      if(iv.status==='paid'){ collected+=iv.total_cents||0; } else { due+=iv.total_cents||0; }
    });
    document.getElementById('money').innerHTML =
      '<div class="jackpot">' +
        '<div class="jp-label">💰 Collected this month</div>' +
        '<div class="jp-num" id="jpNum">'+money(lastCollected==null?collected:lastCollected)+'</div>' +
        '<div class="jp-reels">' +
          reel('Outstanding', money(due)) + reel('Tax', money(tax)) + reel('Invoiced', money(invoiced)) +
          '<div class="reel go" id="finBtn"><span class="rl">Reports</span><span class="rv">💵 Statements</span></div>' +
        '</div>' +
      '</div>';
    var fb=document.getElementById('finBtn'); if(fb) fb.onclick=openFinancials;
    animateJackpot(collected);
  }
  function reel(l,v){ return '<div class="reel"><span class="rl">'+esc(l)+'</span><span class="rv">'+esc(v)+'</span></div>'; }
  // The jackpot number rolls up like a slot reel when the collected total climbs (a payment
  // landed) — gold flash on an increase. Sound is left to the paid celebration.
  var lastCollected=null;
  function animateJackpot(to){
    var el=document.getElementById('jpNum'); if(!el){ lastCollected=to; return; }
    var from=(lastCollected==null)?to:lastCollected; lastCollected=to;
    if(from===to){ el.textContent=money(to); return; }
    if(to>from){ el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); },800); }
    var start=null, dur=850;
    function step(ts){ if(start==null) start=ts; var p=Math.min(1,(ts-start)/dur); var e=1-Math.pow(1-p,3); el.textContent=money(Math.round(from+(to-from)*e)); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  // Compact media strip on the board tile (video first), so the office can eyeball the
  // customer's video + model-# photo without opening the job — the inputs for filing the
  // warranty claim by hand. Tiles stop propagation so a tap opens the media, not the drawer.
  function cardMediaHtml(j){
    var media = mediaByJob[j.id] || []; if(!media.length) return '';
    var tiles='', n=0;
    media.filter(function(m){return m.kind==='video'&&m.provider==='cfstream';}).forEach(function(v){ if(n>=4) return; n++; var uid=esc(v.ref);
      tiles += '<a class="mtile vtile" onclick="event.stopPropagation()" target="_blank" rel="noopener" href="https://iframe.cloudflarestream.com/'+uid+'"><img class="vcover" src="https://videodelivery.net/'+uid+'/thumbnails/thumbnail.jpg?time=1s&height=140" alt="" onerror="this.style.display=\'none\'"><span class="play">▶</span></a>'; });
    media.filter(function(m){return m.kind==='photo'&&(m.provider==='storage'||m.provider==='r2');}).forEach(function(p){ if(n>=4) return; n++;
      tiles += '<a class="mtile ptile" onclick="event.stopPropagation()" target="_blank" rel="noopener" data-phhref="'+esc(p.ref)+'"><img data-ph="'+esc(p.ref)+'" alt="photo"></a>'; });
    return tiles ? '<div class="cardmedia">'+tiles+'</div>' : '';
  }

  // ── DENSE-CARD helpers — the legacy TN board's information design, on this theme ──
  // A small copyable chip: the office grabs a claim # / part # for the warranty portal
  // straight off the tile. Copy is wired after render so it stops propagation (won't open
  // the drawer) — the raw value rides on data-copy.
  function copyChip(label, value, kind){
    return '<span class="copychip cc-'+kind+'" data-copy="'+esc(value)+'" title="Tap to copy">'+esc(label)+' <span class="cc-ico">⧉</span></span>';
  }
  // Normalize the warranty vendor to a tidy badge (AHS / SquareTrade / ServicePower / NSA).
  function vendorBadge(co){
    co = String(co||'').trim(); if(!co) return '';
    var n = co.toLowerCase(), lbl = co;
    if(/ahs|american\s*home|frontdoor/.test(n)) lbl='AHS';
    else if(/square\s*trade|allstate/.test(n)) lbl='SquareTrade';
    else if(/service\s*power/.test(n)) lbl='ServicePower';
    else if(/\bnsa\b|national\s*service/.test(n)) lbl='NSA';
    return '<span class="vbadge" title="'+esc(co)+'">'+esc(lbl)+'</span>';
  }
  // 🔒 Customer available — the day/window the customer agreed to (texted availability, else
  // the vendor-promised service window on the scheduled day). Locked blue like the legacy tile.
  function availChip(j){
    var a = String(j.availability||'').trim();
    if(a) return '<div class="availc">🔒 Customer available '+esc(a.slice(0,120))+'</div>';
    var win = String(j.service_window||'').trim();
    if(win){ var day = j.scheduled_day ? schDay(j.scheduled_day) : ''; return '<div class="availc">🔒 Customer available '+(day?esc(day)+': ':'')+esc(win.slice(0,60))+'</div>'; }
    return '';
  }
  function todayCT(){ try{ return new Date().toLocaleDateString('en-CA',{timeZone:'America/Chicago'}); }catch(e){ return new Date().toISOString().slice(0,10); } }
  var PARTS_WAIT_RE = /to_order|await|order|need|backorder/i;
  // OVERDUE — the job slipped its expected timing (not merely old): parts past their ETA, or a
  // scheduled day that already passed without completing. ISO YYYY-MM-DD compares as strings.
  function isOverdue(j){
    if(j.status==='completed'||j.status==='canceled') return false;
    var today = todayCT();
    var eta = String(j.parts_eta||'').trim();
    if((j.status==='awaiting_parts' || PARTS_WAIT_RE.test(String(j.parts_status||''))) && eta && eta < today) return true;
    var sd = String(j.scheduled_day||'').trim();
    if(sd && sd < today) return true;
    return false;
  }
  function hasReport(j){ return !!(j.tdr_diagnosis || j.tdr_failed_component || j.tdr_part_number); }
  // The compact flag set — only what actually applies to this job.
  function buildFlags(j, iv, terminal){
    var f=[];
    var n = j.stop_id ? (stopCounts[j.stop_id]||0) : 0;
    if(n>1) f.push('<span class="fchip fmm" title="Multi-appliance stop — each machine has its own report">🧩 '+n+' machines</span>');
    if(isOverdue(j)) f.push('<span class="fchip fover">⏰ OVERDUE</span>');
    if(j.customer_cutoff && String(j.customer_cutoff).trim()) f.push('<span class="fchip fover" title="Customer has a hard cutoff — must leave by this time">⏰ Leave by '+esc(String(j.customer_cutoff).trim().slice(0,12))+'</span>');
    var needsParts = j.status==='awaiting_parts' || PARTS_WAIT_RE.test(String(j.parts_status||''));
    if(needsParts && !terminal) f.push('<span class="fchip fparts">🔧 NEEDS PARTS</span>');
    if(j.status==='completed' && !iv) f.push('<span class="fchip fclose" title="Completed but no invoice — finish the paperwork">⚠️ NOT CLOSED OUT</span>');
    if(!hasReport(j) && (j.status==='scheduled'||j.status==='in_progress')) f.push('<span class="fchip fdiag" title="No tech report on file yet">🔍 DIAGNOSIS</span>');
    if(j.office_notes && String(j.office_notes).trim()) f.push('<span class="fchip fnote" title="Office note on this job">📋 NOTE</span>');
    if(j.needs_two_techs) f.push('<span class="fchip">🧑‍🤝‍🧑 2-man</span>');
    if(j.long_job) f.push('<span class="fchip">⏳ Long job</span>');
    return f.join('');
  }
  // Inline actions by status — wired after render (stopPropagation).
  function buildActions(j, terminal){
    var out='';
    if(j.status==='scheduled' || j.status==='in_progress') out += '<button type="button" class="cardact act-complete" data-job="'+j.id+'">✓ Mark complete</button>';
    if(!hasReport(j) && !terminal && (j.technician && j.technician.name) && (j.status==='in_progress'||j.status==='completed')) out += '<button type="button" class="cardact act-report" data-job="'+j.id+'">📋 Request report</button>';
    return out ? '<div class="cardacts">'+out+'</div>' : '';
  }

  function renderBoard(){
    // multi-machine: count jobs sharing a stop_id, computed from the loaded set (no query).
    stopCounts = {};
    jobsCache.forEach(function(j){ if(j.stop_id){ stopCounts[j.stop_id]=(stopCounts[j.stop_id]||0)+1; } });
    if(region!=='TN' && region!=='LA') region = defaultRegion(jobsCache);   // scope the board to the selected region
    var jobs = jobsCache.filter(function(j){ return jobRegion(j)===region && (activeFilter==='all' || j.status===activeFilter); });
    var groups = activeFilter==='all' ? ALLSTATUS.map(function(s){return s.key;}) : [activeFilter];
    var extra = {}; jobs.forEach(function(j){ if(groups.indexOf(j.status)<0){ extra[j.status]=1; } });
    Object.keys(extra).forEach(function(k){ groups.push(k); });
    var html = groups.map(function(k){
      var list = jobs.filter(function(j){ return j.status===k; });
      if(!list.length) return '';
      var m = statusMeta(k);
      var cards = list.map(function(j){
        var unit = j.unit && j.unit.label ? j.unit.label : '';
        var tech = j.technician && j.technician.name ? j.technician.name : 'Unassigned';
        var iv = invByJob[j.id];
        var terminal = (j.status==='completed'||j.status==='canceled');
        var badge = iv ? '<span class="money-badge '+(iv.status==='paid'?'paid':'due')+'">'+(iv.status==='paid'?'PAID ':'')+money(iv.total_cents)+'</span>' : '';

        // top row: mono status pill (theme .spill) + days-waiting chip (colors as it ages)
        var age = j.created_at ? Math.floor((Date.now()-new Date(j.created_at).getTime())/86400000) : -1;
        var ageChip = (!terminal && age>=1) ? '<span class="agechip" style="'+(age>30?'color:#ff6a52':(age>14?'color:var(--gold)':''))+'">⏳ '+age+'d</span>' : '';
        var topRow = '<div class="ctop"><span class="spill s-'+esc(j.status)+'">'+esc(statusMeta(j.status).label)+'</span>'+ageChip+'</div>';

        // header chips: claim/dispatch ref (copyable) · part # (copyable) · vendor · city
        var refChip='', claim=String(j.claim_number||'').trim(), disp=String(j.dispatch_id||'').trim();
        if(claim) refChip = copyChip('Claim '+claim, claim, 'ref');
        else if(disp) refChip = copyChip('Disp '+disp, disp, 'ref');
        var pnum = String(j.tdr_part_number||'').trim();
        if(!pnum){ var jp=partsByJob[j.id]; if(jp && jp.length){ pnum=String(jp[0].number||'').trim(); } }
        var partChip = pnum ? copyChip('🔧 '+pnum, pnum, 'part') : '';
        var vendor = vendorBadge(j.warranty_company);
        var city = j.customer && j.customer.city ? String(j.customer.city).trim() : '';
        var cityChip = city ? '<span class="citychip">📍 '+esc(city)+'</span>' : '';
        var hdr = (refChip||partChip||vendor||cityChip) ? '<div class="chdr">'+refChip+partChip+vendor+cityChip+'</div>' : '';

        // customer-agreed availability / promised window
        var avail = availChip(j);
        // latest inbound customer message — green bubble, 2-line clamp
        var msg = msgByJob[j.id];
        var msgHtml = (msg && msg.body) ? '<div class="cmsg">💬 '+esc(String(msg.body).slice(0,160))+'</div>' : '';
        // status / urgency flags (only what applies)
        var flags = buildFlags(j, iv, terminal);
        var actions = buildActions(j, terminal);

        return '<div class="card'+(iv&&iv.status==='paid'?' paidcard':'')+'" data-job="'+j.id+'" style="--sc:'+m.color+'">' +
          topRow +
          '<div class="name">'+esc(fullName(j.customer)||'Customer')+'</div>' +
          hdr +
          (unit?'<div class="unit">'+esc(unit)+'</div>':'') +
          (j.problem?'<div class="prob">'+esc(j.problem)+'</div>':'') +
          avail +
          msgHtml +
          (flags?'<div class="flags">'+flags+'</div>':'') +
          cardMediaHtml(j) +
          actions +
          '<div class="foot"><span class="tech">'+esc(tech)+'</span>'+(badge||'')+'</div></div>';
      }).join('');
      return '<div class="col"><h3><span class="dot" style="background:'+m.color+'"></span>'+esc(m.label)+'<span class="n">'+list.length+'</span></h3>'+cards+'</div>';
    }).join('') || '<div class="empty">Nothing here yet.</div>';
    var b=document.getElementById('board'); b.innerHTML=html;
    // copy chips — grab claim/part # for the warranty portal without opening the drawer
    b.querySelectorAll('.copychip[data-copy]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation(); var t=el.getAttribute('data-copy'); try{ if(navigator.clipboard) navigator.clipboard.writeText(t); }catch(_){} var ico=el.querySelector('.cc-ico'); if(ico){ var old=ico.textContent; ico.textContent='✓'; setTimeout(function(){ ico.textContent=old; },1000); } }; });
    // ✓ Mark complete — set the job completed straight from the tile (a card moving column = a "file")
    b.querySelectorAll('.act-complete[data-job]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation(); var id=el.getAttribute('data-job'); try{ if(window.AntMagic){ var rc=el.getBoundingClientRect(); AntMagic.award('file', rc.left+rc.width/2, rc.top); } }catch(_){} el.disabled=true; el.textContent='Saving…'; sb.from('job').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',id).then(function(r){ if(r.error){ el.disabled=false; el.textContent='✓ Mark complete'; return; } loadBoard(); }); }; });
    // 📋 Request report — flag the tech (office note) that the report is needed
    b.querySelectorAll('.act-report[data-job]').forEach(function(el){ el.onclick=function(ev){ ev.stopPropagation(); var id=el.getAttribute('data-job'); var j=jobsCache.filter(function(x){return String(x.id)===String(id);})[0]; el.disabled=true; el.textContent='Requested ✓'; var line='📋 Tech report requested — '+new Date().toLocaleDateString(); var prev=(j&&j.office_notes)?j.office_notes+'\n':''; sb.from('job').update({office_notes:prev+line}).eq('id',id).then(function(){ if(j) j.office_notes=prev+line; }); }; });
    b.querySelectorAll('.card[data-job]').forEach(function(c){ c.onclick=function(){ var j=jobsCache.filter(function(x){return x.id===c.getAttribute('data-job');})[0]; if(j) openJob(j); }; });
    hydratePics(b);
    // 🎰 The Great Hall — badge + garland + once-a-day welcome; an owl for a genuinely-new job.
    try{ if(window.AntMagic){
      AntMagic.init();
      var ids={}; jobsCache.forEach(function(j){ ids[j.id]=1; });
      if(_knownJobIds){ var fresh=false; for(var k in ids){ if(!_knownJobIds[k]){ fresh=true; break; } } if(fresh) AntMagic.owl(); }
      _knownJobIds=ids;
    } }catch(_){}
  }

  // ── Customer intake relay — the owner's "Teddy Tool" view: what the customer sent
  // in from the link Ann texted them (video, model photo, availability, signed release,
  // and the wear-item / floor-protection choices), pulled straight from the tenant DB.
  // ── SCHEDULE HANDSHAKE (office side): see the customer's day requests (one-tap book) and
  // offer a day back to them (they accept from their portal). Three sides, everyone helps.
  function schWin(w){ return w==='am'?'mornings':(w==='pm'?'afternoons':'anytime'); }
  function schDay(d){ try{ return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }catch(e){ return d; } }
  function loadSched(job){
    var box=document.getElementById('jsched'); if(!box) return;
    sb.from('schedule_offer').select('id,direction,proposed_day,win,note,status').eq('job_id',job.id).eq('status','pending').order('created_at',{ascending:false}).then(function(r){
      var offers=(r.data)||[]; var html='';
      if(job.scheduled_day) html+='<div class="hint" style="margin-bottom:8px">Booked: <b>'+esc(schDay(job.scheduled_day))+'</b></div>';
      offers.filter(function(o){return o.direction==='customer';}).forEach(function(o){
        html+='<div class="offrow"><div class="ot">🙋 Customer wants <b>'+esc(schDay(o.proposed_day))+'</b> · '+schWin(o.win)+(o.note?' — '+esc(o.note):'')+'</div><button class="book" data-book="'+esc(o.id)+'" data-day="'+esc(o.proposed_day)+'">Book it</button></div>';
      });
      offers.filter(function(o){return o.direction==='shop';}).forEach(function(o){
        html+='<div class="offrow pend"><div class="ot">📤 You offered <b>'+esc(schDay(o.proposed_day))+'</b> · '+schWin(o.win)+' — waiting on customer</div><button class="wd" data-withdraw="'+esc(o.id)+'">Withdraw</button></div>';
      });
      html+='<div class="offform"><input type="date" id="soDay" min="'+new Date().toISOString().slice(0,10)+'"><select id="soWin"><option value="any">Wide open</option><option value="am">Mornings</option><option value="pm">Afternoons</option></select><button class="primary" id="soSend">Offer to customer</button></div>';
      box.innerHTML=html;
      box.querySelectorAll('button[data-book]').forEach(function(b){ b.onclick=function(){ bookRequest(job, b.getAttribute('data-book'), b.getAttribute('data-day'), b); }; });
      box.querySelectorAll('button[data-withdraw]').forEach(function(b){ b.onclick=function(){ b.disabled=true; sb.from('schedule_offer').update({status:'withdrawn',decided_at:new Date().toISOString()}).eq('id',b.getAttribute('data-withdraw')).then(function(){ loadSched(job); }); }; });
      var ss=document.getElementById('soSend'); if(ss) ss.onclick=function(){ sendOffer(job, ss); };
    });
  }
  function bookRequest(job, offerId, day, btn){
    btn.disabled=true; btn.textContent='Booking…';
    sb.from('schedule_offer').update({status:'accepted',decided_at:new Date().toISOString()}).eq('id',offerId)
      .then(function(){ return sb.from('job').update({scheduled_day:day, status:(job.status==='new'||!job.status)?'scheduled':job.status}).eq('id',job.id); })
      .then(function(){ return sb.from('thread_message').insert({company_id:companyId, customer_id:job.customer_id||null, job_id:job.id, direction:'out', channel:'portal', sender:'office', body:'✅ Booked you for '+day}); })
      .then(function(){ job.scheduled_day=day; loadSched(job); loadBoard(); });
  }
  function sendOffer(job, btn){
    var day=document.getElementById('soDay').value, win=document.getElementById('soWin').value||'any';
    if(!day){ document.getElementById('soDay').focus(); return; }
    btn.disabled=true; btn.textContent='Sending…';
    // Server-side: records the shop offer AND texts the customer the day + a one-tap portal
    // link to confirm (or pick another). One atomic call so the customer hears about it.
    sb.auth.getSession().then(function(s){
      var tok=(s&&s.data&&s.data.session&&s.data.session.access_token)||'';
      return fetch('/.netlify/functions/platform-tech-notify?do=schedule_offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:job.id,access_token:tok,day:day,win:win})}).then(function(r){return r.json();});
    }).then(function(res){
      btn.disabled=false; btn.textContent='Offer to customer';
      if(!res||!res.ok){ alert((res&&res.error)||'Could not send.'); return; }
      loadSched(job);
    }).catch(function(){ btn.disabled=false; btn.textContent='Offer to customer'; alert('Could not send — try again.'); });
  }

  // Fire-and-forget: text the newly-assigned tech that a job is on their plate.
  function notifyAssigned(jobId){
    sb.auth.getSession().then(function(s){
      var tok=(s&&s.data&&s.data.session&&s.data.session.access_token)||'';
      fetch('/.netlify/functions/platform-tech-notify?do=notify_assigned',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:jobId,access_token:tok})}).catch(function(){});
    });
  }

  // R2 photos are tenant-scoped behind a signer — batch-sign refs with the staff session
  // token and drop the real URL into each <img src> (and its wrapping link).
  function hydratePics(scope){
    var root = scope || document;
    var imgs = root.querySelectorAll('img[data-ph]'); if(!imgs.length) return;
    var refs=[]; Array.prototype.forEach.call(imgs,function(el){ var r=el.getAttribute('data-ph'); if(r&&refs.indexOf(r)<0) refs.push(r); });
    sb.auth.getSession().then(function(s){
      var tok = s && s.data && s.data.session && s.data.session.access_token; if(!tok) return;
      fetch('/.netlify/functions/platform-media-urls',{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok}, body: JSON.stringify({ refs: refs }) })
        .then(function(x){ return x.json(); }).then(function(d){
          var urls=(d&&d.urls)||{};
          Array.prototype.forEach.call(root.querySelectorAll('img[data-ph]'),function(el){ var u=urls[el.getAttribute('data-ph')]; if(!u) return; el.src=u; var a=el.closest('a[data-phhref]'); if(a) a.href=u; });
        }).catch(function(){});
    });
  }

  function loadIntake(job){
    var box=document.getElementById('jintake'); if(!box) return;
    var L='style="font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;display:inline-block"';
    Promise.all([
      sb.from('job_media').select('kind,provider,ref,label').eq('job_id',job.id),
      sb.from('job').select('availability,waiver_signed_at,waiver_name').eq('id',job.id).limit(1).single(),
      sb.from('thread_message').select('body').eq('job_id',job.id).eq('direction','in').order('created_at',{ascending:false}).limit(25)
    ]).then(function(res){
      var media=(res[0]&&res[0].data)||[];
      var jj=(res[1]&&res[1].data)||{};
      var msgs=((res[2]&&res[2].data)||[]).map(function(m){return String(m.body||'');});
      var vids=media.filter(function(m){return m.kind==='video'&&m.provider==='cfstream';});
      var pics=media.filter(function(m){return m.kind==='photo'&&(m.provider==='storage'||m.provider==='r2');});
      var choices=msgs.filter(function(b){return /🔧|🛟/.test(b);});
      var mediaHtml='';
      vids.forEach(function(m){ var uid=esc(m.ref); mediaHtml+='<a class="mtile vtile" target="_blank" rel="noopener" href="https://iframe.cloudflarestream.com/'+uid+'"><img class="vcover" src="https://videodelivery.net/'+uid+'/thumbnails/thumbnail.jpg?time=1s&height=140" alt="" onerror="this.style.display=\'none\'"><span class="play">▶</span></a> '; });
      pics.forEach(function(m){ mediaHtml+='<a class="mtile ptile" target="_blank" rel="noopener" data-phhref="'+esc(m.ref)+'"><img data-ph="'+esc(m.ref)+'" alt="model"></a> '; });
      var bits=[];
      if(jj.availability) bits.push('📅 '+esc(jj.availability));

  // ── Shared JOB DETAILS — the single-write record. Whoever inputs first (Ann on the
  // call, the customer via intake, the tech in the cockpit) fills it; anyone can correct
  // it here, and it writes to the SAME customer/unit/job rows every surface reads. Input
  // once, shared across the office tile, the tech app, the cockpit, and the customer portal.
  function loadDetails(job){
    var box=document.getElementById('jdetails'); if(!box) return;
    var IST='width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:7px;box-sizing:border-box';
    var di=function(id,label,val,ph,ta){ return '<label style="font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin:2px 0 2px">'+esc(label)+'</label>'+(ta?'<textarea id="'+id+'" style="'+IST+';min-height:52px;resize:vertical" placeholder="'+esc(ph||'')+'">'+esc(val||'')+'</textarea>':'<input id="'+id+'" style="'+IST+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'">'); };
    sb.from('job').select('id,problem,availability,customer_id,unit_id,customer:customer_id(first_name,last_name,phone,address,city,state),unit:unit_id(id,label,attributes)').eq('id',job.id).limit(1).single().then(function(r){
      var j=(r&&r.data)||{}; var c=j.customer||{}; var u=j.unit||{}; var a=u.attributes||{};
      box.innerHTML=
        '<div style="display:flex;gap:8px"><div style="flex:1">'+di('d_appl','Appliance',u.label,'Washer')+'</div><div style="flex:1">'+di('d_brand','Brand',a.brand,'Whirlpool')+'</div></div>'+
        di('d_model','Model #',a.model,'off the sticker')+
        di('d_prob','Problem',j.problem,'what it\'s doing',true)+
        di('d_avail','Availability',j.availability,'days that work')+
        '<div style="display:flex;gap:8px"><div style="flex:1">'+di('d_first','First name',c.first_name,'')+'</div><div style="flex:1">'+di('d_last','Last name',c.last_name,'')+'</div></div>'+
        di('d_phone','Phone',c.phone,'(555) 123-4567')+
        di('d_addr','Address',c.address,'123 Main St')+
        '<div style="display:flex;gap:8px"><div style="flex:2">'+di('d_city','City',c.city,'')+'</div><div style="flex:1">'+di('d_state','State',c.state,'TN')+'</div></div>'+
        '<div class="srow"><button class="primary" id="d_save">Save details</button><span id="d_msg" style="font-size:12px;color:var(--muted);align-self:center"></span></div>';
      document.getElementById('d_save').onclick=function(){
        var gv=function(id){var e=document.getElementById(id);return e?e.value.trim():'';};
        var btn=document.getElementById('d_save'), msg=document.getElementById('d_msg'); btn.disabled=true; btn.textContent='Saving…'; msg.textContent='';
        var attrs=Object.assign({},a,{brand:gv('d_brand')||null,model:gv('d_model')||null});
        var ops=[];
        if(j.customer_id) ops.push(sb.from('customer').update({first_name:gv('d_first')||null,last_name:gv('d_last')||null,phone:gv('d_phone')||null,address:gv('d_addr')||null,city:gv('d_city')||null,state:gv('d_state')||null}).eq('id',j.customer_id));
        if(j.unit_id) ops.push(sb.from('unit').update({label:gv('d_appl')||null,attributes:attrs}).eq('id',j.unit_id));
        ops.push(sb.from('job').update({problem:gv('d_prob')||null,availability:gv('d_avail')||null}).eq('id',job.id));
        Promise.all(ops).then(function(rr){
          var err=rr.filter(function(x){return x&&x.error;})[0];
          btn.disabled=false; btn.textContent='Save details';
          if(err){ msg.textContent=err.error.message; return; }
          msg.textContent='Saved ✓ — everyone sees it'; loadBoard();
          setTimeout(function(){ if(msg) msg.textContent=''; },2500);
        });
      };
    }).catch(function(){ if(box) box.innerHTML='<div style="font-size:12.5px;color:var(--muted)">Couldn\'t load details.</div>'; });
  }
  // ── 💰 PAYMENT panel (warranty-aware) ───────────────────────────────────────
  // Warranty jobs → nothing due. Cash jobs → the amount from the saved invoice + three
  // ways to collect. Reuses existing paths: card + pay-link ride the "Text invoice" send
  // (the hosted invoice takes a card); cash/check marks the saved invoice paid. No new
  // Stripe wiring, no dead buttons.
  function renderPaymentPanel(job){
    var box=document.getElementById('jpayment'); if(!box) return;
    if(job.warranty_company){
      box.innerHTML='<div class="paycovered">🛡 Covered by warranty — nothing due</div>';
      return;
    }
    var iv=invByJob[job.id]||null;
    var dueTxt = iv ? (iv.status==='paid' ? 'Paid — '+money(iv.total_cents) : 'Amount due '+money(iv.total_cents)) : 'Save the invoice above to set the amount due';
    box.innerHTML=
      '<div class="paydue">'+esc(dueTxt)+'</div>'+
      '<div class="cardacts" style="margin-top:0">'+
        '<button type="button" class="cardact" id="payCard">💳 Take card</button>'+
        '<button type="button" class="cardact" id="payCash">💵 Mark cash/check</button>'+
        '<button type="button" class="cardact" id="payLink">📲 Text pay link</button>'+
      '</div>'+
      '<div id="payCashConfirm" style="display:none;margin-top:8px;align-items:center;gap:7px;flex-wrap:wrap"></div>'+
      '<span class="hint" id="payMsg" style="display:block;margin-top:6px"></span>';
    var pc=document.getElementById('payCard'); if(pc) pc.onclick=function(){ sendInvoice(job); };   // hosted invoice takes a card
    var pl=document.getElementById('payLink'); if(pl) pl.onclick=function(){ sendInvoice(job); };   // same durable pay link
    var pcash=document.getElementById('payCash');
    if(pcash) pcash.onclick=function(){
      var iv2=invByJob[job.id]||null, msg=document.getElementById('payMsg');
      if(!iv2){ if(msg) msg.textContent='Save the invoice above first, then mark it paid.'; return; }
      var cf=document.getElementById('payCashConfirm'); if(!cf) return;
      cf.style.display='flex';
      cf.innerHTML='<span class="hint">Mark paid:</span>'+
        '<button type="button" class="cardact" data-m="Cash" style="flex:0 0 auto;min-width:0">💵 Cash</button>'+
        '<button type="button" class="cardact" data-m="Check" style="flex:0 0 auto;min-width:0">🧾 Check</button>'+
        '<button type="button" class="cardact" data-m="" style="flex:0 0 auto;min-width:0">Cancel</button>';
      cf.querySelectorAll('button[data-m]').forEach(function(b){ b.onclick=function(){
        var m=b.getAttribute('data-m');
        if(!m){ cf.style.display='none'; cf.innerHTML=''; return; }
        b.disabled=true;
        var now=new Date().toISOString();
        sb.from('invoice').update({status:'paid',paid_method:m,collected_cents:iv2.total_cents,paid_at:now}).eq('id',iv2.id).then(function(r){
          if(r.error){ b.disabled=false; if(msg) msg.textContent=r.error.message; return; }
          invByJob[job.id]=Object.assign({},iv2,{status:'paid',paid_method:m,collected_cents:iv2.total_cents,paid_at:now});
          try{ if(window.AntMagic){ AntMagic.award('paid'); AntMagic.train(); } }catch(_){}   // 💰 money in — jackpot
          // reflect in the invoice worksheet controls if present
          var jp=document.getElementById('jpaid'); if(jp) jp.checked=true;
          var jm=document.getElementById('jmethod'); if(jm) jm.value=m;
          renderPaymentPanel(job); loadBoard();
        });
      }; });
    };
  }

  // ── ✅ OFFICE CHECKLIST — shared, persisted to job.checklist (jsonb) ─────────
  // Stored as { "<key>": true } — ticked keys only; unticking drops the key. Using the
  // column (not localStorage) is the point: any office person on any device sees the same ticks.
  var CHECKLIST_STEPS = [
    { k:'info_captured',       l:'Info captured' },
    { k:'video_prediag',       l:'Video call / prediag' },
    { k:'collect_payment',     l:'Collect payment due' },
    { k:'schedule_appt',       l:'Schedule appointment' },
    { k:'report_tech',         l:'Report from technician' },
    { k:'order_parts',         l:'Order the parts' },
    { k:'part_tracking',       l:'Add to part list / tracking' },
    { k:'report_warranty',     l:'Report to warranty / estimate' },
    { k:'call_text_status',    l:'Call & text customer w/ status' },
    { k:'schedule_completion', l:'Schedule completion (if needed)' },
    { k:'follow_up',           l:'Follow up with customer' },
    { k:'return_parts',        l:'Return any parts (if needed)' },
    { k:'invoice',             l:'Invoice' },
    { k:'payout_deductible',   l:'Pay out deductible (payroll)' },
    { k:'payout_invoice',      l:'Pay out invoice (payroll)' },
  ];
  function checklistState(job){ var c=job.checklist; return (c && typeof c==='object') ? c : {}; }
  function checklistProgress(st){ var d=0; CHECKLIST_STEPS.forEach(function(s){ if(st[s.k]) d++; }); return d; }
  function setChecklistProg(st){ var ph=document.getElementById('jchecklistProg'); if(ph) ph.textContent=checklistProgress(st)+' / '+CHECKLIST_STEPS.length+' done'; }
  function renderChecklist(job){
    var box=document.getElementById('jchecklist'); if(!box) return;
    var st=checklistState(job);
    box.innerHTML='<div class="cklist">'+CHECKLIST_STEPS.map(function(s,i){
      return '<div class="ckrow'+(st[s.k]?' on':'')+'" data-k="'+esc(s.k)+'"><span class="cknum">'+(i+1)+'</span><span class="ckbox">✓</span><span class="cklab">'+esc(s.l)+'</span></div>';
    }).join('')+'</div>';
    setChecklistProg(st);
    box.querySelectorAll('.ckrow[data-k]').forEach(function(el){ el.onclick=function(){ toggleChecklist(job, el.getAttribute('data-k'), el); }; });
  }
  function toggleChecklist(job, key, el){
    var cur=checklistState(job), next=Object.assign({}, cur), willBeOn=!next[key];
    if(willBeOn) next[key]=true; else delete next[key];
    var wasOn=el.classList.contains('on');
    // optimistic
    el.classList.toggle('on', willBeOn); setChecklistProg(next); el.style.pointerEvents='none';
    if(willBeOn){ try{ if(window.AntMagic){ var rc=el.getBoundingClientRect(); AntMagic.award('check', rc.left+rc.width/2, rc.top); } }catch(_){} }   // 🎰 points for keeping the board current
    sb.from('job').update({ checklist: next }).eq('id', job.id).then(function(r){
      el.style.pointerEvents='';
      if(r.error){ el.classList.toggle('on', wasOn); setChecklistProg(cur); return; }  // revert on error
      job.checklist=next;
    });
  }
