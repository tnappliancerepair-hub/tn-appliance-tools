    var techName=function(id){ if(id==null||id==='') return ''; for(var i=0;i<techsCache.length;i++){ if(String(techsCache[i].id)===String(id)) return techsCache[i].name; } return ''; };
    var pad2=function(n){ return (n<10?'0':'')+n; };
    var ymd=function(y,m,d){ return y+'-'+pad2(m+1)+'-'+pad2(d); };
    var todayD=new Date(); var todayStr=ymd(todayD.getFullYear(),todayD.getMonth(),todayD.getDate());
    var rsSel=(job.scheduled_day&&/^\d{4}-\d{2}-\d{2}$/.test(job.scheduled_day))?job.scheduled_day:todayStr;
    if(rsSel<todayStr) rsSel=todayStr;  // never seed a past day as the pick
    var rsMonth=(function(){ var p=rsSel.split('-'); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1); })();
    var rsFmt=function(s){ try{ return new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }catch(e){ return s; } };
    function rsCtxNote(){
      var ce=document.getElementById('rsCtx'); if(!ce) return;
      var tn=techName(job.technician_id)||(job.technician&&job.technician.name)||'no tech';
      var day=job.scheduled_day?rsFmt(job.scheduled_day):'not scheduled';
      ce.innerHTML='Currently: <b>'+esc(tn)+'</b> on <b>'+esc(day)+'</b>. Pick a new day (and/or tech) below, then tap Reschedule.';
    }
    function rsRenderCal(){
      var head=document.getElementById('rsCalHead'), grid=document.getElementById('rsCalGrid'), bar=document.getElementById('rsSelBar');
      if(!grid) return;
      var y=rsMonth.getFullYear(), m=rsMonth.getMonth();
      if(head) head.textContent=rsMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});
      var firstDow=(new Date(y,m,1).getDay()+6)%7;                 // Monday-first offset
      var start=new Date(y,m,1-firstDow);
      var cells='';
      for(var i=0;i<42;i++){
        var c=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
        var cs=ymd(c.getFullYear(),c.getMonth(),c.getDate());
        var inMonth=(c.getMonth()===m && c.getFullYear()===y);
        var isToday=(cs===todayStr), isPast=(cs<todayStr), isSel=(cs===rsSel);
        var st='display:flex;align-items:center;justify-content:center;height:38px;border-radius:9px;font-weight:700;font-variant-numeric:tabular-nums;';
        if(isSel){ st+='background:var(--brand);color:#fff;'; }
        else if(isToday){ st+='box-shadow:inset 0 0 0 2px var(--brand);color:var(--ink);'; }
        else { st+='color:var(--ink);'; }
        if(!inMonth) st+='opacity:.32;';
        if(isPast){ st+='opacity:.28;color:var(--muted);cursor:default;'; } else { st+='cursor:pointer;'; }
        cells+='<div '+(isPast?'':'data-d="'+cs+'" ')+'style="'+st+'">'+c.getDate()+'</div>';
      }
      grid.innerHTML=cells;
      if(bar) bar.textContent=rsFmt(rsSel);
      grid.querySelectorAll('[data-d]').forEach(function(el){ el.onclick=function(){ rsSel=el.getAttribute('data-d'); rsRenderCal(); }; });
    }
    var rsPrev=document.getElementById('rsPrev'), rsNext=document.getElementById('rsNext');
    if(rsPrev) rsPrev.onclick=function(){ rsMonth=new Date(rsMonth.getFullYear(),rsMonth.getMonth()-1,1); rsRenderCal(); };
    if(rsNext) rsNext.onclick=function(){ rsMonth=new Date(rsMonth.getFullYear(),rsMonth.getMonth()+1,1); rsRenderCal(); };
    rsCtxNote(); rsRenderCal();
    var rsGo=document.getElementById('rsGo');
    if(rsGo) rsGo.onclick=function(){
      var te=document.getElementById('rsTech'); var tv=te?te.value:'';
      var techId=(tv!=='')?tv:(job.technician_id||null);        // "— pick tech —" keeps the current tech
      var ee=document.getElementById('rsErr'); if(ee) ee.textContent='';
      var prevTech=job.technician_id;
      rsGo.disabled=true; rsGo.textContent='Saving…';
      sb.from('job').update({ technician_id:techId, scheduled_day:rsSel, status:'scheduled' }).eq('id',job.id).then(function(r){
        rsGo.disabled=false;
        if(r.error){ rsGo.textContent='Reschedule'; if(ee) ee.textContent=r.error.message||'Couldn\'t reschedule — try again.'; return; }
        job.scheduled_day=rsSel; job.technician_id=techId; job.status='scheduled';
        // reflect the change in the assigned-tech select + the status buttons already in this drawer
        var jt=document.getElementById('jtech'); if(jt) jt.value=techId||'';
        var st=document.getElementById('jstatus');
        if(st){ st.querySelectorAll('button').forEach(function(x){ x.className=''; x.style.background=''; }); var on=st.querySelector('button[data-s="scheduled"]'); if(on){ on.className='on'; on.style.background=statusMeta('scheduled').color; } }
        if(techId && String(techId)!==String(prevTech||'')) notifyAssigned(job.id);
        rsGo.textContent='Rescheduled ✓'; setTimeout(function(){ if(rsGo) rsGo.textContent='Reschedule'; },1600);
        rsCtxNote(); loadSched(job); loadBoard();
      });
    };

    // Assign / reassign the tech — office dispatch (RLS lets the office write its own job rows).
    var jt=document.getElementById('jtech');
    if(jt){ jt.onchange=function(){ var val=jt.value||null; jt.disabled=true; sb.from('job').update({technician_id:val}).eq('id',job.id).then(function(r){ jt.disabled=false; var je=document.getElementById('jerr'); if(r.error){ jt.value=job.technician_id||''; if(je) je.textContent='Couldn\'t reassign — try again.'; return; } job.technician_id=val; if(val) notifyAssigned(job.id); loadBoard(); }); }; }

    // status buttons
    var sb2=document.getElementById('jstatus');
    sb2.innerHTML=ALLSTATUS.map(function(s){ return '<button data-s="'+s.key+'" class="'+(job.status===s.key?'on':'')+'" style="'+(job.status===s.key?'background:'+s.color:'')+'">'+esc(s.label)+'</button>'; }).join('');
    sb2.querySelectorAll('button[data-s]').forEach(function(b){ b.onclick=function(){ var ns=b.getAttribute('data-s'); var upd={status:ns}; if(ns==='completed') upd.completed_at=new Date().toISOString(); sb.from('job').update(upd).eq('id',job.id).then(function(r){ if(!r.error){ job.status=ns; try{ if(window.AntMagic){ var rc=b.getBoundingClientRect(); AntMagic.award('file', rc.left+rc.width/2, rc.top); } }catch(_){} sb2.querySelectorAll('button').forEach(function(x){ x.className=''; x.style.background=''; }); b.className='on'; b.style.background=statusMeta(ns).color; if(ns==='completed' && window.antCelebrate){ try{ window.antCelebrate({ tag:'Job done', big:'JOB COMPLETE! 🎉', sub:fullName(job.customer)||'', sound:'both' }); }catch(_){ } } loadBoard(); } }); }; });

    document.getElementById('jnotesSave').onclick=function(){ var t=document.getElementById('jnotes').value; var btn=document.getElementById('jnotesSave'); btn.disabled=true; btn.textContent='Saving…'; sb.from('job').update({office_notes:t}).eq('id',job.id).then(function(r){ job.office_notes=t; btn.disabled=false; btn.textContent=r.error?'Try again':'Saved ✓'; setTimeout(function(){ btn.textContent='Save notes'; },1500); }); };

    // Conversation — office reads the shared thread + texts the customer (office_message).
    loadThread(job);
    document.getElementById('jmsgSend').onclick=function(){ sendCustomerText(job); };
    var jmsgTa=document.getElementById('jmsg');
    if(jmsgTa){ jmsgTa.addEventListener('keydown',function(e){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){ e.preventDefault(); sendCustomerText(job); } }); }

    // scheduling flags — office can set/clear (slot a wider window or a second tech)
    document.querySelectorAll('#jflags button[data-flag]').forEach(function(b){ b.onclick=function(){ var col=b.getAttribute('data-flag')==='two'?'needs_two_techs':'long_job'; var now=!b.classList.contains('on'); b.disabled=true; var upd={}; upd[col]=now; sb.from('job').update(upd).eq('id',job.id).then(function(r){ b.disabled=false; if(r.error)return; b.classList.toggle('on',now); job[col]=now; loadBoard(); }); }; });

    // pay — prefill from existing invoice + lines, live totals
    var inv=invByJob[job.id]||null;
    document.getElementById('tax').value = (shopSettings.tax_rate!=null?shopSettings.tax_rate:'');
    var recompute=function(){
      var laborC=cents(g('labor')), partsC=cents(g('parts')), feeC=cents(g('fee'));
      var applied=document.getElementById('jtripapply').checked && (laborC+partsC)>0;   // credit only when there's a repair
      var taxable=laborC+partsC+(applied?0:feeC);
      var taxp=parseFloat(g('tax'))||0; var tax=Math.round(taxable*taxp/100); var tot=taxable+tax;
      var credit=(applied&&feeC)?'<div class="tr"><span>Trip charge</span><span>'+money(feeC)+'</span></div><div class="tr" style="color:#12a150"><span>Applied to the repair</span><span>−'+money(feeC)+'</span></div>':'';
      document.getElementById('jtotals').innerHTML=credit+'<div class="tr"><span>Subtotal</span><span>'+money(taxable)+'</span></div><div class="tr"><span>Tax ('+taxp+'%)</span><span>'+money(tax)+'</span></div><div class="tr grand"><span>Total</span><span>'+money(tot)+'</span></div>';
    };
    ['labor','parts','fee','tax'].forEach(function(id){ document.getElementById(id).oninput=recompute; });
    document.getElementById('jtripapply').onchange=recompute;
    if(inv){
      document.getElementById('jpaid').checked = inv.status==='paid';
      if(inv.paid_method){ document.getElementById('jmethod').value=inv.paid_method; }
      // recover the labor/parts/fee split from the lines
      sb.from('invoice_line').select('kind,unit_cents,qty').eq('invoice_id',inv.id).then(function(r){
        var rows=r.data||[]; var sums={labor:0,part:0,fee:0}; var hasFee=false, hasCredit=false;
        rows.forEach(function(l){ if(l.kind==='credit'){ hasCredit=true; return; } if(l.kind==='fee') hasFee=true; sums[l.kind]=(sums[l.kind]||0)+Math.round((l.unit_cents||0)*(l.qty||1)); });
        if(sums.labor) document.getElementById('labor').value=(sums.labor/100).toFixed(2);
        if(sums.part)  document.getElementById('parts').value=(sums.part/100).toFixed(2);
        if(sums.fee)   document.getElementById('fee').value=(sums.fee/100).toFixed(2);
        // restore the checkbox: credit line present = applied; a lone fee (no credit) = it was billed on top
        document.getElementById('jtripapply').checked = hasCredit || !hasFee;
        var taxBase=sums.labor+sums.part+(hasCredit?0:sums.fee);
        if(inv.tax_cents && taxBase) document.getElementById('tax').value=(Math.round(inv.tax_cents/taxBase*10000)/100);
        recompute();
      });
    } else { recompute(); }

    // 🔧 Parts the tech logged in the field → enter COST, the owner's margin fills the customer
    // price. The retail sum feeds Parts $ and each part becomes its own receipt line. Nobody asks
    // "what do we charge" and nobody re-keys it — the margin does the pricing.
    (function loadInvoiceParts(){
      var box=document.getElementById('jparts'); if(!box) return;
      var pc=(shopSettings&&shopSettings.parts)||{}, mPct=(pc.markup_pct!=null?+pc.markup_pct:50), mAdd=(+pc.min_add_cents||0);
      var retail=function(costC){ costC=+costC||0; if(costC<=0) return 0; return Math.max(Math.round(costC*(1+mPct/100)), costC+mAdd); };
      sb.from('job_part').select('id,name,number,cost_cents,sell_cents,disposition').eq('job_id',job.id).order('created_at').then(function(r){
        var parts=(r.data||[]).filter(function(p){ var d=(p.disposition||''); return d!=='return'&&d!=='unused'&&d!=='missing'; }); // don't bill returned/unused/missing
        if(!parts.length){ box.innerHTML=''; return; }
        box.innerHTML='<div class="sec" style="margin-top:2px">🔧 Parts the tech used <span class="hint" style="font-weight:400">— enter cost, the '+mPct+'% margin sets the price</span></div>'+
          parts.map(function(p){ var nm=(p.name||'Part');
            var costV=p.cost_cents?(p.cost_cents/100).toFixed(2):'';
            var sellV=(p.sell_cents!=null?p.sell_cents:retail(p.cost_cents)); sellV=sellV?(sellV/100).toFixed(2):'';
            return '<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><span class="k" style="flex:1;min-width:120px">'+esc(nm)+(p.number?' <span class="mono">'+esc(p.number)+'</span>':'')+'</span>'+
              '<span class="v" style="font-size:12px;color:var(--muted)">cost $<input class="pc" data-part="'+esc(p.id)+'" inputmode="decimal" style="width:64px" value="'+costV+'"></span>'+
              '<span class="v">charge $<input class="pp" data-part="'+esc(p.id)+'" data-name="'+esc(nm)+'" inputmode="decimal" style="width:72px" value="'+sellV+'"></span></div>'; }).join('');
        var sumParts=function(){ var s=0; box.querySelectorAll('.pp').forEach(function(i){ s+=cents(i.value); }); document.getElementById('parts').value=s?(s/100).toFixed(2):''; recompute(); };
        // typing cost auto-fills the charge from the owner's margin; charge stays editable (override).
        box.querySelectorAll('.pc').forEach(function(i){ i.oninput=function(){ var pid=i.getAttribute('data-part'); var sc=retail(cents(i.value)); var ppi=box.querySelector('.pp[data-part="'+pid+'"]'); if(ppi){ ppi.value=sc?(sc/100).toFixed(2):''; } sumParts(); }; });
        box.querySelectorAll('.pp').forEach(function(i){ i.oninput=sumParts; });
        var pre=0; parts.forEach(function(p){ pre+=(p.sell_cents!=null?p.sell_cents:retail(p.cost_cents))||0; });
        if(pre>0){ document.getElementById('parts').value=(pre/100).toFixed(2); recompute(); }
      });
    })();

    document.getElementById('jpaySave').onclick=function(){ savePay(job); };
    document.getElementById('jstmt').onclick=function(){ openStatement(job); };
    document.getElementById('jsend').onclick=function(){ sendInvoice(job); };
    function g(id){ return document.getElementById(id).value; }
  }

  function threadBubble(m){
    var out=(m.direction==='out'); var s=String(m.sender||'');
    var who = out
      ? (s.indexOf('office:')===0 ? '🏢 '+s.slice(7)
         : s.indexOf('tech:')===0 ? '🔧 '+s.slice(5)
         : s==='ann' ? '🐜 Ann' : s==='tech' ? '🔧 Tech' : '🏢 Office')
      : '👤 Customer';
    var align=out?'flex-end':'flex-start';
    var bg=out?'var(--brand)':'var(--chip)';
    var col=out?'var(--brand-ink,#fff)':'var(--ink)';
    return '<div style="align-self:'+align+';max-width:82%;background:'+bg+';color:'+col+';padding:7px 10px;border-radius:12px;line-height:1.35"><div style="font-size:10px;opacity:.75;margin-bottom:2px">'+esc(who)+'</div>'+esc(m.body||'')+'</div>';
  }
  function loadThread(job){
    var box=document.getElementById('jthread'); if(!box) return;
    sb.from('thread_message').select('sender,direction,body,created_at,channel').eq('job_id',job.id).order('created_at').then(function(r){
      var b=document.getElementById('jthread'); if(!b) return;
      if(r.error){ b.innerHTML='<div class="hint">Couldn\'t load messages.</div>'; return; }
      var rows=r.data||[];
      b.innerHTML = rows.length ? rows.map(threadBubble).join('') : '<div class="hint">No messages yet.</div>';
      b.scrollTop=b.scrollHeight;
    });
  }
  function sendCustomerText(job){
    var ta=document.getElementById('jmsg'), btn=document.getElementById('jmsgSend'), hint=document.getElementById('jmsgHint');
    var text=(ta&&ta.value||'').trim(); if(hint) hint.textContent='';
    if(!text) return;
    btn.disabled=true; btn.textContent='Sending…';
    sb.auth.getSession().then(function(r){
      var tok=(r.data&&r.data.session&&r.data.session.access_token)||'';
      return fetch('/.netlify/functions/platform-tech-notify?do=office_message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:job.id,access_token:tok,body:text})})
        .then(function(x){return x.json();}).then(function(d){
          btn.disabled=false; btn.textContent='Send text';
          if(d&&d.ok){ ta.value=''; if(d.no_phone&&hint) hint.textContent='Saved — no phone on file to text.'; loadThread(job); }
          else if(hint){ hint.textContent=(d&&d.error)||'Couldn\'t send — try again.'; }
        });
    }).catch(function(){ btn.disabled=false; btn.textContent='Send text'; if(hint) hint.textContent='Network error — try again.'; });
  }

  function sendInvoice(job){
    var btn=document.getElementById('jsend');
    if(!invByJob[job.id]){ document.getElementById('jerr').textContent='Save the invoice first, then text it.'; return; }
    btn.disabled=true; btn.textContent='Texting…';

      fetch('/.netlify/functions/platform-invoice?do=send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:job.id,access_token:tok})})
        .then(function(x){return x.json();}).then(function(d){
          btn.disabled=false;
          if(d&&d.ok){ btn.textContent=d.texted?'✓ Invoice texted':'✓ Link ready (no phone)'; if(!d.texted&&d.url){ document.getElementById('jerr').textContent='No phone on file — link: '+d.url; } }
          else { btn.textContent='📤 Text invoice'; document.getElementById('jerr').textContent=(d&&d.error==='no_invoice')?'Save the invoice first.':'Couldn\'t send — try again.'; }
        }).catch(function(){ btn.disabled=false; btn.textContent='📤 Text invoice'; document.getElementById('jerr').textContent='Couldn\'t reach the server.'; });
    });
  }
  function fld(id,label){ return '<div class="fld"><label>'+esc(label)+'</label><input id="'+id+'" inputmode="decimal" placeholder="0"></div>'; }

  function savePay(job){
    var btn=document.getElementById('jpaySave'); btn.disabled=true; btn.textContent='Saving…';
    document.getElementById('jerr').textContent='';
    var g=function(id){ return document.getElementById(id).value; };
    var laborC=cents(g('labor')), partsC=cents(g('parts')), feeC=cents(g('fee'));
    // the tech's parts, priced in the drawer → itemized lines + persist cost + price back on each part
    var pricedParts=[]; Array.prototype.forEach.call(document.querySelectorAll('#jparts .pp'), function(i){
      var pid=i.getAttribute('data-part');
      var costI=document.querySelector('#jparts .pc[data-part="'+pid+'"]');
      pricedParts.push({id:pid, name:i.getAttribute('data-name'), cents:cents(i.value), costC:costI?cents(costI.value):0});
    });
    pricedParts.forEach(function(p){ if(p.id) sb.from('job_part').update({sell_cents:p.cents>0?p.cents:null, cost_cents:p.costC>0?p.costC:null}).eq('id',p.id).then(function(){}); });
    var tripApply=document.getElementById('jtripapply'); var applied=tripApply&&tripApply.checked && (laborC+partsC)>0;
    var sub=laborC+partsC+(applied?0:feeC), taxp=parseFloat(g('tax'))||0, taxC=Math.round(sub*taxp/100), tot=sub+taxC;
    var paid=document.getElementById('jpaid').checked, method=document.getElementById('jmethod').value||null;
    var inv=invByJob[job.id]||null;
    var row={ company_id:companyId, job_id:job.id, customer_id:job.customer_id||null, labor_cents:laborC, subtotal_cents:sub, tax_cents:taxC, total_cents:tot, status:paid?'paid':'draft', paid_method:paid?method:null, paid_at:paid?(inv&&inv.paid_at?inv.paid_at:new Date().toISOString()):null, collected_cents:paid?tot:(inv?inv.collected_cents||0:0) };
    var done=function(invoiceId){
      var newlyPaid = paid && !(inv && inv.status==='paid');
      invByJob[job.id]=Object.assign({ id:invoiceId, job_id:job.id, created_at:(inv&&inv.created_at)||new Date().toISOString() }, row);
      btn.disabled=false; btn.textContent='Saved ✓'; setTimeout(function(){ btn.textContent='Save invoice'; },1600);
      // 🎰 an invoice filed = an estimate; a fresh payment = paid + the Express.
      try{ if(window.AntMagic){ AntMagic.award('estimate'); if(newlyPaid){ AntMagic.award('paid'); AntMagic.train(); } } }catch(_){}
      // 💵 Money in — celebrate the first time it flips to paid.
      if(newlyPaid && window.antCelebrate){ try{ window.antCelebrate({ tag:'Payment', big:'JACKPOT! 💰', sub:fullName(job.customer)||'', tiles:[{value:money(tot),label:'Collected',accent:'#f7b500'}], sound:'both' }); }catch(_){ } }
      loadBoard();
    };
    var writeLines=function(invoiceId){
      sb.from('invoice_line').delete().eq('invoice_id',invoiceId).then(function(){
        var lines=[]; if(laborC)lines.push({company_id:companyId,invoice_id:invoiceId,kind:'labor',description:'Labor',qty:1,unit_cents:laborC});
        // itemize the tech's priced parts as their own lines; fall back to one lump "Parts" line
        var pp=pricedParts.filter(function(p){return p.cents>0;});
        if(pp.length){ pp.forEach(function(p){ lines.push({company_id:companyId,invoice_id:invoiceId,kind:'part',description:p.name||'Part',qty:1,unit_cents:p.cents}); }); }
        else if(partsC){ lines.push({company_id:companyId,invoice_id:invoiceId,kind:'part',description:'Parts',qty:1,unit_cents:partsC}); }
        if(feeC)lines.push({company_id:companyId,invoice_id:invoiceId,kind:'fee',description:'Trip charge',qty:1,unit_cents:feeC});
        if(applied&&feeC)lines.push({company_id:companyId,invoice_id:invoiceId,kind:'credit',description:'Trip applied to repair',qty:1,unit_cents:-feeC});
        if(lines.length) sb.from('invoice_line').insert(lines).then(function(){ done(invoiceId); }); else done(invoiceId);
      });
    };
    if(inv){ sb.from('invoice').update(row).eq('id',inv.id).then(function(r){ if(r.error){btn.disabled=false;btn.textContent='Save invoice';document.getElementById('jerr').textContent=r.error.message;return;} writeLines(inv.id); }); }
    else { sb.from('invoice').insert(row).select('id').then(function(r){ if(r.error||!r.data){btn.disabled=false;btn.textContent='Save invoice';document.getElementById('jerr').textContent=(r.error&&r.error.message)||'save failed';return;} writeLines(r.data[0].id); }); }
  }

  // ── printable / sendable statement ──────────────────────────────────────────
  function openStatement(job){
    var g=function(id){ var e=document.getElementById(id); return e?e.value:''; };
    var laborC=cents(g('labor')), partsC=cents(g('parts')), feeC=cents(g('fee'));
    var tripApply=document.getElementById('jtripapply'); var applied=tripApply&&tripApply.checked && (laborC+partsC)>0;
    var sub=laborC+partsC+(applied?0:feeC), taxp=parseFloat(g('tax'))||0, taxC=Math.round(sub*taxp/100), tot=sub+taxC;
    var paid=document.getElementById('jpaid') && document.getElementById('jpaid').checked;
    var cust=job.customer||{}, unit=job.unit&&job.unit.label?job.unit.label:'';
    var rows='';
    if(laborC)rows+='<tr><td>Labor</td><td style="text-align:right">'+money(laborC)+'</td></tr>';
    if(partsC)rows+='<tr><td>Parts</td><td style="text-align:right">'+money(partsC)+'</td></tr>';
    if(feeC)rows+='<tr><td>Trip charge</td><td style="text-align:right">'+money(feeC)+'</td></tr>';
    if(applied&&feeC)rows+='<tr><td style="color:#166534">Trip applied to repair</td><td style="text-align:right;color:#166534">−'+money(feeC)+'</td></tr>';
    var today=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    var biz=(shopSettings.business)||{}; var bizName=biz.name||shopName||'Invoice';
    var bizbits=[biz.address,[biz.phone,biz.email].filter(Boolean).join(' · '),biz.tax_id?('Tax ID: '+biz.tax_id):'',biz.license?('Lic# '+biz.license):''].filter(Boolean).join('<br>');
    var payNote=String(shopSettings.pay_instructions||'').replace(/</g,'&lt;');
    var html='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice — '+esc(bizName)+'</title>' +
      '<style>body{font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111;max-width:640px;margin:0 auto;padding:26px}h1{font-size:22px;margin:0}table{width:100%;border-collapse:collapse;margin-top:16px}td{padding:8px 0;border-bottom:1px solid #eee}.grand td{font-size:19px;font-weight:800;border-bottom:none}.muted{color:#666;font-size:13px}.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px}.paid{background:#dcfce7;color:#166534}.due{background:#fef3c7;color:#92400e}.note{background:#f6f6f4;border:1px solid #eee;border-radius:10px;padding:12px 14px;margin-top:16px;white-space:pre-line}.pr{margin-top:22px}@media print{.pr{display:none}}</style>' +
      '<h1>'+esc(bizName)+'</h1>'+(bizbits?'<div class="muted" style="margin-top:3px">'+bizbits+'</div>':'')+'<div class="muted" style="margin-top:6px">Invoice · '+today+'</div>' +
      '<div style="margin-top:16px"><b>'+esc(fullName(cust)||'Customer')+'</b>'+(cust.phone?' · '+esc(cust.phone):'')+(unit?'<br>'+esc(unit):'')+(job.problem?'<br><span class="muted">'+esc(job.problem)+'</span>':'')+'</div>' +
      '<table>'+rows+'<tr><td class="muted">Subtotal</td><td style="text-align:right">'+money(sub)+'</td></tr><tr><td class="muted">Tax ('+taxp+'%)</td><td style="text-align:right">'+money(taxC)+'</td></tr><tr class="grand"><td>Total</td><td style="text-align:right">'+money(tot)+'</td></tr></table>' +
      '<div style="margin-top:16px"><span class="pill '+(paid?'paid':'due')+'">'+(paid?'PAID IN FULL':'BALANCE DUE '+money(tot))+'</span></div>' +
      (payNote&&!paid?'<div class="note">'+payNote+'</div>':'') +
      '<div class="pr"><button onclick="window.print()" style="padding:12px 18px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:#3f8f24;color:#fff">🖨️ Print / Save as PDF</button></div>' +
      '<p class="muted" style="margin-top:26px">Thank you for your business — '+esc(bizName)+'</p>';
    var w=window.open('','_blank'); if(w){ w.document.write(html); w.document.close(); } else { alert('Allow pop-ups to view the statement.'); }
  }

  // ── FINANCIALS — period totals + CSV export for the accountant ──────────────
  function openFinancials(){
    var ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML='<div class="sheet"><h2>💵 Financials</h2><div class="paidrow noprint"><label style="font-weight:700;font-size:13px">Period</label><select id="finPer"><option value="month">This month</option><option value="all">All time</option></select></div><div id="finBody" style="margin-top:12px"></div><div class="srow"><button id="finCsv">⬇︎ Export CSV</button><button id="finClose">Close</button></div></div>';
    document.body.appendChild(ov);
    var close=function(){ try{document.body.removeChild(ov);}catch(e){} }; ov.onclick=function(e){ if(e.target===ov)close(); };
    document.getElementById('finClose').onclick=close;
    var render=function(){
      var per=document.getElementById('finPer').value;
      var m0=new Date(); m0=new Date(m0.getFullYear(),m0.getMonth(),1).getTime();
      var collected=0,invoiced=0,tax=0,due=0,n=0;
      Object.keys(invByJob).forEach(function(k){ var iv=invByJob[k]; var t=iv.paid_at?new Date(iv.paid_at).getTime():new Date(iv.created_at||0).getTime();
        if(per==='month' && t<m0) return; n++;
        invoiced+=iv.total_cents||0; tax+=iv.tax_cents||0; if(iv.status==='paid'){collected+=iv.total_cents||0;} else {due+=iv.total_cents||0;}
      });
      document.getElementById('finBody').innerHTML='<div class="totals"><div class="tr"><span>Invoices</span><span>'+n+'</span></div><div class="tr"><span>Collected</span><span>'+money(collected)+'</span></div><div class="tr"><span>Outstanding</span><span>'+money(due)+'</span></div><div class="tr"><span>Sales tax collected</span><span>'+money(tax)+'</span></div><div class="tr grand"><span>Invoiced</span><span>'+money(invoiced)+'</span></div></div><div class="sub" style="margin-top:8px;font-size:12.5px;color:var(--muted)">Export the CSV for your bookkeeper — one row per invoice with labor, parts, tax and totals.</div>';
    };
    document.getElementById('finPer').onchange=render; render();
    document.getElementById('finCsv').onclick=exportCsv;
  }

  function exportCsv(){
    // pull line detail across all invoices, then build a per-invoice CSV
    var ids=Object.keys(invByJob).map(function(k){return invByJob[k].id;});
    sb.from('invoice_line').select('invoice_id,kind,unit_cents,qty').in('invoice_id', ids.length?ids:['00000000-0000-0000-0000-000000000000']).then(function(r){
      var byInv={}; (r.data||[]).forEach(function(l){ var b=byInv[l.invoice_id]=byInv[l.invoice_id]||{labor:0,part:0,fee:0}; b[l.kind]=(b[l.kind]||0)+Math.round((l.unit_cents||0)*(l.qty||1)); });
      var head=['Date','Customer','Appliance','Labor','Parts','Fee','Subtotal','Tax','Total','Status','Method'];
      var rows=[head.join(',')];
      jobsCache.forEach(function(j){ var iv=invByJob[j.id]; if(!iv) return; var b=byInv[iv.id]||{labor:0,part:0,fee:0};
        var d=iv.paid_at||iv.created_at||''; d=d?new Date(d).toISOString().slice(0,10):'';
        var cust=(fullName(j.customer)||'Customer').replace(/"/g,'""');
        var appl=((j.unit&&j.unit.label)||'').replace(/"/g,'""');
        rows.push([d,'"'+cust+'"','"'+appl+'"',(b.labor/100).toFixed(2),(b.part/100).toFixed(2),(b.fee/100).toFixed(2),((iv.subtotal_cents||0)/100).toFixed(2),((iv.tax_cents||0)/100).toFixed(2),((iv.total_cents||0)/100).toFixed(2),iv.status||'',iv.paid_method||''].join(','));
      });
      var blob=new Blob([rows.join('\n')],{type:'text/csv'}); var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=(shopName||'shop').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-invoices.csv'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); try{document.body.removeChild(a);}catch(e){} },1500);
    });
  }

  // The shop's techs — loaded once at boot so the drawer can assign/reassign a job.
  var techsCache = [];
  function loadTechs() {
    sb.rpc('company_roster').then(function (r) {
      if (r.error) return; techsCache = (r.data || []).filter(function (t) { return t.active !== false; });
    });
  }
  function techOptions(sel) {
    return techsCache.map(function (t) {
      return '<option value="' + t.id + '"' + (String(t.id) === String(sel) ? ' selected' : '') + '>' + esc(t.name || ('Tech ' + t.id)) + '</option>';
    }).join('');
  }

  function loadBoard() {
    // RLS scopes every query to the logged-in user's company — we never pass company_id.
    // The dense card needs the warranty/parts/report/stop columns; customer.city rides along
    // for the 📍 chip. All are from applied migrations (033/044/020/019/004).
    var baseMin  = 'id,status,problem,source,scheduled_day,created_at,office_notes,customer_id,warranty_company,';
    var baseRich = baseMin + 'claim_number,dispatch_id,service_window,parts_status,parts_eta,tdr_diagnosis,tdr_failed_component,tdr_part_number,stop_id,availability,scheduled_start,checklist,customer_cutoff,';
    var tailRich = 'customer:customer_id(first_name,last_name,phone,city,state),unit:unit_id(label),technician:technician_id(name)';
    var tailMin  = 'customer:customer_id(first_name,last_name,phone),unit:unit_id(label),technician:technician_id(name)';
    var proceed = function (r) {
      if (r.error) { document.getElementById('board').innerHTML = '<div class="empty">Couldn\'t load the board: ' + esc(r.error.message) + '</div>'; return; }
      jobsCache = r.data || [];
      var jids = jobsCache.map(function(j){ return j.id; });
      var none = Promise.resolve({ data: [] });
      // batch the customer's uploaded media so the office sees video + model photo right on
      // the tile — needed to process the warranty claim by hand (until a claim API lands).
      var mediaP = jids.length ? sb.from('job_media').select('job_id,kind,provider,ref').in('job_id', jids) : none;
      // latest inbound customer message per job → the green message bubble on the tile
      var msgP   = jids.length ? sb.from('thread_message').select('job_id,body,direction,created_at').eq('direction','in').in('job_id', jids).order('created_at',{ascending:false}) : none;
      // the parts the tech logged → the 🔧 part-# chip (fallback when the job row has none)
      var partsP = jids.length ? sb.from('job_part').select('job_id,number,name,disposition').in('job_id', jids) : none;
      Promise.all([
        sb.from('invoice').select('id,job_id,status,subtotal_cents,tax_cents,total_cents,collected_cents,paid_at,paid_method,created_at'),
        mediaP, msgP, partsP
      ]).then(function (res) {
        var ir = res[0] || {}, mr = res[1] || {}, sr = res[2] || {}, pr = res[3] || {};
        invByJob = {};
        (ir.data || []).forEach(function (iv) { if (iv.job_id) { var p = invByJob[iv.job_id]; if (!p || new Date(iv.created_at) > new Date(p.created_at)) invByJob[iv.job_id] = iv; } });
        mediaByJob = {};
        (mr.data || []).forEach(function (m) { if (!m.job_id) return; (mediaByJob[m.job_id] = mediaByJob[m.job_id] || []).push(m); });
        // ordered newest-first → keep the first seen per job (the latest inbound)
        msgByJob = {};
        (sr.data || []).forEach(function (m) { if (!m.job_id || msgByJob[m.job_id]) return; if (String(m.body||'').trim()) msgByJob[m.job_id] = m; });
        partsByJob = {};
        (pr.data || []).forEach(function (p) { if (!p.job_id || !String(p.number||'').trim()) return; var d=String(p.disposition||''); if (d==='return'||d==='not_here') return; (partsByJob[p.job_id] = partsByJob[p.job_id] || []).push({ number:p.number, name:p.name }); });
        renderMoneyBar(); renderRegionToggle(); renderFilters(); renderBoard();
      });
    };
    // Try enriched + scheduling flags → enriched only → the minimal legacy select. So a
    // missing new column can never blank the board.
    sb.from('job').select(baseRich + 'needs_two_techs,long_job,' + tailRich).order('created_at', { ascending: false }).then(function (r) {
      if (!r.error) { proceed(r); return; }
      sb.from('job').select(baseRich + tailRich).order('created_at', { ascending: false }).then(function (r2) {
        if (!r2.error) { proceed(r2); return; }
        sb.from('job').select(baseMin + tailMin).order('created_at', { ascending: false }).then(proceed);
      });
    });
  }

  function subscribeRealtime() {
    try {
      rt = sb.channel('office-board')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'job' }, loadBoard)
        .subscribe();
    } catch (e) { /* realtime optional — Refresh still works */ }
  }

  function boot() {
    renderShell();
    // Company (RLS returns only this shop's row via the company_self policy).
    sb.from('company').select('id,name,trade,settings,features').limit(1).then(function (r) {
      if (!r.error && r.data && r.data[0]) { companyId = r.data[0].id; shopSettings = r.data[0].settings || {}; features = r.data[0].features || {}; shopName = r.data[0].name; var el = document.getElementById('shop'); if (el) el.textContent = shopName; }
      // 🎰 Board skin — default-on Jackpot; a shop can flip settings.skin to 'clean'.
      applySkin(shopSettings.skin==='clean'?'clean':'jackpot');
      // Feature gate: the job board is the Full Office Platform (database/scheduling). Default-open
      // on an empty features map so demo/unpopulated shops load normally; an Answering-only shop
      // gets an upgrade nudge instead of an empty board.
      var PF = window.PlatformFeatures || { has: function(){ return true; } };
      if(!(PF.has(features,'database') || PF.has(features,'scheduling'))){
        app.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:0 20px;text-align:center">'+
          '<h2 style="margin:0 0 10px">The job board is part of the Full Office Platform</h2>'+
          '<p style="color:#64748b;line-height:1.6">You’re on the <b>AI Answering</b> plan — Ann is answering your calls and capturing leads. Upgrade to run scheduling, the job board, invoicing, and tech pay here too.</p>'+
          '<a href="/platform/signup.html?plan=office" style="display:inline-block;margin-top:14px;padding:12px 20px;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;text-decoration:none">See the Full Office Platform →</a></div>';
        return;
      }
      loadBoard();
      loadTechs();
      subscribeRealtime();
    });
  }

  // Resume an existing session, else sign-in.
  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) boot(); else renderSignIn();
  });
})();
</script>
