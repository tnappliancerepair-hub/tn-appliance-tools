<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Office Board — Ant</title>
<!--
  Ant platform — OFFICE BOARD (multi-tenant reference surface).
  Runs against the Supabase platform project (docs/sql/004_multitenant_core.sql).
  Auth → the board shows ONLY this shop's jobs (Row-Level Security does the scoping;
  the page never sends a company_id). Realtime keeps it live. This same pattern —
  sign in, query, RLS scopes to your tenant — is what the tech app + customer portal
  reuse. One codebase, three lenses, every shop.
-->
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd;
    --brand:#3f8f24; --brand-ink:#ffffff; --chip:#eef2e8; --shadow:0 1px 2px rgba(20,30,10,.06),0 4px 14px rgba(20,30,10,.05);
    --new:#6b7280; --scheduled:#2563eb; --in_progress:#b45309; --awaiting_parts:#7c3aed; --completed:#3f8f24; --canceled:#9ca3af;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .brand{font-weight:800;letter-spacing:.2px}
  header .shop{color:var(--muted);font-weight:600}
  header .sp{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 12px;font-weight:600}
  button.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  button:disabled{opacity:.55;cursor:default}
  .wrap{padding:14px;max-width:720px;margin:0 auto}
  /* vertical board — no side-scroll */
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
  .filters button{white-space:nowrap;border-radius:999px;padding:7px 13px;font-size:13px}
  .filters button.on{background:var(--ink);color:var(--bg);border-color:transparent}
  .board{display:block}
  .col{width:auto;margin-bottom:6px}
  .money{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;margin-bottom:2px}
  .stat{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
  .stat .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .stat .val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .card{cursor:pointer}
  .card .money-badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
  .money-badge.paid{background:#dcfce7;color:#166534}
  .money-badge.due{background:#fef3c7;color:#92400e}
  :root:not([data-theme="light"]) .money-badge.paid,:root[data-theme="dark"] .money-badge.paid{background:#14351f;color:#8ff0b0}
  :root:not([data-theme="light"]) .money-badge.due,:root[data-theme="dark"] .money-badge.due{background:#3a2e0c;color:#f2ce7a}
  .col h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
  .col h3 .n{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px}
  .col h3 .dot{width:8px;height:8px;border-radius:50%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .card .name{font-weight:700}
  .card .unit{color:var(--muted);font-size:13px;margin-top:1px}
  .card .prob{margin-top:7px;font-size:13.5px}
  .card .foot{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
  .tech{color:var(--muted);font-size:12px;font-weight:600}
  .empty{color:var(--muted);font-size:13px;padding:8px 2px}
  /* auth / connect gates */
  .gate{max-width:380px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
  .gate h1{margin:0 0 4px;font-size:20px}
  .gate p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .gate label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .gate button{width:100%;margin-top:18px}
  .err{color:#c0392b;font-size:13px;margin-top:12px;min-height:1.2em}
  :root[data-theme="dark"] .err,:root:not([data-theme="light"]) .err{color:#ff8a7a}
  .ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,6,.5);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;overflow:auto}
  .sheet{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .sheet h2{margin:0 0 6px;font-size:19px}
  .sheet label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin:15px 0 5px}
  .sheet label .hint{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
  .sheet input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .sheet .srow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .sheet.drawer{max-width:520px}
  .sheet .sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:18px 0 8px}
  .sheet .custname{font-size:20px;font-weight:800}
  .sheet .sub{color:var(--muted);font-size:14px;margin-top:1px}
  .statusbtns{display:flex;flex-wrap:wrap;gap:7px}
  .statusbtns button{font-size:12.5px;padding:7px 11px;font-weight:700}
  .statusbtns button.on{color:#fff;border-color:transparent}
  .sheet textarea{width:100%;min-height:70px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
  .pay{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .pay .fld{display:flex;flex-direction:column;gap:4px}
  .pay .fld label{font-size:11.5px;font-weight:700;color:var(--muted)}
  .pay .fld input{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
  .totals{background:var(--chip);border-radius:11px;padding:11px 13px;margin-top:11px;font-variant-numeric:tabular-nums}
  .totals .tr{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
  .totals .tr.grand{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:5px;padding-top:8px}
  .paidrow{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
  .paidrow select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
  /* printable statement */
  @media print{ body *{visibility:hidden} #stmt,#stmt *{visibility:visible} #stmt{position:absolute;inset:0;padding:24px} .noprint{display:none!important} }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--chip);padding:1px 5px;border-radius:5px}
  .banner{background:#fff7e6;border:1px solid #f0d59a;color:#7a5b00;padding:10px 14px;border-radius:10px;margin:16px;font-size:13px}
  :root[data-theme="dark"] .banner,:root:not([data-theme="light"]) .banner{background:#2a2410;border-color:#5a4a1a;color:#e6c766}
</style>
</head>
<body>
<div id="app"></div>

<script src="/platform/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var cfg = window.ANT_SUPABASE || {};
  var sb = null, rt = null, companyId = null, shopSettings = {};

  // ── STATUS COLUMNS ─────────────────────────────────────────────────────────
  var COLS = [
    { key: 'new',            label: 'New',            color: 'var(--new)' },
    { key: 'scheduled',      label: 'Scheduled',      color: 'var(--scheduled)' },
    { key: 'in_progress',    label: 'In progress',    color: 'var(--in_progress)' },
    { key: 'awaiting_parts', label: 'Awaiting parts', color: 'var(--awaiting_parts)' },
    { key: 'completed',      label: 'Completed',      color: 'var(--completed)' },
  ];
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function fullName(c){ return c ? [c.first_name, c.last_name].filter(Boolean).join(' ').trim() : ''; }

  // ── CONNECT GATE — no project wired yet ────────────────────────────────────
  if (!cfg.url || !cfg.anonKey) {
    app.innerHTML =
      '<div class="gate"><h1>🐜 Connect your project</h1>' +
      '<p>This is the Ant office board. Point it at your Supabase platform project to bring it alive.</p>' +
      '<p>Fill <span class="mono">platform/config.js</span> with your project URL and the <b>anon public</b> key ' +
      '(Supabase → Settings → API), then reload. The anon key is safe in the browser — Row-Level Security protects every shop\'s data.</p></div>';
    return;
  }

  sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  // ── SIGN-IN VIEW ───────────────────────────────────────────────────────────
  function renderSignIn(msg) {
    app.innerHTML =
      '<div class="gate"><h1>🐜 Office board</h1><p>Sign in to your shop.</p>' +
      '<label>Email</label><input id="em" type="email" autocomplete="username" placeholder="you@shop.com">' +
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">' +
      '<button class="primary" id="go">Sign in</button>' +
      '<div class="err" id="err">' + esc(msg || '') + '</div></div>';
    var go = document.getElementById('go');
    function submit() {
      var em = document.getElementById('em').value.trim();
      var pw = document.getElementById('pw').value;
      if (!em || !pw) { document.getElementById('err').textContent = 'Enter your email and password.'; return; }
      go.disabled = true; go.textContent = 'Signing in…';
      sb.auth.signInWithPassword({ email: em, password: pw }).then(function (r) {
        if (r.error) { renderSignIn(r.error.message); }
        else { boot(); }
      });
    }
    go.onclick = submit;
    document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  }

  // ── BOARD VIEW ─────────────────────────────────────────────────────────────
  var shopName = '';
  function renderShell() {
    app.innerHTML =
      '<header><span class="brand">🐜 Ant</span><span class="shop" id="shop">' + esc(shopName || '…') + '</span>' +
      '<span class="sp"></span><button id="settings">⚙️ Settings</button><button id="refresh">Refresh</button><button id="out">Sign out</button></header>' +
      '<div class="wrap"><div class="money" id="money"></div><div class="filters" id="filters"></div><div class="board" id="board"></div></div>';
    document.getElementById('out').onclick = function () { if (rt) { try { sb.removeChannel(rt); } catch (e) {} } sb.auth.signOut().then(renderSignIn); };
    document.getElementById('refresh').onclick = loadBoard;
    document.getElementById('settings').onclick = openSettings;
  }

  // ── SETTINGS (per-shop config: review link + parts distributor) ─────────────
  function openSettings() {
    var s = shopSettings || {};
    var ov = document.createElement('div'); ov.className = 'ov';
    var b = s.business || {};
    ov.innerHTML =
      '<div class="sheet"><h2>⚙️ Shop settings</h2>' +
      '<div class="sec">Your business (shown on invoices)</div>' +
      '<label>Business name <span class="hint">appears at the top of every invoice</span></label>' +
      '<input id="b_name" placeholder="' + esc(shopName || 'Your Appliance Repair LLC') + '" value="' + esc(b.name || '') + '">' +
      '<label>Address</label><input id="b_addr" placeholder="123 Main St, City, ST 00000" value="' + esc(b.address || '') + '">' +
      '<label>Phone</label><input id="b_phone" placeholder="(555) 123-4567" value="' + esc(b.phone || '') + '">' +
      '<label>Email</label><input id="b_email" placeholder="office@yourshop.com" value="' + esc(b.email || '') + '">' +
      '<label>Tax ID / EIN <span class="hint">for the customer\'s records</span></label>' +
      '<input id="b_tax" placeholder="00-0000000" value="' + esc(b.tax_id || '') + '">' +
      '<label>License #</label><input id="b_lic" placeholder="optional" value="' + esc(b.license || '') + '">' +
      '<label>Payment instructions <span class="hint">how customers pay you — checks payable to, Zelle/Venmo, etc.</span></label>' +
      '<textarea id="b_pay" placeholder="Make checks payable to … · Zelle: office@yourshop.com" style="width:100%;min-height:58px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical">' + esc(s.pay_instructions || '') + '</textarea>' +
      '<div class="sec">Sales tax</div>' +
      '<label>Sales tax % <span class="hint">default rate on invoices</span></label>' +
      '<input id="s_tax" inputmode="decimal" placeholder="9.75" value="' + esc(s.tax_rate != null ? s.tax_rate : '') + '">' +
      '<div class="sec">Tools</div>' +
      '<label>Google review link <span class="hint">the link customers tap to leave a review</span></label>' +
      '<input id="s_review" placeholder="https://g.page/r/…/review" value="' + esc(s.review_url || '') + '">' +
      '<label>Parts distributor <span class="hint">the name on the tech\'s parts button</span></label>' +
      '<input id="s_dname" placeholder="Marcone" value="' + esc(s.distributor_name || '') + '">' +
      '<label>Distributor search link <span class="hint">use <b>{q}</b> where the model/part goes</span></label>' +
      '<input id="s_durl" placeholder="https://yoursupplier.com/search?q={q}" value="' + esc(s.distributor_search_url || '') + '">' +
      '<div class="srow"><button id="s_cancel">Cancel</button><button class="primary" id="s_save">Save</button></div>' +
      '<div class="err" id="s_err"></div></div>';
    document.body.appendChild(ov);
    var close = function () { try { document.body.removeChild(ov); } catch (e) {} };
    ov.onclick = function (e) { if (e.target === ov) close(); };
    document.getElementById('s_cancel').onclick = close;
    document.getElementById('s_save').onclick = function () {
      var btn = document.getElementById('s_save'); btn.disabled = true; btn.textContent = 'Saving…';
      var taxRaw = document.getElementById('s_tax').value.trim();
      var gv = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; };
      var next = Object.assign({}, shopSettings, {
        review_url: gv('s_review'),
        distributor_name: gv('s_dname'),
        distributor_search_url: gv('s_durl'),
        tax_rate: taxRaw === '' ? null : (parseFloat(taxRaw) || 0),
        pay_instructions: gv('b_pay'),
        business: {
          name: gv('b_name'), address: gv('b_addr'), phone: gv('b_phone'),
          email: gv('b_email'), tax_id: gv('b_tax'), license: gv('b_lic'),
        },
      });
      sb.from('company').update({ settings: next }).eq('id', companyId).then(function (r) {
        if (r.error) { btn.disabled = false; btn.textContent = 'Save'; document.getElementById('s_err').textContent = r.error.message; return; }
        shopSettings = next; close();
      });
    };
  }

  // ── money helpers ───────────────────────────────────────────────────────────
  function money(c){ c=Math.round(c||0); return '$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function cents(v){ var n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); return isNaN(n)?0:Math.round(n*100); }
  var ALLSTATUS = COLS.concat([{ key:'canceled', label:'Canceled', color:'var(--canceled)' }]);
  function statusMeta(k){ for(var i=0;i<ALLSTATUS.length;i++){ if(ALLSTATUS[i].key===k) return ALLSTATUS[i]; } return { key:k, label:(k||'').replace(/_/g,' '), color:'var(--canceled)' }; }

  // ── board state ──────────────────────────────────────────────────────────────
  var activeFilter = 'all', jobsCache = [], invByJob = {};

  function renderFilters(){
    var counts = { all: jobsCache.length };
    jobsCache.forEach(function(j){ counts[j.status]=(counts[j.status]||0)+1; });
    var chips = [{ key:'all', label:'All' }].concat(ALLSTATUS.filter(function(s){ return (counts[s.key]||0)>0 || s.key!=='canceled'; }));
    document.getElementById('filters').innerHTML = chips.map(function(c){
      return '<button data-f="'+c.key+'" class="'+(activeFilter===c.key?'on':'')+'">'+esc(c.label)+' '+(counts[c.key]||0)+'</button>';
    }).join('');
    document.querySelectorAll('#filters button[data-f]').forEach(function(b){ b.onclick=function(){ activeFilter=b.getAttribute('data-f'); renderFilters(); renderBoard(); }; });
  }

  function renderMoneyBar(){
    var now=new Date(), m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
    var collected=0, invoiced=0, tax=0, due=0;
    Object.keys(invByJob).forEach(function(k){ var iv=invByJob[k];
      invoiced+=iv.total_cents||0; tax+=iv.tax_cents||0;
      if(iv.status==='paid'){ collected+=iv.total_cents||0; } else { due+=iv.total_cents||0; }
    });
    document.getElementById('money').innerHTML =
      stat('Collected', money(collected)) + stat('Outstanding', money(due)) + stat('Tax collected', money(tax)) + stat('Invoiced', money(invoiced)) +
      '<div class="stat" style="cursor:pointer" id="finBtn"><div class="lab">Reports</div><div class="val">💵 Statements</div></div>';
    var fb=document.getElementById('finBtn'); if(fb) fb.onclick=openFinancials;
  }
  function stat(l,v){ return '<div class="stat"><div class="lab">'+esc(l)+'</div><div class="val">'+esc(v)+'</div></div>'; }

  function renderBoard(){
    var jobs = jobsCache.filter(function(j){ return activeFilter==='all' || j.status===activeFilter; });
    var groups = activeFilter==='all' ? ALLSTATUS.map(function(s){return s.key;}) : [activeFilter];
    var extra = {}; jobs.forEach(function(j){ if(groups.indexOf(j.status)<0){ extra[j.status]=1; } });
    Object.keys(extra).forEach(function(k){ groups.push(k); });
    var html = groups.map(function(k){
      var list = jobs.filter(function(j){ return j.status===k; });
      if(!list.length) return '';
      var m = statusMeta(k);
      var cards = list.map(function(j){
        var unit = j.unit && j.unit.label ? j.unit.label : '';
        var tech = j.technician && j.technician.name ? j.technician.name : 'Unassigned';
        var iv = invByJob[j.id];
        var badge = iv ? '<span class="money-badge '+(iv.status==='paid'?'paid':'due')+'">'+(iv.status==='paid'?'PAID ':'')+money(iv.total_cents)+'</span>' : '';
        return '<div class="card" data-job="'+j.id+'">' +
          '<div class="name">'+esc(fullName(j.customer)||'Customer')+'</div>' +
          (unit?'<div class="unit">'+esc(unit)+'</div>':'') +
          (j.problem?'<div class="prob">'+esc(j.problem)+'</div>':'') +
          '<div class="foot"><span class="pill" style="background:'+m.color+'">'+esc(m.label)+'</span>' +
          '<span class="tech">'+esc(tech)+(badge?' '+badge:'')+'</span></div></div>';
      }).join('');
      return '<div class="col"><h3><span class="dot" style="background:'+m.color+'"></span>'+esc(m.label)+'<span class="n">'+list.length+'</span></h3>'+cards+'</div>';
    }).join('') || '<div class="empty">Nothing here yet.</div>';
    var b=document.getElementById('board'); b.innerHTML=html;
    b.querySelectorAll('.card[data-job]').forEach(function(c){ c.onclick=function(){ var j=jobsCache.filter(function(x){return x.id===c.getAttribute('data-job');})[0]; if(j) openJob(j); }; });
  }

  // ── JOB DRAWER — status buttons, notes, pay, statement ──────────────────────
  function openJob(job){
    var cust=job.customer||{}, unit=job.unit&&job.unit.label?job.unit.label:'';
    var phone=(cust.phone||'').replace(/[^0-9+]/g,'');
    var ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML='<div class="sheet drawer">' +
      '<div class="custname">'+esc(fullName(cust)||'Customer')+'</div>' +
      '<div class="sub">'+esc(unit||'')+(phone?' · '+esc(cust.phone):'')+'</div>' +
      (job.problem?'<div class="sub" style="margin-top:6px">'+esc(job.problem)+'</div>':'') +
      '<div class="sec">Status</div><div class="statusbtns" id="jstatus"></div>' +
      '<div class="sec">Office notes</div><textarea id="jnotes" placeholder="Parts on order, gate code, upsell offered, anything the team should see…">'+esc(job.office_notes||'')+'</textarea>' +
      '<div class="srow" style="margin-top:8px"><button class="primary" id="jnotesSave">Save notes</button></div>' +
      '<div class="sec">Pay / invoice</div>' +
      '<div class="pay">' +
        fld('labor','Labor $') + fld('parts','Parts $') + fld('fee','Trip / fee $') + fld('tax','Tax %') +
      '</div>' +
      '<div class="totals" id="jtotals"></div>' +
      '<div class="paidrow"><label style="display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px"><input type="checkbox" id="jpaid"> Paid</label>' +
        '<select id="jmethod"><option value="">method…</option><option>Cash</option><option>Card</option><option>Check</option><option>Zelle</option><option>Venmo</option><option>Warranty</option></select></div>' +
      '<div class="srow" style="flex-wrap:wrap"><button id="jstmt">📄 Print</button><button id="jsend">📤 Text invoice</button><button class="primary" id="jpaySave">Save invoice</button></div>' +
      '<div class="err" id="jerr"></div>' +
      '<div class="srow" style="margin-top:16px;justify-content:center"><button id="jclose">Close</button></div>' +
      '</div>';
    document.body.appendChild(ov);
    var close=function(){ try{document.body.removeChild(ov);}catch(e){} };
    ov.onclick=function(e){ if(e.target===ov) close(); };
    document.getElementById('jclose').onclick=close;

    // status buttons
    var sb2=document.getElementById('jstatus');
    sb2.innerHTML=ALLSTATUS.map(function(s){ return '<button data-s="'+s.key+'" class="'+(job.status===s.key?'on':'')+'" style="'+(job.status===s.key?'background:'+s.color:'')+'">'+esc(s.label)+'</button>'; }).join('');
    sb2.querySelectorAll('button[data-s]').forEach(function(b){ b.onclick=function(){ var ns=b.getAttribute('data-s'); sb.from('job').update({status:ns}).eq('id',job.id).then(function(r){ if(!r.error){ job.status=ns; sb2.querySelectorAll('button').forEach(function(x){ x.className=''; x.style.background=''; }); b.className='on'; b.style.background=statusMeta(ns).color; loadBoard(); } }); }; });

    document.getElementById('jnotesSave').onclick=function(){ var t=document.getElementById('jnotes').value; var btn=document.getElementById('jnotesSave'); btn.disabled=true; btn.textContent='Saving…'; sb.from('job').update({office_notes:t}).eq('id',job.id).then(function(r){ job.office_notes=t; btn.disabled=false; btn.textContent=r.error?'Try again':'Saved ✓'; setTimeout(function(){ btn.textContent='Save notes'; },1500); }); };

    // pay — prefill from existing invoice + lines, live totals
    var inv=invByJob[job.id]||null;
    document.getElementById('tax').value = (shopSettings.tax_rate!=null?shopSettings.tax_rate:'');
    var recompute=function(){
      var sub=cents(g('labor'))+cents(g('parts'))+cents(g('fee'));
      var taxp=parseFloat(g('tax'))||0; var tax=Math.round(sub*taxp/100); var tot=sub+tax;
      document.getElementById('jtotals').innerHTML='<div class="tr"><span>Subtotal</span><span>'+money(sub)+'</span></div><div class="tr"><span>Tax ('+taxp+'%)</span><span>'+money(tax)+'</span></div><div class="tr grand"><span>Total</span><span>'+money(tot)+'</span></div>';
    };
    ['labor','parts','fee','tax'].forEach(function(id){ document.getElementById(id).oninput=recompute; });
    if(inv){
      document.getElementById('jpaid').checked = inv.status==='paid';
      if(inv.paid_method){ document.getElementById('jmethod').value=inv.paid_method; }
      // recover the labor/parts/fee split from the lines
      sb.from('invoice_line').select('kind,unit_cents,qty').eq('invoice_id',inv.id).then(function(r){
        var sums={labor:0,part:0,fee:0}; (r.data||[]).forEach(function(l){ sums[l.kind]=(sums[l.kind]||0)+Math.round((l.unit_cents||0)*(l.qty||1)); });
        if(sums.labor) document.getElementById('labor').value=(sums.labor/100).toFixed(2);
        if(sums.part)  document.getElementById('parts').value=(sums.part/100).toFixed(2);
        if(sums.fee)   document.getElementById('fee').value=(sums.fee/100).toFixed(2);
        if(inv.tax_cents && (sums.labor+sums.part+sums.fee)) document.getElementById('tax').value=(Math.round(inv.tax_cents/((sums.labor+sums.part+sums.fee))*10000)/100);
        recompute();
      });
    } else { recompute(); }

    document.getElementById('jpaySave').onclick=function(){ savePay(job); };
    document.getElementById('jstmt').onclick=function(){ openStatement(job); };
    document.getElementById('jsend').onclick=function(){ sendInvoice(job); };
    function g(id){ return document.getElementById(id).value; }
  }

  function sendInvoice(job){
    var btn=document.getElementById('jsend');
    if(!invByJob[job.id]){ document.getElementById('jerr').textContent='Save the invoice first, then text it.'; return; }
    btn.disabled=true; btn.textContent='Texting…';
    sb.auth.getSession().then(function(r){ var tok=(r.data&&r.data.session&&r.data.session.access_token)||'';
      fetch('/.netlify/functions/platform-invoice?do=send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:job.id,access_token:tok})})
        .then(function(x){return x.json();}).then(function(d){
          btn.disabled=false;
          if(d&&d.ok){ btn.textContent=d.texted?'✓ Invoice texted':'✓ Link ready (no phone)'; if(!d.texted&&d.url){ document.getElementById('jerr').textContent='No phone on file — link: '+d.url; } }
          else { btn.textContent='📤 Text invoice'; document.getElementById('jerr').textContent=(d&&d.error==='no_invoice')?'Save the invoice first.':'Couldn\'t send — try again.'; }
        }).catch(function(){ btn.disabled=false; btn.textContent='📤 Text invoice'; document.getElementById('jerr').textContent='Couldn\'t reach the server.'; });
    });
  }
  function fld(id,label){ return '<div class="fld"><label>'+esc(label)+'</label><input id="'+id+'" inputmode="decimal" placeholder="0"></div>'; }

  function savePay(job){
    var btn=document.getElementById('jpaySave'); btn.disabled=true; btn.textContent='Saving…';
    document.getElementById('jerr').textContent='';
    var g=function(id){ return document.getElementById(id).value; };
    var laborC=cents(g('labor')), partsC=cents(g('parts')), feeC=cents(g('fee'));
    var sub=laborC+partsC+feeC, taxp=parseFloat(g('tax'))||0, taxC=Math.round(sub*taxp/100), tot=sub+taxC;
    var paid=document.getElementById('jpaid').checked, method=document.getElementById('jmethod').value||null;
    var inv=invByJob[job.id]||null;
    var row={ company_id:companyId, job_id:job.id, customer_id:job.customer_id||null, subtotal_cents:sub, tax_cents:taxC, total_cents:tot, status:paid?'paid':'draft', paid_method:paid?method:null, paid_at:paid?(inv&&inv.paid_at?inv.paid_at:new Date().toISOString()):null };
    var done=function(invoiceId){
      invByJob[job.id]=Object.assign({ id:invoiceId, job_id:job.id, created_at:(inv&&inv.created_at)||new Date().toISOString() }, row);
      btn.disabled=false; btn.textContent='Saved ✓'; setTimeout(function(){ btn.textContent='Save invoice'; },1600);
      loadBoard();
    };
    var writeLines=function(invoiceId){
      sb.from('invoice_line').delete().eq('invoice_id',invoiceId).then(function(){
        var lines=[]; if(laborC)lines.push({company_id:companyId,invoice_id:invoiceId,kind:'labor',description:'Labor',qty:1,unit_cents:laborC});
        if(partsC)lines.push({company_id:companyId,invoice_id:invoiceId,kind:'part',description:'Parts',qty:1,unit_cents:partsC});
        if(feeC)lines.push({company_id:companyId,invoice_id:invoiceId,kind:'fee',description:'Trip / fee',qty:1,unit_cents:feeC});
        if(lines.length) sb.from('invoice_line').insert(lines).then(function(){ done(invoiceId); }); else done(invoiceId);
      });
    };
    if(inv){ sb.from('invoice').update(row).eq('id',inv.id).then(function(r){ if(r.error){btn.disabled=false;btn.textContent='Save invoice';document.getElementById('jerr').textContent=r.error.message;return;} writeLines(inv.id); }); }
    else { sb.from('invoice').insert(row).select('id').then(function(r){ if(r.error||!r.data){btn.disabled=false;btn.textContent='Save invoice';document.getElementById('jerr').textContent=(r.error&&r.error.message)||'save failed';return;} writeLines(r.data[0].id); }); }
  }

  // ── printable / sendable statement ──────────────────────────────────────────
  function openStatement(job){
    var g=function(id){ var e=document.getElementById(id); return e?e.value:''; };
    var laborC=cents(g('labor')), partsC=cents(g('parts')), feeC=cents(g('fee'));
    var sub=laborC+partsC+feeC, taxp=parseFloat(g('tax'))||0, taxC=Math.round(sub*taxp/100), tot=sub+taxC;
    var paid=document.getElementById('jpaid') && document.getElementById('jpaid').checked;
    var cust=job.customer||{}, unit=job.unit&&job.unit.label?job.unit.label:'';
    var rows='';
    if(laborC)rows+='<tr><td>Labor</td><td style="text-align:right">'+money(laborC)+'</td></tr>';
    if(partsC)rows+='<tr><td>Parts</td><td style="text-align:right">'+money(partsC)+'</td></tr>';
    if(feeC)rows+='<tr><td>Trip / fee</td><td style="text-align:right">'+money(feeC)+'</td></tr>';
    var today=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    var biz=(shopSettings.business)||{}; var bizName=biz.name||shopName||'Invoice';
    var bizbits=[biz.address,[biz.phone,biz.email].filter(Boolean).join(' · '),biz.tax_id?('Tax ID: '+biz.tax_id):'',biz.license?('Lic# '+biz.license):''].filter(Boolean).join('<br>');
    var payNote=String(shopSettings.pay_instructions||'').replace(/</g,'&lt;');
    var html='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice — '+esc(bizName)+'</title>' +
      '<style>body{font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111;max-width:640px;margin:0 auto;padding:26px}h1{font-size:22px;margin:0}table{width:100%;border-collapse:collapse;margin-top:16px}td{padding:8px 0;border-bottom:1px solid #eee}.grand td{font-size:19px;font-weight:800;border-bottom:none}.muted{color:#666;font-size:13px}.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px}.paid{background:#dcfce7;color:#166534}.due{background:#fef3c7;color:#92400e}.note{background:#f6f6f4;border:1px solid #eee;border-radius:10px;padding:12px 14px;margin-top:16px;white-space:pre-line}.pr{margin-top:22px}@media print{.pr{display:none}}</style>' +
      '<h1>'+esc(bizName)+'</h1>'+(bizbits?'<div class="muted" style="margin-top:3px">'+bizbits+'</div>':'')+'<div class="muted" style="margin-top:6px">Invoice · '+today+'</div>' +
      '<div style="margin-top:16px"><b>'+esc(fullName(cust)||'Customer')+'</b>'+(cust.phone?' · '+esc(cust.phone):'')+(unit?'<br>'+esc(unit):'')+(job.problem?'<br><span class="muted">'+esc(job.problem)+'</span>':'')+'</div>' +
      '<table>'+rows+'<tr><td class="muted">Subtotal</td><td style="text-align:right">'+money(sub)+'</td></tr><tr><td class="muted">Tax ('+taxp+'%)</td><td style="text-align:right">'+money(taxC)+'</td></tr><tr class="grand"><td>Total</td><td style="text-align:right">'+money(tot)+'</td></tr></table>' +
      '<div style="margin-top:16px"><span class="pill '+(paid?'paid':'due')+'">'+(paid?'PAID IN FULL':'BALANCE DUE '+money(tot))+'</span></div>' +
      (payNote&&!paid?'<div class="note">'+payNote+'</div>':'') +
      '<div class="pr"><button onclick="window.print()" style="padding:12px 18px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:#3f8f24;color:#fff">🖨️ Print / Save as PDF</button></div>' +
      '<p class="muted" style="margin-top:26px">Thank you for your business — '+esc(bizName)+'</p>';
    var w=window.open('','_blank'); if(w){ w.document.write(html); w.document.close(); } else { alert('Allow pop-ups to view the statement.'); }
  }

  // ── FINANCIALS — period totals + CSV export for the accountant ──────────────
  function openFinancials(){
    var ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML='<div class="sheet"><h2>💵 Financials</h2><div class="paidrow noprint"><label style="font-weight:700;font-size:13px">Period</label><select id="finPer"><option value="month">This month</option><option value="all">All time</option></select></div><div id="finBody" style="margin-top:12px"></div><div class="srow"><button id="finCsv">⬇︎ Export CSV</button><button id="finClose">Close</button></div></div>';
    document.body.appendChild(ov);
    var close=function(){ try{document.body.removeChild(ov);}catch(e){} }; ov.onclick=function(e){ if(e.target===ov)close(); };
    document.getElementById('finClose').onclick=close;
    var render=function(){
      var per=document.getElementById('finPer').value;
      var m0=new Date(); m0=new Date(m0.getFullYear(),m0.getMonth(),1).getTime();
      var collected=0,invoiced=0,tax=0,due=0,n=0;
      Object.keys(invByJob).forEach(function(k){ var iv=invByJob[k]; var t=iv.paid_at?new Date(iv.paid_at).getTime():new Date(iv.created_at||0).getTime();
        if(per==='month' && t<m0) return; n++;
        invoiced+=iv.total_cents||0; tax+=iv.tax_cents||0; if(iv.status==='paid'){collected+=iv.total_cents||0;} else {due+=iv.total_cents||0;}
      });
      document.getElementById('finBody').innerHTML='<div class="totals"><div class="tr"><span>Invoices</span><span>'+n+'</span></div><div class="tr"><span>Collected</span><span>'+money(collected)+'</span></div><div class="tr"><span>Outstanding</span><span>'+money(due)+'</span></div><div class="tr"><span>Sales tax collected</span><span>'+money(tax)+'</span></div><div class="tr grand"><span>Invoiced</span><span>'+money(invoiced)+'</span></div></div><div class="sub" style="margin-top:8px;font-size:12.5px;color:var(--muted)">Export the CSV for your bookkeeper — one row per invoice with labor, parts, tax and totals.</div>';
    };
    document.getElementById('finPer').onchange=render; render();
    document.getElementById('finCsv').onclick=exportCsv;
  }

  function exportCsv(){
    // pull line detail across all invoices, then build a per-invoice CSV
    var ids=Object.keys(invByJob).map(function(k){return invByJob[k].id;});
    sb.from('invoice_line').select('invoice_id,kind,unit_cents,qty').in('invoice_id', ids.length?ids:['00000000-0000-0000-0000-000000000000']).then(function(r){
      var byInv={}; (r.data||[]).forEach(function(l){ var b=byInv[l.invoice_id]=byInv[l.invoice_id]||{labor:0,part:0,fee:0}; b[l.kind]=(b[l.kind]||0)+Math.round((l.unit_cents||0)*(l.qty||1)); });
      var head=['Date','Customer','Appliance','Labor','Parts','Fee','Subtotal','Tax','Total','Status','Method'];
      var rows=[head.join(',')];
      jobsCache.forEach(function(j){ var iv=invByJob[j.id]; if(!iv) return; var b=byInv[iv.id]||{labor:0,part:0,fee:0};
        var d=iv.paid_at||iv.created_at||''; d=d?new Date(d).toISOString().slice(0,10):'';
        var cust=(fullName(j.customer)||'Customer').replace(/"/g,'""');
        var appl=((j.unit&&j.unit.label)||'').replace(/"/g,'""');
        rows.push([d,'"'+cust+'"','"'+appl+'"',(b.labor/100).toFixed(2),(b.part/100).toFixed(2),(b.fee/100).toFixed(2),((iv.subtotal_cents||0)/100).toFixed(2),((iv.tax_cents||0)/100).toFixed(2),((iv.total_cents||0)/100).toFixed(2),iv.status||'',iv.paid_method||''].join(','));
      });
      var blob=new Blob([rows.join('\n')],{type:'text/csv'}); var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=(shopName||'shop').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-invoices.csv'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); try{document.body.removeChild(a);}catch(e){} },1500);
    });
  }

  function loadBoard() {
    // RLS scopes both queries to the logged-in user's company — we never pass company_id.
    sb.from('job').select(
      'id,status,problem,source,scheduled_day,created_at,office_notes,customer_id,' +
      'customer:customer_id(first_name,last_name,phone),unit:unit_id(label),technician:technician_id(name)'
    ).order('created_at', { ascending: false }).then(function (r) {
      if (r.error) { document.getElementById('board').innerHTML = '<div class="empty">Couldn\'t load the board: ' + esc(r.error.message) + '</div>'; return; }
      jobsCache = r.data || [];
      sb.from('invoice').select('id,job_id,status,subtotal_cents,tax_cents,total_cents,paid_at,paid_method,created_at').then(function (ir) {
        invByJob = {};
        (ir.data || []).forEach(function (iv) { if (iv.job_id) { var p = invByJob[iv.job_id]; if (!p || new Date(iv.created_at) > new Date(p.created_at)) invByJob[iv.job_id] = iv; } });
        renderMoneyBar(); renderFilters(); renderBoard();
      });
    });
  }

  function subscribeRealtime() {
    try {
      rt = sb.channel('office-board')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'job' }, loadBoard)
        .subscribe();
    } catch (e) { /* realtime optional — Refresh still works */ }
  }

  function boot() {
    renderShell();
    // Company (RLS returns only this shop's row via the company_self policy).
    sb.from('company').select('id,name,trade,settings').limit(1).then(function (r) {
      if (!r.error && r.data && r.data[0]) { companyId = r.data[0].id; shopSettings = r.data[0].settings || {}; shopName = r.data[0].name; var el = document.getElementById('shop'); if (el) el.textContent = shopName; }
      loadBoard();
    });
    subscribeRealtime();
  }

  // Resume an existing session, else sign-in.
  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) boot(); else renderSignIn();
  });
})();
</script>
