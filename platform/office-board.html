<!doctype html>
<html lang="en" data-live="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Office Board — Ant</title>
<!--
  Ant platform — OFFICE BOARD (multi-tenant reference surface).
  Runs against the Supabase platform project (docs/sql/004_multitenant_core.sql).
  Auth → the board shows ONLY this shop's jobs (Row-Level Security does the scoping;
  the page never sends a company_id). Realtime keeps it live. This same pattern —
  sign in, query, RLS scopes to your tenant — is what the tech app + customer portal
  reuse. One codebase, three lenses, every shop.
-->
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd;
    --brand:#3f8f24; --brand-ink:#ffffff; --chip:#eef2e8; --shadow:0 1px 2px rgba(20,30,10,.06),0 4px 14px rgba(20,30,10,.05);
    --new:#6b7280; --scheduled:#2563eb; --in_progress:#b45309; --awaiting_parts:#7c3aed; --completed:#3f8f24; --canceled:#9ca3af;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --chip:#20281a;
    --brand:#5bb537; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .brand{font-weight:800;letter-spacing:.2px}
  header .shop{color:var(--muted);font-weight:600}
  header .sp{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 12px;font-weight:600}
  button.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  button:disabled{opacity:.55;cursor:default}
  .wrap{padding:14px;max-width:720px;margin:0 auto}
  @media(min-width:800px){ .wrap{max-width:1200px} }
  /* vertical board — no side-scroll */
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
  .filters button{white-space:nowrap;border-radius:999px;padding:7px 13px;font-size:13px}
  .filters button.on{background:var(--ink);color:var(--bg);border-color:transparent}
  /* top slider — drag it to slide the WHOLE board across (the bottom scrollbar is hidden) */
  .boardslide{display:block;width:100%;margin:2px 0 12px;height:22px;cursor:pointer;accent-color:var(--gold,#f6b01f);position:sticky;top:0;z-index:5;background:var(--bg)}
  /* horizontal kanban — the columns slide together; scrollbar hidden (the top slider drives it) */
  .board{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;align-items:flex-start;scrollbar-width:none;-ms-overflow-style:none}
  .board::-webkit-scrollbar{display:none}
  .col{flex:0 0 264px;width:264px;margin-bottom:0;border-radius:12px;padding:4px;transition:background .12s ease,box-shadow .12s ease}
  .col.dragover{background:var(--chip);box-shadow:inset 0 0 0 2px var(--gold,#f6b01f)}
  .card.dragging{opacity:.45}
  .card select.mv{margin-top:8px;width:100%;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--muted);font-weight:700;-webkit-appearance:menulist;appearance:auto;cursor:pointer}
  .money{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;margin-bottom:2px}
  .stat{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
  .stat .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .stat .val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .card{cursor:pointer}
  .card .money-badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
  .money-badge.paid{background:#dcfce7;color:#166534}
  .money-badge.due{background:#fef3c7;color:#92400e}
  .flag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe;margin:5px 5px 0 0}
  .schedflags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .schedflags button.on{background:#e0e7ff;color:#3730a3;border-color:#c7d2fe;font-weight:800}
  :root:not([data-theme="light"]) .money-badge.paid,:root[data-theme="dark"] .money-badge.paid{background:#14351f;color:#8ff0b0}
  :root:not([data-theme="light"]) .money-badge.due,:root[data-theme="dark"] .money-badge.due{background:#3a2e0c;color:#f2ce7a}
  .col h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
  .col h3 .n{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px}
  .col h3 .dot{width:8px;height:8px;border-radius:50%}
  .col h3 .colmenu{margin-left:auto;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:7px;padding:1px 6px;font-size:15px;line-height:1;cursor:pointer;letter-spacing:1px}
  .col h3 .colmenu:hover{border-color:var(--line);color:var(--ink)}
  .col h3 .colmenu.on{color:var(--gold)}
  .col h3 .sortlbl{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 7px;font-size:10px;text-transform:none;letter-spacing:0;font-weight:700}
  .colmenu-pop{position:fixed;z-index:9000;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.4);padding:7px;font-size:13px}
  .colmenu-pop .cmh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:5px 8px 6px}
  .colmenu-pop button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;background:transparent;color:var(--ink);border-radius:8px;padding:8px 9px;font:inherit;cursor:pointer}
  .colmenu-pop button:hover{background:var(--chip)}
  .colmenu-pop button .ck{margin-left:auto;color:var(--gold);font-weight:800}
  .colmenu-pop .cmdiv{height:1px;background:var(--line);margin:5px 2px}
  .colmenu-pop .cmdir{display:flex;gap:6px;padding:2px}
  .colmenu-pop .cmdir button{justify-content:center;border:1px solid var(--line);flex:1}
  .colmenu-pop .cmdir button.on{border-color:var(--brand);color:var(--brand);font-weight:800}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .card .name{font-weight:700}
  .card .unit{color:var(--muted);font-size:13px;margin-top:1px}
  .card .prob{margin-top:7px;font-size:13.5px}
  .card .foot{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
  .tech{color:var(--muted);font-size:12px;font-weight:600}
  .empty{color:var(--muted);font-size:13px;padding:8px 2px}
  /* auth / connect gates */
  .gate{max-width:380px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
  .gate h1{margin:0 0 4px;font-size:20px}
  .gate p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .gate label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .gate button{width:100%;margin-top:18px}
  .err{color:#c0392b;font-size:13px;margin-top:12px;min-height:1.2em}
  :root[data-theme="dark"] .err,:root:not([data-theme="light"]) .err{color:#ff8a7a}
  .ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,6,.5);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;overflow:auto}
  .ov:has(.drawer){padding:3vh 10px 14px}   /* the big job tile uses nearly the whole screen */
  .sheet{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .sheet h2{margin:0 0 6px;font-size:19px}
  .sheet label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin:15px 0 5px}
  .sheet label .hint{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
  .sheet input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .sheet .srow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .sheet.drawer{width:94vw;max-width:1040px;padding:26px 30px;font-size:15px}
  .sheet.drawer .custname{font-size:24px}
  .sheet.drawer input,.sheet.drawer select,.sheet.drawer textarea{font-size:15px}
  @media (max-width:640px){ .sheet.drawer{width:96vw;padding:20px 16px} }
  /* 📋 TDR — the office claim surface */
  #jtdr .tinp{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;box-sizing:border-box;margin-bottom:8px}
  #jtdr .tlab{font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin:6px 0 3px}
  #jtdr .tpart,#jtparts .tpart{display:flex;gap:7px;align-items:center;margin-bottom:7px}
  #jtdr .tpart input,#jtparts .tpart input{flex:1 1 auto;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-family:ui-monospace,Menlo,monospace}
  #jtdr .tpart .del,#jtparts .tpart .del{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer}
  #jtdr .tpadd,#jtparts .tpadd{background:var(--ink);color:var(--bg);border:none;border-radius:9px;padding:9px 13px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
  #jtdr .touts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:2px 0 4px}
  #jtdr .tout{display:flex;align-items:center;gap:7px;justify-content:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 11px;font-weight:700;font-size:13px;cursor:pointer}
  #jtdr .tout.on{color:#fff;border-color:transparent}
  #jtdr .tout.on[data-o="fixed"]{background:#1f7a37}
  #jtdr .tout.on[data-o="return_needed"]{background:#d98613}
  #jtdr .tout.on[data-o="not_fixable"]{background:#1f6fed}
  #jtdr .tout.on[data-o="second_opinion"]{background:#7c3aed}
  #jtdr .tout.on[data-o="no_failure"]{background:#6b7280}
  #jtdr .tmedia{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  #jprev .prevrow{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 11px;margin-bottom:7px;line-height:1.42}
  #jprev .prevrow>div{margin-top:2px}
  #jprev .prevhd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;margin-top:0}
  #jprev .prevbadge{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
  #jmsgtoggle{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;cursor:pointer}
  #jmsgtoggle:hover{border-color:var(--brand)}
  /* ── 🏷️ TAGS — colorful chips on the card + the drawer editor ── */
  .jtags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 2px}
  .jtag{font-size:10.5px;font-weight:800;letter-spacing:.02em;border-radius:6px;padding:2px 8px;line-height:1.5;white-space:nowrap;text-transform:uppercase}
  #jtags .tglist{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
  #jtags .tgassigned{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:7px;padding:3px 6px 3px 9px;text-transform:uppercase}
  #jtags .tgassigned .x{cursor:pointer;font-weight:900;opacity:.85;font-size:13px;line-height:1}
  #jtags .tgpick{cursor:pointer;font-size:11px;font-weight:800;border-radius:7px;padding:4px 10px;text-transform:uppercase;border:2px solid transparent;opacity:.55;transition:opacity .1s}
  #jtags .tgpick.on{opacity:1;border-color:rgba(255,255,255,.6)}
  #jtags .tgpick:hover{opacity:1}
  #jtags .tgpick .del{margin-left:6px;opacity:.8;font-weight:900}
  #jtags .tgnew{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
  #jtags .tgnew input{flex:1 1 130px;min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  #jtags .tgsw{display:flex;gap:5px;flex-wrap:wrap}
  #jtags .tgsw button{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
  #jtags .tgsw button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
  #jtags .tgnew .tgadd{border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer}
  #jtags .tgedit{float:right;text-transform:none;letter-spacing:0;margin-top:-3px;padding:2px 8px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer}
  #jtparts .tpcard{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;margin-bottom:8px;display:flex;flex-direction:column;gap:7px}
  #jtparts .tprow{display:flex;gap:7px;align-items:center}
  #jtparts .tpcard input,#jtparts .tpcard select{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;box-sizing:border-box;min-width:0}
  #jtparts .tp_num{flex:1 1 40%;font-family:ui-monospace,Menlo,monospace}
  #jtparts .tp_name{flex:1 1 55%}
  #jtparts .tp_src{flex:1 1 auto;width:100%}
  #jtparts .tp_ship{flex:1 1 auto}
  #jtparts .tpeta{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  #jtparts .tpcard .del{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer}
  #jtparts .tpcard .tpadd{flex:0 0 auto;border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer}
  .sheet .sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:18px 0 8px}
  .sheet .sec button.supcfg{float:right;text-transform:none;letter-spacing:0;margin-top:-3px;padding:2px 8px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer}
  .sheet .sec button.supcfg:hover{color:var(--ink);border-color:var(--brand)}
  .jfindg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .jfindg button{font-size:12.5px;font-weight:700;padding:9px 6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer}
  .jfindg button:hover{border-color:var(--brand)}
  .sheet .custname{font-size:20px;font-weight:800}
  .sheet .sub{color:var(--muted);font-size:14px;margin-top:1px}
  .statusbtns{display:flex;flex-wrap:wrap;gap:7px}
  .statusbtns button{font-size:12.5px;padding:7px 11px;font-weight:700}
  .statusbtns button.on{color:#fff;border-color:transparent}
  .sheet textarea{width:100%;min-height:70px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
  .pay{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .pay .fld{display:flex;flex-direction:column;gap:4px}
  .pay .fld label{font-size:11.5px;font-weight:700;color:var(--muted)}
  .pay .fld input{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
  .totals{background:var(--chip);border-radius:11px;padding:11px 13px;margin-top:11px;font-variant-numeric:tabular-nums}
  .totals .tr{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
  .totals .tr.grand{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:5px;padding-top:8px}
  .paidrow{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
  .paidrow select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
  /* 🔍 big office-wide customer search */
  #searchwrap{position:relative;margin:0 0 12px}
  #jobsearch{width:100%;box-sizing:border-box;padding:14px 16px;font-size:17px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-weight:600}
  #jobsearch::placeholder{color:var(--muted);font-weight:600}
  #jobsearch:focus{border-color:var(--brand);outline:none}
  .searchres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 44px rgba(0,0,0,.45);max-height:62vh;overflow:auto;padding:6px}
  .searchres .sr-row{padding:11px 12px;border-radius:9px;cursor:pointer}
  .searchres .sr-row:hover{background:var(--chip)}
  .searchres .sr-nm{font-weight:800;font-size:15px}
  .searchres .sr-ph{font-weight:600;color:var(--muted);font-size:13px;margin-left:6px}
  .searchres .sr-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .searchres .sr-empty{padding:13px;color:var(--muted);font-size:13.5px}
  .tiprow{display:flex;align-items:center;gap:9px;margin:8px 0 2px;flex-wrap:wrap}
  .tiprow label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
  .tiprow input{flex:0 0 auto;width:100px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
  .econ{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:11px;font-variant-numeric:tabular-nums}
  .econ .er{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}
  .econ .er .k{color:var(--muted)}
  .econ .er.hd{font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:11px;color:var(--muted);margin-bottom:2px;padding-bottom:2px}
  .econ input{width:88px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;text-align:right;font-variant-numeric:tabular-nums}
  /* schedule handshake (office) */
  #jsched .offrow{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:8px}
  #jsched .offrow.pend{opacity:.85}
  #jsched .offrow .ot{font-size:13px;line-height:1.35}
  #jsched .offrow .book{background:var(--accent,#2f7d32);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-weight:800;font-size:12.5px;white-space:nowrap;cursor:pointer}
  #jsched .offrow .wd{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12px;white-space:nowrap;cursor:pointer}
  #jsched .offform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
  #jsched .offform input,#jsched .offform select{flex:1 1 auto;min-width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
  #jsched .offform .primary{background:var(--ink);color:var(--bg);border:none;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
  /* printable statement */
  @media print{ body *{visibility:hidden} #stmt,#stmt *{visibility:visible} #stmt{position:absolute;inset:0;padding:24px} .noprint{display:none!important} }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--chip);padding:1px 5px;border-radius:5px}

  :root[data-theme="dark"] .banner,:root:not([data-theme="light"]) .banner{background:#2a2410;border-color:#5a4a1a;color:#e6c766}
  /* ── SLOT-MACHINE DOPAMINE (TN colors): a gold jackpot hero + glowing reels + status-lit tiles ── */
  .money{display:block !important;overflow:visible;padding-bottom:0}
  .jackpot{position:relative;overflow:hidden;border-radius:18px;padding:17px 18px 15px;margin-bottom:14px;background:linear-gradient(135deg,#151d10,#0b1006);border:1px solid #2d3d1a;box-shadow:0 12px 36px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05)}
  .jackpot::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 130% at 100% 0%, rgba(247,181,0,.18), transparent 55%);pointer-events:none}
  .jp-label{position:relative;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#c6d2b2}
  .jp-num{position:relative;font-family:'Bricolage Grotesque',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.04;margin-top:3px;background:linear-gradient(180deg,#ffe98a 0%,#f6b01f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(247,181,0,.28));letter-spacing:-.01em}
  .jp-num.flash{animation:jpFlash .8s ease}
  @keyframes jpFlash{0%{filter:drop-shadow(0 2px 14px rgba(247,181,0,.28))}28%{filter:drop-shadow(0 0 22px rgba(247,181,0,.85)) brightness(1.25)}100%{filter:drop-shadow(0 2px 14px rgba(247,181,0,.28))}}
  .jp-reels{position:relative;display:flex;gap:8px;overflow-x:auto;margin-top:13px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .reel{flex:0 0 auto;background:rgba(0,0,0,.34);border:1px solid #35461f;border-radius:11px;padding:8px 13px;min-width:98px}
  .reel .rl{display:block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#93a37c}
  .reel .rv{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:#eef4e3;margin-top:2px}
  .reel.go{cursor:pointer;border-color:#5f7f31}.reel.go .rv{color:#8ff0b0}
  .reel.go:hover{transform:translateY(-1px)}
  .board .card{ box-shadow: inset 4px 0 0 var(--sc,var(--line)), var(--shadow) !important; transition:transform .13s ease, box-shadow .18s ease; }
  .board .card:hover{ transform:translateY(-2px); }
  .board .card.paidcard{ box-shadow: inset 4px 0 0 #f7b500, 0 0 0 1px rgba(247,181,0,.32), 0 8px 22px rgba(247,181,0,.14) !important; }
  @media (prefers-reduced-motion: reduce){ .jp-num.flash{animation:none} .board .card{transition:none} .board .card:hover{transform:none} }
  .mtile{position:relative;display:inline-flex;width:62px;height:62px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#0b0d08;align-items:center;justify-content:center;vertical-align:middle;margin-right:6px}
  .mtile img{width:100%;height:100%;object-fit:cover;display:block}
  .vtile .vcover{position:absolute;inset:0}
  .vtile .play{position:absolute;color:#fff;font-size:20px;line-height:1;text-shadow:0 1px 5px rgba(0,0,0,.7);pointer-events:none}
  .cardmedia{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  .cardmedia .mtile{width:44px;height:44px;border-radius:7px;margin-right:0}
  .cardmedia .vtile .play{font-size:15px}
  /* ── 📷 MEDIA GALLERY — the shareable photos/videos section on the drawer ── */
  #jmedia .mgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:4px}
  #jmedia .mgitem{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
  #jmedia .mgthumb{position:relative;display:block;width:100%;aspect-ratio:4/3;background:#0b0d08}
  #jmedia .mgthumb img{width:100%;height:100%;object-fit:cover;display:block}
  #jmedia .mgthumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none}
  #jmedia .mglabel{font-size:11px;color:var(--muted);padding:6px 8px 0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #jmedia .mgacts{display:flex;gap:6px;padding:5px 8px 8px}
  #jmedia .mgacts a,#jmedia .mgacts button{flex:1;text-align:center;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:6px 4px;background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none}
  #jmedia .mgacts a:hover,#jmedia .mgacts button:hover{border-color:var(--brand)}
  /* ── DENSE CARDS: legacy TN information design on the platform's dark-vivid theme ── */
  .card .ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .card .agechip{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  .card .chdr{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
  .copychip{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:7px;white-space:nowrap;cursor:pointer;border:1px solid;background:var(--chip);color:var(--ink)}
  .copychip .cc-ico{opacity:.55;font-size:10px}
  .copychip.cc-ref{background:rgba(90,169,255,.14);color:#5aa9ff;border-color:rgba(90,169,255,.42)}
  .copychip.cc-part{background:rgba(0,214,143,.14);color:#00d68f;border-color:rgba(0,214,143,.42)}
  .vbadge{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:var(--gold-grad,linear-gradient(135deg,#ffd75a,#f5a623));color:#231a02;border:1px solid transparent}
  .citychip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:2px 2px}
  .card .availc{margin-top:7px;padding:7px 10px;border-radius:9px;background:rgba(90,169,255,.12);border:1px solid rgba(90,169,255,.42);color:#4b93e6;font-size:12.5px;font-weight:800;line-height:1.4}
  :root:not([data-theme="light"]) .card .availc,:root[data-theme="dark"] .card .availc{color:#8cc0ff}
  .card .schedc{margin-top:7px;padding:6px 10px;border-radius:9px;background:rgba(31,122,55,.14);border:1px solid rgba(31,122,55,.45);color:#1f7a37;font-size:12.5px;font-weight:800;line-height:1.35}
  :root:not([data-theme="light"]) .card .schedc,:root[data-theme="dark"] .card .schedc{color:#7fdd97}
  .card .cmsg{margin-top:7px;padding:7px 10px;border-radius:10px;background:rgba(26,158,70,.10);border:1px solid rgba(26,158,70,.34);color:var(--ink);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .fchip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);background:var(--chip);color:var(--muted)}
  .fchip.fover{background:rgba(255,90,70,.16);color:#ff6a52;border-color:rgba(255,90,70,.46)}
  .fchip.fparts{background:rgba(245,166,35,.16);color:#f5a623;border-color:rgba(245,166,35,.46)}
  .fchip.fclose{background:rgba(255,120,70,.14);color:#ff8a52;border-color:rgba(255,120,70,.42)}
  .fchip.fdiag{background:rgba(90,169,255,.14);color:#5aa9ff;border-color:rgba(90,169,255,.42)}
  .fchip.fmm{background:rgba(180,140,255,.16);color:#b48cff;border-color:rgba(180,140,255,.46)}
  .fchip.fnote{background:rgba(245,166,35,.14);color:#e0a11a;border-color:rgba(245,166,35,.4)}
  .cardacts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .cardact{flex:1;min-width:118px;font-size:12px;font-weight:800;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
  .card .act-complete{background:rgba(0,214,143,.14);color:#00d68f;border-color:rgba(0,214,143,.42)}
  .card .act-report{background:rgba(245,166,35,.14);color:#e0a11a;border-color:rgba(245,166,35,.42)}
  /* ── ✅ OFFICE CHECKLIST (shared, saved to job.checklist) ── */
  .cklist{display:flex;flex-direction:column;gap:5px}
  .ckrow{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);user-select:none;-webkit-user-select:none}
  .ckrow .cknum{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;min-width:15px;text-align:right}
  .ckrow .ckbox{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:transparent;background:var(--panel)}
  .ckrow .cklab{flex:1}
  .ckrow.on{background:rgba(0,214,143,.10);border-color:rgba(0,214,143,.42)}
  .ckrow.on .ckbox{background:#00d68f;border-color:#00d68f;color:#06231a}
  .ckrow.on .cklab{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .sec .ckprog{font-weight:600;color:var(--muted);font-size:11px;margin-left:6px;letter-spacing:0}
  /* ── 💰 PAYMENT panel + ⏰ cutoff ── */
  .paycovered{padding:9px 12px;border-radius:10px;background:rgba(90,169,255,.12);border:1px solid rgba(90,169,255,.42);color:#4b93e6;font-size:13px;font-weight:700}
  :root:not([data-theme="light"]) .paycovered,:root[data-theme="dark"] .paycovered{color:#8cc0ff}
  .paydue{font-weight:800;font-size:15px;margin-bottom:8px;font-variant-numeric:tabular-nums}
  /* ── 🎰 JACKPOT HEADER STRUCTURE — neutral layout that works in BOTH skins ──
     The header carries class="topbar" so ant-magic can hang its 💰 house-points
     badge + garland on it. These rules only lay it out (title row + region toggle
     + a quick-hop nav); all the casino coloring lives in skin-jackpot.css. */
  header.topbar{display:block;align-items:initial}
  header.topbar .tb-row{display:flex;align-items:center;gap:12px}
  header.topbar .seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
  header.topbar .seg button{border:0;background:none;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:none;white-space:nowrap}
  header.topbar .seg button.on{background:var(--panel);color:var(--brand);box-shadow:0 1px 3px rgba(20,30,50,.12)}
  header.topbar .hop{display:flex;gap:7px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  header.topbar .hop::-webkit-scrollbar{display:none}
  header.topbar .hop a{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;text-decoration:none;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
</style>

<body>
<div id="app"></div>

<script src="/platform/config.js"></script>
<script src="/platform/features.js"></script>

<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>

<script>
(function () {
  var app = document.getElementById('app');
  var cfg = window.ANT_SUPABASE || {};
  var sb = null, rt = null, companyId = null, shopSettings = {}, features = {};

  // ── STATUS COLUMNS ─────────────────────────────────────────────────────────
  var COLS = [
    { key: 'new',            label: 'New',            color: 'var(--new)' },
    { key: 'scheduled',      label: 'Scheduled',      color: 'var(--scheduled)' },
    { key: 'in_progress',    label: 'In progress',    color: 'var(--in_progress)' },
    { key: 'awaiting_parts', label: 'Awaiting parts', color: 'var(--awaiting_parts)' },
    { key: 'completed',      label: 'Completed',      color: 'var(--completed)' },
  ];

  // ── BOARD COLUMNS (workflow stages) — the office board's REAL columns, matching the legacy
  // board. Cards group by stageOf(job): a manual placement (job.board_stage, written on move)
  // wins; otherwise a sensible default is derived from status/tech/invoice. board_stage is
  // orthogonal to the coarse status enum — moving a card never changes its status/tech.
  var BASE_STAGES = [
    { key:'needs_scheduled', label:'Needs Scheduled',   color:'var(--new)' },
    { key:'pre_diagnosed',   label:'Pre-Diagnosed',     color:'#7c9cff' },
    { key:'needs_parts',     label:'Needs Parts',       color:'#e0a458' },
    { key:'scheduled',       label:'Scheduled',         color:'var(--scheduled)' },
    { reports:true },                                    // → one "{Tech} Reports" column per tech
    { key:'upgrade',         label:'Upgrade',           color:'#c084fc' },
    { key:'waiting_parts',   label:'Waiting for Parts', color:'var(--awaiting_parts)' },
    { key:'completion',      label:'Completion',        color:'var(--completed)' },
    { key:'needs_invoiced',  label:'Needs Invoiced',    color:'#f59e0b' },
    { invoiced:true },                                   // → one "{Tech} Invoiced" column per tech
    { key:'shop_paid',       label:'Shop Money Paid',   color:'#16a34a' },
  ];
  function firstName(n){ return (String(n||'').trim().split(/\s+/)[0]) || 'Tech'; }
  // Active techs scoped to the selected region (by service_area ZIP prefix when known; a
  // covers-everywhere tech with no area shows in both). demo shop → demo techs; TN → real crew.
  function regionTechs(){
    return techsCache.filter(function(t){
      var sa=String(t.service_area||'').trim();
      if(!sa) return true;
      var laHit=/(^|[^0-9])(70|71)\d?/.test(sa), tnHit=/(^|[^0-9])(37|38|42)\d?/.test(sa);
      if(region==='LA') return laHit || !tnHit;
      return tnHit || !laHit;
    });
  }
  // The ordered column list for the current region (per-tech Report/Invoiced expanded).
  function boardStages(){
    var techs=regionTechs(), out=[];
    BASE_STAGES.forEach(function(s){
      if(s.reports){ techs.forEach(function(t){ out.push({ key:'rep:'+t.id, label:firstName(t.name)+' Reports',  color:'#38bdf8', tech:t.id }); }); }
      else if(s.invoiced){ techs.forEach(function(t){ out.push({ key:'inv:'+t.id, label:firstName(t.name)+' Invoiced', color:'#22c55e', tech:t.id }); }); }
      else out.push(s);
    });
    return out;
  }
  function stageMeta(key, cols){ cols=cols||boardStages(); for(var i=0;i<cols.length;i++){ if(cols[i].key===key) return cols[i]; } return { key:key, label:String(key||'').replace(/[:_]/g,' '), color:'var(--muted)' }; }
  // Default column when nothing has been placed manually — derived from the job's live state.
  function derivedStage(j){
    var st=j.status, iv=invByJob[j.id], t=(j.technician_id!=null&&j.technician_id!=='');
    if(st==='completed'){ if(!iv) return 'needs_invoiced'; if(iv.status!=='paid') return t?('inv:'+j.technician_id):'needs_invoiced'; return 'shop_paid'; }
    if(st==='awaiting_parts') return 'waiting_parts';
    if(st==='in_progress') return t?('rep:'+j.technician_id):'scheduled';
    if(st==='scheduled') return 'scheduled';
    return 'needs_scheduled';
  }
  // Where a job sits: a manual board_stage placement wins, but if that column no longer exists
  // in this region (tech gone / wrong region) re-home it to the derived default so it's never lost.
  function stageOf(j, cols){
    var s=String(j.board_stage||'').trim();
    if(s){ cols=cols||boardStages(); for(var i=0;i<cols.length;i++){ if(cols[i].key===s) return s; } return derivedStage(j); }
    return derivedStage(j);
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function fullName(c){ return c ? [c.first_name, c.last_name].filter(Boolean).join(' ').trim() : ''; }

  // ── TN / NOLA region split (ported from platform/dispatch.html) ──────────────
  // Route a job to a region by the customer's state, falling back to a known LA city
  // when the state is blank. Powers the header TN/NOLA toggle that scopes the board.
  var region = '';   // 'TN' | 'LA' — defaults to the busier region on first render
  var LA_CITIES = {'new orleans':1,'metairie':1,'kenner':1,'gretna':1,'chalmette':1,'harvey':1,'marrero':1,'westwego':1,'slidell':1,'hammond':1,'covington':1,'mandeville':1,'ponchatoula':1,'baton rouge':1,'denham springs':1,'walker':1,'laplace':1};
  function jobRegion(j){ var c=(j&&j.customer)||{}; var st=String(c.state||'').trim().toUpperCase(); if(st==='LA'||st==='LOUISIANA') return 'LA'; if(st==='TN'||st==='TENNESSEE') return 'TN'; if(!st){ var city=String(c.city||'').trim().toLowerCase(); if(LA_CITIES[city]) return 'LA'; } return 'TN'; }
  function defaultRegion(list){ var tn=0,la=0; (list||[]).forEach(function(j){ if(jobRegion(j)==='LA') la++; else tn++; }); return la>tn?'LA':'TN'; }

  // ── Board skin (per-shop settings.skin) ──────────────────────────────────────
  // Default-on 🎰 Jackpot (cream/gold/red + the ant-magic points engine); a shop can
  // flip settings.skin to 'clean' for the platform's dark-vivid look. Jackpot also
  // stamps data-theme="light" so a dark-OS office can't fight the cream skin.
  function applySkin(sk){
    try{
      var root=document.documentElement;
      if(sk==='clean'){ root.setAttribute('data-skin',''); root.removeAttribute('data-theme'); }
      else { root.setAttribute('data-skin','jackpot'); root.setAttribute('data-theme','light'); }
    }catch(_){}
  }
  var _knownJobIds = null;   // baseline of job ids → an owl swoops in when a NEW one lands

  // ── CONNECT GATE — no project wired yet ────────────────────────────────────
  if (!cfg.url || !cfg.anonKey) {
    app.innerHTML =
      '<div class="gate"><h1>🐜 Connect your project</h1>' +
      '<p>This is the Ant office board. Point it at your Supabase platform project to bring it alive.</p>' +
      '<p>Fill <span class="mono">platform/config.js</span> with your project URL and the <b>anon public</b> key ' +
      '(Supabase → Settings → API), then reload. The anon key is safe in the browser — Row-Level Security protects every shop\'s data.</p></div>';
    return;
  }

  sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  // ── SIGN-IN VIEW ───────────────────────────────────────────────────────────
  function renderSignIn(msg) {
    app.innerHTML =
      '<div class="gate"><h1>🐜 Office board</h1><p>Sign in to your shop.</p>' +
      '<label>Email</label><input id="em" type="email" autocomplete="username" placeholder="you@shop.com">' +
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">' +
      '<button class="primary" id="go">Sign in</button>' +
      '<div class="err" id="err">' + esc(msg || '') + '</div></div>';
    var go = document.getElementById('go');
    function submit() {
      var em = document.getElementById('em').value.trim();
      var pw = document.getElementById('pw').value;
      if (!em || !pw) { document.getElementById('err').textContent = 'Enter your email and password.'; return; }
      go.disabled = true; go.textContent = 'Signing in…';
      sb.auth.signInWithPassword({ email: em, password: pw }).then(function (r) {
        if (r.error) { renderSignIn(r.error.message); }
        else { boot(); }
      });
    }
    go.onclick = submit;
    document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  }

  // ── BOARD VIEW ─────────────────────────────────────────────────────────────
  var shopName = '';
  function renderShell() {
    // header carries class="topbar" + an inner .tb-row so ant-magic can hang the 💰
    // house-points badge (it inserts right before the .seg region toggle) and the garland.
    app.innerHTML =
      '<header class="topbar">' +
        '<div class="tb-row">' +
          '<span class="brand">🐜 Ant</span><span class="shop" id="shop">' + esc(shopName || '…') + '</span>' +
          '<span class="sp"></span>' +
          '<div class="seg" id="region-seg"></div>' +
          '<button id="remit">💵 Remittance</button><button id="settings">⚙️ Settings</button><button id="refresh">Refresh</button><button id="out">Sign out</button>' +
        '</div>' +
        '<nav class="hop" aria-label="Jump to">' +
          '<a href="/platform/dispatch.html">📅 Dispatch</a>' +
          '<a href="/platform/needs-scheduled.html">🗓 Needs Scheduled</a>' +
          '<a href="/platform/dispatch.html?coverage=1">🗺️ Coverage</a>' +
          '<a href="/platform/comms.html">💬 Messages</a>' +
          '<a href="/platform/owner.html">💰 Owner</a>' +
          '<a href="/platform/office-overview.html">🗂 Overview</a>' +
        '</nav>' +

  // ── 🔍 CUSTOMER SEARCH — reliable lookup by name / phone / work-order (claim/dispatch) #.
  // Instant client scan of loaded jobs (normalized phone match) + a live RLS-scoped DB query so
  // even old jobs surface. A result opens the full job tile. ──
  var searchResults={}, searchSeq=0, searchTimer=null;
  var SR_SEL='id,status,problem,scheduled_day,claim_number,dispatch_id,warranty_company,office_notes,customer_id,technician_id,customer_cutoff,needs_two_techs,long_job,created_at,customer:customer_id(first_name,last_name,phone,city,state),unit:unit_id(label),technician:technician_id(name)';
  function srSanitize(t){ return String(t||'').replace(/[%,()*]/g,' ').replace(/\s+/g,' ').trim(); }
  function hideSearch(){ var r=document.getElementById('searchres'); if(r){ r.hidden=true; r.innerHTML=''; } }
  function wireSearch(){
    var inp=document.getElementById('jobsearch'); if(!inp) return;
    inp.oninput=function(){ clearTimeout(searchTimer); var t=inp.value.trim(); if(t.length<2){ hideSearch(); return; } searchTimer=setTimeout(function(){ runSearch(t); },200); };
    inp.onkeydown=function(e){ if(e.key==='Escape'){ hideSearch(); inp.blur(); } };
    document.addEventListener('click', function(e){ var w=document.getElementById('searchwrap'); if(w && !w.contains(e.target)) hideSearch(); }, true);
  }
  function clientMatches(t){
    var q=t.toLowerCase(); var d10=t.replace(/\D/g,'').slice(-10);
    return jobsCache.filter(function(j){
      var c=j.customer||{};
      var hay=((c.first_name||'')+' '+(c.last_name||'')+' '+(c.phone||'')+' '+(j.claim_number||'')+' '+(j.dispatch_id||'')+' '+((j.unit&&j.unit.label)||'')).toLowerCase();
      if(hay.indexOf(q)>=0) return true;
      if(d10.length>=7){ var pn=String(c.phone||'').replace(/\D/g,'').slice(-10); if(pn && pn.indexOf(d10)>=0) return true; }
      return false;
    });
  }
  function runSearch(term){
    var seq=++searchSeq; var t=srSanitize(term); if(!t){ hideSearch(); return; }
    var cm=clientMatches(t); renderSearch(cm, term);          // instant from the loaded set
    var like='%'+t+'%', digits=t.replace(/\D/g,'');
    var orJobs='claim_number.ilike.'+like+',dispatch_id.ilike.'+like;
    var orCust='first_name.ilike.'+like+',last_name.ilike.'+like+(digits.length>=3?',phone.ilike.%'+digits+'%':'');
    Promise.all([ sb.from('job').select(SR_SEL).or(orJobs).limit(20), sb.from('customer').select('id').or(orCust).limit(30) ]).then(function(res){
      if(seq!==searchSeq) return;
      var jobs=(res[0]&&res[0].data)||[]; var ids=((res[1]&&res[1].data)||[]).map(function(c){return c.id;});
      var finish=function(custJobs){ if(seq!==searchSeq) return;
        var all=cm.concat(jobs, custJobs||[]); var seen={}, uniq=[];
        all.forEach(function(j){ if(j&&j.id&&!seen[j.id]){ seen[j.id]=1; uniq.push(j); } });
        uniq.sort(function(a,b){ return new Date(b.created_at||0)-new Date(a.created_at||0); });
        renderSearch(uniq.slice(0,18), term);
      };
      if(ids.length) sb.from('job').select(SR_SEL).in('customer_id', ids).order('created_at',{ascending:false}).limit(30).then(function(r2){ finish((r2&&r2.data)||[]); });
      else finish([]);
    }).catch(function(){});
  }
  function renderSearch(list, term){
    var r=document.getElementById('searchres'); if(!r) return;
    if(!list.length){ r.innerHTML='<div class="sr-empty">No matches for “'+esc(term)+'” — try a last name, phone, or work-order #.</div>'; r.hidden=false; return; }
    searchResults={}; list.forEach(function(j){ searchResults[j.id]=j; });
    r.innerHTML=list.map(function(j){
      var nm=fullName(j.customer)||'Customer'; var ph=(j.customer&&j.customer.phone)||''; var appl=(j.unit&&j.unit.label)||'';
      var ref=j.claim_number?('Claim '+j.claim_number):(j.dispatch_id?('Disp '+j.dispatch_id):'');
      var day=j.scheduled_day?('📅 '+schDay(j.scheduled_day)):'';
      var meta=[appl, ref, day, statusMeta(j.status).label].filter(Boolean).join(' · ');
      return '<div class="sr-row" data-job="'+esc(j.id)+'"><div class="sr-nm">'+esc(nm)+(ph?'<span class="sr-ph">'+esc(ph)+'</span>':'')+'</div><div class="sr-meta">'+esc(meta)+'</div></div>';
    }).join('');
    r.hidden=false;
    r.querySelectorAll('.sr-row[data-job]').forEach(function(el){ el.onclick=function(){ var j=searchResults[el.getAttribute('data-job')]; hideSearch(); var inp=document.getElementById('jobsearch'); if(inp) inp.value=''; if(j) openJob(j); }; });
  }

  // accounts — we never touch it, never process it, it never lands in our bank. They add
  // or change these anytime; they show on the customer's invoice so customers pay them
  // directly. Structured in settings.pay.methods + an auto-built pay_instructions text so
  // the hosted invoice keeps working.
  var PAY_TYPES = [
    { t:'zelle',    l:'Zelle',            ph:'email or phone on your Zelle' },
    { t:'cashapp',  l:'Cash App',         ph:'$YourCashtag' },
    { t:'venmo',    l:'Venmo',            ph:'@your-venmo' },
    { t:'applepay', l:'Apple Pay',        ph:'phone # to send Apple Pay to' },

    { t:'check',    l:'Check payable to', ph:'Your Business LLC' },
    { t:'other',    l:'Other',            ph:'how to pay' },
  ];
  function payTypeMeta(t){ for(var i=0;i<PAY_TYPES.length;i++){ if(PAY_TYPES[i].t===t) return PAY_TYPES[i]; } return PAY_TYPES[PAY_TYPES.length-1]; }
  function payRowHtml(m){
    m = m || {};
    var opts = PAY_TYPES.map(function(p){ return '<option value="'+p.t+'"'+(m.type===p.t?' selected':'')+'>'+esc(p.l)+'</option>'; }).join('');
    var ph = payTypeMeta(m.type||'zelle').ph;
    var IST='padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;box-sizing:border-box';
    return '<div class="payrow" style="display:flex;gap:6px;margin-bottom:7px;align-items:center">' +
      '<select class="pm-type" style="'+IST+';flex:0 0 40%">'+opts+'</select>' +
      '<input class="pm-val" style="'+IST+';flex:1" placeholder="'+esc(ph)+'" value="'+esc(m.value||'')+'">' +
      '<button type="button" class="pm-del" title="Remove" style="flex:0 0 auto;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);cursor:pointer">✕</button>' +
    '</div>';
  }
  function wirePayRow(row){
    var typeSel=row.querySelector('.pm-type'), val=row.querySelector('.pm-val'), del=row.querySelector('.pm-del');
    if(typeSel) typeSel.onchange=function(){ if(!val.value.trim()) val.placeholder=payTypeMeta(typeSel.value).ph; };
    if(del) del.onclick=function(){ try{ row.parentNode.removeChild(row); }catch(e){} };

  function renderPayMethods(methods){
    var box=document.getElementById('payMethods'); if(!box) return;
    var list=(methods&&methods.length)?methods:[{type:'zelle',value:''}];
    box.innerHTML=list.map(payRowHtml).join('');
    box.querySelectorAll('.payrow').forEach(wirePayRow);

  function collectPayMethods(){
    var out=[]; var box=document.getElementById('payMethods'); if(!box) return out;
    box.querySelectorAll('.payrow').forEach(function(row){
      var t=row.querySelector('.pm-type').value, v=row.querySelector('.pm-val').value.trim();
      if(v) out.push({ type:t, value:v, label:payTypeMeta(t).l });
    });
    return out;
  }
  function payInstructionsText(methods, note){
    var lines=(methods||[]).map(function(m){ return m.label + ': ' + m.value; });
    if(note) lines.push(note);
    return lines.join('\n');
  }
