<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ant Shops</title>
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd;
    --brand:#3f8f24; --chip:#eef2e8; --gold:#c8892a; --bad:#b91c1c;
    --shadow:0 1px 2px rgba(20,30,10,.06),0 8px 24px rgba(20,30,10,.07);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#0f1310; --panel:#171c16; --ink:#eef2e8; --muted:#9aa595; --line:#28311f; --chip:#1e2519;
    --gold:#e0a94a; --bad:#f0776b; --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --bg:#0f1310; --panel:#171c16; --ink:#eef2e8; --muted:#9aa595; --line:#28311f; --chip:#1e2519;
    --gold:#e0a94a; --bad:#f0776b; --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:17px}
  h1{font-size:23px;margin:14px 2px 2px;letter-spacing:-.02em}
  .lede{color:var(--muted);margin:0 2px 14px;font-size:14px}
  .tally{display:flex;gap:10px;flex-wrap:wrap;margin:14px 2px}
  .tally .t{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:12px 14px}
  .tally .t b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tally .t span{color:var(--muted);font-size:12.5px;font-weight:700}
  .grouphd{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:22px 2px 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:14px 15px;margin-top:10px}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card h3{margin:0;font-size:16.5px;letter-spacing:-.01em}
  .card .slug{color:var(--muted);font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .b{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .b.trade{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
  .b.plan{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .nums{text-align:right;flex:none}
  .nums .j{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .nums .jl{color:var(--muted);font-size:11.5px;font-weight:700}
  .logins{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .logins .lg{display:flex;justify-content:space-between;gap:8px;font-size:12.7px;padding:2px 0}
  .logins .lg .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logins .lg .rl{color:var(--muted);flex:none;font-weight:700}
  .logins .lg .off{color:var(--bad)}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .links a{text-decoration:none;font-size:12.7px;font-weight:800;padding:7px 11px;border-radius:9px;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
  .nologin{color:var(--muted);font-size:12.5px;margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
  .gate{max-width:400px;margin:12vh auto 0}
  .gate .card{padding:20px}
  .gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;margin-top:10px}
  .gate button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .err{color:var(--bad);font-size:13px;min-height:16px;margin-top:8px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .refresh{background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 12px;font-weight:800;font-size:12.5px;cursor:pointer}
  .loading{color:var(--muted);text-align:center;margin-top:12vh}
</style></head>
<body><div class="wrap">
  <div class="brand"><span class="dot">🐜</span><span>Ant · Shops</span></div>

  <div id="gate" class="gate" style="display:none">
    <h1>Operator sign-in</h1>
    <p class="lede">Enter the operator key to see every shop on the platform.</p>
    <div class="card">
      <input id="key" type="password" placeholder="Operator key" autocomplete="off">
      <button id="go">View shops</button>
      <div id="gerr" class="err"></div>
    </div>
  </div>

  <div id="main" style="display:none">
    <h1>Every shop on the platform</h1>
    <p class="lede">Live from Supabase — jobs, logins, and quick links per tenant.</p>
    <div class="bar"><span class="lede" id="stamp" style="margin:0"></span><button class="refresh" id="refresh">↻ Refresh</button></div>
    <div id="tally" class="tally"></div>
    <div id="list"></div>
  </div>

  <div id="loading" class="loading">Loading shops…</div>
</div>
<script>
(function(){
  var KEY='ant_ops_secret';
  var TESTS={demo:1,tn:1,'tn-office-test':1,'hcp-import-demo':1};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  function show(id){ ['gate','main','loading'].forEach(function(x){ var e=document.getElementById(x); if(e) e.style.display=(x===id)?'block':'none'; }); }

  function card(r){
    var slug=r.slug||'', name=r.name||slug, jobs=r.jobs||0, logins=r.logins||[];
    var h='<div class="card"><div class="top"><div>'+
      '<h3>'+esc(name)+'</h3><div class="slug">'+esc(slug)+'</div>'+
      '<div class="badges"><span class="b trade">'+esc(r.trade||'—')+'</span>'+(r.plan?'<span class="b plan">'+esc(r.plan)+'</span>':'')+'</div>'+
      '</div><div class="nums"><div class="j">'+jobs.toLocaleString()+'</div><div class="jl">jobs</div></div></div>';
    if(logins.length){
      h+='<div class="logins">';
      logins.forEach(function(l){ h+='<div class="lg"><span class="em'+(l.active===false?' off':'')+'">'+esc(l.email||'')+(l.active===false?' (inactive)':'')+'</span><span class="rl">'+esc(l.role||'')+'</span></div>'; });
      h+='</div>';
    } else { h+='<div class="nologin">No logins yet — nobody can sign in to this shop.</div>'; }
    h+='<div class="links">'+
      '<a href="/s/'+encodeURIComponent(slug)+'" target="_blank" rel="noopener">🌐 Site</a>'+
      '<a href="/b/'+encodeURIComponent(slug)+'" target="_blank" rel="noopener">📅 Book link</a>'+
      '</div></div>';
    return h;
  }

  function render(rows){
    rows=rows.slice().sort(function(a,b){ return (b.jobs||0)-(a.jobs||0); });
    var real=rows.filter(function(r){ return !TESTS[r.slug]; });
    var tests=rows.filter(function(r){ return TESTS[r.slug]; });
    var totalJobs=rows.reduce(function(s,r){ return s+(r.jobs||0); },0);
    var withLogin=real.filter(function(r){ return (r.logins||[]).length>0; }).length;
    document.getElementById('tally').innerHTML=
      '<div class="t"><b>'+real.length+'</b><span>real shops</span></div>'+
      '<div class="t"><b>'+withLogin+'</b><span>with a login</span></div>'+
      '<div class="t"><b>'+totalJobs.toLocaleString()+'</b><span>jobs total</span></div>'+
      '<div class="t"><b>'+tests.length+'</b><span>test / demo</span></div>';
    var html='<div class="grouphd">Real shops ('+real.length+')</div>'+real.map(card).join('');
    if(tests.length) html+='<div class="grouphd">Test &amp; demo ('+tests.length+')</div>'+tests.map(card).join('');
    document.getElementById('list').innerHTML=html;
    document.getElementById('stamp').textContent='Updated '+new Date().toLocaleTimeString();
    show('main');
  }

  function load(){
    show('loading');
    var sec=localStorage.getItem(KEY)||'';
    fetch('/.netlify/functions/platform-provision?action=tenants&secret='+encodeURIComponent(sec))
      .then(function(r){ if(r.status===401||r.status===403) throw new Error('key'); return r.json(); })
      .then(function(d){ var rows=d.tenants||d.rows||(Array.isArray(d)?d:[]); if(!Array.isArray(rows)) throw new Error('bad'); render(rows); })
      .catch(function(e){ if(e.message==='key'){ localStorage.removeItem(KEY); gate('That key was rejected.'); } else { gate('Could not load — try again.'); } });
  }
  function gate(msg){ show('gate'); if(msg) document.getElementById('gerr').textContent=msg; var k=document.getElementById('key'); if(k) k.focus(); }

  document.getElementById('go').onclick=function(){ var v=document.getElementById('key').value.trim(); if(!v){ document.getElementById('gerr').textContent='Enter the key.'; return; } localStorage.setItem(KEY,v); load(); };
  document.getElementById('key').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('go').click(); });
  document.getElementById('refresh').onclick=load;

  if(localStorage.getItem(KEY)) load(); else gate('');
})();
</script>
</body></html>
