<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Get Started with Ant</title>
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd;
    --brand:#3f8f24; --brand-ink:#ffffff; --chip:#eef2e8;
    --shadow:0 1px 2px rgba(20,30,10,.06),0 8px 26px rgba(20,30,10,.08);
    --good:#2f8f3a; --gold:#c8892a; --bad:#b91c1c;
    --antbub:#f0f5ea;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1310; --panel:#171c16; --ink:#eef2e8; --muted:#9aa595; --line:#28311f; --chip:#1e2519;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.5);
      --good:#4bbd55; --gold:#e0a94a; --bad:#f0776b; --antbub:#1b2417;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1310; --panel:#171c16; --ink:#eef2e8; --muted:#9aa595; --line:#28311f; --chip:#1e2519;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.5);
    --good:#4bbd55; --gold:#e0a94a; --bad:#f0776b; --antbub:#1b2417;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 72px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;padding:6px 2px 2px}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:17px}
  .brand small{font-weight:600;color:var(--muted);font-size:12px;display:block;letter-spacing:.02em}
  h1{font-size:25px;margin:16px 2px 4px;letter-spacing:-.02em;text-wrap:balance}
  .lede{color:var(--muted);margin:0 2px 6px;font-size:14.5px}
  /* Ant speech bubble */
  .ant{display:flex;gap:10px;align-items:flex-start;background:var(--antbub);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:14px 2px}
  .ant .a{width:26px;height:26px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:15px;flex:none}
  .ant p{margin:0;font-size:13.5px;color:var(--ink)}
  .ant p b{color:var(--brand)}
  /* progress */
  .prog{margin:16px 2px 4px}
  .prog .bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
  .prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#6bc24a);border-radius:999px;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .prog .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:700}
  /* checklist cards */
  .steps{margin-top:14px;display:flex;flex-direction:column;gap:11px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:15px 15px 14px;display:flex;gap:13px;align-items:flex-start}
  .step.done{opacity:.92}
  .step .mk{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;font-weight:800;border:2px solid var(--line);color:var(--muted);background:var(--bg)}
  .step.done .mk{background:var(--good);border-color:var(--good);color:#fff}
  .step .bd{flex:1;min-width:0}
  .step h3{margin:0 0 2px;font-size:16px;letter-spacing:-.01em}
  .step .why{margin:0 0 3px;color:var(--muted);font-size:13.3px}
  .step .tip{margin:8px 0 0;font-size:12.6px;color:var(--muted);background:var(--antbub);border-radius:9px;padding:8px 10px;display:flex;gap:7px;align-items:flex-start}
  .step .tip b{color:var(--brand)}
  .step .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .step .act a,.step .act button{display:inline-block;text-decoration:none;padding:9px 14px;border-radius:10px;font-weight:800;font-size:13.5px;cursor:pointer;border:1px solid var(--line)}
  .step .act a.pri,.step .act button.pri{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  .step .act a.sec,.step .act button.sec{background:var(--bg);color:var(--ink)}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;vertical-align:middle;margin-left:6px}
  .pill.d{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
  .pill.t{background:var(--chip);color:var(--muted)}
  .pill.opt{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
  .done h3{color:var(--muted)}
  .help{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
  .help h3{margin:0 0 4px;font-size:15px}
  .help p{margin:0;color:var(--muted);font-size:13.3px}
  .celebrate{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line))}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  /* sign-in gate */
  .gate{max-width:400px;margin:11vh auto 0;text-align:center}
  .gate .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 20px;text-align:left}
  .gate label{display:block;font-weight:700;font-size:12.5px;margin:12px 2px 5px;color:var(--muted)}
  .gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
  .gate button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:11px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:15px;cursor:pointer}
  .gate .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px}
  .loading{text-align:center;color:var(--muted);margin-top:16vh;font-size:14px}
</style></head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot">🐜</span><span><span id="brandName">Ant</span><small>Getting started</small></span></div>
  <div id="loading" class="loading">Loading your setup…</div>
  <div id="gate" class="gate" style="display:none">
    <div class="brand" style="justify-content:center;margin-bottom:8px"><span class="dot">🐜</span></div>
    <div class="card">
      <h1 style="font-size:20px;margin:0 0 4px">Sign in to finish setup</h1>
      <p class="lede" style="margin-bottom:8px">Use the owner login we sent you.</p>
      <label>Email</label><input id="gi_email" type="email" autocomplete="username" placeholder="you@yourshop.com">
      <label>Password</label><input id="gi_pw" type="password" autocomplete="current-password" placeholder="Password">
      <button id="gi_go">Sign in</button>
      <div id="gi_err" class="err"></div>
    </div>
  </div>
  <div id="app" style="display:none"></div>
</div>

<script src="/platform/config.js"></script>
<script src="/platform/vendor/supabase-js.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>
<script src="/platform/vendor/supa-guard.js"></script>
<script src="/platform/vendor/boot-watchdog.js"></script>
<script>
(function(){
  var cfg = window.ANT_SUPABASE || {};
  var sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var SITE='https://tnapplianceexchange.net/platform/';

  function show(id){ ['loading','gate','app'].forEach(function(x){ var e=document.getElementById(x); if(e) e.style.display = (x===id)?'block':'none'; }); }

  // ---- sign-in gate ----
  function wireGate(){
    var go=document.getElementById('gi_go'), err=document.getElementById('gi_err');
    function submit(){
      var email=(document.getElementById('gi_email').value||'').trim().toLowerCase();
      var pw=document.getElementById('gi_pw').value||'';
      if(!email||!pw){ err.textContent='Enter your email and password.'; return; }
      go.disabled=true; go.textContent='Signing in…'; err.textContent='';
      sb.auth.signInWithPassword({email:email,password:pw}).then(function(r){
        go.disabled=false; go.textContent='Sign in';
        if(r.error){ err.textContent='That didn\'t work — check your email + password (or use the link we sent).'; return; }
        boot();
      }).catch(function(){ go.disabled=false; go.textContent='Sign in'; err.textContent='Network hiccup — try again.'; });
    }
    go.onclick=submit;
    document.getElementById('gi_pw').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
    show('gate');
  }

  // ---- the checklist ----
  // Each step: done()=bool from live tenant state, + an Ant explanation + an action.
  function stepsFor(state){
    var s=state.settings||{}, biz=s.business||{}, site=s.site||{}, phone=s.phone||{};
    var area=biz.area||site.area||biz.city||site.city||'';
    var hours=biz.hours||biz.hours_text||'';
    return [
      { key:'in', title:'You\'re signed in', done:true, opt:false,
        why:'This is your owner command center login. You made it.',
        tip:'Everything below fills itself in green as each piece goes live.' },
      { key:'shop', title:'Tell Ant about your shop', done: !!(hours && area), opt:false,
        why:'Your hours + service area — so Ann answers callers right and your board knows your territory.',
        tip:'Ann uses this to tell a 2am caller exactly when you open and whether you cover them.',
        act:[{t:'Set hours & area',u:SITE+'owner.html',pri:true}] },
      { key:'book', title:'Bring your book over', done: (state.jobs||0) > 25, opt:false,
        why:'Import your customers + job history from Workiz so your new board is full on day one. Nothing is deleted in Workiz — you keep it running until you\'re sure.',
        tip:'Grab your Workiz token (Workiz → Settings → API) — the import wizard walks you through the rest.',
        act:[{t:'Import my book',u:SITE+'import.html',pri:true}] },
      { key:'crew', title:'Get your crew their logins', done: (state.techs||0) >= 1, opt:false,
        why:'Add your techs + office so everyone has their own login — techs get the field app, office gets the board.',
        tip:'Reply to your setup text with your CSR\'s email + your techs\' names & cells and we\'ll create every login for you — or add them yourself here.',
        act:[{t:'Add my crew',u:SITE+'owner.html',pri:true}] },
      { key:'ann', title:'Turn on Ann — your 24/7 receptionist', done: !!(phone && phone.number), opt:false,
        why:'Ann answers every call day or night, knows who\'s calling and what they\'ve got going on, and books the day.',
        tip:'Ann gets smarter once your book is imported — she\'ll greet repeat customers by name.',
        act:[{t:'Turn on Ann',u:SITE+'onboard.html',pri:true}] },
      { key:'pay', title:'Get paid by card', done: !!state.payments, opt:true,
        why:'Connect your bank so customers can pay by card — the money lands straight in your account.',
        tip:'Optional, but it\'s the fastest way to close out a job on the spot.',
        act:[{t:'Set up card payments',u:SITE+'owner.html',pri:false}] }
    ];
  }

  function render(state){
    var name = state.name || 'your shop';
    document.getElementById('brandName').textContent = name;
    document.title = 'Get Started — ' + name;
    var steps = stepsFor(state);
    var core = steps.filter(function(x){ return !x.opt; });
    var doneCore = core.filter(function(x){ return x.done; }).length;
    var pct = Math.round(doneCore/core.length*100);
    var allCore = doneCore === core.length;

    var h = '';
    h += '<h1>'+ (allCore ? 'You\'re all set, ' : 'Welcome, ') + esc(name) + '! 🐜</h1>';
    h += '<p class="lede">'+ (allCore
        ? 'Every setup step is done — your shop is live on Ant. Anything below with an arrow you can still tweak anytime.'
        : 'Let\'s get your shop up and running. Knock these out in any order — Ant\'s with you the whole way.') +'</p>';

    h += '<div class="ant'+(allCore?' celebrate':'')+'"><span class="a">🐜</span><p>'+
      (allCore
        ? '<b>Nice work.</b> Ann\'s answering, your book\'s on the board, your crew\'s in. I\'ll keep everything running — just work your jobs.'
        : 'Hey — I\'m Ant, and I\'ll walk you through this. It\'s quick: about '+core.length+' steps. The ones marked <b>Send us</b> we finish for you the second you reply. Tap a green button to start any step.') +
      '</p></div>';

    h += '<div class="prog"><div class="bar"><i id="pbar"></i></div><div class="lab"><span>'+doneCore+' of '+core.length+' done</span><span>'+pct+'%</span></div></div>';

    h += '<div class="steps">';
    steps.forEach(function(x){
      h += '<div class="step'+(x.done?' done':'')+'">';
      h += '<div class="mk">'+(x.done?'✓':'○')+'</div>';
      h += '<div class="bd">';
      h += '<h3>'+esc(x.title)+ (x.done?'<span class="pill d">Done</span>':(x.opt?'<span class="pill opt">Optional</span>':'<span class="pill t">To do</span>')) +'</h3>';
      h += '<p class="why">'+esc(x.why)+'</p>';
      if(!x.done && x.tip) h += '<p class="tip"><b>🐜 Ant:</b> <span>'+esc(x.tip)+'</span></p>';
      if(!x.done && x.act){ h += '<div class="act">'; x.act.forEach(function(a){ h += '<a class="'+(a.pri?'pri':'sec')+'" href="'+esc(a.u)+'">'+esc(a.t)+' →</a>'; }); h += '</div>'; }
      else if(x.done && x.act){ h += '<div class="act">'; x.act.forEach(function(a){ h += '<a class="sec" href="'+esc(a.u)+'">Revisit</a>'; }); h += '</div>'; }
      h += '</div></div>';
    });
    h += '</div>';

    h += '<div class="help"><h3>🐜 Ant\'s got you</h3><p>Stuck on any step? Just reply to your welcome text and we\'ll finish it with you — screen-share, do it for you, whatever\'s easiest. You never have to figure this out alone.</p></div>';
    h += '<div class="foot">🐜 Powered by Ant · your data stays yours</div>';

    document.getElementById('app').innerHTML = h;
    show('app');
    setTimeout(function(){ var b=document.getElementById('pbar'); if(b) b.style.width=pct+'%'; }, 60);
    try{ if(window.bootOK) window.bootOK(); }catch(_){}
  }

  function boot(){
    show('loading');
    sb.from('company').select('id,name,settings,payments_enabled').limit(1).then(function(r){
      var co = (r.data && r.data[0]) || null;
      if(!co){ document.getElementById('loading').textContent='Couldn\'t load your shop — check your login.'; return; }
      var state = { name:co.name, settings:co.settings||{}, payments: !!co.payments_enabled, jobs:0, techs:0 };
      // counts are RLS-scoped to this shop — no company_id needed
      var pJobs = sb.from('job').select('id',{count:'exact',head:true}).then(function(x){ state.jobs = x.count||0; }).catch(function(){});
      var pTechs = sb.from('technician').select('id',{count:'exact',head:true}).eq('active',true).then(function(x){ state.techs = x.count||0; }).catch(function(){});
      Promise.all([pJobs,pTechs]).then(function(){ render(state); }).catch(function(){ render(state); });
    }).catch(function(){ document.getElementById('loading').textContent='Couldn\'t reach the server — reload to try again.'; });
  }

  sb.auth.getSession().then(function(r){
    if(r.data && r.data.session) boot(); else wireGate();
  }).catch(function(){ wireGate(); });
})();
</script>
</body></html>
