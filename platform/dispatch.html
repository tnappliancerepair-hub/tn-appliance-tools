<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatch</title>
<style>
  :root{ --bg:#f6f7f4; --panel:#fff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd; --brand:#3f8f24; --brand-ink:#fff; --chip:#eef2e8; --warn:#b45309; --bad:#b4472e; --shadow:0 1px 2px rgba(20,30,10,.06),0 4px 14px rgba(20,30,10,.05);
    --new:#6b7280; --scheduled:#2563eb; --in_progress:#b45309; --awaiting_parts:#7c3aed; --completed:#3f8f24; --canceled:#9ca3af; }
  @media(prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --brand:#5bb537; --chip:#20281a; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); } }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:11px 14px;z-index:6}
  .brand{font-weight:800} .sp{flex:1}
  header a,header button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 11px;font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none}
  .wrap{max-width:900px;margin:0 auto;padding:12px 12px 40px}
  /* week strip */
  .week{display:flex;align-items:stretch;gap:6px;margin-bottom:14px}
  .warrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;font-weight:800;cursor:pointer;display:flex;align-items:center}
  .days{display:flex;gap:6px;flex:1;overflow-x:auto}
  .day{flex:1;min-width:56px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;cursor:pointer}
  .day.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .day .dow{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} .day .dnum{font-size:17px;font-weight:800;line-height:1.1}
  .day .cnt{font-size:10.5px;color:var(--brand);font-weight:800;min-height:13px}
  .day.today .dnum{color:var(--brand)}
  /* calendar: availability above the name, click a day to see the schedule */
  .weeknav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
  .weeknav .wklabel{font-weight:800;font-size:14px}
  .calwrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .calcol{flex:0 0 auto;min-width:78px;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .calcol.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .calhd{text-align:center;padding:7px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
  .calhd .dow{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} .calhd .dnum{font-size:16px;font-weight:800;line-height:1.1}
  .calhd.today .dnum{color:var(--brand)}
  .acell{text-align:center;padding:6px 4px;border-top:1px solid var(--line)} .acell:first-of-type{border-top:0}
  .acell .avail{font-size:11px;font-weight:800} .acell .aname{font-size:11px;color:var(--muted)}
  .acell.open .avail{color:var(--brand)} .acell.low .avail{color:var(--warn)} .acell.full .avail{color:var(--bad)}
  /* month grid */
  .viewtoggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .viewtoggle button{background:var(--panel);border:0;padding:6px 13px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted)}
  .viewtoggle button.on{background:var(--brand);color:var(--brand-ink)}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .mdow{text-align:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:800;padding:2px 0}
  .mcell{background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:56px;padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .mcell.off{opacity:.38}
  .mcell.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .mcell .mnum{font-size:13px;font-weight:800;line-height:1}
  .mcell.today .mnum{color:var(--brand)}
  .mcell .mld{margin-top:auto;font-size:10.5px;font-weight:800}
  .mcell .mld.open{color:var(--brand)} .mcell .mld.low{color:var(--warn)} .mcell .mld.full{color:var(--bad)}
  /* unscheduled */
  .sec-h{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
  .tray{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .ujob{flex:0 0 auto;max-width:230px;background:var(--panel);border:1px solid var(--warn);border-radius:11px;padding:9px 11px;cursor:pointer;box-shadow:var(--shadow)}
  .ujob .u1{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .ujob .u2{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tray-empty{color:var(--muted);font-size:13px;padding:4px 2px}
  /* tech lanes */
  .techs{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .lane{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
  .lane-h{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}
  .lane-h .tn{font-weight:800} .lane-h .load{margin-left:auto;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .lane-h .load.busy{color:var(--warn)} .lane-h .load.max{color:var(--bad)}
  .stop{display:flex;align-items:center;gap:9px;padding:10px 13px;border-top:1px solid var(--line);cursor:pointer} .stop:first-child{border-top:0}
  .stop .pill{width:9px;height:9px;border-radius:50%;flex:none}
  .stop .s1{font-weight:600;font-size:14px} .stop .s2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stop .info{flex:1;min-width:0}
  .lane-empty{padding:12px 13px;color:var(--muted);font-size:13px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:18px 18px 26px;box-shadow:var(--shadow)}
  .sheet h3{margin:0 0 3px;font-size:16px} .sheet .msub{color:var(--muted);font-size:13px;margin-bottom:12px}
  label{display:block;font-weight:700;font-size:12.5px;margin:10px 0 4px}
  select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .srow{display:flex;gap:8px;margin-top:14px} .srow button{flex:1;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .srow .primary{background:var(--brand);color:var(--brand-ink);border:none} .linkrow{margin-top:10px;display:flex;gap:14px;font-size:13px} .linkrow a,.linkrow button.link{color:var(--brand);background:none;border:none;padding:0;font-weight:700;cursor:pointer}
  .gate{max-width:340px;margin:64px auto;padding:0 20px;text-align:center} .gate input{margin-bottom:8px;text-align:left} .gate .primary{width:100%;background:var(--brand);color:var(--brand-ink);border:none;border-radius:10px;padding:12px;font-weight:800;cursor:pointer} .err{color:var(--bad);font-size:13px;margin-top:8px}
</style></head>
<body>
<div id="app"></div>
<script src="/platform/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var app=document.getElementById('app');
  var cfg=window.ANT_SUPABASE||{}; var sb=null, company=null, techs=[], jobs=[];
  var sel=startOfWeek(new Date()); var selDay=isoDay(new Date());
  var view='week'; var monthAnchor=firstOfMonth(new Date());
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  function fullName(c){ return c?[c.first_name,c.last_name].filter(Boolean).join(' ').trim():''; }
  var SC={ new:'var(--new)',scheduled:'var(--scheduled)',in_progress:'var(--in_progress)',awaiting_parts:'var(--awaiting_parts)',completed:'var(--completed)',canceled:'var(--canceled)' };
  function isoDay(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
  function startOfWeek(d){ var x=new Date(d); var day=x.getDay(); x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; } // Sunday start
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function firstOfMonth(d){ var x=new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x; }
  function addMonths(d,n){ var x=new Date(d); x.setMonth(x.getMonth()+n); return x; }

  if(!cfg.url||!cfg.anonKey){ app.innerHTML='<div class="gate"><h1>🐜 Not connected</h1></div>'; return; }
  sb=window.supabase.createClient(cfg.url,cfg.anonKey);

  function renderSignIn(msg){
    app.innerHTML='<div class="gate"><h1>🐜 Dispatch</h1><p>Sign in to your shop.</p>'+
      '<label>Email</label><input id="em" type="email" autocomplete="username">'+
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password">'+
      '<button class="primary" id="go">Sign in</button><div class="err" id="err">'+esc(msg||'')+'</div></div>';
    var go=document.getElementById('go');
    function submit(){ var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value; if(!em||!pw){document.getElementById('err').textContent='Enter email and password.';return;} go.disabled=true; go.textContent='Signing in…'; sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){ if(r.error) renderSignIn(r.error.message); else boot(); }); }
    go.onclick=submit; document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  }

  function needsDispatch(j){ return (!j.scheduled_day || !j.technician_id) && j.status!=='completed' && j.status!=='canceled'; }

  function render(){
    var days=[]; for(var i=0;i<7;i++) days.push(isoDay(addDays(sel,i)));
    var today=isoDay(new Date());
    var dow=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    var CAP=6; // stops/day a tech can take (default; per-tech capacity is a later setting)
    var crewCap=CAP*Math.max(techs.length,1);
    function bookedOn(techId,d){ var n=0; jobs.forEach(function(j){ if(j.technician_id===techId&&j.scheduled_day===d&&j.status!=='completed'&&j.status!=='canceled') n++; }); return n; }
    function bookedAll(d){ var n=0; jobs.forEach(function(j){ if(j.scheduled_day===d&&j.technician_id&&j.status!=='completed'&&j.status!=='canceled') n++; }); return n; }

    var toggleHtml='<div class="viewtoggle"><button data-view="week" class="'+(view==='week'?'on':'')+'">Week</button><button data-view="month" class="'+(view==='month'?'on':'')+'">Month</button></div>';
    var navHtml, calBlock;
    if(view==='week'){
      // Week: each day column shows every tech's AVAILABILITY (open slots) above the name.
      var calHtml=days.map(function(d){ var dt=new Date(d+'T12:00:00');
        var cells=techs.length ? techs.map(function(t){ var open=Math.max(0,CAP-bookedOn(t.id,d)); var cls=open===0?'full':(open<=2?'low':'open');
          return '<div class="acell '+cls+'"><div class="avail">'+(open===0?'Full':open+' open')+'</div><div class="aname">'+esc((t.name||'Tech').split(' ')[0])+'</div></div>'; }).join('')
          : '<div class="acell"><div class="aname" style="font-weight:600">—</div></div>';
        return '<div class="calcol'+(d===selDay?' on':'')+'"><div class="calhd'+(d===today?' today':'')+'" data-day="'+d+'"><div class="dow">'+dow[dt.getDay()]+'</div><div class="dnum">'+dt.getDate()+'</div></div>'+cells+'</div>'; }).join('');
      var wkLabel=new Date(days[0]+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+new Date(days[6]+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
      navHtml='<button class="warrow" id="wprev">‹</button><span class="wklabel">'+esc(wkLabel)+'</span><button class="warrow" id="wnext">›</button>'+toggleHtml;
      calBlock='<div class="calwrap">'+calHtml+'</div>';
    } else {
      // Month: full grid, tap any future day (e.g. the day parts land) to book onto it.
      var gStart=startOfWeek(monthAnchor); var mm=monthAnchor.getMonth();
      var dowH=dow.map(function(x){ return '<div class="mdow">'+x+'</div>'; }).join('');
      var cellsH=''; for(var k=0;k<42;k++){ var cd=addDays(gStart,k); var ci=isoDay(cd);
        var b=bookedAll(ci); var open=Math.max(0,crewCap-b);
        var ldTxt = b>0 ? (open===0?'Full':b+' bk') : '';
        var ldCls = b===0?'open':(open===0?'full':(open<=Math.ceil(crewCap*0.34)?'low':'open'));
        var off=cd.getMonth()!==mm?' off':''; var tdy=ci===today?' today':''; var on=ci===selDay?' on':'';
        cellsH+='<div class="mcell'+off+tdy+on+'" data-day="'+ci+'"><div class="mnum">'+cd.getDate()+'</div><div class="mld '+ldCls+'">'+ldTxt+'</div></div>'; }
      navHtml='<button class="warrow" id="mprev">‹</button><span class="wklabel">'+esc(monthAnchor.toLocaleDateString(undefined,{month:'long',year:'numeric'}))+'</span><button class="warrow" id="mnext">›</button>'+toggleHtml;
      calBlock='<div class="mgrid">'+dowH+cellsH+'</div>';
    }

    var uns=jobs.filter(needsDispatch);
    var unsHtml=uns.length ? uns.map(function(j){ var tag=j.status==='awaiting_parts'?'<div class="u2" style="color:var(--awaiting_parts);font-weight:800">📦 awaiting parts</div>':''; return '<div class="ujob" data-job="'+j.id+'"><div class="u1">'+esc(fullName(j.customer)||'Customer')+'</div><div class="u2">'+esc((j.unit&&j.unit.label)||j.problem||'')+'</div>'+tag+'</div>'; }).join('') : '<div class="tray-empty">Nothing waiting — every job has a tech and a day. ✅</div>';

    var lanes=techs.map(function(t){
      var mine=jobs.filter(function(j){ return j.technician_id===t.id && j.scheduled_day===selDay && j.status!=='completed' && j.status!=='canceled'; });
      var loadCls=mine.length>=7?'max':(mine.length>=5?'busy':'');
      var stops=mine.length ? mine.map(function(j){ return '<div class="stop" data-job="'+j.id+'"><span class="pill" style="background:'+(SC[j.status]||'var(--new)')+'"></span><div class="info"><div class="s1">'+esc(fullName(j.customer)||'Customer')+'</div><div class="s2">'+esc((j.unit&&j.unit.label)||j.problem||'')+'</div></div></div>'; }).join('') : '<div class="lane-empty">No stops this day — drop one from Unscheduled.</div>';
      return '<div class="lane"><div class="lane-h"><span class="tn">'+esc(t.name||'Tech')+'</span><span class="load '+loadCls+'">'+mine.length+' stop'+(mine.length===1?'':'s')+'</span></div>'+stops+'</div>';
    }).join('') || '<div class="tray-empty">No techs yet — add your crew on the onboarding page.</div>';

    var selLabel=new Date(selDay+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
    app.innerHTML=
      '<header><span class="brand">🐜 Dispatch</span><span class="sp"></span><a href="/platform/office-board.html">Board</a><button id="refresh">Refresh</button><button id="out">Sign out</button></header>'+
      '<div class="wrap">'+
        '<div class="weeknav">'+navHtml+'</div>'+
        calBlock+
        '<div class="sec-h">🚨 Unscheduled — tap to assign</div><div class="tray">'+unsHtml+'</div>'+
        '<div class="sec-h">📋 '+esc(selLabel)+' — full schedule</div><div class="techs">'+lanes+'</div>'+
      '</div>';

    document.getElementById('out').onclick=function(){ sb.auth.signOut().then(renderSignIn); };
    document.getElementById('refresh').onclick=load;
    Array.prototype.forEach.call(document.querySelectorAll('.viewtoggle button[data-view]'),function(el){ el.onclick=function(){ view=el.getAttribute('data-view'); if(view==='month') monthAnchor=firstOfMonth(new Date(selDay+'T12:00:00')); render(); }; });
    if(view==='week'){
      document.getElementById('wprev').onclick=function(){ sel=addDays(sel,-7); render(); };
      document.getElementById('wnext').onclick=function(){ sel=addDays(sel,7); render(); };
      Array.prototype.forEach.call(document.querySelectorAll('.calhd[data-day]'),function(el){ el.onclick=function(){ selDay=el.getAttribute('data-day'); render(); }; });
    } else {
      document.getElementById('mprev').onclick=function(){ monthAnchor=addMonths(monthAnchor,-1); render(); };
      document.getElementById('mnext').onclick=function(){ monthAnchor=addMonths(monthAnchor,1); render(); };
      Array.prototype.forEach.call(document.querySelectorAll('.mcell[data-day]'),function(el){ el.onclick=function(){ selDay=el.getAttribute('data-day'); sel=startOfWeek(new Date(selDay+'T12:00:00')); render(); var t=document.querySelector('.techs'); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); }; });
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-job]'),function(el){ el.onclick=function(){ var j=jobs.filter(function(x){return x.id===el.getAttribute('data-job');})[0]; if(j) openAssign(j); }; });
  }

  function openAssign(job){
    var ov=document.createElement('div'); ov.className='ov';
    var techOpts='<option value="">— unassigned —</option>'+techs.map(function(t){ return '<option value="'+t.id+'"'+(t.id===job.technician_id?' selected':'')+'>'+esc(t.name||'Tech')+'</option>'; }).join('');
    ov.innerHTML='<div class="sheet"><h3>'+esc(fullName(job.customer)||'Customer')+'</h3><div class="msub">'+esc((job.unit&&job.unit.label)||'')+(job.problem?' · '+esc(job.problem):'')+'</div>'+
      '<label>Tech</label><select id="a-tech">'+techOpts+'</select>'+
      '<label>Day</label><input id="a-day" type="date" value="'+esc(job.scheduled_day||selDay)+'">'+
      '<div class="srow"><button id="a-cancel">Cancel</button><button class="primary" id="a-save">Save</button></div>'+
      '<div class="linkrow"><button class="link" id="a-unsched">Unschedule</button><a href="/platform/office-board.html?job='+encodeURIComponent(job.id)+'">Open full job →</a></div>'+
      '<div class="err" id="a-err"></div></div>';
    document.body.appendChild(ov);
    var close=function(){ try{document.body.removeChild(ov);}catch(e){} }; ov.onclick=function(e){ if(e.target===ov) close(); };
    document.getElementById('a-cancel').onclick=close;
    document.getElementById('a-save').onclick=function(){
      var tech=document.getElementById('a-tech').value||null; var day=document.getElementById('a-day').value||null;
      var btn=this; btn.disabled=true; btn.textContent='Saving…';
      var patch={ technician_id:tech, scheduled_day:day };
      if(day && (job.status==='new'||!job.status)) patch.status='scheduled';
      sb.from('job').update(patch).eq('id',job.id).then(function(r){ if(r.error){ btn.disabled=false; btn.textContent='Save'; document.getElementById('a-err').textContent=r.error.message; return; } if(day) selDay=day; close(); load(); });
    };
    document.getElementById('a-unsched').onclick=function(){ var patch={scheduled_day:null}; if(job.status==='scheduled') patch.status='new'; sb.from('job').update(patch).eq('id',job.id).then(function(r){ if(!r.error){ close(); load(); } }); };
  }

  function load(){
    sb.rpc('company_roster').then(function(tr){
      techs=((tr.data)||[]).filter(function(t){ return t.active!==false; });
      sb.from('job').select('id,status,problem,scheduled_day,technician_id,customer_id,customer:customer_id(first_name,last_name),unit:unit_id(label)').not('status','in','(completed,canceled)').limit(2000).then(function(jr){
        jobs=(jr.data)||[]; render();
      });
    });
  }
  function boot(){ sb.from('company').select('id,name').limit(1).then(function(r){ if(!r.error&&r.data&&r.data[0]) company=r.data[0]; load(); }); }
  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) boot(); else renderSignIn(); });
})();
</script>
</body></html>
