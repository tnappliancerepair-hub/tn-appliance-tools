<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatch</title>
<style>
  :root{ --bg:#f6f7f4; --panel:#fff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd; --brand:#3f8f24; --brand-ink:#fff; --chip:#eef2e8; --warn:#b45309; --bad:#b4472e; --shadow:0 1px 2px rgba(20,30,10,.06),0 4px 14px rgba(20,30,10,.05);
    --new:#6b7280; --scheduled:#2563eb; --in_progress:#b45309; --awaiting_parts:#7c3aed; --completed:#3f8f24; --canceled:#9ca3af; }
  @media(prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0f130c; --panel:#171c12; --ink:#eef2e6; --muted:#9aa38c; --line:#2a3220; --brand:#5bb537; --chip:#20281a; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); } }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:11px 14px;z-index:6}
  .brand{font-weight:800} .sp{flex:1}
  header a,header button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 11px;font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none}
  .wrap{max-width:900px;margin:0 auto;padding:12px 12px 40px}
  /* week strip */
  .week{display:flex;align-items:stretch;gap:6px;margin-bottom:14px}
  .warrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;font-weight:800;cursor:pointer;display:flex;align-items:center}
  .days{display:flex;gap:6px;flex:1;overflow-x:auto}
  .day{flex:1;min-width:56px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;cursor:pointer}
  .day.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .day .dow{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} .day .dnum{font-size:17px;font-weight:800;line-height:1.1}
  .day .cnt{font-size:10.5px;color:var(--brand);font-weight:800;min-height:13px}
  .day.today .dnum{color:var(--brand)}
  /* calendar: availability above the name, click a day to see the schedule */
  .weeknav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
  .weeknav .wklabel{font-weight:800;font-size:14px}
  .calwrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .calcol{flex:0 0 auto;min-width:78px;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .calcol.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .calhd{text-align:center;padding:7px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
  .calhd .dow{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} .calhd .dnum{font-size:16px;font-weight:800;line-height:1.1}
  .calhd.today .dnum{color:var(--brand)}
  .acell{text-align:center;padding:6px 4px;border-top:1px solid var(--line)} .acell:first-of-type{border-top:0}
  .acell .avail{font-size:11px;font-weight:800} .acell .aname{font-size:11px;color:var(--muted)}
  .acell.open .avail{color:var(--brand)} .acell.low .avail{color:var(--warn)} .acell.full .avail{color:var(--bad)}
  .acell.offday{background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--chip) 5px,var(--chip) 10px)} .acell.offday .avail{color:var(--muted)}
  .offtog{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .offtog.on{background:var(--chip);color:var(--ink);border-color:transparent}
  .lane-h .offtog + .load{margin-left:8px}
  .laneoff{opacity:.72}
  /* month grid */
  .viewtoggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .viewtoggle button{background:var(--panel);border:0;padding:6px 13px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted)}
  .viewtoggle button.on{background:var(--brand);color:var(--brand-ink)}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .mdow{text-align:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:800;padding:2px 0}
  .mcell{background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:56px;padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .mcell.off{opacity:.38}
  .mcell.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .mcell .mnum{font-size:13px;font-weight:800;line-height:1}
  .mcell.today .mnum{color:var(--brand)}
  .mcell .mld{margin-top:auto;font-size:10.5px;font-weight:800}
  .mcell .mld.open{color:var(--brand)} .mcell .mld.low{color:var(--warn)} .mcell .mld.full{color:var(--bad)}
  /* unscheduled */
  .sec-h{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
  .tray{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .ujob{flex:0 0 auto;max-width:230px;background:var(--panel);border:1px solid var(--warn);border-radius:11px;padding:9px 11px;cursor:pointer;box-shadow:var(--shadow)}
  .ujob .u1{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .ujob .u2{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tray-empty{color:var(--muted);font-size:13px;padding:4px 2px}
  .ujob .ucov{margin-top:4px;font-size:11.5px;font-weight:700;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .ujob .ucov.none{color:var(--muted);font-weight:600}
  .ujob .usug{margin-top:5px;font-size:11.5px;font-weight:800;color:var(--brand);background:var(--chip);border-radius:7px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .suggest{display:flex;align-items:center;gap:10px;margin:8px 0 4px;padding:10px 12px;border:1px solid var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent);border-radius:11px}
  .suggest .sg-l{flex:1;min-width:0} .suggest .sg-t{font-size:11px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.03em}
  .suggest .sg-b{font-size:15px;font-weight:800;margin-top:1px} .suggest .sg-w{font-size:11.5px;color:var(--muted);margin-top:1px}
  .suggest .sg-use{flex:none;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:13px;border-radius:9px;padding:8px 12px;cursor:pointer}
  /* tech lanes */
  .techs{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .lane{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
  .lane-h{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}
  .lane-h .tn{font-weight:800} .lane-h .load{margin-left:auto;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .lane-h .load.busy{color:var(--warn)} .lane-h .load.max{color:var(--bad)}
  .stop{display:flex;align-items:center;gap:9px;padding:10px 13px;border-top:1px solid var(--line);cursor:pointer} .stop:first-child{border-top:0}
  .stop .pill{width:9px;height:9px;border-radius:50%;flex:none}
  .stop .rn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .routetag{font-size:11px;font-weight:800;color:var(--brand);background:var(--chip);padding:2px 8px;border-radius:999px;margin-left:8px}
  .stop .s1{font-weight:600;font-size:14px} .stop .s2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stop .info{flex:1;min-width:0}
  .lane-empty{padding:12px 13px;color:var(--muted);font-size:13px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:18px 18px 26px;box-shadow:var(--shadow)}
  .sheet h3{margin:0 0 3px;font-size:16px} .sheet .msub{color:var(--muted);font-size:13px;margin-bottom:12px}
  label{display:block;font-weight:700;font-size:12.5px;margin:10px 0 4px}
  select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .srow{display:flex;gap:8px;margin-top:14px} .srow button{flex:1;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .srow .primary{background:var(--brand);color:var(--brand-ink);border:none} .linkrow{margin-top:10px;display:flex;gap:14px;font-size:13px} .linkrow a,.linkrow button.link{color:var(--brand);background:none;border:none;padding:0;font-weight:700;cursor:pointer}
  .gate{max-width:340px;margin:64px auto;padding:0 20px;text-align:center} .gate input{margin-bottom:8px;text-align:left} .gate .primary{width:100%;background:var(--brand);color:var(--brand-ink);border:none;border-radius:10px;padding:12px;font-weight:800;cursor:pointer} .err{color:var(--bad);font-size:13px;margin-top:8px}
  /* Ant partner dock */
  .antfab{position:fixed;right:18px;bottom:18px;z-index:60;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;font-size:26px;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent);display:grid;place-items:center}
  .antpanel{position:fixed;right:18px;bottom:84px;z-index:60;width:min(380px,calc(100vw - 36px));max-height:min(72vh,640px);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden}
  .antpanel.open{display:flex}
  .aph{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--panel)),var(--panel))}
  .aph .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#e0a63e);display:grid;place-items:center;font-size:18px;flex:none}
  .aph h4{margin:0;font-size:14px;font-weight:800}.aph p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
  .aph .x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .leash2{display:flex;gap:4px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .leash2 button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-weight:700;font-size:11.5px;padding:6px;border-radius:8px;cursor:pointer}
  .leash2 button.on{background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;border-color:transparent}
  .athread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;min-height:150px}
  .abub{max-width:88%;padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.45}
  .abub.ant{align-self:flex-start;background:var(--chip);border-bottom-left-radius:4px}
  .abub.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;border-bottom-right-radius:4px}
  .abub.ant b,.abub.ant strong{color:var(--brand)}
  .aprop{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}
  .aprop button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
  .aprop button.go{background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;border-color:transparent}
  .atype{align-self:flex-start;display:flex;gap:4px;padding:11px 13px;background:var(--chip);border-radius:13px;border-bottom-left-radius:4px}
  .atype span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ab 1.2s infinite}.atype span:nth-child(2){animation-delay:.2s}.atype span:nth-child(3){animation-delay:.4s}
  @keyframes ab{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .aquick{display:flex;gap:6px;flex-wrap:wrap;padding:2px 12px 10px}
  .aquick button{border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer}
  .acomp{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line)}
  .acomp input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:10px 12px;font-size:13px}
  .acomp .s{width:40px;height:40px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;font-size:16px;font-weight:800;cursor:pointer;flex:none}
  /* unscheduled map (ported from legacy office scheduler) */
  .uns-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 2px 8px}
  .regtog{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .regtog button{background:var(--panel);border:0;padding:6px 13px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted)}
  .regtog button.on{background:var(--brand);color:var(--brand-ink)}
  #schedmap{height:300px;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 6px;background:var(--chip)}
  #schedmap .leaflet-container{background:var(--chip)}
  .mapnote{font-size:11.5px;color:var(--muted);margin:0 2px 8px}
  .schedpin-wrap{background:transparent;border:0}
  .schedpin{width:30px;height:30px;border-radius:50%;background:#f97316;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .schedpin.approx{background:#fb923c;opacity:.85;border-style:dashed}
  .unum{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#f97316;color:#fff;font-size:11px;font-weight:800;margin-right:5px;vertical-align:middle}

<body>
<div id="app"></div>
<script src="/platform/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var app=document.getElementById('app');
  var cfg=window.ANT_SUPABASE||{}; var sb=null, company=null, techs=[], jobs=[], timeOff=[];
  var offSet={};                                   // "techId|YYYY-MM-DD" -> true (day-off / PTO)
  function offOn(techId,d){ return !!offSet[techId+'|'+d]; }
  // Service zones — a tech's service_area is a comma list of ZIPs / 3-digit prefixes. A tech with
  // no area covers everywhere. A job's ZIP matches when it equals, or starts with, a listed entry.
  function areaList(t){ return String((t&&t.service_area)||'').split(',').map(function(s){return s.trim();}).filter(Boolean); }
  function coversZip(t, zip){ var a=areaList(t); if(!a.length) return true; zip=String(zip||'').trim(); if(!zip) return true; return a.some(function(p){ return zip===p || zip.indexOf(p)===0; }); }
  function jobZip(j){ return (j&&j.customer&&j.customer.zip)||''; }
  function capOf(t){ var m=t&&t.max_stops; return (m!=null&&m>0)?m:6; }   // per-tech stops/day (owner-set; default 6)
  function bookedOn(techId,d){ var n=0; jobs.forEach(function(j){ if(j.technician_id===techId&&j.scheduled_day===d&&j.status!=='completed'&&j.status!=='canceled') n++; }); return n; }
  // 🐜 Best tech + day — the scheduling capstone. Scores every (tech, next-10-days) pair on the
  // inputs the office already set: covers-the-ZIP (zones) ≫ everything, then not-off (PTO), has
  // open capacity (stops/day), route-fit (already routed near this ZIP that day → fill the truck),
  // soonest, mild weekend nudge. Returns the single best pair (or null if nobody's free). Pure
  // client-side over already-loaded data — no new query.
  function suggestSlot(job){
    var zip=jobZip(job);
    // candidates = anyone who SERVES this ZIP (an explicit area match OR a tech with no area set,
    // who covers everywhere). If a shop's areas all exclude this ZIP, fall back to the whole crew.
    var cands=techs.filter(function(t){ return coversZip(t, zip); });
    if(!cands.length) cands=techs;
    if(!cands.length) return null;
    var start=new Date(), HORIZON=10, best=null, jz=zip5(zip);
    for(var i=0;i<HORIZON;i++){
      var d=isoDay(addDays(start,i)); var dow=new Date(d+'T12:00:00').getDay(); var weekend=(dow===0||dow===6);
      for(var k=0;k<cands.length;k++){
        var t=cands[k];
        if(offOn(t.id,d)) continue;                    // day off / PTO
        var booked=bookedOn(t.id,d); var cap=capOf(t);
        if(booked>=cap) continue;                      // full that day
        var covers=coversZip(t,zip);
        var routeBonus=0, near=null;                   // route-fit: nearest existing same-day stop by ZIP
        if(jz!=null){
          var md=Infinity;
          jobs.forEach(function(j){ if(j.technician_id===t.id&&j.scheduled_day===d&&j.status!=='completed'&&j.status!=='canceled'){ var z=zip5(jobZip(j)); if(z!=null){ var diff=Math.abs(z-jz); if(diff<md) md=diff; } } });
          if(md<Infinity){ routeBonus=Math.max(0,120-md); near=md; }
        }
        var score=(covers?2000:0)+(HORIZON-i)*8+routeBonus-(weekend?25:0);
        if(!best||score>best.score) best={ tech:t, day:d, score:score, covers:covers, booked:booked, cap:cap, near:near, i:i };
      }
    }
    return best;
  }
  function suggestReason(b, zip){
    var bits=[];
    if(b.covers && zip) bits.push('covers '+zip);
    if(b.near!=null && b.near<=60) bits.push('already routed nearby');
    else bits.push(b.i<=1?'soonest opening':'open day');
    var open=b.cap-b.booked; bits.push(open+' slot'+(open===1?'':'s')+' left');
    return bits.join(' · ');
  }
  function coveringTechs(zip){ return techs.filter(function(t){ return areaList(t).length && coversZip(t,zip); }); }
  // 🧭 Suggested route order — nearest-neighbor by 5-digit ZIP proximity. No geocoding: it clusters
  // same-area stops together + sweeps low→high so the tech isn't crossing town twice. A heuristic,
  // labelled as "suggested"; the office can still work the lane in any order. Deterministic, so the
  // tech app + the board agree on the numbers.
  function zip5(z){ var m=String(z||'').match(/\d{5}/); return m?parseInt(m[0],10):null; }
  function routeOrder(stops){
    var pool=stops.slice(); if(pool.length<3) return pool;   // 1–2 stops: order is moot
    var start=null; pool.forEach(function(s){ var z=zip5(jobZip(s)); if(z!=null&&(start==null||z<start)) start=z; });
    var out=[], cur=start;
    while(pool.length){ var bi=0,bd=Infinity; for(var i=0;i<pool.length;i++){ var z=zip5(jobZip(pool[i])); var d=(cur==null)?0:(z==null?1e12:Math.abs(z-cur)); if(d<bd){bd=d;bi=i;} }
      var nx=pool.splice(bi,1)[0]; out.push(nx); var nz=zip5(jobZip(nx)); if(nz!=null) cur=nz; }
    return out;
  }
  // ── MAP of the UNSCHEDULED jobs (ported from the legacy office scheduler,
  // new-scheduling.html). Numbered orange pins, region toggle (Middle TN / Louisiana),
  // geocoded via Nominatim with the shared tn_geo_v3 localStorage cache (SAME key as the
  // legacy map, so resolved coords carry over). Everything here is ADDITIVE — a Leaflet
  // or geocode failure only leaves the tray without pins; it never breaks the board.
  var region='';                                   // 'TN' | 'LA'; defaults to the busier region on first render
  var LA_CITIES={'new orleans':1,'metairie':1,'kenner':1,'gretna':1,'chalmette':1,'harvey':1,'marrero':1,'westwego':1,'slidell':1,'hammond':1,'covington':1,'mandeville':1,'ponchatoula':1,'baton rouge':1,'denham springs':1,'walker':1,'laplace':1};
  function jobRegion(j){ var c=(j&&j.customer)||{}; var st=String(c.state||'').trim().toUpperCase(); if(st==='LA'||st==='LOUISIANA') return 'LA'; if(st==='TN'||st==='TENNESSEE') return 'TN'; if(!st){ var city=String(c.city||'').trim().toLowerCase(); if(LA_CITIES[city]) return 'LA'; } return 'TN'; }
  function defaultRegion(list){ var tn=0,la=0; (list||[]).forEach(function(j){ if(jobRegion(j)==='LA') la++; else tn++; }); return la>tn?'LA':'TN'; }
  var GEO_PREFIX='tn_geo_v3:', GEO_TTL=30*24*60*60*1000, _lastGeo=0;
  var US_STATES={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming'};

  function ensureLeaflet(){ return new Promise(function(res,rej){

  // Tiered geocode: real street → ZIP centroid → city+state. Spell the state out so a bare
  // "LA" isn't read as Los Angeles. Skip placeholder streets ("1"/""). Cached in localStorage.
  async function schedGeocode(j){
    var c=(j&&j.customer)||{};
    var street=String(c.address||'').trim();
    var city=String(c.city||'').trim();
    var st=stateFull(c.state);
    var zip=String(c.zip||'').replace(/\D/g,'').slice(0,5);
    var key=GEO_PREFIX+geoHash([street,city,st,zip].join('|'));
    if(_schedCoords[key]) return _schedCoords[key];
    try{ var raw=localStorage.getItem(key); if(raw){ var p=JSON.parse(raw); if(p&&(Date.now()-p.ts)<GEO_TTL){ _schedCoords[key]={lat:p.lat,lng:p.lng,approx:!!p.approx}; return _schedCoords[key]; } } }catch(e){}
    var realStreet=street&&/\d/.test(street)&&/[a-z]/i.test(street);
    async function nom(params){
      var wait=Math.max(0,(_lastGeo+1100)-Date.now()); _lastGeo=Date.now()+wait;   // Nominatim: ≤1 req/sec
      await new Promise(function(r){ setTimeout(r,wait); });
      try{ var res=await fetch('https://nominatim.openstreetmap.org/search?'+params.toString()); var d=await res.json(); if(Array.isArray(d)&&d.length){ var lat=parseFloat(d[0].lat),lng=parseFloat(d[0].lon); if(isFinite(lat)&&isFinite(lng)) return {lat:lat,lng:lng}; } }catch(e){} return null;
    }
    var hit=null, approx=false;
    if(realStreet){ var p1=new URLSearchParams({format:'json',limit:'1',countrycodes:'us',street:street}); if(city)p1.set('city',city); if(st)p1.set('state',st); if(zip)p1.set('postalcode',zip); hit=await nom(p1); }
    if(!hit&&zip){ hit=await nom(new URLSearchParams({format:'json',limit:'1',countrycodes:'us',postalcode:zip})); if(hit) approx=true; }
    if(!hit&&city&&st){ hit=await nom(new URLSearchParams({format:'json',limit:'1',countrycodes:'us',city:city,state:st})); if(hit) approx=true; }
    if(!hit) return null;
    var out={lat:hit.lat,lng:hit.lng,approx:approx}; _schedCoords[key]=out;
    try{ localStorage.setItem(key,JSON.stringify({lat:out.lat,lng:out.lng,approx:approx,ts:Date.now()})); }catch(e){}
    return out;
  }
  // Build the map into #schedmap for the region's unscheduled jobs, numbered 1..N in tray order.
  async function mountSchedMap(list){
    var myGen=++_schedGen;                          // supersede any in-flight loop (region switch / re-render)
    if(!document.getElementById('schedmap')) return;
    try{ await ensureLeaflet(); }catch(e){ if(_schedGen===myGen){ var nn=document.querySelector('.mapnote'); if(nn) nn.textContent='⚠ map failed to load — the tray below still works.'; } return; }
    var el=document.getElementById('schedmap'); if(!el||!window.L||_schedGen!==myGen) return;
    if(_schedMap){ try{ _schedMap.remove(); }catch(e){} _schedMap=null; }
    var map; try{ map=L.map(el,{scrollWheelZoom:false}).setView([35.9,-87.5],6); }catch(e){ return; }
    _schedMap=map;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
    var bounds=[], seen={};
    for(var i=0;i<list.length;i++){
      if(_schedGen!==myGen) return;
      var j=list[i]; var g=await schedGeocode(j);
      if(_schedGen!==myGen) return;
      if(!g) continue;
      var plat=g.lat, plng=g.lng;
      var sk=plat.toFixed(4)+','+plng.toFixed(4); var dup=(seen[sk]=(seen[sk]||0)); seen[sk]++;
      if(dup>0){ var ang=dup*(Math.PI/4); var rad=0.00045*(1+Math.floor(dup/8)); plat=g.lat+rad*Math.sin(ang); plng=g.lng+rad*Math.cos(ang); }   // fan out stacked stops
      var icon=L.divIcon({className:'schedpin-wrap',html:'<div class="schedpin'+(g.approx?' approx':'')+'">'+(i+1)+'</div>',iconSize:[30,30],iconAnchor:[15,15]});
      var mk=L.marker([plat,plng],{icon:icon}).addTo(map);
      (function(job){ mk.on('click',function(){ openAssign(job); }); })(j);   // tap a pin = same as tapping its tray card
      bounds.push([plat,plng]);
    }
    if(_schedGen!==myGen) return;
    if(bounds.length>=2){ try{ map.fitBounds(bounds,{padding:[30,30],maxZoom:12}); }catch(e){} }
    else if(bounds.length===1){ try{ map.setView(bounds[0],11); }catch(e){} }
  }

    sb.rpc('company_roster').then(function(tr){
      techs=((tr.data)||[]).filter(function(t){ return t.active!==false; });
      var jP=sb.from('job').select('id,status,problem,scheduled_day,technician_id,customer_id,customer:customer_id(first_name,last_name,zip,city,address,state),unit:unit_id(label)').not('status','in','(completed,canceled)').limit(2000);
      var oP=sb.from('tech_time_off').select('technician_id,day').gte('day',todayIso).limit(4000);
      Promise.all([jP,oP]).then(function(res){
        jobs=(res[0].data)||[];
        timeOff=(res[1]&&res[1].data)||[]; offSet={}; timeOff.forEach(function(o){ offSet[o.technician_id+'|'+o.day]=true; });
        render();
      });
    });
  }
  // Toggle a tech's day off (office action, right on the board). Insert = off, delete = working.
  function toggleOff(techId, day){
    if(offOn(techId,day)){
      sb.from('tech_time_off').delete().eq('technician_id',techId).eq('day',day).then(function(r){ if(r.error){ alert(r.error.message); return; } load(); });
    } else {
      sb.from('tech_time_off').insert({company_id:(company&&company.id), technician_id:techId, day:day}).then(function(r){ if(r.error){ alert(r.error.message); return; } load(); });
    }
  }
  function boot(){ sb.from('company').select('id,name').limit(1).then(function(r){ if(!r.error&&r.data&&r.data[0]) company=r.data[0]; load(); mountAntDock(); }); }

  // ---- Ant partner dock (dispatch/CSR): talks to platform-ant. As office role it can BOOK, MOVE,
  // and UNSCHEDULE jobs + toggle texts + set days off — all logged with an Undo in the owner_action
  // ledger. Mounted on <body> so it survives board re-renders.
  var antHist=[], antMode='act';
  function sessTok(){ return sb.auth.getSession().then(function(s){ return (s&&s.data&&s.data.session&&s.data.session.access_token)||''; }); }
  function antAsk(message,mode){ return sessTok().then(function(tok){ return fetch('/.netlify/functions/platform-ant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:tok,message:message,mode:mode,history:antHist.slice(-8)})}).then(function(r){return r.json();}).catch(function(){return {ok:false,error:'network'};}); }); }
  function antApply(intent,args){ return sessTok().then(function(tok){ return fetch('/.netlify/functions/platform-owner-action?do=apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:tok,intent:intent,args:args,via:'ui'})}).then(function(r){return r.json();}).catch(function(){return {ok:false};}); }); }
  function mountAntDock(){
    if(window.__antMounted) return; window.__antMounted=true;
    var fab=document.createElement('button'); fab.className='antfab'; fab.title='Ask Ant'; fab.textContent='🐜'; document.body.appendChild(fab);
    var pan=document.createElement('div'); pan.className='antpanel';
    pan.innerHTML=
      '<div class="aph"><div class="m">🐜</div><div><h4>Ant</h4><p>Tell me who to book — or just ask</p></div><button class="x" title="Close">×</button></div>'+
      '<div class="leash2"><button data-m="advise">Advise</button><button data-m="propose">Propose</button><button data-m="act" class="on">Act</button></div>'+
      '<div class="athread" id="athread"><div class="abub ant">Hey — I\'ve got the board. New scheduling system, I know. Shortcut: <b>just tell me</b> — “book the Alvarez dryer with Lee Thursday.” I already know who covers each ZIP and who has room. Or ask <b>“what should I schedule first?”</b> Everything I do has an Undo.</div></div>'+
      '<div class="aquick"><button data-say="What should I schedule first?">What\'s first?</button><button data-say="Who should I send to the jobs that need scheduling?">Who do I send?</button><button data-say="Book the next job the smartest way you see it.">Book the next one</button></div>'+
      '<form class="acomp" id="acomp"><input id="aask" placeholder="Tell Ant who to book, or ask…" autocomplete="off"><button class="s" type="submit" title="Send">↑</button></form>';
    document.body.appendChild(pan);
    var thread=pan.querySelector('#athread');
    fab.onclick=function(){ pan.classList.toggle('open'); if(pan.classList.contains('open')) pan.querySelector('#aask').focus(); };
    pan.querySelector('.x').onclick=function(){ pan.classList.remove('open'); };
    Array.prototype.forEach.call(pan.querySelectorAll('.leash2 button'), function(b){ b.onclick=function(){ antMode=b.getAttribute('data-m'); Array.prototype.forEach.call(pan.querySelectorAll('.leash2 button'),function(x){x.classList.toggle('on',x===b);}); }; });
    function bub(html,who){ var d=document.createElement('div'); d.className='abub '+who; d.innerHTML=html; thread.appendChild(d); thread.scrollTop=thread.scrollHeight; return d; }
    function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
    function send(text){
      if(!text) return; antHist.push({role:'user',content:text}); bub(esc(text),'me');
      var typing=document.createElement('div'); typing.className='atype'; typing.innerHTML='<span></span><span></span><span></span>'; thread.appendChild(typing); thread.scrollTop=thread.scrollHeight;
      antAsk(text,antMode).then(function(r){
        typing.remove();
        if(!r||!r.ok){ bub('Sorry — snag: '+esc((r&&r.error)||'try again')+'.','ant'); return; }
        antHist.push({role:'assistant',content:r.reply||''});
        var b=bub(md(r.reply||'Done.'),'ant');
        if(r.proposals&&r.proposals.length){
          var wrap=document.createElement('div'); wrap.className='aprop';
          r.proposals.forEach(function(pr){
            var go=document.createElement('button'); go.className='go'; go.textContent='Confirm';
            go.onclick=function(){ go.disabled=true; go.textContent='…'; antApply(pr.intent,pr.args).then(function(x){ if(x&&x.ok){ go.textContent='✓ '+(x.label||'Done'); load(); } else { go.textContent='Failed'; } }); };
            var no=document.createElement('button'); no.textContent='Not now'; no.onclick=function(){ wrap.remove(); };
            wrap.appendChild(go); wrap.appendChild(no);
          });
          b.appendChild(wrap);
        }
        if(r.actions&&r.actions.length){ load(); }
      });
    }
    Array.prototype.forEach.call(pan.querySelectorAll('.aquick button'), function(b){ b.onclick=function(){ pan.classList.add('open'); send(b.getAttribute('data-say')); }; });
    pan.querySelector('#acomp').addEventListener('submit',function(e){ e.preventDefault(); var i=pan.querySelector('#aask'); var v=i.value.trim(); i.value=''; send(v); });
  }

  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) boot(); else renderSignIn(); });
})();
</script>
</body></html>
