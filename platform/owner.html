<!doctype html>
<html lang="en" data-live="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Owner — Ant</title>
<!--
  Ant platform — OWNER APP (multi-tenant reference surface).
  The owner's scoreboard: the major numbers, accurate. Sign in → RLS scopes every query
  to THIS shop (the page never sends a company_id). KPIs on top (front and center, per the
  2026-08-27 spec), then the money — owner-only: billed / collected / owed to techs / take-
  home. NOTHING is fabricated: a metric that isn't fully wired yet is labeled, never faked.
  Spec: docs/platform-owner-app-spec-2026-08-27.md
-->
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd;
    --brand:#3f8f24; --brand-ink:#fff; --chip:#eef2e8;
    --shadow:0 1px 2px rgba(20,30,10,.06),0 4px 14px rgba(20,30,10,.05);
    --good:#3f8f24; --warn:#b45309; --bad:#b91c1c; --info:#2563eb; --violet:#7c3aed; --slate:#64748b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1310; --panel:#171c16; --ink:#eef2e8; --muted:#9aa595; --line:#28311f; --chip:#1e2519;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--brand)}
  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px 64px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px 18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
  .sub{color:var(--muted);font-weight:600;font-size:12.5px}
  .winbar{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:3px}
  .winbar button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer}
  .winbar button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .signout{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
  .sec{margin:22px 2px 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:820px){.hero,.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.hero,.grid{grid-template-columns:1fr}}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);position:relative;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
  .tile .lab{color:var(--muted);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .tile .big{font-size:30px;font-weight:850;letter-spacing:-.02em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
  .tile .foot{color:var(--muted);font-size:12px;margin-top:8px}
  .tile.accent{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
  .badge{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .badge.prelim{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .badge.soon{background:color-mix(in srgb,var(--slate) 16%,transparent);color:var(--slate)}
  .stat-strip{display:flex;flex-wrap:wrap;gap:10px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .pill b{font-size:19px;font-variant-numeric:tabular-nums}
  .pill .k{color:var(--muted);font-size:12.5px;font-weight:700}
  .dotmark{width:9px;height:9px;border-radius:50%;flex:none}
  .money{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .money .row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line)}
  .money .row:first-child{border-top:0}
  .money .row .k{color:var(--muted);font-weight:700;font-size:13px}
  .money .row .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .note{color:var(--muted);font-size:12.5px;margin:8px 4px 0}
  .lock{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:700}
  .ptwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.pt{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;min-width:460px}
  table.pt th,table.pt td{text-align:right;padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px;white-space:nowrap}
  table.pt th{color:var(--muted);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-top:0;background:var(--chip)}
  table.pt th:first-child,table.pt td.nm{text-align:left}
  table.pt td.nm{font-weight:700}
  table.pt td.good{color:var(--good);font-weight:700}
  table.pt td.hi{color:var(--bad);font-weight:800}
  table.pt td.mut{color:var(--muted)}
  table.pt tbody tr:hover{background:var(--chip)}
  /* sign in */
  .gate{max-width:380px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:var(--shadow)}
  .gate h1{margin:0 0 4px;font-size:20px}
  .gate p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
  .gate label{display:block;font-weight:700;font-size:12.5px;margin:12px 0 5px}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px}
  .gate button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .gate .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px}
  .skel{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="skel" style="padding:40px 4px">Loading…</div></div>

<link rel="stylesheet" href="/platform/ant-theme.css">
<script src="/platform/config.js"></script>
<script src="/platform/pay-calc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var cfg = window.ANT_SUPABASE || {};
  var sb = null, companyId = null, shopName = 'Your shop', win = 'month', settings = {};
  var app = document.getElementById('app');
  var USD = function(cents){ return '$' + (Math.round((cents||0)/100)).toLocaleString(); };
  var pct = function(n,d){ return d>0 ? Math.round((n/d)*100) : 0; };

  if (!cfg.url || !window.supabase){ app.innerHTML = '<div class="gate"><h1>Not configured</h1><p>Supabase config missing.</p></div>'; return; }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  function renderSignIn(msg){
    app.innerHTML =
      '<div class="gate"><h1>Owner sign-in</h1><p>Your shop\'s numbers — accurate, and only yours.</p>'+
      '<label>Email</label><input id="em" type="email" autocomplete="username" placeholder="you@shop.com">'+
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">'+
      '<button id="go">Sign in</button><div class="err" id="err">'+(msg||'')+'</div></div>';
    document.getElementById('go').onclick = function(){
      var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
      if(!em||!pw){ document.getElementById('err').textContent='Enter your email and password.'; return; }
      document.getElementById('go').textContent='Signing in…';
      sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
        if(r.error){ renderSignIn(r.error.message); } else { boot(); }
      });
    };
    document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('go').click(); });
  }

  function winStartMs(){
    var d = new Date();
    if (win==='week'){ var day=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d.getTime(); }
    if (win==='month'){ return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
    if (win==='ytd'){ return new Date(d.getFullYear(),0,1).getTime(); }
    return 0; // all
  }

  function shell(body){
    app.innerHTML =
      '<header class="top">'+
        '<div><div class="brand"><span class="dot">🐜</span><span>'+esc(shopName)+'</span></div>'+
          '<div class="sub">Owner view · the numbers, accurate</div></div>'+
        '<div style="display:flex;gap:10px;align-items:center">'+
          '<div class="winbar" id="winbar">'+
            btn('week','This week')+btn('month','This month')+btn('ytd','YTD')+btn('all','All')+
          '</div>'+
          '<button class="signout" id="out">Sign out</button>'+
        '</div>'+
      '</header>'+ body;
    Array.prototype.forEach.call(document.querySelectorAll('#winbar button'), function(b){
      b.onclick=function(){ win=b.getAttribute('data-w'); load(); };
    });
    document.getElementById('out').onclick=function(){ sb.auth.signOut().then(function(){ renderSignIn(); }); };
  }
  function btn(w,label){ return '<button data-w="'+w+'"'+(win===w?' class="on"':'')+'>'+label+'</button>'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function boot(){
    app.innerHTML='<div class="skel" style="padding:40px 4px">Loading your numbers…</div>';
    sb.from('company').select('id,name,settings').limit(1).then(function(r){
      if(r.error||!r.data||!r.data[0]){ renderSignIn('Could not load your shop.'); return; }
      companyId=r.data[0].id; shopName=r.data[0].name||'Your shop'; settings=r.data[0].settings||{};
      load();
    });
  }

  function load(){
    shell('<div class="skel" style="padding:30px 4px">Crunching…</div>');
    // RLS scopes both queries to this company — we never pass company_id.
    var jobsP = sb.from('job').select('id,status,xano_status,warranty_company,customer_id,completed_at,created_at,parts_status,first_stop,technician_id,warranty_claim_status,warranty_paid_cents').limit(3000);
    var invP  = sb.from('invoice').select('job_id,labor_cents,total_cents,status,paid_at,created_at').limit(3000);
    var techP = sb.from('technician').select('id,name,active,commission_type,commission_pct,commission_flat_cents').limit(200);
    var payP  = sb.from('tech_payout').select('technician_id,job_id,amount_cents,paid_at').limit(5000);
    Promise.all([jobsP, invP, techP, payP]).then(function(res){
      var jobs = (res[0].data)||[], invs = (res[1].data)||[], techs = (res[2].data)||[], payouts = (res[3].data)||[];
      render(jobs, invs, techs, payouts);
    }).catch(function(){ shell('<div class="note">Could not load data. Try again.</div>'); });
  }

  function render(jobs, invs, techs, payouts){
    var since = winStartMs();
    var inWin = function(row, field){ var t=row[field]?Date.parse(row[field]):0; return since===0 || t>=since; };
    // KPI base: jobs created in-window (pipeline) + completed in-window (outcomes)
    var pipeline = jobs.filter(function(j){ return inWin(j,'created_at'); });
    var completed = jobs.filter(function(j){ return (j.status==='completed') && inWin(j, j.completed_at?'completed_at':'created_at'); });
    var byStatus = {}; pipeline.forEach(function(j){ byStatus[j.status]=(byStatus[j.status]||0)+1; });
    var recRep = jobs.filter(function(j){ return j.xano_status==='no_fix_possible' && inWin(j, j.completed_at?'completed_at':'created_at'); }).length;
    var warranty = pipeline.filter(function(j){ return (j.warranty_company||'')!==''; }).length;
    var cash = pipeline.length - warranty;
    // callbacks: same customer with >1 completed job within 30 days (proxy until same-unit linkage lands)
    var byCust = {}; jobs.forEach(function(j){ if(j.status==='completed'){ (byCust[j.customer_id]=byCust[j.customer_id]||[]).push(Date.parse(j.completed_at||j.created_at)); }});
    var callbackCust=0, k;
    for (k in byCust){ var ds=byCust[k].sort(function(a,b){return a-b;}); for(var i=1;i<ds.length;i++){ if(ds[i]-ds[i-1] <= 30*864e5){ callbackCust++; break; } } }
    var completedAll = jobs.filter(function(j){return j.status==='completed';}).length;
    var callbackRate = pct(callbackCust, Object.keys(byCust).length);
    // first-stop from the REAL repair report: completed jobs with a TDR, fixed with no
    // return trip for parts. Only counts jobs we actually have a report for (never fakes it).
    var fsKnown = completed.filter(function(j){ return j.first_stop===true || j.first_stop===false; });
    var fsYes = fsKnown.filter(function(j){ return j.first_stop===true; }).length;
    var firstStop = pct(fsYes, fsKnown.length);

    // money (owner-only) from real invoices — honest, may be sparse until CSR invoicing moves here
    var invWin = invs.filter(function(v){ return inWin(v, v.paid_at||v.created_at?'created_at':'created_at'); });
    var billed=0, collected=0; invWin.forEach(function(v){ billed+=v.total_cents||0; if(v.status==='paid'){ collected+=v.total_cents||0; } });
    var outstanding = billed - collected;

    // TECH PAY — derived from the SAME invoices via PayCalc (one source of truth, so the
    // tech app can never disagree). Commission = per-tech override else company default.
    var compDef = window.PayCalc.companyDefault(settings);
    var techById={}; (techs||[]).forEach(function(t){ techById[t.id]=t; });
    var invByJob={}; invs.forEach(function(v){ if(v.job_id) invByJob[v.job_id]=v; });
    var paidByTechJob={}; (payouts||[]).forEach(function(p){ var key=(p.technician_id||'')+'|'+(p.job_id||''); paidByTechJob[key]=(paidByTechJob[key]||0)+(p.amount_cents||0); });
    var payAgg={};  // techId -> {earned, collectible, paid, owed}
    completed.forEach(function(j){
      var inv=invByJob[j.id]; if(!inv || !j.technician_id) return;
      var rule=window.PayCalc.ruleFor(techById[j.technician_id], compDef);
      var pj=window.PayCalc.jobPay(j, inv, rule, paidByTechJob[j.technician_id+'|'+j.id]||0);
      var a=payAgg[j.technician_id]||(payAgg[j.technician_id]={earned:0,collectible:0,paid:0,owed:0});
      a.earned+=pj.earned_cents; a.collectible+=pj.collectible_cents; a.paid+=pj.paid_cents; a.owed+=pj.owed_now_cents;
    });
    var owedToTechs=0, techCollected=0; Object.keys(payAgg).forEach(function(id){ owedToTechs+=payAgg[id].owed; techCollected+=payAgg[id].collectible; });
    var takeHome = collected - techCollected; // collected revenue minus tech's collected cut (before parts/overhead)
    var payTable = Object.keys(payAgg).length ? (
      '<div class="ptwrap"><table class="pt"><thead><tr><th>Tech</th><th>Rule</th><th>Earned</th><th>Collected</th><th>Paid</th><th>Owed now</th></tr></thead><tbody>'+
      Object.keys(payAgg).map(function(id){ var a=payAgg[id]; var rule=window.PayCalc.ruleFor(techById[id], compDef);
        return '<tr><td class="nm">'+esc(techById[id]?techById[id].name:'—')+'</td><td class="mut">'+esc(window.PayCalc.ruleLabel(rule))+'</td><td>'+USD(a.earned)+'</td><td>'+USD(a.collectible)+'</td><td>'+USD(a.paid)+'</td><td'+(a.owed>0?' class="good"':'')+'>'+USD(a.owed)+'</td></tr>';
      }).join('')+'</tbody></table></div>'
    ) : '';

    // Per-tech watch table (owner-only): jobs, completed, first-stop %, condemn %, reassign %.
    var techName={}; (techs||[]).forEach(function(t){ techName[t.id]=t.name; });
    var agg={};
    jobs.forEach(function(j){
      if(!j.technician_id) return;
      if(!(since===0 || (j.created_at && Date.parse(j.created_at)>=since))) return;
      var a=agg[j.technician_id]||(agg[j.technician_id]={jobs:0,completed:0,fsK:0,fsY:0,cond:0});
      a.jobs++;
      if(j.status==='completed') a.completed++;
      if(j.first_stop===true||j.first_stop===false){ a.fsK++; if(j.first_stop===true) a.fsY++; }
      if(j.xano_status==='no_fix_possible') a.cond++;
    });
    var trows=Object.keys(agg).map(function(id){ var a=agg[id]; return {
      name: techName[id]||'—', jobs:a.jobs, completed:a.completed,
      fs: a.fsK>0?Math.round(100*a.fsY/a.fsK):null,
      cond: a.jobs>0?Math.round(1000*a.cond/a.jobs)/10:0
    }; }).filter(function(r){ return r.jobs>0; }).sort(function(x,y){ return (y.fs==null?-1:y.fs)-(x.fs==null?-1:x.fs); });
    var techTable = trows.length ? (
      '<div class="ptwrap"><table class="pt"><thead><tr><th>Tech</th><th>Jobs</th><th>Done</th><th>First-stop</th><th>Condemn</th><th>Reassign</th></tr></thead><tbody>'+
      trows.map(function(r){ return '<tr><td class="nm">'+esc(r.name)+'</td><td>'+r.jobs+'</td><td>'+r.completed+'</td><td class="good">'+(r.fs==null?'—':r.fs+'%')+'</td><td'+(r.cond>=8?' class="hi"':'')+'>'+r.cond+'%</td><td class="mut">—</td></tr>'; }).join('')+
      '</tbody></table></div><div class="note">Condemn = recommend-replacement ÷ jobs (owner watch, not a leaderboard). First-stop from the repair reports. Reassign % lands with the next data pull.</div>'
    ) : '<div class="note">No per-tech data in this window.</div>';

    var body =
      '<div class="sec">Performance — front and center</div>'+
      '<div class="hero">'+
        tile('🥇 First-Stop Completion', firstStop+'%', 'of '+fsKnown.length+' completed jobs with a report', true, '', 'Fixed on the first visit, no return trip for parts. From the tech\'s repair report; only counts jobs we have a report for.')+
        tile('💚 Callbacks', callbackRate+'%', callbackCust+' customers back within 30 days', false, '', '')+
        tile('🔁 Recommend Replacement', String(recRep), 'machines called not-worth-fixing', false, '', 'Owner outlier-watch — NOT a leaderboard metric. Per-tech below so a guy with too many is obvious.')+
        tile('✅ Completed', String(completed.length), 'jobs finished this period', false, '', '')+
      '</div>'+
      '<div class="sec">Pipeline</div>'+
      '<div class="stat-strip">'+
        spill('#2563eb','Scheduled', byStatus.scheduled||0)+
        spill('#7c3aed','Awaiting parts', byStatus.awaiting_parts||0)+
        spill('#b45309','In progress', byStatus.in_progress||0)+
        spill('#3f8f24','Completed', byStatus.completed||0)+
        spill('#64748b','New', byStatus['new']||0)+
      '</div>'+
      '<div class="sec">Job mix</div>'+
      '<div class="stat-strip">'+
        spill('#3f8f24','Warranty', warranty)+
        spill('#b45309','Cash / self-pay', cash)+
      '</div>'+
      '<div class="sec">Per-tech <span class="lock">🔒 owner only</span></div>'+
      techTable+
      '<div class="sec">Money <span class="lock">🔒 owner only</span></div>'+
      '<div class="money">'+
        mrow('Invoiced (from the job tile)','',USD(billed))+
        mrow('Collected','',USD(collected))+
        mrow('Outstanding (owed to shop)','',USD(outstanding))+
        mrow('Owed to techs (collected, not paid)','',USD(owedToTechs))+
        mrow('Take-home (after tech pay)','before parts / overhead',USD(takeHome))+
      '</div>'+
      (invWin.length===0
        ? '<div class="note">No invoices in this window yet. As jobs get billed on the platform, billed / collected / owed-to-techs / take-home fill in here automatically — from the same invoice, entered once.</div>'
        : '<div class="note">From '+invWin.length+' invoice'+(invWin.length===1?'':'s')+'. Take-home is collected revenue minus the techs’ collected cut; parts cost + overhead land here as those get captured.</div>')+
      (payTable ? '<div class="sec">Tech pay <span class="lock">🔒 owner only</span></div>'+payTable+'<div class="note">Earned = cut if it pays in full · Collected = invoice paid · Owed now = collected but not yet paid out. All from the job’s invoice + this tech’s commission rule.</div>' : '')+
      commissionEditor(techs, compDef);
    shell(body);
    bindCommission();
  }

  // Owner-only commission settings: company default + per-tech overrides.
  function commissionEditor(techs, compDef){
    var defVal = compDef.type==='flat_per_job' ? (compDef.flat_cents/100) : compDef.pct;
    var rows = (techs||[]).filter(function(t){return t.active!==false;}).map(function(t){
      var ov=t.commission_type||'';
      var val = ov==='flat_per_job' ? ((t.commission_flat_cents||0)/100) : (ov==='labor_pct' ? (t.commission_pct==null?'':t.commission_pct) : '');
      return '<tr data-tech="'+t.id+'"><td class="nm">'+esc(t.name)+'</td>'+
        '<td><select class="ovType"><option value="">— use default —</option>'+
          '<option value="labor_pct"'+(ov==='labor_pct'?' selected':'')+'>% of labor</option>'+
          '<option value="flat_per_job"'+(ov==='flat_per_job'?' selected':'')+'>Flat per job</option></select></td>'+
        '<td><input class="ovVal" inputmode="decimal" style="width:80px" value="'+val+'"></td>'+
        '<td><button class="ovSave">Save</button></td></tr>';
    }).join('');
    return '<div class="sec">Commission <span class="lock">🔒 owner only</span></div>'+
      '<div class="money">'+
        '<div class="row"><span class="k">Default pay rule</span><span class="v">'+
          '<select id="commType">'+
            '<option value="labor_pct"'+(compDef.type==='labor_pct'?' selected':'')+'>% of labor</option>'+
            '<option value="flat_per_job"'+(compDef.type==='flat_per_job'?' selected':'')+'>Flat per job</option>'+
          '</select> '+
          '<input id="commVal" inputmode="decimal" style="width:80px" value="'+defVal+'"> '+
          '<button id="commSave">Save</button></span></div>'+
      '</div>'+
      '<div class="note" id="commMsg">Every tech is paid this unless you set an override.</div>'+
      (rows ? '<div class="ptwrap"><table class="pt"><thead><tr><th>Tech</th><th>Override</th><th>Value</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>' : '');
  }

  function bindCommission(){
    var msg=document.getElementById('commMsg');
    var save=document.getElementById('commSave');
    if(save) save.onclick=function(){
      var type=document.getElementById('commType').value;
      var v=parseFloat(document.getElementById('commVal').value)||0;
      var comm = type==='flat_per_job' ? {type:'flat_per_job',flat_cents:Math.round(v*100)} : {type:'labor_pct',labor_pct:v};
      save.disabled=true; save.textContent='Saving…';
      var next=Object.assign({}, settings, {commission:comm});
      sb.from('company').update({settings:next}).eq('id',companyId).then(function(r){
        save.disabled=false; save.textContent='Save';
        if(r.error){ if(msg){msg.textContent='Could not save: '+r.error.message;} return; }
        settings=next; if(msg){msg.textContent='Saved. Every tech now defaults to '+window.PayCalc.ruleLabel(window.PayCalc.companyDefault(settings))+'.';} load();
      });
    };
    Array.prototype.forEach.call(document.querySelectorAll('.ovSave'), function(btn){
      btn.onclick=function(){
        var tr=btn.closest('tr'); var techId=tr.getAttribute('data-tech');
        var type=tr.querySelector('.ovType').value;
        var v=parseFloat(tr.querySelector('.ovVal').value)||0;
        var upd = type==='labor_pct' ? {commission_type:'labor_pct',commission_pct:v,commission_flat_cents:null}
                : type==='flat_per_job' ? {commission_type:'flat_per_job',commission_pct:null,commission_flat_cents:Math.round(v*100)}
                : {commission_type:null,commission_pct:null,commission_flat_cents:null};
        btn.disabled=true; btn.textContent='…';
        sb.from('technician').update(upd).eq('id',techId).then(function(r){
          btn.disabled=false; btn.textContent='Save';
          if(r.error){ if(msg){msg.textContent='Could not save override: '+r.error.message;} return; }
          if(msg){msg.textContent='Override saved.';} load();
        });
      };
    });
  }

  function tile(lab, big, foot, accent, badge, tip){
    var b = badge==='prelim' ? '<span class="badge prelim">prelim</span>' : (badge==='soon'?'<span class="badge soon">soon</span>':'');
    return '<div class="tile'+(accent?' accent':'')+'"'+(tip?' title="'+esc(tip)+'"':'')+'>'+
      '<div class="lab">'+esc(lab)+' '+b+'</div><div class="big">'+esc(big)+'</div><div class="foot">'+esc(foot)+'</div></div>';
  }
  function spill(color,k,v){ return '<div class="pill"><span class="dotmark" style="background:'+color+'"></span><b>'+v+'</b><span class="k">'+esc(k)+'</span></div>'; }
  function mrow(k,sub,v){ return '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+v+'</span></div>'; }

  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) boot(); else renderSignIn(); });
})();
</script>
</body>
</html>
