<!doctype html>
<html lang="en" data-live="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Owner — Ant</title>
<!--
  Ant platform — OWNER APP (multi-tenant reference surface).
  The owner's scoreboard: the major numbers, accurate. Sign in → RLS scopes every query
  to THIS shop (the page never sends a company_id). KPIs on top (front and center, per the
  2026-08-27 spec), then the money — owner-only: billed / collected / owed to techs / take-
  home. NOTHING is fabricated: a metric that isn't fully wired yet is labeled, never faked.
  Spec: docs/platform-owner-app-spec-2026-08-27.md
-->
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#12160f; --muted:#5b6152; --line:#e4e7dd;
    --brand:#3f8f24; --brand-ink:#fff; --chip:#eef2e8;
    --shadow:0 1px 2px rgba(20,30,10,.06),0 4px 14px rgba(20,30,10,.05);
    --good:#3f8f24; --warn:#b45309; --bad:#b91c1c; --info:#2563eb; --violet:#7c3aed; --slate:#64748b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1310; --panel:#171c16; --ink:#eef2e8; --muted:#9aa595; --line:#28311f; --chip:#1e2519;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--brand)}
  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px 64px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px 18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
  .sub{color:var(--muted);font-weight:600;font-size:12.5px}
  .winbar{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:3px}
  .winbar button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer}
  .winbar button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .signout{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
  .sec{margin:22px 2px 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:820px){.hero,.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.hero,.grid{grid-template-columns:1fr}}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);position:relative;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
  .tile .lab{color:var(--muted);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .tile .big{font-size:30px;font-weight:850;letter-spacing:-.02em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
  .tile .foot{color:var(--muted);font-size:12px;margin-top:8px}
  .tile.accent{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
  .badge{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .badge.prelim{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .badge.soon{background:color-mix(in srgb,var(--slate) 16%,transparent);color:var(--slate)}
  .stat-strip{display:flex;flex-wrap:wrap;gap:10px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .pill b{font-size:19px;font-variant-numeric:tabular-nums}
  .pill .k{color:var(--muted);font-size:12.5px;font-weight:700}
  .dotmark{width:9px;height:9px;border-radius:50%;flex:none}
  .money{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .money .row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line)}
  .money .row:first-child{border-top:0}
  .money .row .k{color:var(--muted);font-weight:700;font-size:13px}
  .money .row .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .note{color:var(--muted);font-size:12.5px;margin:8px 4px 0}
  .lock{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:700}
  .ptwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.pt{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;min-width:460px}
  table.pt th,table.pt td{text-align:right;padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px;white-space:nowrap}
  table.pt th{color:var(--muted);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-top:0;background:var(--chip)}
  table.pt th:first-child,table.pt td.nm{text-align:left}
  table.pt td.nm{font-weight:700}
  table.pt td.good{color:var(--good);font-weight:700}
  table.pt td.hi{color:var(--bad);font-weight:800}
  table.pt td.mut{color:var(--muted)}
  table.pt tbody tr:hover{background:var(--chip)}
  /* sign in */
  .gate{max-width:380px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:var(--shadow)}
  .gate h1{margin:0 0 4px;font-size:20px}
  .gate p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
  .gate label{display:block;font-weight:700;font-size:12.5px;margin:12px 0 5px}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px}
  .gate button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .gate .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px}
  .skel{color:var(--muted)}
  /* goals + ledger */
  .goals2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.goals2{grid-template-columns:1fr}}
  .goal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .goal::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#e0a63e))}
  .goal .gt{font-weight:800;font-size:13px;display:flex;align-items:center;gap:7px}
  .goal .gbar{height:10px;border-radius:999px;background:var(--chip);margin:14px 0 9px;overflow:hidden}
  .goal .gfill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#e0a63e));transition:width .8s cubic-bezier(.2,.7,.2,1)}
  .goal .gnums{font-size:13px;color:var(--muted)}.goal .gnums b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
  .goal .gbig{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
  .goal .gmut{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
  .goal .pace{display:inline-flex;align-items:center;gap:6px;margin-top:11px;padding:5px 10px;border-radius:999px;font-weight:800;font-size:12px}
  .goal .pace.ahead{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
  .goal .pace.behind{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .goal .glink,.goal .gset{margin-top:13px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-weight:700;font-size:12px;padding:7px 12px;border-radius:9px;cursor:pointer}
  .goal .gset{background:var(--brand);color:#fff;border-color:transparent}
  .goal .glink:hover{color:var(--ink);border-color:var(--brand)}
  .ledger{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .lrow{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-top:1px solid var(--line)}
  .lrow:first-child{border-top:0}
  .lrow .li{width:26px;height:26px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:13px;flex:none}
  .lrow .lb{flex:1;min-width:0}
  .lrow .la{font-weight:700;font-size:13px}
  .lrow .lm{font-size:11.5px;color:var(--muted);margin-top:3px}
  .lrow .lm .who{font-weight:700;color:var(--brand)}
  .lrow.rev{opacity:.55}.lrow.rev .la{text-decoration:line-through}
  .lrow .undo{border:1px solid var(--line);background:var(--bg);color:var(--muted);font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:8px;cursor:pointer;flex:none}
  .lrow .undo:hover{color:var(--warn);border-color:var(--warn)}
  .lrow .revd{font-size:11px;font-weight:800;color:var(--warn);flex:none;align-self:center}
  .intakeaddr{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
  .ia-t{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .ia-a{display:flex;gap:8px;align-items:center;margin:5px 0 2px}
  .ia-a .mono{font-size:15px;font-weight:800;color:var(--ink,#111)}
  .ia-copy{border:1px solid var(--line);background:var(--bg);color:var(--muted);font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:8px;cursor:pointer}
  .ia-copy:hover{border-color:var(--brand,#c8901f);color:var(--brand,#c8901f)}
  .ia-h{font-size:12px;color:var(--muted);margin-top:4px}
  .ist{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;white-space:nowrap}
  /* what Ant learned */
  .learned{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .lp{display:flex;gap:11px;align-items:center;padding:12px 15px;border-top:1px solid var(--line)}
  .lp:first-child{border-top:0}
  .lp .li{width:26px;height:26px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:13px;flex:none}
  .lp .b{flex:1;min-width:0}.lp .t{font-weight:700;font-size:13px}.lp .d{font-size:11.5px;color:var(--muted);margin-top:3px}
  .lp .go{border:1px solid color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--chip);color:var(--brand);font-weight:700;font-size:11.5px;padding:7px 11px;border-radius:8px;cursor:pointer;flex:none}
  .lp .go:hover{background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;border-color:transparent}
  .lp.avoid .li{background:color-mix(in srgb,var(--warn) 16%,transparent)}
  /* Ant partner dock */
  .antfab{position:fixed;right:18px;bottom:18px;z-index:60;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;font-size:26px;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent);display:grid;place-items:center}
  .antfab:hover{transform:translateY(-1px)}
  .antpanel{position:fixed;right:18px;bottom:84px;z-index:60;width:min(380px,calc(100vw - 36px));max-height:min(72vh,640px);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden}
  .antpanel.open{display:flex}
  .aph{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--panel)),var(--panel))}
  .aph .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#e0a63e);display:grid;place-items:center;font-size:18px;flex:none}
  .aph h4{margin:0;font-size:14px;font-weight:800}.aph p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
  .aph .x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .leash2{display:flex;gap:4px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .leash2 button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-weight:700;font-size:11.5px;padding:6px;border-radius:8px;cursor:pointer}
  .leash2 button.on{background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;border-color:transparent}
  .athread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;min-height:150px}
  .abub{max-width:88%;padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.45}
  .abub.ant{align-self:flex-start;background:var(--chip);border-bottom-left-radius:4px}
  .abub.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;border-bottom-right-radius:4px}
  .abub.ant b,.abub.ant strong{color:var(--brand)}
  .aprop{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}
  .aprop button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
  .aprop button.go{background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;border-color:transparent}
  .atype{align-self:flex-start;display:flex;gap:4px;padding:11px 13px;background:var(--chip);border-radius:13px;border-bottom-left-radius:4px}
  .atype span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ab 1.2s infinite}.atype span:nth-child(2){animation-delay:.2s}.atype span:nth-child(3){animation-delay:.4s}
  @keyframes ab{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .aquick{display:flex;gap:6px;flex-wrap:wrap;padding:2px 12px 10px}
  .aquick button{border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer}
  .acomp{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line)}
  .acomp input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:10px 12px;font-size:13px}
  .acomp .s{width:40px;height:40px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--brand),#e0a63e);color:#fff;font-size:16px;font-weight:800;cursor:pointer;flex:none}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="skel" style="padding:40px 4px">Loading…</div></div>

<link rel="stylesheet" href="/platform/ant-theme.css">
<script src="/platform/config.js"></script>
<script src="/platform/features.js"></script>
<script src="/platform/pay-calc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var cfg = window.ANT_SUPABASE || {};
  var sb = null, companyId = null, shopName = 'Your shop', slug = '', win = 'month', settings = {}, payJobs = {}, features = {};
  var app = document.getElementById('app');
  var USD = function(cents){ return '$' + (Math.round((cents||0)/100)).toLocaleString(); };
  var pct = function(n,d){ return d>0 ? Math.round((n/d)*100) : 0; };

  if (!cfg.url || !window.supabase){ app.innerHTML = '<div class="gate"><h1>Not configured</h1><p>Supabase config missing.</p></div>'; return; }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  function renderSignIn(msg){
    app.innerHTML =
      '<div class="gate"><h1>Owner sign-in</h1><p>Your shop\'s numbers — accurate, and only yours.</p>'+
      '<label>Email</label><input id="em" type="email" autocomplete="username" placeholder="you@shop.com">'+
      '<label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">'+
      '<button id="go">Sign in</button><div class="err" id="err">'+(msg||'')+'</div></div>';
    document.getElementById('go').onclick = function(){
      var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
      if(!em||!pw){ document.getElementById('err').textContent='Enter your email and password.'; return; }
      document.getElementById('go').textContent='Signing in…';
      sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
        if(r.error){ renderSignIn(r.error.message); } else { boot(); }
      });
    };
    document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('go').click(); });
  }

  function winStartMs(){
    var d = new Date();
    if (win==='week'){ var day=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d.getTime(); }
    if (win==='month'){ return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
    if (win==='ytd'){ return new Date(d.getFullYear(),0,1).getTime(); }
    return 0; // all
  }

  function shell(body){
    app.innerHTML =
      '<header class="top">'+
        '<div><div class="brand"><span class="dot">🐜</span><span>'+esc(shopName)+'</span></div>'+
          '<div class="sub">Owner view · the numbers, accurate</div></div>'+
        '<div style="display:flex;gap:10px;align-items:center">'+
          '<div class="winbar" id="winbar">'+
            btn('week','This week')+btn('month','This month')+btn('ytd','YTD')+btn('all','All')+
          '</div>'+
          '<a class="signout" href="/platform/comms.html" style="text-decoration:none;display:inline-flex;align-items:center;gap:5px">💬 Messages</a>'+
          '<a class="signout" href="/platform/integrations.html" style="text-decoration:none;display:inline-flex;align-items:center;gap:5px">🔌 Vendors</a>'+
          '<a class="signout" href="/platform/credentials.html" style="text-decoration:none;display:inline-flex;align-items:center;gap:5px">🛡️ Insurance</a>'+
          '<button class="signout" id="out">Sign out</button>'+
        '</div>'+
      '</header>'+ body;
    Array.prototype.forEach.call(document.querySelectorAll('#winbar button'), function(b){
      b.onclick=function(){ win=b.getAttribute('data-w'); load(); };
    });
    document.getElementById('out').onclick=function(){ sb.auth.signOut().then(function(){ renderSignIn(); }); };
  }
  function btn(w,label){ return '<button data-w="'+w+'"'+(win===w?' class="on"':'')+'>'+label+'</button>'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function boot(){
    app.innerHTML='<div class="skel" style="padding:40px 4px">Loading your numbers…</div>';
    sb.from('company').select('id,name,slug,settings,features').limit(1).then(function(r){
      if(r.error||!r.data||!r.data[0]){ renderSignIn('Could not load your shop.'); return; }
      companyId=r.data[0].id; shopName=r.data[0].name||'Your shop'; slug=r.data[0].slug||''; settings=r.data[0].settings||{}; features=r.data[0].features||{};
      // First login → guided setup wizard (unless they came back on purpose).
      if(!settings.onboarded && !/[?&]setup=skip/.test(location.search)){ location.href='/platform/onboard.html'; return; }
      load();
    });
  }

  function load(){
    shell('<div class="skel" style="padding:30px 4px">Crunching…</div>');
    // RLS scopes both queries to this company — we never pass company_id.
    var jobsP = sb.from('job').select('id,status,xano_status,warranty_company,customer_id,completed_at,created_at,parts_status,first_stop,technician_id,warranty_claim_status,warranty_paid_cents,customer:customer_id(first_name,last_name)').limit(3000);
    var invP  = sb.from('invoice').select('job_id,labor_cents,total_cents,collected_cents,status,paid_at,created_at').limit(3000);
    var techP = sb.from('technician').select('id,name,active,commission_type,commission_pct,commission_flat_cents,max_stops,service_area').limit(200);
    var payP  = sb.from('tech_payout').select('technician_id,job_id,amount_cents,paid_at').limit(5000);
    var partP = sb.from('job_part').select('job_id,cost_cents,sell_cents,disposition').limit(10000);
    Promise.all([jobsP, invP, techP, payP, partP]).then(function(res){
      var jobs = (res[0].data)||[], invs = (res[1].data)||[], techs = (res[2].data)||[], payouts = (res[3].data)||[], parts = (res[4]&&res[4].data)||[];
      render(jobs, invs, techs, payouts, parts);
    }).catch(function(){ shell('<div class="note">Could not load data. Try again.</div>'); });
  }

  function render(jobs, invs, techs, payouts, parts){
    parts = parts || [];
    var since = winStartMs();
    var inWin = function(row, field){ var t=row[field]?Date.parse(row[field]):0; return since===0 || t>=since; };
    // KPI base: jobs created in-window (pipeline) + completed in-window (outcomes)
    var pipeline = jobs.filter(function(j){ return inWin(j,'created_at'); });
    var completed = jobs.filter(function(j){ return (j.status==='completed') && inWin(j, j.completed_at?'completed_at':'created_at'); });
    var byStatus = {}; pipeline.forEach(function(j){ byStatus[j.status]=(byStatus[j.status]||0)+1; });
    var recRep = jobs.filter(function(j){ return j.xano_status==='no_fix_possible' && inWin(j, j.completed_at?'completed_at':'created_at'); }).length;
    var warranty = pipeline.filter(function(j){ return (j.warranty_company||'')!==''; }).length;
    var cash = pipeline.length - warranty;
    // callbacks: same customer with >1 completed job within 30 days (proxy until same-unit linkage lands)
    var byCust = {}; jobs.forEach(function(j){ if(j.status==='completed'){ (byCust[j.customer_id]=byCust[j.customer_id]||[]).push(Date.parse(j.completed_at||j.created_at)); }});
    var callbackCust=0, k;
    for (k in byCust){ var ds=byCust[k].sort(function(a,b){return a-b;}); for(var i=1;i<ds.length;i++){ if(ds[i]-ds[i-1] <= 30*864e5){ callbackCust++; break; } } }
    var completedAll = jobs.filter(function(j){return j.status==='completed';}).length;
    var callbackRate = pct(callbackCust, Object.keys(byCust).length);
    // first-stop from the REAL repair report: completed jobs with a TDR, fixed with no
    // return trip for parts. Only counts jobs we actually have a report for (never fakes it).
    var fsKnown = completed.filter(function(j){ return j.first_stop===true || j.first_stop===false; });
    var fsYes = fsKnown.filter(function(j){ return j.first_stop===true; }).length;
    var firstStop = pct(fsYes, fsKnown.length);

    // money (owner-only) from real invoices — honest, may be sparse until CSR invoicing moves here
    var invWin = invs.filter(function(v){ return inWin(v, v.paid_at||v.created_at?'created_at':'created_at'); });
    var billed=0, collected=0; invWin.forEach(function(v){ billed+=v.total_cents||0; collected+=v.collected_cents||0; });
    var outstanding = billed - collected;   // collected = REAL money in (warranty remittances included)

    // TECH PAY — derived from the SAME invoices via PayCalc (one source of truth, so the
    // tech app can never disagree). Commission = per-tech override else company default.
    var compDef = window.PayCalc.companyDefault(settings);
    var techById={}; (techs||[]).forEach(function(t){ techById[t.id]=t; });
    var invByJob={}; invs.forEach(function(v){ if(v.job_id) invByJob[v.job_id]=v; });
    var paidByTechJob={}; (payouts||[]).forEach(function(p){ var key=(p.technician_id||'')+'|'+(p.job_id||''); paidByTechJob[key]=(paidByTechJob[key]||0)+(p.amount_cents||0); });
    var payAgg={};  // techId -> {earned, collectible, paid, owed}
    payJobs={};     // techId -> [{job_id, owed_cents}]  (for the Mark-paid payout writes)
    completed.forEach(function(j){
      var inv=invByJob[j.id]; if(!inv || !j.technician_id) return;
      var rule=window.PayCalc.ruleFor(techById[j.technician_id], compDef);
      var pj=window.PayCalc.jobPay(j, inv, rule, paidByTechJob[j.technician_id+'|'+j.id]||0);
      var a=payAgg[j.technician_id]||(payAgg[j.technician_id]={earned:0,collectible:0,paid:0,owed:0});
      a.earned+=pj.earned_cents; a.collectible+=pj.collectible_cents; a.paid+=pj.paid_cents; a.owed+=pj.owed_now_cents;
      if(pj.owed_now_cents>0){ (payJobs[j.technician_id]=payJobs[j.technician_id]||[]).push({job_id:j.id, owed_cents:pj.owed_now_cents}); }
    });
    var owedToTechs=0, techCollected=0; Object.keys(payAgg).forEach(function(id){ owedToTechs+=payAgg[id].owed; techCollected+=payAgg[id].collectible; });
    // PARTS — cost vs charge on billed jobs in this window (the margin the owner set, realized).
    var winJobIds={}; invWin.forEach(function(v){ if(v.job_id) winJobIds[v.job_id]=1; });
    var partsRev=0, partsCost=0; parts.forEach(function(p){ if(!winJobIds[p.job_id]) return; var d=(p.disposition||''); if(d==='return'||d==='unused'||d==='missing') return; partsRev+=(p.sell_cents||0); partsCost+=(p.cost_cents||0); });
    var partsMargin=partsRev-partsCost;
    var mPct=(settings.parts&&settings.parts.markup_pct!=null)?+settings.parts.markup_pct:50;
    var takeHome = collected - techCollected - partsCost; // collected revenue minus tech cut AND parts cost (before overhead)
    var payTable = Object.keys(payAgg).length ? (
      '<div class="ptwrap"><table class="pt"><thead><tr><th>Tech</th><th>Rule</th><th>Earned</th><th>Collected</th><th>Paid</th><th>Owed now</th><th></th></tr></thead><tbody>'+
      Object.keys(payAgg).map(function(id){ var a=payAgg[id]; var rule=window.PayCalc.ruleFor(techById[id], compDef);
        var act=a.owed>0 ? '<button class="markpaid" data-tech="'+id+'">💵 Mark '+USD(a.owed)+' paid</button>' : '';
        return '<tr><td class="nm">'+esc(techById[id]?techById[id].name:'—')+'</td><td class="mut">'+esc(window.PayCalc.ruleLabel(rule))+'</td><td>'+USD(a.earned)+'</td><td>'+USD(a.collectible)+'</td><td>'+USD(a.paid)+'</td><td'+(a.owed>0?' class="good"':'')+'>'+USD(a.owed)+'</td><td>'+act+'</td></tr>';
      }).join('')+'</tbody></table></div>'
    ) : '';

    // 🔎 RECONCILE — audit the money that MOVED against what the rules SAY should have moved.
    // Hands the owner only the exceptions (or one green "balanced" line). Same ledger, no guess.
    var recExc=[], nowMs=Date.now();
    function custName(j){ var c=j.customer; return c?(((c.first_name||'')+' '+(c.last_name||'')).trim()||'Customer'):'Customer'; }
    // A. self-pay customer hasn't paid (a warranty invoice sitting unpaid is normal — it waits on the vendor)
    jobs.forEach(function(j){
      var iv=invByJob[j.id]; if(!iv) return;
      var unpaid=(iv.total_cents||0)-(iv.collected_cents||0); if(unpaid<=0) return;
      if(j.warranty_company) return;
      var ageD=iv.created_at?Math.floor((nowMs-Date.parse(iv.created_at))/864e5):0;
      if(iv.status!=='paid' && ageD>=21) recExc.push({msg:'💵 '+esc(custName(j))+' hasn’t paid — '+USD(unpaid)+', '+ageD+' days out'});
    });
    // B. a tech was paid MORE than the rules say he earned on collected jobs (double/override payout)
    Object.keys(payAgg).forEach(function(id){ var a=payAgg[id]; if(a.paid > a.collectible+50) recExc.push({msg:'⚠️ '+esc(techById[id]?techById[id].name:'Tech')+' paid '+USD(a.paid)+' but rules earned-collected '+USD(a.collectible)+' — '+USD(a.paid-a.collectible)+' over'}); });
    // C. money collected 14+ days ago but the tech still hasn't been paid out (a missed payout)
    completed.forEach(function(j){
      var iv=invByJob[j.id]; if(!iv || !j.technician_id) return;
      var rule=window.PayCalc.ruleFor(techById[j.technician_id], compDef);
      var pj=window.PayCalc.jobPay(j, iv, rule, paidByTechJob[j.technician_id+'|'+j.id]||0);
      if(pj.owed_now_cents>0 && iv.paid_at){ var ageD=Math.floor((nowMs-Date.parse(iv.paid_at))/864e5); if(ageD>=14) recExc.push({msg:'📌 '+esc(techById[j.technician_id]?techById[j.technician_id].name:'Tech')+' owed '+USD(pj.owed_now_cents)+' — collected '+ageD+' days ago, not paid out'}); }
    });
    // warranty context (informational, not an exception): the expected haircut + what's still owed by vendors
    var warrShort=0, awaitWarr=0, awaitN=0;
    jobs.forEach(function(j){ if(!j.warranty_company) return; var iv=invByJob[j.id]; if(!iv||!(iv.total_cents>0)) return; if(iv.status==='paid'){ var s=iv.total_cents-(iv.collected_cents||0); if(s>0) warrShort+=s; } else { awaitWarr+=(iv.total_cents-(iv.collected_cents||0)); awaitN++; } });
    var reconcileSection =
      '<div class="sec">🔎 Reconcile <span class="lock">🔒 owner only</span></div>'+
      (recExc.length===0
        ? '<div class="money" style="border-left:3px solid #12a150"><div class="row"><span class="k">✅ This period balances</span><span class="v">nothing to review</span></div></div>'
        : '<div class="money" style="border-left:3px solid #c77700">'+recExc.map(function(e){ return '<div class="row"><span class="k">'+e.msg+'</span></div>'; }).join('')+'</div>')+
      ((warrShort>0||awaitN>0)? '<div class="note">'+(warrShort>0?'Warranty shortfall this period: '+USD(warrShort)+' (expected — vendors pay less than billed). ':'')+(awaitN>0?'Awaiting warranty payment: '+USD(awaitWarr)+' across '+awaitN+' job'+(awaitN===1?'':'s')+'.':'')+'</div>':'')+
      '<div class="note">Checks the money that actually moved against what your rules say should have — so YOU catch any drift, not a tech.</div>';

    // Per-tech watch table (owner-only): jobs, completed, first-stop %, condemn %, reassign %.
    var techName={}; (techs||[]).forEach(function(t){ techName[t.id]=t.name; });
    var agg={};
    jobs.forEach(function(j){
      if(!j.technician_id) return;
      if(!(since===0 || (j.created_at && Date.parse(j.created_at)>=since))) return;
      var a=agg[j.technician_id]||(agg[j.technician_id]={jobs:0,completed:0,fsK:0,fsY:0,cond:0});
      a.jobs++;
      if(j.status==='completed') a.completed++;
      if(j.first_stop===true||j.first_stop===false){ a.fsK++; if(j.first_stop===true) a.fsY++; }
      if(j.xano_status==='no_fix_possible') a.cond++;
    });
    var trows=Object.keys(agg).map(function(id){ var a=agg[id]; return {
      name: techName[id]||'—', jobs:a.jobs, completed:a.completed,
      fs: a.fsK>0?Math.round(100*a.fsY/a.fsK):null,
      cond: a.jobs>0?Math.round(1000*a.cond/a.jobs)/10:0
    }; }).filter(function(r){ return r.jobs>0; }).sort(function(x,y){ return (y.fs==null?-1:y.fs)-(x.fs==null?-1:x.fs); });
    var techTable = trows.length ? (
      '<div class="ptwrap"><table class="pt"><thead><tr><th>Tech</th><th>Jobs</th><th>Done</th><th>First-stop</th><th>Condemn</th><th>Reassign</th></tr></thead><tbody>'+
      trows.map(function(r){ return '<tr><td class="nm">'+esc(r.name)+'</td><td>'+r.jobs+'</td><td>'+r.completed+'</td><td class="good">'+(r.fs==null?'—':r.fs+'%')+'</td><td'+(r.cond>=8?' class="hi"':'')+'>'+r.cond+'%</td><td class="mut">—</td></tr>'; }).join('')+
      '</tbody></table></div><div class="note">Condemn = recommend-replacement ÷ jobs (owner watch, not a leaderboard). First-stop from the repair reports. Reassign % lands with the next data pull.</div>'
    ) : '<div class="note">No per-tech data in this window.</div>';

    // Feature gate: the office/money dashboard needs the job board (database) or pay entitlement.
    // Default-open on an empty features map, so demo / unpopulated / pre-entitlement shops are
    // never hidden. An AI-Answering-only shop sees Ann's usage + an upgrade path instead.
    var PF = window.PlatformFeatures || { has: function(){ return true; } };
    if(!(PF.has(features,'database') || PF.has(features,'pay'))){
      shell(
        '<div class="sec">Ann this week</div>'+
        '<div id="annWeek"><div class="note">Loading…</div></div>'+
        '<div class="sec">This month</div>'+
        '<div id="usageCard"><div class="note">Loading your usage…</div></div>'+
        '<div class="sec">Your full office</div>'+
        '<div class="money"><div class="note">You’re on the <b>AI Answering</b> plan — Ann answers 24/7 and captures every lead. Upgrade to the <b>Full Office Platform</b> to unlock the job board, scheduling, invoicing, and tech pay — one system your whole shop runs on.</div>'+
        '<button id="upsell" style="width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;font-size:14px;cursor:pointer">See the Full Office Platform →</button></div>'
      );
      loadAnnWeek(); loadUsage();
      var up=document.getElementById('upsell'); if(up) up.onclick=function(){ location.href='/platform/signup.html?plan=office'; };
      return;
    }

    var body =
      goalsCard(settings, takeHome, collected, win)+
      '<div id="antLearned"></div>'+
      '<div class="sec">Performance — front and center</div>'+
      '<div class="hero">'+
        tile('🥇 First-Stop Completion', firstStop+'%', 'of '+fsKnown.length+' completed jobs with a report', true, '', 'Fixed on the first visit, no return trip for parts. From the tech\'s repair report; only counts jobs we have a report for.')+
        tile('💚 Callbacks', callbackRate+'%', callbackCust+' customers back within 30 days', false, '', '')+
        tile('🔁 Recommend Replacement', String(recRep), 'machines called not-worth-fixing', false, '', 'Owner outlier-watch — NOT a leaderboard metric. Per-tech below so a guy with too many is obvious.')+
        tile('✅ Completed', String(completed.length), 'jobs finished this period', false, '', '')+
      '</div>'+
      '<div class="sec">Pipeline</div>'+
      '<div class="stat-strip">'+
        spill('#2563eb','Scheduled', byStatus.scheduled||0)+
        spill('#7c3aed','Awaiting parts', byStatus.awaiting_parts||0)+
        spill('#b45309','In progress', byStatus.in_progress||0)+
        spill('#3f8f24','Completed', byStatus.completed||0)+
        spill('#64748b','New', byStatus['new']||0)+
      '</div>'+
      '<div class="sec">Job mix</div>'+
      '<div class="stat-strip">'+
        spill('#3f8f24','Warranty', warranty)+
        spill('#b45309','Cash / self-pay', cash)+
      '</div>'+
      '<div class="sec">📥 Emailed jobs <span class="lock">warranty dispatches, automatic</span></div>'+
      '<div id="emailIntake"><div class="note">Loading…</div></div>'+
      '<div class="sec">Per-tech <span class="lock">🔒 owner only</span></div>'+
      techTable+
      '<div class="sec">Ann this week</div>'+
      '<div id="annWeek"><div class="note">Loading…</div></div>'+
      '<div class="sec">This month</div>'+
      '<div id="usageCard"><div class="note">Loading your usage…</div></div>'+
      '<div class="sec">Money <span class="lock">🔒 owner only</span></div>'+
      '<div class="money">'+
        mrow('Invoiced (from the job tile)','',USD(billed))+
        mrow('Collected','',USD(collected))+
        mrow('Outstanding (owed to shop)','',USD(outstanding))+
        mrow('Owed to techs (collected, not paid)','',USD(owedToTechs))+
        (partsCost>0||partsRev>0 ? mrow('Parts margin','charged '+USD(partsRev)+' · cost '+USD(partsCost),USD(partsMargin)) : '')+
        mrow('Take-home (after tech pay + parts)','before overhead',USD(takeHome))+
      '</div>'+
      (invWin.length===0
        ? '<div class="note">No invoices in this window yet. As jobs get billed on the platform, billed / collected / owed-to-techs / take-home fill in here automatically — from the same invoice, entered once.</div>'
        : '<div class="note">From '+invWin.length+' invoice'+(invWin.length===1?'':'s')+'. Take-home is collected revenue minus the techs’ collected cut and what the parts cost you. Your parts margin ('+mPct+'%) is set below — the tech only enters cost, the price fills itself in.</div>')+
      (payTable ? '<div class="sec">Tech pay <span class="lock">🔒 owner only</span></div>'+payTable+'<div class="note">Earned = cut if it pays in full · Collected = invoice paid · Owed now = collected but not yet paid out. All from the job’s invoice + this tech’s commission rule.</div>' : '')+
      '<div class="sec">Card payments <span class="lock">🔒 owner only</span></div>'+
      '<div id="payConnect"><div class="note">Loading…</div></div>'+
      reconcileSection+
      commissionEditor(techs, compDef)+
      partsPricingEditor(settings)+
      '<div class="sec">🐜 Ant’s activity — what changed <span class="lock">↩ reversible</span></div>'+
      '<div id="antLedger"><div class="note">Loading…</div></div>';
    shell(body);
    bindCommission();
    bindPartsPricing();
    bindPayouts();
    bindGoals();
    loadLearned();
    loadAnnWeek();
    loadUsage();
    loadPayments();
    loadEmailIntake();
    loadLedger();
    mountAnt();
  }

  // ---- Ant action ledger bridge: the human UI writes through the SAME audited path Ant uses,
  // so every change lands in owner_action with an Undo (platform-owner-action.js).
  function sessTok(){ return sb.auth.getSession().then(function(s){ return (s&&s.data&&s.data.session&&s.data.session.access_token)||''; }); }
  function ownerAction(doo, body){ return sessTok().then(function(tok){ return fetch('/.netlify/functions/platform-owner-action?do='+doo,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({access_token:tok},body||{}))}).then(function(r){return r.json();}).catch(function(){return {ok:false,error:'network'};}); }); }

  function windowWord(w){ return w==='month'?'this month':(w==='week'?'this week':(w==='quarter'?'this quarter':(w==='year'?'this year':''))); }
  function goalsCard(settings, takeHome, collected, win){
    var g=(settings&&settings.goals)||{};
    var thGoal=(g.take_home!=null)?+g.take_home:null, rGoal=(g.rating!=null)?+g.rating:null, thTile, rTile;
    if(thGoal>0){
      var prog=Math.max(0,Math.min(1, takeHome/thGoal)), p=Math.round(prog*100), pace='';
      if(win==='month'){
        var now=new Date(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), el=now.getDate()/dim, d=(prog-el)*thGoal;
        pace = d>=0 ? '<span class="pace ahead">▲ Ahead of pace by '+USD(Math.round(d))+'</span>'
                    : '<span class="pace behind">▼ Behind pace by '+USD(Math.round(-d))+'</span>';
      }
      thTile='<div class="goal"><div class="gt">💰 Take-home goal</div>'+
        '<div class="gbar"><div class="gfill" style="width:'+p+'%"></div></div>'+
        '<div class="gnums"><b>'+USD(takeHome)+'</b> of '+USD(thGoal)+' · '+p+'% '+windowWord(win)+'</div>'+pace+
        '<div><button class="glink" data-goal="take_home">Edit goal</button></div></div>';
    } else {
      thTile='<div class="goal"><div class="gt">💰 Take-home goal</div><div class="gmut">🐜 Set your monthly take-home target and I’ll chase it with you — and show you the fastest way to close the gap.</div><button class="gset" data-goal="take_home">Set my goal</button></div>';
    }
    if(rGoal){
      rTile='<div class="goal"><div class="gt">⭐ Rating goal</div><div class="gbig">'+(+rGoal).toFixed(1)+'★</div><div class="gmut">I’ll track this as your reviews come in. Connect your Google reviews to see live progress toward it.</div><button class="glink" data-goal="rating">Edit goal</button></div>';
    } else {
      rTile='<div class="goal"><div class="gt">⭐ Rating goal</div><div class="gmut">🐜 Set a customer-rating target too — happy customers are what feed the take-home goal.</div><button class="gset" data-goal="rating">Set my goal</button></div>';
    }
    return '<div class="sec">Your goals <span class="lock">🔒 you set them, Ant chases them</span></div><div class="goals2">'+thTile+rTile+'</div>';
  }
  function bindGoals(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal]'), function(btn){
      btn.onclick=function(){
        var kind=btn.getAttribute('data-goal'), g=(settings&&settings.goals)||{}, orig=btn.textContent;
        if(kind==='take_home'){
          var cur=(g.take_home!=null)?Math.round(g.take_home/100):'';
          var v=prompt('Your take-home goal for the month ($):', cur); if(v==null) return;
          var n=parseInt(String(v).replace(/[^0-9]/g,''),10); if(!n) return;
          btn.disabled=true; btn.textContent='Saving…';
          ownerAction('apply',{intent:'set_goal',args:{kind:'take_home',value:n*100},via:'ui'}).then(function(r){ if(r&&r.ok){ load(); } else { alert('Could not save: '+((r&&r.error)||'error')); btn.disabled=false; btn.textContent=orig; } });
        } else {
          var curR=(g.rating!=null)?g.rating:'';
          var vr=prompt('Your customer-rating goal (e.g. 4.7):', curR); if(vr==null) return;
          var nr=parseFloat(vr); if(!nr||nr>5) return;
          btn.disabled=true; btn.textContent='Saving…';
          ownerAction('apply',{intent:'set_goal',args:{kind:'rating',value:nr},via:'ui'}).then(function(r){ if(r&&r.ok){ load(); } else { alert('Could not save: '+((r&&r.error)||'error')); btn.disabled=false; btn.textContent=orig; } });
        }
      };
    });
  }
  // #4 — what Ant has learned about the shop (from the action log). Insight + one-tap default.

    });
  }
  var LEDGER_IC={set_parts_margin:'🔧',toggle_comms:'🔕',set_comms_text:'✏️',set_goal:'🎯',set_tech_commission:'💰',set_tech_stops:'🚚',set_tech_area:'📍',add_tech_dayoff:'🌴'};
  function loadLedger(){
    var el=document.getElementById('antLedger'); if(!el) return;
    ownerAction('list',{limit:12}).then(function(r){
      if(!r||!r.ok){ el.innerHTML='<div class="note">Couldn’t load the activity log.</div>'; return; }
      var rows=r.actions||[];
      if(!rows.length){ el.innerHTML='<div class="note">Nothing yet. When you or Ant change a setting — a margin, a text, a day off — it shows here with an Undo. Nothing is a one-way door.</div>'; return; }
      el.innerHTML='<div class="ledger">'+rows.map(function(a){
        var who=(a.actor==='ant')?'🐜 Ant':'You';
        var when=a.created_at?new Date(a.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
        var rev=(a.status==='reversed');
        var right = rev ? '<span class="revd">↩ Reversed</span>' : '<button class="undo" data-uid="'+esc(a.id)+'">Undo</button>';
        return '<div class="lrow'+(rev?' rev':'')+'"><div class="li">'+(LEDGER_IC[a.intent]||'🐜')+'</div>'+
          '<div class="lb"><div class="la">'+esc(a.label)+'</div><div class="lm"><span class="who">'+who+'</span> · '+esc(when)+(a.via==='ant'?' · acted for you':'')+'</div></div>'+right+'</div>';

  // Pause / resume Ann — the owner's kill switch (e.g. after hitting the weekly minutes). Confirms
  // first (pausing stops call answering), calls platform-phone, then refreshes the card.
  function toggleAnn(pause, btn){
    if(pause && !confirm('Pause Ann? Incoming calls will stop being answered by your AI until you resume. Your number stays yours.')) return;

  // "Mark paid" — records a tech_payout per collected-unpaid job (so the tech's 'paid' fills
  // in, owed drops to 0, and a per-job pay history builds). Money action → confirm first.
  function bindPayouts(){
    Array.prototype.forEach.call(document.querySelectorAll('.markpaid'), function(btn){
      btn.onclick=function(){
        var id=btn.getAttribute('data-tech'); var jobs=payJobs[id]||[]; if(!jobs.length) return;
        var total=jobs.reduce(function(s,j){return s+j.owed_cents;},0);
        if(!confirm('Record '+USD(total)+' paid to this tech across '+jobs.length+' job'+(jobs.length===1?'':'s')+'? This marks their pay as handed over.')) return;
        var period=new Date().toISOString().slice(0,7);
        var rows=jobs.map(function(j){ return { company_id:companyId, technician_id:id, job_id:j.job_id, amount_cents:j.owed_cents, period:period, note:'payout' }; });
        btn.disabled=true; btn.textContent='Recording…';
        sb.from('tech_payout').insert(rows).then(function(r){
          if(r.error){ btn.disabled=false; btn.textContent='Retry'; alert('Could not record: '+r.error.message); return; }
          load();
        });
      };
    });
  }

  // Owner's own month-to-date phone usage vs their plan allowance. NO cost / provider —
  // just "you've used X of your Y". RLS scopes usage_event + client_plan to this shop.
  function loadUsage(){
    var el=document.getElementById('usageCard'); if(!el) return;
    var d=new Date(); var mStart=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)).toISOString();
    Promise.all([
      sb.from('usage_event').select('kind,qty,at').gte('at',mStart).limit(10000),
      sb.from('client_plan').select('included_voice_min,included_sms,tier').limit(1)
    ]).then(function(res){
      var evs=(res[0].data)||[], plan=(res[1].data&&res[1].data[0])||{included_voice_min:500,included_sms:200,tier:'starter'};
      var vmin=0, sms=0; evs.forEach(function(e){ if(e.kind==='voice_min') vmin+=Number(e.qty)||0; else if(e.kind==='sms_out') sms+=Number(e.qty)||0; });
      vmin=Math.round(vmin); sms=Math.round(sms);
      var vpct=plan.included_voice_min?Math.min(100,Math.round(vmin/plan.included_voice_min*100)):0;
      var spct=plan.included_sms?Math.min(100,Math.round(sms/plan.included_sms*100)):0;
      function bar(p){ var col=p>=100?'#d33c3c':(p>=80?'#c77700':'#2f6bff'); return '<div style="height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px"><div style="height:100%;width:'+p+'%;background:'+col+'"></div></div>'; }
      function line(icon,label,used,inc,p){ return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+icon+' '+label+'</span><span style="font-variant-numeric:tabular-nums"><b>'+used.toLocaleString()+'</b> <span style="color:var(--muted)">of '+inc.toLocaleString()+'</span></span></div>'+bar(p)+'</div>'; }
      var near = (vpct>=80||spct>=80);
      el.innerHTML='<div class="money">'+
        line('📞','Call minutes',vmin,plan.included_voice_min,vpct)+
        line('💬','Texts',sms,plan.included_sms,spct)+
      '</div>'+
      '<div class="note">'+(vmin===0&&sms===0
        ? 'No phone usage yet this month — this fills in as calls + texts run through your Ant line.'
        : (near ? '⚠️ You’re getting close to your monthly included amount.' : 'You’re comfortably within your plan.'))+
      ' We also email you this once a day.</div>';
    }).catch(function(){ el.innerHTML='<div class="note">Usage will show here once your line is active.</div>'; });
  }

  // ---- Ant partner dock: talks to platform-ant (role-aware brain). Acts through the SAME
  // ledger, so its changes show in the activity feed with an Undo. Mounted on <body> once so
  // it survives full re-renders of #app.
  var antHist=[], antMode='act';
  function antAsk(message, mode){ return sessTok().then(function(tok){ return fetch('/.netlify/functions/platform-ant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:tok,message:message,mode:mode,history:antHist.slice(-8)})}).then(function(r){return r.json();}).catch(function(){return {ok:false,error:'network'};}); }); }
  function mountAnt(){
    if(window.__antMounted) return; window.__antMounted=true;
    var fab=document.createElement('button'); fab.className='antfab'; fab.title='Ask Ant'; fab.textContent='🐜'; document.body.appendChild(fab);
    var pan=document.createElement('div'); pan.className='antpanel';
    pan.innerHTML=
      '<div class="aph"><div class="m">🐜</div><div><h4>Ant</h4><p>Your partner — ask or tell me to do something</p></div><button class="x" title="Close">×</button></div>'+
      '<div class="leash2"><button data-m="advise">Advise</button><button data-m="propose">Propose</button><button data-m="act" class="on">Act</button></div>'+
      '<div class="athread" id="athread"><div class="abub ant">Morning 🐜 — I can see your whole shop. Ask me <b>“am I on track?”</b>, or just tell me what to change — “bump parts margin to 55%,” “give Lee Friday off.” Everything I do lands in your activity log with an Undo.</div></div>'+
      '<div class="aquick"><button data-say="How am I doing on my take-home goal this month?">Am I on track?</button><button data-say="What\'s the fastest way to close my goal gap?">Fastest way to my goal?</button><button data-say="Who\'s my best tech this month?">Best tech?</button></div>'+
      '<form class="acomp" id="acomp"><input id="aask" placeholder="Ask Ant, or tell it to do something…" autocomplete="off"><button class="s" type="submit" title="Send">↑</button></form>';
    document.body.appendChild(pan);
    var thread=pan.querySelector('#athread');
    fab.onclick=function(){ pan.classList.toggle('open'); if(pan.classList.contains('open')) pan.querySelector('#aask').focus(); };
    pan.querySelector('.x').onclick=function(){ pan.classList.remove('open'); };
    Array.prototype.forEach.call(pan.querySelectorAll('.leash2 button'), function(b){ b.onclick=function(){ antMode=b.getAttribute('data-m'); Array.prototype.forEach.call(pan.querySelectorAll('.leash2 button'),function(x){x.classList.toggle('on',x===b);}); }; });
    function bub(html,who){ var d=document.createElement('div'); d.className='abub '+who; d.innerHTML=html; thread.appendChild(d); thread.scrollTop=thread.scrollHeight; return d; }
    function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
    function send(text){
      if(!text) return;
      antHist.push({role:'user',content:text}); bub(esc(text),'me');
      var typing=document.createElement('div'); typing.className='atype'; typing.innerHTML='<span></span><span></span><span></span>'; thread.appendChild(typing); thread.scrollTop=thread.scrollHeight;
      antAsk(text,antMode).then(function(r){
        typing.remove();
        if(!r||!r.ok){ bub('Sorry — I hit a snag: '+esc((r&&r.error)||'try again')+'.','ant'); return; }
        antHist.push({role:'assistant',content:r.reply||''});
        var b=bub(md(r.reply||'Done.'),'ant');
        // proposals → Confirm buttons (owner taps to actually apply via the ledger)
        if(r.proposals&&r.proposals.length){
          var wrap=document.createElement('div'); wrap.className='aprop';
          r.proposals.forEach(function(pr){
            var go=document.createElement('button'); go.className='go'; go.textContent='Confirm';
            go.onclick=function(){ go.disabled=true; go.textContent='…'; ownerAction('apply',{intent:pr.intent,args:pr.args,via:'ui'}).then(function(x){ if(x&&x.ok){ go.textContent='✓ '+(x.label||'Done'); load(); } else { go.textContent='Failed'; } }); };
            var no=document.createElement('button'); no.textContent='Not now'; no.onclick=function(){ wrap.remove(); };
            wrap.appendChild(go); wrap.appendChild(no);
          });
          b.appendChild(wrap);
        }
        // real actions taken → refresh the page numbers + ledger (panel persists on body)
        if(r.actions&&r.actions.length){ load(); }
      });
    }
    Array.prototype.forEach.call(pan.querySelectorAll('.aquick button'), function(b){ b.onclick=function(){ pan.classList.add('open'); send(b.getAttribute('data-say')); }; });
    pan.querySelector('#acomp').addEventListener('submit',function(e){ e.preventDefault(); var i=pan.querySelector('#aask'); var v=i.value.trim(); i.value=''; send(v); });
  }

  // Parts margin — ONE slider sets what every part is marked up. The tech enters only the cost;
  // the customer price = max(cost × (1+markup), cost + minimum-added), everywhere, automatically.
  function partsPricingEditor(settings){
    var p=(settings&&settings.parts)||{};
    var pct=(p.markup_pct!=null?+p.markup_pct:50), minAdd=(+p.min_add_cents||0);
    return '<div class="sec">Parts pricing <span class="lock">🔒 owner only</span></div>'+
      '<div class="money" style="padding:16px">'+
        '<div class="note" style="margin:0 0 12px">Set your parts margin once. Your tech just enters what the part <b>cost</b> — the customer price fills in by itself, so nobody has to ask or look it up.</div>'+
        '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px"><span style="font-weight:800;font-size:14px">Markup on parts</span><span style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums"><span id="ppPctV">'+pct+'</span>%</span></div>'+
        '<input id="ppSlider" type="range" min="0" max="200" step="5" value="'+pct+'" style="width:100%;accent-color:#2f6bff">'+
        '<div class="row" style="margin-top:12px"><span class="k">And add at least</span><span class="v">$<input id="ppMin" inputmode="decimal" style="width:70px" value="'+(minAdd?(minAdd/100).toFixed(2):'')+'" placeholder="0.00"></span></div>'+
        '<div class="note" style="margin:2px 0 12px">Protects small parts — e.g. a $3 part still adds a fair minimum, not pennies. Leave blank for none.</div>'+
        '<div id="ppEx" style="border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px"></div>'+
        '<button id="ppSave" style="width:100%;margin-top:12px;padding:11px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;border:0;background:#2f6bff;color:#fff">Save parts margin</button>'+
        '<div id="ppMsg" class="note" style="margin-top:8px"></div>'+
      '</div>';
  }
  function bindPartsPricing(){
    var sl=document.getElementById('ppSlider'); if(!sl) return;
    var pctV=document.getElementById('ppPctV'), minI=document.getElementById('ppMin'), ex=document.getElementById('ppEx'), save=document.getElementById('ppSave'), msg=document.getElementById('ppMsg');
    var retail=function(costC,pct,minAdd){ costC=+costC||0; if(costC<=0) return 0; return Math.max(Math.round(costC*(1+pct/100)), costC+minAdd); };
    var money=function(c){ return '$'+((+c||0)/100).toFixed(2); };
    function draw(){
      var pct=+sl.value; pctV.textContent=pct;
      var minAdd=Math.round((parseFloat(minI.value)||0)*100);
      ex.innerHTML='<div class="row" style="background:var(--bg,rgba(0,0,0,.02));font-weight:700"><span class="k">A part that costs you</span><span class="v">the customer pays</span></div>'+
        [500,2500,9000].map(function(c){ return '<div class="row"><span class="k">'+money(c)+'</span><span class="v" style="color:#12a150;font-weight:800">'+money(retail(c,pct,minAdd))+'</span></div>'; }).join('');
    }
    sl.oninput=draw; minI.oninput=draw; draw();
    save.onclick=function(){
      var pct=+sl.value, minAdd=Math.round((parseFloat(minI.value)||0)*100);
      save.disabled=true; save.textContent='Saving…';
      // route through the ledger — same audited path Ant uses, so this change gets an Undo too
      ownerAction('apply',{intent:'set_parts_margin',args:{markup_pct:pct,min_add_cents:minAdd>0?minAdd:0},via:'ui'}).then(function(r){
        save.disabled=false; save.textContent='Save parts margin';
        if(!r||!r.ok){ msg.textContent='Could not save: '+((r&&r.error)||'try again'); return; }
        msg.textContent='Saved. Every part is now marked up '+pct+'%'+(minAdd>0?' (min +'+money(minAdd)+')':'')+' — techs enter cost, the price fills itself in. (Undo below.)'; load();
      });
    };
  }
  function bindCommission(){
    var msg=document.getElementById('commMsg');
    var save=document.getElementById('commSave');
    Array.prototype.forEach.call(document.querySelectorAll('.ovRemove'), function(btn){
      btn.onclick=function(){ var tr=btn.closest('tr'); setTechActive(tr.getAttribute('data-tech'), false, btn); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.ovRestore'), function(btn){
      btn.onclick=function(){ setTechActive(btn.getAttribute('data-tech'), true, btn); };
    });
    // Add a crew member — creates their login + technician row, scoped to THIS shop (the
    // function derives the company from the owner's own session token). Shows the temp
    // password once so the owner can hand it to their tech.
    var ntAdd=document.getElementById('ntAdd');
    if(ntAdd) ntAdd.onclick=function(){
      var nm=(document.getElementById('ntName').value||'').trim();
      var em=(document.getElementById('ntEmail').value||'').trim();
      var ph=(document.getElementById('ntPhone').value||'').trim();
      var pc=parseFloat(document.getElementById('ntPct').value);
      var nmsg=document.getElementById('ntMsg');
      if(!nm||!em){ if(nmsg) nmsg.textContent='Enter a name and an email.'; return; }
      ntAdd.disabled=true; ntAdd.textContent='Adding…';
      sb.auth.getSession().then(function(s){
        var tok=s&&s.data&&s.data.session&&s.data.session.access_token;
        return fetch('/.netlify/functions/platform-provision?action=addtech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:tok,tech_email:em,tech_name:nm,tech_phone:ph||undefined,commission_pct:isNaN(pc)?undefined:pc})}).then(function(r){return r.json();});
      }).then(function(d){
        ntAdd.disabled=false; ntAdd.textContent='Add tech + create login';
        if(!d||!d.ok){ if(nmsg) nmsg.textContent='Could not add: '+((d&&d.error)||'try again'); return; }
        var pw=d.login&&d.login.temp_password;
        if(nmsg) nmsg.innerHTML='✅ '+esc(nm)+' added. '+(pw? 'Temp password: <b>'+esc(pw)+'</b> — give it to them with their email ('+esc(em)+'); they change it on first sign-in at the tech app.' : 'They already had a login — no new password needed.');
        document.getElementById('ntName').value=''; document.getElementById('ntEmail').value=''; document.getElementById('ntPhone').value='';
        load();
      }).catch(function(){ ntAdd.disabled=false; ntAdd.textContent='Add tech + create login'; if(nmsg) nmsg.textContent='Could not add — try again.'; });
    };
    if(save) save.onclick=function(){
      var type=document.getElementById('commType').value;
      var v=parseFloat(document.getElementById('commVal').value)||0;
      var comm = type==='flat_per_job' ? {type:'flat_per_job',flat_cents:Math.round(v*100)} : {type:'labor_pct',labor_pct:v};
      save.disabled=true; save.textContent='Saving…';
      var next=Object.assign({}, settings, {commission:comm});
      sb.from('company').update({settings:next}).eq('id',companyId).then(function(r){
        save.disabled=false; save.textContent='Save';
        if(r.error){ if(msg){msg.textContent='Could not save: '+r.error.message;} return; }
        settings=next; if(msg){msg.textContent='Saved. Every tech now defaults to '+window.PayCalc.ruleLabel(window.PayCalc.companyDefault(settings))+'.';} load();
      });
    };
    Array.prototype.forEach.call(document.querySelectorAll('.ovSave'), function(btn){
      btn.onclick=function(){
        var tr=btn.closest('tr'); var techId=tr.getAttribute('data-tech');
        var type=tr.querySelector('.ovType').value;
        var v=parseFloat(tr.querySelector('.ovVal').value)||0;
        var upd = type==='labor_pct' ? {commission_type:'labor_pct',commission_pct:v,commission_flat_cents:null}
                : type==='flat_per_job' ? {commission_type:'flat_per_job',commission_pct:null,commission_flat_cents:Math.round(v*100)}
                : {commission_type:null,commission_pct:null,commission_flat_cents:null};
        var stEl=tr.querySelector('.ovStops'); var st=stEl?parseInt(stEl.value,10):NaN; upd.max_stops=(!isNaN(st)&&st>0)?st:null;
        var arEl=tr.querySelector('.ovArea'); var ar=(arEl&&arEl.value||'').trim(); upd.service_area=ar||null;
        var phEl=tr.querySelector('.ovPhone'); var ph=(phEl&&phEl.value||'').trim();
        btn.disabled=true; btn.textContent='…';
        sb.from('technician').update(upd).eq('id',techId).then(function(r){
          if(r.error){ btn.disabled=false; btn.textContent='Save'; if(msg){msg.textContent='Could not save override: '+r.error.message;} return; }
          if(!ph){ btn.disabled=false; btn.textContent='Save'; if(msg){msg.textContent='Override saved.';} load(); return; }
          // also set the tech's cell so assignment texts reach them
          sb.auth.getSession().then(function(s){
            var tok=(s&&s.data&&s.data.session&&s.data.session.access_token)||'';
            return fetch('/.netlify/functions/platform-provision?action=settech_phone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:tok,tech_id:techId,phone:ph})}).then(function(x){return x.json();});
          }).then(function(d){
            btn.disabled=false; btn.textContent='Save';
            if(msg){ msg.textContent=(d&&d.ok)?'Saved — cell set for job texts.':('Override saved, but cell: '+((d&&d.error)||'failed')); }
            load();
          }).catch(function(){ btn.disabled=false; btn.textContent='Save'; if(msg){msg.textContent='Override saved (cell save failed).';} load(); });
        });
      };
    });
  }

  function tile(lab, big, foot, accent, badge, tip){
    var b = badge==='prelim' ? '<span class="badge prelim">prelim</span>' : (badge==='soon'?'<span class="badge soon">soon</span>':'');
    return '<div class="tile'+(accent?' accent':'')+'"'+(tip?' title="'+esc(tip)+'"':'')+'>'+
      '<div class="lab">'+esc(lab)+' '+b+'</div><div class="big">'+esc(big)+'</div><div class="foot">'+esc(foot)+'</div></div>';
  }
  function spill(color,k,v){ return '<div class="pill"><span class="dotmark" style="background:'+color+'"></span><b>'+v+'</b><span class="k">'+esc(k)+'</span></div>'; }
  function mrow(k,sub,v){ return '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+v+'</span></div>'; }

  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) boot(); else renderSignIn(); });
})();
</script>
