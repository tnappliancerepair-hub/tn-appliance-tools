<!doctype html>
<html lang="en" data-live="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your Repair — Ant</title>
<!--
  Ant platform — CUSTOMER PORTAL (multi-tenant reference surface).
  Token-gated, NO login: the shop mints a portal_grant and hands the customer
  /platform/portal.html?t=<token>. The page calls two SECURITY DEFINER functions
  (docs/sql/005_portal_access.sql) with the anon key — portal_get shows ONLY this
  customer's status + conversation, portal_post_message lets them reply. They can
  never see another customer's data (the functions enforce the token). Branded per
  shop from company.settings. Same core as the office board — a different lens.
-->
<style>
  :root{
    --bg:#f5f7f3; --panel:#ffffff; --ink:#131711; --muted:#606753; --line:#e5e8de;
    --accent:#3f8f24; --accent-ink:#ffffff; --chip:#eef2e8; --shadow:0 1px 2px rgba(20,30,10,.06),0 8px 26px rgba(20,30,10,.06);
    --bubble-in:#eef2e8; --bubble-out:#3f8f24;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f120b; --panel:#171b11; --ink:#eef2e6; --muted:#9aa38c; --line:#282f1f; --chip:#20281a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); --bubble-in:#20281a; --bubble-out:#3f8f24;
  }}
  :root[data-theme="dark"]{
    --bg:#0f120b; --panel:#171b11; --ink:#eef2e6; --muted:#9aa38c; --line:#282f1f; --chip:#20281a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); --bubble-in:#20281a; --bubble-out:#3f8f24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .shell{max-width:560px;margin:0 auto;padding:18px 16px 40px}
  header{display:flex;align-items:center;gap:10px;padding:6px 2px 16px}
  header .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:19px}
  header .shop{font-weight:800;font-size:18px;line-height:1.1}
  header .call{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:7px 11px;border-radius:9px}
  h1.greet{font-size:22px;margin:6px 2px 4px}
  .sub{color:var(--muted);margin:0 2px 18px;font-size:14.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .job-unit{font-weight:700;font-size:16px}
  .job-prob{color:var(--muted);font-size:14px;margin-top:3px}
  .badge{flex:0 0 auto;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;color:#fff;white-space:nowrap}
  .statusline{margin-top:12px;font-size:14.5px;background:var(--chip);border-radius:10px;padding:11px 13px}
  .meta{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:600}
  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 2px 10px;font-weight:700}
  .thread{display:flex;flex-direction:column;gap:9px}
  .bub{max-width:82%;padding:10px 13px;border-radius:15px;font-size:14.5px;box-shadow:var(--shadow)}
  .bub .who{display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
  .bub .tm{display:block;font-size:11px;opacity:.6;margin-top:4px}
  .bub.in{align-self:flex-start;background:var(--bubble-in);color:var(--ink);border-bottom-left-radius:5px}
  .bub.out{align-self:flex-end;background:var(--bubble-out);color:#fff;border-bottom-right-radius:5px}
  .bub.out .who,.bub.out .tm{opacity:.85}
  .composer{display:flex;gap:8px;margin-top:14px}
  .composer textarea{flex:1;resize:none;min-height:46px;max-height:140px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit}
  .composer button{border:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 18px;font-weight:800;font-size:15px;cursor:pointer}
  .composer button:disabled{opacity:.5;cursor:default}
  .center{max-width:420px;margin:14vh auto;text-align:center;padding:0 20px;color:var(--muted)}
  .center .big{font-size:44px;margin-bottom:10px}
  .center h2{color:var(--ink);margin:0 0 6px}
  .empty{color:var(--muted);font-size:14px;padding:4px 2px}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  .pmedia{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .plabel{font-size:12px;color:var(--muted);font-weight:700;margin-top:12px}
  .mtile{position:relative;display:inline-flex;width:70px;height:70px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0b0d08;align-items:center;justify-content:center;flex:0 0 auto}
  .mtile img{width:100%;height:100%;object-fit:cover;display:block}
  .vtile .vcover{position:absolute;inset:0}
  .vtile .play{position:absolute;color:#fff;font-size:23px;line-height:1;text-shadow:0 1px 5px rgba(0,0,0,.7);pointer-events:none}
  .bill{margin-top:12px;border-radius:11px;padding:11px 13px;font-size:14px;font-weight:700}
  .bill.covered{background:rgba(63,143,36,.1);color:var(--accent)}
  .invoice{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--panel)}
  .invoice .ihead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-bottom:8px}
  .invoice .ipill{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
  .invoice .ipill.paidp{background:rgba(18,161,80,.14);color:#12a150}
  .invoice .ipill.duep{background:rgba(180,83,9,.14);color:#b45309}
  .invoice .ir{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0;font-variant-numeric:tabular-nums}
  .invoice .ir span:first-child{color:var(--ink)}
  .invoice .ir.sub{color:var(--muted);font-size:13px;padding:3px 0}
  .invoice .ir.sub span{color:var(--muted)}
  .invoice .ir.credit span{color:#12a150;font-weight:700}
  .invoice .ir.itotal{border-top:1px solid var(--line);margin-top:5px;padding-top:9px;font-weight:800;font-size:16px}
  .invoice .ifoot{margin-top:9px;font-size:13px;font-weight:700}
  .invoice .ifoot.ipaid{color:#12a150}
  .invoice .ifoot.idue{color:var(--muted);font-weight:600}
  .offer{margin-top:12px;border:1px solid var(--accent);border-radius:12px;padding:12px 13px;background:rgba(63,143,36,.07)}
  .offer .ohd{font-weight:800;font-size:14.5px;margin-bottom:9px}
  .offer .orow{display:flex;gap:9px}
  .offer .oyes{flex:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px;font-weight:800;font-size:15px;cursor:pointer}
  .offer .ono{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer}
  .offer.pend{border-color:var(--line);background:var(--panel);font-weight:600;font-size:13.5px;color:var(--muted)}
  .reqwrap{margin-top:12px}
  .reqbtn{width:100%;background:var(--panel);border:1px dashed var(--accent);color:var(--accent);border-radius:11px;padding:12px;font-weight:800;font-size:14.5px;cursor:pointer}
  .reqform{margin-top:9px;display:flex;flex-direction:column;gap:9px}
  .canrow{margin-top:12px;text-align:center}
  .canbtn{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:4px}
  .payways{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .payways .pw-t{font-weight:800;font-size:13px}
  .paybtn{display:block;text-align:center;background:var(--accent);color:var(--accent-ink,#fff);text-decoration:none;border-radius:11px;padding:12px;font-weight:800;font-size:15px}
  .payline{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
  .payways .pw-x{font-size:12.5px;color:var(--muted)}
  .reqform input[type=date]{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .wsel{display:flex;gap:7px;flex-wrap:wrap}
  .wsel .wc{border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
  .wsel .wc.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .reqsend{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}
</style>
  <link rel="stylesheet" href="/platform/ant-theme.css">
</head>
<body>
<div class="shell" id="app"><div class="center"><div class="big">🐜</div><p>Loading…</p></div></div>

<script src="/platform/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var cfg = window.ANT_SUPABASE || {};
  var token = new URLSearchParams(location.search).get('t');
  var sb = null, state = null, pollTimer = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function center(icon, title, msg){ app.innerHTML = '<div class="center"><div class="big">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p></div>'; }

  if (!cfg.url || !cfg.anonKey) { center('🐜', 'Almost there', 'This portal isn\'t connected to a project yet.'); return; }
  if (!token) { center('🔗', 'Missing link', 'This page needs the link your shop texted you. Please tap that link again.'); return; }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  // Friendly, human status wording (customers never see raw status keys).
  var STATUS = {
    new:            { label: 'Received',       color: '#6b7280', line: 'We\'ve got your request and we\'re on it — we\'ll reach out to get you scheduled.' },
    scheduled:      { label: 'Scheduled',      color: '#2563eb', line: 'You\'re on the schedule. We\'ll text you a live arrival window the morning of your visit.' },
    in_progress:    { label: 'In progress',    color: '#b45309', line: 'Your tech is on it right now.' },
    awaiting_parts: { label: 'Waiting on part',color: '#7c3aed', line: 'We\'ve diagnosed it and we\'re waiting on the part. We\'ll reach out to schedule the fix as soon as it lands.' },
    completed:      { label: 'All done',       color: '#3f8f24', line: 'This one\'s complete. Thank you for trusting us — reply below if anything comes up.' },
    canceled:       { label: 'Canceled',       color: '#9ca3af', line: 'This request was canceled. Reply below if you\'d like to pick it back up.' },
  };
  function statusOf(k){ return STATUS[k] || { label: (k||'Open'), color: '#6b7280', line: 'We\'re on it — reply below anytime with questions.' }; }

  function fmtDay(d){ if(!d) return ''; try { return new Date(d + 'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}); } catch(e){ return d; } }
  function fmtWin(w){ return w==='am' ? 'mornings' : (w==='pm' ? 'afternoons' : 'anytime'); }
  // The three-way handshake, customer side: accept/decline a shop offer, or request a day.
  function respondOffer(id, accept, btn){
    btn.disabled = true;
    sb.rpc('portal_respond_offer', { p_token: token, p_offer_id: id, p_accept: accept }).then(function(r){
      btn.disabled = false;
      if (r.error || (r.data && r.data.ok === false)) { alert((r.data && r.data.error) || 'Please try again.'); return; }
      load(true);
    });
  }
  function requestDay(jid, btn){
    var d = document.getElementById('rd_'+jid); var day = d ? d.value : '';
    if (!day) { if (d) d.focus(); return; }
    var w = document.querySelector('#rw_'+jid+' .wc.on'); var win = w ? w.getAttribute('data-w') : 'any';
    btn.disabled = true; btn.textContent = 'Sending…';
    // Record the request AND text the shop's scheduler so it hits their phone right away.
    // (Falls back to the direct RPC if the endpoint is unreachable — the request still lands.)
    fetch('/.netlify/functions/platform-schedule-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ t: token, day: day, win: win }) })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (res && res.ok) { btn.disabled=false; btn.textContent='Send request'; load(true); return; }
        throw new Error((res && res.error) || 'failed');
      })
      .catch(function(){
        sb.rpc('portal_request_day', { p_token: token, p_day: day, p_win: win }).then(function(r){
          btn.disabled = false; btn.textContent = 'Send request';
          if (r.error || (r.data && r.data.ok === false)) { alert((r.data && r.data.error) || 'Please try again.'); return; }
          load(true);
        });
      });
  }
  function fmtTime(iso){ if(!iso) return ''; try { var dt=new Date(iso); return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+dt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); } catch(e){ return ''; } }
  function whoLabel(m){ if(m.direction==='in') return 'You'; var s=String(m.sender||''); if(/^office:/.test(s)) return s.slice(7); if(/^tech:/.test(s)) return s.slice(5); if(s==='ann'||s==='') return 'Ann'; return s; }

  // Photos live in tenant-scoped R2. Batch-sign the refs with THIS customer's portal token
  // (the signer folder-prefix-checks the token's company) and drop the URL into each tile.
  function hydratePortalPics() {
    var imgs = app.querySelectorAll('img[data-ph]'); if (!imgs.length) return;
    var refs = []; Array.prototype.forEach.call(imgs, function(el){ var r=el.getAttribute('data-ph'); if(r && refs.indexOf(r)<0) refs.push(r); });
    fetch('/.netlify/functions/platform-media-urls?t=' + encodeURIComponent(token), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ refs: refs }) })
      .then(function(x){ return x.json(); }).then(function(d){
        var urls = (d && d.urls) || {};
        Array.prototype.forEach.call(app.querySelectorAll('img[data-ph]'), function(el){ var u=urls[el.getAttribute('data-ph')]; if(!u) return; el.src=u; var a=el.closest('a[data-phhref]'); if(a) a.href=u; });
      }).catch(function(){});
  }

  function render() {
    var co = state.company || {}, cust = state.customer || {}, jobs = state.jobs || [], thread = state.thread || [];
    // The shop's OWN ways to pay (Zelle / Cash App / their card link) — surfaced so an unpaid
    // customer can pay right from the portal. The money goes straight to the shop, never through us.
    var payCfg = (co.settings && co.settings.pay) || null, payInstr = (co.settings && co.settings.pay_instructions) || '';
    function payWaysHtml(){
      var isUrl=function(v){ return /^https?:\/\//i.test(String(v||'')); };
      if (payCfg && payCfg.methods && payCfg.methods.length) {
        var items = payCfg.methods.map(function(m){
          var label = esc(m.label||m.type||'Pay');
          if (m.type==='link' || isUrl(m.value)) { var href=isUrl(m.value)?m.value:('https://'+m.value); return '<a class="paybtn" href="'+esc(href)+'" target="_blank" rel="noopener">💳 '+label+' →</a>'; }
          return '<div class="payline"><span>'+label+'</span><b>'+esc(m.value||'')+'</b></div>';
        }).join('');
        return '<div class="payways"><div class="pw-t">Ways to pay</div>'+items+(payCfg.note?'<div class="pw-x">'+esc(payCfg.note)+'</div>':'')+'</div>';
      }
      if (payInstr) return '<div class="payways">'+esc(payInstr)+'</div>';
      return '';
    }
    var settings = co.settings || {};
    var accent = settings.brand_color || '#3f8f24';
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--bubble-out', accent);
    var phone = settings.phone || '';
    var first = (cust.first_name || '').trim();

    var head = '<header><span class="logo">🐜</span><span class="shop">' + esc(co.name || 'Your shop') + '</span>' +
      (phone ? '<a class="call" href="tel:' + esc(phone.replace(/[^0-9+]/g,'')) + '">Call us</a>' : '') + '</header>';

    var greet = '<h1 class="greet">Hi' + (first ? ' ' + esc(first) : '') + ' 👋</h1>' +
      '<p class="sub">Here\'s where your ' + (jobs.length > 1 ? 'repairs stand' : 'repair stands') + ' — and you can message us anytime right here.</p>';

    var jobsHtml = jobs.length ? jobs.map(function (j) {
      var st = statusOf(j.status);
      var unit = j.unit_label || (j.unit && j.unit.label) || 'Your service';
      var day = fmtDay(j.scheduled_day);
      var techHtml = j.tech ? '<div class="meta"><span>Your tech: <b>' + esc(j.tech) + '</b></span></div>' : '';
      var media = j.media || [];
      var tiles = '';
      media.filter(function(m){ return m.kind==='video' && m.provider==='cfstream'; }).forEach(function(v){
        var uid = esc(v.ref);
        tiles += '<a class="mtile vtile" target="_blank" rel="noopener" href="https://iframe.cloudflarestream.com/'+uid+'">' +
          '<img class="vcover" src="https://videodelivery.net/'+uid+'/thumbnails/thumbnail.jpg?time=1s&height=140" alt="" onerror="this.style.display=\'none\'">' +
          '<span class="play">▶</span></a>';
      });
      media.filter(function(m){ return m.kind==='photo' && m.provider==='storage'; }).forEach(function(p){
        tiles += '<a class="mtile ptile" target="_blank" rel="noopener" data-phhref="'+esc(p.ref)+'"><img data-ph="'+esc(p.ref)+'" alt="photo"></a>';
      });
      var vidHtml = tiles ? '<div class="plabel">What you sent us</div><div class="pmedia">'+tiles+'</div>' : '';
      // The invoice's third leg: the customer's own receipt. Warranty = covered (never the
      // claim amount); self-pay = an itemized breakdown of THEIR cost + paid/unpaid state.
      var bill = j.bill, billHtml = '';
      if (bill) {
        if (bill.covered) {
          billHtml = '<div class="bill covered">🛡️ Covered by your warranty — no charge to you.</div>';
        } else if (bill.total_cents != null) {
          var fmt = function(c){ c = c||0; return (c<0?'−$':'$') + (Math.abs(c)/100).toFixed(2); };
          var lines = (bill.lines || []).map(function(l){
            var neg = (l.amount_cents||0) < 0;
            return '<div class="ir' + (neg?' credit':'') + '"><span>' + esc(l.description||'') + '</span><span>' + fmt(l.amount_cents) + '</span></div>';
          }).join('');
          var paidWhen = '';
          if (bill.paid && bill.paid_at) { try { paidWhen = ' · ' + new Date(bill.paid_at).toLocaleDateString(undefined,{month:'short',day:'numeric'}); } catch(e){} }
          var pw = payWaysHtml();
          var footer = bill.paid
            ? '<div class="ifoot ipaid">✅ Paid' + (bill.paid_method ? ' · ' + esc(bill.paid_method) : '') + paidWhen + '. Thank you!</div>'
            : '<div class="ifoot idue">Balance due' + (pw ? '.' : ' — reply below or call us to take care of it.') + '</div>' + pw;
          billHtml =
            '<div class="invoice">' +
              '<div class="ihead"><span>Your invoice</span><span class="' + (bill.paid?'ipill paidp':'ipill duep') + '">' + (bill.paid?'PAID':'UNPAID') + '</span></div>' +
              lines +
              (bill.tax_cents ? '<div class="ir sub"><span>Subtotal</span><span>' + fmt(bill.subtotal_cents) + '</span></div><div class="ir sub"><span>Tax</span><span>' + fmt(bill.tax_cents) + '</span></div>' : '') +
              '<div class="ir itotal"><span>Total</span><span>' + fmt(bill.total_cents) + '</span></div>' +
              footer +
            '</div>';
        }
      }
      // scheduling handshake — a shop offer to accept, your pending request, or a request button
      var offers = j.offers || [];
      var shopOffer = offers.filter(function(o){ return o.direction==='shop'; })[0];
      var myReq = offers.filter(function(o){ return o.direction==='customer'; })[0];
      var schedHtml = '';
      if (shopOffer) {
        schedHtml = '<div class="offer"><div class="ohd">📅 We can come <b>' + esc(fmtDay(shopOffer.proposed_day)) + '</b> · ' + fmtWin(shopOffer.win) + '</div>' +
          '<div class="orow"><button class="oyes" data-accept="' + esc(shopOffer.id) + '">Yes, book it</button>' +
          '<button class="ono" data-decline="' + esc(shopOffer.id) + '">Another day</button></div></div>';
      } else if (myReq) {
        schedHtml = '<div class="offer pend">📅 You asked for <b>' + esc(fmtDay(myReq.proposed_day)) + '</b> · ' + fmtWin(myReq.win) + ' — we\'ll confirm shortly.</div>';
      } else if (!day && j.status!=='completed' && j.status!=='canceled') {
        var today = new Date().toISOString().slice(0,10);
        schedHtml = '<div class="reqwrap"><button class="reqbtn" data-req="' + esc(j.id) + '">📅 Request a day that works</button>' +
          '<div class="reqform" id="rf_' + esc(j.id) + '" hidden>' +
            '<input type="date" id="rd_' + esc(j.id) + '" min="' + today + '">' +
            '<div class="wsel" id="rw_' + esc(j.id) + '"><span class="wc on" data-w="any">Wide open</span><span class="wc" data-w="am">Mornings</span><span class="wc" data-w="pm">Afternoons</span></div>' +
            '<button class="reqsend" data-reqsend="' + esc(j.id) + '">Send request</button></div></div>';
      }
      return '<div class="card"><div class="job-top"><div>' +
        '<div class="job-unit">' + esc(unit) + '</div>' +
        (j.problem ? '<div class="job-prob">' + esc(j.problem) + '</div>' : '') +
        '</div><span class="badge" style="background:' + st.color + '">' + esc(st.label) + '</span></div>' +
        '<div class="statusline">' + esc(st.line) + '</div>' +
        (day ? '<div class="meta"><span>Scheduled: <b>' + esc(day) + '</b></span></div>' : '') +
        schedHtml + techHtml + vidHtml + billHtml +
        ((j.status==='new'||j.status==='scheduled') ? '<div class="canrow"><button class="canbtn" data-cancel="'+esc(j.id)+'">Need to cancel this appointment?</button></div>' : '') +
        '</div>';
    }).join('') : '<div class="card"><div class="empty">No open repairs on file. Reply below if you need us.</div></div>';

    var bubbles = thread.length ? thread.map(function (m) {
      return '<div class="bub ' + (m.direction === 'in' ? 'in' : 'out') + '">' +
        '<span class="who">' + esc(whoLabel(m)) + '</span>' + esc(m.body || '') +
        '<span class="tm">' + esc(fmtTime(m.created_at)) + '</span></div>';
    }).join('') : '<div class="empty">No messages yet — say hi 👇</div>';

    app.innerHTML = head + greet + jobsHtml +
      '<div class="sec-title">Messages</div><div class="thread" id="thread">' + bubbles + '</div>' +
      '<div class="composer"><textarea id="msg" placeholder="Type a message to the shop…"></textarea><button id="send">Send</button></div>' +
      '<div class="foot">🐜 Powered by Ant</div>';
    hydratePortalPics();

    var ta = document.getElementById('msg'), btn = document.getElementById('send');
    ta.addEventListener('input', function(){ ta.style.height='auto'; ta.style.height=Math.min(140, ta.scrollHeight)+'px'; });
    function send() {
      var body = ta.value.trim(); if (!body) return;
      btn.disabled = true; var old = ta.value; ta.value = ''; ta.style.height='auto';
      sb.rpc('portal_post_message', { p_token: token, p_body: body }).then(function (r) {
        btn.disabled = false;
        if (r.error || (r.data && r.data.ok === false)) { ta.value = old; return; }
        load(true);   // refresh the thread
      });
    }
    btn.onclick = send;
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } });
    // Customer cancels a not-yet-started appointment (office can reopen it).
    Array.prototype.forEach.call(document.querySelectorAll('[data-cancel]'), function (b) {
      b.onclick = function () {
        if (!confirm('Cancel this appointment? You can message us to rebook anytime.')) return;
        b.disabled = true; b.textContent = 'Canceling…';
        sb.rpc('portal_cancel_job', { p_token: token }).then(function (r) {
          var d = r.data || {};
          if (r.error || d.ok === false) { b.disabled = false; b.textContent = 'Need to cancel this appointment?'; alert((d && d.error) || 'Please try again.'); return; }
          load(true);
        });
      };
    });
    // scheduling handshake wiring
    Array.prototype.forEach.call(document.querySelectorAll('[data-accept]'), function(b){ b.onclick=function(){ respondOffer(b.getAttribute('data-accept'), true, b); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-decline]'), function(b){ b.onclick=function(){ respondOffer(b.getAttribute('data-decline'), false, b); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-req]'), function(b){ b.onclick=function(){ var f=document.getElementById('rf_'+b.getAttribute('data-req')); if(f) f.hidden=!f.hidden; }; });
    Array.prototype.forEach.call(document.querySelectorAll('.wsel .wc'), function(c){ c.onclick=function(){ var p=c.parentNode; Array.prototype.forEach.call(p.querySelectorAll('.wc'),function(x){x.classList.remove('on');}); c.classList.add('on'); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-reqsend]'), function(b){ b.onclick=function(){ requestDay(b.getAttribute('data-reqsend'), b); }; });
    var th = document.getElementById('thread'); if (th) th.scrollTop = th.scrollHeight;
  }

  function load(quiet) {
    sb.rpc('portal_get', { p_token: token }).then(function (r) {
      if (r.error) { if (!quiet) center('⚠️', 'Something went wrong', 'Please try your link again in a moment.'); return; }
      var d = r.data;
      if (!d || d.ok === false) { center('🔗', 'Link expired', (d && d.error) || 'This link is no longer active. Ask the shop to text you a fresh one.'); if (pollTimer) clearInterval(pollTimer); return; }
      state = d; render();
    });
  }

  load(false);
  // Light poll so shop replies appear without a manual refresh (Realtime can't gate an
  // anon token, so the portal polls the SECURITY DEFINER read instead).
  pollTimer = setInterval(function(){ if (document.visibilityState === 'visible') load(true); }, 25000);
})();
</script>
</body>
</html>
