<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Client Usage & Margin</title>
<style>
  :root{ --bg:#f6f7fb; --card:#fff; --ink:#0e1320; --mut:#5b657a; --line:#e4e8f0; --brand:#2f6bff;
    --ok:#12a150; --warn:#c77700; --err:#d33c3c; --chip:#eef1f7; --shadow:0 2px 10px rgba(20,30,60,.06); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0b0e14; --card:#131926; --ink:#e8ecf4; --mut:#96a1b5; --line:#232c3d; --brand:#5a86ff;
    --ok:#33c46a; --warn:#e0a028; --err:#ff5c5c; --chip:#1b2333; --shadow:0 2px 14px rgba(0,0,0,.35); }}
  :root[data-theme="dark"]{ --bg:#0b0e14; --card:#131926; --ink:#e8ecf4; --mut:#96a1b5; --line:#232c3d;
    --brand:#5a86ff; --ok:#33c46a; --warn:#e0a028; --err:#ff5c5c; --chip:#1b2333; --shadow:0 2px 14px rgba(0,0,0,.35); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:22px;margin:2px 0 2px}
  .sub{color:var(--mut);margin:0 0 18px;font-size:13px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
  .tile .lab{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .tile .val{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile.margin .val{color:var(--ok)} .tile.cost .val{color:var(--warn)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 12px;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
  th{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line)}
  td{border-bottom:1px solid var(--line);font-size:13.5px}
  tr:last-child td{border-bottom:none}
  .num{text-align:right}
  .bar{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--chip);vertical-align:middle;overflow:hidden;margin-left:6px}
  .bar>span{display:block;height:100%;background:var(--brand)}
  .pos{color:var(--ok);font-weight:700} .neg{color:var(--err);font-weight:700}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mut)}
  .pill.cap{background:rgba(211,60,60,.13);color:var(--err)}
  .gate{max-width:340px;margin:14vh auto;text-align:center}
  .gate input{width:100%;padding:11px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
  button{font:inherit;font-weight:650;border:1px solid var(--line);background:var(--brand);color:#fff;border-radius:10px;padding:9px 16px;cursor:pointer}
  .scroll{overflow-x:auto}
  .empty{padding:26px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading…</p></div>
<script>
(function(){
  var app=document.getElementById('app');
  var key=localStorage.getItem('ant_ops_key')||'';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function money(n){return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
  function gate(msg){
    app.innerHTML='<div class="gate"><h1>🔐 Client usage</h1><p class="sub">Operator only.</p>'+
      '<input id="k" type="password" placeholder="Admin key" value="'+esc(key)+'">'+
      '<button id="go">View</button><div class="sub" style="color:var(--err)">'+esc(msg||'')+'</div></div>';
    document.getElementById('go').onclick=function(){ key=document.getElementById('k').value.trim(); localStorage.setItem('ant_ops_key',key); load(); };
  }
  function bar(pct){var p=Math.min(100,Math.max(0,pct||0));return '<span class="bar"><span style="width:'+p+'%;background:'+(p>=100?'var(--err)':p>=80?'var(--warn)':'var(--brand)')+'"></span></span>';}
  function render(d){
    var t=d.totals||{};
    var rows=(d.clients||[]).map(function(c){
      var mCls=c.margin>=0?'pos':'neg';
      return '<tr>'+
        '<td>'+esc(c.company)+' '+(c.default_plan?'<span class="pill">no plan set</span>':'')+(c.near_cap?' <span class="pill cap">near cap</span>':'')+'</td>'+
        '<td><span class="pill">'+esc(c.tier)+'</span></td>'+
        '<td class="num">'+c.voice_min+' <span class="sub" style="color:var(--mut)">'+c.voice_pct+'%</span>'+bar(c.voice_pct)+'</td>'+
        '<td class="num">'+c.sms_out+' <span class="sub" style="color:var(--mut)">'+c.sms_pct+'%</span>'+bar(c.sms_pct)+'</td>'+
        '<td class="num">'+money(c.cost)+'</td>'+
        '<td class="num">'+money(c.revenue)+'</td>'+
        '<td class="num '+mCls+'">'+money(c.margin)+'</td>'+
      '</tr>';
    }).join('');
    app.innerHTML='<h1>📊 Client usage & margin</h1>'+
      '<p class="sub">Internal only — this is your cost/margin per shop for '+esc(d.period)+'. Shops never see a meter; this is how you know who’s profitable and who’s near a safety cap.</p>'+
      '<div class="tiles">'+
        '<div class="tile cost"><div class="lab">Total cost (mo)</div><div class="val">'+money(t.cost)+'</div></div>'+
        '<div class="tile"><div class="lab">Total revenue (mo)</div><div class="val">'+money(t.revenue)+'</div></div>'+
        '<div class="tile margin"><div class="lab">Total margin (mo)</div><div class="val">'+money(t.margin)+'</div></div>'+
      '</div>'+
      '<div class="card"><div class="scroll"><table><thead><tr>'+
        '<th>Client</th><th>Tier</th><th class="num">AI minutes</th><th class="num">Texts</th><th class="num">Our cost</th><th class="num">They pay</th><th class="num">Margin</th>'+
      '</tr></thead><tbody>'+ (rows||'<tr><td colspan="7" class="empty">No usage yet — fills as shops go live on the phone.</td></tr>') +'</tbody></table></div></div>';
  }
  function load(){
    app.innerHTML='<p class="sub">Loading…</p>';
    fetch('/.netlify/functions/platform-usage?action=summary&secret='+encodeURIComponent(key))
      .then(function(r){return r.json();})
      .then(function(d){ if(d.ok===false){ gate(d.error==='forbidden'?'Wrong key.':(d.error||'Error')); return; } render(d); })
      .catch(function(){ gate('Network error.'); });
  }
  if(key) load(); else gate();
})();
</script>
</body>
</html>
