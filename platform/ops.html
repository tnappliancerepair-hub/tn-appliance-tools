<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ant Platform · Clients</title>
<!--
  ops.html — the OPERATOR client-inventory / quality-control view of the Ant platform.
  Growth vs churn: who's on, who's new, who's gone quiet, who left. NOT each shop's
  operational or money detail (a client roster / CRM health board). Owner-only (admin
  key, cached in localStorage). Reads /.netlify/functions/platform-ops, which aggregates
  across every company with the mgmt token — a shop's own RLS login can never see this.
-->
<style>
  :root{
    --bg:#0e120b; --bg2:#141a10; --panel:#1a2113; --panel2:#20291a; --line:#2c3720;
    --ink:#eef3e6; --muted:#9aa588; --dim:#6f7a5e;
    --gold:#f5c542; --green:#19d15f; --blue:#4b8cff; --violet:#a98bff; --pink:#ff5db1; --amber:#f7a53b; --red:#ff5a5a;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:
      radial-gradient(1200px 500px at 15% -10%, rgba(245,197,66,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(75,140,255,.10), transparent 55%),
      var(--bg);
    color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; padding:0 0 60px;}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px}
  header{display:flex;align-items:center;gap:12px;padding:18px 16px;position:sticky;top:0;z-index:5;
    background:linear-gradient(180deg, rgba(14,18,11,.96), rgba(14,18,11,.82) 70%, transparent);backdrop-filter:blur(6px)}
  .logo{font-size:22px;font-weight:800;letter-spacing:.2px}
  .logo b{color:var(--gold)}
  .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  .sp{flex:1}
  button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:12px;padding:9px 14px;cursor:pointer}
  button:active{transform:translateY(1px)}
  .stamp{color:var(--dim);font-size:11.5px;text-align:right;padding:2px 18px 0}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:8px 0 6px}
  .tile{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:18px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .tile .lab{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .tile .val{font-size:32px;font-weight:800;line-height:1.05;margin-top:7px;font-variant-numeric:tabular-nums}
  .tile .cap{font-size:12px;color:var(--dim);margin-top:5px}
  .tile.hero .val{color:var(--gold);font-size:36px}
  .tile .accent{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:18px 0 0 18px}
  .a-gold{background:var(--gold)} .a-green{background:var(--green)} .a-blue{background:var(--blue)}
  .a-violet{background:var(--violet)} .a-amber{background:var(--amber)} .a-pink{background:var(--pink)} .a-red{background:var(--red)}
  .v-green{color:var(--green)} .v-blue{color:var(--blue)} .v-amber{color:var(--amber)} .v-red{color:var(--red)} .v-violet{color:var(--violet)}

  .sec{margin:24px 4px 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:9px}
  .lock{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px;letter-spacing:.04em}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:660px}
  th,td{padding:13px 12px;text-align:left;white-space:nowrap}
  th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);background:var(--panel2)}
  td{border-bottom:1px solid rgba(44,55,32,.6);font-size:14px}
  tr:last-child td{border-bottom:none}
  td.nm{font-weight:700}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
  tr.flagship td{background:rgba(245,197,66,.06)}
  tr.left td{color:var(--dim)}

  .chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;text-transform:capitalize;border:1px solid transparent}
  .s-active{background:rgba(25,209,95,.14);color:#6ef0a0;border-color:rgba(25,209,95,.3)}
  .s-trial{background:rgba(75,140,255,.14);color:#9cc0ff;border-color:rgba(75,140,255,.3)}
  .s-paused{background:rgba(247,165,59,.14);color:#ffcd8a;border-color:rgba(247,165,59,.3)}
  .s-churned{background:rgba(255,90,90,.12);color:#ff9a9a;border-color:rgba(255,90,90,.28)}
  .hdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .h-new{background:var(--blue);box-shadow:0 0 0 3px rgba(75,140,255,.16)}
  .h-healthy{background:var(--green);box-shadow:0 0 0 3px rgba(25,209,95,.16)}
  .h-quiet{background:var(--amber);box-shadow:0 0 0 3px rgba(247,165,59,.16)}
  .h-at_risk{background:var(--red);box-shadow:0 0 0 3px rgba(255,90,90,.16)}
  .h-left{background:#4a553a}
  .h-paused{background:var(--amber)}
  .hl{font-size:12.5px;color:var(--muted);text-transform:capitalize}
  .owner{font-size:12px;color:var(--dim)}
  .trade{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;text-transform:capitalize}
  td.acts{text-align:right;white-space:nowrap}
  .mini{font-size:12px;font-weight:700;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);margin-left:6px}
  .mini:hover{color:var(--ink);border-color:var(--dim)}
  .mini.danger{color:#ff9a9a;border-color:rgba(255,90,90,.35);background:rgba(255,90,90,.08)}
  .mini.danger:hover{color:#fff;background:rgba(255,90,90,.2)}

  .gate{max-width:400px;margin:16vh auto;padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
  .gate h1{margin:0 0 6px;font-size:20px}
  .gate p{color:var(--muted);margin:0 0 16px;font-size:13.5px}
  .gate input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;margin-bottom:12px}
  .gate button{width:100%;background:var(--gold);color:#1a1400;border:none}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}
  .note{color:var(--muted);font-size:12.5px;padding:14px 4px 0}
  .sand{color:var(--dim);font-size:12.5px;padding:10px 4px 0}
</style>

<div id="app"><div class="note wrap" style="padding-top:40px">Loading…</div></div>

<script src="/platform/config.js"></script>
<script src="/platform/vendor/supabase-js.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>
<script src="/platform/vendor/supa-guard.js"></script>
<script>
(function(){
  var app = document.getElementById('app');
  var KEY = 'ant_ops_secret';
  var sb = null, accessToken = null;
  try { if (window.ANT_SUPABASE && window.supabase) sb = window.supabase.createClient(window.ANT_SUPABASE.url, window.ANT_SUPABASE.anonKey); } catch(_){}
  function authHdr(){ return accessToken ? { Authorization: 'Bearer ' + accessToken } : {}; }
  function authQS(){ return accessToken ? '' : ('secret=' + encodeURIComponent(localStorage.getItem(KEY) || '')); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(x){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[x];}); }
  function ago(iso){ if(!iso) return '—'; var d=(Date.now()-Date.parse(iso))/86400000; if(d<1) return 'today'; if(d<2) return 'yesterday'; if(d<30) return Math.round(d)+'d ago'; if(d<365) return Math.round(d/30)+'mo ago'; return Math.round(d/365)+'y ago'; }
  function joined(iso){ try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'2-digit'}); }catch(_){ return '—'; } }
  var HL={new:'New',healthy:'Healthy',quiet:'Going quiet',at_risk:'At risk',left:'Left',paused:'Paused'};

  function gate(msg){
    app.innerHTML = '<div class="gate"><h1>🐜 Platform · Clients</h1><p>Owner access only. Enter the admin key to see your client roster.</p>'+
      '<input id="k" type="password" placeholder="admin key" autocomplete="current-password">'+
      '<button id="go">Open</button><div class="err" id="e">'+esc(msg||'')+'</div></div>';
    var go=document.getElementById('go'), k=document.getElementById('k');
    function submit(){ var v=k.value.trim(); if(!v){document.getElementById('e').textContent='Enter the key.';return;} accessToken=null; localStorage.setItem(KEY,v); fetchOps(); }
    go.onclick=submit; k.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); }); k.focus();
  }

  function fetchOps(){
    app.innerHTML = '<div class="note wrap" style="padding-top:40px">Loading your clients…</div>';
    var qs = authQS();
    fetch('/.netlify/functions/platform-ops' + (qs ? '?' + qs : ''), { headers: authHdr() })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.error==='forbidden'){
          if(accessToken){ accessToken=null; return gate('This login isn’t set up as a platform operator. Enter the admin key, or ask to be added.'); }
          localStorage.removeItem(KEY); return gate('That key was rejected.');
        }
        if(!d || !d.ok){ return gate((d&&d.error)||'Could not load.'); }
        render(d);
      })
      .catch(function(e){ gate('Network error: '+e.message); });
  }
  function load(){
    // Prefer your existing owner session (one-tap, no key). Fall back to the admin key.
    if(sb){
      sb.auth.getSession().then(function(r){
        var s = r && r.data && r.data.session;
        if(s && s.access_token){ accessToken = s.access_token; fetchOps(); }
        else if(localStorage.getItem(KEY)){ fetchOps(); }
        else gate('');
      }).catch(function(){ if(localStorage.getItem(KEY)) fetchOps(); else gate(''); });
    } else if(localStorage.getItem(KEY)){ fetchOps(); }
    else gate('');
  }

  function tile(accent, valcls, lab, val, cap){
    return '<div class="tile'+(accent==='a-gold'?' hero':'')+'"><span class="accent '+accent+'"></span>'+
      '<div class="lab">'+lab+'</div><div class="val '+(valcls||'')+'">'+val+'</div>'+(cap?'<div class="cap">'+cap+'</div>':'')+'</div>';
  }

  function render(d){
    var t=d.totals, clients=d.clients||[];
    var kpis =
      tile('a-gold','', 'Clients', String(t.clients), t.active+' active · '+t.trial+' trial · '+t.trades+' trades')+
      tile('a-green','v-green', 'Net new · 30d', '+'+t.new_30d, t.new_7d+' in the last 7 days')+
      tile('a-red','v-red', 'Lost · 30d', (t.lost_30d>0?'−'+t.lost_30d:'0'), t.churned+' churned all-time')+
      tile('a-blue','v-blue', 'Retention', t.retention_pct+'%', 'of clients still with us')+
      tile('a-amber','v-amber', 'Going quiet', String(t.quiet), 'no activity in 30d+ — check in')+
      tile('a-violet','v-violet', 'Active this week', String(t.new_7d + clients.filter(function(c){return c.health==='healthy';}).length), 'new or working the system');

    var order={new:0,healthy:1,quiet:2,at_risk:3,paused:4,left:5};
    var rows = clients.slice().sort(function(a,b){ return (order[a.health]||9)-(order[b.health]||9); }).map(function(c){
      var cls=(c.slug==='tn-appliance'?'flagship ':'')+(c.status==='churned'?'left':'');
      var owner = c.owner_name || (c.owner_email||'').split('@')[0] || '—';
      var last, acts='';
      if (c.status==='churned'){
        last = 'left '+ago(c.churned_at) + (c.purge_eligible ? ' · <span class="v-red">ready to purge</span>' : ' · purge in '+c.purge_in_days+'d');
        acts = '<button class="mini" data-act="reactivate" data-slug="'+esc(c.slug)+'" data-name="'+esc(c.name)+'">Reactivate</button>' +
               (c.purge_eligible ? '<button class="mini danger" data-act="purge" data-slug="'+esc(c.slug)+'" data-name="'+esc(c.name)+'">🗑 Purge</button>' : '');
      } else {
        last = ago(c.last_activity);
        if (c.slug!=='tn-appliance') acts = '<button class="mini" data-act="offboard" data-slug="'+esc(c.slug)+'" data-name="'+esc(c.name)+'">Offboard</button>';
      }
      return '<tr class="'+cls.trim()+'">'+
        '<td class="nm">'+esc(c.name)+'<div class="owner">'+esc(owner)+'</div></td>'+
        '<td><span class="trade">'+esc(c.trade||'—')+'</span></td>'+
        '<td><span class="chip s-'+c.status+'">'+esc(c.status)+'</span></td>'+
        '<td><span class="hdot h-'+c.health+'"></span><span class="hl">'+(HL[c.health]||c.health)+'</span></td>'+
        '<td class="r">'+joined(c.created_at)+'</td>'+
        '<td class="r">'+last+'</td>'+
        '<td class="acts">'+acts+'</td>'+
      '</tr>';
    }).join('');

    app.innerHTML =
      '<header><div><div class="logo">🐜 <b>Ant</b> Platform</div><div class="sub">Client roster · are we growing or losing</div></div>'+
        '<div class="sp"></div><a href="/platform/system.html#scene" style="text-decoration:none;color:inherit;font-weight:700;font-size:13px;margin-right:12px">▶ Watch</a><a href="/platform/demo-run.html" style="text-decoration:none;color:inherit;font-weight:700;font-size:13px;margin-right:12px">🎬 Demo</a><a href="/platform/import.html" style="text-decoration:none;color:inherit;font-weight:700;font-size:13px;margin-right:12px">📥 Import</a><a href="/platform/system.html" style="text-decoration:none;color:inherit;font-weight:700;font-size:13px;margin-right:12px">🗺️ System</a><button id="rf">Refresh</button></header>'+
      '<div class="stamp">as of '+new Date(d.generated_at).toLocaleString()+'</div>'+
      '<div class="wrap">'+
        '<div class="sec">Quality control <span class="lock">🔒 operator only</span></div>'+
        '<div class="kpis">'+kpis+'</div>'+
        '<div class="sec">Client roster ('+clients.length+')</div>'+
        '<div class="card"><div class="tblwrap"><table>'+
          '<thead><tr><th>Client</th><th>Trade</th><th>Status</th><th>Health</th><th class="r">Joined</th><th class="r">Last active</th><th></th></tr></thead>'+
          '<tbody>'+rows+'</tbody>'+
        '</table></div></div>'+
        '<div class="sand">🧪 '+t.test+' test tenants (clones + demo) hidden — sandbox, not counted as clients.</div>'+
        '<div class="note">This is your inventory of the shops you\'re helping — status, health, and when each last used the system. It never shows a shop\'s customers or money. A client that goes 30+ days quiet is flagged so you can reach out before they drift. When a client leaves, <b>Offboard</b> marks them gone and cuts their logins but keeps their data <b>'+(t.retention_days||30)+' days</b>; after that a <b>🗑 Purge</b> button appears to delete it for good (always with a confirm — nothing auto-deletes).</div>'+
      '</div>';
    document.getElementById('rf').onclick=load;
    var body=document.querySelector('tbody');
    if(body) body.addEventListener('click', function(e){
      var b=e.target.closest('button[data-act]'); if(!b) return;
      lifecycle(b.getAttribute('data-act'), b.getAttribute('data-slug'), b.getAttribute('data-name'), b);
    });
  }

  function lifecycle(action, slug, name, btn){
    var url = '/.netlify/functions/platform-provision?slug='+encodeURIComponent(slug);
    var qs = authQS(); if(qs) url += '&' + qs;
    if(action==='offboard'){
      if(!confirm('Offboard '+name+'?\n\nThey’ll be marked as Left and their logins revoked. All their data is KEPT for 30 days (you can Reactivate anytime in that window).')) return;
      var reason = prompt('Reason they left (optional):','') || '';
      url += '&action=offboard&reason='+encodeURIComponent(reason);
    } else if(action==='reactivate'){
      if(!confirm('Reactivate '+name+'? They’ll be able to log in again and drop back onto your roster as active.')) return;
      url += '&action=reactivate';
    } else if(action==='purge'){
      if(!confirm('⚠️ PERMANENTLY DELETE all of '+name+'’s data?\n\nJobs, customers, invoices, techs, logins — everything. This CANNOT be undone.')) return;
      if(prompt('Type the shop name to confirm deletion:','') !== name){ alert('Name didn’t match — nothing deleted.'); return; }
      url += '&action=purge&confirm=yes';
    } else { return; }
    if(btn){ btn.disabled=true; btn.textContent='…'; }
    fetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d || !d.ok){ alert('Failed: '+((d&&d.error)||'unknown')); if(btn){btn.disabled=false;} return; }
      load();
    }).catch(function(e){ alert('Network error: '+e.message); if(btn){btn.disabled=false;} });
  }

  load();
})();
</script>
