<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Job — Ant</title>
<!--
  Ant platform — TECH JOB WORKSPACE. Open a job and work it like TN's Ant: watch the
  customer's video inline (Cloudflare Stream), see the model photos, camera-OCR the model
  number (Claude Vision -> saved on the unit), ask the cross-shop brain what usually fixes
  it, jump to the parts catalog, and file the structured completion report. RLS scopes
  everything to this shop.
-->
<style>
  /* Two themes, toggle-able (Teddy's night/day). LIGHT = the office off-white + AMBER, clean.
     DARK = navy with PURPLE as the primary (no blue) + bright orange + green. Purple + orange +
     green are the accents in both; --brand flips amber↔purple; --inv is the invoice purple. */
  :root{ --bg:#f7f4ec; --panel:#ffffff; --ink:#171207; --muted:#6b6250; --line:#e8e1d2; --brand:#c98a00; --brand-ink:#3a1400; --chip:#f2ecdd; --shadow:0 1px 2px rgba(60,40,10,.06),0 6px 18px rgba(60,40,10,.07);
    --new:#8a8676; --scheduled:#8b5cf6; --in_progress:#f5921b; --awaiting_parts:#8b5cf6; --completed:#12a150; --canceled:#a39a86; --inv:#7c3aed; --inv-soft:rgba(124,58,237,.32);
    --pop:linear-gradient(135deg,#ff6a13,#ff8c1f); --pop-ink:#fff; --pop-glow:0 6px 20px rgba(255,110,20,.42); --done-grad:linear-gradient(135deg,#16b657,#0f9247); --done-glow:0 6px 20px rgba(18,160,80,.36); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#100a1c; --panel:#1a1230; --ink:#f1ecfb; --muted:#a99fc4; --line:#2e2348; --chip:#241a3c; --brand:#a78bfa; --brand-ink:#150a26; --scheduled:#a78bfa; --in_progress:#f5a623; --awaiting_parts:#c084fc; --completed:#22c55e; --canceled:#7d7395; --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.55); --inv:#c4b5fd; --inv-soft:rgba(167,139,250,.42); --pop:linear-gradient(135deg,#ff7a1f,#ffa23d); --pop-ink:#2a1200; --pop-glow:0 6px 22px rgba(255,140,30,.5); --done-grad:linear-gradient(135deg,#22c55e,#16a34a); --done-glow:0 6px 22px rgba(34,197,94,.42); }}
  :root[data-theme="dark"]{ --bg:#100a1c; --panel:#1a1230; --ink:#f1ecfb; --muted:#a99fc4; --line:#2e2348; --chip:#241a3c; --brand:#a78bfa; --brand-ink:#150a26; --scheduled:#a78bfa; --in_progress:#f5a623; --awaiting_parts:#c084fc; --completed:#22c55e; --canceled:#7d7395; --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.55); --inv:#c4b5fd; --inv-soft:rgba(167,139,250,.42); --pop:linear-gradient(135deg,#ff7a1f,#ffa23d); --pop-ink:#2a1200; --pop-glow:0 6px 22px rgba(255,140,30,.5); --done-grad:linear-gradient(135deg,#22c55e,#16a34a); --done-glow:0 6px 22px rgba(34,197,94,.42); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--panel);border-bottom:1px solid var(--line)}
  header a.back{color:var(--brand);font-weight:700;text-decoration:none;font-size:14px}
  header .shop{color:var(--muted);font-weight:600;font-size:14px}
  .shell{max-width:620px;margin:0 auto;padding:14px 14px 48px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
  .cust{font-weight:800;font-size:19px}
  .unit{color:var(--muted);font-size:14px;margin-top:2px}
  .badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff}
  .prob{margin-top:9px;font-size:15px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:2px 0 9px}
  button.supcfg{float:right;margin-top:-3px;padding:2px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:13px;line-height:1.4;cursor:pointer}
  button.supcfg:hover{color:var(--ink);border-color:var(--brand)}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .links a{font-size:13px;font-weight:700;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 12px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 13px;font-weight:700}
  button.primary{background:var(--pop);color:var(--pop-ink);border-color:transparent;box-shadow:var(--pop-glow)}
  button.otw{background:#7c5cff;color:#fff;border-color:transparent}
  button.review{background:#f59e0b;color:#231a02;border-color:transparent}
  button.reopen{background:#fdecea;color:#b0201a;border-color:#f4c9c4}
  :root[data-theme="dark"] button.reopen,:root:not([data-theme="light"]) button.reopen{background:#2a1512;color:#ff9a8d;border-color:#5a2620}
  button.full{width:100%}
  button:disabled{opacity:.55}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btnrow button{flex:1;min-width:100px}
  .psrow button{min-width:120px}
  .psrow button.sel{background:var(--accent,#3f8f24);border-color:var(--accent,#3f8f24);color:#fff}
  iframe.vid{border:none;width:100%;aspect-ratio:16/9;border-radius:12px;background:#000}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .kv{font-size:14px;margin:3px 0}
  .kv b{font-weight:700}
  .model{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .model .mval{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:16px;background:var(--chip);padding:4px 9px;border-radius:7px}
  .mrow{display:flex;gap:8px;margin-top:9px}
  .mrow input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-family:ui-monospace,Menlo,monospace}
  .mrow input:first-child{max-width:40%;font-family:inherit}
  input.partq{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-family:ui-monospace,Menlo,monospace}
  .brainbox{background:var(--chip);border-radius:10px;padding:11px 12px;font-size:13.5px;margin-top:8px}
  .brainrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
  .brainrow:first-of-type{border-top:none}
  .brainrow .bp{color:var(--muted);font-size:12px}
  .tdr input:not([type="radio"]):not([type="checkbox"]){width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
  .tdr input[type="radio"],.tdr input[type="checkbox"]{width:auto;flex:0 0 auto;margin:0}
  .tdr .two{display:flex;gap:8px}
  .tdr .outc{display:flex;flex-direction:column;gap:5px;font-size:14.5px;margin:4px 0 10px}
  .tdr .outc label,.tdr .cameback{display:flex;gap:8px;align-items:center}
  .tdr .cameback{font-size:13.5px;color:var(--muted);margin:6px 0 0}
  /* Big-card-per-field report (matches TN's clean tech TDR: icon · label · hint · one clear input) */
  .fld{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;display:flex;gap:11px;align-items:flex-start;transition:border-color .15s ease}
  .fld.filled{border-left-color:#10b981}
  .fld.empty{border-left-color:#f5a623;background:rgba(245,166,35,.055)}
  .fld-ic{font-size:19px;flex-shrink:0;margin-top:1px;line-height:1}
  .fld-body{flex:1;min-width:0}
  .fld-lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
  .fld-hint{font-size:12.5px;color:var(--muted);font-style:italic;margin:1px 0 9px}
  .fld input:not([type=checkbox]){margin-bottom:0 !important}
  .fld .two{margin:0}
  .fld .two input:first-child{max-width:42%}
  .statusgrid{display:flex;flex-direction:column;gap:8px}
  .sbtn{width:100%;text-align:left;font-weight:700;border:1.5px solid var(--line);background:var(--bg);padding:13px 14px}
  .sbtn.sel{border-color:transparent;color:#fff}
  .sbtn.sel[data-o="fixed"]{background:linear-gradient(135deg,#34a853,#1f7a37)}
  .sbtn.sel[data-o="return_needed"]{background:linear-gradient(135deg,#f5a623,#d98613);color:#231a02}
  .sbtn.sel[data-o="not_fixable"]{background:linear-gradient(135deg,#94a3b8,#64748b)}
  .sbtn.sel[data-o="reassign"]{background:linear-gradient(135deg,#a78bfa,#7c5cff)}
  /* Status — the big three-tile OTW / Start-Pause / Complete row (matches TN) */
  .statustiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 4px}
  .stile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 6px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);font-weight:800;font-size:14.5px;text-align:center;line-height:1.15;min-height:96px}
  .stile .ic{font-size:26px;line-height:1}
  .stile.otw{color:#7c5cff}
  .stile.run{color:var(--in_progress)}
  .stile.done{color:var(--completed);background:rgba(63,143,36,.07)}
  .stile.on{border-color:transparent;color:#fff}
  .stile.otw.on{background:#7c5cff;box-shadow:0 6px 20px rgba(124,92,255,.5)}
  .stile.run.on{background:var(--pop);box-shadow:var(--pop-glow)}
  .stile.done.on{background:var(--done-grad);box-shadow:var(--done-glow)}
  .stile:disabled{opacity:.5}
  .stimes{text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;margin:2px 0 11px;min-height:1em}
  .bigwaiver{width:100%;background:#7c5cff;color:#fff;border-color:transparent;font-size:15.5px;padding:15px;box-shadow:0 4px 14px rgba(124,92,255,.3)}
  .wvwarn{text-align:center;color:#c67a0f;font-size:13px;font-weight:700;margin-top:9px}
  :root[data-theme="dark"] .wvwarn,:root:not([data-theme="light"]) .wvwarn{color:#f5b451}
  .wvok{text-align:center;color:var(--completed);font-size:13.5px;font-weight:700;margin-top:12px}
  /* Photos & Video — TN's clean capture tiles + unified grid with delete */
  .mediahead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
  .reflink{background:none;border:none;color:var(--brand);font-weight:800;font-size:14px;padding:4px 2px}
  .capgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  @media (max-width:340px){ .capgrid{grid-template-columns:repeat(2,1fr)} }
  .captile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:13px 3px;border:1.5px dashed var(--line);border-radius:13px;background:var(--bg);color:var(--inv);font-weight:800;font-size:12px;text-align:center;line-height:1.12;min-height:84px}
  .captile .ci{font-size:23px;line-height:1}
  .tip{background:var(--chip);border-radius:11px;padding:10px 13px;font-size:13px;color:var(--muted);margin:12px 0 2px;line-height:1.4}
  .mgrid{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
  .mtile{position:relative;width:calc(33.333% - 6px);aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0c0c0c;cursor:pointer}
  .mtile img,.mtile video{width:100%;height:100%;object-fit:cover;display:block}
  .mtile .playo{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px;text-shadow:0 2px 10px rgba(0,0,0,.7);background:rgba(0,0,0,.14);pointer-events:none}
  .mtile .vlabel{position:absolute;left:7px;bottom:7px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
  .mtile .del{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:#e5484d;color:#fff;font-size:14px;display:grid;place-items:center;box-shadow:0 2px 9px rgba(0,0,0,.4);padding:0;line-height:1}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:120;display:grid;place-items:center;padding:18px}
  .lb .lbx{position:absolute;top:12px;right:16px;color:#fff;font-size:32px;background:none;border:none;font-weight:400;padding:0}
  .lb img,.lb video{max-width:100%;max-height:86vh;border-radius:12px;background:#000}
  .lb iframe{width:min(94vw,760px);aspect-ratio:16/9;border:none;border-radius:12px;background:#000}
  /* Parts for this job — per-part card: order / claim-only, then Used / Return / Not here */
  .cbwarn{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.35);border-radius:11px;padding:10px 13px;font-size:13px;font-weight:700;color:#c67a0f;margin-bottom:12px}
  :root[data-theme="dark"] .cbwarn,:root:not([data-theme="light"]) .cbwarn{color:#f5b451}
  .pcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--bg)}
  .pcard .pname{font-weight:800;font-size:16px;line-height:1.25}
  .pcard .pnum{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:13px;margin-top:3px}
  .pprice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel,rgba(0,0,0,.02))}
  .pcost{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap}
  .pcost .pdol{color:var(--muted)}
  .pcost input{width:84px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
  .pretail{font-size:14px;color:var(--muted)} .pretail b{color:var(--completed);font-size:16px}
  .pordbtn{width:100%;margin-top:11px;background:transparent;border:1.5px solid var(--in_progress);color:var(--in_progress);font-weight:800}
  .pordbtn.sel{background:var(--in_progress);color:#fff;border-color:transparent}
  .pclaimbtn{width:100%;margin-top:8px;background:transparent;border:1.5px solid #7c5cff;color:#7c5cff;font-weight:800}
  .pclaimbtn.sel{background:#7c5cff;color:#fff;border-color:transparent}
  .parrive{font-size:12.5px;color:var(--muted);margin:12px 0 7px;font-weight:600}
  .pdisp{display:flex;gap:8px}
  .pdisp button{flex:1;font-weight:800;border:1.5px solid var(--line);background:var(--panel)}
  .pdisp button.pu.sel{background:#34a853;color:#fff;border-color:transparent}
  .pdisp button.pr.sel{background:var(--in_progress);color:#fff;border-color:transparent}
  .pdisp button.pn.sel{background:#e5484d;color:#fff;border-color:transparent}
  .pphoto{display:flex;align-items:center;gap:10px;margin-top:11px}
  .pphoto .snap{width:56px;height:56px;border:1.5px dashed var(--line);border-radius:11px;display:grid;place-items:center;font-size:22px;background:var(--panel);cursor:pointer;flex:0 0 auto}
  .pphoto img{width:56px;height:56px;object-fit:cover;border-radius:11px;border:1px solid var(--line);cursor:pointer}
  .pphoto .pptxt{font-size:12.5px;color:var(--muted)}
  .paddrow{display:flex;gap:8px;margin-top:4px}
  .paddrow input{flex:1}
  .pdel{background:none;border:none;color:#e5484d;font-weight:800;font-size:13px;padding:6px 2px;margin-top:6px}
  /* Machines at this stop — switcher chips + add */
  .mchips{display:flex;gap:8px;flex-wrap:wrap}
  .mchip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:800;font-size:13.5px}
  .mchip.cur{background:var(--brand-grad,var(--brand));color:#fff;border-color:transparent;box-shadow:var(--glow,0 4px 12px rgba(26,158,70,.3))}
  .mchip.add{border-style:dashed;color:var(--brand)}
  #addMachineBox input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;box-sizing:border-box}
  /* Review ask — the warm "was the customer happy? ask or skip" card (TN) */
  .revask{border:1px solid rgba(245,166,35,.42);background:rgba(245,166,35,.09);border-radius:14px;padding:15px;margin-top:14px}
  .revh{font-weight:800;font-size:15px;color:#b9770a;margin-bottom:12px;line-height:1.3}
  :root[data-theme="dark"] .revh,:root:not([data-theme="light"]) .revh{color:#f5b451}
  .revbtns{display:flex;gap:9px}
  .revsend{flex:1.5;background:var(--brand-grad,var(--brand));color:#fff;border-color:transparent;font-weight:800;box-shadow:var(--glow,0 4px 14px rgba(26,158,70,.3))}
  .revskip{flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:700}
  .revnote{font-size:12.5px;color:var(--muted);text-align:center;margin-top:11px;line-height:1.4}
  .note{background:var(--chip);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--muted)}
  .thr{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:2px}
  .bub{max-width:88%;padding:8px 11px;border-radius:12px;font-size:14px;background:var(--chip);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .bub.cust{align-self:flex-start;border-left:3px solid #0d9488}
  .bub.ann{align-self:flex-end;border-left:3px solid #a855f7}
  .bub.you{align-self:flex-end;border-left:3px solid var(--completed)}
  .bub .who{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;opacity:.85}
  .bub.cust .who{color:#0d9488}.bub.ann .who{color:#a855f7}.bub.you .who{color:var(--completed)}
  .bub .tm{display:block;font-size:10.5px;opacity:.6;margin-top:3px}
  .center{max-width:400px;margin:12vh auto;text-align:center;color:var(--muted);padding:0 20px}
  .center .big{font-size:44px;margin-bottom:8px}
  .gate{max-width:360px;margin:10vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
  .gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-top:8px}
  .gate button{width:100%;margin-top:14px}
  .err{color:#c0392b;font-size:13px;margin-top:8px;min-height:1em}
  :root[data-theme="dark"] .err,:root:not([data-theme="light"]) .err{color:#ff8a7a}
  .hidden{display:none}
  /* Invoice builder — the tech's full invoicing area. Purple-on-dark (Teddy's pick). */
  .invcard{border-color:var(--inv-soft);box-shadow:0 1px 2px rgba(0,0,0,.14),0 12px 30px rgba(124,92,255,.14)}
  .invcard .sec{color:var(--inv)}
  .invlab{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 5px}
  .invmoney{display:flex;align-items:center;gap:9px}
  .invmoney .d{font-size:18px;font-weight:800;color:var(--muted)}
  .invmoney input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .invrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .invrow:first-child{border-top:none}
  .invrow .nm{flex:1;min-width:0;font-weight:600}
  .invrow .d{color:var(--muted);font-weight:700}
  .invrow .amt{width:88px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .invrow .rm{border:none;background:none;color:#ef4444;font-size:16px;font-weight:800;padding:2px 5px;cursor:pointer;flex:0 0 auto;line-height:1}
  .invadd{display:flex;gap:8px;margin-top:10px}
  .invadd select{flex:1;min-width:0;padding:11px 10px;border:1.5px solid var(--inv-soft);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:600}
  .invadd button{background:#7c5cff;color:#fff;border-color:transparent;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px rgba(124,92,255,.32)}
  .invtot{margin-top:14px;border-top:1px dashed var(--inv-soft);padding-top:11px}
  .invtot .tr{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--muted)}

<body>
<div id="app"><div class="center"><div class="big">🐜</div><p>Loading…</p></div></div>

<script src="/platform/config.js"></script>
<script src="/platform/vendor/supabase-js.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>
<script src="/platform/vendor/supa-guard.js"></script>
<script src="/platform/vendor/boot-watchdog.js"></script>
<script src="/platform/vendor/setup-bypass.js"></script>
<script src="/platform/media-sign.js"></script>
<script src="/platform/ant-suppliers.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@3/dist/tus.min.js"></script>
<script src="/ant-sounds.js"></script>
<script src="/ant-celebrate.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var cfg = window.ANT_SUPABASE || {};
  var jobId = new URLSearchParams(location.search).get('job');
  var sb = null, me = null, myTech = null, job = null, shopSettings = {}, companyTrade = '', partStatus = '', outcomeSel = 'fixed', invoice = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function fullName(c){ return c ? [c.first_name, c.last_name].filter(Boolean).join(' ').trim() : ''; }
  var STATUS = { new:{l:'New',c:'var(--new)'}, scheduled:{l:'Scheduled',c:'var(--scheduled)'}, in_progress:{l:'In progress',c:'var(--in_progress)'}, awaiting_parts:{l:'Awaiting parts',c:'var(--awaiting_parts)'}, completed:{l:'Completed',c:'var(--completed)'}, canceled:{l:'Canceled',c:'var(--canceled)'} };
  function st(k){ return STATUS[k] || {l:(k||'Open'),c:'var(--new)'}; }

  if (!cfg.url || !cfg.anonKey) { app.innerHTML = '<div class="center"><div class="big">🐜</div><p>Not connected yet.</p></div>'; return; }
  if (!jobId) { app.innerHTML = '<div class="center"><div class="big">🐜</div><p>No job selected. <a href="/platform/tech.html">Back to My Jobs</a></p></div>'; return; }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  function signIn(msg) {
    app.innerHTML = '<div class="gate"><h2>🐜 Sign in</h2><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="primary" id="go">Sign in</button><div class="err">'+esc(msg||'')+'</div></div>';
    document.getElementById('go').onclick = function(){
      sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }).then(function(r){ if(r.error) signIn(r.error.message); else boot(); });
    };
  }

  function boot() {
    sb.auth.getUser().then(function(u){
      var uid = u && u.data && u.data.user ? u.data.user.id : null;
      sb.from('app_user').select('id,name,company_id').eq('auth_user_id', uid).limit(1).then(function(r){
        me = (r.data && r.data[0]) || null;
        if (!me) { app.innerHTML = '<div class="center"><div class="big">🐜</div><p>Your login isn\'t attached to a shop yet.</p></div>'; return; }
        sb.from('technician').select('id,name').eq('app_user_id', me.id).limit(1).then(function(t){ myTech = (t.data && t.data[0]) || null; loadJob(); });
      });
    });
  }

  function loadJob() {
    var base = 'id,status,problem,availability,access_notes,waiver_name,waiver_signed_at,customer_id,technician_id,scheduled_day,';
    var tail = 'customer:customer_id(first_name,last_name,phone,address,city,state),unit:unit_id(id,label,attributes,kind),media:job_media(id,kind,provider,ref,label),tdr:job_tdr(*)';
    var done = function(r){
      if (r.error || !r.data || !r.data[0]) { app.innerHTML = '<div class="center"><div class="big">🐜</div><p>Couldn\'t open that job. <a href="/platform/tech.html">Back</a></p></div>'; return; }
      job = r.data[0]; render();
    };
    // Try with the optional columns (scheduling flags = migration 014, status timestamps =
    // migration 018). If either set isn't there yet, fall back so the cockpit always opens.
    var flags = 'needs_two_techs,long_job,';
    var stamps = 'en_route_at,started_at,completed_at,stop_id,';
    sb.from('job').select(base + flags + stamps + tail).eq('id', jobId).limit(1).then(function(r){
      if (!r.error) { done(r); return; }
      sb.from('job').select(base + flags + tail).eq('id', jobId).limit(1).then(function(r2){
        if (!r2.error) { done(r2); return; }
        sb.from('job').select(base + tail).eq('id', jobId).limit(1).then(done);
      });
    });
  }

  function attrs(){ return (job.unit && job.unit.attributes) || {}; }
  function tdr(){ return (job.tdr && job.tdr[0]) || null; }

  function render() {
    var s = st(job.status), cust = job.customer || {}, a = attrs(), t = tdr();
    var addr = [cust.address, cust.city, cust.state].filter(Boolean).join(', ');
    var phone = (cust.phone||'').replace(/[^0-9+]/g,'');
    var media = job.media || [];
    var isTech = function(m){ return /^tech/i.test(m.label||''); };
    // Unified media grid (customer shots first, then the tech's) — every pic + clip in one
    // clean grid: tap to view big, red trash to remove. TN's setup, ported.
    var ordered = media.filter(function(m){return !isTech(m);}).concat(media.filter(isTech));
    var mediaGrid = ordered.length ? '<div class="mgrid">'+ordered.map(mediaTile).join('')+'</div>' : '<div class="note" style="margin-top:12px">No photos or video yet — snap the appliance, the model sticker, and a short clip of the problem.</div>';

    app.innerHTML =
      '<header><a class="back" href="/platform/tech.html">‹ My Jobs</a><span class="shop" id="shop"></span></header>' +
      '<div class="shell">' +

      // ── 1 · Who / what · call · navigate ──
      '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">' +
        '<div><div class="cust">'+esc(fullName(cust)||'Customer')+'</div>'+(job.unit&&job.unit.label?'<div class="unit">'+esc(job.unit.label)+'</div>':'')+(job.scheduled_day?'<div class="unit">📅 '+esc(fmtDay(job.scheduled_day))+'</div>':'')+'</div>' +
        '<span class="spill s-'+esc(job.status||'new')+'" style="flex:none">'+esc(s.l)+'</span></div>' +
        (job.problem?'<div class="prob">'+esc(job.problem)+'</div>':'') +
        '<div class="links">'+(phone?'<a href="tel:'+esc(phone)+'">📞 Call</a>':'')+(addr?'<a target="_blank" rel="noopener" href="https://maps.google.com/?q='+encodeURIComponent(addr)+'">🧭 Navigate</a>':'')+'</div>' +
        '</div>' +

      // ── 2 · The job — On my way / Start / Complete + schedule + waiver ──
      '<div class="card"><div class="sec">🚦 The job</div>' +
        '<div class="statustiles">' +
          '<button class="stile otw'+(job.en_route_at?' on':'')+'" id="otwBtn"'+(addr?'':' disabled')+'><span class="ic">🚚</span>On my way</button>' +
          '<button class="stile run'+(job.status==='in_progress'?' on':'')+'" id="startBtn"><span class="ic">'+(job.status==='in_progress'?'⏸':'▶️')+'</span>'+(job.status==='in_progress'?'Pause':(job.started_at?'Resume':'Start job'))+'</button>' +
          '<button class="stile done'+(job.status==='completed'?' on':'')+'" data-scrollreport><span class="ic">✅</span>Complete</button>' +
        '</div>' +
        '<div class="stimes">'+statusTimes()+'</div>' +
        '<button class="full" id="schedBtn">📅 Schedule on my day · move · hand off</button>' +
        '<div id="schedBox" class="hidden" style="margin-top:10px"></div>' +
        (job.status==='completed'||job.status==='canceled'?'<button class="full reopen" id="reopenBtn" style="margin-top:8px">↩️ Made a mistake? Reopen &amp; change how this ended</button>':'') +
        (job.status==='completed'?reviewAskHtml():'') +
        // Release of liability — big and unmissable, right where the tech works the job.
        (job.waiver_signed_at
          ? '<button class="bigwaiver" id="wvToggle" style="margin-top:12px">✍️ Release signed — tap to re-sign</button>'+
            '<div id="wvBox" class="hidden" style="margin-top:10px"></div>'+
            '<div class="wvok">✅ Release of liability signed'+(job.waiver_name?' — '+esc(job.waiver_name):'')+'</div>'
          : '<button class="bigwaiver" id="wvToggle" style="margin-top:12px">✍️ Customer signs release of liability</button>'+
            '<div class="wvwarn">⚠️ Not signed yet — have the customer sign before you start</div>'+
            '<div id="wvBox" class="hidden" style="margin-top:10px"></div>') +
        '</div>' +

      // ── 3 · What the customer told us (problem · availability · access · their media) ──
      ((job.problem||job.availability||job.access_notes) ?
        '<div class="card"><div class="sec">🗣️ What the customer told us</div>' +
          (job.problem?'<div class="kv">🧰 <b>'+esc(job.problem)+'</b></div>':'') +
          (job.availability?'<div class="kv">📅 '+esc(job.availability)+'</div>':'') +
          (job.access_notes?'<div class="kv">🔑 '+esc(job.access_notes)+'</div>':'') +
          '<div class="note" style="margin-top:8px">📹 Their video &amp; photos are in <b>Photos &amp; Video</b> below.</div>' +
        '</div>' : '') +

      // ── 4 · 🧠 Diagnose & price — the Teddy Tool, folded into the job tile ──
      '<div class="card"><div class="sec">🧠 Diagnose &amp; price</div>' +
        // Model # (scanned off the sticker) — the same #tb/#tm the report saves from
        '<div class="model"><span class="mval" id="modelVal">'+esc(a.model||'—')+'</span>'+(a.brand?'<span class="unit">'+esc(a.brand)+'</span>':'')+'</div>' +
        '<div class="mrow"><input id="tb" placeholder="Brand" value="'+esc(t?t.brand||a.brand:a.brand||'')+'"><input id="tm" placeholder="Model #" value="'+esc(t?t.model||a.model:a.model||'')+'"></div>' +
        '<div class="btnrow"><button class="full" id="ocrBtn">📸 Scan model # off the sticker<input type="file" accept="image/*" capture="environment" id="ocrFile" class="hidden"></button></div>' +
        '<div class="note hidden" id="ocrMsg"></div>' +
        // What usually fixes this — the cross-shop brain
        '<button class="full" id="brainBtn" style="margin-top:11px">🧠 What usually fixes this</button>' +
        '<div class="brainbox hidden" id="brainBox"></div>' +
        // Find the part — the SHOP-CONFIGURABLE supplier area (⚙️ add/swap your own sources)
        '<div class="sec" style="margin:16px 0 8px">🔩 Find the part <button type="button" class="supcfg" id="supCfg" title="Add or swap your part sources">⚙️</button></div>' +
        '<input class="partq" id="partq" placeholder="Model # or part #" value="'+esc(a.model||'')+'">' +
        '<div class="note" style="margin:2px 0 9px">Reads the model off the customer\'s photo automatically. Tap ⚙️ to <b>add or remove part sources</b> — log into whichever supplier your shop uses. The built-in helpers stay.</div>' +
        '<div id="partbtns"></div>' +
        // Flat-rate repair menu — the "price" half; taps fill labor + the total to collect
        '<button class="full" id="menuBtn" style="margin-top:14px">💲 Flat-rate repair menu</button>' +
        '<div id="menuBox" class="hidden" style="margin-top:8px"></div>' +
        '</div>' +

      // ── 5 · 📸 Photos & Video — the customer's clip + your shots, one grid ──
      '<div class="card">' +
        '<div class="mediahead"><div class="sec" style="margin:0">📸 Photos &amp; Video</div><button class="reflink" id="mediaRefresh">↻ refresh</button></div>' +
        '<div class="capgrid">' +
          '<button class="captile" id="capPhotoTake"><span class="ci">📷</span>Take photo<input type="file" accept="image/*" capture="environment" id="fPhotoTake" class="hidden"></button>' +
          '<button class="captile" id="capPhotoLib"><span class="ci">🖼️</span>Photo library<input type="file" accept="image/*" multiple id="fPhotoLib" class="hidden"></button>' +
          '<button class="captile" id="capVidRec"><span class="ci">📹</span>Record video<input type="file" accept="video/*" capture="environment" id="fVidRec" class="hidden"></button>' +
          '<button class="captile" id="capVidLib"><span class="ci">🎞️</span>Video library<input type="file" accept="video/*" id="fVidLib" class="hidden"></button>' +
        '</div>' +
        '<div class="tip">💡 A <b>15–30 sec</b> clip uploads fastest. Longer videos work too — they just take a little longer to upload &amp; process.</div>' +
        mediaGrid +
        '<div class="note hidden" id="tmMsg"></div>' +
      '</div>' +

      // ── 6 · 📝 The report (TDR) ──
      '<div class="card" id="reportCard"><div class="sec">📝 The report</div>' +
        '<div class="tdr">' +
          // 🔍 What failed (required)
          '<div class="fld">' +
            '<div class="fld-ic">🔍</div><div class="fld-body">' +
              '<div class="fld-lab">What failed</div>' +
              '<div class="fld-hint">The part or component that went bad</div>' +
              '<input id="tc" placeholder="e.g. heating element" value="'+esc(t?t.failed_component||'':'')+'">' +
            '</div></div>' +
          // 📦 Part & part # + status + the "office, I need this part" alert
          '<div class="fld">' +
            '<div class="fld-ic">📦</div><div class="fld-body">' +
              '<div class="fld-lab">Part &amp; part #</div>' +
              '<div class="fld-hint">The part you used — and its number</div>' +
              '<input id="tp" placeholder="Part number" value="'+esc(t?t.part_number||'':'')+'">' +
              '<div class="btnrow psrow" id="psrow">' +
                '<button type="button" data-ps="please_order">🛒 Please order</button>' +
                '<button type="button" data-ps="truck">🚚 On my truck</button>' +
                '<button type="button" data-ps="used">🔧 Used</button>' +
                '<button type="button" data-ps="return">↩️ Return</button>' +
                '<button type="button" data-ps="missing">⚠️ Missing</button>' +
              '</div>' +
            '</div></div>' +
          // ⏱️ Labor hours
          '<div class="fld">' +
            '<div class="fld-ic">⏱️</div><div class="fld-body">' +
              '<div class="fld-lab">Labor hours</div>' +
              '<div class="fld-hint">Total time on the job</div>' +
              '<input id="th" inputmode="decimal" placeholder="e.g. 1.5" value="'+esc(t&&t.labor_hours!=null?t.labor_hours:'')+'">' +
            '</div></div>' +
          // 📝 Root cause & notes
          '<div class="fld">' +
            '<div class="fld-ic">📝</div><div class="fld-body">' +
              '<div class="fld-lab">Root cause &amp; notes</div>' +
              '<div class="fld-hint">Why it failed / anything the office should know</div>' +
              '<input id="tr" placeholder="Short root cause or note" value="'+esc(t?t.root_cause||'':'')+'">' +
            '</div></div>' +
          // 🔧 Job status — the big TN picker
          '<div class="fld" data-always>' +
            '<div class="fld-ic">🔧</div><div class="fld-body">' +
              '<div class="fld-lab">Job status</div>' +
              '<div class="fld-hint">How did this end?</div>' +
              '<div class="statusgrid" id="ostat">' +
                '<button type="button" class="sbtn" data-o="fixed">✅ Job complete</button>' +
                '<button type="button" class="sbtn" data-o="return_needed">🔁 Needs a return visit</button>' +
                '<button type="button" class="sbtn" data-o="not_fixable">♻️ Not fixable — recommend replacement</button>' +
                '<button type="button" class="sbtn" data-o="reassign">🔄 Please reassign</button>' +
              '</div>' +
              (t?'<label class="cameback"><input type="checkbox" id="tcb"'+(t.held===false?' checked':'')+'> This came back — the last fix didn\'t hold</label>':'') +
            '</div></div>' +
          '<button class="primary full" id="saveTdr">Save report + finish</button><div class="err" id="tdrErr"></div>' +
        '</div></div>' +

      // ── 6b · 📦 Parts for this job — TN's per-part tracker (order / claim-only, then used/return/not-here) ──
      '<div class="card" id="partsCard"><div class="sec">📦 Parts for this job</div>' +
        '<div class="note" style="margin:-2px 0 11px">Add each part you need. Tap <b>Please order</b> to put it on the office queue, or <b>just the part #</b> to log it for the claim. Once it arrives: <b>Used</b> if you installed it, <b>Return</b> if it ships back, <b>Not here</b> if the customer doesn\'t have it.</div>' +
        '<div id="partsBox"><div class="note">Loading…</div></div>' +
        '<div class="paddrow"><input id="pAddName" placeholder="Part name (e.g. water valve)"><input id="pAddNum" placeholder="Part #"></div>' +
        '<div class="paddrow" style="margin-top:8px"><input id="pAddCost" inputmode="decimal" placeholder="Your cost $ (optional)"></div>' +
        '<div class="note" style="margin:6px 0 0">Enter what it <b>cost you</b> — the office/owner set the margin, so the customer price fills in automatically. Never guess what to charge.</div>' +
        '<button class="full primary" id="pAddBtn" style="margin-top:8px">➕ Add this part</button>' +
        '<div class="err" id="pAddErr"></div></div>' +

      // ── 7 · 🧾 Invoice — the tech builds the whole thing (labor · parts · add-on services · tax) ──
      '<div class="card invcard" id="payCard"><div class="sec">🧾 Invoice — build it &amp; get paid</div>' +
        '<div id="payStatus" class="note" style="margin:-2px 0 12px">Build the invoice right here — labor, the parts you used, and add services with one tap. Tax + margins are built in. <b>The customer never sees your cost.</b></div>' +
        '<div class="invlab">Labor</div>' +
        '<div class="invmoney"><span class="d">$</span><input id="invLabor" inputmode="decimal" placeholder="0.00"></div>' +
        '<div class="invlab">Parts &amp; services</div>' +
        '<div id="invItems"><div class="note" style="margin:0">Nothing added yet — the parts you logged pull in automatically, and you can add a service below.</div></div>' +
        '<div class="invadd"><select id="invAddSel"></select><button id="invAddBtn">＋ Add</button></div>' +
        '<div class="invlab">Trip / diagnostic fee</div>' +
        '<div class="invmoney"><span class="d">$</span><input id="invFee" inputmode="decimal" placeholder="0.00"></div>' +
        '<div class="invtot" id="invTotals"></div>' +
        '<input type="hidden" id="payAmt">' +   // computed total, for the send/collect plumbing
        '<div class="btnrow" style="margin-top:12px">' +
          '<button class="primary" id="payText">💳 Text invoice / pay link</button>' +
          '<button id="payCollect">✅ Mark collected</button>' +
        '</div>' +
        '<div id="payMethods" class="hidden" style="margin-top:8px">' +
          '<div class="note" style="margin-bottom:6px">How\'d they pay?</div>' +
          '<div class="btnrow psrow" id="pmrow">' +
            '<button type="button" data-pm="cash">💵 Cash</button>' +
            '<button type="button" data-pm="card">💳 Card</button>' +
            '<button type="button" data-pm="check">🧾 Check</button>' +
            '<button type="button" data-pm="zelle">Zelle</button>' +
            '<button type="button" data-pm="venmo">Venmo</button>' +
          '</div>' +
        '</div>' +
        '<div class="err" id="payErr"></div></div>' +

      // ── 8 · 💬 Conversation — Ann (AI) · office · customer · you ──
      '<div class="card"><div class="sec">💬 Conversation — every text on this job</div>' +
        '<div class="note" style="margin:-2px 0 8px">🤖 Ant (AI) · 🏢 office · 👤 the customer — the whole thread, and text them yourself below.</div>' +
        '<div class="thr" id="thr"><div class="note">Loading…</div></div>' +
        '<div style="display:flex;gap:8px;margin-top:10px">' +
          '<textarea id="msgBox" placeholder="Type a message to '+esc((cust.first_name||'the customer'))+'…" style="flex:1;resize:none;min-height:44px;max-height:120px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;box-sizing:border-box"></textarea>' +
          '<button class="primary" id="msgSend" style="align-self:stretch;min-width:74px">Send</button>' +
        '</div><div class="err" id="msgErr"></div></div>' +

      // ── 9 · 🧩 This stop + heads-up for the office ──
      '<div class="card" id="machineCard"><div class="sec">🧩 This stop — machines</div>' +
        '<div class="note" style="margin:-2px 0 9px">Several appliances on one visit? Switch between them or add another — each keeps its own report.</div>' +
        '<div id="machineBox" class="mchips"><button class="mchip cur">'+esc((job.unit&&job.unit.label)||'This machine')+'</button></div>' +
        '<div id="addMachineBox" class="hidden" style="margin-top:11px">' +
          '<input id="amLabel" placeholder="What machine? (e.g. Kenmore dryer)">' +
          '<input id="amProblem" placeholder="What\'s it doing? (optional)" style="margin-top:8px">' +
          '<button class="primary full" id="amAdd" style="margin-top:8px">Add machine</button>' +
          '<div class="err" id="amErr"></div>' +
        '</div></div>' +

      '<div class="card"><div class="sec">📋 Heads-up for the office</div>' +
        '<div class="note" style="margin:-2px 0 9px">Flag this job so the office blocks the right slot next time — a wider window, or a second tech.</div>' +
        '<div class="btnrow psrow" id="schedflags">' +
          '<button type="button" data-flag="two" class="'+(job.needs_two_techs?'sel':'')+'">🧑‍🤝‍🧑 Two-man job</button>' +
          '<button type="button" data-flag="long" class="'+(job.long_job?'sel':'')+'">⏳ Time-consuming</button>' +
        '</div>' +
        '<button class="full" id="jdToggle" style="margin-top:10px">✏️ Edit job details</button>' +
        '<div class="note" style="margin:6px 0 0">Anything off — address, model, name? Fix it here; it updates the office tile &amp; the customer\'s record too.</div>' +
        '<div id="jdBox" class="hidden" style="margin-top:10px"></div>' +
        '<div class="err" id="flagMsg"></div></div>' +

      '</div>';

    capWire('capPhotoTake','fPhotoTake',addTechPhoto);

        var sv = document.getElementById('saveTdr');
        if (sv) sv.textContent = outcomeSel === 'reassign' ? 'Send back to the office' : 'Save report + finish';

    paintFlds();
    document.getElementById('saveTdr').onclick = saveTdr;

    // Shared job details — the tech can correct the SAME customer/unit/job rows the office

    if(jdToggle) jdToggle.onclick=function(){
      if(jdBox.classList.contains('hidden')){ renderJdEditor(jdBox); jdBox.classList.remove('hidden'); jdToggle.textContent='✕ Close'; }
      else { jdBox.classList.add('hidden'); jdToggle.textContent='✏️ Edit job details'; }

    if(wvToggle){ var wvLabel=wvToggle.textContent; wvToggle.onclick=function(){
      if(wvBox.classList.contains('hidden')){ renderWaiverBox(wvBox); wvBox.classList.remove('hidden'); wvToggle.textContent='✕ Close'; }
      else { wvBox.classList.add('hidden'); wvToggle.textContent=wvLabel; }

    // Invoice builder — labor/fee inputs recompute; the ＋ Add dropdown adds a service/part.
    var invLabor=document.getElementById('invLabor'); if(invLabor) invLabor.oninput=recomputeInv;
    var invFee=document.getElementById('invFee'); if(invFee) invFee.oninput=recomputeInv;
    var invAddBtn=document.getElementById('invAddBtn'); if(invAddBtn) invAddBtn.onclick=invAddLine;

  // ── INVOICE (the tech builds it) + GET PAID ─────────────────────────────────
  function loadInvoice(){
    sb.from('invoice').select('id,status,total_cents,paid_method,paid_at').eq('job_id',jobId).order('created_at',{ascending:false}).limit(1).then(function(r){
      invoice=(r.data&&r.data[0])||null; renderPayStatus();
    });
  }
  function money(c){ c=Math.round(c||0); return '$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function renderPayStatus(){
    var st=document.getElementById('payStatus'); if(!st) return;
    if(invoice){
      if(invoice.status==='paid'){ st.innerHTML='<b style="color:var(--completed)">✅ PAID '+money(invoice.total_cents)+'</b>'+(invoice.paid_method?' · '+esc(invoice.paid_method):''); }
      else if(invoice.status==='sent'){ st.innerHTML='🧾 Invoice sent — '+money(invoice.total_cents)+' due. Add to it, collect it, or resend the link.'; }
      else { st.innerHTML='Draft saved — build it below, then text it or collect it. <b>The customer never sees your cost.</b>'; }
    } else { st.innerHTML='Build the invoice below — labor, parts, add services. Tax + margins are built in. <b>The customer never sees your cost.</b>'; }
  }
  function amountCents(){ var v=parseFloat((document.getElementById('payAmt')||{}).value||''); return v>0?Math.round(v*100):0; }

  // The tech's FULL invoice — labor + itemized parts/services + trip fee, taxed at the shop
  // rate (settings.tax_rate). Add-on services come from a shop-editable catalog
  // (settings.addons) so the tech adds a vent hose / supply line / cleanout in one tap, no
  // call to the office. Costs are NEVER shown (retail only); the office reads the SAME numbers
  // back off the invoice lines (kind labor/part/fee — the exact split the office worksheet uses).
  var INVOICE_ADDONS_DEFAULT = [
    { name:'Dryer vent cleaning', price:120 },
    { name:'Dryer cleanout (deep clean)', price:80 },
    { name:'Dryer vent hose replacement', price:45 },
    { name:'Washer fill hoses (pair, installed)', price:60 },
    { name:'Dishwasher supply line', price:65 },
    { name:'Refrigerator water line', price:55 },
    { name:'Ice maker water line', price:55 },
    { name:'Refrigerator condenser coil cleaning', price:70 },
    { name:'Anti-tip bracket (range)', price:50 }
  ];
  function invAddons(){ var a=(shopSettings&&shopSettings.addons); return (Array.isArray(a)&&a.length)?a:INVOICE_ADDONS_DEFAULT; }
  function invTaxRate(){ var t=(shopSettings&&shopSettings.tax_rate); return (t!=null&&!isNaN(+t))?+t:0; }
  var invItems=[];   // [{desc, cents}] — every billable line item (parts you logged + services you add)

  function loadInvoiceBuilder(){
    var sel=document.getElementById('invAddSel');
    if(sel){ sel.innerHTML='<option value="">＋ Add a service or part…</option>'+invAddons().map(function(a,i){ return '<option value="'+i+'">'+esc(a.name)+' — '+fmtUSD(Math.round((+a.price||0)*100))+'</option>'; }).join('')+'<option value="__custom">✎ Custom line…</option>'; }
    sb.from('invoice').select('id').eq('job_id',jobId).order('created_at',{ascending:false}).limit(1).then(function(r){
      var inv=(r.data&&r.data[0])||null;
      if(inv){
        // an invoice already exists → it's authoritative; load its lines back in
        sb.from('invoice_line').select('kind,description,unit_cents,qty').eq('invoice_id',inv.id).then(function(lr){
          var rows=lr.data||[], lab=0, fee=0; invItems=[];
          rows.forEach(function(l){ var c=(+l.unit_cents||0)*(+l.qty||1); if(l.kind==='labor') lab+=c; else if(l.kind==='fee') fee+=c; else invItems.push({desc:l.description||'Item',cents:c}); });
          var li=document.getElementById('invLabor'); if(li&&lab) li.value=(lab/100).toFixed(2);
          var fi=document.getElementById('invFee'); if(fi&&fee) fi.value=(fee/100).toFixed(2);
          renderInvItems(); recomputeInv();
        });
      } else {
        // fresh → seed the parts you logged at RETAIL (owner's margin); costs stay hidden
        sb.from('job_part').select('name,number,cost_cents,sell_cents').eq('job_id',jobId).order('created_at').then(function(pr){
          invItems=[]; (pr.data||[]).forEach(function(p){ var retail=p.sell_cents||retailCents(p.cost_cents); if(retail>0) invItems.push({ desc:(p.name||'Part')+(p.number?' · '+p.number:''), cents:retail }); });
          renderInvItems(); recomputeInv();
        });
      }
    });
  }
  function renderInvItems(){
    var box=document.getElementById('invItems'); if(!box) return;
    if(!invItems.length){ box.innerHTML='<div class="note" style="margin:0">Nothing added yet — the parts you logged pull in automatically, and you can add a service below.</div>'; return; }
    box.innerHTML=invItems.map(function(it,i){
      return '<div class="invrow"><span class="nm">'+esc(it.desc)+'</span><span class="d">$</span><input class="amt" inputmode="decimal" data-inv="'+i+'" value="'+(((+it.cents||0))/100).toFixed(2)+'"><button class="rm" data-invrm="'+i+'" title="Remove">✕</button></div>';
    }).join('');
    box.querySelectorAll('input[data-inv]').forEach(function(el){ el.oninput=function(){ var it=invItems[+el.getAttribute('data-inv')]; if(it){ it.cents=dollarsToCents(el.value); recomputeInv(); } }; });
    box.querySelectorAll('button[data-invrm]').forEach(function(el){ el.onclick=function(){ invItems.splice(+el.getAttribute('data-invrm'),1); renderInvItems(); recomputeInv(); }; });
  }
  function recomputeInv(){
    var labor=dollarsToCents((document.getElementById('invLabor')||{}).value);
    var fee=dollarsToCents((document.getElementById('invFee')||{}).value);
    var items=invItems.reduce(function(s,it){ return s+(+it.cents||0); },0);
    var sub=labor+fee+items, rate=invTaxRate(), tax=Math.round(sub*rate/100), total=sub+tax;
    var t=document.getElementById('invTotals');
    if(t){ t.innerHTML='<div class="tr"><span>Subtotal</span><b>'+fmtUSD(sub)+'</b></div>'+
      '<div class="tr"><span>Tax ('+rate+'%)</span><b>'+fmtUSD(tax)+'</b></div>'+
      '<div class="tr grand"><span>Total to collect</span><b>'+fmtUSD(total)+'</b></div>'; }
    var pa=document.getElementById('payAmt'); if(pa) pa.value=(total/100).toFixed(2);
    return { labor:labor, fee:fee, items:items, sub:sub, tax:tax, total:total, rate:rate };
  }
  function invAddLine(){
    var sel=document.getElementById('invAddSel'); if(!sel) return; var v=sel.value; if(!v) return;
    if(v==='__custom'){ var nm=window.prompt('What line item?'); nm=(nm||'').trim(); if(!nm){ sel.value=''; return; } var pr=window.prompt('Price for "'+nm+'"? ($)'); invItems.push({ desc:nm, cents:dollarsToCents(pr) }); }
    else { var a=invAddons()[+v]; if(a) invItems.push({ desc:a.name, cents:Math.round((+a.price||0)*100) }); }
    sel.value=''; renderInvItems(); recomputeInv();
  }

  // Create-or-update THE job's invoice (RLS scopes it to this shop) and write EVERY line item
  // (labor · each part/service · trip fee) so the office invoice reads back the SAME numbers.
  function ensureInvoice(_ignored, status){
    var brk=recomputeInv();
    var row={ company_id:me.company_id, job_id:jobId, customer_id:job.customer_id||null, status:status||'draft', subtotal_cents:brk.sub, tax_cents:brk.tax, total_cents:brk.total, labor_cents:brk.labor };
    var p = invoice
      ? sb.from('invoice').update(row).eq('id',invoice.id).select('id').then(function(r){ return (r.data&&r.data[0])?r.data[0].id:invoice.id; })
      : sb.from('invoice').insert(row).select('id').then(function(r){ return (r.data&&r.data[0])?r.data[0].id:null; });
    return p.then(function(invId){
      if(!invId) return null;
      return sb.from('invoice_line').delete().eq('invoice_id',invId).then(function(){
        var lines=[];
        if(brk.labor>0) lines.push({ company_id:me.company_id, invoice_id:invId, kind:'labor', description:'Labor', qty:1, unit_cents:brk.labor });
        invItems.forEach(function(it){ if((+it.cents||0)>0) lines.push({ company_id:me.company_id, invoice_id:invId, kind:'part', description:it.desc, qty:1, unit_cents:Math.round(+it.cents) }); });
        if(brk.fee>0) lines.push({ company_id:me.company_id, invoice_id:invId, kind:'fee', description:'Trip / diagnostic fee', qty:1, unit_cents:brk.fee });
        if(!lines.length) lines.push({ company_id:me.company_id, invoice_id:invId, kind:'labor', description:(job.unit&&job.unit.label?job.unit.label+' repair':'Appliance repair'), qty:1, unit_cents:brk.total });
        return sb.from('invoice_line').insert(lines).then(function(){ return invId; });
      });
    });
  }
  function sendPayLink(){
    var cents=amountCents(); var err=document.getElementById('payErr'); err.textContent='';
    if(!cents){ err.textContent='Enter the amount first.'; return; }
    var btn=document.getElementById('payText'); btn.disabled=true; btn.textContent='Sending…';
    ensureInvoice(cents,'sent').then(function(invId){
      if(!invId){ btn.disabled=false; btn.textContent='💳 Text invoice / pay link'; err.textContent='Couldn\'t save the invoice.'; return; }
      return token().then(function(tok){
        return fetch('/.netlify/functions/platform-invoice?do=send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:jobId,access_token:tok})})
          .then(function(r){return r.json();}).then(function(d){
            btn.disabled=false;
            if(d&&d.ok){ btn.textContent=d.texted?'💳 Invoice sent ✓':'💳 Saved — no phone on file'; loadInvoice(); }
            else { btn.textContent='💳 Text invoice / pay link'; err.textContent=(d&&d.error)||'Couldn\'t send.'; }
          });
      });
    }).catch(function(){ var b=document.getElementById('payText'); if(b){ b.disabled=false; b.textContent='💳 Text invoice / pay link'; } });
  }
  function markCollected(method){
    var cents=amountCents(); var err=document.getElementById('payErr'); err.textContent='';
    if(!cents){ err.textContent='Enter the amount collected first.'; return; }
    ensureInvoice(cents,'paid').then(function(invId){
      if(!invId){ err.textContent='Couldn\'t save the payment.'; return; }
      sb.from('invoice').update({ status:'paid', paid_method:method, paid_at:new Date().toISOString() }).eq('id',invId).then(function(r){
        if(r.error){ err.textContent=r.error.message; return; }
        var pm=document.getElementById('payMethods'); if(pm) pm.classList.add('hidden');
        // 💵 Money in — celebrate the collect.
        if(window.antCelebrate){ try{ window.antCelebrate({ tag:'Paid', big:'PAID! 💵', tiles:[{value:money(cents),label:'Collected · '+method,accent:'#4ade80'}], cue:'win' }); }catch(_){ } }
        loadInvoice();
      });
    });
  }

  // ── SCHEDULE / MOVE / HAND OFF ──────────────────────────────────────────────
  function dstr(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
  function addDaysStr(n){ var d=new Date(); d.setDate(d.getDate()+n); return dstr(d); }
  function fmtDay(d){ if(!d) return ''; var p=String(d).split('-'); if(p.length!==3) return d; var dt=new Date(+p[0],+p[1]-1,+p[2]); return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
  function renderSchedBox(box){

  function runOcr(file) {
    var msg = document.getElementById('ocrMsg'); msg.classList.remove('hidden'); msg.textContent = 'Reading the sticker…';
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var max=1400,w=img.width,h=img.height; if(Math.max(w,h)>max){var s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      var data=cv.toDataURL('image/jpeg',0.8);
      fetch('/.netlify/functions/platform-ocr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:data})}).then(function(r){return r.json();}).then(function(d){
        if (!d || !d.ok || !d.model) { msg.textContent = (d&&d.error==='ocr_not_configured')?'Model reader isn\'t on yet — type it below.':'Couldn\'t read a model # — try a clearer photo, or type it below.'; return; }
        msg.textContent = 'Read model: ' + d.model + (d.brand?' ('+d.brand+')':'');
        applyModel(d);
      }).catch(function(){ msg.textContent='Couldn\'t reach the model reader — type it below.'; });
    };
    img.onerror=function(){ msg.textContent='That file didn\'t work — try a photo.'; };
    img.src=url;
  }

  // fill the model into the header, the parts search, and the report — and persist it to

    if(!d||!d.model) return;
    var mv=document.getElementById('modelVal'); if(mv) mv.textContent=d.model;
    var pq=document.getElementById('partq'); if(pq && !pq.value) pq.value=d.model;
    var tm=document.getElementById('tm'); if(tm && !tm.value) tm.value=d.model;
    var tb=document.getElementById('tb'); if(tb && !tb.value && d.brand) tb.value=d.brand;
    if(job.unit && job.unit.id){
      var newAttrs=Object.assign({}, attrs(), {model:d.model}); if(d.brand)newAttrs.brand=d.brand; if(d.serial)newAttrs.serial=d.serial;
      sb.from('unit').update({attributes:newAttrs}).eq('id',job.unit.id).then(function(){ job.unit.attributes=newAttrs; });
    }
  }

  // on open: if we don't have the model yet but the customer sent a model-sticker photo at
  // intake, read it automatically so the model is already in the parts search + report.
  function autoModel(){
    if(attrs().model) return;
    var pho=(job.media||[]).filter(function(m){return m.kind==='photo'&&(m.provider==='storage'||m.provider==='r2')&&!/^tech/i.test(m.label||'');})[0];

    var mv=document.getElementById('modelVal'); if(mv) mv.textContent='reading…';
    sb.storage.from('intake-photos').createSignedUrl(pho.ref,600).then(function(sr){
      var u=(sr&&sr.data&&sr.data.signedUrl)||''; if(!u){ fail(); return; }
      fetch('/.netlify/functions/platform-ocr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})})
        .then(function(r){return r.json();}).then(function(d){ if(d&&d.ok&&d.model){ applyModel(d); } else { fail(); } })

  function addMachine(){
    var label=(document.getElementById('amLabel').value||'').trim();
    var prob=(document.getElementById('amProblem').value||'').trim();

    if(!label){ err.textContent='What machine is it?'; return; }
    var btn=document.getElementById('amAdd'); btn.disabled=true; btn.textContent='Adding…';
    var sid = job.stop_id || jobId;
    var kind = (job.unit&&job.unit.kind)||'appliance';
    var fail=function(e){ btn.disabled=false; btn.textContent='Add machine'; err.textContent=(e&&/stop_id|does not exist|column|schema cache/i.test(e.message||''))?'Run migration 020 in Supabase to enable multi-machine.':((e&&e.message)||'Couldn\'t add — try again.'); };
    var proceed=function(){
      sb.from('unit').insert({company_id:me.company_id, customer_id:job.customer_id, kind:kind, label:label}).select('id').then(function(ru){
        if(ru.error||!ru.data||!ru.data[0]){ fail(ru.error); return; }
        var uid=ru.data[0].id;
        var ns=(job.status==='completed'||job.status==='canceled')?'scheduled':(job.status||'scheduled');
        sb.from('job').insert({company_id:me.company_id, customer_id:job.customer_id, unit_id:uid, technician_id:job.technician_id, stop_id:sid, status:ns, problem:prob, scheduled_day:job.scheduled_day, source:'tech_add_machine'}).select('id').then(function(rj){

          location.href='?job='+rj.data[0].id;

    if(!job.stop_id){ sb.from('job').update({stop_id:sid}).eq('id',jobId).then(function(r){ if(r.error){ fail(r.error); return; } proceed(); }); }
