  // ── PARTS TRACKER — per-part order / claim-only, then Used / Return / Not here + proof ──
  function loadParts(){
    var box=document.getElementById('partsBox'); if(!box) return;
    sb.from('job_part').select('id,name,number,order_status,disposition,photo_ref,cost_cents,sell_cents').eq('job_id',jobId).order('created_at').then(function(r){
      if(r.error){
        var card=document.getElementById('partsCard');
        if(/job_part|does not exist|relation|schema cache/i.test(r.error.message||'')){ if(card) card.classList.add('hidden'); }
        else box.innerHTML='<div class="note">Couldn\'t load parts.</div>';
        return;
      }
      renderParts(r.data||[]);
    });
  }
  // Parts pricing — the owner sets ONE margin (settings.parts); the tech only ever enters COST.
  // retail = max(cost × (1 + markup%), cost + minimum-added). The tech never asks "what do we charge."
  function partsCfg(){ var p=(shopSettings&&shopSettings.parts)||{}; return { pct:(p.markup_pct!=null?+p.markup_pct:50), minAdd:(+p.min_add_cents||0) }; }
  function retailCents(costCents){ costCents=+costCents||0; if(costCents<=0) return 0; var c=partsCfg(); return Math.max(Math.round(costCents*(1+c.pct/100)), costCents+c.minAdd); }
  function dollarsToCents(v){ var n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); return isNaN(n)?0:Math.round(n*100); }
  function fmtUSD(c){ c=+c||0; return '$'+(c/100).toFixed(2); }
  function renderParts(list){
    var box=document.getElementById('partsBox'); if(!box) return;
    var toReturn=list.filter(function(p){return p.disposition==='return';}).length;
    var warn=toReturn?'<div class="cbwarn">🔁 '+toReturn+' to ship back — send them or the shop eats a chargeback.</div>':'';
    box.innerHTML = warn + (list.length ? list.map(partCard).join('') : '<div class="note" style="margin-bottom:2px">No parts yet — add the part(s) you need below.</div>');
  }
  function partCard(p){
    var os=p.order_status||'', dp=p.disposition||'';
    var photo = p.photo_ref
      ? '<div class="pphoto"><img data-pact="viewphoto" data-pval="'+esc(p.photo_ref)+'" data-ph="'+esc(p.photo_ref)+'"><span class="pptxt">✓ Photo on file — tap to view</span></div>'
      : '<div class="pphoto"><div class="snap" data-pact="photo" data-pid="'+esc(p.id)+'">📷</div><span class="pptxt">Optional: snap this part (proof of what you used / sent back)<input type="file" accept="image/*" capture="environment" data-pfile="'+esc(p.id)+'" class="hidden"></span></div>';
    // Cost → auto retail (the office/owner never re-key it; the margin does the pricing).
    var costV = p.cost_cents ? (p.cost_cents/100).toFixed(2) : '';
    var retail = retailCents(p.cost_cents);
    var priceRow = '<div class="pprice">' +
        '<label class="pcost">Your cost <span class="pdol">$</span><input inputmode="decimal" data-pcost="'+esc(p.id)+'" value="'+costV+'" placeholder="0.00"></label>' +
        '<span class="pretail" data-pretail="'+esc(p.id)+'">'+(p.cost_cents?('Customer pays <b>'+fmtUSD(retail)+'</b>'):'Enter cost → price fills in')+'</span>' +
      '</div>';
    return '<div class="pcard">' +
      '<div class="pname">'+esc(p.name||'Part')+(p.number?' <span style="color:var(--completed)">✓</span>':'')+'</div>' +
      (p.number?'<div class="pnum">🔩 '+esc(p.number)+'</div>':'') +
      priceRow +
      '<button class="pordbtn'+((os==='to_order'||os==='ordered')?' sel':'')+'" data-pact="order" data-pid="'+esc(p.id)+'" data-pval="to_order">📦 '+(os==='ordered'?'Ordered':'Please order this part')+'</button>' +
      '<button class="pclaimbtn'+(os==='claim_only'?' sel':'')+'" data-pact="order" data-pid="'+esc(p.id)+'" data-pval="claim_only">📋 Just the part # for the claim (not ordered)</button>' +
      '<div class="parrive">Once it arrives + you install it:</div>' +
      '<div class="pdisp">' +
        '<button class="pu'+(dp==='used'?' sel':'')+'" data-pact="disp" data-pid="'+esc(p.id)+'" data-pval="used">✅ Used</button>' +
        '<button class="pr'+(dp==='return'?' sel':'')+'" data-pact="disp" data-pid="'+esc(p.id)+'" data-pval="return">↩️ Return</button>' +
        '<button class="pn'+(dp==='not_here'?' sel':'')+'" data-pact="disp" data-pid="'+esc(p.id)+'" data-pval="not_here">❌ Not here</button>' +
      '</div>' + photo +
      '<button class="pdel" data-pact="del" data-pid="'+esc(p.id)+'">Remove part</button>' +
    '</div>';
  }
  function addPart(){
    var nm=(document.getElementById('pAddName').value||'').trim(), num=(document.getElementById('pAddNum').value||'').trim();
    var cc=dollarsToCents(document.getElementById('pAddCost').value);
    var err=document.getElementById('pAddErr'); err.textContent='';
    if(!nm && !num){ err.textContent='Add a part name or number.'; return; }
    var btn=document.getElementById('pAddBtn'); btn.disabled=true; btn.textContent='Adding…';
    var row={company_id:me.company_id, job_id:jobId, name:nm, number:num};
    if(cc>0){ row.cost_cents=cc; row.sell_cents=retailCents(cc); }   // cost → auto retail (owner's margin)
    sb.from('job_part').insert(row).then(function(r){
      btn.disabled=false; btn.textContent='➕ Add this part';
      if(r.error){ err.textContent=/job_part|does not exist|relation|schema cache/i.test(r.error.message||'')?'Parts tracking turns on once migration 019 is run in Supabase.':r.error.message; return; }
      document.getElementById('pAddName').value=''; document.getElementById('pAddNum').value=''; document.getElementById('pAddCost').value=''; loadParts();
    });
  }
  // Tech edits a part's cost → recompute retail from the owner's margin, store both, live-update the row.
  function partCost(id, val){
    var cc=dollarsToCents(val), sc=retailCents(cc);
    var lab=document.querySelector('[data-pretail="'+id+'"]');
    if(lab) lab.innerHTML = cc>0 ? 'Customer pays <b>'+fmtUSD(sc)+'</b>' : 'Enter cost → price fills in';
    sb.from('job_part').update({cost_cents:cc>0?cc:null, sell_cents:cc>0?sc:null}).eq('id',id).then(function(){});
  }
  function partOrder(id,val){
    var btn=document.querySelector('[data-pact="order"][data-pid="'+id+'"][data-pval="'+val+'"]');
    var next=(btn&&btn.classList.contains('sel'))?null:val;
    sb.from('job_part').update({order_status:next}).eq('id',id).then(function(r){
      if(r.error){ alert(r.error.message); return; }
      if(next==='to_order'){ sb.from('job').update({status:'awaiting_parts'}).eq('id',jobId).then(function(){ if(job) job.status='awaiting_parts'; loadParts(); }); }
      else loadParts();
    });
  }
  function partDisp(id,val){
    var btn=document.querySelector('[data-pact="disp"][data-pid="'+id+'"][data-pval="'+val+'"]');
    var next=(btn&&btn.classList.contains('sel'))?null:val;
    sb.from('job_part').update({disposition:next}).eq('id',id).then(function(r){ if(r.error){ alert(r.error.message); return; } loadParts(); });
  }
  function delPart(id){
    if(!window.confirm('Remove this part?')) return;
    sb.from('job_part').delete().eq('id',id).then(function(r){ if(r.error){ alert(r.error.message); return; } loadParts(); });
  }
  function partPhoto(id,file){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1400,w=img.width,h=img.height; if(Math.max(w,h)>max){var s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      var data=cv.toDataURL('image/jpeg',0.8);
      token().then(function(tok){
        fetch('/.netlify/functions/platform-tech-media?do=photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:jobId,access_token:tok,data:data,label:'Part photo'})})
          .then(function(r){return r.json();}).then(function(d){
            if(d&&d.ok&&(d.path||d.url)){ var path=d.path||((d.url.split('/intake-photos/')[1]||'').split('?')[0]); sb.from('job_part').update({photo_ref:path}).eq('id',id).then(function(){ loadParts(); }); }
            else alert('Couldn\'t add that photo — try again.');
          }).catch(function(){ alert('Couldn\'t reach the server — try again.'); });
      });
    };
    img.onerror=function(){ alert('That file didn\'t work — try a photo.'); };
    img.src=url;
  }

  function onMyWay(){
    var cust=job.customer||{}; var addr=[cust.address,cust.city,cust.state].filter(Boolean).join(', ');
    if(addr) window.open('https://maps.google.com/?q='+encodeURIComponent(addr),'_blank','noopener'); // open nav right away
    var btn=document.getElementById('otwBtn'); if(btn){ btn.disabled=true; }
    notify('otw'); // text the customer (fire-and-forget)
    // Stamp the time so the tile flips to "on" + shows "On way 11:29am". Best-effort:
    // if the column isn't migrated yet, still reload so the flow keeps working.
    sb.from('job').update({ en_route_at:new Date().toISOString() }).eq('id',jobId).then(function(){ loadJob(); });
  }

  // Start / Pause the job — the middle status tile. Start records the first-start time;
  // Pause drops it back to Scheduled (keeping the start time so it reads "Resume").
  function toggleStart(){
    var btn=document.getElementById('startBtn'); if(btn) btn.disabled=true;
    if(job.status==='in_progress'){
      sb.from('job').update({ status:'scheduled' }).eq('id',jobId).then(loadJob);
      return;
    }
    var upd={ status:'in_progress' }; if(!job.started_at){ upd.started_at=new Date().toISOString(); notify('arrived'); } // customer heads-up on first start
    sb.from('job').update(upd).eq('id',jobId).then(function(r){
      if(r.error && /started_at/i.test(r.error.message||'')){ sb.from('job').update({ status:'in_progress' }).eq('id',jobId).then(loadJob); return; }
      loadJob();
    });
  }

  // The warm "was the customer happy? ask or skip" card (TN). Same markup in the Status
  // card + the just-finished screen; only ever one instance is in the DOM at a time.
  function reviewAskHtml(){
    return '<div class="revask">' +
      '<div class="revh">⭐ Was the customer happy? Ask for a review.</div>' +
      '<div class="revbtns">' +
        '<button class="revsend" id="reviewBtn">✓ Send &quot;How\'d we do?&quot;</button>' +
        '<button class="revskip" id="reviewSkip">Skip this one</button>' +
      '</div>' +
      '<div class="revnote">Texts a friendly &quot;how\'d we do?&quot; with your Google review link for happy customers — anyone unhappy can reply here first, so it stays off the public reviews.</div>' +
    '</div>';
  }
  function wireReviewAsk(){
    var rvw=document.getElementById('reviewBtn'); if(rvw) rvw.onclick=function(){ sendReview(rvw); };
    var skip=document.getElementById('reviewSkip'); if(skip) skip.onclick=function(){ var c=skip.closest('.revask'); if(c) c.style.display='none'; };
  }
  function sendReview(btn){
    if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
    notify('review').then(function(d){ if(btn){ btn.textContent=(d&&d.texted)?'✓ Sent — thank you!':(d&&d.url?'✓ Sent (no phone — link ready)':'Couldn\'t send — try again'); btn.disabled=false; } })
      .catch(function(){ if(btn){ btn.disabled=false; btn.innerHTML='✓ Send &quot;How\'d we do?&quot;'; } });
  }

  // ── CONVERSATION (shared thread) ────────────────────────────────────────────
  function ftime(iso){ if(!iso) return ''; try{ var d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
  function whoOf(m){
    var s=String(m.sender||'');
    if(m.direction==='in') return { cls:'cust', who:'👤 '+((job.customer&&fullName(job.customer))||'Customer') };
    if(s==='ann'||s==='') return { cls:'ann', who:'🤖 Ant · AI' };
    if(/^office/i.test(s)) return { cls:'you', who:'🏢 Office'+(s.indexOf(':')>0?' · '+s.split(':').slice(1).join(':'):'') };
    if(/^tech/i.test(s)) return { cls:'you', who:'🔧 '+(s.indexOf(':')>0?s.split(':').slice(1).join(':'):'You') };
    return { cls:'you', who:esc(s||'You') };
  }
  function loadThread(){
    var box=document.getElementById('thr'); if(!box) return;
    sb.from('thread_message').select('direction,sender,body,created_at').eq('job_id',jobId).order('created_at',{ascending:true}).limit(200).then(function(r){
      var rows=(r.data||[]);
      if(!rows.length){ box.innerHTML='<div class="note">No messages yet — send the first one below.</div>'; return; }
      box.innerHTML=rows.map(function(m){ var w=whoOf(m); return '<div class="bub '+w.cls+'"><span class="who">'+esc(w.who)+'</span>'+esc(m.body||'')+'<span class="tm">'+esc(ftime(m.created_at))+'</span></div>'; }).join('');
      box.scrollTop=box.scrollHeight;
    });
  }
  function sendMsg(){
    var box=document.getElementById('msgBox'), err=document.getElementById('msgErr'), btn=document.getElementById('msgSend');
    var text=(box&&box.value||'').trim(); err.textContent='';
    if(!text) return;
    btn.disabled=true; btn.textContent='…'; var old=box.value; box.value=''; box.style.height='auto';
    token().then(function(tok){
      return fetch('/.netlify/functions/platform-tech-notify?do=message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:jobId,access_token:tok,body:text})})
        .then(function(r){return r.json();}).then(function(d){
          btn.disabled=false; btn.textContent='Send';
          if(d&&d.ok){ if(d.no_phone) err.textContent='Sent to the thread — no phone on file to text.'; loadThread(); }
          else { box.value=old; err.textContent=(d&&d.error)||'Couldn\'t send — try again.'; }
        });
    }).catch(function(){ btn.disabled=false; btn.textContent='Send'; box.value=old; err.textContent='Couldn\'t reach the server — try again.'; });
  }

  function addTechPhoto(file){
    tm('Adding photo…');
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1400,w=img.width,h=img.height; if(Math.max(w,h)>max){var s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      var data=cv.toDataURL('image/jpeg',0.8);
      token().then(function(tok){
        fetch('/.netlify/functions/platform-tech-media?do=photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:jobId,access_token:tok,data:data,label:'Tech photo'})})
          .then(function(r){return r.json();}).then(function(d){ if(d&&d.ok){ tm('Photo added ✓'); loadJob(); } else { tm('Couldn\'t add that photo — try again.'); } })
          .catch(function(){ tm('Couldn\'t reach the server — try again.'); });
      });
    };
    img.onerror=function(){ tm('That file didn\'t work — try a photo.'); };
    img.src=url;
  }

  function addTechVideo(file){
    if(!window.tus){ tm('Video tool didn\'t load — reopen the job and try again.'); return; }
    tm('Starting video upload…');
    token().then(function(tok){
      fetch('/.netlify/functions/platform-tech-media?do=stream_mint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:jobId,access_token:tok,bytes:file.size,filename:file.name||'tech.mp4'})})
        .then(function(r){return r.json();}).then(function(d){
          if(!d||!d.ok||!d.uploadUrl){ tm('Couldn\'t start the video upload — try again.'); return; }
          var up=new window.tus.Upload(file,{ uploadUrl:d.uploadUrl, chunkSize:5*1024*1024, retryDelays:[0,3000,5000,10000,20000,30000], removeFingerprintOnSuccess:true,
            metadata:{filename:file.name||'tech.mp4', filetype:file.type||'video/mp4'},
            onError:function(){ tm('Upload hiccuped — tap Add video to try again.'); },
            onProgress:function(sent,total){ tm('Uploading… '+Math.max(3,Math.round(sent/total*100))+'%'); },
            onSuccess:function(){ tm('Video added ✓'); fetch('/.netlify/functions/platform-tech-media?do=stream_done',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:jobId,access_token:tok,uid:d.uid,label:'Tech video'})}).then(function(){ loadJob(); }); },
          });
          up.start();
        }).catch(function(){ tm('Couldn\'t reach the server — try again.'); });
    });
  }

  // 💲 Flat-rate repair menu — the Teddy-Tool "price" half, folded in. A shop can set its own
  // menu in settings.repair_menu (list of {job, hours, price}); until then a sensible default
  // shows. Tapping a row fills the report's Labor + the "Total to collect" so diagnose → price
  // → report → get-paid all flow from one tap. (Parts are priced separately by the owner margin.)
  var DEFAULT_MENU = [
    { job:'Diagnostic / service call', hours:0.5, price:95 },
    { job:'Dryer — heating element', hours:1, price:150 },
    { job:'Dryer — thermal fuse / thermostat', hours:0.75, price:125 },
    { job:'Washer — drain pump', hours:1.25, price:185 },
    { job:'Washer — door boot / gasket', hours:1.5, price:215 },
    { job:'Fridge — evaporator fan', hours:1, price:175 },
    { job:'Fridge — defrost thermostat', hours:1, price:160 },
    { job:'Dishwasher — drain pump', hours:1, price:165 },
    { job:'Oven — bake / broil element', hours:0.75, price:145 },
    { job:'Ice maker — replace', hours:1, price:180 }
  ];
  function repairMenu(){ var m=(shopSettings&&shopSettings.repair_menu); return (Array.isArray(m)&&m.length)?m:DEFAULT_MENU; }
  function renderRepairMenu(box){
    var menu=repairMenu();
    box.innerHTML =
      '<div class="note" style="margin:0 0 8px">Tap a repair to drop in the labor hours + the total to collect. Adjust the number anytime — the parts price is added by the owner\'s margin.</div>' +
      '<div class="rmenu">' + menu.map(function(r,i){
        return '<button type="button" data-rm="'+i+'"><span>'+esc(r.job)+(r.hours!=null?' <span class="rh">· '+esc(r.hours)+'h</span>':'')+'</span><span class="rp">'+fmtUSD((+r.price||0)*100)+'</span></button>';
      }).join('') + '</div>';
    box.querySelectorAll('button[data-rm]').forEach(function(b){
      b.onclick=function(){
        var r=menu[+b.getAttribute('data-rm')]; if(!r) return;
        var th=document.getElementById('th'); if(th){ th.value=(r.hours!=null?r.hours:''); }
        var li=document.getElementById('invLabor'); if(li){ li.value=(+r.price||0).toFixed(2); try{ recomputeInv(); }catch(_){ } }
        try{ if(typeof paintFlds==='function') paintFlds(); }catch(_){ }
        b.style.borderColor='var(--completed)'; b.querySelector('.rp').textContent='✓ '+fmtUSD((+r.price||0)*100);
      };
    });
  }

  function brainLookup() {
    var box=document.getElementById('brainBox'); box.classList.remove('hidden'); box.innerHTML='<div>🧠 Checking across shops…</div>';
    var a=attrs();
    var kind=(job.unit&&(job.unit.kind||job.unit.label))||'';
    sb.rpc('brain_lookup',{p_brand:a.brand||document.getElementById('tb').value||'',p_model:a.model||document.getElementById('tm').value||'',p_symptom:job.problem||'',p_unit_kind:kind,p_trade:companyTrade||''}).then(function(r){
      if(r.error){box.innerHTML='<div>🧠 Not available yet</div>';return;}
      var rows=r.data||[];
      if(!rows.length){box.innerHTML='<div><b>🧠 Still learning</b></div><div class="bp">As jobs get closed out with a report, this fills in with what usually fixes this — first for your shop, then across every shop in your trade.</div>';return;}
      var top=rows[0];
      var conf=top.confidence==='high'?'🟢 strong signal':(top.confidence==='medium'?'🟡 forming':'⚪ early');
      box.innerHTML='<div style="font-weight:800;margin-bottom:6px">🧠 What usually fixes this — '+esc(top.tier||'similar jobs')+'</div>'+rows.map(function(x){
        return '<div class="brainrow"><div><b>'+esc(x.failed_component||'')+'</b>'+(x.part_number?' <span class="bp">'+esc(x.part_number)+'</span>':'')+'</div><div class="bp">'+(x.fixes||0)+' fixed'+(x.comebacks?' · '+x.comebacks+' came back':'')+'</div></div>';
      }).join('')+'<div class="bp" style="margin-top:6px">'+conf+' · '+(top.observations||0)+' repair'+(top.observations===1?'':'s')+' across '+(top.shops||1)+' shop'+(top.shops===1?'':'s')+'</div>';
    });
  }

  // 🔩 Parts catalog — buttons from the shared, INTERCHANGEABLE supplier catalog
  // (per-device tech choice ▸ shop default ▸ built-in; the shop's distributor folds in).
  function renderPartBtns(){
    var host=document.getElementById('partbtns'); if(!host) return;
    var subs=(window.AntSuppliers?AntSuppliers.list(shopSettings):[{key:'sears',label:'Sears PartsDirect',icon:'🔩'}]);
    var first=subs[0], rest=subs.slice(1);
    var html='<button class="full primary" data-src="'+first.key+'">'+first.icon+' '+esc(first.label)+' — parts for this model</button>';
    if(rest.length){ html+='<div class="btnrow">'+rest.map(function(s){ return '<button data-src="'+s.key+'">'+s.icon+' '+esc(s.label)+'</button>'; }).join('')+'</div>'; }
    host.innerHTML=html;
    host.querySelectorAll('button[data-src]').forEach(function(b){ b.onclick=function(){ openParts(b.getAttribute('data-src')); }; });
  }
  function openParts(key) {
    var pq=document.getElementById('partq');
    var q=((pq&&pq.value)||'').trim() || (document.getElementById('tp').value||'').trim() || (attrs().model||'') || (job.unit&&job.unit.label) || '';
    if (!q) { alert('Add a model # or part # first — tap 📸 Capture model # to read it off the sticker.'); return; }
    if(window.AntSuppliers) AntSuppliers.open(key, q, shopSettings);
  }

  // Green-fill feedback: a report field shows green once it has something in it (the
  // "Job status" card is always green — an outcome is always chosen). Matches TN's cards.
  function paintFlds(){
    var flds=app.querySelectorAll('#reportCard .fld'), filled=0, total=0;
    flds.forEach(function(f){
      if(f.hasAttribute('data-always')){ f.classList.add('filled'); f.classList.remove('empty'); }
      else{
        var any=false;
        f.querySelectorAll('input:not([type=checkbox])').forEach(function(i){ if((i.value||'').trim()) any=true; });
        if(f.querySelector('#psrow') && partStatus) any=true;
        f.classList.toggle('filled', any); f.classList.toggle('empty', !any);
      }
      total++; if(f.classList.contains('filled')) filled++;
    });
    // feed the floating "📋 Report N%" pill (ant-nav.js)
    if(total){ window.antProg={ icon:'📋', label:'Report', pct:Math.round(filled/total*100), href:'#reportCard' }; if(window.antProgUpdate) window.antProgUpdate(); }
  }

  function saveTdr() {
    var v=function(id){var e=document.getElementById(id);return e?e.value.trim():'';};
    var btn=document.getElementById('saveTdr'); var err=document.getElementById('tdrErr'); err.textContent='';

    // "Please reassign" isn't a completion — it kicks the job back to the office (unassigns
    // the tech). Confirm, then send it back. No report row is written.
    if(outcomeSel==='reassign'){
      if(!window.confirm('This sends the job back to the office to reassign — you\'ll be taken off it. Continue?')) return;
      btn.disabled=true; btn.textContent='Sending…';
      sb.from('job').update({status:'new', technician_id:null}).eq('id',jobId).then(function(r){
        if(r.error){ btn.disabled=false; btn.textContent='Send back to the office'; err.textContent=r.error.message; return; }
        app.innerHTML='<div class="center"><div class="big">🔄</div><h2>Sent back to the office</h2><p>They\'ll reassign it. Thanks for the heads-up.</p><p style="margin-top:16px"><a href="/platform/tech.html">Back to My Jobs</a></p></div>';
      });
      return;
    }

    var comp=v('tc');
    if(!comp && outcomeSel==='fixed'){ var e=document.getElementById('tc'); if(e)e.focus(); err.textContent='Add what failed before you mark it complete.'; return; }
    var outcome=outcomeSel;
    btn.disabled=true; btn.textContent='Saving…';
    var cb=document.getElementById('tcb'); var held=!(cb&&cb.checked);
    var row={ company_id:me.company_id, job_id:jobId, appliance:(job.unit&&job.unit.label)||'', brand:v('tb'), model:v('tm'), symptom:job.problem||'', failed_component:comp, part_number:v('tp'), root_cause:v('tr'), outcome:outcome, held:held, tech: myTech?myTech.name:(me.name||'') };
    if(partStatus) row.part_status=partStatus;
    var lh=v('th'); if(lh && !isNaN(parseFloat(lh))) row.labor_hours=parseFloat(lh);
    if(!held) row.reopened_at=new Date().toISOString();
    var done=function(r){
      if(r.error){
        // Resilient to columns that may not be migrated yet — save the rest of the report anyway.
        if(row.part_status!==undefined && /part_status/i.test(r.error.message||'')){ delete row.part_status; sb.from('job_tdr').upsert(row,{onConflict:'job_id'}).then(done); return; }
        if(row.labor_hours!==undefined && /labor_hours/i.test(r.error.message||'')){
          // keep the hours from being lost — fold them into notes/root cause
          if(lh) row.root_cause=(row.root_cause?row.root_cause+' · ':'')+'Labor '+lh+'h';
          delete row.labor_hours; sb.from('job_tdr').upsert(row,{onConflict:'job_id'}).then(done); return;
        }
        btn.disabled=false; btn.textContent='Save report + finish'; err.textContent=r.error.message; return;
      }
      // "Please order" or "Missing" or a needed return → the part isn't in hand, so the job waits.
      var ns=(outcome==='return_needed'||partStatus==='please_order'||partStatus==='missing')?'awaiting_parts':'completed';
      var ju={status:ns}; if(ns==='completed') ju.completed_at=new Date().toISOString();
      var finish=function(){
        if(ns==='completed'){ notify('complete'); } // text the customer their repair is done + receipt link
        // 🎉 Job done — confetti + fanfare. The reward that makes techs want to close jobs.
        if(ns==='completed' && window.antCelebrate){ try{ window.antCelebrate({ tag:'Job complete', big:'JOB DONE! 🎉', sub:(job.customer&&fullName(job.customer))||'', cue:'win', sound:'both' }); }catch(_){ } }
        var head = ns==='completed' ? '<div class="big">✅</div><h2>Report saved</h2><p>Nice work.</p>' : '<div class="big">🔁</div><h2>Report saved</h2><p>Logged for a return — the office will line up the part.</p>';
        var reviewCta = ns==='completed' ? '<div style="max-width:360px;margin:16px auto 0;text-align:left">'+reviewAskHtml()+'</div>' : '';
        app.innerHTML='<div class="center">'+head+reviewCta+'<p style="margin-top:16px"><a href="/platform/tech.html">Back to My Jobs</a></p></div>';
        wireReviewAsk();
      };
      // Set the job status; if completed_at isn't a column yet, retry without it.
      var setStatus=function(u){
        sb.from('job').update(u).eq('id',jobId).then(function(r2){
          if(r2 && r2.error && /completed_at/i.test(r2.error.message||'')){ setStatus({status:ns}); return; }
          finish();
        });
      };
      setStatus(ju);
    };
    sb.from('job_tdr').upsert(row,{onConflict:'job_id'}).then(done);
  }

  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) boot(); else signIn(); });
})();
</script>
