<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Practice Board — MeisterTask layout</title>
<style>
  :root{
    --bg:#e9edf2; --lane:#eef1f6; --lane-head:#e4e9f0; --card:#ffffff;
    --ink:#26313f; --ink2:#6b7686; --line:#d7dee7; --shadow:0 1px 2px rgba(20,30,50,.08),0 2px 8px rgba(20,30,50,.05);
    --tab:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

  /* Top bar */
  .top{flex:0 0 auto;background:#1f2a3a;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:.02em;font-size:15px;display:flex;align-items:center;gap:8px}
  .practice-chip{background:#f5a623;color:#241a06;font-weight:800;font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .note{color:#aeb9c9;font-size:12px}
  .top .spacer{flex:1}
  .reset{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .reset:hover{background:rgba(255,255,255,.2)}

  /* Board tabs */
  .tabs{flex:0 0 auto;background:#27344a;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .tab{background:transparent;color:#b9c4d4;border:0;border-bottom:3px solid transparent;padding:11px 16px 9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:.01em}
  .tab .cnt{color:#7f8da0;font-weight:600;font-size:11px;margin-left:6px}
  .tab.on{color:#fff;border-bottom-color:#f5a623}
  .tab:hover{color:#fff}

  /* Lane row */
  .board{flex:1 1 auto;overflow-x:auto;overflow-y:hidden;padding:14px 12px 20px;display:none}
  .board.on{display:flex;gap:12px;align-items:flex-start}
  .lane{flex:0 0 264px;width:264px;max-height:100%;background:var(--lane);border-radius:12px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .lane-head{padding:10px 12px 8px;border-top:4px solid var(--accent,#9aa7b8);border-radius:12px 12px 0 0;background:var(--lane-head)}
  .lane-title{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.25}
  .lane-title .n{background:#fff;color:var(--ink2);border:1px solid var(--line);border-radius:999px;min-width:22px;text-align:center;padding:1px 7px;font-size:11px;font-weight:800}
  .lane-body{padding:8px;overflow-y:auto;flex:1 1 auto;min-height:60px;display:flex;flex-direction:column;gap:8px}
  .lane-body.drag-over{background:rgba(31,110,235,.07);outline:2px dashed #9db8e6;outline-offset:-4px;border-radius:0 0 12px 12px}

  /* Cards */
  .card{background:var(--card);border-radius:9px;box-shadow:var(--shadow);padding:10px 11px;cursor:grab;border-left:4px solid var(--c,#9aa7b8);position:relative}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45}
  .card .t{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.3}
  .card .sub{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.35}
  .card .row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
  .tag{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
  .tag.war{background:#e7f0ff;color:#1f5fd0}
  .tag.cash{background:#e7f8ee;color:#1c8b4c}
  .tag.eta{background:#fff2dc;color:#a5670c}
  .tag.autho{background:#ffe9e2;color:#c2491f}
  .tag.up{background:#e4f6f4;color:#0f7c74}
  .tag.hot{background:#ffe1e1;color:#c62d2d}
  .who{font-size:11px;color:var(--ink2);font-weight:700;margin-left:auto;display:flex;align-items:center;gap:5px}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--c,#9aa7b8);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .empty{color:#a7b1bf;font-size:12px;text-align:center;padding:16px 6px;font-style:italic}

  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;background:#1f2a3a;color:#dfe6f0;font-size:12px;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);opacity:.92}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">🐜 Practice Job Board <span class="practice-chip">Practice · not live</span></div>
    <div class="note">Mirrors your MeisterTask layout. Mock cards. Drag them around — nothing saves, nothing touches real jobs.</div>
    <div class="spacer"></div>
    <button class="reset" onclick="renderAll()">↺ Reset cards</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="boards"></div>
  <div class="hint">Drag a card between columns to feel the flow. Refresh to reset.</div>

<script>
// ── The exact MeisterTask projects -> columns (pulled live from your boards) ──
const BOARDS = [
  { key:'sched', name:'Scheduling', cols:[
    'TN NEEDS SCHEDULED','NOLA NEED SCHEDULED','TEMPLATES','PRE DIAGNOSIS','POST DIAGNOSIS' ] },
  { key:'tn', name:'TN Jobs', cols:[
    'SCHEDULED','TEDDY REPORTS','LEE REPORTS','JIMMYS REPORTS','ANDRE REPORTS','UPGRADE',
    'WAITING FOR AUTHO','WAITING FOR PARTS','COMPLETION APPT','FOLLOW UP BEFORE INVOICING',
    'NEEDS INVOICED','TE INVOICES','JIMMY INVOICES','LEE INVOICES','ANDRE INVOICES','SHOP MONEY $$' ] },
  { key:'nola', name:'NOLA Jobs', cols:[
    'SCHEDULED','JOHN REPORT','BILLY REPORTS','ANDRE REPORTS','UPGRADE','WAITING FOR AUTHO',
    'WAITING FOR PARTS','COMPLETION','FOLLOW UP','NEEDS INVOICED','JOHN INVOICES','ANDRE INVOICES','BILLY INVOICES' ] },
  { key:'fl', name:'Florida Jobs', cols:[
    'SCHEDULED','DUSTY REPORTS','WAITING FOR AUTHO','WAITING FOR PARTS','COMPLETION APPOINTMENT',
    'FOLLOW UP BEFORE INVOICING','NEEDS INVOICED','DUSTY INVOICE' ] },
];

// Column accent color by meaning (so the flow reads at a glance)
function accent(name){
  const n=name.toUpperCase();
  if(n.includes('NEEDS SCHEDULED')||n.includes('NEED SCHEDULED')) return '#8a97a8';
  if(n==='SCHEDULED') return '#5b6b80';
  if(n.includes('TEMPLATE')) return '#9aa7b8';
  if(n.includes('PRE DIAG')) return '#3f7fd6';
  if(n.includes('POST DIAG')) return '#2f9e9e';
  if(n.includes('REPORT')) return '#3f7fd6';         // per-tech report lanes = blue (active work)
  if(n.includes('UPGRADE')) return '#0f9d92';        // teal
  if(n.includes('AUTHO')) return '#e07a3c';          // orange = waiting on warranty auth
  if(n.includes('PART')) return '#e0a72c';           // amber = waiting on parts
  if(n.includes('COMPLETION')) return '#33a852';     // green
  if(n.includes('FOLLOW')) return '#7a5bd0';         // purple
  if(n.includes('NEEDS INVOIC')) return '#d64550';   // red = needs invoicing
  if(n.includes('INVOICE')) return '#4b57c4';        // per-tech invoice lanes = indigo
  if(n.includes('MONEY')) return '#c99700';          // gold
  return '#9aa7b8';
}

// ── Mock cards keyed by "boardKey|COLUMN" so the layout looks alive ──
function mk(t,sub,tag,who){return {t,sub,tag,who,id:'c'+(mk._i=(mk._i||0)+1)};}
const CARDS = {
  'sched|TN NEEDS SCHEDULED':[ mk('Gregory White','Dryer — not heating','war','—'), mk('Virginia Willits','Washer — leaking','war','—'), mk('Nathan M.','Fridge ice maker','cash','—') ],
  'sched|NOLA NEED SCHEDULED':[ mk('Paula Reaux','Range — burner out','war','—') ],
  'sched|TEMPLATES':[ mk('AHS intake template','claim + model + video','','—'), mk('Cash quick-check','$50 diagnostic','','—') ],
  'sched|PRE DIAGNOSIS':[ mk('Detrich R.','Refrigerator — ice maker coil','war','Ant'), mk('William T.','Dishwasher — won\'t drain','war','Ant') ],
  'sched|POST DIAGNOSIS':[ mk('Keli Vince','Dryer — belt + roller','war','Teddy') ],

  'tn|SCHEDULED':[ mk('Anne Rose P.','Range — Thu','war','Lee'), mk('Bruce S.','Fridge — Fri','war','Jimmy') ],
  'tn|TEDDY REPORTS':[ mk('Detrich R.','Refrigerator — ice maker','war','TE') ],
  'tn|LEE REPORTS':[ mk('Kevin Rucker','Dishwasher — pump','war','Lee') ],
  'tn|JIMMYS REPORTS':[ mk('Bryan Smith','Washer — bearing','war','Jimmy') ],
  'tn|UPGRADE':[ mk('Anne Rose P.','+ Dryer vent clean','up','Lee') ],
  'tn|WAITING FOR AUTHO':[ mk('Reece D.','AHS — auth pending','autho','Teddy'), mk('Carroll H.','SquareTrade — auth','autho','Jimmy') ],
  'tn|WAITING FOR PARTS':[ mk('Nathan M.','Ice maker WPW10300024','eta','Teddy','ETA Jul 8'), mk('Rachel Thomas','Drain pump','eta','Lee') ],
  'tn|COMPLETION APPT':[ mk('Margy Brady','Return visit — Mon','war','Lee') ],
  'tn|FOLLOW UP BEFORE INVOICING':[ mk('Eda Bagby','Confirm parts returned','war','Jimmy') ],
  'tn|NEEDS INVOICED':[ mk('Raquel Reed','Warranty — file claim','hot','Lee') ],
  'tn|TE INVOICES':[ mk('Jason W.','$150 labor','war','TE') ],
  'tn|JIMMY INVOICES':[ mk('Eyob T.','$150 labor','war','Jimmy') ],
  'tn|SHOP MONEY $$':[ mk('Monahan','EFT $150 — PAID','cash','') ],

  'nola|SCHEDULED':[ mk('Andre route','2 stops — Hammond','war','Andre') ],
  'nola|JOHN REPORT':[ mk('LeBlanc','Fridge — compressor','war','John') ],
  'nola|WAITING FOR PARTS':[ mk('Billy job','Washer motor','eta','Billy') ],
  'nola|COMPLETION':[ mk('Walker return','Dryer — Wed','war','John') ],

  'fl|SCHEDULED':[ mk('Dusty route','3 stops','war','Dusty') ],
  'fl|DUSTY REPORTS':[ mk('Ormond fridge','Not cooling','war','Dusty') ],
  'fl|WAITING FOR AUTHO':[ mk('AHS claim','auth pending','autho','Dusty') ],
};

function tagHtml(c){
  const map={war:['war','Warranty'],cash:['cash','Cash'],eta:['eta',c.eta||'Parts'],autho:['autho','Auth'],up:['up','Upsell'],hot:['hot','Action']};
  const m=map[c.tag]; if(!m) return '';
  return '<span class="tag '+m[0]+'">'+m[1]+'</span>';
}
function cardHtml(c,accentColor){
  const initials=(c.who&&c.who!=='—'&&c.who!=='Ant')?c.who.slice(0,2).toUpperCase():'';
  const who=c.who?('<span class="who">'+(initials?'<span class="dot" style="--c:'+accentColor+'">'+initials+'</span>':'')+c.who+'</span>'):'';
  return '<div class="card" draggable="true" data-id="'+c.id+'" style="--c:'+accentColor+'">'
    +'<div class="t">'+esc(c.t)+'</div>'
    +'<div class="sub">'+esc(c.sub)+'</div>'
    +'<div class="row">'+tagHtml(c)+who+'</div></div>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

let curBoard=BOARDS[1].key; // default to TN Jobs
let STATE={}; // {board|col: [cards]}

function seed(){
  STATE={};
  BOARDS.forEach(b=>b.cols.forEach(col=>{
    const k=b.key+'|'+col.toUpperCase();
    // match seed keys case-insensitively
    let arr=null;
    for(const kk in CARDS){ if(kk.toUpperCase()===k){arr=CARDS[kk];break;} }
    STATE[b.key+'|'+col]= arr? arr.map(c=>Object.assign({},c)) : [];
  }));
}

function renderTabs(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=BOARDS.map(b=>{
    const n=b.cols.reduce((s,col)=>s+(STATE[b.key+'|'+col]||[]).length,0);
    return '<button class="tab '+(b.key===curBoard?'on':'')+'" onclick="switchBoard(\''+b.key+'\')">'+esc(b.name)+' <span class="cnt">'+n+'</span></button>';
  }).join('');
}
function switchBoard(k){curBoard=k;renderTabs();document.querySelectorAll('.board').forEach(el=>el.classList.toggle('on',el.dataset.k===k));}

function renderBoards(){
  const host=document.getElementById('boards');
  host.innerHTML=BOARDS.map(b=>{
    const lanes=b.cols.map(col=>{
      const key=b.key+'|'+col; const cards=STATE[key]||[]; const ac=accent(col);
      const body=cards.length? cards.map(c=>cardHtml(c,ac)).join('') : '<div class="empty">—</div>';
      return '<div class="lane"><div class="lane-head" style="--accent:'+ac+'">'
        +'<div class="lane-title"><span>'+esc(col)+'</span><span class="n">'+cards.length+'</span></div></div>'
        +'<div class="lane-body" data-key="'+esc(key)+'">'+body+'</div></div>';
    }).join('');
    return '<div class="board '+(b.key===curBoard?'on':'')+'" data-k="'+b.key+'">'+lanes+'</div>';
  }).join('');
  wireDnD();
}
function renderAll(){seed();renderTabs();renderBoards();}

// ── Drag & drop (visual only, no persistence) ──
let dragId=null, dragFrom=null;
function wireDnD(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=card.dataset.id;dragFrom=card.closest('.lane-body').dataset.key;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.lane-body').forEach(b=>b.classList.remove('drag-over'));});
  });
  document.querySelectorAll('.lane-body').forEach(body=>{
    body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('drag-over');});
    body.addEventListener('dragleave',()=>body.classList.remove('drag-over'));
    body.addEventListener('drop',e=>{e.preventDefault();body.classList.remove('drag-over');
      const toKey=body.dataset.key; if(!dragId||dragFrom==null) return;
      const fromArr=STATE[dragFrom]||[]; const idx=fromArr.findIndex(c=>c.id===dragId);
      if(idx<0) return; const [card]=fromArr.splice(idx,1);
      (STATE[toKey]=STATE[toKey]||[]).push(card);
      renderTabs(); renderBoards();
    });
  });
}

renderAll();
</script>
</body>
</html>
