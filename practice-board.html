<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Practice Board — MeisterTask mirror</title>
<style>
  :root{
    --bg:#e9edf2; --lane:#eef1f6; --lane-head:#e4e9f0; --card:#ffffff;
    --ink:#26313f; --ink2:#6b7686; --line:#d7dee7; --shadow:0 1px 2px rgba(20,30,50,.08),0 2px 8px rgba(20,30,50,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

  /* ── Sliding board switcher — TOP of the page ── */
  .switchbar{flex:0 0 auto;background:#1b2637;padding:10px 12px;display:flex;justify-content:center}
  .slider{position:relative;display:inline-flex;background:#111b29;border-radius:999px;padding:4px;gap:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
  .slider .pill{position:relative;z-index:2;border:0;background:transparent;color:#9fb0c6;font-weight:800;font-size:13px;letter-spacing:.01em;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .2s}
  .slider .pill .cnt{font-weight:700;font-size:11px;opacity:.7;margin-left:6px}
  .slider .pill.on{color:#16202e}
  .slider .thumb{position:absolute;z-index:1;top:4px;bottom:4px;left:0;width:0;background:linear-gradient(180deg,#ffd36b,#f5a623);border-radius:999px;box-shadow:0 2px 6px rgba(245,166,35,.5);transition:transform .28s cubic-bezier(.4,1.2,.5,1),width .28s}

  /* Slim info bar */
  .top{flex:0 0 auto;background:#27344a;color:#fff;padding:7px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
  .practice-chip{background:#f5a623;color:#241a06;font-weight:800;font-size:9px;letter-spacing:.07em;padding:3px 7px;border-radius:5px;text-transform:uppercase}
  .note{color:#aeb9c9;font-size:11.5px}
  .top .spacer{flex:1}
  .btn{background:rgba(255,255,255,.13);color:#fff;border:0;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.22)}

  /* ── Board area — fills remaining height, scrolls both ways ── */
  #boards{flex:1 1 auto;min-height:0;position:relative}
  .board{position:absolute;inset:0;display:none;gap:12px;align-items:stretch;padding:14px 12px;overflow-x:auto;overflow-y:hidden}
  .board.on{display:flex}
  .lane{flex:0 0 270px;width:270px;max-height:100%;display:flex;flex-direction:column;background:var(--lane);border-radius:12px;box-shadow:var(--shadow)}
  .lane-head{flex:0 0 auto;padding:10px 12px 8px;border-top:4px solid var(--accent,#9aa7b8);border-radius:12px 12px 0 0;background:var(--lane-head)}
  .lane-title{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.25}
  .lane-title .n{background:#fff;color:var(--ink2);border:1px solid var(--line);border-radius:999px;min-width:22px;text-align:center;padding:1px 7px;font-size:11px;font-weight:800}
  .lane-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
  .lane-body.drag-over{background:rgba(31,110,235,.07);outline:2px dashed #9db8e6;outline-offset:-4px}

  .card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:7px 9px;cursor:grab;border-left:4px solid var(--c,#9aa7b8)}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45}
  .card .hd{display:flex;align-items:flex-start;gap:8px}
  .card .t{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--ink);line-height:1.25;word-break:break-word}
  .card .meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
  .card .wo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:800;color:#0f2f57;background:#eef4fc;border:1px solid #d5e3f6;border-radius:5px;padding:1px 6px;letter-spacing:.01em}
  .tag{font-size:9px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:5px}
  .tag.war{background:#e7f0ff;color:#1f5fd0}
  .tag.cash{background:#e7f8ee;color:#1c8b4c}
  .tag.area{background:#eef1f5;color:#54607a;text-transform:none;letter-spacing:0}
  .dot{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--c,#9aa7b8);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .empty{color:#a7b1bf;font-size:12px;text-align:center;padding:14px 6px;font-style:italic}
  .boardmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5f6b7c;font-size:14px;font-weight:600}
  .spin{width:26px;height:26px;border:3px solid #c3ccd8;border-top-color:#f5a623;border-radius:50%;animation:sp 0.8s linear infinite;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ── Tile detail modal (click a tile -> large, centered) ── */
  .tm-back{position:fixed;inset:0;background:rgba(15,22,34,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .tm-back.open{display:flex}
  .tm{background:#fff;color:var(--ink);width:100%;max-width:620px;max-height:88vh;overflow-y:auto;border-radius:16px;box-shadow:0 20px 60px rgba(10,20,40,.4);padding:20px 22px 26px;animation:tmIn .18s ease-out}
  @keyframes tmIn{from{transform:translateY(14px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .tm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .tm-wo{display:flex;gap:6px;flex-wrap:wrap}
  .tm-x{background:#eef1f5;border:0;color:#48566b;width:34px;height:34px;border-radius:17px;font-size:22px;cursor:pointer;flex-shrink:0}
  .tm-title{font-size:20px;font-weight:800;line-height:1.25;color:#1c2532}
  .tm-city{font-size:13px;font-weight:600;color:#6b7686}
  .tm-sched-card{background:#f4f7fb;border:1px solid #e0e7f0;border-radius:12px;padding:12px 14px;margin:14px 0}
  .tm-sched-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#7c8798}
  .tm-sched-val{font-size:16px;font-weight:800;color:#1f6df0;margin-top:2px}
  .cal{margin-top:12px;background:#fff;border:1px solid #e4e9f0;border-radius:10px;padding:10px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:14px;color:#2b3444;margin-bottom:8px}
  .cal-head button{background:#eef1f5;border:0;width:28px;height:28px;border-radius:8px;font-size:16px;cursor:pointer;color:#48566b}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
  .cal-dow span{text-align:center;font-size:10px;font-weight:800;color:#9aa4b2}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-empty{height:32px}
  .cal-day{height:32px;border:0;background:#f4f6f9;border-radius:7px;font-size:13px;font-weight:700;color:#2b3444;cursor:pointer}
  .cal-day:hover{background:#e2e9f2}
  .cal-day.sel{background:#1f6df0;color:#fff}
  .tm-save{margin-top:10px;width:100%;background:linear-gradient(135deg,#10b981,#047857);color:#fff;border:0;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer}
  .tm-save:disabled{opacity:.6;cursor:default}
  .tm-save-msg{margin-top:8px;font-size:12.5px;font-weight:700}
  .tm-body{margin-top:8px}
  .tm-row{display:flex;gap:10px;padding:7px 0;border-top:1px solid #eef1f5;font-size:14px}
  .tm-k{flex:0 0 96px;color:#7c8798;font-weight:700}
  .tm-v{flex:1;color:#26313f;word-break:break-word}
  .tm-notes{font-size:13px;color:#48566b;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:#f7f9fb;border-radius:10px;padding:12px}
</style>
</head>
<body>
  <div class="switchbar"><div class="slider" id="slider"><div class="thumb" id="thumb"></div></div></div>
  <div class="top">
    <div class="brand">🐜 Practice Board <span class="practice-chip">MeisterTask mirror · preview</span></div>
    <div class="note" id="note">Live from MeisterTask (the source of truth). Read-only preview — dragging is visual only.</div>
    <div class="spacer"></div>
    <button class="btn" id="reload">↻ Refresh</button>
  </div>
  <div id="boards"></div>
  <div id="tileModal" class="tm-back" onclick="if(event.target===this)closeTile()"></div>

<script>
const NF='/.netlify/functions';
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const BOARDS=[
  {key:'sched',name:'Scheduling'},
  {key:'tn',   name:'TN Jobs'},
  {key:'nola', name:'NOLA Jobs'},
];
const CACHE={};       // key -> columns[]  (from MeisterTask, placement) + matched job
let curBoard='tn';
const TECH={1:'Teddy',2:'Jimmy',3:'Andre',4:'Lee',5:'Billy',6:'John',7:'Dusty'};

// Our live jobs, indexed by claim/dispatch # — MeisterTask decides WHERE a
// card sits; our job record supplies the rich tile (customer/appliance/tech).
let JOBS_IDX=null;
async function loadJobs(){
  if(JOBS_IDX) return JOBS_IDX;
  JOBS_IDX={}; const byId={};
  try{
    const d=await fetch(XANO+'/get_office_kanban',{cache:'no-store'}).then(r=>r.json());
    const items=d.items||d.jobs||[];
    items.forEach(j=>{
      byId[String(j.id)]=j;
      const c=String(j.claim_number||'').trim(); if(c) JOBS_IDX[c]=j;
      const ds=String(j.dispatch_source_id||'').trim(); if(ds) JOBS_IDX[ds]=j;
    });
  }catch(e){}
  // Merge harvested aliases (extra warranty numbers -> job_id) so more cards match.
  try{
    const a=await fetch(NF+'/warranty-aliases',{cache:'no-store'}).then(r=>r.json());
    const map=(a&&a.map)||{};
    Object.keys(map).forEach(num=>{ const j=byId[String(map[num])]; if(j && !JOBS_IDX[num]) JOBS_IDX[num]=j; });
  }catch(e){}
  return JOBS_IDX;
}
function matchJob(title){
  if(!JOBS_IDX) return null;
  const toks=String(title||'').match(/\d{6,}/g)||[];
  for(const t of toks){ if(JOBS_IDX[t]) return JOBS_IDX[t]; }
  return null;
}
function cap(s){s=String(s||'');return s?s[0].toUpperCase()+s.slice(1):'';}

function accent(name){
  const n=(name||'').toUpperCase();
  if(n.includes('PAID')) return '#16a34a';
  if(n.includes('NEEDS SCHEDULED')||n.includes('NEED SCHEDULED')) return '#8a97a8';
  if(n==='SCHEDULED') return '#5b6b80';
  if(n.includes('TEMPLATE')) return '#9aa7b8';
  if(n.includes('PRE DIAG')) return '#3f7fd6';
  if(n.includes('POST DIAG')) return '#2f9e9e';
  if(n.includes('REPORT')) return '#3f7fd6';
  if(n.includes('UPGRADE')) return '#0f9d92';
  if(n.includes('AUTHO')) return '#e07a3c';
  if(n.includes('PART')) return '#e0a72c';
  if(n.includes('COMPLETION')||n.includes('COMPLETE')) return '#33a852';
  if(n.includes('FOLLOW')||n.includes('FOLOW')) return '#7a5bd0';
  if(n.includes('NEEDS INVOIC')) return '#d64550';
  if(n.includes('INVOICE')) return '#4b57c4';
  if(n.includes('MONEY')) return '#c99700';
  return '#9aa7b8';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

// Fetch a whole board from MeisterTask (one fast open-cards pull), then append
// our "💰 PAID" folder — where a job moves once it's been paid. (Teddy 2026-07-04)
async function fetchBoard(key){
  if(CACHE[key]) return CACHE[key];
  await loadJobs();
  let cols=null;
  // MeisterTask can be briefly slow/rate-limited — try twice before giving up.
  for(let attempt=0; attempt<2 && cols==null; attempt++){
    if(attempt) await new Promise(r=>setTimeout(r,1800));
    try{
      const d=await fetch(NF+'/mt-board?key='+key,{cache:'no-store'}).then(r=>r.json());
      if(d&&d.ok&&Array.isArray(d.columns)) cols=d.columns;
    }catch(e){}
  }
  if(cols==null) return null; // still busy — don't cache, let Refresh retry
  // Billy left — drop his Report/Invoice columns.
  cols=cols.filter(c=>!/billy/i.test(c.name||''));
  // Defensive: collapse any duplicate same-named columns into one.
  const seenCol={}; const merged=[];
  cols.forEach(c=>{ const k=c.name; if(seenCol[k]){ seenCol[k].cards=(seenCol[k].cards||[]).concat(c.cards||[]); } else { seenCol[k]=c; merged.push(c); } });
  cols=merged;
  // The new Paid folder (not in MeisterTask yet) — a job lands here once paid.
  cols.push({name:'💰 PAID', sequence:99999, cards:[], paid:true});
  cols.forEach((c,ci)=>(c.cards||[]).forEach((cd,i)=>{
    cd._id='c'+ci+'_'+(cd.id||i);
    cd.job=matchJob(cd.title);   // attach our live job when the claim/dispatch # matches
  }));
  CACHE[key]=cols;
  return cols;
}

// ── Slider ──
function renderSlider(){
  const s=document.getElementById('slider');
  [...s.querySelectorAll('.pill')].forEach(p=>p.remove());
  BOARDS.forEach(b=>{
    const cols=CACHE[b.key];
    const n = cols ? cols.reduce((a,c)=>a+((c.cards||[]).length),0) : null;
    const btn=document.createElement('button');
    btn.className='pill'+(b.key===curBoard?' on':'');
    btn.dataset.k=b.key;
    btn.innerHTML=esc(b.name)+(n!=null?' <span class="cnt">'+n+'</span>':'');
    btn.onclick=()=>switchBoard(b.key);
    s.appendChild(btn);
  });
  moveThumb();
}
function moveThumb(){
  const s=document.getElementById('slider'), thumb=document.getElementById('thumb');
  const active=s.querySelector('.pill.on'); if(!active){thumb.style.width='0';return;}
  thumb.style.width=active.offsetWidth+'px';
  thumb.style.transform='translateX('+(active.offsetLeft-4)+'px)';
}
async function switchBoard(k){
  curBoard=k;
  document.querySelectorAll('.slider .pill').forEach(p=>p.classList.toggle('on',p.dataset.k===k));
  moveThumb();
  await showBoard(k);
}

// ── Board render ──
// MeisterTask card titles carry noise ("New Dispatch Notification #… ",
// "ServicePower Call # …"). Pull out the customer-facing bit so the tile reads
// like our own tiles, keep the raw claim/dispatch # as a sub line.
function tidyTitle(raw){
  let t=String(raw||'').trim();
  const claim=(t.match(/#\s*(\d{6,})/)||t.match(/call\s*#?\s*(\d{6,})/i)||[])[1]||'';
  t=t.replace(/new dispatch notification/ig,'')
     .replace(/dispatch notification/ig,'')
     .replace(/servicepower call\s*#?\s*\d+/ig,'')
     .replace(/\bcall\s*#?\s*\d+/ig,'')
     .replace(/#\s*\d{5,}/g,'')
     .replace(/^[\s\-\/|:]+/,'').replace(/[\s\-\/|:]+$/,'').trim();
  return { title: t || String(raw||'').trim(), claim };
}
function titleCase(s){return String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}
function cityFromTitle(t){const m=String(t||'').match(/\b([A-Z][A-Z]{2,}(?:\s+[A-Z]{2,})*)\s*$/);return m?titleCase(m[1]):'';}
function detectCo(s){s=String(s||'');
  if(/square\s*trade/i.test(s))return'SquareTrade';
  if(/\bAHS\b|american\s*home/i.test(s))return'AHS';
  if(/frontdoor|front\s*door/i.test(s))return'Frontdoor';
  if(/\bNSA\b|national\s*service/i.test(s))return'NSA';
  if(/2-?10|home\s*buyers/i.test(s))return'2-10';
  return'';
}
function cardHtml(cd,ac){
  const j=cd.job;
  // HEADER ONLY — name + work order # + company + area. Everything else collapsed
  // so as many tiles as possible fit on the board. (Teddy 2026-07-04)
  const wos=(String(cd.title||'').match(/[A-Z]{2,4}\d{6,}|\d{6,}/g)||[]);
  const wo = wos.length? '<span class="wo">🧾 '+esc(wos[0])+(wos.length>1?(' +'+(wos.length-1)):'')+'</span>' : '';
  let name, tech='', war='', area='';
  if(j){
    name=[j.customer_first,j.customer_last].filter(Boolean).join(' ').trim()||('Job #'+j.id);
    tech=TECH[Number(j.technician_id||0)]||'';
    war=(j.warranty_company||'').trim();
    area=titleCase(j.service_city||'');
  }else{
    name=(tidyTitle(cd.title).title)||('#'+cd.id);
    war=detectCo(cd.title+' '+(cd.notes||''));
    area=cityFromTitle(cd.title);
  }
  const warTag= war?'<span class="tag war">'+esc(war)+'</span>':'';
  const areaTag= area?'<span class="tag area">📍'+esc(area)+'</span>':'';
  const who= tech?'<span class="dot" style="--c:'+ac+'" title="'+esc(tech)+'">'+esc(tech.slice(0,2).toUpperCase())+'</span>':'';
  const meta=[wo,warTag,areaTag].filter(Boolean).join('');
  return '<div class="card'+(j?' matched':'')+'" draggable="true" data-id="'+esc(cd._id)+'" style="--c:'+ac+'">'
    +'<div class="hd"><div class="t">'+esc(name)+'</div>'+who+'</div>'
    +(meta?('<div class="meta">'+meta+'</div>'):'')
    +'</div>';
}
async function showBoard(key){
  const host=document.getElementById('boards');
  // build/replace the board container
  let board=host.querySelector('.board[data-k="'+key+'"]');
  document.querySelectorAll('.board').forEach(el=>el.classList.remove('on'));
  if(!CACHE[key]){
    // show spinner while loading
    host.innerHTML='<div class="boardmsg"><span class="spin"></span>Loading '+esc((BOARDS.find(b=>b.key===key)||{}).name||'')+' from MeisterTask…</div>';
    const res=await fetchBoard(key);
    if(curBoard!==key) return; // switched away while loading
    if(res==null){
      host.innerHTML='<div class="boardmsg" style="flex-direction:column;gap:12px">MeisterTask was busy loading this board.<button class="btn" style="background:#f5a623;color:#1a1206" onclick="showBoard(\''+key+'\')">↻ Try again</button></div>';
      return;
    }
  }
  const cols=CACHE[key]||[];
  const matched=cols.reduce((a,c)=>a+(c.cards||[]).filter(cd=>cd.job).length,0);
  const total=cols.reduce((a,c)=>a+(c.cards||[]).length,0);
  const lanes = cols.length ? cols.map(c=>{
    const ac=accent(c.name); const cards=c.cards||[];
    const body=cards.length? cards.map(cd=>cardHtml(cd,ac)).join('') : '<div class="empty">—</div>';
    return '<div class="lane"><div class="lane-head" style="--accent:'+ac+'">'
      +'<div class="lane-title"><span>'+esc(c.name)+'</span><span class="n">'+cards.length+'</span></div></div>'
      +'<div class="lane-body" data-key="'+esc(key+'|'+c.name)+'">'+body+'</div></div>';
  }).join('') : '<div class="boardmsg">No open cards on this board.</div>';
  host.innerHTML='<div class="board on" data-k="'+key+'">'+lanes+'</div>';
  renderSlider();
  wireDnD();
  moveThumb();
  document.getElementById('note').innerHTML='<b>'+esc((BOARDS.find(b=>b.key===key)||{}).name)+'</b> · MeisterTask layout + our tiles — <b>'+matched+'</b> of '+total+' cards matched to our jobs. Read-only preview.';
}

// ── Tile detail modal + calendar (click a tile) ──
function findCardObj(id){
  const cols=CACHE[curBoard]||[];
  for(const c of cols){ const cd=(c.cards||[]).find(x=>x._id===id); if(cd) return cd; }
  return null;
}
let calState={y:0,m:0,sel:null};
function renderCalendar(){
  const y=calState.y,m=calState.m;
  const first=new Date(y,m,1); const startDow=(first.getDay()+6)%7; // Mon=0
  const days=new Date(y,m+1,0).getDate();
  const monthName=first.toLocaleString('en-US',{month:'long',year:'numeric'});
  const dow=['MO','TU','WE','TH','FR','SA','SU'];
  let grid='';
  for(let i=0;i<startDow;i++) grid+='<span class="cal-empty"></span>';
  for(let d=1;d<=days;d++){
    const s=calState.sel; const isSel=s&&s.getFullYear()===y&&s.getMonth()===m&&s.getDate()===d;
    grid+='<button class="cal-day'+(isSel?' sel':'')+'" onclick="pickDate('+d+')">'+d+'</button>';
  }
  return '<div class="cal"><div class="cal-head"><button onclick="calMove(-1)">‹</button><span>'+esc(monthName)+'</span><button onclick="calMove(1)">›</button></div>'
    +'<div class="cal-dow">'+dow.map(x=>'<span>'+x+'</span>').join('')+'</div>'
    +'<div class="cal-grid">'+grid+'</div></div>';
}
function calMove(delta){ calState.m+=delta; if(calState.m<0){calState.m=11;calState.y--;} if(calState.m>11){calState.m=0;calState.y++;} const el=document.getElementById('tm-cal'); if(el) el.innerHTML=renderCalendar(); }
function pickDate(d){ calState.sel=new Date(calState.y,calState.m,d); const el=document.getElementById('tm-cal'); if(el) el.innerHTML=renderCalendar();
  const lbl=document.getElementById('tm-sched'); if(lbl) lbl.textContent=calState.sel.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  const btn=document.getElementById('tm-save'); if(btn && calState.job){ btn.style.display='block'; btn.disabled=false; btn.textContent='✓ Reschedule to '+calState.sel.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
  const msg=document.getElementById('tm-save-msg'); if(msg) msg.textContent=''; }
async function saveReschedule(){
  const j=calState.job, sel=calState.sel; if(!j||!sel) return;
  const y=sel.getFullYear(), mo=String(sel.getMonth()+1).padStart(2,'0'), da=String(sel.getDate()).padStart(2,'0');
  const ms=Date.parse(y+'-'+mo+'-'+da+'T09:00:00-05:00')||sel.getTime();
  const nm=[j.customer_first,j.customer_last].filter(Boolean).join(' ').trim()||('Job #'+j.id);
  const nice=sel.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  if(!confirm('Reschedule '+nm+' to '+nice+'?\nThis updates the job and texts the customer.')) return;
  const btn=document.getElementById('tm-save'), msg=document.getElementById('tm-save-msg');
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    const r=await fetch(XANO+'/reschedule_job',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:Number(j.id),new_start_ms:ms})});
    const d=await r.json();
    const ok=d&&(d.success||d.ok||d.id||d.job_id||d.scheduled_start);
    if(ok){
      j.scheduled_start=ms;
      const lbl=document.getElementById('tm-sched'); if(lbl) lbl.textContent=sel.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
      if(btn) btn.style.display='none';
      if(msg){ msg.textContent='✓ Rescheduled to '+nice+' — customer notified.'; msg.style.color='#1c8b4c'; }
    }else{
      if(msg){ msg.textContent='⚠ Could not reschedule'+(d&&d.error?': '+d.error:''); msg.style.color='#c0392b'; }
      if(btn){ btn.disabled=false; btn.textContent='✓ Reschedule'; }
    }
  }catch(e){
    if(msg){ msg.textContent='⚠ '+(e&&e.message?e.message:e); msg.style.color='#c0392b'; }
    if(btn){ btn.disabled=false; btn.textContent='✓ Reschedule'; }
  }
}
function openTile(id){
  const cd=findCardObj(id); if(!cd) return; const j=cd.job;
  calState.job = j || null;
  const wos=(String(cd.title||'').match(/[A-Z]{2,4}\d{6,}|\d{6,}/g)||[]);
  const woBadges=wos.map(w=>'<span class="wo">🧾 '+esc(w)+'</span>').join('');
  let titleName='', city='', body='';
  if(j){
    titleName=[j.customer_first,j.customer_last].filter(Boolean).join(' ').trim()||('Job #'+j.id);
    city=titleCase(j.service_city||'');
    const rows=[
      ['Appliance',(cap(j.brand||'')+' '+cap(j.appliance||'')).trim()],
      ['Problem',j.problem_summary||''],
      ['Warranty',j.warranty_company||''],
      ['Claim #',j.claim_number||''],
      ['Tech',TECH[Number(j.technician_id||0)]||''],
      ['Phone',j.customer_phone||''],
      ['Location',[titleCase(j.service_city||''),j.service_state,j.service_zip].filter(Boolean).join(', ')],
    ].filter(r=>r[1]);
    body=rows.map(r=>'<div class="tm-row"><span class="tm-k">'+esc(r[0])+'</span><span class="tm-v">'+esc(r[1])+'</span></div>').join('');
    calState.sel = Number(j.scheduled_start)>0 ? new Date(Number(j.scheduled_start)) : null;
  }else{
    const t=tidyTitle(cd.title); titleName=t.title||('#'+cd.id); city=cityFromTitle(cd.title);
    body='<div class="tm-notes">'+esc(cd.notes||cd.title||'')+'</div>';
    calState.sel=null;
  }
  const base=calState.sel||new Date(); calState.y=base.getFullYear(); calState.m=base.getMonth();
  const schLabel=calState.sel? calState.sel.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}) : 'Not scheduled';
  const html='<div class="tm">'
    +'<div class="tm-top"><div class="tm-wo">'+woBadges+'</div><button class="tm-x" onclick="closeTile()">×</button></div>'
    +'<div class="tm-title">'+esc(titleName)+(city?' <span class="tm-city">📍'+esc(city)+'</span>':'')+'</div>'
    +'<div class="tm-sched-card"><div class="tm-sched-label">📅 Scheduled date</div><div id="tm-sched" class="tm-sched-val">'+esc(schLabel)+'</div>'
    +'<div id="tm-cal">'+renderCalendar()+'</div>'
    +(j?'<button id="tm-save" class="tm-save" style="display:none" onclick="saveReschedule()">✓ Reschedule</button><div id="tm-save-msg" class="tm-save-msg"></div>':'<div class="tm-save-msg" style="color:#8a94a3">Not in our system yet — can\'t reschedule from here.</div>')
    +'</div>'
    +'<div class="tm-body">'+body+'</div></div>';
  const back=document.getElementById('tileModal'); back.innerHTML=html; back.classList.add('open');
}
function closeTile(){ const b=document.getElementById('tileModal'); if(b){b.classList.remove('open');b.innerHTML='';} }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeTile(); });

// ── Drag & drop (visual only) ──
let dragId=null, dragFromKey=null;
function findCard(colKey,id){ const [k,name]=colKey.split('|'); const col=(CACHE[k]||[]).find(c=>c.name===name); if(!col)return null; const idx=(col.cards||[]).findIndex(x=>x._id===id); return idx<0?null:{col,idx}; }
function wireDnD(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=card.dataset.id;dragFromKey=card.closest('.lane-body').dataset.key;card._moved=true;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');setTimeout(()=>{card._moved=false;},50);document.querySelectorAll('.lane-body').forEach(b=>b.classList.remove('drag-over'));});
    card.addEventListener('click',()=>{ if(card._moved)return; openTile(card.dataset.id); });
  });
  document.querySelectorAll('.lane-body').forEach(body=>{
    body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('drag-over');});
    body.addEventListener('dragleave',()=>body.classList.remove('drag-over'));
    body.addEventListener('drop',e=>{e.preventDefault();body.classList.remove('drag-over');
      const toKey=body.dataset.key; if(!dragId||!dragFromKey)return;
      const from=findCard(dragFromKey,dragId); if(!from)return;
      const [tk,tname]=toKey.split('|'); const toCol=(CACHE[tk]||[]).find(c=>c.name===tname); if(!toCol)return;
      const [cd]=from.col.cards.splice(from.idx,1); (toCol.cards=toCol.cards||[]).push(cd);
      showBoard(curBoard);
    });
  });
}

document.getElementById('reload').onclick=()=>{ delete CACHE[curBoard]; showBoard(curBoard); };
window.addEventListener('resize',moveThumb);
renderSlider();
showBoard(curBoard);
</script>
