<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🏆 Scoreboard — Ant</title>
<style>
  :root{
    --bg:#0a0e17; --panel:#111725; --panel2:#0e1420; --line:#1e2839;
    --ink:#e8ecf4; --muted:#8a92a6; --green:#00d68f; --cyan:#4af5ff;
    --gold:#ffcb45; --orange:#f5a623; --pink:#ff5b7f; --violet:#a78bfa;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,rgba(0,214,143,0.08),transparent),var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:26px;font-weight:900;letter-spacing:-0.02em;margin:6px 0 2px;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:12px;font-family:var(--mono);margin-bottom:16px}
  .toggle{display:flex;gap:8px;justify-content:center;margin:0 0 18px}
  .toggle button{flex:1;max-width:120px;padding:11px 8px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.04em}
  .toggle button.on{background:linear-gradient(135deg,var(--green),#00a86f);color:#04150e;border-color:var(--green)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 15px;margin-bottom:16px}
  .card h2{font-size:15px;font-weight:900;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2 .tag{margin-left:auto;font-size:10px;color:var(--muted);font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em}
  .row{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .rank{width:30px;text-align:center;font-size:19px;flex:0 0 auto}
  .nm{flex:1;font-weight:800;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .val{font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .val.money{color:var(--green)}
  .row.lead .nm{color:var(--green)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0;font-style:italic}
  /* Beat Teddy */
  .bt{background:linear-gradient(135deg,rgba(255,203,69,0.12),rgba(255,91,127,0.08)),var(--panel);border:1px solid rgba(255,203,69,0.35)}
  .bt .bounty{background:linear-gradient(135deg,#ffcb45,#f5a623);color:#241a02;font-weight:900;font-size:13px;padding:4px 11px;border-radius:20px;font-family:var(--mono)}
  .bt .teddyline{display:flex;align-items:center;gap:11px;padding:11px 12px;margin:0 0 10px;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:12px}
  .bt .teddyline .nm{color:var(--gold)}
  .bt .win{font-size:11px;color:var(--muted);font-family:var(--mono);font-weight:700}
  .flame{font-size:12px;color:var(--green);font-weight:900;font-family:var(--mono)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:8px;line-height:1.6}
  .foot a{color:var(--cyan);text-decoration:none;font-weight:700}
  .loading{text-align:center;color:var(--muted);padding:30px;font-family:var(--mono)}
</style>
<script src="/meta-pixel.js"></script>
</head>
<body>
<div class="wrap">
  <h1>🏆 The Scoreboard</h1>
  <div class="sub" id="sub">get shit done · beat teddy</div>

  <div class="toggle" id="toggle">
    <button data-scope="today" class="on">Today</button>
    <button data-scope="week">Week</button>
    <button data-scope="month">Month</button>
  </div>

  <div id="board"><div class="loading">Loading the standings…</div></div>

  <div class="foot">
    <a href="tech-daily-dashboard.html">← My Day</a> &nbsp;·&nbsp; <a href="office-board.html">Board</a>
  </div>
</div>

<script>
  let SCOPE = 'today';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
  const medal = (i) => ['🥇', '🥈', '🥉'][i] || ('<span style="color:var(--muted);font-size:14px;font-family:var(--mono)">' + (i + 1) + '</span>');

  function board(title, tag, rows, valFn, opts) {
    opts = opts || {};
    let h = '<div class="card"><h2>' + title + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '</h2>';
    if (!rows || !rows.length) { h += '<div class="empty">' + (opts.empty || 'No scores yet — go get some. 🐜') + '</div></div>'; return h; }
    h += rows.map((r, i) => '<div class="row' + (r._lead ? ' lead' : '') + '">'
      + '<span class="rank">' + medal(i) + '</span>'
      + '<span class="nm">' + esc(r.name) + (r._lead ? ' 🔥' : '') + '</span>'
      + '<span class="val' + (opts.money ? ' money' : '') + '">' + valFn(r) + '</span></div>').join('');
    return h + '</div>';
  }

  function beatTeddy(bt) {
    if (!bt) return '';
    let h = '<div class="card bt"><h2>🏁 Beat Teddy <span class="bounty">$' + (bt.bounty || 100) + '</span></h2>';
    h += '<div class="teddyline"><span class="rank">👑</span><span class="nm">Teddy</span><span class="val">' + (bt.teddy_wins || 0) + '</span></div>';
    const techs = bt.techs || [];
    if (!techs.length) {
      h += '<div class="empty">First to pre-diagnose each new intake wins it. Race Teddy 🏁</div>';
    } else {
      h += techs.map((t) => '<div class="row' + (t.beating_teddy ? ' lead' : '') + '">'
        + '<span class="rank">' + (t.beating_teddy ? '💰' : '🏁') + '</span>'
        + '<span class="nm">' + esc(t.name) + '</span>'
        + '<span class="win">' + (t.beating_teddy ? '<span class="flame">BEATING TEDDY</span>' : '') + '</span>'
        + '<span class="val">' + t.wins + '</span></div>').join('');
    }
    h += '<div class="foot" style="margin-top:10px">Pre-diagnose a stop on the Teddy Tool <b>before it starts</b> to win the round — once it\'s started, no points. Pre-diagnosing = right part, one trip, <b style="color:var(--green)">more money</b>. Beat Teddy this pay period (' + esc(bt.period || '') + ') = <b style="color:var(--gold)">$' + (bt.bounty || 100) + '</b> 💵</div>';
    return h + '</div>';
  }

  async function load() {
    try {
      const d = await fetch('/.netlify/functions/scoreboard?scope=' + SCOPE, { cache: 'no-store' }).then((r) => r.json());
      if (!d || !d.ok) { $('board').innerHTML = '<div class="loading">Couldn\'t load — try again in a sec.</div>'; return; }
      // mark leaders (top score) with a flame on jobs/tdrs/upsells
      const flag = (arr, key) => { if (arr && arr.length && arr[0][key] > 0) arr[0]._lead = true; };
      flag(d.jobs, 'count'); flag(d.tdrs, 'count'); flag(d.upsells, 'cut');
      let h = '';
      h += beatTeddy(d.beat_teddy);
      h += board('🏆 Most jobs completed', SCOPE, d.jobs, (r) => r.count, { empty: 'No jobs closed yet — first one\'s up for grabs.' });
      h += board('📋 Most TDRs filed', SCOPE, d.tdrs, (r) => r.count, { empty: 'No reports filed yet.' });
      h += board('💰 Most upsells', SCOPE, d.upsells, (r) => '$' + r.cut, { money: true, empty: 'No add-ons sold yet — hoses, coil cleanings, leak kits 💪' });
      $('board').innerHTML = h;
    } catch (_) {
      $('board').innerHTML = '<div class="loading">Couldn\'t load — try again in a sec.</div>';
    }
  }

  $('toggle').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    SCOPE = b.dataset.scope;
    [...$('toggle').children].forEach((x) => x.classList.toggle('on', x === b));
    load();
  });

  load();
  setInterval(load, 45000);
</script>
</body>
</html>
