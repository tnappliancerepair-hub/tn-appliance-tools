<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ant Office Dashboard - TN Appliance Exchange</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto auto 1fr;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #0e1118, #131a2a);
    border-bottom: 1px solid #2a3040;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .icon { font-size: 24px; flex-shrink: 0; }
  .header .text { flex: 1; min-width: 0; }
  .header .title { font-size: 14px; font-weight: 700; }
  .header .sub {
    font-size: 11px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header .refresh-btn {
    background: transparent;
    border: 1px solid #2a3040;
    color: #e8edf5;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
    font-family: inherit;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .header .refresh-btn:active { transform: scale(0.9); }
  .header .refresh-btn:hover:not(:disabled) { background: #2a3040; border-color: #4a9eff; }
  .header .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .header .refresh-btn.spinning { animation: spin 0.7s linear infinite; }

  /* Filter tabs */
  .filter-tabs {
    background: #131720;
    border-bottom: 1px solid #2a3040;
    padding: 8px 12px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tabs .tab {
    background: #1e2433;
    border: 1px solid #2a3040;
    color: #8a93aa;
    padding: 8px 14px;
    border-radius: 18px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
    font-family: inherit;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .filter-tabs .tab:active { transform: scale(0.97); }
  .filter-tabs .tab.active {
    background: linear-gradient(135deg, #4a9eff, #3a8eef);
    border-color: #4a9eff;
    color: white;
  }

  /* Job list */
  .job-list {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .job-list::-webkit-scrollbar { width: 8px; }
  .job-list::-webkit-scrollbar-track { background: transparent; }
  .job-list::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }

  .loading {
    padding: 40px 16px;
    text-align: center;
    color: #8a93aa;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #2a3040;
    border-top-color: #f5a623;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-jobs {
    padding: 40px 16px;
    text-align: center;
    color: #8a93aa;
    font-size: 14px;
  }

  /* Job card */
  .job-card {
    background: #1e2433;
    border: 1px solid #2a3040;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .job-top {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .job-id {
    font-size: 13px;
    font-weight: 700;
    color: #e8edf5;
    font-family: 'IBM Plex Mono', monospace;
  }
  .job-age {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    background: rgba(138,147,170,0.15);
    color: #8a93aa;
    border: 1px solid rgba(138,147,170,0.3);
  }
  .job-age.aged {
    background: rgba(255,71,87,0.15);
    color: #ff4757;
    border-color: rgba(255,71,87,0.3);
  }
  .job-badge {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-left: auto;
  }
  .job-badge.scheduled       { background: rgba(74,158,255,0.15);  color: #4a9eff; border: 1px solid rgba(74,158,255,0.3); }
  .job-badge.in_progress     { background: rgba(245,166,35,0.15);  color: #f5a623; border: 1px solid rgba(245,166,35,0.3); }
  .job-badge.completed,
  .job-badge.complete        { background: rgba(0,214,143,0.15);   color: #00d68f; border: 1px solid rgba(0,214,143,0.3); }
  .job-badge.canceled        { background: rgba(255,71,87,0.15);   color: #ff4757; border: 1px solid rgba(255,71,87,0.3); }
  .job-badge.awaiting_parts,
  .job-badge.parts_ordered,
  .job-badge.broadcasting,
  .job-badge.pending_auth    { background: rgba(245,166,35,0.15);  color: #f5a623; border: 1px solid rgba(245,166,35,0.3); }
  .job-badge.submitted       { background: rgba(74,158,255,0.15);  color: #4a9eff; border: 1px solid rgba(74,158,255,0.3); }
  .job-badge.ready,
  .job-badge.pending,
  .job-badge.closed,
  .job-badge.default         { background: rgba(138,147,170,0.15); color: #8a93aa; border: 1px solid rgba(138,147,170,0.3); }

  .job-customer {
    font-size: 15px;
    font-weight: 700;
    color: #e8edf5;
  }
  .job-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 10px;
    font-size: 12px;
    color: #8a93aa;
  }
  .job-meta .k { color: #5a6480; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; }
  .job-meta .v { color: #e8edf5; font-weight: 500; }
  .job-problem {
    font-size: 12px;
    color: #8a93aa;
    background: #0e1118;
    border: 1px solid #2a3040;
    border-radius: 6px;
    padding: 8px;
    margin-top: 2px;
  }
  .job-actions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .job-actions button, .job-actions a {
    flex: 1;
    min-height: 40px;
    background: #2a3040;
    border: 1px solid #3a4050;
    color: #e8edf5;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.15s;
    -webkit-appearance: none;
  }
  .job-actions button:active:not(:disabled),
  .job-actions a:active { transform: scale(0.97); }
  .job-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  .job-actions a.primary,
  .job-actions button.primary {
    background: linear-gradient(135deg, #4a9eff, #3a8eef);
    border-color: #4a9eff;
    color: white;
  }

  /* Password gate */
  .auth-overlay {
    position: fixed; inset: 0; background: #0e1118;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
  }
  .auth-overlay.hidden { display: none; }
  .auth-card {
    background: #131720; border: 1px solid #2a3040;
    border-radius: 16px; padding: 28px 22px; width: 100%; max-width: 360px;
    text-align: center;
  }
  .auth-card h2 { font-size: 18px; margin-bottom: 6px; }
  .auth-card .sub { color: #8a93aa; font-size: 13px; margin-bottom: 18px; }
  .auth-card input {
    width: 100%; background: #0e1118; border: 1px solid #2a3040;
    border-radius: 10px; color: #e8edf5; padding: 14px;
    font-size: 16px; text-align: center;
    font-family: inherit; margin-bottom: 12px;
    -webkit-appearance: none;
  }
  .auth-card input:focus { border-color: #4a9eff; outline: none; }
  .auth-card button {
    width: 100%; background: #4a9eff; color: white; border: 0;
    border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700;
    cursor: pointer;
  }
  .auth-card button:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-card .err {
    color: #ff4757; font-size: 13px; margin-top: 10px; min-height: 18px;
  }
</style>
</head>
<body>

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-card">
    <h2>🐜 Ant Office</h2>
    <div class="sub">enter office password to continue</div>
    <input id="auth-input" type="password" autocomplete="current-password">
    <button id="auth-submit" onclick="submitAuth()">Unlock</button>
    <div class="err" id="auth-err"></div>
  </div>
</div>

<div class="header">
  <div class="icon">🐜</div>
  <div class="text">
    <div class="title">Ant Office</div>
    <div class="sub" id="header-sub">Loading...</div>
  </div>
  <button class="refresh-btn" id="refresh-btn" onclick="loadJobs()" title="Refresh" aria-label="Refresh">↻</button>
</div>

<div class="filter-tabs" id="filter-tabs"></div>

<div class="job-list" id="job-list">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading jobs...</div>
  </div>
</div>

<script>
const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const AUTH_KEY = 'tn_office_auth_v1';

// Office password verify — was MISSING here. Calling undefined function
// threw ReferenceError, submitAuth's catch swallowed it, button reset
// to "Unlock" via finally — Danielle's exact symptom. Fixed 5/27 PM.
async function __verifyOfficePassword(pw) {
  if (!pw) return false;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(XANO_BASE + '/verify_office_password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw}),
      signal: ctrl.signal
    });
    clearTimeout(t);
    if (!r.ok) throw new Error('server ' + r.status);
    const d = await r.json();
    return d && d.success === true;
  } catch (e) {
    clearTimeout(t);
    if (e && e.name === 'AbortError') throw new Error('timeout');
    throw e;
  }
}

const TABS = [
  { id: 'all',          label: 'All',              filter: { date_filter: 'all' } },
  { id: 'unscheduled',  label: 'Needs Scheduling', filter: { date_filter: 'unscheduled' } },
  { id: 'needs_info',   label: 'Needs Info',       filter: { status: 'awaiting_completion', date_filter: 'all' } },
  { id: 'parts_ordered',label: 'Parts Ordered',    filter: { status: 'parts_ordered', date_filter: 'all' } },
  { id: 'ready',        label: 'Ready to Submit',  filter: { status: 'complete', date_filter: 'all' } },
  { id: 'submitted',    label: 'Submitted',        filter: { status: 'submitted', date_filter: 'all' } },
  { id: 'flagged',      label: 'Flagged',          filter: { status: 'pending_auth', date_filter: 'all' } }
];

let activeTab = 'all';
let isLoading = false;

function init() {
  renderTabs();
  loadJobs();
}

function renderTabs() {
  const root = document.getElementById('filter-tabs');
  root.innerHTML = TABS.map(t =>
    `<button class="tab${t.id === activeTab ? ' active' : ''}" data-tab="${t.id}">${escapeHtml(t.label)}</button>`
  ).join('');
  root.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderTabs();
      loadJobs();
    });
  });
}

async function loadJobs() {
  if (isLoading) return;
  isLoading = true;
  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.disabled = true;
  refreshBtn.classList.add('spinning');

  const list = document.getElementById('job-list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading jobs...</div></div>';

  const tab = TABS.find(t => t.id === activeTab) || TABS[0];
  const payload = { page: 1, per_page: 100 };
  if (tab.filter.status) payload.status = tab.filter.status;
  if (tab.filter.date_filter) payload.date_filter = tab.filter.date_filter;

  const todayStr = new Date().toLocaleDateString('en-US', {
    timeZone: 'America/Chicago',
    weekday: 'short',
    month: 'short',
    day: 'numeric'
  });

  try {
    // Route through xano-proxy so query params land correctly on the GET endpoint
    // (direct fetch was getting page=0/per_page=0 because Xano GET optional ints
    // default to 0, not null, so the ?? 1 fallback never fired).
    const res = await fetch('/.netlify/functions/xano-proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        endpoint: 'get_jobs_for_dashboard',
        payload,
        method: 'POST'
      })
    });
    if (!res.ok) throw new Error(`Could not load jobs (${res.status})`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'no success flag');

    const items = Array.isArray(data.items) ? data.items : [];

    // Client-side resort: oldest first (days_since_created DESC).
    items.sort((a, b) => (b.days_since_created || 0) - (a.days_since_created || 0));

    const count = items.length;
    document.getElementById('header-sub').textContent = `${todayStr} • ${count} ${count === 1 ? 'job' : 'jobs'}`;
    renderJobs(items);
  } catch (err) {
    document.getElementById('header-sub').textContent = todayStr;
    list.innerHTML = `<div class="empty-jobs">⚠️ ${escapeHtml(err.message)}</div>`;
  } finally {
    isLoading = false;
    refreshBtn.disabled = false;
    refreshBtn.classList.remove('spinning');
  }
}

function renderJobs(items) {
  const list = document.getElementById('job-list');
  if (items.length === 0) {
    list.innerHTML = '<div class="empty-jobs">no jobs in this view</div>';
    return;
  }
  list.innerHTML = items.map(buildJobCard).join('');
}

const KNOWN_STATUSES = [
  'scheduled', 'in_progress', 'completed', 'complete', 'canceled',
  'awaiting_parts', 'parts_ordered', 'broadcasting', 'pending_auth',
  'submitted', 'ready', 'pending', 'closed'
];

function buildJobCard(it) {
  const job = it.job || {};
  const cust = it.customer || {};
  const tech = it.tech || {};
  const days = it.days_since_created || 0;
  const status = job.scheduling_status || 'default';
  const badgeClass = KNOWN_STATUSES.includes(status) ? status : 'default';

  const custName = [cust.first_name, cust.last_name].filter(Boolean).join(' ') || 'Customer';
  const phone = cust.phone || '';
  const phoneDigits = String(phone).replace(/\D/g, '');
  const phoneE164 = phoneDigits.length === 10 ? '+1' + phoneDigits : (phoneDigits.length === 11 ? '+' + phoneDigits : phoneDigits);
  const phoneFmt = phoneDigits.length === 10
    ? `(${phoneDigits.slice(0,3)}) ${phoneDigits.slice(3,6)}-${phoneDigits.slice(6)}`
    : phone;

  const apl = [job.brand, job.appliance_type].filter(Boolean).join(' ') || 'Appliance';
  const techName = [tech.first_name, tech.last_name].filter(Boolean).join(' ') || 'Unassigned';
  const scheduledStr = job.scheduled_start ? formatDateTimeCT(job.scheduled_start) : 'Not scheduled';
  const custType = job.customer_type || '—';
  const problem = (job.problem_summary || '').slice(0, 80);
  const problemFull = (job.problem_summary || '').length > 80 ? problem + '...' : problem;

  const ageClass = days > 7 ? 'aged' : '';
  const openUrl = `job-detail.html?job_id=${job.id}`;
  const callDisabled = !phoneE164;

  return `
    <div class="job-card">
      <div class="job-top">
        <div class="job-id">#${job.id || '?'}</div>
        <div class="job-age ${ageClass}">${days}d old</div>
        <div class="job-badge ${badgeClass}">${escapeHtml(status.replace(/_/g, ' '))}</div>
      </div>
      <div class="job-customer">${escapeHtml(custName)}${phoneFmt ? ' &middot; <span style="font-weight:500;color:#8a93aa">' + escapeHtml(phoneFmt) + '</span>' : ''}</div>
      <div class="job-meta">
        <div class="k">Appliance</div>  <div class="v">${escapeHtml(apl)}</div>
        <div class="k">Tech</div>       <div class="v">${escapeHtml(techName)}</div>
        <div class="k">Scheduled</div>  <div class="v">${escapeHtml(scheduledStr)}</div>
        <div class="k">Type</div>       <div class="v">${escapeHtml(custType)}</div>
      </div>
      ${problemFull ? `<div class="job-problem">${escapeHtml(problemFull)}</div>` : ''}
      <div class="job-actions">
        <button ${callDisabled ? 'disabled title="no phone on file"' : `onclick="window.location.href='tel:${escapeAttr(phoneE164)}'"`}>📞 Call Customer</button>
        <a class="primary" href="${escapeAttr(openUrl)}">📋 Open Job</a>
      </div>
    </div>
  `;
}

function formatDateTimeCT(ms) {
  if (!ms) return 'Not scheduled';
  const d = new Date(ms);
  const dateStr = d.toLocaleDateString('en-US', {
    timeZone: 'America/Chicago',
    month: 'short',
    day: 'numeric'
  });
  const timeStr = d.toLocaleTimeString('en-US', {
    timeZone: 'America/Chicago',
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  }).toLowerCase().replace(/\s/g, '');
  return `${dateStr} ${timeStr}`;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/'/g, '%27');
}

// Password gate with debug logging + visible "Authenticating" feedback.
async function submitAuth() {
  const errEl = document.getElementById('auth-err');
  const btn = document.getElementById('auth-submit');
  const inputEl = document.getElementById('auth-input');
  const pw = (inputEl.value || '').trim();
  errEl.textContent = '';
  if (pw === '') { errEl.textContent = 'Enter password'; return; }
  btn.disabled = true;
  btn.textContent = 'Authenticating…';
  dbg('submitAuth start', { pw_len: pw.length });
  let ok = false;
  try {
    ok = await __verifyOfficePassword(pw);
    dbg('verify returned', { ok });
  } catch (e) {
    dbg('verify threw', { msg: String(e && e.message) });
    errEl.textContent = (e && e.message === 'timeout') ? 'Server timeout — try again or text Teddy 615-485-5795.' : ('Error: ' + (e && e.message || 'unknown'));
    btn.disabled = false;
    btn.textContent = 'Unlock';
    return;
  }
  if (!ok) {
    dbg('wrong password');
    errEl.textContent = 'Wrong password. (Default is "antlives" — text Teddy if that doesn\'t work)';
    inputEl.value = '';
    inputEl.focus();
    btn.disabled = false;
    btn.textContent = 'Unlock';
    return;
  }
  // SUCCESS
  localStorage.setItem(AUTH_KEY, '1');
  dbg('localStorage set, hiding overlay');
  try {
    document.getElementById('auth-overlay').classList.add('hidden');
    dbg('overlay hidden');
  } catch (e) {
    dbg('overlay hide threw', { msg: String(e && e.message) });
  }
  try {
    init();
    dbg('init returned');
  } catch (e) {
    dbg('init threw', { msg: String(e && e.message) });
    // Init failed but auth was OK. Show a recovery message in the now-visible content area.
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#fff;background:#0e1118;min-height:100vh"><h2>Logged in ✓ — page failed to load.</h2><p>Reload the page. If it still fails, text Teddy at 615-485-5795 with this error: ' + String(e && e.message || 'unknown') + '</p></div>';
  }
}

// Client debug log — captured in window.__authDebug, also POST'd to
// /log_client_debug for server-side triage. Lets us see what Danielle
// hit without bothering her for a screenshot.
window.__authDebug = window.__authDebug || [];
function dbg(msg, data) {
  const entry = { t: new Date().toISOString(), msg, data: data || null, page: location.pathname };
  window.__authDebug.push(entry);
  try { console.log('[AUTH]', msg, data); } catch (_e) {}
  // Fire-and-forget POST. Don't block on it. No-op if endpoint missing.
  try {
    fetch(XANO_BASE + '/log_client_debug', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(entry),
      keepalive: true
    }).catch(() => {});
  } catch (_e) {}
}

document.getElementById('auth-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') submitAuth();
});

// Skip auth if previously unlocked on this device.
if (localStorage.getItem(AUTH_KEY) === '1') {
  document.getElementById('auth-overlay').classList.add('hidden');
  init();
} else {
  document.getElementById('auth-input').focus();
}
</script>
<script src="/office-search.js?v=20260527-2"></script>
</body>
</html>
