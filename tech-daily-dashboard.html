<style>
  /* 2026-05-28 horizontal-offset fix (John report). Locks html + body
     to viewport width so iOS Safari can't horizontally pan content
     off-screen when any inner element briefly overflows. */
  html, body { overflow-x: hidden !important; max-width: 100vw !important; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  :root {
    --bg: #0e1118;
    --panel: #131720;
    --panel-2: #1a1f2c;
    --border: #2a3040;
    --border-soft: #1f2533;
    --text: #e8edf5;
    --muted: #8a93aa;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --green: #00d68f;
    --orange: #f5a623;
    --blue: #5aa9ff;
    --red: #ff6b6b;
    --violet: #b48cff;
  }
  /* ☀️ LIGHT MODE (opt-in per device via the ☀️ toggle; default stays dark) */
  [data-theme="light"] {
    color-scheme: light;
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f5f7fa;
    --border: #e4e8ee;
    --border-soft: #eef1f5;
    --text: #1d2530;
    --muted: #5b6573;
    /* darken the neon accents so they stay readable on white */
    --green: #0f9d63;
    --orange: #c47a12;
    --blue: #1f6fed;
    --red: #d84a4a;
    --violet: #7a5cf0;
  }

  /* ── PIN gate overlay ───────────────────────────────────────────── */
  .pin-overlay {
    position: fixed; inset: 0;
    background: rgba(14,17,24,0.96);
    backdrop-filter: blur(6px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .pin-overlay.show { display: flex; }
  .pin-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 360px; width: 100%;
    text-align: center;
  }
  .pin-card .ant { font-size: 36px; margin-bottom: 8px; }
  .pin-card .title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .pin-card .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .pin-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 20px;
    font-family: var(--mono);
    text-align: center;
    letter-spacing: 4px;
    outline: none;
    transition: border-color 0.15s;
  }
  .pin-input:focus { border-color: var(--orange); }
  .pin-submit {
    margin-top: 14px;
    width: 100%;
    background: var(--orange);
    color: #1a1208;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.05s;
  }
  .pin-submit:active { transform: scale(0.98); }
  .pin-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .pin-err {
    margin-top: 12px;
    font-size: 12px;
    color: var(--red);
    min-height: 16px;
  }

  /* ── Header ─────────────────────────────────────────────────────── */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(180deg, #0e1118, rgba(14,17,24,0.95));
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-soft);
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header .ant { font-size: 22px; line-height: 1; }
  .header .text { flex: 1; min-width: 0; }
  .header .title {
    font-size: 15px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .header .sub {
    font-size: 11px; color: var(--muted);
    font-family: var(--mono);
    margin-top: 2px;
  }
  .header .tech-badge {
    background: rgba(0,214,143,0.10);
    border: 1px solid rgba(0,214,143,0.25);
    color: var(--green);
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--mono);
    white-space: nowrap;
  }

  /* ── Date nav ──────────────────────────────────────────────────── */
  .date-nav {
    position: sticky; top: 56px; z-index: 49;
    background: rgba(14,17,24,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-soft);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .date-nav button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--mono);
    transition: background 0.15s, border-color 0.15s, transform 0.05s;
    min-height: 36px;
  }
  .date-nav button:active { transform: scale(0.97); }
  .date-nav button:hover:not(:disabled) { border-color: var(--orange); }
  .date-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
  .date-nav .today-btn {
    flex: 1;
    background: var(--orange);
    color: #1a1208;
    border-color: var(--orange);
    font-weight: 700;
  }
  .date-nav .today-btn.active {
    background: transparent;
    color: var(--orange);
    pointer-events: none;
  }

  /* ── Map ────────────────────────────────────────────────────────── */
  #map {
    height: 220px;
    width: 100%;
    background: #1a1f2c;
    z-index: 1;
  }
  .leaflet-container {
    background: #1a1f2c;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .map-pin {
    background: var(--orange);
    color: #1a1208;
    width: 28px; height: 28px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #1a1208;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .map-pin span {
    transform: rotate(45deg);
    font-weight: 800;
    font-size: 13px;
    font-family: var(--mono);
  }
  .map-pin.active {
    background: var(--green);
    transform: rotate(-45deg) scale(1.15);
  }
  .map-empty {
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
    background: var(--panel);
    border-bottom: 1px solid var(--border-soft);
  }

  /* ── Summary strip ────────────────────────────────────────────── */
  .summary {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
  }
  .summary .count {
    color: var(--text);
    font-weight: 700;
  }
  .summary .sep { color: var(--border); }

  /* ── Job cards ────────────────────────────────────────────────── */
  .jobs {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .seg-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted, #8a94a6);
    margin: 6px 2px -2px;
    padding-top: 6px;
  }
  .seg-header:first-child { padding-top: 0; }
  .seg-count {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: #cdd6e4;
    font-size: 12px;
    font-weight: 800;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 16px;
    text-decoration: none;
    color: var(--text);
    display: block;
    transition: border-color 0.2s, transform 0.05s, background 0.2s;
    opacity: 0;
    transform: translateY(8px);
    animation: card-in 0.4s ease-out forwards;
  }
  @keyframes card-in {
    to { opacity: 1; transform: translateY(0); }
  }
  .card:active {
    transform: scale(0.99);
    background: var(--panel-2);
  }
  .card.highlight {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(245,166,35,0.18);
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .stop-num {
    background: var(--orange);
    color: #1a1208;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 12px;
    font-family: var(--mono);
    flex-shrink: 0;
  }
  .time-window {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .status-pill {
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .status-scheduled    { background: rgba(90,169,255,0.12);  border: 1px solid rgba(90,169,255,0.25);  color: var(--blue); }
  .status-in_progress  { background: rgba(0,214,143,0.12);   border: 1px solid rgba(0,214,143,0.25);   color: var(--green); }
  .status-completed    { background: rgba(138,147,170,0.12); border: 1px solid rgba(138,147,170,0.25); color: var(--muted); }
  .status-prediagnosis_pending { background: rgba(245,166,35,0.12); border: 1px solid rgba(245,166,35,0.25); color: var(--orange); }
  .status-needs_review { background: rgba(180,140,255,0.12); border: 1px solid rgba(180,140,255,0.25); color: var(--violet); }
  .status-other        { background: rgba(138,147,170,0.10); border: 1px solid rgba(138,147,170,0.20); color: var(--muted); }

  .customer-line {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .appliance-line {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .appliance-line .dot { color: var(--border); margin: 0 6px; }

  .address-line {
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .address-line .icon { color: var(--orange); flex-shrink: 0; }
  .address-line .text { flex: 1; }

  .problem-line {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.45;
    margin-bottom: 10px;
  }

  .avail-line {
    display: flex;
    gap: 7px;
    align-items: flex-start;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
    background: rgba(116,227,196,0.08);
    border: 1px solid rgba(116,227,196,0.28);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .avail-line .avail-ico { flex: 0 0 auto; }
  .avail-line b { color: #74e3c4; font-weight: 700; }

  /* Bird's-eye availability banner — top of every card so the tech sees when
     the customer is / isn't free BEFORE planning the stop (Teddy 2026-06-26). */
  .avail-banner {
    background: rgba(255,179,84,0.11);
    border: 1px solid rgba(255,179,84,0.45);
    border-left: 4px solid #ffb454;
    border-radius: 9px;
    padding: 9px 11px;
    margin: 0 0 11px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }
  .avail-banner .lbl {
    display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .07em;
    color: #ffb454; margin-bottom: 2px; text-transform: uppercase;
  }
  .avail-banner .access { margin-top: 5px; font-size: 13px; color: var(--muted); }
  .avail-banner .access b { color: #ffb454; font-weight: 700; }
  .ant-built-note { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 14px; padding: 11px 14px; border-radius: 10px; background: rgba(116,227,196,0.06); border: 1px solid rgba(116,227,196,0.22); }

  /* Floors flag — red, top of card: tech must see it before he rolls. */
  .floor-banner {
    background: rgba(255,90,90,0.12);
    border: 1px solid rgba(255,90,90,0.5);
    border-left: 4px solid #ff5a5a;
    border-radius: 9px;
    padding: 9px 11px;
    margin: 0 0 11px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    color: #ffd9d9;
  }

  .teddy-note {
    background: rgba(245,166,35,0.06);
    border-left: 3px solid var(--orange);
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 10px;
    font-size: 12px;
    line-height: 1.5;
  }
  .teddy-note .label {
    color: var(--orange);
    font-weight: 700;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .teddy-note .text { color: var(--text); }
  .teddy-note .meta { color: var(--muted); margin-top: 4px; font-size: 11px; }

  .attachments-strip {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .att-thumb {
    width: 56px; height: 56px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .att-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .att-thumb.video::after {
    content: '▶';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    background: rgba(0,0,0,0.45);
    border-radius: 8px;
  }
  .att-thumb.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 18px;
  }
  .att-more {
    width: 56px; height: 56px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 11px;
    font-family: var(--mono);
    font-weight: 700;
  }

  .att-meta-line {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    font-family: var(--mono);
  }

  .card-cta {
    margin-top: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .open-btn {
    background: var(--green);
    color: #082018;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    flex: 1;
    text-align: center;
  }
  .quick-actions {
    display: flex;
    gap: 6px;
  }
  .quick-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    text-decoration: none;
  }
  .quick-btn:active { background: var(--panel-2); }

  /* ── Inline one-tap lifecycle (On my way / Start / Finish) — drives the
        schedule's truth: techs mark progress without opening each job. ── */
  .lc-row { display:flex; gap:8px; margin-top:10px; }
  .lc-btn { flex:1; text-align:center; padding:13px 10px; border-radius:9px; font-family:var(--mono); font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer; text-decoration:none; }
  .lc-otw { border-color:rgba(116,160,255,0.5); color:#8ab4ff; }
  .lc-start, .lc-finish { background:var(--green); color:#082018; border-color:var(--green); }
  .lc-ok { background:rgba(0,214,143,0.15); color:var(--green); border-color:rgba(0,214,143,0.4); }
  .lc-done { flex:1; text-align:center; padding:13px; color:var(--muted); font-size:13px; font-weight:700; font-family:var(--mono); }

  /* ── Finish + file the report right on the tile (Teddy 7/5: close the loop
        where he stands, no page jump). "Your report = your pay." ── */
  .lc-report { background:var(--orange); color:#231400; border-color:var(--orange); }
  .lc-expand { flex:0 0 auto; }
  .tile-report { margin-top:10px; border:1px solid rgba(245,166,35,0.45); background:rgba(245,166,35,0.06); border-radius:11px; padding:12px; }
  .tile-report .pay { font-size:11.5px; font-weight:800; color:#f5a623; font-family:var(--mono); letter-spacing:0.04em; margin-bottom:8px; text-transform:uppercase; }
  .tile-report textarea { width:100%; box-sizing:border-box; min-height:74px; resize:vertical; background:var(--bg); border:1px solid var(--border); border-radius:9px; color:var(--text); font-size:16px; font-family:inherit; padding:10px; line-height:1.4; }
  .tile-report .rr { display:flex; gap:8px; margin-top:9px; }
  .tile-report .mic { flex:0 0 auto; padding:11px 14px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; font-weight:800; cursor:pointer; }
  .tile-report .mic.rec { background:rgba(255,107,107,0.16); border-color:rgba(255,107,107,0.5); color:#ff8a82; }
  .tile-report .done { flex:1; padding:12px; border-radius:9px; border:1px solid var(--green); background:var(--green); color:#082018; font-size:13px; font-weight:800; cursor:pointer; font-family:var(--mono); text-transform:uppercase; letter-spacing:0.03em; }
  .tile-report .parts { flex:1; padding:12px; border-radius:9px; border:1px solid rgba(116,160,255,0.5); background:var(--bg); color:#8ab4ff; font-size:12.5px; font-weight:800; cursor:pointer; font-family:var(--mono); text-transform:uppercase; }
  .tile-report .rmsg { font-size:12px; margin-top:8px; min-height:15px; color:var(--muted); }
  .tile-report .hint { font-size:11.5px; color:var(--muted); margin-top:7px; line-height:1.35; }

  /* ── 🎯 Part showdown on the tile — you vs Ant vs Danielle (Teddy 7/5) ── */

  .tile-showdown .sh-btn { flex:1 1 120px; padding:11px 8px; border-radius:9px; font-family:var(--mono); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.02em; cursor:pointer; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  .tile-showdown .sh-yes { border-color:var(--green); color:var(--green); }

  .tile-showdown .sh-ov button { flex:0 0 auto; padding:11px 14px; border-radius:9px; border:1px solid var(--green); background:var(--green); color:#082018; font-weight:800; font-size:12px; cursor:pointer; font-family:var(--mono); }

  /* ── Empty / loading / error ──────────────────────────────────── */

    padding: 48px 24px;
    text-align: center;

    font-size: 32px;

  @keyframes bob {
    0%,100% { transform: translateY(0); }

  }
  .loading .msg {
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
  }

  .err-banner {
    margin: 12px;

</style>

<!-- PIN gate -->
<div class="pin-overlay" id="pinOverlay">

<!-- Main app -->
<div id="app" style="display: none;">

  <!-- Talk to Ant Scheduler — primary CTA, top of nav so it's the

  <div style="padding:8px 12px 0">
    <a id="navScheduler" href="#"
       style="display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,rgba(74,245,255,0.14),rgba(74,245,255,0.06));border:1px solid rgba(74,245,255,0.4);color:#4af5ff;border-radius:10px;text-decoration:none;font-weight:700;letter-spacing:0.04em;box-shadow:0 0 18px rgba(74,245,255,0.10)">
      <span style="font-size:20px">🐜</span>
      <span style="flex:1">Talk to Ant — switch your day around</span>
      <span style="font-size:18px">→</span>
    </a>
  </div>

  <div style="padding:6px 12px 0;display:flex;gap:6px;font-family:var(--mono);font-size:11px;flex-wrap:wrap">
    <a id="navScheduler" href="#" style="flex:1;min-width:48%;text-align:center;padding:8px;background:rgba(76,201,192,0.10);border:1px solid rgba(76,201,192,0.30);color:#4cc9c0;border-radius:8px;text-decoration:none">📅 My Schedule</a>
    <a id="navPerf" href="#" style="flex:1;text-align:center;padding:8px;background:rgba(180,140,255,0.10);border:1px solid rgba(180,140,255,0.25);color:#b48cff;border-radius:8px;text-decoration:none">📊 Performance</a>
    <a id="navPayouts" href="#" style="flex:1;text-align:center;padding:8px;background:rgba(0,214,143,0.10);border:1px solid rgba(0,214,143,0.25);color:#00d68f;border-radius:8px;text-decoration:none">💰 Payouts</a>
    <a id="navDayOff" href="#" style="flex:1;text-align:center;padding:8px;background:rgba(255,107,107,0.10);border:1px solid rgba(255,107,107,0.25);color:#ff6b6b;border-radius:8px;text-decoration:none">🛑 Day Off</a>
    <a id="navReturns" href="#" style="flex:1;min-width:48%;text-align:center;padding:8px;background:rgba(240,180,80,0.12);border:1px solid rgba(240,180,80,0.30);color:#f0b450;border-radius:8px;text-decoration:none">🔁 Returns <span id="navReturnsBadge"></span></a>
    <a id="navOffice" href="office-board.html" target="_blank" rel="noopener" style="flex:1;min-width:48%;text-align:center;padding:8px;background:rgba(120,150,220,0.12);border:1px solid rgba(120,150,220,0.30);color:#8ea6e0;border-radius:8px;text-decoration:none">👀 Office board (view)</a>

  <!-- Field search — look up ANY customer/job by name, phone, or address
       from the road (Teddy's ask 2026-06-22: "no search there for me to look
       it up"). Hits the forgiving search-customers fn; tap a result → job. -->
  <div style="padding:10px 12px 0">
    <div style="display:flex;gap:6px">
      <input id="fldSearch" type="search" inputmode="search" enterkeyhint="search"
        placeholder="🔍 Find anyone — name, phone, address…"
        autocomplete="off" autocorrect="off" autocapitalize="words"
        style="flex:1;min-width:0;padding:12px 14px;background:#0e1320;border:1px solid #2a3344;border-radius:10px;color:#e8eefc;font-size:16px;outline:none">
      <button id="fldSearchBtn" style="flex:0 0 auto;padding:0 16px;background:rgba(74,245,255,0.14);border:1px solid rgba(74,245,255,0.4);color:#4af5ff;border-radius:10px;font-weight:800;font-size:15px">Go</button>
    </div>
    <div id="fldSearchResults" style="margin-top:8px"></div>

  <!-- Tech Inbox — populated by loadInbox() in JS after PIN gate clears.
       Auto-polls every 45s. Tap a message to expand + mark read. -->

  <!-- Parts to grab — rolling next-5-days pickup list (storage + Marcone/Tribles
       will-call) so a guy heading into town/into a distributor grabs everything
       at once. Populated by loadPickup(). -->
  <div id="pickupHost" style="padding:10px 12px 0;display:none"></div>

  <div id="mapHost"></div>

<!-- Loading overlay shown until first render -->

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/ant-constraints.js"></script>
<script>
(function() {
  'use strict';

  // ── URL params + config ────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  // Resolve who this is: URL first, else the device's saved tech id (set by
  // tech.html). This is why home-screen / PWA opens work even without ?tech_id.
  let TECH_ID = params.get('tech_id');
  try {
    if (TECH_ID) { localStorage.setItem('tn_tech_id', String(TECH_ID)); }
    else { TECH_ID = localStorage.getItem('tn_tech_id') || null; }
  } catch (_) {}
  const URL_DATE = params.get('date');
  const NETLIFY_BASE = '';  // same-origin
  const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
  const PIN_STORAGE_KEY = `tn_tech_pin_v1_${TECH_ID}`;
  const GEO_PREFIX = 'tn_geo_v1:';
  const GEO_TTL_MS = 30 * 24 * 60 * 60 * 1000;  // 30 days

  // No id anywhere → send them to the picker instead of dead-ending.
  if (!TECH_ID) {
    location.replace('/tech.html');
    return;
  }

  // ── DOM refs ───────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const pinOverlay = $('pinOverlay');
  const pinInput = $('pinInput');
  const pinSubmit = $('pinSubmit');
  const pinErr = $('pinErr');
  const app = $('app');
  const loading = $('loading');
  const dateLabel = $('dateLabel');
  const dateSub = $('dateSub');
  const techBadge = $('techBadge');
  const prevDay = $('prevDay');
  const nextDay = $('nextDay');
  const todayBtn = $('todayBtn');
  const summary = $('summary');
  const mapHost = $('mapHost');
  const jobsHost = $('jobsHost');

  let mapInstance = null;
  let mapMarkers = [];
  let currentDateStr = URL_DATE || null;  // null = today (server-resolved)
  let serverTodayCT = null;
  let dashboardData = null;

  // ── PIN auth ───────────────────────────────────────────────────
  // Tri-state: true = verified, false = clean rejection (wrong pin),
  // 'unreachable' = server down / network error (5xx, blank, or throw).
  // The distinction matters: a Xano outage must NOT be treated like a
  // wrong pin (which would lock a tech out + wipe their good cached pin).
  async function verifyPin(pin) {
    try {
      const res = await fetch('/.netlify/functions/verify-pin-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ technician_id: parseInt(TECH_ID, 10), pin })
      });
      // proxy returns 500 when Xano 503s (it can't parse the HTML error body)
      if (!res.status || res.status >= 500) return 'unreachable';
      const data = await res.json();
      return (data && data.success === true) ? true : false;
    } catch (err) {
      console.error('verify-pin error', err);
      return 'unreachable';
    }
  }

  // Office override: lets the office (Danielle) open ANY tech's dashboard with
  // the OFFICE PASSWORD — she doesn't carry tech PINs. Additive: the tech's own
  // PIN still works unchanged; this only runs as a fallback when the PIN check
  // fails. Read-only view either way.
  async function verifyOfficePassword(pw) {
    try {
      const res = await fetch(`${XANO_BASE}/verify_office_password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      if (!res.status || res.status >= 500) return 'unreachable';
      const data = await res.json();
      return (data && data.success === true) ? true : false;
    } catch (err) {
      return 'unreachable';
    }
  }

  // Unlock if EITHER the tech's PIN OR the office password matches.
  // Tri-state: true = matched, false = both cleanly rejected,
  // 'unreachable' = at least one check couldn't reach the server.
  async function verifyAccess(secret) {
    const a = await verifyPin(secret);
    if (a === true) return true;
    const b = await verifyOfficePassword(secret);
    if (b === true) return true;
    if (a === 'unreachable' || b === 'unreachable') return 'unreachable';
    return false;
  }

  async function tryUnlock() {
    // OFFICE BYPASS (HCP-style, Teddy 2026-06-29): a device already logged into
    // the office (shared 'tn_office_auth' key, set on the calendar/office pages) —
    // or one opened with ?office=1 — sees ANY tech's schedule with NO tech PIN.
    // The office is trusted and logs in once; per-tech PINs are only for the techs
    // on their own phones. So "pull up John's schedule" needs zero PIN.
    const officeFlag = new URLSearchParams(location.search).get('office') === '1';
    if (officeFlag || localStorage.getItem('tn_office_auth') === '1') {
      if (officeFlag) { try { localStorage.setItem('tn_office_auth', '1'); } catch (_) {} }
      unlock();
      return;
    }
    const cached = localStorage.getItem(PIN_STORAGE_KEY);
    if (cached) {
      const ok = await verifyAccess(cached);
      if (ok === true) { unlock(); return; }
      // Server unreachable but this device already authenticated today —
      // trust the cached pin (degraded) instead of wiping it + locking out.
      if (ok === 'unreachable') { unlock(true); return; }
      // Only a CLEAN rejection wipes the stored pin.
      localStorage.removeItem(PIN_STORAGE_KEY);
    }
    loading.style.display = 'none';
    pinOverlay.classList.add('show');
    pinInput.focus();
  }

  pinSubmit.addEventListener('click', submitPin);
  pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPin(); });

  async function submitPin() {
    const pin = pinInput.value.trim();
    if (!pin) return;
    pinSubmit.disabled = true;
    pinErr.textContent = '';
    const ok = await verifyAccess(pin);
    pinSubmit.disabled = false;
    if (ok === 'unreachable') {
      // Don't blame the tech and don't wipe their input — it's our server.
      pinErr.textContent = 'Our server is having a moment — wait a few seconds and tap unlock again.';
      return;
    }
    if (ok !== true) {
      pinErr.textContent = 'wrong pin or office password. try again.';
      pinInput.value = '';
      pinInput.focus();
      return;
    }
    localStorage.setItem(PIN_STORAGE_KEY, pin);
    unlock();
  }

  function unlock(degraded) {
    pinOverlay.classList.remove('show');
    app.style.display = 'block';
    loading.style.display = 'block';
    if (degraded) {
      // Got in on a cached pin while the server is unreachable. Jobs may be
      // slow/empty until it's back — say so plainly instead of a blank screen.
      let b = document.getElementById('degraded-banner');
      if (!b) {
        b = document.createElement('div');
        b.id = 'degraded-banner';
        b.className = 'err-banner';
        b.style.cssText = 'background:#3a2a10;border:1px solid #7a5a1a;color:#ffce85;margin:8px 12px;padding:9px 12px;border-radius:9px;font-size:13px;';
        b.textContent = '⚠️ Reconnecting to the server — your jobs will load as soon as it’s back. Pull to refresh in a minute.';
        app.insertBefore(b, app.firstChild);
      }
    }
    // Wire sub-nav links to the same tech_id this dashboard is loading
    // Wire ALL #navScheduler elements (there are two — featured top pill + small nav pill)
    document.querySelectorAll('#navScheduler').forEach(el => {
      el.href = `tech-scheduler.html?tech_id=${encodeURIComponent(TECH_ID)}`;
    });
    const np = document.getElementById('navPerf');
    const npay = document.getElementById('navPayouts');
    const ndo = document.getElementById('navDayOff');
    if (np) np.href = `tech-performance.html?tech_id=${encodeURIComponent(TECH_ID)}`;
    if (npay) npay.href = `tech-payouts.html?tech_id=${encodeURIComponent(TECH_ID)}`;
    if (ndo) ndo.href = `tech-day-off.html?tech_id=${encodeURIComponent(TECH_ID)}`;
    const nret = document.getElementById('navReturns');
    if (nret) {
      nret.href = `tech-returns.html?tech_id=${encodeURIComponent(TECH_ID)}`;
      // live count badge — red if any overdue
      fetch(`/.netlify/functions/parts-returns?tech_id=${encodeURIComponent(TECH_ID)}`).then(r => r.json()).then(d => {
        if (!d || !d.ok) return; const b = document.getElementById('navReturnsBadge');
        if (b && d.count) { b.textContent = `(${d.count})`; if (d.overdue) { nret.style.borderColor = '#f85149'; nret.style.color = '#ff7b72'; b.textContent = `(${d.count}⚠)`; } }
      }).catch(() => {});
    }
    loadDashboard();
    loadInbox();
    setInterval(loadInbox, 45000);
    loadPickup();
    loadVisitOverrides();
    wireFieldSearch();
  }

  // ── Parts to grab (rolling 5-day pickup list) ──────────────────────
  // Storage parts (vendor-shipped to us, tied to upcoming jobs) + distributor
  // will-call (Marcone/Tribles). Tech taps "✓ Grabbed" per part so the office
  // sees what left and he's got a packing list before he heads out.
  var PICKUP = null;
  function pkEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  async function loadPickup() {
    var host = document.getElementById('pickupHost');
    if (!host) return;
    try {
      var r = await fetch(`/.netlify/functions/parts-pickup?tech_id=${encodeURIComponent(TECH_ID)}&days=5`);
      var d = await r.json();
      if (!d || !d.ok) { host.style.display = 'none'; return; }
      PICKUP = d;
      renderPickup();
    } catch (e) { host.style.display = 'none'; }
  }
  function pickupItem(it) {
    var done = it.picked_up;
    var arrival = it.source === 'willcall'
      ? '<span style="background:rgba(180,140,255,0.14);border:1px solid rgba(180,140,255,0.4);color:#c9a9ff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800">' + pkEsc((it.supplier||'').toUpperCase()) + (it.branch?(' · '+pkEsc(it.branch)):'') + '</span>'
      : (it.arrival === 'incoming'
          ? '<span style="background:rgba(240,180,80,0.12);border:1px solid rgba(240,180,80,0.35);color:#f0b450;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800">🚚 ' + (it.eta_text?('arrives '+pkEsc(it.eta_text)):'incoming') + '</span>'
          : '<span style="background:rgba(0,214,143,0.12);border:1px solid rgba(0,214,143,0.35);color:#00d68f;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800">✅ in storage</span>');
    var sub = [it.appliance, it.customer, it.city].filter(Boolean).map(pkEsc).join(' · ');
    var btn = it.arrival === 'incoming' && it.source !== 'willcall'
      ? '<span style="flex:0 0 auto;color:#7c8aa5;font-size:12px">not in yet</span>'
      : '<button class="pk-grab" data-key="' + pkEsc(it.key) + '" data-job="' + (it.job_id||'') + '" data-part="' + pkEsc(it.part) + '" data-src="' + pkEsc(it.source) + '" data-done="' + (done?'1':'0') + '" style="flex:0 0 auto;padding:8px 12px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;border:1px solid ' + (done?'rgba(0,214,143,0.5);background:rgba(0,214,143,0.16);color:#00d68f':'rgba(74,245,255,0.4);background:rgba(74,245,255,0.12);color:#4af5ff') + '">' + (done?'✓ Grabbed':'Grab it') + '</button>';
    return '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #26314a;border-radius:11px;margin-bottom:7px;background:' + (done?'#0d1a14':'#0e1320') + (done?';opacity:.75':'') + '">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-family:var(--mono);font-weight:800;color:#e8eefc;font-size:15px">' + (pkEsc(it.part) || '<span style=\'color:#7c8aa5\'>(no part #)</span>') + '</span>' + arrival + '</div>'
      + (sub ? '<div style="color:#9fb0cc;font-size:12.5px;margin-top:3px">' + sub + '</div>' : '')
      + (it.note ? '<div style="color:#7c8aa5;font-size:12px;margin-top:2px">' + pkEsc(it.note) + '</div>' : '')
      + '</div>' + btn + '</div>';
  }
  function renderPickup() {
    var host = document.getElementById('pickupHost');
    var d = PICKUP; if (!d) { host.style.display = 'none'; return; }
    var groups = d.storage_by_day || [];
    var wc = d.willcall || [];
    var c = d.counts || {};
    if (!groups.length && !wc.length) { host.style.display = 'none'; return; } // nothing to grab — stay quiet
    var readyN = (c.storage_here || 0) + (c.willcall_total || 0);
    var head = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">'
      + '<span style="font-size:18px">🧰</span>'
      + '<span style="font-weight:800;color:#e8eefc;font-size:15px">Parts to grab</span>'
      + '<span style="color:#7c8aa5;font-size:12px">next 5 days</span>'
      + (readyN ? '<span style="margin-left:auto;background:rgba(0,214,143,0.14);border:1px solid rgba(0,214,143,0.4);color:#00d68f;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800">' + readyN + ' ready</span>' : '')
      + '</div>';
    var body = '';
    groups.forEach(function (g) {
      body += '<div style="color:#8fa0b8;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:8px 2px 6px">' + pkEsc(g.day_label) + '</div>';
      body += g.items.map(pickupItem).join('');
    });
    if (wc.length) {
      body += '<div style="color:#8fa0b8;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:10px 2px 6px">🔧 Will-call — grab on your next distributor run</div>';
      body += wc.map(pickupItem).join('');
    }
    host.innerHTML = '<div style="background:#111826;border:1px solid #26314a;border-radius:14px;padding:13px 13px 9px">' + head + body + '</div>';
    host.style.display = 'block';
    Array.prototype.forEach.call(host.querySelectorAll('.pk-grab'), function (b) {
      b.addEventListener('click', function () { grabPart(b); });
    });
  }
  async function grabPart(btn) {
    var done = btn.dataset.done === '1';
    btn.disabled = true; var prev = btn.textContent; btn.textContent = '…';
    try {
      await fetch('/.netlify/functions/parts-pickup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tech_id: parseInt(TECH_ID, 10), key: btn.dataset.key, job_id: btn.dataset.job ? parseInt(btn.dataset.job, 10) : null, part: btn.dataset.part, source: btn.dataset.src, action: done ? 'undo' : 'pickup' }) });
      loadPickup(); // recompute
    } catch (e) { btn.disabled = false; btn.textContent = prev; }
  }

  // ── Field search ───────────────────────────────────────────────
  // Look up ANY customer/job from the road. Forgiving (name/phone/address,
  // partial + any case). Taps through to the mobile job view.
  function wireFieldSearch() {
    const inp = document.getElementById('fldSearch');
    const btn = document.getElementById('fldSearchBtn');
    const out = document.getElementById('fldSearchResults');
    if (!inp || !btn || !out) return;
    let lastQ = '';
    async function run() {
      const q = (inp.value || '').trim();
      if (q.length < 2) { out.innerHTML = ''; return; }
      lastQ = q;
      out.innerHTML = '<div style="padding:10px;color:#7c8aa5;font-size:13px">searching…</div>';
      try {
        const r = await fetch('/.netlify/functions/search-customers?q=' + encodeURIComponent(q));
        const d = await r.json().catch(() => ({}));
        if (q !== lastQ) return; // a newer search superseded this one
        const rows = (d && d.results) || [];
        if (!rows.length) {
          out.innerHTML = '<div style="padding:10px;color:#7c8aa5;font-size:13px">no matches for “' + q.replace(/</g,'&lt;') + '”</div>';
          return;
        }
        out.innerHTML = rows.slice(0, 12).map(function (row) {
          const c = row.customer || {};
          const j = row.latest_job || {};
          const name = ((c.first_name || '') + ' ' + (c.last_name || '')).trim() || 'Unknown';
          const phone = c.phone ? String(c.phone).replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3') : '';
          const loc = [c.city, c.state, c.zip].filter(Boolean).join(', ');
          const appl = [j.brand, j.appliance_type].filter(Boolean).join(' ') || (j.problem_summary || '');
          const cash = (j.customer_type === 'self_pay');
          const tag = cash
            ? '<span style="background:rgba(255,179,84,0.16);border:1px solid rgba(255,179,84,0.4);color:#ffb454;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800">CASH</span>'
            : (j.warranty_company ? '<span style="background:rgba(90,169,255,0.14);border:1px solid rgba(90,169,255,0.4);color:#5aa9ff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800">' + String(j.warranty_company).toUpperCase() + '</span>' : '');
          const status = j.friendly_status || j.current_status || '';
          const jid = j.id;
          const href = jid ? ('tech-job.html?job_id=' + jid + '&tech_id=' + encodeURIComponent(TECH_ID) + '&v=' + Date.now()) : '#';
          return '<a href="' + href + '" style="display:block;text-decoration:none;background:#0e1320;border:1px solid #2a3344;border-radius:10px;padding:11px 13px;margin-bottom:7px">'
            + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
            + '<span style="color:#e8eefc;font-weight:800;font-size:15px">' + name.replace(/</g,'&lt;') + '</span>' + tag
            + (jid ? '<span style="color:#5c6a85;font-size:12px;margin-left:auto">#' + jid + '</span>' : '')
            + '</div>'
            + (appl ? '<div style="color:#aab6cf;font-size:13px;margin-top:3px">' + String(appl).replace(/</g,'&lt;') + '</div>' : '')
            + '<div style="color:#7c8aa5;font-size:12px;margin-top:3px">' + [phone, loc, status].filter(Boolean).join(' · ').replace(/</g,'&lt;') + '</div>'
            + '</a>';
        }).join('');
      } catch (e) {
        out.innerHTML = '<div style="padding:10px;color:#ff8c8c;font-size:13px">search failed — check signal and try again</div>';
      }
    }
    let t;
    inp.addEventListener('input', function () { clearTimeout(t); t = setTimeout(run, 320); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(t); run(); } });
    btn.addEventListener('click', function () { clearTimeout(t); run(); });
  }

  // ── Tech Inbox (Tech Inbox Block B) ────────────────────────────
  async function loadInbox() {
    const pin = localStorage.getItem(PIN_STORAGE_KEY);
    if (!pin) return;
    try {
      const url = `${XANO_BASE}/get_tech_inbox?tech_id=${encodeURIComponent(TECH_ID)}&pin=${encodeURIComponent(pin)}&limit=20`;

  // Mark an inbox message read on the server (keeps the "N new" badge accurate +
  // lets the office see ✓ Read). Used by tap, per-message delete, and Clear all.
  function markInboxRead(msgId, pin) {
    const id = parseInt(msgId, 10);
    if (!id) return;
    try {
      fetch(`${XANO_BASE}/mark_tech_inbox_message_read`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tech_id: parseInt(TECH_ID, 10), pin: pin || localStorage.getItem(PIN_STORAGE_KEY), message_id: id }) }).catch(() => {});
      fetch('/.netlify/functions/tech-message', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'read_receipt', tech_id: parseInt(TECH_ID, 10), message_id: id }) }).catch(() => {});
    } catch (_) {}
  }

  function renderInbox(d) {
    const host = document.getElementById('inboxHost');
    if (!host) return;
    const msgs = d.messages || [];
    // Housekeeping: hide messages the tech cleared, + auto-tidy read ones >3 days old.
    const DISMISS_KEY = `tn_inbox_dismissed_${TECH_ID}`;
    let dismissed; try { dismissed = new Set(JSON.parse(localStorage.getItem(DISMISS_KEY) || '[]')); } catch (_) { dismissed = new Set(); }
    const THREE_DAYS = 3 * 24 * 3600 * 1000;
    const visible = msgs.filter(m => {
      if (dismissed.has(String(m.id))) return false;
      if (m.read_at && m.created_at && (Date.now() - new Date(m.created_at).getTime()) > THREE_DAYS) return false;
      return true;
    });
    const anyRead = visible.some(m => m.read_at);
    // Always visible (never hide) — the whole point is techs stop ignoring it.
    host.style.display = 'block';
    const unreadCount = d.unread_count || 0;
    const unreadBadge = unreadCount > 0
      ? `<span style="background:#ff6b35;color:#000;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;margin-left:6px">${unreadCount} new</span>`
      : '';
    host.innerHTML = `
      <div style="background:linear-gradient(180deg,rgba(255,107,53,0.08),rgba(255,107,53,0.02));border:1px solid rgba(255,107,53,0.25);border-radius:12px;padding:12px 14px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:#ff8c61">
          <span style="font-size:14px">💬</span>
          <span style="font-weight:700">MESSAGES</span>
          ${unreadBadge}
          ${visible.length ? `<div style="margin-left:auto;display:flex;gap:6px">
            ${anyRead ? '<button id="clearReadBtn" style="background:none;border:1px solid rgba(255,255,255,0.15);color:var(--muted);border-radius:7px;padding:3px 9px;font-size:10px;cursor:pointer">Clear read</button>' : ''}
            <button id="clearAllBtn" style="background:none;border:1px solid rgba(255,255,255,0.15);color:var(--muted);border-radius:7px;padding:3px 9px;font-size:10px;cursor:pointer">Clear all</button>
          </div>` : ''}
        </div>
        <div id="inboxList"></div>
        <button id="notifBtn" style="display:none;width:100%;margin-top:10px;background:rgba(255,107,53,0.14);color:#ff8c61;border:1px solid rgba(255,107,53,0.4);border-radius:8px;padding:11px;font-weight:800;font-size:14px;cursor:pointer">🔔 Turn on notifications</button>
        <div style="display:flex;gap:8px;margin-top:10px">
          <input id="replyBox" placeholder="Message the office…" autocomplete="off"
            style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px">
          <button id="replySend" style="background:#ff6b35;color:#000;border:0;border-radius:8px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer">Send</button>
        </div>
      </div>
    `;
    const list = document.getElementById('inboxList');
    if (!visible.length) {
      list.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:6px 2px">No messages yet — anything the office or Ant sends you shows up here. You can message the office below.</div>`;
    } else
    list.innerHTML = visible.map(m => {
      const isUnread = !m.read_at;
      const senderRole = m.sender_role || 'office';
      const senderIcon = senderRole === 'system' ? '🐜' : senderRole === 'customer' ? '👤' : '🏢';
      const senderName = m.sender_name || 'Office';
      const body = (m.body || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
      const time = m.created_at ? new Date(m.created_at).toLocaleString('en-US', { month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' }) : '';
      // Light message bubbles with DARK letters so they read on every screen
      // (John couldn't read the old light-on-dark text, Teddy 2026-06-23).
      const bg = isUnread ? '#fff1e8' : '#eef1f7';
      const border = isUnread ? '#ffc4a3' : '#d4dae6';
      return `
        <div data-msg-id="${m.id}" data-read="${isUnread ? 'false' : 'true'}"
             style="background:${bg};border:1px solid ${border};border-radius:8px;padding:10px 12px;margin-top:6px;cursor:pointer;transition:0.15s">
          <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#5b6577;margin-bottom:4px">
            <span>${senderIcon}</span>
            <span style="font-weight:700;color:#1f2736">${senderName}</span>
            ${isUnread ? '<span style="color:#d9531e;font-weight:800;font-size:10px">●UNREAD</span>' : ''}
            <span style="margin-left:auto;font-family:var(--mono)">${time}</span>
            <button class="inbox-del" data-del-id="${m.id}" data-del-unread="${isUnread ? '1' : '0'}" title="Delete" style="background:none;border:0;color:#9aa3b2;font-size:20px;line-height:1;padding:0 4px;margin-left:6px;cursor:pointer;font-weight:700">&times;</button>
          </div>
          <div style="font-size:14px;color:#161c28;line-height:1.45;font-weight:500">${body}</div>
        </div>
      `;
    }).join('');
    list.querySelectorAll('[data-msg-id]').forEach(card => {
      card.addEventListener('click', async () => {
        if (card.dataset.read === 'true') return;
        const msgId = parseInt(card.dataset.msgId, 10);
        const pin = localStorage.getItem(PIN_STORAGE_KEY);
        try {
          await fetch(`${XANO_BASE}/mark_tech_inbox_message_read`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tech_id: parseInt(TECH_ID, 10), pin, message_id: msgId })
          });
          // Read receipt → the office sees ✓ Read.
          fetch('/.netlify/functions/tech-message', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'read_receipt', tech_id: parseInt(TECH_ID, 10), message_id: msgId }) }).catch(() => {});
          card.dataset.read = 'true';
          card.style.background = 'rgba(255,255,255,0.03)';
          card.style.borderColor = 'rgba(255,255,255,0.08)';
          const unreadLabel = card.querySelector('[style*="UNREAD"]');
          if (unreadLabel) unreadLabel.remove();
          // refresh full inbox to recompute unread badge
          setTimeout(loadInbox, 200);
        } catch (e) { /* ignore */ }
      });
    });
    // Reply composer → message the office (in-app, no SMS).
    const rbox = document.getElementById('replyBox');
    const rsend = document.getElementById('replySend');
    async function sendReply() {
      const body = (rbox.value || '').trim();
      if (!body) return;
      rsend.disabled = true; rsend.textContent = '…';
      try {
        const r = await fetch('/.netlify/functions/tech-message', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'tech_reply', technician_id: parseInt(TECH_ID, 10), body })
        });
        const dd = await r.json().catch(() => ({}));
        rbox.value = '';
        // optimistic: show it immediately so the tech sees it landed
        const li = document.getElementById('inboxList');
        if (li) {
          const sent = document.createElement('div');
          sent.style.cssText = 'background:rgba(31,174,100,0.12);border:1px solid rgba(31,174,100,0.30);border-radius:8px;padding:10px 12px;margin-top:6px';
          sent.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px"><span>🧑‍🔧</span><span style="font-weight:600;color:var(--text)">You → Office</span><span style="margin-left:auto;font-family:var(--mono)">just now</span></div><div style="font-size:14px;color:var(--text);line-height:1.4">${body.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div>`;
          if (li.querySelector('[style*="No messages"]')) li.innerHTML = '';
          li.appendChild(sent);
        }
      } catch (e) { /* offline ok */ }
      rsend.disabled = false; rsend.textContent = 'Send';
    }
    if (rsend) rsend.addEventListener('click', sendReply);
    if (rbox) rbox.addEventListener('keypress', e => { if (e.key === 'Enter') sendReply(); });
    // Clear read: dismiss all currently-read messages from this device.
    const clr = document.getElementById('clearReadBtn');
    if (clr) clr.onclick = () => {
      try {
        const set = new Set(JSON.parse(localStorage.getItem(DISMISS_KEY) || '[]'));
        visible.forEach(m => { if (m.read_at) set.add(String(m.id)); });
        localStorage.setItem(DISMISS_KEY, JSON.stringify([...set]));
      } catch (_) {}
      loadInbox();
    };
    // Clear all: wipe every visible message from this device (the whole pile).
    const clrAll = document.getElementById('clearAllBtn');
    if (clrAll) clrAll.onclick = () => {
      const pin = localStorage.getItem(PIN_STORAGE_KEY);
      try {
        const set = new Set(JSON.parse(localStorage.getItem(DISMISS_KEY) || '[]'));
        visible.forEach(m => { set.add(String(m.id)); if (!m.read_at) markInboxRead(m.id, pin); });
        localStorage.setItem(DISMISS_KEY, JSON.stringify([...set]));
      } catch (_) {}
      loadInbox();
    };
    // Per-message delete (✕): hide one message (read or unread) on this device.
    list.querySelectorAll('.inbox-del').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.delId;
        if (btn.dataset.delUnread === '1') markInboxRead(id, localStorage.getItem(PIN_STORAGE_KEY));
        try {
          const set = new Set(JSON.parse(localStorage.getItem(DISMISS_KEY) || '[]'));
          set.add(String(id));
          localStorage.setItem(DISMISS_KEY, JSON.stringify([...set]));
        } catch (_) {}
        const card = btn.closest('[data-msg-id]');
        if (card) card.remove();
        if (!list.querySelector('[data-msg-id]')) loadInbox();
      });
    });
    // Notifications: show the button unless already on.
    const nbtn = document.getElementById('notifBtn');
    if (nbtn && window.AntPush) {
      AntPush.status().then(st => {
        if (st === 'on' || st === 'unsupported') { nbtn.style.display = 'none'; return; }
        nbtn.style.display = 'block';
        if (st === 'blocked') { nbtn.textContent = '🔔 Notifications are blocked — tap to fix'; }
        nbtn.onclick = async () => {
          nbtn.disabled = true; nbtn.textContent = '…';
          const ok = await AntPush.enable('tech', parseInt(TECH_ID, 10));
          if (ok) { nbtn.textContent = '✅ Notifications on'; setTimeout(() => { nbtn.style.display = 'none'; }, 1500); }
          else { nbtn.disabled = false; nbtn.textContent = '🔔 Turn on notifications'; }
        };
      });
    }
  }

  // ── Data load ──────────────────────────────────────────────────
  async function loadDashboard() {
    loading.style.display = 'block';
    summary.innerHTML = '';
    jobsHost.innerHTML = '';
    mapHost.innerHTML = '';
    if (mapInstance) { mapInstance.remove(); mapInstance = null; }
    mapMarkers = [];

    let url = `${XANO_BASE}/get_tech_daily_dashboard?tech_id=${encodeURIComponent(TECH_ID)}`;
    if (currentDateStr) url += `&date=${encodeURIComponent(currentDateStr)}`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (!data || data.success !== true) {
        showError(data && data.error ? data.error : 'failed to load');
        return;
      }
      dashboardData = data;
      serverTodayCT = data.today_ct;
      currentDateStr = data.date_ct;
      // TWO-MAN jobs: pull any job where this tech is the SECOND man and merge
      // it in so it shows on his dashboard too. Best-effort — wrapped so a crew
      // hiccup can NEVER break the normal schedule.
      try {
        const cr = await fetch(`/.netlify/functions/crew?action=list&tech_id=${encodeURIComponent(TECH_ID)}&date=${encodeURIComponent(data.date_ct || '')}`);
        const cj = await cr.json();
        if (cj && cj.ok && Array.isArray(cj.jobs) && cj.jobs.length && Array.isArray(data.jobs)) {
          const have = new Set(data.jobs.map((it) => it && it.job && it.job.id));
          cj.jobs.forEach((it) => { if (it && it.job && !have.has(it.job.id)) data.jobs.push(it); });
          data.jobs.sort((a, b) => (Number((a.job || {}).scheduled_start) || Infinity) - (Number((b.job || {}).scheduled_start) || Infinity));
        }
      } catch (_) { /* crew overlay is optional; ignore */ }
      render(data);
    } catch (err) {
      console.error(err);
      showError('network error');
    } finally {
      loading.style.display = 'none';
    }
  }

  function showError(msg) {
    jobsHost.innerHTML = `<div class="err-banner">${escapeHtml(msg)}<br><button class="retry" onclick="location.reload()">retry</button></div>`;
  }

  // ── Render ─────────────────────────────────────────────────────
  // Visit-type overrides (tech/office marked completion vs diagnosis). Loaded
  // once; re-renders the day when it lands so the badges reflect human calls.
  window.VISIT_OVERRIDES = window.VISIT_OVERRIDES || {};
  var LAST_RENDER = null;
  async function loadVisitOverrides() {
    try {
      var r = await fetch('/.netlify/functions/get-visit-types');
      var d = await r.json();
      if (d && d.ok) {
        var ov = d.overrides || {};
        // Only re-render if there are ACTUAL overrides that changed. Re-rendering
        // the whole list on every load rebuilt the cards while the tech was
        // tapping — eating taps ("took several times to open this job"). Most
        // days have no overrides, so skip the rebuild entirely.
        var changed = JSON.stringify(ov) !== JSON.stringify(window.VISIT_OVERRIDES || {});
        window.VISIT_OVERRIDES = ov;
        if (changed && Object.keys(ov).length && LAST_RENDER && typeof renderJobs === 'function') renderJobs(LAST_RENDER.jobs || []);
      }
    } catch (e) {}
  }
  async function toggleVisit(jobId, type) {
    window.VISIT_OVERRIDES[jobId] = type;           // optimistic
    if (LAST_RENDER) renderJobs(LAST_RENDER.jobs || []);
    try {
      await fetch('/.netlify/functions/set-visit-type', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: Number(jobId), type: type, by: 'tech-' + TECH_ID }) });
    } catch (e) {}
  }

  function render(data) {
    LAST_RENDER = data;
    // Strip practice placements so techs see ONLY their real scheduled work
    // (the morning links should show the real day, not test/practice jobs).
    if (data && Array.isArray(data.jobs)) {
      data.jobs = data.jobs.filter((it) => {
        const j = (it && it.job) ? it.job : (it || {});
        return !String(j.test_run_id || '').startsWith('PRACTICE');
      });
    }
    techBadge.textContent = `${data.tech.first_name || ''} #${data.tech.id}`;
    renderDateHeader(data.date_ct, data.today_ct);
    renderDateNav(data.date_ct, data.today_ct);
    renderSummary(data);
    renderTdrNudge();
    renderAntGame();
    renderJobs(data.jobs || []);
    renderMap(data.jobs || []);
    hydrateOfficeNotes(data.jobs || []);
  }

  // 📋 Reports = your pay — front and center on the dashboard every day (Teddy 7/4).
  // A stop isn't done until its TDR is filed: the report IS the warranty claim, so
  // until it's in we can't bill, and the tech can't get paid. Fetched once + cached
  // (it's the tech's standing status, not per-viewed-date).
  var TDR_NUDGE = null;
  async function renderTdrNudge() {
    var host = document.getElementById('tdrNudge'); if (!host || !TECH_ID) return;
    if (TDR_NUDGE === null) {
      try { TDR_NUDGE = await fetch('/.netlify/functions/tdr-compliance?tech_id=' + encodeURIComponent(TECH_ID), { cache: 'no-store' }).then(function (r) { return r.json(); }); }
      catch (_) { TDR_NUDGE = { ok: false }; }
    }
    var d = TDR_NUDGE; if (!d || !d.ok) { host.innerHTML = ''; return; }
    var holding = d.holding || { count: 0, amount: 0 };
    var todayUnfiled = d.today_unfiled || [];
    var count = holding.count || 0;
    if (!count && !todayUnfiled.length) {
      var t = d.today || { stops: 0, filed: 0 };

    // First unfiled job → one-tap straight into its TDR; full list on the Pay page.

      + '<a href="tech-payouts.html?tech_id=' + TECH_ID + '" style="flex:1;text-align:center;background:rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:10px;font-size:14px;font-weight:800;text-decoration:none">See all</a>'

  // 🐜 Tech vs Ant — the tech's standing in the "beat the machine" game.

    var line2 = (g.beats ? ('🏆 beat Ant ' + g.beats + '× · ') : '') + (g.ant_accuracy_pct != null ? ("Ant's at " + g.ant_accuracy_pct + '% this week — beat it') : 'confirm or beat Ant on each job');

  // Office notes across the tech's day, fetched once, shown TWO ways (Teddy 7/3):
  //  (1) a one-liner amber bar ON each job card, so scrolling his 6 jobs gives a
  //      bird's-eye read ("1 vent hose · 2 washer fill hoses · special event"),
  //  (2) a "Notes from the office" digest up top with tap-through per job.
  async function hydrateOfficeNotes(jobs) {
    const list = (jobs || []).filter((it) => it && it.job && it.job.id);
    const host = $('officeNotesDigest');
    if (!list.length) { if (host) host.innerHTML = ''; return; }
    const ids = list.map((it) => it.job.id);
    let byJob = {};
    try { const d = await fetch('/.netlify/functions/office-notes?job_ids=' + ids.join(','), { cache: 'no-store' }).then((r) => r.json()); byJob = (d && d.by_job) || {}; } catch (_) { return; }

    // (1) one-liner ON each card
    list.forEach(function (it, i) {
      const notes = byJob[it.job.id];
      if (!Array.isArray(notes) || !notes.length) return;
      const card = $('card-' + i); if (!card) return;
      if (card.querySelector('.office-note-line')) return; // don't double-inject on re-render
      const line = notes.map(function (n) { return String(n.text || '').replace(/\s+/g, ' ').trim(); }).filter(Boolean).join(' · ');
      const el = document.createElement('div');
      el.className = 'office-note-line';
      el.style.cssText = 'background:#fff3d0;border:1px solid #f0c674;border-radius:9px;padding:8px 11px;margin:9px 0 2px;font-size:13.5px;color:#7a5410;font-weight:700;line-height:1.4;white-space:pre-wrap';
      el.innerHTML = '📋 Office: ' + escapeHtml(line);
      card.appendChild(el);
    });

    // (2) the digest up top
    if (host) {
      const withNotes = list.filter((it) => Array.isArray(byJob[it.job.id]) && byJob[it.job.id].length);
      if (!withNotes.length) { host.innerHTML = ''; return; }
      const total = withNotes.reduce((s, it) => s + byJob[it.job.id].length, 0);
      host.innerHTML = '<div style="background:#fff8e8;border:1px solid #f0c674;border-radius:12px;padding:12px 14px;margin:0 0 14px">'
        + '<div style="font-weight:800;color:#8a6410;font-size:14px;margin-bottom:8px">📋 Notes from the office (' + total + ')</div>'
        + withNotes.map(function (it) {
            const nm = it.customer || ('Job #' + it.job.id);
            const notes = byJob[it.job.id];
            return '<div style="padding:8px 0;border-top:1px solid rgba(0,0,0,0.06)">'
              + '<a href="tech-job.html?job_id=' + it.job.id + '&tech_id=' + encodeURIComponent(TECH_ID) + '" style="text-decoration:none;color:#8a6410;font-weight:700;font-size:13px">' + pkEsc(nm) + ' ›</a>'
              + notes.map(function (n) { return '<div style="font-size:13.5px;color:#5a4410;line-height:1.45;margin-top:3px;white-space:pre-wrap">• ' + pkEsc(n.text) + '</div>'; }).join('')
              + '</div>';
          }).join('')
        + '</div>';
    }
  }

  function renderDateHeader(dateCT, todayCT) {
    const d = parseLocalDate(dateCT);
    const dayName = d.toLocaleDateString('en-US', { weekday: 'long' });
    const monthDay = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    let label;
    if (dateCT === todayCT) {
      label = `Today, ${dayName.slice(0,3)} ${monthDay}`;
    } else if (isYesterday(dateCT, todayCT)) {
      label = `Yesterday, ${monthDay}`;
    } else if (isTomorrow(dateCT, todayCT)) {
      label = `Tomorrow, ${monthDay}`;
    } else {
      label = `${dayName}, ${monthDay}`;
    }
    dateLabel.textContent = label;
    dateSub.textContent = dateCT;
  }

  function renderDateNav(dateCT, todayCT) {
    const isToday = dateCT === todayCT;
    todayBtn.classList.toggle('active', isToday);
    todayBtn.textContent = isToday ? 'today' : 'jump to today';
  }

  function renderSummary(data) {
    const jobs = data.jobs || [];
    if (jobs.length === 0) {
      summary.innerHTML = `<span class="count">0 jobs</span>`;
      return;
    }
    const first = jobs[0];
    const firstStart = first.job.scheduled_start;
    const firstTime = firstStart ? fmtTimeShort(firstStart) : '—';
    let totalAtt = 0;
    for (const it of jobs) totalAtt += (it.attachments_count || 0);
    const parts = [
      `<span class="count">${jobs.length} ${jobs.length === 1 ? 'job' : 'jobs'}</span>`,
      `<span class="sep">·</span>`,
      `first at <span class="count">${firstTime}</span>`,
    ];
    if (totalAtt > 0) {
      parts.push(`<span class="sep">·</span>`);
      parts.push(`${totalAtt} <span class="count">media</span>`);
    }
    summary.innerHTML = parts.join(' ');
  }

  // HCP-style day segments. Order = the order sections appear (done last).
  const SEGMENTS = [
    { key: 'todo',       label: '🆕 To Do' },
    { key: 'inprogress', label: '🔧 In Progress' },
    { key: 'parts',      label: '📦 Awaiting Parts' },
    { key: 'notime',     label: '⏱ No Time Set' },
    { key: 'done',       label: '✅ Completed' },
  ];
  function segmentOf(it) {
    const j = it.job || {};
    const s = String(j.scheduling_status || j.current_status || '').toLowerCase();
    if (s === 'completed' || s === 'no_fix_possible') return 'done';
    if (s === 'in_progress') return 'inprogress';
    if (['awaiting_parts', 'parts_needed', 'ordered', 'on_order'].includes(s)) return 'parts';
    if (it.untimed) return 'notime';
    return 'todo';
  }

  function renderJobs(jobs) {
    if (jobs.length === 0) {
      const isToday = currentDateStr === serverTodayCT;
      const msg = isToday
        ? 'No jobs scheduled today.'
        : (parseLocalDate(currentDateStr) < parseLocalDate(serverTodayCT)
           ? 'No jobs were scheduled this day.'
           : 'Nothing scheduled yet for this day.');
      const sub = isToday ? 'enjoy the day.' : '';
      jobsHost.innerHTML = `<div class="empty"><div class="icon">🌿</div><div class="msg">${msg}</div><div class="sub">${sub}</div></div>`;
      return;
    }
    jobsHost.className = 'jobs';
    // HCP-style SEGMENTS: group the day into sections (new vs in-progress vs
    // done) so a tech sees at a glance what's left and what's finished. We keep
    // each card's ORIGINAL index so the click/crew/thumbnail wiring below is
    // untouched — only the visual grouping changes.
    const groups = {};
    jobs.forEach((it, i) => {
      const seg = segmentOf(it);
      (groups[seg] = groups[seg] || []).push({ it, i });
    });
    let html = '<div class="ant-built-note">🐜 Ant builds your day around your profile + each customer\'s availability. Something not work? Tap 🚩 on any stop and I\'ll fix it — no problem.</div>';
    for (const seg of SEGMENTS) {
      const arr = groups[seg.key];
      if (!arr || !arr.length) continue;
      html += `<div class="seg-header">${seg.label} <span class="seg-count">${arr.length}</span></div>`;
      html += arr.map(({ it, i }) => renderCard(it, i)).join('');
    }
    jobsHost.innerHTML = html;
    // Hook up click handlers
    jobs.forEach((it, i) => {
      const card = $(`card-${i}`);
      if (!card) return;
      card.addEventListener('click', (e) => {
        // Don't navigate if click was on a tel: or maps: link
        if (e.target.closest('.quick-btn')) return;
        const jobId = it.job.id;
        // Tap a stop → open the HCP-mirrored tech job page (notes, working
        // photos/video, parts finder, lifecycle, + Ask Ant). This is the
        // screen the guys work from per-job now (replaces tech-simple as the
        // primary; tech-simple/tech-ant-chat still reachable from inside).
        window.location.href = `tech-job.html?job_id=${jobId}&tech_id=${TECH_ID}&v=${Date.now()}`;
      });
    });
    // Fetch attachment view URLs in batch and inject thumbnails
    hydrateAttachmentThumbs(jobs);
    // 🎯 Part showdown per active job (you vs Ant vs Danielle)
    hydrateShowdowns(jobs);
  }

  // One-tap lifecycle from the day view — posts {job_id, technician_id} to the
  // gateless on-the-way / start endpoints, flips the button + row optimistically.
  // Self-contained (reads tech id from storage) so the inline onclick can reach it.
  window.tlc = async function (btn, jobId, action) {
    const tid = parseInt(localStorage.getItem('tn_tech_id') || '0', 10);
    if (!tid) { alert('Missing tech id — reopen from your Ant link.'); return; }
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch('https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA/' + action, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: jobId, technician_id: tid }),
      });
      const d = await r.json().catch(() => ({}));
      if (d && d.success) {
        if (action === 'tech_job_started') {
          const row = btn.closest('.lc-row');
          if (row) row.innerHTML = '<a href="tech-job.html?job_id=' + jobId + '&tech_id=' + tid + '" class="lc-btn lc-finish" onclick="event.stopPropagation()">✓ Finish &amp; report →</a>';
        } else {
          btn.textContent = '✓ On the way'; btn.classList.add('lc-ok');
        }
      } else { btn.textContent = '⚠ tap to retry'; btn.disabled = false; }
    } catch (_) { btn.textContent = '⚠ tap to retry'; btn.disabled = false; }
