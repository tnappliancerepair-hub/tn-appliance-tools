  // ── Finish + file the report right on the tile (Teddy 7/5). Opens an inline
  // report drawer in the card; saves the TDR (voice or type) and completes the
  // job without leaving the day. mode: 'repair_complete' (in-progress) | 'filed'
  // (already completed, just owe the report).
  window.tfin = function (btn, jobId, mode) {
    const host = document.getElementById('trh-' + jobId);
    if (!host) return;
    if (host.dataset.open === '1') { host.innerHTML = ''; host.dataset.open = ''; return; }
    const isFiled = mode === 'filed';
    const buttons = isFiled
      ? '<button class="done" onclick="event.stopPropagation();treport(this,' + jobId + ',\'\')">✓ Save my report</button>'
      : '<button class="done" onclick="event.stopPropagation();treport(this,' + jobId + ',\'repair_complete\')">✓ Fixed it — Done</button>'
        + '<button class="parts" onclick="event.stopPropagation();treport(this,' + jobId + ',\'parts_needed\')">🔩 Parts needed</button>';
    host.innerHTML =
      '<div class="tile-report">'
        + '<div class="pay">📋 Your report = your pay</div>'
        + '<textarea id="trta-' + jobId + '" placeholder="What was wrong, the part you used, what you did — talk or type. Tap the 🎤 on your keyboard to speak."></textarea>'
        + '<div class="rr">'
          + '<button class="mic" onclick="event.stopPropagation();trec(this,' + jobId + ')">🎤</button>'
          + buttons
        + '</div>'
        + '<div class="rmsg" id="trm-' + jobId + '"></div>'
        + (isFiled ? '' : '<div class="hint">Everything except the part number — that\'s all Ant needs to bill it and pay you.</div>')
      + '</div>';
    host.dataset.open = '1';
    const ta = document.getElementById('trta-' + jobId);
    if (ta) { try { ta.focus(); } catch (_) {} ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  };

  // In-app voice: record -> whisper -> drop the transcript into the textarea.
  const _trRec = {};
  window.trec = async function (btn, jobId) {
    const ta = document.getElementById('trta-' + jobId);
    const msg = document.getElementById('trm-' + jobId);
    const active = _trRec[jobId];
    if (active && active.state === 'recording') { try { active.stop(); } catch (_) {} return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (_) { if (msg) msg.textContent = 'Mic blocked — just type it, or use your keyboard 🎤.'; return; }
    let mime = '';
    try { const cs = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/mp4;codecs=mp4a.40.2','audio/aac','audio/mpeg']; for (const c of cs) { if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) { mime = c; break; } } } catch (_) {}
    let mr;
    try { mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
    catch (_) { try { mr = new MediaRecorder(stream); } catch (__) { if (msg) msg.textContent = 'Recording not supported — type it.'; stream.getTracks().forEach(t => t.stop()); return; } }
    _trRec[jobId] = mr;
    const chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async function () {
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove('rec'); btn.textContent = '🎤';
      const type = (chunks[0] && chunks[0].type) || mime || 'audio/webm';
      const blob = new Blob(chunks, { type });
      const ext = /mp4|aac|m4a|mpeg|mp3/i.test(type) ? 'm4a' : 'webm';
      if (msg) msg.textContent = 'Ant is listening…';
      try {
        const fd = new FormData(); fd.append('audio', blob, 'report.' + ext);
        const r = await fetch('/.netlify/functions/whisper-transcribe', { method: 'POST', body: fd });
        const jd = await r.json();
        const text = ((jd && jd.text) || '').trim();
        if (text && ta) ta.value = (ta.value ? ta.value.trim() + ' ' : '') + text;
        if (msg) msg.textContent = text ? '✓ Got it — check it, then tap Done.' : 'Didn\'t catch that — try again or type it.';
      } catch (_) { if (msg) msg.textContent = 'Couldn\'t hear it — type it.'; }
    };
    try { mr.start(); btn.classList.add('rec'); btn.textContent = '⏹'; if (msg) msg.textContent = 'Recording… tap ⏹ when done.'; } catch (_) {}
  };

  // Save the report (extract -> update_tdr_field_from_voice, side-effect-free) and,
  // for a completion, fire Start (if needed) + tech_job_complete.
  // ct: 'repair_complete' | 'parts_needed' | '' (file-only, job already done).
  window.treport = async function (btn, jobId, ct) {
    const tid = parseInt(localStorage.getItem('tn_tech_id') || '0', 10);
    const ta = document.getElementById('trta-' + jobId);
    const msg = document.getElementById('trm-' + jobId);
    const host = document.getElementById('trh-' + jobId);
    const text = (ta ? ta.value : '').trim();
    if (!tid) { if (msg) msg.textContent = 'Missing tech id — reopen from your Ant link.'; return; }
    if (ct === 'repair_complete' && text.length < 8) {
      if (msg) { msg.style.color = '#ff8a82'; msg.textContent = 'Add what you found + the part first — that\'s your pay.'; }
      if (ta) ta.focus(); return;
    }
    if (host) host.querySelectorAll('button').forEach(b => b.disabled = true);
    if (msg) { msg.style.color = ''; msg.textContent = 'Filing your report…'; }
    // 1) save the report onto the TDR — upsert by job+tech, emits NO folder move.
    if (text) {
      let ex = null;
      try { const r = await fetch('/.netlify/functions/extract-tdr-from-transcript', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ transcript: text }) }); const jd = await r.json(); if (jd && jd.ok && jd.extracted) ex = jd.extracted; } catch (_) {}
      const toWrite = [];
      const add = (k, v) => { if (v != null && String(v).trim()) toWrite.push({ field: k, value: String(v).trim() }); };
      if (ex) {
        add('diagnosis', (ex.diagnosis && String(ex.diagnosis).trim()) ? ex.diagnosis : text);
        add('failed_component', ex.failed_component);
        add('repair_completed', ex.repair_completed);
        if (ex.labor_time_hours && Number(ex.labor_time_hours) > 0) add('labor_hours', String(ex.labor_time_hours));
      } else {
        add('diagnosis', text); // fallback: his raw words are still a filed report
      }
      for (const w of toWrite) {
        try { await fetch(XANO_BASE + '/update_tdr_field_from_voice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job_id: Number(jobId), field: w.field, value: w.value, technician_id: tid }) }); } catch (_) {}
      }
    }
    // 2) file-only mode (job already completed) — done, just refresh.
    if (!ct) {
      if (msg) { msg.style.color = '#4ad991'; msg.textContent = '✓ Report filed — you\'re getting paid on this one.'; }
      setTimeout(loadDashboard, 1100); return;
    }
    // 3) completion: pass through Start (state machine requires it), then Complete.
    try { await fetch(XANO_BASE + '/tech_job_started', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job_id: Number(jobId), technician_id: tid }) }); } catch (_) {}
    let done = null;
    try { const r = await fetch(XANO_BASE + '/tech_job_complete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job_id: Number(jobId), technician_id: tid, completion_type: ct }) }); done = await r.json().catch(() => ({})); } catch (_) {}
    if (done && done.success) {
      if (msg) { msg.style.color = '#4ad991'; msg.textContent = '✓ Done + report filed — nice work.'; }
      setTimeout(loadDashboard, 1200);
    } else {
      if (host) host.querySelectorAll('button').forEach(b => b.disabled = false);
      const err = (done && done.error) || 'try again';
      if (msg) { msg.style.color = '#ff8a82'; msg.textContent = /tdr|incomplete|labor|repair|diagnos|required/i.test(String(err)) ? 'Office needs a bit more to bill it — add the part / what you fixed.' : ('⚠ ' + err); }
    }
  };

  // ── 🎯 Part showdown on the tile — you vs Ant vs Danielle (Teddy 7/5).
  // Ant throws a part guess (ant-brain-predict), Danielle calls one from the
  // office (danielle_part_call), the tech confirms or beats it in the field. His
  // confirmed part is the TRUTH that grades all three (ant-brain-game).
  const _tsd = {};
  const _pkey = s => String(s || '').trim().split(/[\s(—\-]/)[0].toUpperCase().replace(/[^A-Z0-9]/g, '');
  const _she = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function hydrateShowdowns(jobs) {
    for (const it of (jobs || [])) {
      const j = it.job || {}; const jid = j.id;
      const st = (j.scheduling_status || j.current_status || '').toLowerCase();
      if (!jid || (st !== 'in_progress' && st !== 'completed')) continue;
      const host = document.getElementById('tsd-' + jid);
      if (!host) continue;
      const tdrId = Number((it.latest_tdr || {}).id || 0) || 0;
      let sd = null;
      try { sd = await fetch('/.netlify/functions/part-showdown?job_id=' + jid).then(r => r.json()); } catch (_) {}
      const danielle = sd && sd.danielle ? sd.danielle : null;
      const resolved = sd && sd.resolved ? sd.resolved : null;
      if (resolved) {
        _tsd[jid] = { ant: resolved.ant_part ? { part: resolved.ant_part, component: resolved.ant_component || '', confidence: 0 } : null, danielle, tdr_id: tdrId };
        renderShowdown(jid, resolved); host.style.display = ''; continue;
      }
      // unresolved → get a fresh Ant guess
      let ant = null;
      try { const pr = await fetch('/.netlify/functions/ant-brain-predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job_id: jid }) }).then(r => r.json()); if (pr && pr.ok && pr.predictions && pr.predictions.length) ant = pr.predictions[0]; } catch (_) {}
      if (!ant && !danielle) continue; // nothing to show — keep the tile clean
      _tsd[jid] = { ant: ant ? { part: ant.part_display || ant.part, component: ant.component || '', confidence: ant.confidence || 0 } : null, danielle, tdr_id: tdrId };
      renderShowdown(jid, null); host.style.display = '';
    }
  }

  function renderShowdown(jid, resolved) {
    const host = document.getElementById('tsd-' + jid); if (!host) return;
    const s = _tsd[jid] || {}; const ant = s.ant, dani = s.danielle;
    if (resolved) {
      const real = resolved.part;
      const antHit = ant && _pkey(ant.part) === _pkey(real);
      const daniHit = dani && _pkey(dani.part) === _pkey(real);
      const chips = [];
      if (ant) chips.push('<span class="chip ' + (antHit ? 'hit' : 'miss') + '">🐜 Ant ' + (antHit ? '✓' : '✗') + '</span>');
      if (dani) chips.push('<span class="chip ' + (daniHit ? 'hit' : 'miss') + '">🧑‍💼 Danielle ' + (daniHit ? '✓' : '✗') + '</span>');
      const beatAnt = ant && resolved.verdict === 'overridden';
      const you = resolved.verdict === 'overridden' ? (ant ? 'you beat Ant 🏆' : 'you set the part') : 'you nailed it';
      chips.push('<span class="chip hit">🔧 ' + you + '</span>');
      // #2 Ant remembers what beat it · #3 Danielle locked in from the office first.
      const notes = [];
      if (resolved.verdict === 'overridden') notes.push('🐜 logged it — it\'s in the brain now, won\'t miss it again');
      if (dani) notes.push('🧑‍💼 Danielle called it from the office' + (daniHit ? ' — and she nailed it' : ' — you got her this time'));
      notes.push('settles when the job proves out (no callback)');
      host.innerHTML = '<div class="sh-resolved"><div class="real">✓ Real part: <span class="p">' + _she(real) + '</span></div><div class="sh-chips">' + chips.join('') + '</div>'
        + notes.map(n => '<div style="font-size:11px;color:var(--muted);margin-top:6px">' + n + '</div>').join('') + '</div>';
      return;
    }
    let html = '<div class="sh-h">🎯 The part — you vs Ant' + (dani ? ' vs Danielle' : '') + '</div>';
    html += ant
      ? '<div class="sh-call sh-ant"><span class="lab">🐜 Ant:</span> <span class="p">' + _she(ant.part) + '</span>' + (ant.confidence ? ' <span class="c">' + ant.confidence + '%' + (ant.component ? ' · ' + _she(ant.component) : '') + '</span>' : '') + '</div>'
      : '<div class="sh-call sh-ant"><span class="lab">🐜 Ant:</span> <span class="c">no guess yet — you set it</span></div>';
    if (dani) html += '<div class="sh-call sh-dani"><span class="lab">🧑‍💼 Danielle:</span> <span class="p">' + _she(dani.part) + '</span> <span class="c">🔒 locked in from the office</span></div>';
    html += '<div class="sh-btns">';
    if (ant) html += '<button class="sh-btn sh-yes" onclick="event.stopPropagation();tsdConfirm(' + jid + ',\'ant\')">✓ Ant nailed it</button>';
    if (dani && (!ant || _pkey(dani.part) !== _pkey(ant.part))) html += '<button class="sh-btn sh-yes" onclick="event.stopPropagation();tsdConfirm(' + jid + ',\'danielle\')">✓ Danielle\'s right</button>';
    html += '<button class="sh-btn sh-no" onclick="event.stopPropagation();tsdOverrideOpen(' + jid + ')">✗ It\'s actually…</button>';
    html += '</div><div class="sh-ov" id="shov-' + jid + '" style="display:none"><input id="shin-' + jid + '" placeholder="real part #" autocomplete="off"><button onclick="event.stopPropagation();tsdOverrideSave(' + jid + ')">Lock it in</button></div>';
    html += '<div class="sh-msg" id="shm-' + jid + '"></div>';
    host.innerHTML = html;
  }

  window.tsdConfirm = function (jid, who) {
    const s = _tsd[jid] || {};
    const truth = who === 'danielle' ? (s.danielle && s.danielle.part) : (s.ant && s.ant.part);
    if (truth) tsdResolve(jid, truth);
  };
  window.tsdOverrideOpen = function (jid) {
    const ov = document.getElementById('shov-' + jid); if (ov) ov.style.display = 'flex';
    const inp = document.getElementById('shin-' + jid); if (inp) inp.focus();
  };
  window.tsdOverrideSave = function (jid) {
    const inp = document.getElementById('shin-' + jid); const v = (inp ? inp.value : '').trim();
    const msg = document.getElementById('shm-' + jid);
    if (!v) { if (msg) msg.textContent = 'Type the real part #.'; if (inp) inp.focus(); return; }
    tsdResolve(jid, v);
  };
  async function tsdResolve(jid, truthPart) {
    const s = _tsd[jid] || {};
    const msg = document.getElementById('shm-' + jid);
    const tid = parseInt(localStorage.getItem('tn_tech_id') || '0', 10);
    const antPart = (s.ant && s.ant.part) || '';
    const verdict = (antPart && _pkey(truthPart) === _pkey(antPart)) ? 'confirmed' : 'overridden';
    const host = document.getElementById('tsd-' + jid);
    if (host) host.querySelectorAll('button').forEach(b => b.disabled = true);
    if (msg) msg.textContent = 'Locking it in…';
    try {
      const r = await fetch('/.netlify/functions/ant-brain-verdict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
        job_id: jid, tech_id: tid, tdr_id: s.tdr_id || 0, verdict,
        ant_part: antPart, ant_component: (s.ant && s.ant.component) || '', ant_confidence: (s.ant && s.ant.confidence) || 0,
        tech_part: verdict === 'overridden' ? truthPart : '',
      }) }).then(x => x.json());
      if (r && r.ok) {
        renderShowdown(jid, { part: r.part, verdict: r.verdict, beat_ant: r.beat_ant });
        try { if (typeof renderAntGame === 'function') renderAntGame(); } catch (_) {}
      } else { if (host) host.querySelectorAll('button').forEach(b => b.disabled = false); if (msg) msg.textContent = '⚠ try again'; }
    } catch (_) { if (host) host.querySelectorAll('button').forEach(b => b.disabled = false); if (msg) msg.textContent = '⚠ connection'; }
  }

  function renderCard(item, index) {
    const j = item.job || {};
    const c = item.customer || {};
    const t = item.teddy_pre_diagnosis;
    const lt = item.latest_tdr;
    const num = index + 1;
    const start = j.scheduled_start;
    const end = j.scheduled_end;
    const timeStr = item.untimed
      ? '⏱ no time set'
      : (start
        ? (end ? `${fmtTimeShort(start)} – ${fmtTimeShort(end)}` : fmtTimeShort(start))
        : '(unscheduled)');
    const status = (j.scheduling_status || j.current_status || 'other').toLowerCase();
    const statusClass = ['scheduled','in_progress','completed','prediagnosis_pending','needs_review'].includes(status) ? `status-${status}` : 'status-other';
    const statusLabel = status.replace(/_/g, ' ');
    const isPractice = (j.test_run_id || '').startsWith('PRACTICE');
    const practicePill = isPractice ? `<div class="status-pill" style="background:rgba(245,166,35,0.18); border:1px solid rgba(245,166,35,0.45); color:#f5a623; font-weight:700">🧪 PRACTICE</div>` : '';
    const crewPill = item.crew_with ? `<div class="status-pill" style="background:rgba(116,227,196,0.18); border:1px solid rgba(116,227,196,0.5); color:#74e3c4; font-weight:700">👥 2-man w/ ${escapeHtml(item.crew_with)}</div>` : '';

    // Job-level parts tag: WARRANTY vs OUR (cash) parts, so the guys know the
    // parts source/billing at a glance. Cash only when customer_type is an
    // explicit self-pay value; otherwise warranty (matches the office board:
    // blank vendor defaults to warranty, since ~all jobs are warranty).
    const ctype = (j.customer_type || '').trim().toLowerCase();
    const isCash = ctype === 'self_pay' || ctype === 'cash' || ctype === 'customer_pay';
    // Name the warranty company on the badge (Jimmy 7/1: "does not say what
    // warranty"). Fall back to generic "Warranty" only when the vendor is blank.
    const wc = (j.warranty_company || '').trim();
    const partsTag = isCash
      ? `<div class="status-pill" style="background:rgba(245,166,35,0.16); border:1px solid rgba(245,166,35,0.45); color:#f5a623; font-weight:700">💵 Our parts</div>`
      : `<div class="status-pill" style="background:rgba(116,160,255,0.16); border:1px solid rgba(116,160,255,0.5); color:#8ab4ff; font-weight:700">🛡️ ${wc ? escapeHtml(wc) : 'Warranty'}</div>`;

    // Visit type at a glance (Jimmy's ask): is this stop a first-look DIAGNOSIS or
    // a COMPLETION (going back to install/finish, parts involved)? Parts-in-play is
    // the high-confidence "completion" signal — awaiting_parts/ordered means we
    // already diagnosed and a part is on the way; arrived/ready means grab-and-go.
    const psRaw = (j.parts_status || '').toLowerCase();
    const partsPending = ['awaiting_parts','ordered','on_order','pending','parts_needed','to_order'].includes(psRaw) || status === 'awaiting_parts';
    const partsReady = ['arrived','ready','received','in_storage','delivered','picked_up'].includes(psRaw);
    // A completion is a RETURN visit — he's already been on it. Signals (any):
    //  parts in play · already started (in_progress) · awaiting parts · a field
    //  tech already filed a diagnosis TDR (technician_id != 1 = not Teddy's pre-diag).
    const fieldDiagnosed = !!(lt && (String(lt.diagnosis || '').trim() || String(lt.failed_component || '').trim()) && Number(lt.technician_id) !== 1);
    const alreadyEngaged = status === 'in_progress' || status === 'awaiting_parts';
    const isCompletion = partsPending || partsReady || fieldDiagnosed || alreadyEngaged;
    // A tech/office override wins over auto-detection — during the HCP cutover, a
    // job already diagnosed in HCP comes in as a shell, so Ant can't tell it's a
    // completion. The tech knows: TAP the badge to switch. (Jimmy 7/1.)
    const _ov = (window.VISIT_OVERRIDES || {})[j.id];
    const _isCompl = _ov ? (_ov === 'completion') : isCompletion;
    const _nextType = _isCompl ? 'diagnosis' : 'completion';
    const _ovMark = _ov ? ' ✎' : '';
    // Where are the parts (Teddy: "completion — parts at customer, whatever")?
    const partsWhere = isCash ? 'at customer' : (partsReady ? 'ready' : (partsPending ? 'coming' : ''));
    const terminalStatus = ['completed','canceled','cancelled','no_fix_possible'].includes(status);
    const _vTitle = 'Tap to switch — Completion vs Diagnosis (you know best)';
    const visitPill = terminalStatus ? '' : (_isCompl
      ? `<div class="status-pill" onclick="event.stopPropagation();toggleVisit(${j.id},'${_nextType}')" title="${_vTitle}" style="cursor:pointer;background:rgba(0,214,143,0.20); border:1px solid rgba(0,214,143,0.6); color:#25e3a4; font-weight:800; letter-spacing:.02em">🔧 COMPLETION${partsWhere ? ` · parts ${partsWhere}` : ''}${_ovMark}</div>`
      : `<div class="status-pill" onclick="event.stopPropagation();toggleVisit(${j.id},'${_nextType}')" title="${_vTitle}" style="cursor:pointer;background:rgba(74,245,255,0.16); border:1px solid rgba(74,245,255,0.55); color:#4af5ff; font-weight:800; letter-spacing:.02em">🔍 DIAGNOSIS${_ovMark}</div>`);

    const custName = `${(c.first_name||'').trim()} ${(c.last_name||'').trim()}`.trim() || '(no customer name)';
    const appliance = (j.appliance_type || 'appliance').toLowerCase();
    const brand = (j.brand || '').trim();
    const applianceLine = brand ? `${appliance} <span class="dot">·</span> ${escapeHtml(brand)}` : appliance;
    const addressParts = [j.service_address, j.service_city, j.service_state].filter(Boolean);
    const addressText = addressParts.length ? addressParts.join(', ') : '(no address)';
    const addrForMaps = encodeURIComponent([j.service_address, j.service_city, j.service_state, j.service_zip].filter(Boolean).join(', '));
    const problem = (j.problem_summary || '').trim();
    // Customer availability (collected by the greeting → availability cascade,
    // parsed onto the job as customer_preference_text). Surfacing it here so the
    // tech sees when the customer said they're around before he plans his route.
    const pref = (j.customer_preference_text || '').trim();
    // customer_preference_text packs segments joined by " · ":
    // "🗓 Availability: <words> · 🛟 FLOORS: <label> · ⚑ Customer language: ...".
    // Split it and pull each cleanly so availability never absorbs the floors/
    // language tags (Teddy 2026-06-26/27). Floors gets its own prominent banner.
    const _segs = pref.split(/\s*·\s*/);
    let availText = '';
    let floorsText = '';
    for (let si = 0; si < _segs.length; si++) {
      const s = (_segs[si] || '').trim();
      if (/^🛟/.test(s)) { const fm = s.match(/FLOORS:\s*([\s\S]*)/i); floorsText = (fm && fm[1].trim()) ? fm[1].trim() : s.replace(/^🛟\s*/, '').trim(); continue; }
      if (/^⚑/.test(s)) continue;
      if (!availText && s) { const am = s.match(/Availability:\s*([\s\S]*)/i); availText = (am && am[1].trim()) ? am[1].trim() : s.replace(/^🗓\s*/, '').trim(); }
    }
    const access = (j.access_notes || '').trim();

    const attCount = item.attachments_count || 0;
    const attPreview = item.attachments_preview || [];
    const photoCount = attPreview.filter(a => (a.file_type||'').startsWith('image') || (a.mime_type||'').startsWith('image')).length + Math.max(0, attCount - attPreview.length);
    const videoCount = attPreview.filter(a => (a.file_type||'').startsWith('video') || (a.mime_type||'').startsWith('video')).length;

    let teddyHtml = '';
    if (t && (t.diagnosis || t.problem_summary)) {
      const summary = (t.diagnosis || t.problem_summary || '').trim();
      const failed = (t.failed_component || '').trim();
      const confidence = (t.confidence_level || '').trim();
      teddyHtml = `
        <div class="teddy-note">
          <div class="label">🧠 Teddy's pre-diagnosis</div>
          <div class="text">${escapeHtml(summary)}</div>
          ${(failed || confidence) ? `<div class="meta">${failed ? `Failed: ${escapeHtml(failed)}` : ''}${(failed && confidence) ? ' · ' : ''}${confidence ? `confidence: ${escapeHtml(confidence)}` : ''}</div>` : ''}
        </div>`;
    }

    // Latest TDR for this job by ANY tech (not just Teddy). Always rendered
    // when a TDR row exists so the tech can confirm submission landed, even
    // if the form fields were empty. Skipped only when it's literally the
    // same row already shown as Teddy's pre-diagnosis.
    let latestTdrHtml = '';
    const sameAsTeddy = t && lt && t.id === lt.id;
    if (lt && !sameAsTeddy) {
      const ltSummary = (lt.diagnosis || lt.problem_summary || '').trim();
      const ltFailed = (lt.failed_component || '').trim();
      const ltRepair = (lt.repair_completed || '').trim();
      const ltLabor = lt.labor_time_hours;
      const ltAuthor = lt.technician_id;
      const parts = [];
      if (ltFailed) parts.push(`Failed: ${escapeHtml(ltFailed)}`);
      if (ltLabor && ltLabor > 0) parts.push(`${ltLabor}h`);
      if (ltRepair) parts.push(`Repair: ${escapeHtml(ltRepair)}`);
      const summaryHtml = ltSummary
        ? `<div class="text">${escapeHtml(ltSummary)}</div>`
        : `<div class="text" style="opacity:.6">(submitted with empty diagnosis — fill TDR fields on FINISH next time)</div>`;
      latestTdrHtml = `
        <div class="teddy-note" style="border-left-color:#74e3c4">
          <div class="label">📋 Tech TDR #${lt.id} (tech #${ltAuthor})</div>
          ${summaryHtml}
          ${parts.length ? `<div class="meta">${parts.join(' · ')}</div>` : ''}
        </div>`;
    }

    let attHtml = '';
    if (attCount > 0) {
      const slots = attPreview.slice(0, 5).map((a, k) => {
        const isVideo = (a.file_type||'').startsWith('video') || (a.mime_type||'').startsWith('video');
        return `<div class="att-thumb ${isVideo ? 'video' : ''} placeholder" data-att-id="${a.id}" data-s3-key="${escapeHtml(a.s3_key || '')}">${isVideo ? '' : '🖼'}</div>`;
      });
      if (attCount > 5) slots.push(`<div class="att-more">+${attCount - 5}</div>`);
      attHtml = `<div class="attachments-strip">${slots.join('')}</div>`;
    }

    const phone = (c.phone || '').replace(/[^\d+]/g, '');
    const telHref = phone ? `tel:${phone.startsWith('+') ? phone : '+1' + phone.replace(/^1/, '')}` : null;
    // 🚩 Flag-a-problem: one tap texts Ant (tech line) prefilled with this stop, so a
    // scheduling conflict is raised WITH Ant, never sprung on anyone ("no surprises").
    const flagHref = `sms:+16158578800?body=${encodeURIComponent(`Ant — heads up, problem with my stop: ${custName} (${appliance}). `)}`;

    // Inline lifecycle row — one-tap On my way / Start (gateless), or Finish (opens
    // the job to file the report). This is what makes the schedule TRUE: Ant finally
    // sees when a tech is en route / on-site / done, instead of guessing.
    const jid = j.id;
    // Did THIS tech file his report? (reports = pay). A report = any real content
    // on the latest TDR authored by the assigned tech — not Teddy's pre-diagnosis.
    const reportFiled = !!(lt && Number(lt.technician_id) === Number(TECH_ID)
      && (String(lt.diagnosis||'').trim() || String(lt.failed_component||'').trim() || String(lt.repair_completed||'').trim()));
    let lcRow = '';
    if (status === 'completed') {
      lcRow = reportFiled
        ? `<div class="lc-done">✓ Completed · report filed</div>`
        // Done but no report from him = pay is stuck. File it right here.
        : `<button class="lc-btn lc-report" onclick="event.stopPropagation();tfin(this,${jid},'filed')">📋 File your report — get paid</button>`;
    } else if (status === 'in_progress') {
      // Close the loop on the tile: file the report + complete, no page jump.
      lcRow = `<button class="lc-btn lc-report" onclick="event.stopPropagation();tfin(this,${jid},'repair_complete')">✓ Done — file report</button>
               <a href="tech-job.html?job_id=${jid}&tech_id=${TECH_ID}" class="lc-btn lc-expand" title="open the full job" onclick="event.stopPropagation()">⤢</a>`;
    } else {
      lcRow = `<button class="lc-btn lc-otw" onclick="event.stopPropagation();tlc(this,${jid},'tech_on_the_way')">🚚 On my way</button>
               <button class="lc-btn lc-start" onclick="event.stopPropagation();tlc(this,${jid},'tech_job_started')">▶ Start</button>`;
    }

    return `
      <div class="card" id="card-${index}" data-index="${index}" style="animation-delay: ${index * 60}ms">
        <div class="card-top">
          <div class="stop-num">${num}</div>
          <div class="time-window">${timeStr}</div>
          ${visitPill}
          <div class="status-pill ${statusClass}">${escapeHtml(statusLabel)}</div>
          ${partsTag}
          ${practicePill}
          ${crewPill}
        </div>
        ${floorsText ? `<div class="floor-banner">🛟 FLOORS — ${escapeHtml(floorsText)}</div>` : ''}
        ${(availText || access) ? `<div class="avail-banner">
          ${availText ? `<span class="lbl">🗓 When they're available — their words</span>“${escapeHtml(availText)}”` : ''}
          ${access ? `<div class="access">🔑 <b>Access:</b> ${escapeHtml(access)}</div>` : ''}
        </div>` : ''}
        <div class="customer-line">${escapeHtml(custName)}</div>
        <div class="appliance-line">${applianceLine}</div>
        ${window.AntConstraints ? AntConstraints.render(j, {dark:true}) : ''}
        <div class="address-line">
          <div class="icon">📍</div>
          <div class="text">${escapeHtml(addressText)}</div>
        </div>
        ${problem ? `<div class="problem-line">"${escapeHtml(problem)}"</div>` : ''}
        ${teddyHtml}
        ${latestTdrHtml}
        ${attHtml}
        <div class="lc-row">${lcRow}</div>
        <div class="tr-host" id="trh-${jid}"></div>
        ${(status === 'in_progress' || status === 'completed') ? `<div class="tile-showdown" id="tsd-${jid}" style="display:none"></div>` : ''}
        <div class="card-cta">
          <div class="open-btn">Open Tech Ant →</div>
          <div class="quick-actions">
            ${telHref ? `<a href="${telHref}" class="quick-btn" title="call customer" onclick="event.stopPropagation()">📞</a>` : ''}
            <a href="https://maps.apple.com/?q=${addrForMaps}" class="quick-btn" title="navigate" onclick="event.stopPropagation()">🧭</a>
            <a href="${flagHref}" class="quick-btn" title="flag a problem with this stop — text Ant" onclick="event.stopPropagation()">🚩</a>
          </div>
        </div>
      </div>
    `;
  }

  async function hydrateAttachmentThumbs(jobs) {
    const allKeys = [];
    jobs.forEach(it => (it.attachments_preview || []).forEach(a => {
      if (a.s3_key && !((a.file_type||'').startsWith('video') || (a.mime_type||'').startsWith('video'))) {
        allKeys.push(a.s3_key);
      }
    }));
    if (allKeys.length === 0) return;
    try {
      const res = await fetch('/.netlify/functions/s3-view-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ s3_keys: allKeys })
      });
      const data = await res.json();
      if (!data || !data.success) return;
      const map = {};
      for (const r of (data.signed_urls || [])) map[r.s3_key] = r.view_url;
      document.querySelectorAll('.att-thumb[data-s3-key]').forEach(el => {
        const key = el.getAttribute('data-s3-key');
        const url = map[key];
        if (url && !el.classList.contains('video')) {
          el.classList.remove('placeholder');
          el.innerHTML = `<img loading="lazy" src="${url}" alt="">`;
        }
      });
    } catch (err) {
      console.warn('s3-view-url error', err);
    }
  }

  // ── Map ────────────────────────────────────────────────────────
  async function renderMap(jobs) {
    if (jobs.length === 0) {
      mapHost.innerHTML = '<div class="map-empty">No stops to plot.</div>';
      return;
    }
    mapHost.innerHTML = '<div id="map"></div>';
    mapInstance = L.map('map', { zoomControl: false, attributionControl: false })
      .setView([36.0, -86.7], 8);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OSM',
    }).addTo(mapInstance);

    const coords = [];
    for (let i = 0; i < jobs.length; i++) {
      const j = jobs[i].job || {};
      const ll = await geocodeJob(j);
      if (!ll) continue;
      const num = i + 1;
      const icon = L.divIcon({
        className: '',
        html: `<div class="map-pin"><span>${num}</span></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
      });
      const marker = L.marker([ll.lat, ll.lng], { icon }).addTo(mapInstance);
      marker.on('click', () => {
        const card = $(`card-${i}`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('highlight');
          setTimeout(() => card.classList.remove('highlight'), 1400);
        }
      });
      mapMarkers.push(marker);
      coords.push([ll.lat, ll.lng]);
    }
    if (coords.length === 1) {
      mapInstance.setView(coords[0], 13);
    } else if (coords.length > 1) {
      mapInstance.fitBounds(coords, { padding: [30, 30] });
    }
  }

  // ── Geocoding ──────────────────────────────────────────────────
  // Try the full address, then progressively looser fallbacks so EVERY stop with
  // a ZIP gets at least an area pin (warranty jobs often have partial addresses
  // that Nominatim can't resolve — that's why only a few pins were showing).
  async function geocodeJob(j) {
    const zip = String(j.service_zip || '').trim();
    const city = String(j.service_city || '').trim();
    const st = String(j.service_state || '').trim();
    const variants = [];
    const full = [j.service_address, city, st, zip].filter(Boolean).join(', ');
    if (full) variants.push(full);
    if (city && st) variants.push([city, st, zip].filter(Boolean).join(', '));
    if (zip) variants.push(zip + ', USA');
    for (const v of variants) {
      const ll = await geocodeWithCache(v);
      if (ll) return ll;
    }
    return null;
  }

  async function geocodeWithCache(address) {
    if (!address) return null;
    const key = GEO_PREFIX + simpleHash(address);
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && (Date.now() - parsed.ts) < GEO_TTL_MS) {
          return { lat: parsed.lat, lng: parsed.lng };
        }
      }
    } catch (_) {}
    // Rate-limit-friendly: ~1.1s between hits
    await sleep(geocodeCursor());
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1&countrycodes=us`;
      const res = await fetch(url);
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) return null;
      const r = data[0];
      const lat = parseFloat(r.lat), lng = parseFloat(r.lon);
      if (!isFinite(lat) || !isFinite(lng)) return null;
      localStorage.setItem(key, JSON.stringify({ lat, lng, ts: Date.now() }));
      return { lat, lng };
    } catch (err) {
      console.warn('geocode error', err);
      return null;
    }
  }

  let _geocodeLastAt = 0;
  function geocodeCursor() {
    const since = Date.now() - _geocodeLastAt;
    const wait = Math.max(0, 1100 - since);
    _geocodeLastAt = Date.now() + wait;
    return wait;
  }

  function simpleHash(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) {
      h = (h * 31 + s.charCodeAt(i)) | 0;
    }
    return Math.abs(h).toString(36);
  }

  // ── Date nav ───────────────────────────────────────────────────
  prevDay.addEventListener('click', () => goByDays(-1));
  nextDay.addEventListener('click', () => goByDays(1));
  todayBtn.addEventListener('click', () => {
    if (currentDateStr === serverTodayCT) return;
    currentDateStr = serverTodayCT;
    updateURLDate();
    loadDashboard();
  });

  function goByDays(delta) {
    const d = parseLocalDate(currentDateStr);
    d.setDate(d.getDate() + delta);
    currentDateStr = fmtDateYMD(d);
    updateURLDate();
    loadDashboard();
  }

  function updateURLDate() {
    const url = new URL(window.location.href);
    if (currentDateStr === serverTodayCT) url.searchParams.delete('date');
    else url.searchParams.set('date', currentDateStr);
    window.history.replaceState({}, '', url.toString());
  }

  // ── Utilities ──────────────────────────────────────────────────
  function fmtTimeShort(ts) {
    if (!ts || ts <= 0) return '—';
    return new Date(Number(ts)).toLocaleTimeString('en-US', {
      timeZone: 'America/Chicago',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true,
    });
  }

  function parseLocalDate(ymd) {
    if (!ymd) return new Date();
    const [y, m, d] = ymd.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function fmtDateYMD(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function isYesterday(dateCT, todayCT) {
    const d = parseLocalDate(dateCT);
    const t = parseLocalDate(todayCT);
    t.setDate(t.getDate() - 1);
    return fmtDateYMD(d) === fmtDateYMD(t);
  }

  function isTomorrow(dateCT, todayCT) {
    const d = parseLocalDate(dateCT);
    const t = parseLocalDate(todayCT);
    t.setDate(t.getDate() + 1);
    return fmtDateYMD(d) === fmtDateYMD(t);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ── Boot ───────────────────────────────────────────────────────
  tryUnlock();
})();
