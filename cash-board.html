<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>💵 Cash Customers · Ant</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1a2230;--dim:#6b7684;--line:#e3e8ef;--green:#0a7d33;--gold:#b8860b;--red:#c0392b;--blue:#1f6feb;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:14px 12px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:22px;margin:0;font-weight:900;letter-spacing:-.3px}
  .sub{color:var(--dim);font-size:12.5px;margin:2px 0 14px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:center}
  .kpi .n{font-size:24px;font-weight:900;line-height:1}
  .kpi .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-top:5px;font-weight:700}
  .kpi.urgent{background:#fff6f4;border-color:#f3c0b7}.kpi.urgent .n{color:var(--red)}
  .kpi.paid{background:#f2fbf5;border-color:#b7e3c6}.kpi.paid .n{color:var(--green)}
  .lane{margin:0 0 18px}
  .lane-h{font-size:12.5px;font-weight:900;letter-spacing:.3px;margin:0 0 8px;display:flex;align-items:center;gap:7px;text-transform:uppercase}
  .lane-h .ct{background:#e7ecf3;color:#48566b;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:box-shadow .12s}
  .card:active{box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .card.urgent{border-left:5px solid var(--red);background:#fffaf9}
  .card.paidwait{border-left:5px solid var(--gold);background:#fffdf3}
  .card.paidcard{border-left:5px solid var(--green)}
  .row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .nm{font-weight:800;font-size:16px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
  .c-paid{background:#e7f6ec;color:var(--green);border:1px solid #b7e3c6}
  .c-unpaid{background:#fdecea;color:var(--red);border:1px solid #f3c0b7}
  .c-appl{background:#eef2f7;color:#48566b}
  .c-city{background:#eef2f7;color:#48566b}
  .c-wait{background:#fff3d6;color:#8a6410;border:1px solid #ecd9a3}
  .prob{color:var(--dim);font-size:12.5px;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .acts{display:flex;gap:7px;margin-top:10px}
  .btn{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:800;padding:9px;border-radius:9px;border:1px solid var(--line);background:#f7f9fc;color:#33415c}
  .btn.go{background:var(--blue);color:#fff;border-color:var(--blue)}
  .empty{color:var(--dim);font-size:13px;padding:6px 2px}
  .bar{display:flex;gap:8px;align-items:center}
  .rf{font-size:12px;color:var(--dim);background:none;border:0;cursor:pointer}
  .gate{max-width:320px;margin:80px auto;text-align:center}
  .gate input{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:10px;margin:10px 0}
  .gate button{width:100%;padding:11px;font-size:15px;font-weight:800;background:var(--blue);color:#fff;border:0;border-radius:10px;cursor:pointer}
  a.back{color:var(--blue);text-decoration:none;font-size:13px;font-weight:700}
</style>

<div id="gate" class="gate" style="display:none">
  <h1>💵 Cash Customers</h1>
  <div class="sub">Office password</div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="password">
  <button onclick="unlock()">Unlock</button>
  <div id="gerr" style="color:var(--red);font-size:12px;margin-top:8px"></div>
</div>

<div id="app" class="wrap" style="display:none">
  <div class="top">
    <div><h1>💵 Cash Customers</h1><div class="sub">Paying customers — first-class. Most urgent at the top. Auto-refreshes.</div></div>
    <div class="bar"><a class="back" href="office-board.html">← Board</a><button class="rf" onclick="load()">↻ refresh</button></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div id="unmatched"></div>
  <div id="lanes"></div>
  <div id="foot" style="color:var(--dim);font-size:11px;text-align:center;margin-top:18px"></div>
</div>

<script>
const FN='/.netlify/functions';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function d10(p){const x=String(p||'').replace(/\D/g,'');return x.length>=10?x.slice(-10):'';}
function fmtDay(ms){if(!ms)return '';try{return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'short',month:'short',day:'numeric'}).format(new Date(ms));}catch(_){return '';}}

// --- auth gate (shared office password) ---
function authed(){try{return localStorage.getItem('tn_office_auth')==='1'||localStorage.getItem('ant_office_auth')==='1';}catch(_){return false;}}
async function unlock(){
  const v=(document.getElementById('pw').value||'').trim();if(!v)return;
  try{
    const r=await fetch(FN+'/office-verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v})});
    const d=await r.json();
    if(d&&(d.ok||d.valid||d.success)){try{localStorage.setItem('tn_office_auth','1');localStorage.setItem('ant_office_pw',v);}catch(_){}start();}
    else document.getElementById('gerr').textContent='Wrong password';
  }catch(_){document.getElementById('gerr').textContent='Error — try again';}
}

let CURJOBS=[];
function officePw(){let p='';try{p=localStorage.getItem('ant_office_pw')||'';}catch(_){}if(!p){p=(prompt('Office password:')||'').trim();if(p){try{localStorage.setItem('ant_office_pw',p);}catch(_){}}}return p;}

// 💳 Stripe payments that couldn't auto-link (guest Link, no phone) — assign to a job in one tap.
function renderUnmatched(list){
  const host=document.getElementById('unmatched'); if(!host)return;
  if(!list||!list.length){host.innerHTML='';return;}
  const opts=CURJOBS.map(j=>'<option value="'+j.id+'">'+esc(j.name)+' · '+esc(j.appliance||'')+' (#'+j.id+')</option>').join('');
  host.innerHTML='<div class="lane"><div class="lane-h" style="color:#8a6410">💳 Payments to match<span class="ct">'+list.length+'</span></div>'
    +'<div style="font-size:11.5px;color:var(--dim);margin:-4px 0 8px">Real Stripe payments we couldn\'t auto-link to a job. Assign each to the right customer so they show PAID.</div>'
    +list.map(p=>'<div class="card paidwait" style="cursor:default">'
      +'<div class="row1"><span class="nm">'+esc(p.name||'(no name)')+'</span><span class="chip c-paid">💵 $'+Number(p.amount||0).toFixed(0)+'</span></div>'
      +'<div class="chips">'+(p.email?'<span class="chip c-city">✉ '+esc(p.email)+'</span>':'')+(p.phone?'<span class="chip c-city">📞 '+esc(p.phone)+'</span>':'')+(p.created?'<span class="chip c-city">'+esc(fmtDay(p.created))+'</span>':'')+'</div>'
      +'<div class="acts" style="gap:6px"><select id="up_'+p.charge_id+'" style="flex:1;min-width:0;padding:9px;border-radius:9px;border:1px solid var(--line);font-size:13px"><option value="">— assign to a job —</option>'+opts+'</select>'
      +'<button class="btn go" style="flex:0 0 auto" onclick="linkPayment(\''+p.charge_id+'\','+Number(p.amount||0)+',this)">Assign</button></div>'
      +'</div>').join('')+'</div>';
}
async function linkPayment(chargeId,amount,btn){
  const sel=document.getElementById('up_'+chargeId); const jobId=sel&&sel.value; if(!jobId){alert('Pick a job first');return;}
  const pw=officePw(); if(!pw)return;
  const name=sel.options[sel.selectedIndex].text;
  btn.disabled=true; btn.textContent='…';
  try{
    const r=await fetch(FN+'/stripe-reconcile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'link',charge_id:chargeId,job_id:parseInt(jobId,10),amount:amount,name:name,office_pw:pw})});
    const d=await r.json();
    if(d&&d.ok){btn.textContent='✓ linked';setTimeout(load,600);}
    else{btn.disabled=false;btn.textContent='Assign';alert('Could not link: '+((d&&d.error)||'error'));}
  }catch(_){btn.disabled=false;btn.textContent='Assign';alert('Error — try again');}
}

const LANES=[
  {id:'new_paid', h:'💵🔴 PAID — schedule NOW', cls:'paidwait'},
  {id:'new',      h:'🆕 New — needs scheduling', cls:'urgent'},
  {id:'collect',  h:'💰 Done — collect payment', cls:'urgent'},
  {id:'scheduled',h:'📅 Scheduled', cls:''},
  {id:'working',  h:'🔧 Tech working it', cls:''},
  {id:'paid',     h:'✅ Paid & done', cls:'paidcard'},
];

function tile(j,cls){
  const ph=d10(j.phone);
  const paidChip=j.paid?('<span class="chip c-paid">💵 PAID'+(j.paid_amount?(' $'+j.paid_amount.toFixed(0)):'')+'</span>'):'<span class="chip c-unpaid">🔴 unpaid</span>';
  const wait=(j.days>=1&&!j.scheduled_start)?('<span class="chip c-wait">⏳ '+j.days+'d waiting</span>'):'';
  const sch=j.scheduled_start?('<span class="chip c-city">📅 '+esc(fmtDay(j.scheduled_start))+'</span>'):'';
  const call=ph?('<a class="btn" href="tel:+1'+ph+'" onclick="event.stopPropagation()">📞 Call</a>'):'';
  const text=ph?('<a class="btn" href="sms:+1'+ph+'" onclick="event.stopPropagation()">💬 Text</a>'):'';
  return '<div class="card '+cls+'" onclick="location.href=\'office-board.html?job='+j.id+'\'">'
    +'<div class="row1"><span class="nm">'+esc(j.name)+'</span>'+paidChip+'</div>'
    +'<div class="chips"><span class="chip c-appl">'+esc(j.appliance||'appliance')+'</span>'+(j.city?'<span class="chip c-city">📍 '+esc(j.city)+'</span>':'')+sch+wait+'</div>'
    +(j.problem?'<div class="prob">'+esc(j.problem)+'</div>':'')
    +'<div class="acts">'+call+text+'<a class="btn go" href="office-board.html?job='+j.id+'" onclick="event.stopPropagation()">📅 Open / Schedule</a></div>'
    +'</div>';
}

async function load(){
  let d;
  try{ d=await fetch(FN+'/cash-jobs',{cache:'no-store'}).then(r=>r.json()); }catch(_){ document.getElementById('foot').textContent='Could not load — retrying…'; return; }
  if(!d||!d.ok){ document.getElementById('foot').textContent='Feed error.'; return; }
  const c=d.counts||{};
  const attention=(c.new_paid||0)+(c.new||0)+(c.collect||0);
  const paidCount=(c.new_paid||0)+(c.paid||0);
  document.getElementById('kpis').innerHTML=
     '<div class="kpi'+(attention?' urgent':'')+'"><div class="n">'+attention+'</div><div class="l">Need attention</div></div>'
    +'<div class="kpi paid"><div class="n">'+paidCount+'</div><div class="l">Paid</div></div>'
    +'<div class="kpi"><div class="n">'+(d.total||0)+'</div><div class="l">Total cash jobs</div></div>';
  CURJOBS=d.jobs||[];
  renderUnmatched(d.unmatched_payments||[]);
  const byLane={}; (d.jobs||[]).forEach(j=>{(byLane[j.lane]=byLane[j.lane]||[]).push(j);});
  let html='';
  for(const L of LANES){
    const list=byLane[L.id]||[];
    if(!list.length && (L.id==='working'||L.id==='paid')) continue; // hide quiet lanes when empty
    html+='<div class="lane"><div class="lane-h">'+L.h+'<span class="ct">'+list.length+'</span></div>'
      +(list.length?list.map(j=>tile(j,L.cls)).join(''):'<div class="empty">None right now.</div>')+'</div>';
  }
  document.getElementById('lanes').innerHTML=html;
  document.getElementById('foot').textContent='Updated '+new Intl.DateTimeFormat('en-US',{timeStyle:'short'}).format(new Date());
}

function start(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='';load();setInterval(load,30000);}
if(authed())start();else document.getElementById('gate').style.display='';
document.getElementById('pw')&&document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
