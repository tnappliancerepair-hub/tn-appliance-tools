<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tech Dashboard - TN Appliance Exchange</title>

<link rel="canonical" href="https://tnapplianceexchange.net/tech-dashboard.html">

<meta property="og:title" content="Tech Dashboard - TN Appliance Exchange">
<meta property="og:description" content="Honest appliance help from TN Appliance Exchange.">

<meta name="twitter:title" content="Tech Dashboard - TN Appliance Exchange">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 40vh 1fr;
    overflow: hidden;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0e1118, #131a2a);
    border-bottom: 1px solid #2a3040;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .icon { font-size: 24px; flex-shrink: 0; }
  .header .text { flex: 1; min-width: 0; }
  .header .title { font-size: 14px; font-weight: 700; }
  .header .sub {
    font-size: 11px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header .refresh-btn {
    background: transparent;
    border: 1px solid #2a3040;
    color: #e8edf5;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    padding: 0;
    flex-shrink: 0;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .header .refresh-btn:active { transform: scale(0.9); }
  .header .refresh-btn:hover:not(:disabled) { background: #2a3040; border-color: #4a9eff; }
  .header .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .header .refresh-btn.spinning { animation: spin 0.7s linear infinite; }
  .header .badge {
    background: rgba(0,214,143,0.12);
    border: 1px solid rgba(0,214,143,0.3);
    color: #00d68f;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    flex-shrink: 0;
  }

  /* Map panel */
  .map-panel {
    background: #131720;
    border-bottom: 1px solid #2a3040;
    position: relative;
    overflow: hidden;
  }
  .map-panel iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .map-panel .empty {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a93aa;
    font-size: 14px;
    text-align: center;
    padding: 0 24px;
  }
  .map-panel .route-link {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(74,158,255,0.95);
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    z-index: 10;
  }
  .map-panel .route-link:active { opacity: 0.85; }

  /* Route summary panel (replaces multi-stop iframe). */
  .map-panel .route-summary {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 100%;
    padding: 0 20px;
    background: linear-gradient(135deg, #131720, #1e2433);
    text-decoration: none;
    color: #e8edf5;
    transition: background 0.15s;
  }
  .map-panel .route-summary:active {
    background: linear-gradient(135deg, #1e2433, #2a3040);
  }
  .map-panel .route-icon { font-size: 36px; flex-shrink: 0; }
  .map-panel .route-text { flex: 1; min-width: 0; }
  .map-panel .route-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .map-panel .route-sub {
    font-size: 12px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
  }
  .map-panel .route-arrow {
    font-size: 28px;
    color: #4a9eff;
    flex-shrink: 0;
  }

  /* Stop list */
  .stop-list {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .stop-list::-webkit-scrollbar { width: 8px; }
  .stop-list::-webkit-scrollbar-track { background: transparent; }
  .stop-list::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }

  .loading {
    padding: 40px 16px;
    text-align: center;
    color: #8a93aa;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #2a3040;
    border-top-color: #f5a623;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-stops {
    padding: 40px 16px;
    text-align: center;
    color: #8a93aa;
    font-size: 14px;
  }

  /* Stop card */
  .stop-card {
    background: #1e2433;
    border: 1px solid #2a3040;
    border-radius: 12px;
    padding: 12px;
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 12px;
    align-items: start;
  }
  .stop-num {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a9eff, #3a8eef);
    color: white;
    font-weight: 800;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .stop-body { min-width: 0; }
  .stop-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .stop-time {
    font-size: 14px;
    font-weight: 700;
    color: #e8edf5;
  }
  .stop-badge {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .stop-badge.scheduled       { background: rgba(74,158,255,0.15);  color: #4a9eff; border: 1px solid rgba(74,158,255,0.3); }
  .stop-badge.in_progress     { background: rgba(245,166,35,0.15);  color: #f5a623; border: 1px solid rgba(245,166,35,0.3); }
  .stop-badge.completed,
  .stop-badge.complete        { background: rgba(0,214,143,0.15);   color: #00d68f; border: 1px solid rgba(0,214,143,0.3); }
  .stop-badge.canceled        { background: rgba(255,71,87,0.15);   color: #ff4757; border: 1px solid rgba(255,71,87,0.3); }
  .stop-badge.awaiting_parts,
  .stop-badge.parts_ordered,
  .stop-badge.broadcasting,
  .stop-badge.pending_auth    { background: rgba(245,166,35,0.15);  color: #f5a623; border: 1px solid rgba(245,166,35,0.3); }
  .stop-badge.ready,
  .stop-badge.pending         { background: rgba(138,147,170,0.15); color: #8a93aa; border: 1px solid rgba(138,147,170,0.3); }
  .stop-badge.closed,
  .stop-badge.default         { background: rgba(138,147,170,0.15); color: #8a93aa; border: 1px solid rgba(138,147,170,0.3); }

  .stop-customer {
    font-size: 14px;
    font-weight: 600;
    color: #e8edf5;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stop-appliance {
    font-size: 12px;
    color: #8a93aa;
    margin-bottom: 2px;
  }
  .stop-city {
    font-size: 11px;
    color: #5a6480;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 10px;
  }
  .stop-actions {
    display: flex;
    gap: 6px;
  }
  .stop-actions button {
    flex: 1;
    min-height: 38px;
    background: #2a3040;
    border: 1px solid #3a4050;
    color: #e8edf5;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    -webkit-appearance: none;
  }
  .stop-actions button:active:not(:disabled) { transform: scale(0.97); }
  .stop-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  .stop-actions button.primary {
    background: linear-gradient(135deg, #4a9eff, #3a8eef);
    border-color: #4a9eff;
    color: white;
  }

  /* PIN gate */
  .pin-overlay {
    position: fixed; inset: 0; background: #0e1118;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
  }
  .pin-overlay.hidden { display: none; }
  .pin-card {
    background: #131720; border: 1px solid #2a3040;
    border-radius: 16px; padding: 28px 22px; width: 100%; max-width: 320px;
    text-align: center;
  }
  .pin-card h2 { font-size: 18px; margin-bottom: 6px; }
  .pin-card .sub { color: #8a93aa; font-size: 13px; margin-bottom: 18px; }
  .pin-card input {
    width: 100%; background: #0e1118; border: 1px solid #2a3040;
    border-radius: 10px; color: #e8edf5; padding: 14px;
    font-size: 22px; text-align: center; letter-spacing: 0.4em;
    font-family: 'IBM Plex Mono', monospace; margin-bottom: 12px;
    -webkit-appearance: none;
  }
  .pin-card input:focus { border-color: #4a9eff; outline: none; }
  .pin-card button {
    width: 100%; background: #4a9eff; color: white; border: 0;
    border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700;
    cursor: pointer;
  }
  .pin-card button:disabled { opacity: 0.5; cursor: not-allowed; }
  .pin-card .err {
    color: #ff4757; font-size: 13px; margin-top: 10px; min-height: 18px;
  }
</style>
</head>
<body>

<div class="pin-overlay" id="pin-overlay">
  <div class="pin-card">
    <h2>🐜 Tech Dashboard</h2>
    <div class="sub">enter your 4-digit PIN to unlock</div>
    <input id="pin-input" type="tel" inputmode="numeric" maxlength="4" autocomplete="off">
    <button id="pin-submit" onclick="submitPin()">Unlock</button>
    <div class="err" id="pin-err"></div>
  </div>
</div>

<div class="header">
  <div class="icon">🐜</div>
  <div class="text">
    <div class="title">Tech Ant</div>
    <div class="sub" id="header-sub">Loading...</div>
  </div>
  <button class="refresh-btn" id="refresh-btn" onclick="init()" title="Refresh" aria-label="Refresh">↻</button>
  <div class="badge">LIVE</div>
</div>

<div class="map-panel" id="map-panel">
  <div class="empty" id="map-empty">Loading map...</div>
</div>

<div class="stop-list" id="stop-list">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading today's stops...</div>
  </div>
</div>

<script>
const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const API_VERIFY_PIN = '/.netlify/functions/verify-pin-proxy';

const params = new URLSearchParams(window.location.search);
const TECH_ID = params.get('tech_id');

let isLoading = false;

async function init() {
  if (!TECH_ID) {
    showError('Missing tech_id', 'This page needs tech_id in the URL.');
    return;
  }
  if (isLoading) return;

  isLoading = true;
  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.disabled = true;
  refreshBtn.classList.add('spinning');

  const todayStr = new Date().toLocaleDateString('en-US', {
    timeZone: 'America/Chicago',
    weekday: 'short',
    month: 'short',
    day: 'numeric'
  });

  try {
    // Route through xano-proxy so query params land correctly on the GET endpoint
    // (direct fetch was getting page=0/per_page=0 because Xano GET optional ints
    // default to 0, not null, so the ?? 1 fallback never fired).
    const res = await fetch('/.netlify/functions/xano-proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        endpoint: 'get_jobs_for_dashboard',
        payload: {
          tech_id: parseInt(TECH_ID, 10),
          date_filter: 'today',
          page: 1,
          per_page: 50
        },
        method: 'POST'
      })
    });
    if (!res.ok) throw new Error(`Could not load jobs (${res.status})`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'no success flag');

    const items = Array.isArray(data.items) ? data.items : [];

    let techName = `Tech ${TECH_ID}`;
    if (items.length > 0 && items[0].tech && items[0].tech.first_name) {
      techName = items[0].tech.first_name;
    }
    const subParts = [techName, todayStr];
    if (items.length === 0) {
      subParts.push('nothing on the books today');
    }
    document.getElementById('header-sub').textContent = subParts.join(' • ');

    renderMap(items);
    renderStops(items);
  } catch (err) {
    showError('Could not load dashboard', err.message);
  } finally {
    isLoading = false;
    refreshBtn.disabled = false;
    refreshBtn.classList.remove('spinning');
  }
}

function renderMap(items) {
  const mapPanel = document.getElementById('map-panel');
  const addresses = items
    .map(it => buildFullAddress(it.customer))
    .filter(a => a && a.length > 0);

  if (addresses.length === 0) {
    mapPanel.innerHTML = '<div class="empty">no stops today</div>';
    return;
  }

  // Clickable Route Summary panel. Drops the iframe entirely (multi-stop
  // /dir/ URLs are X-Frame-blocked by Google, and single-stop embeds didn't
  // visually represent the route). Tapping the panel opens the full route
  // in Google Maps app / new tab. Per-stop Navigate buttons in the cards
  // below handle the single-stop case.
  const routeUrl = 'https://www.google.com/maps/dir/' +
    addresses.map(encodeURIComponent).join('/');
  const stopWord = addresses.length === 1 ? 'stop' : 'stops';

  mapPanel.innerHTML = `
    <a class="route-summary" href="${escapeHtml(routeUrl)}" target="_blank" rel="noopener noreferrer">
      <div class="route-icon">🗺</div>
      <div class="route-text">
        <div class="route-title">View Route</div>
        <div class="route-sub">${addresses.length} ${stopWord} · tap to open in Google Maps</div>
      </div>
      <div class="route-arrow">→</div>
    </a>
  `;
}

function renderStops(items) {
  const list = document.getElementById('stop-list');
  if (items.length === 0) {
    list.innerHTML = '<div class="empty-stops">no stops scheduled today</div>';
    return;
  }
  list.innerHTML = items.map((it, i) => buildStopCard(it, i + 1)).join('');
}

const KNOWN_STATUSES = [
  'scheduled', 'in_progress', 'completed', 'complete', 'canceled',
  'awaiting_parts', 'parts_ordered', 'broadcasting', 'pending_auth',
  'ready', 'pending', 'closed'
];

function buildStopCard(it, num) {
  const job = it.job || {};
  const cust = it.customer || {};
  const status = job.scheduling_status || 'default';
  const badgeClass = KNOWN_STATUSES.includes(status) ? status : 'default';
  const timeStr = formatTimeCT(job.scheduled_start);
  const custName = [cust.first_name, cust.last_name].filter(Boolean).join(' ') || 'Customer';
  const apl = [job.brand, job.appliance_type].filter(Boolean).join(' ') || 'Appliance';
  const city = cust.city || '';
  const fullAddr = buildFullAddress(cust);
  const hasAddr = !!fullAddr;
  const navUrl = hasAddr ? 'https://maps.google.com/?q=' + encodeURIComponent(fullAddr) : '';
  const openUrl = `tech-ant-live.html?job_id=${job.id}&tech_id=${TECH_ID}`;

  const navBtn = hasAddr
    ? `<button onclick="window.open('${escapeAttr(navUrl)}', '_blank')">📍 Navigate</button>`
    : `<button disabled title="no address on file">📍 Navigate</button>`;

  return `
    <div class="stop-card">
      <div class="stop-num">${num}</div>
      <div class="stop-body">
        <div class="stop-top">
          <div class="stop-time">${escapeHtml(timeStr)}</div>
          <div class="stop-badge ${badgeClass}">${escapeHtml(status.replace(/_/g, ' '))}</div>
        </div>
        <div class="stop-customer">${escapeHtml(custName)}</div>
        <div class="stop-appliance">${escapeHtml(apl)}</div>
        <div class="stop-city">${escapeHtml(city)}</div>
        <div class="stop-actions">
          ${navBtn}
          <button class="primary" onclick="window.location.href='${escapeAttr(openUrl)}'">🐜 Open Job</button>
        </div>
      </div>
    </div>
  `;
}

function buildFullAddress(cust) {
  if (!cust) return '';
  const parts = [cust.address, cust.city, cust.state, cust.zip].filter(Boolean);
  return parts.join(', ');
}

function formatTimeCT(ms) {
  if (!ms) return '—';
  return new Date(ms).toLocaleTimeString('en-US', {
    timeZone: 'America/Chicago',
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  }).toLowerCase().replace(/\s/g, '');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/'/g, '%27');
}

function showError(title, msg) {
  document.getElementById('header-sub').textContent = title;
  document.getElementById('map-panel').innerHTML = `<div class="empty">${escapeHtml(msg)}</div>`;
  document.getElementById('stop-list').innerHTML = `<div class="empty-stops">⚠️ ${escapeHtml(msg)}</div>`;
}

// PIN gate.
async function submitPin() {
  const errEl = document.getElementById('pin-err');
  const btn = document.getElementById('pin-submit');
  const inputEl = document.getElementById('pin-input');
  const pin = (inputEl.value || '').trim();
  errEl.textContent = '';
  if (!/^\d{4}$/.test(pin)) {
    errEl.textContent = 'Enter your 4-digit PIN';
    return;
  }
  if (!TECH_ID) {
    errEl.textContent = 'Missing tech_id in URL';
    return;
  }
  btn.disabled = true; btn.textContent = 'Checking...';
  try {
    const res = await fetch(API_VERIFY_PIN, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ technician_id: parseInt(TECH_ID, 10), pin })
    });
    const data = await res.json();
    if (data.success === true) {
      document.getElementById('pin-overlay').classList.add('hidden');
      init();
    } else {
      errEl.textContent = 'Wrong PIN. Try again.';
      inputEl.value = ''; inputEl.focus();
    }
  } catch (e) {
    errEl.textContent = 'Connection error. Try again.';
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

document.getElementById('pin-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') submitPin();
});
document.getElementById('pin-input').focus();
</script>
</body>
</html>
