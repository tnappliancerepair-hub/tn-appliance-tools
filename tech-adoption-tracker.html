<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tech Ant Adoption — Appliance Ant</title>
<style>
  :root{
    --bg:#0c0f14;--panel:#141922;--panel-2:#1b212c;--line:#26303d;
    --ink:#e8edf4;--ink-dim:#8c98a8;--ink-faint:#5b6874;
    --accent:#3ddc97;--accent-dim:#1d6b4d;--warn:#f0b429;--bad:#ef5350;--cold:#5b6874;
    --chip:#222b38;--radius:10px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  /* gate */
  #gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%,#16202c 0%,var(--bg) 60%)}
  .gate-card{width:min(360px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:28px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .gate-card .ant{font-size:30px;display:block;margin-bottom:10px}
  .gate-card h1{font-size:18px;margin:0 0 4px;letter-spacing:.3px}
  .gate-card p{color:var(--ink-dim);font-size:13px;margin:0 0 18px}
  .gate-card input{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line);
    border-radius:8px;color:var(--ink);font-size:15px;text-align:center;letter-spacing:2px}
  .gate-card input:focus{outline:none;border-color:var(--accent)}
  .gate-card button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:8px;
    background:var(--accent);color:#06110b;font-weight:700;font-size:15px;cursor:pointer}
  .gate-err{color:var(--bad);font-size:12px;min-height:16px;margin-top:8px}

  /* header */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,var(--panel) 0%,rgba(20,25,34,.6) 100%)}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
  header h1 .ant{color:var(--accent)}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-dim);font-family:var(--mono)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
  .dot.stale{background:var(--bad);animation:none}
  .spacer{flex:1}
  .pill{font-size:12px;font-family:var(--mono);background:var(--chip);color:var(--ink-dim);padding:4px 10px;border-radius:20px}
  .pill b{color:var(--accent)}
  header button.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:7px 11px;border-radius:8px;font-size:13px;cursor:pointer}
  .meta{font-size:11px;color:var(--ink-faint);font-family:var(--mono)}

  /* body */
  .wrap{padding:20px;max-width:980px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .tech{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;position:relative;overflow:hidden}
  .tech .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
  .tech.hot .stripe{background:var(--accent)}
  .tech.warm .stripe{background:var(--warn)}
  .tech.cold .stripe{background:var(--cold)}
  .tech .name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .tech .region{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
  .status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
  .status.hot{background:#16302a;color:var(--accent)}
  .status.warm{background:#33290c;color:var(--warn)}
  .status.cold{background:#1f262f;color:var(--cold)}
  .nums{display:flex;gap:18px;margin-top:14px}
  .num .v{font-size:22px;font-weight:700;font-family:var(--mono)}
  .num .v.zero{color:var(--ink-faint)}
  .num .l{font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .last{font-size:12px;color:var(--ink-dim);margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
  .last b{color:var(--ink)}
  .empty{color:var(--ink-faint);font-size:14px;text-align:center;padding:60px 0;font-style:italic}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}
  .toast.show{opacity:1}.toast.err{border-color:var(--bad);color:#ffd6d4}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <span class="ant">🐜</span>
    <h1>Tech Ant Adoption</h1>
    <p>Enter the office passcode.</p>
    <input id="pw" type="password" inputmode="numeric" placeholder="passcode" autocomplete="off" />
    <div class="gate-err" id="gateErr"></div>
    <button id="gateBtn">Unlock</button>
  </div>
</div>

<header style="display:none" id="appHeader">
  <h1><span class="ant">🐜</span> Tech Ant Adoption</h1>
  <span class="live"><span class="dot" id="liveDot"></span><span id="liveTxt">connecting…</span></span>
  <span class="pill"><b id="activeCount">0</b>/<span id="totalCount">0</span> active 24h</span>
  <div class="spacer"></div>
  <button class="ghost" id="refreshBtn">↻ Refresh</button>
  <span class="meta" id="updated"></span>
</header>

<div class="wrap" id="wrap" style="display:none"><div class="grid" id="grid"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   CONFIG — CHECK THESE
   ----------------------------------------------------------------
   ENDPOINT : GET — per-tech Tech Ant usage. Accepts either:
                { "techs":[ <row>, ... ] }  or a bare array.

   <row> fields used (all optional):
     tech_id(1..6) / id,  tech_name / name,
     used_24h / count_24h / sessions_24h   (number),
     used_7d  / count_7d  / sessions_7d    (number),
     last_used_at / last_session_at / last_used  (timestamp)

   If you don't have a dedicated endpoint yet, this can point at a
   query over tech_assist_session (table ID 29) grouped by tech with
   24h / 7d counts and a max(created_at). Falls back gracefully:
   missing techs show as COLD with zeros so gaps are obvious.
   ================================================================ */
  const XANO_BASE = "https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA";
  const ENDPOINT  = XANO_BASE + "/get_tech_adoption";   // <-- confirm/replace
  const OFFICE_PASS = "CHANGE_ME";                      // <-- set real passcode
  const POLL_MS   = 30000;

  // Active roster (drives the "all techs shown even at zero" view).
  // id -> {name, region}. Teddy(1) is remote/owner — included but you may hide.
  const ROSTER = {
    2:{name:"Jimmy", region:"S Nashville / Murfreesboro"},
    3:{name:"Andre", region:"NOLA / Metairie / Kenner"},
    4:{name:"Lee",   region:"Clarksville / West Nashville"},
    5:{name:"Billy", region:"Hammond / North Shore LA"},
    6:{name:"John",  region:"Baton Rouge / Walker LA"},
  };

/* ---------------- gate ---------------- */
  let unlocked=false; const $=(id)=>document.getElementById(id);
  function tryUnlock(){
    if($("pw").value.trim()===OFFICE_PASS){
      unlocked=true;$("gate").style.display="none";
      $("appHeader").style.display="flex";$("wrap").style.display="block";start();
    }else{$("gateErr").textContent="Wrong passcode.";$("pw").value="";}
  }
  $("gateBtn").addEventListener("click",tryUnlock);
  $("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock();});
  $("pw").focus();

/* ---------------- fetch + normalize ---------------- */
  let timer=null;
  const numOf=(...v)=>{for(const x of v){if(typeof x==="number")return x;if(x!=null&&!isNaN(+x))return +x;}return 0;};

  async function load(){
    try{
      const r=await fetch(ENDPOINT,{headers:{"Accept":"application/json"}});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const data=await r.json();
      const rows=Array.isArray(data)?data:(Array.isArray(data?.techs)?data.techs:[]);
      setLive(true);render(rows);stamp();
    }catch(err){ setLive(false); render([],err.message); }
  }
  function setLive(ok){const d=$("liveDot"),t=$("liveTxt");if(ok){d.classList.remove("stale");t.textContent="live";}else{d.classList.add("stale");t.textContent="offline";}}
  function stamp(){$("updated").textContent="updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});}

/* ---------------- render ---------------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function ago(ts){
    if(!ts) return null;
    const d=new Date(ts); if(isNaN(d)) return null;
    const mins=Math.floor((Date.now()-d.getTime())/60000);
    if(mins<1) return "just now";
    if(mins<60) return mins+"m ago";
    const hrs=Math.floor(mins/60); if(hrs<24) return hrs+"h ago";
    const days=Math.floor(hrs/24); return days+"d ago";
  }
  function tierFor(u24,u7){ if(u24>0) return "hot"; if(u7>0) return "warm"; return "cold"; }
  function tierLabel(t){ return t==="hot"?"Active":t==="warm"?"This week":"Cold"; }

  function render(rows,errMsg){
    // index incoming by tech_id
    const byId={};
    rows.forEach(r=>{ const id=r.tech_id??r.id; if(id!=null) byId[id]=r; });

    const ids=Object.keys(ROSTER).map(Number);
    let active=0;
    const cards=ids.map(id=>{
      const r=byId[id]||{};
      const name=r.tech_name||r.name||ROSTER[id].name;
      const region=ROSTER[id].region;
      const u24=numOf(r.used_24h,r.count_24h,r.sessions_24h);
      const u7 =numOf(r.used_7d,r.count_7d,r.sessions_7d);
      const last=ago(r.last_used_at||r.last_session_at||r.last_used);
      const tier=tierFor(u24,u7);
      if(u24>0) active++;
      return `<div class="tech ${tier}">
        <div class="stripe"></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div><div class="name">${esc(name)}</div><div class="region">${esc(region)}</div></div>
          <span class="status ${tier}">${tierLabel(tier)}</span>
        </div>
        <div class="nums">
          <div class="num"><div class="v ${u24?'':'zero'}">${u24}</div><div class="l">last 24h</div></div>
          <div class="num"><div class="v ${u7?'':'zero'}">${u7}</div><div class="l">last 7d</div></div>
        </div>
        <div class="last">${last?`Last used <b>${esc(last)}</b>`:"Hasn't used Tech Ant yet"}</div>
      </div>`;
    }).join("");

    $("activeCount").textContent=active;
    $("totalCount").textContent=ids.length;
    $("grid").innerHTML=cards;
    if(errMsg) toast("Fetch failed: "+errMsg+" — showing roster at zero",true);
  }

/* ---------------- loop ---------------- */
  function start(){load();timer=setInterval(load,POLL_MS);}
  $("refreshBtn").addEventListener("click",load);
  let toastTimer=null;
  function toast(msg,err){const t=$("toast");t.textContent=msg;t.className="toast show"+(err?" err":"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className="toast",4500);}
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){clearInterval(timer);}
    else if(unlocked){load();timer=setInterval(load,POLL_MS);}
  });
</script>
</body>
</html>
