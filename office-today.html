<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Office Today — TN Appliance Exchange</title>
<style>
  :root {
    --bg: #0e1118;
    --panel: #131720;
    --panel-2: #1e2433;
    --border: #2a3040;
    --text: #e8edf5;
    --muted: #8a93aa;
    --accent: #f5a623;
    --green: #74e3c4;
    --blue: #4a9eff;
    --red: #f87171;
    --violet: #b48cff;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.4; }

  .auth-overlay {
    position: fixed; inset: 0; background: var(--bg); display: flex;
    align-items: center; justify-content: center; z-index: 9999; padding: 20px;
  }
  .auth-overlay.hidden { display: none; }
  .auth-card { background: var(--panel); padding: 28px; border-radius: 12px; border: 1px solid var(--border); max-width: 360px; width: 100%; }
  .auth-card h2 { font-size: 18px; margin-bottom: 6px; }
  .auth-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .auth-card input { width: 100%; padding: 10px 12px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 15px; margin-bottom: 10px; }
  .auth-card button { width: 100%; padding: 12px; background: var(--blue); color: white; border: 0; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .auth-card .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }

  .header {
    background: linear-gradient(135deg, var(--bg), #131a2a);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .header .icon { font-size: 22px; }
  .header h1 { font-size: 16px; font-weight: 700; }
  .header .sub { color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
  .header .refresh-btn {
    margin-left: auto; background: transparent; border: 1px solid var(--border);
    color: var(--text); width: 32px; height: 32px; border-radius: 50%;
    font-size: 16px; cursor: pointer; -webkit-appearance: none;
  }
  .header .refresh-btn.spinning { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .view-toggle {
    display: flex; gap: 4px; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .view-toggle button {
    flex: 1; padding: 8px 12px; background: transparent;
    border: 1px solid var(--border); border-radius: 6px; color: var(--muted);
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .view-toggle button.active {
    background: var(--blue); border-color: var(--blue); color: white;
  }

  .batch-bar {
    background: linear-gradient(135deg, rgba(180,140,255,0.12), rgba(74,158,255,0.10));
    border: 1px solid rgba(180,140,255,0.30);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .batch-bar .label { font-size: 12px; color: var(--text); margin-right: 4px; font-weight: 600; }

  .queue-card-wrapper { position: relative; }
  .queue-card-wrapper .priority-stripe {
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    border-top-left-radius: 10px; border-bottom-left-radius: 10px;
  }
  .priority-stripe.p1 { background: var(--red); }
  .priority-stripe.p2 { background: var(--accent); }
  .priority-stripe.p3 { background: var(--blue); }
  .priority-stripe.p4 { background: var(--muted); }

  .counts-bar {
    display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .counts-bar::-webkit-scrollbar { display: none; }
  .count-pill {
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 600;
    color: var(--muted); white-space: nowrap; flex-shrink: 0; cursor: pointer;
    user-select: none;
  }
  .count-pill.active { background: var(--blue); border-color: var(--blue); color: white; }
  .count-pill .n { font-weight: 700; margin-right: 4px; }

  .feed { padding: 12px; max-width: 1100px; margin: 0 auto; }

  .section { margin-bottom: 24px; }
  .section-head {
    display: flex; align-items: baseline; gap: 8px; padding: 0 4px 8px;
    border-bottom: 1px solid var(--border); margin-bottom: 12px;
  }
  .section-head .title { font-size: 14px; font-weight: 700; letter-spacing: 0.2px; }
  .section-head .badge {
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 1px 8px; border-radius: 10px; font-size: 11px; color: var(--muted);
  }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 10px;
  }
  .card .top {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .card .top .jobid {
    background: var(--panel-2); padding: 2px 8px; border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted);
  }
  .card .top .age {
    background: var(--panel-2); padding: 2px 8px; border-radius: 4px;
    font-size: 11px; color: var(--muted); border: 1px solid var(--border);
  }
  .card .top .age.warn { color: var(--warn); border-color: rgba(251,191,36,0.3); }
  .card .top .age.bad  { color: var(--red);  border-color: rgba(248,113,113,0.3); }
  .card .name { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .card .reason { color: var(--muted); font-size: 13px; margin-bottom: 10px; }

  /* Paste-ready field row (Danielle's desktop workflow) */
  .field-row {
    display: grid; grid-template-columns: 140px 1fr auto;
    gap: 6px; padding: 6px 0; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
  }
  .field-row:first-of-type { border-top: 0; }
  .field-row .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .field-row .value { color: var(--text); word-break: break-word; user-select: text; }
  .field-row .copy-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); width: 28px; height: 28px; border-radius: 4px;
    cursor: pointer; font-size: 12px; padding: 0;
  }
  .field-row .copy-btn:hover { background: var(--panel-2); color: var(--accent); }
  .field-row .copy-btn.copied { background: var(--green); color: black; border-color: var(--green); }

  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    padding: 8px 14px; border: 0; border-radius: 6px; font-weight: 600;
    font-size: 13px; cursor: pointer; -webkit-appearance: none;
    font-family: inherit;
  }
  .btn-primary  { background: var(--blue);    color: white; }
  .btn-portal   { background: var(--violet);  color: white; }
  .btn-secondary{ background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn:hover { opacity: 0.92; }
  .btn:active { transform: scale(0.97); }

  /* Mark submitted modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 10001;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px; max-width: 460px; width: 100%;
  }
  .modal h3 { font-size: 16px; margin-bottom: 4px; }
  .modal .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .modal label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .modal input, .modal textarea {
    width: 100%; padding: 10px 12px; background: var(--panel-2);
    color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; margin-bottom: 12px; font-family: inherit;
  }
  .modal textarea { resize: vertical; min-height: 60px; }
  .modal .actions { margin-top: 4px; }
  .btn-success { background: var(--green); color: black; }

  .empty {
    background: var(--panel); border: 1px dashed var(--border);
    padding: 24px; text-align: center; border-radius: 10px;
    color: var(--muted); font-size: 13px;
  }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite; margin: 0 auto 10px;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: black; padding: 10px 18px;
    border-radius: 6px; font-weight: 700; font-size: 13px; z-index: 10000;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Desktop: 2-column when wide enough */
  @media (min-width: 920px) {
    .feed { padding: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .section.full-width { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-card">
    <h2>🐜 Office Today</h2>
    <div class="sub">enter office password to continue</div>
    <input id="auth-input" type="password" autocomplete="current-password" placeholder="password">
    <button id="auth-submit" onclick="submitAuth()">Unlock</button>
    <div class="err" id="auth-err"></div>
  </div>
</div>

<div class="header">
  <div class="icon">🐜</div>
  <div>
    <h1>Office Today</h1>
    <div class="sub" id="header-sub">Loading...</div>
  </div>
  <button class="refresh-btn" id="refresh-btn" onclick="load()" title="Refresh">↻</button>
</div>

<div class="view-toggle">
  <button id="vt-queue" class="active" onclick="setViewMode('queue')">▼ Priority Queue</button>
  <button id="vt-sections" onclick="setViewMode('sections')">▦ Sections</button>
  <button id="vt-walk" onclick="setViewMode('walk')">🐜 Walk me through</button>
</div>

<div class="counts-bar" id="counts-bar"></div>

<div class="feed" id="feed">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading your priorities...</div>
  </div>
</div>

<div class="toast" id="toast">Copied!</div>

<!-- Mark submitted modal -->
<div class="modal-overlay" id="submit-modal">
  <div class="modal">
    <h3>Mark submission complete</h3>
    <div class="sub">Job #<span id="sm-job-id"></span> · <span id="sm-vendor"></span></div>
    <label>Vendor confirmation # (required)</label>
    <input id="sm-conf" type="text" placeholder="e.g. AHS123456789" autocomplete="off">
    <label>Notes (optional)</label>
    <textarea id="sm-notes" placeholder="anything to remember about this submission"></textarea>
    <div class="actions">
      <button class="btn btn-success" id="sm-confirm">✓ Mark submitted</button>
      <button class="btn btn-secondary" onclick="closeSubmitModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const AUTH_KEY = 'tn_office_auth_v1';

async function __verifyOfficePassword(pw) {
  const r = await fetch(XANO_BASE + '/verify_office_password', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({password: pw}),
    signal: AbortSignal.timeout(10000),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  return d && d.success === true;
}

async function submitAuth() {
  const btn = document.getElementById('auth-submit');
  const err = document.getElementById('auth-err');
  const pw = document.getElementById('auth-input').value.trim();
  err.textContent = '';
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Authenticating…';
  try {
    const ok = await __verifyOfficePassword(pw);
    if (!ok) { err.textContent = 'Wrong password.'; return; }
    localStorage.setItem(AUTH_KEY, '1');
    document.getElementById('auth-overlay').classList.add('hidden');
    load();
  } catch (e) {
    err.textContent = 'Server error — try again.';
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

document.getElementById('auth-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') submitAuth();
});

if (localStorage.getItem(AUTH_KEY) === '1') {
  document.getElementById('auth-overlay').classList.add('hidden');
  load();
} else {
  setTimeout(() => document.getElementById('auth-input').focus(), 100);
}

let pollTimer = null;

async function load() {
  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.classList.add('spinning');
  try {
    const r = await fetch(XANO_BASE + '/get_office_today');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d);
  } catch (e) {
    document.getElementById('feed').innerHTML = `<div class="empty">⚠️ Could not load: ${escapeHtml(e.message)}</div>`;
  } finally {
    refreshBtn.classList.remove('spinning');
  }
  // Auto-refresh every 30s
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(load, 30000);
}

function render(d) {
  const c = d.counts || {};
  document.getElementById('header-sub').textContent =
    new Date(d.as_of_ms).toLocaleTimeString('en-US', {timeZone: 'America/Chicago', hour: '2-digit', minute: '2-digit'}) + ' CT';

  // Counts bar (jump-to-section)
  const countsBar = document.getElementById('counts-bar');
  const totalUrgent = (c.escalations||0) + (c.warranty_submissions_due||0) + (c.stuck_intake||0) + (c.unpaid_self_pay||0) + (c.voicemail_queue||0);
  countsBar.innerHTML = totalUrgent === 0
    ? `<div class="count-pill" style="background:rgba(116,227,196,0.15); border-color:rgba(116,227,196,0.4); color:var(--green)">✓ all clear</div>`
    : `
      <div class="count-pill" onclick="document.getElementById('section-escalations').scrollIntoView({behavior:'smooth'})"><span class="n">${c.escalations||0}</span>escalations</div>
      <div class="count-pill" onclick="document.getElementById('section-voicemail').scrollIntoView({behavior:'smooth'})"><span class="n">${c.voicemail_queue||0}</span>voicemails</div>
      <div class="count-pill" onclick="document.getElementById('section-warranty').scrollIntoView({behavior:'smooth'})"><span class="n">${c.warranty_submissions_due||0}</span>warranty</div>
      <div class="count-pill" onclick="document.getElementById('section-stuck').scrollIntoView({behavior:'smooth'})"><span class="n">${c.stuck_intake||0}</span>stuck intake</div>
      <div class="count-pill" onclick="document.getElementById('section-unpaid').scrollIntoView({behavior:'smooth'})"><span class="n">${c.unpaid_self_pay||0}</span>unpaid</div>`;

  __lastData = d;
  renderFeed();
}

let __lastData = null;
let __viewMode = 'queue'; // 'queue' | 'sections'
try { __viewMode = localStorage.getItem('office_today_view') || 'queue'; } catch (_) {}

function setViewMode(mode) {
  __viewMode = mode;
  try { localStorage.setItem('office_today_view', mode); } catch (_) {}
  document.getElementById('vt-queue').classList.toggle('active', mode === 'queue');
  document.getElementById('vt-sections').classList.toggle('active', mode === 'sections');
  if (__lastData) renderFeed();
}

function renderFeed() {
  const d = __lastData || {};
  const feed = document.getElementById('feed');
  if (__viewMode === 'queue') {
    feed.innerHTML = renderQueueView(d);
  } else if (__viewMode === 'walk') {
    feed.innerHTML = renderWalkView(d);
  } else {
    feed.innerHTML = renderSectionsView(d);
  }
}

// ── D: walk-me-through mode — one card at a time, big, with prev/next ──
let __walkIdx = 0;
function renderWalkView(d) {
  const items = buildPriorityList(d);
  if (items.length === 0) {
    return `<div class="empty" style="text-align:center; padding:60px 24px">
      <div style="font-size:48px; margin-bottom:14px">🐜</div>
      <div style="font-size:18px; font-weight:700; margin-bottom:6px">All clear ✓</div>
      <div style="color:var(--muted)">Nothing needs you right now. Go do real life.</div>
    </div>`;
  }
  if (__walkIdx >= items.length) __walkIdx = 0;
  const it = items[__walkIdx];
  const prevIdx = (__walkIdx - 1 + items.length) % items.length;
  const nextIdx = (__walkIdx + 1) % items.length;

  return `
    <div style="display:flex; flex-direction:column; gap:14px; max-width:680px; margin:0 auto">
      <div style="display:flex; justify-content:center; gap:8px; align-items:center">
        <span class="count-pill" style="background:var(--panel-2)">${__walkIdx + 1} of ${items.length}</span>
        <span class="count-pill" style="background:rgba(180,140,255,0.18); border-color:rgba(180,140,255,0.4); color:var(--violet)">${kindLabel(it.kind)}</span>
      </div>

      <div class="queue-card-wrapper">
        <div class="priority-stripe p${it.p}"></div>
        ${it.html}
      </div>

      <div style="display:flex; gap:8px; justify-content:center; padding:8px 0 24px">
        <button class="count-pill" onclick="walkPrev()" style="cursor:pointer; padding:10px 16px">← previous</button>
        <button class="count-pill" onclick="walkSkip()" style="cursor:pointer; padding:10px 16px; background:rgba(245,166,35,0.12); border-color:rgba(245,166,35,0.3); color:var(--accent)">skip for now</button>
        <button class="count-pill" onclick="walkNext()" style="cursor:pointer; padding:10px 16px; background:var(--blue); border-color:var(--blue); color:white">next →</button>
      </div>
    </div>
  `;
}

function buildPriorityList(d) {
  const items = [];
  for (const e of (d.escalations || [])) {
    items.push({ p: 1, age: e.age_hours || 0, html: renderEscalation(e), kind: 'esc' });
  }
  for (const v of (d.voicemail_queue || [])) {
    items.push({ p: 1, age: -(v.age_hours || 0), html: renderVoicemail(v), kind: 'vm' });
  }
  for (const w of (d.warranty_submissions_due || [])) {
    items.push({ p: 2, age: w.age_hours || 0, html: renderWarrantyCard(w), kind: 'war' });
  }
  for (const s of (d.stuck_intake || [])) {
    items.push({ p: 3, age: (s.age_days || 0) * 24, html: renderStuck(s), kind: 'stuck' });
  }
  for (const u of (d.unpaid_self_pay || [])) {
    items.push({ p: 4, age: (u.age_days || 0) * 24, html: renderUnpaid(u), kind: 'unpaid' });
  }
  items.sort((a, b) => a.p - b.p || b.age - a.age);
  return items;
}

function kindLabel(k) {
  return ({
    esc: '🚨 escalation',
    vm: '📞 voicemail',
    war: '📋 warranty',
    stuck: '⚠️ stuck',
    unpaid: '💵 unpaid'
  })[k] || k;
}

function walkPrev() {
  const items = buildPriorityList(__lastData || {});
  if (items.length === 0) return;
  __walkIdx = (__walkIdx - 1 + items.length) % items.length;
  renderFeed();
}
function walkNext() {
  const items = buildPriorityList(__lastData || {});
  if (items.length === 0) return;
  __walkIdx = (__walkIdx + 1) % items.length;
  renderFeed();
}
function walkSkip() { walkNext(); }

// ── B + C: hide empty sections + smart warranty batch actions ────
function renderSectionsView(d) {
  // Each section only renders when its array is non-empty (auto-hide).
  const blocks = [];

  if ((d.voicemail_queue||[]).length > 0) {
    blocks.push(`<div class="section full-width" id="section-voicemail">
      <div class="section-head"><span class="title">📞 Voicemail queue (Vapi fall-through)</span><span class="badge">${d.voicemail_queue.length} items</span></div>
      ${d.voicemail_queue.map(renderVoicemail).join('')}
    </div>`);
  }

  if ((d.warranty_submissions_due||[]).length > 0) {
    blocks.push(`<div class="section full-width" id="section-warranty">
      <div class="section-head"><span class="title">📋 Warranty submissions due</span><span class="badge">${d.warranty_submissions_due.length} items</span></div>
      ${renderWarrantyBatchBar(d.warranty_submissions_due)}
      ${d.warranty_submissions_due.map(renderWarrantyCard).join('')}
    </div>`);
  }

  const escAndStuck = [];
  if ((d.escalations||[]).length > 0) {
    escAndStuck.push(`<div class="section" id="section-escalations">
      <div class="section-head"><span class="title">🚨 Escalations</span><span class="badge">${d.escalations.length} items</span></div>
      ${d.escalations.map(renderEscalation).join('')}
    </div>`);
  }
  if ((d.stuck_intake||[]).length > 0) {
    escAndStuck.push(`<div class="section" id="section-stuck">
      <div class="section-head"><span class="title">⚠️ Stuck intake</span><span class="badge">${d.stuck_intake.length} items</span></div>
      ${d.stuck_intake.map(renderStuck).join('')}
    </div>`);
  }
  if (escAndStuck.length > 0) {
    blocks.push(`<div class="grid-2">${escAndStuck.join('')}</div>`);
  }

  if ((d.unpaid_self_pay||[]).length > 0) {
    blocks.push(`<div class="section full-width" id="section-unpaid">
      <div class="section-head"><span class="title">💵 Unpaid self-pay (&gt; 7 days)</span><span class="badge">${d.unpaid_self_pay.length} items</span></div>
      ${d.unpaid_self_pay.map(renderUnpaid).join('')}
    </div>`);
  }

  if (blocks.length === 0) {
    return `<div class="empty">All clear ✓ Nothing needs your attention right now.</div>`;
  }
  return blocks.join('');
}

// ── A: priority queue (all sections merged + sorted) ────────────
// Priority order: escalations > voicemails > warranty > stuck intake > unpaid.
// Within a priority, sort by age (older first for everything except
// voicemails, where newer comes first since they're time-sensitive).
function renderQueueView(d) {
  const items = [];

  for (const e of (d.escalations || [])) {
    items.push({ p: 1, age: e.age_hours || 0, html: renderEscalation(e), kind: 'esc' });
  }
  for (const v of (d.voicemail_queue || [])) {
    items.push({ p: 1, age: -(v.age_hours || 0), html: renderVoicemail(v), kind: 'vm' });  // negate so newer voicemails sort first
  }
  for (const w of (d.warranty_submissions_due || [])) {
    items.push({ p: 2, age: w.age_hours || 0, html: renderWarrantyCard(w), kind: 'war' });
  }
  for (const s of (d.stuck_intake || [])) {
    items.push({ p: 3, age: (s.age_days || 0) * 24, html: renderStuck(s), kind: 'stuck' });
  }
  for (const u of (d.unpaid_self_pay || [])) {
    items.push({ p: 4, age: (u.age_days || 0) * 24, html: renderUnpaid(u), kind: 'unpaid' });
  }

  if (items.length === 0) {
    return `<div class="empty">All clear ✓ Nothing needs your attention right now.</div>`;
  }

  // Sort by priority then by age (oldest first within priority — except VMs which were negated)
  items.sort((a, b) => a.p - b.p || b.age - a.age);

  // Optional warranty batch bar at top if any warranty items exist
  const batchBar = (d.warranty_submissions_due || []).length > 0
    ? `<div style="margin-bottom:14px">${renderWarrantyBatchBar(d.warranty_submissions_due)}</div>` : '';

  const wrapped = items.map(it => `
    <div class="queue-card-wrapper">
      <div class="priority-stripe p${it.p}"></div>
      ${it.html}
    </div>`).join('');

  return `${batchBar}<div class="section full-width">${wrapped}</div>`;
}

// ── C: warranty batch actions (paste-mass + open all portals) ────
function renderWarrantyBatchBar(rows) {
  if (!rows || rows.length === 0) return '';
  const ahsRows = rows.filter(w => /ahs|frontdoor/i.test(w.warranty_company || ''));
  const spRows  = rows.filter(w => /servicepower|squaretrade|allstate/i.test(w.warranty_company || ''));
  const buttons = [];
  if (ahsRows.length > 0) {
    buttons.push(`<button class="btn btn-portal" onclick="openAllPortals('ahs', ${ahsRows.length})">Open all ${ahsRows.length} AHS portals ↗</button>`);
  }
  if (spRows.length > 0) {
    buttons.push(`<button class="btn btn-portal" onclick="openAllPortals('sp', ${spRows.length})">Open all ${spRows.length} ServicePower portals ↗</button>`);
  }
  buttons.push(`<button class="btn btn-secondary" onclick="copyAllWarrantyPackages()">📋 Copy all ${rows.length} packages</button>`);
  return `<div class="batch-bar"><span class="label">🪄 batch:</span>${buttons.join('')}</div>`;
}

function openAllPortals(vendor, count) {
  if (!confirm(`Open ${count} ${vendor === 'ahs' ? 'AHS' : 'ServicePower'} portal tabs?`)) return;
  const url = vendor === 'ahs'
    ? 'https://login.frontdoorhome.com/'
    : 'https://fss.servicepower.com/FSS7/LoginUserAction.do?MainMenu=Main';
  for (let i = 0; i < Math.min(count, 8); i++) {
    window.open(url, '_blank');
  }
}

function copyAllWarrantyPackages() {
  const d = __lastData || {};
  const rows = d.warranty_submissions_due || [];
  if (rows.length === 0) return;
  const blocks = rows.map(w => {
    const c = w.customer || {};
    const t = w.tech || {};
    const tdr = w.tdr || {};
    const lines = [
      `=== Job #${w.job_id} ===`,
      `Claim #: ${w.claim_number || w.dispatch_id || '(none)'}`,
      `Vendor: ${w.warranty_company || '(unknown)'}`,
      `Customer: ${((c.first_name||'') + ' ' + (c.last_name||'')).trim() || '(no name)'}`,
      `Phone: ${c.phone || ''}`,
      `Address: ${[c.address, c.city, c.state, c.zip].filter(Boolean).join(', ')}`,
      `Appliance: ${[w.brand, w.appliance_type].filter(Boolean).join(' ')}`,
      `Model #: ${w.model_number || '(not captured)'}`,
      `Diagnosis: ${tdr.diagnosis || '(no TDR)'}`,
      `Failed component: ${tdr.failed_component || '(none)'}`,
      `Repair completed: ${tdr.repair_completed || '(none)'}`,
      `Labor hours: ${tdr.labor_time_hours != null ? tdr.labor_time_hours : '(none)'}`,
      `Tech: ${((t.first_name||'') + ' ' + (t.last_name||'')).trim() || '(unassigned)'}`,
    ];
    return lines.join('\n');
  });
  const text = blocks.join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    showToast(`Copied ${rows.length} packages to clipboard`);
  }).catch(() => showToast('Copy failed — check permissions'));
}

function ageBadge(hours) {
  if (hours < 24) return `<span class="age">${Math.round(hours)}h</span>`;
  const days = Math.round(hours / 24);
  if (days < 3) return `<span class="age">${days}d</span>`;
  if (days < 7) return `<span class="age warn">${days}d</span>`;
  return `<span class="age bad">${days}d</span>`;
}

function vendorPortalUrl(company) {
  const c = (company || '').toLowerCase();
  // AHS / Frontdoor contractor portal — OAuth flow
  if (c.includes('ahs') || c.includes('frontdoor')) return 'https://login.frontdoorhome.com/';
  // ServicePower FSS7 (Allstate / SquareTrade route through here)
  if (c.includes('servicepower') || c.includes('squaretrade') || c.includes('allstate')) return 'https://fss.servicepower.com/FSS7/LoginUserAction.do?MainMenu=Main';
  return null;
}

function renderWarrantyCard(w) {
  const c = w.customer || {};
  const t = w.tech || {};
  const tdr = w.tdr || {};
  const custName = ((c.first_name||'') + ' ' + (c.last_name||'')).trim() || '(no name)';
  const addr = [c.address, c.city, c.state, c.zip].filter(Boolean).join(', ');
  const portalUrl = vendorPortalUrl(w.warranty_company);
  const ageH = w.age_hours || 0;

  const fields = [
    { lbl: 'Claim #',          val: w.claim_number || w.dispatch_id || '(none)' },
    { lbl: 'Vendor',           val: w.warranty_company || '(unknown)' },
    { lbl: 'Customer',         val: custName },
    { lbl: 'Phone',            val: c.phone || '(none)' },
    { lbl: 'Address',          val: addr || '(none)' },
    { lbl: 'Email',            val: c.email || '(none)' },
    { lbl: 'Appliance',        val: [w.brand, w.appliance_type].filter(Boolean).join(' ') || '(unknown)' },
    { lbl: 'Model #',          val: w.model_number || '(not captured)' },
    { lbl: 'Serial #',         val: w.serial_number || '(not captured)' },
    { lbl: 'Problem',          val: w.problem_summary || '(none)' },
    { lbl: 'Diagnosis',        val: tdr.diagnosis || '(no TDR)' },
    { lbl: 'Failed component', val: tdr.failed_component || '(none)' },
    { lbl: 'Failure cause',    val: tdr.failure_cause || '(none)' },
    { lbl: 'Repair completed', val: tdr.repair_completed || '(none)' },
    { lbl: 'Labor (hrs)',      val: (tdr.labor_time_hours != null) ? String(tdr.labor_time_hours) : '(none)' },
    { lbl: 'Tech',             val: ((t.first_name||'') + ' ' + (t.last_name||'')).trim() || '(unassigned)' },
  ];

  return `
    <div class="card">
      <div class="top">
        <div class="jobid">#${w.job_id}</div>
        ${ageBadge(ageH)}
        <div class="reason" style="margin:0">awaiting portal submission</div>
      </div>
      <div class="name">${escapeHtml(custName)}</div>
      ${fields.map((f,i) => `
        <div class="field-row">
          <div class="label">${escapeHtml(f.lbl)}</div>
          <div class="value">${escapeHtml(f.val)}</div>
          <button class="copy-btn" onclick="copyField(this, ${i}, '${w.job_id}')" data-val="${escapeAttr(f.val)}" title="Copy">📋</button>
        </div>
      `).join('')}
      <div class="actions">
        ${portalUrl ? `<a class="btn btn-portal" href="${portalUrl}" target="_blank" rel="noopener">Open ${escapeHtml(w.warranty_company || 'vendor')} portal ↗</a>` : ''}
        <a class="btn btn-primary" href="/job-detail.html?job_id=${w.job_id}" target="_blank">Open job ↗</a>
        <button class="btn btn-secondary" onclick="copyAllFields(this)">📋 Copy all fields</button>
        <button class="btn btn-success" onclick="openSubmitModal(${w.job_id}, '${escapeAttr(w.warranty_company || 'vendor')}')">✓ Mark submitted</button>
      </div>
    </div>`;
}

function renderEscalation(e) {
  let m = {};
  try { m = JSON.parse(e.metadata || '{}'); } catch (_) {}
  const label = ({
    warranty_claim_action_persisted     : 'Warranty claim escalated',
    customer_feedback_low_rating_alert  : 'Low rating from customer',
    tech_late_alert                     : 'Tech is running late',
    customer_vent_submitted             : 'Customer vent submitted',
  })[e.action] || e.action;
  const jobId = m.job_id || m.jobId || null;
  return `
    <div class="card">
      <div class="top">
        ${jobId ? `<div class="jobid">#${jobId}</div>` : ''}
        ${ageBadge(e.age_hours || 0)}
      </div>
      <div class="name">${escapeHtml(label)}</div>
      <div class="reason">${escapeHtml((m.reason || m.notes || m.message || '').toString().slice(0, 200) || '(see event log for detail)')}</div>
      ${jobId ? `<div class="actions"><a class="btn btn-primary" href="/job-detail.html?job_id=${jobId}" target="_blank">Open job ↗</a></div>` : ''}
    </div>`;
}

function renderStuck(s) {
  const c = s.customer || {};
  const name = ((c.first_name||'') + ' ' + (c.last_name||'')).trim() || '(no name yet)';
  const phone = c.phone || '';
  return `
    <div class="card">
      <div class="top">
        <div class="jobid">#${s.job_id}</div>
        ${ageBadge((s.age_days||0) * 24)}
      </div>
      <div class="name">${escapeHtml(name)}</div>
      <div class="reason">${escapeHtml(s.intake_source || 'intake')} · ${escapeHtml(s.appliance_type || 'appliance')}${s.warranty_company ? ' · ' + escapeHtml(s.warranty_company) : ''}</div>
      <div class="actions">
        <a class="btn btn-primary" href="/needs-scheduled.html" target="_blank">Open queue ↗</a>
        ${phone ? `<a class="btn btn-secondary" href="tel:${escapeAttr(phone)}">📞 Call</a>` : ''}
      </div>
    </div>`;
}

function renderVoicemail(v) {
  let m = {};
  try { m = JSON.parse(v.metadata || '{}'); } catch (_) {}
  const phone = m.caller_phone || '';
  const transcript = m.transcript || '';
  const intent = m.intent || '';
  const matchedId = m.matched_customer_id || 0;
  const telHref = phone ? `tel:${phone.replace(/[^\d+]/g, '')}` : null;
  return `
    <div class="card">
      <div class="top">
        ${ageBadge(v.age_hours || 0)}
        ${intent ? `<div class="age">${escapeHtml(intent)}</div>` : ''}
      </div>
      <div class="name">${escapeHtml(phone)} ${matchedId ? '✓ known customer' : '(unknown)'}</div>
      <div class="reason" style="white-space:pre-wrap; margin-top:8px">${escapeHtml(transcript.slice(0, 500))}</div>
      <div class="actions">
        ${telHref ? `<a class="btn btn-primary" href="${telHref}">📞 Call back</a>` : ''}
        <button class="btn btn-success" onclick="clearVoicemail(${v.event_id}, this)">✓ Cleared</button>
      </div>
    </div>`;
}

function renderUnpaid(u) {
  const c = u.customer || {};
  const name = ((c.first_name||'') + ' ' + (c.last_name||'')).trim() || '(no name)';
  const phone = c.phone || '';
  return `
    <div class="card">
      <div class="top">
        <div class="jobid">#${u.job_id}</div>
        ${ageBadge((u.age_days||0) * 24)}
      </div>
      <div class="name">${escapeHtml(name)}</div>
      <div class="reason">${escapeHtml(u.appliance_type || 'appliance')}${u.problem_summary ? ' · ' + escapeHtml(u.problem_summary.slice(0,80)) : ''}</div>
      <div class="actions">
        <a class="btn btn-primary" href="/job-detail.html?job_id=${u.job_id}" target="_blank">Open job ↗</a>
        ${phone ? `<a class="btn btn-secondary" href="tel:${escapeAttr(phone)}">📞 Call</a>` : ''}
      </div>
    </div>`;
}

function copyField(btn, idx, jobId) {
  const val = btn.dataset.val || '';
  navigator.clipboard.writeText(val).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓';
    showToast(`Copied: ${val.slice(0, 40)}${val.length > 40 ? '…' : ''}`);
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋'; }, 1500);
  }).catch(() => showToast('Copy failed — select manually'));
}

function copyAllFields(btn) {
  const card = btn.closest('.card');
  const rows = card.querySelectorAll('.field-row');
  const lines = [];
  rows.forEach(r => {
    const lbl = r.querySelector('.label').textContent.trim();
    const val = r.querySelector('.value').textContent.trim();
    lines.push(`${lbl}: ${val}`);
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    showToast(`Copied all ${lines.length} fields`);
  }).catch(() => showToast('Copy failed'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ── Mark submitted modal ─────────────────────────────────────────
let __currentSubmitJobId = null;
let __currentSubmitVendor = '';

function openSubmitModal(jobId, vendor) {
  __currentSubmitJobId = jobId;
  __currentSubmitVendor = vendor || 'vendor';
  document.getElementById('sm-job-id').textContent = jobId;
  document.getElementById('sm-vendor').textContent = vendor;
  document.getElementById('sm-conf').value = '';
  document.getElementById('sm-notes').value = '';
  document.getElementById('submit-modal').classList.add('show');
  setTimeout(() => document.getElementById('sm-conf').focus(), 50);
}

function closeSubmitModal() {
  document.getElementById('submit-modal').classList.remove('show');
  __currentSubmitJobId = null;
  __currentSubmitVendor = '';
}

document.getElementById('submit-modal').addEventListener('click', (e) => {
  if (e.target.id === 'submit-modal') closeSubmitModal();
});

document.getElementById('sm-confirm').addEventListener('click', async () => {
  const jobId = __currentSubmitJobId;
  if (!jobId) return;
  const conf = document.getElementById('sm-conf').value.trim();
  const notes = document.getElementById('sm-notes').value.trim();
  if (!conf) { showToast('Confirmation # required'); document.getElementById('sm-conf').focus(); return; }
  const btn = document.getElementById('sm-confirm');
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await fetch(XANO_BASE + '/record_warranty_submission', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        job_id: jobId,
        confirmation_id: conf,
        vendor: __currentSubmitVendor,
        notes: notes,
      }),
    });
    const d = await r.json();
    if (d && d.success) {
      showToast(`✓ Marked submitted (${conf})`);
      closeSubmitModal();
      load();  // refresh — card will disappear from the list
    } else {
      showToast('Failed: ' + (d.error || 'unknown'));
    }
  } catch (e) {
    showToast('Network error: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '✓ Mark submitted';
  }
});

document.getElementById('sm-conf').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('sm-confirm').click();
});

// Voicemail clear handler
async function clearVoicemail(eventLogId, btn) {
  if (!eventLogId) return;
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await fetch(XANO_BASE + '/clear_voicemail', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ event_log_id: eventLogId, cleared_by: 'Office Today' }),
    });
    const d = await r.json();
    if (d && d.success) {
      showToast('✓ Cleared');
      load();
    } else {
      showToast('Failed: ' + (d.error || 'unknown'));
      btn.disabled = false; btn.textContent = '✓ Cleared';
    }
  } catch (e) {
    showToast('Network error: ' + e.message);
    btn.disabled = false; btn.textContent = '✓ Cleared';
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
