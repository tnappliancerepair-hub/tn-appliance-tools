<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll - Ant Office</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1118; color: #e8edf5; min-height: 100vh; padding: 24px 18px; max-width: 720px; margin: 0 auto; }
  :root { --orange:#f5a623; --green:#00d68f; --red:#ff6b6b; --muted:#8a93aa; --panel:#131720; --border:#2a3040; --bg:#0e1118; }
  .header { text-align: center; padding: 8px 0 20px; }
  .header .ant { font-size: 32px; }
  .header h1 { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
  td.amt { font-family: monospace; color: var(--green); font-weight: 700; text-align: right; }
  td.zero { color: var(--muted); }
  .totals { margin-top: 16px; padding: 14px; background: rgba(0,214,143,0.05); border-radius: 8px; display: flex; justify-content: space-between; font-weight: 700; }
  button.go { width: 100%; padding: 16px; background: var(--orange); color: #1a1208; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 16px; font-size: 14px; }
  button.go:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 14px; padding: 10px; border-radius: 6px; display: none; font-size: 13px; }
  .msg.show { display: block; }
  .msg.ok { background: rgba(0,214,143,0.10); color: var(--green); border: 1px solid var(--green); }
  .msg.err { background: rgba(255,107,107,0.10); color: var(--red); border: 1px solid var(--red); }
  .auth { position: fixed; inset: 0; background: rgba(14,17,24,0.96); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .auth-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; max-width: 360px; text-align: center; }
  .auth-card input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: #e8edf5; margin: 12px 0; }
  .auth-card button { width: 100%; padding: 12px; background: var(--orange); color: #1a1208; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  input.date { padding: 10px; background: var(--bg); border: 1px solid var(--border); color: #e8edf5; border-radius: 6px; margin-left: 8px; }
</style>
</head>
<body>

<div id="auth" class="auth">
  <div class="auth-card">
    <div style="font-size:36px">🐜</div>
    <div style="font-size:18px;font-weight:700">Office Access</div>
    <input id="pw" type="password" placeholder="office password">
    <button id="pwBtn">Unlock</button>
    <div id="pwErr" style="color:var(--red);font-size:12px;margin-top:8px"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header"><div class="ant">🐜</div><h1>Payroll Batch</h1></div>
  <div class="card">
    <div>Pay period end: <input id="endDate" type="date" class="date"></div>
    <div id="preview"></div>
    <button id="goBtn" class="go" disabled>Mark all as paid</button>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
(function() {
  const XANO = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
  const AUTH_KEY = 'tn_office_auth_v1';
    async function __verifyOfficePassword(pw){if(!pw)return false;try{const r=await fetch('https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA/verify_office_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});const d=await r.json();return d&&d.success===true;}catch{return false;}}
const $ = (id) => document.getElementById(id);

  if (localStorage.getItem(AUTH_KEY) === '1') unlock();
  \.addEventListener('click', async () => {
    if ($('pw').value === OFFICE_PASSWORD) { localStorage.setItem(AUTH_KEY, '1'); unlock(); }
    else { $('pwErr').textContent = 'wrong password'; }
  });
  function unlock() {
    $('auth').style.display = 'none'; $('app').style.display = 'block';
    $('endDate').value = new Date().toISOString().slice(0, 10);
    refresh();
  }

  $('endDate').addEventListener('change', refresh);
  let lastPreview = null;

  async function refresh() {
    $('preview').innerHTML = '<div style="padding:14px;color:var(--muted)">loading…</div>';
    try {
      const res = await fetch(`${XANO}/payout_batch`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ end_date: $('endDate').value, preview: true })
      });
      const d = await res.json();
      lastPreview = d;
      renderPreview(d);
    } catch (err) {
      $('preview').innerHTML = `<div style="padding:14px;color:var(--red)">load failed: ${err.message}</div>`;
    }
  }

  function renderPreview(d) {
    const rows = (d && d.tech_totals) || [];
    if (rows.length === 0) {
      $('preview').innerHTML = '<div style="padding:14px;color:var(--muted)">No pending earnings for this period.</div>';
      $('goBtn').disabled = true;
      return;
    }
    let total = 0;
    const trs = rows.map(r => {
      const amt = Number(r.tech_total || r.total || 0);
      total += amt;
      const cls = amt === 0 ? 'amt zero' : 'amt';
      return `<tr><td>${r.first_name || ''} ${r.last_name || ''}</td><td class="${cls}">$${amt.toFixed(2)}</td></tr>`;
    }).join('');
    $('preview').innerHTML = `
      <table>
        <thead><tr><th>Tech</th><th style="text-align:right">Pending</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
      <div class="totals"><span>Total to pay</span><span>$${total.toFixed(2)}</span></div>
    `;
    $('goBtn').disabled = total === 0;
  }

  $('goBtn').addEventListener('click', async () => {
    if (!confirm('Mark all pending earnings as paid up to ' + $('endDate').value + '? This is irreversible.')) return;
    $('goBtn').disabled = true;
    showMsg('', 'processing…');
    try {
      const res = await fetch(`${XANO}/payout_batch`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ end_date: $('endDate').value, preview: false, commit: true })
      });
      const d = await res.json();
      if (!d || d.success === false) throw new Error((d && d.error) || 'failed');
      showMsg('ok', `✓ Batch committed. ${d.rows_updated || 0} rows marked paid.`);
      setTimeout(refresh, 600);
    } catch (e) { showMsg('err', 'fail: ' + (e.message || e)); }
    $('goBtn').disabled = false;
  });

  function showMsg(cls, txt) {
    $('msg').className = 'msg show' + (cls ? ' ' + cls : '');
    $('msg').textContent = txt;
  }
})();
</script>
</body>
</html>
