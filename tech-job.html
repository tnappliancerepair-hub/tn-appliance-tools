<style>
  :root{
    --blue:#1f6fed; --blue-d:#1559c9;
    --ink:#1d2530; --ink2:#5b6573; --dim:#8a93a1;
    --bg:#eef1f5; --card:#ffffff; --line:#e4e8ee;
    --ok:#1faa6b; --warn:#e8821e; --bad:#e24d4d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;padding-bottom:90px;}
  /* top bar */
  .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));}
  .tb-btn{flex-shrink:0;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;
    font-size:17px;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .tb-btn:active{background:#f1f4f8;}
  .tb-title{flex:1;min-width:0;}
  .tb-title .n{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-title .s{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* search overlay */
  .search-wrap{display:none;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:49;}
  .search-wrap.show{display:block;}
  .search-wrap input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;}
  .search-results{margin-top:8px;}
  .sr{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;text-decoration:none;color:var(--ink);background:#fff;}
  .sr .srn{font-weight:600;font-size:14px;}
  .sr .srs{font-size:12px;color:var(--ink2);}
  /* content */
  .wrap{max-width:680px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,30,50,0.04);}
  .card h3{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
  .card h3 .r{margin-left:auto;font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .pill.scheduled{background:#e7f0fe;color:var(--blue);}
  .pill.in_progress{background:#fdf0e0;color:var(--warn);}
  .pill.completed,.pill.complete{background:#e3f6ec;color:var(--ok);}
  .pill.awaiting_parts,.pill.broadcasting{background:#fdf0e0;color:var(--warn);}
  .pill.canceled{background:#fde8e8;color:var(--bad);}
  .pill.default,.pill.not_ready,.pill.prediagnosis_pending{background:#eef1f5;color:var(--ink2);}
  /* hero */
  .hero .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .hero .jid{font-size:13px;color:var(--ink2);font-weight:600;}
  .hero .big{font-size:20px;font-weight:800;line-height:1.2;}
  .hero .meta{font-size:13px;color:var(--ink2);margin-top:4px;}
  /* lifecycle actions */
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .act{padding:13px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink);}
  .act .ic{font-size:21px;}
  .act:active{transform:scale(.97);}
  .act.go{border-color:#bcd5fb;background:#f1f6fe;color:var(--blue);}
  .act.done{border-color:#b9e6cd;background:#eef9f2;color:var(--ok);}
  .act[disabled]{opacity:.45;}
  .stamp{font-size:11px;color:var(--ink2);margin-top:8px;text-align:center;}
  /* notes */
  textarea.notes{width:100%;min-height:150px;border:1px solid var(--line);border-radius:11px;padding:12px;
    font-size:15px;font-family:inherit;line-height:1.5;resize:vertical;color:var(--ink);}
  textarea.notes:focus{outline:none;border-color:var(--blue);}
  .save-row{display:flex;align-items:center;gap:10px;margin-top:9px;}
  .btn{padding:11px 16px;border-radius:10px;border:0;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.primary:active{background:var(--blue-d);}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn[disabled]{opacity:.5;}
  .save-note{font-size:12px;color:var(--ink2);}
  .save-note.ok{color:var(--ok);}
  .save-note.err{color:var(--bad);}
  /* media */
  .media-actions{display:flex;gap:8px;margin-bottom:11px;}
  .media-actions label{flex:1;text-align:center;padding:11px;border:1px dashed #c4cdd8;border-radius:11px;
    font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;background:#f8fafd;}
  .media-actions label:active{background:#eef4fe;}
  .media-actions input{display:none;}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .gallery a{position:relative;display:block;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#dfe4ea;border:1px solid var(--line);}
  .gallery img,.gallery video{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery .vbadge{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px;}
  .gallery .up{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);background:#f1f4f8;}
  .empty{font-size:13px;color:var(--dim);text-align:center;padding:14px;}
  /* parts */
  .parts-in{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px;}
  .parts-in input{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;}
  .cat{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;text-decoration:none;
    color:var(--blue);font-size:13px;font-weight:600;background:#f8fafd;}
  .cat:active{background:#eef4fe;}
  .cand{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff;}
  .cand .pn{font-family:ui-monospace,monospace;font-weight:700;font-size:14px;}
  .cand .cn{font-size:12px;color:var(--ink2);}
  .cand .conf{font-size:10px;font-weight:700;text-transform:uppercase;padding:1px 7px;border-radius:10px;margin-left:6px;}
  .conf.high{background:#e3f6ec;color:var(--ok);} .conf.medium{background:#fdf0e0;color:var(--warn);} .conf.low{background:#fde8e8;color:var(--bad);}
  .ai-note{font-size:12px;color:var(--ink2);margin-top:6px;font-style:italic;}
  .warnbox{font-size:11px;color:var(--warn);background:#fdf6ec;border:1px solid #f3e2c6;border-radius:8px;padding:7px 9px;margin-top:8px;}
  /* customer */
  .cust-name{font-size:16px;font-weight:700;}
  .cust-addr{font-size:13px;color:var(--ink2);margin-top:3px;}
  .cust-acts{display:flex;gap:8px;margin-top:11px;}
  .cust-acts a{flex:1;text-align:center;padding:11px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700;border:1px solid var(--line);color:var(--ink);}
  .cust-acts a.call{background:#eef9f2;border-color:#b9e6cd;color:var(--ok);}
  .cust-acts a.text{background:#f1f6fe;border-color:#bcd5fb;color:var(--blue);}
  .ask-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:13px;
    background:linear-gradient(135deg,#1f6fed,#3b86ff);color:#fff;font-size:15px;font-weight:800;text-decoration:none;}
  .briefing{background:#fff7ed;border:1px solid #f5dfc0;border-radius:11px;padding:11px;font-size:13px;color:#7a4e12;line-height:1.5;}
  .briefing b{color:#5e3a0a;}
  /* auth */
  .auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .auth.hidden{display:none;}
  .auth-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;width:100%;max-width:340px;text-align:center;}
  .auth-card h2{font-size:18px;margin-bottom:5px;}
  .auth-card .sub{color:var(--ink2);font-size:13px;margin-bottom:16px;}
  .auth-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:22px;text-align:center;letter-spacing:.4em;font-family:ui-monospace,monospace;margin-bottom:11px;}
  .auth-card button{width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}
  .auth-card .err{color:var(--bad);font-size:13px;margin-top:9px;min-height:17px;}
  .loading{padding:50px 16px;text-align:center;color:var(--ink2);}
  .spinner{width:30px;height:30px;border:3px solid #d7dde5;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#1d2530;color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:9998;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
</style>

<body>

<div class="auth" id="auth">
  <div class="auth-card">
    <h2>🐜 Tech Access</h2>
    <div class="sub">enter your 4-digit PIN</div>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off">
    <button id="pin-go" onclick="submitPin()">Open Job</button>
    <div class="err" id="pin-err"></div>
  </div>
</div>

  <button class="tb-btn" id="back-btn" title="My Day">←</button>

    <div class="n" id="t-name">Loading…</div>
    <div class="s" id="t-sub"></div>
  </div>
  <button class="tb-btn" id="prev-btn" title="Previous job" style="display:none">‹</button>
  <button class="tb-btn" id="next-btn" title="Next job" style="display:none">›</button>

</div>

<div class="search-wrap" id="search-wrap">
  <input id="search-in" placeholder="Search any job — name, phone, job #…" autocomplete="off">
  <div class="search-results" id="search-results"></div>
</div>

<div id="content">
  <div class="loading"><div class="spinner"></div>Loading job…</div>
</div>

<div class="toast" id="toast"></div>

<script src="/ant-constraints.js"></script>
<script src="/ant-addons.js"></script>
<script src="/ant-video-upload.js"></script>
<script src="/ant-brain.js"></script>
<script src="/ant-spine.js" defer></script>
<script>
// ant-spine.js: pin the role to tech (the page's URL doesn't match its
// role-detector) and opt OUT of its auto top-strip + polling, which would
// overlap the tech topbar. We mount only the customer conversation, manually.
window.ANT_ROLE = 'tech';
window.ANT_SPINE_AUTO = false;
const XANO = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const params = new URLSearchParams(location.search);
const JOB_ID = parseInt(params.get('job_id'), 10);
const TECH_ID = parseInt(params.get('tech_id'), 10) || 0;
let waiverSigned = false, waiverOverride = false;  // release-of-liability gate state
const TECH_AUTH_KEY = 'tn_tech_auth_' + TECH_ID;
let job=null, cust=null, tech=null, tdr=null, appliance=null, allTdrs=[], dayJobs=[];

// ── auth (tech PIN, 12h cache) ──────────────────────────────────
function authValid(){
  try{ const c=JSON.parse(localStorage.getItem(TECH_AUTH_KEY)||'{}'); return c.ok && (Date.now()-c.t < 12*3600*1000); }catch(_){return false;}
}
function initAuth(){
  if(!JOB_ID){ document.getElementById('content').innerHTML='<div class="empty">Missing job_id in the link.</div>'; document.getElementById('auth').classList.add('hidden'); return; }
  if(TECH_ID && authValid()){ document.getElementById('auth').classList.add('hidden'); loadJob(); return; }
  if(!TECH_ID){ // office-style open without tech: still gate softly via office pw is overkill; require tech_id
    document.getElementById('auth').querySelector('.sub').textContent='open from your My Day list';
  }
  document.getElementById('pin').focus();
}
async function submitPin(){
  const v=(document.getElementById('pin').value||'').trim();
  const err=document.getElementById('pin-err'); const btn=document.getElementById('pin-go');
  if(!/^\d{4}$/.test(v)){ err.textContent='Enter your 4-digit PIN'; return; }
  if(!TECH_ID){ err.textContent='Open this job from your My Day list'; return; }
  btn.disabled=true; btn.textContent='Checking…'; err.textContent='';
  try{
    const r=await fetch('/.netlify/functions/verify-pin-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({technician_id:TECH_ID,pin:v})});
    const d=await r.json();
    if(d.success){ localStorage.setItem(TECH_AUTH_KEY,JSON.stringify({ok:true,t:Date.now()})); document.getElementById('auth').classList.add('hidden'); loadJob(); }
    else { err.textContent='Wrong PIN. Try again.'; document.getElementById('pin').value=''; }
  }catch(_){ err.textContent='Connection error. Try again.'; }
  finally{ btn.disabled=false; btn.textContent='Open Job'; }
}

// ── data helpers ────────────────────────────────────────────────
async function xanoPost(ep,payload){
  const r=await fetch(XANO+'/'+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  return r.json();
}
async function xanoGet(ep,qs){
  const r=await fetch(XANO+'/'+ep+(qs?('?'+qs):''),{cache:'no-store'});
  return r.json();
}

async function loadJob(){
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Loading job…</div>';
  try{
    const d=await xanoPost('get_job_for_dashboard',{job_id:JOB_ID});
    if(!d.success) throw new Error(d.error||'not found');
    job=d.job||{}; cust=d.customer||{}; tech=d.tech||{}; tdr=d.tdr||{}; appliance=d.appliance||{}; allTdrs=d.all_tdrs||[];
    render();
    renderAntTdr(tdr, allTdrs);
    startAntTdrPoll();
    loadAttachments();
    loadWaiverStatus();
    loadDayJobs();
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty">⚠️ Could not load job — '+esc(e.message)+'</div>';
  }
}

// ── "From your Ant call" live panel ────────────────────────────
// Read-only mirror of the structured TDR Ant fills while you talk to it.
// Polls every 20s and updates ONLY this panel — never your report textarea,
// so it can't clobber what you're typing. This is the "watch it fill" view.
function latestStructuredTdr(tdrObj, tdrs){
  const all=(tdrs||[]).slice();
  if(tdrObj && tdrObj.id) all.push(tdrObj);
  all.sort((a,b)=>(b.created_at||0)-(a.created_at||0));
  for(const t of all){
    if((t.diagnosis||'').trim()||(t.failed_component||'').trim()||(t.repair_completed||'').trim()||Number(t.labor_time_hours||0)>0) return t;
  }
  return null;
}
function renderAntTdr(tdrObj, tdrs){
  const el=document.getElementById('ant-tdr-live'); if(!el) return;
  const t=latestStructuredTdr(tdrObj, tdrs);
  if(!t){ el.style.display='none'; el.innerHTML=''; return; }
  const row=(lbl,v)=> (v&&String(v).trim()) ? '<div style="margin:5px 0"><span style="color:#7a869a;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">'+lbl+'</span><br>'+esc(String(v))+'</div>' : '';
  const lh=Number(t.labor_time_hours||0);
  el.innerHTML='<h3 style="margin:0 0 4px">🎤 From your Ant call</h3>'
    +'<div style="font-size:12px;color:#7a869a;margin:0 0 8px">Ant filled this from what you told it — edit in your report below if anything’s off.</div>'
    +row('Diagnosis',t.diagnosis)+row('Failed part',t.failed_component)+row('Cause',t.failure_cause)
    +row('Repair',t.repair_completed)+(lh>0?row('Labor',lh+' hr'):'')
    +(t.finalized? '<div style="margin-top:8px;color:#1aa260;font-weight:700;font-size:13px">✓ Sent to the office</div>':'');
  el.style.display='';
}
let __antTdrPoll=null;
function startAntTdrPoll(){
  if(__antTdrPoll) return;
  __antTdrPoll=setInterval(async()=>{
    if(document.visibilityState!=='visible') return;
    try{
      const d=await xanoPost('get_job_for_dashboard',{job_id:JOB_ID});
      if(d&&d.success){
        // Keep the in-memory TDRs current so the Complete gate sees a report that
        // landed AFTER page load (e.g. a phone-call TDR) — not stale data.
        if(d.all_tdrs) allTdrs=d.all_tdrs;
        if(d.tdr) tdr=d.tdr;
        renderAntTdr(d.tdr||{}, d.all_tdrs||[]);
      }
    }catch(_){}
  }, 20000);
}

// prev/next from the tech's day + back link
async function loadDayJobs(){
  if(!TECH_ID) return;
  try{
    const today=new Date(); const ds=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    const d=await xanoGet('get_tech_daily_dashboard','tech_id='+TECH_ID+'&date='+ds);
    dayJobs=(d&&d.jobs)||[];
    const jid=(j)=>Number((j&&j.job&&j.job.id)||(j&&j.id)||0); // dashboard nests job under .job
    const idx=dayJobs.findIndex(j=>jid(j)===JOB_ID);
    const prev=document.getElementById('prev-btn'), next=document.getElementById('next-btn');
    if(idx>0){ prev.style.display='flex'; prev.onclick=()=>go(jid(dayJobs[idx-1])); }
    if(idx>=0 && idx<dayJobs.length-1){ next.style.display='flex'; next.onclick=()=>go(jid(dayJobs[idx+1])); }
  }catch(_){}
}
function go(id){ location.href='tech-job.html?job_id='+id+'&tech_id='+TECH_ID; }

document.getElementById('back-btn').onclick=()=>{ location.href = TECH_ID ? ('tech-daily-dashboard.html?tech_id='+TECH_ID) : 'office-dashboard.html'; };

// ── search ──────────────────────────────────────────────────────
let searchTimer=null;
document.getElementById('search-btn').onclick=()=>{
  const w=document.getElementById('search-wrap'); w.classList.toggle('show');
  if(w.classList.contains('show')) document.getElementById('search-in').focus();
};
document.getElementById('search-in').addEventListener('input',e=>{
  clearTimeout(searchTimer); const q=e.target.value.trim();
  const box=document.getElementById('search-results');
  if(q.length<2){ box.innerHTML=''; return; }
  searchTimer=setTimeout(async()=>{
    box.innerHTML='<div class="empty">searching…</div>';
    try{
      const d=await xanoGet('office_universal_search','q='+encodeURIComponent(q));
      const rows=(d&&d.items)||[];
      if(!rows.length){ box.innerHTML='<div class="empty">no matches</div>'; return; }
      box.innerHTML=rows.slice(0,12).map(r=>{
        const jid=r.job_id||r.id;
        const nm=((r.customer_first||'')+' '+(r.customer_last||'')).trim()||'Customer';
        const sub=[r.city,r.customer_phone,jid?('#'+jid):''].filter(Boolean).join(' · ');
        return jid?('<a class="sr" href="tech-job.html?job_id='+jid+'&tech_id='+TECH_ID+'"><div class="srn">'+esc(nm)+'</div><div class="srs">'+esc(sub)+'</div></a>'):'';
      }).join('');
    }catch(_){ box.innerHTML='<div class="empty">search unavailable</div>'; }
  },300);
});

// ── render ──────────────────────────────────────────────────────
function render(){
  const name=cust.name||((cust.first_name||'')+' '+(cust.last_name||'')).trim()||'Customer';
  const appl=[appliance.brand,appliance.type].filter(Boolean).join(' ')||appliance.type||'appliance';
  document.getElementById('t-name').textContent=name;
  document.getElementById('t-sub').textContent=appl;

  const status=(job.scheduling_status||job.current_status||'default');
  const statusCls=status.replace(/[^a-z_]/gi,'');
  const sched=job.scheduled_start?fmtDay(job.scheduled_start):'Not scheduled';
  const win=job.service_eta_window?(' · '+job.service_eta_window):'';

function lifecycleStamp(){
  const p=[];
  if(job.tech_en_route_at)p.push('On way '+fmtTime(job.tech_en_route_at));
  if(job.job_started_at)p.push('Started '+fmtTime(job.job_started_at));
  if(job.job_completed_at)p.push('Completed '+fmtTime(job.job_completed_at));
  return p.join(' · ');
}

function wireActions(){
  document.getElementById('a-otw').onclick=()=>lifecycle('tech_on_the_way','On-my-way sent ✓','en_route');
  document.getElementById('a-start').onclick=startJobGated;
  document.getElementById('a-done').onclick=completeFlow;
  document.getElementById('save-notes').onclick=saveNotes;
  const sa=document.getElementById('save-appl'); if(sa) sa.onclick=saveBasics;
  document.getElementById('refresh-media').onclick=loadAttachments;
  const _photoCam=document.getElementById('in-photo-cam'); if(_photoCam) _photoCam.onchange=async e=>{ const fs=Array.from(e.target.files||[]); for(const f of fs){ await uploadFile(f,'photo'); } e.target.value=''; };
  document.getElementById('in-photo').onchange=async e=>{ const fs=Array.from(e.target.files||[]); for(const f of fs){ await uploadFile(f,'photo'); } e.target.value=''; };
  const _vidCam=document.getElementById('in-video-cam'); if(_vidCam) _vidCam.onchange=e=>{ if(e.target.files[0]) uploadFile(e.target.files[0],'video'); e.target.value=''; };
  document.getElementById('in-video').onchange=e=>{ if(e.target.files[0]) uploadFile(e.target.files[0],'video'); e.target.value=''; };
  document.getElementById('dx-go').onclick=diagnose;
  document.getElementById('pf-go').onclick=findParts;
  // 📞 Talk to Ant — rings the tech's phone (Brooke), real conversation. Same
  // dispatch the retired Ant page used; lives right on the ticket now.
  const tta=document.getElementById('btn-talk-ant');
  if(tta) tta.onclick=async()=>{
    if(!JOB_ID){ alert('No job loaded.'); return; }
    if(!TECH_ID){ alert('Open this from your dashboard link.'); return; }
    const s=document.getElementById('talk-ant-status');
    tta.disabled=true; if(s) s.textContent='calling…';
    try{
      const r=await fetch(XANO+'/dispatch_ant_field_assist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:JOB_ID,tech_id:TECH_ID})});
      const d=await r.json();
      if(s) s.textContent=(r.ok&&d.success)?'📲 Ringing your phone — pick up and talk':('⚠ '+((d&&d.message)||'dispatch failed'));
    }catch(e){ if(s) s.textContent='⚠ connection error — try again'; }
    setTimeout(()=>{ tta.disabled=false; if(s) s.textContent=''; }, 10000);
  };
  document.getElementById('mi-go').onclick=modelIntel;
  renderTechAddons();
  renderCustomerAddons();
  renderPartsLocation();
  renderJobParts();
  wireTakePayment();
  mountConvo();
  applyLifecycleButtons();   // grey out steps already done (no more scary "illegal_transition")
  loadPayment();             // self-pay jobs: let the tech text the customer a card-pay link from the field
  // Ant Diagnose card removed for simplicity (Teddy 2026-06-23: "we don't need three talk-to-Ant buttons").
}

// Read-only customer conversation (Ant ↔ customer texts), tech lens —
// hides owner/internal chatter. Mounted via ant-spine.js into the dark
// sub-panel. Card hides itself if the thread comes back empty so it
// doesn't clutter jobs with no customer texting yet.
function mountConvo(){
  const card=document.getElementById('convo-card');
  const el=document.getElementById('ant-sms-thread');
  if(!card||!el) return;
  if(!(window.Ant&&Ant.mountSmsThread&&JOB_ID)){ card.style.display='none'; return; }
  try{
    Ant.mountSmsThread(JOB_ID,'ant-sms-thread',{filterFor:'tech'});
    // ant-spine renders "No SMS in this thread yet." when empty — hide the
    // whole card in that case (check shortly after the async mount paints).
    setTimeout(()=>{ if(/No SMS in this thread yet/i.test(el.textContent||'')) card.style.display='none'; }, 1200);
  }catch(_){ card.style.display='none'; }
}

// ── Add-ons at the stop (install now or ship it) ───────────────
function renderTechAddons(){
  const card=document.getElementById('addons-card'); const list=document.getElementById('addons-list');
  if(!card||!list||!window.AntAddons) return;
  const items=AntAddons.forAppliance(appliance.type||appliance.appliance||'');
  if(!items.length){ card.style.display='none'; return; }
  card.style.display='';
  list.innerHTML=items.map(a=>{
    const net=Math.max(0,(a.price||0)-(a.discount||0));
    let btns;
    if(a.inquire){
      btns='<button class="btn" data-k="'+esc(a.key)+'" data-n="'+esc(a.name)+'" data-mode="inquire" data-status="requested" data-price="0" data-disc="0" data-cut="0" data-cost="0" style="background:#fff;border:1px solid var(--line,#e3e8ef)">Flag for quote</button>';
    } else {
      btns='<button class="btn primary" data-k="'+esc(a.key)+'" data-n="'+esc(a.name)+'" data-mode="installed" data-status="fulfilled" data-price="'+a.price+'" data-disc="'+(a.discount||0)+'" data-cut="'+(a.tech_cut||0)+'" data-cost="'+(a.cost||0)+'">Install now · +$'+(a.tech_cut||0)+'</button>';
      if(a.ship_price) btns+='<button class="btn" data-k="'+esc(a.key)+'" data-n="'+esc(a.name)+'" data-mode="ship" data-status="requested" data-price="'+a.ship_price+'" data-disc="0" data-cut="'+(a.ship_cut||0)+'" data-cost="'+(a.cost||0)+'" style="background:#fff;border:1px solid var(--line,#e3e8ef);margin-left:6px">Ship it · +$'+(a.ship_cut||0)+'</button>';
    }
    return '<div class="ao-row" style="padding:9px 0;border-top:1px solid var(--line,#e3e8ef)">'
      +'<div style="font-weight:700;font-size:14px">'+esc(a.name)+(a.inquire?'':(' · $'+net))+'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center">'+btns+'<span class="ao-stat" style="font-size:12px;color:var(--ok,#1aa260);font-weight:700;margin-left:4px"></span></div>'
      +'</div>';
  }).join('');
  list.querySelectorAll('button[data-k]').forEach(b=>{ b.onclick=()=>logTechAddon(b); });
}
async function logTechAddon(b){
  const row=b.closest('.ao-row'); const stat=row?row.querySelector('.ao-stat'):null;
  row.querySelectorAll('button[data-k]').forEach(x=>x.disabled=true);
  if(stat) stat.textContent='…';
  try{
    const r=await fetch('/.netlify/functions/record-addon',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ job_id:JOB_ID, technician_id:TECH_ID, addon_key:b.dataset.k, name:b.dataset.n,
        price:parseFloat(b.dataset.price)||0, discount:parseFloat(b.dataset.disc)||0, tech_cut:parseFloat(b.dataset.cut)||0, cost:parseFloat(b.dataset.cost)||0,
        mode:b.dataset.mode, status:b.dataset.status, source:'tech_job' })});
    const d=await r.json();
    if(d&&d.success){
      const mode=b.dataset.mode;
      if(stat) stat.textContent = mode==='inquire' ? '✓ flagged for office quote'
        : mode==='ship' ? '✓ office will ship it' : '✓ logged — +$'+(parseFloat(b.dataset.cut)||0)+' to your pay';
    } else { if(stat) stat.textContent='⚠ '+((d&&d.error)||'failed'); row.querySelectorAll('button[data-k]').forEach(x=>x.disabled=false); }
  }catch(_){ if(stat) stat.textContent='⚠ connection error'; row.querySelectorAll('button[data-k]').forEach(x=>x.disabled=false); }
}

// Shows what the customer clicked so the tech is never blind. Two actions:
//   Confirm & done → addon_fulfilled (credits the tech, billed on the invoice)
//   Remove         → addon_voided   (customer tapped it by mistake; off the job)
async function renderCustomerAddons(){
  const card=document.getElementById('cust-addons-card'); const list=document.getElementById('cust-addons-list');
  if(!card||!list||!JOB_ID) return;
  let items=[];
  try{
    const r=await fetch('/.netlify/functions/addons-pending?job_id='+encodeURIComponent(JOB_ID),{cache:'no-store'});
    const d=await r.json(); items=(d&&d.items)||[];
  }catch(_){ }
  if(!items.length){ card.style.display='none'; return; }
  card.style.display='';
  list.innerHTML=items.map(a=>{
    const price=parseFloat(a.net_price)||0;
    const k=esc(a.addon_key), n=esc(a.name||a.addon_key);
    const paidTag=a.paid?' <span style="color:#127a4a">· ✅ paid'+(a.pay_method?(' ('+esc(a.pay_method)+')'):'')+'</span>':'';

      +'<div style="font-weight:800;font-size:15px">'+n+' · $'+price.toFixed(2)+paidTag+'</div>'

        +'<button class="btn ca-cash" style="flex:1;min-width:110px;background:#fff;border:1px solid #bfe3cf;color:#127a4a">💵 Cash/check</button>'
        +'<button class="btn ca-bill" style="flex:1;min-width:110px;background:#fff;border:1px solid var(--line,#e3e8ef)">🧾 Put on the bill</button>'))

  }).join('');

    if(bill) bill.onclick=()=>custAddonAction(row,'fulfilled',{}); // rides the job invoice (office collects)

// 💳 Card collect — opens Stripe checkout in a new tab so the customer can pay
// by card/Apple Pay on this device (or the tech hands them the phone). Works on
// warranty jobs too (the add-on is out-of-pocket). kind:'addon' isn't warranty-gated.
async function custAddonCard(row){
  const stat=row.querySelector('.ca-stat');
  row.querySelectorAll('button').forEach(x=>x.disabled=true);
  if(stat) stat.textContent='opening secure checkout…';
  try{
    const r=await fetch('/.netlify/functions/create-stripe-payment-link',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ job_id:JOB_ID, amount_cents:Math.round((parseFloat(row.dataset.price)||0)*100),
        description:row.dataset.n, kind:'addon',
        metadata:{ addon_key:row.dataset.k, name:row.dataset.n, mode:'installed', tech_cut:row.dataset.cut, technician_id:String(TECH_ID||''), source:'tech_collect' } })});
    const d=await r.json();
    if(d&&d.ok&&d.url&&!d.placeholder){
      if(stat) stat.innerHTML='💳 Opening secure checkout — hand them the phone for Apple Pay/card…';
      // navigate THIS tab (reliable on mobile; window.open after await gets popup-blocked).
      // Tech hands the phone over to pay, then taps back to the job.
      window.location.href=d.url; return;
    }
    else { if(stat) stat.textContent='⚠ '+((d&&d.error)||'could not open checkout'); row.querySelectorAll('button').forEach(x=>x.disabled=false); }
  }catch(_){ if(stat) stat.textContent='⚠ connection error'; row.querySelectorAll('button').forEach(x=>x.disabled=false); }
}
async function custAddonAction(row,status,opts){
  opts=opts||{};
  const stat=row.querySelector('.ca-stat');
  row.querySelectorAll('button').forEach(x=>x.disabled=true);
  if(stat) stat.textContent='…';
  try{
    const r=await fetch('/.netlify/functions/record-addon',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ job_id:JOB_ID, technician_id:TECH_ID, addon_key:row.dataset.k, name:row.dataset.n,
        price:parseFloat(row.dataset.price)||0, tech_cut:parseFloat(row.dataset.cut)||0,
        status:status, mode:'installed', paid:!!opts.paid, pay_method:opts.pay_method||'', source:'tech_job' })});
    const d=await r.json();
    if(d&&d.success){
      if(stat){ stat.textContent = status==='voided' ? '✗ removed — not billed'
        : opts.paid ? '✅ cash/check collected — credited to your pay'
        : '✓ on the bill — office collects, credited to your pay'; }
      setTimeout(renderCustomerAddons, 900); // drops the row (now fulfilled/voided)
    } else { if(stat) stat.textContent='⚠ '+((d&&d.error)||'failed'); row.querySelectorAll('button').forEach(x=>x.disabled=false); }
  }catch(_){ if(stat) stat.textContent='⚠ connection error'; row.querySelectorAll('button').forEach(x=>x.disabled=false); }
}

// ── 📦 Parts responsibility (expected vs received vs discrepancy) ──
// Lists the parts supplied for this job (auto from the RMA tracker + office
// write-ins). Tech confirms returns or flags a missing part — the flag is the
// timestamped chargeback shield ("vendor said 4, only 3 here / customer had no old part").
// 📍 Where are the parts? — parts WE ordered (Marcone/Ideal's pickup vs shipped to home).
async function renderPartsLocation(){

  card.style.display='';
  list.innerHTML=parts.map(p=>{
    const nm=esc(p.part||p.name||'part'), sub=esc([p.name&&p.name!==p.part?p.name:'',p.supplier_nice].filter(Boolean).join(' · '));
    const color=p.pickup?'#b3690a':(p.placed?'#127a4a':'#888');

}
async function renderJobParts(){
  const card=document.getElementById('wparts-card'), list=document.getElementById('wparts-list');
  if(!card||!list||!JOB_ID) return;
  const claim=encodeURIComponent((job&&job.claim_number)||'');
  let parts=[];
  try{ const d=await fetch('/.netlify/functions/warranty-parts?job_id='+JOB_ID+'&claim='+claim).then(r=>r.json()); parts=(d&&d.parts)||[]; }catch(_){}
  if(!parts.length){ card.style.display='none'; return; }
  card.style.display='';
  list.innerHTML=parts.map(p=>{
    const nm=esc(p.part), desc=esc(p.description||''), sub=esc([p.vendor,p.distributor].filter(Boolean).join(' · '));
    // Warranty-supplied parts ship to the customer's home — tell the tech where it is.
    const loc='🏠 At the customer\'s home'+(p.tracking?(' · track '+esc(p.tracking)):'');
    const st=p.status;
    // Only treat a status as "chosen" once it's actually been confirmed (or it's a
    // returned/missing decision). A part's supply default (often "used") must NOT look
    // done — the whole point is the tech taps one per part.
    const chosen=(want)=> (p.checked && st===want) || (want==='missing' && st==='missing') || (want==='returned' && st==='returned');
    const badge = st==='returned'?'<span style="color:#127a4a;font-weight:800">✓ returned</span>'
      : st==='missing'?'<span style="color:#c0392b;font-weight:800">⚠️ missing</span>'
      : !p.checked?'<span style="color:#c2691c;font-weight:800">• needs your check</span>'
      : st==='used'?'<span style="color:#127a4a;font-weight:800">✓ used</span>'
      : '<span style="color:#c2691c;font-weight:800">↩︎ unused · return it</span>';
    const onMiss=chosen('missing')?'box-shadow:0 0 0 3px rgba(192,57,43,.25);':'';
    return '<div class="wp-row" data-p="'+nm+'" style="padding:10px 0;border-top:1px solid var(--line,#e3e8ef)">'
      +'<div style="font-weight:800;font-size:14px">'+nm+'&nbsp; '+badge+'</div>'
      +(desc?'<div style="font-size:12px;color:var(--ink2,#555)">'+desc+'</div>':'')
      +(sub?'<div style="font-size:12px;color:var(--dim)">'+sub+'</div>':'')
      +'<div style="font-size:12px;font-weight:700;color:#2c6fb0;margin-top:2px">'+loc+'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center">'
      +'<button class="btn wp-used" style="flex:1;min-width:90px;background:'+(chosen('used')?'#127a4a':'#fff')+';color:'+(chosen('used')?'#fff':'inherit')+';border:1px solid '+(chosen('used')?'#127a4a':'var(--line,#e3e8ef)')+'">🔧 Used</button>'
      +'<button class="btn wp-unused" style="flex:1;min-width:90px;background:'+(chosen('to_return')?'#c2691c':'#fff')+';color:'+(chosen('to_return')?'#fff':'inherit')+';border:1px solid '+(chosen('to_return')?'#c2691c':'var(--line,#e3e8ef)')+'">↩︎ Unused</button>'
      +'<button class="btn wp-miss" style="flex:1;min-width:90px;background:'+(chosen('missing')?'#c0392b':'#fdece9')+';color:'+(chosen('missing')?'#fff':'#c0392b')+';border:1px solid #f3c0b7;'+onMiss+'">⚠️ Missing</button>'
      +'<span class="wp-stat" style="font-size:12px;font-weight:700;width:100%"></span>'
      +'</div></div>';
  }).join('');
  list.querySelectorAll('.wp-row').forEach(row=>{
    const p=row.dataset.p;
    const used=row.querySelector('.wp-used'), unused=row.querySelector('.wp-unused'), miss=row.querySelector('.wp-miss');
    if(used) used.onclick=()=>wpSet(row,p,'used');
    if(unused) unused.onclick=()=>wpSet(row,p,'unused');
    if(miss) miss.onclick=()=>wpMissing(row,p);
  });
}
async function wpSet(row,part,status){
  const s=row.querySelector('.wp-stat'); if(s){s.style.color='var(--dim)';s.textContent='…';}
  try{
    const r=await fetch('/.netlify/functions/warranty-parts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',job_id:JOB_ID,part:part,status:status,by:'tech',technician_id:TECH_ID})});
    const d=await r.json();
    if(d&&d.ok){ if(s){s.style.color='#127a4a';s.textContent=status==='used'?'✓ marked used':'✓ marked unused — goes back';} setTimeout(renderJobParts,700); }
    else if(s){ s.style.color='#c0392b'; s.textContent='⚠ failed'; }
  }catch(_){ if(s){s.style.color='#c0392b';s.textContent='⚠ error';} }
}
async function wpMissing(row,part){
  if(!confirm('Mark "'+part+'" as MISSING?\n\nUse this if the part never arrived, or the customer says there is no old part to return. Then call the office before you leave — this timestamp protects you.')) return;
  const s=row.querySelector('.wp-stat'); if(s){s.style.color='var(--dim)';s.textContent='…';}
  try{
    const r=await fetch('/.netlify/functions/warranty-parts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',job_id:JOB_ID,part:part,status:'missing',by:'tech',technician_id:TECH_ID,reason:'tech marked missing'})});
    const d=await r.json();
    if(d&&d.ok){ if(s){s.style.color='#c0392b';s.innerHTML='⚠️ Logged with today\'s date — now <b>call the office</b>. You\'re covered.';} setTimeout(renderJobParts,1500); }
    else if(s){ s.style.color='#c0392b'; s.textContent='⚠ failed — try again'; }
  }catch(_){ if(s){s.style.color='#c0392b';s.textContent='⚠ error';} }
}

// ── 💳 Take a payment (on-the-spot, any job incl. warranty) ────
// The everyday "the customer is paying me now" tool. Charges via Stripe
// kind:'addon' (NOT warranty-gated) so it works on warranty jobs too.
function wireTakePayment(){
  const charge=document.getElementById('tp-charge'), txt=document.getElementById('tp-text'), cash=document.getElementById('tp-cash');
  if(charge) charge.onclick=()=>takePayment('charge');
  if(txt) txt.onclick=()=>takePayment('text');
  if(cash) cash.onclick=markCashCollected;
  loadPayStatusTech();
}
// Show paid / balance-due at a glance — auto from real payments.
async function loadPayStatusTech(){
  const el=document.getElementById('tp-status'); if(!el||!JOB_ID) return;
  try{
    const d=await (await fetch('/.netlify/functions/job-payment?job_id='+JOB_ID,{cache:'no-store'})).json();
    if(!d||!d.ok) return;
    const color={paid:'#127a4a',partial:'#c2691c',unpaid:'#c0392b',covered:'#2c6fb0',warranty_pending:'#9a7b2e',none:'#8a96a8'}[d.status]||'#8a96a8';
    const icon={paid:'💵 ',partial:'⚠️ ',unpaid:'🔴 ',covered:'🛡️ ',warranty_pending:'🏦 ',none:''}[d.status]||'';
    // A warranty bill that's ALSO carrying a customer add-on: show the warranty
    // amount muted (waiting on the vendor) under the red add-on-due line.
    const warrLine=(Number(d.warranty_billed||0)>0 && d.status!=='warranty_pending' && d.status!=='paid') ? '<div style="color:#9a7b2e;font-size:12.5px;opacity:.85;margin-top:2px">🏦 Warranty billed $'+Number(d.warranty_billed).toFixed(2)+' · awaiting payment</div>' : '';
    // What the tech made on this job — straight off the office's logged invoice.
    const made=Number(d.tech_pay||0)>0 ? '<div style="color:#127a4a;font-weight:800;font-size:15px;margin-top:4px">💰 You made $'+Number(d.tech_pay).toFixed(2)+' on this job'+(d.status==='paid'?' — paid ✅':'')+'</div>' : '';
    el.style.color=color; el.innerHTML='<span>'+icon+(d.label||'')+'</span>'+warrLine+made;
    // prefill the amount with the balance due so collecting is one tap
    const amtIn=document.getElementById('tp-amt');
    if(amtIn && !amtIn.value && Number(d.balance||d.due)>0) amtIn.value=Number(d.balance||d.due).toFixed(2);
  }catch(_){}
}
async function markCashCollected(){
  const out=document.getElementById('tp-note-out');
  const amt=parseFloat(String((document.getElementById('tp-amt')||{}).value||'').replace(/[^0-9.]/g,''));
  const note=String((document.getElementById('tp-note')||{}).value||'').trim()||'Service payment';
  if(!amt||amt<=0){ if(out){out.style.color='#c2691c';out.textContent='Enter the amount first.';} const i=document.getElementById('tp-amt'); if(i)i.focus(); return; }
  const method=(prompt('Cash or check?','cash')||'cash').trim().toLowerCase();
  const btn=document.getElementById('tp-cash'); if(btn) btn.disabled=true;
  if(out){ out.style.color='var(--ink2,#555)'; out.textContent='Recording…'; }
  try{
    const d=await xanoPost('record_payment_received',{job_id:JOB_ID,amount:amt,method:method,reference:note,recorded_by:TECH_ID||0});
    if(d&&(d.success!==false)){ if(out){out.style.color='#127a4a';out.innerHTML='✅ Recorded <b>$'+amt.toFixed(2)+'</b> ('+esc(method)+').';} loadPayStatusTech(); }
    else { if(out){out.style.color='#c0392b';out.textContent='⚠ '+((d&&d.error)||'failed');} }
  }catch(_){ if(out){out.style.color='#c0392b';out.textContent='⚠ connection error.';} }
  if(btn) btn.disabled=false;
}
async function takePayment(how){
  const out=document.getElementById('tp-note-out');
  const amt=parseFloat(String((document.getElementById('tp-amt')||{}).value||'').replace(/[^0-9.]/g,''));
  const note=String((document.getElementById('tp-note')||{}).value||'').trim() || 'Service payment';
  if(!amt||amt<=0){ if(out){ out.style.color='#c2691c'; out.textContent='Enter the amount first.'; } const i=document.getElementById('tp-amt'); if(i)i.focus(); return; }
  const ch=document.getElementById('tp-charge'), tx=document.getElementById('tp-text');
  if(ch) ch.disabled=true; if(tx) tx.disabled=true;
  if(out){ out.style.color='var(--ink2,#555)'; out.textContent=how==='charge'?'Opening secure checkout…':'Texting the customer a pay link…'; }
  try{
    const r=await fetch('/.netlify/functions/create-stripe-payment-link',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ job_id:JOB_ID, amount_cents:Math.round(amt*100), description:note, kind:'addon',
        metadata:{ addon_key:'tech_charge', name:note, mode:'service', technician_id:String(TECH_ID||''), source:'tech_collect' } })});
    const d=await r.json();
    if(!(d&&d.ok&&d.url&&!d.placeholder)){ if(out){ out.style.color='#c0392b'; out.textContent='⚠ '+((d&&d.error)||'could not start payment'); } if(ch)ch.disabled=false; if(tx)tx.disabled=false; return; }
    if(how==='charge'){ window.location.href=d.url; return; } // same-tab = reliable on mobile; hand them the phone
    // text: send the customer the checkout link
    const sr=await xanoPost('send_customer_payment_link',{job_id:JOB_ID,url:d.url,amount:amt.toFixed(2),note:note}).catch(()=>null);
    if(sr&&(sr.success||sr.sent)){ if(out){ out.style.color='#127a4a'; out.innerHTML='✅ Pay link texted — <b>$'+amt.toFixed(2)+'</b> for '+esc(note)+'.'; } }
    else { if(out){ out.style.color='#127a4a'; out.innerHTML='Link ready — <a href="'+esc(d.url)+'" target="_blank" rel="noopener" style="font-weight:800">open it here</a> or copy to send. (Auto-text not available on this job.)'; } }
    if(tx) tx.disabled=false;
  }catch(_){ if(out){ out.style.color='#c0392b'; out.textContent='⚠ connection error — try again.'; } if(ch)ch.disabled=false; if(tx)tx.disabled=false; }
}

// 🔁 ServicePower dispatch status push — SHADOW by default (servicepower-push.js logs what
// it WOULD send + writes nothing until SERVICEPOWER_PUSH_LIVE=true). Fires as the tech moves
// the job so the warranty portal updates itself. No-ops for non-ServicePower jobs server-side.
function isSPJob(){
  const wc=String((job&&job.warranty_company)||'').toLowerCase();
  if(/squaretrade|square trade|servicepower|service power|nsa/.test(wc)) return true;
  const ni=String((job&&job.notes_internal)||'');
  return /SERVICEPOWER DISPATCH/i.test(ni) || !!(job&&job.claim_number);
}
function pushSP(statusKey,notes){
  try{
    if(!JOB_ID || !isSPJob()) return;
    fetch('/.netlify/functions/servicepower-push',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({job_id:JOB_ID,status:statusKey,notes:notes||undefined})}).catch(()=>{});
  }catch(_){}
}
async function lifecycle(ep,okMsg,spStatus){
  toast('Sending…');
  try{
    const d=await xanoPost(ep,{job_id:JOB_ID,technician_id:TECH_ID});
    if(d.success){ toast(okMsg); if(spStatus) pushSP(spStatus); loadJob(); }
    else {
      const e=String(d.error||'failed');
      // Don't scare the tech with raw state-machine errors. A repeat/out-of-order
      // tap (already on-my-way / already started) is harmless — say so plainly.
      const friendly = /illegal_transition|terminal|already/i.test(e)
        ? "👍 You're already past that step — the job's moving. Tap Complete when you're done."
        : ('⚠ '+e);
      toast(friendly);
    }
  }catch(_){ toast('⚠ connection error'); }
}

// Grey out lifecycle buttons that aren't a valid next step, so a tech can't trip
// an "illegal_transition" by tapping On-my-way / Start again on a running job.
function applyLifecycleButtons(){
  const otw=document.getElementById('a-otw'), st=document.getElementById('a-start'), dn=document.getElementById('a-done');
  if(!otw||!st||!dn) return;
  const enroute=!!job.tech_en_route_at;
  const started=!!job.job_started_at || job.scheduling_status==='in_progress';
  const completed=!!job.job_completed_at || job.scheduling_status==='completed';
  const mark=(b,label)=>{ b.disabled=true; b.style.opacity='0.4'; b.style.pointerEvents='none'; b.innerHTML='<span class="ic">✓</span>'+label; };
  if(enroute||started||completed) mark(otw,'On my way');
  if(started||completed) mark(st,'Started');
  if(completed) mark(dn,'Done');
}

// 💳 Field payment — only for SELF-PAY jobs (get-invoice-status enforces it server-side,
// so warranty jobs never show this). Tech sets/confirms the amount and texts the customer
// a secure card-pay link right from the stop — no office step.
async function loadPayment(){
  const card=document.getElementById('pay-card'), body=document.getElementById('pay-body');
  if(!card||!body||!JOB_ID) return;
  let d={};
  try{ d=await fetch('/.netlify/functions/get-invoice-status?job_id='+JOB_ID).then(r=>r.json()); }catch(_){ card.style.display='none'; return; }
  if(!d||!d.self_pay){ card.style.display='none'; return; }   // warranty → never show payment
  card.style.display='';
  const full=(cust&&(cust.name||((cust.first_name||'')+' '+(cust.last_name||'')).trim()))||'the customer';
  const first=full.split(' ')[0]||'them';
  if(d.paid){
    body.innerHTML='<div style="color:#127a4a;font-weight:800;font-size:16px">✅ Paid'+(d.amount?(' — $'+Number(d.amount).toFixed(2)):'')+'</div>';
    return;
  }
  const amt=d.amount?Number(d.amount).toFixed(2):'';
  body.innerHTML=
    '<div style="font-size:13px;color:var(--dim);margin-bottom:8px">Self-pay job — text '+esc(full)+' a secure link to pay by card.</div>'
    +'<label style="font-size:12px;color:var(--dim)">Amount due ($)</label>'
    +'<input id="pay-amt" inputmode="decimal" value="'+amt+'" placeholder="0.00" style="width:100%;padding:12px;border:1px solid var(--line,#d4d9e0);border-radius:9px;font-size:16px;margin:4px 0 10px">'
    +'<button class="btn primary" id="pay-send" style="width:100%;background:#127a4a">💳 Text '+esc(first)+' a pay link</button>'
    +'<div id="pay-note" style="font-size:12.5px;margin-top:8px"></div>';
  document.getElementById('pay-send').onclick=sendPayLink;
}
async function sendPayLink(){
  const note=document.getElementById('pay-note'), btn=document.getElementById('pay-send'), inp=document.getElementById('pay-amt');
  const amt=parseFloat(String(inp.value||'').replace(/[^0-9.]/g,''));
  if(!amt||amt<=0){ note.style.color='#c2691c'; note.textContent='Enter the amount first.'; inp.focus(); return; }
  btn.disabled=true; btn.textContent='Sending…';
  try{
    await xanoPost('record_job_invoice',{job_id:JOB_ID,technician_id:TECH_ID,amount_invoiced:amt.toFixed(2)});
    const d=await xanoPost('send_customer_portal_link',{job_id:JOB_ID});

function completeFlow(){
  const types=[['repair_complete','Repair complete'],['parts_needed','Parts needed'],['reassignment_needed','Reassign'],['no_repair','No repair']];
  const out=document.getElementById('lc-stamp');
  out.innerHTML='How did it end?<div class="acts" style="margin-top:8px">'+types.map(t=>`<button class="act" data-ct="${t[0]}">${t[1]}</button>`).join('')+'</div>';
  out.querySelectorAll('[data-ct]').forEach(b=>b.onclick=async()=>{
    // Gate: a "Repair complete" must carry a report (what you found + fixed + labor),
    // or the office can't bill or authorize it. Block clearly BEFORE submitting.
    if(b.dataset.ct==='repair_complete'){
      const nEl=document.getElementById('notes');
      const note=(nEl?nEl.value:'').trim();
      const ex=(typeof pickTdr==='function' && typeof allTdrs!=='undefined') ? (pickTdr(allTdrs)||{}) : {};
      // Count the same fields pickTdr does — a TDR with a failed part + labor (e.g.
      // from a phone-call report) is a real report even if the notes box is empty.
      const hasReport = note.length>=12 || (ex.repair_completed||'').trim() || (ex.diagnosis||'').trim() || (ex.failed_component||'').trim() || Number(ex.labor_time_hours||0)>0;
      if(!hasReport){
        toast('✍️ Add your report first');
        if(nEl){ nEl.scrollIntoView({behavior:'smooth',block:'center'}); nEl.focus(); }
        alert('Before you mark this complete, the office needs your report to bill it:\n\n• what you found\n• what you fixed\n• your labor time\n\nType it in the report box, tap "Save report", then Complete.');
        return;
      }
    }
    toast('Completing…');
    try{
      // Auto-Start guard: the state machine won't go scheduled -> completed directly
      // (must pass through in_progress). Techs Complete without ever tapping Start, so
      // fire Start first if needed, or the completion silently rejects.
      if(!job.job_started_at){
        try{ await xanoPost('tech_job_started',{job_id:JOB_ID,technician_id:TECH_ID}); }catch(_){}
      }
      const d=await xanoPost('tech_job_complete',{job_id:JOB_ID,technician_id:TECH_ID,completion_type:b.dataset.ct});
      if(d.success){
        toast('Job completed ✓');
        const rpt=(document.getElementById('notes')||{}).value||'';
        pushSP('completed', rpt ? ('Job completed. '+rpt).slice(0,240) : 'Job completed.');
        loadJob();
      }
      else if(/tdr|incomplete|labor|repair|required|diagnos/i.test(String(d.error||''))){
        const nEl=document.getElementById('notes'); if(nEl) nEl.scrollIntoView({behavior:'smooth',block:'center'});
        alert('The office needs a complete report to bill this job:\n\n'+(d.error||'')+'\n\nFill in your report (what you found + fixed + labor), save it, then tap Complete.');
      }
      else { toast('⚠ '+(d.error||'blocked')); }
    }catch(_){ toast('⚠ connection error'); }
  });
}

// 🎤 Voice scribe — tech talks, Ant writes the structured report. Records audio →
// whisper-transcribe → tech-assist-brain extracts {diagnosis, part, labor, repair} →
// saves a STRUCTURED create_tdr (so invoices/SmartAutho/status all get real fields).
let mediaRec=null, audioChunks=[];
async function voiceReport(){
  const btn=document.getElementById('voice-btn');
  if(mediaRec && mediaRec.state==='recording'){ mediaRec.stop(); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(_){ toast('Mic blocked — allow microphone, or just type'); return; }
  // Record in a format the device can ACTUALLY produce. iPhones (iOS Safari)
  // CANNOT record webm — they record mp4/AAC. The old code assumed webm and
  // mislabeled the file, so the report never transcribed on iPhones (John,
  // 2026-06-30). Pick a supported type and tag the blob/file with the REAL one.
  let recMime='';
  try{ const cands=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/mp4;codecs=mp4a.40.2','audio/aac','audio/mpeg'];
    for(const c of cands){ if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)){ recMime=c; break; } } }catch(_){}
  audioChunks=[];
  try{ mediaRec = recMime ? new MediaRecorder(stream,{mimeType:recMime}) : new MediaRecorder(stream); }
  catch(_){ try{ mediaRec=new MediaRecorder(stream); }catch(__){ toast('Recording not supported on this browser — type it'); stream.getTracks().forEach(t=>t.stop()); return; } }
  mediaRec.ondataavailable=e=>{ if(e.data && e.data.size) audioChunks.push(e.data); };
  mediaRec.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    btn.textContent='🎤 Speak your report — Ant writes it up'; btn.style.background='#0a7d33';
    const realType=((mediaRec && mediaRec.mimeType) || recMime || 'audio/webm').split(';')[0];
    const ext=/mp4|aac|m4a|mpeg|mp3/i.test(realType) ? 'm4a' : 'webm';
    const blob=new Blob(audioChunks,{type:realType});
    const note=document.getElementById('save-note'); note.className='save-note'; note.textContent='Transcribing…';
    if(blob.size<800){ note.className='save-note err'; note.textContent='Didn\'t catch that — try again'; return; }
    let text='';
    try{
      const fd=new FormData(); fd.append('audio',blob,'report.'+ext);
      const r=await fetch('/.netlify/functions/whisper-transcribe',{method:'POST',body:fd});
      const d=await r.json(); text=((d&&d.text)||'').trim();
    }catch(_){}
    if(!text){ note.className='save-note err'; note.textContent='Could not transcribe — type it instead'; return; }
    const nEl=document.getElementById('notes'); nEl.value=(nEl.value?nEl.value.trim()+' ':'')+text;
    note.textContent='Writing your report…';
    let cap={};
    try{
      const r=await fetch('/.netlify/functions/tech-assist-brain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        tech_id:TECH_ID, job_id:JOB_ID, brand:(job.brand||''), appliance:(job.appliance_type||job.appliance||''),
        problem:(job.problem_summary||''), existing_captured:{}, message:text
      })});
      const d=await r.json(); cap=(d&&d.captured)||{};
    }catch(_){}
    const partEl=document.getElementById('tdr-part'); if(partEl && cap.verified_part_number && !partEl.value) partEl.value=cap.verified_part_number;
    const body={ job_id:JOB_ID, technician_id:TECH_ID, technician_notes:nEl.value.trim() };
    if(cap.diagnosis) body.diagnosis=cap.diagnosis;
    if(cap.failed_component) body.failed_component=cap.failed_component;
    if(cap.verified_part_number) body.verified_part_number=cap.verified_part_number;
    if(cap.repair_completed) body.repair_completed=cap.repair_completed;
    if(cap.labor_hours){ const lh=parseFloat(cap.labor_hours); if(lh>0) body.labor_time_hours=lh; }
    try{
      const d=await xanoPost('create_tdr',body);
      if(d && d.tdr){ const filled=(cap.diagnosis||cap.repair_completed||cap.failed_component); note.className='save-note ok'; note.textContent=filled?'✓ Report saved — Ant filled it from your voice':'✓ Report saved'; if(typeof loadJob==='function') loadJob(); }
      else { note.className='save-note err'; note.textContent=d.message||d.error||'save failed'; }
    }catch(_){ note.className='save-note err'; note.textContent='connection error'; }
  };
  mediaRec.start();
  btn.textContent='⏹ Stop & save report'; btn.style.background='#d94545';
  toast('Recording — say what you found, what you fixed, and your labor time');
}

async function uploadFile(file,kind){
  if(!file) return;
  // Video → Cloudflare Stream (resumable, survives weak signal), S3 fallback.
  // Photos stay on S3 (small files).
  if(kind==='video' && window.AntVideo){
    toast('Uploading video…');
    try{
      const r=await AntVideo.upload(file,{ jobId:JOB_ID, uploadedBy:'tech',
        onStatus:(phase,a,pct)=>{ if(phase==='uploading') toast('Uploading video… '+Math.round((pct||0)*100)+'%'); else if(phase==='retry') toast('Weak signal — retrying…'); },
        s3Fallback:f=>uploadFileS3(f,'video') });
      if(r&&r.ok){ toast('Video added ✓'); loadAttachments(); }
      else toast('⚠ video upload failed — try again');
    }catch(e){ toast('⚠ upload failed: '+(e&&e.message||e)); }
    return;
  }
  if(kind==='photo' && window.AntPhoto){
    toast('Uploading photo…');
    try{
      const r=await AntPhoto.upload(file,{ jobId:JOB_ID, uploadedBy:'tech',
        onStatus:(phase,a)=>{ if(phase==='retry') toast('Weak signal — retrying…'); },
        s3Fallback:f=>uploadFileS3(f,'photo') });
      if(r&&r.ok){ toast('Photo added ✓'); loadAttachments();
        if(r.via==='cfimages' && r.deliveryUrl) readModelFromUrl(r.deliveryUrl, r.id||null);
        else if(r.via==='proxy' && r.s3_key) readModelFromPhoto(r.s3_key, r.attachment_id||null);
      } else toast('⚠ photo upload failed — try again');
    }catch(e){ toast('⚠ upload failed: '+(e&&e.message||e)); }
    return;
  }
  return uploadFileS3(file,kind);
}
async function uploadFileS3(file,kind){
  if(!file) return {ok:false};
  toast('Uploading '+kind+'…');
  try{
    const gen=await xanoPost('generate_upload_url',{job_id:JOB_ID,attachment_type:'tdr',file_type:kind,original_filename:file.name||(kind+'.dat'),mime_type:file.type||(kind==='video'?'video/mp4':'image/jpeg'),uploaded_by:'tech',tech_id:TECH_ID});
    if(!gen.success) throw new Error(gen.error||'gen failed');
    const pres=await fetch('/.netlify/functions/s3-presign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({s3_key:gen.s3_key,mime_type:file.type||(kind==='video'?'video/mp4':'image/jpeg')})}).then(r=>r.json());
    if(!pres.success||!pres.upload_url) throw new Error('presign failed');
    const put=await fetch(pres.upload_url,{method:'PUT',headers:{'Content-Type':file.type||(kind==='video'?'video/mp4':'image/jpeg')},body:file});
    if(!put.ok) throw new Error('S3 upload failed');
    await xanoPost('save_attachment',{attachment_id:gen.attachment_id,file_size_bytes:file.size||0});
    toast(kind.charAt(0).toUpperCase()+kind.slice(1)+' added ✓');
    loadAttachments();
    if(kind==='photo') readModelFromPhoto(gen.s3_key, gen.attachment_id);   // auto-OCR model/part stickers
    return {ok:true};
  }catch(e){ toast('⚠ upload failed: '+e.message); return {ok:false}; }
}

  const model=document.getElementById('pf-model').value.trim();
  const symptom=document.getElementById('pf-symptom').value.trim();
  const out=document.getElementById('pf-out'); const btn=document.getElementById('pf-go');
  if(!model){ out.innerHTML='<div class="empty">Enter the model number first.</div>'; return; }
  btn.disabled=true; btn.textContent='Finding…'; out.innerHTML='<div class="loading"><div class="spinner"></div>Searching catalogs…</div>';
  try{
    const d=await fetch('/.netlify/functions/parts-finder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,brand:appliance.brand||'',appliance_type:appliance.type||'',symptom})}).then(r=>r.json());
    if(!d.success) throw new Error(d.error||'lookup failed');
    let html='';
    const topPN=(d.from_history&&d.from_history[0]&&d.from_history[0].part_number)||(d.candidates&&d.candidates[0]&&d.candidates[0].part_number)||'';
    if(d.from_history&&d.from_history.length){
      html+='<div style="font-size:12px;font-weight:800;color:#127a4a;margin-bottom:6px">✅ WE\'VE USED THESE BEFORE — highest trust</div>';
      html+=d.from_history.map(h=>`<div class="cand" style="border-left:3px solid #2ecc71;background:#f1faf4"><span class="pn">${esc(h.part_number)}</span><span class="conf high" style="background:#d6f5e3;color:#127a4a">${esc(h.match)}</span><div class="cn">${esc(h.failed_component||'')}</div>${mcBadge(h.marcone)}</div>`).join('');
    }
    if(d.candidates&&d.candidates.length){
      html+='<div style="font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 6px">AI SUGGESTIONS — verify on the diagram</div>';
      html+=d.candidates.map(c=>`<div class="cand"><span class="pn">${esc(c.part_number||'?')}</span><span class="conf ${esc((c.confidence||'low'))}">${esc(c.confidence||'low')}</span><div class="cn">${esc(c.name||'')}${c.note?(' — '+esc(c.note)):''}</div>${mcBadge(c.marcone)}</div>`).join('');
    }
    if(d.ai_note) html+='<div class="ai-note">'+esc(d.ai_note)+'</div>';
    // 📐 THE DIAGRAM IS THE HERO — see the exploded picture, tap your part, read the real
    // number off it. Part names differ by brand, so the picture is the source of truth.
    html+='<div style="font-size:14px;font-weight:800;color:#0a7d33;margin:14px 0 3px">📐 OPEN A DIAGRAM — find the exact part</div>';
    html+='<div style="font-size:12px;color:var(--ink2);margin-bottom:8px">See the exploded picture → tap the part → read the real number. Names differ by brand, so the picture is the truth.</div>';
    html+=(d.catalogs||[]).map(c=>`<a class="cat" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.label)} ↗</a>`).join('');
    // Got the number off the diagram? Check it live on Marcone (our API — net cost + stock).
    html+=`<div style="border:1px solid #cfe6d8;background:#f1faf4;border-radius:10px;padding:11px;margin-top:12px">
      <div style="font-size:12px;font-weight:800;color:#0a7d33;margin-bottom:7px">🔧 Got the number? Check Marcone — price + stock</div>
      <div style="display:flex;gap:7px">
        <input id="mc-pn" value="${esc(topPN)}" placeholder="Part #" autocapitalize="characters" style="flex:1;padding:10px;border:1px solid #cdd6e2;border-radius:8px;font-size:15px">
        <button id="mc-go" class="btn primary" style="width:auto;padding:10px 16px;background:#0a7d33;font-size:14px">Check</button>
      </div>
      <div id="mc-out" style="margin-top:9px"></div>
    </div>`;
    html+='<div class="warnbox">⚠ Confirm the part number on the exploded diagram before ordering. Never read part numbers to the customer.</div>';
    out.innerHTML=html;
    const mcGo=document.getElementById('mc-go'); if(mcGo) mcGo.onclick=marconeCheck;
    const mcPn=document.getElementById('mc-pn'); if(mcPn) mcPn.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); marconeCheck(); } });
  }catch(e){ out.innerHTML='<div class="empty">⚠ '+esc(e.message)+'</div>'; }
  finally{ btn.disabled=false; btn.textContent='Find the part'; }
}

// 🔧 Marcone live price + stock for a known part # (our API, account net cost).
// Internal only — never show cost to the customer.
async function marconeCheck(){
  const pnEl=document.getElementById('mc-pn'); const out=document.getElementById('mc-out'); const btn=document.getElementById('mc-go');
  if(!pnEl||!out) return;
  const pn=(pnEl.value||'').trim();
  if(!pn){ out.innerHTML='<div class="empty">Enter a part # (read it off the diagram).</div>'; return; }
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  out.innerHTML='<div class="loading"><div class="spinner"></div>Checking Marcone…</div>';
  try{
    const d=await fetch('/.netlify/functions/marcone-lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({part_number:pn})}).then(r=>r.json());
    const r=d&&d.results&&d.results[0];
    if(!r||!r.found){ out.innerHTML='<div style="font-size:13px;color:#9a3b3b">⚪ <b>'+esc(pn)+'</b> not in Marcone — double-check the number on the diagram (could be a sub / superseded #).</div>'; return; }
    const cost=(r.cost!=null)?('$'+Number(r.cost).toFixed(2)):'—';
    const stk=r.in_stock?('🟢 '+(r.total_qty||0)+' in stock'):'🔴 out of stock';
    const eta=(r.eta_days!=null&&r.eta_days!=='')?(' · ETA '+r.eta_days+'d'):'';
    const where=r.in_stock_at?(' · '+esc(String(r.in_stock_at))):'';
    const flags=[r.discontinued?'⚠ discontinued':'', r.drop_ship_only?'drop-ship only':'', r.hazmat?'hazmat':''].filter(Boolean).join(' · ');
    out.innerHTML='<div style="border:1px solid #cfe6d8;background:#fff;border-radius:8px;padding:10px">'
      +'<div style="font-weight:800;font-size:15px">'+esc(r.part_number||pn)+(r.make?(' <span style="font-weight:600;color:#5a6a85;font-size:12px">'+esc(r.make)+'</span>'):'')+'</div>'
      +(r.description?('<div style="font-size:12.5px;color:#5a6a85;margin:2px 0 6px">'+esc(r.description)+'</div>'):'')
      +'<div style="font-size:15px;font-weight:800;color:#0a7d33">'+cost+' <span style="font-weight:700;color:'+(r.in_stock?'#127a4a':'#c0392b')+';font-size:13px">· '+stk+eta+where+'</span></div>'
      +(flags?('<div style="font-size:11.5px;color:#c0392b;margin-top:4px">'+flags+'</div>'):'')
      +'</div>';
  }catch(e){ out.innerHTML='<div class="empty">⚠ '+esc(e.message)+'</div>'; }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Check'; } }
}

// ── Diagnose / error code: grounded brief (fault codes + our past fixes + similar jobs) ──
async function diagnose(){
  const model=document.getElementById('pf-model').value.trim();
  const symptom=document.getElementById('pf-symptom').value.trim();
  const out=document.getElementById('dx-out'); const btn=document.getElementById('dx-go');
  if(!model && !symptom){ out.innerHTML='<div class="empty">Enter the model # and/or symptom/error code.</div>'; return; }
  btn.disabled=true; btn.textContent='Thinking…';
  out.innerHTML='<div class="loading"><div class="spinner"></div>Diagnosing — fault codes, your past fixes, similar jobs…</div>';
  try{
    const d=await fetch('/.netlify/functions/ant-troubleshoot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand:appliance.brand||'',model,appliance:appliance.type||'',symptom,role:'tech'})}).then(r=>r.json());
    if(!d||!d.ok){ out.innerHTML='<div class="empty">Couldn\'t diagnose right now — try again.</div>'; return; }
    let html='';
    const fc=d.fault_code;
    if(fc && (fc.code||fc.meaning||fc.description)){
      html+=`<div class="cand" style="border-left:3px solid #2d7ef7;background:#eef4ff"><span class="pn">${esc(fc.code||'code')}</span><div class="cn">${esc(fc.meaning||fc.description||'')}</div></div>`;
    }
    html+='<div style="font-size:13.5px;line-height:1.55;margin-top:8px">'+mdToHtml(d.answer_md||'')+'</div>';
    if(d.grounded===false) html+='<div style="font-size:11px;color:var(--dim);margin-top:8px">Thin shop history on this one — verify on the diagram / tech sheet before ordering.</div>';
    out.innerHTML=html||'<div class="empty">No diagnosis available.</div>';
  }catch(e){ out.innerHTML='<div class="empty">⚠ '+esc(e.message)+'</div>'; }
  finally{ btn.disabled=false; btn.textContent='🧠 Diagnose / error code'; }
}
// tiny markdown → html (headers, bold, bullets, citations, line breaks)
function mdToHtml(md){
  let h=esc(md||'');
  h=h.replace(/^#{2,3} (.*)$/gm,'<div style="font-weight:800;margin:9px 0 3px">$1</div>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h=h.replace(/^\s*[-*] (.*)$/gm,'<div style="margin:1px 0 1px 10px">• $1</div>');
  h=h.replace(/\[([^\]\n]{1,40}?)\]/g,'<span style="color:#2d7ef7;font-size:11px">[$1]</span>');
  h=h.replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
  return h;
}

// ── Recalls + tech sheets: CPSC (official, always-on) + MSA World (tech sheets) ──
// CPSC recalls load immediately (free API, no daemon). MSA adds tech sheets +
// bulletins when the Mac daemon is up. Internal reference only.
async function modelIntel(){
  const model=document.getElementById('pf-model').value.trim();
  const out=document.getElementById('mi-out'); const btn=document.getElementById('mi-go');
  if(!model){ out.innerHTML='<div class="empty">Enter the model number first.</div>'; return; }
  const brand=appliance.brand||''; const appl=appliance.type||'';
  btn.disabled=true; btn.textContent='Checking…';
  out.innerHTML='<div class="loading"><div class="spinner"></div>Checking recalls + tech sheets…</div>';
  // 1) CPSC official recalls — always-on, fast
  let cpsc=[];
  try{ const c=await fetch('/.netlify/functions/cpsc-recalls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand,appliance:appl,model})}).then(r=>r.json()); cpsc=(c&&c.recalls)||[]; }catch(_){}
  // 2) MSA cache (tech sheets/bulletins)
  let msa=null;
  try{ const r=await fetch('/.netlify/functions/get-model-intel?brand='+encodeURIComponent(brand)+'&model='+encodeURIComponent(model)).then(x=>x.json()); if(r&&r.found) msa=r.result; }catch(_){}
  renderIntel(msa,cpsc,out,!msa,false);
  if(!msa){
    try{
      const rq=await fetch('/.netlify/functions/request-model-intel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand,model,appliance:appl})}).then(x=>x.json());
      const rid=rq&&rq.request_id;
      if(rid){ for(let i=0;i<14;i++){ await new Promise(s=>setTimeout(s,3500)); const r=await fetch('/.netlify/functions/get-model-intel?request_id='+encodeURIComponent(rid)).then(x=>x.json()).catch(()=>({})); if(r&&r.found){ renderIntel(r.result,cpsc,out,false,false); btn.disabled=false; btn.textContent='📋 Recalls + tech sheets'; return; } } }
    }catch(_){}
    renderIntel(null,cpsc,out,false,true);
  }
  btn.disabled=false; btn.textContent='📋 Recalls + tech sheets';
}
function renderIntel(res,cpsc,out,msaPending,msaTimedOut){
  res=res||{}; cpsc=cpsc||[];
  const recalls=res.recalls||[], bulletins=res.bulletins||[], sheets=res.tech_sheets||[];
  let html='';
  if(cpsc.length){
    html+='<div style="font-size:12px;font-weight:800;color:#c0392b;margin:2px 0 6px">⚠️ OFFICIAL RECALLS (CPSC)</div>';
    html+=cpsc.map(r=>{
      const mm=r.matched_model?'<span style="background:#e74c3c;color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:800;margin-left:6px">MATCHES THIS MODEL</span>':'';
      const link=r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:#c0392b;font-weight:700">${esc(r.title||'recall')} ↗</a>`:`<b>${esc(r.title||'recall')}</b>`;
      return `<div class="cand" style="border-left:3px solid #e74c3c;background:#fdf0ee"><div class="cn">${link}${mm}</div><div style="font-size:11px;color:#7a3b34;margin-top:3px">${esc(r.date||'')}${r.hazard?(' · '+esc(r.hazard)):''}${r.remedy?('<br>Remedy: '+esc(r.remedy)):''}</div></div>`;
    }).join('');
  }
  if(recalls.length){
    html+='<div style="font-size:12px;font-weight:700;color:#c0392b;margin:12px 0 6px">⚠️ MSA RECALLS / SAFETY</div>';
    html+=recalls.map(x=>`<div class="cand" style="border-left:3px solid #e74c3c;background:#fdf0ee"><div class="cn">${esc(x.text||x)}</div></div>`).join('');
  }
  if(bulletins.length){
    html+='<div style="font-size:12px;font-weight:700;color:#c2691c;margin:12px 0 6px">📋 SERVICE BULLETINS (MSA)</div>';
    html+=bulletins.map(x=>`<div class="cand" style="border-left:3px solid #e6a23c;background:#fdf7ec"><div class="cn">${esc(x.text||x)}</div></div>`).join('');
  }
  if(sheets.length){
    html+='<div style="font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 6px">📄 TECH SHEETS / MANUALS (MSA)</div>';
    html+=sheets.map(x=>{const url=x.url||x.href||x.link||'';const title=x.title||x.text||x.name||url||'tech sheet';return url?`<a class="cat" href="${esc(url)}" target="_blank" rel="noopener">${esc(title)} ↗</a>`:`<div class="cand"><div class="cn">${esc(title)}</div></div>`;}).join('');
  }
  if(msaPending) html+='<div style="font-size:11px;color:var(--dim);margin-top:10px"><span class="spinner" style="width:10px;height:10px;border-width:2px;display:inline-block;vertical-align:middle"></span> Pulling tech sheets from MSA World…</div>';
  else if(msaTimedOut) html+='<div style="font-size:11px;color:var(--dim);margin-top:10px">MSA tech sheets unavailable right now (daemon offline) — recalls above are from CPSC.</div>';
  if(!cpsc.length && !recalls.length && !bulletins.length && !sheets.length && !msaPending) html='<div class="empty">No recalls or tech sheets found for this model.</div>';
  if(cpsc.length||recalls.length||bulletins.length||sheets.length) html+='<div class="warnbox">Internal reference — don\'t read recall/part details to the customer.</div>';
  out.innerHTML=html;
}

// Live Marcone cost + stock badge under a candidate (internal only — never shown
// to the customer). Green = in stock, orange = out, gray = not in Marcone.
function mcBadge(m){
  if(!m) return '';
  if(!m.found) return '<div style="font-size:11px;color:#9aa3af;margin-top:4px">⚪ not in Marcone</div>';
  const cost = (m.cost!=null) ? ('$'+Number(m.cost).toFixed(2)) : '—';
  const inStock = m.in_stock && m.total_qty>0;
  const col = inStock ? '#127a4a' : '#c2691c';
  const bg = inStock ? '#e9f9f0' : '#fdf1e3';
  const stk = inStock ? (m.total_qty+' in stock'+((m.eta_days!=null&&m.eta_days<=1)?' · ships now':'')) : 'out of stock';
  return `<div style="display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;color:${col};background:${bg};border-radius:6px;padding:2px 8px">🔧 Marcone ${esc(cost)} · ${esc(stk)}</div>`;
}

// ── utils ───────────────────────────────────────────────────────
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDay(ms){try{return new Date(ms).toLocaleDateString('en-US',{timeZone:'America/Chicago',weekday:'short',month:'short',day:'numeric'});}catch(_){return '';}}
function fmtTime(ms){try{return new Date(ms).toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase().replace(/\s/g,'');}catch(_){return '';}}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

document.getElementById('pin').addEventListener('keypress',e=>{if(e.key==='Enter')submitPin();});
initAuth();
