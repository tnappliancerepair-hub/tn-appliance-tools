<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ant Office — Calendar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
    overflow: hidden;
  }

  :root {
    --bg: #0e1118;
    --bg-2: #131720;
    --panel: #131720;
    --panel-2: #1a1f2c;
    --border: #2a3040;
    --border-soft: #1f2533;
    --text: #e8edf5;
    --muted: #8a93aa;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --green: #00d68f;
    --green-bg: rgba(0,214,143,0.10);
    --green-bg-strong: rgba(0,214,143,0.16);
    --orange: #f5a623;
    --orange-bg: rgba(245,166,35,0.12);
    --orange-bg-strong: rgba(245,166,35,0.20);
    --red: #ff6b6b;
    --red-bg: rgba(255,107,107,0.10);
    --red-bg-strong: rgba(255,107,107,0.18);
    --blue: #5aa9ff;
    --violet: #b48cff;
    --gray: rgba(138,147,170,0.04);
  }

  /* ── Office password gate ───────────────────────────────────────── */
  .auth-gate {
    position: fixed; inset: 0;
    background: rgba(14,17,24,0.97);
    backdrop-filter: blur(6px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-gate.show { display: flex; }
  .auth-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px 26px;
    max-width: 380px; width: 100%;
    text-align: center;
  }
  .auth-card .ant { font-size: 36px; margin-bottom: 8px; }
  .auth-card .title { font-size: 18px; font-weight: 700; }
  .auth-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; margin-bottom: 22px; font-family: var(--mono); }
  .auth-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s;
    font-family: var(--mono);
    text-align: center;
    letter-spacing: 2px;
  }
  .auth-input:focus { border-color: var(--orange); }
  .auth-submit {
    margin-top: 14px;
    width: 100%;
    background: var(--orange);
    color: #1a1208;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: opacity 0.15s, transform 0.05s;
  }
  .auth-submit:active { transform: scale(0.98); }
  .auth-err {
    margin-top: 12px;
    font-size: 12px;
    color: var(--red);
    min-height: 16px;
  }

  /* ── Header ────────────────────────────────────────────────────── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(180deg, #0e1118, #131720);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 14px;
    z-index: 90;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .topbar .ant { font-size: 22px; }
  .topbar .title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .topbar .title-sub {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 1px;
  }

  .topbar .week-display {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 8px;
  }
  .week-range {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    font-family: var(--mono);
    letter-spacing: -0.01em;
    min-width: 200px;
  }
  .nav-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: border-color 0.15s, background 0.15s, transform 0.05s;
  }
  .nav-btn:hover { border-color: var(--orange); }
  .nav-btn:active { transform: scale(0.97); }
  .nav-btn.today-btn {
    width: auto;
    padding: 0 14px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .nav-btn.today-btn.active {
    background: transparent;
    color: var(--orange);
    border-color: rgba(245,166,35,0.3);
    pointer-events: none;
  }

  .topbar .spacer { flex: 1; }

  .new-job-btn {
    background: var(--green);
    color: #082018;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    height: 36px;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s, transform 0.05s;
  }
  .new-job-btn:hover { opacity: 0.92; }
  .new-job-btn:active { transform: scale(0.98); }
  .new-job-btn .plus { font-size: 16px; line-height: 1; }

  /* ── Main scroll container ─────────────────────────────────────── */
  .scroll {
    position: fixed;
    top: 60px;
    left: 0; right: 0; bottom: 0;
    overflow: auto;
    padding: 14px;
    background: var(--bg);
  }

  /* ── Unassigned banner ─────────────────────────────────────────── */
  .unassigned {
    background: rgba(180,140,255,0.06);
    border: 1px solid rgba(180,140,255,0.25);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: none;
  }
  .unassigned.show { display: block; }
  .unassigned .head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .unassigned .head .icon { font-size: 18px; }
  .unassigned .head .label {
    font-size: 13px;
    font-weight: 700;
    color: var(--violet);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .unassigned .head .count {
    background: var(--violet);
    color: #1a0e2e;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    font-family: var(--mono);
  }
  .unassigned .list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }
  .unassigned .item {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.05s;
  }
  .unassigned .item:hover { border-color: var(--violet); background: var(--panel-2); }
  .unassigned .item:active { transform: scale(0.99); }
  .unassigned .item .when {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .unassigned .item .cust {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-top: 2px;
  }
  .unassigned .item .what {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── Calendar grid ─────────────────────────────────────────────── */
  .calendar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .cal-header,
  .cal-row {
    display: grid;
    grid-template-columns: 96px repeat(var(--tech-count, 6), minmax(180px, 1fr));
  }

  .cal-header {
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .cal-header .corner {
    padding: 12px;
    border-right: 1px solid var(--border-soft);
  }
  .cal-header .tech-cell {
    padding: 12px 10px;
    border-right: 1px solid var(--border-soft);
    text-align: center;
  }
  .cal-header .tech-cell:last-child { border-right: 0; }
  .cal-header .tech-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .cal-header .tech-id {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 2px;
  }

  .cal-row {
    border-top: 1px solid var(--border-soft);
    min-height: 168px;
  }
  .cal-row.today {
    background: linear-gradient(90deg, rgba(245,166,35,0.04), transparent 6%);
    box-shadow: inset 4px 0 0 var(--orange);
  }

  .cal-day-label {
    padding: 12px 10px;
    border-right: 1px solid var(--border-soft);
    background: var(--bg-2);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .cal-row.today .cal-day-label {
    background: rgba(245,166,35,0.06);
  }
  .cal-day-label .dow {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: var(--mono);
    font-weight: 700;
  }
  .cal-row.today .cal-day-label .dow { color: var(--orange); }
  .cal-day-label .date {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
    margin-top: 4px;
    letter-spacing: -0.02em;
  }
  .cal-day-label .month {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── Cells ─────────────────────────────────────────────────────── */
  .cell {
    border-right: 1px solid var(--border-soft);
    padding: 10px 8px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
    transition: background 0.15s;
  }
  .cell:last-child { border-right: 0; }

  .cell.cap-green  { background: var(--green-bg); }
  .cell.cap-yellow { background: var(--orange-bg); }
  .cell.cap-red    { background: var(--red-bg); }
  .cell.cap-off {
    background: var(--gray);
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 12px,
      rgba(138,147,170,0.05) 12px 13px
    );
  }

  .cap {
    display: flex;
    align-items: baseline;
    gap: 3px;
    line-height: 1;
    user-select: none;
    margin-bottom: 4px;
  }
  .cap .num {
    font-size: 32px;
    font-weight: 800;
    font-family: var(--mono);
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .cell.cap-green  .cap .num { color: var(--green); }
  .cell.cap-yellow .cap .num { color: var(--orange); }
  .cell.cap-red    .cap .num { color: var(--red); }
  .cell.cap-off    .cap .num { color: var(--muted); }

  .cap .denom {
    font-size: 14px;
    color: var(--muted);
    font-family: var(--mono);
    font-weight: 600;
  }
  .cap .label {
    margin-left: auto;
    font-size: 9px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
  }
  .cell.cap-off .cap .label { color: var(--muted); }

  .blocks {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }

  .blk {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
    display: block;
    min-height: 32px;
  }
  .blk:hover { background: var(--panel-2); border-left-color: var(--orange); }
  .blk:active { transform: scale(0.99); }
  .blk.bk-warranty { border-left-color: var(--violet); }
  .blk.bk-self_pay { border-left-color: var(--green); }
  .blk.bk-completed { opacity: 0.6; border-left-color: var(--muted); }
  .blk .row1 {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
  }
  .blk .row1 .time {
    color: var(--muted);
    font-family: var(--mono);
    font-weight: 600;
    flex-shrink: 0;
  }
  .blk .row1 .name {
    color: var(--text);
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .blk .row2 {
    display: flex;
    gap: 6px;
    margin-top: 2px;
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .blk .row2 .app { color: var(--muted); }
  .blk .row2 .city { color: var(--muted); opacity: 0.7; }
  .blk .row2 .city::before { content: "·"; margin-right: 4px; }

  .off-label {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    opacity: 0.7;
  }

  /* ── Footer totals row ─────────────────────────────────────────── */
  .cal-totals {
    display: grid;
    grid-template-columns: 96px repeat(var(--tech-count, 6), minmax(180px, 1fr));
    border-top: 2px solid var(--border);
    background: var(--bg-2);
    position: sticky;
    bottom: 0;
  }
  .cal-totals .tot-label {
    padding: 14px 10px;
    border-right: 1px solid var(--border-soft);
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-totals .tot-cell {
    padding: 12px 10px;
    border-right: 1px solid var(--border-soft);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
    justify-content: center;
  }
  .cal-totals .tot-cell:last-child { border-right: 0; }
  .cal-totals .tot-num {
    font-size: 22px;
    font-weight: 800;
    font-family: var(--mono);
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .cal-totals .tot-sub {
    font-size: 9px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── States ────────────────────────────────────────────────────── */
  .loading {
    padding: 60px 24px;
    text-align: center;
  }
  .loading .ant {
    font-size: 36px;
    animation: bob 1.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .loading .msg {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13px;
    font-family: var(--mono);
  }

  .err-banner {
    margin: 12px 0;
    padding: 14px 16px;
    background: rgba(255,107,107,0.08);
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 10px;
    font-size: 13px;
    color: var(--red);
  }
  .err-banner button {
    margin-top: 8px;
    background: var(--red);
    color: #200a0a;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--mono);
    cursor: pointer;
  }

  /* ── Responsive ────────────────────────────────────────────────── */
  @media (max-width: 1100px) {
    .cal-header,
    .cal-row,
    .cal-totals {
      grid-template-columns: 80px repeat(var(--tech-count, 6), minmax(150px, 1fr));
    }
    .calendar { overflow-x: auto; }
    .cal-header, .cal-row, .cal-totals { min-width: max-content; }
    .cap .num { font-size: 26px; }
  }
  @media (max-width: 700px) {
    .topbar { padding: 0 10px; gap: 8px; }
    .topbar .title-sub { display: none; }
    .week-range { min-width: 140px; font-size: 12px; }
    .new-job-btn { padding: 0 12px; font-size: 11px; }
    .cap .num { font-size: 22px; }
    .blk .row1 { font-size: 10px; }
    .blk .row2 { display: none; }
    .cal-header,
    .cal-row,
    .cal-totals {
      grid-template-columns: 60px repeat(var(--tech-count, 6), minmax(120px, 1fr));
    }
  }
</style>
</head>
<body>

<!-- Office password gate -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="ant">🐜</div>
    <div class="title">Ant Office</div>
    <div class="sub">enter office password</div>
    <input type="password" class="auth-input" id="authInput" placeholder="••••••••" autocomplete="off">
    <button class="auth-submit" id="authSubmit">Unlock</button>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- App -->
<div id="app" style="display: none;">
  <div class="topbar">
    <div class="brand">
      <div class="ant">🐜</div>
      <div>
        <div class="title">Calendar</div>
        <div class="title-sub">Ant Office</div>
      </div>
    </div>
    <div class="week-display">
      <button class="nav-btn" id="prevWeek" title="previous week">‹</button>
      <button class="nav-btn today-btn" id="todayBtn">Today</button>
      <button class="nav-btn" id="nextWeek" title="next week">›</button>
      <span class="week-range" id="weekRange">—</span>
    </div>
    <div class="view-toggle" style="display:flex; gap:6px; margin-left:10px;">
      <button class="nav-btn view-btn active" id="viewWeekBtn" title="Week grid view" data-view="week">Week</button>
      <button class="nav-btn view-btn" id="viewTodayBtn" title="Today list view" data-view="today">Today</button>
    </div>
    <div class="spacer"></div>
    <a class="new-job-btn" href="book.html" id="newJobBtn"><span class="plus">+</span> New Job</a>
  </div>

  <div class="scroll" id="scroll">
    <div id="content"></div>
  </div>
</div>

<!-- Initial loading state -->
<div class="loading" id="loading" style="position: fixed; inset: 60px 0 0 0; display: none;">
  <div class="ant">🐜</div>
  <div class="msg">loading the week…</div>
</div>

<script>
(function() {
  'use strict';

  // ── Config ─────────────────────────────────────────────────────
  const OFFICE_AUTH_KEY = 'tn_office_auth_v1';
  const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
  const CAPACITY_MAX = 6;
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ── URL params ─────────────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  let currentWeekStart = params.get('week') || null;  // YYYY-MM-DD (Monday)
  let serverTodayCT = null;
  let dashboardData = null;
  let lastTechs = [];
  let lastJobsById = {};

  // ── DOM refs ───────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const authGate = $('authGate');
  const authInput = $('authInput');
  const authSubmit = $('authSubmit');
  const authErr = $('authErr');
  const app = $('app');
  const loading = $('loading');
  const content = $('content');
  const weekRange = $('weekRange');
  const prevWeek = $('prevWeek');
  const nextWeek = $('nextWeek');
  const todayBtn = $('todayBtn');
  const newJobBtn = $('newJobBtn');
  const viewWeekBtn = $('viewWeekBtn');
  const viewTodayBtn = $('viewTodayBtn');
  let currentView = (params.get('view') === 'today') ? 'today' : 'week';

  // ── Auth ───────────────────────────────────────────────────────
  function unlock() {
    authGate.classList.remove('show');
    app.style.display = 'block';
    loading.style.display = 'block';
    loadWeek();
  }

  function tryUnlock() {
    if (localStorage.getItem(OFFICE_AUTH_KEY) === 'ok') {
      unlock();
    } else {
      authGate.classList.add('show');
      authInput.focus();
    }
  }

  authSubmit.addEventListener('click', submitAuth);
  authInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuth(); });

  async function submitAuth() {
    const val = authInput.value;
    if ((await __verifyOfficePassword(val))) {
      localStorage.setItem(OFFICE_AUTH_KEY, 'ok');
      authErr.textContent = '';
      unlock();
    } else {
      authErr.textContent = 'wrong password.';
      authInput.value = '';
      authInput.focus();
    }
  }

  // ── Data load ──────────────────────────────────────────────────
  async function loadWeek() {
    loading.style.display = 'block';
    content.innerHTML = '';

    let url = `${XANO_BASE}/get_office_calendar_week`;
    if (currentWeekStart) url += `?week_start=${encodeURIComponent(currentWeekStart)}`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (!data || data.success !== true) {
        showError(data && data.error ? data.error : 'failed to load week');
        return;
      }
      dashboardData = data;
      serverTodayCT = data.today_ct;
      currentWeekStart = data.week_start_ct;
      render(data);
    } catch (err) {
      console.error(err);
      showError('network error: ' + err.message);
    } finally {
      loading.style.display = 'none';
    }
  }

  function showError(msg) {
    content.innerHTML = `<div class="err-banner">${escapeHtml(msg)}<br><button onclick="location.reload()">retry</button></div>`;
  }

  // ── Render ─────────────────────────────────────────────────────
  function render(data) {
    renderHeader(data);

    const techs = data.technicians || [];
    const jobs = data.jobs || [];
    const availability = data.availability || [];
    const techCount = Math.max(techs.length, 1);

    lastTechs = techs;
    lastJobsById = {};
    for (const j of jobs) lastJobsById[j.id] = j;

    // Branch on view mode. Today view replaces the week grid with a
    // chronological list of all jobs scheduled for today across all techs.
    if (currentView === 'today') {
      renderTodayView(data, techs, jobs);
      return;
    }

    // Index data
    // assigned[techId][dateStr] -> [jobs]
    // unassigned -> jobs
    const assigned = {};
    const unassigned = [];
    for (const t of techs) assigned[t.id] = {};
    for (const j of jobs) {
      const dateStr = ctDateForMs(j.scheduled_start);
      if (!j.technician_id || j.technician_id === 0) {
        unassigned.push(j);
        continue;
      }
      if (!assigned[j.technician_id]) assigned[j.technician_id] = {};
      if (!assigned[j.technician_id][dateStr]) assigned[j.technician_id][dateStr] = [];
      assigned[j.technician_id][dateStr].push(j);
    }

    // dayOff[techId][dateStr] -> true
    const dayOff = {};
    // workWindow[techId][dateStr] -> {start, end}
    const workWindow = {};
    for (const a of availability) {
      const tid = a.technician_id;
      const date = a.blocked_date;
      if (!tid || !date) continue;
      if (a.full_day_off) {
        if (!dayOff[tid]) dayOff[tid] = {};
        dayOff[tid][date] = true;
      } else if (a.start_time || a.end_time) {
        if (!workWindow[tid]) workWindow[tid] = {};
        workWindow[tid][date] = { start: a.start_time, end: a.end_time };
      }
    }

    // Build the 7 day strings
    const days = [];
    const weekStart = parseYMD(data.week_start_ct);
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(d.getDate() + i);
      days.push({
        dateStr: ymd(d),
        d,
        dowShort: DOW[d.getDay()],
        monthShort: MONTHS[d.getMonth()],
        dayNum: d.getDate(),
        isToday: ymd(d) === serverTodayCT,
      });
    }

    // Build markup
    const parts = [];

    if (unassigned.length > 0) {
      parts.push(renderUnassigned(unassigned));
    }

    parts.push(`<div class="calendar" style="--tech-count:${techCount}">`);

    // Tech header row
    parts.push(`<div class="cal-header">`);
    parts.push(`<div class="corner"></div>`);
    for (const t of techs) {
      parts.push(`
        <div class="tech-cell">
          <div class="tech-name">${escapeHtml((t.first_name || '').trim() + ' ' + (t.last_name || '').trim().slice(0,1) + (t.last_name ? '.' : ''))}</div>
          <div class="tech-id">#${t.id}</div>
        </div>
      `);
    }
    parts.push(`</div>`);

    // Day rows
    for (const day of days) {
      const todayClass = day.isToday ? ' today' : '';
      parts.push(`<div class="cal-row${todayClass}">`);
      parts.push(`
        <div class="cal-day-label">
          <div class="dow">${day.dowShort}</div>
          <div class="date">${day.dayNum}</div>
          <div class="month">${day.monthShort}</div>
        </div>
      `);

      for (const t of techs) {
        const cellJobs = (assigned[t.id] && assigned[t.id][day.dateStr]) || [];
        const isOff = !!(dayOff[t.id] && dayOff[t.id][day.dateStr]);
        parts.push(renderCell(t, day, cellJobs, isOff));
      }

      parts.push(`</div>`);
    }

    // Totals footer
    parts.push(`<div class="cal-totals">`);
    parts.push(`<div class="tot-label">Week</div>`);
    for (const t of techs) {
      let total = 0;
      for (const dateStr in (assigned[t.id] || {})) {
        total += assigned[t.id][dateStr].length;
      }
      parts.push(`
        <div class="tot-cell">
          <div class="tot-num">${total}</div>
          <div class="tot-sub">${total === 1 ? 'job' : 'jobs'}</div>
        </div>
      `);
    }
    parts.push(`</div>`);

    parts.push(`</div>`);  // close .calendar

    content.innerHTML = parts.join('');
    attachClickHandlers();
  }

  function renderUnassigned(list) {
    const items = list.map((j) => {
      const time = fmtTime(j.scheduled_start);
      const date = fmtDayShort(j.scheduled_start);
      const cust = `${(j.customer_first_name||'').trim()} ${(j.customer_last_name||'').trim()}`.trim() || '(no customer)';
      const appl = (j.appliance_type || 'appliance').toLowerCase();
      return `
        <a class="item" href="job-detail.html?job_id=${j.id}">
          <div class="when">${date} · ${time}</div>
          <div class="cust">${escapeHtml(cust)}</div>
          <div class="what">${escapeHtml(appl)} · ${escapeHtml(j.service_city || '')}</div>
        </a>
      `;
    }).join('');
    return `
      <div class="unassigned show">
        <div class="head">
          <div class="icon">⚠️</div>
          <div class="label">Needs Assignment</div>
          <div class="count">${list.length}</div>
        </div>
        <div class="list">${items}</div>
      </div>
    `;
  }

  function renderCell(tech, day, jobs, isOff) {
    if (isOff) {
      return `
        <div class="cell cap-off" data-tech-id="${tech.id}" data-date="${day.dateStr}">
          <div class="cap">
            <span class="num">⛔</span>
            <span class="label">day off</span>
          </div>
          <div class="off-label">off</div>
        </div>
      `;
    }
    const count = jobs.length;
    const remaining = Math.max(0, CAPACITY_MAX - count);
    let tier = 'green';
    if (count >= 5) tier = 'red';
    else if (count >= 3) tier = 'yellow';
    const blocks = jobs.map((j) => renderBlock(j)).join('');
    const techName = ((tech.first_name || '') + ' ' + (tech.last_name || '')).trim() || ('Tech ' + tech.id);
    return `
      <div class="cell cap-${tier} book-cell"
           data-tech-id="${tech.id}"
           data-tech-name="${escapeHtml(techName)}"
           data-date="${day.dateStr}"
           data-day-label="${escapeHtml(day.dowShort + ' ' + day.monthShort + ' ' + day.dayNum)}"
           title="Click empty space to book on this day">
        <div class="cap">
          <span class="num">${remaining}</span>
          <span class="denom">/${CAPACITY_MAX}</span>
          <span class="label">${remaining === 1 ? 'slot' : 'slots'}</span>
        </div>
        <div class="blocks">${blocks}</div>
      </div>
    `;
  }

  function renderBlock(j) {
    const time = fmtTimeShort(j.scheduled_start);
    const cust = `${(j.customer_first_name||'').trim()} ${(j.customer_last_name||'').trim().slice(0,1)}${j.customer_last_name ? '.' : ''}`.trim() || '(no name)';
    const appl = (j.appliance_type || '').toLowerCase();
    const brand = (j.brand || '').trim();
    const city = (j.service_city || '').trim();
    const status = (j.scheduling_status || '').toLowerCase();
    const ct = (j.customer_type || '').toLowerCase();

    let bk = 'self_pay';
    if (ct === 'warranty') bk = 'warranty';
    if (status === 'completed') bk = 'completed';

    const applLine = brand ? `${appl} · ${brand}` : appl;
    return `
      <div class="blk bk-${bk}" data-job-id="${j.id}" role="button" tabindex="0"
           title="Click to reschedule, reassign, or cancel">
        <div class="row1">
          <span class="time">${time}</span>
          <span class="name">${escapeHtml(cust)}</span>
        </div>
        <div class="row2">
          <span class="app">${escapeHtml(applLine)}</span>
          ${city ? `<span class="city">${escapeHtml(city)}</span>` : ''}
        </div>
      </div>
    `;
  }

  function attachClickHandlers() {
    // Click on any empty cell space (NOT on a job block) opens the booking modal.
    document.querySelectorAll('.book-cell').forEach((cell) => {
      cell.addEventListener('click', (e) => {
        if (e.target.closest('.blk')) return; // job block click — handled below
        if (cell.classList.contains('cap-off')) return; // tech off — can't book
        openBookingModal({
          tech_id: cell.dataset.techId,
          tech_name: cell.dataset.techName,
          date: cell.dataset.date,
          day_label: cell.dataset.dayLabel,
        });
      });
    });
    // Click on a job block opens the manage modal (Reschedule / Reassign / Cancel).
    document.querySelectorAll('.blk[data-job-id]').forEach((blk) => {
      blk.addEventListener('click', (e) => {
        e.stopPropagation();
        openManageJobModal(Number(blk.dataset.jobId));
      });
      blk.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openManageJobModal(Number(blk.dataset.jobId));
        }
      });
    });
  }

  function renderHeader(data) {
    weekRange.textContent = fmtWeekRange(data.week_start_ct, data.week_end_ct);
    const isCurrent = data.week_start_ct === currentWeekOfDateStr(data.today_ct);
    todayBtn.classList.toggle('active', isCurrent);
    todayBtn.textContent = isCurrent ? 'this week' : 'jump to today';
    // View toggle active state.
    viewWeekBtn?.classList.toggle('active', currentView === 'week');
    viewTodayBtn?.classList.toggle('active', currentView === 'today');
  }

  function renderTodayView(data, techs, jobs) {
    const todayStr = data.today_ct;
    // Today's jobs across all techs, sorted by scheduled_start ascending.
    const todayJobs = jobs
      .filter((j) => ctDateForMs(j.scheduled_start) === todayStr || (!j.scheduled_start && (j.unassigned || !j.technician_id)))
      .sort((a, b) => {
        const aMs = a.scheduled_start || 0;
        const bMs = b.scheduled_start || 0;
        if (!aMs && !bMs) return 0;
        if (!aMs) return 1;
        if (!bMs) return -1;
        return aMs - bMs;
      });

    const techById = {};
    for (const t of techs) techById[t.id] = t;

    if (todayJobs.length === 0) {
      content.innerHTML = `
        <div class="today-empty" style="padding:60px 20px;text-align:center;color:var(--muted);font-family:var(--mono)">
          <div style="font-size:48px;margin-bottom:12px">🐜</div>
          <div style="font-size:16px">No jobs scheduled today (${todayStr}).</div>
          <div style="margin-top:8px;font-size:13px">Click "Week" above to see the full week, or "+ New Job" to book one.</div>
        </div>
      `;
      return;
    }

    const parts = [];
    parts.push(`<div class="today-header" style="padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--border-soft)">
      <div style="font-family:var(--display);letter-spacing:0.06em;font-size:18px;color:var(--text)">Today — ${todayStr}</div>
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px">${todayJobs.length} ${todayJobs.length === 1 ? 'job' : 'jobs'} across ${techs.length} techs</div>
    </div>`);
    parts.push(`<div class="today-list" style="padding:8px 12px">`);

    for (const j of todayJobs) {
      const time = j.scheduled_start ? fmtTimeShort(j.scheduled_start) : '—';
      const cust = `${(j.customer_first_name||'').trim()} ${(j.customer_last_name||'').trim()}`.trim() || '(no name)';
      const appl = (j.appliance_type || '').toLowerCase();
      const brand = (j.brand || '').trim();
      const city = (j.service_city || '').trim();
      const status = (j.scheduling_status || '').toLowerCase();
      const ct = (j.customer_type || '').toLowerCase();
      const tech = techById[j.technician_id];
      const techLabel = tech
        ? `${(tech.first_name || '').trim()} ${(tech.last_name || '').trim().slice(0,1)}${tech.last_name ? '.' : ''}`.trim()
        : 'unassigned';

      let bk = 'self_pay';
      if (ct === 'warranty') bk = 'warranty';
      if (status === 'completed') bk = 'completed';

      parts.push(`
        <div class="today-row blk bk-${bk}" data-job-id="${j.id}" role="button" tabindex="0"
             style="display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:12px 14px;margin:8px 0;border-radius:8px;cursor:pointer;min-height:48px">
          <div style="font-family:var(--mono);font-weight:700;color:var(--text);font-size:14px">${escapeHtml(time)}</div>
          <div>
            <div style="font-weight:700;color:var(--text);font-size:14px">${escapeHtml(cust)}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">
              ${escapeHtml(appl)}${brand ? ' · ' + escapeHtml(brand) : ''}${city ? ' · ' + escapeHtml(city) : ''}
            </div>
          </div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">${escapeHtml(techLabel)}</div>
        </div>
      `);
    }
    parts.push(`</div>`);
    content.innerHTML = parts.join('');
    attachClickHandlers();
  }

  // ── Nav ────────────────────────────────────────────────────────
  prevWeek.addEventListener('click', () => stepWeek(-7));
  nextWeek.addEventListener('click', () => stepWeek(7));

  // View toggle. Today view re-renders the same loaded data — no extra fetch.
  function setView(view) {
    if (view !== 'week' && view !== 'today') return;
    if (currentView === view) return;
    currentView = view;
    updateUrl();
    if (dashboardData) render(dashboardData);
    else loadWeek();
  }
  viewWeekBtn?.addEventListener('click', () => setView('week'));
  viewTodayBtn?.addEventListener('click', () => setView('today'));
  todayBtn.addEventListener('click', () => {
    if (!serverTodayCT) return;
    currentWeekStart = currentWeekOfDateStr(serverTodayCT);
    updateUrl();
    loadWeek();
  });

  function stepWeek(deltaDays) {
    const d = parseYMD(currentWeekStart);
    d.setDate(d.getDate() + deltaDays);
    currentWeekStart = ymd(d);
    updateUrl();
    loadWeek();
  }

  function updateUrl() {
    const url = new URL(window.location.href);
    if (currentWeekStart && currentWeekStart === currentWeekOfDateStr(serverTodayCT)) {
      url.searchParams.delete('week');
    } else if (currentWeekStart) {
      url.searchParams.set('week', currentWeekStart);
    }
    if (currentView === 'today') url.searchParams.set('view', 'today');
    else url.searchParams.delete('view');
    window.history.replaceState({}, '', url.toString());
  }

  function currentWeekOfDateStr(dateStr) {
    if (!dateStr) return null;
    const d = parseYMD(dateStr);
    // Walk back to Monday (ISO: Mon=1..Sun=7)
    const dow = d.getDay();  // 0=Sun..6=Sat
    const daysBack = dow === 0 ? 6 : dow - 1;
    d.setDate(d.getDate() - daysBack);
    return ymd(d);
  }

  // ── Utilities ──────────────────────────────────────────────────
  function ymd(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function parseYMD(s) {
    if (!s) return new Date();
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function ctDateForMs(ms) {
    if (!ms) return null;
    // Format the UTC ms in America/Chicago and extract Y-M-D
    const f = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Chicago',
      year: 'numeric', month: '2-digit', day: '2-digit',
    });
    const parts = f.formatToParts(new Date(Number(ms)));
    const m = {};
    for (const p of parts) m[p.type] = p.value;
    return `${m.year}-${m.month}-${m.day}`;
  }

  function fmtTime(ms) {
    if (!ms) return '—';
    return new Date(Number(ms)).toLocaleTimeString('en-US', {
      timeZone: 'America/Chicago',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true,
    });
  }

  function fmtTimeShort(ms) {
    if (!ms) return '—';
    return new Date(Number(ms)).toLocaleTimeString('en-US', {
      timeZone: 'America/Chicago',
      hour: 'numeric',
      hour12: true,
    }).replace(' ', '').toLowerCase();
  }

  function fmtDayShort(ms) {
    if (!ms) return '—';
    return new Date(Number(ms)).toLocaleDateString('en-US', {
      timeZone: 'America/Chicago',
      weekday: 'short',
      month: 'short',
      day: 'numeric',
    });
  }

  function fmtWeekRange(startStr, endStr) {
    const s = parseYMD(startStr);
    const e = parseYMD(endStr);
    const sm = MONTHS[s.getMonth()];
    const em = MONTHS[e.getMonth()];
    if (sm === em) return `${sm} ${s.getDate()} – ${e.getDate()}, ${e.getFullYear()}`;
    return `${sm} ${s.getDate()} – ${em} ${e.getDate()}, ${e.getFullYear()}`;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ── Booking modal ──────────────────────────────────────────────
  const bookingModal = document.getElementById('bookingModal');
  const bookingForm = document.getElementById('bookingForm');
  const bookingHeader = document.getElementById('bookingHeader');
  const bookingError = document.getElementById('bookingError');
  const bookingSubmit = document.getElementById('bookingSubmit');
  const bookingCancel = document.getElementById('bookingCancel');

  let bookingCtx = null;

  function openBookingModal(ctx) {
    bookingCtx = ctx;
    bookingHeader.textContent = `Book — ${ctx.tech_name} · ${ctx.day_label}`;
    bookingError.textContent = '';
    bookingForm.reset();
    bookingSubmit.disabled = false;
    bookingSubmit.textContent = 'Book it';
    bookingModal.classList.add('open');
    setTimeout(() => document.getElementById('bookPhone').focus(), 40);
  }

  function closeBookingModal() {
    bookingModal.classList.remove('open');
    bookingCtx = null;
  }

  bookingCancel.addEventListener('click', closeBookingModal);
  bookingModal.addEventListener('click', (e) => {
    if (e.target === bookingModal) closeBookingModal();
  });

  function ctMs(dateStr, ctHour) {
    // dateStr "YYYY-MM-DD"; ctHour 0-23 in America/Chicago.
    // Use a UTC probe to find CT's current offset on that date (handles DST).
    const probe = new Date(`${dateStr}T12:00:00Z`);
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Chicago',
      timeZoneName: 'shortOffset',
    }).formatToParts(probe);
    const offsetStr = (parts.find((p) => p.type === 'timeZoneName') || {}).value || 'GMT-5';
    const m = offsetStr.match(/GMT([+-]\d+)/);
    const offsetHrs = m ? parseInt(m[1], 10) : -5;
    const [y, mo, d] = dateStr.split('-').map(Number);
    return Date.UTC(y, mo - 1, d, ctHour - offsetHrs, 0, 0);
  }

  bookingForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!bookingCtx) return;
    bookingError.textContent = '';

    const fd = new FormData(bookingForm);
    const window = fd.get('time_window') || '';
    if (!window) {
      bookingError.textContent = 'Pick a time window.';
      return;
    }
    const windowHour = window === '8-11am' ? 8 : window === '11am-2pm' ? 11 : window === '2-5pm' ? 14 : 8;
    const windowEndHour = window === '8-11am' ? 11 : window === '11am-2pm' ? 14 : 17;
    const scheduled_start_ms = ctMs(bookingCtx.date, windowHour);
    const scheduled_end_ms = ctMs(bookingCtx.date, windowEndHour);

    const first_name = (fd.get('first_name') || '').toString().trim();
    const last_name = (fd.get('last_name') || '').toString().trim();
    const phone = (fd.get('phone') || '').toString().trim();
    const zip = (fd.get('zip') || '').toString().trim();
    const appliance_type = (fd.get('appliance_type') || '').toString().trim();
    const brand = (fd.get('brand') || '').toString().trim();
    const problem_summary = (fd.get('problem_summary') || '').toString().trim();
    const service_address = (fd.get('service_address') || '').toString().trim();
    const service_city = (fd.get('service_city') || '').toString().trim();
    const service_state = (fd.get('service_state') || '').toString().trim();
    const customer_type = (fd.get('customer_type') || 'self_pay').toString();
    const warranty_company = (fd.get('warranty_company') || '').toString().trim();

    if (!first_name || !phone) {
      bookingError.textContent = 'First name + phone are required.';
      return;
    }
    if (!appliance_type || !problem_summary) {
      bookingError.textContent = 'Appliance type + problem summary are required.';
      return;
    }

    bookingSubmit.disabled = true;
    bookingSubmit.textContent = 'Booking...';
    try {
      const res = await fetch(`${XANO_BASE}/book_appointment_from_office`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          first_name,
          last_name,
          phone,
          zip,
          email: '',
          service_address,
          service_city,
          service_state,
          appliance_type,
          brand,
          model_number: '',
          problem_summary,
          technician_id: parseInt(bookingCtx.tech_id, 10),
          scheduled_start_ms,
          scheduled_end_ms,
          service_eta_window: window,
          customer_type,
          warranty_company,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        bookingError.textContent = (data && (data.error || data.message)) || `book failed (${res.status})`;
        bookingSubmit.disabled = false;
        bookingSubmit.textContent = 'Book it';
        return;
      }
      closeBookingModal();
      loadWeek();
    } catch (err) {
      bookingError.textContent = 'Network problem. Try again.';
      bookingSubmit.disabled = false;
      bookingSubmit.textContent = 'Book it';
    }
  });

  // ── Manage-job modal (Reschedule / Reassign / Cancel) ──────────
  const manageModal = document.getElementById('manageModal');
  const manageHeader = document.getElementById('manageHeader');
  const manageSubhead = document.getElementById('manageSubhead');
  const manageError = document.getElementById('manageError');
  const manageActions = document.getElementById('manageActions');
  const manageRescheduleForm = document.getElementById('manageRescheduleForm');
  const manageReassignForm = document.getElementById('manageReassignForm');
  const manageCancelForm = document.getElementById('manageCancelForm');
  const manageOpenDetail = document.getElementById('manageOpenDetail');
  const manageClose = document.getElementById('manageClose');
  const manageBack = document.querySelectorAll('.manage-back');

  let manageJobId = null;

  function openManageJobModal(jobId) {
    const j = lastJobsById[jobId];
    if (!j) {
      alert('Job not found in current calendar view.');
      return;
    }
    manageJobId = jobId;
    const cust = `${(j.customer_first_name||'').trim()} ${(j.customer_last_name||'').trim()}`.trim() || '(no name)';
    const time = j.scheduled_start ? fmtTime(j.scheduled_start) : 'no time';
    const day = j.scheduled_start ? fmtDayShort(j.scheduled_start) : '';
    manageHeader.textContent = `Job #${jobId} — ${cust}`;
    manageSubhead.textContent = `${(j.appliance_type||'').toLowerCase()} · ${day} ${time}`;
    manageError.textContent = '';
    showManageView('actions');
    manageOpenDetail.href = `job-detail.html?job_id=${jobId}`;
    // Pre-fill reschedule with current scheduled_start (CT)
    if (j.scheduled_start) {
      const d = new Date(j.scheduled_start);
      const parts = new Intl.DateTimeFormat('sv-SE', {
        timeZone: 'America/Chicago',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false,
      }).formatToParts(d);
      const get = (t) => (parts.find((p) => p.type === t) || {}).value || '00';
      const dtVal = `${get('year')}-${get('month')}-${get('day')}T${get('hour')}:${get('minute')}`;
      document.getElementById('rescheduleAt').value = dtVal;
    }
    // Populate the reassign tech selector
    const sel = document.getElementById('reassignTech');
    sel.innerHTML = lastTechs
      .filter((t) => t.id !== j.technician_id)
      .map((t) => `<option value="${t.id}">${escapeHtml((t.first_name || '').trim() + ' ' + (t.last_name || '').trim())} (#${t.id})</option>`)
      .join('') || '<option value="">No other techs</option>';
    document.getElementById('cancelReason').value = '';
    manageModal.classList.add('open');
  }

  function closeManageJobModal() {
    manageModal.classList.remove('open');
    manageJobId = null;
  }

  function showManageView(view) {
    manageActions.style.display = view === 'actions' ? 'grid' : 'none';
    manageRescheduleForm.style.display = view === 'reschedule' ? 'block' : 'none';
    manageReassignForm.style.display = view === 'reassign' ? 'block' : 'none';
    manageCancelForm.style.display = view === 'cancel' ? 'block' : 'none';
    manageError.textContent = '';
  }

  manageClose.addEventListener('click', closeManageJobModal);
  manageModal.addEventListener('click', (e) => {
    if (e.target === manageModal) closeManageJobModal();
  });
  manageBack.forEach((btn) => btn.addEventListener('click', () => showManageView('actions')));

  document.getElementById('manageBtnReschedule').addEventListener('click', () => showManageView('reschedule'));
  document.getElementById('manageBtnReassign').addEventListener('click', () => showManageView('reassign'));
  document.getElementById('manageBtnCancel').addEventListener('click', () => showManageView('cancel'));

  function localDatetimeToMs(value) {
    // value like "2026-05-26T14:30" — interpret as America/Chicago wall time.
    const [datePart, timePart] = value.split('T');
    const [h, m] = timePart.split(':').map(Number);
    // Convert CT wall-time to ms using ctMs (defined above for booking modal).
    return ctMs(datePart, h) + m * 60000;
  }

  manageRescheduleForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!manageJobId) return;
    const dtValue = document.getElementById('rescheduleAt').value;
    if (!dtValue) { manageError.textContent = 'Pick a date + time.'; return; }
    const newStartMs = localDatetimeToMs(dtValue);
    const btn = e.submitter || document.getElementById('rescheduleSubmit');
    btn.disabled = true; btn.textContent = 'Rescheduling...';
    try {
      const res = await fetch(`${XANO_BASE}/reschedule_job`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: manageJobId, new_start_ms: newStartMs }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        manageError.textContent = (data && (data.error || data.message)) || `Reschedule failed (${res.status})`;
      } else {
        closeManageJobModal(); loadWeek(); return;
      }
    } catch (err) {
      manageError.textContent = 'Network problem. Try again.';
    }
    btn.disabled = false; btn.textContent = 'Reschedule';
  });

  manageReassignForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!manageJobId) return;
    const techId = Number(document.getElementById('reassignTech').value);
    if (!techId) { manageError.textContent = 'Pick a tech.'; return; }
    const btn = e.submitter || document.getElementById('reassignSubmit');
    btn.disabled = true; btn.textContent = 'Reassigning...';
    try {
      const res = await fetch(`${XANO_BASE}/reassign_job`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: manageJobId, technician_id: techId }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        manageError.textContent = (data && (data.error || data.message)) || `Reassign failed (${res.status})`;
      } else {
        closeManageJobModal(); loadWeek(); return;
      }
    } catch (err) {
      manageError.textContent = 'Network problem. Try again.';
    }
    btn.disabled = false; btn.textContent = 'Reassign';
  });

  manageCancelForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!manageJobId) return;
    if (!confirm('Cancel this job? This cannot be undone from here.')) return;
    const reason = (document.getElementById('cancelReason').value || '').trim();
    const btn = e.submitter || document.getElementById('cancelSubmit');
    btn.disabled = true; btn.textContent = 'Canceling...';
    try {
      const res = await fetch(`${XANO_BASE}/cancel_job`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: manageJobId, reason }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        manageError.textContent = (data && (data.error || data.message)) || `Cancel failed (${res.status})`;
      } else {
        closeManageJobModal(); loadWeek(); return;
      }
    } catch (err) {
      manageError.textContent = 'Network problem. Try again.';
    }
    btn.disabled = false; btn.textContent = 'Cancel job';
  });

  // ── Boot ───────────────────────────────────────────────────────
  tryUnlock();
})();
</script>
