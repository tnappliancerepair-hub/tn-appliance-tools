<script>
// Run after the DOM is parsed — the booking/manage modal elements are defined
// BELOW this script, so binding them at parse time threw (null addEventListener)
// and blanked the page. DOMContentLoaded guarantees they exist.
function __initCalendar() {
  'use strict';

  // ── Config ─────────────────────────────────────────────────────
  const OFFICE_AUTH_KEY = 'tn_office_auth_v1';
  const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
  const CAPACITY_MAX = 6;
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ── URL params ─────────────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  // Default to TODAY (CT) so the grid opens today-forward (the upcoming work),
  // not the Mon-Sun week that's mostly in the past. The endpoint renders 7 days
  // from whatever week_start we send (it only snaps to Monday when none given).
  let currentWeekStart = params.get('week') || new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  let serverTodayCT = null;
  let dashboardData = null;
  // CASH-ONLY payment hold: which self-pay jobs are PAID. Warranty jobs are NEVER
  // in this map and NEVER held — a warranty customer must never see a payment flag.
  let CASH_PAID = {};
  async function loadCashPaid(unscheduled) {
    const cashIds = (unscheduled || [])
      .filter((j) => { const ct = String(j.customer_type || '').toLowerCase(); return ct === 'self_pay' || ct === 'cash' || ct === 'customer_pay'; })
      .map((j) => j.id);
    if (!cashIds.length) { CASH_PAID = {}; return; }
    try {
      const r = await fetch('/.netlify/functions/cash-payment-status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: cashIds }) });
      const d = await r.json();
      CASH_PAID = (d && d.paid) || {};
    } catch (_) { CASH_PAID = {}; }  // on failure, self-pay defaults to held (safe)
  }
  let lastTechs = [];
  let lastJobsById = {};

  // ── DOM refs ───────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const authGate = $('authGate');
  const authInput = $('authInput');
  const authSubmit = $('authSubmit');
  const authErr = $('authErr');
  const app = $('app');
  const loading = $('loading');
  const content = $('content');
  const weekRange = $('weekRange');
  const prevWeek = $('prevWeek');
  const nextWeek = $('nextWeek');
  const todayBtn = $('todayBtn');
  const newJobBtn = $('newJobBtn');
  const viewWeekBtn = $('viewWeekBtn');
  const viewTodayBtn = $('viewTodayBtn');
  const viewListBtn = $('viewListBtn');
  // Phones default to the list ("today") view — the wide week grid is desktop-
  // only. Explicit ?view= always wins.
  let currentView = params.get('view') === 'today' ? 'today'
    : params.get('view') === 'list' ? 'list'
    : params.get('view') === 'week' ? 'week'
    : (window.innerWidth < 760 ? 'today' : 'week');

  // Per-tech show/hide filter (HCP-style). hiddenTechs holds tech ids to HIDE
  // (0 = Unassigned). Persisted so the office's view sticks across reloads.
  let hiddenTechs = new Set();
  try { const raw = localStorage.getItem('tn_cal_hidden_techs'); if (raw) hiddenTechs = new Set(JSON.parse(raw).map(Number)); } catch (_) {}
  function saveHidden() { try { localStorage.setItem('tn_cal_hidden_techs', JSON.stringify([...hiddenTechs])); } catch (_) {} }

  // ── Auth ───────────────────────────────────────────────────────
  function unlock() {
    authGate.classList.remove('show');
    app.style.display = 'block';
    loading.style.display = 'block';
    loadWeek();
  }

  function tryUnlock() {
    // Accept EITHER office auth key so a login on any office page unlocks the
    // calendar too (the rest of the office uses tn_office_auth='1'; this page
    // historically used tn_office_auth_v1='ok' — that split was the "black
    // screen": logged in elsewhere, calendar didn't recognize it).
    if (localStorage.getItem(OFFICE_AUTH_KEY) === 'ok' || localStorage.getItem('tn_office_auth') === '1' || (window.OfficeAuth&&window.OfficeAuth.isLoggedIn())||(window.OFFICE_READONLY&&window.TechAuth&&window.TechAuth.session())) {
      unlock();
    } else {
      authGate.classList.add('show');
      authInput.focus();
    }
  }

  authSubmit.addEventListener('click', submitAuth);
  authInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuth(); });

  // Self-contained password verify — this page does NOT define it inline
  // elsewhere and office-search.js?v=20260703i doesn't provide it, so without this the
  // unlock threw and the page stayed blank.
  async function __verifyOfficePassword(pw) {
    try {
      const r = await fetch(`${XANO_BASE}/verify_office_password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      const d = await r.json().catch(() => ({}));
      return d && d.success === true;
    } catch (_) {
      return false;
    }
  }

  async function submitAuth() {
    const val = authInput.value;
    if ((await __verifyOfficePassword(val))) {
      localStorage.setItem(OFFICE_AUTH_KEY, 'ok');
      try { localStorage.setItem('tn_office_auth', '1'); } catch (_) {}
      authErr.textContent = '';
      unlock();
    } else {
      authErr.textContent = 'wrong password.';
      authInput.value = '';
      authInput.focus();
    }
  }

  // ── Data load ──────────────────────────────────────────────────
  async function loadWeek() {
    loading.style.display = 'block';
    content.innerHTML = '';

    let url = `${XANO_BASE}/get_office_calendar_week`;
    if (currentWeekStart) url += `?week_start=${encodeURIComponent(currentWeekStart)}`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (!data || data.success !== true) {
        showError(data && data.error ? data.error : 'failed to load week');
        return;
      }
      dashboardData = data;
      serverTodayCT = data.today_ct;
      currentWeekStart = data.week_start_ct;
      await loadCashPaid(data.unscheduled || []);   // cash-only payment hold
      render(data);
    } catch (err) {
      console.error(err);
      showError('network error: ' + err.message);
    } finally {
      loading.style.display = 'none';
    }
  }

  function showError(msg) {
    content.innerHTML = `<div class="err-banner">${escapeHtml(msg)}<br><button onclick="location.reload()">retry</button></div>`;
  }

  // Bird's-eye health bar: how many jobs are placed, across how many techs, and
  // how many still need scheduling — so the office can verify "is everyone in
  // and correct" in one glance.
  function renderSummaryBar(data) {
    const el = document.getElementById('calSummary');
    if (!el) return;
    const jobs = data.jobs || [];
    const unscheduled = data.unscheduled || [];
    let scheduled = 0, unassigned = 0;
    const techSet = {};
    for (const j of jobs) {
      if (j.technician_id && j.technician_id !== 0) { scheduled++; techSet[j.technician_id] = 1; }
      else { unassigned++; }
    }
    const needs = unassigned + unscheduled.length;
    const nTechs = Object.keys(techSet).length;
    const needsCls = needs > 0 ? 'cs-strong cs-warn' : 'cs-strong';
    el.innerHTML =
      `<span class="cs-label">📋 this week:</span> `
      + `<span class="cs-strong">${scheduled}</span> scheduled across <span class="cs-strong">${nTechs}</span> ${nTechs === 1 ? 'tech' : 'techs'}`
      + `<span class="cs-sep">·</span>`
      + `<span class="${needsCls}">${needs}</span> still need scheduling`;
  }

  // ── Render ─────────────────────────────────────────────────────
  function render(data) {
    renderHeader(data);
    renderSummaryBar(data);

    const allTechs = data.technicians || [];
    const allJobs = data.jobs || [];
    renderTechFilter(allTechs);                          // HCP-style show/hide-by-tech checklist
    const showUnassigned = !hiddenTechs.has(0);
    const techs = allTechs.filter((t) => !hiddenTechs.has(Number(t.id)));
    const jobs = allJobs.filter((j) => { const tid = Number(j.technician_id) || 0; return tid === 0 ? showUnassigned : !hiddenTechs.has(tid); });
    const unscheduled = data.unscheduled || [];
    const availability = data.availability || [];
    const techCount = Math.max(techs.length, 1);

    lastTechs = techs;
    lastJobsById = {};
    for (const j of allJobs) lastJobsById[j.id] = j;
    // Include unscheduled jobs so the tray can open them in the same
    // schedule/reschedule modal as everything else.
    for (const j of unscheduled) lastJobsById[j.id] = j;

    // Branch on view mode.
    if (currentView === 'today') { renderTodayView(data, techs, jobs); return; }
    if (currentView === 'list') { renderListView(data, techs, jobs); return; }

    // Index data
    // assigned[techId][dateStr] -> [jobs]
    // unassigned -> jobs
    const assigned = {};
    const unassigned = [];
    for (const t of techs) assigned[t.id] = {};
    for (const j of jobs) {
      const dateStr = ctDateForMs(j.scheduled_start);
      if (!j.technician_id || j.technician_id === 0) {
        unassigned.push(j);
        continue;
      }
      if (!assigned[j.technician_id]) assigned[j.technician_id] = {};
      if (!assigned[j.technician_id][dateStr]) assigned[j.technician_id][dateStr] = [];
      assigned[j.technician_id][dateStr].push(j);
    }

    // dayOff[techId][dateStr] -> true
    const dayOff = {};
    // workWindow[techId][dateStr] -> {start, end}
    const workWindow = {};
    for (const a of availability) {
      const tid = a.technician_id;
      const date = a.blocked_date;
      if (!tid || !date) continue;
      if (a.full_day_off) {
        if (!dayOff[tid]) dayOff[tid] = {};
        dayOff[tid][date] = true;
      } else if (a.start_time || a.end_time) {
        if (!workWindow[tid]) workWindow[tid] = {};
        workWindow[tid][date] = { start: a.start_time, end: a.end_time };
      }
    }

    // Build the 7 day strings
    const days = [];
    const weekStart = parseYMD(data.week_start_ct);
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(d.getDate() + i);
      days.push({
        dateStr: ymd(d),
        d,
        dowShort: DOW[d.getDay()],
        monthShort: MONTHS[d.getMonth()],
        dayNum: d.getDate(),
        isToday: ymd(d) === serverTodayCT,
      });
    }

    // Build markup
    const parts = [];

    if (unassigned.length > 0) {
      parts.push(renderUnassigned(unassigned));
    }

    if (unscheduled.length > 0) {
      parts.push(renderUnscheduled(unscheduled));
    }

    parts.push(`<div class="calendar" style="--tech-count:${techCount}">`);

    // Tech header row
    parts.push(`<div class="cal-header">`);
    parts.push(`<div class="corner"></div>`);
    for (const t of techs) {
      parts.push(`
        <div class="tech-cell">
          <div class="tech-name">${escapeHtml((t.first_name || '').trim() + ' ' + (t.last_name || '').trim().slice(0,1) + (t.last_name ? '.' : ''))}</div>
          <div class="tech-id">#${t.id}</div>
        </div>
      `);
    }
    parts.push(`</div>`);

    // Day rows
    for (const day of days) {
      const todayClass = day.isToday ? ' today' : '';
      parts.push(`<div class="cal-row${todayClass}">`);
      parts.push(`
        <div class="cal-day-label">
          <div class="dow">${day.dowShort}</div>
          <div class="date">${day.dayNum}</div>
          <div class="month">${day.monthShort}</div>
        </div>
      `);

      for (const t of techs) {
        const cellJobs = (assigned[t.id] && assigned[t.id][day.dateStr]) || [];
        const isOff = !!(dayOff[t.id] && dayOff[t.id][day.dateStr]);
        parts.push(renderCell(t, day, cellJobs, isOff));
      }

      parts.push(`</div>`);
    }

    // Totals footer
    parts.push(`<div class="cal-totals">`);
    parts.push(`<div class="tot-label">Week</div>`);
    for (const t of techs) {
      let total = 0;
      for (const dateStr in (assigned[t.id] || {})) {
        total += assigned[t.id][dateStr].length;
      }
      parts.push(`
        <div class="tot-cell">
          <div class="tot-num">${total}</div>
          <div class="tot-sub">${total === 1 ? 'job' : 'jobs'}</div>
        </div>
      `);
    }
    parts.push(`</div>`);

    parts.push(`</div>`);  // close .calendar

    content.innerHTML = parts.join('');
    attachClickHandlers();
  }

  function renderUnassigned(list) {
    const items = list.map((j) => {
      const time = fmtTime(j.scheduled_start);
      const date = fmtDayShort(j.scheduled_start);
      const cust = `${(j.customer_first_name||'').trim()} ${(j.customer_last_name||'').trim()}`.trim() || '(no customer)';
      const appl = (j.appliance_type || 'appliance').toLowerCase();
      return `
        <a class="item" href="office-board.html?job=${j.id}">
          <div class="when">${date} · ${time}</div>
          <div class="cust">${escapeHtml(cust)}</div>
          <div class="what">${escapeHtml(appl)} · ${escapeHtml(j.service_city || '')}</div>
        </a>
      `;
    }).join('');
    return `
      <div class="unassigned show">
        <div class="head">
          <div class="icon">⚠️</div>
          <div class="label">Needs Assignment</div>
          <div class="count">${list.length}</div>
        </div>
        <div class="list">${items}</div>
      </div>
    `;
  }

  // Parts badge — the "are the parts in or not" signal. Shows on any job
  // (scheduled or unscheduled) that's waiting on parts, with the ETA date.
  function partsBadge(j) {
    const ps = (j.parts_status || '').toLowerCase();
    const waiting = ['awaiting_parts', 'ordered', 'on_order', 'pending', 'parts_needed'].includes(ps);
    if (!waiting) return '';
    let eta = '';
    if (j.parts_eta_date) {
      const s = String(j.parts_eta_date);
      eta = ' · ETA ' + (s.length >= 10 ? s.slice(5, 10) : s);
    }
    return `<span class="parts-badge" title="waiting on parts (${escapeHtml(ps)})">⏳ parts${eta}</span>`;
  }

  // Unscheduled queue tray — who HASN'T been scheduled (incl. anything the
  // auto-scheduler couldn't route). Tap an item to open the same schedule/
  // reschedule modal and place it onto a tech.
  function renderUnscheduled(list) {
    const items = list.map((j) => {
      const cust = `${(j.customer_first_name || '').trim()} ${(j.customer_last_name || '').trim()}`.trim() || '(no customer)';
      const appl = (j.appliance_type || 'appliance').toLowerCase();
      const loc = (j.service_city || j.service_zip || '').trim();
      // Zip + brand drive Ant's placement suggestion (suggest-schedule → best
      // DAY + the rank-1 ACTIVE non-owner tech for that area, honoring the
      // customer's availability/route/capacity; office can override on tap).
      const zip5 = String(j.service_zip || '').replace(/\D/g, '').slice(0, 5);
      const brand = String(j.brand || '').trim();
      const ct = (j.customer_type || '').toLowerCase();
      const tag = ct === 'warranty' ? `<span class="wtag">${escapeHtml(j.warranty_company || 'warranty')}</span>` : '';
      const pb = partsBadge(j);
      // CASH-ONLY hold: a self-pay job that hasn't paid is NOT ready to schedule.
      // Strictly customer_type self_pay/cash/customer_pay — warranty is never touched.
      const isCash = ct === 'self_pay' || ct === 'cash' || ct === 'customer_pay';
      const cashUnpaid = isCash && CASH_PAID[j.id] !== true;
      const meta = pb || (cashUnpaid
        ? '<span class="hold">💵 Awaiting payment — collect first</span>'
        : '<span class="ready">✓ ready to schedule</span>');
      // What the customer needs — front and center, right under the name. The
      // time window is the #1 scheduling variable. Splits AVAIL/UNAVAIL markers,
      // flags vendor-locked (SquareTrade/ServicePower) jobs as pre-scheduled, and
      // shows a muted "gather at intake" prompt when we have nothing yet.
      const isVendor = /squaretrade|servicepower|service power/i.test(j.warranty_company || '');
      // What time the vendor/customer already agreed to (so we know what they
      // expect). Prefer the vendor's stated window, then any service window, then
      // the parsed scheduled_start. Empty when nothing was captured.
      const vendorExpect = (() => {
        const notesInt = (j.notes_internal || '');
        const pM = notesInt.match(/Schedule Period:\s*([^\n]*)/i);
        const dM = notesInt.match(/Schedule Date:\s*([^\n]*)/i);
        const win = ((pM && pM[1]) || '').trim() || (j.service_eta_window || '').trim();
        const sMs = Number(j.scheduled_start || 0);
        if (win && sMs > 0) return `${fmtDayShort(sMs)} · ${escapeHtml(win)}`;
        if (win) return escapeHtml(win);
        if (dM && dM[1].trim()) return escapeHtml(dM[1].trim());
        if (sMs > 0) return `${fmtDayShort(sMs)}${fmtTime(sMs) ? ' · ' + fmtTime(sMs) : ''}`;
        return '';
      })();
      // "locked" = a real vendor slot exists (agreed time captured). A vendor job
      // with NO agreed time isn't locked — it still needs scheduling.
      const isLocked = isVendor && !!vendorExpect;
      let hasAvail = false;
      const constraintLine = (() => {
        const pref = (j.customer_preference_text || '').trim();
        const base = 'font-size:12px;font-weight:700;margin-top:3px;padding:4px 7px;border-radius:6px;line-height:1.4';
        // Vendor pre-scheduled: show the exact time the customer expects.
        if (isVendor && vendorExpect) return `<div style="${base};background:rgba(91,155,213,0.22);color:#c3d8f7">📅 Customer expects: ${vendorExpect}</div>`;
        // Vendor job with no captured time — be honest, it needs scheduling.
        if (isVendor) return `<div style="${base};background:rgba(138,150,168,0.12);color:#9aa6b6">🏢 ${escapeHtml(j.warranty_company || 'warranty')} — no appt time on file · needs scheduling</div>`;
        const bits = [];
        if (pref) {
          const a = pref.match(/\bAVAIL:\s*([^\n]*)/i);   // \b so it never matches inside "UNAVAIL:"
          const u = pref.match(/UNAVAIL:\s*([^\n]*)/i);
          if (a && a[1].trim()) bits.push(`✅ ${escapeHtml(a[1].trim())}`);
          if (u && u[1].trim()) bits.push(`⛔ ${escapeHtml(u[1].trim())}`);
          if (!a && !u) bits.push(escapeHtml(pref));
        }
        try {
          if (j.customer_availability_grid) {
            const g = JSON.parse(j.customer_availability_grid);
            if (Array.isArray(g) && g.length) {
              const parts = g.map(e => `${escapeHtml(e.day || e.date || '')}${Array.isArray(e.blocks) && e.blocks.length ? ' (' + escapeHtml(e.blocks.join(', ')) + ')' : ''}`).filter(Boolean);
              if (parts.length) bits.push('📅 ' + parts.join(' · '));
            }
          }
        } catch (_) {}
        if (bits.length) { hasAvail = true; return `<div style="${base};background:rgba(255,180,84,0.18);color:#ffce8a">🕒 ${bits.join(' · ')}</div>`; }
        return `<div style="${base};background:rgba(138,150,168,0.1);color:#8a96a8;font-weight:600">🕒 no time info — send intake link now 👇</div>`;
      })();
      // Ant's suggested day + tech — FRONT AND CENTER on every tile. Placeholder
      // now, hydrated right after render via suggest-schedule (see hydrateSuggestions).
      // Pass the customer's availability along so the suggested DAY honors it:
      // parse AVAIL/UNAVAIL cleanly here (single-line, attribute-safe) + the grid.
      const prefRaw = (j.customer_preference_text || '');
      const availM = prefRaw.match(/\bAVAIL:\s*([^\n]*)/i);   // \b so it never matches inside "UNAVAIL:"
      const unavailM = prefRaw.match(/UNAVAIL:\s*([^\n]*)/i);
      const availTxt = availM ? availM[1].trim() : (unavailM ? '' : prefRaw.replace(/\s+/g, ' ').trim());
      const unavailTxt = unavailM ? unavailM[1].trim() : '';
      const gridTxt = (j.customer_availability_grid || '');
      // Show the suggestion line on EVERY routable job — including vendor-locked
      // (SquareTrade/ServicePower) ones. For locked jobs the vendor set the day, so
      // we skip the day pick and just surface WHICH TECH covers the area to assign.
      const suggestLine = (zip5.length >= 5)
        ? `<div class="ant-suggest" data-jobid="${j.id}" data-zip="${zip5}" data-appl="${escapeHtml(appl)}" data-brand="${escapeHtml(brand)}" data-avail="${escapeHtml(availTxt)}" data-unavail="${escapeHtml(unavailTxt)}" data-grid="${escapeHtml(gridTxt)}" data-locked="${isLocked ? '1' : ''}"
             style="font-size:12.5px;font-weight:800;margin-top:4px;padding:5px 8px;border-radius:7px;line-height:1.4;border:1px dashed rgba(76,201,192,0.45);background:rgba(76,201,192,0.09);color:#6fd3ca">🐜 finding best…</div>`
        : '';
      // Immediate-intake action: no availability + not vendor-locked = text the
      // customer a guided intake link this second. The sooner the intake, the
      // sooner it schedules. Stops propagation so it doesn't open the modal.
      const custPhone = String(j.customer_phone || '').replace(/\D/g, '');
      const custFirst = (j.customer_first_name || '').trim();
      const intakeBtn = (!hasAvail && !isVendor)
        ? `<button class="send-intake" data-jobid="${j.id}" data-phone="${custPhone}" data-first="${escapeHtml(custFirst)}" data-appl="${escapeHtml(appl)}" title="Text the customer a 2-minute intake link now"
             style="margin-top:6px;font:700 12px/1 system-ui;padding:6px 10px;border-radius:7px;border:1px solid rgba(232,116,59,0.55);background:rgba(232,116,59,0.14);color:#f0a074;cursor:pointer">📲 Text intake link</button>`
        : '';
      return `
        <div class="item unsched-item" data-job-id="${j.id}" role="button" tabindex="0" title="Tap to schedule this job">
          <div class="cust">${escapeHtml(cust)} ${tag}</div>
          ${suggestLine}
          ${constraintLine}
          <div class="what">${escapeHtml(appl)}${loc ? ' · ' + escapeHtml(loc) : ''}</div>
          <div class="meta">${meta}</div>
          ${intakeBtn}
          <div class="intake-result" data-jobid="${j.id}" style="font-size:12px;margin-top:4px"></div>
        </div>
      `;
    }).join('');
    return `
      <div class="unassigned unscheduled-tray show">
        <div class="head">
          <div class="icon">🗓️</div>
          <div class="label">Needs Scheduling — tap to place</div>
          <div class="count">${list.length}</div>
        </div>
        <div class="list">${items}</div>
      </div>
    `;
  }

  function renderCell(tech, day, jobs, isOff) {
    const techName = ((tech.first_name || '') + ' ' + (tech.last_name || '')).trim() || ('Tech ' + tech.id);
    const count = jobs.length;
    // One-tap Day Off toggle (present on every cell).
    const offBtn = `<button class="dayoff-btn${isOff ? ' on' : ''}"
        data-tech-id="${tech.id}"
        data-tech-name="${escapeHtml(techName)}"
        data-date="${day.dateStr}"
        data-day-label="${escapeHtml(day.dowShort + ' ' + day.monthShort + ' ' + day.dayNum)}"
        data-off="${isOff ? '1' : '0'}"
        data-jobs="${count}"
        title="${isOff ? 'Clear day off — mark ' + escapeHtml(techName) + ' working' : 'Mark ' + escapeHtml(techName) + ' off this day'}"
      >${isOff ? '✓ off' : '🌴 off'}</button>`;
    if (isOff) {
      return `
        <div class="cell cap-off" data-tech-id="${tech.id}" data-date="${day.dateStr}">
          ${offBtn}
          <div class="cap">
            <span class="num">⛔</span>
            <span class="label">day off</span>
          </div>
          <div class="off-label">off</div>
        </div>
      `;
    }
    const remaining = Math.max(0, CAPACITY_MAX - count);
    let tier = 'green';
    if (count >= 5) tier = 'red';
    else if (count >= 3) tier = 'yellow';
    const blocks = jobs.map((j) => renderBlock(j)).join('');
    return `
      <div class="cell cap-${tier} book-cell"
           data-tech-id="${tech.id}"
           data-tech-name="${escapeHtml(techName)}"
           data-date="${day.dateStr}"
           data-day-label="${escapeHtml(day.dowShort + ' ' + day.monthShort + ' ' + day.dayNum)}"
           title="Click empty space to book on this day">
        ${offBtn}
        <div class="cap">
          <span class="num">${remaining}</span>
          <span class="denom">/${CAPACITY_MAX}</span>
          <span class="label">${remaining === 1 ? 'slot' : 'slots'}</span>
        </div>
        <div class="blocks">${blocks}</div>
      </div>
    `;
  }

  function renderBlock(j) {
    const time = fmtTimeShort(j.scheduled_start);
    const cust = `${(j.customer_first_name||'').trim()} ${(j.customer_last_name||'').trim().slice(0,1)}${j.customer_last_name ? '.' : ''}`.trim() || '(no name)';
    const appl = (j.appliance_type || '').toLowerCase();
    const brand = (j.brand || '').trim();
    const city = (j.service_city || '').trim();
    const status = (j.scheduling_status || '').toLowerCase();
    const ct = (j.customer_type || '').toLowerCase();

    let bk = 'self_pay';
    if (ct === 'warranty') bk = 'warranty';
    if (status === 'completed') bk = 'completed';

    const applLine = brand ? `${appl} · ${brand}` : appl;
    return `
      <div class="blk bk-${bk}" data-job-id="${j.id}" draggable="true" role="button" tabindex="0"
           title="Drag to another tech/day, or click to reschedule, reassign, or cancel">
        <div class="row1">
          <span class="time">${time}</span>
          <span class="name">${escapeHtml(cust)}</span>
        </div>
        <div class="row2">
          <span class="app">${escapeHtml(applLine)}</span>
          ${city ? `<span class="city">${escapeHtml(city)}</span>` : ''}
          ${partsBadge(j)}
        </div>
      </div>
    `;
  }

  function attachClickHandlers() {
    // One-tap Day Off toggle — mark a tech off (or clear it) right on the cell.
    // No approval needed; the office owns this. (Fires tech_set_day_off.)
    document.querySelectorAll('.dayoff-btn').forEach((btn) => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (btn.disabled) return;
        const isOff = btn.dataset.off === '1';
        const name = btn.dataset.techName || 'this tech';
        const dayLabel = btn.dataset.dayLabel || btn.dataset.date;
        const jobs = parseInt(btn.dataset.jobs || '0', 10);
        let msg;
        if (isOff) {
          msg = `Clear ${name}'s day off on ${dayLabel} — put them back to working?`;
        } else {
          msg = `Mark ${name} OFF on ${dayLabel}?`;
          if (jobs > 0) msg += `\n\n⚠️ There ${jobs === 1 ? 'is' : 'are'} ${jobs} job${jobs === 1 ? '' : 's'} on that day — you'll still need to reassign ${jobs === 1 ? 'it' : 'them'}.`;
        }
        if (!confirm(msg)) return;
        btn.disabled = true;
        const prevText = btn.textContent;
        btn.textContent = '…';
        try {
          const res = await fetch(`${XANO_BASE}/tech_set_day_off`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              technician_id: parseInt(btn.dataset.techId, 10),
              date: btn.dataset.date,
              off: !isOff,
              reason: isOff ? '' : 'day off (office)',
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.success) {
            alert((data && (data.error || data.message)) || `Could not update (${res.status}). Try again.`);
            btn.disabled = false;
            btn.textContent = prevText;
            return;
          }
          loadWeek(); // re-render so the cell flips off/on
        } catch (err) {
          alert('Network problem — try again.');
          btn.disabled = false;
          btn.textContent = prevText;
        }
      });
    });
    // Click on any empty cell space (NOT on a job block) opens the booking modal.
    document.querySelectorAll('.book-cell').forEach((cell) => {
      cell.addEventListener('click', (e) => {
        if (e.target.closest('.blk')) return; // job block click — handled below
        if (cell.classList.contains('cap-off')) return; // tech off — can't book
        openBookingModal({
          tech_id: cell.dataset.techId,
          tech_name: cell.dataset.techName,
          date: cell.dataset.date,
          day_label: cell.dataset.dayLabel,
        });
      });
    });
    // Click on a job block opens the manage modal (Reschedule / Reassign / Cancel).
    document.querySelectorAll('.blk[data-job-id]').forEach((blk) => {
      blk.addEventListener('click', (e) => {
        e.stopPropagation();
        openManageJobModal(Number(blk.dataset.jobId));
      });
      blk.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openManageJobModal(Number(blk.dataset.jobId));
        }
      });
    });
    // Tap an unscheduled-tray item to open the same modal and place it.
    document.querySelectorAll('.unsched-item[data-job-id]').forEach((it) => {
      const open = () => openManageJobModal(Number(it.dataset.jobId));
      it.addEventListener('click', open);
      it.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
    });
    // "Text intake link" — fire the guided-intake SMS without opening the modal.
    document.querySelectorAll('.send-intake[data-jobid]').forEach((btn) => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); sendIntakeLink(btn); });
    });
    hydrateSuggestions();   // fill "🐜 Ant suggests: {day} · {tech}" on the cards
    attachDragHandlers();
  }

  // ── Ant's suggested day + tech (front-and-center on every Needs-Scheduling
  // tile) + immediate intake. suggest-schedule returns the best DAY plus the
  // rank-1 ACTIVE non-owner tech for the area (owner is last resort), honoring
  // the customer's availability / route / capacity. If the pick can't take it,
  // the office just taps a different tech in the schedule modal.
  const SUGG_CACHE = {}; // jobId -> { html, style }
  function paintSuggest(n, s) { n.innerHTML = s.html; n.style.cssText = s.style; n.dataset.done = '1'; }
  const SUGG_OK  = 'font-size:12.5px;font-weight:800;margin-top:4px;padding:5px 8px;border-radius:7px;line-height:1.4;border:1px dashed rgba(76,201,192,0.5);background:rgba(76,201,192,0.11);color:#7fd8d0';
  const SUGG_AMB = 'font-size:12.5px;font-weight:700;margin-top:4px;padding:5px 8px;border-radius:7px;line-height:1.4;border:1px dashed rgba(255,180,84,0.5);background:rgba(255,180,84,0.12);color:#ffce8a';
  const SUGG_MUT = 'font-size:12px;font-weight:600;margin-top:4px;padding:5px 8px;border-radius:7px;line-height:1.4;background:rgba(138,150,168,0.1);color:#8a96a8';
  // Fast fallback: at least the AREA TECH from check_service_zone (one quick
  // read) when the full day-suggestion is slow/unavailable — so a tech name
  // ALWAYS shows on the tile.
  async function areaTechFallback(zip, opts) {
    opts = opts || {};
    const suffix = opts.suffix != null ? opts.suffix : ' — tap to place';
    const style = opts.style || SUGG_AMB;
    try {
      const r = await fetch(`${XANO_BASE}/check_service_zone?zip_code=${encodeURIComponent(zip)}`, { signal: AbortSignal.timeout(8000) });
      const z = await r.json();
      if (z && z.suggested_tech_name) return { html: `🔧 <strong>${escapeHtml(z.suggested_tech_name)}</strong>'s area${z.cluster ? ' · ' + escapeHtml(z.cluster) : ''}${suffix}`, style };
      if (z && z.covered === false) return { html: '⚠️ area not mapped — pick a tech', style: SUGG_AMB };
    } catch (_) {}
    return null;
  }
  async function hydrateSuggestions() {
    const nodes = Array.from(document.querySelectorAll('.ant-suggest[data-jobid]:not([data-done])'));
    if (!nodes.length) return;
    const BATCH = 3; // gentle on Xano — suggest-schedule fans out a few reads per job
    for (let i = 0; i < nodes.length; i += BATCH) {
      await Promise.all(nodes.slice(i, i + BATCH).map(async (n) => {
        const jobId = n.dataset.jobid;
        if (SUGG_CACHE[jobId]) { paintSuggest(n, SUGG_CACHE[jobId]); return; }
        n.dataset.done = '1';
        const zip = n.dataset.zip || '';
        if (!zip || zip.length < 5) { const s = { html: '🔧 add a zip to route this', style: SUGG_MUT }; SUGG_CACHE[jobId] = s; paintSuggest(n, s); return; }
        // Vendor-locked (SquareTrade/ServicePower): day is already set — just show
        // which tech covers the area so the office knows who to assign.
        if (n.dataset.locked === '1') {
          const s = (await areaTechFallback(zip, { suffix: ' — assign this tech', style: SUGG_OK })) || { html: '🔧 tap to assign a tech', style: SUGG_MUT };
          SUGG_CACHE[jobId] = s; paintSuggest(n, s); return;
        }
        try {
          const qs = new URLSearchParams({ service_zip: zip, job_id: jobId, appliance_type: n.dataset.appl || '', brand: n.dataset.brand || '', avail_text: n.dataset.avail || '', unavail_text: n.dataset.unavail || '', grid: n.dataset.grid || '' });
          const r = await fetch(`/.netlify/functions/suggest-schedule?${qs.toString()}`, { signal: AbortSignal.timeout(20000) });
          const d = await r.json();
          const sug = d && d.suggestion;
          let s;
          if (sug && sug.suggested_tech_name && sug.suggested_day_label) {
            s = { html: `🐜 Ant suggests: <strong>${escapeHtml(sug.suggested_day_label)}</strong> · <strong>${escapeHtml(sug.suggested_tech_name)}</strong>${sug.honored_availability ? ' ✅' : ''}${sug.brand_conflict ? ' ⚠️' : ''}`, style: SUGG_OK };
          } else if (sug && sug.suggested_tech_name) {
            s = { html: `🔧 <strong>${escapeHtml(sug.suggested_tech_name)}</strong>'s area — ${escapeHtml(d.reason || 'pick a day')}`, style: SUGG_AMB };
          } else {
            // suggest-schedule couldn't route a day — still show the area tech.
            s = (await areaTechFallback(zip)) || { html: `⚠️ ${escapeHtml((d && d.reason) || 'area not mapped — pick a tech')}`, style: SUGG_AMB };
          }
          SUGG_CACHE[jobId] = s; paintSuggest(n, s);
        } catch (_) {
          // day-suggestion timed out — fall back to the fast area-tech lookup so a
          // tech name still shows (don't cache, so a later render can get the full pick).
          const s = (await areaTechFallback(zip)) || { html: '🔧 tap to place manually', style: SUGG_MUT };
          paintSuggest(n, s);
        }
      }));
    }
  }

  async function sendIntakeLink(btn) {
    const jobId = Number(btn.dataset.jobid);
    const res = document.querySelector(`.intake-result[data-jobid="${jobId}"]`);
    btn.disabled = true; const orig = btn.textContent; btn.textContent = '⏳ sending…';
    try {
      const r = await fetch('/.netlify/functions/send-intake-link', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: jobId, phone: btn.dataset.phone || '', first: btn.dataset.first || '', appliance: btn.dataset.appl || '' }),
        signal: AbortSignal.timeout(20000),
      });
      const d = await r.json().catch(() => ({}));
      if (d && d.ok && d.sent) {
        if (res) res.innerHTML = `<span style="color:#7fd8a0">✅ intake link texted${d.to_last4 ? ' to •••' + d.to_last4 : ''}</span>`;
        btn.textContent = '✓ sent';
      } else {
        const why = (d && d.reason) || 'no phone on file';
        if (res) res.innerHTML = `<span style="color:#e6a35a">⚠️ ${escapeHtml(why)}</span>`;
        btn.disabled = false; btn.textContent = orig;
      }
    } catch (e) {
      if (res) res.innerHTML = `<span style="color:#e6a35a">⚠️ send failed — try again</span>`;
      btn.disabled = false; btn.textContent = orig;
    }
  }

  // ── Drag-and-drop: move a job to another tech / day with an INSTANT optimistic
  // move (no full reload — that's what was freezing). API fires in the background;
  // on failure we reload to revert. Same-day tech change = reassign; day change =
  // reschedule (keeps the time of day).
  let draggingJobId = null;
  function attachDragHandlers() {
    document.querySelectorAll('.blk[data-job-id]').forEach((blk) => {
      blk.addEventListener('dragstart', (e) => {
        draggingJobId = Number(blk.dataset.jobId);
        try { e.dataTransfer.setData('text/plain', String(draggingJobId)); e.dataTransfer.effectAllowed = 'move'; } catch (_) {}
        blk.classList.add('dragging');
      });
      blk.addEventListener('dragend', () => { blk.classList.remove('dragging'); document.querySelectorAll('.cell.drag-over').forEach((c) => c.classList.remove('drag-over')); });
    });
    document.querySelectorAll('.book-cell[data-tech-id]').forEach((cell) => {
      cell.addEventListener('dragover', (e) => { e.preventDefault(); try { e.dataTransfer.dropEffect = 'move'; } catch (_) {} cell.classList.add('drag-over'); });
      cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
      cell.addEventListener('drop', (e) => {
        e.preventDefault(); cell.classList.remove('drag-over');
        const jobId = draggingJobId || Number((e.dataTransfer && e.dataTransfer.getData('text/plain')) || 0);
        if (jobId) handleDrop(jobId, cell);
        draggingJobId = null;
      });
    });
  }

  function jobDateStrCT(ms) {
    if (!ms) return '';
    const parts = new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(ms));
    const g = (t) => (parts.find((p) => p.type === t) || {}).value || '';
    return `${g('year')}-${g('month')}-${g('day')}`;
  }
  function jobTimeHHMM_CT(ms) {
    if (!ms) return '08:00';
    const parts = new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Chicago', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(ms));
    const g = (t) => (parts.find((p) => p.type === t) || {}).value || '00';
    return `${g('hour')}:${g('minute')}`;
  }

  async function handleDrop(jobId, cell) {
    const j = lastJobsById[jobId];
    if (!j) { loadWeek(); return; }
    const newTechId = Number(cell.dataset.techId);
    const newDateStr = cell.dataset.date;
    const curDateStr = jobDateStrCT(j.scheduled_start);
    const dayChanged = newDateStr && newDateStr !== curDateStr;
    const techChanged = newTechId && newTechId !== j.technician_id;
    if (!dayChanged && !techChanged) return; // dropped where it already was

    // optimistic move: relocate the DOM node now so it feels instant
    const blk = document.querySelector(`.blk[data-job-id="${jobId}"]`);
    const targetBlocks = cell.querySelector('.blocks');
    if (blk && targetBlocks) targetBlocks.appendChild(blk);
    j.technician_id = newTechId;
    if (dayChanged) { const ms = localDatetimeToMs(`${newDateStr}T${jobTimeHHMM_CT(j.scheduled_start)}`); if (ms) j.scheduled_start = ms; }

    try {
      let res;
      if (dayChanged) {
        res = await fetch(`${XANO_BASE}/danielle_schedule_parallel_job`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job_id: jobId, technician_id: newTechId, scheduled_start_ms: j.scheduled_start }) });
      } else {
        res = await fetch(`${XANO_BASE}/reassign_job`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job_id: jobId, technician_id: newTechId }) });
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) { alert((data && (data.error || data.message)) || 'Move failed — refreshing.'); loadWeek(); }
      // success: leave the optimistic move in place (no full reload = no freeze)
    } catch (_) { alert('Network problem — refreshing.'); loadWeek(); }
  }

  function renderHeader(data) {
    weekRange.textContent = fmtWeekRange(data.week_start_ct, data.week_end_ct);
    // Month label in the top toolbar (always visible, even if the side mini-cal is off-screen).
    const ml = $('monthLabel');
    if (ml) { try { const d = parseYMD(currentWeekStart); ml.textContent = d.toLocaleString('en-US', { month: 'long', year: 'numeric' }); } catch (_) {} }
    const isCurrent = data.week_start_ct === currentWeekOfDateStr(data.today_ct);
    todayBtn.classList.toggle('active', isCurrent);
    todayBtn.textContent = isCurrent ? 'this week' : 'jump to today';
    // View toggle active state.
    viewWeekBtn?.classList.toggle('active', currentView === 'week');
    viewTodayBtn?.classList.toggle('active', currentView === 'today');
    viewListBtn?.classList.toggle('active', currentView === 'list');
    // Snap the mini-calendar to the selected day's month + repaint it.
    miniCalView = startOfMonthOf(currentWeekStart);
    renderMiniCal();
  }

  function renderTodayView(data, techs, jobs) {
    const todayStr = data.today_ct;
    // Today's jobs across all techs, sorted by scheduled_start ascending.
    const todayJobs = jobs
      .filter((j) => ctDateForMs(j.scheduled_start) === todayStr || (!j.scheduled_start && (j.unassigned || !j.technician_id)))
      .sort((a, b) => {
        const aMs = a.scheduled_start || 0;
        const bMs = b.scheduled_start || 0;
        if (!aMs && !bMs) return 0;
        if (!aMs) return 1;
        if (!bMs) return -1;
        return aMs - bMs;
      });

    const techById = {};
    for (const t of techs) techById[t.id] = t;

    // The unscheduled queue shows in the mobile list view too, so Danielle can
    // schedule from her phone without switching to the desktop week grid.
    const trayHtml = (data.unscheduled && data.unscheduled.length)
      ? renderUnscheduled(data.unscheduled) : '';

    if (todayJobs.length === 0) {
      content.innerHTML = trayHtml + `
        <div class="today-empty" style="padding:48px 20px;text-align:center;color:var(--muted);font-family:var(--mono)">
          <div style="font-size:48px;margin-bottom:12px">🐜</div>
          <div style="font-size:16px">No jobs scheduled today (${todayStr}).</div>
          <div style="margin-top:8px;font-size:13px">Tap a job in "Needs Scheduling" above to place it, or "Week" for the full week.</div>
        </div>
      `;
      attachClickHandlers();
      return;
    }

    const parts = [];
    if (trayHtml) parts.push(trayHtml);
    parts.push(`<div class="today-header" style="padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--border-soft)">
      <div style="font-family:var(--display);letter-spacing:0.06em;font-size:18px;color:var(--text)">Today — ${todayStr}</div>
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px">${todayJobs.length} ${todayJobs.length === 1 ? 'job' : 'jobs'} across ${techs.length} techs</div>
    </div>`);
    parts.push(`<div class="today-list" style="padding:8px 12px">`);

    for (const j of todayJobs) parts.push(jobRowHtml(j, techById));
    parts.push(`</div>`);
    content.innerHTML = parts.join('');
    attachClickHandlers();
  }

  // One job row, shared by Today + List views.
  function jobRowHtml(j, techById) {
    const time = j.scheduled_start ? fmtTimeShort(j.scheduled_start) : '—';
    const cust = `${(j.customer_first_name||'').trim()} ${(j.customer_last_name||'').trim()}`.trim() || '(no name)';
    const appl = (j.appliance_type || '').toLowerCase();
    const brand = (j.brand || '').trim();
    const city = (j.service_city || '').trim();
    const status = (j.scheduling_status || '').toLowerCase();
    const ct = (j.customer_type || '').toLowerCase();
    const tech = techById[j.technician_id];
    const techLabel = tech
      ? `${(tech.first_name || '').trim()} ${(tech.last_name || '').trim().slice(0,1)}${tech.last_name ? '.' : ''}`.trim()
      : 'unassigned';
    let bk = 'self_pay';
    if (ct === 'warranty') bk = 'warranty';
    if (status === 'completed') bk = 'completed';
    return `
      <div class="today-row blk bk-${bk}" data-job-id="${j.id}" role="button" tabindex="0"
           style="display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:12px 14px;margin:8px 0;border-radius:8px;cursor:pointer;min-height:48px">
        <div style="font-family:var(--mono);font-weight:700;color:var(--text);font-size:14px">${escapeHtml(time)}</div>
        <div>
          <div style="font-weight:700;color:var(--text);font-size:14px">${escapeHtml(cust)}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">
            ${escapeHtml(appl)}${brand ? ' · ' + escapeHtml(brand) : ''}${city ? ' · ' + escapeHtml(city) : ''}
          </div>
          <div style="margin-top:3px">${partsBadge(j)}</div>
        </div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">${escapeHtml(techLabel)}</div>
      </div>`;
  }

  // HCP-style per-tech show/hide checklist. Renders "Select all" + Unassigned +
  // every tech; tapping toggles that tech's jobs in EVERY view (week/today/list).
  function renderTechFilter(allTechs) {
    const el = document.getElementById('techFilter');
    if (!el) return;
    const chip = (id, label) => {
      const off = hiddenTechs.has(id);
      return `<button class="tfchip" data-tf="${id}" style="font:600 12px/1 system-ui;padding:6px 11px;border-radius:999px;cursor:pointer;border:1px solid ${off ? 'var(--border-soft)' : 'var(--orange,#e8743b)'};background:${off ? 'transparent' : 'var(--orange,#e8743b)'};color:${off ? 'var(--muted)' : '#fff'}">${off ? '☐' : '☑'} ${escapeHtml(label)}</button>`;
    };
    const parts = [`<span style="font:700 12px/1 system-ui;color:var(--muted);align-self:center;margin-right:2px">Techs (tap one):</span>`,
      `<button class="tfchip" data-tf="__all__" style="font:700 12px/1 system-ui;padding:6px 11px;border-radius:999px;cursor:pointer;border:1px solid var(--text);background:${hiddenTechs.size === 0 ? 'var(--text)' : 'transparent'};color:${hiddenTechs.size === 0 ? '#fff' : 'var(--text)'}">All techs</button>`];
    parts.push(chip(0, 'Unassigned'));
    for (const t of allTechs) { const nm = ((t.first_name || '') + ' ' + (t.last_name || '')).trim() || ('Tech ' + t.id); parts.push(chip(Number(t.id), nm)); }
    el.innerHTML = parts.join(' ');
    const allIds = [0, ...allTechs.map((t) => Number(t.id))];
    el.querySelectorAll('.tfchip').forEach((b) => b.onclick = () => {
      const v = b.dataset.tf;
      if (v === '__all__') { hiddenTechs.clear(); }
      else {
        const id = Number(v);
        // SOLO on click: show only this tech (see their schedule). Click the
        // already-soloed tech again → back to all. "All techs" also restores.
        const soloedToThis = !hiddenTechs.has(id) && hiddenTechs.size === (allIds.length - 1);
        if (soloedToThis) hiddenTechs.clear();
        else hiddenTechs = new Set(allIds.filter((x) => x !== id));
      }
      saveHidden();
      if (dashboardData) render(dashboardData);
    });
  }

  // List view: every job in the loaded range, grouped by day, chronological —
  // honors the per-tech filter. The "List view" Danielle asked for.
  function renderListView(data, techs, jobs) {
    const techById = {}; for (const t of techs) techById[t.id] = t;
    const trayHtml = (data.unscheduled && data.unscheduled.length && !hiddenTechs.has(0)) ? renderUnscheduled(data.unscheduled) : '';
    const byDay = {};
    for (const j of jobs) { const d = j.scheduled_start ? ctDateForMs(j.scheduled_start) : '~'; (byDay[d] = byDay[d] || []).push(j); }
    const days = Object.keys(byDay).sort((a, b) => (a === '~' ? 1 : b === '~' ? -1 : a.localeCompare(b)));
    if (!days.length) {
      content.innerHTML = trayHtml + `<div class="today-empty" style="padding:48px 20px;text-align:center;color:var(--muted)"><div style="font-size:40px">🐜</div>No jobs in this range for the selected techs.</div>`;
      attachClickHandlers(); return;
    }
    const parts = []; if (trayHtml) parts.push(trayHtml);
    for (const d of days) {
      const list = byDay[d].sort((a, b) => (a.scheduled_start || 0) - (b.scheduled_start || 0));
      parts.push(`<div class="today-header" style="padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border-soft)"><div style="font-family:var(--display);letter-spacing:0.05em;font-size:16px;color:var(--text)">${d === '~' ? 'No date set' : dayLabel(d)}</div><div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px">${list.length} ${list.length === 1 ? 'job' : 'jobs'}</div></div>`);
      parts.push(`<div class="today-list" style="padding:8px 12px">`);
      for (const j of list) parts.push(jobRowHtml(j, techById));
      parts.push(`</div>`);
    }
    content.innerHTML = parts.join('');
    attachClickHandlers();
  }

  function dayLabel(ymdStr) {
    try { return parseYMD(ymdStr).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); } catch (_) { return ymdStr; }
  }

  // ── Nav ────────────────────────────────────────────────────────
  prevWeek.addEventListener('click', () => stepWeek(-7));
  nextWeek.addEventListener('click', () => stepWeek(7));

  // Month arrows (top toolbar, HCP-style): jump the schedule a whole month.
  // Lands on the 1st of that month so she sees that month forward.
  function stepMonth(delta) {
    const d = parseYMD(currentWeekStart);
    const nd = new Date(d.getFullYear(), d.getMonth() + delta, 1);
    currentWeekStart = ymd(nd);
    updateUrl(); loadWeek();
  }
  $('prevMonth')?.addEventListener('click', () => stepMonth(-1));
  $('nextMonth')?.addEventListener('click', () => stepMonth(1));

  // View toggle. Today view re-renders the same loaded data — no extra fetch.
  function setView(view) {
    if (view !== 'week' && view !== 'today' && view !== 'list') return;
    if (currentView === view) return;
    currentView = view;
    updateUrl();
    if (dashboardData) render(dashboardData);
    else loadWeek();
  }
  viewWeekBtn?.addEventListener('click', () => setView('week'));
  viewTodayBtn?.addEventListener('click', () => setView('today'));
  viewListBtn?.addEventListener('click', () => setView('list'));
  todayBtn.addEventListener('click', () => {
    if (!serverTodayCT) return;
    currentWeekStart = serverTodayCT; // jump to today-forward, not the past week
    updateUrl();
    loadWeek();
  });

  // Jump-to-date: instantly go to ANY week — past (history) or future (scheduled).
  // This is what makes past/present/future one tap instead of clicking ‹/› a dozen times.
  const jumpDate = $('jumpDate');
  jumpDate?.addEventListener('change', () => {
    if (jumpDate.value) { currentWeekStart = jumpDate.value; updateUrl(); loadWeek(); }
  });

  function stepWeek(deltaDays) {
    const d = parseYMD(currentWeekStart);
    d.setDate(d.getDate() + deltaDays);
    currentWeekStart = ymd(d);
    updateUrl();
    loadWeek();
  }

  // ── HCP-style mini month calendar (side picker) ────────────────
  // Pick any day → the schedule shows that day forward. Browse months with ‹ ›
  // without reloading; picking a day loads it. Today ring + selected-range fill.
  let miniCalView = null; // Date = first of the displayed month
  function startOfMonthOf(ymdStr) { const d = parseYMD(ymdStr); return new Date(d.getFullYear(), d.getMonth(), 1); }
  function renderMiniCal() {
    const host = $('miniCal'); if (!host) return;
    if (!miniCalView) miniCalView = startOfMonthOf(currentWeekStart);
    const y = miniCalView.getFullYear(), m = miniCalView.getMonth();
    const startDow = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const selStart = parseYMD(currentWeekStart);
    const selStartStr = ymd(selStart);
    const range = new Set();
    for (let i = 0; i < 7; i++) { const d = new Date(selStart); d.setDate(d.getDate() + i); range.add(ymd(d)); }
    const todayStr = serverTodayCT || new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
    const monthFull = new Date(y, m, 1).toLocaleString('en-US', { month: 'long' });
    // Month header — INLINE-styled (no CSS-class dependency) so the month name + ‹ ›
    // arrows always render, even if a class is overridden/stale on a given device.
    const navBtn = 'border:1px solid #cfcfd8;background:#fff;border-radius:8px;width:36px;height:36px;font-size:22px;font-weight:800;line-height:1;cursor:pointer;color:#1a1a2e;flex:0 0 auto';
    let h = '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px">'
      + '<button id="mcPrev" title="previous month" style="' + navBtn + '">‹</button>'
      + '<div style="font-weight:800;font-size:17px;text-align:center;flex:1;color:#1a1a2e">' + monthFull + ' ' + y + '</div>'
      + '<button id="mcNext" title="next month" style="' + navBtn + '">›</button>'
      + '</div>'
      + '<div class="mc-grid mc-dow">' + ['S','M','T','W','T','F','S'].map(d => '<div class="mc-dowcell">' + d + '</div>').join('') + '</div>'
      + '<div class="mc-grid mc-days">';
    for (let i = 0; i < startDow; i++) h += '<div class="mc-cell mc-empty"></div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      const cls = ['mc-cell'];
      if (range.has(ds)) cls.push('mc-inrange');
      if (ds === selStartStr) cls.push('mc-sel');
      if (ds === todayStr) cls.push('mc-today');
      h += '<button class="' + cls.join(' ') + '" data-d="' + ds + '">' + day + '</button>';
    }
    h += '</div><button class="mc-today-btn" id="mcToday">Today</button>'
      + '<div class="mc-hint">Tap a day to jump the schedule there · use ‹ › above to change month.</div>';
    host.innerHTML = h;
    $('mcPrev').onclick = () => { miniCalView = new Date(y, m - 1, 1); renderMiniCal(); };
    $('mcNext').onclick = () => { miniCalView = new Date(y, m + 1, 1); renderMiniCal(); };
    const tb = $('mcToday'); if (tb) tb.onclick = () => { if (serverTodayCT) { currentWeekStart = serverTodayCT; updateUrl(); loadWeek(); } };
    host.querySelectorAll('.mc-cell[data-d]').forEach((b) => { b.onclick = () => { currentWeekStart = b.dataset.d; updateUrl(); loadWeek(); }; });
  }

  function updateUrl() {
    const jd = document.getElementById('jumpDate');
    if (jd && currentWeekStart) jd.value = currentWeekStart;   // keep the picker showing where we are
    const url = new URL(window.location.href);
    if (currentWeekStart && currentWeekStart === currentWeekOfDateStr(serverTodayCT)) {
      url.searchParams.delete('week');
    } else if (currentWeekStart) {
      url.searchParams.set('week', currentWeekStart);
    }
    if (currentView === 'today' || currentView === 'list') url.searchParams.set('view', currentView);
    else url.searchParams.delete('view');
    window.history.replaceState({}, '', url.toString());
  }

  function currentWeekOfDateStr(dateStr) {
    if (!dateStr) return null;
    const d = parseYMD(dateStr);
    // Walk back to Monday (ISO: Mon=1..Sun=7)
    const dow = d.getDay();  // 0=Sun..6=Sat
    const daysBack = dow === 0 ? 6 : dow - 1;
    d.setDate(d.getDate() - daysBack);
    return ymd(d);
  }

  // ── Utilities ──────────────────────────────────────────────────
  function ymd(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function parseYMD(s) {
    if (!s) return new Date();
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function ctDateForMs(ms) {
    if (!ms) return null;
    // Format the UTC ms in America/Chicago and extract Y-M-D
    const f = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Chicago',
      year: 'numeric', month: '2-digit', day: '2-digit',
    });
    const parts = f.formatToParts(new Date(Number(ms)));
    const m = {};
    for (const p of parts) m[p.type] = p.value;
    return `${m.year}-${m.month}-${m.day}`;
  }

  function fmtTime(ms) {
    if (!ms) return '—';
    return new Date(Number(ms)).toLocaleTimeString('en-US', {
      timeZone: 'America/Chicago',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true,
    });
  }

  function fmtTimeShort(ms) {
    if (!ms) return '';
    // CT "HH:MM" (24h). 08:00 is the day-of routing placeholder (no real
    // appointment time) -> show nothing so the grid doesn't imply a fake 8am.
    const hm = new Date(Number(ms)).toLocaleTimeString('en-GB', { timeZone: 'America/Chicago', hour: '2-digit', minute: '2-digit' });
    if (hm === '08:00') return '';
    const parts = hm.split(':');
    const h = Number(parts[0]), m = Number(parts[1]);
    const ap = h >= 12 ? 'pm' : 'am';
    const h12 = ((h + 11) % 12) + 1;
    return m === 0 ? (h12 + ap) : (h12 + ':' + String(m).padStart(2, '0') + ap);
  }

  function fmtDayShort(ms) {
    if (!ms) return '—';
    return new Date(Number(ms)).toLocaleDateString('en-US', {
      timeZone: 'America/Chicago',
      weekday: 'short',
      month: 'short',
      day: 'numeric',
    });
  }

  function fmtWeekRange(startStr, endStr) {
    const s = parseYMD(startStr);
    const e = parseYMD(endStr);
    const sm = MONTHS[s.getMonth()];
    const em = MONTHS[e.getMonth()];
    if (sm === em) return `${sm} ${s.getDate()} – ${e.getDate()}, ${e.getFullYear()}`;
    return `${sm} ${s.getDate()} – ${em} ${e.getDate()}, ${e.getFullYear()}`;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ── Booking modal ──────────────────────────────────────────────
  const bookingModal = document.getElementById('bookingModal');
  const bookingForm = document.getElementById('bookingForm');
  const bookingHeader = document.getElementById('bookingHeader');
  const bookingError = document.getElementById('bookingError');
  const bookingSubmit = document.getElementById('bookingSubmit');
  const bookingCancel = document.getElementById('bookingCancel');

  let bookingCtx = null;

  function openBookingModal(ctx) {
    bookingCtx = ctx;
    bookingHeader.textContent = `Book — ${ctx.tech_name} · ${ctx.day_label}`;
    bookingError.textContent = '';
    bookingForm.reset();
    bookingSubmit.disabled = false;
    bookingSubmit.textContent = 'Book it';
    bookingModal.classList.add('open');
    setTimeout(() => document.getElementById('bookPhone').focus(), 40);
  }

  function closeBookingModal() {
    bookingModal.classList.remove('open');
    bookingCtx = null;
  }

  bookingCancel.addEventListener('click', closeBookingModal);
  bookingModal.addEventListener('click', (e) => {
    if (e.target === bookingModal) closeBookingModal();
  });

  function ctMs(dateStr, ctHour) {
    // dateStr "YYYY-MM-DD"; ctHour 0-23 in America/Chicago.
    // Use a UTC probe to find CT's current offset on that date (handles DST).
    const probe = new Date(`${dateStr}T12:00:00Z`);
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Chicago',
      timeZoneName: 'shortOffset',
    }).formatToParts(probe);
    const offsetStr = (parts.find((p) => p.type === 'timeZoneName') || {}).value || 'GMT-5';
    const m = offsetStr.match(/GMT([+-]\d+)/);
    const offsetHrs = m ? parseInt(m[1], 10) : -5;
    const [y, mo, d] = dateStr.split('-').map(Number);
    return Date.UTC(y, mo - 1, d, ctHour - offsetHrs, 0, 0);
  }

  bookingForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!bookingCtx) return;
    bookingError.textContent = '';

    const fd = new FormData(bookingForm);
    const window = fd.get('time_window') || '';
    if (!window) {
      bookingError.textContent = 'Pick a time window.';
      return;
    }
    const windowHour = window === '8-11am' ? 8 : window === '11am-2pm' ? 11 : window === '2-5pm' ? 14 : 8;
    const windowEndHour = window === '8-11am' ? 11 : window === '11am-2pm' ? 14 : 17;
    const scheduled_start_ms = ctMs(bookingCtx.date, windowHour);
    const scheduled_end_ms = ctMs(bookingCtx.date, windowEndHour);

    const first_name = (fd.get('first_name') || '').toString().trim();
    const last_name = (fd.get('last_name') || '').toString().trim();
    const phone = (fd.get('phone') || '').toString().trim();
    const zip = (fd.get('zip') || '').toString().trim();
    const appliance_type = (fd.get('appliance_type') || '').toString().trim();
    const brand = (fd.get('brand') || '').toString().trim();
    const problem_summary = (fd.get('problem_summary') || '').toString().trim();
    const service_address = (fd.get('service_address') || '').toString().trim();
    const service_city = (fd.get('service_city') || '').toString().trim();
    const service_state = (fd.get('service_state') || '').toString().trim();
    const customer_type = (fd.get('customer_type') || 'self_pay').toString();
    const warranty_company = (fd.get('warranty_company') || '').toString().trim();

    if (!first_name || !phone) {
      bookingError.textContent = 'First name + phone are required.';
      return;
    }
    if (!appliance_type || !problem_summary) {
      bookingError.textContent = 'Appliance type + problem summary are required.';
      return;
    }

    bookingSubmit.disabled = true;
    bookingSubmit.textContent = 'Booking...';
    try {
      const res = await fetch(`${XANO_BASE}/book_appointment_from_office`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          first_name,
          last_name,
          phone,
          zip,
          email: '',
          service_address,
          service_city,
          service_state,
          appliance_type,
          brand,
          model_number: '',
          problem_summary,
          technician_id: parseInt(bookingCtx.tech_id, 10),
          scheduled_start_ms,
          scheduled_end_ms,
          service_eta_window: window,
          customer_type,
          warranty_company,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        bookingError.textContent = (data && (data.error || data.message)) || `book failed (${res.status})`;
        bookingSubmit.disabled = false;
        bookingSubmit.textContent = 'Book it';
        return;
      }
      closeBookingModal();
      loadWeek();
    } catch (err) {
      bookingError.textContent = 'Network problem. Try again.';
      bookingSubmit.disabled = false;
      bookingSubmit.textContent = 'Book it';
    }
  });

  // ── Manage-job modal (Reschedule / Reassign / Cancel) ──────────
  const manageModal = document.getElementById('manageModal');
  const manageHeader = document.getElementById('manageHeader');
  const manageSubhead = document.getElementById('manageSubhead');
  const manageError = document.getElementById('manageError');
  const manageActions = document.getElementById('manageActions');
  const manageRescheduleForm = document.getElementById('manageRescheduleForm');
  const manageReassignForm = document.getElementById('manageReassignForm');
  const manageCancelForm = document.getElementById('manageCancelForm');
  const manageOpenDetail = document.getElementById('manageOpenDetail');
  const manageClose = document.getElementById('manageClose');
  const manageBack = document.querySelectorAll('.manage-back');

  let manageJobId = null;

  function openManageJobModal(jobId) {
    const j = lastJobsById[jobId];
    if (!j) {
      alert('Job not found in current calendar view.');
      return;
    }
    manageJobId = jobId;
    const cust = `${(j.customer_first_name||'').trim()} ${(j.customer_last_name||'').trim()}`.trim() || '(no name)';
    const time = j.scheduled_start ? fmtTime(j.scheduled_start) : 'no time';
    const day = j.scheduled_start ? fmtDayShort(j.scheduled_start) : '';
    manageHeader.textContent = `Job #${jobId} — ${cust}`;
    manageSubhead.textContent = `${(j.appliance_type||'').toLowerCase()} · ${day} ${time}`;
    manageError.textContent = '';
    // Reset the action buttons. On a successful action they close the modal and
    // reload BEFORE re-enabling, so without this reset they stay disabled for
    // every job opened afterward (the "can't cancel others" bug).
    [['cancelSubmit', 'Cancel job'], ['rescheduleSubmit', 'Schedule'], ['reassignSubmit', 'Reassign'], ['manageBtnUnschedule', '📤 Unschedule (back to needs-scheduled)']].forEach(([id, label]) => {
      const el = document.getElementById(id);
      if (el) { el.disabled = false; el.textContent = label; }
    });
    showManageView('actions');
    manageOpenDetail.href = `office-board.html?job=${jobId}`;
    // Pre-fill reschedule with current scheduled_start (CT)
    if (j.scheduled_start) {
      const d = new Date(j.scheduled_start);
      const parts = new Intl.DateTimeFormat('sv-SE', {
        timeZone: 'America/Chicago',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false,
      }).formatToParts(d);
      const get = (t) => (parts.find((p) => p.type === t) || {}).value || '00';
      const dtVal = `${get('year')}-${get('month')}-${get('day')}T${get('hour')}:${get('minute')}`;
      document.getElementById('rescheduleAt').value = dtVal;
    }
    // Populate the reassign tech selector
    const sel = document.getElementById('reassignTech');
    sel.innerHTML = lastTechs
      .filter((t) => t.id !== j.technician_id)
      .map((t) => `<option value="${t.id}">${escapeHtml((t.first_name || '').trim() + ' ' + (t.last_name || '').trim())} (#${t.id})</option>`)
      .join('') || '<option value="">No other techs</option>';
    // Populate the schedule/reschedule tech selector (ALL techs; preselect the
    // job's current tech so a pure time-change keeps the same tech).
    const rsel = document.getElementById('rescheduleTech');
    rsel.innerHTML = lastTechs
      .map((t) => `<option value="${t.id}"${t.id === j.technician_id ? ' selected' : ''}>${escapeHtml((t.first_name || '').trim() + ' ' + (t.last_name || '').trim())} (#${t.id})</option>`)
      .join('') || '<option value="">No techs</option>';
    // Label the primary action by whether the job is already scheduled.
    const isUnsched = !j.scheduled_start || !j.technician_id;
    const rbtn = document.getElementById('manageBtnReschedule');
    if (rbtn) rbtn.textContent = isUnsched ? 'Schedule' : 'Reschedule';
    const rsub = document.getElementById('rescheduleSubmit');
    if (rsub) rsub.textContent = isUnsched ? 'Schedule' : 'Reschedule';
    document.getElementById('cancelReason').value = '';
    manageModal.classList.add('open');
  }

  function closeManageJobModal() {
    manageModal.classList.remove('open');
    manageJobId = null;
  }

  function showManageView(view) {
    manageActions.style.display = view === 'actions' ? 'grid' : 'none';
    manageRescheduleForm.style.display = view === 'reschedule' ? 'block' : 'none';
    manageReassignForm.style.display = view === 'reassign' ? 'block' : 'none';
    manageCancelForm.style.display = view === 'cancel' ? 'block' : 'none';
    manageError.textContent = '';
  }

  manageClose.addEventListener('click', closeManageJobModal);
  manageModal.addEventListener('click', (e) => {
    if (e.target === manageModal) closeManageJobModal();
  });
  manageBack.forEach((btn) => btn.addEventListener('click', () => showManageView('actions')));

  document.getElementById('manageBtnReschedule').addEventListener('click', () => showManageView('reschedule'));
  document.getElementById('manageBtnReassign').addEventListener('click', () => showManageView('reassign'));
  document.getElementById('manageBtnCancel').addEventListener('click', () => showManageView('cancel'));
  document.getElementById('manageBtnUnschedule').addEventListener('click', async () => {
    if (!manageJobId) return;
    if (!confirm('Take this job off the schedule and send it back to Needs Scheduled? (It is NOT canceled — you can re-schedule it anytime.)')) return;
    const btn = document.getElementById('manageBtnUnschedule');
    btn.disabled = true; btn.textContent = 'Unscheduling…';
    try {
      const res = await fetch('/.netlify/functions/unschedule-job', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job_id: manageJobId }) });
      const data = await res.json().catch(() => ({}));
      if (data && data.ok) { closeManageJobModal(); loadWeek(); }
      else { manageError.textContent = (data && data.error) || 'Could not unschedule.'; btn.disabled = false; btn.textContent = '📤 Unschedule (back to needs-scheduled)'; }
    } catch (_) { manageError.textContent = 'Network problem. Try again.'; btn.disabled = false; btn.textContent = '📤 Unschedule (back to needs-scheduled)'; }
  });

  function localDatetimeToMs(value) {
    // value like "2026-05-26T14:30" — interpret as America/Chicago wall time.
    const [datePart, timePart] = value.split('T');
    const [h, m] = timePart.split(':').map(Number);
    // Convert CT wall-time to ms using ctMs (defined above for booking modal).
    return ctMs(datePart, h) + m * 60000;
  }

  manageRescheduleForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!manageJobId) return;
    const dtValue = document.getElementById('rescheduleAt').value;
    if (!dtValue) { manageError.textContent = 'Pick a date + time.'; return; }
    const newStartMs = localDatetimeToMs(dtValue);
    const techId = Number(document.getElementById('rescheduleTech').value || 0);
    if (!techId) { manageError.textContent = 'Pick a tech.'; return; }
    // Parts-ETA guard: a job waiting on parts can't be scheduled for a day
    // before the parts are due to arrive.
    const mj = lastJobsById[manageJobId];
    if (mj && mj.parts_eta_date) {
      let eta = mj.parts_eta_date;
      if (typeof eta === 'number') eta = ctDateForMs(eta);
      eta = String(eta).slice(0, 10);
      const chosenDay = ctDateForMs(newStartMs);
      if (/^\d{4}-\d{2}-\d{2}$/.test(eta) && chosenDay < eta) {
        manageError.textContent = `Parts aren't due until ${eta} — can't schedule before then. Pick ${eta} or later.`;
        return;
      }
    }
    const btn = e.submitter || document.getElementById('rescheduleSubmit');
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      // danielle_schedule_parallel_job sets tech + time, transitions
      // not_ready -> scheduled, and fires the tech confirmation — works for
      // both first-time scheduling and rescheduling in one call.
      const res = await fetch(`${XANO_BASE}/danielle_schedule_parallel_job`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: manageJobId, technician_id: techId, scheduled_start_ms: newStartMs }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        manageError.textContent = (data && (data.error || data.message)) || `Reschedule failed (${res.status})`;
      } else {
        closeManageJobModal(); loadWeek(); return;
      }
    } catch (err) {
      manageError.textContent = 'Network problem. Try again.';
    }
    btn.disabled = false; btn.textContent = 'Reschedule';
  });

  manageReassignForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!manageJobId) return;
    const techId = Number(document.getElementById('reassignTech').value);
    if (!techId) { manageError.textContent = 'Pick a tech.'; return; }
    const btn = e.submitter || document.getElementById('reassignSubmit');
    btn.disabled = true; btn.textContent = 'Reassigning...';
    try {
      const res = await fetch(`${XANO_BASE}/reassign_job`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: manageJobId, technician_id: techId }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        manageError.textContent = (data && (data.error || data.message)) || `Reassign failed (${res.status})`;
      } else {
        closeManageJobModal(); loadWeek(); return;
      }
    } catch (err) {
      manageError.textContent = 'Network problem. Try again.';
    }
    btn.disabled = false; btn.textContent = 'Reassign';
  });

  manageCancelForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!manageJobId) return;
    if (!confirm('Cancel this job? This cannot be undone from here.')) return;
    const reason = (document.getElementById('cancelReason').value || '').trim();
    const btn = e.submitter || document.getElementById('cancelSubmit');
    btn.disabled = true; btn.textContent = 'Canceling...';
    try {
      const res = await fetch(`${XANO_BASE}/cancel_job`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: manageJobId, reason }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        manageError.textContent = (data && (data.error || data.message)) || `Cancel failed (${res.status})`;
      } else {
        closeManageJobModal(); loadWeek(); return;
      }
    } catch (err) {
      manageError.textContent = 'Network problem. Try again.';
    }
    btn.disabled = false; btn.textContent = 'Cancel job';
  });

  // ── Boot ───────────────────────────────────────────────────────
  tryUnlock();
}
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', __initCalendar); } else { __initCalendar(); }
</script>

<script>
/* Layout fix: the injected office nav (#office-topnav, z:9000) sits at the very top
   and was covering the .topbar (week + month nav) and the top of the schedule/
   mini-calendar (Teddy: "hidden under the search bar"). Stack everything BELOW the
   nav at runtime by measuring its real height. Re-runs on resize. */
(function(){
  function fitBelowNav(){
    var nav=document.getElementById('office-topnav');
    var tb=document.querySelector('.topbar');
    var sc=document.getElementById('scroll');
    if(!nav) return false;
    var navH=nav.offsetHeight||0;
    if(tb){ tb.style.top=navH+'px'; }
    var tbH=tb?tb.offsetHeight:60;
    var below=(navH+tbH)+'px';
    if(sc){ sc.style.top=below; }
    var ld=document.getElementById('loading'); if(ld && ld.style.inset){ ld.style.inset=below+' 0 0 0'; }
    return true;
  }
  function tryFit(n){ if(fitBelowNav()) { /* one more pass after fonts/wrap settle */ setTimeout(fitBelowNav,120); return; } if(n<60) setTimeout(function(){tryFit(n+1);},50); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){tryFit(0);});
  else tryFit(0);
  window.addEventListener('load',fitBelowNav);
  window.addEventListener('resize',function(){ clearTimeout(window.__fitT); window.__fitT=setTimeout(fitBelowNav,80); });
})();

/* The top toolbar is gone (see .topbar display:none) — keep "+ New Job" by
   dropping it into the office-nav pill row, up top with the rest. (Teddy
   2026-07-03: "slide the New Job button up with the pills.") */
(function(){
  var t=0;
  function addNewJobPill(){
    var nav=document.getElementById('office-topnav');
    if(!nav){ if(t++<80) setTimeout(addNewJobPill,40); return; }
    if(document.getElementById('nav-newjob')) return;
    var a=document.createElement('a');
    a.id='nav-newjob'; a.href='book.html';
    a.textContent='＋ New Job';
    a.style.cssText='flex-shrink:0;white-space:nowrap;text-decoration:none;background:rgba(57,217,138,0.16);border:2px solid rgba(57,217,138,0.6);color:#39d98a;padding:10px 16px;border-radius:22px;font-size:14px;font-weight:800;line-height:1;';
    nav.appendChild(a);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addNewJobPill); else addNewJobPill();
})();
</script>
