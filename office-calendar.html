<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
    overflow: hidden;
  }

  :root {
    --bg: #0e1118;
    --bg-2: #131720;
    --panel: #131720;
    --panel-2: #1a1f2c;
    --border: #2a3040;
    --border-soft: #1f2533;
    --text: #e8edf5;
    --muted: #8a93aa;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --green: #00d68f;
    --green-bg: rgba(0,214,143,0.10);
    --green-bg-strong: rgba(0,214,143,0.16);
    --orange: #f5a623;
    --orange-bg: rgba(245,166,35,0.12);
    --orange-bg-strong: rgba(245,166,35,0.20);
    --red: #ff6b6b;
    --red-bg: rgba(255,107,107,0.10);
    --red-bg-strong: rgba(255,107,107,0.18);
    --blue: #5aa9ff;
    --violet: #b48cff;
    --gray: rgba(138,147,170,0.04);
  }

  /* ── Office password gate ───────────────────────────────────────── */
  .auth-gate {
    position: fixed; inset: 0;
    background: rgba(14,17,24,0.97);
    backdrop-filter: blur(6px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-gate.show { display: flex; }
  .auth-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px 26px;
    max-width: 380px; width: 100%;
    text-align: center;
  }
  .auth-card .ant { font-size: 36px; margin-bottom: 8px; }
  .auth-card .title { font-size: 18px; font-weight: 700; }
  .auth-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; margin-bottom: 22px; font-family: var(--mono); }
  .auth-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s;
    font-family: var(--mono);
    text-align: center;
    letter-spacing: 2px;
  }
  .auth-input:focus { border-color: var(--orange); }
  .auth-submit {
    margin-top: 14px;
    width: 100%;
    background: var(--orange);
    color: #1a1208;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: opacity 0.15s, transform 0.05s;
  }
  .auth-submit:active { transform: scale(0.98); }
  .auth-err {
    margin-top: 12px;
    font-size: 12px;
    color: var(--red);
    min-height: 16px;
  }

  /* ── Header ────────────────────────────────────────────────────── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    min-height: 60px;
    background: linear-gradient(180deg, #0e1118, #131720);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    padding: 8px 18px;
    gap: 14px;
    z-index: 90;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .topbar .ant { font-size: 22px; }
  .topbar .title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .topbar .title-sub {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 1px;
  }

  .topbar .week-display {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 8px;
  }
  .week-range {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    font-family: var(--mono);
    letter-spacing: -0.01em;
    min-width: 200px;
  }
  .nav-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: border-color 0.15s, background 0.15s, transform 0.05s;
  }
  .nav-btn:hover { border-color: var(--orange); }
  .nav-btn:active { transform: scale(0.97); }
  .nav-btn.today-btn {
    width: auto;
    padding: 0 14px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .nav-btn.today-btn.active {
    background: transparent;
    color: var(--orange);
    border-color: rgba(245,166,35,0.3);
    pointer-events: none;
  }

  .topbar .spacer { flex: 1; }

  /* Teddy 2026-07-03: the whole top toolbar (month/week nav, Week/Today/List,
     date jump) is redundant with the side mini-calendar, so it's removed. Hiding
     it (rather than deleting the markup) keeps the elements around so the JS that
     references them never null-crashes; fitBelowNav() measures its height as 0
     and slides the schedule up under the pills. The one worth keeping — "+ New
     Job" — is re-added as a pill in the nav row (script at page bottom). */
  .topbar { display: none !important; }

  .new-job-btn {
    background: var(--green);
    color: #082018;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    height: 36px;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s, transform 0.05s;
  }
  .new-job-btn:hover { opacity: 0.92; }
  .new-job-btn:active { transform: scale(0.98); }
  .new-job-btn .plus { font-size: 16px; line-height: 1; }

  /* ── Main scroll container ─────────────────────────────────────── */
  .scroll {
    position: fixed;
    top: 60px;
    left: 0; right: 0; bottom: 0;
    overflow: auto;
    padding: 14px;
    background: var(--bg);
  }

  /* ── Unassigned banner ─────────────────────────────────────────── */
  .unassigned {
    background: rgba(180,140,255,0.06);
    border: 1px solid rgba(180,140,255,0.25);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: none;
  }
  .unassigned.show { display: block; }
  .unassigned .head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .unassigned .head .icon { font-size: 18px; }
  .unassigned .head .label {
    font-size: 13px;
    font-weight: 700;
    color: var(--violet);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .unassigned .head .count {
    background: var(--violet);
    color: #1a0e2e;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    font-family: var(--mono);
  }
  .unassigned .list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }
  .unassigned .item {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.05s;
  }
  /* hover tint is semi-transparent so the (dark) name stays readable on both a
     light and a dark card — var(--panel-2) went solid dark in light mode and
     hid the name. (Teddy 2026-07-03) */
  .unassigned .item:hover { border-color: var(--violet); background: rgba(122,92,240,0.14); }
  .unassigned .item:active { transform: scale(0.99); }
  .unassigned .item .when {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .unassigned .item .cust {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-top: 2px;
  }
  .unassigned .item .what {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Unscheduled (needs-scheduling) tray — distinct violet head from the
     amber Needs-Assignment tray. */
  .unscheduled-tray .head { background: rgba(139,92,246,0.12); }
  .unscheduled-tray .item .meta { font-size: 11px; margin-top: 3px; }
  .unsched-item { cursor: pointer; }
  .wtag {
    display: inline-block; font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.04em; background: rgba(37,99,235,0.15); color: var(--blue);
    border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: middle;
  }
  .ready { color: #16a34a; font-weight: 600; }
  .hold { color: #fff; background:#c62828; font-weight:800; padding:2px 8px; border-radius:6px; }
  .parts-badge {
    display: inline-block; font-size: 10px; font-weight: 600;
    background: rgba(234,88,12,0.14); color: #c2410c;
    border-radius: 4px; padding: 1px 5px; margin-left: 4px; white-space: nowrap;
  }

  /* ── Calendar grid ─────────────────────────────────────────────── */
  .calendar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .cal-header,
  .cal-row {
    display: grid;
    grid-template-columns: 96px repeat(var(--tech-count, 6), minmax(180px, 1fr));
  }

  .cal-header {
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .cal-header .corner {
    padding: 12px;
    border-right: 1px solid var(--border-soft);
  }
  .cal-header .tech-cell {
    padding: 12px 10px;
    border-right: 1px solid var(--border-soft);
    text-align: center;
  }
  .cal-header .tech-cell:last-child { border-right: 0; }
  .cal-header .tech-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .cal-header .tech-id {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 2px;
  }

  .cal-row {
    border-top: 1px solid var(--border-soft);
    min-height: 168px;
  }
  .cal-row.today {
    background: linear-gradient(90deg, rgba(245,166,35,0.04), transparent 6%);
    box-shadow: inset 4px 0 0 var(--orange);
  }

  .cal-day-label {
    padding: 12px 10px;
    border-right: 1px solid var(--border-soft);
    background: var(--bg-2);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .cal-row.today .cal-day-label {
    background: rgba(245,166,35,0.06);
  }
  .cal-day-label .dow {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: var(--mono);
    font-weight: 700;
  }
  .cal-row.today .cal-day-label .dow { color: var(--orange); }
  .cal-day-label .date {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
    margin-top: 4px;
    letter-spacing: -0.02em;
  }
  .cal-day-label .month {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── Cells ─────────────────────────────────────────────────────── */
  .cell {
    border-right: 1px solid var(--border-soft);
    padding: 10px 8px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
    transition: background 0.15s;
  }
  .cell:last-child { border-right: 0; }

  .cell.cap-green  { background: var(--green-bg); }
  .cell.cap-yellow { background: var(--orange-bg); }
  .cell.cap-red    { background: var(--red-bg); }
  .cell.cap-off {
    background: var(--gray);
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 12px,
      rgba(138,147,170,0.05) 12px 13px
    );
  }

  /* One-tap Day Off toggle — sits in the top-right corner of every cell.
     Office taps it to mark a tech off (or clear it) without asking anyone. */
  .dayoff-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    z-index: 3;
    font-size: 9.5px;
    font-weight: 800;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 7px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: rgba(255,255,255,0.7);
    color: var(--muted);
    cursor: pointer;
    opacity: 0.35;
    transition: opacity 0.12s, background 0.12s, color 0.12s;
  }
  .cell:hover .dayoff-btn { opacity: 0.9; }
  .dayoff-btn:hover { background: #fff; color: var(--red); border-color: var(--red); opacity: 1; }
  .dayoff-btn.on {
    opacity: 1;
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }
  .dayoff-btn.on:hover { background: #fff; color: var(--green,#2ea36b); border-color: var(--green,#2ea36b); }
  .dayoff-btn:disabled { opacity: 0.5; cursor: default; }
  @media (hover: none) { .dayoff-btn { opacity: 0.85; } }

  .cap {
    display: flex;
    align-items: baseline;
    gap: 3px;
    line-height: 1;
    user-select: none;
    margin-bottom: 4px;
  }
  .cap .num {
    font-size: 32px;
    font-weight: 800;
    font-family: var(--mono);
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .cell.cap-green  .cap .num { color: var(--green); }
  .cell.cap-yellow .cap .num { color: var(--orange); }
  .cell.cap-red    .cap .num { color: var(--red); }
  .cell.cap-off    .cap .num { color: var(--muted); }

  .cap .denom {
    font-size: 14px;
    color: var(--muted);
    font-family: var(--mono);
    font-weight: 600;
  }
  .cap .label {
    margin-left: auto;
    font-size: 9px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
  }
  .cell.cap-off .cap .label { color: var(--muted); }

  .blocks {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }

  .blk {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
    display: block;
    min-height: 32px;
  }
  .blk:hover { background: rgba(245,166,35,0.14); border-left-color: var(--orange); }
  .blk:active { transform: scale(0.99); }
  .blk.bk-warranty { border-left-color: var(--violet); }
  .blk.bk-self_pay { border-left-color: var(--green); }
  .blk.bk-completed { opacity: 0.6; border-left-color: var(--muted); }
  .blk .row1 {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
  }
  .blk .row1 .time {
    color: var(--muted);
    font-family: var(--mono);
    font-weight: 600;
    flex-shrink: 0;
  }
  .blk .row1 .name {
    color: var(--text);
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .blk .row2 {
    display: flex;
    gap: 6px;
    margin-top: 2px;
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .blk .row2 .app { color: var(--muted); }
  .blk .row2 .city { color: var(--muted); opacity: 0.7; }
  .blk .row2 .city::before { content: "·"; margin-right: 4px; }

  .off-label {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    opacity: 0.7;
  }

  /* ── Footer totals row ─────────────────────────────────────────── */
  .cal-totals {
    display: grid;
    grid-template-columns: 96px repeat(var(--tech-count, 6), minmax(180px, 1fr));
    border-top: 2px solid var(--border);
    background: var(--bg-2);
    position: sticky;
    bottom: 0;
  }
  .cal-totals .tot-label {
    padding: 14px 10px;
    border-right: 1px solid var(--border-soft);
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-totals .tot-cell {
    padding: 12px 10px;
    border-right: 1px solid var(--border-soft);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
    justify-content: center;
  }
  .cal-totals .tot-cell:last-child { border-right: 0; }
  .cal-totals .tot-num {
    font-size: 22px;
    font-weight: 800;
    font-family: var(--mono);
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .cal-totals .tot-sub {
    font-size: 9px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── States ────────────────────────────────────────────────────── */
  .loading {
    padding: 60px 24px;
    text-align: center;
  }
  .loading .ant {
    font-size: 36px;
    animation: bob 1.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .loading .msg {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13px;
    font-family: var(--mono);
  }

  .err-banner {
    margin: 12px 0;
    padding: 14px 16px;
    background: rgba(255,107,107,0.08);
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 10px;
    font-size: 13px;
    color: var(--red);
  }
  .err-banner button {
    margin-top: 8px;
    background: var(--red);
    color: #200a0a;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--mono);
    cursor: pointer;
  }

  /* ── Responsive ────────────────────────────────────────────────── */
  @media (max-width: 1100px) {
    .cal-header,
    .cal-row,
    .cal-totals {
      grid-template-columns: 80px repeat(var(--tech-count, 6), minmax(150px, 1fr));
    }
    .calendar { overflow-x: auto; }
    .cal-header, .cal-row, .cal-totals { min-width: max-content; }
    .cap .num { font-size: 26px; }
  }
  @media (max-width: 700px) {
    .topbar { padding: 0 10px; gap: 8px; }
    .topbar .title-sub { display: none; }
    .week-range { min-width: 140px; font-size: 12px; }
    .new-job-btn { padding: 0 12px; font-size: 11px; }
    .cap .num { font-size: 22px; }
    .blk .row1 { font-size: 10px; }

<!-- Error net: turn a silent black screen into a visible, screenshot-able error. -->
<script>
(function(){
  function showErr(msg){
    try{
      var b=document.getElementById('__ant_err');
      if(!b){b=document.createElement('div');b.id='__ant_err';
        b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;padding:12px 14px;font:14px/1.4 system-ui;box-shadow:0 2px 8px rgba(0,0,0,.4)';
        (document.body||document.documentElement).appendChild(b);}
      b.innerHTML='⚠ Page error: '+String(msg).slice(0,300)+' <button onclick="location.reload()" style="margin-left:8px;padding:4px 10px;border:0;border-radius:6px;background:#fff;color:#c0392b;font-weight:700;cursor:pointer">reload</button> <span style="opacity:.85">— screenshot this & send to Teddy</span>';
    }catch(_){}
  }
  window.addEventListener('error',function(e){var loc=(e&&e.filename)?(' ['+String(e.filename).split('/').pop()+':'+e.lineno+']'):'';showErr(((e&&e.message)||'script error')+loc);});
  window.addEventListener('unhandledrejection',function(e){showErr((e&&e.reason&&e.reason.message)||(e&&e.reason)||'promise error');});
})();
</script>
