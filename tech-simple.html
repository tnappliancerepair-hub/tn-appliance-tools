<script>
const XANO = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const params = new URLSearchParams(location.search);
const JOB_ID = parseInt(params.get('job_id') || '0', 10);
const TECH_ID = parseInt(params.get('tech_id') || '1', 10);
let jobData = null;

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadJob() {
  if (!JOB_ID) { document.getElementById('content').innerHTML = '<div class="loading">No job loaded. Open from your daily dashboard.</div>'; return; }
  // Try cached data first so the tech sees SOMETHING even on weak signal
  const cacheKey = `tech_simple_job_${JOB_ID}`;
  try {
    const cached = sessionStorage.getItem(cacheKey);
    if (cached && !jobData) {
      const parsed = JSON.parse(cached);
      jobData = parsed;
      paint(parsed);
      // ← show cached UI immediately, still try to fetch fresh below
    }
  } catch (_) {}
  // 30s timeout — techs are often on weak road signal; give a slow connection
  // time to finish before we abort + fall back to cache/retry.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(`${XANO}/get_tech_simple_job?job_id=${JOB_ID}`, {
      method: 'GET',
      signal: ctrl.signal,
      cache: 'no-store',
    });
    clearTimeout(timer);
    const d = await r.json();
    jobData = d;
    paint(d);
    try { sessionStorage.setItem(cacheKey, JSON.stringify(d)); } catch (_) {}
  } catch (e) {
    clearTimeout(timer);
    // Only show error if we never had cached data to fall back on
    if (!jobData) {
      const msg = e.name === 'AbortError' ? 'Connection slow — tap retry' : 'Couldn\'t load — tap retry';
      document.getElementById('content').innerHTML = `
        <div class="topbar">
          <div class="job-id">Job #${JOB_ID}</div>
          <div class="customer-name">${esc(msg)}</div>
          <div class="address" style="color:#ef6a6a;margin-top:8px">${esc(e.message || 'unknown')}</div>
          <div class="meta-row" style="margin-top:14px">
            <a href="#" onclick="event.preventDefault();loadJob();return false">🔄 Retry</a>
          </div>
        </div>
        <div class="talk-card">
          <button class="talk-btn" id="btn-talk-fallback">
            <span class="icon">🎤</span>
            <span>Talk to Ant</span>
          </button>
          <div class="status">Tap to call — Brooke can pull the job info on her end</div>
        </div>`;
      const fb = document.getElementById('btn-talk-fallback');
      if (fb) fb.addEventListener('click', () => talkToAnt('diagnose'));
    }
  }
}

function paint(d) {
  const job = d.job || {};
  const cust = d.customer || {};
  const appl = d.appliance || {};
  const tdrs = d.all_tdrs || [];
  const atts = (d.attachments || []).filter(a => a.upload_complete_at);

  const fullName = [cust.first_name, cust.last_name].filter(Boolean).join(' ') || 'customer';
  const addr = [cust.address, cust.city, cust.state].filter(Boolean).join(', ') || job.service_address || '';
  const applShort = [appl.brand, appl.type].filter(Boolean).join(' ') || (job.appliance_type || 'appliance');
  const problem = (job.problem_summary || '').trim() || 'no problem summary yet — Brooke can dig in';

  // Teddy's pre-diag = TDR by technician_id=1
  const teddyTdr = tdrs.find(t => Number(t.technician_id) === 1);
  const prediag = teddyTdr ? (teddyTdr.diagnosis || teddyTdr.failed_component || '').trim() : '';

  const phoneDigits = (cust.phone || '').replace(/[^+\d]/g, '');
  const phoneTel = phoneDigits ? (phoneDigits.startsWith('+') ? phoneDigits : '+1' + phoneDigits) : '';
  const navAddr = encodeURIComponent(addr);

  document.getElementById('btn-full').href = `/tech-ant-chat.html?job_id=${JOB_ID}&tech_id=${TECH_ID}`;

  document.getElementById('content').innerHTML = `
    <div class="topbar">
      <div class="job-id">Job #${JOB_ID}</div>
      <div class="customer-name">${esc(fullName)}</div>
      ${addr ? `<div class="address">📍 ${esc(addr)}</div>` : ''}
      <div class="appliance">🔧 ${esc(applShort)}</div>
      <div class="meta-row">
        ${phoneTel ? `<a href="tel:${phoneTel}">📞 Call</a>` : ''}
        ${phoneDigits ? `<a href="sms:${phoneDigits}">📱 Text</a>` : ''}
        ${addr ? `<a href="https://maps.google.com/?q=${navAddr}" target="_blank">🗺 Map</a>` : ''}
      </div>
    </div>

    <div class="talk-card">
      <button class="talk-btn" id="btn-talk">
        <span class="icon">🎤</span>
        <span>Talk to Ant</span>
      </button>
      <div class="status" id="talk-status">Tap to call · phone rings · she handles the report</div>
    </div>

    <div class="live-tdr" id="live-tdr" style="display:none">
      <div class="live-tdr-head">
        <span class="live-dot"></span>
        <span class="live-label">Brooke is filling out your report</span>
      </div>
      <div id="live-tdr-fields"></div>
    </div>

    <div class="just-captured" id="just-captured">
      <div class="head">
        <span class="label">📷 just captured</span>
        <button class="dismiss" id="dismiss-capture">×</button>
      </div>
      <div id="just-captured-media"></div>
    </div>

    <div class="problem-card">
      <div class="label">What you're here for</div>
      <div class="text">${esc(problem)}</div>
      ${prediag ? `<div class="by">Teddy's pre-diagnosis: ${esc(prediag)}</div>` : ''}
    </div>

    <div class="photos-card">
      <div class="label"><span>📷 Photos (${atts.length})</span></div>
      ${atts.length === 0 ? '<div class="empty">No photos yet. Snap one when you find the model sticker.</div>' :
        '<div class="grid">' + atts.slice(0, 9).map(a => {
          const isVid = (a.file_type || '').startsWith('video') || (a.mime_type || '').startsWith('video');
          const url = a._signed_url || '';
          return `<div class="thumb" data-att-id="${a.id}" data-vid="${isVid}" data-key="${esc(a.s3_key || '')}">${isVid ? '<div class="vid">▶</div>' : (url ? `<img src="${url}" alt="">` : '<div class="vid">📷</div>')}</div>`;
        }).join('') + '</div>'}
    </div>

    <div class="complete-card">
      <button class="complete-btn" id="btn-complete">
        <span class="icon">✅</span>
        <span>Mark Complete</span>
      </button>
      <div class="complete-note">Ant's assistant walks the wrap-up — diagnosis, parts, photos, signature — then closes the job. Takes 2 minutes.</div>
    </div>
  `;

  document.getElementById('btn-talk').addEventListener('click', () => talkToAnt('diagnose'));
  document.getElementById('btn-complete').addEventListener('click', () => talkToAnt('complete'));
  document.querySelectorAll('.thumb').forEach(t => t.addEventListener('click', () => openLightbox(t)));
  hydrateThumbs(atts);
}

async function hydrateThumbs(atts) {
  const keys = atts.filter(a => a.s3_key).map(a => a.s3_key);
  if (keys.length === 0) return;
  try {
    const r = await fetch('/.netlify/functions/s3-view-url', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ s3_keys: keys })
    });
    const d = await r.json();
    const map = {};
    (d.signed_urls || []).forEach(s => { map[s.s3_key] = s.view_url; });
    document.querySelectorAll('.thumb').forEach(t => {
      const key = t.dataset.key;
      const url = map[key];
      if (url && t.dataset.vid !== 'true') {
        t.innerHTML = `<img src="${url}" alt="">`;
      }
      t.dataset.url = url || '';
    });
  } catch (_) {}
}

function openLightbox(t) {
  const url = t.dataset.url;
  if (!url) return;
  const isVid = t.dataset.vid === 'true';
  document.getElementById('lb-content').innerHTML = isVid ? `<video src="${url}" controls autoplay></video>` : `<img src="${url}">`;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lb-close').addEventListener('click', () => document.getElementById('lightbox').classList.remove('open'));
document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open'); });

async function talkToAnt(mode) {
  // mode: 'diagnose' (default, sandbox call) or 'complete' (wrap-up checklist)
  const isComplete = mode === 'complete';
  const btn = document.getElementById(isComplete ? 'btn-complete' : 'btn-talk');
  const status = document.getElementById('talk-status');
  if (status) status.textContent = isComplete ? 'Calling you to wrap up…' : 'Calling your phone…';
  btn.disabled = true;
  const originalText = btn.innerHTML;
  btn.innerHTML = '📞 calling…';
  try {
    const r = await fetch(`${XANO}/dispatch_ant_field_assist`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: JOB_ID, tech_id: TECH_ID, mode: isComplete ? 'wrap_up' : 'diagnose' })
    });
    const d = await r.json();
    if (d && d.success) {
      if (status) status.textContent = '📞 ringing your phone — pick up';
      btn.innerHTML = '📞 ringing your phone';
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalText;
        if (status) status.textContent = 'Tap to call · phone rings · she handles the report';
      }, 15000);
    } else {
      btn.innerHTML = originalText;
      if (status) status.textContent = 'Couldn\'t place call. Try again.';
      btn.disabled = false;
    }
  } catch (e) {
    btn.innerHTML = originalText;
    if (status) status.textContent = 'Couldn\'t place call. Try again.';
    btn.disabled = false;
  }
}

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function showJustCaptured(localUrl, isVideo) {
  const jc = document.getElementById('just-captured');
  const media = document.getElementById('just-captured-media');
  media.innerHTML = isVideo
    ? `<video src="${localUrl}" controls autoplay muted></video>`
    : `<img src="${localUrl}" alt="just captured">`;
  jc.classList.add('show');
  // Scroll to it so they SEE it immediately
  jc.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
// Use event delegation so we don't crash if #dismiss-capture isn't
// in the DOM yet (it's rendered inside paint()'s innerHTML which
// hasn't run when this script reaches this line). Fix 2026-06-04:
// previous direct .addEventListener call threw a null deref and
// halted the rest of the script — page stuck on 'Loading job…'.
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'dismiss-capture') {
    const jc = document.getElementById('just-captured');
    if (jc) jc.classList.remove('show');
  }
});

// Photo + video upload — shows immediate visual confirmation
async function uploadFile(file) {
  if (!file) return;
  const isVideo = (file.type || '').startsWith('video');
  // Show the just-captured image IMMEDIATELY from the local file blob
  // so the tech sees it BEFORE the upload completes
  const localUrl = URL.createObjectURL(file);
  showJustCaptured(localUrl, isVideo);
  showToast(isVideo ? '🎥 Got it — uploading…' : '📷 Got it — uploading…');
  try {
    const r = await fetch(`${XANO}/generate_upload_url`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        job_id: JOB_ID, tech_id: TECH_ID,
        attachment_type: 'tdr',
        file_type: isVideo ? 'video' : 'photo',
        original_filename: file.name || ((isVideo ? 'vid' : 'photo') + '-' + Date.now() + (isVideo ? '.mp4' : '.jpg')),
        mime_type: file.type || (isVideo ? 'video/mp4' : 'image/jpeg'),
        uploaded_by: 'tech'
      })
    });
    const gen = await r.json();
    if (!gen.s3_key || !gen.attachment_id) throw new Error('upload init failed');
    const ps = await fetch('/.netlify/functions/s3-presign', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ s3_key: gen.s3_key, mime_type: file.type || 'image/jpeg' })
    });
    const pres = await ps.json();
    if (!pres.upload_url) throw new Error('presign failed');
    await fetch(pres.upload_url, { method: 'PUT', headers: { 'Content-Type': file.type || 'image/jpeg' }, body: file });
    await fetch(`${XANO}/save_attachment`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ attachment_id: gen.attachment_id, file_size_bytes: file.size })
    });
    showToast('✅ Saved');
    loadJob();

    // Background OCR — classify photo as model sticker, part sticker,
    // or neither. Auto-writes structured data when a sticker is found.
    // Upload UX above is already complete; OCR runs without blocking.
    if (!isVideo && gen.s3_key) {
      ocrPhotoClassify(gen.s3_key, gen.attachment_id).catch(() => {});
    }
    // Phase 4 — walkaround baseline. Extract first frame from a video
    // upload and have Claude Vision generate a structured condition
    // assessment. Defensive documentation for post-repair disputes.
    if (isVideo) {
      ocrWalkaroundAnalyze(file, gen.attachment_id).catch(() => {});
    }
  } catch (e) {
    showToast('❌ Upload failed — try again');
  }
}

async function ocrWalkaroundAnalyze(videoFile, attachmentId) {
  // Extract a still frame from the video using a hidden video element
  // + canvas. iOS Safari needs playsInline + muted to avoid auto-play
  // restrictions blocking the seek.
  let frameB64;
  try {
    frameB64 = await extractVideoFrame(videoFile);
  } catch (_) { return; }
  if (!frameB64) return;
  try {
    const r = await fetch('/.netlify/functions/ocr-walkaround-analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        job_id: JOB_ID, tech_id: TECH_ID,
        image_b64: frameB64,
        purpose: 'walkaround_initial',
        attachment_id: attachmentId || null,
      })
    });
    const out = await r.json();
    if (out && out.success && out.assessment_text && out.assessment_text.indexOf('Image not suitable') === -1) {
      const dmgCount = (out.damage_noted || []).length;
      if (dmgCount > 0) {
        showToast('📸 Baseline saved — ' + dmgCount + ' pre-existing item' + (dmgCount === 1 ? '' : 's') + ' noted');
      } else {
        showToast('📸 Baseline saved — area documented');
      }
    }
  } catch (_) {}
}

function extractVideoFrame(videoFile) {
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.muted = true;
    video.playsInline = true;
    video.crossOrigin = 'anonymous';
    const url = URL.createObjectURL(videoFile);
    video.src = url;
    let done = false;
    function finish(result) {
      if (done) return;
      done = true;
      URL.revokeObjectURL(url);
      result instanceof Error ? reject(result) : resolve(result);
    }
    video.onloadedmetadata = () => {
      // Seek a bit past 0 so we get a real frame, not the black opener.
      try { video.currentTime = Math.min(0.5, (video.duration || 1) * 0.05); }
      catch (e) { finish(e); }
    };
    video.onseeked = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        const b64 = dataUrl.split(',')[1] || '';
        finish(b64);
      } catch (e) { finish(e); }
    };
    video.onerror = () => finish(new Error('video load failed'));
    // Timeout safety — if seek never fires (some iOS edge cases),
    // bail after 8 sec so we don't leak the URL object.
    setTimeout(() => finish(new Error('video seek timeout')), 8000);
    video.load();
  });
}

async function ocrPhotoClassify(s3Key, attachmentId) {
  // Build the public view URL through the existing s3-view-url helper
  // so the OCR function sees the same image the tech just uploaded.
  let viewUrl = '';
  try {
    const v = await fetch('/.netlify/functions/s3-view-url', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ s3_key: s3Key })
    });
    const vd = await v.json();
    viewUrl = vd.view_url || vd.url || '';
  } catch (_) { return; }
  if (!viewUrl) return;
  try {
    const r = await fetch('/.netlify/functions/ocr-model-extract', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        job_id: JOB_ID, tech_id: TECH_ID,
        image_url: viewUrl,
        attachment_id: attachmentId || null,
      })
    });
    const out = await r.json();
    if (!out) return;
    if (out.kind === 'model_sticker' && out.model_number) {
      showToast(out.wrote
        ? '📋 Model captured: ' + out.model_number
        : '📋 Saw model ' + out.model_number);
      if (out.wrote) setTimeout(() => loadJob(), 600);
    } else if (out.kind === 'part_sticker' && out.part_number) {
      showToast(out.wrote
        ? '🔧 Part added: ' + out.part_number
        : '🔧 Part already on list: ' + out.part_number);
      if (out.wrote) setTimeout(() => loadJob(), 600);
    }
    // kind === 'none' → silent, no toast
  } catch (_) {}
}

// ── Signature canvas (Phase 5) ────────────────────────────────────
// Customer signs directly on the tech's phone screen. Saved as a PNG
// attachment with attachment_type='signature' so warranty-review and
// the per-job submission package can include it without a paper step.
(function setupSignature() {
  const modal = document.getElementById('sig-modal');
  const canvas = document.getElementById('sig-canvas');
  const placeholder = document.getElementById('sig-placeholder');
  let ctx = null, drawing = false, hasInk = false;
  function sizeCanvas() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1a202c';
  }
  function point(evt) {
    const rect = canvas.getBoundingClientRect();
    const t = (evt.touches && evt.touches[0]) || evt;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function start(e) {
    e.preventDefault();
    drawing = true;
    if (!hasInk) { hasInk = true; placeholder.style.display = 'none'; }
    const p = point(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = point(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  function end(e) {
    if (e) e.preventDefault();
    drawing = false;
    ctx.beginPath();
  }
  document.getElementById('btn-signature').addEventListener('click', () => {
    modal.style.display = 'flex';
    setTimeout(sizeCanvas, 30);
  });
  document.getElementById('sig-close').addEventListener('click', () => { modal.style.display = 'none'; });
  document.getElementById('sig-clear').addEventListener('click', () => {
    hasInk = false;
    placeholder.style.display = 'flex';
    sizeCanvas();
  });
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end, { passive: false });
  document.getElementById('sig-save').addEventListener('click', async () => {
    if (!hasInk) { showToast('Sign first, then save'); return; }
    canvas.toBlob(async (blob) => {
      if (!blob) { showToast('❌ Could not capture signature'); return; }
      modal.style.display = 'none';
      showToast('✍️ Uploading signature…');
      const file = new File([blob], 'signature-' + Date.now() + '.png', { type: 'image/png' });
      // Reuse the upload pipeline. The save_attachment endpoint sees
      // attachment_type='signature' on the upload-init request.
      await uploadSignatureFile(file);
    }, 'image/png');
  });
  async function uploadSignatureFile(file) {
    try {
      const r = await fetch(`${XANO}/generate_upload_url`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          job_id: JOB_ID, tech_id: TECH_ID,
          attachment_type: 'signature',
          file_type: 'photo',
          original_filename: file.name,
          mime_type: 'image/png',
          uploaded_by: 'tech',
        })
      });
      const gen = await r.json();
      if (!gen.s3_key || !gen.attachment_id) throw new Error('init failed');
      const ps = await fetch('/.netlify/functions/s3-presign', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ s3_key: gen.s3_key, mime_type: 'image/png' })
      });
      const pres = await ps.json();
      if (!pres.upload_url) throw new Error('presign failed');
      await fetch(pres.upload_url, { method: 'PUT', headers: { 'Content-Type': 'image/png' }, body: file });
      await fetch(`${XANO}/save_attachment`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attachment_id: gen.attachment_id, file_size_bytes: file.size })
      });
      showToast('✅ Signature saved');
      loadJob();
    } catch (e) {
      showToast('❌ Signature upload failed — try again');
    }
  }
})();

// Poll live TDR every 4 sec — shows fields appearing as Brooke captures them
let lastSeenTdr = {};
async function pollLiveTdr() {
  if (!JOB_ID || !TECH_ID) return;
  try {
    const r = await fetch(`${XANO}/get_inprogress_voice_tdr?job_id=${JOB_ID}&tech_id=${TECH_ID}`, { cache: 'no-store' });
    const d = await r.json();
    if (!d || !d.success || !d.tdr) {
      document.getElementById('live-tdr').style.display = 'none';
      return;
    }
    const t = d.tdr;
    const fields = [
      { key: 'diagnosis', label: 'Diagnosis', value: t.diagnosis },
      { key: 'failed_component', label: 'Failed Component', value: t.failed_component },
      { key: 'labor_time_hours', label: 'Labor Hours', value: t.labor_time_hours },
      { key: 'parts_needed', label: 'Parts', value: t.parts_needed },
      { key: 'repair_completed', label: 'Repair', value: t.repair_completed },
      { key: 'customer_notes', label: 'Customer Notes', value: t.customer_notes },
    ].filter(f => (f.value || '').toString().trim() !== '');
    if (fields.length === 0) {
      document.getElementById('live-tdr').style.display = 'none';
      return;
    }
    document.getElementById('live-tdr').style.display = 'block';
    const host = document.getElementById('live-tdr-fields');
    host.innerHTML = fields.map(f => {
      const isNew = (lastSeenTdr[f.key] || '') !== f.value;
      return `<div class="live-field ${isNew ? 'new' : ''}">
        <div class="live-field-label">${esc(f.label)}</div>
        <div class="live-field-value">${esc(String(f.value))}</div>
      </div>`;
    }).join('');
    fields.forEach(f => { lastSeenTdr[f.key] = f.value; });
  } catch (e) {}
}
setInterval(pollLiveTdr, 4000);
pollLiveTdr();
