<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-label="4U Repair &amp; Services LLC — For You. New Orleans Appliance Repair">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D98A"/>
      <stop offset="0.45" stop-color="#D6A73E"/>
      <stop offset="1" stop-color="#8A5E15"/>
    </linearGradient>
    <linearGradient id="goldFlat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8962C"/>
      <stop offset="0.5" stop-color="#F1CE6C"/>
      <stop offset="1" stop-color="#C8962C"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F5F8"/>
      <stop offset="0.5" stop-color="#C2C8D0"/>
      <stop offset="1" stop-color="#7C838D"/>
    </linearGradient>
    <linearGradient id="steelFlat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA1AB"/>
      <stop offset="0.5" stop-color="#EEF1F5"/>
      <stop offset="1" stop-color="#9AA1AB"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E43A0"/>
      <stop offset="1" stop-color="#3A2060"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#3a2060" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e0e12" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;display=swap');
      .disp{font-family:'Anton','Arial Narrow','Arial Black',Impact,sans-serif;font-weight:400}
    </style>
  </defs>

  <!-- panel -->
  <rect x="4" y="4" width="632" height="712" rx="34" fill="#0e0e12"/>
  <rect x="4" y="4" width="632" height="712" rx="34" fill="url(#glow)"/>
  <rect x="10" y="10" width="620" height="700" rx="28" fill="none" stroke="url(#goldFlat)" stroke-width="2.5"/>

  <!-- ===== emblem: tools crossed behind the fleur-de-lis ===== -->
  <!-- wrench (jaw up-left) -->
  <g transform="rotate(-33 320 215)">
    <rect x="313" y="150" width="14" height="212" rx="7" fill="url(#steel)" stroke="#4a4f57" stroke-width="1.5"/>
    <rect x="289" y="82" width="62" height="72" rx="17" fill="url(#steel)" stroke="#4a4f57" stroke-width="1.5"/>
    <path d="M302,82 L338,82 L320,118 Z" fill="#0e0e12"/>
  </g>
  <!-- screwdriver (tip up-right) -->
  <g transform="rotate(33 320 215)">
    <rect x="302" y="266" width="36" height="96" rx="17" fill="url(#purple)" stroke="#241338" stroke-width="1.5"/>
    <rect x="308" y="292" width="24" height="4" rx="2" fill="#2a1740" opacity="0.7"/>
    <rect x="308" y="304" width="24" height="4" rx="2" fill="#2a1740" opacity="0.7"/>
    <rect x="305" y="250" width="30" height="18" rx="4" fill="url(#steel)" stroke="#4a4f57" stroke-width="1.2"/>
    <rect x="314" y="92" width="12" height="160" rx="3" fill="url(#steel)" stroke="#4a4f57" stroke-width="1.2"/>
    <path d="M313,92 L327,92 L324,74 L316,74 Z" fill="url(#steel)" stroke="#4a4f57" stroke-width="1"/>
  </g>

  <!-- fleur-de-lis -->
  <g transform="translate(175 47) scale(2.9)" stroke="#6b4a10" stroke-width="0.8" stroke-linejoin="round">
    <path d="M50,12 C62,31.6 62,59.6 50,68 C38,59.6 38,31.6 50,12 Z" fill="url(#gold)" transform="rotate(-40 50 64)"/>
    <path d="M50,12 C62,31.6 62,59.6 50,68 C38,59.6 38,31.6 50,12 Z" fill="url(#gold)" transform="rotate(40 50 64)"/>
    <path d="M50,8 C65,29 65,59 50,68 C35,59 35,29 50,8 Z" fill="url(#gold)"/>
    <path d="M50,108 C66,94 66,74 50,68 C34,74 34,94 50,108 Z" fill="url(#gold)"/>
    <rect x="22" y="57.5" width="56" height="13" rx="6.5" fill="url(#goldFlat)" stroke="#6b4a10" stroke-width="0.8"/>
    <path d="M50,10 C58,26 58,50 52,64" fill="none" stroke="#fff6da" stroke-width="1.1" stroke-opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- ===== wordmark ===== -->
  <text class="disp" x="320" y="474" text-anchor="middle" font-size="132" letter-spacing="2">
    <tspan fill="url(#goldFlat)">4</tspan><tspan fill="url(#steelFlat)">U</tspan>
  </text>
  <text class="disp" x="320" y="548" text-anchor="middle" font-size="60" letter-spacing="3" fill="url(#steelFlat)">REPAIR &amp; SERVICES</text>
  <text class="disp" x="320" y="584" text-anchor="middle" font-size="23" letter-spacing="10" fill="url(#goldFlat)">L L C</text>

  <line x1="150" y1="628" x2="248" y2="628" stroke="url(#goldFlat)" stroke-width="2"/>
  <line x1="392" y1="628" x2="490" y2="628" stroke="url(#goldFlat)" stroke-width="2"/>
  <text class="disp" x="320" y="638" text-anchor="middle" font-size="30" letter-spacing="9" fill="url(#goldFlat)">FOR YOU</text>
  <text x="320" y="676" text-anchor="middle" font-family="'Arial Narrow',Arial,sans-serif" font-weight="700" font-size="19" letter-spacing="5" fill="#cbd0d7">NEW ORLEANS · APPLIANCE REPAIR</text>
</svg>
