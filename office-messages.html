<script>
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function digits(s){return String(s||'').replace(/\D/g,'').slice(-10);}
function fmtPhone(d){return d&&d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:(d||'');}
function rel(ms){const m=Math.floor((Date.now()-Number(ms))/60000);if(isNaN(m))return '';if(m<1)return 'now';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';const d=Math.floor(h/24);return d+'d';}
function parseMeta(m){if(!m)return {};if(typeof m==='object')return m;try{return JSON.parse(m);}catch(_){return {};}}

// Map a raw event_log SMS row -> {key, jobId, name, phone, body, dir, blocked, ts}
function shape(r){
  const md=parseMeta(r.metadata);
  const a=r.action||'';
  const dir = a==='inbound_customer_sms_received' ? 'in' : 'out';
  const blocked = a==='dropped_customer_sms' || a==='sms_gated';
  const jobId = Number(md.job_id||md.jobId||(md.context&&md.context.job_id)||0)||0;
  // Inbound customer texts store the customer number in md.phone; outbound stores
  // it in md.recipient. md.to is the OFFICE number — only a last-resort fallback.
  const phone = digits(md.customer_phone||md.phone||md.recipient||md.from||md.from_number||md.to||'');
  const name = (md.customer_name||((md.customer_first||md.first_name||'')+' '+(md.customer_last||'')).trim()||'').trim();
  const body = String(md.body_preview||md.body||md.message||md.reply||md.reply_text||'').trim();
  const key = jobId ? ('j'+jobId) : (phone ? ('p'+phone) : null);
  // A reply counts as HUMAN only when it came from Danielle's buttons (Reply/Status/
  // Review/No-coverage all POST send-translated-reply -> source 'office_translated_reply').
  // Every other outbound is the AI. This is what lets a thread stay flagged until a
  // PERSON answers — the AI's "got it" must not clear a customer's reply. (Teddy 2026-07-02)
  const human = dir==='out' && (md.source==='office_translated_reply' || md.by==='office' || md.recipient_class==='human');
  return {key,jobId,name,phone,body,dir,blocked,human,ts:Number(r.created_at)||0};
}

// Expand/collapse a conversation's full thread inline.
function toggleThread(key){
  const el=document.getElementById('thr-'+key);
  if(!el)return;
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}
// One-tap filter — show ONLY the conversations owed a reply (the "X waiting").
function toggleWaitingOnly(){
  const on=document.body.classList.toggle('only-waiting');
  const b=document.getElementById('waitFilter');
  if(b) b.textContent = on ? '✓ showing only waiting — tap to show all' : '🔴 waiting on a reply — tap to see';
  window.scrollTo({top:0,behavior:'smooth'});
}

// Clear/dismiss a thread (Teddy 2026-06-30). Courtesy replies — "thank you",
// 👍, photo, and iMessage "Liked" tapbacks — kept re-flagging threads Danielle
// had already handled ("same ones keep pulling up"). ✕ hides a thread; if the
// customer texts AGAIN (any newer message), it pops back up with the FULL thread.
// localStorage keyed by conversation, storing the last-message ts at dismissal.
let DISMISS={}; try{ DISMISS=JSON.parse(localStorage.getItem('tn_msg_dismissed')||'{}'); }catch(_){ DISMISS={}; }
function isDismissed(c){ const d=DISMISS[c.key]; return d && c.last && c.last.ts<=d; }
function dismissThread(ev,key,ts){ ev.stopPropagation(); ev.preventDefault(); DISMISS[key]=ts; try{localStorage.setItem('tn_msg_dismissed',JSON.stringify(DISMISS));}catch(_){}
  const el=document.getElementById('conv-'+key); if(el) el.style.display='none'; load(); }
async function load(){
  document.getElementById('refresh').textContent='refreshing…';
  let rows=[];
  try{
    const r=await fetch(XANO+'/list_sms_conversations?days_back=14',{cache:'no-store'});
    const d=await r.json();
    rows=(d&&d.rows)||[];
  }catch(e){
    document.getElementById('list').innerHTML='<div class="empty">⚠️ could not load messages — '+esc(e.message)+'</div>';
    return;
  }
  // Keep CUSTOMER-facing rows only. Internal sms_sent (owner alerts like "loop
  // appears down" + tech-direction texts) were flooding the feed and drowning
  // real customer texts. Inbound + gated-customer + feedback always stay.
  rows=rows.filter(raw=>{
    const a=raw.action||'';
    if(a==='inbound_customer_sms_received'||a==='dropped_customer_sms'||a==='feedback_sms_sent'||a==='customer_sms_reply')return true;
    if(a==='sms_sent'){ const md=parseMeta(raw.metadata); return (md.recipient_class||'')!=='internal'; }
    return false;
  });
  // Group into conversations (latest row wins for the header).
  const conv={};
  for(const raw of rows){
    const s=shape(raw); if(!s.key)continue;
    const c=conv[s.key]||(conv[s.key]={key:s.key,jobId:s.jobId,name:'',phone:'',last:null,count:0,msgs:[],_sigs:new Set(),lastInTs:0,lastHumanTs:0,lastInMsg:null});
    // DEDUP: one Ant reply logs BOTH an sms_sent AND a customer_sms_reply row
    // (~same instant), so the SAME text was showing twice. The customer only
    // gets one text — collapse near-identical rows (dir + body + ~8s bucket).
    const sig=s.dir+'|'+s.body.slice(0,80)+'|'+Math.round(s.ts/8000);
    if(s.body && c._sigs.has(sig)) continue;
    if(s.body) c._sigs.add(sig);
    c.count++;
    c.msgs.push(s);
    if(!c.jobId&&s.jobId)c.jobId=s.jobId;
    if(!c.name&&s.name)c.name=s.name;
    if(!c.phone&&s.phone)c.phone=s.phone;
    if(!c.last||s.ts>c.last.ts)c.last=s;
    // Track the newest customer message + the newest HUMAN reply. A thread needs
    // review when the customer wrote AFTER the last human reply — an AI "got it"
    // (dir out, not human) does NOT count as handled. (Teddy 2026-07-02)
    if(s.dir==='in' && s.ts>c.lastInTs){ c.lastInTs=s.ts; c.lastInMsg=s; }
    if(s.dir==='out' && s.human && s.ts>c.lastHumanTs) c.lastHumanTs=s.ts;
  }
  // WAITING-FIRST, then newest. The ones where the customer wrote last (need a
  // reply) float to the very top so Danielle never has to hunt for what's owed.
  // needsReview = the customer wrote and NO human has replied since (AI replies ignored).
  Object.values(conv).forEach(c=>{ c.needsReview = (c.lastInTs||0)>0 && (c.lastInTs||0) > (c.lastHumanTs||0); });
  const list=Object.values(conv).filter(c=>c.last).filter(c=>!isDismissed(c)).sort((a,b)=>{
    const aw=a.needsReview?1:0, bw=b.needsReview?1:0;
    if(aw!==bw) return bw-aw;            // needs-review first
    return b.last.ts-a.last.ts;          // then newest
  });
  const waiting=list.filter(c=>c.needsReview).length;

  // "X waiting on a reply" is now a one-tap filter → show ONLY the ones owed a reply.
  document.getElementById('summary').innerHTML = list.length
    ? `${list.length} conversation${list.length===1?'':'s'} · ${waiting?('<button id="waitFilter" onclick="toggleWaitingOnly()" style="background:#c0392b;color:#fff;border:0;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:800;cursor:pointer">🔴 '+waiting+' waiting on a reply — tap to see</button>'):'all caught up ✅'}`
    : 'No customer texts in the last 14 days yet.';

  const box=document.getElementById('list');
  if(!list.length){ box.innerHTML='<div class="empty">No conversations yet. They\'ll appear here the moment a customer texts.</div>'; }
  else {
    box.innerHTML=list.map(c=>{
      const who = c.name || fmtPhone(c.phone) || (c.jobId?('Job #'+c.jobId):'Customer');
      // When a thread needs review, ALWAYS show the customer's actual words (even if
      // the AI auto-replied after) so Danielle can see what they said. (Teddy 2026-07-02)
      const showMsg = c.needsReview ? (c.lastInMsg||c.last) : c.last;
      const waitB = c.needsReview ? '<span class="badge" style="background:#c0392b;color:#fff">🔴 REPLIED — needs you</span>' : '';
      const dirLbl = (showMsg.dir==='in') ? '<span class="dir in">They wrote:</span> ' : '<span class="dir out">'+(showMsg.blocked?'(held) ':'')+'You:</span> ';
      const snip = showMsg.body ? esc(showMsg.body.slice(0,140)) : (showMsg.blocked?'(message held by gate)':'(no text)');
      const openLink = c.jobId ? `<a class="a-open" href="job-detail.html?job_id=${c.jobId}&office=1" onclick="event.stopPropagation()">Open job →</a>` : '';
      // 🗂 Jump straight to the job TILE. Every thread gets one — if we don't have the
      // job id yet, it resolves by phone so Danielle can always see WHO this is. (Teddy 2026-07-02)
      const tileBtn = c.jobId
        ? `<a class="a-open" href="office-board.html?job=${c.jobId}&from=messages" onclick="event.stopPropagation()" style="background:#37414f;color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;text-decoration:none">🗂 Job tile</a>`
        : (c.phone ? `<button onclick="event.preventDefault();event.stopPropagation();openJob('${c.phone}',0)" style="background:#37414f;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer">🗂 Who is this? →</button>` : '');
      // 🎄 Holiday / no-coverage apology + pre-diagnosis offer (Teddy 2026-07-02)
      const noCovBtn = c.phone ? `<button onclick="event.preventDefault();event.stopPropagation();sendNoCoverage('${c.phone}',${c.jobId||0})" style="background:#7a5cf0;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer">🎄 No coverage</button>` : '';
      const textLink = c.phone ? `<a class="a-text" href="sms:+1${c.phone}" onclick="event.stopPropagation()">📱 Text now</a>` : '';
      if(c.phone) LAST_TEXT[c.phone] = (c.lastInMsg ? (c.lastInMsg.body||'') : (c.last.dir==='in' ? (c.last.body||'') : ''));
      const replyBtn = c.phone ? `<button onclick="event.preventDefault();event.stopPropagation();replyTo('${c.phone}')" style="background:#0a7d33;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer">✍️ Reply (auto-translate)</button>` : '';
      const statusBtn = c.phone ? `<button onclick="event.preventDefault();event.stopPropagation();sendStatus('${c.phone}')" style="background:#1f6df0;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer">📍 Send status</button>` : '';
      const reviewBtn = c.phone ? `<button onclick="event.preventDefault();event.stopPropagation();askReview('${c.phone}')" style="background:#e8a317;color:#1a1205;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer">⭐ Ask for review</button>` : '';
      // Full thread — chronological bubbles, hidden until the row is tapped.
      const msgs=(c.msgs||[]).slice().sort((a,b)=>a.ts-b.ts);
      const bubbles=msgs.map(m=>{
        const inb=m.dir==='in';
        const txt=m.body?esc(m.body):(m.blocked?'(held by the customer-SMS gate)':'(no text)');
        const bg=inb?'#1b2330':(m.blocked?'#3a2a14':'#0a5d2a');
        const lbl=inb?'Customer':(m.blocked?'Ant (held)':'Us / Ant');
        return `<div style="display:flex;justify-content:${inb?'flex-start':'flex-end'};margin:5px 0">
          <div style="max-width:80%;background:${bg};border-radius:13px;padding:8px 12px">
            <div style="font-size:11px;color:#8a96a8;margin-bottom:3px">${lbl} · ${rel(m.ts)}</div>
            <div style="font-size:14px;color:#e7edf5;line-height:1.4;white-space:pre-wrap">${txt}</div>
          </div></div>`;
      }).join('')||'<div style="color:#8a96a8;font-size:13px;padding:6px">No messages.</div>';
      const thread=`<div id="thr-${c.key}" style="display:none;margin-top:10px;padding:10px;background:rgba(255,255,255,0.02);border-radius:10px;border:1px solid rgba(255,255,255,0.07)">${bubbles}<div class="actions" style="margin-top:10px;flex-wrap:wrap">${statusBtn}${replyBtn}${reviewBtn}${noCovBtn}${tileBtn}${openLink}${textLink}</div></div>`;
      return `<div class="conv ${c.needsReview?'waiting':''}" id="conv-${c.key}" onclick="toggleThread('${c.key}')" style="cursor:pointer">
        <div class="crow"><div class="who" id="who-${c.key}" data-phone="${c.name?'':c.phone}">${esc(who)}${waitB}</div><div class="when">${rel(c.last.ts)} <button onclick="dismissThread(event,'${c.key}',${c.last.ts})" title="Clear — comes back if they text again" style="background:transparent;border:0;color:#8a96a8;font-size:17px;font-weight:800;cursor:pointer;padding:0 2px 0 9px;line-height:1">✕</button> <span style="opacity:.6">›</span></div></div>
        <div class="ctx" id="ctx-${c.key}" data-ph="${c.phone||''}" style="display:none;font-size:11.5px;color:#8a96a8;margin-top:3px"></div>
        <div class="snippet">${dirLbl}${snip}</div>
        ${thread}
      </div>`;
    }).join('');
  }
  document.getElementById('refresh').textContent='updated '+new Date().toLocaleTimeString()+' · pauses while you read/reply · tap to refresh now';
  resolveNames();
  enrichStatus();
}

// Danielle's ask #4: show the job context (appliance · tech · status) right in each
// conversation header, so she answers without opening anything. Same status engine.
const CTX_CACHE={};
async function enrichStatus(){
  const els=document.querySelectorAll('.ctx[data-ph]');
  for(const el of els){
    const ph=el.getAttribute('data-ph'); if(!ph)continue;
    el.removeAttribute('data-ph');
    if(CTX_CACHE[ph]===undefined){
      try{
        const d=await (await fetch('/.netlify/functions/job-status-reason?phone='+encodeURIComponent(ph))).json();
        CTX_CACHE[ph]=(d&&d.found)?{appliance:d.appliance||'',tech:d.tech||'',headline:d.headline||''}:null;
      }catch(_){ CTX_CACHE[ph]=null; }
    }
    const x=CTX_CACHE[ph];
    if(x){
      const bits=['🛠 '+(x.appliance||'job'), x.tech?('👤 '+x.tech):'', x.headline?('· '+x.headline):''].filter(Boolean);
      el.textContent=bits.join(' '); el.style.display='block';
    }
  }
}

// Danielle's ask #1: show the customer NAME, not the number. Many SMS rows don't
// carry customer_name, so for any conversation header still showing a phone we
// look the number up and patch the name in. Cached so it's one lookup per number.
const NAME_CACHE={};
async function resolveNames(){
  const spans=document.querySelectorAll('.who[data-phone]');
  for(const span of spans){
    const ph=span.getAttribute('data-phone'); if(!ph)continue;
    span.removeAttribute('data-phone'); // don't re-resolve
    if(NAME_CACHE[ph]===undefined){
      try{
        const r=await fetch(XANO+'/lookup_customer_by_phone?phone='+ph,{cache:'no-store'});
        const d=await r.json();
        const c=d&&d.customer;
        NAME_CACHE[ph]=c?((c.preferred_name||((c.first_name||'')+' '+(c.last_name||''))).trim()):'';
      }catch(_){ NAME_CACHE[ph]=''; }
    }
    const nm=NAME_CACHE[ph];
    if(nm){ const badge=span.querySelector('.badge'); span.textContent=nm; if(badge)span.appendChild(badge); }
  }
}

// Danielle's ask #2: look up a customer to START a message (not just reply).
function toggleCompose(){
  const el=document.getElementById('compose');
  const open=el.style.display==='none';
  el.style.display=open?'block':'none';
  if(open)setTimeout(()=>document.getElementById('custSearch').focus(),50);
}
let SEARCH_T=null;
function onSearchInput(){
  clearTimeout(SEARCH_T);
  const q=document.getElementById('custSearch').value.trim();
  const box=document.getElementById('custResults');
  if(q.length<2){ box.innerHTML=''; return; }
  box.innerHTML='<div style="color:#8a93aa;font-size:13px;padding:6px">Searching…</div>';
  SEARCH_T=setTimeout(()=>runCustomerSearch(q),320);
}
async function runCustomerSearch(q){
  const box=document.getElementById('custResults');
  let results=[];
  try{
    const r=await fetch('/.netlify/functions/search-customers?q='+encodeURIComponent(q),{cache:'no-store'});
    const d=await r.json();
    results=(d&&d.results)||[];
  }catch(_){ box.innerHTML='<div style="color:#ff6b6b;font-size:13px;padding:6px">Search failed — try again.</div>'; return; }
  if(!results.length){ box.innerHTML='<div style="color:#8a93aa;font-size:13px;padding:6px">No customer found. Check spelling or try the phone number.</div>'; return; }
  box.innerHTML=results.slice(0,8).map(res=>{
    const c=res.customer||{};
    const nm=((c.first_name||'')+' '+(c.last_name||'')).trim()||'(no name)';
    const ph=digits(c.phone);
    const loc=[c.city,c.state].filter(Boolean).join(', ');
    const jb=res.latest_job&&res.latest_job.id?(' · Job #'+res.latest_job.id):'';
    const dis=!ph?'opacity:.5':'';
    return `<div onclick="${ph?`startNew('${ph}','${esc(nm).replace(/'/g,'')}')`:''}" style="background:#0c1118;border:1px solid #2a3040;border-radius:9px;padding:10px 12px;margin-bottom:6px;cursor:${ph?'pointer':'default'};${dis}">
      <div style="font-weight:700;color:#e7edf5">${esc(nm)}</div>
      <div style="color:#8a93aa;font-size:12px;margin-top:2px">${ph?fmtPhone(ph):'⚠ no phone on file'}${loc?(' · '+esc(loc)):''}${jb}</div>
    </div>`;
  }).join('');
}
async function startNew(phone,name){
  const eng=prompt('Message to '+name+' — type in English, Ant sends it to the customer:');
  if(!eng||!eng.trim())return;
  try{
    const r=await fetch('/.netlify/functions/send-translated-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'+1'+phone,reply_english:eng.trim(),customer_text:''})});
    const d=await r.json();
    if(d&&(d.success||d.sent)){ alert('✅ Sent to '+name); toggleCompose(); document.getElementById('custSearch').value=''; document.getElementById('custResults').innerHTML=''; load(); }
    else alert('⚠ Could not send'+(d&&d.error?': '+d.error:' — check customer texting is on'));
  }catch(e){ alert('⚠ Send failed: '+e.message); }
}
// Translation bridge (outbound): office types English → Ant sends it in the
// customer's language (detected from their last message). Customer texting must
// be ON for the send to land.
let LAST_TEXT={};
async function replyTo(phone){
  const eng=prompt("Reply in English — Ant translates it to the customer's language and sends it:");
  if(!eng||!eng.trim())return;
  try{
    const r=await fetch('/.netlify/functions/send-translated-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'+1'+phone,reply_english:eng.trim(),customer_text:LAST_TEXT[phone]||''})});
    const d=await r.json();
    if(d&&d.ok){ alert('✅ Sent in '+(d.language||'their language')+':\n\n'+(d.translated||'')); load(); }
    else alert('⚠ Could not send'+(d&&d.error?': '+d.error:' — check customer texting is on'));
  }catch(_){ alert('⚠ Connection error — try again'); }
}
// 📍 Send status — pull this customer's live job status (the same engine the phone
// relays + the portal shows) and one-tap text it to them. Kills the most repetitive
// "where's my repair?" reply Danielle types all day.
async function sendStatus(phone){
  let d;
  try{ d=await (await fetch('/.netlify/functions/job-status-reason?phone='+encodeURIComponent(phone)+'&voice=customer')).json(); }
  catch(_){ alert('Could not load status — try again.'); return; }
  if(!d||!d.found||!d.reason){ alert('No open job found for this number, so there\'s no status to pull. Use ✍️ Reply to text them.'); return; }
  const first=(d.customer||'').trim().split(/\s+/)[0]||'';
  const msg='Hi'+(first?(' '+first):'')+'! Quick update on your repair: '+d.reason;
  if(!confirm('Send this to them?\n\n'+msg)) return;
  try{
    const r=await fetch('/.netlify/functions/send-translated-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'+1'+phone,reply_english:msg,customer_text:LAST_TEXT[phone]||''})});
    const res=await r.json();
    if(res&&(res.ok||res.success||res.sent)){ alert('✅ Status sent'); load(); }
    else alert('⚠ Could not send'+(res&&res.error?': '+res.error:' — check customer texting is on'));
  }catch(e){ alert('⚠ Send failed: '+e.message); }
}
// 🗂 Open the customer's job tile from any thread. Uses the job id if we have one,
// otherwise resolves it by phone (or falls back to a customer search) so Danielle can
// always see WHO a number is. (Teddy 2026-07-02)
async function openJob(phone, jobId){
  if(jobId && Number(jobId)>0){ location.href='/office-board.html?job='+Number(jobId)+'&from=messages'; return; }
  const p=String(phone||'').replace(/\D/g,'').slice(-10);
  if(p.length===10){
    try{
      const d=await (await fetch('/.netlify/functions/job-status-reason?phone='+encodeURIComponent(p))).json();
      if(d&&d.found&&d.job_id){ location.href='/office-board.html?job='+d.job_id+'&from=messages'; return; }
    }catch(_){}
    location.href='/customer-search.html?phone='+encodeURIComponent(p);
    return;
  }
  alert('No number on this thread to look up the job.');
}
// 🎄 No-coverage apology + pre-diagnosis offer. For jobs we can't cover this week
// (techs off for the holiday). One tap: apologize, explain the coverage gap, and
// offer to pre-diagnose + pre-order parts via a 10-sec video link. (Teddy 2026-07-02)
async function sendNoCoverage(phone, jobId){
  let first='', appl='';
  try{ const d=await (await fetch('/.netlify/functions/job-status-reason?phone='+encodeURIComponent(phone))).json(); if(d&&d.found){ first=(d.customer||'').trim().split(/\s+/)[0]||''; appl=d.appliance||''; } }catch(_){}
  const link = (jobId>0) ? ('https://tnapplianceexchange.net/finish-upload.html?job_id='+jobId) : 'https://tnapplianceexchange.net';
  const msg='Hi'+(first?(' '+first):'')+' — so sorry for the inconvenience. Our technicians are off for the holiday, so we\'re short on coverage in your area this week. If no one has been able to help you yet, we\'d be glad to come take care of it. Want us to get a head start? Tap this link and shoot a quick 10-second video'+(appl?(' of your '+appl):'')+' — we\'ll pre-diagnose it and pre-order your parts so we can fix it fast: '+link+'  Thanks so much! — TN Appliance Exchange';
  // Guard: don't turn away a customer in an area we actually cover (Keith Johnson
  // is in Clarksville = Lee's area — a no-coverage note there is wrong). (Teddy 2026-07-02)
  let covWarn='';
  try{
    const cu=await (await fetch(XANO+'/lookup_customer_by_phone?phone='+encodeURIComponent('+1'+String(phone).replace(/\D/g,'').slice(-10)))).json();
    const zip=(cu&&cu.customer&&cu.customer.zip)||'';
    if(zip){
      const z=await (await fetch(XANO+'/check_service_zone?zip_code='+encodeURIComponent(zip))).json();
      if(z&&z.covered){ covWarn='⚠️ WE SERVICE THIS AREA — '+(z.market||z.cluster||zip)+(z.suggested_tech_name?(' · '+z.suggested_tech_name+' covers it'):'')+'.\nThey should be SCHEDULED, not sent a no-coverage note.\n\n'; }
    }
  }catch(_){}
  if(!confirm(covWarn+'Send this no-coverage note?\n\n'+msg)) return;
  try{
    const r=await fetch('/.netlify/functions/send-translated-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'+1'+phone,reply_english:msg,customer_text:LAST_TEXT[phone]||''})});
    const res=await r.json();
    if(res&&(res.ok||res.success||res.sent)){ alert('✅ No-coverage note sent'); load(); }
    else alert('⚠ Could not send'+(res&&res.error?': '+res.error:' — check customer texting is on'));
  }catch(e){ alert('⚠ Send failed: '+e.message); }
}
// ⭐ Ask for review — one tap sends a happy customer the Google review link. The
// cheapest way to get jobs (reviews drive the Google map-pack), works the moment
// Danielle knows a customer's pleased — no waiting on an auto-trigger.
const REVIEW_URL='https://g.page/r/CRt-vo--eAJ3EBM/review';
async function askReview(phone){
  let first='', appl='';
  try{ const d=await (await fetch('/.netlify/functions/job-status-reason?phone='+encodeURIComponent(phone))).json(); if(d&&d.found){ first=(d.customer||'').trim().split(/\s+/)[0]||''; appl=d.appliance||''; } }catch(_){}
  const msg='Hi'+(first?(' '+first):'')+'! It was a pleasure helping you'+(appl?(' with your '+appl):'')+'. If we did right by you, a quick Google review means the world to a small local shop 🙏 '+REVIEW_URL+'  — thank you! — TN Appliance Exchange';
  if(!confirm('Send this review request?\n\n'+msg)) return;
  try{
    const r=await fetch('/.netlify/functions/send-translated-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'+1'+phone,reply_english:msg,customer_text:LAST_TEXT[phone]||''})});
    const res=await r.json();
    if(res&&(res.ok||res.success||res.sent)){ alert('✅ Review request sent'); } else alert('⚠ Could not send'+(res&&res.error?': '+res.error:' — check customer texting is on'));
  }catch(e){ alert('⚠ Send failed: '+e.message); }
}
// ── Techs ⇄ Office (in-app, not SMS) ──────────────────────────────
async function loadTechMsgs(){
  let msgs=[];
  try{ const r=await fetch('/.netlify/functions/tech-message?office_inbox=1',{cache:'no-store'}); const d=await r.json(); msgs=(d&&d.messages)||[]; }catch(_){ return; }
  const host=document.getElementById('techMsgs');
  const head=`<div style="display:flex;align-items:center;gap:8px;margin:4px 0 8px">
    <div style="font-size:13px;font-weight:800;color:#74e3c4">🧑‍🔧 From the techs · <span style="font-weight:600;color:#8a93aa">in-app, no texts</span></div>
    <button onclick="broadcastTechs()" style="margin-left:auto;background:#1f6df0;color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer">📣 Message all techs</button>
  </div>`;
  if(!msgs.length){ host.innerHTML=head+'<div style="background:#161c26;border:1px solid #2a3040;border-radius:12px;padding:12px 14px;color:#8a93aa;font-size:13px;margin-bottom:14px">No tech messages yet. Reply to a tech with the button on their card, or they\'ll message you from the app.</div>'; return; }
  host.innerHTML = head + msgs.slice(0,12).map(m=>{
    const when=rel(m.at_ms); const job=m.related_job_id?(' · Job #'+m.related_job_id):'';
    return `<div style="background:#15201b;border:1px solid #2a6a4a;border-radius:12px;padding:12px 14px;margin-bottom:9px">
      <div class="crow"><div class="who">${esc(m.tech_name)}${esc(job)}</div><div class="when">${when}</div></div>
      <div class="snippet"><span class="dir out">Tech:</span> ${esc(m.body)}</div>
      <div class="actions"><button onclick="replyTech(${m.technician_id},'${esc(m.tech_name).replace(/'/g,'')}')" style="background:#0a7d33;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer">✍️ Reply to ${esc(m.tech_name)}</button></div>
    </div>`;
  }).join('') + '<div style="height:8px"></div>';
}
async function replyTech(techId,name){
  const pw=localStorage.getItem('tn_office_auth')||prompt('Office password:');
  if(!pw)return;
  const body=prompt('Message to '+name+':'); if(!body||!body.trim())return;
  try{
    const r=await fetch(XANO+'/send_office_to_tech_message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tech_id:techId,office_password:pw,body:body.trim(),sender_name:'Office'})});
    const d=await r.json();
    if(d&&d.success){ alert('✅ Sent to '+name+' — shows in their app inbox.'); }
    else alert('⚠ '+((d&&d.error)||'could not send'));
  }catch(_){ alert('⚠ Connection error'); }
}
async function broadcastTechs(){
  const pw=localStorage.getItem('tn_office_auth')||prompt('Office password:');
  if(!pw)return;
  const body=prompt('📣 Message to send to ALL active techs (lands in every tech app):');
  if(!body||!body.trim())return;
  try{
    const r=await fetch('/.netlify/functions/broadcast-tech-message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({office_password:pw,body:body.trim(),sender_name:'Office'})});
    const d=await r.json();
    if(d&&d.ok) alert('✅ Sent to '+(d.sent||0)+' techs: '+((d.techs||[]).join(', ')||'—'));
    else alert('⚠ '+((d&&d.error)||'could not send'));
  }catch(_){ alert('⚠ Connection error'); }
}
// Notifications for the office (Danielle / owner desktop)
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw-tech.js').catch(()=>{}); }
(function(){
  var nb=document.getElementById('notifBtn'); if(!nb||!window.AntPush) return;
  AntPush.status().then(function(st){
    if(st==='on'||st==='unsupported'){ nb.style.display='none'; return; }
    nb.style.display='inline-block';
    nb.onclick=async function(){ nb.disabled=true; nb.textContent='…';
      var ok=await AntPush.enable('office',0);
      if(ok){ nb.textContent='✅ On'; setTimeout(function(){nb.style.display='none';},1500); }
      else { nb.disabled=false; nb.textContent='🔔 Turn on notifications'; }
    };
  });
})();
// Read receipts: messages sent to techs + ✓ Read / ⏳ Unread
const TECH_NAMES={1:'Teddy',2:'Jimmy',3:'Andre',4:'Lee',6:'John'};
async function loadSentToTechs(){
  let msgs=[];
  try{ const r=await fetch('/.netlify/functions/tech-message?sent_to_techs=1',{cache:'no-store'}); const d=await r.json(); msgs=(d&&d.messages)||[]; }catch(_){ return; }
  const host=document.getElementById('sentToTechs'); if(!host) return;
  if(!msgs.length){ host.innerHTML=''; return; }
  host.innerHTML='<div style="font-size:13px;font-weight:800;color:#9db4d6;margin:10px 0 8px">📨 Sent to techs · read receipts</div>'+
    msgs.slice(0,15).map(function(m){
      var who=TECH_NAMES[m.tech_id]||('Tech '+m.tech_id);
      var status=m.read?('<span style="color:#5fe0a0;font-weight:700">✓ Read '+rel(m.read_at)+'</span>'):'<span style="color:#ff8c61;font-weight:700">⏳ Unread</span>';
      var snip=m.body?(' — '+esc(String(m.body).slice(0,80))):'';
      return '<div style="background:#161c26;border:1px solid #2a3040;border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:13px"><b>'+esc(who)+'</b> · '+status+'<div style="color:#8a93aa;margin-top:3px">from '+esc(m.sender_name||'Office')+esc(snip)+'</div></div>';
    }).join('');
}
// 📞 Callback queue — Ant captures a callback_request every time it can't fully
// finish a caller (e.g. "part arrived, ready for install") and texts the customer,
// but the follow-up ACTION (schedule it) lives in callbacks.html — a page Danielle
// wasn't checking, so those slipped. Surface the open count right here where she
// lives so nothing sits unworked. (2026-07-02)
async function loadCallbacks(){
  try{
    const r=await fetch(XANO+'/list_callback_requests?days=7',{cache:'no-store'});
    const d=await r.json();
    const open=(d&&d.open_count)||0;
    const b=document.getElementById('cbBanner');
    if(!b)return;
    if(open>0){
      b.style.display='block';
      b.innerHTML='<div style="background:#7a1f1f;border:1px solid #b3392f;border-radius:11px;padding:11px 13px;margin:0 0 10px;color:#ffe;font-weight:800;display:flex;justify-content:space-between;align-items:center">'
        +'<span>📞 '+open+' callback'+(open===1?'':'s')+' to work — Ant took the info, someone needs to follow up</span>'
        +'<span style="opacity:.85;font-weight:700">open ›</span></div>';
    } else { b.style.display='none'; }
  }catch(_){}
}
load(); loadTechMsgs(); loadSentToTechs(); loadCallbacks();

// Danielle's ask: the 30s auto-refresh was wiping the page while she read/replied.
// Now it NEVER refreshes while she's busy — a thread open, the compose panel open,
// typing, or active in the last 60s. It only refreshes when she's idle. Plus the
// footer line is a manual "tap to refresh now".
let LAST_ACTIVITY = Date.now();
['click','keydown','touchstart','input'].forEach(ev=>document.addEventListener(ev,()=>{LAST_ACTIVITY=Date.now();},{passive:true}));
function userBusy(){
  const comp=document.getElementById('compose');
  if(comp && comp.style.display!=='none') return true;                       // looking up a customer
  const threads=document.querySelectorAll('[id^="thr-"]');
  for(const t of threads){ if(t.style.display==='block') return true; }       // reading a thread
  const a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')) return true;          // typing
  if(Date.now()-LAST_ACTIVITY < 60000) return true;                           // active in last 60s
  return false;
}
setInterval(()=>{ if(userBusy())return; load();loadTechMsgs();loadSentToTechs();loadCallbacks(); },30000);
// manual refresh — tap the footer line anytime
(function(){ const r=document.getElementById('refresh'); if(r){ r.style.cursor='pointer'; r.title='Tap to refresh now'; r.addEventListener('click',()=>{load();loadTechMsgs();loadSentToTechs();}); } })();
</script>
