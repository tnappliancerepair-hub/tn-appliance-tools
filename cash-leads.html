<!DOCTYPE html>
<html lang="en" data-default-theme="dark"><head>
<script src="/ant-theme.js?v=20260704-1"></script>
<script src="/office-auth.js?v=20260703b"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash Leads · Ant</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--bg:#070a0e;--card:#111824;--bord:#1f2a37;--text:#e6edf3;--muted:#8b98a5;--green:#39ff14;--orange:#ff8c42;--blue:#4cc9c0;--red:#ff6b6b;--mono:ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;padding:14px;max-width:860px;margin:0 auto;}
  h1{font-size:20px;}.sub{color:var(--muted);font-size:12px;margin:4px 0 14px;}
  .gate{max-width:320px;margin:60px auto;text-align:center;}
  .gate input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--bord);background:var(--card);color:var(--text);font-size:16px;margin:10px 0;}
  .gate button{background:var(--blue);color:#04201d;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;}
  .card{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
  .card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .nm{font-weight:800;font-size:16px;}
  .jid{color:var(--muted);font-size:12px;font-family:var(--mono);}
  .appl{color:#cdd7e1;font-size:13px;margin-top:3px;}
  .prob{color:var(--muted);font-size:13px;margin-top:3px;font-style:italic;}
  .avail{margin-top:7px;font-size:13px;font-weight:700;background:rgba(57,255,20,.08);border:1px solid rgba(57,255,20,.35);color:var(--green);border-radius:8px;padding:6px 9px;}
  .avail .lbl{font-size:11px;color:#9be88a;font-weight:800;letter-spacing:.3px;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .b{font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;}
  .b.need{background:rgba(255,107,107,.14);border:1px solid rgba(255,107,107,.5);color:var(--red);}
  .b.ok{background:rgba(57,255,20,.10);border:1px solid rgba(57,255,20,.4);color:var(--green);}
  .b.cash{background:rgba(255,140,66,.14);border:1px solid rgba(255,140,66,.5);color:var(--orange);}
  .b.info{background:rgba(76,201,192,.12);border:1px solid rgba(76,201,192,.4);color:var(--blue);}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;}
  .acts a,.acts button{flex:1;min-width:46%;text-align:center;text-decoration:none;font-weight:800;font-size:13px;padding:11px 8px;border-radius:9px;cursor:pointer;border:1px solid;}
  .a-tool{background:rgba(76,201,192,.14);border-color:rgba(76,201,192,.5);color:var(--blue);}
  .a-text{background:rgba(255,140,66,.12);border-color:rgba(255,140,66,.5);color:var(--orange);}
  .a-call{background:rgba(57,255,20,.10);border-color:rgba(57,255,20,.4);color:var(--green);}
  .empty{color:var(--muted);font-size:14px;padding:24px 0;text-align:center;}
  .refresh{color:var(--blue);font-size:12px;text-decoration:none;}
</style></head><body>
<div id="gate" class="gate">
  <h1>💵 Cash Leads</h1>
  <input id="pw" type="password" placeholder="Office password">
  <button onclick="unlock()">Unlock</button>
  <div id="gerr" style="color:#ff6b6b;font-size:12px;margin-top:8px;"></div>
</div>
<div id="app" style="display:none;">
  <div class="top" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <h1>💵 Cash Leads</h1>
    <a class="refresh" href="#" onclick="load();return false;">↻ refresh</a>
  </div>
  <div class="sub">Every self-pay Quick Check lead off the website — paid or not. Work the ones that still need a model #, photo, or payment so none get lost.</div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script src="/office-nav.js?v=20260703c"></script>
<script>
const FN='/.netlify/functions';
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
function unlock(){
  const pw=document.getElementById('pw').value.trim();
  fetch(XANO+'/verify_office_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
    .then(r=>r.json()).then(d=>{ if(d&&(d.valid||d.success||d.ok)){ localStorage.setItem('ant_office_pw',pw); show(); } else document.getElementById('gerr').textContent='Wrong password'; })
    .catch(()=>document.getElementById('gerr').textContent='Connection error');
}
function show(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; load(); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtPhone(p){ const d=String(p||'').replace(/\D/g,'').slice(-10); return d.length===10?d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'):(p||''); }
function ago(ms){ if(!ms) return ''; const m=Math.floor((Date.now()-ms)/60000); if(m<60) return m+'m ago'; const h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }

async function load(){
  const host=document.getElementById('list');
  try{
    const d=await fetch(FN+'/cash-leads?days=30').then(r=>r.json());
    const leads=(d&&d.leads)||[];
    if(!leads.length){ host.innerHTML='<div class="empty">No open cash leads right now. 🎉</div>'; return; }
    host.innerHTML=leads.map(card).join('');
    // fetch photo counts per card (accurate, lazy)
    leads.forEach(L=>{
      fetch(XANO+'/get_job_attachments?job_id='+L.job_id).then(r=>r.json()).then(a=>{
        const n=(a&&a.count)||0; const el=document.getElementById('ph-'+L.job_id);
        if(el){ el.className='b '+(n>0?'ok':'need'); el.textContent=(n>0?('📸 '+n+' photo'+(n>1?'s':'')):'no photo'); }
      }).catch(()=>{});
    });
  }catch(_){ host.innerHTML='<div class="empty">Could not load. Pull to refresh.</div>'; }
}

function card(L){
  const phone=fmtPhone(L.phone);
  const tool='/teddy-tdr-tool.html?job_id='+L.job_id;
  const tel=L.phone?('tel:+1'+String(L.phone).replace(/\D/g,'').slice(-10)):'#';
  const modelBadge = L.has_model
    ? '<span class="b ok">model ✓</span>'
    : '<span class="b need">no model</span>';
  const payBadge = L.paid ? '<span class="b ok">paid ✓</span>' : '<span class="b need">unpaid</span>';
  return `<div class="card">
    <div class="top"><span class="nm">${esc(L.name)}</span><span class="jid">#${L.job_id} · ${ago(L.created_ms)}</span></div>
    <div class="appl">${esc(L.appliance||'appliance')}${L.zip?(' · '+esc(L.zip)):''}${phone?(' · '+esc(phone)):''}</div>
    ${L.problem?`<div class="prob">"${esc(L.problem)}"</div>`:''}
    ${L.availability?`<div class="avail"><span class="lbl">🗓 THEY'RE AVAILABLE</span><br>${esc(L.availability)}</div>`:''}
    <div class="badges">
      <span class="b cash">CASH</span>
      ${L.availability?'<span class="b ok">🗓 avail ✓</span>':'<span class="b need">awaiting reply</span>'}
      ${payBadge}${modelBadge}
      <span class="b" id="ph-${L.job_id}" style="background:rgba(139,152,165,.12);border:1px solid rgba(139,152,165,.4);color:var(--muted)">photos…</span>
      <span class="b info">${esc(L.status||'Pending')}</span>
    </div>
    <div class="acts">
      <a class="a-tool" href="${tool}">🔧 Open in Teddy Tool</a>
      <button class="a-text" onclick='textLead(${L.job_id}, ${JSON.stringify(L.name)}, ${JSON.stringify(L.phone)}, ${L.has_model?1:0})'>📲 Text for ${L.has_model?'photo':'model + photo'}</button>
      <a class="a-call" href="${tel}">📞 Call ${esc(phone)}</a>
    </div>
  </div>`;
}

async function textLead(jobId, name, phone, hasModel){
  const first=(String(name||'').split(/\s+/)[0])||'there';
  const ask = hasModel
    ? 'a quick photo of the model-number sticker so I can confirm the exact part'
    : 'a quick photo of the model-number sticker on your appliance';
  const body='Hi '+first+', this is Teddy with Tennessee Appliance about your Quick Check. We had a glitch with our photo uploads yesterday -- it is fixed now. Could you send '+ask+'? With that I can get the exact part ordered and a quote back to you today. Easiest: tap here to add the pic: https://tnapplianceexchange.net/finish-upload.html?job_id='+jobId+'  Or just reply to this text with the photo. Any trouble, call or text my cell at 615-485-5795. Thanks! -- Teddy';
  if(!confirm('Text '+name+' ('+fmtPhone(phone)+')?\n\n'+body)) return;
  const to='+1'+String(phone||'').replace(/\D/g,'').slice(-10);
  if(to.length<12){ alert('No valid phone on file for this lead.'); return; }
  try{
    const r=await fetch(XANO+'/send_sms',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({to,body,message:body,context_tag:'cash_lead_model_request'})});
    const d=await r.json();
    alert(d&&d.success?'✅ Sent to '+name+'.':'⚠️ Did not send: '+((d&&d.error)||'unknown'));
  }catch(_){ alert('⚠️ Send failed — check signal and try again.'); }
}

if(localStorage.getItem('ant_office_pw')) show();
</script>
</body></html>
