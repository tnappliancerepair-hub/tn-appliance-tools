<style>
  :root { --bg: #0b0d10; --card: #161a1f; --line: #2a2f37; --text: #e6e8eb; --muted: #8b919c; --accent: #4ad991; --warn: #f0b450; --danger: #ef6a6a; --info: #4ca7ff; --mono: 'SF Mono', Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 18px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .tag { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .filter-btn { background:transparent; border:1px solid var(--line); color:var(--muted); padding:8px 14px; border-radius:18px; cursor:pointer; font-size:13px; }
  .filter-btn.active { background:var(--info); border-color:var(--info); color:#fff; }
  .filter-btn .count { display:inline-block; margin-left:6px; background:rgba(0,0,0,0.3); padding:1px 7px; border-radius:9px; font-size:11px; }
  .call-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .call-card .row1 { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.inbound { background: rgba(74,217,145,0.15); color: var(--accent); border: 1px solid rgba(74,217,145,0.35); }
  .badge.outbound { background: rgba(76,167,255,0.15); color: var(--info); border: 1px solid rgba(76,167,255,0.35); }
  .badge.voicemail { background: rgba(240,180,80,0.15); color: var(--warn); border: 1px solid rgba(240,180,80,0.35); }
  .badge.completed { background: rgba(74,217,145,0.10); color: var(--accent); border: 1px solid rgba(74,217,145,0.25); }
  .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .summary { margin-top: 8px; color: #cfd6e0; font-size: 13px; line-height: 1.45; }
  .transcript-toggle { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; letter-spacing: 0.05em; margin-top: 8px; }
  .transcript-toggle:hover { color: var(--text); border-color: var(--info); }
  pre.transcript { background:#0a0c10; border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:8px; font-family:var(--mono); font-size:12px; line-height:1.5; max-height: 280px; overflow:auto; white-space: pre-wrap; word-break: break-word; color: #cfd6e0; }
  .loading { color: var(--muted); padding: 30px; text-align:center; }
  .empty { color: var(--muted); padding: 50px; text-align:center; font-style: italic; }
  .phone { font-family: var(--mono); color: var(--info); }
  .auth-gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .auth-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 30px; max-width: 360px; width: 100%; text-align: center; }
  .auth-card input { margin-top: 14px; width: 100%; padding: 11px 14px; background: #0e1118; border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 15px; }
  .auth-card button { margin-top: 12px; width: 100%; padding: 11px; background: var(--info); border: 0; border-radius: 8px; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }

<body>
<script src="/office-nav.js?v=20260703e"></script>
<script src="/office-search.js?v=20260701-resolve"></script>

<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div style="font-size:32px;margin-bottom:6px">📞</div>
    <div style="font-size:20px;font-weight:700">Recent Calls</div>
    <div style="color:var(--muted);font-size:12px;margin-top:4px">Ant Office</div>
    <input id="authInput" type="password" placeholder="Office password" autocomplete="off">
    <button id="authSubmit">Unlock</button>
    <div id="authErr" style="color:var(--danger);font-size:12px;margin-top:8px;min-height:14px"></div>
  </div>
</div>

<div id="app" style="display:none">
<div class="wrap">
  <h1>📞 Recent Calls</h1>
  <p class="tag">Toggle Customer vs Tech calls. Tap ✕ to clear one once you've read it — cleared calls drop off (find them under 🗂 Cleared).</p>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="customer" data-group="who" style="background:rgba(74,217,145,0.15);border-color:rgba(74,217,145,0.45);color:#4ad991">👤 Customer calls <span class="count" id="cCust">0</span></button>
    <button class="filter-btn" data-filter="tech" data-group="who" style="background:rgba(180,140,255,0.12);border-color:rgba(180,140,255,0.4);color:#b48cff">🔧 Tech calls <span class="count" id="cTech">0</span></button>
    <button class="filter-btn" data-filter="all" data-group="who">All <span class="count" id="cAll">0</span></button>
    <button class="filter-btn" data-filter="needs_review" data-group="who" style="background:rgba(240,180,80,0.15);border-color:rgba(240,180,80,0.45);color:#f0b450">⚠️ Needs review <span class="count" id="cNR">0</span></button>
    <button class="filter-btn" data-filter="voicemail" data-group="who">Voicemail / no answer <span class="count" id="cVm">0</span></button>
    <span style="flex:1"></span>
    <button class="filter-btn" data-filter="cleared" data-group="who">🗂 Cleared <span class="count" id="cClr">0</span></button>
    <button class="filter-btn" data-filter="2" data-group="days">48h</button>
    <button class="filter-btn active" data-filter="7" data-group="days">7d</button>
  </div>

  <div id="callsList"><div class="loading">Loading calls…</div></div>
</div>
</div>

<!-- Text compose: sends through the office (Telnyx), so it works on desktop.
     A device sms: link opens Chrome on a laptop and never sends. -->
<div id="textModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:420px;width:100%">
    <div style="font-size:16px;font-weight:800;margin-bottom:2px">📱 Text customer</div>
    <div id="textTo" style="font-family:var(--mono);color:var(--info);font-size:13px;margin-bottom:12px"></div>
    <textarea id="textBody" placeholder="Type your message…" style="width:100%;min-height:96px;padding:11px;background:#0e1118;border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical"></textarea>
    <div id="textErr" style="color:var(--danger);font-size:12px;min-height:15px;margin-top:6px"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="closeTextCompose()" style="flex:1;padding:11px;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-weight:700;cursor:pointer">Cancel</button>
      <button id="textSend" onclick="sendText()" style="flex:2;padding:11px;background:var(--accent);border:0;border-radius:8px;color:#062;font-weight:800;cursor:pointer">Send text</button>
    </div>
  </div>
</div>

<script>
const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const OFFICE_AUTH_KEY = 'tn_office_auth_v1';

const authGate = document.getElementById('authGate');
const authInput = document.getElementById('authInput');
const app = document.getElementById('app');
async function tryAuth(password) {
  try {
    const r = await fetch(`${XANO_BASE}/verify_office_password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const d = await r.json();
    return d && d.success === true;
  } catch (e) { return false; }
}
function unlock() {
  authGate.style.display = 'none';
  app.style.display = 'block';
  loadCalls();
}
const cached = localStorage.getItem(OFFICE_AUTH_KEY);
if ((window.OfficeAuth&&window.OfficeAuth.isLoggedIn()) || (cached && Date.now() - parseInt(cached, 10) < 12 * 3600 * 1000)) {
  unlock();
}
document.getElementById('authSubmit').addEventListener('click', async () => {
  const ok = await tryAuth(authInput.value);
  if (ok) { localStorage.setItem(OFFICE_AUTH_KEY, String(Date.now())); unlock(); }
  else { document.getElementById('authErr').textContent = 'Wrong password.'; }
});
authInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('authSubmit').click(); });

let allCalls = [];
let currentFilter = 'customer';
let currentDays = 7;
// Crew phone numbers (last-10) — a call to/from one of these is a tech-side
// Field Assist / TDR call, not a customer call.
const TECH_PHONES = new Set([
  '6154855795', // Teddy
  '6159671304', // Jimmy
  '6159693115', '5049099413', // Andre (both)
  '6158291654', // Lee
  '7315049617', // Billy
  '8133527686', // John
]);

async function loadCalls() {
  try {
    const r = await fetch(`${XANO_BASE}/list_calls_for_review?days=${currentDays}`);
    const d = await r.json();
    allCalls = (d && d.calls) || [];
    const reviews = (d && d.reviews) || [];
    const reviewed = new Set();
    // Xano returns metadata as an already-decoded object on the wire,
    // not a JSON string. Old code blindly called JSON.parse on it which
    // threw SyntaxError on every row -> _meta={} -> "(no summary)" for
    // every call. Detect string-vs-object before parsing.
    const decodeMeta = (raw) => {
      if (raw == null || raw === '') return {};
      if (typeof raw === 'object') return raw;
      try { return JSON.parse(raw); } catch (_) { return {}; }
    };
    reviews.forEach(rv => {
      const m = decodeMeta(rv.metadata);
      if (m.vapi_call_id) reviewed.add(m.vapi_call_id);
    });
    allCalls.forEach((c, i) => {
      c._meta = decodeMeta(c.metadata);
      c._idx = i;
      c._isInbound = !(c._meta.source && String(c._meta.source).includes('_auto') || String(c._meta.called_phone || '').startsWith('+1'));
      c._endedReason = String(c._meta.ended_reason || '').toLowerCase();
      c._isVoicemail = c._endedReason.includes('voicemail') || c._endedReason.includes('no-answer') || c._endedReason.includes('silence-timed-out');
      c._isReviewed = reviewed.has(c._meta.vapi_call_id);
      // Tech-side (Field Assist / TDR) call vs a customer call. Primary signal:
      // the caller/called number belongs to the crew. Fallback: field-assist
      // transcript markers (Ant greets a tech, talks labor hours/TDR).
      const last10 = (p) => String(p || '').replace(/\D/g, '').slice(-10);
      const cp = last10(c._meta.caller_phone), dp = last10(c._meta.called_phone);
      const byPhone = TECH_PHONES.has(cp) || TECH_PHONES.has(dp);
      const tsum = String(c._meta.transcript_preview || c._meta.summary || '').toLowerCase();
      const byTranscript = /back at it|labor hours|let'?s get it\.? .*talk to me|talk to me\.|this is (anne'?s|ant'?s) assistant\.? (let'?s|yo)/.test(tsum);
      c._isTech = byPhone || byTranscript;
      // Needs review heuristic: inbound calls that ended in voicemail OR
      // transferCall OR contain complaint keywords AND not yet reviewed.
      const sum = String(c._meta.summary || c._meta.transcript_preview || '').toLowerCase();
      const hasComplaint = /complain|upset|angry|frustrat|no one came|still broken|disappointed|cancel|refund|escalate/.test(sum);
      const wasTransferred = c._endedReason.includes('transfer') || /transfer/.test(sum);
      c._needsReview = !c._isReviewed && (
        (c._isInbound && c._isVoicemail) ||
        wasTransferred ||
        hasComplaint
      );
    });
    paintCounts();
    paintList();
  } catch (e) {
    document.getElementById('callsList').innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
  }
}
function paintCounts() {
  const active = allCalls.filter(c => !c._isReviewed); // not-yet-cleared
  document.getElementById('cCust').textContent = active.filter(c => !c._isTech).length;
  document.getElementById('cTech').textContent = active.filter(c => c._isTech).length;
  document.getElementById('cAll').textContent = active.length;
  document.getElementById('cVm').textContent = active.filter(c => c._isVoicemail).length;
  document.getElementById('cNR').textContent = active.filter(c => c._needsReview).length;
  document.getElementById('cClr').textContent = allCalls.filter(c => c._isReviewed).length;
}
function paintList() {
  const filtered = allCalls.filter(c => {
    // "Cleared" is the only view that shows already-reviewed calls; every other
    // view hides them so the inbox shrinks as you clear (the × / ✓).
    if (currentFilter === 'cleared') return c._isReviewed;
    if (c._isReviewed) return false;
    if (currentFilter === 'customer') return !c._isTech;
    if (currentFilter === 'tech') return c._isTech;
    if (currentFilter === 'voicemail') return c._isVoicemail;
    if (currentFilter === 'needs_review') return c._needsReview;
    return true; // 'all'
  });
  if (filtered.length === 0) {
    document.getElementById('callsList').innerHTML = `<div class="empty">No calls match this filter.</div>`;
    return;
  }
  document.getElementById('callsList').innerHTML = filtered.map(c => {
    const m = c._meta || {};
    const ts = new Date(c.created_at);
    const tsStr = ts.toLocaleString('en-US', { timeZone: 'America/Chicago', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
    const dur = Math.round((m.duration_sec || 0) / 60 * 10) / 10;
    const caller = m.caller_phone || m.to_phone || '?';
    const summary = (m.summary || m.transcript_preview || '').slice(0, 280).replace(/\s+/g, ' ').trim() || '(no summary)';
    const dirBadge = c._isInbound ? '<span class="badge inbound">inbound</span>' : '<span class="badge outbound">outbound</span>';
    const endedBadge = c._isVoicemail ? '<span class="badge voicemail">voicemail</span>' : '<span class="badge completed">completed</span>';
    const reviewBadge = c._needsReview ? '<span class="badge" style="background:rgba(240,180,80,0.18);color:#f0b450;border:1px solid rgba(240,180,80,0.4)">⚠️ needs review</span>' : (c._isReviewed ? '<span class="badge" style="background:rgba(74,217,145,0.10);color:#4ad991;border:1px solid rgba(74,217,145,0.25)">✓ reviewed</span>' : '');
    const transcriptId = `t-${c.id}`;
    const callerEnc = encodeURIComponent(caller);
    const callerJsSafe = (caller || '').replace(/[^+\d]/g, '');
    const jobId = m.job_id || 0;
    const customerId = m.customer_id || 0;
    const borderStyle = c._needsReview ? 'border-left:3px solid #f0b450;' : '';
    return `
      <div class="call-card" style="${borderStyle}">
        <div class="row1">
          <div>
            ${dirBadge} ${endedBadge} ${reviewBadge}
            <span class="phone">${caller}</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="meta">${tsStr} CT · ${dur}min</div>
            ${(!c._isReviewed && m.vapi_call_id) ? `<button title="Clear — I've read this" data-clear="${m.vapi_call_id}" style="background:transparent;border:1px solid var(--line);color:var(--muted);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;padding:0;flex-shrink:0">✕</button>` : ''}
          </div>
        </div>
        <div class="summary">${escapeHtml(summary)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center">
          ${m.recording_url ? `<a href="${m.recording_url}" target="_blank" class="transcript-toggle" style="text-decoration:none;background:rgba(180,140,255,0.10);border-color:rgba(180,140,255,0.4);color:#b48cff">🔊 Listen</a>` : ''}
          ${m.transcript_preview ? `<button class="transcript-toggle" onclick="toggleTranscript('${transcriptId}')">📜 Transcript</button>` : ''}
          ${callerJsSafe ? `<a href="tel:${callerJsSafe}" class="transcript-toggle" style="text-decoration:none;color:#4ca7ff;border-color:rgba(76,167,255,0.4)">📞 Call back</a>` : ''}
          ${callerJsSafe ? `<button class="transcript-toggle" onclick="openTextCompose('${callerJsSafe}')" style="color:#4ad991;border-color:rgba(74,217,145,0.4)">📱 Text</button>` : ''}
          ${customerId ? `<a href="/customer-search.html?q=${callerEnc}" class="transcript-toggle" style="text-decoration:none">👤 Customer</a>` : ''}
          ${jobId ? `<a href="/job-detail.html?job_id=${jobId}" class="transcript-toggle" style="text-decoration:none">🧾 Job #${jobId}</a>` : ''}
          ${!c._isReviewed ? `<button class="transcript-toggle" data-mark-reviewed="${m.vapi_call_id || ''}" style="background:rgba(74,217,145,0.10);border-color:rgba(74,217,145,0.4);color:#4ad991">✓ Mark reviewed</button>` : ''}
        </div>
        ${m.transcript_preview ? `<pre class="transcript" id="${transcriptId}" style="display:none">${escapeHtml(m.transcript_preview)}</pre>` : ''}
      </div>
    `;
  }).join('');

  // Wire the × clear buttons — mark reviewed + drop the card immediately.
  document.querySelectorAll('[data-clear]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const callId = btn.dataset.clear;
      if (!callId) return;
      const card = btn.closest('.call-card');
      if (card) { card.style.opacity = '0.35'; card.style.pointerEvents = 'none'; }
      try {
        const r = await fetch('/.netlify/functions/mark-call-reviewed', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vapi_call_id: callId, reviewed_by: 'office' })
        });
        const d = await r.json().catch(() => ({}));
        if (!d.success) throw new Error(d.error || 'failed');
        // reflect locally so it drops without a full reload flicker
        const hit = allCalls.find(c => (c._meta || {}).vapi_call_id === callId);
        if (hit) hit._isReviewed = true;
        paintCounts(); paintList();
      } catch (e) { if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; } }
    });
  });

  // Wire mark-reviewed buttons
  document.querySelectorAll('[data-mark-reviewed]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const callId = btn.dataset.markReviewed;
      if (!callId) return;
      btn.disabled = true; btn.textContent = '…';
      try {
        // Netlify path — the XanoScript mark_call_reviewed throws a parse error,
        // so writing the marker directly is the reliable path.
        const r = await fetch('/.netlify/functions/mark-call-reviewed', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vapi_call_id: callId, reviewed_by: 'office' })
        });
        const d = await r.json().catch(() => ({}));
        if (!d.success) throw new Error(d.error || 'failed');
        loadCalls();
      } catch (e) { btn.disabled = false; btn.textContent = '✓ Mark reviewed'; }
    });
  });
}
function toggleTranscript(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
let _textTarget = '';
function openTextCompose(phone) {
  _textTarget = phone || '';
  document.getElementById('textTo').textContent = 'To: ' + _textTarget;
  document.getElementById('textBody').value = '';
  document.getElementById('textErr').textContent = '';
  const m = document.getElementById('textModal');
  m.style.display = 'flex';
  setTimeout(() => document.getElementById('textBody').focus(), 50);
}
function closeTextCompose() { document.getElementById('textModal').style.display = 'none'; }
async function sendText() {
  const body = document.getElementById('textBody').value.trim();
  const err = document.getElementById('textErr');
  if (!body) { err.textContent = 'Type a message first.'; return; }
  if (!_textTarget) { err.textContent = 'No number.'; return; }
  const btn = document.getElementById('textSend');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch('/.netlify/functions/message-reply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: _textTarget, message: body })
    });
    const d = await r.json().catch(() => ({}));
    if (!d.ok && !d.sent) throw new Error(d.error || 'send failed');
    closeTextCompose();
  } catch (e) { err.textContent = String(e.message || 'failed'); }
  finally { btn.disabled = false; btn.textContent = 'Send text'; }
}
document.getElementById('textModal').addEventListener('click', (e) => { if (e.target.id === 'textModal') closeTextCompose(); });
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.querySelectorAll('.filter-bar .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    const group = btn.dataset.group;
    // set active within this button's group
    document.querySelectorAll(`.filter-bar .filter-btn[data-group="${group}"]`).forEach(b => b.classList.toggle('active', b === btn));
    if (group === 'days') {
      currentDays = parseInt(f, 10);
      loadCalls();
    } else {
      currentFilter = f;
      paintList();
    }
  });
});
setInterval(() => loadCalls(), 60000);
</script>

<aside id="phPanel" style="position:fixed;top:0;right:0;height:100%;width:min(440px,96vw);transform:translateX(100%);transition:transform .18s ease;z-index:946;background:#0f1420;border-left:1px solid #2a3040;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.45)">

  </div>

<script>
(function(){
  var SRC={ phone:{url:'/office-phone.html',title:'📲 Office Phone',note:'Kick yourself on/off — off = calls ring Ant.'},
            antcall:{url:'/voice-dispatch.html',title:'🤖 Schedule an Ant call',note:'Appointment reminders + confirmations.'} };
  var loaded={};
  window.phOpen=function(which){
    var s=SRC[which]; if(!s)return;
    document.getElementById('phTitle').textContent=s.title;
    document.getElementById('phNote').textContent=s.note;
    var f=document.getElementById('phFrame');
    if(loaded.which!==which){ f.src=s.url; loaded.which=which; }   // lazy-load; reuse if same
    document.getElementById('phScrim').style.display='block';
    document.getElementById('phPanel').style.transform='translateX(0)';
  };
  window.phClose=function(){
    document.getElementById('phScrim').style.display='none';
    document.getElementById('phPanel').style.transform='translateX(100%)';
  };
})();
</script>
