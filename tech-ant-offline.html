<style>
  :root { --bg: #0d0e10; --fg: #d4d6dc; --muted: #7b7f8a; --accent: #74e3c4; --warn: #f5b150; --err: #f56e6e; --line: #1d1f24; --row: #14161b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

  header .sub { color: var(--muted); font-size: 12px; }
  .warning { background: rgba(245,177,80,0.10); border: 1px solid var(--warn); color: var(--warn); padding: 10px 14px; margin: 12px 18px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
  main { padding: 12px 18px 24px; }
  .panel { background: var(--row); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; cursor: pointer; }

  .media-btn:active { transform: scale(0.97); }
  .thumb-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; min-height: 4px; }

  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; }
  .thumb .tup { position: absolute; top: 4px; right: 4px; font-size: 11px; background: rgba(0,0,0,0.7); color: #4caf50; padding: 1px 4px; border-radius: 3px; }
  .thumb .tup.queued { color: #ffb74d; }
  .thumb-empty { font-size: 12px; opacity: 0.5; padding: 4px 0; }
  .save-btn { background: var(--accent); color: #000; border: 0; border-radius: 6px; padding: 12px; font: 15px/1 inherit; font-weight: 600; cursor: pointer; width: 100%; margin-top: 6px; }
  .save-btn:disabled { opacity: 0.5; }
  .save-btn.saved { background: var(--row); color: var(--accent); border: 1px solid var(--accent); }
  .sync-bar { background: var(--row); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sync-bar .pending-count { font-weight: 600; }

<script>
'use strict';

const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const DB_NAME = 'tech_ant_offline_v1';
const STORE_SCHEDULE = 'schedule';
const STORE_TDRS = 'pending_tdrs';
const STORE_MEDIA = 'queued_media';
const DB_VERSION = 2;

const params = new URLSearchParams(location.search);
let TECH_ID = parseInt(params.get('tech_id') || '0', 10);

let db = null;
let scheduleData = null;       // {tech_id, cached_at_ms, jobs:[...]}
let pendingTdrs = [];          // [{id, job_id, fields, created_at_ms, synced_at_ms?}]
let uploadQueue = null;

// ── IndexedDB helpers ──────────────────────────────────────────────
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_SCHEDULE)) {
        d.createObjectStore(STORE_SCHEDULE, { keyPath: 'tech_id' });
      }
      if (!d.objectStoreNames.contains(STORE_TDRS)) {
        d.createObjectStore(STORE_TDRS, { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains(STORE_MEDIA)) {
        const s = d.createObjectStore(STORE_MEDIA, { keyPath: 'id' });
        s.createIndex('by_job', 'job_id', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const r = tx.objectStore(store).get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const r = tx.objectStore(store).getAll();
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function dbPut(store, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const r = tx.objectStore(store).put(obj);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const r = tx.objectStore(store).delete(key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

// ── Online/offline state ──────────────────────────────────────────
function setOnline(state) {
  const pill = document.getElementById('netpill');
  pill.textContent = state ? 'online' : 'offline';
  pill.classList.toggle('online', state);
  pill.classList.toggle('offline', !state);
}
window.addEventListener('online', () => setOnline(true));
window.addEventListener('offline', () => setOnline(false));
setOnline(navigator.onLine);

// ── Toast ──────────────────────────────────────────────────────────
function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms || 2400);
}

// ── Today CT date ──────────────────────────────────────────────────
function todayCtKey() {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' });
  return f.format(new Date());
}

// ── Fetch + cache schedule (when online) ──────────────────────────
async function refreshScheduleOnline() {
  if (!TECH_ID) return null;
  try {
    const r = await fetch(`${XANO_BASE}/get_tech_daily_dashboard?tech_id=${TECH_ID}&date=${todayCtKey()}`, { signal: AbortSignal.timeout(10000) });
    if (!r.ok) return null;
    const data = await r.json();
    const entry = {
      tech_id: TECH_ID,
      cached_at_ms: Date.now(),
      date: todayCtKey(),
      jobs: (data && data.jobs) || [],
    };
    await dbPut(STORE_SCHEDULE, entry);
    return entry;
  } catch (e) { console.warn('refresh schedule failed', e); return null; }
}

// ── Render schedule list + TDR cards ──────────────────────────────
function renderMain() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  if (!scheduleData || !scheduleData.jobs || scheduleData.jobs.length === 0) {
    main.innerHTML = '<div class="empty">No jobs cached for today. Open this page once while online so it can stash your schedule, OR enter TDRs free-form below.</div>';
    return;
  }
  // Cache freshness banner
  const ageMin = Math.round((Date.now() - (scheduleData.cached_at_ms || 0)) / 60000);
  const cacheWarn = document.getElementById('cacheWarning');
  if (ageMin > 60 * 12) {
    cacheWarn.style.display = 'block';
    cacheWarn.textContent = `⚠ Schedule cache is ${Math.round(ageMin / 60)}h old. Open Tech Ant chat while online to refresh.`;
  } else {
    cacheWarn.style.display = 'none';
  }
  // Render each job
  for (const item of scheduleData.jobs) {
    main.appendChild(renderJobCard(item));
  }
}

function renderJobCard(item) {
  const job = item.job || {};
  const cust = item.customer || {};
  const jobId = job.id;
  const customerLine = ((cust.first_name || '') + ' ' + (cust.last_name || '')).trim() || '(no name)';
  const applLine = [job.brand, job.appliance_type].filter(Boolean).join(' ') || 'appliance';
  const addrLine = [job.service_address, job.service_city].filter(Boolean).join(', ');

  // Find existing pending TDR for this job, or create a transient stub
  // and IMMEDIATELY persist it so a power-off mid-typing doesn't lose data.
  let existing = pendingTdrs.find(t => t.job_id === jobId && !t.synced_at_ms);
  if (!existing) {
    const idemKey = 'idem_' + jobId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    existing = {
      id: 'tdr_' + jobId + '_' + Date.now(),
      job_id: jobId,
      client_idempotency_key: idemKey,
      fields: {},
      created_at_ms: Date.now(),
    };
    pendingTdrs.push(existing);
    dbPut(STORE_TDRS, existing).catch(() => {});
  }
  const status = existing.synced_at_ms ? 'synced' : (Object.keys(existing.fields || {}).length > 0 ? 'pending' : '');

  const wrap = document.createElement('div');
  wrap.className = 'panel';
  wrap.dataset.jobId = String(jobId);
  wrap.innerHTML = `
    <div class="panel-head">
      <div>
        <h2>${esc(customerLine)} <span style="opacity:0.6">· #${jobId}</span></h2>
        <div class="meta">${esc(applLine)} ${addrLine ? '· ' + esc(addrLine) : ''}</div>
      </div>
      <div>
        ${status === 'pending' ? '<span class="badge-pending">pending</span>' : ''}
        ${status === 'synced' ? '<span class="badge-synced">synced</span>' : ''}
        <span class="chev">▸</span>
      </div>
    </div>
    <div class="panel-body">
      <div class="job-pending" data-pending-for="${jobId}"></div>
      <div class="field"><label>Model number (read off the plate, type it here)</label><input data-field="model_number_typed" type="text" autocapitalize="characters" value="${esc(existing.fields.model_number_typed || '')}" placeholder="e.g. WTW5000DW2"></div>
      <div class="field"><label>Symptom confirmation (what's the customer reporting)</label><textarea data-field="symptom_confirmation">${esc(existing.fields.symptom_confirmation || '')}</textarea></div>
      <div class="field"><label>Model confirmation (does the plate match the work order? yes/no + notes)</label><input data-field="model_confirmation" type="text" value="${esc(existing.fields.model_confirmation || '')}" placeholder="yes / no — notes"></div>
      <div class="field"><label>Diagnosis</label><textarea data-field="diagnosis">${esc(existing.fields.diagnosis || '')}</textarea></div>
      <div class="field"><label>What failed</label><textarea data-field="failed_component">${esc(existing.fields.failed_component || '')}</textarea></div>
      <div class="field"><label>Why it failed</label><textarea data-field="failure_cause">${esc(existing.fields.failure_cause || '')}</textarea></div>
      <div class="field"><label>Part number used / ordered</label><input data-field="verified_part_number" type="text" value="${esc(existing.fields.verified_part_number || '')}" placeholder="e.g. WPW10310240"></div>
      <div class="field"><label>Labor hours</label><input data-field="labor_time_hours" type="text" inputmode="decimal" value="${esc(existing.fields.labor_time_hours || '')}" placeholder="e.g. 1.5"></div>
      <div class="field"><label>Repair status</label>
        <div class="row-radio" data-radiogroup="repair_completed">
          ${repairRadios(existing.fields.repair_completed)}
        </div>
      </div>
      <div class="field"><label>Findings / notes (what you found, what you did)</label><textarea data-field="technician_notes">${esc(existing.fields.technician_notes || '')}</textarea></div>
      <div class="media-row">
        <button class="media-btn" data-action="photo" data-job="${jobId}">📷 Take photo</button>
        <button class="media-btn" data-action="library" data-job="${jobId}">🖼 Library</button>
        <button class="media-btn" data-action="video" data-job="${jobId}">🎥 Video</button>
      </div>
      <div class="thumb-strip"></div>
      <button class="save-btn" data-action="save" data-job="${jobId}" data-tdr="${existing.id}">Save TDR locally</button>
    </div>
  `;
  // Wire interactions
  wrap.querySelector('.panel-head').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    wrap.classList.toggle('open');
  });
  // Pre-open if there are unsaved drafts
  if (status === 'pending') wrap.classList.add('open');
  wrap.querySelectorAll('[data-field], [data-radiogroup] input').forEach(el => {
    el.addEventListener('input', () => onFieldChange(wrap, existing));
    el.addEventListener('change', () => onFieldChange(wrap, existing));
  });
  wrap.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => handleAction(btn.dataset.action, jobId, existing, wrap, btn));
  });
  renderThumbStrip(wrap, jobId);
  setTimeout(() => updateJobPendingBadge(jobId), 50);
  return wrap;
}

function repairRadios(current) {
  const options = [
    { v: 'completed', label: '✓ Completed' },
    { v: 'parts_ordered', label: '📦 Parts ordered' },
    { v: 'held', label: '⏸ Held' },
    { v: 'no_fix_possible', label: '⛔ No fix' },
  ];
  return options.map(o => `<label><input type="radio" name="repair_${Date.now()}_${Math.random()}" value="${o.v}"${current === o.v ? ' checked' : ''}><span>${o.label}</span></label>`).join('');
}

const SAVE_DEBOUNCE_MS = 300;
const _saveTimers = new Map();
function onFieldChange(wrap, existing) {
  wrap.querySelectorAll('[data-field]').forEach(el => {
    existing.fields[el.dataset.field] = el.value || '';
  });
  const rg = wrap.querySelector('[data-radiogroup="repair_completed"]');
  if (rg) {
    const checked = rg.querySelector('input:checked');
    existing.fields.repair_completed = checked ? checked.value : '';
  }
  existing.updated_at_ms = Date.now();
  // Auto-persist EVERY keystroke (debounced) so a force-quit mid-typing
  // never loses data. The spec is store-and-forward: capture must be
  // durable before any network attempt.
  const key = existing.id;
  if (_saveTimers.has(key)) clearTimeout(_saveTimers.get(key));
  _saveTimers.set(key, setTimeout(() => {
    dbPut(STORE_TDRS, existing).catch(err => console.warn('autosave', err));
    if (!pendingTdrs.find(t => t.id === existing.id)) pendingTdrs.push(existing);
    refreshPendingBadge();
    updateJobPendingBadge(existing.job_id);
  }, SAVE_DEBOUNCE_MS));
}

async function updateJobPendingBadge(jobId) {
  const tdrs = pendingTdrs.filter(t => t.job_id === jobId && !t.synced_at_ms);
  const media = await loadMediaForJob(jobId);
  const tdrCount = tdrs.length;
  const mediaPending = media.filter(m => m.status !== 'uploaded').length;
  const mediaTotal = media.length;
  const lines = [];
  if (tdrCount > 0) lines.push(`${tdrCount} TDR draft saved locally`);
  if (mediaPending > 0) lines.push(`${mediaPending} of ${mediaTotal} photo/video waiting to upload`);
  else if (mediaTotal > 0) lines.push(`${mediaTotal} photo/video uploaded`);
  const txt = lines.length > 0 ? lines.join(' · ') : '';
  document.querySelectorAll('[data-pending-for="' + jobId + '"]').forEach(el => {
    el.textContent = txt;
    el.style.display = txt ? 'block' : 'none';
  });
}

async function handleAction(action, jobId, existing, wrap, btn) {
  if (action === 'photo' || action === 'video' || action === 'library') {
    await pickMedia(action, jobId);
    return;
  }
  if (action === 'save') {
    if (!existing) { toast('save failed: no tdr context', 3500); return; }
    try {
      onFieldChange(wrap, existing);
      existing.created_at_ms = existing.created_at_ms || Date.now();
      existing.updated_at_ms = Date.now();
      await dbPut(STORE_TDRS, existing);
      if (!pendingTdrs.find(t => t.id === existing.id)) pendingTdrs.push(existing);
      btn.classList.add('saved');
      btn.textContent = '✓ Saved locally';
      setTimeout(() => { btn.classList.remove('saved'); btn.textContent = 'Save TDR locally'; }, 2000);
      refreshPendingBadge();
    } catch (err) {
      toast('save failed: ' + (err && err.message ? err.message : 'unknown'), 4000);
    }
  }
}

async function pickMedia(action, jobId) {
  const fi = document.createElement('input');
  fi.type = 'file';
  if (action === 'photo')   { fi.accept = 'image/*'; fi.capture = 'environment'; }
  if (action === 'video')   { fi.accept = 'video/*'; fi.capture = 'environment'; }
  if (action === 'library') { fi.accept = 'image/*,video/*'; fi.multiple = true; }
  fi.style.display = 'none';
  document.body.appendChild(fi);
  fi.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    for (const f of files) {
      const isVideo = (f.type || '').startsWith('video/');
      const mediaId = 'm_' + jobId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const rec = {
        id: mediaId,
        job_id: jobId,
        kind: isVideo ? 'video' : 'photo',
        name: f.name || (isVideo ? 'video' : 'photo'),
        size: f.size || 0,
        blob: f,
        created_at_ms: Date.now(),
        status: 'queued',
        attachment_id: null,
      };
      try { await dbPut(STORE_MEDIA, rec); } catch (err) { toast('local stash failed: ' + (err.message || 'unknown'), 3500); continue; }
      if (uploadQueue) {
        try { await uploadQueue.enqueue(f, { fileType: rec.kind, override_job_id: jobId, offline_media_id: mediaId }); }
        catch (err) { toast('upload queue failed: ' + (err.message || 'unknown'), 3500); }
      }
      await appendThumb(jobId, rec);
    }
    toast(files.length + ' file(s) saved' + (uploadQueue ? ' + queued for upload' : ' (offline)'));
    fi.value = '';
    document.body.removeChild(fi);
  });
  fi.click();
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ── Media thumbnail strip ─────────────────────────────────────────
async function loadMediaForJob(jobId) {
  const all = await dbGetAll(STORE_MEDIA);
  return (all || []).filter(m => m.job_id === jobId).sort((a, b) => a.created_at_ms - b.created_at_ms);
}

function thumbHtml(rec) {
  const url = URL.createObjectURL(rec.blob);
  const badge = rec.status === 'uploaded' ? '<span class="tup">✓</span>' : '<span class="tup queued">⏳</span>';
  if (rec.kind === 'video') {
    return `<div class="thumb" data-id="${rec.id}"><video src="${url}" muted playsinline preload="metadata"></video>${badge}</div>`;
  }
  return `<div class="thumb" data-id="${rec.id}"><img src="${url}" alt="${esc(rec.name)}">${badge}</div>`;
}

async function renderThumbStrip(wrap, jobId) {
  const strip = wrap.querySelector('.thumb-strip');
  if (!strip) return;
  const items = await loadMediaForJob(jobId);
  if (items.length === 0) { strip.innerHTML = '<div class="thumb-empty">No photos/videos yet</div>'; return; }
  strip.innerHTML = items.map(thumbHtml).join('');
}

async function appendThumb(jobId, rec) {
  document.querySelectorAll('.panel').forEach(p => {
    if (parseInt(p.dataset.jobId, 10) === jobId) renderThumbStrip(p, jobId);
  });
  updateJobPendingBadge(jobId);
}

// Listen for the upload queue marking items as verified server-side
window.addEventListener('upload-verified', async (e) => {
  // The queue's enqueue meta carried our offline_media_id; tech-upload-manager
  // forwards it onto the verified event via the item.meta path on some versions.
  // To stay robust, just refresh all currently-rendered strips.
  document.querySelectorAll('.panel').forEach(async (p) => {
    const jobId = parseInt(p.dataset.jobId, 10);
    if (!jobId) return;
    // Mark all queued media for this job as uploaded (best-effort heuristic —
    // photos that actually uploaded are now in S3; UI shows the green check).
    const items = await loadMediaForJob(jobId);
    for (const it of items) {
      if (it.status !== 'uploaded') {
        it.status = 'uploaded';
        try { await dbPut(STORE_MEDIA, it); } catch (_) {}
      }
    }
    renderThumbStrip(p, jobId);
  });
});

// ── Sync pending TDRs to server ────────────────────────────────────
function refreshPendingBadge() {
  const cnt = pendingTdrs.filter(t => !t.synced_at_ms).length;
  document.getElementById('pendingCount').textContent = cnt;
  document.getElementById('syncBar').style.opacity = cnt > 0 ? '1' : '0.5';
}

async function syncAll() {
  if (!navigator.onLine) { toast('You are offline — can\'t sync now', 3000); return; }
  const btn = document.getElementById('syncBtn');
  btn.classList.add('busy');
  btn.textContent = '⏳ Syncing…';
  let synced = 0, failed = 0;
  for (const t of pendingTdrs) {
    if (t.synced_at_ms) continue;
    if (!t.client_idempotency_key) {
      t.client_idempotency_key = 'idem_' + t.job_id + '_' + t.created_at_ms + '_' + Math.random().toString(36).slice(2, 8);
      await dbPut(STORE_TDRS, t);
    }
    try {
      const f = t.fields || {};
      // Pack model_typed + model_confirmation + symptom_confirmation into
      // problem_summary so they ride to the same column the online flow
      // uses. Diagnosis and the other fields land in their own columns.
      const summaryLines = [];
      if (f.model_number_typed) summaryLines.push('Model typed by tech: ' + f.model_number_typed);
      if (f.model_confirmation) summaryLines.push('Model confirmed: ' + f.model_confirmation);
      if (f.symptom_confirmation) summaryLines.push('Symptom confirmed: ' + f.symptom_confirmation);
      const payload = {
        job_id: t.job_id,
        technician_id: TECH_ID,
        client_idempotency_key: t.client_idempotency_key,
        diagnosis: f.diagnosis || '',
        failed_component: f.failed_component || '',
        failure_cause: f.failure_cause || '',
        verified_part_number: f.verified_part_number || '',
        labor_time_hours: f.labor_time_hours ? parseFloat(f.labor_time_hours) : 0,
        problem_summary: summaryLines.join('\n'),
        technician_notes: f.technician_notes || '',
        repair_completed: f.repair_completed || '',
        status: 'offline_sync',
      };
      const r = await fetch(`${XANO_BASE}/create_tdr`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: AbortSignal.timeout(20000),
      });
      if (r.ok) {
        const data = await r.json().catch(() => null);
        t.synced_at_ms = Date.now();
        t.server_tdr_id = (data && data.tdr && data.tdr.id) || null;
        t.server_reused = !!(data && data.reused);
        await dbPut(STORE_TDRS, t);
        synced += 1;
      } else {
        const body = await r.text().catch(() => '');
        t.last_sync_error = 'HTTP ' + r.status + ': ' + body.slice(0, 200);
        await dbPut(STORE_TDRS, t);
        failed += 1;
      }
    } catch (e) {
      t.last_sync_error = String(e && e.message || e);
      await dbPut(STORE_TDRS, t);
      failed += 1;
    }
  }
  btn.classList.remove('busy');
  if (failed === 0 && synced > 0) {
    btn.classList.add('success');
    btn.textContent = `✓ Synced ${synced}`;
    setTimeout(() => { btn.classList.remove('success'); btn.textContent = '↺ Sync now'; }, 3000);
  } else if (failed > 0) {
    btn.textContent = `↺ Sync now (${failed} failed)`;
  } else {
    btn.textContent = 'Nothing to sync';
    setTimeout(() => { btn.textContent = '↺ Sync now'; }, 2000);
  }
  refreshPendingBadge();
  renderMain();
}

document.getElementById('syncBtn').addEventListener('click', syncAll);

// ── Boot ────────────────────────────────────────────────────────────
async function boot() {
  db = await openDB();

  // Init upload queue (uses tech_id at construction, override per file)
  if (window.UploadQueue && TECH_ID) {
    try {
      uploadQueue = new window.UploadQueue({
        jobId: 0, // overridden per file via enqueue context
        techId: TECH_ID,
        xanoBase: XANO_BASE,
        netlifyBase: '',
        onUpdate: async () => { /* no-op visual for now */ },
      });
      await uploadQueue.init();
    } catch (e) {
      console.warn('uploadQueue init', e);
    }
  }

  // Tech gate
  if (!TECH_ID) {
    document.getElementById('gate').style.display = 'block';
    document.getElementById('syncBar').style.display = 'none';
    document.getElementById('gateBtn').addEventListener('click', () => {
      const v = parseInt(document.getElementById('techIdInput').value || '0', 10);
      if (v > 0) { location.search = '?tech_id=' + v; }
    });
    return;
  }

  // Load cached schedule
  scheduleData = await dbGet(STORE_SCHEDULE, TECH_ID);

  // If online, try to refresh
  if (navigator.onLine) {
    const fresh = await refreshScheduleOnline();
    if (fresh) scheduleData = fresh;
  }

  // Load pending TDRs
  pendingTdrs = (await dbGetAll(STORE_TDRS)) || [];

  renderMain();
  refreshPendingBadge();
}

boot().catch(e => {
  document.getElementById('main').innerHTML = '<div class="empty">Boot failed: ' + (e.message || e) + '</div>';
});
</script>
