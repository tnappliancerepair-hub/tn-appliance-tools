<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ant Proposals - TN Appliance Exchange</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
  }

  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: linear-gradient(135deg, #0e1118, #131a2a);
    border-bottom: 1px solid #2a3040;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .icon { font-size: 24px; flex-shrink: 0; }
  .header .text { flex: 1; min-width: 0; }
  .header .title { font-size: 14px; font-weight: 700; }
  .header .sub {
    font-size: 11px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header .refresh-btn {
    background: transparent;
    border: 1px solid #2a3040;
    color: #e8edf5;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
    font-family: inherit;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .header .refresh-btn:active { transform: scale(0.9); }
  .header .refresh-btn:hover:not(:disabled) { background: #2a3040; border-color: #4a9eff; }
  .header .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .header .refresh-btn.spinning { animation: spin 0.7s linear infinite; }

  .content {
    margin-top: 60px;
    overflow-y: auto;
    padding: 12px;
    min-height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }
  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Proposal card */
  .proposal {
    background: #131720;
    border: 1px solid #2a3040;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: opacity 0.25s, transform 0.25s;
  }
  .proposal.dismissing {
    opacity: 0;
    transform: translateX(20px);
    pointer-events: none;
  }
  .proposal-desc {
    font-size: 17px;
    font-weight: 700;
    color: #e8edf5;
    line-height: 1.35;
  }
  .proposal-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .badge {
    background: rgba(74,158,255,0.12);
    border: 1px solid rgba(74,158,255,0.4);
    color: #4a9eff;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    text-transform: lowercase;
    letter-spacing: 0.3px;
  }
  .pattern-count {
    font-size: 12px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
  }
  .pattern-count strong { color: #e8edf5; }

  .kv-grid {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 8px 14px;
    background: #0e1118;
    border: 1px solid #2a3040;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .kv-key {
    font-size: 11px;
    color: #8a93aa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    padding-top: 2px;
  }
  .kv-val {
    font-size: 13px;
    color: #e8edf5;
    line-height: 1.5;
    word-break: break-word;
  }
  .kv-val.empty { color: #4a5266; font-style: italic; }

  .actions {
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    -webkit-appearance: none;
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.build {
    background: #00d68f;
    color: #06231a;
  }
  .btn.skip {
    background: #2a3040;
    color: #b5bcd0;
  }

  .build-state {
    background: rgba(74,158,255,0.08);
    border: 1px solid rgba(74,158,255,0.35);
    color: #4a9eff;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .build-state .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(74,158,255,0.3);
    border-top-color: #4a9eff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  .build-state.success {
    background: rgba(0,214,143,0.1);
    border-color: rgba(0,214,143,0.4);
    color: #00d68f;
  }
  .build-state.warn {
    background: rgba(255,165,0,0.1);
    border-color: rgba(255,165,0,0.4);
    color: #ffa500;
  }
  .build-state.error {
    background: rgba(255,71,87,0.1);
    border-color: rgba(255,71,87,0.3);
    color: #ff4757;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #8a93aa;
  }
  .empty .emoji { font-size: 48px; margin-bottom: 16px; }
  .empty .msg { font-size: 15px; line-height: 1.5; }
  .empty .sub { font-size: 12px; color: #4a5266; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; }

  .err-banner {
    background: rgba(255,71,87,0.1);
    border: 1px solid rgba(255,71,87,0.3);
    color: #ff4757;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .loading {
    text-align: center;
    padding: 40px 20px;
    color: #8a93aa;
    font-size: 14px;
  }

  /* Auth */
  .auth-overlay {
    position: fixed; inset: 0; background: #0e1118;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
  }
  .auth-overlay.hidden { display: none; }
  .auth-card {
    background: #131720; border: 1px solid #2a3040;
    border-radius: 16px; padding: 28px 22px; width: 100%; max-width: 360px;
    text-align: center;
  }
  .auth-card h2 { font-size: 18px; margin-bottom: 6px; }
  .auth-card .sub { color: #8a93aa; font-size: 13px; margin-bottom: 18px; }
  .auth-card input {
    width: 100%; background: #0e1118; border: 1px solid #2a3040;
    border-radius: 10px; color: #e8edf5; padding: 14px;
    font-size: 16px; text-align: center;
    font-family: inherit; margin-bottom: 12px;
    -webkit-appearance: none;
  }
  .auth-card input:focus { border-color: #4a9eff; outline: none; }
  .auth-card button {
    width: 100%; background: #4a9eff; color: white; border: 0;
    border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700;
    cursor: pointer;
  }
  .auth-card button:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-card .err { color: #ff4757; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-card">
    <h2>🐜 Ant Proposals</h2>
    <div class="sub">enter office password</div>
    <input id="auth-input" type="password" autocomplete="current-password">
    <button id="auth-submit" onclick="submitAuth()">Unlock</button>
    <div class="err" id="auth-err"></div>
  </div>
</div>

<div class="header">
  <div class="icon">🐜</div>
  <div class="text">
    <div class="title">Ant Proposals</div>
    <div class="sub" id="header-sub">Loading...</div>
  </div>
  <button class="refresh-btn" id="refresh-btn" onclick="loadAll()" title="Refresh">↻</button>
</div>

<div class="content" id="content">
  <div class="loading">loading...</div>
</div>

<script>
const OFFICE_PASSWORD = 'office2026';
const OFFICE_AUTH_KEY = 'tn_office_auth_v1';

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function fetchProxy(endpoint, payload) {
  const res = await fetch('/.netlify/functions/xano-proxy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ endpoint, payload, method: 'POST' })
  });
  if (!res.ok) throw new Error(`(${res.status})`);
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'no success flag');
  return data;
}

function kvRow(label, value) {
  const v = (value ?? '').toString().trim();
  if (v === '') {
    return `<div class="kv-key">${escapeHtml(label)}</div><div class="kv-val empty">—</div>`;
  }
  return `<div class="kv-key">${escapeHtml(label)}</div><div class="kv-val">${escapeHtml(v)}</div>`;
}

function renderCard(p) {
  return `
    <div class="proposal" data-id="${p.id}">
      <div class="proposal-desc">${escapeHtml(p.description || '(no description)')}</div>
      <div class="proposal-meta">
        <span class="badge">${escapeHtml(p.source_builder || 'unknown')}</span>
        <span class="pattern-count">detected <strong>${escapeHtml(String(p.pattern_count ?? 0))}</strong> times</span>
      </div>
      <div class="kv-grid">
        ${kvRow('Trigger', p.trigger)}
        ${kvRow('Condition', p.condition_detected)}
        ${kvRow('Proposed Action', p.proposed_action)}
        ${kvRow('Time Saved', p.time_saved_estimate)}
      </div>
      <div class="actions">
        <button class="btn build" onclick="decide(${p.id}, 'approved', this)">✅ Build It</button>
        <button class="btn skip"  onclick="decide(${p.id}, 'skipped', this)">⏭ Skip</button>
      </div>
    </div>
  `;
}

function renderEmpty() {
  return `
    <div class="empty">
      <div class="emoji">🐜</div>
      <div class="msg">No proposals yet — Ant is watching.</div>
      <div class="sub">Check back tomorrow morning.</div>
    </div>
  `;
}

function renderError(msg) {
  return `<div class="err-banner">${escapeHtml(msg)}</div>`;
}

let isLoading = false;

async function loadAll() {
  if (isLoading) return;
  isLoading = true;
  const refreshBtn = document.getElementById('refresh-btn');
  const headerSub = document.getElementById('header-sub');
  const content = document.getElementById('content');
  refreshBtn.disabled = true;
  refreshBtn.classList.add('spinning');
  headerSub.textContent = 'loading...';
  content.innerHTML = '<div class="loading">loading...</div>';

  try {
    const data = await fetchProxy('get_agent_proposals', { status: 'pending', per_page: 200 });
    const items = data.items || [];
    headerSub.textContent = `${items.length} pending`;

    if (items.length === 0) {
      content.innerHTML = renderEmpty();
    } else {
      content.innerHTML = items.map(renderCard).join('');
    }
  } catch (err) {
    headerSub.textContent = 'error';
    content.innerHTML = renderError('Failed to load proposals: ' + (err.message || err));
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.classList.remove('spinning');
    isLoading = false;
  }
}

function dismissCard(card) {
  card.classList.add('dismissing');
  setTimeout(() => {
    card.remove();
    const remaining = document.querySelectorAll('.proposal').length;
    document.getElementById('header-sub').textContent = `${remaining} pending`;
    if (remaining === 0) {
      document.getElementById('content').innerHTML = renderEmpty();
    }
  }, 250);
}

function setBuildState(card, cls, html) {
  const actions = card.querySelector('.actions');
  if (!actions) return;
  actions.innerHTML = `<div class="build-state ${cls}">${html}</div>`;
}

async function decide(proposalId, newStatus, btnEl) {
  const card = btnEl.closest('.proposal');
  const buttons = card.querySelectorAll('.btn');
  buttons.forEach(b => b.disabled = true);

  // Skip path: just mark + animate out (unchanged behavior).
  if (newStatus !== 'approved') {
    try {
      await fetchProxy('update_agent_proposal_status', {
        proposal_id: proposalId,
        new_status: newStatus
      });
      dismissCard(card);
    } catch (err) {
      buttons.forEach(b => b.disabled = false);
      alert('Failed to update: ' + (err.message || err));
    }
    return;
  }

  // Approve path: mark approved, then call agent_builder to deploy.
  try {
    await fetchProxy('update_agent_proposal_status', {
      proposal_id: proposalId,
      new_status: 'approved'
    });
  } catch (err) {
    buttons.forEach(b => b.disabled = false);
    alert('Failed to mark approved: ' + (err.message || err));
    return;
  }

  setBuildState(card, '', '<span class="spinner"></span><span>Building... Claude is writing the endpoint (may take up to 2 minutes)</span>');

  let buildResp;
  try {
    buildResp = await fetchProxy('agent_builder', { proposal_id: proposalId });
  } catch (err) {
    setBuildState(card, 'error', `❌ Build failed: ${escapeHtml(err.message || String(err))}`);
    return;
  }

  const deployStatus = buildResp.deploy_status || 'unknown';
  const endpointName = buildResp.endpoint_name || '(unknown)';
  const queueId = buildResp.queue_id || '?';

  if (deployStatus === 'deployed') {
    setBuildState(card, 'success', `✅ Deployed! <strong>${escapeHtml(endpointName)}</strong> added to agent_queue (id=${queueId}) and live.`);
  } else if (deployStatus === 'pending_paste') {
    setBuildState(card, 'warn', `⚠️ Paste needed. Endpoint shell <strong>${escapeHtml(endpointName)}</strong> created but XS body did not persist via API. Paste manually in Xano UI, then flip queue id=${queueId} to enabled=true.`);
  } else {
    setBuildState(card, 'warn', `Built with status: <strong>${escapeHtml(deployStatus)}</strong> (endpoint ${escapeHtml(endpointName)}, queue ${queueId})`);
  }

  setTimeout(() => dismissCard(card), 4000);
}

// ── Auth ───────────────────────────────────────────────────────────
function submitAuth() {
  const errEl = document.getElementById('auth-err');
  const btn = document.getElementById('auth-submit');
  const inputEl = document.getElementById('auth-input');
  const pw = (inputEl.value || '').trim();
  errEl.textContent = '';
  if (pw === '') { errEl.textContent = 'Enter password'; return; }
  btn.disabled = true;
  if (pw === OFFICE_PASSWORD) {
    localStorage.setItem(OFFICE_AUTH_KEY, '1');
    document.getElementById('auth-overlay').classList.add('hidden');
    loadAll();
  } else {
    errEl.textContent = 'Wrong password.';
    inputEl.value = '';
    inputEl.focus();
    btn.disabled = false;
  }
}

document.getElementById('auth-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') submitAuth();
});

if (localStorage.getItem(OFFICE_AUTH_KEY) === '1') {
  document.getElementById('auth-overlay').classList.add('hidden');
  loadAll();
} else {
  document.getElementById('auth-input').focus();
}
</script>
</body>
</html>
