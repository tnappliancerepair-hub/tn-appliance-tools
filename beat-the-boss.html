<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🥊 Beat the Boss</title>
<style>
  :root{
    --bg:#0b0d14; --arena:#11141d; --card:#171b26; --card2:#1e2230; --line:#2a3040;
    --ink:#eef1f7; --mut:#8b95a7; --mut2:#c3cad7;
    --gold:#f5c542; --tech:#3ea6ff; --evil:#ff4d5e; --win:#28d17c; --confirm:#28d17c;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:radial-gradient(1200px 700px at 50% -10%, #1a2030 0%, var(--bg) 60%);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45;min-height:100vh}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 60px}
  .kick{text-align:center;color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.32em;text-transform:uppercase;margin:6px 0 2px}
  h1{margin:0 0 4px;text-align:center;font-size:clamp(34px,10vw,52px);font-weight:900;letter-spacing:-.02em;line-height:.95;
     background:linear-gradient(180deg,#fff 0%,#ffe89a 55%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .tag{text-align:center;color:var(--mut2);font-size:14px;margin:0 0 16px}
  .tag b{color:var(--ink)}

  .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0 18px}
  .fighter{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
  .fighter.me{border-color:var(--tech);box-shadow:0 0 0 1px var(--tech) inset,0 8px 24px rgba(62,166,255,.12)}
  .fighter.boss{border-color:var(--gold)}
  .fighter .emoji{font-size:34px;line-height:1}
  .fighter .who{font-weight:900;font-size:16px;margin-top:5px;letter-spacing:.02em}
  .fighter .role{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
  .vsbadge{font-weight:900;font-size:22px;color:var(--mut);font-style:italic}

  .ctx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:16px}
  .ctx .cn{font-weight:800;font-size:18px}
  .ctx .cm{color:var(--mut2);font-size:15px;margin-top:3px}
  .ctx .pr{color:var(--ink);font-size:14px;margin-top:8px;background:var(--card2);border-radius:10px;padding:9px 11px;line-height:1.4}
  .ctx .md{font-family:var(--mono);font-size:13px;color:var(--gold);margin-top:8px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .panel h2{margin:0 0 3px;font-size:19px;font-weight:900}
  .panel .sub{color:var(--mut);font-size:13.5px;margin-bottom:14px}
  label.fl{display:block;font-size:12px;font-weight:800;color:var(--mut2);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
  .fin{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:13px;padding:15px;font-size:18px;color:var(--ink);font-family:inherit;margin-bottom:14px}
  .fin:focus{outline:none;border-color:var(--tech)}
  #g_part{font-family:var(--mono);letter-spacing:.03em;font-weight:700}
  .hintbtn{display:inline-block;background:transparent;border:1px dashed var(--line);color:var(--mut2);border-radius:20px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:14px}
  .hintbox{background:rgba(245,197,66,.08);border:1px solid rgba(245,197,66,.3);border-radius:12px;padding:11px 13px;font-size:13.5px;color:var(--mut2);margin-bottom:14px;display:none}
  .hintbox b{color:var(--gold)}
  .lockbtn{width:100%;background:linear-gradient(180deg,#ffd85e,var(--gold));color:#231a02;border:0;border-radius:15px;padding:18px;font-size:19px;font-weight:900;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 26px rgba(245,197,66,.25)}
  .lockbtn:active{transform:translateY(1px)}
  .lockbtn:disabled{opacity:.6;cursor:default}
  .finish{display:block;text-align:center;text-decoration:none;color:var(--tech);font-weight:800;font-size:15px;margin-top:16px}
  .err{color:var(--evil);font-weight:700;font-size:13.5px;text-align:center;min-height:18px;margin-top:10px}

  /* reveal states */
  .reveal{text-align:center;padding:8px 4px}
  .reveal .big{font-size:clamp(30px,9vw,46px);font-weight:900;line-height:1;margin:6px 0 4px}
  .reveal .big.win{color:var(--win)} .reveal .big.evil{color:var(--evil)} .reveal .big.confirm{color:var(--confirm)} .reveal .big.wait{color:var(--gold)}
  .reveal p{color:var(--mut2);font-size:15px;margin:6px 0 0}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .pk{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px}
  .pk .h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:800}
  .pk .c{font-weight:800;margin-top:5px;font-size:15px}
  .pk .p{font-family:var(--mono);font-size:13px;color:var(--gold);margin-top:3px}
  .pk.right{border-color:var(--win)} .pk.wrong{opacity:.65}
  .spinner{width:26px;height:26px;border:3px solid #2a3040;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:14px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  .score{display:flex;justify-content:center;gap:18px;margin:20px 0 0;color:var(--mut)}
  .score .s{text-align:center}
  .score .s b{display:block;font-size:22px;font-weight:900;color:var(--ink)}
  .score .s.boss b{color:var(--gold)} .score .s.tech b{color:var(--tech)}
  .score .s span{font-size:11px;text-transform:uppercase;letter-spacing:.1em}

  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
  .loading{padding:60px 0;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap" id="root">
  <div class="loading"><div class="spinner"></div>Loading the matchup…</div>
</div>

<script>
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const P=new URLSearchParams(location.search);
const JOB=parseInt(P.get('job_id')||P.get('job')||'0',10);
const WHO=(P.get('who')==='teddy')?'teddy':'tech';
const TECH_ID=parseInt(P.get('tech_id')||'0',10);
const NAME=P.get('name')||'';
const IAM = WHO==='teddy' ? {label:'THE BOSS',emoji:'👑',role:'Teddy',cls:'boss'} : {label:'YOU',emoji:'🥊',role:(NAME||'Challenger'),cls:'me'};
const FOE = WHO==='teddy' ? {label:'THE TECH',emoji:'🔧',role:'Challenger'} : {label:'THE BOSS',emoji:'👑',role:'Teddy'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let CTX={}, STATE={}, pollT=null;

async function boot(){
  if(!JOB){ document.getElementById('root').innerHTML='<div class="loading">Missing job link. Open the text link again.</div>'; return; }
  let ctx={}, st={};
  try{ ctx=await fetch(XANO_TRUTH()).then(r=>r.json()); }catch(_){}
  try{ st=await fetch('/.netlify/functions/game-guess?job_id='+JOB).then(r=>r.json()); }catch(_){}
  CTX=(ctx&&ctx.facts)||{}; STATE=st||{};
  render();
}
function XANO_TRUTH(){ return 'https://tnapplianceexchange.net/.netlify/functions/job-truth?job_id='+JOB+'&lens=office'; }

function ctxHtml(){
  const c=CTX;
  const appl=[c.brand,c.appliance].filter(x=>x&&x!=='appliance').join(' ')||c.appliance||'appliance';
  return '<div class="ctx"><div class="cn">'+esc(c.customer_name||'Customer')+'</div>'
    +'<div class="cm">'+esc(appl)+(c.model?(' · '+esc(c.model)):'')+'</div>'
    +(c.problem?('<div class="pr">🗣 “'+esc(String(c.problem).slice(0,180))+'”</div>'):'')
    +(c.model?('<div class="md">model '+esc(c.model)+'</div>'):'')
    +'</div>';
}
function vsHtml(){
  return '<div class="vs">'
    +'<div class="fighter '+IAM.cls+'"><div class="emoji">'+IAM.emoji+'</div><div class="who">'+esc(IAM.label)+'</div><div class="role">'+esc(IAM.role)+'</div></div>'
    +'<div class="vsbadge">VS</div>'
    +'<div class="fighter '+(WHO==='teddy'?'me':'boss')+'"><div class="emoji">'+FOE.emoji+'</div><div class="who">'+esc(FOE.label)+'</div><div class="role">'+esc(FOE.role)+'</div></div>'
    +'</div>';
}
function head(){
  return '<div class="kick">Tech vs. the Boss</div><h1>BEAT THE BOSS</h1>'
    +'<div class="tag">You beat Teddy to the punch — but he\'s <b>pretty damn good.</b> Lock in your call. If the boss picks the same, you\'re <b>confirmed</b>. 🎯</div>';
}

function render(){
  const root=document.getElementById('root');
  const mine = STATE[WHO];
  // 1) already graded -> final scoreboard payoff
  if(STATE.result){ root.innerHTML=head()+vsHtml()+ctxHtml()+finalHtml(STATE.result); loadScore(); if(payoffWin(STATE.result)) burst(); return; }
  // 2) I haven't locked yet -> the form
  if(!mine){ root.innerHTML=head()+vsHtml()+ctxHtml()+formHtml(); wireForm(); loadScore(); return; }
  // 3) I locked -> reveal (confirmed / locked-different / waiting)
  root.innerHTML=head()+vsHtml()+ctxHtml()+lockedHtml(); loadScore();
  if(STATE.confirmed) burst();
  if(!STATE[WHO==='tech'?'teddy':'tech']){ startPoll(); }
}

function formHtml(){
  const hint = WHO==='tech' ? 'The boss is locking his pick too. Trust your gut.' : 'Lock your read — the tech already fired.';
  return '<div class="panel"><h2>🔒 Lock in your answer</h2><div class="sub">'+hint+' Once you lock, it can\'t change.</div>'
    +'<label class="fl">What\'s broken (failed part)</label>'
    +'<input class="fin" id="g_comp" autocomplete="off" placeholder="e.g. ice maker assembly, drain pump, control board">'
    +'<label class="fl">Part # (if you\'ve got it)</label>'
    +'<input class="fin" id="g_part" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="optional — e.g. WPW10300024">'
    +'<button class="hintbtn" id="antHint" type="button">🧠 Peek at Ant Brain\'s guess</button>'
    +'<div class="hintbox" id="antBox"></div>'
    +'<button class="lockbtn" id="lockBtn">🔒 LOCK IT IN</button>'
    +'<div class="err" id="gErr"></div>'
    +'<a class="finish" href="teddy-tdr-tool.html?job_id='+JOB+(TECH_ID?('&tech_id='+TECH_ID):'')+'">Skip the game → open the full report 🧰</a></div>';
}
function wireForm(){
  document.getElementById('lockBtn').onclick=lockIn;
  document.getElementById('antHint').onclick=peekAnt;
  const p=document.getElementById('g_part'); p.addEventListener('input',()=>{p.value=p.value.toUpperCase();});
}
async function peekAnt(){
  const box=document.getElementById('antBox'); const btn=document.getElementById('antHint');
  btn.style.display='none'; box.style.display='block'; box.innerHTML='<span class="pulse">🧠 Ant is thinking…</span>';
  try{
    const r=await fetch('/.netlify/functions/ant-brain-predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:JOB})}).then(x=>x.json());
    const top=(r&&(r.predictions||r.top||r.parts)||[])[0];
    if(top){ box.innerHTML='🧠 <b>Ant\'s guess:</b> '+esc(top.failed_component||top.component||top.part_name||'—')+(top.part_number?(' · <span style="font-family:var(--mono)">'+esc(top.part_number)+'</span>'):'')+(top.confidence?(' · '+esc(String(top.confidence))+'% sure'):'')+'<br><span style="color:var(--mut)">Beat it or borrow it — your call.</span>'; }
    else box.innerHTML='🧠 Ant\'s got thin data on this one — you\'re on your own. 😏';
  }catch(_){ box.innerHTML='🧠 Ant\'s guess didn\'t load — trust yourself.'; }
}
async function lockIn(){
  const comp=(document.getElementById('g_comp').value||'').trim();
  const part=(document.getElementById('g_part').value||'').trim();
  const err=document.getElementById('gErr'), btn=document.getElementById('lockBtn');
  if(!comp&&!part){ err.textContent='Type what\'s broken (or a part #) first.'; return; }
  err.textContent=''; btn.disabled=true; btn.textContent='Locking…';
  try{
    const d=await fetch('/.netlify/functions/game-guess',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({job_id:JOB,who:WHO,tech_id:TECH_ID,name:NAME,component:comp,part:part})}).then(r=>r.json());
    if(!d||!d.ok){ err.textContent=(d&&d.error)||'Could not lock — try again.'; btn.disabled=false; btn.textContent='🔒 LOCK IT IN'; return; }
    STATE[WHO]=d.mine; STATE.match=d.match; STATE.confirmed=d.confirmed;
    STATE[WHO==='tech'?'teddy':'tech']=d.other||STATE[WHO==='tech'?'teddy':'tech'];
    render();
  }catch(e){ err.textContent='Connection hiccup — try again.'; btn.disabled=false; btn.textContent='🔒 LOCK IT IN'; }
}

function pickCard(title,g,right){
  if(!g) return '<div class="pk"><div class="h">'+title+'</div><div class="c" style="color:var(--mut)">— no lock —</div></div>';
  return '<div class="pk'+(right===true?' right':(right===false?' wrong':''))+'"><div class="h">'+title+'</div><div class="c">'+esc(g.component||'—')+'</div>'+(g.part?('<div class="p">'+esc(g.part)+'</div>'):'')+'</div>';
}
function lockedHtml(){
  const other = STATE[WHO==='tech'?'teddy':'tech'];
  const mine = STATE[WHO];
  const foeName = WHO==='tech' ? 'the boss' : 'the tech';
  let inner;
  if(STATE.confirmed){
    inner='<div class="big confirm">✅ CONFIRMED!</div><p>'+(WHO==='tech'?'The boss picked the <b>same</b> as you — that\'s a lock. 🏆':'You matched the tech — their call is <b>confirmed</b>.')+'</p>';
  } else if(other){
    inner='<div class="big wait">🔒 LOCKED IN</div><p>Different calls — answers are sealed. Reality settles this one. 🥁</p>';
  } else {
    inner='<div class="big wait">🔒 LOCKED IN</div><p class="pulse">Waiting on '+foeName+' to lock theirs…</p><div class="spinner"></div>';
  }
  return '<div class="panel"><div class="reveal">'+inner
    +'<div class="picks">'+pickCard(WHO==='tech'?'YOU':'BOSS',mine,STATE.confirmed?true:null)+pickCard(WHO==='tech'?'BOSS':'TECH',other,STATE.confirmed?true:null)+'</div></div>'
    +'<a class="finish" href="teddy-tdr-tool.html?job_id='+JOB+(TECH_ID?('&tech_id='+TECH_ID):'')+'">🧰 Now go finish the real report →</a></div>';
}
function payoffWin(r){ if(WHO==='tech') return r.winner==='tech'||r.winner==='both'; return r.winner==='teddy'||r.winner==='both'; }
function finalHtml(r){
  const real=[r.real_component,r.real_part].filter(Boolean).join(' · ')||'the fix';
  let big,cls,msg;
  const iWon = payoffWin(r);
  if(r.winner==='both'){ big='🎉 BOTH NAILED IT'; cls='win'; msg='You and the boss both called it. The machine can\'t tell you apart.'; }
  else if(r.winner==='tech'){ big=WHO==='tech'?'🏆 YOU BEAT THE BOSS!':'😳 The tech got you'; cls=WHO==='tech'?'win':'evil'; msg=WHO==='tech'?'You called it, Teddy missed it. Crown\'s yours today. 👑':'They nailed it, you didn\'t. They\'re coming for the crown.'; }
  else if(r.winner==='teddy'){ big=WHO==='tech'?'😈 THE BOSS WINS AGAIN':'👑 BOSS WINS AGAIN!'; cls='evil'; msg=WHO==='tech'?'Teddy had it, you didn\'t. *evil laugh* — get him next time.':'You had it, the tech didn\'t. mwahahaha.'; }
  else { big='🤷 Stumped'; cls='wait'; msg='Reality got you both. Rematch on the next one.'; }
  const mine = WHO==='tech'?{component:r.tech_component,part:r.tech_part}:{component:r.teddy_component,part:r.teddy_part};
  const foe = WHO==='tech'?{component:r.teddy_component,part:r.teddy_part}:{component:r.tech_component,part:r.tech_part};
  const mineR = WHO==='tech'?r.tech_correct:r.teddy_correct;
  const foeR = WHO==='tech'?r.teddy_correct:r.tech_correct;
  return '<div class="panel"><div class="reveal"><div class="big '+cls+'">'+big+'</div><p>'+msg+'</p>'
    +'<div class="pk right" style="margin:14px 0;text-align:center"><div class="h">✅ It was actually</div><div class="c">'+esc(real)+'</div></div>'
    +'<div class="picks">'+pickCard(WHO==='tech'?'YOU':'BOSS',mine,mineR)+pickCard(WHO==='tech'?'BOSS':'TECH',foe,foeR)+'</div></div></div>';
}

async function loadScore(){
  try{
    const s=await fetch('/.netlify/functions/game-grade?scoreboard=1').then(r=>r.json());
    if(!s||!s.ok) return;
    const el=document.createElement('div'); el.className='score';
    el.innerHTML='<div class="s tech"><b>'+((s.tech_wins||0)+(s.ties||0))+'</b><span>tech wins</span></div>'
      +'<div class="s boss"><b>'+(s.boss_wins||0)+'</b><span>boss wins</span></div>';
    document.getElementById('root').appendChild(el);
  }catch(_){}
}
function startPoll(){
  if(pollT) return;
  pollT=setInterval(async()=>{
    try{ const st=await fetch('/.netlify/functions/game-guess?job_id='+JOB).then(r=>r.json());
      if(st&&st.ok){ const hadFoe=STATE[WHO==='tech'?'teddy':'tech']; STATE=Object.assign(STATE,st);
        if(st.result || st.confirmed || (!hadFoe && st[WHO==='tech'?'teddy':'tech'])){ clearInterval(pollT); pollT=null; render(); } }
    }catch(_){}
  }, 15000);
}

// tiny confetti burst
function burst(){
  const cv=document.getElementById('fx'); cv.style.display='block';
  const ctx=cv.getContext('2d'); let W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cols=['#f5c542','#3ea6ff','#28d17c','#ff4d5e','#ffffff'];
  const N=140, ps=[];
  for(let i=0;i<N;i++) ps.push({x:W/2+(Math.random()-.5)*120,y:H*0.32,vx:(Math.random()-.5)*9,vy:Math.random()*-11-4,g:.28+Math.random()*.12,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6.28,vr:(Math.random()-.5)*.4});
  let t=0;
  (function loop(){ t++; ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();});
    if(t<150) requestAnimationFrame(loop); else { cv.style.display='none'; }
  })();
}
boot();
</script>
</body>
</html>
