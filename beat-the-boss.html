<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🥊 Beat the Boss</title>
<style>
  :root{
    --bg:#0b0d14; --arena:#11141d; --card:#171b26; --card2:#1e2230; --line:#2a3040;
    --ink:#eef1f7; --mut:#8b95a7; --mut2:#c3cad7;
    --gold:#f5c542; --tech:#3ea6ff; --evil:#ff4d5e; --win:#28d17c; --confirm:#28d17c;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:radial-gradient(1200px 700px at 50% -10%, #1a2030 0%, var(--bg) 60%);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45;min-height:100vh;overflow-x:hidden}
  body.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 70px}
  .kick{text-align:center;color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.32em;text-transform:uppercase;margin:6px 0 2px}
  h1{margin:0 0 4px;text-align:center;font-size:clamp(34px,10vw,54px);font-weight:900;letter-spacing:-.02em;line-height:.95;
     background:linear-gradient(180deg,#fff 0%,#ffe89a 55%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 2px 0 rgba(0,0,0,.25);animation:titlein .6s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes titlein{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .tag{text-align:center;color:var(--mut2);font-size:14px;margin:0 0 12px}
  .tag b{color:var(--ink)}
  .ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;margin:0 0 16px;color:var(--gold);font-weight:800;font-size:12.5px;letter-spacing:.08em}
  .ticker span{display:inline-block;padding-left:100%;animation:tick 16s linear infinite}
  @keyframes tick{to{transform:translateX(-100%)}}

  .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0 18px}
  .fighter{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;position:relative}
  .fighter.me{border-color:var(--tech);box-shadow:0 0 0 1px var(--tech) inset,0 8px 24px rgba(62,166,255,.12)}
  .fighter.boss{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 8px 24px rgba(245,197,66,.12)}
  .fighter .emoji{font-size:36px;line-height:1;animation:bob 2.6s ease-in-out infinite}
  .fighter.boss .emoji{animation-delay:.5s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .fighter .who{font-weight:900;font-size:16px;margin-top:5px;letter-spacing:.02em}
  .fighter .role{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
  .fighter .strk{font-size:11px;font-weight:800;margin-top:4px;min-height:14px}
  .fighter.me .strk{color:var(--tech)} .fighter.boss .strk{color:var(--gold)}
  .vsbadge{font-weight:900;font-size:24px;color:var(--mut);font-style:italic}

  .ctx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:16px}
  .ctx .cn{font-weight:800;font-size:18px}
  .ctx .cm{color:var(--mut2);font-size:15px;margin-top:3px}
  .ctx .pr{color:var(--ink);font-size:14px;margin-top:8px;background:var(--card2);border-radius:10px;padding:9px 11px;line-height:1.4}
  .ctx .md{font-family:var(--mono);font-size:13px;color:var(--gold);margin-top:8px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .panel h2{margin:0 0 3px;font-size:19px;font-weight:900}
  .panel .sub{color:var(--mut);font-size:13.5px;margin-bottom:14px}
  label.fl{display:block;font-size:12px;font-weight:800;color:var(--mut2);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
  .fin{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:13px;padding:15px;font-size:18px;color:var(--ink);font-family:inherit;margin-bottom:14px}
  .fin:focus{outline:none;border-color:var(--tech)}
  #g_part{font-family:var(--mono);letter-spacing:.03em;font-weight:700}
  .hintbtn{display:inline-block;background:transparent;border:1px dashed var(--line);color:var(--mut2);border-radius:20px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:14px}
  .hintbox{background:rgba(245,197,66,.08);border:1px solid rgba(245,197,66,.3);border-radius:12px;padding:11px 13px;font-size:13.5px;color:var(--mut2);margin-bottom:14px;display:none}
  .hintbox b{color:var(--gold)}
  .lockbtn{width:100%;background:linear-gradient(180deg,#ffd85e,var(--gold));color:#231a02;border:0;border-radius:15px;padding:18px;font-size:19px;font-weight:900;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 26px rgba(245,197,66,.25);position:relative;overflow:hidden}
  .lockbtn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
  @keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
  .lockbtn:active{transform:translateY(1px)}
  .lockbtn:disabled{opacity:.6;cursor:default}
  .lockbtn:disabled::after{display:none}
  .finish{display:block;text-align:center;text-decoration:none;color:var(--tech);font-weight:800;font-size:15px;margin-top:16px}
  .err{color:var(--evil);font-weight:700;font-size:13.5px;text-align:center;min-height:18px;margin-top:10px}

  .reveal{text-align:center;padding:8px 4px}
  .reveal .big{font-size:clamp(30px,9vw,48px);font-weight:900;line-height:1;margin:6px 0 4px;animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes slam{0%{transform:scale(2.4);opacity:0;filter:blur(6px)}70%{transform:scale(.94)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
  .reveal .big.win{color:var(--win)} .reveal .big.evil{color:var(--evil)} .reveal .big.confirm{color:var(--confirm)} .reveal .big.wait{color:var(--gold)}
  .reveal p{color:var(--mut2);font-size:15px;margin:6px 0 0}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .pk{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px;animation:cardin .45s ease both}
  .pk:nth-child(2){animation-delay:.12s}
  @keyframes cardin{from{transform:rotateX(80deg);opacity:0}to{transform:rotateX(0);opacity:1}}
  .pk .h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:800}
  .pk .c{font-weight:800;margin-top:5px;font-size:15px}
  .pk .p{font-family:var(--mono);font-size:13px;color:var(--gold);margin-top:3px}
  .pk.right{border-color:var(--win);box-shadow:0 0 0 1px var(--win) inset} .pk.wrong{opacity:.6}
  .spinner{width:26px;height:26px;border:3px solid #2a3040;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:14px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  .score{display:flex;justify-content:center;gap:22px;margin:22px 0 0;color:var(--mut)}
  .score .s{text-align:center}
  .score .s b{display:block;font-size:24px;font-weight:900;color:var(--ink)}
  .score .s.boss b{color:var(--gold)} .score .s.tech b{color:var(--tech)}
  .score .s span{font-size:11px;text-transform:uppercase;letter-spacing:.1em}
  .score .vsm{align-self:center;color:var(--mut);font-style:italic;font-weight:900}

  /* 🎰 slot machine */
  .slotcab{background:linear-gradient(180deg,#33263a,#191d29);border:2px solid var(--gold);border-radius:20px;padding:18px 16px 20px;box-shadow:0 0 44px rgba(245,197,66,.22),inset 0 0 0 3px rgba(0,0,0,.25);text-align:center}
  .slotcab .cap{color:var(--gold);font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:14px;margin-bottom:12px}
  .reels{display:flex;gap:8px;justify-content:center;background:#0b0d14;border-radius:14px;padding:12px;border:1px solid var(--line);box-shadow:inset 0 6px 18px rgba(0,0,0,.5)}
  .reel{width:80px;height:96px;overflow:hidden;background:linear-gradient(180deg,#1c2230,#11141d);border-radius:9px;border:1px solid var(--line);position:relative}
  .reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:26px;z-index:2;pointer-events:none}
  .reel::before{top:0;background:linear-gradient(180deg,rgba(11,13,20,.95),transparent)}
  .reel::after{bottom:0;background:linear-gradient(0deg,rgba(11,13,20,.95),transparent)}
  .reel .strip{display:flex;flex-direction:column;will-change:transform}
  .reel .strip>div{height:96px;display:flex;align-items:center;justify-content:center;font-size:54px}
  .reel.win{box-shadow:0 0 0 2px var(--win),0 0 18px rgba(40,209,124,.6)}
  .reel.evil{box-shadow:0 0 0 2px var(--evil),0 0 18px rgba(255,77,94,.55)}
  .pullbtn{margin-top:16px;width:100%;background:linear-gradient(180deg,#ff6b7a,var(--evil));color:#fff;border:0;border-radius:15px;padding:18px;font-size:20px;font-weight:900;letter-spacing:.05em;cursor:pointer;box-shadow:0 10px 26px rgba(255,77,94,.3);position:relative;overflow:hidden}
  .pullbtn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sheen 2.4s ease-in-out infinite}
  .pullbtn:active{transform:translateY(1px)} .pullbtn:disabled{opacity:.6} .pullbtn:disabled::after{display:none}
  .slotsub{color:var(--mut2);font-size:13.5px;margin-top:12px}

  /* effects */
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
  #flash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.9),transparent 60%)}
  #flash.go{animation:flashk .5s ease-out}
  @keyframes flashk{0%{opacity:.9}100%{opacity:0}}
  #stamp{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;pointer-events:none}
  #stamp .st{font-weight:900;font-size:clamp(44px,15vw,110px);letter-spacing:-.02em;text-align:center;line-height:.9;transform:rotate(-8deg);
    text-shadow:0 6px 0 rgba(0,0,0,.35);animation:stampin .7s cubic-bezier(.2,1.6,.35,1) both;padding:0 16px}
  @keyframes stampin{0%{transform:rotate(-8deg) scale(3.2);opacity:0;filter:blur(8px)}65%{transform:rotate(-8deg) scale(.9)}100%{transform:rotate(-8deg) scale(1);opacity:1;filter:blur(0)}}
  #stamp .st.win{color:var(--win)} #stamp .st.confirm{color:var(--confirm)} #stamp .st.evil{color:var(--evil)} #stamp .st.gold{color:var(--gold)}
  #drum{position:fixed;inset:0;z-index:64;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,8,14,.78);backdrop-filter:blur(2px)}
  #drum .d{font-weight:900;font-size:clamp(26px,8vw,44px);color:var(--gold);letter-spacing:.04em;animation:pulse .5s ease-in-out infinite}
  #drum .sub{color:var(--mut2);font-size:14px;margin-top:10px;letter-spacing:.2em;text-transform:uppercase}
  .mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0));right:12px;z-index:70;background:rgba(23,27,38,.85);border:1px solid var(--line);color:var(--mut2);border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer}
  .loading{padding:60px 0;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="drum"><div class="d">🥁 LOCKING IT IN…</div><div class="sub">the reveal</div></div>
<div id="stamp"></div>
<button class="mute" id="muteBtn" title="Sound on/off" onclick="toggleMute()">🔊</button>
<div class="wrap" id="root">
  <div class="loading"><div class="spinner"></div>Loading the matchup…</div>
</div>

<script>
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const SITE='https://tnapplianceexchange.net';
const P=new URLSearchParams(location.search);
const JOB=parseInt(P.get('job_id')||P.get('job')||'0',10);
const WHO=(P.get('who')==='teddy')?'teddy':'tech';
const TECH_ID=parseInt(P.get('tech_id')||'0',10);
const NAME=P.get('name')||'';
const IAM = WHO==='teddy' ? {label:'THE BOSS',emoji:'👑',role:'Teddy',cls:'boss'} : {label:'YOU',emoji:'🥊',role:(NAME||'Challenger'),cls:'me'};
const FOE = WHO==='teddy' ? {label:'THE TECH',emoji:'🔧',role:'Challenger'} : {label:'THE BOSS',emoji:'👑',role:'Teddy'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let CTX={}, STATE={}, pollT=null, celebrated=null;

/* ── 🔊 sound engine (WebAudio synth, no files) ── */
let AC=null, MUTED=(localStorage.getItem('btb_mute')==='1');
function ac(){ if(MUTED) return null; try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(_){ return null; } }
function tone(f,t0,dur,type,vol){ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,c.currentTime+t0); g.gain.setValueAtTime(0,c.currentTime+t0); g.gain.linearRampToValueAtTime(vol||.22,c.currentTime+t0+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+dur); o.connect(g); g.connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.02); }
function sndLock(){ tone(180,0,.09,'square',.18); tone(90,.06,.16,'square',.2); }
function sndConfirm(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.08,.28,'triangle',.22)); }
function sndWin(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.09,.34,'triangle',.24)); tone(1568,.5,.5,'sine',.18); }
function sndBoss(){ [392,370,349,330,294].forEach((f,i)=>tone(f,i*.13,.3,'sawtooth',.2)); tone(140,.7,.6,'sawtooth',.16); }
function sndFlat(){ [330,262,196].forEach((f,i)=>tone(f,i*.16,.4,'sawtooth',.18)); }
function drumroll(ms){ const c=ac(); if(!c) return; const end=(ms||1200)/1000; let t=0; while(t<end){ tone(70+Math.random()*30,t,.05,'triangle',.1); t+=.055; } tone(180,end,.25,'square',.22); }
function sndLever(){ tone(240,0,.08,'sawtooth',.2); tone(120,.05,.18,'square',.2); tone(500,.14,.1,'triangle',.16); }
function spinWhir(sec){ const c=ac(); if(!c) return; const dur=sec||2.4; let t=0,gap=.028; while(t<dur){ const f=520+ (1-t/dur)*260 - Math.random()*40; tone(f,t,.03,'triangle',.05); t+=gap; gap+=.0009; } }
function clunk(){ tone(150,0,.06,'square',.22); tone(70,.02,.12,'square',.18); }
function jackpot(){ [784,988,1175,1568,1976].forEach((f,i)=>tone(f,i*.07,.3,'triangle',.22)); [1319,1568].forEach((f,i)=>tone(f,.5+i*.12,.5,'sine',.16)); }
function nearMissSting(){ tone(880,0,.12,'triangle',.2); tone(988,.13,.12,'triangle',.2); tone(392,.3,.5,'sawtooth',.18); }
function toggleMute(){ MUTED=!MUTED; localStorage.setItem('btb_mute',MUTED?'1':'0'); document.getElementById('muteBtn').textContent=MUTED?'🔇':'🔊'; if(!MUTED) tone(660,0,.12,'triangle',.2); }
document.getElementById('muteBtn').textContent=MUTED?'🔇':'🔊';

/* ── effects ── */
function flash(){ const f=document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
function shake(){ document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'),600); }
function slam(text,cls){ const s=document.getElementById('stamp'); s.innerHTML='<div class="st '+cls+'">'+text+'</div>'; s.style.display='flex'; setTimeout(()=>{ s.style.display='none'; },2200); }
function showDrum(txt,ms){ return new Promise(res=>{ const d=document.getElementById('drum'); if(txt) d.querySelector('.d').textContent=txt; d.style.display='flex'; drumroll(ms||1200); setTimeout(()=>{ d.style.display='none'; res(); }, ms||1200); }); }
function burst(theme){
  const cv=document.getElementById('fx'); cv.style.display='block';
  const ctx=cv.getContext('2d'); let W=cv.width=innerWidth, H=cv.height=innerHeight;
  const palettes={win:['#28d17c','#3ea6ff','#f5c542','#fff'],gold:['#f5c542','#ffe89a','#fff','#3ea6ff'],evil:['#ff4d5e','#7a1020','#2a3040','#ff9aa4']};
  const cols=palettes[theme]||palettes.win;
  const N=200, ps=[];
  for(let i=0;i<N;i++) ps.push({x:W/2+(Math.random()-.5)*160,y:H*0.30,vx:(Math.random()-.5)*11,vy:Math.random()*-13-4,g:.28+Math.random()*.14,s:5+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6.28,vr:(Math.random()-.5)*.5});
  let t=0;
  (function loop(){ t++; ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();});
    if(t<190) requestAnimationFrame(loop); else cv.style.display='none';
  })();
}

async function boot(){
  if(!JOB){ document.getElementById('root').innerHTML='<div class="loading">Missing job link. Open the text link again.</div>'; return; }
  let ctx={}, st={};
  try{ ctx=await fetch(SITE+'/.netlify/functions/job-truth?job_id='+JOB+'&lens=office').then(r=>r.json()); }catch(_){}
  try{ st=await fetch('/.netlify/functions/game-guess?job_id='+JOB).then(r=>r.json()); }catch(_){}
  CTX=(ctx&&ctx.facts)||{}; STATE=st||{};
  render();
}

function ctxHtml(){
  const c=CTX;
  const appl=[c.brand,c.appliance].filter(x=>x&&x!=='appliance').join(' ')||c.appliance||'appliance';
  return '<div class="ctx"><div class="cn">'+esc(c.customer_name||'Customer')+'</div>'
    +'<div class="cm">'+esc(appl)+(c.model?(' · '+esc(c.model)):'')+'</div>'
    +(c.problem?('<div class="pr">🗣 “'+esc(String(c.problem).slice(0,180))+'”</div>'):'')
    +(c.model?('<div class="md">model '+esc(c.model)+'</div>'):'')
    +'</div>';
}
function vsHtml(){
  return '<div class="vs">'
    +'<div class="fighter '+IAM.cls+'"><div class="emoji">'+IAM.emoji+'</div><div class="who">'+esc(IAM.label)+'</div><div class="role">'+esc(IAM.role)+'</div><div class="strk" id="strkMe"></div></div>'
    +'<div class="vsbadge">VS</div>'
    +'<div class="fighter '+(WHO==='teddy'?'me':'boss')+'"><div class="emoji">'+FOE.emoji+'</div><div class="who">'+esc(FOE.label)+'</div><div class="role">'+esc(FOE.role)+'</div><div class="strk" id="strkFoe"></div></div>'
    +'</div>';
}
function head(){
  return '<div class="kick">Tech vs. the Boss · live</div><h1>BEAT THE BOSS</h1>'
    +'<div class="tag">You beat Teddy to the punch — but he\'s <b>pretty damn good.</b> Lock your call. Match the boss = <b>confirmed win.</b> 🎯</div>'
    +'<div class="ticker"><span>🔥 LOCK YOUR DIAGNOSIS  ·  🏆 BEAT THE BOSS FOR THE CROWN  ·  😈 LOSE AND THE BOSS WINS AGAIN  ·  🎯 FIRST-GUESS-RIGHT IS THE FLEX  ·  🥊 STEP INTO THE ARENA</span></div>';
}

function render(){
  const root=document.getElementById('root');
  const mine = STATE[WHO];
  if(STATE.result){
    if(!pulled()){ root.innerHTML=head()+vsHtml()+ctxHtml()+leverHtml(); wireLever(); loadScore(); }
    else { root.innerHTML=head()+vsHtml()+ctxHtml()+finalHtml(STATE.result); loadScore(); }
    return;
  }
  if(!mine){ root.innerHTML=head()+vsHtml()+ctxHtml()+formHtml(); wireForm(); loadScore(); return; }
  root.innerHTML=head()+vsHtml()+ctxHtml()+lockedHtml(); loadScore();
  if(STATE.confirmed) celebrateConfirm();
  else if(!STATE[WHO==='tech'?'teddy':'tech']){ startPoll(); }
}

function formHtml(){
  const hint = WHO==='tech' ? 'The boss is sizing it up too. Trust your gut.' : 'Lock your read — the tech already fired.';
  return '<div class="panel"><h2>🔒 Lock in your answer</h2><div class="sub">'+hint+' Once you lock, it can\'t change.</div>'
    +'<label class="fl">What\'s broken (failed part)</label>'
    +'<input class="fin" id="g_comp" autocomplete="off" placeholder="e.g. ice maker assembly, drain pump, control board">'
    +'<label class="fl">Part # (if you\'ve got it)</label>'
    +'<input class="fin" id="g_part" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="optional — e.g. WPW10300024">'
    +'<button class="hintbtn" id="antHint" type="button">🧠 Peek at Ant Brain\'s guess</button>'
    +'<div class="hintbox" id="antBox"></div>'
    +'<button class="lockbtn" id="lockBtn">🔒 LOCK IT IN</button>'
    +'<div class="err" id="gErr"></div>'
    +'<a class="finish" href="teddy-tdr-tool.html?job_id='+JOB+(TECH_ID?('&tech_id='+TECH_ID):'')+'">Skip the game → open the full report 🧰</a></div>';
}
function wireForm(){
  document.getElementById('lockBtn').onclick=lockIn;
  document.getElementById('antHint').onclick=peekAnt;
  const p=document.getElementById('g_part'); p.addEventListener('input',()=>{p.value=p.value.toUpperCase();});
  document.body.addEventListener('touchstart',()=>{ac();},{once:true,passive:true});
}
async function peekAnt(){
  const box=document.getElementById('antBox'); const btn=document.getElementById('antHint');
  btn.style.display='none'; box.style.display='block'; box.innerHTML='<span class="pulse">🧠 Ant is thinking…</span>'; tone(880,0,.1,'sine',.15);
  try{
    const r=await fetch('/.netlify/functions/ant-brain-predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:JOB})}).then(x=>x.json());
    const top=(r&&(r.predictions||r.top||r.parts)||[])[0];
    if(top){ box.innerHTML='🧠 <b>Ant\'s guess:</b> '+esc(top.failed_component||top.component||top.part_name||'—')+(top.part_number?(' · <span style="font-family:var(--mono)">'+esc(top.part_number)+'</span>'):'')+(top.confidence?(' · '+esc(String(top.confidence))+'% sure'):'')+'<br><span style="color:var(--mut)">Beat it or borrow it — your call.</span>'; }
    else box.innerHTML='🧠 Ant\'s got thin data on this one — you\'re on your own. 😏';
  }catch(_){ box.innerHTML='🧠 Ant\'s guess didn\'t load — trust yourself.'; }
}
async function lockIn(){
  const comp=(document.getElementById('g_comp').value||'').trim();
  const part=(document.getElementById('g_part').value||'').trim();
  const err=document.getElementById('gErr'), btn=document.getElementById('lockBtn');
  if(!comp&&!part){ err.textContent='Type what\'s broken (or a part #) first.'; return; }
  ac(); sndLock(); err.textContent=''; btn.disabled=true; btn.textContent='🔒 Locked!';
  try{
    const d=await fetch('/.netlify/functions/game-guess',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({job_id:JOB,who:WHO,tech_id:TECH_ID,name:NAME,component:comp,part:part})}).then(r=>r.json());
    if(!d||!d.ok){ err.textContent=(d&&d.error)||'Could not lock — try again.'; btn.disabled=false; btn.textContent='🔒 LOCK IT IN'; return; }
    STATE[WHO]=d.mine; STATE.match=d.match; STATE.confirmed=d.confirmed;
    STATE[WHO==='tech'?'teddy':'tech']=d.other||STATE[WHO==='tech'?'teddy':'tech'];
    if(d.confirmed){ await showDrum('🥁 THE BOSS PICKED…',1100); }
    render();
  }catch(e){ err.textContent='Connection hiccup — try again.'; btn.disabled=false; btn.textContent='🔒 LOCK IT IN'; }
}

function pickCard(title,g,right){
  if(!g) return '<div class="pk"><div class="h">'+title+'</div><div class="c" style="color:var(--mut)">— no lock —</div></div>';
  return '<div class="pk'+(right===true?' right':(right===false?' wrong':''))+'"><div class="h">'+title+'</div><div class="c">'+esc(g.component||'—')+'</div>'+(g.part?('<div class="p">'+esc(g.part)+'</div>'):'')+'</div>';
}
function lockedHtml(){
  const other = STATE[WHO==='tech'?'teddy':'tech'];
  const mine = STATE[WHO];
  const foeName = WHO==='tech' ? 'the boss' : 'the tech';
  let inner;
  if(STATE.confirmed){
    inner='<div class="big confirm">✅ CONFIRMED!</div><p>'+(WHO==='tech'?'The boss picked the <b>same</b> as you — that\'s a lock. 🏆':'You matched the tech — their call is <b>confirmed</b>.')+'</p>';
  } else if(other){
    inner='<div class="big wait">🔒 LOCKED IN</div><p>Different calls — answers are sealed. Reality settles this one. 🥁</p>';
  } else {
    inner='<div class="big wait">🔒 LOCKED IN</div><p class="pulse">Waiting on '+foeName+' to lock theirs…</p><div class="spinner"></div>';
  }
  return '<div class="panel"><div class="reveal">'+inner
    +'<div class="picks">'+pickCard(WHO==='tech'?'YOU':'BOSS',mine,STATE.confirmed?true:null)+pickCard(WHO==='tech'?'BOSS':'TECH',other,STATE.confirmed?true:null)+'</div></div>'
    +'<a class="finish" href="teddy-tdr-tool.html?job_id='+JOB+(TECH_ID?('&tech_id='+TECH_ID):'')+'">🧰 Now go finish the real report →</a></div>';
}
function payoffWin(r){ if(WHO==='tech') return r.winner==='tech'||r.winner==='both'; return r.winner==='teddy'||r.winner==='both'; }
function leverHtml(){
  return '<div class="panel"><div class="slotcab"><div class="cap">🎰 The results are in</div>'
    +'<div class="reels" id="reelsEl"><div class="reel"><div class="strip"><div>🎰</div></div></div><div class="reel"><div class="strip"><div>❓</div></div></div><div class="reel"><div class="strip"><div>🎰</div></div></div></div>'
    +'<button class="pullbtn" id="pullBtn">🕹️ PULL THE LEVER</button>'
    +'<div class="slotsub">You locked it in. Reality\'s in the machine. Pull it. 🥁</div></div>'
    +'<a class="finish" href="teddy-tdr-tool.html?job_id='+JOB+(TECH_ID?('&tech_id='+TECH_ID):'')+'" style="margin-top:14px">🧰 Back to the report</a></div>';
}
function wireLever(){
  const btn=document.getElementById('pullBtn'); if(!btn) return;
  document.body.addEventListener('touchstart',()=>{ac();},{once:true,passive:true});
  btn.onclick=async()=>{
    ac(); sndLever(); btn.disabled=true; btn.textContent='🎰 spinning…'; markPulled();
    const r=STATE.result, o=outcomeFor(r);
    await slotReveal(o.syms);
    // light the reels
    document.querySelectorAll('#reelsEl .reel').forEach(el=>el.classList.add(o.reelcls||'win'));
    setTimeout(()=>{ revealPayoff(r,o); setTimeout(()=>{ celebrated='res:'+r.winner; render(); }, 1400); }, 250);
  };
}
function finalHtml(r){
  const real=[r.real_component,r.real_part].filter(Boolean).join(' · ')||'the fix';
  let big,cls,msg;
  if(r.winner==='both'){ big='🎉 BOTH NAILED IT'; cls='win'; msg='You and the boss both called it. The machine can\'t tell you apart.'; }
  else if(r.winner==='tech'){ big=WHO==='tech'?'🏆 YOU BEAT THE BOSS!':'😳 The tech got you'; cls=WHO==='tech'?'win':'evil'; msg=WHO==='tech'?'You called it, Teddy missed it. Crown\'s yours today. 👑':'They nailed it, you didn\'t. They\'re coming for the crown.'; }
  else if(r.winner==='teddy'){ big=WHO==='tech'?'😈 THE BOSS WINS AGAIN':'👑 BOSS WINS AGAIN!'; cls='evil'; msg=WHO==='tech'?'Teddy had it, you didn\'t. *evil laugh* — get him next time.':'You had it, the tech didn\'t. mwahahaha.'; }
  else { big='🤷 Stumped'; cls='wait'; msg='Reality got you both. Rematch on the next one.'; }
  const mine = WHO==='tech'?{component:r.tech_component,part:r.tech_part}:{component:r.teddy_component,part:r.teddy_part};
  const foe = WHO==='tech'?{component:r.teddy_component,part:r.teddy_part}:{component:r.tech_component,part:r.tech_part};
  const mineR = WHO==='tech'?r.tech_correct:r.teddy_correct;
  const foeR = WHO==='tech'?r.teddy_correct:r.tech_correct;
  const iLost = (cls==='evil');
  const symp = iLost ? '<div style="margin:12px 0 2px;padding:11px 13px;background:rgba(62,166,255,.08);border:1px solid rgba(62,166,255,.3);border-radius:12px;color:var(--mut2);font-size:14px">🤝 '+esc(sympathyLine(r))+'</div>' : '';
  return '<div class="panel"><div class="reveal"><div class="big '+cls+'">'+big+'</div><p>'+msg+'</p>'+symp
    +'<div class="pk right" style="margin:14px 0;text-align:center"><div class="h">✅ It was actually</div><div class="c">'+esc(real)+'</div></div>'
    +'<div class="picks">'+pickCard(WHO==='tech'?'YOU':'BOSS',mine,mineR)+pickCard(WHO==='tech'?'BOSS':'TECH',foe,foeR)+'</div>'
    +'<a class="finish" href="teddy-tdr-tool.html?job_id='+JOB+(TECH_ID?('&tech_id='+TECH_ID):'')+'" style="margin-top:6px">🧰 Finish / open the report</a></div></div>';
}

/* celebration (guarded so a re-render/poll doesn't replay) */
function celebrateConfirm(){
  if(celebrated==='confirm') return; celebrated='confirm';
  flash(); slam('CONFIRMED! ✅','confirm'); burst('gold'); sndConfirm();
}
/* ── 🎰 slot reveal + near-miss + sympathy ── */
function softCompMatch(a,b){ const n=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); const x=n(a),y=n(b); if(!x||!y) return false; if(x===y||x.includes(y)||y.includes(x)) return true; const tok=s=>s.split(' ').filter(w=>w.length>=4); return tok(x).some(w=>tok(y).includes(w)); }
function myGuess(r){ return WHO==='tech'?{c:r.tech_component,p:r.tech_part}:{c:r.teddy_component,p:r.teddy_part}; }
function outcomeFor(r){
  const iWon=payoffWin(r);
  const g=myGuess(r);
  const nearMiss = !iWon && r.winner!=='none' && (softCompMatch(g.c,r.real_component) || (g.p && r.real_part));
  let syms, reelcls;
  if(r.winner==='both'){ syms=['🤝','🤝','🤝']; reelcls='win'; }
  else if(iWon){ syms=['🎯','🎯','🎯']; reelcls='win'; }
  else if(r.winner==='none'){ syms=['🤷','🤷','🤷']; reelcls=''; }
  else if(nearMiss){ syms=['🎯','🎯','💥']; reelcls='evil'; }
  else { syms=['👑','👑','👑']; reelcls='evil'; }
  return { iWon, nearMiss, syms, reelcls };
}
const SYMPATHY=[
  'Shake it off — that was still a sharp read. 🤛',
  'The boss got lucky. You\'ll take the next one. 🔁',
  'Even champs drop rounds. Stay in the ring. 🥊',
  'So close you could taste it. Next job\'s yours. 😤',
  'He\'s beatable — you just proved you\'ll swing. 💪',
  'One off. That\'s not a miss, that\'s a warm-up. 🔥',
];
function sympathyLine(r){ const g=myGuess(r); if(softCompMatch(g.c,r.real_component)) return 'You had the right area — just missed the exact part. Painfully close. 😩'; return SYMPATHY[Math.floor(Math.random()*SYMPATHY.length)]; }
function pulled(){ try{ return localStorage.getItem('btb_pulled_'+JOB)==='1'; }catch(_){ return false; } }
function markPulled(){ try{ localStorage.setItem('btb_pulled_'+JOB,'1'); }catch(_){ } }

const REEL_POOL=['🔧','🧊','⚙️','🔌','💧','🔥','🥊','👑','💥','🎯','🤝'];
function slotReveal(syms){
  return new Promise(res=>{
    const reelsEl=document.getElementById('reelsEl'); if(!reelsEl){ res(); return; }
    reelsEl.innerHTML=''; const strips=[]; const LAND=29, H=96;
    syms.forEach((tgt)=>{
      const reel=document.createElement('div'); reel.className='reel';
      const strip=document.createElement('div'); strip.className='strip';
      let html=''; for(let k=0;k<LAND;k++) html+='<div>'+REEL_POOL[Math.floor(Math.random()*REEL_POOL.length)]+'</div>'; html+='<div>'+tgt+'</div>';
      strip.innerHTML=html; reel.appendChild(strip); reelsEl.appendChild(reel); strips.push({strip,reel});
    });
    spinWhir(2.6);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const durs=[1.4,1.9,2.5];
      strips.forEach((o,i)=>{ o.strip.style.transition='transform '+durs[i]+'s cubic-bezier(.13,.7,.24,1)'; o.strip.style.transform='translateY(-'+(LAND*H)+'px)';
        setTimeout(()=>{ clunk(); }, durs[i]*1000); });
      setTimeout(res, durs[2]*1000+400);
    }));
  });
}
function revealPayoff(r,o){
  if(r.winner==='both'){ flash(); slam('BOTH NAILED IT! 🎉','win'); burst('win'); jackpot(); }
  else if(o.iWon){ flash(); slam(WHO==='teddy'?'JACKPOT — BOSS WINS! 👑':'JACKPOT! 🏆','win'); burst(WHO==='teddy'?'gold':'win'); jackpot(); }
  else if(r.winner==='none'){ slam('STUMPED 🤷','wait'); sndFlat(); }
  else if(o.nearMiss){ shake(); slam('SO CLOSE 😩','evil'); burst('evil'); nearMissSting(); }
  else { shake(); slam(WHO==='tech'?'BOSS WINS AGAIN 😈':'YOU LOSE 😈','evil'); burst('evil'); sndBoss(); }
}

async function loadScore(){
  try{
    const s=await fetch('/.netlify/functions/game-grade?scoreboard=1').then(r=>r.json());
    if(!s||!s.ok) return;
    const techW=(s.tech_wins||0)+(s.ties||0), bossW=(s.boss_wins||0);
    const el=document.createElement('div'); el.className='score';
    el.innerHTML='<div class="s tech"><b>'+techW+'</b><span>tech wins</span></div><div class="vsm">—</div><div class="s boss"><b>'+bossW+'</b><span>boss wins</span></div>';
    document.getElementById('root').appendChild(el);
    // streak from most-recent results
    const rec=s.recent||[]; let cur=null,n=0;
    for(const g of rec){ const w=(g.winner==='tech'||g.winner==='both')?'tech':(g.winner==='teddy'?'boss':null); if(w===null) break; if(cur===null){cur=w;n=1;} else if(cur===w){n++;} else break; }
    const me=document.getElementById('strkMe'), foe=document.getElementById('strkFoe');
    if(cur&&n>=2&&me&&foe){ const meIsTech=(WHO==='tech'); const meStreak=(cur==='tech')===meIsTech; const txt='🔥 '+n+' in a row'; if(meStreak) me.textContent=txt; else foe.textContent=txt; }
  }catch(_){}
}
function startPoll(){
  if(pollT) return;
  pollT=setInterval(async()=>{
    try{ const st=await fetch('/.netlify/functions/game-guess?job_id='+JOB).then(r=>r.json());
      if(st&&st.ok){ const hadFoe=STATE[WHO==='tech'?'teddy':'tech']; STATE=Object.assign(STATE,st);
        if(st.result || st.confirmed || (!hadFoe && st[WHO==='tech'?'teddy':'tech'])){ clearInterval(pollT); pollT=null; if(st.confirmed){ showDrum('🥁 THE BOSS PICKED…',1100).then(render); } else render(); } }
    }catch(_){}
  }, 15000);
}
boot();
</script>
