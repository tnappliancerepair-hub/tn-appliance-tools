<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Invoices — Ant Office</title>
<style>
  :root{--bg:#0f1420;--card:#161c26;--line:#2a3340;--ink:#e7edf5;--dim:#8a96a8;--ok:#26a269;--warn:#e8a317;--red:#e0524a;--blue:#1f6fed}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px}
  .top{position:sticky;top:0;background:#0f1420ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 14px;z-index:5}
  .top h1{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--dim);font-size:13px;margin-top:3px}
  .wrap{max-width:760px;margin:0 auto;padding:12px 14px 60px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.g{background:var(--ok)} .btn.ghost{background:#222a36;color:var(--ink)} .btn.sm{padding:6px 10px;font-size:13px}
  .chip{background:#222a36;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--blue);border-color:var(--blue)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .card.unpaid{border-left:4px solid var(--red)} .card.paid{border-left:4px solid var(--ok)} .card.warr{border-left:4px solid var(--warn)}
  .who{font-weight:800;font-size:16px} .meta{color:var(--dim);font-size:12.5px;margin-top:2px}
  .amt{font-size:20px;font-weight:800} .badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .b-unpaid{background:#3a1d1b;color:#ff8a82} .b-paid{background:#16321f;color:#5fd08a} .b-warr{background:#3a2e12;color:#f2c662}
  input{background:#0e131c;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px;font-size:16px;width:100%}
  label{font-size:12px;color:var(--dim);display:block;margin:8px 0 3px}
  .modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;z-index:20;padding:30px 12px;overflow:auto}
  .modal.on{display:flex} .sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:460px;width:100%}
  a{color:#7db4ff}
  .empty{color:var(--dim);text-align:center;padding:40px 10px}
</style>
</head>
<body>
<div class="top">
  <h1>🧾 Invoices</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="row" style="margin-top:10px">
    <button class="btn g" onclick="openNew()">+ New invoice</button>
    <span class="chip on" data-f="all" onclick="setF('all',this)">All</span>
    <span class="chip" data-f="unpaid" onclick="setF('unpaid',this)">🔴 Unpaid</span>
    <span class="chip" data-f="paid" onclick="setF('paid',this)">✅ Paid</span>
    <a href="office-board.html" class="chip" style="text-decoration:none">← Board</a>
  </div>
</div>
<div class="wrap"><div id="list"><div class="empty">Loading invoices…</div></div></div>

<!-- New / edit invoice -->
<div class="modal" id="m-new">
  <div class="sheet">
    <h3 style="margin:0 0 8px">New invoice</h3>
    <label>Job #</label>
    <input id="f-job" inputmode="numeric" placeholder="e.g. 19996" onblur="lookupJob()">
    <div id="f-jobinfo" class="meta" style="margin-top:4px"></div>
    <label>Labor $</label><input id="f-labor" inputmode="decimal" placeholder="0.00" oninput="calc()">
    <label>Parts $</label><input id="f-parts" inputmode="decimal" placeholder="0.00" oninput="calc()">
    <label>Tax $</label><input id="f-tax" inputmode="decimal" placeholder="0.00" oninput="calc()">
    <div class="row" style="justify-content:space-between;margin-top:10px;font-size:18px;font-weight:800">
      <span>Total</span><span id="f-total">$0.00</span>
    </div>
    <div id="f-msg" class="meta" style="min-height:16px;margin-top:6px"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn g" id="f-save" onclick="saveInvoice()">Save invoice</button>
      <button class="btn ghost" onclick="closeM('m-new')">Cancel</button>
    </div>
  </div>
</div>

<!-- Pay link -->
<div class="modal" id="m-pay">
  <div class="sheet">
    <h3 style="margin:0 0 8px">💳 Send pay link</h3>
    <div id="p-msg" class="meta">Creating secure link…</div>
    <div id="p-actions" style="margin-top:12px"></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="closeM('m-pay')">Close</button></div>
  </div>
</div>

<script>
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
let INV=[], FILTER='all';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(Number(n)||0).toFixed(2);
const num=v=>{const n=parseFloat(String(v||'').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
function rel(ms){if(!ms)return'';const d=new Date(ms);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

async function load(){
  try{ const r=await fetch('/.netlify/functions/list-invoices?days=120',{cache:'no-store'}); const d=await r.json(); INV=(d&&d.invoices)||[];
    document.getElementById('sub').textContent=(d.count||0)+' invoices · '+(d.unpaid||0)+' unpaid (out-of-pocket)';
  }catch(_){ document.getElementById('sub').textContent='Could not load'; }
  render();
}
function setF(f,el){FILTER=f;document.querySelectorAll('.chip[data-f]').forEach(c=>c.classList.remove('on'));el.classList.add('on');render();}
function render(){
  const box=document.getElementById('list');
  let list=INV.slice();
  if(FILTER==='unpaid') list=list.filter(i=>!i.paid&&!i.warranty&&i.amount>0);
  if(FILTER==='paid') list=list.filter(i=>i.paid);
  if(!list.length){box.innerHTML='<div class="empty">No invoices'+(FILTER!=='all'?' in this filter':' yet — tap + New invoice')+'.</div>';return;}
  box.innerHTML=list.map(i=>{
    const cls=i.warranty?'warr':(i.paid?'paid':'unpaid');
    const badge=i.warranty?'<span class="badge b-warr">Warranty</span>':(i.paid?'<span class="badge b-paid">Paid'+(i.method?' · '+esc(i.method):'')+'</span>':'<span class="badge b-unpaid">Unpaid</span>');
    const payBtn=(!i.paid&&!i.warranty&&i.amount>0&&i.phone)?'<button class="btn sm g" onclick="payLink('+i.job_id+')">💳 Send pay link</button>':'';
    return '<div class="card '+cls+'">'
      +'<div class="row" style="justify-content:space-between;align-items:flex-start">'
        +'<div><div class="who">'+esc(i.customer)+'</div>'
        +'<div class="meta">Job #'+i.job_id+(i.appliance?' · '+esc(i.appliance):'')+(i.claim?' · Claim '+esc(i.claim):'')+' · '+rel(i.when_ms)+'</div></div>'
        +'<div style="text-align:right"><div class="amt">'+money(i.amount)+'</div>'+badge+'</div>'
      +'</div>'
      +'<div class="meta" style="margin-top:6px">Labor '+money(i.labor)+' · Parts '+money(i.parts)+' · Tax '+money(i.tax)+'</div>'
      +'<div class="row" style="margin-top:10px">'+payBtn
        +'<button class="btn sm ghost" onclick="openEdit('+i.job_id+')">✏️ Edit</button>'
        +'<a class="btn sm ghost" style="text-decoration:none" href="office-board.html?job='+i.job_id+'">Open job →</a>'
      +'</div></div>';
  }).join('');
}

// ── New / edit ──
function openNew(){ ['f-job','f-labor','f-parts','f-tax'].forEach(id=>document.getElementById(id).value='');document.getElementById('f-jobinfo').textContent='';document.getElementById('f-msg').textContent='';calc();document.getElementById('f-job').readOnly=false;document.getElementById('m-new').classList.add('on'); }
function openEdit(jobId){ const i=INV.find(x=>x.job_id===jobId)||{}; document.getElementById('f-job').value=jobId;document.getElementById('f-job').readOnly=true;document.getElementById('f-labor').value=i.labor||'';document.getElementById('f-parts').value=i.parts||'';document.getElementById('f-tax').value=i.tax||'';document.getElementById('f-jobinfo').textContent=(i.customer||'')+(i.appliance?' · '+i.appliance:'');document.getElementById('f-msg').textContent='';calc();document.getElementById('m-new').classList.add('on'); }
function closeM(id){document.getElementById(id).classList.remove('on');}
function calc(){const t=num(document.getElementById('f-labor').value)+num(document.getElementById('f-parts').value)+num(document.getElementById('f-tax').value);document.getElementById('f-total').textContent=money(t);}
let CUR_TECH=0;
async function lookupJob(){
  const jid=parseInt(document.getElementById('f-job').value,10); const el=document.getElementById('f-jobinfo'); CUR_TECH=0;
  if(!jid){el.textContent='';return;}
  el.textContent='Looking up…';
  try{ const j=await(await fetch(XANO+'/get_job?job_id='+jid,{cache:'no-store'})).json();
    if(!j||!j.id){el.innerHTML='<span style="color:var(--red)">No job #'+jid+'</span>';return;}
    CUR_TECH=Number(j.technician_id||0);
    const warr=String(j.customer_type||'')==='warranty';
    el.innerHTML=esc([j.brand,j.appliance_type].filter(Boolean).join(' ')||'job')+' · '+esc(j.scheduling_status||'')+(warr?' · <span style="color:var(--warn)">⚠ warranty (no customer charge)</span>':'');
  }catch(_){ el.textContent='Lookup failed (you can still save).'; }
}
async function saveInvoice(){
  const jid=parseInt(document.getElementById('f-job').value,10);
  const msg=document.getElementById('f-msg'); const btn=document.getElementById('f-save');
  if(!jid){msg.innerHTML='<span style="color:var(--red)">Enter a job #</span>';return;}
  const labor=num(document.getElementById('f-labor').value),parts=num(document.getElementById('f-parts').value),tax=num(document.getElementById('f-tax').value);
  const total=labor+parts+tax;
  if(total<=0){msg.innerHTML='<span style="color:var(--red)">Enter an amount</span>';return;}
  btn.disabled=true;msg.textContent='Saving…';
  try{
    const body={job_id:jid,labor:String(labor),parts_charge:String(parts),tax:String(tax),amount_invoiced:total.toFixed(2),logged_by:'Danielle'};
    if(CUR_TECH>0) body.technician_id=CUR_TECH;
    const d=await(await fetch(XANO+'/record_job_invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    if(d&&d.success!==false){ msg.innerHTML='<span style="color:var(--ok)">✓ Saved '+money(total)+'</span>'; setTimeout(()=>{closeM('m-new');load();},700); }
    else msg.innerHTML='<span style="color:var(--red)">'+esc((d&&(d.message||d.error))||'save failed')+'</span>';
  }catch(_){ msg.innerHTML='<span style="color:var(--red)">connection error</span>'; }
  btn.disabled=false;
}

// ── Pay link (Stripe) ──
async function payLink(jobId){
  const i=INV.find(x=>x.job_id===jobId)||{};
  document.getElementById('m-pay').classList.add('on');
  const msg=document.getElementById('p-msg'), act=document.getElementById('p-actions');
  msg.textContent='Creating secure Stripe link for '+(i.customer||'customer')+'…'; act.innerHTML='';
  try{
    const d=await(await fetch('/.netlify/functions/create-stripe-payment-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:jobId,kind:'invoice',description:'TN Appliance Exchange — Job #'+jobId+' invoice'})})).json();
    if(d&&d.error==='covered_by_warranty'){msg.innerHTML='<span style="color:var(--warn)">This is a warranty job — nothing to charge the customer.</span>';return;}
    if(!d||!d.ok||!d.url||d.placeholder){msg.innerHTML='<span style="color:var(--red)">'+esc((d&&d.error)||'Could not create link. Make sure the invoice amount is saved first.')+'</span>';return;}
    const url=d.url;
    const txt='Hi '+(i.customer?i.customer.split(' ')[0]:'there')+', here is your invoice for '+money(i.amount)+' from TN Appliance Exchange. Pay securely here: '+url;
    msg.innerHTML='<span style="color:var(--ok)">Link ready for '+esc(i.customer)+' — '+money(i.amount)+'</span>';
    act.innerHTML='<a class="btn g" style="text-decoration:none;display:inline-block" href="sms:+1'+esc(i.phone)+'?&body='+encodeURIComponent(txt)+'">📱 Text it to '+esc(i.customer.split(' ')[0])+'</a> '
      +'<button class="btn ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+url.replace(/'/g,"\\'")+'\');this.textContent=\'Copied ✓\'">Copy link</button>'
      +'<div class="meta" style="margin-top:8px;word-break:break-all">'+esc(url)+'</div>';
  }catch(_){ msg.innerHTML='<span style="color:var(--red)">connection error</span>'; }
}
load();
setInterval(load,45000);
</script>
</body>
</html>
