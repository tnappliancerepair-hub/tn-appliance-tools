<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#1a2230" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b0d10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Ant mark, left -->
  <g transform="translate(232 315) scale(1.12)">
    <!-- Antennae -->
    <path d="M-30 -130 Q-50 -170 -75 -180" stroke="#74e3c4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M30 -130 Q50 -170 75 -180" stroke="#74e3c4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-75" cy="-180" r="7" fill="#74e3c4"/>
    <circle cx="75" cy="-180" r="7" fill="#74e3c4"/>
    <!-- Head -->
    <ellipse cx="0" cy="-100" rx="55" ry="50" fill="#eef2f7"/>
    <circle cx="-22" cy="-110" r="6" fill="#0b0d10"/>
    <circle cx="22" cy="-110" r="6" fill="#0b0d10"/>
    <!-- Thorax -->
    <ellipse cx="0" cy="-15" rx="50" ry="55" fill="#eef2f7"/>
    <!-- Abdomen -->
    <ellipse cx="0" cy="100" rx="80" ry="70" fill="#eef2f7"/>
    <!-- Legs -->
    <g stroke="#eef2f7" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M-45 -25 Q-100 -10 -130 -50"/>
      <path d="M-45 0 Q-110 10 -140 0"/>
      <path d="M-45 25 Q-110 30 -130 60"/>
      <path d="M45 -25 Q100 -10 130 -50"/>
      <path d="M45 0 Q110 10 140 0"/>
      <path d="M45 25 Q110 30 130 60"/>
    </g>
  </g>

  <!-- Wordmark, right -->
  <text x="470" y="278" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="800" fill="#ffffff" letter-spacing="-2">Ant</text>
  <text x="474" y="356" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#74e3c4" letter-spacing="0">TN Appliance Exchange</text>
  <text x="476" y="416" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#9aa6b5">Honest appliance repair, run by AI.</text>
  <rect x="476" y="452" width="232" height="4" rx="2" fill="#74e3c4"/>
</svg>
