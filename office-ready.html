<style>
  :root{--bg:#f5f7fa;--card:#fff;--ink:#10243e;--sub:#5a6b80;--line:#e3e8ef;--brand:#1f6fed;--ok:#1aa260;--warn:#d6432a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;z-index:5}
  .top h1{font-size:17px;font-weight:800;margin:0}
  .top .sub{font-size:12px;color:var(--sub);margin-top:2px}
  .wrap{max-width:680px;margin:0 auto;padding:12px}
  .summary{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .v{font-size:24px;font-weight:900}.stat .k{font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .stat.bad .v{color:var(--warn)} .stat.good .v{color:var(--ok)}
  .filters{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .filters button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
  .filters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .job{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px;cursor:pointer;transition:.1s}
  .job:active{transform:scale(.995)}
  .job.ready{border-left:4px solid var(--ok)} .job.gaps{border-left:4px solid var(--warn)}
  .jh{display:flex;align-items:baseline;gap:8px}
  .jh .nm{font-weight:800;font-size:15px}
  .jh .meta{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}
  .appl{font-size:13px;color:var(--sub);margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:14px;display:inline-flex;align-items:center;gap:4px}
  .chip.ok{background:#e9f9f0;color:#127a4a}
  .chip.miss{background:#fdece9;color:var(--warn)}
  .chip.na{background:#f0f3f7;color:#9aa7b6}
  .empty{text-align:center;color:var(--sub);padding:40px 16px}
  .schedbtn{margin-top:9px;background:var(--brand);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer}
  .modal{position:fixed;inset:0;background:rgba(16,36,62,.5);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .modal.show{display:flex}
  .modal-card{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:88vh;overflow:auto}
  .modal-card h2{margin:0 0 4px;font-size:17px}
  .modal-card .who{font-size:13px;color:var(--sub);margin-bottom:10px}
  .modal-card label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin:10px 0 5px}
  .modal-card select,.modal-card input{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .modal-acts{display:flex;gap:9px;margin-top:16px}
  .modal-acts button{flex:1;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;border:0}
  .modal-acts .cancel{background:#f0f3f7;color:var(--sub)}
  .modal-acts .save{background:var(--ok);color:#fff}
  #auth{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;padding:24px}
  #auth input{font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;width:240px;text-align:center}
  #auth button{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 26px;font-size:16px;font-weight:800;cursor:pointer}
  #auth .err{color:var(--warn);font-size:13px;min-height:16px}
  .loading{text-align:center;color:var(--sub);padding:40px}

<body>
<div id="auth">
  <div style="font-size:20px;font-weight:900">🐜 Phone-Ready Jobs</div>
  <div style="color:var(--sub);font-size:14px">office password</div>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="pwBtn">Unlock</button>
  <div class="err" id="autherr"></div>
</div>

<div class="top">
  <h1>📞 Phone-Ready Jobs</h1>
  <div class="sub">What each job needs so Ant can answer the phone about it. Fix the ⚠ red ones.</div>
</div>
<div class="wrap">
  <div class="summary" id="summary"></div>
  <div class="filters" id="filters">
    <button data-f="gaps" class="on">⚠ Needs info</button>
    <button data-f="all">All</button>
    <button data-f="ready">✅ Ready</button>
  </div>
  <div class="filters">
    <select id="techFilter" style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink)">
      <option value="">All techs</option>
      <option value="unassigned">🗓️ Unassigned (needs scheduling)</option>
      <option value="1">Teddy</option><option value="2">Jimmy</option><option value="3">Andre</option>
      <option value="4">Lee</option><option value="5">Billy</option><option value="6">John</option>
    </select>
  </div>
  <div id="list"><div class="loading">Loading jobs…</div></div>
</div>

<div class="modal" id="schedModal">
  <div class="modal-card">
    <h2>Schedule this job</h2>
    <div class="who" id="schedWho"></div>
    <label>Tech</label>
    <select id="schedTech">
      <option value="">— pick a tech —</option>
      <option value="1">Teddy</option><option value="2">Jimmy</option><option value="3">Andre</option>
      <option value="4">Lee</option><option value="5">Billy</option><option value="6">John</option>
    </select>
    <div id="schedSuggest" style="font-size:12px;color:#0a7d33;font-weight:700;margin:2px 0 4px;min-height:14px"></div>
    <div class="row2">
      <div><label>Day</label><input id="schedDate" type="date"></div>
      <div><label>Time</label><input id="schedTime" type="time" value="09:00"></div>
    </div>
    <label>Arrival window (optional)</label>
    <input id="schedWindow" placeholder="9-12 / 1-4">
    <div class="modal-acts">
      <button class="cancel" onclick="closeSched()">Cancel</button>
      <button class="save" id="schedSave">Schedule it</button>
    </div>
  </div>
</div>

<div class="modal" id="fillModal">
  <div class="modal-card">
    <h2>Add info</h2>
    <div class="who" id="fillWho"></div>
    <div id="fillClaimWrap"><label>Warranty claim / work-order #</label><input id="fillClaim" placeholder="claim or WO #"></div>
    <div id="fillPhoneWrap"><label>Customer phone</label><input id="fillPhone" type="tel" inputmode="tel" placeholder="(615) 555-1234"></div>
    <div class="modal-acts">
      <button class="cancel" onclick="closeFill()">Cancel</button>
      <button class="save" id="fillSave">Save</button>
    </div>
  </div>
</div>

<script>
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const TECH={1:'Teddy',2:'Jimmy',3:'Andre',4:'Lee',5:'Billy',6:'John'};
let JOBS=[], FILTER='gaps', TECHF='';

function authOk(){try{return localStorage.getItem('tn_office_auth')==='1';}catch(_){return false;}}
async function verify(pw){try{const r=await fetch(XANO+'/verify_office_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});const d=await r.json();return d&&d.success===true;}catch(_){return false;}}
document.getElementById('pwBtn').onclick=async function(){
  const e=document.getElementById('autherr');const v=document.getElementById('pw').value.trim();
  if(!v){e.textContent='Enter the office password';return;} e.textContent='Checking…';
  if(await verify(v)){try{localStorage.setItem('tn_office_auth','1');}catch(_){ } document.getElementById('auth').style.display='none';load();}
  else{e.textContent='Wrong password';}
};
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pwBtn').click();});

const PARTS_WAIT=/awaiting|ordered|on_order|on order|pending|parts_needed|backorder/i;
const DONE=/completed|canceled|cancelled|no_fix/i;

// returns {checks:[{key,label,state}], gaps, applicable, ready}
function assess(j){
  const checks=[];
  const isDone=DONE.test(j.scheduling_status||'');
  // 1) Day + tech
  const hasDay=Number(j.scheduled_start)>0 && Number(j.technician_id)>0;
  checks.push({key:'sched',label:'📅 Day+Tech',state:isDone?'na':(hasDay?'ok':'miss')});
  // 2) Customer phone
  checks.push({key:'phone',label:'📞 Phone',state:(j.customer_phone&&(''+j.customer_phone).replace(/\D/g,'').length>=10)?'ok':'miss'});
  // 3) Claim # (only for warranty jobs)
  const warranty=!!(j.warranty_company&&(''+j.warranty_company).trim());
  checks.push({key:'claim',label:'🎫 Claim #',state:warranty?((j.claim_number&&(''+j.claim_number).trim())?'ok':'miss'):'na'});
  // 4) Parts ETA (only when waiting on parts)
  const waiting=PARTS_WAIT.test(j.parts_status||'');
  checks.push({key:'eta',label:'📦 Parts ETA',state:waiting?((j.parts_eta_date&&(''+j.parts_eta_date).trim())?'ok':'miss'):'na'});
  const applicable=checks.filter(c=>c.state!=='na').length;
  const gaps=checks.filter(c=>c.state==='miss').length;
  return {checks,gaps,applicable,ready:gaps===0};
}

async function load(){
  try{
    const r=await fetch(XANO+'/get_office_kanban',{cache:'no-store'});
    const d=await r.json();
    JOBS=((d&&d.items)||[]).map(j=>({...j,_a:assess(j)}));
    render();
  }catch(e){document.getElementById('list').innerHTML='<div class="empty">⚠ Could not load — '+esc(e.message)+'</div>';}
}

function render(){
  const total=JOBS.length;
  const withGaps=JOBS.filter(j=>j._a.gaps>0).length;
  const ready=total-withGaps;
  document.getElementById('summary').innerHTML=
    '<div class="stat bad"><div class="v">'+withGaps+'</div><div class="k">Need info</div></div>'+
    '<div class="stat good"><div class="v">'+ready+'</div><div class="k">Phone-ready</div></div>'+
    '<div class="stat"><div class="v">'+total+'</div><div class="k">Open jobs</div></div>';
  document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b.dataset.f===FILTER));
  let rows=JOBS;
  if(FILTER==='gaps')rows=JOBS.filter(j=>j._a.gaps>0);
  if(FILTER==='ready')rows=JOBS.filter(j=>j._a.gaps===0);
  if(TECHF==='unassigned')rows=rows.filter(j=>!(Number(j.technician_id)>0));
  else if(TECHF)rows=rows.filter(j=>Number(j.technician_id)===Number(TECHF));
  rows.sort((a,b)=>(b._a.gaps-a._a.gaps)||((Number(a.created_at)||0)-(Number(b.created_at)||0)));
  if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">'+(FILTER==='gaps'?'🎉 Every open job is phone-ready!':'No jobs.')+'</div>';return;}
  document.getElementById('list').innerHTML=rows.map(j=>{
    const nm=((j.customer_first||'')+' '+(j.customer_last||'')).trim()||'Customer';
    const appl=[j.brand,j.appliance].filter(Boolean).join(' ')||'appliance';
    const tech=j.technician_id&&TECH[j.technician_id]?TECH[j.technician_id]:'';
    const chips=j._a.checks.map(c=>'<span class="chip '+c.state+'">'+(c.state==='ok'?'✓ ':c.state==='miss'?'⚠ ':'– ')+c.label.replace(/^.. /,'')+'</span>').join('');
    const needsSched=j._a.checks.find(c=>c.key==='sched'&&c.state==='miss');
    const schedBtn=needsSched?'<button class="schedbtn" onclick="event.stopPropagation();openSched('+j.id+',&quot;'+esc(nm).replace(/"/g,'')+' · '+esc(appl).replace(/"/g,'')+'&quot;)">📅 Schedule it</button>':'';
    const needInfo=j._a.checks.find(c=>(c.key==='claim'||c.key==='phone')&&c.state==='miss');
    const fillBtn=needInfo?'<button class="schedbtn" style="background:#5a6b80;margin-left:7px" onclick="event.stopPropagation();openFill('+j.id+')">✏️ Add info</button>':'';
    return '<div class="job '+(j._a.gaps>0?'gaps':'ready')+'" onclick="fix('+j.id+')">'+
      '<div class="jh"><span class="nm">'+esc(nm)+'</span><span class="meta">'+esc(j.warranty_company||'cash')+(tech?(' · '+tech):'')+'</span></div>'+
      '<div class="appl">'+esc(appl)+(j.service_city?(' · '+esc(j.service_city)):'')+' · #'+j.id+waitBadge(j)+'</div>'+
      '<div class="chips">'+chips+'</div>'+
      schedBtn+fillBtn+
    '</div>';
  }).join('');
}
function fix(id){ location.href='office-board.html?job='+id; }

let SCHED_JOB=0;
function openSched(id,who){
  SCHED_JOB=id;
  document.getElementById('schedWho').textContent=who+' · #'+id;
  document.getElementById('schedTech').value='';
  document.getElementById('schedWindow').value='';
  try{document.getElementById('schedDate').value=new Date().toISOString().slice(0,10);}catch(_){}
  document.getElementById('schedSave').disabled=false;
  document.getElementById('schedSave').textContent='Schedule it';
  document.getElementById('schedSuggest').textContent='';
  document.getElementById('schedModal').classList.add('show');
  suggestTech(id);
}
const SUG_TECH={1:'Teddy',2:'Jimmy',3:'Andre',4:'Lee',5:'Billy',6:'John'};
async function suggestTech(id){
  const j=JOBS.find(x=>x.id===id); if(!j)return;
  const zip=(j.service_zip||'').toString().trim(); if(!zip)return;
  const sel=document.getElementById('schedTech'), hint=document.getElementById('schedSuggest');
  try{
    const r=await fetch(XANO+'/check_service_zone?zip_code='+encodeURIComponent(zip));
    const d=await r.json();
    if(SCHED_JOB!==id)return;
    const tid=d&&d.suggested_technician_id;
    if(tid===1){
      hint.innerHTML='⚠ Only Teddy covers '+esc(d.cluster||'this area')+' — assign a tech in <a href="cluster-ranks.html" style="color:#0a7d33">Area Coverage</a>.';
    }else if(tid&&SUG_TECH[tid]){
      if(!sel.value)sel.value=String(tid);
      hint.textContent='🐜 Ant suggests '+(d.suggested_tech_name||SUG_TECH[tid])+' — covers '+(d.cluster||'this area')+'. Change if needed.';
      suggestDay(tid, d.cluster||'', id, hint, (d.suggested_tech_name||SUG_TECH[tid]));
    }else if(d&&d.cluster){
      hint.textContent='Area: '+d.cluster+' — pick the tech who runs it.';
    }
  }catch(_){}
}
// Day that densifies the route — pre-fills schedDate when the tech already
// has same-cluster stops on a day. Never forces a day without a match.
function ctDate(ms){try{return new Date(ms).toLocaleDateString('en-CA',{timeZone:'America/Chicago'});}catch(_){return '';}}
async function suggestDay(tid, cluster, jobId, hint, techName){
  if(!cluster)return;
  const cl=cluster.trim().toLowerCase();
  try{
    const r=await fetch(XANO+'/get_tech_route_days?technician_id='+tid+'&days=14');
    const d=await r.json();
    if(SCHED_JOB!==jobId)return;
    if(!d||!d.stops||!d.stops.length)return;
    const by={};
    d.stops.forEach(s=>{
      const day=ctDate(s.scheduled_start_ms); if(!day)return;
      by[day]=by[day]||{total:0,same:0};
      by[day].total++;
      if((s.cluster||'').trim().toLowerCase()===cl)by[day].same++;
    });
    const today=ctDate(Date.now());
    let best=null, light=null;
    Object.keys(by).forEach(day=>{
      if(day<today)return;
      const o=by[day];
      if(o.same&&(!best||o.same>best.same||(o.same===best.same&&o.total<best.total)))best={day,same:o.same,total:o.total};
      if(!light||o.total<light.total)light={day,total:o.total};
    });
    const di=document.getElementById('schedDate');
    if(best){
      if(di)di.value=best.day;
      hint.textContent=hint.textContent+' '+techName+' has '+best.same+' stop'+(best.same===1?'':'s')+' near here that day — routes well.';
    }else if(light&&di){
      di.value=light.day;
      hint.textContent=hint.textContent+' Pre-picked the lightest day '+techName+' is already out — change if needed.';
    }
  }catch(_){}
}
function closeSched(){document.getElementById('schedModal').classList.remove('show');SCHED_JOB=0;}
document.getElementById('schedSave').onclick=async function(){
  const tech=parseInt(document.getElementById('schedTech').value,10);
  const dateStr=document.getElementById('schedDate').value;
  const timeStr=document.getElementById('schedTime').value||'09:00';
  if(!tech){alert('Pick a tech');return;}
  if(!dateStr){alert('Pick a day');return;}
  const startMs=new Date(dateStr+'T'+timeStr+':00').getTime();
  const win=document.getElementById('schedWindow').value.trim();
  this.disabled=true;this.textContent='Scheduling…';
  try{
    const sb=JSON.stringify({job_id:SCHED_JOB,technician_id:tech,scheduled_start_ms:startMs,service_eta_window:win});
    let d=await (await fetch(XANO+'/danielle_schedule_parallel_job',{method:'POST',headers:{'Content-Type':'application/json'},body:sb})).json();
    if(d&&!d.success&&/terminal/i.test(String((d&&d.error)||''))){
      try{await fetch(XANO+'/office_set_job_status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:SCHED_JOB,scheduling_status:'scheduled',actor:'Danielle'})});}catch(_){}
      d=await (await fetch(XANO+'/danielle_schedule_parallel_job',{method:'POST',headers:{'Content-Type':'application/json'},body:sb})).json();
    }
    if(d&&d.success){closeSched();load();}
    else{this.disabled=false;this.textContent='Schedule it';alert('⚠ '+((d&&d.error)||'failed'));}
  }catch(_){this.disabled=false;this.textContent='Schedule it';alert('⚠ connection error');}
};
let FILL_JOB=0;
function openFill(id){
  const j=JOBS.find(x=>x.id===id); if(!j)return; FILL_JOB=id;
  document.getElementById('fillWho').textContent=(((j.customer_first||'')+' '+(j.customer_last||'')).trim()||'Customer')+' · #'+id;
  const needClaim=j._a.checks.find(c=>c.key==='claim'&&c.state==='miss');
  const needPhone=j._a.checks.find(c=>c.key==='phone'&&c.state==='miss');
  document.getElementById('fillClaimWrap').style.display=needClaim?'':'none';
  document.getElementById('fillPhoneWrap').style.display=needPhone?'':'none';
  document.getElementById('fillClaim').value=j.claim_number||'';
  document.getElementById('fillPhone').value=j.customer_phone||'';
  document.getElementById('fillSave').disabled=false;document.getElementById('fillSave').textContent='Save';
  document.getElementById('fillModal').classList.add('show');
}
function closeFill(){document.getElementById('fillModal').classList.remove('show');FILL_JOB=0;}
document.getElementById('fillSave').onclick=async function(){
  const claim=document.getElementById('fillClaim').value.trim();
  const phone=document.getElementById('fillPhone').value.trim();
  if(!claim&&!phone){alert('Enter the claim # or phone');return;}
  this.disabled=true;this.textContent='Saving…';
  try{
    const r=await fetch(XANO+'/office_quick_fill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:FILL_JOB,claim_number:claim,customer_phone:phone,actor:'office'})});
    const d=await r.json();
    if(d&&d.success){closeFill();load();}
    else{this.disabled=false;this.textContent='Save';alert('⚠ '+((d&&d.error)||'failed'));}
  }catch(_){this.disabled=false;this.textContent='Save';alert('⚠ connection error');}
};
document.querySelectorAll('#filters button[data-f]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render();});
document.getElementById('techFilter').onchange=function(){TECHF=this.value;render();};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function waitBadge(j){var c=Number(j.created_at)||0;if(!c)return '';var days=Math.floor((Date.now()-c)/86400000);if(days<1)return '';var col=days>=7?'#c0392b':(days>=3?'#b3690a':'#6b7488');return ' · <span style="color:'+col+';font-weight:800">⏳ '+days+'d</span>';}
window.AntTalkReload=function(){load();};
if(authOk()){document.getElementById('auth').style.display='none';load();}
</script>
<script src="/ant-talk.js?v=1"></script>
<script src="/ant-shell.js?v=20260612-1" defer></script>
