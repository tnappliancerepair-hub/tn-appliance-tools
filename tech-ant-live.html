<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tech Ant Live - TN Appliance Exchange</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto auto auto 1fr auto auto auto;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #0e1118, #131a2a);
    border-bottom: 1px solid #2a3040;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header .icon { font-size: 24px; }
  .header .text { flex: 1; min-width: 0; }
  .header .title { font-size: 14px; font-weight: 700; }
  .header .sub { font-size: 11px; color: #8a93aa; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .header .badge {
    background: rgba(245,166,35,0.12);
    border: 1px solid rgba(245,166,35,0.3);
    color: #f5a623;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
  }
  .header .badge.live {
    background: rgba(0,214,143,0.12);
    border-color: rgba(0,214,143,0.3);
    color: #00d68f;
  }

  .job-bar {
    background: #131720;
    border-bottom: 1px solid #2a3040;
    padding: 10px 16px;
    font-size: 12px;
    display: none;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .job-bar.show { display: flex; }
  .job-bar .label { color: #8a93aa; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; }
  .job-bar .value { color: #e8edf5; font-weight: 600; }
  .job-bar .sep { color: #2a3040; }

  /* Action bar: navigate / on my way / call / start / complete */
  .action-bar {
    background: #131720;
    border-bottom: 1px solid #2a3040;
    padding: 8px 12px;
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .action-bar.show { display: flex; }

  .action-row {
    display: flex;
    gap: 6px;
  }

  .action-btn {
    flex: 1;
    min-height: 44px;
    background: #1e2433;
    border: 1px solid #2a3040;
    color: #e8edf5;
    padding: 0 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-family: inherit;
    transition: all 0.15s;
    -webkit-appearance: none;
    appearance: none;
    white-space: nowrap;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:hover:not(:disabled) { background: #2a3040; border-color: #4a9eff; }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .action-btn.primary {
    background: linear-gradient(135deg, #4a9eff, #3a8eef);
    border-color: #4a9eff;
    color: white;
  }
  .action-btn.primary.started {
    background: linear-gradient(135deg, #00d68f, #00aa70);
    border-color: #00d68f;
    color: #080a0f;
  }

  .action-btn.complete {
    background: linear-gradient(135deg, #00d68f, #00aa70);
    border-color: #00d68f;
    color: #080a0f;
    text-align: center;
    text-align-last: center;
  }

  .main-area {
    overflow: hidden;
    position: relative;
    min-height: 0;
  }
  .chat {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }
  .chat::-webkit-scrollbar-thumb:hover { background: #3a4050; }

  .loading {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    color: #8a93aa;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #2a3040;
    border-top-color: #f5a623;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-screen {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 30px 20px;
    text-align: center;
    color: #ff4757;
  }
  .error-screen h2 { margin-bottom: 8px; font-size: 18px; }
  .error-screen p { color: #8a93aa; font-size: 14px; max-width: 320px; }

  .msg {
    max-width: 85%;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #4a9eff;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #1e2433;
    color: #e8edf5;
    border-bottom-left-radius: 4px;
    border: 1px solid #2a3040;
  }
  .msg.system {
    align-self: center;
    background: rgba(245,166,35,0.08);
    color: #f5a623;
    border: 1px solid rgba(245,166,35,0.2);
    font-size: 12px;
    padding: 8px 14px;
    max-width: 90%;
    text-align: center;
  }
  .msg.system.success {
    background: rgba(0,214,143,0.1);
    color: #00d68f;
    border-color: rgba(0,214,143,0.3);
  }
  .msg.system.error {
    background: rgba(255,71,87,0.1);
    color: #ff4757;
    border-color: rgba(255,71,87,0.3);
  }
  .msg .ant-tag {
    font-size: 10px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .typing {
    align-self: flex-start;
    background: #1e2433;
    border: 1px solid #2a3040;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    padding: 14px 16px;
    display: flex;
    gap: 4px;
  }
  .typing span {
    width: 8px;
    height: 8px;
    background: #4a9eff;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  .upload-msg {
    align-self: flex-end;
    background: #1e2433;
    border: 1px solid #4a9eff;
    border-radius: 14px;
    padding: 10px 14px;
    max-width: 85%;
    font-size: 13px;
    min-width: 220px;
  }
  .upload-msg .filename {
    color: #e8edf5;
    font-weight: 600;
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-msg .progress-bar {
    width: 100%;
    height: 4px;
    background: #2a3040;
    border-radius: 2px;
    overflow: hidden;
  }
  .upload-msg .progress-fill {
    height: 100%;
    background: #4a9eff;
    width: 0%;
    transition: width 0.3s;
  }
  .upload-msg.success { border-color: #00d68f; }
  .upload-msg.success .progress-fill { background: #00d68f; }
  .upload-msg.error { border-color: #ff4757; }
  .upload-msg.error .progress-fill { background: #ff4757; }
  .upload-msg .status {
    font-size: 11px;
    color: #8a93aa;
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .upload-msg.success .status { color: #00d68f; }
  .upload-msg.error .status { color: #ff4757; }

  .quick-actions {
    background: #131720;
    border-top: 1px solid #2a3040;
    padding: 8px 12px;
    display: none;
    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .quick-actions.show { display: flex; }
  .quick-actions::-webkit-scrollbar { display: none; }
  .quick-actions .quick-btn {
    background: #1e2433;
    border: 1px solid #2a3040;
    color: #e8edf5;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .quick-actions .quick-btn:hover {
    background: #2a3040;
    border-color: #4a9eff;
  }
  .quick-actions .quick-btn:active { transform: scale(0.95); }

  .submit-banner {
    display: none;
    background: linear-gradient(135deg, #00d68f, #00aa70);
    color: #080a0f;
    padding: 14px 16px;
    text-align: center;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    border: none;
    width: 100%;
    transition: opacity 0.15s;
  }
  .submit-banner.show { display: block; }
  .submit-banner:hover { opacity: 0.9; }
  .submit-banner:disabled { opacity: 0.6; cursor: not-allowed; }

  .input-wrap {
    background: #131720;
    border-top: 1px solid #2a3040;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: none;
  }
  .input-wrap.show { display: block; }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .input-row textarea {
    flex: 1;
    background: #0e1118;
    border: 1px solid #2a3040;
    border-radius: 12px;
    color: #e8edf5;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 16px;
    resize: none;
    outline: none;
    max-height: 100px;
    min-height: 42px;
    line-height: 1.4;
    -webkit-appearance: none;
  }
  .input-row textarea:focus { border-color: #4a9eff; }
  .input-row textarea::placeholder { color: #5a6480; }
  .btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-camera { background: #2a3040; color: #e8edf5; }
  .btn-camera:hover:not(:disabled) { background: #3a4050; }
  .btn-send { background: #4a9eff; color: white; }
  .btn-send:hover:not(:disabled) { background: #3a8eef; }
  .btn-mic { background: #1e2433; color: #8a93aa; border: 1px solid #2a3040; }
  .btn-mic.recording {
    background: #ff4757;
    color: white;
    border-color: #ff4757;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.6); }
    50% { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
  }

  input[type="file"] { display: none; }

  /* PIN gate */
  .pin-overlay {
    position: fixed; inset: 0; background: #0e1118;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
  }
  .pin-overlay.hidden { display: none; }
  .pin-card {
    background: #131720; border: 1px solid #2a3040;
    border-radius: 16px; padding: 28px 22px; width: 100%; max-width: 320px;
    text-align: center;
  }
  .pin-card h2 { font-size: 18px; margin-bottom: 6px; }
  .pin-card .sub { color: #8a93aa; font-size: 13px; margin-bottom: 18px; }
  .pin-card input {
    width: 100%; background: #0e1118; border: 1px solid #2a3040;
    border-radius: 10px; color: #e8edf5; padding: 14px;
    font-size: 22px; text-align: center; letter-spacing: 0.4em;
    font-family: 'IBM Plex Mono', monospace; margin-bottom: 12px;
    -webkit-appearance: none;
  }
  .pin-card input:focus { border-color: #4a9eff; outline: none; }
  .pin-card button {
    width: 100%; background: #4a9eff; color: white; border: 0;
    border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700;
    cursor: pointer;
  }
  .pin-card button:disabled { opacity: 0.5; cursor: not-allowed; }
  .pin-card .err {
    color: #ff4757; font-size: 13px; margin-top: 10px; min-height: 18px;
  }
</style>
</head>
<body>

<div class="pin-overlay" id="pin-overlay">
  <div class="pin-card">
    <h2>🐜 Tech Ant Live</h2>
    <div class="sub">enter your 4-digit PIN to unlock</div>
    <input id="pin-input" type="tel" inputmode="numeric" maxlength="4" autocomplete="off">
    <button id="pin-submit" onclick="submitPin()">Unlock</button>
    <div class="err" id="pin-err"></div>
  </div>
</div>

<div class="header">
  <div class="icon">🐜</div>
  <div class="text">
    <div class="title">Tech Ant Live</div>
    <div class="sub" id="header-sub">Loading...</div>
  </div>
  <div class="badge" id="header-badge">CONNECTING</div>
</div>

<div class="job-bar" id="job-bar">
  <span class="label">Job</span><span class="value" id="job-id">—</span>
  <span class="sep">•</span>
  <span class="value" id="job-customer">—</span>
  <span class="sep">•</span>
  <span class="value" id="job-appliance">—</span>
</div>

<div class="action-bar" id="action-bar">
  <div class="action-row">
    <button class="action-btn" onclick="onNavigate()">📍 Navigate</button>
    <button class="action-btn" id="btn-on-my-way" onclick="onOnMyWay()">🚗 On My Way</button>
    <button class="action-btn" onclick="onCall()">📞 Call</button>
  </div>
  <div class="action-row">
    <button class="action-btn primary" id="btn-start-job" onclick="onStartJob()">▶ Start Job</button>
    <select class="action-btn complete" id="complete-select" onchange="onComplete(this.value)">
      <option value="" disabled selected hidden>✅ Complete ▾</option>
      <option value="repair_complete">Repair Complete</option>
      <option value="parts_needed">Parts Needed</option>
      <option value="warranty_auth_needed">Warranty Auth Needed</option>
      <option value="no_repair">No Repair</option>
      <option value="other">Other</option>
    </select>
  </div>
</div>

<div class="main-area" id="main-area">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading job context...</p>
  </div>
</div>

<button class="submit-banner" id="submit-banner" onclick="submitTDR()" style="display:none">
  ✅ Live job assist - submit TDR after job completes
</button>

<div class="quick-actions" id="quick-actions"></div>

<div class="input-wrap" id="input-wrap">
  <div class="input-row">
    <button class="btn btn-camera" onclick="document.getElementById('file-input').click()" title="Upload photo/video">📷</button>
    <button class="btn btn-mic" id="btn-mic" onclick="toggleRecording()" title="Voice input">🎤</button>
    <textarea id="input-msg" placeholder="Type or tap mic..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoGrow(this)"></textarea>
    <button class="btn btn-send" onclick="sendMessage()">↑</button>
  </div>
</div>

<input type="file" id="file-input" multiple accept="image/*,video/*" onchange="handleFiles(event)">

<script>
const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const NETLIFY_BASE = window.location.origin;

const params = new URLSearchParams(window.location.search);
const JOB_ID = params.get('job_id');
const TECH_ID = params.get('tech_id');
const SESSION_ID_URL = params.get('session_id');
const API_VERIFY_PIN = '/.netlify/functions/verify-pin-proxy';

let assistSessionId = SESSION_ID_URL ? parseInt(SESSION_ID_URL, 10) : null;
let pinUnlocked = false;

let jobAddress = '';
let customerPhone = '';
let jobStarted = false;

let conversationHistory = [];
let collectedData = {};
let isSubmitting = false;
let recognition = null;
let isRecording = false;
let appliancetype = 'other';
let chatEl = null;

async function init() {
  if (!JOB_ID || !TECH_ID) {
    showError('Missing parameters', 'This page needs job_id and tech_id in the URL. Use the link sent to you via SMS.');
    return;
  }

  try {
    const res = await fetch(`${XANO_BASE}/get_job_for_dashboard?job_id=${JOB_ID}`);
    if (!res.ok) throw new Error(`Could not load job (${res.status})`);
    const data = await res.json();
    if (!data.success || !data.job) throw new Error('Job not found');

    appliancetype = ((data.appliance && data.appliance.type) || 'other').toLowerCase();

    document.getElementById('header-sub').textContent = `Tech ID ${TECH_ID} • Job #${JOB_ID}`;
    const badge = document.getElementById('header-badge');
    badge.textContent = 'LIVE';
    badge.classList.add('live');

    document.getElementById('job-id').textContent = '#' + (data.job.id || JOB_ID);
    document.getElementById('job-customer').textContent = (data.customer && data.customer.name) || 'Customer';
    document.getElementById('job-appliance').textContent = `${data.appliance.brand || ''} ${data.appliance.type || ''}`.trim() || 'Appliance';
    document.getElementById('job-bar').classList.add('show');

    // Action bar: address + phone for tap-to-navigate / tap-to-call.
    // get_job_for_dashboard already resolves job.service_X → customer.X fallback.
    const c = data.customer || {};
    const parts = [c.address, c.city, c.state, c.zip].filter(Boolean);
    jobAddress = parts.join(', ');
    customerPhone = c.phone || '';
    document.getElementById('action-bar').classList.add('show');

    document.getElementById('main-area').innerHTML = '<div class="chat" id="chat"></div>';
    chatEl = document.getElementById('chat');

    document.getElementById('input-wrap').classList.add('show');
    showQuickActions();

    setupSpeechRecognition();

    // Pre-load existing tech_assist_session conversation transcript so the tech
    // sees the SMS opening message + any prior turns when they open this page.
    await preloadHistory();

  } catch (err) {
    showError('Could not load job', err.message);
  }
}

async function preloadHistory() {
  try {
    const url = assistSessionId
      ? `${XANO_BASE}/get_tech_assist_session_history?session_id=${assistSessionId}&limit=20`
      : `${XANO_BASE}/get_tech_assist_session_history?job_id=${JOB_ID}&technician_id=${TECH_ID}&limit=20`;
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    if (!data || data.success !== true) return;
    if (data.session_id) assistSessionId = data.session_id;
    const msgs = Array.isArray(data.messages) ? data.messages : [];
    if (msgs.length === 0) {
      addSystem('', 'no prior messages - send your first finding to ant');
      return;
    }
    for (const m of msgs) {
      if (!m || !m.role) continue;
      const c = (typeof m.content === 'string') ? m.content : JSON.stringify(m.content || '');
      addMessage(m.role, c);
    }
  } catch (e) {
    console.warn('preloadHistory failed:', e);
  }
}

function showError(title, msg) {
  document.getElementById('main-area').innerHTML = `
    <div class="error-screen">
      <h2>⚠️ ${escapeHtml(title)}</h2>
      <p>${escapeHtml(msg)}</p>
    </div>
  `;
}

async function sendMessage() {
  const input = document.getElementById('input-msg');
  const text = input.value.trim();
  if (!text || isSubmitting) return;
  input.value = '';
  autoGrow(input);
  await sendToAnt(text, false);
}

async function sendToAnt(text, hideUserMsg) {
  if (!hideUserMsg) addMessage('user', text);
  showTyping();

  try {
    const res = await fetch(`${XANO_BASE}/tech_assist_chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        job_id: parseInt(JOB_ID, 10),
        technician_id: parseInt(TECH_ID, 10),
        user_message: text,
        session_id: assistSessionId,
        attachment_ids: []
      })
    });

    hideTyping();

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Ant error (${res.status}): ${errText.slice(0, 200)}`);
    }

    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Ant returned no success');

    if (data.session_id) assistSessionId = data.session_id;
    if (data.captured_data) collectedData = Object.assign({}, collectedData, data.captured_data);

    addMessage('assistant', data.reply);

    conversationHistory.push({ role: 'user', content: text });
    conversationHistory.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    hideTyping();
    addSystem('error', '⚠️ ' + err.message);
  }
}

function addMessage(role, content) {
  if (!chatEl) return;

  // Strip CaptureOverlay request tokens BEFORE rendering and dispatch overlay.
  let visibleContent = content || '';
  if (role === 'assistant' && typeof visibleContent === 'string') {
    if (visibleContent.includes('__REQUEST_VIDEO__')) {
      visibleContent = visibleContent.replace(/__REQUEST_VIDEO__/g, '').trim();
      if (typeof window.CaptureOverlay !== 'undefined' && window.CaptureOverlay.openVideoCapture) {
        setTimeout(() => window.CaptureOverlay.openVideoCapture((blob, mime) => {
          if (blob) uploadCapturedBlob(blob, mime, 'video');
        }), 250);
      }
    }
    if (visibleContent.includes('__REQUEST_MODEL_PHOTO__')) {
      visibleContent = visibleContent.replace(/__REQUEST_MODEL_PHOTO__/g, '').trim();
      if (typeof window.CaptureOverlay !== 'undefined' && window.CaptureOverlay.openPhotoCapture) {
        setTimeout(() => window.CaptureOverlay.openPhotoCapture((blob, mime) => {
          if (blob) uploadCapturedBlob(blob, mime, 'photo');
        }), 250);
      }
    }
  }

  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  if (role === 'assistant') {
    const tag = document.createElement('div');
    tag.className = 'ant-tag';
    tag.textContent = '🐜 Ant';
    msg.appendChild(tag);
    const textNode = document.createElement('div');
    textNode.textContent = visibleContent;
    msg.appendChild(textNode);
  } else {
    msg.textContent = visibleContent;
  }
  chatEl.appendChild(msg);
  scrollToBottom();
}

// Upload a CaptureOverlay-produced blob through the same pipeline as file picker.
async function uploadCapturedBlob(blob, mimeType, kind) {
  const ext = (mimeType && mimeType.includes('mp4')) ? 'mp4'
            : (mimeType && mimeType.includes('webm')) ? 'webm'
            : (kind === 'video') ? 'mp4' : 'jpg';
  const filename = (kind === 'video' ? 'capture-' : 'photo-') + Date.now() + '.' + ext;
  const file = new File([blob], filename, { type: mimeType || (kind === 'video' ? 'video/mp4' : 'image/jpeg') });
  uploadFile(file);
}

async function uploadFile(file) {
  if (!chatEl) return;
  const msgEl = document.createElement('div');
  msgEl.className = 'upload-msg';
  msgEl.innerHTML = `
    <div class="filename">${escapeHtml(file.name)}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:5%"></div></div>
    <div class="status">Starting upload...</div>
  `;
  chatEl.appendChild(msgEl);
  scrollToBottom();

  const updateProgress = (pct, status) => {
    const fill = msgEl.querySelector('.progress-fill');
    const stat = msgEl.querySelector('.status');
    if (fill) fill.style.width = pct + '%';
    if (stat) stat.textContent = status;
  };

  const setError = (msg) => {
    msgEl.classList.add('error');
    updateProgress(100, '❌ ' + msg);
  };

  const setSuccess = () => {
    msgEl.classList.add('success');
    updateProgress(100, '✓ Uploaded');
  };

  try {
    updateProgress(10, 'Preparing...');

    const fileType = file.type.startsWith('video/') ? 'video' : 'photo';
    const xanoBody = {
      job_id: parseInt(JOB_ID, 10),
      attachment_type: 'tdr',
      file_type: fileType,
      original_filename: file.name,
      mime_type: file.type || 'application/octet-stream',
      uploaded_by: 'tech',
      tech_id: parseInt(TECH_ID, 10)
    };

    const xanoRes = await fetch(`${XANO_BASE}/generate_upload_url`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(xanoBody)
    });
    if (!xanoRes.ok) {
      const t = await xanoRes.text();
      throw new Error(`Xano (${xanoRes.status}): ${t.slice(0,80)}`);
    }
    const xanoData = await xanoRes.json();
    if (!xanoData.success) throw new Error('Xano returned no success');

    updateProgress(20, 'Got upload URL...');

    const presignRes = await fetch(`${NETLIFY_BASE}/.netlify/functions/s3-presign`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        s3_key: xanoData.s3_key,
        mime_type: file.type || 'application/octet-stream'
      })
    });
    if (!presignRes.ok) {
      const t = await presignRes.text();
      throw new Error(`Sign (${presignRes.status}): ${t.slice(0,80)}`);
    }
    const presignData = await presignRes.json();
    if (!presignData.success) throw new Error('Presign no success');

    updateProgress(30, 'Uploading...');

    await uploadToS3(file, presignData.upload_url, (pct) => {
      updateProgress(30 + pct * 0.6, `Uploading ${Math.round(pct)}%`);
    });

    updateProgress(95, 'Finalizing...');

    await fetch(`${XANO_BASE}/save_attachment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        attachment_id: xanoData.attachment_id,
        file_size_bytes: file.size
      })
    });

    setSuccess();
    const description = file.type.startsWith('video/') ? 'video' : 'photo';
    sendToAnt(`I just uploaded a ${description}: ${file.name}`, false);

  } catch (err) {
    console.error(err);
    setError(err.message || 'Upload failed');
  }
}

function uploadToS3(file, url, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress((e.loaded / e.total) * 100);
    };
    xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error('S3 ' + xhr.status));
    xhr.onerror = () => reject(new Error('S3 network error'));
    xhr.open('PUT', url);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.send(file);
  });
}

function setupSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('btn-mic').style.display = 'none';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const input = document.getElementById('input-msg');
    input.value = (input.value + ' ' + transcript).trim();
    autoGrow(input);
    input.focus();
  };

  recognition.onend = () => {
    isRecording = false;
    document.getElementById('btn-mic').classList.remove('recording');
  };

  recognition.onerror = (e) => {
    console.warn('Speech error:', e.error);
    isRecording = false;
    document.getElementById('btn-mic').classList.remove('recording');
  };
}

function toggleRecording() {
  if (!recognition) return;
  if (isRecording) {
    recognition.stop();
  } else {
    try {
      recognition.start();
      isRecording = true;
      document.getElementById('btn-mic').classList.add('recording');
    } catch (e) {
      console.warn('Mic error:', e);
    }
  }
}

  })[c]);
}

      toolbarEl.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Capture photo');
      btn.style.cssText = 'background:#fff;border:6px solid rgba(255,255,255,0.4);border-radius:50%;width:74px;height:74px;cursor:pointer;padding:0;';
      btn.addEventListener('click', capturePhoto);
      toolbarEl.appendChild(btn);
    }
  }
  function renderToolbarRecording() {
    toolbarEl.innerHTML = '';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.style.cssText = 'background:#dc3545;color:#fff;border:0;border-radius:36px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;';
    btn.innerHTML = '<span style="width:14px;height:14px;background:#fff;display:inline-block;"></span> Stop';
    btn.addEventListener('click', stopRecording);
    toolbarEl.appendChild(btn);
  }
  function renderToolbarReview() {
    toolbarEl.innerHTML = '';
    const useBtn = document.createElement('button');
    useBtn.type = 'button';
    useBtn.textContent = 'Use This';
    useBtn.style.cssText = 'background:#28a745;color:#fff;border:0;border-radius:8px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;flex:1;';
    useBtn.addEventListener('click', useResult);

    const retakeBtn = document.createElement('button');
    retakeBtn.type = 'button';
    retakeBtn.textContent = 'Retake';
    retakeBtn.style.cssText = 'background:#6c757d;color:#fff;border:0;border-radius:8px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;flex:1;';
    retakeBtn.addEventListener('click', retake);

    toolbarEl.appendChild(retakeBtn);
    toolbarEl.appendChild(useBtn);
  }
  function renderToolbarEmpty() { toolbarEl.innerHTML = ''; }

  async function startStream() {
    state = 'opening';
    renderToolbarEmpty();
    hideError();

    const constraints = mode === 'video'
      ? { video: { facingMode: { ideal: 'environment' } }, audio: true }
      : { video: { facingMode: { ideal: 'environment' } }, audio: false };

    try {
      ext('Requesting camera (' + mode + ' mode)...');
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      ext('Permission granted; tracks: ' + stream.getTracks().map(t => t.kind).join(','));

      videoEl.srcObject = stream;
      try { await videoEl.play(); } catch (e) { ext('preview play warn: ' + e.message, true); }

      showLive();
      state = 'ready';
      renderToolbarReady();
    } catch (err) {
      ext('getUserMedia failed: ' + err.name + ': ' + err.message, true);
      handleStreamError(err);
    }
  }

  function handleStreamError(err) {
    state = 'error';
    let msg = 'Camera unavailable.';
    let hint = '';
    if (err.name === 'NotAllowedError') {
      msg = 'Camera permission denied.';
      hint = 'Settings → Safari → Camera + Microphone, then reload.';
    } else if (err.name === 'NotFoundError') {
      msg = 'No camera found on this device.';
      hint = 'You can still pick a file from your gallery.';
    } else if (err.name === 'NotReadableError') {
      msg = 'Camera is in use by another app.';
      hint = 'If you are on a phone call, hang up and tap Retry.';
    } else if (err.name === 'OverconstrainedError') {
      msg = 'Back camera not available.';
      hint = 'Tap Retry — we will try the front camera instead.';
    } else {
      hint = err.message;
    }
    errorMsgEl.textContent = msg;
    errorHintEl.textContent = hint;
    showError(true);
    renderToolbarEmpty();
  }

  function stopStream() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if (videoEl) videoEl.srcObject = null;
  }

  function startRecording() {
    if (state !== 'ready' || !stream) return;
    chunks = [];
    const mimeType = pickVideoMimeType();
    ext('Starting recording, mimeType: ' + (mimeType || '(default)'));

    try {
      recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    } catch (e) {
      ext('MediaRecorder ctor failed: ' + e.message + ' — retrying default', true);
      try { recorder = new MediaRecorder(stream); }
      catch (e2) { ext('MediaRecorder unavailable: ' + e2.message, true); openFallbackPicker(); return; }
    }

    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onerror = (e) => { ext('Recorder error: ' + (e.error ? e.error.name : '?'), true); };
    recorder.onstop = onRecorderStop;

    recorder.start(250);
    state = 'recording';
    recDotEl.style.display = 'flex';
    countdownEl.style.display = 'block';
    countdownEl.textContent = '10';
    renderToolbarRecording();

    let secondsLeft = 10;
    countdownTimer = setInterval(() => {
      secondsLeft--;
      countdownEl.textContent = secondsLeft;
      if (secondsLeft <= 0) {
        clearInterval(countdownTimer); countdownTimer = null;
        ext('10s reached, auto-stopping');
        stopRecording();
      }
    }, 1000);
  }

  function stopRecording() {
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    if (recorder && recorder.state !== 'inactive') {
      try { recorder.stop(); } catch (e) { ext('recorder.stop error: ' + e.message, true); }
    }
  }

  function onRecorderStop() {
    countdownEl.style.display = 'none';
    recDotEl.style.display = 'none';

    const type = (recorder && recorder.mimeType) || (chunks[0] && chunks[0].type) || 'video/webm';
    recordedBlob = new Blob(chunks, { type });
    if (recordedUrl) URL.revokeObjectURL(recordedUrl);
    recordedUrl = URL.createObjectURL(recordedBlob);
    ext('Video blob: ' + recordedBlob.size + ' bytes, type=' + recordedBlob.type);

    stopStream();
    playbackEl.src = recordedUrl;
    showPlayback();
    state = 'review';
    renderToolbarReview();
  }

  function capturePhoto() {
    if (state !== 'ready' || !stream) return;
    const w = videoEl.videoWidth || 1280;
    const h = videoEl.videoHeight || 720;
    if (!w || !h) { ext('Video dimensions not ready, retrying soon', true); setTimeout(capturePhoto, 100); return; }

    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(videoEl, 0, 0, w, h);

    canvas.toBlob((blob) => {
      if (!blob) { ext('canvas.toBlob returned null', true); return; }
      recordedBlob = blob;
      if (recordedUrl) URL.revokeObjectURL(recordedUrl);
      recordedUrl = URL.createObjectURL(recordedBlob);
      ext('Photo blob: ' + recordedBlob.size + ' bytes, type=' + recordedBlob.type + ', dim=' + w + 'x' + h);

      stopStream();
      photoEl.src = recordedUrl;
      showPhoto();
      state = 'review';
      renderToolbarReview();
    }, 'image/jpeg', 0.9);
  }

  function useResult() {
    if (!recordedBlob) { ext('useResult called with no blob', true); return; }
    finishAndCallback(recordedBlob, recordedBlob.type);
  }

  function retake() {
    ext('Retake');
    if (recordedUrl) { URL.revokeObjectURL(recordedUrl); recordedUrl = null; }
    recordedBlob = null;
    chunks = [];
    playbackEl.src = '';
    photoEl.src = '';
    startStream();
  }

  function cancel() {
    if (completed) return;
    ext('Canceled');
    finishAndCallback(null, null);
  }

  function finishAndCallback(blob, mimeType) {
    if (completed) return;
    completed = true;
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    stopStream();
    if (recordedUrl && !blob) { URL.revokeObjectURL(recordedUrl); recordedUrl = null; }
    hideOverlay();
    state = 'closed';
    const cb = onCompleteFn;
    onCompleteFn = null;
    chunks = [];
    if (cb) {
      try { cb(blob, mimeType); } catch (e) { console.error('onComplete handler threw:', e); }
    }
  }

  function openFallbackPicker() {
    if (!fallbackInput) {
      fallbackInput = document.createElement('input');
      fallbackInput.type = 'file';
      fallbackInput.style.display = 'none';
      document.body.appendChild(fallbackInput);
    }
    fallbackInput.accept = mode === 'video' ? 'video/*' : 'image/*';
    fallbackInput.value = '';
    fallbackInput.onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) { ext('Fallback picker canceled'); cancel(); return; }
      ext('Fallback picker selected: ' + file.name + ', ' + file.size + ', ' + file.type);
      finishAndCallback(file, file.type || (mode === 'video' ? 'video/mp4' : 'image/jpeg'));
    };
    fallbackInput.click();
  }

  function open(forMode, onComplete) {
    if (state !== 'closed' && state !== 'error') {
      ext('open() called while state=' + state + ', refusing', true);
      return;
    }
    mode = forMode;
    onCompleteFn = (typeof onComplete === 'function') ? onComplete : null;
    completed = false;
    recordedBlob = null;
    chunks = [];

    ensureOverlay();
    modeLabelEl.textContent = mode === 'video' ? 'Record video' : 'Take photo';
    renderToolbarEmpty();
    showOverlay();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      handleStreamError({ name: 'NotSupportedError', message: 'getUserMedia not available' });
      return;
    }
    if (mode === 'video' && typeof MediaRecorder === 'undefined') {
      handleStreamError({ name: 'NotSupportedError', message: 'MediaRecorder not available' });
      return;
    }

    startStream();
  }

  window.CaptureOverlay = {
    openVideoCapture: function(onComplete) { open('video', onComplete); },
    openPhotoCapture: function(onComplete) { open('photo', onComplete); }
  };
})();
</script>
</body>
</html>
