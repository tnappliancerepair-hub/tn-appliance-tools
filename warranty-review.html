<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warranty Review — Ant Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0d12;
      --panel: #131720;
      --panel-2: #1a1e2a;
      --border: #2a3040;
      --border-soft: #1f2530;
      --text: #e8edf5;
      --muted: #8a93aa;
      --accent: #f6cf45;
      --green: #4cd2c0;
      --red: #ff6b6b;
      --orange: #ff9d4a;
      --violet: #a48cf6;
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Bebas Neue', sans-serif;
      --body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--body); }
    .header {
      position: sticky; top: 0; z-index: 5;
      background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 10px 16px; gap: 12px;
    }
    .header .title { font-family: var(--display); letter-spacing: 0.06em; font-size: 20px; color: var(--text); }
    .header .sub { color: var(--muted); font-family: var(--mono); font-size: 11px; }
    .filters { display: flex; gap: 8px; margin-left: auto; }
    .filter-btn {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 12px; font-family: var(--mono); font-size: 12px;
      cursor: pointer;
    }
    .filter-btn:hover { border-color: var(--accent); }
    .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .filter-btn .count { margin-left: 6px; font-weight: 600; opacity: 0.8; }
    .auth-gate {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 9000;
    }
    .auth-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 32px 28px; max-width: 360px; text-align: center;
    }
    .auth-card .ant { font-size: 48px; margin-bottom: 8px; }
    .auth-card input {
      width: 100%; box-sizing: border-box; padding: 12px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; font-family: var(--mono); margin-top: 14px;
    }
    .auth-card button {
      width: 100%; padding: 12px; margin-top: 10px; background: var(--accent);
      color: var(--bg); border: none; border-radius: 8px; cursor: pointer;
      font-family: var(--display); letter-spacing: 0.05em; font-size: 16px;
    }
    .auth-err { color: var(--red); font-size: 12px; min-height: 14px; margin-top: 6px; }
    .content { padding: 16px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .card.escalate { border-color: var(--red); box-shadow: 0 0 0 1px rgba(255,107,107,0.15); }
    .card.flags { border-color: var(--orange); }
    .card.clear { border-color: var(--green); }
    .card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .card .job-link {
      color: var(--accent); font-family: var(--display); letter-spacing: 0.04em;
      font-size: 16px; text-decoration: none;
    }
    .card .vendor {
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 8px; font-family: var(--mono); font-size: 11px; color: var(--text);
    }
    .card .pill {
      font-family: var(--mono); font-size: 10px; padding: 2px 8px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .card .pill.escalate { background: rgba(255,107,107,0.15); color: var(--red); border: 1px solid var(--red); }
    .card .pill.flags { background: rgba(255,157,74,0.15); color: var(--orange); border: 1px solid var(--orange); }
    .card .pill.clear { background: rgba(76,210,192,0.15); color: var(--green); border: 1px solid var(--green); }
    .card .meta { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-top: 4px; }
    .card .media-strip { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .card .media-thumb { width:56px; height:56px; border-radius:6px; overflow:hidden; cursor:pointer; border:1px solid rgba(255,255,255,0.15); background:#0a0a0a; position:relative; transition:border-color 0.15s; }
    .card .media-thumb:hover { border-color: var(--accent, #74e3c4); }
    .card .media-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .card .media-thumb.video { display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; background:#000; }
    .card .media-thumb.placeholder { background:#222; }
    .card .media-strip .download-all { display:inline-flex; align-items:center; padding:0 10px; height:56px; border-radius:6px; background:rgba(76,167,255,0.10); border:1px solid rgba(76,167,255,0.35); color:#4ca7ff; font-size:11px; font-weight:600; cursor:pointer; }
    .card .media-strip .download-all:hover { background:rgba(76,167,255,0.18); }
    .card .media-label { color:var(--muted); font-size:11px; margin-top:6px; }

    /* Submission status badges (Phase 0 — warranty_submissions table) */
    .sub-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:12px; font-size:11px; font-weight:600; font-family:var(--mono); margin-left:6px; }
    .sub-badge.submitted { background:rgba(76,167,255,0.15); color:#4ca7ff; border:1px solid rgba(76,167,255,0.4); }
    .sub-badge.paid      { background:rgba(76,210,192,0.18); color:#4cd2c0; border:1px solid rgba(76,210,192,0.5); }
    .sub-badge.denied    { background:rgba(255,107,107,0.15); color:#ff6b6b; border:1px solid rgba(255,107,107,0.4); }
    .sub-badge.failed    { background:rgba(255,157,74,0.15); color:#ff9d4a; border:1px solid rgba(255,157,74,0.4); }
    .sub-badge.pending   { background:rgba(255,255,255,0.05); color:#9aa1ad; border:1px solid rgba(255,255,255,0.15); }

    /* Per-field paste cards (ported from office-today) */
    .paste-fields { display:flex; flex-direction:column; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08); }
    .paste-fields.collapsed { display:none; }
    .field-row { display:flex; align-items:center; gap:8px; padding:6px 8px; background:rgba(255,255,255,0.03); border-radius:6px; }
    .field-row .label { font-family:var(--mono); font-size:10px; color:var(--muted); min-width:90px; text-transform:uppercase; }
    .field-row .value { flex:1; font-size:13px; color:#e8eaf0; word-break:break-word; }
    .field-row .copy-btn { background:transparent; border:1px solid rgba(255,255,255,0.15); color:#9aa1ad; border-radius:5px; padding:3px 7px; font-size:12px; cursor:pointer; }
    .field-row .copy-btn:hover { background:rgba(255,255,255,0.06); color:#fff; }
    .field-row .copy-btn.copied { background:rgba(76,210,192,0.15); border-color:#4cd2c0; color:#4cd2c0; }

    /* Action buttons */
    .card .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .card .btn { padding:7px 12px; border-radius:6px; font-size:12px; font-weight:600; font-family:var(--mono); cursor:pointer; border:1px solid; text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
    .card .btn-portal { background:rgba(255,193,7,0.12); border-color:rgba(255,193,7,0.45); color:#ffc107; }
    .card .btn-success { background:rgba(76,210,192,0.12); border-color:rgba(76,210,192,0.45); color:#4cd2c0; }
    .card .btn-secondary { background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.15); color:#d4d6dc; }
    .card .btn-zip { background:rgba(76,167,255,0.10); border-color:rgba(76,167,255,0.35); color:#4ca7ff; }
    .card .btn:hover { filter:brightness(1.15); }

    /* Mark-submitted inline form */
    .mark-form { display:none; flex-direction:column; gap:8px; padding:10px 12px; background:rgba(76,210,192,0.05); border:1px solid rgba(76,210,192,0.25); border-radius:6px; margin-top:10px; }
    .mark-form.open { display:flex; }
    .mark-form input, .mark-form textarea { background:#0a0a0a; border:1px solid rgba(255,255,255,0.15); color:#fff; border-radius:5px; padding:7px 9px; font-size:13px; font-family:inherit; }
    .mark-form textarea { min-height:50px; resize:vertical; }
    .mark-form .row { display:flex; gap:8px; }
    .mark-form .row > * { flex:1; }
    .mark-form select { background:#0a0a0a; border:1px solid rgba(255,255,255,0.15); color:#fff; border-radius:5px; padding:7px 9px; font-size:13px; }
    .card pre {
      background: var(--bg); border: 1px solid var(--border-soft); border-radius: 6px;
      padding: 10px; margin-top: 10px;
      color: var(--text); font-family: var(--mono); font-size: 12px;
      white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto;
    }
    .card .expand {
      margin-top: 6px; background: transparent; border: none; color: var(--accent);
      cursor: pointer; font-family: var(--mono); font-size: 11px;
    }
    .empty {
      padding: 60px 20px; text-align: center; color: var(--muted); font-family: var(--mono);
    }
    .empty .big { font-size: 48px; margin-bottom: 12px; }
    .loading { color: var(--muted); font-family: var(--mono); padding: 30px; text-align: center; }
    .err { color: var(--red); font-family: var(--mono); padding: 30px; text-align: center; }
  </style>
  <!-- JSZip for client-side photo bundle downloads. CSP already allows
       cdnjs.cloudflare.com (see netlify.toml). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script src="/ant-spine.js" defer></script>
  <script src="/parts-search-modal.js" defer></script>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="ant">🐜</div>
    <div style="font-family:var(--display);font-size:24px;letter-spacing:0.06em">Warranty Review</div>
    <div style="color:var(--muted);font-size:12px;margin-top:4px">Ant Office</div>
    <input id="authInput" type="password" placeholder="Office password" autocomplete="off">
    <button id="authSubmit">Unlock</button>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <div>
      <div class="title">Warranty Review</div>
      <div class="sub" id="windowLabel">Last 30 days</div>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All <span class="count" id="cAll">0</span></button>
      <button class="filter-btn" data-filter="escalate">Escalate <span class="count" id="cEsc">0</span></button>
      <button class="filter-btn" data-filter="flags">Flags <span class="count" id="cFlg">0</span></button>
      <button class="filter-btn" data-filter="clear">Clear <span class="count" id="cClr">0</span></button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading warranty claim packages…</div>
  </div>
</div>

<script>
(function() {
  'use strict';
  const OFFICE_AUTH_KEY = 'tn_office_auth_v1';
  const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';

  const params = new URLSearchParams(window.location.search);
  const daysBack = parseInt(params.get('days') || '30', 10);
  document.getElementById('windowLabel').textContent = `Last ${daysBack} days`;

  // Auth
  const authGate = document.getElementById('authGate');
  const authInput = document.getElementById('authInput');
  const authSubmit = document.getElementById('authSubmit');
  const authErr = document.getElementById('authErr');
  const app = document.getElementById('app');
  const content = document.getElementById('content');

  function tryUnlock() {
    if (localStorage.getItem(OFFICE_AUTH_KEY) === '1') return unlock();
    authGate.style.display = 'flex';
    setTimeout(() => authInput.focus(), 40);
  }
  function unlock() {
    authGate.style.display = 'none';
    app.style.display = 'block';
    load();
  }
  authSubmit.addEventListener('click', () => {
    if (authInput.(await __verifyOfficePassword(value))) {
      localStorage.setItem(OFFICE_AUTH_KEY, '1');
      unlock();
    } else {
      authErr.textContent = 'Wrong password.';
    }
  });
  authInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') authSubmit.click(); });

  let allRows = [];
  let currentFilter = 'all';

  async function load() {
    try {
      const res = await fetch(`${XANO_BASE}/list_warranty_claim_actions?days_back=${daysBack}&per_page=200`);
      if (!res.ok) throw new Error(`Load failed (${res.status})`);
      const data = await res.json();
      if (!data.success) throw new Error('Server returned no success');
      allRows = data.rows || [];
      updateCounts();
      render();
    } catch (err) {
      content.innerHTML = `<div class="err">⚠️ ${escapeHtml(err.message)}</div>`;
    }
  }

  function statusOf(r) {
    if (r.escalate) return 'escalate';
    if (Number(r.high_flags) > 0) return 'flags';
    return 'clear';
  }

  function updateCounts() {
    let esc = 0, flg = 0, clr = 0;
    for (const r of allRows) {
      const s = statusOf(r);
      if (s === 'escalate') esc += 1;
      else if (s === 'flags') flg += 1;
      else clr += 1;
    }
    document.getElementById('cAll').textContent = allRows.length;
    document.getElementById('cEsc').textContent = esc;
    document.getElementById('cFlg').textContent = flg;
    document.getElementById('cClr').textContent = clr;
  }

  function render() {
    const filtered = currentFilter === 'all'
      ? allRows
      : allRows.filter((r) => statusOf(r) === currentFilter);

    if (filtered.length === 0) {
      content.innerHTML = `
        <div class="empty">
          <div class="big">🐜</div>
          <div>No warranty claim packages in this window.</div>
          <div style="margin-top:6px;font-size:11px">Claims appear here when warranty_claim_request_*_claims agents fire on TDR_COMPLETE.</div>
        </div>
      `;
      return;
    }

    const parts = [];
    for (const r of filtered) {
      const s = statusOf(r);
      const created = new Date(r.created_at);
      const createdStr = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Chicago',
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true,
      }).format(created);
      const pill = s === 'escalate' ? '<span class="pill escalate">escalate</span>'
        : s === 'flags' ? `<span class="pill flags">${r.high_flags} flag${r.high_flags === 1 ? '' : 's'}</span>`
        : '<span class="pill clear">clear</span>';
      parts.push(`
        <div class="card ${s}" data-job-id="${r.job_id}">
          <div class="row1">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <a class="job-link" href="job-detail.html?job_id=${r.job_id}">Job #${r.job_id}</a>
              <span class="vendor">${escapeHtml(r.vendor || r.specialty || '?')}</span>
              ${pill}
              <span class="sub-badge-slot" data-sub-badge="${r.job_id}"></span>
            </div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--muted)">${createdStr} CT</div>
          </div>
          <div class="meta">generated by ${escapeHtml(r.generated_by || 'unknown')} · #${r.id}</div>
          <div class="media-label" data-media-label="${r.job_id}" style="display:none">📎 customer media for portal submission</div>
          <div class="media-strip" data-media-strip="${r.job_id}"></div>
          <pre id="text-${r.id}" style="display:none">${escapeHtml(r.claim_action_text)}</pre>
          <div class="paste-fields collapsed" id="pf-${r.job_id}"></div>
          <div class="mark-form" id="mf-${r.job_id}">
            <input type="text" id="mf-conf-${r.job_id}" placeholder="Vendor confirmation # (paste here)">
            <textarea id="mf-notes-${r.job_id}" placeholder="Notes (optional)"></textarea>
            <div class="row">
              <select id="mf-status-${r.job_id}">
                <option value="submitted">Submitted</option>
                <option value="paid">Paid</option>
                <option value="denied">Denied</option>
                <option value="failed">Failed</option>
                <option value="pending">Pending (re-open)</option>
              </select>
              <input type="number" step="0.01" id="mf-amount-${r.job_id}" placeholder="$ paid (if paid)">
            </div>
            <div class="row">
              <button class="btn btn-success" data-mark-save="${r.job_id}" data-vendor="${escapeAttr(r.vendor || r.specialty || '')}">💾 Save</button>
              <button class="btn btn-secondary" data-mark-cancel="${r.job_id}">Cancel</button>
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" data-toggle="${r.id}">Show claim package ↓</button>
            <button class="btn btn-secondary" data-paste="${r.job_id}">📋 Show paste fields ↓</button>
            ${(() => {
              const url = vendorPortalUrl(r.vendor || r.specialty);
              return url ? `<a class="btn btn-portal" href="${url}" target="_blank" rel="noopener">Open ${escapeHtml(r.vendor || r.specialty || 'vendor')} portal ↗</a>` : '';
            })()}
            <button class="btn btn-success" data-mark-open="${r.job_id}">✓ Mark submitted</button>
            <button class="btn btn-zip" data-zip="${r.job_id}" style="display:none">⇩ Download photos zip</button>
            <button class="btn btn-secondary" data-correction="${r.id}" data-vendor="${escapeHtml((r.vendor || r.specialty || '').toLowerCase().replace(/\s+/g,''))}" data-job="${r.job_id}" style="background:rgba(255,193,7,0.10);border-color:rgba(255,193,7,0.4);color:#ffc107">🚩 Mark gap</button>
          </div>
        </div>
      `);
    }
    content.innerHTML = parts.join('');

    content.querySelectorAll('[data-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggle;
        const pre = document.getElementById(`text-${id}`);
        if (!pre) return;
        const showing = pre.style.display !== 'none';
        pre.style.display = showing ? 'none' : 'block';
        btn.textContent = showing ? 'Show claim package ↓' : 'Hide ↑';
      });
    });

    content.querySelectorAll('[data-correction]').forEach((btn) => {
      btn.addEventListener('click', () => openCorrectionModal({
        rowId: btn.dataset.correction,
        vendor: btn.dataset.vendor,
        jobId: btn.dataset.job,
      }));
    });

    // Mark-submitted handlers
    content.querySelectorAll('[data-mark-open]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const jid = btn.dataset.markOpen;
        const form = document.getElementById('mf-' + jid);
        if (form) form.classList.add('open');
      });
    });
    content.querySelectorAll('[data-mark-cancel]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const jid = btn.dataset.markCancel;
        const form = document.getElementById('mf-' + jid);
        if (form) form.classList.remove('open');
      });
    });
    content.querySelectorAll('[data-mark-save]').forEach((btn) => {
      btn.addEventListener('click', () => markSubmittedSave(btn));
    });

    // Paste-fields expand
    content.querySelectorAll('[data-paste]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const jid = btn.dataset.paste;
        const pf = document.getElementById('pf-' + jid);
        if (!pf) return;
        const open = !pf.classList.contains('collapsed');
        if (open) {
          pf.classList.add('collapsed');
          btn.textContent = '📋 Show paste fields ↓';
        } else {
          pf.classList.remove('collapsed');
          btn.textContent = '📋 Hide paste fields ↑';
        }
      });
    });

    // Photo zip handlers
    content.querySelectorAll('[data-zip]').forEach((btn) => {
      btn.addEventListener('click', () => downloadPhotoZip(btn.dataset.zip));
    });

    // Async hydration passes
    const allJobIds = filtered.map((r) => r.job_id);
    hydrateMediaStrips(allJobIds).catch(() => {});
    hydrateSubmissionStatus(allJobIds).catch(() => {});
    hydratePasteFields(allJobIds).catch(() => {});
  }

  // Vendor-portal direct deep-links. When a real new-claim URL is known
  // we drop the user straight into that form instead of the homepage.
  function vendorPortalUrl(rawVendor) {
    const v = (rawVendor || '').toLowerCase().replace(/\s+/g, '');
    const map = {
      ahs:            'https://contractors.ahs.com/dashboard',
      americanhome:   'https://contractors.ahs.com/dashboard',
      frontdoor:      'https://platform.frontdoor.com',
      servicepower:   'https://hub.servicepower.com',
      squaretrade:    'https://www.squaretrade.com/login',
      allstate:       'https://hub.servicepower.com',
      nsa:            'https://www.nsahomewarranty.com',
    };
    return map[v] || '';
  }

  function escapeAttr(s) {
    return String(s||'').replace(/"/g,'&quot;').replace(/'/g,"&#39;");
  }

  async function hydrateSubmissionStatus(jobIds) {
    const uniq = Array.from(new Set(jobIds.filter(Boolean)));
    if (uniq.length === 0) return;
    let subs = [];
    try {
      const r = await fetch(`${XANO_BASE}/list_warranty_submissions_for_jobs`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_ids_csv: uniq.join(',') }),
      });
      const d = await r.json();
      subs = (d && d.submissions) || [];
    } catch (_) { return; }
    for (const s of subs) {
      const slot = document.querySelector(`[data-sub-badge="${s.job_id}"]`);
      if (!slot) continue;
      const status = (s.status || 'pending').toLowerCase();
      const cls = ['submitted','paid','denied','failed','pending'].includes(status) ? status : 'pending';
      const label = status === 'paid' && s.paid_amount
        ? `paid $${Number(s.paid_amount).toFixed(2)}`
        : status;
      const confSuffix = s.confirmation_id ? ` · ${escapeHtml(s.confirmation_id)}` : '';
      slot.innerHTML = `<span class="sub-badge ${cls}" title="submitted ${new Date(s.last_attempt_at || 0).toLocaleString('en-US',{timeZone:'America/Chicago'})}">${escapeHtml(label)}${confSuffix}</span>`;
      // Pre-fill the inline form with prior values so re-marking is quick.
      const confInput   = document.getElementById('mf-conf-'   + s.job_id);
      const statusInput = document.getElementById('mf-status-' + s.job_id);
      const amountInput = document.getElementById('mf-amount-' + s.job_id);
      if (confInput && s.confirmation_id)  confInput.value   = s.confirmation_id;
      if (statusInput && s.status)         statusInput.value = s.status;
      if (amountInput && s.paid_amount)    amountInput.value = s.paid_amount;
    }
  }

  async function hydratePasteFields(jobIds) {
    const uniq = Array.from(new Set(jobIds.filter(Boolean)));
    if (uniq.length === 0) return;
    let bundles = [];
    try {
      const r = await fetch(`${XANO_BASE}/get_warranty_card_bundle_for_jobs`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_ids_csv: uniq.join(',') }),
      });
      const d = await r.json();
      bundles = (d && d.bundles) || [];
    } catch (_) { return; }
    for (const b of bundles) {
      const host = document.getElementById('pf-' + b.job_id);
      if (!host) continue;
      const c = b.customer || {};
      const t = b.tech || {};
      const tdr = b.tdr || {};
      const custName = ((c.first_name||'') + ' ' + (c.last_name||'')).trim() || '(no name)';
      const addr = [c.address, c.city, c.state, c.zip].filter(Boolean).join(', ');
      const fields = [
        ['Claim #',          b.claim_number || b.dispatch_id || ''],
        ['Vendor',           b.warranty_company || ''],
        ['Customer',         custName],
        ['Phone',            c.phone || ''],
        ['Address',          addr],
        ['Email',            c.email || ''],
        ['Appliance',        [b.brand, b.appliance_type].filter(Boolean).join(' ')],
        ['Model #',          b.model_number || ''],
        ['Serial #',         b.serial_number || ''],
        ['Problem',          b.problem_summary || ''],
        ['Diagnosis',        tdr.diagnosis || ''],
        ['Failed component', tdr.failed_component || ''],
        ['Failure cause',    tdr.failure_cause || ''],
        ['Repair completed', tdr.repair_completed || ''],
        ['Labor (hrs)',      (tdr.labor_time_hours != null) ? String(tdr.labor_time_hours) : ''],
        ['Tech',             ((t.first_name||'') + ' ' + (t.last_name||'')).trim() || '(unassigned)'],
      ];
      // Part # row with confidence badge — LOW/GUESS badges are tappable
      // to re-open the search modal for re-verification.
      const partNum = tdr.verified_part_number || '';
      const partConf = (tdr.verified_part_confidence || 'UNVERIFIED').toUpperCase();
      let partBadgeHtml = '';
      if (partNum && window.PartsSearch && window.PartsSearch.renderBadge) {
        partBadgeHtml = ' ' + window.PartsSearch.renderBadge(partConf, {
          reopenPrefill: { brand: b.brand || '', model_number: b.model_number || '', failed_component: tdr.failed_component || '', job_id: b.job_id },
        });
      }
      const partsRow = `
        <div class="field-row">
          <div class="label">Part #</div>
          <div class="value">${escapeHtml(partNum || '(none)')}${partBadgeHtml}</div>
          ${partNum ? `<button class="copy-btn" data-copy-val="${escapeAttr(partNum)}" title="Copy">📋</button>` : ''}
        </div>`;
      host.innerHTML = partsRow + fields.map((f, i) => `
        <div class="field-row">
          <div class="label">${escapeHtml(f[0])}</div>
          <div class="value">${escapeHtml(f[1] || '(none)')}</div>
          <button class="copy-btn" data-copy-val="${escapeAttr(f[1] || '')}" title="Copy">📋</button>
        </div>
      `).join('');
      host.querySelectorAll('[data-copy-val]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.copyVal || '';
          navigator.clipboard.writeText(val).then(() => {
            btn.classList.add('copied');
            btn.textContent = '✓';
            setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋'; }, 1200);
          }).catch(() => alert('Clipboard write failed'));
        });
      });
    }
  }

  async function markSubmittedSave(btn) {
    const jid = Number(btn.dataset.markSave);
    if (!jid) return;
    const vendor = btn.dataset.vendor || '';
    const conf = (document.getElementById('mf-conf-' + jid).value || '').trim();
    const status = document.getElementById('mf-status-' + jid).value || 'submitted';
    const notes = (document.getElementById('mf-notes-' + jid).value || '').trim();
    const amount = parseFloat(document.getElementById('mf-amount-' + jid).value || '0') || 0;
    if (!conf && status === 'submitted') {
      if (!confirm('No confirmation # entered. Save anyway?')) return;
    }
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const r = await fetch(`${XANO_BASE}/record_warranty_submission`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          job_id: jid,
          confirmation_id: conf,
          vendor,
          status,
          submission_method: 'mark_submitted_ui',
          paid_amount: amount,
          notes,
          submitted_by: 'office',
        }),
      });
      const d = await r.json();
      if (!d.success) throw new Error(d.error || 'save failed');
      // Refresh status badges for this job
      await hydrateSubmissionStatus([jid]);
      // Collapse the form
      const form = document.getElementById('mf-' + jid);
      if (form) form.classList.remove('open');
    } catch (err) {
      alert('Save failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Save';
    }
  }

  async function downloadPhotoZip(jobId) {
    if (typeof JSZip === 'undefined') {
      alert('Photo zip library not loaded yet. Try again in a moment.');
      return;
    }
    const zipBtn = document.querySelector(`[data-zip="${jobId}"]`);
    if (zipBtn) { zipBtn.disabled = true; zipBtn.textContent = 'Bundling…'; }
    try {
      const r = await fetch(`${XANO_BASE}/get_job_attachments?job_id=${encodeURIComponent(jobId)}`, { cache: 'no-store' });
      const j = await r.json();
      const ready = ((j && j.attachments) || []).filter((a) => a.upload_complete_at && a.s3_key);
      if (ready.length === 0) { alert('No customer media to zip for this job.'); return; }
      const sigRes = await fetch('/.netlify/functions/s3-view-url', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ s3_keys: ready.map((a) => a.s3_key) }),
      });
      const sigData = await sigRes.json();
      const map = {};
      (sigData.signed_urls || []).forEach((u) => { map[u.s3_key] = u.view_url; });
      const zip = new JSZip();
      let i = 1;
      for (const a of ready) {
        const url = map[a.s3_key];
        if (!url) continue;
        const blob = await fetch(url).then(r => r.blob());
        const ext = (a.mime_type || a.file_type || 'jpg').toLowerCase().includes('video') ? 'mp4' : ((a.mime_type || '').split('/')[1] || 'jpg');
        const isVid = (a.file_type || '').startsWith('video') || (a.mime_type || '').startsWith('video');
        const label = isVid ? 'video' : 'photo';
        zip.file(`job-${jobId}-${label}-${i++}.${ext}`, blob);
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `job-${jobId}-media.zip`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (err) {
      alert('Zip failed: ' + err.message);
    } finally {
      if (zipBtn) { zipBtn.disabled = false; zipBtn.textContent = '⇩ Download photos zip'; }
    }
  }

  async function hydrateMediaStrips(jobIds) {
    const uniq = Array.from(new Set(jobIds.filter(Boolean)));
    if (uniq.length === 0) return;
    // Fetch attachments per job in parallel (bounded).
    const perJob = await Promise.all(uniq.map(async (jid) => {
      try {
        const r = await fetch(`${XANO_BASE}/get_job_attachments?job_id=${encodeURIComponent(jid)}`, { cache: 'no-store' });
        const j = await r.json();
        const ready = ((j && j.attachments) || []).filter((a) => a.upload_complete_at);
        return { job_id: jid, attachments: ready };
      } catch (_) {
        return { job_id: jid, attachments: [] };
      }
    }));
    const allKeys = [];
    perJob.forEach((p) => p.attachments.forEach((a) => { if (a.s3_key) allKeys.push(a.s3_key); }));
    let urlMap = {};
    if (allKeys.length > 0) {
      try {
        const sigRes = await fetch('/.netlify/functions/s3-view-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ s3_keys: allKeys }),
        });
        const sigData = await sigRes.json();
        if (sigData && sigData.success) {
          (sigData.signed_urls || []).forEach((r) => { urlMap[r.s3_key] = r.view_url; });
        }
      } catch (_) {}
    }
    // Paint each job's strip
    for (const p of perJob) {
      if (p.attachments.length === 0) continue;
      const strip = document.querySelector(`[data-media-strip="${p.job_id}"]`);
      const label = document.querySelector(`[data-media-label="${p.job_id}"]`);
      if (!strip) continue;
      const items = p.attachments.slice(0, 8); // Limit visible thumbs
      const downloadUrls = [];
      const html = items.map((a) => {
        const url = urlMap[a.s3_key] || '';
        if (url) downloadUrls.push(url);
        const isVid = (a.file_type || '').startsWith('video') || (a.mime_type || '').startsWith('video');
        const onClick = url ? `onclick="window.open('${url.replace(/'/g, "\\'")}','_blank')"` : '';
        if (isVid) {
          return `<div class="media-thumb video" ${onClick} title="video">▶</div>`;
        }
        if (url) {
          return `<div class="media-thumb" ${onClick} title="open"><img loading="lazy" src="${url}" alt=""></div>`;
        }
        return `<div class="media-thumb placeholder"></div>`;
      }).join('');
      const overflow = p.attachments.length > items.length
        ? `<div class="media-thumb placeholder" style="display:flex;align-items:center;justify-content:center;color:#9aa1ad;font-size:11px;">+${p.attachments.length - items.length}</div>`
        : '';
      const downloadAll = downloadUrls.length > 0
        ? `<div class="download-all" data-download-job="${p.job_id}">⇩ Open all (${downloadUrls.length})</div>`
        : '';
      strip.innerHTML = html + overflow + downloadAll;
      if (label) label.style.display = '';
      // Reveal the "Download photos zip" button now that we know media exists.
      const zipBtn = document.querySelector(`[data-zip="${p.job_id}"]`);
      if (zipBtn) zipBtn.style.display = '';
      // Attach handler for "open all in tabs"
      const btn = strip.querySelector(`[data-download-job="${p.job_id}"]`);
      if (btn) {
        btn.addEventListener('click', () => {
          downloadUrls.forEach((u, i) => setTimeout(() => window.open(u, '_blank'), i * 120));
        });
      }
    }
  }

  // ── Correction-capture modal (Layer 3a) ───────────────────────────
  function openCorrectionModal({ rowId, vendor, jobId }) {
    let m = document.getElementById('correctionModal');
    if (m) m.remove();
    m = document.createElement('div');
    m.id = 'correctionModal';
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9000;padding:18px';
    m.innerHTML = `
      <div style="background:#131720;border:1px solid #2a3040;border-radius:14px;padding:22px;max-width:480px;width:100%;color:#e8edf5;font-family:inherit">
        <div style="font-size:16px;font-weight:700;margin-bottom:6px">🚩 Teach Ant — flag a gap</div>
        <div style="font-size:12px;color:#8a93aa;margin-bottom:14px">For vendor <b>${escapeHtml(vendor || '?')}</b>. After 3 reports about the same gap, Ant will automatically add it to the checklist.</div>
        <label style="font-size:11px;color:#8a93aa;letter-spacing:0.06em;text-transform:uppercase;font-family:monospace">What's missing?</label>
        <select id="corrType" style="width:100%;background:#0e1118;border:1px solid #2a3040;border-radius:8px;color:#e8edf5;padding:10px;font-size:14px;margin-top:5px;margin-bottom:12px;-webkit-appearance:none">
          <option value="missing_field">Missing field (e.g. portal needed a serial number we didn't have)</option>
          <option value="missing_photo">Missing photo (e.g. portal needed a model tag photo)</option>
          <option value="wrong_value">Wrong value (we had it but it was formatted wrong)</option>
          <option value="rejected_by_portal">Rejected by portal (the worst — auto-promotes immediately)</option>
          <option value="extra_required">Vendor now requires something new</option>
        </select>
        <label style="font-size:11px;color:#8a93aa;letter-spacing:0.06em;text-transform:uppercase;font-family:monospace">Item key (snake_case, like failed_component or serial_tag)</label>
        <input id="corrItemKey" type="text" placeholder="failed_component" style="width:100%;background:#0e1118;border:1px solid #2a3040;border-radius:8px;color:#e8edf5;padding:10px;font-size:14px;margin-top:5px;margin-bottom:12px;font-family:monospace">
        <label style="font-size:11px;color:#8a93aa;letter-spacing:0.06em;text-transform:uppercase;font-family:monospace">Type</label>
        <select id="corrItemType" style="width:100%;background:#0e1118;border:1px solid #2a3040;border-radius:8px;color:#e8edf5;padding:10px;font-size:14px;margin-top:5px;margin-bottom:12px;-webkit-appearance:none">
          <option value="field">field</option>
          <option value="photo">photo</option>
          <option value="video">video</option>
        </select>
        <label style="font-size:11px;color:#8a93aa;letter-spacing:0.06em;text-transform:uppercase;font-family:monospace">Notes (what should Ant ask the tech?)</label>
        <textarea id="corrNotes" rows="3" placeholder="What's the serial number on the tag?" style="width:100%;background:#0e1118;border:1px solid #2a3040;border-radius:8px;color:#e8edf5;padding:10px;font-size:14px;margin-top:5px;margin-bottom:14px;resize:vertical;font-family:inherit"></textarea>
        <div id="corrErr" style="color:#ff6b6b;font-size:12px;min-height:16px;margin-bottom:8px"></div>
        <div style="display:flex;gap:8px">
          <button id="corrCancel" style="flex:1;padding:12px;background:transparent;border:1px solid #2a3040;color:#8a93aa;border-radius:8px;font-weight:700;cursor:pointer">Cancel</button>
          <button id="corrSubmit" style="flex:1;padding:12px;background:#f5a623;color:#1a1100;border:none;border-radius:8px;font-weight:700;cursor:pointer">Save</button>
        </div>
      </div>
    `;
    document.body.appendChild(m);
    m.querySelector('#corrCancel').onclick = () => m.remove();
    m.onclick = (e) => { if (e.target === m) m.remove(); };
    m.querySelector('#corrSubmit').onclick = async () => {
      const corrType = m.querySelector('#corrType').value;
      const itemKey  = (m.querySelector('#corrItemKey').value || '').trim().toLowerCase().replace(/\s+/g,'_');
      const itemType = m.querySelector('#corrItemType').value;
      const notes    = (m.querySelector('#corrNotes').value || '').trim();
      const err      = m.querySelector('#corrErr');
      err.textContent = '';
      if (!itemKey) { err.textContent = 'item key is required'; return; }
      try {
        const res = await fetch(XANO_BASE + '/record_warranty_correction', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            warranty_company: vendor || 'unknown',
            correction_type:  corrType,
            item_key:         itemKey,
            item_type:        itemType,
            field_or_subject: itemKey,
            notes:            notes,
            job_id:           parseInt(jobId || '0', 10),
          }),
        });
        const d = await res.json();
        if (d && d.success) {
          m.querySelector('div > div').innerHTML = `<div style="font-size:18px;font-weight:700;text-align:center;margin:20px 0">✅ Logged. Ant will learn.</div><button id="corrClose" style="width:100%;padding:12px;background:#f5a623;color:#1a1100;border:none;border-radius:8px;font-weight:700;cursor:pointer">Close</button>`;
          m.querySelector('#corrClose').onclick = () => m.remove();
          setTimeout(() => m.remove(), 1800);
        } else {
          err.textContent = d.error || 'save failed';
        }
      } catch (e2) {
        err.textContent = 'network error';
      }
    };
  }

  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  tryUnlock();
})();
