<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warranty Review — Ant Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0d12;
      --panel: #131720;
      --panel-2: #1a1e2a;
      --border: #2a3040;
      --border-soft: #1f2530;
      --text: #e8edf5;
      --muted: #8a93aa;
      --accent: #f6cf45;
      --green: #4cd2c0;
      --red: #ff6b6b;
      --orange: #ff9d4a;
      --violet: #a48cf6;
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Bebas Neue', sans-serif;
      --body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--body); }
    .header {
      position: sticky; top: 0; z-index: 5;
      background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 10px 16px; gap: 12px;
    }
    .header .title { font-family: var(--display); letter-spacing: 0.06em; font-size: 20px; color: var(--text); }
    .header .sub { color: var(--muted); font-family: var(--mono); font-size: 11px; }
    .filters { display: flex; gap: 8px; margin-left: auto; }
    .filter-btn {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 12px; font-family: var(--mono); font-size: 12px;
      cursor: pointer;
    }
    .filter-btn:hover { border-color: var(--accent); }
    .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .filter-btn .count { margin-left: 6px; font-weight: 600; opacity: 0.8; }
    .auth-gate {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 9000;
    }
    .auth-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 32px 28px; max-width: 360px; text-align: center;
    }
    .auth-card .ant { font-size: 48px; margin-bottom: 8px; }
    .auth-card input {
      width: 100%; box-sizing: border-box; padding: 12px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; font-family: var(--mono); margin-top: 14px;
    }
    .auth-card button {
      width: 100%; padding: 12px; margin-top: 10px; background: var(--accent);
      color: var(--bg); border: none; border-radius: 8px; cursor: pointer;
      font-family: var(--display); letter-spacing: 0.05em; font-size: 16px;
    }
    .auth-err { color: var(--red); font-size: 12px; min-height: 14px; margin-top: 6px; }
    .content { padding: 16px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .card.escalate { border-color: var(--red); box-shadow: 0 0 0 1px rgba(255,107,107,0.15); }
    .card.flags { border-color: var(--orange); }
    .card.clear { border-color: var(--green); }
    .card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .card .job-link {
      color: var(--accent); font-family: var(--display); letter-spacing: 0.04em;
      font-size: 16px; text-decoration: none;
    }
    .card .vendor {
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 8px; font-family: var(--mono); font-size: 11px; color: var(--text);
    }
    .card .pill {
      font-family: var(--mono); font-size: 10px; padding: 2px 8px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .card .pill.escalate { background: rgba(255,107,107,0.15); color: var(--red); border: 1px solid var(--red); }
    .card .pill.flags { background: rgba(255,157,74,0.15); color: var(--orange); border: 1px solid var(--orange); }
    .card .pill.clear { background: rgba(76,210,192,0.15); color: var(--green); border: 1px solid var(--green); }
    .card .meta { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-top: 4px; }
    .card pre {
      background: var(--bg); border: 1px solid var(--border-soft); border-radius: 6px;
      padding: 10px; margin-top: 10px;
      color: var(--text); font-family: var(--mono); font-size: 12px;
      white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto;
    }
    .card .expand {
      margin-top: 6px; background: transparent; border: none; color: var(--accent);
      cursor: pointer; font-family: var(--mono); font-size: 11px;
    }
    .empty {
      padding: 60px 20px; text-align: center; color: var(--muted); font-family: var(--mono);
    }
    .empty .big { font-size: 48px; margin-bottom: 12px; }
    .loading { color: var(--muted); font-family: var(--mono); padding: 30px; text-align: center; }
    .err { color: var(--red); font-family: var(--mono); padding: 30px; text-align: center; }
  </style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="ant">🐜</div>
    <div style="font-family:var(--display);font-size:24px;letter-spacing:0.06em">Warranty Review</div>
    <div style="color:var(--muted);font-size:12px;margin-top:4px">Ant Office</div>
    <input id="authInput" type="password" placeholder="Office password" autocomplete="off">
    <button id="authSubmit">Unlock</button>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <div>
      <div class="title">Warranty Review</div>
      <div class="sub" id="windowLabel">Last 30 days</div>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All <span class="count" id="cAll">0</span></button>
      <button class="filter-btn" data-filter="escalate">Escalate <span class="count" id="cEsc">0</span></button>
      <button class="filter-btn" data-filter="flags">Flags <span class="count" id="cFlg">0</span></button>
      <button class="filter-btn" data-filter="clear">Clear <span class="count" id="cClr">0</span></button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading warranty claim packages…</div>
  </div>
</div>

<script>
(function() {
  'use strict';
  const OFFICE_AUTH_KEY = 'tn_office_auth_v1';
  const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';

  const params = new URLSearchParams(window.location.search);
  const daysBack = parseInt(params.get('days') || '30', 10);
  document.getElementById('windowLabel').textContent = `Last ${daysBack} days`;

  // Auth
  const authGate = document.getElementById('authGate');
  const authInput = document.getElementById('authInput');
  const authSubmit = document.getElementById('authSubmit');
  const authErr = document.getElementById('authErr');
  const app = document.getElementById('app');
  const content = document.getElementById('content');

  function tryUnlock() {
    if (localStorage.getItem(OFFICE_AUTH_KEY) === '1') return unlock();
    authGate.style.display = 'flex';
    setTimeout(() => authInput.focus(), 40);
  }
  function unlock() {
    authGate.style.display = 'none';
    app.style.display = 'block';
    load();
  }
  authSubmit.addEventListener('click', () => {
    if (authInput.(await __verifyOfficePassword(value))) {
      localStorage.setItem(OFFICE_AUTH_KEY, '1');
      unlock();
    } else {
      authErr.textContent = 'Wrong password.';
    }
  });
  authInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') authSubmit.click(); });

  let allRows = [];
  let currentFilter = 'all';

  async function load() {
    try {
      const res = await fetch(`${XANO_BASE}/list_warranty_claim_actions?days_back=${daysBack}&per_page=200`);
      if (!res.ok) throw new Error(`Load failed (${res.status})`);
      const data = await res.json();
      if (!data.success) throw new Error('Server returned no success');
      allRows = data.rows || [];
      updateCounts();
      render();
    } catch (err) {
      content.innerHTML = `<div class="err">⚠️ ${escapeHtml(err.message)}</div>`;
    }
  }

  function statusOf(r) {
    if (r.escalate) return 'escalate';
    if (Number(r.high_flags) > 0) return 'flags';
    return 'clear';
  }

  function updateCounts() {
    let esc = 0, flg = 0, clr = 0;
    for (const r of allRows) {
      const s = statusOf(r);
      if (s === 'escalate') esc += 1;
      else if (s === 'flags') flg += 1;
      else clr += 1;
    }
    document.getElementById('cAll').textContent = allRows.length;
    document.getElementById('cEsc').textContent = esc;
    document.getElementById('cFlg').textContent = flg;
    document.getElementById('cClr').textContent = clr;
  }

  function render() {
    const filtered = currentFilter === 'all'
      ? allRows
      : allRows.filter((r) => statusOf(r) === currentFilter);

    if (filtered.length === 0) {
      content.innerHTML = `
        <div class="empty">
          <div class="big">🐜</div>
          <div>No warranty claim packages in this window.</div>
          <div style="margin-top:6px;font-size:11px">Claims appear here when warranty_claim_request_*_claims agents fire on TDR_COMPLETE.</div>
        </div>
      `;
      return;
    }

    const parts = [];
    for (const r of filtered) {
      const s = statusOf(r);
      const created = new Date(r.created_at);
      const createdStr = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Chicago',
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true,
      }).format(created);
      const pill = s === 'escalate' ? '<span class="pill escalate">escalate</span>'
        : s === 'flags' ? `<span class="pill flags">${r.high_flags} flag${r.high_flags === 1 ? '' : 's'}</span>`
        : '<span class="pill clear">clear</span>';
      parts.push(`
        <div class="card ${s}">
          <div class="row1">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <a class="job-link" href="job-detail.html?job_id=${r.job_id}">Job #${r.job_id}</a>
              <span class="vendor">${escapeHtml(r.vendor || r.specialty || '?')}</span>
              ${pill}
            </div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--muted)">${createdStr} CT</div>
          </div>
          <div class="meta">generated by ${escapeHtml(r.generated_by || 'unknown')} · #${r.id}</div>
          <pre id="text-${r.id}" style="display:none">${escapeHtml(r.claim_action_text)}</pre>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <button class="expand" data-toggle="${r.id}">Show claim package ↓</button>
            <button class="expand" data-correction="${r.id}" data-vendor="${escapeHtml((r.vendor || r.specialty || '').toLowerCase().replace(/\s+/g,''))}" data-job="${r.job_id}" style="background:rgba(255,193,7,0.10);border-color:rgba(255,193,7,0.4);color:#ffc107">🚩 Mark gap (teaches Ant)</button>
          </div>
        </div>
      `);
    }
    content.innerHTML = parts.join('');

    content.querySelectorAll('[data-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggle;
        const pre = document.getElementById(`text-${id}`);
        if (!pre) return;
        const showing = pre.style.display !== 'none';
        pre.style.display = showing ? 'none' : 'block';
        btn.textContent = showing ? 'Show claim package ↓' : 'Hide ↑';
      });
    });

    content.querySelectorAll('[data-correction]').forEach((btn) => {
      btn.addEventListener('click', () => openCorrectionModal({
        rowId: btn.dataset.correction,
        vendor: btn.dataset.vendor,
        jobId: btn.dataset.job,
      }));
    });
  }

  // ── Correction-capture modal (Layer 3a) ───────────────────────────
  function openCorrectionModal({ rowId, vendor, jobId }) {
    let m = document.getElementById('correctionModal');
    if (m) m.remove();
    m = document.createElement('div');
    m.id = 'correctionModal';
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9000;padding:18px';
    m.innerHTML = `
      <div style="background:#131720;border:1px solid #2a3040;border-radius:14px;padding:22px;max-width:480px;width:100%;color:#e8edf5;font-family:inherit">
        <div style="font-size:16px;font-weight:700;margin-bottom:6px">🚩 Teach Ant — flag a gap</div>
        <div style="font-size:12px;color:#8a93aa;margin-bottom:14px">For vendor <b>${escapeHtml(vendor || '?')}</b>. After 3 reports about the same gap, Ant will automatically add it to the checklist.</div>
        <label style="font-size:11px;color:#8a93aa;letter-spacing:0.06em;text-transform:uppercase;font-family:monospace">What's missing?</label>
        <select id="corrType" style="width:100%;background:#0e1118;border:1px solid #2a3040;border-radius:8px;color:#e8edf5;padding:10px;font-size:14px;margin-top:5px;margin-bottom:12px;-webkit-appearance:none">
          <option value="missing_field">Missing field (e.g. portal needed a serial number we didn't have)</option>
          <option value="missing_photo">Missing photo (e.g. portal needed a model tag photo)</option>
          <option value="wrong_value">Wrong value (we had it but it was formatted wrong)</option>
          <option value="rejected_by_portal">Rejected by portal (the worst — auto-promotes immediately)</option>
          <option value="extra_required">Vendor now requires something new</option>
        </select>
        <label style="font-size:11px;color:#8a93aa;letter-spacing:0.06em;text-transform:uppercase;font-family:monospace">Item key (snake_case, like failed_component or serial_tag)</label>
        <input id="corrItemKey" type="text" placeholder="failed_component" style="width:100%;background:#0e1118;border:1px solid #2a3040;border-radius:8px;color:#e8edf5;padding:10px;font-size:14px;margin-top:5px;margin-bottom:12px;font-family:monospace">
        <label style="font-size:11px;color:#8a93aa;letter-spacing:0.06em;text-transform:uppercase;font-family:monospace">Type</label>
        <select id="corrItemType" style="width:100%;background:#0e1118;border:1px solid #2a3040;border-radius:8px;color:#e8edf5;padding:10px;font-size:14px;margin-top:5px;margin-bottom:12px;-webkit-appearance:none">
          <option value="field">field</option>
          <option value="photo">photo</option>
          <option value="video">video</option>
        </select>
        <label style="font-size:11px;color:#8a93aa;letter-spacing:0.06em;text-transform:uppercase;font-family:monospace">Notes (what should Ant ask the tech?)</label>
        <textarea id="corrNotes" rows="3" placeholder="What's the serial number on the tag?" style="width:100%;background:#0e1118;border:1px solid #2a3040;border-radius:8px;color:#e8edf5;padding:10px;font-size:14px;margin-top:5px;margin-bottom:14px;resize:vertical;font-family:inherit"></textarea>
        <div id="corrErr" style="color:#ff6b6b;font-size:12px;min-height:16px;margin-bottom:8px"></div>
        <div style="display:flex;gap:8px">
          <button id="corrCancel" style="flex:1;padding:12px;background:transparent;border:1px solid #2a3040;color:#8a93aa;border-radius:8px;font-weight:700;cursor:pointer">Cancel</button>
          <button id="corrSubmit" style="flex:1;padding:12px;background:#f5a623;color:#1a1100;border:none;border-radius:8px;font-weight:700;cursor:pointer">Save</button>
        </div>
      </div>
    `;
    document.body.appendChild(m);
    m.querySelector('#corrCancel').onclick = () => m.remove();
    m.onclick = (e) => { if (e.target === m) m.remove(); };
    m.querySelector('#corrSubmit').onclick = async () => {
      const corrType = m.querySelector('#corrType').value;
      const itemKey  = (m.querySelector('#corrItemKey').value || '').trim().toLowerCase().replace(/\s+/g,'_');
      const itemType = m.querySelector('#corrItemType').value;
      const notes    = (m.querySelector('#corrNotes').value || '').trim();
      const err      = m.querySelector('#corrErr');
      err.textContent = '';
      if (!itemKey) { err.textContent = 'item key is required'; return; }
      try {
        const res = await fetch(XANO_BASE + '/record_warranty_correction', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            warranty_company: vendor || 'unknown',
            correction_type:  corrType,
            item_key:         itemKey,
            item_type:        itemType,
            field_or_subject: itemKey,
            notes:            notes,
            job_id:           parseInt(jobId || '0', 10),
          }),
        });
        const d = await res.json();
        if (d && d.success) {
          m.querySelector('div > div').innerHTML = `<div style="font-size:18px;font-weight:700;text-align:center;margin:20px 0">✅ Logged. Ant will learn.</div><button id="corrClose" style="width:100%;padding:12px;background:#f5a623;color:#1a1100;border:none;border-radius:8px;font-weight:700;cursor:pointer">Close</button>`;
          m.querySelector('#corrClose').onclick = () => m.remove();
          setTimeout(() => m.remove(), 1800);
        } else {
          err.textContent = d.error || 'save failed';
        }
      } catch (e2) {
        err.textContent = 'network error';
      }
    };
  }

  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  tryUnlock();
})();
</script>
  <script src="/office-ant.js?v=20260528-1"></script>
  <script src="/office-nav.js?v=20260601-2"></script>
<script src="/api-spec/client/ant-client.js?v=20260601-1"></script>
<script src="/office-search.js?v=20260601-1"></script>
  <script src="/office-home-button.js?v=1"></script>
</body>
</html>
