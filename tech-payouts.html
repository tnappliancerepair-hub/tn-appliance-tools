<style>
  :root{--blue:#1f6fed;--ink:#1d2530;--ink2:#5b6573;--dim:#8a93a1;--bg:#eef1f5;--card:#fff;--line:#e4e8ee;--ok:#1faa6b;--bad:#e24d4d;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px;}
  .top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:13px 16px;padding-top:max(13px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;}
  .top .t{font-size:17px;font-weight:800;flex:1;}
  .top .r{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;}
  .wrap{max-width:600px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
  .owed{background:linear-gradient(135deg,#1f6fed,#3b86ff);color:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 16px rgba(31,111,237,.3);}
  .owed .lbl{font-size:13px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.05em;}
  .owed .amt{font-size:42px;font-weight:900;line-height:1.1;margin-top:4px;}
  .owed .sub{font-size:12px;opacity:.85;margin-top:6px;}
  .stat-row{display:flex;gap:10px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center;}
  .stat .v{font-size:22px;font-weight:800;} .stat .k{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
  .stat .v.paid{color:var(--ok);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;}
  .card h3{font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;padding:11px 0 7px;}
  .job{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f0f3f7;}
  a.job{text-decoration:none;color:inherit;-webkit-tap-highlight-color:rgba(0,0,0,0.04);}
  a.job:active{background:#f6f8fb;}
  .job .chev{color:#c2cad6;font-size:22px;font-weight:700;line-height:1;margin-left:2px;}
  .job:last-child{border-bottom:0;}
  .job .info{flex:1;min-width:0;}
  .job .jid{font-weight:700;font-size:14px;} .job .when{font-size:12px;color:var(--ink2);}
  .job .pay{font-size:16px;font-weight:800;color:var(--ok);}
  .empty{padding:26px 14px;text-align:center;color:var(--dim);font-size:13px;}
  .note{font-size:11px;color:var(--dim);text-align:center;padding:4px 14px 0;}
  .loading{padding:50px;text-align:center;color:var(--ink2);}
  .spinner{width:30px;height:30px;border:3px solid #d7dde5;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .auth.hidden{display:none;}
  .auth-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;width:100%;max-width:340px;text-align:center;}
  .auth-card h2{font-size:18px;margin-bottom:5px;} .auth-card .sub{color:var(--ink2);font-size:13px;margin-bottom:16px;}
  .auth-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:22px;text-align:center;letter-spacing:.4em;font-family:ui-monospace,monospace;margin-bottom:11px;}
  .auth-card button{width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}
  .auth-card .err{color:var(--bad);font-size:13px;margin-top:9px;min-height:17px;}
</style>

<body>

<div class="auth" id="auth">
  <div class="auth-card">
    <h2>🐜 Your Pay</h2>
    <div class="sub">enter your 4-digit PIN</div>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off">
    <button id="pin-go" onclick="submitPin()">View Pay</button>
    <div class="err" id="pin-err"></div>
  </div>
</div>

<div class="top">
  <div class="t">💵 Your Pay</div>
  <button class="r" onclick="load()" title="Refresh">↻</button>
</div>

<div id="content"><div class="loading"><div class="spinner"></div>Loading your pay…</div></div>

<script>
const params=new URLSearchParams(location.search);
const TECH_ID=parseInt(params.get('tech_id')||localStorage.getItem('tn_tech_id'),10)||0;try{if(TECH_ID)localStorage.setItem('tn_tech_id',String(TECH_ID));}catch(_){}
const AUTH_KEY='tn_tech_auth_'+TECH_ID;

function authValid(){try{const c=JSON.parse(localStorage.getItem(AUTH_KEY)||'{}');return c.ok&&(Date.now()-c.t<12*3600*1000);}catch(_){return false;}}
function initAuth(){
  if(!TECH_ID){document.getElementById('content').innerHTML='<div class="empty">Missing tech_id in URL. Use the link Ant sent you.</div>';document.getElementById('auth').classList.add('hidden');return;}
  if(authValid()){document.getElementById('auth').classList.add('hidden');load();return;}
  document.getElementById('pin').focus();
}
async function submitPin(){
  const v=(document.getElementById('pin').value||'').trim();const err=document.getElementById('pin-err');const btn=document.getElementById('pin-go');
  if(!/^\d{4}$/.test(v)){err.textContent='Enter your 4-digit PIN';return;}
  btn.disabled=true;btn.textContent='Checking…';
  try{
    const r=await fetch('/.netlify/functions/verify-pin-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({technician_id:TECH_ID,pin:v})});
    const d=await r.json();
    if(d.success){localStorage.setItem(AUTH_KEY,JSON.stringify({ok:true,t:Date.now()}));document.getElementById('auth').classList.add('hidden');load();}
    else{err.textContent='Wrong PIN. Try again.';document.getElementById('pin').value='';}
  }catch(_){err.textContent='Connection error.';}
  finally{btn.disabled=false;btn.textContent='View Pay';}
}
document.getElementById('pin').addEventListener('keypress',e=>{if(e.key==='Enter')submitPin();});

async function load(){
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Loading your pay…</div>';
  try{
    const [d,comp]=await Promise.all([
      fetch('/.netlify/functions/tech-earnings?tech_id='+TECH_ID,{cache:'no-store'}).then(x=>x.json()),
      fetch('/.netlify/functions/tdr-compliance?tech_id='+TECH_ID,{cache:'no-store'}).then(x=>x.json()).catch(()=>null),
    ]);
    if(!d.success)throw new Error(d.error||'could not load');
    render(d,comp);
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty">Couldn’t load your pay yet — '+esc(e.message)+'</div>';
  }
}

// 📋 Reports = your pay (Teddy 7/4): a stop isn't done until the TDR is filed.
// This card puts the money that's waiting on an un-filed report right at the top,
// with a one-tap "File →" into the job's TDR — the behavior lever, not a nag.
function buildTdrCard(comp){
  if(!comp||!comp.ok) return '';
  const holding=comp.holding||{count:0,amount:0}, today=comp.today||{stops:0,filed:0,pct:100};
  const seen=new Set(), items=[];
  (comp.holding_jobs||[]).forEach(x=>{ if(!seen.has(x.job_id)){seen.add(x.job_id);items.push({job_id:x.job_id,amount:x.amount||0,kind:'holding',customer:x.customer||''});} });
  (comp.today_unfiled||[]).forEach(x=>{ if(!seen.has(x.job_id)){seen.add(x.job_id);items.push({job_id:x.job_id,amount:0,kind:'today',customer:x.customer||''});} });
  const wk=comp.week||{};
  const rankLine = wk.rank_total ? `<div style="margin-top:9px;font-size:13px;font-weight:800;opacity:.97">🏆 ${esc(wk.rank_label||(wk.rank+''))} — most reports · ${esc(wk.pct_rank_label||(wk.pct_rank+''))} — completion rate (${wk.pct||0}%) this week</div>` : '';
  if(!items.length){
    if(today.stops>0||wk.rank_total) return `<div class="card" style="border:1px solid var(--ok,#1faa6b)"><h3 style="color:var(--ok,#1faa6b)">✓ All reports filed — nice work</h3><div class="empty" style="padding:6px 0">Filed today: ${today.filed}/${today.stops}. Nothing holding your pay.${wk.rank_total?(' 🏆 '+esc(wk.rank_label||('#'+wk.rank))+' place for completions this week.'):''}</div></div>`;
    return '';
  }
  const rows=items.map(it=>`
    <a class="job" href="tech-job.html?job_id=${it.job_id}&tech_id=${TECH_ID}#tdr" style="border-left:3px solid #e0524a">
      <div class="info"><div class="jid">${it.customer?esc(it.customer):('Job #'+it.job_id)}</div><div class="when">#${it.job_id} · ${it.amount>0?('$'+it.amount.toFixed(2)+" tied up until the TDR's finished"):"today's stop — finish the report"}</div></div>
      <div class="pay" style="color:#e0524a;font-size:14px">Finish →</div>
    </a>`).join('');
  const head = holding.amount>0
    ? `<div class="amt" style="font-size:30px">$${holding.amount.toFixed(2)}</div><div class="sub">stuck on ${holding.count} report${holding.count===1?'':'s'} — finish them and the money starts moving</div>`
    : `<div class="amt" style="font-size:24px">${items.length} report${items.length===1?'':'s'} to finish</div><div class="sub">wrap today's stops so we can bill them</div>`;
  // The real chain — nobody's holding your money, it just can't come in until the
  // report unlocks the claim. You're the first domino. (Teddy 7/4)
  const chain = `<div style="margin-top:11px;background:rgba(0,0,0,.16);border-radius:10px;padding:9px 11px;font-size:11.5px;font-weight:700;line-height:1.5;opacity:.96">📋 Your report → 🧾 we bill the warranty co → 💵 they pay us → 🤝 you get paid</div>`;
  return `<div class="owed" style="background:linear-gradient(135deg,#e0524a,#b83b34)">
      <div class="lbl">📋 Your report = your pay</div>${head}
      ${chain}
      <div class="sub" style="margin-top:9px;opacity:.95">Filed today: ${today.filed}/${today.stops}</div>
      ${rankLine}
    </div>
    <div class="card"><h3>Finish these so we can bill them</h3>${rows}</div>`;
}
function render(d,comp){
  const tdrCard=buildTdrCard(comp);
  const jobs=d.jobs||[];
  const rows=jobs.length?jobs.map(j=>`
    <a class="job" href="tech-job.html?job_id=${esc(String(j.job_id))}&tech_id=${TECH_ID}">
      <div class="info"><div class="jid">Job #${esc(String(j.job_id))}</div><div class="when">${j.when?fmt(j.when):''}${j.labor?(' · labor $'+j.labor.toFixed(2)):''}</div></div>
      <div class="pay">$${(j.pay||0).toFixed(2)}</div>
      <div class="chev">›</div>
    </a>`).join(''):'<div class="empty">No jobs billed yet this stretch. Your pay shows here as the office logs each job.</div>';
  const addons=d.addons||[];
  const addonRows=addons.length?addons.map(a=>`
    <a class="job" href="tech-job.html?job_id=${esc(String(a.job_id))}&tech_id=${TECH_ID}">
      <div class="info"><div class="jid">🛍️ ${esc(String(a.name))}</div><div class="when">Job #${esc(String(a.job_id))}${a.when?(' · '+fmt(a.when)):''}</div></div>
      <div class="pay">$${(a.cut||0).toFixed(2)}</div>
      <div class="chev">›</div>
    </a>`).join(''):'';
  const addonCard=addons.length?`<div class="card"><h3>Add-on extras · +$${(d.addon_earned||0).toFixed(2)}</h3>${addonRows}</div>`:'';
  const tips=d.tips||[];
  const tipRows=tips.length?tips.map(t=>`
    <a class="job" href="tech-job.html?job_id=${esc(String(t.job_id))}&tech_id=${TECH_ID}">
      <div class="info"><div class="jid">💚 Tip</div><div class="when">Job #${esc(String(t.job_id))}${t.when?(' · '+fmt(t.when)):''}</div></div>
      <div class="pay">$${(t.amount||0).toFixed(2)}</div>
      <div class="chev">›</div>
    </a>`).join(''):'';
  const tipCard=tips.length?`<div class="card"><h3>Tips from customers · +$${(d.tip_earned||0).toFixed(2)} <span style="font-size:11px;font-weight:600;color:var(--ok)">100% yours</span></h3>${tipRows}</div>`:'';
  // ⏳ Pending — jobs with a logged invoice that aren't finished yet. Shown so nothing
  // looks like it vanished, but NOT counted as owed (pay is earned on completion).
  const pending=d.pending||[];
  const statusLabel=(p)=>{ const ss=String(p.scheduling_status||'').toLowerCase(), cs=String(p.current_status||'').toLowerCase(); if(/await|part/.test(ss+cs))return 'awaiting parts'; if(ss==='in_progress'||cs==='in_progress')return 'in progress'; if(ss==='scheduled'||cs==='scheduled')return 'scheduled'; return ss||cs||'open'; };
  const pendingRows=pending.length?pending.map(p=>`
    <a class="job" href="tech-job.html?job_id=${esc(String(p.job_id))}&tech_id=${TECH_ID}">
      <div class="info"><div class="jid">Job #${esc(String(p.job_id))} <span style="font-size:10px;font-weight:700;color:#b06a00;background:#fff3df;border-radius:10px;padding:1px 7px;text-transform:uppercase">${esc(statusLabel(p))}</span></div><div class="when">${p.labor?('labor $'+p.labor.toFixed(2)+' · '):''}pays when finished</div></div>
      <div class="pay" style="color:#9aa3b2">$${(p.pay||0).toFixed(2)}</div>
      <div class="chev">›</div>
    </a>`).join(''):'';
  const pendingCard=pending.length?`<div class="card"><h3>⏳ Pending · finish to get paid <span style="font-size:11px;font-weight:600;color:var(--ink2,#8a93a6)">$${(d.pending_pay||0).toFixed(2)} not yet earned</span></h3>${pendingRows}</div>`:'';
  document.getElementById('content').innerHTML=`
    <div class="wrap">
      ${tdrCard}
      <div class="owed">
        <div class="lbl">Owed to you now</div>
        <div class="amt">$${(d.owed||0).toFixed(2)}</div>
        <div class="sub">updates after each payout</div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="v">$${(d.earned||0).toFixed(2)}</div><div class="k">Earned</div></div>
        <div class="stat"><div class="v paid">$${(d.paid||0).toFixed(2)}</div><div class="k">Paid</div></div>
        <div class="stat"><div class="v">${d.job_count||0}</div><div class="k">Jobs</div></div>
      </div>
      <div class="card"><h3>Per job · paid when complete</h3>${rows}</div>
      ${pendingCard}
      ${addonCard}
      ${tipCard}
      <div class="note">Pay runs the 3rd &amp; 18th · +$10 per 5-star review · add-ons + tips pay on top (tips are 100% yours)</div>
    </div>`;
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(ms){try{return new Date(ms).toLocaleDateString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric'});}catch(_){return '';}}
initAuth();
</script>
<script src="/ant-shell.js?v=20260703h" defer></script>
