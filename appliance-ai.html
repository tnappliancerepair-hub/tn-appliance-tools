<script>
// Force the canonical (non-www) domain BEFORE anything fetches — the www host
// 301-redirects /.netlify/functions/* cross-domain, which makes the browser kill
// POST fetches ("Connection hiccup"). One redirect here and every fetch is same-origin.
if (location.hostname.indexOf('www.') === 0) { location.replace(location.href.replace('://www.', '://')); }
const FLOW = document.getElementById('flow');
const ORB = document.getElementById('orb');
const HEAD = document.getElementById('head');
const SUB = document.getElementById('sub');
const XANO = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const FN = 'https://tnapplianceexchange.net/.netlify/functions';  // absolute canonical — never hits the www 301
const QC_PRICE = 50;   // live $50 Quick Check
// FREE_MODE: skip payment entirely + never block on a slow upload, so a customer
// on bad signal can always finish. Flip to false to restore the paid flow.
const FREE_MODE = true;
const state = { appliance:'', brand:'', problem:'', payer:'', smsConsent:null, video:false, model:false, videoFile:null, modelFile:null, name:'', phone:'', email:'', address:'', city:'', zip:'', town:'', warranty:'', claim:'', convId:0 };
// Test link (?qc=<token>) makes this session's Quick Check $1 instead of $50.
const QC_TEST = (new URLSearchParams(location.search).get('qc') || '');

// ── FAIL-PROOF MEDIA UPLOAD (built for low / spotty signal) ───────────────────
// XHR-based PUT with live progress, per-attempt timeout, and automatic retries
// with backoff. Each hop (init / presign / put / save) uses absolute canonical
// URLs so the www 301 never interferes. Nothing here ever throws to the caller
// uncaught — a hard failure just resolves {ok:false} so the funnel keeps moving
// and we recover the media later.
function fetchJSON(url, body, tries){
  tries = tries || 3;
  return (async ()=>{
    let last;
    for(let i=0;i<tries;i++){
      try{
        const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 25000);
        const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});
        clearTimeout(to);
        const j = await r.json(); return j;
      }catch(e){ last=e; await new Promise(s=>setTimeout(s, Math.min(1500*(i+1),5000))); }
    }
    throw last || new Error('network');
  })();
}
function putWithProgress(url, file, mime, onPct){
  return new Promise((resolve,reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url, true);
    xhr.setRequestHeader('Content-Type', mime);
    xhr.timeout = 180000; // 3 min/attempt — generous for weak signal
    if(xhr.upload) xhr.upload.onprogress = e=>{ if(e.lengthComputable && onPct) onPct(e.loaded/e.total); };
    xhr.onload = ()=> (xhr.status>=200 && xhr.status<300) ? resolve(true) : reject(new Error('s3 '+xhr.status));
    xhr.onerror = ()=> reject(new Error('network'));
    xhr.ontimeout = ()=> reject(new Error('timeout'));
    xhr.onabort = ()=> reject(new Error('aborted'));
    try{ xhr.send(file); }catch(e){ reject(e); }
  });
}
// Attempts the full upload with up to `maxTries` passes. Returns {ok:true} or
// {ok:false, error}. onStatus(phase, attempt, pct) drives the visible UI.
async function uploadMedia(file, fileType, onStatus){
  if(!state.convId) state.convId = Date.now();
  const mime = file.type || (fileType==='video'?'video/mp4':'image/jpeg');
  const maxTries = 5;
  let lastErr='';
  for(let attempt=1; attempt<=maxTries; attempt++){
    try{
      if(onStatus) onStatus('preparing', attempt, 0);
      const gen = await fetchJSON(XANO+'/generate_upload_url',{conversation_id:state.convId, attachment_type:'intake', file_type:fileType, original_filename:file.name||(fileType+(fileType==='video'?'.mp4':'.jpg')), mime_type:mime, uploaded_by:'customer'});
      if(!gen || !gen.s3_key || !gen.attachment_id) throw new Error('init');
      const pres = await fetchJSON(FN+'/s3-presign',{s3_key:gen.s3_key, mime_type:mime});
      if(!pres || !pres.upload_url) throw new Error('presign');
      await putWithProgress(pres.upload_url, file, mime, pct=>{ if(onStatus) onStatus('uploading', attempt, pct); });
      await fetchJSON(XANO+'/save_attachment',{attachment_id:gen.attachment_id, file_size_bytes:file.size||0}).catch(()=>{});
      if(onStatus) onStatus('done', attempt, 1);
      return { ok:true };
    }catch(e){
      lastErr = (e && e.message) || 'error';
      if(attempt<maxTries){ if(onStatus) onStatus('retry', attempt, 0); await new Promise(s=>setTimeout(s, Math.min(2000*attempt, 9000))); }
    }
  }
  if(onStatus) onStatus('failed', maxTries, 0);
  return { ok:false, error:lastErr };
}

  document.getElementById('ask').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('snd').click();});

// Drives the visible status line under a capture button as the upload runs.
function captureStatus(barEl, txtEl){
  return function(phase, attempt, pct){
    if(phase==='preparing'){ txtEl.textContent='Preparing upload…'; barEl.style.width='4%'; }
    else if(phase==='uploading'){ const p=Math.max(4,Math.round((pct||0)*100)); barEl.style.width=p+'%'; txtEl.textContent='Uploading… '+p+'%'; }
    else if(phase==='retry'){ txtEl.textContent='Weak signal — retrying (still working on it)…'; }
    else if(phase==='done'){ barEl.style.width='100%'; txtEl.textContent='✓ Uploaded'; }
    else if(phase==='failed'){ barEl.style.width='100%'; barEl.classList.add('warn'); txtEl.textContent='Saved — we’ll grab it automatically when your signal’s back.'; }
  };
}
function capVideo(){
  setHead('Show me what’s <span class="accent">going on.</span>','A video tells me more than anything else.');
  antMsg('Take a video of your '+esc(state.appliance.toLowerCase())+' and <b>talk me through it</b> — tell me what it <b>is and isn’t doing</b>, what you’re seeing or hearing, and what you need help with. The more detail the better. <b>Take as long as you need</b> — walk me through exactly what you’re going through.');
  const w=document.createElement('div'); w.className='capture';
  w.innerHTML='<label class="cap-btn" id="vbtn"><span class="emo">📹</span><span>Tap to record / upload a video</span><input type="file" accept="video/*" capture="environment" class="hidden" id="vfile"></label>'
    +'<div class="uprog hidden" id="vprog"><div class="upbar" id="vbar"></div></div><div class="upstat hidden" id="vstat"></div>';
  FLOW.appendChild(w);
  document.getElementById('vfile').onchange=e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    state.video=true; state.videoFile=file;
    const b=document.getElementById('vbtn'); b.classList.add('done'); const vl=b.querySelectorAll('span')[1]; if(vl) vl.textContent='✓ Video added';
    document.getElementById('vprog').classList.remove('hidden'); document.getElementById('vstat').classList.remove('hidden');
    if(!state.convId) state.convId = Date.now();
    const st = captureStatus(document.getElementById('vbar'), document.getElementById('vstat'));
    // Cloudflare Stream (resumable) first; S3 fallback if Stream isn't configured.
    state.uploads = state.uploads || [];
    state.uploads.push(AntVideo.upload(file, { convId:state.convId, uploadedBy:'customer', onStatus:st, s3Fallback:f=>uploadMedia(f,'video',st) }).then(r=>{ state.videoUploaded=!!(r&&r.ok); return r; }));
    setTimeout(()=>{clearFlow(); think(500, capModel);},900);   // keep moving while it uploads in parallel
  };
}
function capModel(){
  setHead('Now the <span class="accent">model number.</span>','Usually on a sticker inside the door or on the back.');
  antMsg('Snap a photo of the model sticker — that\'s how I get you the exact part and the real price.');
  const w=document.createElement('div'); w.className='capture';
  w.innerHTML='<label class="cap-btn" id="mbtn"><span class="emo">📸</span><span>Tap to photograph the model sticker</span><input type="file" accept="image/*" capture="environment" class="hidden" id="mfile"></label>'
    +'<div class="uprog hidden" id="mprog"><div class="upbar" id="mbar"></div></div><div class="upstat hidden" id="mstat"></div>';
  FLOW.appendChild(w);
  document.getElementById('mfile').onchange=e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    state.model=true; state.modelFile=file;
    const b=document.getElementById('mbtn'); b.classList.add('done'); const ml=b.querySelectorAll('span')[1]; if(ml) ml.textContent='✓ Model photo added';
    document.getElementById('mprog').classList.remove('hidden'); document.getElementById('mstat').classList.remove('hidden');
    if(!state.convId) state.convId = Date.now();
    const mst = captureStatus(document.getElementById('mbar'), document.getElementById('mstat'));
    // Cloudflare Images (reliable) first; S3 fallback. Photo is critical — never weak.
    state.uploads = state.uploads || [];
    state.uploads.push(AntPhoto.upload(file, { convId:state.convId, uploadedBy:'customer', onStatus:mst, s3Fallback:f=>uploadMedia(f,'photo',mst) }).then(r=>{ state.modelUploaded=!!(r&&r.ok); return r; }));
    setTimeout(()=>{clearFlow(); think(700, ()=>{ antMsg('Perfect. Last thing and then your answer\'s on its way.'); think(500, consentGate); });},900);
  };
}

// ── SMS CONSENT GATE (TCR / A2P compliance — preserved) ──
function consentGate(){
  setHead('How should we <span class="accent">reach you?</span>','We\'ll text your answer + options when they\'re ready.');
  const c=document.createElement('div'); c.className='consent';
  c.innerHTML='<h3>📲 Text me my results</h3>'
    +'<p>By tapping <b>Yes</b>, you agree to receive text messages from <b>TN Appliance Exchange</b> about your repair (your diagnosis, options, and scheduling). Message &amp; data rates may apply. Message frequency varies. Reply <b>STOP</b> to opt out, <b>HELP</b> for help.</p>'
    +'<div class="row"><button class="c-yes" id="cy">Yes, text me</button><button class="c-no" id="cn">No texts</button></div>'
    +'<div class="fine">Consent is not a condition of purchase. See our <a href="/privacy.html">Privacy Policy</a> and <a href="/terms.html">Terms</a>.</div>';
  FLOW.appendChild(c); c.scrollIntoView({behavior:'smooth',block:'center'});
  document.getElementById('cy').onclick=()=>{ state.smsConsent=true; clearFlow(); collectContact(); };
  document.getElementById('cn').onclick=()=>{ state.smsConsent=false; clearFlow(); antMsg('No problem — we\'ll call you instead. What\'s the best number + your ZIP?'); collectContact(); };
}
function collectContact(){
  setHead('Almost done.','Where’s the appliance — and how do we reach you?');
  const f=document.createElement('div'); f.className='field';
  f.innerHTML='<input id="f-name" placeholder="Your name" autocomplete="name">'
    +'<input id="f-phone" type="tel" placeholder="Phone number" autocomplete="tel">'
    +'<input id="f-email" type="email" placeholder="Email (for your receipt)" autocomplete="email">'
    +'<input id="f-addr" placeholder="Service address (street)" autocomplete="street-address">'
    +'<input id="f-city" placeholder="City" autocomplete="address-level2">'
    +'<input id="f-zip" type="tel" placeholder="ZIP code" autocomplete="postal-code">'
    +'<button class="go" id="f-go">Continue to payment →</button>';
  FLOW.appendChild(f);
  document.getElementById('f-go').onclick=()=>{
    state.name=document.getElementById('f-name').value.trim();
    state.phone=document.getElementById('f-phone').value.trim();
    state.email=document.getElementById('f-email').value.trim();
    state.address=document.getElementById('f-addr').value.trim();
    state.city=document.getElementById('f-city').value.trim();
    state.zip=document.getElementById('f-zip').value.trim();
    if(!state.name||state.phone.replace(/\D/g,'').length<10||!state.address||!state.zip){ alert('Please add your name, a valid phone, the street address, and ZIP.'); return; }
    if(!FREE_MODE && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(state.email)){ alert('Please add a valid email — Stripe needs it for your receipt.'); return; }
    clearFlow(); think(500, FREE_MODE ? submitFree : payStep);
  };
}
// FREE submit — no payment, and we DO NOT block on the media upload (that's what
// dropped on bad signal). We create the job immediately; whatever media landed is
// linked, and if it didn't, the customer gets a one-tap finish-upload text.
function submitFree(){
  setHead('One tap and <span class="accent">you\'re done.</span>','Free — honest answer within 2 business hours.');
  const p=document.createElement('div'); p.className='pay';
  p.innerHTML='<div class="amt" style="font-size:28px">Free Quick Check</div><div class="amtsub">No charge · honest answer within 2 business hours</div>'
    +'<button class="go" id="free-go">Get my honest answer →</button>';
  FLOW.appendChild(p);
  document.getElementById('free-go').onclick=async()=>{
    const btn=document.getElementById('free-go'); btn.disabled=true; btn.textContent='Sending…';
    // Fire-and-forget the uploads — they keep going in the background and link by
    // conversation_id whenever they land. We never wait on them, so a weak signal
    // can't strand her here. media_status=pending is set server-side if needed.
    state.mediaPending = (state.video && !state.videoUploaded) || (state.model && !state.modelUploaded);
    try{
      const r=await fetch(FN+'/free-quickcheck',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        name:state.name, phone:state.phone, email:state.email, address:state.address, city:state.city, zip:state.zip,
        appliance:state.appliance, brand:state.brand, problem:state.problem, sms_consent:state.smsConsent, town:state.town,
        conv_id:state.convId, has_video:state.video, has_model:state.model
      })});
      const d=await r.json().catch(()=>({}));
      if(d&&d.ok){ clearFlow(); done(); }
      else { btn.disabled=false; btn.textContent='Get my honest answer →'; antMsg('⚠ '+((d&&d.error)||'Hiccup on our end — tap again, or call 615-280-2949.')); }
    }catch(e){ btn.disabled=false; btn.textContent='Get my honest answer →'; antMsg('⚠ Connection hiccup — tap again, or call 615-280-2949.'); }
  };
}
function payStep(){
  setHead('Lock in your <span class="accent">Quick Check.</span>','$'+QC_PRICE+' now — credited to your repair.');
  const p=document.createElement('div'); p.className='pay';
  p.innerHTML='<div class="amt">$'+QC_PRICE+'</div><div class="amtsub">Credited to your repair · honest answer within 2 business hours</div>'
    +'<button class="go" id="pay-go">Pay $'+QC_PRICE+' &amp; get my answer →</button>';
  FLOW.appendChild(p);
  const payLabel='Pay $'+QC_PRICE+' & get my answer →';
  if(state.uploads && state.uploads.length){
    const note=document.createElement('div'); note.className='upnote'; note.id='upnote';
    note.textContent='📎 Sending your video + photo securely…';
    p.appendChild(note);
  }
  document.getElementById('pay-go').onclick=async()=>{
    const btn=document.getElementById('pay-go'); btn.disabled=true;
    // The Stripe redirect aborts any in-flight upload, so let the media finish FIRST.
    // The uploader retries on weak signal and resolves {ok:false} (never hangs) after
    // its own attempts, so this wait is bounded. If it still hasn't landed, we proceed
    // anyway (never lose the customer) and flag the job media-pending.
    if(state.uploads && state.uploads.length){
      btn.textContent='Finishing your upload…';
      let results=[];
      try{ results = await Promise.race([ Promise.all(state.uploads), new Promise(res=>setTimeout(()=>res(null),180000)) ]); }catch(_){ }
      const note=document.getElementById('upnote'); if(note) note.remove();
    }
    state.mediaPending = (state.video && !state.videoUploaded) || (state.model && !state.modelUploaded);
    btn.textContent='Taking you to secure checkout…';
    try{
      // absolute canonical origin so it never hits the www 301 redirect
      const r=await fetch(FN+'/create-quickcheck-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        name:state.name, phone:state.phone, email:state.email, address:state.address, city:state.city, zip:state.zip,
        appliance:state.appliance, brand:state.brand, problem:state.problem, payer:state.payer, sms_consent:state.smsConsent, town:state.town,
        conv_id:state.convId, has_video:state.video, has_model:state.model, media_pending:state.mediaPending,
        qc_test:QC_TEST
      })});
      const d=await r.json();
      if(d&&d.ok&&d.url){ window.location.href=d.url; }   // -> Stripe Checkout -> quick-check-thanks.html
      else { btn.disabled=false; btn.textContent=payLabel; antMsg('⚠ '+((d&&d.error)||'Couldn’t start checkout — try again, or call 615-280-2949.')); }
    }catch(e){ btn.disabled=false; btn.textContent=payLabel; antMsg('⚠ '+((e&&e.message)?('Couldn’t reach checkout ('+e.message+') — '):'Connection hiccup — ')+'try again, or call 615-280-2949.'); }
  };
}
function done(){
  setHead('You\'re <span class="accent">all set.</span> 🎉','');
  antMsg('Got everything, '+esc(state.name.split(' ')[0]||'')+'. Our tech is reviewing your video right now. You\'ll have your <b>honest assessment + your repair options</b> within <b>2 business hours</b> — usually a lot sooner. Hang tight. 🐜');
}

// ── WARRANTY path ──
function warrantyPath(){
  setHead('You\'re <span class="accent">covered.</span>','Let\'s get you on the schedule — no charge.');
  antMsg('Great — since it\'s under warranty, there\'s no Quick Check fee. I just need a couple things to get you scheduled.');
  const f=document.createElement('div'); f.className='field';
  f.innerHTML='<input id="w-co" placeholder="Warranty company (AHS, ServicePower…)">'
    +'<input id="w-claim" placeholder="Claim / authorization # (if you have it)">'
    +'<input id="w-name" placeholder="Your name" autocomplete="name">'
    +'<input id="w-phone" type="tel" placeholder="Phone number" autocomplete="tel">'
    +'<input id="w-zip" type="tel" placeholder="ZIP code" autocomplete="postal-code">'
    +'<button class="go" id="w-go">Get me scheduled →</button>';
  FLOW.appendChild(f);
  document.getElementById('w-go').onclick=()=>{
    const nm=document.getElementById('w-name').value.trim(), ph=document.getElementById('w-phone').value.trim();
    if(!nm||ph.replace(/\D/g,'').length<10){ alert('Please add your name and a valid phone.'); return; }
    clearFlow(); think(800, ()=>{ setHead('Got it — <span class="accent">we\'re on it.</span>','');
      antMsg('Thanks '+esc(nm.split(' ')[0])+'. We\'ve got your '+esc(state.appliance.toLowerCase())+' and we\'ll reach out to lock in your day. You\'ll get a text/call from our office shortly. 🐜'); });
  };
}

// voice (browser speech-to-text)
function voice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ document.getElementById('ask').placeholder='Type it — voice not supported here'; return; }
  const r=new SR(); r.lang='en-US'; r.interimResults=true; let txt='';
  ORB.classList.add('thinking');
  r.onresult=e=>{ txt=''; for(const x of e.results) txt+=x[0].transcript; const a=document.getElementById('ask'); if(a)a.value=txt; };
  r.onend=()=>{ ORB.classList.remove('thinking'); if((document.getElementById('ask').value||'').trim()) document.getElementById('snd').click(); };
  r.onerror=()=>ORB.classList.remove('thinking');
  r.start();
}

// ── context-aware open: ?appliance=&brand=&town= (from any landing page) ──
function getCtx(){ const u=new URLSearchParams(location.search); return { appliance:(u.get('appliance')||'').trim(), brand:(u.get('brand')||'').trim(), town:(u.get('town')||'').trim() }; }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function startContext(ctx){
  const label = cap(ctx.appliance);
  state.appliance = label; if(ctx.brand) state.brand=ctx.brand; if(ctx.town) state.town=ctx.town;
  const machine = (ctx.brand?(ctx.brand+' '):'') + label.toLowerCase();
  setHead('What’s going on with your <span class="accent">'+esc(machine)+'</span>'+(ctx.town?(' in '+esc(ctx.town)):'')+'?', 'I’m the appliance AI — tell me what it’s doing and I’ll help you figure it out.');
  clearFlow();
  antMsg('Hey — I see you’ve got a <b>'+esc(machine)+'</b> giving you trouble'+(ctx.town?(' over in '+esc(ctx.town)):'')+'. Let’s get it figured out. What’s it doing?');
  const list=(PROBLEMS[label]||PROBLEMS.default).map(p=>({label:p}));
  choices(list, p=>{ state.problem=p.label; youMsg(p.label); clearFlow(); think(600, askPayer); });
  const chg=document.createElement('div'); chg.className='or'; chg.style.cursor='pointer'; chg.style.marginTop='16px';
  chg.textContent='not a '+esc(label.toLowerCase())+'? tap to start over';
  chg.onclick=()=>{ state.appliance=''; setHead('What’s going on with <span class="accent">your appliance?</span>','Tap what’s broken — I’ll figure it out with you.'); start(); };
  FLOW.appendChild(chg);
}
const CTX = getCtx();
if(CTX.appliance){ startContext(CTX); } else { start(); }
</script>
