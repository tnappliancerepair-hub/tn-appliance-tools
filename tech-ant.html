<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tech Ant - TN Appliance Exchange</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto auto 1fr auto auto auto;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #0e1118, #131a2a);
    border-bottom: 1px solid #2a3040;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header .icon { font-size: 24px; }
  .header .text { flex: 1; min-width: 0; }
  .header .title { font-size: 14px; font-weight: 700; }
  .header .sub { font-size: 11px; color: #8a93aa; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .header .badge {
    background: rgba(245,166,35,0.12);
    border: 1px solid rgba(245,166,35,0.3);
    color: #f5a623;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
  }
  .header .badge.live {
    background: rgba(0,214,143,0.12);
    border-color: rgba(0,214,143,0.3);
    color: #00d68f;
  }

  .job-bar {
    background: #131720;
    border-bottom: 1px solid #2a3040;
    padding: 10px 16px;
    font-size: 12px;
    display: none;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .job-bar.show { display: flex; }
  .job-bar .label { color: #8a93aa; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; }
  .job-bar .value { color: #e8edf5; font-weight: 600; }
  .job-bar .sep { color: #2a3040; }

  .main-area {
    overflow: hidden;
    position: relative;
    min-height: 0;
  }
  .chat {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }
  .chat::-webkit-scrollbar-thumb:hover { background: #3a4050; }

  .loading {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    color: #8a93aa;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #2a3040;
    border-top-color: #f5a623;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-screen {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 30px 20px;
    text-align: center;
    color: #ff4757;
  }
  .error-screen h2 { margin-bottom: 8px; font-size: 18px; }
  .error-screen p { color: #8a93aa; font-size: 14px; max-width: 320px; }

  .msg {
    max-width: 85%;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #4a9eff;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #1e2433;
    color: #e8edf5;
    border-bottom-left-radius: 4px;
    border: 1px solid #2a3040;
  }
  .msg.system {
    align-self: center;
    background: rgba(245,166,35,0.08);
    color: #f5a623;
    border: 1px solid rgba(245,166,35,0.2);
    font-size: 12px;
    padding: 8px 14px;
    max-width: 90%;
    text-align: center;
  }
  .msg.system.success {
    background: rgba(0,214,143,0.1);
    color: #00d68f;
    border-color: rgba(0,214,143,0.3);
  }
  .msg.system.error {
    background: rgba(255,71,87,0.1);
    color: #ff4757;
    border-color: rgba(255,71,87,0.3);
  }
  .msg .ant-tag {
    font-size: 10px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .typing {
    align-self: flex-start;
    background: #1e2433;
    border: 1px solid #2a3040;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    padding: 14px 16px;
    display: flex;
    gap: 4px;
  }
  .typing span {
    width: 8px;
    height: 8px;
    background: #4a9eff;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  .upload-msg {
    align-self: flex-end;
    background: #1e2433;
    border: 1px solid #4a9eff;
    border-radius: 14px;
    padding: 10px 14px;
    max-width: 85%;
    font-size: 13px;
    min-width: 220px;
  }
  .upload-msg .filename {
    color: #e8edf5;
    font-weight: 600;
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-msg .progress-bar {
    width: 100%;
    height: 4px;
    background: #2a3040;
    border-radius: 2px;
    overflow: hidden;
  }
  .upload-msg .progress-fill {
    height: 100%;
    background: #4a9eff;
    width: 0%;
    transition: width 0.3s;
  }
  .upload-msg.success { border-color: #00d68f; }
  .upload-msg.success .progress-fill { background: #00d68f; }
  .upload-msg.error { border-color: #ff4757; }
  .upload-msg.error .progress-fill { background: #ff4757; }
  .upload-msg .status {
    font-size: 11px;
    color: #8a93aa;
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .upload-msg.success .status { color: #00d68f; }
  .upload-msg.error .status { color: #ff4757; }

  .quick-actions {
    background: #131720;
    border-top: 1px solid #2a3040;
    padding: 8px 12px;
    display: none;
    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .quick-actions.show { display: flex; }
  .quick-actions::-webkit-scrollbar { display: none; }
  .quick-actions .quick-btn {
    background: #1e2433;
    border: 1px solid #2a3040;
    color: #e8edf5;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .quick-actions .quick-btn:hover {
    background: #2a3040;
    border-color: #4a9eff;
  }
  .quick-actions .quick-btn:active { transform: scale(0.95); }

  .submit-banner {
    display: none;
    background: linear-gradient(135deg, #00d68f, #00aa70);
    color: #080a0f;
    padding: 14px 16px;
    text-align: center;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    border: none;
    width: 100%;
    transition: opacity 0.15s;
  }
  .submit-banner.show { display: block; }
  .submit-banner:hover { opacity: 0.9; }
  .submit-banner:disabled { opacity: 0.6; cursor: not-allowed; }

  .input-wrap {
    background: #131720;
    border-top: 1px solid #2a3040;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: none;
  }
  .input-wrap.show { display: block; }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .input-row textarea {
    flex: 1;
    background: #0e1118;
    border: 1px solid #2a3040;
    border-radius: 12px;
    color: #e8edf5;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 16px;
    resize: none;
    outline: none;
    max-height: 100px;
    min-height: 42px;
    line-height: 1.4;
    -webkit-appearance: none;
  }
  .input-row textarea:focus { border-color: #4a9eff; }
  .input-row textarea::placeholder { color: #5a6480; }
  .btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-camera { background: #2a3040; color: #e8edf5; }
  .btn-camera:hover:not(:disabled) { background: #3a4050; }
  .btn-send { background: #4a9eff; color: white; }
  .btn-send:hover:not(:disabled) { background: #3a8eef; }
  .btn-mic { background: #1e2433; color: #8a93aa; border: 1px solid #2a3040; }
  .btn-mic.recording {
    background: #ff4757;
    color: white;
    border-color: #ff4757;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.6); }
    50% { box-shadow: 0 0 0 8px rgba(255,71,87,0); }
  }

  input[type="file"] { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="icon">🐜</div>
  <div class="text">
    <div class="title">Tech Ant</div>
    <div class="sub" id="header-sub">Loading...</div>
  </div>
  <div class="badge" id="header-badge">CONNECTING</div>
</div>

<div class="job-bar" id="job-bar">
  <span class="label">Job</span><span class="value" id="job-id">—</span>
  <span class="sep">•</span>
  <span class="value" id="job-customer">—</span>
  <span class="sep">•</span>
  <span class="value" id="job-appliance">—</span>
</div>

<div class="main-area" id="main-area">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading job context...</p>
  </div>
</div>

<button class="submit-banner" id="submit-banner" onclick="openCompletionChoice()">
  ✅ Ready to Submit TDR — Tap to Finalize
</button>

<!-- 2026-06-01: 4-button completion selector overlay. Replaces the prior
     hardcoded-to-repair_complete submit. Each button maps to a completion_type
     that tech_job_complete uses to set jobs.scheduling_status, routing the
     job into the correct office bucket (Needs Invoiced / Needs Parts / Held /
     No Fix Possible). -->
<div id="completion-overlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:20px">
  <div style="background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:24px;max-width:480px;width:100%;color:#f5f5f5">
    <h3 style="margin:0 0 6px;font-size:18px">How did this job finish?</h3>
    <p style="margin:0 0 18px;color:#888;font-size:13px">Pick one. Submits the TDR and routes the job to the right office bucket.</p>
    <button class="cbtn" data-ct="repair_complete" onclick="finalizeWithCompletion('repair_complete')">
      ✅ Job Complete
    </button>
    <button class="cbtn" data-ct="parts_needed" onclick="finalizeWithCompletion('parts_needed')">
      📦 Parts Needed
    </button>
    <button class="cbtn" data-ct="reassignment_needed" onclick="finalizeWithCompletion('reassignment_needed')">
      🔄 Reassignment Needed
    </button>
    <button class="cbtn" data-ct="no_repair" onclick="finalizeWithCompletion('no_repair')">
      ❌ Not Worth Fixing
    </button>
    <button class="cbtn cbtn-cancel" onclick="closeCompletionChoice()">Cancel</button>
  </div>
</div>
<style>
  #completion-overlay { display:none }
  #completion-overlay.show { display:flex }
  .cbtn { display:block; width:100%; padding:14px 16px; margin:8px 0; font-size:15px;
    background:#2a2a2a; color:#f5f5f5; border:1px solid #444; border-radius:8px;
    cursor:pointer; text-align:left; transition:background .15s }
  .cbtn:hover { background:#383838 }
  .cbtn[data-ct="repair_complete"] { border-color:#3a7d3a; }
  .cbtn[data-ct="parts_needed"] { border-color:#7d6e3a; }
  .cbtn[data-ct="reassignment_needed"] { border-color:#3a5d7d; }
  .cbtn[data-ct="no_repair"] { border-color:#7d3a3a; }
  .cbtn-cancel { margin-top:14px; background:transparent; border-color:#555; color:#888; }
</style>

<div class="quick-actions" id="quick-actions"></div>

<div class="input-wrap" id="input-wrap">
  <div class="input-row">
    <button class="btn btn-camera" onclick="document.getElementById('file-input').click()" title="Upload photo/video">📷</button>
    <button class="btn btn-mic" id="btn-mic" onclick="toggleRecording()" title="Voice input">🎤</button>
    <textarea id="input-msg" placeholder="Type or tap mic..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoGrow(this)"></textarea>
    <button class="btn btn-send" onclick="sendMessage()">↑</button>
  </div>
</div>

<input type="file" id="file-input" multiple accept="image/*,video/*" onchange="handleFiles(event)">

<script>
const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const NETLIFY_BASE = window.location.origin;

const params = new URLSearchParams(window.location.search);
const JOB_ID = params.get('job_id');
const TECH_ID = params.get('tech_id');
const SESSION_ID = params.get('session_id') || ('tech_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));

let conversationHistory = [];
let collectedData = {};
let isSubmitting = false;
let recognition = null;
let isRecording = false;
let appliancetype = 'other';
let chatEl = null;

async function init() {
  if (!JOB_ID || !TECH_ID) {
    showError('Missing parameters', 'This page needs job_id and tech_id in the URL. Use the link sent to you via SMS.');
    return;
  }

  try {
    const res = await fetch('/.netlify/functions/xano-proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        endpoint: 'get_job_for_dashboard',
        payload: { job_id: parseInt(JOB_ID, 10) },
        method: 'POST'
      })
    });
    if (!res.ok) throw new Error(`Could not load job (${res.status})`);
    const data = await res.json();
    if (!data.success || !data.job) throw new Error('Job not found');

    appliancetype = ((data.appliance && data.appliance.type) || 'other').toLowerCase();

    document.getElementById('header-sub').textContent = `Tech ID ${TECH_ID} • Job #${JOB_ID}`;
    const badge = document.getElementById('header-badge');
    badge.textContent = 'LIVE';
    badge.classList.add('live');

    document.getElementById('job-id').textContent = '#' + (data.job.id || JOB_ID);
    document.getElementById('job-customer').textContent = (data.customer && data.customer.name) || 'Customer';
    document.getElementById('job-appliance').textContent = `${data.appliance.brand || ''} ${data.appliance.type || ''}`.trim() || 'Appliance';
    document.getElementById('job-bar').classList.add('show');

    document.getElementById('main-area').innerHTML = '<div class="chat" id="chat"></div>';
    chatEl = document.getElementById('chat');

    document.getElementById('input-wrap').classList.add('show');
    showQuickActions();

    setupSpeechRecognition();
    sendInitialGreeting();

  } catch (err) {
    showError('Could not load job', err.message);
  }
}

function showError(title, msg) {
  document.getElementById('main-area').innerHTML = `
    <div class="error-screen">
      <h2>⚠️ ${escapeHtml(title)}</h2>
      <p>${escapeHtml(msg)}</p>
    </div>
  `;
}

async function sendInitialGreeting() {
  await sendToAnt("Hey Ant, I'm here at the job. Let's do the report.", true);
}

async function sendMessage() {
  const input = document.getElementById('input-msg');
  const text = input.value.trim();
  if (!text || isSubmitting) return;
  input.value = '';
  autoGrow(input);
  await sendToAnt(text, false);
}

async function sendToAnt(text, hideUserMsg) {
  if (!hideUserMsg) addMessage('user', text);
  showTyping();

  try {
    const res = await fetch(`${XANO_BASE}/tech_ant_reply`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: SESSION_ID,
        job_id: parseInt(JOB_ID, 10),
        tech_id: parseInt(TECH_ID, 10),
        user_message: text,
        conversation_history: conversationHistory,
        attachment_ids: []
      })
    });

    hideTyping();

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Ant error (${res.status}): ${errText.slice(0, 200)}`);
    }

    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Ant returned no success');

    addMessage('assistant', data.reply);

    conversationHistory.push({ role: 'user', content: text });
    conversationHistory.push({ role: 'assistant', content: data.reply });

    if (data.collected_data) {
      collectedData = Object.assign({}, collectedData, data.collected_data);
    }

    if (data.ready_to_submit) {
      document.getElementById('submit-banner').classList.add('show');
    }
  } catch (err) {
    hideTyping();
    addSystem('error', '⚠️ ' + err.message);
  }
}

function addMessage(role, content) {
  if (!chatEl) return;
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  if (role === 'assistant') {
    const tag = document.createElement('div');
    tag.className = 'ant-tag';
    tag.textContent = '🐜 Ant';
    msg.appendChild(tag);
    const textNode = document.createElement('div');
    textNode.textContent = content;
    msg.appendChild(textNode);
  } else {
    msg.textContent = content;
  }
  chatEl.appendChild(msg);
  scrollToBottom();
}

function addSystem(type, content) {
  if (!chatEl) return;
  const msg = document.createElement('div');
  msg.className = 'msg system ' + (type || '');
  msg.textContent = content;
  chatEl.appendChild(msg);
  scrollToBottom();
}

function showTyping() {
  if (!chatEl) return;
  if (document.getElementById('typing-indicator')) return;
  const t = document.createElement('div');
  t.className = 'typing';
  t.id = 'typing-indicator';
  t.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(t);
  scrollToBottom();
}

function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function scrollToBottom() {
  if (chatEl) {
    requestAnimationFrame(() => {
      chatEl.scrollTop = chatEl.scrollHeight;
    });
  }
}

function handleFiles(event) {
  const files = Array.from(event.target.files);
  event.target.value = '';
  files.forEach(uploadFile);
}

async function uploadFile(file) {
  if (!chatEl) return;
  const msgEl = document.createElement('div');
  msgEl.className = 'upload-msg';
  msgEl.innerHTML = `
    <div class="filename">${escapeHtml(file.name)}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:5%"></div></div>
    <div class="status">Starting upload...</div>
  `;
  chatEl.appendChild(msgEl);
  scrollToBottom();

  const updateProgress = (pct, status) => {
    const fill = msgEl.querySelector('.progress-fill');
    const stat = msgEl.querySelector('.status');
    if (fill) fill.style.width = pct + '%';
    if (stat) stat.textContent = status;
  };

  const setError = (msg) => {
    msgEl.classList.add('error');
    updateProgress(100, '❌ ' + msg);
  };

  const setSuccess = () => {
    msgEl.classList.add('success');
    updateProgress(100, '✓ Uploaded');
  };

  try {
    updateProgress(10, 'Preparing...');

    const fileType = file.type.startsWith('video/') ? 'video' : 'photo';
    const xanoBody = {
      job_id: parseInt(JOB_ID, 10),
      attachment_type: 'tdr',
      file_type: fileType,
      original_filename: file.name,
      mime_type: file.type || 'application/octet-stream',
      uploaded_by: 'tech',
      tech_id: parseInt(TECH_ID, 10)
    };

    const xanoRes = await fetch(`${XANO_BASE}/generate_upload_url`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(xanoBody)
    });
    if (!xanoRes.ok) {
      const t = await xanoRes.text();
      throw new Error(`Xano (${xanoRes.status}): ${t.slice(0,80)}`);
    }
    const xanoData = await xanoRes.json();
    if (!xanoData.success) throw new Error('Xano returned no success');

    updateProgress(20, 'Got upload URL...');

    const presignRes = await fetch(`${NETLIFY_BASE}/.netlify/functions/s3-presign`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        s3_key: xanoData.s3_key,
        mime_type: file.type || 'application/octet-stream'
      })
    });
    if (!presignRes.ok) {
      const t = await presignRes.text();
      throw new Error(`Sign (${presignRes.status}): ${t.slice(0,80)}`);
    }
    const presignData = await presignRes.json();
    if (!presignData.success) throw new Error('Presign no success');

    updateProgress(30, 'Uploading...');

    await uploadToS3(file, presignData.upload_url, (pct) => {
      updateProgress(30 + pct * 0.6, `Uploading ${Math.round(pct)}%`);
    });

    updateProgress(95, 'Finalizing...');

    await fetch(`${XANO_BASE}/save_attachment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        attachment_id: xanoData.attachment_id,
        file_size_bytes: file.size
      })
    });

    setSuccess();
    const description = file.type.startsWith('video/') ? 'video' : 'photo';
    sendToAnt(`I just uploaded a ${description}: ${file.name}`, false);

  } catch (err) {
    console.error(err);
    setError(err.message || 'Upload failed');
  }
}

function uploadToS3(file, url, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress((e.loaded / e.total) * 100);
    };
    xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error('S3 ' + xhr.status));
    xhr.onerror = () => reject(new Error('S3 network error'));
    xhr.open('PUT', url);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.send(file);
  });
}

// 2026-06-01: replaces the prior submitTDR() which always defaulted to
// repair_complete. The new flow:
//   1. Tap submit banner -> opens completion-overlay (4 buttons)
//   2. Tech picks one -> finalizeWithCompletion(ct) runs
//      a. create_tdr (TDR row, HCP note, Danielle SMS)
//      b. tech_job_complete (sets jobs.scheduling_status based on ct,
//         which is what routes the job into the correct office bucket)
function openCompletionChoice() {
  if (isSubmitting) return;
  document.getElementById('completion-overlay').classList.add('show');
}
function closeCompletionChoice() {
  document.getElementById('completion-overlay').classList.remove('show');
}

const COMPLETION_LABEL = {
  repair_complete: 'Job Complete',
  parts_needed: 'Parts Needed',
  reassignment_needed: 'Reassignment Needed',
  no_repair: 'Not Worth Fixing'
};

async function finalizeWithCompletion(completionType) {
  if (isSubmitting) return;
  if (!COMPLETION_LABEL[completionType]) return;
  isSubmitting = true;

  closeCompletionChoice();
  const banner = document.getElementById('submit-banner');
  banner.disabled = true;
  banner.textContent = `⏳ Submitting (${COMPLETION_LABEL[completionType]})...`;

  try {
    // STEP 1 — create_tdr (existing path)
    const tdrPayload = {
      job_id: parseInt(JOB_ID, 10),
      technician_id: parseInt(TECH_ID, 10),
      problem_summary: collectedData.symptom || collectedData.problem_summary || '',
      diagnostic_test_performed: collectedData.diagnostic_test_performed || '',
      failed_component: collectedData.failed_component || '',
      failure_cause: collectedData.failure_cause || '',
      failure_cause_notes: collectedData.failure_cause_notes || '',
      verified_part_number: collectedData.verified_part_number || '',
      final_recommendation: collectedData.recommendation || '',
      technician_notes: collectedData.tech_notes || '',
      tech_ant_session_id: SESSION_ID,
      status: 'submitted',
      repair_completed: completionType === 'repair_complete' ? 'completed' : 'not_completed',
      repair_not_completed_reason: completionType === 'repair_complete' ? '' : COMPLETION_LABEL[completionType],
      report_date: new Date().toISOString()
    };

    const tdrRes = await fetch(`${NETLIFY_BASE}/.netlify/functions/xano-proxy`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint: 'create_tdr', payload: tdrPayload })
    });
    const tdrData = await tdrRes.json();
    if (!tdrData || !tdrData.tdr || !tdrData.tdr.id) {
      throw new Error('TDR submission failed: ' + JSON.stringify(tdrData).slice(0, 150));
    }

    // STEP 2 — route the job to the right office bucket based on completion type:
    //   repair_complete  -> tech_job_complete -> scheduling_status="completed"
    //                       (Needs Invoiced bucket)
    //   parts_needed     -> tech_job_complete -> scheduling_status="awaiting_parts"
    //                       (Needs Parts bucket)
    //   no_repair        -> tech_job_complete -> scheduling_status="no_fix_possible"
    //                       (No Fix Possible bucket)
    //   reassignment_needed -> tech-request-reassignment (custom Netlify fn):
    //                       clears technician_id + scheduled_start, flips
    //                       scheduling_status back to "needs_scheduled" so the
    //                       job pops back into the Needs Scheduled bucket for
    //                       the office to manually re-route to a different tech.
    let completeRes, completeData;
    if (completionType === 'reassignment_needed') {
      completeRes = await fetch(`${NETLIFY_BASE}/.netlify/functions/tech-request-reassignment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          job_id: parseInt(JOB_ID, 10),
          technician_id: parseInt(TECH_ID, 10),
          tdr_id: tdrData.tdr.id,
          reason: collectedData.tech_notes || 'Tech requested reassignment via TDR submit'
        })
      });
      completeData = await completeRes.json();
    } else {
      const completePayload = {
        job_id: parseInt(JOB_ID, 10),
        technician_id: parseInt(TECH_ID, 10),
        completion_type: completionType,
        tdr_id: tdrData.tdr.id
      };
      completeRes = await fetch(`${NETLIFY_BASE}/.netlify/functions/xano-proxy`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint: 'tech_job_complete', payload: completePayload })
      });
      completeData = await completeRes.json();
    }

    if (completeData && completeData.success) {
      addSystem('success', `✅ TDR #${tdrData.tdr.id} submitted. Job routed: ${COMPLETION_LABEL[completionType]}.`);
      banner.textContent = `✅ Submitted #${tdrData.tdr.id} — ${COMPLETION_LABEL[completionType]}`;
      banner.onclick = null;
    } else {
      // TDR was written but routing failed — surface so the office knows
      addSystem('error', `⚠️ TDR saved but routing failed: ${JSON.stringify(completeData).slice(0,150)}`);
      banner.textContent = `⚠️ Partial: TDR saved, route failed`;
      banner.disabled = false;
      isSubmitting = false;
    }
  } catch (err) {
    addSystem('error', '⚠️ Submit failed: ' + err.message);
    banner.disabled = false;
    banner.textContent = '⚠️ Try Again';
    isSubmitting = false;
  }
}

// Backward-compat alias in case anything else calls submitTDR()
async function submitTDR() { openCompletionChoice(); }

function setupSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('btn-mic').style.display = 'none';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const input = document.getElementById('input-msg');
    input.value = (input.value + ' ' + transcript).trim();
    autoGrow(input);
    input.focus();
  };

  recognition.onend = () => {
    isRecording = false;
    document.getElementById('btn-mic').classList.remove('recording');
  };

  recognition.onerror = (e) => {
    console.warn('Speech error:', e.error);
    isRecording = false;
    document.getElementById('btn-mic').classList.remove('recording');
  };
}

function toggleRecording() {
  if (!recognition) return;
  if (isRecording) {
    recognition.stop();
  } else {
    try {
      recognition.start();
      isRecording = true;
      document.getElementById('btn-mic').classList.add('recording');
    } catch (e) {
      console.warn('Mic error:', e);
    }
  }
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
