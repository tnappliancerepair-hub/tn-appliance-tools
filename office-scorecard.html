<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Office Scorecard — Owner</title>
<style>
  :root{--bg:#0e1116;--card:#171b22;--line:#252b34;--ink:#e8ecf2;--dim:#8b94a3;--gold:#f0a500;--good:#2ecc71;--warn:#f39c12;--bad:#e74c3c;--accent:#4aa3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:4px 0 2px;letter-spacing:-.3px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 16px}
  .gate{display:flex;gap:8px;margin:20px 0}
  input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 13px;font-size:16px}
  button{background:var(--gold);color:#1a1204;border:0;border-radius:10px;padding:11px 16px;font-weight:800;font-size:15px;cursor:pointer}
  button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
  .sec{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{background:#0f131a;border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat .n{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .stat .l{font-size:12px;color:var(--dim);margin-top:2px}
  .stat.bad .n{color:var(--bad)} .stat.good .n{color:var(--good)} .stat.warn .n{color:var(--warn)}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border:0}
  .row b{font-variant-numeric:tabular-nums}
  .ago{color:var(--dim);font-size:12px}
  .flag{display:inline-block;background:rgba(231,76,60,.14);color:#ff8a7a;border:1px solid rgba(231,76,60,.35);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:8px}
  .ok{color:var(--good)}
  .muted{color:var(--dim);font-size:12px;margin-top:10px}
  a.day{color:var(--dim);text-decoration:none;font-size:13px;border-bottom:1px dotted var(--line)}
</style>

<h1>🏢 Office Scorecard</h1>
<p class="sub">The record, not the story — phones + office output, timestamped. Owner only.</p>

<div id="gate" class="gate">
  <input id="sec" type="password" placeholder="Owner secret" autocomplete="off">
  <button onclick="save()">Open</button>
</div>

<div id="ctl" style="display:none">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
    <span class="ago" id="when"></span>
    <span style="flex:1"></span>
    <a class="day" href="#" onclick="load(7);return false">7d</a> &nbsp;
    <a class="day" href="#" onclick="load(14);return false">14d</a> &nbsp;
    <a class="day" href="#" onclick="load(30);return false">30d</a> &nbsp;
    <button class="ghost" onclick="load(curDays)">↻</button>
  </div>
  <div id="body"></div>
</div>

<script>
let curDays=7;
function save(){const v=document.getElementById('sec').value.trim();if(!v)return;localStorage.setItem('tn_owner_sec',v);document.getElementById('gate').style.display='none';document.getElementById('ctl').style.display='block';load(7);}
function ago(ms){if(!ms)return 'never';const s=(Date.now()-ms)/1000;if(s<90)return 'just now';if(s<5400)return Math.round(s/60)+'m ago';if(s<172800)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
function stat(n,l,cls){return `<div class="stat ${cls||''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;}

async function load(days){
  curDays=days;
  const sec=localStorage.getItem('tn_owner_sec')||'';
  const body=document.getElementById('body');
  body.innerHTML='<div class="muted">Loading…</div>';
  let d;
  try{const r=await fetch('/.netlify/functions/office-scorecard?secret='+encodeURIComponent(sec)+'&days='+days);d=await r.json();}
  catch(e){body.innerHTML='<div class="flag">Failed to load: '+e+'</div>';return;}
  if(!d.ok){body.innerHTML='<div class="flag">'+(d.error||'error')+'</div>';return;}
  document.getElementById('when').textContent='updated '+ago(d.generated_ms)+' · window '+d.window_days+'d';

  const p=d.phone_today||{};
  const cb=d.callbacks||{};
  const f=d.office_footprint||{};

  const droppedCls=(p.dropped>0)?'bad':'good';
  const phoneCard=`
    <div class="sec">📞 Phones — last 24h</div>
    <div class="card"><div class="grid">
      ${stat(p.total??'—','calls answered')}
      ${stat(p.arrival??'—','"when\'s he coming?"','warn')}
      ${stat(p.asked_human??'—','asked for a human','warn')}
      ${stat(p.transferred??0,'connected to a person',(p.transferred>0?'good':''))}
      ${stat(p.dropped??'—','died / silence',droppedCls)}
    </div>
    ${(p.arrival>2)?`<div class="flag">🎯 ${p.arrival} arrival/"when\'s he coming" calls — Ann now answers these live with the tech\'s ETA. Watch this number drop.</div>`:''}
    </div>`;

  const oldestTxt=cb.oldest_ms?('oldest '+ago(cb.oldest_ms)):'';
  const cbCls=(cb.open>0)?'bad':'good';
  const cbCard=`
    <div class="sec">📲 Callback queue</div>
    <div class="card">
      <div class="row"><span>Open callbacks (should be 0 by end of day)</span><b class="${cb.open>0?'':'ok'}">${cb.ok?cb.open:'—'}</b></div>
      ${oldestTxt?`<div class="row"><span>Oldest still open</span><b class="ago">${oldestTxt}</b></div>`:''}
    </div>`;

  const laCls=f.last_active_ms&&(Date.now()-f.last_active_ms>86400000)?'bad':'';
  const footCard=`
    <div class="sec">🗂️ Office output — last ${d.window_days} days</div>
    <div class="card">
      <div class="row"><span>Last active in the system</span><b class="ago ${laCls}">${ago(f.last_active_ms)}</b></div>
      <div class="row"><span>Jobs scheduled (saved)</span><b>${f.schedules_saved}</b></div>
      <div class="row"><span>Board moves</span><b>${f.board_moves}</b></div>
      <div class="row"><span>Invoices logged</span><b>${f.invoices_logged}</b></div>
      <div class="row"><span>Customer texts sent</span><b>${f.customer_texts}</b></div>
      <div class="row"><span>Reports / TDRs filed</span><b>${f.tdrs_filed}</b></div>
      <div class="row"><span>Checklist ticks</span><b>${f.checklist_ticks}</b></div>
    </div>`;

  body.innerHTML=phoneCard+cbCard+footCard+`<div class="muted">${d.note||''}</div>`;
}

(function(){const s=localStorage.getItem('tn_owner_sec');if(s){document.getElementById('sec').value=s;save();}})();
</script>
