<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TN Appliance — TDR Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080a0f;
      --card: #0e1118;
      --card2: #131720;
      --border: #1e2433;
      --border2: #2a3040;
      --accent: #f5a623;
      --accent2: #ff6b35;
      --blue: #4a9eff;
      --green: #00d68f;
      --red: #ff4757;
      --text: #e8edf5;
      --muted: #5a6480;
      --muted2: #8a93aa;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: var(--sans); color: var(--text); min-height: 100vh; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(74,158,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,158,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    .container { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 48px; }
    .header { background: linear-gradient(135deg, #0e1118, #131a2a); border: 1px solid var(--border2); border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-icon { font-size: 28px; }
    .header-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .header-sub { font-size: 11px; color: var(--muted2); margin-top: 2px; font-family: var(--mono); }
    .header-badge { background: rgba(245,166,35,0.12); border: 1px solid rgba(245,166,35,0.3); border-radius: 20px; padding: 5px 12px; font-size: 11px; color: var(--accent); font-weight: 700; font-family: var(--mono); }
    .job-banner { background: rgba(0,214,143,0.06); border: 1px solid rgba(0,214,143,0.2); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--green); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .job-banner.loading { color: var(--accent); border-color: rgba(245,166,35,0.2); background: rgba(245,166,35,0.06); }
    .job-banner.error { color: var(--red); border-color: rgba(255,71,87,0.2); background: rgba(255,71,87,0.06); }
    .customer-card { background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .customer-card-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; font-family: var(--mono); }
    .customer-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .info-item label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--mono); display: block; margin-bottom: 3px; }
    .info-item span { font-size: 14px; font-weight: 600; color: var(--text); }
    .info-item.full { grid-column: 1 / -1; }
    .photos-section { background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .photos-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; font-family: var(--mono); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .photos-count { color: var(--muted2); font-weight: 400; }
    .photos-loading { display: flex; align-items: center; gap: 8px; padding: 12px; color: var(--muted2); font-size: 12px; }
    .mini-spinner { width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .photo-section-group { margin-bottom: 14px; }
    .photo-section-group:last-child { margin-bottom: 0; }
    .photo-section-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--mono); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .photo-section-label .pill { padding: 1px 6px; border-radius: 4px; font-size: 9px; }
    .photo-section-label .pill.intake { background: rgba(74,158,255,0.15); color: var(--blue); }
    .photo-section-label .pill.completion { background: rgba(245,166,35,0.15); color: var(--accent); }
    .photo-section-label .pill.tdr { background: rgba(0,214,143,0.15); color: var(--green); }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photo-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--border2); cursor: pointer; transition: border-color 0.2s; position: relative; background: #000; }
    .photo-thumb:hover { border-color: var(--accent); }
    .photo-thumb img, .photo-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-thumb .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .photo-thumb .play-overlay::after { content: '▶'; color: white; font-size: 22px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .photo-thumb .type-tag { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.7); color: white; font-size: 9px; padding: 2px 5px; border-radius: 3px; font-family: var(--mono); text-transform: uppercase; }
    .no-photos { text-align: center; padding: 20px; color: var(--muted2); font-size: 13px; }
    .photos-error { padding: 12px; color: var(--red); font-size: 12px; background: rgba(255,71,87,0.06); border-radius: 6px; }
    .diag-summary { background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .diag-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
    .ant-badge { background: rgba(245,166,35,0.12); border: 1px solid rgba(245,166,35,0.25); border-radius: 4px; padding: 1px 6px; font-size: 10px; color: var(--accent); }
    .diag-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .diag-item:last-child { border-bottom: none; }
    .diag-label { font-family: var(--mono); font-size: 10px; color: var(--muted); min-width: 100px; padding-top: 1px; text-transform: uppercase; }
    .diag-value { color: var(--text); flex: 1; }
    .section-card { background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .section-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; font-family: var(--mono); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; font-family: var(--mono); }
    .field input, .field textarea, .field select { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 14px; font-family: var(--sans); outline: none; transition: border-color 0.2s; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; line-height: 1.5; min-height: 80px; }
    .field select { cursor: pointer; }
    select option { background: #0e1118; }
    .part-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .part-option { background: var(--bg); border: 2px solid var(--border2); border-radius: 10px; padding: 12px; cursor: pointer; transition: all 0.2s; }
    .part-option.selected-oem { border-color: var(--blue); background: rgba(74,158,255,0.06); }
    .part-option.selected-amazon { border-color: var(--accent); background: rgba(245,166,35,0.06); }
    .part-option-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono); margin-bottom: 4px; }
    .part-option-label.oem { color: var(--blue); }
    .part-option-label.amazon { color: var(--accent); }
    .part-option input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border2); color: var(--text); font-size: 13px; font-family: var(--mono); padding: 4px 0; outline: none; }
    .part-option-desc { font-size: 11px; color: var(--muted2); margin-top: 6px; }
    .rec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rec-btn { background: var(--bg); border: 2px solid var(--border2); border-radius: 10px; padding: 14px 12px; cursor: pointer; text-align: center; transition: all 0.2s; font-family: var(--sans); }
    .rec-btn:hover { border-color: var(--border); }
    .rec-btn.selected-repair { border-color: var(--green); background: rgba(0,214,143,0.06); }
    .rec-btn.selected-diy { border-color: var(--blue); background: rgba(74,158,255,0.06); }
    .rec-btn.selected-replace { border-color: var(--red); background: rgba(255,71,87,0.06); }
    .rec-btn.selected-inhome { border-color: var(--accent); background: rgba(245,166,35,0.06); }
    .rec-icon { font-size: 22px; margin-bottom: 6px; }
    .rec-label { font-size: 12px; font-weight: 700; color: var(--text); }
    .rec-sub { font-size: 10px; color: var(--muted2); margin-top: 3px; }
    .estimate-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ai-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 10px; color: #080a0f; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--sans); transition: opacity 0.2s; margin-bottom: 10px; }
    .ai-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .send-btn { width: 100%; padding: 16px; background: var(--green); border: none; border-radius: 12px; color: #080a0f; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--sans); transition: opacity 0.2s; letter-spacing: 0.02em; }
    .send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-box { background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.25); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--red); margin-bottom: 14px; }
    .done-screen { text-align: center; padding: 40px 24px; }
    .done-icon { font-size: 56px; margin-bottom: 16px; }
    .done-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .done-sub { font-size: 14px; color: var(--muted2); margin-bottom: 24px; }
    .done-details { background: var(--card2); border: 1px solid var(--border2); border-radius: 10px; padding: 16px; text-align: left; margin-bottom: 20px; font-family: var(--mono); font-size: 13px; }
    .done-row { display: flex; justify-content: space-between; padding: 4px 0; }
    .done-row span:first-child { color: var(--muted); }
    .done-row span:last-child { color: var(--text); font-weight: 600; }
    .hcp-status { border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; text-align: left; }
    .hcp-ok { background: rgba(0,214,143,0.08); border: 1px solid rgba(0,214,143,0.25); color: var(--green); }
    .hcp-fail { background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.25); color: var(--red); }
    .new-btn { padding: 13px 32px; background: var(--accent); border: none; border-radius: 10px; color: #080a0f; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--sans); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
    .loading-screen { padding: 60px 24px; text-align: center; }
    .loading-screen p { color: var(--muted2); font-size: 14px; }
    .intake-card { background: var(--card); border: 1px solid var(--border2); border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .intake-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
    .load-btn { width: 100%; padding: 13px; background: var(--accent); border: none; border-radius: 10px; color: #080a0f; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--sans); margin-top: 4px; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
    .lightbox.show { display: flex; }
    .lightbox-content { max-width: 95%; max-height: 95%; }
    .lightbox img, .lightbox video { max-width: 100%; max-height: 90vh; display: block; }
    .lightbox .close { position: absolute; top: 16px; right: 20px; color: white; font-size: 32px; cursor: pointer; user-select: none; background: rgba(0,0,0,0.5); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="loading-screen">
        <div class="spinner"></div>
        <p>Loading TDR Tool...</p>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="close" onclick="closeLightbox(event)">×</div>
    <div class="lightbox-content" id="lightbox-content"></div>
  </div>

<script>
const XANO_BASE = "https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA";
const NETLIFY_BASE = window.location.origin;

let state = {
  step: "intake",
  jobId: "",
  job: null,
  attachments: [],
  attachmentUrls: {},
  attachmentsLoading: false,
  attachmentsError: "",
  customerReportedProblem: "",
  diagnosis: "",
  partType: "",
  oemPartNumber: "",
  oemPrice: "",
  amazonPartNumber: "",
  amazonPrice: "",
  repairEstimate: "",
  laborEstimate: "",
  recommendation: "",
  techNotes: "",
  aiLoading: false,
  submitResult: null,
  error: "",
};

function getUrlJobId() {
  const p = new URLSearchParams(window.location.search);
  return p.get("job_id") || p.get("job") || "";
}

async function loadJob(jobId) {
  state.step = "loading";
  state.error = "";
  render();
  try {
    const res = await fetch("/.netlify/functions/get-job-proxy?job_id=" + jobId);
    if (!res.ok) throw new Error("Job not found");
    const job = await res.json();
    state.job = job;
    state.jobId = jobId;
    state.customerReportedProblem = job.problem_summary || "";
    state.diagnosis = job.problem_summary || "";
    state.step = "review";
    render();
    loadAttachments(jobId);
  } catch(e) {
    state.error = "Could not load job #" + jobId + ". Check the job ID and try again.";
    state.step = "intake";
    render();
  }
}

async function loadAttachments(jobId) {
  state.attachmentsLoading = true;
  state.attachmentsError = "";
  state.attachments = [];
  state.attachmentUrls = {};
  renderPhotosOnly();

  try {
    const xanoRes = await fetch(`${XANO_BASE}/get_job_attachments?job_id=${jobId}`);
    if (!xanoRes.ok) throw new Error(`Could not load attachments (${xanoRes.status})`);
    const xanoData = await xanoRes.json();
    if (!xanoData.success) throw new Error("Attachment fetch failed");

    state.attachments = xanoData.attachments || [];

    if (state.attachments.length > 0) {
      const s3Keys = state.attachments.map(a => a.s3_key);
      const signRes = await fetch(`${NETLIFY_BASE}/.netlify/functions/s3-view-url`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ s3_keys: s3Keys })
      });
      if (signRes.ok) {
        const signData = await signRes.json();
        if (signData.success) {
          signData.signed_urls.forEach(s => { state.attachmentUrls[s.s3_key] = s.view_url; });
        }
      }
    }
  } catch(e) {
    state.attachmentsError = e.message || "Could not load photos";
  }
  state.attachmentsLoading = false;
  renderPhotosOnly();
}

async function aiPreFill() {
  if (!state.job) return;
  state.aiLoading = true;
  state.error = "";
  render();

  const prompt = `You are a senior appliance technician. Based on this service request, provide a diagnosis and part recommendation.

Appliance: ${state.job.brand} ${state.job.appliance_type}
Model: ${state.job.model_number || "Unknown"}
Customer reported: ${state.job.problem_summary}

Respond ONLY with a JSON object, no markdown:
{
  "diagnosis": "2-3 sentence technical summary of likely root cause in plain English",
  "oem_part_number": "OEM part number if confident, or null",
  "amazon_search": "Best search term to find this part on Amazon",
  "repair_estimate": "Labor estimate range e.g. $80-$120",
  "recommendation": "repair" or "diy" or "replace" or "inhome",
  "tech_notes": "Any important caveats or safety notes"
}`;

  try {
    const res = await fetch("/.netlify/functions/claude-proxy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 800,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json();
    if (data.diagnosis) {
      state.diagnosis = data.diagnosis || state.diagnosis;
      state.oemPartNumber = data.oem_part_number || "";
      state.repairEstimate = data.repair_estimate || "";
      state.recommendation = data.recommendation || "";
      state.techNotes = data.tech_notes || "";
    }
  } catch(e) {
    state.error = "AI pre-fill failed. Fill in manually.";
  }
  state.aiLoading = false;
  render();
}

async function submitTDR() {
  saveReviewInputs();
  if (!state.jobId) { state.error = "No job loaded."; render(); return; }
  if (!state.recommendation) { state.error = "Please select a recommendation."; render(); return; }
  if (!state.diagnosis.trim()) { state.error = "Please enter a diagnosis."; render(); return; }

  state.step = "submitting";
  state.error = "";
  render();

  const payload = {
    job_id: parseInt(state.jobId),
    technician_id: 1,
    technician_first_name: "Teddy",
    technician_last_name: "Pivacek",
    problem_summary: state.customerReportedProblem,
    diagnosis: state.diagnosis,
    confidence_level: "High",
    verified_part_number: state.partType === "oem" ? state.oemPartNumber : state.amazonPartNumber,
    part_source: state.partType,
    oem_part_number: state.oemPartNumber,
    oem_price: state.oemPrice,
    amazon_part_number: state.amazonPartNumber,
    amazon_price: state.amazonPrice,
    estimated_repair_cost_range: state.repairEstimate,
    final_recommendation: state.recommendation,
    technician_notes: state.techNotes,
    status: "submitted",
    report_date: new Date().toISOString(),
  };

  try {
    const res = await fetch("/.netlify/functions/xano-proxy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ endpoint: "create_tdr", payload })
    });
    const data = await res.json();
    if (data && data.tdr && data.tdr.id) {
      state.submitResult = data;
      state.step = "done";
    } else {
      throw new Error(JSON.stringify(data).slice(0, 200));
    }
  } catch(e) {
    state.error = "Submit failed: " + e.message;
    state.step = "review";
  }
  render();
}

function reset() {
  state = {
    step: "intake", jobId: "", job: null,
    attachments: [], attachmentUrls: {}, attachmentsLoading: false, attachmentsError: "",
    diagnosis: "", partType: "", oemPartNumber: "", oemPrice: "",
    amazonPartNumber: "", amazonPrice: "", repairEstimate: "",
    laborEstimate: "", recommendation: "", techNotes: "",
    aiLoading: false, submitResult: null, error: ""
  };
  render();
}

function renderHeader() {
  return `
    <div class="header">
      <div class="header-left">
        <div class="header-icon">🔧</div>
        <div>
          <div class="header-title">TN Appliance Exchange</div>
          <div class="header-sub">Technician Decision Report</div>
        </div>
      </div>
      <div class="header-badge">Teddy · Tech ID: 1</div>
    </div>`;
}

function renderIntake() {
  return `
    ${renderHeader()}
    <div class="intake-card">
      <div class="intake-title">Load Job</div>
      ${state.error ? `<div class="error-box">${state.error}</div>` : ""}
      <div class="field">
        <label>Xano Job ID</label>
        <input type="number" id="jobIdInput" placeholder="e.g. 188" value="${state.jobId}" />
      </div>
      <button class="load-btn" onclick="handleLoadJob()">Load Job →</button>
    </div>`;
}

function renderLoading() {
  return `
    ${renderHeader()}
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>Loading job from Xano...</p>
    </div>`;
}

function renderPhotosSection() {
  if (state.attachmentsLoading) {
    return `
      <div class="photos-section">
        <div class="photos-title">📸 Customer & Tech Uploads</div>
        <div class="photos-loading"><div class="mini-spinner"></div> Loading photos and videos...</div>
      </div>`;
  }
  if (state.attachmentsError) {
    return `
      <div class="photos-section">
        <div class="photos-title">📸 Customer & Tech Uploads</div>
        <div class="photos-error">⚠️ ${state.attachmentsError}</div>
      </div>`;
  }
  if (!state.attachments.length) {
    return `
      <div class="photos-section">
        <div class="photos-title">📸 Customer & Tech Uploads</div>
        <div class="no-photos">No photos or videos uploaded yet</div>
      </div>`;
  }

  const groups = { intake: [], completion: [], tdr: [] };
  state.attachments.forEach((a, idx) => {
    a._idx = idx;
    if (groups[a.attachment_type]) {
      groups[a.attachment_type].push(a);
    } else {
      groups.intake.push(a);
    }
  });

  const renderGroup = (label, type, items) => {
    if (!items.length) return "";
    return `
      <div class="photo-section-group">
        <div class="photo-section-label">${label} <span class="pill ${type}">${type}</span> <span class="photos-count">${items.length}</span></div>
        <div class="photo-grid">
          ${items.map(a => {
            const url = state.attachmentUrls[a.s3_key];
            if (!url) {
              return `<div class="photo-thumb"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted2);font-size:10px;text-align:center;padding:4px;">Unavailable</div></div>`;
            }
            const tag = a.file_type === 'video' ? 'VIDEO' : 'PHOTO';
            const inner = a.file_type === 'video'
              ? `<video src="${url}" muted preload="metadata"></video><div class="play-overlay"></div>`
              : `<img src="${url}" alt="" loading="lazy" />`;
            return `<div class="photo-thumb" onclick="openLightbox(${a._idx})">${inner}<div class="type-tag">${tag}</div></div>`;
          }).join("")}
        </div>
      </div>`;
  };

  return `
    <div class="photos-section">
      <div class="photos-title">
        <span>📸 Customer & Tech Uploads</span>
        <span class="photos-count">${state.attachments.length} total</span>
      </div>
      ${renderGroup("Customer intake", "intake", groups.intake)}
      ${renderGroup("Tech completion", "completion", groups.completion)}
      ${renderGroup("TDR evidence", "tdr", groups.tdr)}
    </div>`;
}

function renderReview() {
  const job = state.job;

  const recBtns = [
    { key: "repair", icon: "🔧", label: "Schedule Repair", sub: "Tech installs the part" },
    { key: "diy", icon: "📦", label: "DIY Part", sub: "Customer installs" },
    { key: "replace", icon: "🔄", label: "Replace Unit", sub: "Not worth repairing" },
    { key: "inhome", icon: "🏠", label: "Needs In-Home", sub: "Can't diagnose remotely" },
  ];

  return `
    ${renderHeader()}
    <div class="job-banner">
      ✅ Job #${state.jobId} — ${job.brand || ""} ${job.appliance_type || ""} ${job.model_number ? "· " + job.model_number : ""}
    </div>

    <div class="customer-card">
      <div class="customer-card-title">Customer Info</div>
      <div class="customer-info-grid">
        <div class="info-item">
          <label>Name</label>
          <span>${job.customer_name || "—"}</span>
        </div>
        <div class="info-item">
          <label>Phone</label>
          <span>${job.customer_phone || "—"}</span>
        </div>
        <div class="info-item">
          <label>Appliance</label>
          <span>${job.brand || ""} ${job.appliance_type || ""}</span>
        </div>
        <div class="info-item">
          <label>Model</label>
          <span style="font-family:var(--mono);font-size:12px;">${job.model_number || "Unknown"}</span>
        </div>
        <div class="info-item full">
          <label>Customer Reported</label>
          <span style="font-size:13px;color:var(--muted2);">${job.problem_summary || "—"}</span>
        </div>
      </div>
    </div>

    <div id="photos-container">${renderPhotosSection()}</div>

    <div class="diag-summary">
      <div class="diag-title">🐜 Ant Intake Summary <span class="ant-badge">AI Collected</span></div>
      <div class="diag-item"><div class="diag-label">Appliance</div><div class="diag-value">${job.appliance_type || "—"}</div></div>
      <div class="diag-item"><div class="diag-label">Brand</div><div class="diag-value">${job.brand || "—"}</div></div>
      <div class="diag-item"><div class="diag-label">Model</div><div class="diag-value" style="font-family:var(--mono);font-size:12px;">${job.model_number || "Not provided"}</div></div>
      <div class="diag-item"><div class="diag-label">Problem</div><div class="diag-value">${job.problem_summary || "—"}</div></div>
      <div class="diag-item"><div class="diag-label">Service</div><div class="diag-value">${job.recommended_service || "—"}</div></div>
      <div class="diag-item"><div class="diag-label">Source</div><div class="diag-value">${job.source_type || "—"}</div></div>
    </div>

    <div class="section-card">
      <div class="section-title">Your Diagnosis</div>
      ${state.error ? `<div class="error-box">${state.error}</div>` : ""}
      <button class="ai-btn" onclick="aiPreFill()" ${state.aiLoading ? "disabled" : ""}>
        ${state.aiLoading ? "⏳ Analyzing..." : "⚡ AI Pre-Fill Diagnosis"}
      </button>
      <div class="field">
        <label>Diagnosis (plain English)</label>
        <textarea id="diagnosisInput" rows="4" placeholder="What did you find? Describe in plain English...">${state.diagnosis}</textarea>
      </div>
      <div class="field">
        <label>Internal Notes</label>
        <textarea id="techNotesInput" rows="2" placeholder="Any caveats, safety notes, or internal context...">${state.techNotes}</textarea>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">Part Decision</div>
      <div class="part-grid">
        <div class="part-option ${state.partType === 'oem' ? 'selected-oem' : ''}" onclick="selectPart('oem')">
          <div class="part-option-label oem">OEM Part</div>
          <input type="text" id="oemPartInput" placeholder="Part number" value="${state.oemPartNumber}" onclick="event.stopPropagation()" oninput="state.oemPartNumber=this.value" />
          <input type="text" id="oemPriceInput" placeholder="Price e.g. $85" value="${state.oemPrice}" onclick="event.stopPropagation()" oninput="state.oemPrice=this.value" style="margin-top:6px;" />
          <div class="part-option-desc">Manufacturer original. Longer life, higher cost.</div>
        </div>
        <div class="part-option ${state.partType === 'amazon' ? 'selected-amazon' : ''}" onclick="selectPart('amazon')">
          <div class="part-option-label amazon">Amazon Generic</div>
          <input type="text" id="amazonPartInput" placeholder="Part # or ASIN" value="${state.amazonPartNumber}" onclick="event.stopPropagation()" oninput="state.amazonPartNumber=this.value" />
          <input type="text" id="amazonPriceInput" placeholder="Price e.g. $28" value="${state.amazonPrice}" onclick="event.stopPropagation()" oninput="state.amazonPrice=this.value" style="margin-top:6px;" />
          <div class="part-option-desc">Aftermarket. Faster and cheaper. Great for pumps, belts, hoses.</div>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">Estimate</div>
      <div class="estimate-row">
        <div class="field">
          <label>Repair Cost Range</label>
          <input type="text" id="repairEstInput" placeholder="e.g. $120-$160" value="${state.repairEstimate}" oninput="state.repairEstimate=this.value" />
        </div>
        <div class="field">
          <label>Labor Time</label>
          <input type="text" id="laborEstInput" placeholder="e.g. 1.5 hrs" value="${state.laborEstimate}" oninput="state.laborEstimate=this.value" />
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">Recommendation</div>
      <div class="rec-grid">
        ${recBtns.map(b => `
          <div class="rec-btn ${state.recommendation === b.key ? 'selected-' + b.key : ''}" onclick="selectRec('${b.key}')">
            <div class="rec-icon">${b.icon}</div>
            <div class="rec-label">${b.label}</div>
            <div class="rec-sub">${b.sub}</div>
          </div>`).join("")}
      </div>
    </div>

    <button class="send-btn" onclick="handleSendTDR()" ${!state.recommendation || !state.diagnosis.trim() ? "disabled" : ""}>
      Send TDR →
    </button>`;
}

function renderSubmitting() {
  return `
    ${renderHeader()}
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>Submitting TDR to Xano...</p>
    </div>`;
}

function renderDone() {
  const r = state.submitResult;
  const tdr = r && r.tdr;
  const hcpOk = r && r.hcp_sync && r.hcp_sync.response && (r.hcp_sync.response.status === 200 || r.hcp_sync.response.status === 201);
  return `
    ${renderHeader()}
    <div class="done-screen">
      <div class="done-icon">✅</div>
      <div class="done-title">TDR Submitted!</div>
      <div class="done-sub">Report saved. Customer notification will fire shortly.</div>
      ${tdr ? `
        <div class="done-details">
          <div class="done-row"><span>TDR ID</span><span>#${tdr.id}</span></div>
          <div class="done-row"><span>Job ID</span><span>#${tdr.job_id}</span></div>
          <div class="done-row"><span>Recommendation</span><span>${state.recommendation}</span></div>
          <div class="done-row"><span>Status</span><span>${tdr.status || "submitted"}</span></div>
        </div>` : ""}
      <div class="hcp-status ${hcpOk ? 'hcp-ok' : 'hcp-fail'}">
        ${hcpOk ? "✅ Note posted to HousecallPro" : "⚠️ TDR saved — HCP sync failed. Check HCP manually."}
      </div>
      <button class="new-btn" onclick="reset()">+ New TDR</button>
    </div>`;
}

function render() {
  const app = document.getElementById("app");
  let html = "";
  switch(state.step) {
    case "intake": html = renderIntake(); break;
    case "loading": html = renderLoading(); break;
    case "review": html = renderReview(); break;
    case "submitting": html = renderSubmitting(); break;
    case "done": html = renderDone(); break;
  }
  app.innerHTML = `<div class="container">${html}</div>`;
}

function renderPhotosOnly() {
  const container = document.getElementById("photos-container");
  if (container) {
    container.innerHTML = renderPhotosSection();
  }
}

function openLightbox(idx) {
  const a = state.attachments[idx];
  if (!a) return;
  const url = state.attachmentUrls[a.s3_key];
  if (!url) return;
  const lightboxContent = document.getElementById("lightbox-content");
  if (a.file_type === "video") {
    lightboxContent.innerHTML = `<video src="${url}" controls autoplay></video>`;
  } else {
    lightboxContent.innerHTML = `<img src="${url}" alt="${a.original_filename || ''}" />`;
  }
  document.getElementById("lightbox").classList.add("show");
}

function closeLightbox(e) {
  if (e.target.id === "lightbox" || e.target.classList.contains("close")) {
    document.getElementById("lightbox").classList.remove("show");
    document.getElementById("lightbox-content").innerHTML = "";
  }
}

function handleLoadJob() {
  const input = document.getElementById("jobIdInput");
  const jobId = input ? input.value.trim() : state.jobId;
  if (!jobId) { state.error = "Enter a job ID."; render(); return; }
  loadJob(jobId);
}

function selectPart(type) {
  saveReviewInputs();
  state.partType = type;
  render();
}

function selectRec(key) {
  saveReviewInputs();
  state.recommendation = key;
  render();
}

function handleSendTDR() {
  saveReviewInputs();
  submitTDR();
}

function saveReviewInputs() {
  const d = document.getElementById("diagnosisInput");
  const t = document.getElementById("techNotesInput");
  const r = document.getElementById("repairEstInput");
  const l = document.getElementById("laborEstInput");
  const op = document.getElementById("oemPartInput");
  const opr = document.getElementById("oemPriceInput");
  const ap = document.getElementById("amazonPartInput");
  const apr = document.getElementById("amazonPriceInput");
  if (d) state.diagnosis = d.value;
  if (t) state.techNotes = t.value;
  if (r) state.repairEstimate = r.value;
  if (l) state.laborEstimate = l.value;
  if (op) state.oemPartNumber = op.value;
  if (opr) state.oemPrice = opr.value;
  if (ap) state.amazonPartNumber = ap.value;
  if (apr) state.amazonPrice = apr.value;
}

const urlJobId = getUrlJobId();
if (urlJobId) {
  state.jobId = urlJobId;
  loadJob(urlJobId);
} else {
  state.step = "intake";
  render();
}
</script>
</body>
</html>
