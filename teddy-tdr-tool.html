<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TN Appliance — Teddy Cockpit</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080a0f;
      --card: #0e1118;
      --card2: #131720;
      --border: #1e2433;
      --border2: #2a3040;
      --accent: #f5a623;
      --accent2: #ff6b35;
      --blue: #4a9eff;
      --green: #00d68f;
      --red: #ff4757;
      --text: #e8edf5;
      --muted: #5a6480;
      --muted2: #8a93aa;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: var(--sans); color: var(--text); min-height: 100vh; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74,158,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,158,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    .container { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 48px; }
    .header { background: linear-gradient(135deg, #0e1118, #131a2a); border: 1px solid var(--border2); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-icon { font-size: 22px; }
    .header-title { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .header-sub { font-size: 10px; color: var(--muted2); margin-top: 2px; font-family: var(--mono); }
    .header-badge { background: rgba(245,166,35,0.12); border: 1px solid rgba(245,166,35,0.3); border-radius: 20px; padding: 4px 10px; font-size: 10px; color: var(--accent); font-weight: 700; font-family: var(--mono); white-space: nowrap; }
    .back-link { color: var(--muted2); text-decoration: none; font-size: 12px; font-family: var(--mono); display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; margin-bottom: 8px; }
    .back-link:hover { color: var(--text); }

    .cockpit-card { background: var(--card); border: 1px solid var(--border2); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .cockpit-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .cockpit-row:first-child { padding-top: 0; }
    .cockpit-row:last-child { padding-bottom: 0; border-bottom: none; }
    .cockpit-section-label { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .cockpit-job-line { font-size: 16px; font-weight: 700; color: var(--text); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .cockpit-job-line .job-id { color: var(--muted2); font-family: var(--mono); font-size: 14px; font-weight: 600; }
    .cockpit-job-line .name { color: var(--text); }
    .cockpit-job-sub { font-size: 12px; color: var(--muted2); margin-top: 4px; }
    .cockpit-job-sub a { color: var(--blue); text-decoration: none; font-family: var(--mono); }
    .cockpit-job-sub a:hover { text-decoration: underline; }

    .job-type-badge { padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; display: inline-block; }
    .job-type-badge.cash { background: rgba(0,214,143,0.12); color: var(--green); border: 1px solid rgba(0,214,143,0.3); }
    .job-type-badge.warranty { background: rgba(74,158,255,0.12); color: var(--blue); border: 1px solid rgba(74,158,255,0.3); }
    .job-type-badge.unknown { background: rgba(245,166,35,0.12); color: var(--accent); border: 1px solid rgba(245,166,35,0.3); }

    .machine-line { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .machine-text { font-size: 14px; color: var(--text); font-weight: 600; }
    .machine-model { font-family: var(--mono); font-size: 13px; color: var(--blue); }
    .schematic-link { color: var(--accent); font-size: 13px; text-decoration: none; padding: 6px 10px; border: 1px solid rgba(245,166,35,0.3); border-radius: 6px; font-family: var(--mono); white-space: nowrap; transition: all 0.15s; }
    .schematic-link:hover { background: rgba(245,166,35,0.08); border-color: var(--accent); }
    .schematic-disabled { color: var(--muted); font-size: 12px; padding: 6px 10px; border: 1px dashed var(--border2); border-radius: 6px; font-family: var(--mono); }

    .issue-text { font-size: 14px; color: var(--text); line-height: 1.5; }
    .issue-text-muted { font-size: 13px; color: var(--muted2); font-style: italic; }

    .media-split { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
    @media (max-width: 540px) { .media-split { grid-template-columns: 1fr; } }
    .media-block { min-width: 0; }
    .media-block-label { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .media-empty { font-size: 12px; color: var(--muted); padding: 10px 0; font-style: italic; }
    .video-card { aspect-ratio: 16/10; border-radius: 10px; overflow: hidden; border: 1px solid var(--border2); cursor: pointer; position: relative; background: #000; transition: border-color 0.2s; }
    .video-card:hover { border-color: var(--accent); }
    .video-card video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-card .play-big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .video-card .play-big::after { content: '▶'; color: white; font-size: 38px; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
    .video-stack { display: flex; flex-direction: column; gap: 8px; }

    .photo-grid-cockpit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .photo-thumb { aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--border2); cursor: pointer; transition: border-color 0.2s; position: relative; background: #000; }
    .photo-thumb:hover { border-color: var(--accent); }
    .photo-thumb img, .photo-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-thumb .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .photo-thumb .play-overlay::after { content: '▶'; color: white; font-size: 18px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .photo-thumb .type-tag { position: absolute; bottom: 2px; left: 2px; background: rgba(0,0,0,0.7); color: white; font-size: 8px; padding: 1px 4px; border-radius: 3px; font-family: var(--mono); text-transform: uppercase; }

    .section-card { background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .pa-section { margin-bottom: 16px; }
    .pa-banner { background: rgba(246,207,69,0.10); border: 1px solid rgba(246,207,69,0.45); color: #f6cf45; border-radius: 10px; padding: 10px 14px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.02em; margin-bottom: 8px; }
    .pa-card { background: rgba(246,207,69,0.04); border: 1px solid rgba(246,207,69,0.30); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
    .pa-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(246,207,69,0.18); margin-bottom: 8px; }
    .pa-date { color: #f6cf45; font-family: var(--mono); font-size: 12px; font-weight: 600; }
    .pa-tech { color: #c0c8d8; font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .pa-body { display: flex; flex-direction: column; gap: 4px; }
    .pa-row { display: flex; gap: 10px; line-height: 1.5; }
    .pa-label { flex: 0 0 110px; color: #8a93aa; font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; padding-top: 1px; }
    .pa-value { color: #e8edf5; font-size: 13px; flex: 1; }
    .pa-mono { font-family: var(--mono); }
    .pa-outcome { color: #4cd2c0; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    .section-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; font-family: var(--mono); }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; font-family: var(--mono); }
    .field input:not([type=radio]):not([type=checkbox]), .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 14px; font-family: var(--sans); outline: none; transition: border-color 0.2s; }
    .field input[type=radio], .field input[type=checkbox] { width: auto; flex: 0 0 auto; }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; line-height: 1.5; min-height: 80px; }
    .field-hint { font-size: 11px; color: var(--muted2); margin-top: 6px; line-height: 1.4; font-family: var(--sans); }
    .field-hint.live { color: var(--green); font-family: var(--mono); }
    .field-hint.live.error { color: var(--red); }

    .ai-link { display: inline-block; color: var(--muted2); font-size: 11px; text-decoration: underline dotted; cursor: pointer; margin-bottom: 10px; font-family: var(--mono); }
    .ai-link:hover { color: var(--accent); }
    .ai-link.loading { color: var(--accent); cursor: wait; }
    .ai-link .mini-spin { display: inline-block; width: 9px; height: 9px; border: 1.5px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 5px; }

    .part-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; align-items: end; }
    .part-row .field { margin-bottom: 0; }
    .part-row-label { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .part-row-label.oem { color: var(--blue); }
    .part-row-label.amazon { color: var(--accent); }
    .part-block { margin-bottom: 16px; }
    .part-block:last-of-type { margin-bottom: 0; }

    .submit-btn { width: 100%; padding: 16px; background: var(--green); border: none; border-radius: 12px; color: #080a0f; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--sans); transition: opacity 0.2s; letter-spacing: 0.02em; }
    .submit-btn.warranty { background: var(--blue); color: #fff; }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .error-box { background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.25); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--red); margin-bottom: 14px; }
    .warning-box { background: rgba(245,166,35,0.06); border: 1px solid rgba(245,166,35,0.25); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--accent); margin-bottom: 14px; }
    .info-box { background: rgba(74,158,255,0.06); border: 1px solid rgba(74,158,255,0.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--blue); margin-bottom: 14px; line-height: 1.45; font-family: var(--mono); }

    .done-screen { text-align: center; padding: 40px 24px; }
    .done-icon { font-size: 56px; margin-bottom: 16px; }
    .done-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .done-sub { font-size: 14px; color: var(--muted2); margin-bottom: 24px; }
    .done-details { background: var(--card2); border: 1px solid var(--border2); border-radius: 10px; padding: 16px; text-align: left; margin-bottom: 18px; font-family: var(--mono); font-size: 13px; }
    .done-row { display: flex; justify-content: space-between; padding: 4px 0; gap: 12px; }
    .done-row span:first-child { color: var(--muted); }
    .done-row span:last-child { color: var(--text); font-weight: 600; word-break: break-all; text-align: right; }
    .done-row a { color: var(--blue); text-decoration: none; font-family: var(--mono); font-weight: 600; word-break: break-all; }
    .done-row a:hover { text-decoration: underline; }
    .done-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .next-btn { padding: 13px 28px; background: var(--accent); border: none; border-radius: 10px; color: #080a0f; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--sans); text-decoration: none; display: inline-block; }
    .secondary-btn { padding: 13px 22px; background: var(--card2); border: 1px solid var(--border2); border-radius: 10px; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--sans); text-decoration: none; display: inline-block; }
    .copy-btn { padding: 6px 12px; background: var(--card); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); font-size: 11px; cursor: pointer; font-family: var(--mono); margin-left: 6px; }
    .copy-btn:hover { border-color: var(--blue); color: var(--blue); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
    .loading-screen { padding: 60px 24px; text-align: center; }
    .loading-screen p { color: var(--muted2); font-size: 14px; }

    .intake-card { background: var(--card); border: 1px solid var(--border2); border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .intake-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
    .load-btn { width: 100%; padding: 13px; background: var(--accent); border: none; border-radius: 10px; color: #080a0f; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--sans); margin-top: 4px; }

    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
    .lightbox.show { display: flex; }
    .lightbox-content { max-width: 95%; max-height: 95%; }
    .lightbox img, .lightbox video { max-width: 100%; max-height: 90vh; display: block; }
    .lightbox .close { position: absolute; top: 16px; right: 20px; color: white; font-size: 32px; cursor: pointer; user-select: none; background: rgba(0,0,0,0.5); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  </style>
  <script src="/ant-spine.js" defer></script>
  <script src="/parts-search-modal.js" defer></script>

<body>
  <div id="app">
    <div class="container">
      <div class="loading-screen">
        <div class="spinner"></div>
        <p>Loading Teddy Cockpit...</p>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="close" onclick="closeLightbox(event)">×</div>
    <div class="lightbox-content" id="lightbox-content"></div>
  </div>

<script>
const NETLIFY_BASE = window.location.origin;

let state = {
  step: "intake",
  jobId: "",
  cockpit: null,
  diagnosis: "",
  oemPartNumber: "",
  oemPrice: "",
  amazonPartNumber: "",
  amazonPrice: "",
  laborEstimate: "",
  techNotes: "",
  aiLoading: false,
  submitResult: null,
  sendResult: null,
  finalizeStatus: null,
  finalizeError: "",
  error: "",
  parts_decision: "no_parts_needed",
  parts_supplier: "",
  parts_eta_days: ""
};

function getUrlJobId() {
  const p = new URLSearchParams(window.location.search);
  return p.get("job_id") || p.get("job") || "";
}

function parseDollarsToCents(input) {
  if (input == null) return null;
  const s = String(input).replace(/[$,\s]/g, "").trim();
  if (s === "") return null;
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  const f = parseFloat(s);
  if (!isFinite(f) || f < 0) return null;
  return Math.round(f * 100);
}

function centsToDisplay(cents) {
  if (cents == null) return "";
  const dollars = cents / 100;
  return "$" + dollars.toFixed(2);
}

function markup30Display(cents) {
  if (cents == null) return null;
  return Math.round(cents * 13 / 10);
}

async function loadCockpit(jobId) {
  state.step = "loading";
  state.error = "";
  render();
  try {
    const res = await fetch("/.netlify/functions/xano-proxy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ endpoint: "qc_cockpit_load", payload: { job_id: jobId }, api_group: "intake", method: "GET" })
    });
    let data;
    try { data = await res.json(); } catch(_e) { throw new Error("Bad response from server"); }
    if (!data || !data.success) {
      throw new Error((data && data.error) || ("Job " + jobId + " not found"));
    }
    state.cockpit = data;
    state.jobId = String(data.job.id);
    state.diagnosis = data.appliance.problem_summary || "";
    state.step = "review";
    render();
  } catch(e) {
    state.error = e.message || ("Could not load job #" + jobId);
    state.step = "intake";
    render();
  }
}

async function aiPreFill() {
  if (!state.cockpit) return;
  saveReviewInputs();
  state.aiLoading = true;
  state.error = "";
  render();

  const app = state.cockpit.appliance || {};
  const prompt = "You are a senior appliance technician writing a technical diagnosis for a customer's TDR. Based on the service request below, identify the root cause and recommend a part.\n\n" +
    "Appliance: " + (app.brand || "") + " " + (app.appliance_type || "") + "\n" +
    "Model: " + (app.model_number || "Unknown") + "\n" +
    "Customer reported: " + (app.problem_summary || "") + "\n\n" +
    "CRITICAL RULES for the diagnosis text:\n" +
    "- Describe the symptom + likely component failure in 2-3 plain sentences.\n" +
    "- Name the failed part if you're confident.\n" +
    "- DO NOT mention scheduling, timing, ETA, \"within X hours\", \"once part arrives\", \"we will repair\", or anything about when/how the repair happens. The system handles scheduling separately.\n" +
    "- DO NOT make customer-service promises (no \"we'll get it fixed for you\", no \"expect a call\", etc.)\n" +
    "- JUST the diagnosis. Technical. Plain English. No fluff.\n\n" +
    "Example GOOD diagnosis:\n" +
    "  \"Compressor relay clicking but compressor not starting. Likely failed start relay assembly.\"\n\n" +
    "Example BAD diagnosis (do NOT generate this):\n" +
    "  \"Compressor relay clicking but compressor won't start. Likely failed start relay assembly. Customer should expect repair within 1-2 hrs once part arrives.\"\n" +
    "  (The second sentence is operational/scheduling content — never include that.)\n\n" +
    "Respond ONLY with a JSON object, no markdown:\n" +
    "{\n" +
    '  "diagnosis": "2-3 sentence diagnosis ONLY. Symptom + likely component. No scheduling, no timing, no service promises.",\n' +
    '  "oem_part_number": "OEM part number if confident, or null",\n' +
    '  "amazon_search": "Best search term to find this part on Amazon",\n' +
    '  "tech_notes": "Any safety notes or caveats for the technician (not shown to customer)"\n' +
    "}";

  try {
    const res = await fetch("/.netlify/functions/claude-proxy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 800,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json();
    if (data && data.diagnosis) {
      state.diagnosis = data.diagnosis || state.diagnosis;
      if (data.oem_part_number) state.oemPartNumber = data.oem_part_number;
      if (data.tech_notes) state.techNotes = data.tech_notes;
    }
  } catch(_e) {
    state.error = "AI pre-fill failed. Fill in manually.";
  }
  state.aiLoading = false;
  render();
}

async function submitTDR() {
  saveReviewInputs();
  if (!state.cockpit) { state.error = "No job loaded."; render(); return; }
  if (!state.diagnosis.trim()) { state.error = "Please enter a diagnosis."; render(); return; }

  // Wire 4 (Parts Decision): compute parts_eta_date if Ship to Customer.
  let partsEtaDate = null;
  if (state.parts_decision === "ship_to_customer") {
    const days = parseInt(state.parts_eta_days, 10);
    if (!Number.isFinite(days) || days < 1) { state.error = "Enter ETA days (whole number, 1 or more)."; render(); return; }
    if (!state.parts_supplier) { state.error = "Pick a supplier for Ship to Customer."; render(); return; }
    const eta = new Date();
    eta.setDate(eta.getDate() + days);
    const yyyy = eta.getFullYear();
    const mm = String(eta.getMonth() + 1).padStart(2, "0");
    const dd = String(eta.getDate()).padStart(2, "0");
    partsEtaDate = yyyy + "-" + mm + "-" + dd;
  }

  const oemCents = state.oemPrice.trim() === "" ? null : parseDollarsToCents(state.oemPrice);
  const amzCents = state.amazonPrice.trim() === "" ? null : parseDollarsToCents(state.amazonPrice);
  const laborCents = state.laborEstimate.trim() === "" ? null : parseDollarsToCents(state.laborEstimate);

  if (state.oemPrice.trim() !== "" && oemCents === null) { state.error = "OEM cost looks off — use a number like $85 or 85.50."; render(); return; }
  if (state.amazonPrice.trim() !== "" && amzCents === null) { state.error = "Amazon cost looks off — use a number like $28 or 28.99."; render(); return; }
  if (state.laborEstimate.trim() !== "" && laborCents === null) { state.error = "Labor cost looks off — use a number like $215."; render(); return; }

  if (state.parts_decision !== "no_parts_needed" && oemCents == null && amzCents == null) { state.error = "Enter at least one part cost (OEM or Amazon)."; render(); return; }
  if (laborCents == null) { state.error = "Labor customer cost is required."; render(); return; }

  const job = state.cockpit.job;
  const appliance = state.cockpit.appliance;
  const customerType = (job.customer_type || "").toLowerCase();
  const isCash = customerType === "self_pay";

  state.finalizeStatus = "submitting";
  state.finalizeError = "";
  state.error = "";
  render();

  const createPayload = {
    job_id: parseInt(state.jobId),
    technician_id: 1,
    technician_first_name: "Teddy",
    technician_last_name: "Pivacek",
    problem_summary: appliance.problem_summary || "",
    diagnosis: state.diagnosis,
    customer_facing_diagnosis: state.diagnosis,
    confidence_level: "High",
    technician_notes: state.techNotes,
    status: "submitted",
    mode: "pre_diagnosis",
    failure_description: state.diagnosis,
    oem_part_number: state.oemPartNumber || null,
    amazon_part_number: state.amazonPartNumber || null,
    oem_part_our_cost_cents: oemCents == null ? 0 : oemCents,
    amazon_part_our_cost_cents: amzCents == null ? 0 : amzCents,
    labor_customer_cost_cents: laborCents,
    parts_decision: state.parts_decision,
    parts_supplier: (state.parts_decision === "ship_to_customer") ? state.parts_supplier : null,
    parts_eta_date: partsEtaDate
  };

  try {
    const res = await fetch("/.netlify/functions/xano-proxy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ endpoint: "create_tdr", payload: createPayload, api_group: "intake" })
    });
    const data = await res.json();
    if (!data || !data.tdr || !data.tdr.id) {
      throw new Error((data && data.message) || ("Could not create TDR: " + JSON.stringify(data).slice(0, 200)));
    }
    state.submitResult = data;
  } catch(e) {
    state.finalizeStatus = "failed";
    state.finalizeError = "Could not create TDR. " + e.message;
    render();
    return;
  }

  // Wire 4 branch: if Ship to Customer, notify Danielle (regardless of cash/warranty).
  if (state.parts_decision === "ship_to_customer") {
    try {
      const cust = state.cockpit.customer;
      await fetch("/.netlify/functions/xano-proxy", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          endpoint: "notify_parts_ordered",
          api_group: "intake",
          payload: {
            job_id: parseInt(state.jobId, 10),
            part_number: state.oemPartNumber || state.amazonPartNumber || "",
            supplier: state.parts_supplier,
            eta_date: partsEtaDate,
            customer_name: cust.full_name || "",
            appliance_type: appliance.appliance_type || "",
            brand: appliance.brand || ""
          }
        })
      });
    } catch(e) {
      // Best-effort notify; TDR is already saved so do not block the flow.
    }
    // 2026-06-01: also fire customer-facing SMS via emit_parts_event so
    // the customer hears about the order automatically. Gated by
    // CUSTOMER_FACING_ENABLED at the send_sms layer.
    try {
      await fetch("/.netlify/functions/xano-proxy", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          endpoint: "emit_parts_event",
          api_group: "intake",
          payload: {
            job_id: parseInt(state.jobId, 10),
            status: "ordered",
            eta_date: partsEtaDate || "",
            note: (state.parts_supplier ? "supplier: " + state.parts_supplier : "")
          }
        })
      });
    } catch (_) {}
    state.finalizeStatus = "parts_ordered";
    state.step = "done";
    render();
    return;
  }
  if (state.parts_decision === "parts_in_hand") {
    state.finalizeStatus = "parts_in_hand";
    state.step = "done";
    render();
    return;
  }

  if (isCash) {
    try {
      const tdrId = state.submitResult.tdr.id;
      const sendRes = await fetch("/.netlify/functions/xano-proxy", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          endpoint: "send_qc_diagnosis_to_customer",
          api_group: "cash_tdr",
          payload: { tdr_id: parseInt(tdrId), technician_id: 1, force_resend: false }
        })
      });
      const sendData = await sendRes.json();
      state.sendResult = sendData;
      if (sendData && sendData.success === true) {
        state.finalizeStatus = "cash_sent";
        state.step = "done";
      } else {
        state.finalizeStatus = "failed";
        state.finalizeError = "TDR created (#" + state.submitResult.tdr.id + ") but customer SMS failed: " + ((sendData && sendData.error) || "unknown error");
      }
    } catch(e) {
      state.finalizeStatus = "failed";
      state.finalizeError = "TDR created (#" + state.submitResult.tdr.id + ") but customer SMS failed: " + e.message;
    }
  } else {
    state.finalizeStatus = "warranty_saved";
    state.step = "done";
  }
  render();
}

function renderMediaSplit() {
  const attachments = (state.cockpit && state.cockpit.attachments) || [];
  const videos = [];
  const photos = [];
  attachments.forEach((a, idx) => {
    a._idx = idx;
    if (a.file_type === "video") videos.push(a); else photos.push(a);
  });

  const renderVideo = a => {
    // Cloudflare Stream video (resumable uploads) — render the Stream player.
    const sk = a.s3_key || a.cf_key || "";
    if (sk.indexOf("cfstream:") === 0) {
      const uid = sk.slice(9);
      return '<div class="video-card" style="padding:0;overflow:hidden;aspect-ratio:9/16;background:#000;">' +
        '<iframe src="https://iframe.cloudflarestream.com/' + escapeAttr(uid) + '?preload=metadata" style="width:100%;height:100%;border:0;" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>' +
      '</div>';
    }
    const url = a.signed_view_url;
    if (!url) {
      return '<div class="video-card" style="display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:11px;">Video unavailable</div>';
    }
    // The video element will fail to decode if the upload is webm
    // (Android Chrome) or if the MP4 was truncated. Provide an inline
    // download fallback so we can at least watch it in the native player.
    return '<div style="position:relative;">' +
      '<div class="video-card" onclick="openLightbox(' + a._idx + ')">' +
        '<video muted preload="metadata" playsinline>' +
          '<source src="' + escapeAttr(url) + '" type="video/mp4">' +
        '</video>' +
        '<div class="play-big"></div>' +
      '</div>' +
      '<a href="' + escapeAttr(url) + '" download style="position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.65);color:#fff;font-size:10px;padding:3px 6px;border-radius:4px;text-decoration:none;font-family:var(--mono);" onclick="event.stopPropagation()">⇩ download</a>' +
    '</div>';
  };
  const renderPhoto = a => {
    const url = a.signed_view_url;
    if (!url) {
      return '<div class="photo-thumb"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted2);font-size:9px;">N/A</div></div>';
    }
    return '<div class="photo-thumb" onclick="openLightbox(' + a._idx + ')">' +
      '<img src="' + escapeAttr(url) + '" alt="" loading="lazy" />' +
      '<div class="type-tag">photo</div>' +
    '</div>';
  };

  const videosBlock = videos.length === 0
    ? '<div class="media-block"><div class="media-block-label">🎥 Failure videos (0)</div><div class="media-empty">No video uploaded</div></div>'
    : '<div class="media-block"><div class="media-block-label">🎥 Failure videos (' + videos.length + ')</div><div class="video-stack">' + videos.map(renderVideo).join("") + '</div></div>';

  const photosBlock = photos.length === 0
    ? '<div class="media-block"><div class="media-block-label">📷 Photos (0)</div><div class="media-empty">No photos</div></div>'
    : '<div class="media-block"><div class="media-block-label">📷 Photos (' + photos.length + ')</div><div class="photo-grid-cockpit">' + photos.map(renderPhoto).join("") + '</div></div>';

  return '<div class="media-split">' + videosBlock + photosBlock + '</div>';
}

// Previous Attempts timeline — every prior TDR on this job rendered as a
// stacked yellow-bordered card. Eliminates duplicate parts ordering by
// showing exactly what's been tried before. Empty when no prior TDRs.
function renderPreviousAttempts() {
  const all = (state.cockpit && state.cockpit.all_tdrs) || [];
  if (all.length === 0) return '';

  function fmtDate(ms) {
    if (!ms) return '';
    try {
      return new Intl.DateTimeFormat('en-US', {
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
        timeZone: 'America/Chicago',
      }).format(new Date(ms));
    } catch { return ''; }
  }

  function fmtParts(p) {
    if (!p) return '';
    if (typeof p === 'string') return p.trim();
    if (Array.isArray(p)) {
      return p.map((x) => {
        if (typeof x === 'string') return x;
        if (x && typeof x === 'object') {
          return [x.part_number, x.description, x.cost ? `$${x.cost}` : null]
            .filter(Boolean).join(' · ');
        }
        return '';
      }).filter(Boolean).join('; ');
    }
    if (typeof p === 'object') {
      try { return JSON.stringify(p).slice(0, 200); } catch { return ''; }
    }
    return '';
  }

  const cards = all.map((t) => {
    const techFirst = (t.technician_first_name || '').trim();
    const techLast = (t.technician_last_name || '').trim();
    const techName = [techFirst, techLast].filter(Boolean).join(' ') || `Tech #${t.technician_id || '?'}`;
    const visitDate = fmtDate(t.report_date || t.created_at);
    const partsStr = fmtParts(t.parts_used);

    const rows = [];
    if (t.diagnosis) {
      rows.push(`<div class="pa-row"><span class="pa-label">Diagnosis</span><span class="pa-value">${escapeHtml(t.diagnosis)}</span></div>`);
    }
    if (t.failure_cause) {
      rows.push(`<div class="pa-row"><span class="pa-label">Failure cause</span><span class="pa-value">${escapeHtml(t.failure_cause)}</span></div>`);
    }
    if (t.failed_component) {
      rows.push(`<div class="pa-row"><span class="pa-label">Failed component</span><span class="pa-value">${escapeHtml(t.failed_component)}</span></div>`);
    }
    if (t.verified_part_number) {
      const confTier = (t.verified_part_confidence || 'UNVERIFIED').toUpperCase();
      const reopen = { brand: state.appliance?.brand || '', model_number: state.appliance?.model_number || '', failed_component: t.failed_component || '', job_id: state.jobId };
      const badge = (window.PartsSearch && window.PartsSearch.renderBadge) ? window.PartsSearch.renderBadge(confTier, { reopenPrefill: reopen }) : '';
      rows.push(`<div class="pa-row"><span class="pa-label">Verified part #</span><span class="pa-value pa-mono">${escapeHtml(t.verified_part_number)} ${badge}</span></div>`);
    }
    if (partsStr) {
      rows.push(`<div class="pa-row"><span class="pa-label">Parts used</span><span class="pa-value pa-mono">${escapeHtml(partsStr)}</span></div>`);
    }
    if (t.repair_completed) {
      rows.push(`<div class="pa-row"><span class="pa-label">Outcome</span><span class="pa-value pa-outcome">${escapeHtml(t.repair_completed)}</span></div>`);
    }
    if (t.labor_time_hours) {
      rows.push(`<div class="pa-row"><span class="pa-label">Labor</span><span class="pa-value">${escapeHtml(String(t.labor_time_hours))}h</span></div>`);
    }

    return `
      <div class="pa-card">
        <div class="pa-head">
          <span class="pa-date">${escapeHtml(visitDate || 'date unknown')}</span>
          <span class="pa-tech">${escapeHtml(techName)}</span>
        </div>
        <div class="pa-body">
          ${rows.join('')}
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="pa-section">
      <div class="pa-banner">⚠️ Previous Attempts (${all.length} prior visit${all.length === 1 ? '' : 's'})</div>
      ${cards}
    </div>
  `;
}

function renderReview() {
  const c = state.cockpit;
  if (!c) return renderIntake();
  const job = c.job;
  const customerType = (job.customer_type || "").toLowerCase();
  const isCash = customerType === "self_pay";
  const isWarranty = customerType === "warranty";
  // HCP retirement: warranty path now saves locally to Xano only; tech sees
  // the pre-diagnosis in Ant Field on the loaded job.
  const submitLabel = isCash ? "📩 Submit and send to customer" : (isWarranty ? "💾 Save Pre-Diagnosis" : "📋 Submit TDR");
  const submitClass = isCash ? "submit-btn" : "submit-btn warranty";

  const finalizing = state.finalizeStatus === "submitting";
  const finalizeError = state.finalizeStatus === "failed" ? state.finalizeError : "";

  // Compute live preview hints if values are valid.
  const oemCents = state.oemPrice.trim() === "" ? null : parseDollarsToCents(state.oemPrice);
  const amzCents = state.amazonPrice.trim() === "" ? null : parseDollarsToCents(state.amazonPrice);
  const laborCents = state.laborEstimate.trim() === "" ? null : parseDollarsToCents(state.laborEstimate);
  const oemHint = state.oemPrice.trim() === "" ? "" :
    (oemCents == null ? '<div class="field-hint live error">Use a number like $85 or 85.50.</div>'
                      : '<div class="field-hint live">Customer pays ' + centsToDisplay(markup30Display(oemCents)) + ' (30% markup)</div>');
  const amzHint = state.amazonPrice.trim() === "" ? "" :
    (amzCents == null ? '<div class="field-hint live error">Use a number like $28 or 28.99.</div>'
                      : '<div class="field-hint live">Customer pays ' + centsToDisplay(markup30Display(amzCents)) + ' (30% markup)</div>');
  const laborHint = state.laborEstimate.trim() === "" ? "" :
    (laborCents == null ? '<div class="field-hint live error">Use a number like $215.</div>'
                        : '<div class="field-hint live">Customer pays ' + centsToDisplay(laborCents) + ' directly (no markup)</div>');

  let smsConsentNote = "";
  if (isCash && job.sms_consent !== true) {
    smsConsentNote = '<div class="info-box">⚠️ Customer has not consented to SMS. The submit button will fail at the send step. Call them at ' + escapeHtml(c.customer.phone || "the number on file") + ' instead, or update their SMS consent first.</div>';
  }

  return renderHeader() +
    '<a class="back-link" href="dashboard.html">← Back to dashboard</a>' +
    renderCockpitHeader() +
    renderAntsGuessPanel() +
    renderPreviousAttempts() +

    '<div class="section-card">' +
      '<div class="section-title">Diagnosis</div>' +
      (state.error ? '<div class="error-box">' + escapeHtml(state.error) + '</div>' : '') +
      '<div class="field">' +
        '<label>Diagnosis (plain English)</label>' +
        '<textarea id="diagnosisInput" rows="4" placeholder="What did you find? Describe in plain English...">' + escapeHtml(state.diagnosis) + '</textarea>' +
      '</div>' +
      (state.aiLoading
        ? '<span class="ai-link loading"><span class="mini-spin"></span>Analyzing problem...</span>'
        : '<a class="ai-link" onclick="aiPreFill()">⚡ or try AI guess from problem summary</a>') +
    '</div>' +

        '<div class="part-row-label amazon">AMAZON EQUIVALENT</div>' +
        '<div class="part-row">' +
          '<div class="field"><label>Part # / ASIN</label><input type="text" id="amazonPartInput" placeholder="e.g. B07XYZ" value="' + escapeAttr(state.amazonPartNumber) + '" oninput="state.amazonPartNumber=this.value" /></div>' +
          '<div class="field"><label>Our Cost</label><input type="text" id="amazonPriceInput" placeholder="$28" value="' + escapeAttr(state.amazonPrice) + '" oninput="state.amazonPrice=this.value; updateAmzHint()" /></div>' +
        '</div>' +

      '</div>' +
    '</div>' +

    '<div class="section-card">' +
      '<div class="section-title">Labor</div>' +
      '<div class="field">' +
        '<label>Customer Cost</label>' +
        '<input type="text" id="laborEstInput" placeholder="$215" value="' + escapeAttr(state.laborEstimate) + '" oninput="state.laborEstimate=this.value; updateLaborHint()" />' +
        '<div id="laborHintWrap">' + laborHint + '</div>' +
      '</div>' +
    '</div>' +

    '<div class="section-card">' +
      '<div class="section-title">Notes</div>' +
      '<div class="field">' +
        '<label>Internal notes (optional)</label>' +
        '<textarea id="techNotesInput" rows="2" placeholder="Caveats, safety notes, internal context...">' + escapeHtml(state.techNotes) + '</textarea>' +
      '</div>' +
    '</div>' +

    '<div class="section-card">' +
      '<div class="section-title">Parts Decision</div>' +
      '<div class="field">' +
        '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;">' +
          '<input type="radio" name="parts_decision" value="ship_to_customer"' +
          (state.parts_decision === "ship_to_customer" ? ' checked' : '') +
          ' onchange="state.parts_decision=this.value; togglePartsDetail();" />' +
          '<span><strong>Ship to Customer</strong> - order and ship direct</span>' +
        '</label>' +
        '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;">' +
          '<input type="radio" name="parts_decision" value="parts_in_hand"' +
          (state.parts_decision === "parts_in_hand" ? ' checked' : '') +
          ' onchange="state.parts_decision=this.value; togglePartsDetail();" />' +
          '<span><strong>Parts In Hand</strong> - ready to schedule now</span>' +
        '</label>' +
        '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;">' +
          '<input type="radio" name="parts_decision" value="no_parts_needed"' +
          (state.parts_decision === "no_parts_needed" ? ' checked' : '') +
          ' onchange="state.parts_decision=this.value; togglePartsDetail();" />' +
          '<span><strong>No Parts Needed</strong> - labor only</span>' +
        '</label>' +
      '</div>' +
      '<div id="partsDetail" style="' + (state.parts_decision === "ship_to_customer" ? '' : 'display:none;') + 'border-top:1px solid var(--border);padding-top:14px;margin-top:10px;">' +
        '<div class="field">' +
          '<label>Supplier</label>' +
          '<select id="partsSupplierInput" onchange="state.parts_supplier=this.value;" style="width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 12px;font-size:14px;font-family:var(--sans);outline:none;">' +
            '<option value="">- Select supplier -</option>' +
            ['Amazon','Marcone','Tribles','Ideal','Reliable','Warranty Company Buying','Other'].map(s =>
              '<option value="' + escapeAttr(s) + '"' + (state.parts_supplier === s ? ' selected' : '') + '>' + escapeHtml(s) + '</option>'
            ).join('') +
          '</select>' +
        '</div>' +
        '<div class="field">' +
          '<label>ETA Days</label>' +
          '<input type="number" id="partsEtaDaysInput" placeholder="Days until arrival e.g. 5" value="' + escapeAttr(state.parts_eta_days) + '" oninput="state.parts_eta_days=this.value;" min="1" />' +
        '</div>' +
      '</div>' +
    '</div>' +

    smsConsentNote +
    (finalizeError ? '<div class="error-box">' + escapeHtml(finalizeError) + '</div>' : "") +

    '<button class="' + submitClass + '" onclick="handleSubmit()" ' + (finalizing ? 'disabled' : '') + '>' +
      (finalizing ? "Submitting…" : submitLabel) +
    '</button>';
}

function updateOemHint() {
  const wrap = document.getElementById("oemHintWrap");
  if (!wrap) return;
  if (state.oemPrice.trim() === "") { wrap.innerHTML = ""; return; }
  const c = parseDollarsToCents(state.oemPrice);
  if (c == null) { wrap.innerHTML = '<div class="field-hint live error">Use a number like $85 or 85.50.</div>'; return; }
  wrap.innerHTML = '<div class="field-hint live">Customer pays ' + centsToDisplay(markup30Display(c)) + ' (30% markup)</div>';
}
function updateAmzHint() {
  const wrap = document.getElementById("amzHintWrap");
  if (!wrap) return;
  if (state.amazonPrice.trim() === "") { wrap.innerHTML = ""; return; }
  const c = parseDollarsToCents(state.amazonPrice);
  if (c == null) { wrap.innerHTML = '<div class="field-hint live error">Use a number like $28 or 28.99.</div>'; return; }
  wrap.innerHTML = '<div class="field-hint live">Customer pays ' + centsToDisplay(markup30Display(c)) + ' (30% markup)</div>';
}
function updateLaborHint() {
  const wrap = document.getElementById("laborHintWrap");
  if (!wrap) return;
  if (state.laborEstimate.trim() === "") { wrap.innerHTML = ""; return; }
  const c = parseDollarsToCents(state.laborEstimate);
  if (c == null) { wrap.innerHTML = '<div class="field-hint live error">Use a number like $215.</div>'; return; }
  wrap.innerHTML = '<div class="field-hint live">Customer pays ' + centsToDisplay(c) + ' directly (no markup)</div>';
}

function togglePartsDetail() {
  const wrap = document.getElementById("partsDetail");
  if (!wrap) return;
  wrap.style.display = (state.parts_decision === "ship_to_customer") ? "" : "none";
}

function renderDone() {
  const tdr = state.submitResult && state.submitResult.tdr;
  const send = state.sendResult || {};
  const isCash = state.finalizeStatus === "cash_sent";
  const isWarranty = state.finalizeStatus === "warranty_saved";
  const job = state.cockpit && state.cockpit.job;

  let title = "TDR Saved";
  let subtitle = "";
  let extraRows = "";

  if (state.finalizeStatus === "parts_ordered") {
    title = "TDR Saved";
    subtitle = "Parts order sent to Danielle.";
  } else if (state.finalizeStatus === "parts_in_hand") {
    title = "TDR Saved";
    subtitle = "Job queued for scheduling.";
  }

  if (isCash) {
    title = "Sent to Customer";
    subtitle = "Customer SMS dispatched with diagnosis link.";
    if (send.customer_url) {
      extraRows += '<div class="done-row"><span>Customer link</span><span><a href="' + escapeAttr(send.customer_url) + '" target="_blank" rel="noopener">' + escapeHtml(send.customer_url) + '</a> <button class="copy-btn" onclick="copyToClipboard(this, \'' + escapeAttr(send.customer_url) + '\')">copy</button></span></div>';
    }
    if (send.sent_to) extraRows += '<div class="done-row"><span>Sent to</span><span>' + escapeHtml(send.sent_to) + '</span></div>';
    if (send.expires_at) extraRows += '<div class="done-row"><span>Expires</span><span>' + escapeHtml(formatTime(send.expires_at)) + '</span></div>';
  } else if (isWarranty) {
    title = "Pre-diagnosis saved ✓";
    subtitle = "Tech will see this when they open the job in Ant Field.";
    // HCP retirement: no HCP sync status to surface anymore.
  }

  return renderHeader() +
    '<div class="done-screen">' +
      '<div class="done-icon">✅</div>' +
      '<div class="done-title">' + escapeHtml(title) + '</div>' +
      (subtitle ? '<div class="done-sub">' + escapeHtml(subtitle) + '</div>' : "") +
      '<div class="done-details">' +
        (tdr ? '<div class="done-row"><span>TDR</span><span>#' + escapeHtml(String(tdr.id)) + '</span></div>' : "") +
        (state.submitResult && state.submitResult.tdr_failure_id ? '<div class="done-row"><span>Failure row</span><span>#' + escapeHtml(String(state.submitResult.tdr_failure_id)) + '</span></div>' : "") +
        (job ? '<div class="done-row"><span>Job</span><span>#' + escapeHtml(String(job.id)) + '</span></div>' : "") +
        extraRows +
      '</div>' +
      '<div class="done-actions">' +
        '<a class="next-btn" href="dashboard.html">Open next job →</a>' +
        '<button class="secondary-btn" onclick="reset()">+ Load by ID</button>' +
      '</div>' +
    '</div>';
}

function copyToClipboard(btn, text) {
  if (!navigator.clipboard) { alert("Manually copy: " + text); return; }
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = "✓ copied";
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }).catch(err => { alert("Could not copy: " + err.message); });
}

function formatTime(iso) {
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  } catch(_e) { return iso; }
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}
function escapeAttr(s) { return escapeHtml(s); }

// Ant's Guess panel — fetches latest tdr_suggestion_drafted event_log
// row for this job and displays the AI's pre-diagnosis. Useful when
// the job is sparse (no model, no Teddy pre-diag yet) — gives the
// operator SOMETHING to react to.
function renderAntsGuessPanel() {
  // Placeholder — populated async by loadAntsGuess() which kicks off
  // from wireCockpitInteractions. Hidden until fetch completes.
  return '<div id="ants-guess-panel" style="display:none; margin: 0 0 14px; padding: 12px 14px; background: linear-gradient(135deg, rgba(116,227,196,0.08), rgba(116,227,196,0.02)); border: 1px dashed rgba(116,227,196,0.30); border-radius: 10px; font-size: 13px; color: #d4d6dc;">' +
    '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">' +
      '<strong style="color:#74e3c4; font-size:12px; letter-spacing:0.5px;">🤖 ANT\'S GUESS</strong>' +
      '<span style="font-size:10px; color:#9aa1ad;">AI pre-diagnosis — confirm or correct before applying</span>' +
    '</div>' +
    '<div id="ants-guess-body" style="line-height:1.5;"></div>' +
  '</div>';
}

async function loadAntsGuess() {
  const panel = document.getElementById('ants-guess-panel');
  const body = document.getElementById('ants-guess-body');
  if (!panel || !body || !state.jobId) return;
  try {
    const r = await fetch(XANO_BASE + '/get_predicted_failure_for_job?job_id=' + encodeURIComponent(state.jobId), { cache: 'no-store' });
    const data = await r.json();
    if (!data || !data.has_draft || !data.suggestion || !data.suggestion.metadata) return;
    const draft = (data.suggestion.metadata.draft_text || '').trim();
    if (!draft) return;
    const lines = draft.split(/\n+/).map(l => l.trim()).filter(Boolean);
    const pick = (label) => (lines.find(l => l.toLowerCase().startsWith(label.toLowerCase() + ':')) || '').replace(/^[^:]+:\s*/, '');
    const failed = pick('Failed component');
    const cause  = pick('Failure cause');
    const part   = pick('Recommended part') || pick('Pre-order parts');
    let html = '';
    if (failed) html += '<div><strong>Likely:</strong> ' + escapeHtml(failed) + '</div>';
    if (cause)  html += '<div style="margin-top:4px;"><strong>Cause:</strong> ' + escapeHtml(cause) + '</div>';
    if (part)   html += '<div style="margin-top:4px;"><strong>📦 Likely part:</strong> ' + escapeHtml(part) + '</div>';
    if (!html) html = '<div style="color:#9aa1ad; font-style:italic;">' + escapeHtml(lines[0] || 'See draft') + '</div>';
    body.innerHTML = html;
    panel.style.display = '';
  } catch (_) {}
}

function render() {
  const app = document.getElementById("app");
  let html = "";
  switch(state.step) {
    case "intake": html = renderIntake(); break;
    case "loading": html = renderLoading(); break;
    case "review": html = renderReview(); break;
    case "done": html = renderDone(); break;
  }
  app.innerHTML = '<div class="container">' + html + '</div>';
  // Wire post-render: inline editors + find-part button
  setTimeout(wireCockpitInteractions, 0);
}

// Inline editors for appliance fields + Find Part launcher + Ant's Guess load.
function wireCockpitInteractions() {
  document.querySelectorAll('[data-editable]').forEach((el) => {
    if (el._editWired) return;
    el._editWired = true;
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => openInlineEditor(el));
  });
  const findBtn = document.getElementById('cockpit-find-parts');
  if (findBtn && !findBtn._wired) {
    findBtn._wired = true;
    findBtn.addEventListener('click', launchPartsSearch);
  }
  // Tap-to-copy wiring for the model # — both the value span and the
  // explicit COPY button trigger the same clipboard write + toast.
  const modelValueEl = document.getElementById('cockpit-model-value');
  const modelCopyBtn = document.getElementById('cockpit-model-copy');
  function copyModel(srcEl) {
    const m = (srcEl && srcEl.dataset && srcEl.dataset.copy) || (modelValueEl && modelValueEl.dataset && modelValueEl.dataset.copy) || '';
    if (!m) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(m).then(() => showCopyToast(m)).catch(() => fallbackCopy(m));
    } else {
      fallbackCopy(m);
    }
  }
  function fallbackCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      showCopyToast(text);
    } catch (_) { alert('Manually copy: ' + text); }
  }
  function showCopyToast(text) {
    const toast = document.createElement('div');
    toast.textContent = '📋 Copied: ' + text;
    toast.style.cssText = 'position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#74e3c4; color:#0e1118; padding:10px 18px; border-radius:24px; font-family:var(--mono); font-size:13px; font-weight:700; z-index:9999; box-shadow:0 8px 24px rgba(116,227,196,0.4);';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 1800);
  }
  if (modelValueEl && !modelValueEl._copyWired) {
    modelValueEl._copyWired = true;
    modelValueEl.addEventListener('click', (e) => { e.stopPropagation(); copyModel(modelValueEl); });
  }
  if (modelCopyBtn && !modelCopyBtn._copyWired) {
    modelCopyBtn._copyWired = true;
    modelCopyBtn.addEventListener('click', (e) => { e.stopPropagation(); copyModel(modelCopyBtn); });
  }
  // Best-effort fetch + render Ant's Guess
  loadAntsGuess().catch(() => {});
}

function openInlineEditor(el) {
  const field = el.dataset.editable;
  if (!field) return;
  const app = (state.cockpit && state.cockpit.appliance) || {};
  const current = field === 'model'     ? (app.model_number || '')
                : field === 'brand'     ? (app.brand || '')
                : field === 'appliance' ? (app.appliance_type || '')
                : field === 'serial'    ? (app.serial_number || '')
                : '';
  const placeholder = field === 'model' ? 'WTW5000DW1' : field === 'brand' ? 'Whirlpool' : field === 'appliance' ? 'washer / dryer / refrigerator' : 'serial #';
  el.innerHTML = '<input type="text" id="inline-edit-' + field + '" value="' + escapeAttr(current) + '" placeholder="' + escapeAttr(placeholder) + '" style="padding:5px 9px; background:#0a0d12; color:#fff; border:1px solid #f5a623; border-radius:5px; font-family:var(--mono); font-size:13px; width:200px;">';
  const input = document.getElementById('inline-edit-' + field);
  input.focus();
  input.select();
  const commit = async () => {
    if (input._committed) return;
    input._committed = true;
    const v = input.value.trim();
    if (v === current) { render(); return; }
    el.innerHTML = 'Saving…';
    const payload = { job_id: state.jobId, updated_by: 'teddy_tool' };
    if (field === 'model')     payload.model_number = v;
    if (field === 'brand')     payload.brand = v;
    if (field === 'appliance') payload.appliance_type = v;
    if (field === 'serial')    payload.serial_number = v;
    try {
      const r = await fetch(XANO_BASE + '/update_job_appliance_fields', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      const d = await r.json();
      if (d.success) {
        // Update local state + re-render
        if (state.cockpit && state.cockpit.appliance) {
          if (field === 'model')     state.cockpit.appliance.model_number = d.model_number;
          if (field === 'brand')     state.cockpit.appliance.brand = d.brand;
          if (field === 'appliance') state.cockpit.appliance.appliance_type = d.appliance_type;
          if (field === 'serial')    state.cockpit.appliance.serial_number = d.serial_number;
        }
        render();
      } else {
        alert('Save failed: ' + (d.error || 'unknown'));
        render();
      }
    } catch (err) {
      alert('Save failed: ' + (err.message || err));
      render();
    }
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); input._committed = true; render(); }
  });
}

function launchPartsSearch() {
  if (!window.PartsSearch || typeof window.PartsSearch.open !== 'function') {
    alert('Parts search not loaded — refresh the page and try again.');
    return;
  }
  const app = (state.cockpit && state.cockpit.appliance) || {};
  // Get the failed_component from the latest TDR if there is one
  const tdrs = (state.cockpit && state.cockpit.all_tdrs) || [];
  const latestTdr = tdrs.length ? tdrs[0] : {};
  window.PartsSearch.open({
    brand: app.brand || '',
    model_number: app.model_number || '',
    appliance_type: app.appliance_type || '',
    failed_component: latestTdr.failed_component || '',
    symptoms: app.problem_summary || '',
    job_id: state.jobId,
  });
}

function openLightbox(idx) {
  const a = state.cockpit && state.cockpit.attachments && state.cockpit.attachments[idx];
  if (!a) return;
  const lightboxContent = document.getElementById("lightbox-content");
  // Cloudflare Stream video → full-screen Stream player
  const sk = a.s3_key || a.cf_key || "";
  if (sk.indexOf("cfstream:") === 0) {
    const uid = sk.slice(9);
    lightboxContent.innerHTML =
      '<div style="width:min(92vw,520px);height:80vh;background:#000;border-radius:10px;overflow:hidden;">' +
        '<iframe src="https://iframe.cloudflarestream.com/' + escapeAttr(uid) + '?autoplay=true" style="width:100%;height:100%;border:0;" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>' +
      '</div>';
    document.getElementById("lightbox").classList.add("show");
    return;
  }
  const url = a.signed_view_url;
  if (!url) return;
  if (a.file_type === "video") {
    // playsinline is required on iOS Safari — without it the browser
    // tries to enter fullscreen and stalls because autoplay isn't
    // user-gesture-initiated. <source type="video/mp4"> is more
    // forgiving than src=. Download link below for cases where the
    // file is webm or corrupted and inline playback fails.
    lightboxContent.innerHTML =
      '<video controls autoplay playsinline preload="metadata" style="max-width:100%;max-height:90vh;background:#000;">' +
        '<source src="' + escapeAttr(url) + '" type="video/mp4">' +
        'Your browser can\'t play this video.' +
      '</video>' +
      '<div style="text-align:center;margin-top:10px;">' +
        '<a href="' + escapeAttr(url) + '" download style="display:inline-block;background:#4cc9c0;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600;">⇩ Download video</a>' +
      '</div>';
  } else {
    lightboxContent.innerHTML = '<img src="' + escapeAttr(url) + '" alt="" />';
  }
  document.getElementById("lightbox").classList.add("show");
}
function closeLightbox(e) {
  if (e.target.id === "lightbox" || e.target.classList.contains("close")) {
    document.getElementById("lightbox").classList.remove("show");
    document.getElementById("lightbox-content").innerHTML = "";
  }
}

function handleLoadJob() {
  const input = document.getElementById("jobIdInput");
  const jobId = input ? input.value.trim() : state.jobId;
  if (!jobId) { state.error = "Enter a job ID."; render(); return; }
  loadCockpit(jobId);
}

function handleSubmit() { saveReviewInputs(); submitTDR(); }

function saveReviewInputs() {
  const d = document.getElementById("diagnosisInput");
  const t = document.getElementById("techNotesInput");
  const op = document.getElementById("oemPartInput");
  const opr = document.getElementById("oemPriceInput");
  const ap = document.getElementById("amazonPartInput");
  const apr = document.getElementById("amazonPriceInput");
  const l = document.getElementById("laborEstInput");
  if (d) state.diagnosis = d.value;
  if (t) state.techNotes = t.value;
  if (op) state.oemPartNumber = op.value;
  if (opr) state.oemPrice = opr.value;
  if (ap) state.amazonPartNumber = ap.value;
  if (apr) state.amazonPrice = apr.value;
  if (l) state.laborEstimate = l.value;
  const ps = document.getElementById("partsSupplierInput");
  const ped = document.getElementById("partsEtaDaysInput");
  if (ps) state.parts_supplier = ps.value;
  if (ped) state.parts_eta_days = ped.value;
}

const urlJobId = getUrlJobId();
if (urlJobId) {
  state.jobId = urlJobId;
  loadCockpit(urlJobId);
} else {
  state.step = "intake";
  render();
}
