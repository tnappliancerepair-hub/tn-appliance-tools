<style>
  html,body{overflow-x:hidden!important;max-width:100vw!important;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#f4f6fb;--panel:#fff;--line:#e2e7f0;--ink:#1a2233;--muted:#6b7488;--green:#0a7d33;--red:#c0392b;--blue:#1f6feb;--amber:#b3690a;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:18px 14px 60px;max-width:620px;margin:0 auto;}
  h1{font-size:21px;font-weight:800;text-align:center;}
  .sub{color:var(--muted);font-size:13px;text-align:center;margin:4px 0 14px;line-height:1.5;}
  .filters{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .filters button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;}
  .filters button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;}
  .card.done{opacity:.55;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .who{font-size:16px;font-weight:800;}
  .age{font-size:11px;color:var(--muted);white-space:nowrap;}
  .tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;}
  .t-warr{background:#eef3ff;color:var(--blue);}
  .t-cust{background:#e7f7ec;color:var(--green);}
  .t-other{background:#f0f0f0;color:var(--muted);}
  .sum{font-size:14px;margin:8px 0;line-height:1.4;}
  .ref{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);}
  .acts{display:flex;gap:8px;margin-top:10px;}
  .acts a,.acts button{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;border:0;}
  .call{background:var(--blue);color:#fff;}
  .done-btn{background:#e7f7ec;color:var(--green);border:1px solid #bfe6cb;}
  .tb-btn{background:#eaf2ff;color:var(--blue);border:1px solid #c3dbff;}
  .loading,.empty{text-align:center;color:var(--muted);padding:42px 0;}
  #auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;z-index:50;}
  #auth input{width:100%;max-width:280px;padding:13px;font-size:16px;border:1px solid var(--line);border-radius:10px;}
  #auth button{padding:13px 22px;background:var(--blue);color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:800;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#1a2233;color:#fff;padding:11px 18px;border-radius:30px;font-size:14px;font-weight:700;transition:transform .25s;z-index:60;}
  #toast.show{transform:translateX(-50%) translateY(0);}
</style>

<body>
<div id="auth">
  <div style="font-size:34px">🐜</div>
  <div style="font-weight:800">Office sign-in</div>
  <input id="pw" type="password" placeholder="office password" autocomplete="current-password">
  <button onclick="doAuth()">Unlock</button>
  <div id="autherr" style="color:#c0392b;font-size:13px;min-height:16px"></div>
</div>

<h1>📞 Callbacks</h1>
<div class="sub">People Ant captured who need a call back. Work the list to zero so nobody slips.</div>
<a href="/log-callback.html" style="display:block;text-align:center;background:#7a4ed9;color:#fff;text-decoration:none;font-weight:800;padding:13px;border-radius:12px;margin:0 0 14px">🔁 Repair didn't hold? Log a callback →</a>
<div class="filters">
  <button data-f="open" class="on" onclick="setF('open')">Open</button>
  <button data-f="all" onclick="setF('all')">All</button>
</div>
<div id="dropped"></div>
<div id="list"><div class="loading">Loading…</div></div>
<div id="toast"></div>

<script>
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
let FILTER='open', ROWS=[], DROPPED=[], TECHREC=[];
// Our own techs + shop/office lines — these aren't customers to call back. A
// field-assist call that timed out is a JOB RECORD (the summary is the tech's
// diagnosis), so we archive it separately instead of cluttering the callback queue.
const TECH_INTERNAL=new Set(['6154855795','6159671304','5049099413','6159693115','6158291654','8133527686','7315049617','6154850713','6152802949','6155889500','6158578800','8662680111']);
// Calls that died before the caller could leave info (dead air / drop). These
// never reach list_callback_requests, so we mine them from the call log.
const DROP_REASONS=['silence-timed-out','no-answer','customer-did-not-answer','customer-busy','transfer-fail','error-transfer','providerfault','pipeline-error'];
const TOLLFREE=/^\+?1?(800|888|866|877|855|844|833)/;
function authOk(){try{return (window.OfficeAuth&&window.OfficeAuth.isLoggedIn())||localStorage.getItem('tn_office_auth')==='1'||(window.OfficeAuth&&window.OfficeAuth.isLoggedIn())||(window.OFFICE_READONLY&&window.TechAuth&&window.TechAuth.session());}catch(_){return false;}}
async function verify(pw){try{const r=await fetch(XANO+'/verify_office_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});const d=await r.json();return d&&d.success===true;}catch(_){return false;}}
async function doAuth(){const v=document.getElementById('pw').value.trim();if(!v)return;document.getElementById('autherr').textContent='Checking…';if(await verify(v)){try{localStorage.setItem('tn_office_auth','1');}catch(_){ }document.getElementById('auth').style.display='none';load();}else{document.getElementById('autherr').textContent='Wrong password';}}
let tt=null;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function ago(ms){ms=Number(ms)||0;if(!ms)return '';var s=Math.floor((Date.now()-ms)/1000);if(s<3600)return Math.max(1,Math.floor(s/60))+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function setF(f){FILTER=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));render();}

async function load(){
  document.getElementById('list').innerHTML='<div class="loading">Loading…</div>';
  loadDropped();
  try{const r=await fetch(XANO+'/list_callback_requests?days=7');const d=await r.json();ROWS=(d&&d.callbacks)||[];}
  catch(_){document.getElementById('list').innerHTML='<div class="empty">Could not load.</div>';return;}
  render();
}
// Dropped / dead-air calls — people who hung up before leaving info (system
// overload, slow lookup). Deduped by phone, most-persistent first.
let DISMISSED={};
const p10=(p)=>String(p||'').replace(/\D/g,'').slice(-10);
async function loadDropped(){
  try{
    // who's already been cleared off the board (per phone, timestamped)
    try{const dr=await fetch('/.netlify/functions/dismiss-dropped-call',{cache:'no-store'});const dd=await dr.json();DISMISSED=(dd&&dd.dismissed)||{};}catch(_){DISMISSED={};}
    const r=await fetch(XANO+'/list_recent_calls_for_office?days=2&limit=200');
    const d=await r.json(); const calls=(d&&d.calls)||[];
    const by={};
    calls.forEach(c=>{
      const m=c.metadata||{};
      const reason=String(m.ended_reason||'').toLowerCase();
      const phone=String(m.caller_phone||'').replace(/[^0-9+]/g,'');
      if(!/\d{7}/.test(phone)) return;          // need a real number
      if(TOLLFREE.test(phone)) return;          // skip robocallers/vendors
      if(!DROP_REASONS.some(b=>reason.includes(b))) return;
      const t=Number(m.recorded_at||c.created_at)||0;
      if(!by[phone]) by[phone]={phone,tries:0,last:0,reason,job:m.job_id,summary:'',transcript:'',rec:'',dur:0};
      by[phone].tries++;
      if(t>=by[phone].last){by[phone].last=t;by[phone].reason=reason;by[phone].summary=String(m.summary||'');by[phone].transcript=String(m.transcript_preview||'');by[phone].rec=String(m.recording_url||'');by[phone].dur=Number(m.duration_sec||0);by[phone].job=m.job_id;}
    });
    // drop anything the office cleared — UNLESS they've dropped again since (newer
    // call than the dismiss → it comes back so we don't miss a fresh attempt).
    const live=Object.values(by).filter(x=>{const dz=DISMISSED[p10(x.phone)];return !(dz&&x.last<=dz);}).sort((a,b)=>b.tries-a.tries||b.last-a.last);
    // split: real customers to call back vs our own tech/shop calls (job records)
    DROPPED=live.filter(x=>!TECH_INTERNAL.has(p10(x.phone)));
    TECHREC=live.filter(x=>TECH_INTERNAL.has(p10(x.phone)));
  }catch(_){DROPPED=[];TECHREC=[];}
  renderDropped();
  enrichNames();
}
// Pull the customer's name for each card (so we greet/text by name), then re-render.
async function enrichNames(){
  const all=DROPPED.concat(TECHREC).filter(x=>!x._named);
  if(!all.length)return;
  await Promise.all(all.map(async x=>{
    x._named=true;
    try{
      const r=await fetch(XANO+'/lookup_customer_by_phone?phone='+encodeURIComponent('+1'+p10(x.phone)),{cache:'no-store'});
      const d=await r.json(); const c=(d&&d.customer)||{};
      const nm=((c.first_name||'')+' '+(c.last_name||'')).trim();
      if(nm)x.name=nm;
    }catch(_){}
  }));
  renderDropped();
}
const TECH_NAMES={'6154855795':'Teddy','6159671304':'Jimmy','5049099413':'Andre','6159693115':'Andre','6158291654':'Lee','8133527686':'John','7315049617':'Billy','6154850713':'Danielle'};
function dropCard(x,isTech){
  const tel=x.phone.replace(/[^0-9+]/g,'');
  const disp=tel.replace(/^\+?1?(\d{3})(\d{3})(\d{4})$/,'($1) $2-$3');
  const ph=p10(tel);
  const hasCtx=!!(x.summary||x.transcript||x.rec);
  const mins=x.dur?(' · '+Math.round(x.dur/60)+'m call'):'';
  const techName=TECH_NAMES[ph]||'tech/office';
  const mainLine=x.summary
    ? '<div class="sum"><b>'+(isTech?'Job notes:':'What they said:')+'</b> '+esc(x.summary)+'</div>'
    : (isTech?'<div class="sum" style="color:#777">No notes captured on this call.</div>'
            :'<div class="sum">Call ended: '+esc(x.reason)+' — they couldn’t reach us. Call back.</div>');
  const detail=hasCtx?('<div id="ctx-'+ph+'" style="display:none;margin-top:8px;padding:10px;background:#f6f7f9;border-radius:8px;font-size:13px;line-height:1.5">'+
      (x.transcript?'<div style="white-space:pre-wrap;color:#333">'+esc(x.transcript)+'</div>':'<div style="color:#777">No transcript captured.</div>')+
      (x.rec?'<div style="margin-top:8px"><audio controls preload="none" src="'+esc(x.rec)+'" style="width:100%"></audio></div>':'')+
    '</div>'):'';
  const toggle=hasCtx?'<button onclick="toggleCtx(\''+ph+'\',this)" style="margin-top:7px;padding:6px 10px;border:1px solid #cfd6e0;border-radius:7px;background:#fff;color:#2c6fb0;font-size:12px;font-weight:700;cursor:pointer">▾ Read the call</button>':'';
  const accent=isTech?'#5b9bd5':'#c0392b';
  const tag=isTech
    ? '<span class="tag" style="background:#eaf2fb;color:#2c6fb0">🔧 '+esc(techName)+' — job record</span>'
    : '<span class="tag t-other">dead air / dropped</span>';
  const nm=(x.name||'').trim();
  const textBtn=isTech?'':'<button class="call" style="background:#0a7d33" onclick="textDrop(\''+ph+'\',\''+esc((nm.split(/\s+/)[0]||'')).replace(/'/g,"\\'")+'\')">💬 Text</button>';
  const callBtn=isTech?'':'<a class="call" href="tel:'+esc(tel)+'">📞 Call '+esc(disp)+'</a>';
  const openJobBtn='<button class="call" style="background:#37414f" onclick="openJob(\''+esc(tel)+'\','+(x.job||0)+')">🗂 Open job</button>';
  // Header: customer NAME front + center (phone underneath) when we know them.
  const who=nm?('<div class="who">'+esc(nm)+'</div><div style="font-size:13px;color:#667">'+esc(disp)+'</div>'):('<div class="who">'+esc(disp)+'</div>');
  return '<div class="card" id="drop-'+ph+'" style="border-left:4px solid '+accent+';position:relative">'+
    '<button onclick="dismissDropped(\''+ph+'\')" title="Clear from board" aria-label="Clear" style="position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:1px solid #e3c4be;background:#fbeeec;color:#c0392b;font-size:16px;font-weight:800;line-height:1;cursor:pointer">✕</button>'+
    '<div class="top"><div>'+who+'</div><div class="age" style="margin-right:34px">'+ago(x.last)+mins+'</div></div>'+
    tag+
    (x.tries>1?' <span class="ref">tried '+x.tries+'×</span>':'')+
    (x.job?' <span class="ref">job #'+esc(String(x.job))+'</span>':' <span class="ref">new — no job</span>')+
    mainLine+
    '<div class="acts" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+toggle+openJobBtn+textBtn+callBtn+'</div>'+
    detail+
  '</div>';
}
function renderDropped(){
  const el=document.getElementById('dropped');
  let html='';
  if(DROPPED.length){
    html+='<div class="sub" style="margin:18px 0 8px;color:#c0392b;font-weight:700">🔴 Dropped / dead-air calls (last 2 days) — '+DROPPED.length+' to call back</div>'+
      DROPPED.map(x=>dropCard(x,false)).join('');
  }
  if(TECHREC.length){
    html+='<div class="sub" style="margin:22px 0 8px;color:#2c6fb0;font-weight:700;cursor:pointer" onclick="toggleArchive(this)">🔧 Tech call records — '+TECHREC.length+' <span style="font-weight:500;color:#888">(job notes from tech calls, not callbacks) ▾</span></div>'+
      '<div id="techArchive" style="display:none">'+TECHREC.map(x=>dropCard(x,true)).join('')+'</div>';
  }
  el.innerHTML=html;
}
function toggleArchive(h){const a=document.getElementById('techArchive');if(!a)return;const open=a.style.display==='none';a.style.display=open?'block':'none';h.innerHTML=h.innerHTML.replace(open?'▾':'▴',open?'▴':'▾');}
// Expand/collapse the call context (transcript + recording) so the office can
// read what was going on and decide whether it's worth a callback.
function toggleCtx(ph,btn){
  const el=document.getElementById('ctx-'+ph); if(!el)return;
  const open=el.style.display==='none';
  el.style.display=open?'block':'none';
  if(btn)btn.textContent=open?'▴ Hide':'▾ Read the call';
}
// Text a dropped-call customer from the business line (588-9500) so the reply
// threads back to Ant. One tap → confirm → sends (the phone rides along, no typing).
// NOTE: distinct name from the callback-row textBack(id,btn) below — they collided
// and this one got clobbered, which is why it said "no number". (Teddy 2026-06-30)
async function textDrop(ph,first){
  const digits=String(ph||'').replace(/\D/g,'').slice(-10);
  if(digits.length!==10){toast('no number on this card');return;}
  const hi=first?('Hi '+first+', '):'Hi, ';
  const def=hi+"this is TN Appliance Exchange returning your call — sorry we missed you! How can we help with your repair? Just reply here and we'll take care of you. 🐜";
  if(!confirm('Text '+(first||'this number')+' at ('+digits.replace(/^(\d{3})(\d{3})(\d{4})$/,'$1) $2-$3')+'?\n\n"'+def+'"'))return;
  toast('Sending…');
  try{
    const r=await fetch('/.netlify/functions/message-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'+1'+digits,name:first||'',message:def})});
    const d=await r.json();
    toast((d&&d.ok)?'Text sent ✓':('⚠ '+((d&&d.error)||'not sent')));
  }catch(_){toast('⚠ connection error');}
}
// Clear a resolved dropped call off the board. Optimistic remove + persist so it
// stays gone (until that number drops again). Keeps the board clean.
async function dismissDropped(ph){
  const card=document.getElementById('drop-'+ph); if(card){card.style.transition='opacity .15s';card.style.opacity='0.4';card.style.pointerEvents='none';}
  DROPPED=DROPPED.filter(x=>p10(x.phone)!==ph);
  TECHREC=TECHREC.filter(x=>p10(x.phone)!==ph);
  try{await fetch('/.netlify/functions/dismiss-dropped-call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph})});}catch(_){}
  renderDropped();
}
function render(){
  let rows=ROWS.slice();
  if(FILTER==='open')rows=rows.filter(r=>!r.handled);
  if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">'+(FILTER==='open'?'🎉 No open callbacks — all worked!':'No callbacks in the last 7 days.')+'</div>';return;}
  document.getElementById('list').innerHTML=rows.map(r=>{
    const tcls=r.caller_type==='warranty'?'t-warr':(r.caller_type==='other'?'t-other':'t-cust');
    const tel=(r.phone||'').replace(/[^0-9+]/g,'');
    // Pull a job # from the summary/ref if one's mentioned ("...job 20025..."), else 0 → resolve by phone.
    const jm=(String(r.summary||'')+' '+String(r.ref||'')).match(/\bjob\s*#?\s*(\d{4,6})\b/i);
    const jid=jm?jm[1]:0;
    return '<div class="card '+(r.handled?'done':'')+'">'+
      '<div class="top"><div class="who">'+esc(r.name||'(no name)')+'</div><div class="age">'+ago(r.created_at)+'</div></div>'+
      '<span class="tag '+tcls+'">'+esc(r.caller_type||'customer')+'</span>'+
      (r.ref?' <span class="ref">claim/WO '+esc(r.ref)+'</span>':'')+
      '<div class="sum">'+esc(r.summary||'(no summary)')+'</div>'+
      '<div class="acts">'+
        '<button class="openjob" onclick="openJob(\''+esc(tel)+'\','+jid+')" style="background:#37414f;color:#fff;border:0;border-radius:8px;padding:11px 13px;font-weight:800;font-size:13px;cursor:pointer">🗂 Open job</button>'+
        (tel?'<a class="call" href="tel:'+esc(tel)+'">📞 Call '+esc(r.phone)+'</a>':'<span style="flex:1;color:#c0392b;font-weight:700;text-align:center;padding:11px">no number</span>')+
        (tel?'<button class="tb-btn" onclick="textBack('+r.id+',this)">📲 Text back</button>':'')+
        (r.handled?'':'<button class="done-btn" onclick="handled('+r.id+',this)">✓ Handled</button>')+
      '</div>'+
    '</div>';
  }).join('');
}
// 🗂 Jump straight into the customer's job tile. Uses a known job # if we have one,
// otherwise resolves the job by phone. Falls back to a customer search. (Teddy 2026-07-02)
async function openJob(phone, jobId){
  if(jobId && Number(jobId)>0){ location.href='/office-board.html?job='+Number(jobId); return; }
  const p=String(phone||'').replace(/\D/g,'').slice(-10);
  if(p.length===10){
    try{
      const d=await (await fetch('/.netlify/functions/job-status-reason?phone='+encodeURIComponent(p))).json();
      if(d&&d.found&&d.job_id){ location.href='/office-board.html?job='+d.job_id; return; }
    }catch(_){}
    location.href='/customer-search.html?phone='+encodeURIComponent(p);
    return;
  }
  toast('No number to look up the job.');
}
// One-tap "we got your message, getting you scheduled" reply. Optional day.
async function textBack(id,btn){
  const row=ROWS.find(x=>x.id===id); if(!row||!row.phone){toast('no number');return;}
  const day=(prompt('Add a day if you know it (optional) — e.g. "Thursday":','')||'').trim();
  btn.disabled=true;const old=btn.textContent;btn.textContent='Texting…';
  try{
    const r=await fetch('/.netlify/functions/message-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:row.phone,name:row.name||'',day,callback_id:id})});
    const d=await r.json();
    if(d&&d.ok){toast('Texted them back ✓');btn.textContent='✓ Texted';}
    else{btn.disabled=false;btn.textContent=old;toast('⚠ '+((d&&d.error)||'not sent'));}
  }catch(_){btn.disabled=false;btn.textContent=old;toast('⚠ connection error');}
}
async function handled(id,btn){
  btn.disabled=true;btn.textContent='…';
  try{
    const r=await fetch(XANO+'/mark_callback_handled',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({callback_id:id,actor:'office'})});
    const d=await r.json();
    if(d&&d.success){toast('Marked handled ✓');const row=ROWS.find(x=>x.id===id);if(row)row.handled=true;render();}
    else{btn.disabled=false;btn.textContent='✓ Handled';toast('⚠ failed');}
  }catch(_){btn.disabled=false;btn.textContent='✓ Handled';toast('⚠ connection error');}
}
if(authOk()){document.getElementById('auth').style.display='none';load();}
</script>
  <script src="/ant-track.js" defer></script>
</body>
