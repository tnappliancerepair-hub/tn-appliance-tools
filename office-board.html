<style>
  :root{
    --blue:#1f6fed;--blue-d:#1559c9;--ink:#1d2530;--ink2:#5b6573;--dim:#8a93a1;
    --bg:#eef1f5;--card:#fff;--line:#e4e8ee;--ok:#1faa6b;--warn:#e8821e;--bad:#e24d4d;--violet:#7a5cf0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px;}
  .topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);
    padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));}
  .tb-row{display:flex;align-items:center;gap:10px;}
  .tb-title{font-size:17px;font-weight:800;flex:1;}
  .seg{display:inline-flex;background:#eef1f5;border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:0;background:none;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;}
  .seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,50,.12);}
  .tb-search{margin-top:9px;}
  .tb-search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;}
  /* one-tap hop bar — flow from the board to any neighbor without digging a menu */
  .hop{display:flex;gap:7px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
  .hop::-webkit-scrollbar{display:none;}
  .hop a{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;text-decoration:none;
    background:#f3f6fb;color:var(--ink);border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap;}
  .hop a:active{background:#e7edf6;}
  .sresults{margin-top:7px;}
  .sresults a{display:block;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;text-decoration:none;color:var(--ink);font-size:13px;background:#fff;}
  .sresults .sn{font-weight:600;} .sresults .ss{font-size:12px;color:var(--ink2);}
  /* board */
  .board{display:flex;gap:11px;overflow-x:auto;padding:12px;-webkit-overflow-scrolling:touch;align-items:flex-start;}
  .col{flex:0 0 240px;background:#e8ecf2;border-radius:13px;padding:9px;min-height:120px;}
  .col.dropok{outline:2px dashed var(--blue);outline-offset:-3px;background:#e2ecfd;}
  .col-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);padding:4px 4px 9px;}
  .col-h .ct{margin-left:auto;background:#fff;border-radius:20px;padding:1px 8px;font-size:11px;color:var(--ink2);}
  .col.tech .col-h{color:var(--blue);}
  .col.parts .col-h{color:var(--warn);}
  .col.done .col-h{color:var(--ok);}
  .col.followup .col-h{color:var(--violet);}
  .jcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,50,.05);}
  .jcard:active{transform:scale(.99);}
  .jcard.dragging{opacity:.5;}
  .jcard.over{border:2px solid #e05a43;background:#fff6f4;box-shadow:0 1px 3px rgba(214,67,42,.18);}
  .jc-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .jc-name{font-weight:700;font-size:14px;flex:1;line-height:1.2;}
  .jc-meta{font-size:12px;color:var(--ink2);line-height:1.35;}
  .jc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
  .tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:9px;}
  .tag.parts{background:#fdf0e0;color:var(--warn);} .tag.warr{background:#e7f0fe;color:var(--blue);}
  .tag.cash{background:#e3f6ec;color:var(--ok);} .tag.over{background:#fde8e8;color:var(--bad);}
  .tag.src{background:#eef1f5;color:var(--ink2);} .tag.paid{background:#e3f6ec;color:var(--ok);}
  .empty-col{font-size:12px;color:var(--dim);text-align:center;padding:14px 4px;}
  .loading{padding:50px;text-align:center;color:var(--ink2);}
  .spinner{width:30px;height:30px;border:3px solid #d7dde5;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* drawer (card file) */
  .scrim{position:fixed;inset:0;background:rgba(18,26,38,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);z-index:61;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .drawer.open{transform:translateX(0);}
  .dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:13px 14px;padding-top:max(13px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;z-index:2;}
  .dh .x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;flex-shrink:0;}
  .dh .dt{flex:1;min-width:0;} .dh .dt .n{font-weight:800;font-size:15px;} .dh .dt .s{font-size:12px;color:var(--ink2);}
  .dwrap{padding:12px;display:flex;flex-direction:column;gap:11px;}
  .dcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;}
  .dcard h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin-bottom:9px;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;}
  .kv .k{color:var(--ink2);font-size:12px;} .kv .v{font-weight:600;word-break:break-word;}
  .kv .v.mono{font-family:ui-monospace,monospace;font-size:12px;}
  input.inv{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:right;font-family:ui-monospace,monospace;}
  input.inv:focus{outline:none;border-color:var(--blue);}
  .chk{display:flex;align-items:center;gap:9px;padding:7px 2px;font-size:13px;border-bottom:1px solid #f0f3f7;}
  .chk:last-child{border-bottom:0;}
  .chk .box{width:19px;height:19px;border-radius:6px;border:1.5px solid #c4cdd8;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .chk.done .box{background:var(--ok);border-color:var(--ok);}
  .chk.gap .box{border-color:var(--bad);}
  .chk .lbl{flex:1;} .chk.done .lbl{color:var(--ink2);}
  .chk .auto{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--dim);background:#eef1f5;border-radius:8px;padding:1px 6px;}
  .chk.gap .auto{color:var(--bad);background:#fde8e8;}
  .jumps{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}

  .jumps a:active{background:#eef4fe;}
  .notes-box{font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .muted{color:var(--dim);font-style:italic;}
  /* auth */
  .auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .auth.hidden{display:none;}
  .auth-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;width:100%;max-width:340px;text-align:center;}
  .auth-card h2{font-size:18px;margin-bottom:5px;} .auth-card .sub{color:var(--ink2);font-size:13px;margin-bottom:16px;}
  .auth-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:16px;text-align:center;margin-bottom:11px;}
  .auth-card button{width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}
  .auth-card .err{color:var(--bad);font-size:13px;margin-top:9px;min-height:17px;}
  #ask-ant-fab{position:fixed;right:14px;bottom:74px;z-index:55;background:linear-gradient(135deg,#1f6fed,#3b86ff);color:#fff;
    padding:15px 22px;border-radius:28px;font-size:15px;font-weight:800;border:0;cursor:pointer;box-shadow:0 6px 20px rgba(31,111,237,.45);font-family:inherit;}
  #ask-ant-fab:active{transform:scale(.96);}
  .ant-panel{position:fixed;left:0;right:0;bottom:0;z-index:62;background:#fff;border-top-left-radius:18px;border-top-right-radius:18px;
    box-shadow:0 -6px 28px rgba(20,30,50,.18);transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;max-height:78vh;padding-bottom:env(safe-area-inset-bottom,0px);}
  .ant-panel.open{transform:translateY(0);}
  .ant-h{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);}
  .ant-title{font-weight:800;font-size:16px;flex:1;} .ant-x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;}
  .ant-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:9px;min-height:160px;}
  .ant-b{max-width:86%;padding:10px 13px;border-radius:15px;font-size:14px;line-height:1.45;}
  .ant-b.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px;}
  .ant-b.it{align-self:flex-start;background:#eef1f5;color:var(--ink);border-bottom-left-radius:5px;}
  .ant-tip{align-self:center;font-size:11px;color:var(--dim);text-align:center;padding:4px 10px;}
  .ant-input{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line);align-items:center;}
  .ant-input input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:22px;font-size:15px;}
  .ant-input input:focus{outline:none;border-color:var(--blue);}
  #ant-mic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#f5f7fa;font-size:18px;cursor:pointer;flex-shrink:0;}
  #ant-mic.live{background:#fde8e8;border-color:#f3b4b4;animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.5;}}
  .ant-send{background:var(--blue);color:#fff;border:0;border-radius:22px;padding:0 18px;height:44px;font-size:14px;font-weight:800;cursor:pointer;flex-shrink:0;}
  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#1d2530;color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:9998;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>

<script>
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const OFFICE_AUTH_KEY='tn_office_auth_v1';
let allItems=[], region='TN';

// region by assigned tech, fallback to city keyword
const TECH_REGION={1:'TN',2:'TN',4:'TN',3:'NOLA',5:'NOLA',6:'NOLA'};
const TECH_NAME={1:'Teddy',2:'Jimmy',3:'Andre',4:'Lee',5:'Billy',6:'John'};
const REGION_TECHS={TN:[2,4,3,1],NOLA:[6,3]};
const NOLA_CITY=/(new orleans|metairie|kenner|covington|mandeville|slidell|hammond|baton|denham|walker|ponchatoula|laplace|chalmette|gonzales|madisonville|abita|destrehan|nola)/i;
const PARTS_WAIT=/(awaiting_parts|ordered|on_order|parts_needed|pending|backorder)/i;

function jobRegion(j){
  // Office's explicit call wins (service_state set from the drawer Region buttons
  // or from a clean intake). This is what lets Danielle move a NOLA job out of
  // the TN folder and have it STICK in NOLA — auto-detection was guessing wrong.
  const smState=(STAGE_MAP[j.id]&&STAGE_MAP[j.id].service_state)||'';
  const st=(((j.service_state||'')+'').trim()||smState).toUpperCase();
  if(st==='LA'||st==='LOUISIANA') return 'NOLA';
  if(st==='TN'||st==='TENNESSEE') return 'TN';
  // Zip is ground-truth for WHERE the job is — intake often leaves service_state
  // blank, which was filing NOLA jobs into TN. LA zips are 70xxx/71xxx, TN 37/38xxx.
  const zip=((j.service_zip||'')+'').replace(/\D/g,'').slice(0,5);
  if(/^7[01]/.test(zip)) return 'NOLA';
  if(/^3[78]/.test(zip)) return 'TN';
  if(j.technician_id && TECH_REGION[j.technician_id]) return TECH_REGION[j.technician_id];
  if(NOLA_CITY.test((j.service_city||'')+' '+(j.service_zip||''))) return 'NOLA';
  return 'TN';
}

// ── auth ──
function authValid(){return localStorage.getItem(OFFICE_AUTH_KEY)==='1'||localStorage.getItem('tn_office_auth')==='1';}
function initAuth(){
  if(authValid()){document.getElementById('auth').classList.add('hidden');loadBoard();return;}
  document.getElementById('pw').focus();
}
async function submitAuth(){
  const v=(document.getElementById('pw').value||'').trim();const err=document.getElementById('auth-err');
  if(!v){err.textContent='Enter password';return;}
  try{
    const r=await fetch(XANO+'/verify_office_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v})});
    const d=await r.json();
    if(d&&d.success){localStorage.setItem(OFFICE_AUTH_KEY,'1');try{localStorage.setItem('tn_office_auth','1');}catch(_){}document.getElementById('auth').classList.add('hidden');loadBoard();}
    else{err.textContent='Wrong password.';}
  }catch(_){err.textContent='Connection error.';}
}
document.getElementById('pw').addEventListener('keypress',e=>{if(e.key==='Enter')submitAuth();});

// ── region toggle ──
document.getElementById('region-seg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  region=b.dataset.r;
  document.querySelectorAll('#region-seg button').forEach(x=>x.classList.toggle('on',x===b));
  renderBoard();
});

// ── load ──
// Server-side placement map {id:{office_stage,service_state}} so a card STAYS
// where she dropped it on EVERY device (not just the browser that moved it).
let STAGE_MAP={}, CHECK_MAP={};
async function loadStages(){
  try{
    const r=await fetch('/.netlify/functions/office-stage',{cache:'no-store'});
    const d=await r.json();
    STAGE_MAP=(d&&d.stages)||{};
    CHECK_MAP=(d&&d.checklists)||{};
  }catch(_){STAGE_MAP={};CHECK_MAP={};}
}
async function loadBoard(){
  document.getElementById('board-host').innerHTML='<div class="loading"><div class="spinner"></div>Loading the board…</div>';
  try{
    const [r]=await Promise.all([fetch(XANO+'/get_office_kanban',{cache:'no-store'}),loadStages()]);
    const d=await r.json();
    allItems=(d&&d.items)||[];
    renderBoard();
    loadAddons();
    loadPaid();
    loadMessages();
  }catch(e){
    document.getElementById('board-host').innerHTML='<div class="loading">⚠️ Could not load board — '+esc(e.message)+'</div>';
  }
}

// Obvious message inbox alert — caller messages Ant captured, waiting for a reply.
async function loadMessages(){
  try{
    const d=await (await fetch(XANO+'/list_callback_requests?days=7',{cache:'no-store'})).json();
    const open=(d&&d.open_count)||0;
    const el=document.getElementById('msg-banner'); if(!el)return;
    el.innerHTML = open>0
      ? '<a href="callbacks.html" style="display:block;background:#fff4e0;border:1px solid #ffd98a;border-radius:11px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:#b3690a;font-weight:800;font-size:14px">📲 '+open+' message'+(open===1?'':'s')+' waiting — tap to view &amp; text back</a>'
      : '';
  }catch(_){}
}

// place a job into a column id.
// "Needs Scheduled" is the catch-all entry: accepted jobs, callbacks, and
// 2nd-trip/revisits all land here (anything not yet sitting on a day with a
// tech). A job only moves to a tech column once it actually has a time.
function stageGet(id){try{return localStorage.getItem('tn_stage_'+id)||'';}catch(_){return '';}}
// Office checklist — manual ticks she can mark herself (the steps that aren't
// auto-derived). Stored per job; a step shows done if auto-derived OR ticked.
// Server-first (CHECK_MAP from office-stage) so manual ticks STICK across
// devices/reloads — localStorage is just the instant fallback.
function chkGet(id){
  const sm=CHECK_MAP[id];
  if(Array.isArray(sm)) return sm.slice();
  try{return JSON.parse(localStorage.getItem('tn_chk_'+id)||'[]');}catch(_){return [];}
}
function toggleChk(id,i,el,auto){
  let arr=chkGet(id);
  if(arr.includes(i))arr=arr.filter(x=>x!==i); else arr.push(i);
  try{localStorage.setItem('tn_chk_'+id,JSON.stringify(arr));}catch(_){}
  CHECK_MAP[id]=arr;                                  // keep local view fresh
  // persist to the job so it sticks everywhere (fire-and-forget)
  try{fetch('/.netlify/functions/office-stage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:parseInt(id,10),checklist:arr,actor:'Danielle'})});}catch(_){}
  const on=!!auto||arr.includes(i); // auto-derived steps stay checked regardless
  el.classList.toggle('done',on);
  const box=el.querySelector('.box'); if(box)box.textContent=on?'✓':'';
}
function placeOf(j){
  // Honor her manual placement so a dragged card STAYS where she dropped it
  // (MeisterTask behavior). Order of truth: the kanban's own office_stage (once
  // the XS endpoint is pushed) -> the server STAGE_MAP (works today, cloud-side)
  // -> localStorage (instant optimism for the move that hasn't synced yet).
  const sm=STAGE_MAP[j.id]&&STAGE_MAP[j.id].office_stage;
  const ov=((j.office_stage||'')+'').trim()||sm||stageGet(j.id);
  if(ov) return ov;
  const ss=(j.scheduling_status||'');
  const t=j.technician_id; const hasTech=t&&TECH_NAME[t];
  if(ss==='completed'){ return hasTech?('inv-'+t):'done'; }   // done -> tech Invoice folder
  if(PARTS_WAIT.test(j.parts_status||'')||ss==='awaiting_parts') return 'parts';
  if(hasTech) return 'rep-'+t;                                 // assigned -> tech Report folder
  return 'schedule';                                           // accepted/untimed/callback
}

function renderBoard(){
  const techs=REGION_TECHS[region];
  const cols=[{id:'schedule',label:'Needs Scheduled',cls:''},{id:'scheduled',label:'Scheduled',cls:''}];
  // Each tech gets two folders: Report (active work) and Invoice (done, ready
  // to bill). Cards flow Report -> Invoice as the job completes.
  techs.forEach(t=>{
    cols.push({id:'rep-'+t,label:TECH_NAME[t]+' · Report',cls:'tech',tech:t});
    cols.push({id:'inv-'+t,label:TECH_NAME[t]+' · Invoice',cls:'tech',tech:t});
  });
  cols.push({id:'parts',label:'Waiting Parts',cls:'parts'});
  cols.push({id:'done',label:'Completion',cls:'done'});
  cols.push({id:'followup',label:'Follow Up',cls:'followup'});
  cols.push({id:'needinv',label:'Needs Invoice',cls:'followup'});
  cols.push({id:'paid',label:'Paid · Closed',cls:'done'});

  const items=allItems.filter(j=>jobRegion(j)===region);
  const byCol={}; cols.forEach(c=>byCol[c.id]=[]);
  items.forEach(j=>{const p=placeOf(j); (byCol[p]||byCol['schedule']).push(j);});
  // Oldest-first within every column so the stalest jobs float to the top.
  cols.forEach(c=>byCol[c.id].sort((a,b)=>(Number(a.created_at)||0)-(Number(b.created_at)||0)));

  const html='<div class="board">'+cols.map(c=>{
    const list=byCol[c.id]||[];
    const stale=list.filter(j=>{const cc=Number(j.created_at||0);return cc&&j.scheduling_status!=='completed'&&(Date.now()-cc)>7*86400000;}).length;
    const staleBadge=stale>0?`<span class="ct" style="background:#fdece9;color:#c0392b;border:1px solid #f3c0b7" title="${stale} job${stale===1?'':'s'} waiting 7+ days">⏳ ${stale}</span>`:'';
    const cards=list.length?list.map(cardHtml).join(''):'<div class="empty-col">—</div>';
    return `<div class="col ${c.cls}" data-col="${c.id}" data-tech="${c.tech||''}">
      <div class="col-h">${esc(c.label)}<span class="ct">${list.length}</span>${staleBadge}</div>
      <div class="col-body">${cards}</div></div>`;
  }).join('')+'</div>';
  document.getElementById('board-host').innerHTML=html;
  wireDnD();
  // Notification deep-link: office-board.html?job=ID drops her straight on
  // that card so she can act and get back to the board fast.
  const pj=new URLSearchParams(location.search).get('job');
  if(pj && !window.__openedPending){ window.__openedPending=true; openDrawer(pj); }
}

// OVERDUE = the job missed its expected timing (Danielle, 2026-06-18) — not just
// "old." Flags the jobs that actually slipped so they stand out from on-track work:
//   1) parts waiting PAST their ETA, or
//   2) a scheduled day that already passed without the job completing.
// ISO date strings (YYYY-MM-DD) compare chronologically as plain strings.
function overdue(j){
  const ss=String(j.scheduling_status||'');
  if(ss==='completed'||ss==='canceled')return false;
  const todayCT=new Date().toLocaleDateString('en-CA',{timeZone:'America/Chicago'});
  const eta=String(j.parts_eta_date||'').trim();
  if(PARTS_WAIT.test(j.parts_status||'') && eta && eta<todayCT) return true;
  const schMs=Number(j.scheduled_start||0);
  if(schMs>0){
    const schDay=new Date(schMs).toLocaleDateString('en-CA',{timeZone:'America/Chicago'});
    if(schDay<todayCT) return true;
  }
  return false;
}
// Count phone-critical info gaps (same 4 checks as the Phone-Ready board) so
// the office can see at a glance which jobs Ant can't answer calls about yet.
const DONE_RE=/completed|canceled|cancelled|no_fix/i;
function phoneGaps(j){
  let m=0;
  if(!DONE_RE.test(j.scheduling_status||'')){ if(!(Number(j.scheduled_start)>0&&Number(j.technician_id)>0)) m++; }
  if((''+(j.customer_phone||'')).replace(/\D/g,'').length<10) m++;
  if((j.warranty_company||'').trim() && !(j.claim_number||'').trim()) m++;
  if(PARTS_WAIT.test(j.parts_status||'') && !(j.parts_eta_date||'').trim()) m++;
  return m;
}

function cardHtml(j){
  const name=((j.customer_first||'')+' '+(j.customer_last||'')).trim()||'Customer';
  const appl=[j.brand,j.appliance].filter(Boolean).join(' ');
  const tags=[];
  if(PARTS_WAIT.test(j.parts_status||''))tags.push('<span class="tag parts">parts</span>');
  if(j.warranty_company)tags.push('<span class="tag warr">'+esc(j.warranty_company)+'</span>');
  // Only label "cash" for an actual self-pay job. A blank warranty_company does
  // NOT mean cash — we're a warranty shop (no cash jobs), so a missing vendor is
  // a warranty job whose vendor just isn't filled in yet. (Danielle 2026-06-16)
  else if(/self|cash|customer.?pay/i.test(String(j.customer_type||''))) tags.push('<span class="tag cash">cash</span>');
  else tags.push('<span class="tag warr">warranty</span>');
  if(PAID_JOBS.has(String(j.id)))tags.push('<span class="tag" style="background:#e9f9f0;color:#127a4a;border:1px solid #9fe0bd">💵 paid</span>');
  const _g=phoneGaps(j);
  if(_g>0)tags.push('<span class="tag" style="background:#fdece9;color:#d6432a;border:1px solid #f3c0b7" title="missing info Ant needs to answer calls">⚠ needs info</span>');
  const _over=overdue(j);
  if(_over)tags.unshift('<span class="tag over">⏰ OVERDUE</span>');
  const _c=Number(j.created_at||0), _days=_c?Math.floor((Date.now()-_c)/86400000):0;
  const _wait=(_days>=1 && j.scheduling_status!=='completed')?('<span class="jc-wait" style="font-size:11px;font-weight:800;color:'+(_days>=7?'#c0392b':(_days>=3?'#b3690a':'#8a96a8'))+'">⏳ '+_days+'d</span>'):'';
  // Report-request button — on the cards she works toward invoicing (Completion /
  // Needs Invoice / a tech's Report column). Taps Ant to text+call the tech to
  // finish the report. (Teddy 2026-06-16 — "wherever her tickets are.")
  const _col=placeOf(j);
  const _showReportBtn=(_col==='done'||_col==='needinv'||(typeof _col==='string'&&_col.indexOf('rep-')===0));
  const _reportBtn=_showReportBtn?`<button onclick="event.stopPropagation();reqTechReport(${j.id})" title="Ant texts + calls the tech to finish the report" style="margin-top:7px;width:100%;padding:7px;border:0;border-radius:7px;background:#fff4e0;color:#b3690a;border:1px solid #f3d49a;font-size:12px;font-weight:700;cursor:pointer">📋 Request report</button>`:'';
  return `<div class="jcard${_over?' over':''}" draggable="true" data-id="${j.id}">
    <div class="jc-top" style="display:flex;align-items:center;justify-content:space-between;gap:6px"><div class="jc-name">${esc(name)}</div>${_wait}</div>
    <div class="jc-meta">${esc(appl||'appliance')}${j.service_city?(' · '+esc(j.service_city)):''}</div>
    ${j.claim_number?('<div class="jc-meta mono" style="font-family:ui-monospace,monospace;font-size:11px">#'+esc(j.claim_number)+'</div>'):''}
    <div class="jc-tags">${tags.join('')}</div>
    ${_reportBtn}
  </div>`;
}

// ── drag & drop (desktop) ──
let dragId=null;
function wireDnD(){
  document.querySelectorAll('.jcard').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=card.dataset.id;card.classList.add('dragging');});
    card.addEventListener('dragend',()=>{dragId=null;card.classList.remove('dragging');document.querySelectorAll('.col').forEach(c=>c.classList.remove('dropok'));});
    card.addEventListener('click',()=>openDrawer(card.dataset.id));
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dropok');});
    col.addEventListener('dragleave',()=>col.classList.remove('dropok'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('dropok');onDrop(col.dataset.col,col.dataset.tech,col);});
  });
}
// Section automations — MeisterTask-style: dropping a card into a folder fires
// the real Ant action. Optimistic move first (instant, buttery), then the
// server write, then a quiet resync to confirm truth.
const STATUS_MAP={parts:'awaiting_parts',done:'completed',schedule:'not_ready',scheduled:'scheduled'};
async function postJSON(ep,payload){
  const r=await fetch(XANO+'/'+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  return r.json();
}
// Persist a card's column to the job record so it sticks everywhere (all devices,
// reloads). Optional serviceState moves the job's region (TN <-> LA) at the same
// time. Fire-and-forget — the optimistic UI already moved the card.
async function persistStage(id,colId,serviceState){
  try{await fetch('/.netlify/functions/office-stage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:parseInt(id,10),stage:colId||'',service_state:serviceState||'',actor:'Danielle'})});}catch(_){}
}
function refreshCounts(){
  document.querySelectorAll('.col').forEach(c=>{const ct=c.querySelector('.ct');const n=c.querySelectorAll('.col-body .jcard').length;if(ct)ct.textContent=n;});
}
async function onDrop(colId,techId,colEl){
  if(!dragId)return; const id=dragId;
  // optimistic move — card slides into the target column immediately
  const card=document.querySelector('.jcard[data-id="'+id+'"]');
  if(colEl&&card){const body=colEl.querySelector('.col-body');if(body){const em=body.querySelector('.empty-col');if(em)em.remove();body.appendChild(card);}refreshCounts();}

  // Remember her placement so the card STAYS in the column she dropped it into
  // (placeOf honors this first). localStorage = instant; server = durable truth.
  try{localStorage.setItem('tn_stage_'+id,colId);}catch(_){}
  persistStage(id,colId);

  // Follow Up / Needs Invoice / Paid have no backend job-state — placement only.
  if(colId==='followup'||colId==='needinv'||colId==='paid'){
    toast('Moved to '+({needinv:'Needs Invoice',paid:'Paid · Closed',followup:'Follow Up'}[colId]));
    return;
  }

  if(techId){
    // Assigning to a tech must ALSO put them on a DAY. The calendar + the tech's
    // schedule both filter by scheduled_start, so a tech-only assignment (the old
    // reassign_job) never showed up on the actual schedule (Danielle, 2026-06-22).
    // Ask the day (day-of routing — no time needed). Cancel = old assign-only.
    const _t=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Chicago'}));
    const _def=_t.getFullYear()+'-'+String(_t.getMonth()+1).padStart(2,'0')+'-'+String(_t.getDate()).padStart(2,'0');
    const _ans=prompt('What DAY is '+TECH_NAME[techId]+' going? (YYYY-MM-DD)\nThis puts the job on the schedule. No time needed — we run day-of routing.',_def);
    if(_ans===null){
      toast('Assigning '+TECH_NAME[techId]+'…');
      try{const d=await postJSON('reassign_job',{job_id:parseInt(id,10),technician_id:parseInt(techId,10)});toast((d&&d.success)?('Assigned '+TECH_NAME[techId]+' — ⚠ no day set, won\'t show on schedule'):('⚠ '+((d&&d.error)||'failed')));}
      catch(_){toast('⚠ connection error');}
    } else {
      const _day=(String(_ans).trim()||_def);
      const _startMs=Date.parse(_day+'T09:00:00-05:00')||Date.parse(_day)||Date.now();
      toast('Scheduling '+TECH_NAME[techId]+'…');
      try{
        let d=await postJSON('danielle_schedule_parallel_job',{job_id:parseInt(id,10),technician_id:parseInt(techId,10),scheduled_start_ms:_startMs,service_eta_window:''});
        if(d&&!d.success&&/terminal/i.test(String((d&&d.error)||''))){            // reopen a canceled job, then retry
          await postJSON('office_set_job_status',{job_id:parseInt(id,10),scheduling_status:'scheduled',actor:'Danielle'});
          d=await postJSON('danielle_schedule_parallel_job',{job_id:parseInt(id,10),technician_id:parseInt(techId,10),scheduled_start_ms:_startMs,service_eta_window:''});
        }
        toast((d&&d.success)?('Scheduled '+TECH_NAME[techId]+' ✓ — now on the schedule'):('⚠ '+((d&&d.error)||'failed')));
      }catch(_){toast('⚠ connection error');}
    }
  } else if(STATUS_MAP[colId]){
    const label={parts:'Waiting Parts',done:'Completion',schedule:'Needs Scheduled',scheduled:'Scheduled'}[colId];
    toast('Moving to '+label+'…');
    try{const d=await postJSON('office_set_job_status',{job_id:parseInt(id,10),scheduling_status:STATUS_MAP[colId],actor:'Danielle'});toast((d&&d.success)?(label+' ✓'):('⚠ '+((d&&d.error)||'failed')));}
    catch(_){toast('⚠ connection error');}
  }
  setTimeout(loadBoard,800); // quiet resync to confirm server truth
}

async function saveJobInfo(id){
  const g=(x)=>{const el=document.getElementById(x);return el?el.value.trim():'';};
  const basics={job_id:parseInt(id,10),appliance_type:g('ej-appliance'),brand:g('ej-brand'),model_number:g('ej-model'),problem_summary:g('ej-problem')};
  const claim=g('ej-claim'), phone=g('ej-phone');
  toast('Saving…');
  let ok=true;
  try{const d=await postJSON('update_job_basics',basics);if(!(d&&d.success))ok=false;}catch(_){ok=false;}
  if(claim||phone){
    try{const d2=await postJSON('office_quick_fill',{job_id:parseInt(id,10),claim_number:claim,customer_phone:phone,actor:'Danielle'});if(!(d2&&d2.success))ok=false;}catch(_){ok=false;}
  }

  openDrawer(String(id)); // reload the job file with the new values

}
async function orderParts(id){

    if(d&&!d.error){toast('Parts ordered ✓ — job set to awaiting parts');closeDrawer();loadBoard();}
    else toast('⚠ '+((d&&d.error)||'failed'));

}
async function partsArrived(id){

async function scheduleFromDrawer(id){
  const techEl=document.getElementById('schTech'), dayEl=document.getElementById('schDay'), timeEl=document.getElementById('schTime');
  const tech=parseInt((techEl&&techEl.value)||'0',10);
  const day=(dayEl&&dayEl.value)||'';
  const tm=(timeEl&&timeEl.value)||'';   // optional HH:MM — her planning time
  if(!tech){toast('Pick a tech');return;}
  if(!day){toast('Pick a day');return;}
  // Stop limit: cap = tech's preference (max_stops_per_day) or 6.
  try{
    const rd=await (await fetch(XANO+'/get_tech_route_days?technician_id='+tech)).json();
    const cap=(rd&&Number(rd.max_stops_per_day))||6;
    const sameDay=((rd&&rd.stops)||[]).filter(s=>new Date(s.scheduled_start_ms||0).toLocaleDateString('en-CA',{timeZone:'America/Chicago'})===day).length;
    if(sameDay>=cap){ if(!confirm((TECH_NAME[tech]||'Tech')+' already has '+sameDay+' stops that day (their limit is '+cap+'). Schedule anyway?')) return; }
  }catch(_){}
  // Day-of routing: if she didn't set a time, 08:00 is the placeholder and only
  // the DAY matters. If she DID set a time (her MeisterTask habit), honor it.
  const startMs=new Date(day+'T'+(tm||'08:00')+':00').getTime();
  toast('Scheduling…');
  try{
    let d=await postJSON('danielle_schedule_parallel_job',{job_id:parseInt(id,10),technician_id:tech,scheduled_start_ms:startMs,service_eta_window:''});
    // Canceled/terminal jobs bounce with "terminal_locked" (the state machine
    // locks terminal states). Auto-recover the documented way: lift the lock via
    // the status override, then retry the schedule. No more dead-end for Danielle.
    if(d&&!d.success&&/terminal/i.test(String((d&&d.error)||''))){
      toast('Reopening canceled job…');
      try{await postJSON('office_set_job_status',{job_id:parseInt(id,10),scheduling_status:'scheduled',actor:'Danielle'});}catch(_){}
      d=await postJSON('danielle_schedule_parallel_job',{job_id:parseInt(id,10),technician_id:tech,scheduled_start_ms:startMs,service_eta_window:''});
    }
    if(d&&d.success){
      try{localStorage.setItem('tn_stage_'+id,'scheduled');}catch(_){}
      persistStage(id,'scheduled');
      toast('Scheduled ✓ — moved to Scheduled');closeDrawer();loadBoard();
    } else toast('⚠ '+((d&&d.error)||'failed'));
  }catch(_){toast('⚠ connection error');}
}
async function moveJobFromDrawer(id){
  const sel=document.getElementById('moveSel'); if(!sel)return;
  const colId=sel.value; let techId='';
  if(colId.indexOf('rep-')===0||colId.indexOf('inv-')===0) techId=colId.split('-')[1];
  // Same as a drag-drop: remember placement so it sticks, then fire the action.
  try{localStorage.setItem('tn_stage_'+id,colId);}catch(_){}
  persistStage(id,colId);
  const labelMap={schedule:'Needs Scheduled',scheduled:'Scheduled',parts:'Waiting Parts',done:'Completion',followup:'Follow Up',needinv:'Needs Invoice',paid:'Paid · Closed'};
  const label=labelMap[colId]||(techId?(TECH_NAME[techId]+(colId.indexOf('inv-')===0?' · Invoice':' · Report')):colId);
  if(colId==='followup'||colId==='needinv'||colId==='paid'){ toast('Moved to '+label); closeDrawer(); loadBoard(); return; }
  if(techId){
    try{const d=await postJSON('reassign_job',{job_id:parseInt(id,10),technician_id:parseInt(techId,10)});toast((d&&d.success)?('Moved to '+label+' ✓'):('⚠ '+((d&&d.error)||'failed')));}catch(_){toast('⚠ connection error');}
  } else if(STATUS_MAP[colId]){
    try{const d=await postJSON('office_set_job_status',{job_id:parseInt(id,10),scheduling_status:STATUS_MAP[colId],actor:'Danielle'});toast((d&&d.success)?('Moved to '+label+' ✓'):('⚠ '+((d&&d.error)||'failed')));}catch(_){toast('⚠ connection error');}
  }
  closeDrawer(); loadBoard();
}

// ── invoice worksheet (labor logging) ──
const INV_FIELDS=['labor','partcost','parts','ship','tax','tip','techpay'];
function invKey(jid){return 'tn_inv_'+jid;}
// Per-tech commission = % of labor (each tech's own deal). Editable here.
const TECH_PAY_RATES={1:0.50,2:0.45,3:0.40,4:0.50,5:0.50,6:0.40};
function prefillInvoice(jid,rate){
  rate=(typeof rate==='number'&&rate>0)?rate:0.5;
  let saved={};
  try{saved=JSON.parse(localStorage.getItem(invKey(jid))||'{}');}catch(_){}
  INV_FIELDS.forEach(f=>{const el=document.getElementById('inv-'+f);if(el){el.value=(saved[f]!=null?saved[f]:'');el.addEventListener('input',recomputeInvoice);}});
  // Auto-fill Tech Pay at this tech's rate as she types Labor — one less number.
  // She can still override it; once she edits it by hand we stop overriding.
  const lab=document.getElementById('inv-labor'), tp=document.getElementById('inv-techpay');
  if(lab&&tp){
    if(saved.techpay) tp.dataset.touched='1';
    lab.addEventListener('input',()=>{ if(!tp.dataset.touched){ const v=parseFloat(lab.value); tp.value=isNaN(v)?'':(v*rate).toFixed(2); } recomputeInvoice(); });
    tp.addEventListener('input',()=>{ tp.dataset.touched='1'; });
  }
  if(saved._savedAt){document.getElementById('inv-note').textContent='Last saved '+new Date(saved._savedAt).toLocaleString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
  recomputeInvoice();
}
function num(id){const v=parseFloat((document.getElementById(id)||{}).value);return isNaN(v)?0:v;}
function recomputeInvoice(){
  const cost=num('inv-partcost'), charge=num('inv-parts'), margin=charge-cost;
  // Customer invoice = labor + parts charge + shipping + tax + tip (our cost is
  // internal, not billed). Margin = what we charge for parts − what we paid.
  const total=num('inv-labor')+charge+num('inv-ship')+num('inv-tax')+num('inv-tip');
  const m=document.getElementById('inv-margin');
  if(m){m.textContent='$'+margin.toFixed(2);m.style.color=margin<0?'#c0392b':'#127a4a';}
  const el=document.getElementById('inv-total');if(el)el.textContent='$'+total.toFixed(2);
}
async function saveInvoice(jid){
  const data={};INV_FIELDS.forEach(f=>{data[f]=(document.getElementById('inv-'+f)||{}).value||'';});
  const cost=num('inv-partcost'), charge=num('inv-parts'), margin=charge-cost;
  const total=num('inv-labor')+charge+num('inv-ship')+num('inv-tax')+num('inv-tip');
  data.parts_margin=margin.toFixed(2);data.amount_invoiced=total.toFixed(2);data._savedAt=Date.now();
  // Always persist locally so her entries are never lost, then record to the
  // server audit (record_job_invoice writes an event_log row — no schema
  // change needed; once pushed it's the durable record).
  try{localStorage.setItem(invKey(jid),JSON.stringify(data));}catch(_){}
  toast('Saved ✓ ($'+total.toFixed(2)+' · margin $'+margin.toFixed(2)+')');
  document.getElementById('inv-note').textContent='Saved just now';
  try{
    await fetch(XANO+'/record_job_invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      job_id:parseInt(jid,10),technician_id:(window.__drawerTech||0),labor:data.labor,
      part_cost:data.partcost,parts_charge:data.parts,markup:margin.toFixed(2),parts_margin:margin.toFixed(2),
      shipping:data.ship,tax:data.tax,tip:data.tip,tech_pay:data.techpay,amount_invoiced:data.amount_invoiced
    })});
  }catch(_){/* endpoint may not be deployed yet; localStorage holds it */}
}

      box.innerHTML=rows.slice(0,10).map(x=>{
        const jid=x.job_id||x.id;const nm=((x.customer_first||'')+' '+(x.customer_last||'')).trim()||'Customer';
        const sub=[x.city,x.customer_phone,jid?('#'+jid):''].filter(Boolean).join(' · ');
        return jid?`<a class="sr" href="javascript:void(0)" onclick="openDrawer(${jid})"><div class="sn">${esc(nm)}</div><div class="ss">${esc(sub)}</div></a>`:'';
      }).join('');
    }catch(_){box.innerHTML='<div class="empty-col">search unavailable</div>';}
  },300);
});

// ── Talk to Ant (office assistant) ──
const TECH_ID_BY_NAME={teddy:1,jimmy:2,andre:3,lee:4,billy:5,john:6};
function antCap(s){return (s||'').charAt(0).toUpperCase()+(s||'').slice(1);}
function antFolderLabel(f){return {waiting_parts:'Waiting Parts',completed:'Completion',needs_scheduled:'Needs Scheduled',needs_invoice:'Needs Invoice',follow_up:'Follow Up'}[f]||f;}
function openAnt(){
  document.getElementById('ant-scrim').classList.add('open');
  document.getElementById('ant-panel').classList.add('open');
  const log=document.getElementById('ant-log');
  if(!log.dataset.greeted){log.dataset.greeted='1';antMsg('it','Hi Danielle — tell me what to do. Try "move the Carson job to waiting parts", "assign Jimmy to 18537", or "log $140 labor on 18537".');}
  setTimeout(()=>document.getElementById('ant-in').focus(),250);
}
function closeAnt(){document.getElementById('ant-scrim').classList.remove('open');document.getElementById('ant-panel').classList.remove('open');}
function antMsg(who,text){const log=document.getElementById('ant-log');const d=document.createElement('div');d.className='ant-b '+(who==='me'?'me':'it');d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;}
async function antSend(){
  const inp=document.getElementById('ant-in');const msg=(inp.value||'').trim();if(!msg)return;
  antMsg('me',msg);inp.value='';
  try{
    const r=await fetch('/.netlify/functions/office-assist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const p=await r.json();await antDo(p);
  }catch(_){antMsg('it','Hmm, I had trouble with that — try again.');}
}
async function searchJobs(q){
  try{const r=await fetch(XANO+'/office_universal_search?q='+encodeURIComponent(q),{cache:'no-store'});const d=await r.json();
    const rows=(d&&d.items)||[];
    return rows.map(x=>({job_id:x.job_id||x.id,name:((x.customer_first||'')+' '+(x.customer_last||'')).trim()||'Customer'})).filter(x=>x.job_id);
  }catch(_){return [];}
}
async function antDo(p){
  antMsg('it',p.reply||'');
  if(!p.intent||p.intent==='none')return;
  let jobId=null,jobLabel='';const ref=(p.job_ref||'').trim();
  if(/^\d+$/.test(ref)){jobId=parseInt(ref,10);jobLabel='#'+ref;}
  else if(ref){const res=await searchJobs(ref);
    if(res.length===0){antMsg('it','I could not find a job for "'+ref+'".');return;}
    if(res.length>1){antMsg('it','Which one? '+res.slice(0,5).map(r=>'#'+r.job_id+' '+r.name).join('  ·  '));return;}
    jobId=res[0].job_id;jobLabel=res[0].name||('#'+jobId);}
  else {antMsg('it','Which job?');return;}

  if(p.intent==='search'){closeAnt();openDrawer(jobId);return;}
  if(p.intent==='assign'){
    const tid=TECH_ID_BY_NAME[(p.target||'').toLowerCase()];
    if(!tid){antMsg('it','Which tech?');return;}
    try{await postJSON('reassign_job',{job_id:jobId,technician_id:tid});antMsg('it','✅ '+jobLabel+' assigned to '+antCap(p.target)+'.');loadBoard();}catch(_){antMsg('it','⚠ that did not go through.');}
    return;
  }
  if(p.intent==='labor'||p.intent==='invoice'){
    const f=(p.fields&&typeof p.fields==='object')?Object.assign({},p.fields):{};
    if(p.intent==='labor'&&p.amount){f.labor=(p.amount||'').replace(/[^0-9.]/g,'');}
    const map={labor:'labor',part_cost:'partcost',cost:'partcost',parts_charge:'parts',parts:'parts',shipping:'ship',tax:'tax',tip:'tip',tech_pay:'techpay'};
    let cur={};try{cur=JSON.parse(localStorage.getItem('tn_inv_'+jobId)||'{}');}catch(_){}
    const summ=[];
    Object.keys(f).forEach(k=>{const wk=map[k];const v=(''+f[k]).replace(/[^0-9.]/g,'');if(wk&&v){cur[wk]=v;summ.push(k.replace('_',' ')+' $'+v);}});
    if(!summ.length){antMsg('it','What amounts? e.g. "labor 140, part cost 48, parts charge 70, tax 2.14, tech pay 60".');return;}
    const margin=(parseFloat(cur.parts)||0)-(parseFloat(cur.partcost)||0);
    const total=['labor','parts','ship','tax','tip'].reduce((s,k)=>s+(parseFloat(cur[k])||0),0);
    cur.parts_margin=margin.toFixed(2);cur.amount_invoiced=total.toFixed(2);cur._savedAt=Date.now();
    try{localStorage.setItem('tn_inv_'+jobId,JSON.stringify(cur));}catch(_){}
    try{await postJSON('record_job_invoice',{job_id:jobId,part_cost:cur.partcost||'',parts_charge:cur.parts||'',markup:margin.toFixed(2),parts_margin:margin.toFixed(2),labor:cur.labor||'',shipping:cur.ship||'',tax:cur.tax||'',tip:cur.tip||'',tech_pay:cur.techpay||'',amount_invoiced:cur.amount_invoiced});}catch(_){}
    try{prefillInvoice(jobId);}catch(_){}
    antMsg('it','✅ '+jobLabel+': '+summ.join(', ')+'  ·  invoiced $'+total.toFixed(2)+'.');return;
  }
  if(p.intent==='parts_arrived'){
    try{await postJSON('mark_parts_arrived',{job_id:jobId,source:'office_ant',notes:'marked in via Ant'});antMsg('it','✅ Parts marked in for '+jobLabel+' — moved to Needs Scheduled. Say "auto-schedule it" to put it on the calendar.');loadBoard();}catch(_){antMsg('it','⚠ that did not go through.');}
    return;
  }
  if(p.intent==='schedule'){
    try{await postJSON('enqueue_scheduling_queue_propose',{job_id:jobId,source:'office_ant_voice'});antMsg('it','✅ '+jobLabel+' queued to auto-schedule — slot options are on the way to confirm.');loadBoard();}catch(_){antMsg('it','⚠ that did not go through.');}
    return;
  }
  if(p.intent==='move'){
    const t=p.target;
    if(t==='follow_up'||t==='needs_invoice'){try{localStorage.setItem('tn_stage_'+jobId,t==='needs_invoice'?'needinv':'followup');}catch(_){}antMsg('it','✅ '+jobLabel+' → '+antFolderLabel(t)+'.');loadBoard();return;}
    const sm={waiting_parts:'awaiting_parts',completed:'completed',needs_scheduled:'not_ready'};const st=sm[t];
    if(!st){antMsg('it','Where should it go?');return;}
    try{await postJSON('office_set_job_status',{job_id:jobId,scheduling_status:st,actor:'Danielle (Ant)'});antMsg('it','✅ '+jobLabel+' → '+antFolderLabel(t)+'.');loadBoard();}catch(_){antMsg('it','⚠ that did not go through.');}
    return;
  }
}
function antVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){antMsg('it','Voice is not supported on this browser — just type it.');return;}
  const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;
  const mic=document.getElementById('ant-mic');mic.classList.add('live');
  rec.onresult=e=>{document.getElementById('ant-in').value=e.results[0][0].transcript;mic.classList.remove('live');antSend();};
  rec.onerror=()=>mic.classList.remove('live');
  rec.onend=()=>mic.classList.remove('live');
  rec.start();
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='ant-in')antSend();});

// ── Add-ons / weekly-deal fulfillment banner ──
async function loadAddons(){
  const el=document.getElementById('addons-banner'); if(!el)return;
  try{
    const r=await fetch('/.netlify/functions/addons-pending',{cache:'no-store'});
    const d=await r.json();
    const items=(d&&d.items)||[];
    if(!items.length){el.innerHTML='';return;}
    el.innerHTML='<div style="margin:0 12px 4px;background:#fff7ed;border:1px solid #f3dcc0;border-radius:12px;padding:11px 13px">'
      +'<div style="font-size:13px;font-weight:800;color:#9a5a12;margin-bottom:6px">🛍️ '+items.length+' add-on'+(items.length===1?'':'s')+' to fulfill — order the part &amp; give the tech time</div>'
      +items.map(a=>'<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #f3e6d3;font-size:13px">'
          +'<span style="flex:1;min-width:0">'+((a.mode==='ship')?'📦 ':(a.mode==='inquire'?'❓ ':'🔧 '))+'<b>#'+esc(String(a.job_id))+'</b> · '+esc(a.name)+' · '+((parseFloat(a.net_price)>0)?('$'+esc(String(a.net_price))+(a.mode==='ship'?' ship-only':'')):'<i>inquire</i>')+(a.paid?' <span style="color:#1aa260;font-weight:800">💵 PAID</span>':'')+(a.source==='weekly_deal'?' <span style="color:#d6432a;font-weight:700">[deal]</span>':(a.source==='customer_inquiry'?' <span style="color:#9a5a12;font-weight:700">[inquiry]</span>':''))+'</span>'
          +'<button onclick="openDrawer(\''+esc(String(a.job_id))+'\')" style="background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer">Open</button>'
          +'<button onclick="fulfillAddon(\''+esc(String(a.job_id))+'\',\''+esc(a.addon_key)+'\',\''+esc(String(a.name)).replace(/[\x27\\]/g,"")+'\','+(parseFloat(a.tech_cut)||0)+')" style="background:var(--ok);color:#fff;border:0;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer">Ordered ✓</button>'
        +'</div>').join('')
      +'</div>';
  }catch(_){el.innerHTML='';}
}
async function fulfillAddon(jobId,key,name,techCut){
  try{
    const r=await fetch('/.netlify/functions/record-addon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:parseInt(jobId,10),addon_key:key,name:name||key,tech_cut:parseFloat(techCut)||0,status:'fulfilled',source:'office'})});
    const d=await r.json();
    if(d&&d.success){toast('Marked ordered ✓');loadAddons();}else{toast('⚠ '+((d&&d.error)||'failed'));}
  }catch(_){toast('⚠ connection error');}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let tt=null;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}

initAuth();
