# floods the backlog.
[functions."meistertask-sync"]
  schedule = "*/10 * * * *"

# Ant Brain sweep — auto-fire a diagnostic prediction on every new job so the
# accuracy loop fills. Idempotent (skips already-predicted/seen jobs), bounded
# per run. Every 20 min.
[functions."ant-brain-sweep"]
  schedule = "*/20 * * * *"

