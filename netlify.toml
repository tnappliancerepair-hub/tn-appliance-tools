# RE-ENABLED 2026-07-01 (Teddy: "any job that needs a day+time should be sent a
# text link for availability"). Dedup is hardened (fail-closed + claim-before-
# send → one text, a second only after 4h no reply, then never). Covers ANY
# unscheduled job incl. the backlog (age cap is opt-in via
# INTAKE_COLLECTOR_MAX_AGE_DAYS, off by default); the 15/run limit + one-text
# dedup drain it steadily, not in a burst. Quiet-hours 8am-8pm CT, vendor jobs
# skipped. Runs hourly 9am-6pm CT.
# RE-ENABLED 2026-07-15 in INTAKE-LINK-ONLY mode (Teddy: "I still want the AI to send
# the most important thing — the warranty intake link, and the cash intake link too,
# automatically"). Now sends ONLY the intake link (warranty-intake for warranty jobs,
