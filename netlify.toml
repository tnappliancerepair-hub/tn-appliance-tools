[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Security headers — applied to every page served from this site.
# Keeps office surfaces hardened: CSP limits where scripts/connections
# can come from, X-Frame-Options blocks click-jacking, Referrer-Policy
# strips full URLs from outbound referrers, Permissions-Policy denies
# camera/mic except where we explicitly need them (tech-ant-chat has
# camera; we allow self).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self' https://xbtp-g9bh-ditq.n7e.xano.io https://api.anthropic.com https://api.openai.com https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org https://maps.googleapis.com https://api.telnyx.com https://*.netlify.app https://tnapplianceexchange.net https://*.amazonaws.com https://upload.cloudflarestream.com https://api.cloudflare.com https://*.cloudflarestream.com wss:; media-src 'self' blob: https://*.cloudflarestream.com; frame-src 'self' https://iframe.cloudflarestream.com https://*.cloudflarestream.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# Scheduled function: AHS dispatch email poller (every 15 minutes).
# Reads tnappliancerepair@gmail.com via Gmail API, extracts dispatch.xml
# attachments from Frontdoor emails, POSTs to Xano ahs_email_intake.
# See docs/gmail-oauth-setup.md for one-time OAuth setup.
#
# RE-ENABLED 2026-05-14 — root cause was missing idempotency at the Xano
# endpoint, NOT timeout-retry as originally hypothesized. The 75-jobs-per-
# cron pattern (25 msgs × 3 parallel invocations) was bleeding because the
# AHS endpoint had no gmail_message_id dedup check; each of the 3 parallel
# invocations saw the same unprocessed messages and re-processed them. Fix
# (commit-pending): backward-ported ServicePower's smart-dedup pattern to
# the AHS endpoint — job_email_event table with gmail_message_id as the
# idempotency anchor, lookup at top of stack, audit write after job create.
# Verified via 3-step synthetic test 2026-05-14 05:08 UTC (existing id →
# duplicate:true; fresh id → created; repeat fresh id → duplicate:true).
# Netlify poller (commit bb269ad) forwards gmail_message_id + headers in
# the Xano POST payload.
[functions."ahs-gmail-poller"]
  # STAGGERED 2026-06-18 to cure the Xano 503 spikes: 5 pollers were all firing
  # on the :00/:05/:10 marks, bursting Xano writes -> gateway shed load (instant
  # 503). Now each poller fires on its own minute offset (5-min cadence). AHS = :01.
  # (Was */3; 5-min latency is fine for warranty email intake. Revert to */3 if needed.)
  schedule = "1-59/15 * * * *"

# Scheduled function: ServicePower dispatch email poller (every 15 minutes).
# Phase A1 step 13 cleared 2026-05-13. Reads tnappliancerepair@gmail.com via
# Gmail API, parses ServicePower plaintext emails, POSTs structured dispatches
# to Xano servicepower_email_intake. Smart-dedup model: first email per Call #
# creates job; subsequent emails log to job_email_event and may update parent.
# DEDUP_FAILED triggers SES alert to danielle.tnappliance@gmail.com (live).
# Two-phase Gmail label claim mirrors AHS commit 69fbd22 to narrow parallel-
# fire race window.
#
# Per Teddy 2026-05-13: running in parallel with AHS poller + existing HCP
# system. NO cutover yet — parallel running + validation phase until both
# pollers are stable and warranty intake automation is proven.
[functions."servicepower-gmail-poller"]
  # STAGGERED 2026-06-18 — ServicePower poller on the :02 offset (see ahs note).
  schedule = "2-59/15 * * * *"

# Parts-vendor delivery-notification poller. Scans the same Gmail inbox
# the AHS / SP pollers use for shipping-confirmation + delivery emails
# from parts distributors (Marcone, Triple S, Reliable Parts) and
# carriers (FedEx, UPS). When a "delivered" message lands, posts to
# /record_parts_delivery_observation → matcher agent → mark_parts_arrived
# if a single confident job match exists. Otherwise escalates to Teddy
# with candidate jobs. Path D of the 4-path parts-arrival rail.
# Every 30 min — delivery emails aren't time-critical to the same minute.
[functions."parts-vendor-gmail-poller"]
  schedule = "*/30 * * * *"

# Gmail token watchdog — texts Teddy the moment the OAuth refresh token dies so
# warranty-email intake outages are caught SAME-DAY (not when the office runs
# short on jobs). Self-contained: talks straight to Google + Twilio, no Xano or
# colony-loop dependency (works even when those are down). 8am + 6pm CT.
[functions."gmail-token-watch"]
  schedule = "0 13,23 * * *"

# Job safety watchdog — the "we can't miss jobs" fail-safe. Every 30 min it
# reconciles every actionable job, auto-heals jobs stranded in "broadcasting"
# back into the schedule queue, and SMSes Teddy + Danielle if intake stalls,
# a job gets stuck, or the backlog spikes. Runs on Netlify so the net holds
# even if the colony loop is down.
[functions."job-safety-watch"]
  schedule = "*/30 * * * *"

# Callback watcher — Danielle stepped back from the phones (2026-06-23), so
# inbound callbacks pile up unworked and risk turning into bad reviews. Every
# 30 min (8am-8pm CT guard inside) it SMSes Teddy a digest of OPEN callbacks,
# flagging at-risk callers (repeat callers, "tech came out but...", complaints)
# at the top. Dedups on the open-set signature so it can't spam.
[functions."callback-watch"]
  schedule = "*/30 * * * *"

# Intake collector — the foundation for cluster ghost-scheduling. Hourly during
# reasonable hours (9am-6pm CT = 14:00-23:00 UTC) it texts non-vendor needs-
# scheduled jobs (that have a phone + no availability yet) the intake request:
# availability + model # + a quick video. Rate-limited + dedup'd; vendor-locked
# jobs skipped. A runtime CT-hour guard inside the function backs up the cron.
[functions."intake-collector"]
  schedule = "0 14-23 * * *"

# Payout-ready notifier — when warranty EFTs land (jobs flip to paid), texts
# Teddy a per-tech breakdown of what's ready to release, linking to Money →
# Payroll for one-tap approval. Hourly ~8am-6pm CT; dedupes on the ready-set.
[functions."payout-ready-notify"]
  schedule = "0 13-23 * * *"

# TDR chase — keeps the Frontdoor invoice queue full. Texts the assigned tech
# when a completed warranty job's report is missing the billable fields (labor
# hrs / what they fixed) so Danielle can actually invoice it. Twice/day; a CT
# business-hours guard inside the function backs up the cron; dedup 1/day/job.
[functions."tdr-chase"]
  schedule = "0 16,21 * * *"

# Nightly event_log garbage collection (noise_only) — drains high-volume,
# non-dedup plumbing rows >7 days old in capped passes. Bounds storage on the
# 10GB cap. 3:10am CT = 08:10 UTC.
[functions."nightly-event-log-gc"]
  schedule = "10 8 * * *"

# Practice auto-scheduler — DISABLED 2026-06-16. It was dumping PRACTICE_<date>
# test placements onto real techs' real days (e.g. Jimmy seeing "5 of 8" — the 3
# extras were practice jobs). The practice phase is over; this stays off.
# (Was: [functions."practice-auto-schedule-cron"] schedule = "*/15 * * * *")

# 2026-06-02 8:30am — Teddy cancelled the morning SMS (missed the 7am
# Daily tech morning briefing — each tech with jobs today gets a text with
# their stop count + first stop + dashboard link + a nudge. 7:00am CT.
[functions."tech-morning-mirror-and-encourage"]
  schedule = "0 12 * * *"

# Danielle's daily "good morning" from Ant — what needs her (to schedule, parts
# in, on hold, callbacks) in one text. 7:30am CT.
[functions."office-morning-briefing"]
  schedule = "30 12 * * *"

# One-time onboarding text to Danielle (the 5 things every job needs in Ant so
# the phones stop getting confused). Sends ONCE — lands the morning she starts.
[functions."ant-onboard-danielle"]
  schedule = "15 12 * * *"

# Warranty-status email watcher (Phase 0 of warranty automation arc).
# Scans Gmail for vendor confirmation/payment/denial emails. Defaults to
# DRY-RUN — parses + logs to event_log without updating warranty_submissions.
# Flip live by setting WARRANTY_STATUS_WATCHER_LIVE=true in Netlify env
# (only after reviewing dry-run event_log rows for pattern accuracy).
# Every 10 min — vendor confirmation emails aren't time-critical to the
# minute and we want the dry-run log volume manageable.
[functions."warranty-status-gmail-watcher"]
  schedule = "*/10 * * * *"

# Colony heartbeat watchdog. Every 5 min, verifies the Mac Mini loop
# is firing loop_tick events. If the most recent tick is older than
# COLONY_WATCHDOG_THRESHOLD_MIN (default 15), SMSes Teddy. Dedup: only
# alerts once per 2 hours so a long outage doesn't spam. 80% of the
# SPOF mitigation without standing up a warm replica.
[functions."colony-watchdog"]
  schedule = "*/5 * * * *"

# HCP poll catchup — OFF as of 2026-06-15. Danielle doesn't want Ant live-
# connected to HCP (the sync created a dupe of every email job). Replaced by a
# read-only MORNING COMPARISON (hcp-morning-compare) that checks Ant's schedule
# against HCP without writing anything. Re-enable by uncommenting if ever needed.
# [functions."hcp-poll-catchup"]
#   schedule = "*/15 * * * *"

# Multi-vendor warranty dispatch poller — catches NSA + SquareTrade +
# Allstate dispatches the AHS/SP pollers don't see (missing 25 jobs/day
# per Teddy 2026-06-02). Creates draft jobs in needs_more_info status;
# Danielle reviews + assigns from office-today instead of typing into
# HCP from scratch. Idempotent via Gmail label + Xano dedup.
[functions."warranty-multi-poller"]
  # STAGGERED 2026-06-18 — :03 offset so it doesn't collide with the others.
  schedule = "3-59/15 * * * *"

# Parse warranty drafts — picks up placeholder (Pending review) jobs
# from warranty-multi-poller, calls Claude Haiku to extract customer
# name + address + phone + appliance + claim # + dispatch # from the
# raw email body in notes_internal, writes back via
# update_warranty_draft_parsed. Effect: Danielle sees fully-populated
# queue cards instead of placeholders + walls of raw email text.
[functions."parse-warranty-drafts"]
  # STAGGERED 2026-06-18 — :04 offset (runs just after warranty-multi-poller
  # lands its drafts, so it picks them up on the next fire). colony-watchdog
  # keeps the :00 mark to itself.
  schedule = "4-59/15 * * * *"
