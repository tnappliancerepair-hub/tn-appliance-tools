# Watch the agreement % via v2-scoreboard; cut over slice-by-slice when it holds.
# Every 3h (predict new jobs + reconcile prior picks). Needs v2_shadow_decisions
# table (docs/v2-shadow-schema.sql) + SUPABASE_URL/SUPABASE_SERVICE_KEY (already set).
