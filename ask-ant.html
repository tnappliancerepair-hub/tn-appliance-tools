<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Ant - TN Appliance</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1118; color: #e8edf5; min-height: 100vh; padding: 24px 18px; max-width: 720px; margin: 0 auto; }
  :root { --orange:#f5a623; --green:#00d68f; --muted:#8a93aa; --panel:#131720; --border:#2a3040; --bg:#0e1118; }
  .header { text-align: center; padding: 8px 0 22px; }
  .header .ant { font-size: 34px; }
  .header h1 { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .header p { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 18px; }
  .search-bar input { flex: 1; padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; color: #e8edf5; font-size: 16px; outline: none; }
  .search-bar input:focus { border-color: var(--orange); }
  .search-bar button { padding: 14px 22px; background: var(--orange); color: #1a1208; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
  .result { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .result .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .result .src { font-size: 11px; color: var(--muted); font-family: monospace; }
  .result .score { font-size: 11px; color: var(--green); font-family: monospace; }
  .result .body { font-size: 13px; line-height: 1.5; }
  .empty { text-align: center; color: var(--muted); padding: 30px; }
  .err { text-align: center; color: #ff6b6b; padding: 20px; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 18px; padding: 12px; background: var(--panel); border-radius: 6px; }
</style>
</head>
<body>

<div class="header">
  <div class="ant">🐜</div>
  <h1>Ask Ant</h1>
  <p>semantic search over every TDR, customer note, chat transcript</p>
</div>

<div class="search-bar">
  <input id="q" type="search" placeholder="Have we ever fixed an LG fridge with no cooling?">
  <button id="goBtn">Ask</button>
</div>

<div id="results"></div>

<div class="hint">
  v0: search across <span id="nsLabel">general</span> namespace. Pulls top 5 matches by cosine similarity.
  Powered by OpenAI text-embedding-3-small (or dummy embedding if OPENAI_API_KEY unset).
</div>

<script>
(function() {
  const $ = (id) => document.getElementById(id);

  $('goBtn').addEventListener('click', go);
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });

  async function go() {
    const q = $('q').value.trim();
    if (!q) return;
    $('results').innerHTML = '<div class="empty">thinking…</div>';
    try {
      const res = await fetch('/.netlify/functions/ask-ant-semantic', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ query: q, top_k: 5 })
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error || 'failed');
      render(d.results || [], d.note);
    } catch (err) {
      $('results').innerHTML = `<div class="err">${escapeHtml(err.message)}</div>`;
    }
  }

  function render(rows, note) {
    if (rows.length === 0) {
      $('results').innerHTML = `<div class="empty">${escapeHtml(note || 'no matches yet — index more data first')}</div>`;
      return;
    }
    $('results').innerHTML = rows.map(r => `
      <div class="result">
        <div class="top">
          <span class="src">${escapeHtml(r.source_table || '?')} · row ${r.source_row_id}</span>
          <span class="score">${(r.score || 0).toFixed(3)}</span>
        </div>
        <div class="body">${escapeHtml((r.preview || '').slice(0, 400))}</div>
      </div>
    `).join('');
  }

  function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
})();
</script>
</body>
</html>
