<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AI Scoreboard · TN Appliance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Archivo+Expanded:wght@800&display=swap">
<style>
  :root{
    --bg:#0a0c11; --panel:#12151d; --panel2:#171b25; --line:#242a37; --line2:#323a4b;
    --ink:#eef1f7; --mut:#98a2b3; --dim:#6b7686;
    --teal:#34d3c4; --teal2:#1fb3a6;
    --named:#3fce77; --namedbg:rgba(63,206,119,.12); --namedln:rgba(63,206,119,.45);
    --nope:#7a8494; --nopebg:rgba(122,132,148,.10); --nopeln:rgba(122,132,148,.30);
    --cg:#10a37f; --cl:#d97a4e;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:820px; margin:0 auto; padding:16px 16px 90px; }
  header{ text-align:center; padding:20px 12px 4px; }
  h1{ margin:0; font-family:"Archivo Expanded",Archivo,sans-serif; font-weight:800; font-size:20px; letter-spacing:.02em; }
  h1 .t{ color:var(--teal); }
  .sub{ color:var(--mut); font-size:13px; margin-top:5px; max-width:520px; margin-left:auto; margin-right:auto; }

  /* Hero score */
  .hero{ display:flex; align-items:center; gap:20px; justify-content:center; flex-wrap:wrap;
    background:radial-gradient(120% 140% at 50% 0%, #141a26 0%, var(--panel) 60%); border:1px solid var(--line);
    border-radius:18px; padding:22px; margin:18px 0 14px; }
  .ring{ --p:0; width:120px; height:120px; border-radius:50%; flex:0 0 auto;
    background:conic-gradient(var(--teal) calc(var(--p)*1%), #232a38 0);
    display:grid; place-items:center; position:relative; }
  .ring::after{ content:""; position:absolute; inset:11px; border-radius:50%; background:var(--panel); }
  .ring .n{ position:relative; z-index:1; text-align:center; }
  .ring .n b{ font-family:"Archivo",sans-serif; font-weight:800; font-size:34px; font-variant-numeric:tabular-nums; line-height:1; }
  .ring .n span{ display:block; color:var(--mut); font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-top:3px; }
  .heroright{ min-width:200px; }
  .heroright .big{ font-family:"Archivo",sans-serif; font-weight:800; font-size:19px; }
  .heroright .big em{ color:var(--teal); font-style:normal; }
  .heroright .lil{ color:var(--mut); font-size:13px; margin-top:6px; }
  .split{ display:flex; gap:14px; margin-top:12px; }
  .split .m{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:9px 13px; flex:1; text-align:center; }
  .split .m .k{ font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); }
  .split .m .v{ font-family:"Archivo",sans-serif; font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .split .m.cg .v{ color:var(--cg); } .split .m.cl .v{ color:var(--cl); }

  /* Controls */
  .bar{ display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin:6px 0 4px; }
  button{ font:inherit; color:var(--ink); background:var(--panel2); border:1px solid var(--line2); border-radius:10px; padding:9px 15px; cursor:pointer; }
  button:hover{ border-color:var(--teal2); }
  button.go{ background:linear-gradient(180deg,var(--teal),var(--teal2)); color:#04201d; border:none; font-weight:800; }
  button:disabled{ opacity:.55; cursor:default; }
  .when{ color:var(--dim); font-size:12px; }

  /* Market cards */
  .sec{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:20px 4px 8px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:10px 0; }
  .chead{ display:flex; align-items:baseline; gap:8px; }
  .cmkt{ font-family:"Archivo",sans-serif; font-weight:800; font-size:16px; }
  .creg{ color:var(--dim); font-size:12px; margin-left:auto; }
  .mrow{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); margin-top:9px; }
  .mrow:first-of-type{ border-top:none; margin-top:6px; }
  .mname{ font-weight:700; font-size:13px; width:78px; flex:0 0 auto; display:flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; }
  .mname.cg .dot{ background:var(--cg); } .mname.cl .dot{ background:var(--cl); }
  .verd{ font-size:12px; font-weight:800; letter-spacing:.02em; border-radius:999px; padding:4px 11px; white-space:nowrap; flex:0 0 auto; }
  .verd.named{ color:var(--named); background:var(--namedbg); border:1px solid var(--namedln); }
  .verd.nope{ color:var(--nope); background:var(--nopebg); border:1px solid var(--nopeln); }
  .verd.na{ color:var(--dim); background:transparent; border:1px dashed var(--line2); }
  .comps{ display:flex; gap:5px; flex-wrap:wrap; margin-left:auto; justify-content:flex-end; }
  .chip{ font-size:11px; color:var(--mut); background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
  .see{ font-size:12px; color:var(--teal); background:none; border:none; padding:0; margin-left:6px; cursor:pointer; }
  .ans{ display:none; white-space:pre-wrap; font-size:12.5px; color:#c7cdd8; background:#0d1017; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; }
  .ans.show{ display:block; }

  /* Trend */
  .trend{ display:flex; align-items:flex-end; gap:6px; height:64px; margin-top:8px; padding:8px 2px 0; }
  .tb{ flex:1; background:linear-gradient(180deg,var(--teal),var(--teal2)); border-radius:4px 4px 0 0; min-height:3px; position:relative; }
  .tb.now{ box-shadow:0 0 0 2px rgba(52,211,196,.35); }
  .tb span{ position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--mut); font-variant-numeric:tabular-nums; }
  .tlab{ display:flex; justify-content:space-between; color:var(--dim); font-size:11px; margin-top:6px; }

  .empty{ text-align:center; color:var(--mut); padding:48px 12px; }
  .spin{ text-align:center; color:var(--mut); padding:44px; }
  .foot{ color:var(--dim); font-size:12px; text-align:center; margin-top:26px; line-height:1.6; }
  .foot a{ color:var(--teal2); }
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--teal); color:#04201d; font-weight:800; padding:10px 18px; border-radius:999px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<header>
  <h1>🤖 <span class="t">AI Scoreboard</span></h1>
  <div class="sub">When someone asks ChatGPT or Claude <b>"best appliance repair near me"</b> — are we the name they get? Asked live, per market.</div>
</header>
<div class="wrap"><div id="content"><div class="spin">Loading the scoreboard…</div></div></div>
<div class="toast" id="toast"></div>

<script>
const API = '/.netlify/functions/ai-scoreboard';
let SECRET = localStorage.getItem('tn_ai_secret') || '';
let POLL = null;

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
function esc(s){ return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function ago(ms){ if(!ms) return 'never'; const s=(Date.now()-ms)/1000; if(s<90) return 'just now'; if(s<3600) return Math.round(s/60)+'m ago'; if(s<86400) return Math.round(s/3600)+'h ago'; return Math.round(s/86400)+'d ago'; }

async function get(run){
  const r = await fetch(API+'?secret='+encodeURIComponent(SECRET)+(run?'&run=1':''));
  if(r.status===401){ localStorage.removeItem('tn_ai_secret'); SECRET=''; throw new Error('unauthorized'); }
  return r.json();
}

function modelRow(kind, cls, m){
  if(!m || !m.available){
    return '<div class="mrow"><div class="mname '+cls+'"><span class="dot"></span>'+kind+'</div>'
      + '<span class="verd na">no answer</span></div>';
  }
  const verd = m.mentioned
    ? '<span class="verd named">✓ recommends us</span>'
    : '<span class="verd nope">not yet</span>';
  const comps = (m.competitors||[]).slice(0,4).map(c=>'<span class="chip">'+esc(c)+'</span>').join('');
  const see = m.answer ? '<button class="see" data-ans>see answer</button>' : '';
  return '<div class="mrow"><div class="mname '+cls+'"><span class="dot"></span>'+kind+'</div>'
    + verd
    + '<div class="comps">'+comps+see+'</div></div>'
    + (m.answer ? '<div class="ans">'+esc(m.answer)+'</div>' : '');
}

function render(state){
  const c = document.getElementById('content');
  const L = state && state.latest;
  const gen = state && state.generating;

  if(!L){
    c.innerHTML = '<div class="bar"><button class="go" id="run" '+(gen?'disabled':'')+'>'+(gen?'Asking the AIs…':'Run the first check')+'</button></div>'
      + '<div class="empty">'+(gen
        ? 'Asking ChatGPT + Claude across all 5 markets with live web search — this takes a few minutes. It will fill in automatically.'
        : 'No results yet. Tap <b>Run the first check</b> to ask both AIs, live, whether they recommend us in each market.')+'</div>'
      + foot();
    wire(state);
    return;
  }

  const pct = L.pct||0;
  // Group markets by region for readable sections.
  const byRegion = {};
  (L.results||[]).forEach(r=>{ (byRegion[r.region] = byRegion[r.region]||[]).push(r); });

  let cards = '';
  Object.keys(byRegion).forEach(region=>{
    cards += '<div class="sec">'+esc(region)+'</div>';
    byRegion[region].forEach(r=>{
      cards += '<div class="card">'
        + '<div class="chead"><span class="cmkt">'+esc(r.label)+'</span><span class="creg">'+esc(r.region)+'</span></div>'
        + modelRow('ChatGPT','cg',r.chatgpt)
        + modelRow('Claude','cl',r.claude)
        + '</div>';
    });
  });

  c.innerHTML =
    '<div class="hero">'
      + '<div class="ring" style="--p:'+pct+'"><div class="n"><b>'+pct+'%</b><span>of AI answers</span></div></div>'
      + '<div class="heroright">'
        + '<div class="big">Named in <em>'+(L.score_named||0)+' of '+(L.score_of||0)+'</em> live AI answers</div>'
        + '<div class="lil">across '+(L.markets||0)+' markets, both models</div>'
        + '<div class="split">'
          + '<div class="m cg"><div class="k">ChatGPT</div><div class="v">'+(L.chatgpt_named||0)+'/'+(L.chatgpt_answered||0)+'</div></div>'
          + '<div class="m cl"><div class="k">Claude</div><div class="v">'+(L.claude_named||0)+'/'+(L.claude_answered||0)+'</div></div>'
        + '</div>'
      + '</div>'
    + '</div>'
    + '<div class="bar"><button class="go" id="run" '+(gen?'disabled':'')+'>'+(gen?'Re-asking the AIs…':'↻ Run a fresh check')+'</button>'
      + '<span class="when">Last checked '+ago(L.ran_at)+'</span></div>'
    + cards
    + trend(state)
    + foot();
  wire(state);
}

function trend(state){
  const h = (state && state.history)||[];
  if(h.length<2) return '';
  const max = Math.max(1, ...h.map(p=>p.score_of||0));
  const bars = h.map((p,i)=>{
    const pcnt = Math.round(((p.score_named||0)/max)*100);
    const now = i===h.length-1 ? ' now' : '';
    return '<div class="tb'+now+'" style="height:'+Math.max(6,pcnt)+'%"><span>'+(p.score_named||0)+'</span></div>';
  }).join('');
  return '<div class="sec">Trend — markets naming us over time</div>'
    + '<div class="card"><div class="trend">'+bars+'</div>'
    + '<div class="tlab"><span>'+ago(h[0].ran_at)+'</span><span>now</span></div></div>';
}

function foot(){
  return '<div class="foot">Both models search the live web to answer, so this reflects the real state we\'re engineering — reviews, best-of lists, and our own authority pages.<br>'
    + 'The play: <a href="/docs/ai-referral-strategy.md">AI-referral strategy</a>. Auto-runs weekly; tap ↻ anytime.</div>';
}

function wire(state){
  const b = document.getElementById('run');
  if(b) b.onclick = ()=>{ load(true); };
  document.querySelectorAll('[data-ans]').forEach(btn=>{
    btn.onclick = ()=>{ const a=btn.closest('.mrow').nextElementSibling; if(a && a.classList.contains('ans')){ a.classList.toggle('show'); btn.textContent = a.classList.contains('show')?'hide':'see answer'; } };
  });
}

async function load(run){
  if(POLL){ clearInterval(POLL); POLL=null; }
  try{
    const s = await get(run);
    render(s);
    if(run) toast('Asking both AIs across 5 markets…');
    if(s.generating){
      // Poll every 12s until the background run lands.
      POLL = setInterval(async ()=>{
        try{ const s2 = await get(false); render(s2); if(!s2.generating){ clearInterval(POLL); POLL=null; toast('Scoreboard updated'); } }
        catch(_){ clearInterval(POLL); POLL=null; }
      }, 12000);
    }
  }catch(e){
    if(String(e.message)==='unauthorized'){ askSecret(); return; }
    document.getElementById('content').innerHTML = '<div class="empty">Couldn\'t load. <button class="go" onclick="load(false)">Retry</button></div>';
  }
}

function askSecret(){
  const s = prompt('Owner passcode:');
  if(s===null) return;
  SECRET = s.trim(); localStorage.setItem('tn_ai_secret', SECRET);
  load(false);
}

if(!SECRET) askSecret(); else load(false);
</script>
</body>
</html>
