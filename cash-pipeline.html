<style>
  :root{--bg:#070a0e;--card:#111824;--bord:#1f2a37;--text:#e6edf3;--muted:#8b98a5;--green:#39ff14;--orange:#ff8c42;--blue:#4cc9c0;--mono:ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;padding:16px;max-width:820px;margin:0 auto;}
  h1{font-size:20px;}.sub{color:var(--muted);font-size:12px;margin:4px 0 16px;}
  .gate{max-width:320px;margin:60px auto;text-align:center;}
  .gate input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--bord);background:var(--card);color:var(--text);font-size:16px;margin:10px 0;}
  .gate button{background:var(--blue);color:#04201d;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:14px;}
  .stat .big{font-size:26px;font-weight:800;font-family:var(--mono);}
  .stat .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
  .stat.money .big{color:var(--green);}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;}
  .action{background:#1a1206;border:1px solid #6b4a16;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .action.ok{background:#0e1a12;border-color:#1d3b2a;}
  .action a{color:var(--orange);text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap;}
  .card{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .card .top{display:flex;justify-content:space-between;gap:10px;}
  .card .nm{font-weight:700;}.card .amt{color:var(--green);font-family:var(--mono);font-weight:800;}
  .card .mt{color:var(--muted);font-size:12px;margin-top:3px;}
  .card a{color:var(--blue);font-size:12px;text-decoration:none;}
  .empty{color:var(--muted);font-size:13px;padding:10px 0;}
</style></head><body>
<div id="gate" class="gate">
  <h1>💵 Cash Pipeline</h1>
  <input id="pw" type="password" placeholder="Office password">
  <button onclick="unlock()">Unlock</button>
  <div id="gerr" style="color:#ff6b6b;font-size:12px;margin-top:8px;"></div>
</div>
<div id="app" style="display:none;">
  <h1>💵 Cash Pipeline <span style="font-size:12px;color:var(--muted)">· last 7 days</span></h1>
  <div class="sub">The $50 Quick Check money machine — live. Auto-refreshes.</div>
  <div class="stats" id="stats"></div>
  <div class="sec">⚡ Needs your attention</div>
  <div id="actions"></div>
  <div class="sec">🧾 Recent Quick Checks paid</div>
  <div id="recent"><div class="empty">Loading…</div></div>
</div>
<script>
const FN='/.netlify/functions';
function unlock(){
  const pw=document.getElementById('pw').value.trim();
  fetch('https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA/verify_office_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
    .then(r=>r.json()).then(d=>{ if(d&&(d.valid||d.success||d.ok)){ localStorage.setItem('ant_office_pw',pw); show(); } else document.getElementById('gerr').textContent='Wrong password'; })
    .catch(()=>document.getElementById('gerr').textContent='Connection error');
}
function show(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; load(); setInterval(load,45000); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(n){ return '$'+(Number(n||0)).toFixed(0); }
function ago(ms){ if(!ms) return ''; const m=Math.floor((Date.now()-ms)/60000); if(m<60) return m+'m ago'; const h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }
async function load(){
  try{
    const d=await fetch(FN+'/cash-pipeline?days=7').then(r=>r.json());
    const q=d.quick_checks||{}, p=d.parts||{}, a=d.action_needed||{};
    document.getElementById('stats').innerHTML=`
      <div class="stat money"><div class="big">${money(q.collected_today)}</div><div class="lbl">Collected today</div></div>
      <div class="stat"><div class="big">${q.paid_today||0}</div><div class="lbl">Quick Checks today</div></div>
      <div class="stat money"><div class="big">${money(q.collected_window)}</div><div class="lbl">Collected · 7d</div></div>
      <div class="stat"><div class="big">${q.paid_window||0}</div><div class="lbl">Quick Checks · 7d</div></div>`;
    const acts=[];
    acts.push(`<div class="action${(a.to_order_now||0)?'':' ok'}"><div><b>${a.to_order_now||0}</b> part order${(a.to_order_now===1)?'':'s'} to place</div><a href="/parts-orders.html">Open To-Order board →</a></div>`);
    acts.push(`<div class="action${(a.media_pending||0)?'':' ok'}"><div><b>${a.media_pending||0}</b> job${(a.media_pending===1)?'':'s'} missing video/photo (customer texted a finish link)</div><a href="/office-board.html">View board →</a></div>`);
    acts.push(`<div class="action ok"><div><b>${p.orders_placed_window||0}</b> parts ordered (7d) · <b>${p.orders_created_window||0}</b> created</div><span style="color:var(--muted);font-size:12px">shipping to customers</span></div>`);
    document.getElementById('actions').innerHTML=acts.join('');
    const rec=d.recent||[];
    document.getElementById('recent').innerHTML = rec.length? rec.map(r=>`<div class="card">
      <div class="top"><span class="nm">${esc(r.name||'(caller)')}</span><span class="amt">${money(r.amount)}</span></div>
      <div class="mt">${esc(r.machine||'appliance')}${r.town?(' · '+esc(r.town)):''} · ${ago(r.at)}</div>
      ${r.job_id?`<a href="/teddy-tdr-tool.html?job_id=${r.job_id}">Job #${r.job_id} → diagnose ↗</a>`:''}
    </div>`).join('') : '<div class="empty">No Quick Checks paid yet in this window.</div>';
  }catch(_){ document.getElementById('recent').innerHTML='<div class="empty">Could not load.</div>'; }
}
if(localStorage.getItem('ant_office_pw')) show();
</script>
</body></html>
