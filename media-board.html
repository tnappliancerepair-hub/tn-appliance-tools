<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Board · Ant</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--bg:#070a0e;--card:#111824;--bord:#1f2a37;--text:#e6edf3;--muted:#8b98a5;--green:#39ff14;--orange:#ff8c42;--blue:#4cc9c0;--mono:ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;padding:14px;max-width:900px;margin:0 auto;}
  h1{font-size:20px;}.sub{color:var(--muted);font-size:12px;margin:4px 0 14px;}
  .gate{max-width:320px;margin:60px auto;text-align:center;}
  .gate input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--bord);background:var(--card);color:var(--text);font-size:16px;margin:10px 0;}
  .gate button{background:var(--blue);color:#04201d;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;}
  .card{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px;margin-bottom:10px;display:block;text-decoration:none;color:inherit;}
  .card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .nm{font-weight:800;font-size:15px;color:var(--text);}
  .jid{color:var(--muted);font-size:12px;font-family:var(--mono);}
  .appl{color:#cdd7e1;font-size:13px;margin-top:2px;}
  .prob{color:var(--muted);font-size:12px;margin-top:2px;font-style:italic;}
  .thumbs{display:flex;gap:6px;margin-top:9px;overflow-x:auto;}
  .thumbs img,.thumbs .vid{height:74px;width:74px;flex:0 0 auto;border-radius:8px;object-fit:cover;background:#0b1119;border:1px solid var(--bord);}
  .thumbs .vid{display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--blue);}
  .b{font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;}
  .b.cash{background:rgba(255,140,66,.14);border:1px solid rgba(255,140,66,.5);color:var(--orange);}
  .b.war{background:rgba(76,167,255,.14);border:1px solid rgba(76,167,255,.5);color:#4ca7ff;}
  .b.cnt{background:rgba(57,255,20,.10);border:1px solid rgba(57,255,20,.4);color:var(--green);}
  .empty{color:var(--muted);font-size:14px;padding:24px 0;text-align:center;}
  .refresh{color:var(--blue);font-size:12px;text-decoration:none;}
</style></head><body>
<div id="gate" class="gate">
  <h1>📸 Media Board</h1>
  <input id="pw" type="password" placeholder="Office password">
  <button onclick="unlock()">Unlock</button>
  <div id="gerr" style="color:#ff6b6b;font-size:12px;margin-top:8px;"></div>
</div>
<div id="app" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <h1>📸 Media Board</h1>
    <a class="refresh" href="#" onclick="load();return false;">↻ refresh</a>
  </div>
  <div class="sub">Every job with customer/tech photos or video — newest first. Tap a card to open it in the Teddy Tool. Nothing uploaded sits unseen.</div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script src="/office-nav.js?v=20260701-crew"></script>
<script>
const FN='/.netlify/functions';
const XANO='https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
function unlock(){
  const pw=document.getElementById('pw').value.trim();
  fetch(XANO+'/verify_office_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
    .then(r=>r.json()).then(d=>{ if(d&&(d.valid||d.success||d.ok)){ localStorage.setItem('ant_office_pw',pw); show(); } else document.getElementById('gerr').textContent='Wrong password'; })
    .catch(()=>document.getElementById('gerr').textContent='Connection error');
}
function show(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; load(); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function ago(ms){ if(!ms) return ''; const m=Math.floor((Date.now()-ms)/60000); if(m<60) return m+'m ago'; const h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }

async function load(){
  const host=document.getElementById('list');
  try{
    const d=await fetch(FN+'/new-media?days=21&limit=160').then(r=>r.json());
    const items=(d&&d.items)||[];
    if(!items.length){ host.innerHTML='<div class="empty">No jobs with media in the last 3 weeks.</div>'; return; }
    host.innerHTML=items.map(card).join('');
    items.forEach(it=>loadThumbs(it.job_id));
  }catch(_){ host.innerHTML='<div class="empty">Could not load. Tap refresh.</div>'; }
}
function card(it){
  const tag = it.customer_type==='self_pay'
    ? '<span class="b cash">CASH</span>'
    : (it.warranty_company?('<span class="b war">'+esc(it.warranty_company.toUpperCase())+'</span>'):'');
  return `<a class="card" href="/teddy-tdr-tool.html?job_id=${it.job_id}">
    <div class="top"><span class="nm">${esc(it.name)}</span><span class="jid">#${it.job_id} · ${ago(it.created_ms)}</span></div>
    <div class="appl">${esc(it.appliance||'appliance')} ${tag} <span class="b cnt">📎 ${it.media_count}</span></div>
    ${it.problem?`<div class="prob">"${esc(it.problem)}"</div>`:''}
    <div class="thumbs" id="th-${it.job_id}"></div>
  </a>`;
}
async function loadThumbs(jobId){
  try{
    const a=await fetch(XANO+'/get_job_attachments?job_id='+jobId).then(r=>r.json());
    const arr=(a&&a.attachments)||[]; const host=document.getElementById('th-'+jobId);
    if(!host||!arr.length) return;
    host.innerHTML=arr.slice(0,8).map(at=>{
      const url=at.signed_view_url||'';
      const isVid=(at.file_type==='video')|| /cfstream:|\.mp4/i.test(at.s3_key||'');
      if(isVid) return '<div class="vid">🎬</div>';
      return url?`<img loading="lazy" src="${url}" alt="">`:'<div class="vid">🖼️</div>';
    }).join('');
  }catch(_){}
}
if(localStorage.getItem('ant_office_pw')) show();
</script>
</body></html>
