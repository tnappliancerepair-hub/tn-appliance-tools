<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Content Calendar · TN Appliance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐜</text></svg>">
<style>
  :root{ --bg:#0c0d11; --panel:#15171d; --line:#242833; --gold:#e7c255; --gold2:#c9a23a; --ink:#f2efe6; --mut:#98a1ad; --warn:#e08a3c; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  header{ padding:18px 18px 6px; text-align:center; }
  h1{ margin:0; font-size:20px; } h1 .g{ color:var(--gold); }
  .sub{ color:var(--mut); font-size:13px; margin-top:4px; }
  .wrap{ max-width:780px; margin:0 auto; padding:12px 16px 70px; }
  .bar{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
  button{ font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 14px; cursor:pointer; }
  button:hover{ border-color:var(--gold2); }
  button.gold{ background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#1a1400; border:none; font-weight:700; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0; }
  .top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .fmt{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#1a1400; background:var(--gold); border-radius:999px; padding:3px 9px; }
  .appl{ font-size:12px; color:var(--mut); text-transform:capitalize; }
  .tag{ font-size:11px; border:1px solid var(--line); color:var(--mut); border-radius:999px; padding:2px 8px; margin-left:auto; }
  .tag.g{ color:var(--gold); border-color:var(--gold2); }
  .hook{ font-size:19px; font-weight:800; margin:2px 0 6px; }
  .angle{ color:#cfd4db; font-size:14px; margin-bottom:10px; }
  .pro{ background:rgba(224,138,60,.12); border:1px solid rgba(224,138,60,.5); color:var(--warn); border-radius:10px; padding:8px 10px; font-size:13px; font-weight:600; margin-bottom:10px; }
  .cap{ background:#101319; border:1px solid var(--line); border-radius:10px; padding:11px; white-space:pre-wrap; font-size:13.5px; color:#dfe3ea; }
  .row{ display:flex; gap:8px; margin-top:8px; }
  .empty{ text-align:center; color:var(--mut); padding:50px 12px; }
  .badge{ display:inline-block; background:#101319; border:1px solid var(--line); color:var(--gold); border-radius:999px; padding:3px 10px; font-size:12px; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--gold); color:#1a1400; font-weight:700; padding:10px 16px; border-radius:999px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show{ opacity:1; }
  .spin{ text-align:center; color:var(--mut); padding:40px; }
</style>
</head>
<body>
<header>
  <h1>🐜👑 <span class="g">Content Calendar</span></h1>
  <div class="sub">A week of ideas from your <b>real repairs</b> <span class="badge" id="corpus">loading…</span></div>
</header>
<div class="wrap"><div id="content"><div class="spin">Loading your content calendar…</div></div></div>
<div class="toast" id="toast"></div>

<script>
const API = '/.netlify/functions/content-ideas';
let SECRET = localStorage.getItem('tn_social_secret') || '';
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }
function esc(s){ return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

let POLL=null;
async function get(refresh){
  const r=await fetch(API+'?secret='+encodeURIComponent(SECRET)+(refresh?'&refresh=1':''));
  if(r.status===401){ localStorage.removeItem('tn_social_secret'); SECRET=''; throw new Error('unauthorized'); }
  return r.json();
}
async function load(refresh){
  if(POLL){ clearInterval(POLL); POLL=null; }
  if(!SECRET){ const s=prompt('Enter admin secret:'); if(!s) return; SECRET=s.trim(); localStorage.setItem('tn_social_secret',SECRET); }
  let d;
  try{ d=await get(refresh); }
  catch(e){ if(String(e.message)==='unauthorized'){ document.getElementById('content').innerHTML='<div class="empty">Wrong secret. <button onclick="location.reload()">Try again</button></div>'; return; } document.getElementById('content').innerHTML='<div class="empty">Network error. <button onclick="load(false)">Retry</button></div>'; return; }
  const haveIdeas=(d.ideas||[]).length;
  document.getElementById('corpus').textContent=(d.corpus_size||0)+' real repair records';
  // If we asked for new (or there are none yet) and it's generating, poll for the result.
  if(d.generating && (refresh || !haveIdeas)){ pollGenerating(); return; }
  if(!haveIdeas){ document.getElementById('content').innerHTML='<div class="empty">'+(d.error?('Couldn\'t generate: '+esc(d.error)):'No ideas yet')+'. <button onclick="load(true)">Generate</button></div>'; return; }
  render(d.ideas, d.cached);
}
function pollGenerating(){
  let secs=0;
  document.getElementById('content').innerHTML='<div class="spin">✨ Reading your latest jobs and writing this week’s calendar… (~15–30s)</div>';
  POLL=setInterval(async()=>{
    secs+=5;
    let d; try{ d=await get(false); }catch(e){ return; }
    if((d.ideas||[]).length && !d.generating){ clearInterval(POLL); POLL=null; document.getElementById('corpus').textContent=(d.corpus_size||0)+' real repair records'; render(d.ideas,false); return; }
    if(d.error && !d.generating){ clearInterval(POLL); POLL=null; document.getElementById('content').innerHTML='<div class="empty">Couldn\'t generate: '+esc(d.error)+'. <button onclick="load(true)">Try again</button></div>'; return; }
    if(secs>=75){ clearInterval(POLL); POLL=null; if((d.ideas||[]).length) render(d.ideas,true); else document.getElementById('content').innerHTML='<div class="empty">Still working — <button onclick="load(false)">check again</button></div>'; }
  },5000);
}

function render(ideas, cached){
  if(!ideas.length){ document.getElementById('content').innerHTML='<div class="empty">No ideas yet.</div>'; return; }
  const head = '<div class="bar"><button class="gold" onclick="load(true)">✨ Generate fresh ideas</button></div>'
    + (cached?'<div style="text-align:center;color:#98a1ad;font-size:12px;margin-bottom:6px">saved calendar — tap “Generate fresh” for new ideas from your latest jobs</div>':'');
  const cards = ideas.map((it,i)=>{
    const cap = it.caption + (it.hashtags&&it.hashtags.length? '\n\n'+it.hashtags.map(h=>h[0]==='#'?h:'#'+h).join(' '):'');
    window.__caps=window.__caps||[]; window.__caps[i]=cap;
    return '<div class="card">'
      + '<div class="top"><span class="fmt">'+esc((it.format||'idea').replace(/_/g,' '))+'</span><span class="appl">'+esc(it.appliance||'')+'</span>'
      +   '<span class="tag '+(it.grounded?'g':'')+'">'+(it.grounded?'★ from real jobs':'evergreen')+'</span></div>'
      + '<div class="hook">'+esc(it.hook||it.title||'')+'</div>'
      + '<div class="angle">'+esc(it.angle||'')+'</div>'
      + (it.needs_pro?'<div class="pro">⚠️ Safety: pro-only job — the caption tells them not to DIY this one.</div>':'')
      + '<div class="cap">'+esc(cap)+'</div>'
      + '<div class="row"><button onclick="copyCap('+i+')">📋 Copy caption</button></div>'
      + '</div>';
  }).join('');
  document.getElementById('content').innerHTML = head + cards;
}
function copyCap(i){ const t=(window.__caps||[])[i]||''; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Caption copied')).catch(()=>{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Caption copied'); }); }

load(false);
</script>
</body>
</html>
