  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 520px; margin: 0 auto; }
    .header {
      background: #1a1a2e;
      color: white;
      padding: 24px 20px;
      border-radius: 16px 16px 0 0;
      text-align: center;
    }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 14px; opacity: 0.8; }
    .card {
      background: white;
      padding: 24px 20px;
      border-radius: 0 0 16px 16px;

    }
    .loading, .error, .empty {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    .error { color: #cc0000; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #eee;
      border-top-color: #0077cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;

    .intro {

      margin-bottom: 20px;
      line-height: 1.5;

    .intro strong { color: #1a1a2e; }
    .form-label {

      font-size: 13px;

    .form-input {
      width: 100%;
      padding: 14px 14px;

      background: white;

      outline: none;
      border-color: #0077cc;

      display: grid;
      grid-template-columns: 1fr 100px 100px;

    @media (max-width: 420px) {

    .continue-btn {
      width: 100%;
      padding: 16px;
      margin-top: 22px;
      background: #0077cc;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .continue-btn:hover { background: #005fa3; }
    .continue-btn:active { transform: scale(0.98); }
    .continue-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .form-note {
      font-size: 12px;
      color: #888;
      margin-top: 14px;

      text-align: center;
    }
    .day-group {
      margin-bottom: 18px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      overflow: hidden;
    }
    .day-header {
      background: #f7f8fb;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e5;
    }
    .day-name {
      font-weight: 700;
      font-size: 15px;
      color: #1a1a2e;
    }
    .day-date {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }
    .day-slots {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

    .slot-btn {
      padding: 14px 10px;
      background: white;
      border: 2px solid #e5e5e5;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: #0077cc;
      cursor: pointer;
      transition: all 0.15s;
    }
    .slot-btn:hover {
      border-color: #0077cc;
      background: #f0f7ff;
    }
    .slot-btn:active { transform: scale(0.98); }
    .slot-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .show-more {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: white;
      border: 2px dashed #cccccc;
      border-radius: 12px;

      border-color: #0077cc;

    .address-summary {
      background: #f7f8fb;
      border: 1px solid #e0e0e0;

      color: #0077cc;

    }

    .success h2 {

    .success-details div { margin-bottom: 8px; font-size: 15px; }

    .success-details strong { color: #1a1a2e; }

<body>
  <div class="container">
    <div class="header">
      <h1>🔧 TN Appliance Exchange</h1>
      <p>Pick your appointment time</p>
    </div>
    <div class="card" id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </div>
    <div class="help">
      Questions? Call <a href="tel:6292607111">629-260-7111</a>
    </div>
  </div>

  <script>
    const XANO_BASE = "https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA";
    const DEFAULT_DAYS_VISIBLE = 5;

    let currentJob = null;
    let currentZip = "";
    let currentName = "";
    let currentAddress = { street: "", city: "", state: "TN", zip: "" };

    function getJobId() {
      const p = new URLSearchParams(window.location.search);
      return p.get("job_id") || p.get("job") || "";
    }
    function getUrlZip() {
      const p = new URLSearchParams(window.location.search);
      return p.get("zip") || "";
    }
    function getUrlName() {
      const p = new URLSearchParams(window.location.search);
      return p.get("name") || "";
    }

    function showError(msg) {
      document.getElementById("content").innerHTML = `
        <div class="error">
          <p>${msg}</p>
          <p style="margin-top:12px;font-size:13px;">Please call us at <a href="tel:6292607111" style="color:#0077cc;">629-260-7111</a> to schedule.</p>
        </div>`;
    }

    function rawWindowFromDisplay(display) {
      const parts = display.split("-").map(s => s.trim().toLowerCase());
      function hr(s) { return parseInt(s.replace(/[^0-9]/g, ""), 10); }
      return `${hr(parts[0])}-${hr(parts[1])}`;
    }

    async function loadJob() {
      const jobId = getJobId();
      if (!jobId) {
        showError("No job ID found. Please use the link we sent you via text.");
        return null;
      }
      try {
        const res = await fetch(`/.netlify/functions/get-job-proxy?job_id=${jobId}`);
        if (!res.ok) throw new Error("Job not found");
        return await res.json();
      } catch (e) {
        showError("We couldn't find your appointment.");
        return null;
      }
    }

    async function loadSlots(zipCode) {
      try {
        const res = await fetch(`${XANO_BASE}/get_available_slots?zip_code=${encodeURIComponent(zipCode)}&days_ahead=14`);
        if (!res.ok) throw new Error("Could not load slots");
        return await res.json();
      } catch (e) {
        showError("We couldn't load available times right now.");
        return null;
      }
    }

    async function bookSlot(jobId, date, displayWindow, address) {
      const raw = rawWindowFromDisplay(displayWindow);
      const startPart = displayWindow.split("-")[0].trim().toLowerCase();
      const isPM = startPart.includes("pm");
      let startH = parseInt(startPart.replace(/[^0-9]/g, ""), 10);
      if (isPM && startH !== 12) startH += 12;
      if (!isPM && startH === 12) startH = 0;
      const preferredTime = `${String(startH).padStart(2, "0")}:00:00`;

      try {
        const res = await fetch(`${XANO_BASE}/book_appointment`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            job_id: parseInt(jobId),
            preferred_date: date,
            preferred_time: preferredTime,
            service_eta_window: raw,
            service_address: address.street,
            service_city: address.city,
            service_state: address.state,
            service_zip: address.zip,
            notes: `Customer self-scheduled via web portal`
          })
        });
        if (!res.ok) throw new Error("Booking failed");
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function renderAddressForm() {
      const greeting = currentName ? `Hi ${currentName}!` : "Hi!";
      const applianceText = currentJob.appliance_type || "appliance";

      document.getElementById("content").innerHTML = `
        <div class="intro">
          ${greeting} Your waiver is signed and we're ready to schedule your <strong>${applianceText}</strong> repair.
          <br><br>
          <strong>First — please confirm your service address</strong> so we can show you scheduling options:
        </div>

        <label class="form-label" for="streetInput">Street Address</label>
        <input type="text" id="streetInput" class="form-input" placeholder="123 Main St, Apt 4B" autocomplete="street-address" value="${currentAddress.street}" />

        <div class="form-row" style="margin-top:14px;">
          <div>
            <label class="form-label" for="cityInput" style="margin-top:0;">City</label>
            <input type="text" id="cityInput" class="form-input" placeholder="Nashville" autocomplete="address-level2" value="${currentAddress.city}" />
          </div>
          <div>
            <label class="form-label" for="stateInput" style="margin-top:0;">State</label>
            <input type="text" id="stateInput" class="form-input" placeholder="TN" maxlength="2" autocomplete="address-level1" value="${currentAddress.state}" />
          </div>
          <div>
            <label class="form-label" for="zipInput" style="margin-top:0;">Zip</label>
            <input type="text" id="zipInput" class="form-input" placeholder="37215" maxlength="5" autocomplete="postal-code" inputmode="numeric" value="${currentAddress.zip || currentZip}" />
          </div>
        </div>

        <button class="continue-btn" id="continueBtn">Continue to Available Times →</button>
        <p class="form-note">We'll only use this address to send your technician to the right place.</p>
      `;

      document.getElementById("continueBtn").addEventListener("click", handleContinue);
      document.getElementById("streetInput").focus();
    }

    async function handleContinue() {
      const street = document.getElementById("streetInput").value.trim();
      const city = document.getElementById("cityInput").value.trim();
      const state = document.getElementById("stateInput").value.trim().toUpperCase();
      const zip = document.getElementById("zipInput").value.trim();

      if (!street || !city || !state || !zip) {
        alert("Please fill in all address fields so we can dispatch your technician.");
        return;
      }

      if (zip.length !== 5 || !/^\d+$/.test(zip)) {
        alert("Please enter a valid 5-digit zip code.");
        return;
      }

      currentAddress = { street, city, state, zip };

      document.getElementById("content").innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading available times...</p>
        </div>`;

      const slotsData = await loadSlots(zip);
      if (!slotsData) return;
      renderSlotsView(slotsData.available_slots);
    }

    function showSuccess(displayWindow, date) {
      const dateObj = new Date(date + "T12:00:00");
      const dateFormatted = dateObj.toLocaleDateString("en-US", {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });
      const fullAddress = `${currentAddress.street}, ${currentAddress.city}, ${currentAddress.state} ${currentAddress.zip}`;
      document.getElementById("content").innerHTML = `
        <div class="success">
          <div class="check">✅</div>
          <h2>You're Scheduled!</h2>
          <p>Thanks${currentName ? " " + currentName : ""}, your appointment is confirmed.</p>
          <div class="success-details">
            <div><strong>Date:</strong> ${dateFormatted}</div>
            <div><strong>Arrival Window:</strong> ${displayWindow}</div>
            <div><strong>Service Address:</strong> ${fullAddress}</div>
          </div>
          <p class="footer-note">
            Your technician will text you when they're on their way.<br>
            We'll also send you a reminder 2 days before your appointment.
          </p>
        </div>`;
    }

    function groupSlotsByDate(slots) {
      const groups = {};
      const order = [];
      slots.forEach(s => {
        if (!groups[s.date]) {
          groups[s.date] = { date: s.date, day: s.day, slots: [] };
          order.push(s.date);
        }
        groups[s.date].slots.push(s);
      });
      return order.map(d => groups[d]);
    }

    function renderDayGroup(group) {
      const dateObj = new Date(group.date + "T12:00:00");
      const monthDay = dateObj.toLocaleDateString("en-US", { month: "long", day: "numeric" });
      const slotsHtml = group.slots.map(slot => `
        <button class="slot-btn" data-date="${slot.date}" data-window="${slot.window}">
          ${slot.window}
        </button>
      `).join("");
      return `
        <div class="day-group">
          <div class="day-header">
            <div class="day-name">${group.day}</div>
            <div class="day-date">${monthDay}</div>
          </div>
          <div class="day-slots">${slotsHtml}</div>
        </div>`;
    }

    function attachSlotHandlers() {
      document.querySelectorAll(".slot-btn").forEach(btn => {
        if (btn.dataset.bound) return;
        btn.dataset.bound = "1";
        btn.addEventListener("click", async () => {
          const date = btn.dataset.date;
          const win = btn.dataset.window;
          document.querySelectorAll(".slot-btn").forEach(b => b.disabled = true);
          btn.innerHTML = "Booking...";
          const result = await bookSlot(currentJob.id, date, win, currentAddress);
          if (result) {
            showSuccess(win, date);
          } else {
            showError("Something went wrong booking that slot. Please try again.");
          }
        });
      });
    }

    function renderSlotsView(slots) {
      if (!slots || slots.length === 0) {
        document.getElementById("content").innerHTML = `
          <div class="empty">
            <p>No times available in the next 2 weeks.</p>
            <p style="margin-top:12px;font-size:13px;">Please call us at <a href="tel:6292607111" style="color:#0077cc;">629-260-7111</a> to schedule.</p>
          </div>`;
        return;
      }

      const groupedAll = groupSlotsByDate(slots);
      const initial = groupedAll.slice(0, DEFAULT_DAYS_VISIBLE);
      const rest = groupedAll.slice(DEFAULT_DAYS_VISIBLE);

      const fullAddress = `${currentAddress.street}, ${currentAddress.city}, ${currentAddress.state} ${currentAddress.zip}`;
      const addressBar = `
        <div class="address-summary">
          <span>📍 ${fullAddress}</span>
          <a class="edit-link" id="editAddrLink">Edit</a>
        </div>`;

      const intro = `
        <div class="intro">
          Great! Pick a time that works for you:
        </div>`;

      const initialHtml = initial.map(g => renderDayGroup(g)).join("");
      const showMoreBtn = rest.length > 0
        ? `<button class="show-more" id="showMoreBtn">+ Show more days (${rest.length} more)</button>`
        : "";

      document.getElementById("content").innerHTML = addressBar + intro + initialHtml + showMoreBtn;

      document.getElementById("editAddrLink").addEventListener("click", () => {
        renderAddressForm();
      });

      attachSlotHandlers();

      if (rest.length > 0) {
        document.getElementById("showMoreBtn").addEventListener("click", () => {
          const restHtml = rest.map(g => renderDayGroup(g)).join("");
          document.getElementById("showMoreBtn").outerHTML = restHtml;
          attachSlotHandlers();
        });
      }
    }

    async function init() {
      const job = await loadJob();
      if (!job) return;
      currentJob = job;

      if (job.scheduling_status === "booked" && job.scheduled_start) {
        const dateObj = new Date(job.scheduled_start);
        const dateStr = dateObj.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
        document.getElementById("content").innerHTML = `
          <div class="success">
            <div class="check">✅</div>
            <h2>Already Scheduled</h2>
            <p>Your appointment is confirmed for <strong>${dateStr}</strong>.</p>
            <p class="footer-note" style="margin-top:20px;">
              Need to make a change? Call us at <a href="tel:6292607111" style="color:#0077cc;">629-260-7111</a>.
            </p>
          </div>`;
        return;
      }

      currentZip = getUrlZip() || job.zip || job.zip_code || "";
      currentName = getUrlName() || "";

      // Pre-fill any existing address from job record (in case they came back)
      currentAddress = {
        street: job.service_address || "",
        city: job.service_city || "",
        state: job.service_state || "TN",
        zip: job.service_zip || currentZip || ""
      };

      renderAddressForm();
    }

    init();
  </script>
<script defer src="/ant-valuebar.js"></script>
