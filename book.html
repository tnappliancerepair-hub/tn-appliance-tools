<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TN Appliance — Schedule Your Appointment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    .header {
      background: #1a1a2e;
      color: white;
      padding: 24px 20px;
      border-radius: 16px 16px 0 0;
      text-align: center;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 14px;
      opacity: 0.8;
    }
    .card {
      background: white;
      padding: 24px 20px;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .loading, .error, .empty {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    .error { color: #cc0000; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #eee;
      border-top-color: #0077cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .intro {
      font-size: 15px;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .intro strong { color: #1a1a2e; }
    .slot-btn {
      display: block;
      width: 100%;
      padding: 18px 16px;
      margin-bottom: 12px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }
    .slot-btn:hover {
      border-color: #0077cc;
      background: #f0f7ff;
    }
    .slot-btn:active {
      transform: scale(0.98);
    }
    .slot-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .slot-day {
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .slot-date {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }
    .slot-window {
      font-size: 18px;
      font-weight: 600;
      color: #0077cc;
    }
    .success {
      text-align: center;
      padding: 20px 0;
    }
    .check {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .success h2 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 10px;
    }
    .success-details {
      background: #f0f7ff;
      border: 1px solid #cce5ff;
      border-radius: 12px;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
    }
    .success-details div {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .success-details div:last-child { margin-bottom: 0; }
    .success-details strong { color: #1a1a2e; }
    .footer-note {
      font-size: 13px;
      color: #666;
      margin-top: 16px;
      line-height: 1.5;
    }
    .help {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
    .help a {
      color: #0077cc;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔧 TN Appliance Exchange</h1>
      <p>Pick your appointment time</p>
    </div>
    <div class="card" id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading available times...</p>
      </div>
    </div>
    <div class="help">
      Questions? Call <a href="tel:6292607111">629-260-7111</a>
    </div>
  </div>

  <script>
    const XANO_BASE = "https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA";

    function getJobId() {
      const p = new URLSearchParams(window.location.search);
      return p.get("job_id") || p.get("job") || "";
    }

    function showError(msg) {
      document.getElementById("content").innerHTML = `
        <div class="error">
          <p>${msg}</p>
          <p style="margin-top:12px;font-size:13px;">Please call us at <a href="tel:6292607111" style="color:#0077cc;">629-260-7111</a> to schedule.</p>
        </div>`;
    }

    function rawWindowFromDisplay(display) {
      const parts = display.split("-").map(s => s.trim().toLowerCase());
      function hr(s) {
        return parseInt(s.replace(/[^0-9]/g, ""), 10);
      }
      return `${hr(parts[0])}-${hr(parts[1])}`;
    }

    async function loadJob() {
      const jobId = getJobId();
      if (!jobId) {
        showError("No job ID found. Please use the link we sent you via text.");
        return null;
      }

      try {
        const res = await fetch(`/.netlify/functions/get-job-proxy?job_id=${jobId}`);
        if (!res.ok) throw new Error("Job not found");
        const job = await res.json();
        return job;
      } catch (e) {
        showError("We couldn't find your appointment.");
        return null;
      }
    }

    async function loadSlots(zipCode) {
      try {
        const res = await fetch(`${XANO_BASE}/get_available_slots?zip_code=${encodeURIComponent(zipCode)}&days_ahead=14`);
        if (!res.ok) throw new Error("Could not load slots");
        const data = await res.json();
        return data;
      } catch (e) {
        showError("We couldn't load available times right now.");
        return null;
      }
    }

    async function bookSlot(jobId, date, displayWindow) {
      const raw = rawWindowFromDisplay(displayWindow);
      const startPart = displayWindow.split("-")[0].trim().toLowerCase();
      const isPM = startPart.includes("pm");
      let startH = parseInt(startPart.replace(/[^0-9]/g, ""), 10);
      if (isPM && startH !== 12) startH += 12;
      if (!isPM && startH === 12) startH = 0;
      const preferredTime = `${String(startH).padStart(2, "0")}:00:00`;

      try {
        const res = await fetch(`${XANO_BASE}/book_appointment`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            job_id: parseInt(jobId),
            preferred_date: date,
            preferred_time: preferredTime,
            service_eta_window: raw,
            notes: `Customer self-scheduled via web portal`
          })
        });
        if (!res.ok) throw new Error("Booking failed");
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function showSuccess(displayWindow, date, day, customerName) {
      const dateObj = new Date(date + "T12:00:00");
      const dateFormatted = dateObj.toLocaleDateString("en-US", {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });
      document.getElementById("content").innerHTML = `
        <div class="success">
          <div class="check">✅</div>
          <h2>You're Scheduled!</h2>
          <p>Thanks${customerName ? " " + customerName : ""}, your appointment is confirmed.</p>
          <div class="success-details">
            <div><strong>Date:</strong> ${dateFormatted}</div>
            <div><strong>Arrival Window:</strong> ${displayWindow}</div>
          </div>
          <p class="footer-note">
            Your technician will text you when they're on their way.<br>
            We'll also send you a reminder 2 days before your appointment.
          </p>
        </div>`;
    }

    function renderSlots(job, slots, customerName) {
      if (!slots || slots.length === 0) {
        document.getElementById("content").innerHTML = `
          <div class="empty">
            <p>No times available in the next 2 weeks.</p>
            <p style="margin-top:12px;font-size:13px;">Please call us at <a href="tel:6292607111" style="color:#0077cc;">629-260-7111</a> to schedule.</p>
          </div>`;
        return;
      }

      const intro = `
        <div class="intro">
          Hi${customerName ? " " + customerName : ""}! Your waiver is signed and we're ready to schedule your <strong>${job.appliance_type || "appliance"}</strong> repair. Pick a time that works:
        </div>`;

      const buttons = slots.map((slot, idx) => {
        const dateObj = new Date(slot.date + "T12:00:00");
        const monthDay = dateObj.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        return `
          <button class="slot-btn" data-idx="${idx}">
            <div class="slot-day">${slot.day}</div>
            <div class="slot-date">${monthDay}</div>
            <div class="slot-window">${slot.window}</div>
          </button>`;
      }).join("");

      document.getElementById("content").innerHTML = intro + buttons;

      document.querySelectorAll(".slot-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const idx = parseInt(btn.dataset.idx);
          const slot = slots[idx];
          document.querySelectorAll(".slot-btn").forEach(b => b.disabled = true);
          btn.innerHTML = `<div style="text-align:center;color:#0077cc;">Booking...</div>`;

          const result = await bookSlot(job.id, slot.date, slot.window);
          if (result) {
            showSuccess(slot.window, slot.date, slot.day, customerName);
          } else {
            showError("Something went wrong booking that slot. Please try again.");
          }
        });
      });
    }

    async function init() {
      const job = await loadJob();
      if (!job) return;

      const zip = job.zip || job.zip_code || "";
      if (!zip) {
        showError("We're missing your zip code. Please call us to schedule.");
        return;
      }

      if (job.scheduling_status === "booked" && job.scheduled_start) {
        const dateObj = new Date(job.scheduled_start);
        const dateStr = dateObj.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
        document.getElementById("content").innerHTML = `
          <div class="success">
            <div class="check">✅</div>
            <h2>Already Scheduled</h2>
            <p>Your appointment is confirmed for <strong>${dateStr}</strong>.</p>
            <p class="footer-note" style="margin-top:20px;">
              Need to make a change? Call us at <a href="tel:6292607111" style="color:#0077cc;">629-260-7111</a>.
            </p>
          </div>`;
        return;
      }

      const slotsData = await loadSlots(zip);
      if (!slotsData) return;

      const customerName = job.first_name || "";
      renderSlots(job, slotsData.available_slots, customerName);
    }

    init();
  </script>
</body>
</html>
