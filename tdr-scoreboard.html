<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>TDR Scoreboard — Ant</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--bg:#0f1420;--card:#171e2b;--line:#28303e;--ink:#e7edf5;--dim:#8a96a8;--ok:#2fbd77;--warn:#e8a317;--red:#e0524a;--blue:#4d8bff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;padding-bottom:50px}
  .top{position:sticky;top:0;z-index:5;background:#0f1420e6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
  .top h1{font-size:20px;font-weight:900;display:flex;align-items:center;gap:9px}
  .sub{color:var(--dim);font-size:12.5px;margin-top:3px}
  .wrap{max-width:640px;margin:0 auto;padding:14px 16px}
  .team{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .team .big{font-size:34px;font-weight:900;line-height:1}
  .team .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:11px;border-left:4px solid var(--line)}
  .row.ok{border-left-color:var(--ok)} .row.warn{border-left-color:var(--warn)} .row.bad{border-left-color:var(--red)}
  .rhead{display:flex;align-items:center;gap:10px}
  .name{font-size:17px;font-weight:800;flex:1}
  .score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .pct{font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px}
  .pct.ok{background:#12351f;color:#6fe0a0} .pct.warn{background:#3a2e12;color:#f2c662} .pct.bad{background:#3a1d1b;color:#ff8a82}
  .bar{height:8px;background:#0e131c;border-radius:5px;margin-top:10px;overflow:hidden}
  .bar > span{display:block;height:100%;border-radius:5px}
  .unfiled{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;font-weight:700;color:#ffb4ad;background:#2a1614;border:1px solid #4a2621;border-radius:8px;padding:4px 9px;text-decoration:none}
  .allgood{font-size:12.5px;color:#6fe0a0;margin-top:9px;font-weight:700}
  .empty{color:var(--dim);text-align:center;padding:40px 10px}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:16px;line-height:1.5}
  a.back{color:#7db4ff;text-decoration:none;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="top">
  <h1>📋 TDR Scoreboard</h1>
  <div class="sub" id="sub">Today · every stop needs a filed report</div>
</div>
<div class="wrap"><div id="list"><div class="empty">Loading…</div></div></div>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tier(pct,stops){ if(!stops) return 'ok'; if(pct>=100) return 'ok'; if(pct>=50) return 'warn'; return 'bad'; }
function barColor(t){ return t==='ok'?'#2fbd77':t==='warn'?'#e8a317':'#e0524a'; }

async function load(){
  let d;
  try{ d=await fetch('/.netlify/functions/tdr-compliance?scope=today',{cache:'no-store'}).then(r=>r.json()); }
  catch(_){ document.getElementById('list').innerHTML='<div class="empty">Could not load — try again.</div>'; return; }
  if(!d||!d.ok){ document.getElementById('list').innerHTML='<div class="empty">Could not load — try again.</div>'; return; }
  const techs=(d.techs||[]).filter(t=>t.stops>0);
  const totStops=techs.reduce((s,t)=>s+t.stops,0), totFiled=techs.reduce((s,t)=>s+t.filed,0);
  const teamPct=totStops?Math.round(totFiled/totStops*100):100;
  document.getElementById('sub').textContent=(d.date_ct||'today')+' · '+totFiled+'/'+totStops+' stops documented';
  if(!totStops){ document.getElementById('list').innerHTML='<div class="empty">No stops on the board today yet.</div>'; return; }
  const team='<div class="team"><div><div class="big" style="color:'+barColor(tier(teamPct,totStops))+'">'+teamPct+'%</div></div>'
    +'<div style="flex:1"><div class="k">Team — filed today</div><div style="font-size:14px;color:var(--dim);margin-top:2px">'+totFiled+' of '+totStops+' stops documented</div></div></div>';
  const rows=techs.map(t=>{
    const tr=tier(t.pct,t.stops);
    const unfiled=(t.unfiled||[]).length
      ? '<div class="unfiled">'+t.unfiled.map(u=>'<a class="chip" href="office-board.html?job='+u.job_id+'">#'+u.job_id+(u.customer?(' · '+esc(String(u.customer).split(' ')[0])):'')+'</a>').join('')+'</div>'
      : '<div class="allgood">✓ every stop filed</div>';
    return '<div class="row '+tr+'">'
      +'<div class="rhead"><div class="name">'+esc(t.name)+'</div>'
        +'<div class="score">'+t.filed+'<span style="color:var(--dim);font-weight:700">/'+t.stops+'</span></div>'
        +'<span class="pct '+tr+'">'+t.pct+'%</span></div>'
      +'<div class="bar"><span style="width:'+t.pct+'%;background:'+barColor(tr)+'"></span></div>'
      +unfiled+'</div>';
  }).join('');
  document.getElementById('list').innerHTML=team+rows
    +'<div class="foot">The TDR is the claim — we can\'t bill the warranty company until it\'s filed, and nobody gets paid until we do. Tap an open job to work it.<br><a class="back" href="office-board.html">← Board</a></div>';
}
load();
setInterval(load,60000);
</script>
</body>
</html>
