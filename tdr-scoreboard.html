<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>TDR Scoreboard — Ant</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--bg:#0f1420;--card:#171e2b;--line:#28303e;--ink:#e7edf5;--dim:#8a96a8;--ok:#2fbd77;--warn:#e8a317;--red:#e0524a;--blue:#4d8bff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;padding-bottom:50px}
  .top{position:sticky;top:0;z-index:5;background:#0f1420e6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
  .top h1{font-size:20px;font-weight:900;display:flex;align-items:center;gap:9px}
  .sub{color:var(--dim);font-size:12.5px;margin-top:3px}
  .wrap{max-width:640px;margin:0 auto;padding:14px 16px}
  .team{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .team .big{font-size:34px;font-weight:900;line-height:1}
  .team .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:11px;border-left:4px solid var(--line)}
  .row.ok{border-left-color:var(--ok)} .row.warn{border-left-color:var(--warn)} .row.bad{border-left-color:var(--red)}
  .rhead{display:flex;align-items:center;gap:10px}
  .name{font-size:17px;font-weight:800;flex:1}
  .score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .pct{font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px}
  .pct.ok{background:#12351f;color:#6fe0a0} .pct.warn{background:#3a2e12;color:#f2c662} .pct.bad{background:#3a1d1b;color:#ff8a82}
  .bar{height:8px;background:#0e131c;border-radius:5px;margin-top:10px;overflow:hidden}
  .bar > span{display:block;height:100%;border-radius:5px}
  .unfiled{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;font-weight:700;color:#ffb4ad;background:#2a1614;border:1px solid #4a2621;border-radius:8px;padding:4px 9px;text-decoration:none}
  .allgood{font-size:12.5px;color:#6fe0a0;margin-top:9px;font-weight:700}
  .empty{color:var(--dim);text-align:center;padding:40px 10px}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:16px;line-height:1.5}
  a.back{color:#7db4ff;text-decoration:none;font-size:13px;font-weight:700}
</style>
<script src="/meta-pixel.js"></script>
</head>
<body>
<div class="top">
  <h1>📋 TDR Scoreboard</h1>
  <div class="sub" id="sub">Today · every stop needs a filed report</div>
</div>
<div class="wrap"><div id="list"><div class="empty">Loading…</div></div></div>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tier(pct,stops){ if(!stops) return 'ok'; if(pct>=100) return 'ok'; if(pct>=50) return 'warn'; return 'bad'; }
function barColor(t){ return t==='ok'?'#2fbd77':t==='warn'?'#e8a317':'#e0524a'; }

// 🎯 The honest Part Showdown board — reads game-truth (reality-settled).
function buildTruthBoard(g){
  if(!g||!g.ok) return '';
  const medal=i=>['🥇','🥈','🥉'][i]||('#'+(i+1));
  const ant=g.ant||{};
  const players=(g.players||[]);
  const anyRounds=players.some(p=>p.rounds>0)||(g.rivalries||[]).length;
  let html='<div style="margin-top:16px;margin-bottom:4px;font-size:13px;font-weight:800;color:#7db4ff;text-transform:uppercase;letter-spacing:.05em">🎯 Part Showdown · Danielle vs the crew vs Ant</div>';
  // Ant climb line — the number the humans race + the moat getting smarter.
  const antTxt = ant.accuracy_pct!=null
    ? '🐜 Ant Brain: <span style="color:#7db4ff">'+ant.accuracy_pct+'%</span> first-guess'
      +(ant.climbing?' <span style="color:#2fbd77;font-weight:800">↑ climbing</span>':'')
      +' <span style="font-size:12px;color:var(--dim);font-weight:600">— beat it</span>'
    : '🐜 Ant Brain: <span style="color:var(--dim)">learning — no graded rounds yet</span>';
  html+='<div class="row" style="border-left-color:#4d8bff;padding:11px 14px"><div style="font-size:14px;font-weight:800">'+antTxt+'</div>'
    +(ant.remembered?'<div style="font-size:12px;color:#9fe0bd;margin-top:4px;font-weight:700">🧠 remembers '+ant.remembered+' part'+(ant.remembered===1?'':'s')+' you taught it — it won\'t miss those again</div>':'')
    +'</div>';
  if(!anyRounds){
    html+='<div class="row" style="border-left-color:#4d8bff"><div style="font-size:13px;color:var(--dim);font-weight:700">Clean slate — first part called this week is up for grabs. Ant guesses, Danielle calls it from the office, the tech settles it in the field.</div></div>';
    return html;
  }
  // Leaderboard — sorted by LOCKED (reality-confirmed) points.
  const ranked=players.filter(p=>p.rounds>0||p.total>0);
  html+='<div class="row" style="border-left-color:#4d8bff">'
    +ranked.map((t,i)=>{
      const extras=[];
      if(t.streak>=2) extras.push('<span style="color:#ffb454">🔥'+t.streak+'</span>');
      if(t.role==='office'&&t.correct) extras.push('🎯 '+t.correct);
      else if(t.beats) extras.push('beat Ant '+t.beats+'×');
      if(t.pioneers) extras.push('🧭 '+t.pioneers+' taught');
      if(t.busted) extras.push('<span style="color:#ff8a82">⚠'+t.busted+'</span>');
      const pend=t.pending?' <span style="font-size:11px;color:var(--dim);font-weight:700">+'+t.pending+' pending</span>':'';
      return '<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)"><span style="font-size:16px;width:26px">'+medal(i)+'</span>'
        +'<span style="flex:1;font-weight:700">'+esc(t.name)+(t.role==='office'?' <span style="font-size:10px;color:#7db4ff">🧑‍💼 office</span>':'')+'</span>'
        +(extras.length?'<span style="font-size:11px;color:#ffb454;font-weight:700;margin-right:8px">'+extras.join(' · ')+'</span>':'')
        +'<span style="font-weight:900;font-variant-numeric:tabular-nums">'+t.locked+' pts'+pend+'</span></div>';
    }).join('')
    +'</div>';
  // Rivalries — Danielle vs each tech, head-to-head on the same part.
  const rv=(g.rivalries||[]).filter(r=>r.agreed+r.disputes>0);
  if(rv.length){
    html+='<div style="margin-top:12px;margin-bottom:4px;font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.05em">🥊 Danielle vs the crew — the part</div>'
      +'<div class="row" style="border-left-color:#e8a317">'
      +rv.map(r=>{
        const rec=r.disputes?(' → '+(r.tech_wins>=r.dani_wins?esc(r.name)+' '+r.tech_wins+'-'+r.dani_wins:'Danielle '+r.dani_wins+'-'+r.tech_wins)):'';
        return '<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)"><span style="flex:1;font-weight:700">Danielle vs '+esc(r.name)+'</span>'
          +'<span style="font-size:12px;color:var(--dim);font-weight:700">agreed '+r.agreed+' · '+r.disputes+' dispute'+(r.disputes===1?'':'s')+'<span style="color:#ffb454">'+rec+'</span></span></div>';
      }).join('')
      +'</div>';
  }
  // The ones that fooled us — misses + busts, real part revealed.
  const f=(g.fooled_us||[]);
  if(f.length){
    html+='<div style="margin-top:12px;margin-bottom:4px;font-size:12px;font-weight:800;color:#ff8a82;text-transform:uppercase;letter-spacing:.05em">🕳️ The ones that fooled us</div>'
      +'<div class="row" style="border-left-color:#e0524a">'
      +f.slice(0,6).map(x=>{
        const tag=x.status==='busted'?'⤴ callback':(x.who==='ant'?'🐜 whiffed':'');
        const real=x.real_part?('real: <span style="font-family:monospace;color:#fff">'+esc(x.real_part)+'</span>'):'';
        const guess=x.ant_part?('Ant said '+esc(x.ant_part)):'';
        return '<div style="padding:7px 0;border-top:1px solid var(--line);font-size:12.5px"><b>#'+x.job_id+'</b>'+(x.customer?' · '+esc(String(x.customer).split(' ')[0]):'')+' <span style="color:#ff8a82;font-weight:700">'+tag+'</span><div style="color:var(--dim);margin-top:2px">'+[guess,real].filter(Boolean).join(' · ')+'</div></div>';
      }).join('')
      +'</div>';
  }
  // Integrity — the game policing itself.
  const it=g.integrity||{};
  if(it.rubber_stamps||it.ungraded_danielle||it.busted){
    const bits=[];
    if(it.rubber_stamps) bits.push(it.rubber_stamps+' rubber-stamp'+(it.rubber_stamps===1?'':'s')+' caught');
    if(it.busted) bits.push(it.busted+' bounced');
    if(it.ungraded_danielle) bits.push(it.ungraded_danielle+' of Danielle\'s calls ungraded');
    html+='<div class="row" style="border-left-color:#8a93aa;padding:10px 14px"><div style="font-size:12px;color:var(--dim);font-weight:700">🕵️ Integrity: '+bits.join(' · ')+'</div></div>';
  }
  return html;
}

async function load(){
  let d, game=null;
  try{
    [d,game]=await Promise.all([
      fetch('/.netlify/functions/tdr-compliance?scope=today',{cache:'no-store'}).then(r=>r.json()),
      fetch('/.netlify/functions/game-truth?scope=week',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    ]);
  }
  catch(_){ document.getElementById('list').innerHTML='<div class="empty">Could not load — try again.</div>'; return; }
  if(!d||!d.ok){ document.getElementById('list').innerHTML='<div class="empty">Could not load — try again.</div>'; return; }
  const techs=(d.techs||[]).filter(t=>t.stops>0);
  const totStops=techs.reduce((s,t)=>s+t.stops,0), totFiled=techs.reduce((s,t)=>s+t.filed,0);
  const teamPct=totStops?Math.round(totFiled/totStops*100):100;
  document.getElementById('sub').textContent=(d.date_ct||'today')+' · '+totFiled+'/'+totStops+' stops documented';
  if(!totStops){ document.getElementById('list').innerHTML='<div class="empty">No stops on the board today yet.</div>'; return; }
  const team='<div class="team"><div><div class="big" style="color:'+barColor(tier(teamPct,totStops))+'">'+teamPct+'%</div></div>'
    +'<div style="flex:1"><div class="k">Team — filed today</div><div style="font-size:14px;color:var(--dim);margin-top:2px">'+totFiled+' of '+totStops+' stops documented</div></div></div>';
  const rows=techs.map(t=>{
    const tr=tier(t.pct,t.stops);
    const unfiled=(t.unfiled||[]).length
      ? '<div class="unfiled">'+t.unfiled.map(u=>'<a class="chip" href="office-board.html?job='+u.job_id+'">#'+u.job_id+(u.customer?(' · '+esc(String(u.customer).split(' ')[0])):'')+'</a>').join('')+'</div>'
      : '<div class="allgood">✓ every stop filed</div>';
    return '<div class="row '+tr+'">'
      +'<div class="rhead"><div class="name">'+esc(t.name)+'</div>'
        +'<div class="score">'+t.filed+'<span style="color:var(--dim);font-weight:700">/'+t.stops+'</span></div>'
        +'<span class="pct '+tr+'">'+t.pct+'%</span></div>'
      +'<div class="bar"><span style="width:'+t.pct+'%;background:'+barColor(tr)+'"></span></div>'
      +unfiled+'</div>';
  }).join('');
  // 🏆 Weekly leaderboards — most reports completed + best completion rate.
  const wb=(d.week_board||[]).filter(t=>t.stops>0||t.completions>0);
  let boards='';
  if(wb.length){
    const medal=i=>['🥇','🥈','🥉'][i]||('#'+(i+1));
    const byCount=wb.slice().sort((a,b)=>b.completions-a.completions);
    const byRate=wb.slice().sort((a,b)=>b.pct-a.pct||b.completions-a.completions);
    const lb=(title,arr,val)=>'<div class="row" style="border-left-color:#e8a317"><div class="rhead"><div class="name" style="font-size:14px">'+title+'</div></div>'
      +arr.map((t,i)=>'<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)"><span style="font-size:16px;width:26px">'+medal(i)+'</span><span style="flex:1;font-weight:700">'+esc(t.name)+'</span><span style="font-weight:900;font-variant-numeric:tabular-nums">'+val(t)+'</span></div>').join('')+'</div>';
    boards='<div style="margin-top:6px;margin-bottom:4px;font-size:13px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.05em">🏆 This week</div>'
      +lb('Most reports completed',byCount,t=>t.completions)
      +lb('Best completion rate',byRate,t=>t.pct+'%');
  }
  // 🎯 Part Showdown — the HONEST board (game-truth): reality-settled points,
  // Ant's climbing accuracy, rivalries, the ones that fooled us, integrity.
  const gameBoard = buildTruthBoard(game);
  document.getElementById('list').innerHTML=team+rows+boards+gameBoard
    +'<div class="foot">The TDR is the claim — we can\'t bill the warranty company until it\'s filed, and nobody gets paid until we do. Tap an open job to work it.<br><a class="back" href="office-board.html">← Board</a></div>';
}
load();
setInterval(load,60000);
</script>
</body>
</html>
