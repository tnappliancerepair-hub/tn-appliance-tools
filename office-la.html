<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA Office - TN Appliance Exchange</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1118;
    color: #e8edf5;
  }

  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: linear-gradient(135deg, #0e1118, #131a2a);
    border-bottom: 1px solid #2a3040;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .icon { font-size: 24px; flex-shrink: 0; }
  .header .text { flex: 1; min-width: 0; }
  .header .title { font-size: 14px; font-weight: 700; }
  .header .sub {
    font-size: 11px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header .refresh-btn {
    background: transparent;
    border: 1px solid #2a3040;
    color: #e8edf5;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
    font-family: inherit;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .header .refresh-btn:active { transform: scale(0.9); }
  .header .refresh-btn:hover:not(:disabled) { background: #2a3040; border-color: #4a9eff; }
  .header .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .header .refresh-btn.spinning { animation: spin 0.7s linear infinite; }

  .content {
    margin-top: 60px;
    overflow-y: auto;
    padding: 10px;
    min-height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Folder (top-level section) */
  .folder {
    background: #131720;
    border: 1px solid #2a3040;
    border-radius: 10px;
    overflow: hidden;
  }
  .folder-header {
    width: 100%;
    background: transparent;
    border: 0;
    color: #e8edf5;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    -webkit-appearance: none;
  }
  .folder-header:hover { background: rgba(74,158,255,0.05); }
  .folder-header:active { background: rgba(74,158,255,0.1); }
  .folder-name { flex: 1; }
  .folder-count {
    font-size: 12px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }
  .chevron {
    display: inline-block;
    transition: transform 0.2s;
    color: #8a93aa;
    font-size: 11px;
    width: 10px;
  }
  .folder.open > .folder-header > .chevron { transform: rotate(90deg); }
  .folder-body { display: none; padding: 0 10px 10px 10px; }
  .folder.open > .folder-body { display: flex; flex-direction: column; gap: 6px; }

  /* Subsection */
  .sub {
    background: #1e2433;
    border: 1px solid #2a3040;
    border-radius: 8px;
    overflow: hidden;
  }
  .sub-header {
    width: 100%;
    background: transparent;
    border: 0;
    color: #e8edf5;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    -webkit-appearance: none;
  }
  .sub-header:hover { background: rgba(74,158,255,0.05); }
  .sub-name { flex: 1; }
  .sub-count {
    font-size: 11px;
    color: #8a93aa;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }
  .sub.open > .sub-header > .chevron { transform: rotate(90deg); }
  .sub-body { display: none; padding: 0 10px 10px 10px; }
  .sub.open > .sub-body { display: flex; flex-direction: column; gap: 6px; }

  .sub-loading, .sub-empty, .sub-error {
    padding: 12px;
    text-align: center;
    color: #8a93aa;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .sub-error { color: #ff4757; }

  /* Job card */
  .job-card {
    background: #0e1118;
    border: 1px solid #2a3040;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
  }
  .job-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .job-id {
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    color: #e8edf5;
    font-size: 12px;
  }
  .job-age {
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    margin-left: auto;
  }
  .job-age.neutral { background: rgba(138,147,170,0.15); color: #8a93aa; border: 1px solid rgba(138,147,170,0.3); }
  .job-age.aged    { background: rgba(255,71,87,0.15);   color: #ff4757; border: 1px solid rgba(255,71,87,0.3); }
  .job-earnings {
    font-weight: 700;
    color: #00d68f;
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
  }
  .job-customer { font-weight: 600; color: #e8edf5; margin-bottom: 2px; font-size: 13px; }
  .job-meta { color: #8a93aa; margin-bottom: 2px; }
  .job-meta-small { color: #5a6480; font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
  .job-problem {
    color: #8a93aa;
    font-size: 11px;
    background: #131720;
    border: 1px solid #2a3040;
    border-radius: 6px;
    padding: 6px 8px;

  }
  .job-actions {

    align-items: stretch;

  .stage-select {

    border: 1px solid #2a3040;
    color: #e8edf5;

    border-radius: 6px;

    font-family: inherit;

    -webkit-appearance: none;

  .open-btn {
    background: linear-gradient(135deg, #4a9eff, #3a8eef);
    color: white;
    border: 1px solid #4a9eff;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-decoration: none;
    display: flex;
    align-items: center;
    white-space: nowrap;
    min-height: 32px;

  .open-btn:active { transform: scale(0.97); }
  .job-feedback {
    margin-top: 6px;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;

  /* Auth */

// Office password verify — was missing, causing infinite spinner.
async function __verifyOfficePassword(pw) {
  if (!pw) return false;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(XANO_BASE_AUTH + '/verify_office_password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw}),
      signal: ctrl.signal
    });
    clearTimeout(t);
    if (!r.ok) throw new Error('server ' + r.status);
    const d = await r.json();
    return d && d.success === true;
  } catch (e) {
    clearTimeout(t);
    if (e && e.name === 'AbortError') throw new Error('timeout');
    throw e;
  }
}

// ── Folder open/closed state ───────────────────────────────────────
function loadFolderState() {
  try {
    return JSON.parse(localStorage.getItem(FOLDER_STATE_KEY) || '{}');
  } catch (e) { return {}; }
}
function saveFolderState(state) {
  try { localStorage.setItem(FOLDER_STATE_KEY, JSON.stringify(state)); } catch (e) {}
}
function isOpen(id, defaultVal) {
  const s = loadFolderState();
  if (id in s) return s[id];
  return !!defaultVal;
}
function setOpen(id, val) {
  const s = loadFolderState();
  s[id] = val;
  saveFolderState(s);
}

function toggleFolder(id) {
  const el = document.querySelector(`.folder[data-folder="${id}"]`);
  if (!el) return;
  const nowOpen = !el.classList.contains('open');
  el.classList.toggle('open', nowOpen);
  setOpen(id, nowOpen);
}
function toggleSub(id) {
  const el = document.querySelector(`.sub[data-sub="${id}"]`);
  if (!el) return;
  const nowOpen = !el.classList.contains('open');
  el.classList.toggle('open', nowOpen);
  setOpen(id, nowOpen);
}

// ── Render skeleton ────────────────────────────────────────────────
function renderSkeleton() {
  const content = document.getElementById('content');
  content.innerHTML = SECTIONS.map(f => {

    return `

          <span class="folder-count" id="count-${f.id}">—</span>
        </button>
        <div class="folder-body">
          ${f.subs.map(s => `
            <div class="sub ${isOpen(s.id, false) ? 'open' : ''}" data-sub="${s.id}">
              <button class="sub-header" onclick="toggleSub('${s.id}')">
                <span class="chevron">▶</span>
                <span class="sub-name">${escapeHtml(s.name)}</span>
                <span class="sub-count" id="count-${s.id}">—</span>
              </button>
              <div class="sub-body" id="body-${s.id}">
                <div class="sub-loading">loading...</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// ── Data loading ───────────────────────────────────────────────────
let isLoading = false;

async function fetchProxy(endpoint, payload) {
  const res = await fetch('/.netlify/functions/xano-proxy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ endpoint, payload, method: 'POST' })
  });
  if (!res.ok) throw new Error(`(${res.status})`);
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'no success flag');
  return data;
}

// LA region: service_state contains "LA" or "Louisiana" OR tech.id in [3,5,6].
function isLA(item) {
  const state = String((item.customer && item.customer.state) || '').toLowerCase();
  const techId = item.tech && item.tech.id;
  return state.includes('la') || state.includes('louisiana') || [3, 5, 6].includes(techId);
}

async function loadAll() {
  if (isLoading) return;
  isLoading = true;
  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.disabled = true;
  refreshBtn.classList.add('spinning');

  document.getElementById('header-sub').textContent = 'loading...';

  // Build the full fetch plan.
  const plan = [];
  SECTIONS.forEach(f => {
    if (f.extraFetches) f.extraFetches.forEach(x => plan.push(x));
    f.subs.forEach(s => {
      if (s.endpoint) plan.push({ id: s.id, endpoint: s.endpoint, payload: s.payload });
    });
  });

  // Fire all in parallel.
  const promises = plan.map(p => fetchProxy(p.endpoint, p.payload || {}).then(d => ({ id: p.id, data: d })).catch(e => ({ id: p.id, error: e.message })));
  const results = await Promise.all(promises);

  // Keyed dictionary of results.
  const byId = {};
  results.forEach(r => { byId[r.id] = r; });

  // Build display data per subsection.
  let totalCount = 0;
  SECTIONS.forEach(f => {
    let folderCount = 0;
    f.subs.forEach(s => {
      let items;
      let error = null;

      if (s.merge) {
        const merged = [];
        let anyError = null;
        s.merge.forEach(mid => {
          const r = byId[mid];
          if (r && r.data && Array.isArray(r.data.items)) merged.push(...r.data.items);
          else if (r && r.error) anyError = r.error;
        });
        items = merged;
        error = anyError && merged.length === 0 ? anyError : null;
      } else {
        const r = byId[s.id];
        if (r && r.error) error = r.error;
        else if (r && r.data && Array.isArray(r.data.items)) items = r.data.items;
        else items = [];
      }

      // Per-subsection clientFilter (e.g., office_stage === "report").
      if (items && s.clientFilter) {
        const field = s.clientFilter.field;
        const value = s.clientFilter.value;
        items = items.filter(it => (it.job && it.job[field]) === value);
      }

      // Client-side LA region filter for the Scheduling block.
      if (items && f.tnFilter && !f.isEarnings) {
        items = items.filter(isLA);
      }

      renderSubBody(s, items, error, f.isEarnings);
      const count = items ? items.length : 0;
      document.getElementById(`count-${s.id}`).textContent = error ? '⚠️' : `(${count})`;
      folderCount += count;
    });
    document.getElementById(`count-${f.id}`).textContent = `(${folderCount})`;
    totalCount += folderCount;
  });

  const today = new Date().toLocaleDateString('en-US', {
    timeZone: 'America/Chicago', weekday: 'short', month: 'short', day: 'numeric'
  });
  document.getElementById('header-sub').textContent = `${today} • ${totalCount} ${totalCount === 1 ? 'job' : 'jobs'}`;

  isLoading = false;
  refreshBtn.disabled = false;
  refreshBtn.classList.remove('spinning');
}

function renderSubBody(sub, items, error, isEarnings) {
  const body = document.getElementById(`body-${sub.id}`);
  if (error) {
    body.innerHTML = `<div class="sub-error">⚠️ ${escapeHtml(error)}</div>`;
    return;
  }
  if (!items || items.length === 0) {
    body.innerHTML = `<div class="sub-empty">no jobs in this stage</div>`;
    return;
  }
  body.innerHTML = items.map(it => isEarnings ? buildEarningsCard(it) : buildJobCard(it)).join('');
}

function buildJobCard(it) {
  const job = it.job || {};
  const cust = it.customer || {};
  const days = it.days_since_created || 0;
  const ageClass = days > 7 ? 'aged' : 'neutral';
  const custName = [cust.first_name, cust.last_name].filter(Boolean).join(' ') || cust.name || 'Customer';
  const apl = [job.brand, job.appliance_type].filter(Boolean).join(' ') || 'Appliance';
  const city = cust.city || '';
  const problem = (job.problem_summary || '').slice(0, 60);

  const stageOptions = STAGES.map(s =>
    `<option value="${escapeAttr(s.value)}">${escapeHtml(s.label)}</option>`
  ).join('');

  return `
    <div class="job-card" data-job-id="${job.id}">
      <div class="job-top">
        <div class="job-id">#${escapeHtml(String(job.id || '?'))}</div>
        <div class="job-age ${ageClass}">${days}d</div>
      </div>
      <div class="job-customer">${escapeHtml(custName)}</div>
      <div class="job-meta">${escapeHtml(apl)}${city ? ' • ' + escapeHtml(city) : ''}</div>
      ${problem ? `<div class="job-problem">${escapeHtml(problem)}${(job.problem_summary || '').length > 60 ? '...' : ''}</div>` : ''}
      <div class="job-actions">
        <select class="stage-select" onchange="moveStage(${job.id}, this.value, this)">
          ${stageOptions}
        </select>
        <a class="open-btn" href="job-detail.html?job_id=${job.id}&office=1">📋 Open</a>
      </div>
      <div class="job-feedback" id="feedback-${job.id}"></div>
    </div>
  `;
}

function buildEarningsCard(it) {
  const earning = it.earning || {};
  const job = it.job || {};
  const cust = it.customer || {};
  const commission = earning.commission_earned != null ? earning.commission_earned : 0;
  const apl = [job.brand, job.appliance_type].filter(Boolean).join(' ') || 'Appliance';
  const earnedAt = earning.earned_at ? formatDateCT(earning.earned_at) : '—';

  return `
    <div class="job-card" data-job-id="${job.id}">
      <div class="job-top">
        <div class="job-id">#${escapeHtml(String(job.id || '?'))}</div>
        <div class="job-earnings">$${escapeHtml(String(commission))}</div>
      </div>
      <div class="job-customer">${escapeHtml(cust.name || 'Customer')}${cust.city ? ' • ' + escapeHtml(cust.city) : ''}</div>
      <div class="job-meta">${escapeHtml(apl)}</div>
      <div class="job-meta-small">earned: ${escapeHtml(earnedAt)}</div>
      <div class="job-actions">
        <a class="open-btn" style="flex:1; justify-content:center" href="job-detail.html?job_id=${job.id}&office=1">📋 Open</a>
      </div>
    </div>
  `;
}

async function moveStage(jobId, newStage, selectEl) {
  if (!newStage) return;
  const card = selectEl.closest('.job-card');
  const feedback = card ? card.querySelector('.job-feedback') : null;
  selectEl.disabled = true;

  try {
    const data = await fetchProxy('update_job_office_stage', {
      job_id: parseInt(jobId, 10),
      office_stage: newStage
    });
    const stageLabel = (STAGES.find(s => s.value === newStage) || {}).label || newStage;
    if (feedback) {
      feedback.className = 'job-feedback show success';
      feedback.textContent = '✓ moved to: ' + stageLabel;
      setTimeout(() => { feedback.classList.remove('show'); }, 3000);
    }
  } catch (err) {
    if (feedback) {
      feedback.className = 'job-feedback show error';
      feedback.textContent = '⚠️ move failed: ' + err.message;
    }
    selectEl.value = '';
  } finally {
    selectEl.disabled = false;
  }
}

function formatDateCT(ms) {
  if (!ms) return '—';
  return new Date(ms).toLocaleDateString('en-US', {
    timeZone: 'America/Chicago', month: 'short', day: 'numeric', year: 'numeric'
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/'/g, '%27');
}

// ── Auth ───────────────────────────────────────────────────────────
async function submitAuth() {
  const errEl = document.getElementById('auth-err');
  const btn = document.getElementById('auth-submit');
  const inputEl = document.getElementById('auth-input');
  const pw = (inputEl.value || '').trim();
  errEl.textContent = '';
  if (pw === '') { errEl.textContent = 'Enter password'; return; }
  btn.disabled = true;
  btn.textContent = 'Authenticating…';
  let ok = false;
  try {
    ok = await __verifyOfficePassword(pw);
  } catch (e) {
    errEl.textContent = (e && e.message === 'timeout') ? 'Server timeout — try again, or text Teddy 615-485-5795.' : ('Error: ' + (e && e.message || 'unknown'));
    btn.disabled = false; btn.textContent = 'Unlock';
    return;
  }
  if (!ok) {
    errEl.textContent = 'Wrong password. (Default is "antlives" — text Teddy if that doesn\'t work)';
    inputEl.value = ''; inputEl.focus();
    btn.disabled = false; btn.textContent = 'Unlock';
    return;
  }
  localStorage.setItem(OFFICE_AUTH_KEY, '1');
  document.getElementById('auth-overlay').classList.add('hidden');
  try {
    init();
  } catch (e) {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#fff;background:#0e1118;min-height:100vh"><h2>Logged in ✓ — page failed to load.</h2><p>Reload. If it still fails, text Teddy 615-485-5795 — error: ' + String(e && e.message || 'unknown') + '</p></div>';
  }
}

function init() {
  renderSkeleton();
  loadAll();
}

document.getElementById('auth-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') submitAuth();
});

if (localStorage.getItem(OFFICE_AUTH_KEY) === '1') {
  document.getElementById('auth-overlay').classList.add('hidden');
  init();
} else {
  document.getElementById('auth-input').focus();
}
</script>
