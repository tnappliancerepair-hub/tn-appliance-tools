<body>
<div class="container">
  <a id="back-to-portal" href="#" style="display:inline-flex;align-items:center;gap:6px;color:#4cc9c0;text-decoration:none;font-weight:600;padding:10px 12px;font-size:15px;margin:8px 0">← Back to your portal</a>
  <div class="header">
    <h1 id="page-title">Upload Photos & Videos</h1>
    <p class="subtitle" id="page-subtitle">Helping us diagnose your appliance</p>
  </div>

  <div id="role-banner" class="role-banner" style="display:none;"></div>
  <div id="error-banner" class="error-banner"></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0">
    <button type="button" id="btn-photo" style="padding:18px 12px;border-radius:14px;border:2px solid #4cc9c0;background:linear-gradient(135deg,#4cc9c0,#38a89d);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="font-size:30px">📷</div>
      <div>Take Photo</div>
      <div style="font-size:11px;opacity:0.9;font-weight:500">Model tag works best</div>
    </button>
    <button type="button" id="btn-video" style="padding:18px 12px;border-radius:14px;border:2px solid #ff8c61;background:linear-gradient(135deg,#ff8c61,#ff6b35);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="font-size:30px">🎥</div>
      <div>Record Video</div>
      <div style="font-size:11px;opacity:0.9;font-weight:500">10 seconds max</div>
    </button>
  </div>

  <!-- Photo gallery fallback only — video is RECORDED via CaptureOverlay (10s cap, MP4-friendly).
       No video file uploads allowed (file-size, codec, and bandwidth surprises). -->
  <input type="file" id="file-input" multiple accept="image/*" style="display:none">
  <div style="text-align:center;margin:8px 0">
    <button type="button" onclick="document.getElementById('file-input').click()" style="background:transparent;border:none;color:#888;font-size:13px;text-decoration:underline;cursor:pointer">or pick a photo from gallery</button>
  </div>

  <div class="file-list" id="file-list"></div>

  <div class="actions">
    <button class="btn-primary" id="btn-done" onclick="markDone()" disabled>Done</button>
  </div>

  <div class="summary" id="summary">
    <div class="big" id="summary-count">0</div>
    <div>files uploaded successfully</div>
    <div style="margin-top:10px;font-size:13px;color:#666;" id="summary-msg"></div>
  </div>

  <div class="footer">TN Appliance Exchange • Secure Upload</div>
</div>

<script>
// Configuration
const XANO_BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const NETLIFY_BASE = window.location.origin;

// Read URL params
const params = new URLSearchParams(window.location.search);
const JOB_ID = params.get('job_id');
const ROLE = params.get('role') || 'customer';
const TECH_ID = params.get('tech_id');

// State
const fileQueue = [];
let uploadInProgress = 0;
let successCount = 0;

// Initialize page
function init() {
  // Wire the back link to the customer portal for the same job + last4 param
  // (or to tech-ant-chat for tech-role uploads). Helps older customers
  // who might not realize they can use the browser back button.
  const back = document.getElementById('back-to-portal');
  if (back) {
    const last4 = params.get('last4') || params.get('phone_last4') || '';
    if (ROLE === 'tech') {
      back.href = `/tech-ant-chat.html?job_id=${JOB_ID || ''}${TECH_ID ? '&tech_id=' + TECH_ID : ''}`;
      back.textContent = '← Back to Tech Ant';
    } else if (JOB_ID) {
      back.href = `/customer-portal.html?job_id=${JOB_ID}${last4 ? '&last4=' + last4 : ''}`;
    } else {
      back.style.display = 'none';
    }
  }

  if (!JOB_ID) {
    showError('No job ID provided. Please use the link sent to you via SMS or email.');
    const ph = document.getElementById('btn-photo'); if (ph) ph.disabled = true;
    const vi = document.getElementById('btn-video'); if (vi) vi.disabled = true;
    return;
  }

  if (ROLE === 'tech') {
    document.getElementById('page-title').textContent = `Job #${JOB_ID} — Completion`;
    document.getElementById('page-subtitle').textContent = 'Upload completion photos and videos';
    const banner = document.getElementById('role-banner');
    banner.className = 'role-banner tech';
    banner.style.display = 'block';
    banner.innerHTML = `<strong>👷 Technician Mode</strong> • Job #${JOB_ID}${TECH_ID ? ` • Tech ID ${TECH_ID}` : ''}`;
  } else {
    document.getElementById('page-title').textContent = `Upload Photos & Videos`;
    document.getElementById('page-subtitle').textContent = `Job #${JOB_ID} — helping us diagnose your appliance`;
  }

  setupListeners();
}

function setupListeners() {
  const btnPhoto = document.getElementById('btn-photo');
  const btnVideo = document.getElementById('btn-video');
  const input = document.getElementById('file-input');

  // Use CaptureOverlay (proven 10s video cap, same as tech-ant-chat).
  // Fall back to native file picker if it didn't load.
  if (btnPhoto) {
    btnPhoto.addEventListener('click', () => {
      if (window.CaptureOverlay && typeof window.CaptureOverlay.openPhotoCapture === 'function') {
        window.CaptureOverlay.openPhotoCapture(async (blob, mimeType) => {
          if (!blob) return;
          const file = new File([blob], 'photo-' + Date.now() + '.jpg', { type: mimeType || 'image/jpeg' });
          handleFiles([file]);
        });
      } else {
        input.setAttribute('accept', 'image/*');
        input.setAttribute('capture', 'environment');
        input.click();
      }
    });
  }

  if (btnVideo) {
    btnVideo.addEventListener('click', () => {
      if (window.CaptureOverlay && typeof window.CaptureOverlay.openVideoCapture === 'function') {
        window.CaptureOverlay.openVideoCapture(async (blob, mimeType) => {
          if (!blob) return;
          let ext = 'mp4';
          if (mimeType && mimeType.includes('webm')) ext = 'webm';
          else if (mimeType && mimeType.includes('quicktime')) ext = 'mov';
          const file = new File([blob], 'video-' + Date.now() + '.' + ext, { type: mimeType || 'video/mp4' });
          handleFiles([file]);
        });
      } else {
        // Video MUST come from our 10-sec CaptureOverlay (consistent quality,
        // bounded size). If the overlay didn't load, surface the issue
        // instead of falling through to gallery upload.
        showError("Couldn't open the recorder. Refresh this page on your phone and tap Record Video again — we don't accept video uploaded from your gallery.");
      }
    });
  }

  input.addEventListener('change', (e) => {
    handleFiles(Array.from(e.target.files));
    input.value = '';
  });
  ['dragleave', 'drop'].forEach(ev => {
    zone.addEventListener(ev, (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
    });
  });
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    handleFiles(Array.from(e.dataTransfer.files));
  });
}

function handleFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
      continue;
    }
    // Defense in depth: even if someone drags a video file into the
    // dropzone, refuse it. Only CaptureOverlay-produced videos are
    // accepted, and those land here as File objects from blob — but
    // any user-picked video MIME (the gallery path is now disabled in
    // the file-input accept attr, but drag-drop bypasses that) is rejected.
    if (file.type.startsWith('video/') && file.name && !file.name.startsWith('video-')) {
      showError("Videos must be recorded with the 10-second Record button, not uploaded. Skipping " + file.name + ".");
      continue;
    }
    const item = {
      id: 'f' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      file: file,
      status: 'pending',
      progress: 0,
      attachment_id: null,
      error: null
    };
    fileQueue.push(item);
    renderFile(item);
    uploadFile(item);
  }
}

function renderFile(item) {
  let el = document.getElementById(item.id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'file-item';
    el.id = item.id;
    document.getElementById('file-list').appendChild(el);
  }
  const isVideo = item.file.type.startsWith('video/');
  const sizeMB = (item.file.size / 1048576).toFixed(1);
  const statusLabel = {
    pending: 'Queued',
    uploading: `${item.progress}%`,
    success: '✓ Uploaded',
    error: 'Failed'
  }[item.status];
  el.innerHTML = `
    <div class="icon-box">${isVideo ? '🎥' : '🖼️'}</div>
    <div class="info">
      <div class="name">${escapeHtml(item.file.name)}</div>
      <div class="meta">${sizeMB} MB${item.error ? ' — ' + escapeHtml(item.error) : ''}</div>
      ${item.status === 'uploading' ? `<div class="progress-bar"><div class="progress-fill" style="width:${item.progress}%"></div></div>` : ''}
    </div>
    <div class="status ${item.status}">${statusLabel}</div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

async function uploadFile(item) {
  uploadInProgress++;
  updateButtonState();
  try {
    item.status = 'uploading';
    item.progress = 5;
    renderFile(item);

    // Step 1: Get metadata + S3 key from Xano
    const fileType = item.file.type.startsWith('video/') ? 'video' : 'photo';
    const attachmentType = ROLE === 'tech' ? 'completion' : 'intake';
    const uploadedBy = ROLE === 'tech' ? 'tech' : 'customer';

    const xanoBody = {
      job_id: parseInt(JOB_ID, 10),
      attachment_type: attachmentType,
      file_type: fileType,
      original_filename: (item.file.name && item.file.name.trim()) || (function () {
        // iOS camera captures often have an empty name → s3_key ends "_" with
        // no suffix, S3 PUT silently lost. Fall back to ext-based default
        // so the key always has a real filename.
        const t = (item.file.type || '').toLowerCase();
        const ts = Date.now();
        if (t.startsWith('video/mp4')) return 'video-' + ts + '.mp4';
        if (t.startsWith('video/quicktime')) return 'video-' + ts + '.mov';
        if (t.startsWith('video/')) return 'video-' + ts + '.mp4';
        if (t.startsWith('image/jpeg') || t.startsWith('image/jpg')) return 'photo-' + ts + '.jpg';
        if (t.startsWith('image/heic')) return 'photo-' + ts + '.heic';
        if (t.startsWith('image/png')) return 'photo-' + ts + '.png';
        return 'upload-' + ts;
      })(),
      mime_type: item.file.type || 'application/octet-stream',
      uploaded_by: uploadedBy
    };
    if (TECH_ID && ROLE === 'tech') {
      xanoBody.tech_id = parseInt(TECH_ID, 10);
    }

    const xanoRes = await fetch(`${XANO_BASE}/generate_upload_url`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(xanoBody)
    });
    if (!xanoRes.ok) {
      const errText = await xanoRes.text();
      throw new Error(`Could not start upload (${xanoRes.status}): ${errText.slice(0, 100)}`);
    }
    const xanoData = await xanoRes.json();
    if (!xanoData.success) throw new Error('Xano returned no success');

    item.attachment_id = xanoData.attachment_id;
    item.s3_key = xanoData.s3_key;
    item.progress = 15;
    renderFile(item);

    // Step 2: Get signed URL from Netlify
    const presignRes = await fetch(`${NETLIFY_BASE}/.netlify/functions/s3-presign`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        s3_key: xanoData.s3_key,
        mime_type: item.file.type || 'application/octet-stream'
      })
    });
    if (!presignRes.ok) {
      const errText = await presignRes.text();
      throw new Error(`Could not sign upload (${presignRes.status}): ${errText.slice(0, 100)}`);
    }
    const presignData = await presignRes.json();
    if (!presignData.success) throw new Error('Presign returned no success');

    item.progress = 25;
    renderFile(item);

    // Step 3: Upload directly to S3 with progress tracking
    await uploadToS3(item, presignData.upload_url);

    item.progress = 95;
    renderFile(item);

    // Step 4: Mark complete in Xano
    const saveRes = await fetch(`${XANO_BASE}/save_attachment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        attachment_id: item.attachment_id,
        file_size_bytes: item.file.size
      })
    });
    if (!saveRes.ok) {
      // Upload to S3 worked but DB update failed — still count as success but log
      console.warn('save_attachment failed but file is in S3');
    }

    item.status = 'success';
    item.progress = 100;
    successCount++;
    renderFile(item);

  } catch (err) {
    console.error('Upload error:', err);
    item.status = 'error';
    item.error = err.message || 'Upload failed';
    renderFile(item);
  } finally {
    uploadInProgress--;
    updateButtonState();
    updateSummary();
  }
}

function uploadToS3(item, signedUrl) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.upload.addEventListener('progress', (e) => {
      if (e.lengthComputable) {
        // Map S3 progress (0-100) to overall (25-95)
        const s3Pct = (e.loaded / e.total) * 100;
        item.progress = Math.round(25 + (s3Pct * 0.7));
        renderFile(item);
      }
    });
    xhr.addEventListener('load', () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error(`S3 upload failed (${xhr.status})`));
    });
    xhr.addEventListener('error', () => reject(new Error('Network error during upload')));
    xhr.addEventListener('abort', () => reject(new Error('Upload aborted')));
    xhr.open('PUT', signedUrl);
    xhr.setRequestHeader('Content-Type', item.file.type || 'application/octet-stream');
    xhr.send(item.file);
  });
}

function updateButtonState() {
  const btnDone = document.getElementById('btn-done');
  btnDone.disabled = uploadInProgress > 0 || successCount === 0;
}

function updateSummary() {
  const summary = document.getElementById('summary');
  if (successCount > 0 && uploadInProgress === 0) {
    summary.classList.add('show');
    document.getElementById('summary-count').textContent = successCount;
  }
}

function markDone() {
  const summary = document.getElementById('summary');
  summary.classList.add('show');
  const msg = document.getElementById('summary-msg');
  if (ROLE === 'tech') {
    msg.innerHTML = 'Thank you! Completion photos saved.<br>You can now close this window.';
  } else {
    msg.innerHTML = "Thank you! We'll reach out shortly to schedule your repair.<br>You can now close this window.";
  }
  document.getElementById('btn-done').disabled = true;
  document.getElementById('btn-done').textContent = '✓ Done';
}

function showError(msg) {
  const banner = document.getElementById('error-banner');
  banner.textContent = msg;
  banner.classList.add('show');
}

init();
</script>
<script defer src="/ant-valuebar.js"></script>
  <script src="/ant-track.js" defer></script>
