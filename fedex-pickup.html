<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>FedEx Pickup — TN Appliance</title>
<style>
  :root{--bg:#0f1216;--card:#171b21;--line:#262c35;--ink:#eef2f7;--muted:#93a0b0;--accent:#4d148c;--pop:#ff6200;--go:#2ecc71}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:0 14px 60px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:23px;margin:20px 0 3px}h1 .fx{color:var(--pop)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
  .card h2{font-size:16px;margin:0 0 12px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0e1218;color:var(--ink);font-size:16px}
  .row{display:flex;gap:10px}.row>div{flex:1}
  button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:11px;background:var(--pop);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
  button.ghost{background:#222933;color:var(--ink);border:1px solid var(--line)}
  .out{margin-top:12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .ok{color:var(--go);font-weight:700}.err{color:#ff6b6b;font-weight:700}
  .gate{max-width:360px;margin:80px auto;text-align:center}
  .muted{color:var(--muted);font-size:13px}
  .conf{background:#0e2a16;border:1px solid #1c5c30;border-radius:10px;padding:12px;margin-top:12px;color:#c8f5d4;font-weight:700}
  .banner{background:#2a1400;border:1px solid #6b3a12;border-radius:10px;padding:11px 13px;color:#ffcaa0;font-size:13px;margin:10px 0}
</style></head><body>

<div id="gate" class="gate card">
  <h1>🚚 <span class="fx">FedEx</span> Pickup</h1>
  <p class="muted">Office only.</p>
  <input id="pw" type="password" placeholder="office password" autocomplete="current-password">
  <button onclick="unlock()">Unlock</button>
  <div id="gerr" class="err" style="margin-top:8px"></div>
</div>

<div id="app" class="wrap" style="display:none">
  <h1>🚚 <span class="fx">FedEx</span> Pickup <span id="envbadge" style="font-size:12px;vertical-align:middle;padding:3px 9px;border-radius:999px;font-weight:800;letter-spacing:.03em"></span></h1>
  <p class="sub">Have a driver come grab the returns pile — no drop-off run.</p>
  <div id="cfgbanner"></div>

  <div class="card">
    <h2>📦 Schedule a pickup</h2>
    <label>Pickup date</label>
    <input id="date" type="date">
    <div class="row">
      <div><label># of boxes</label><input id="pkgs" type="number" min="1" value="10"></div>
      <div><label>Total weight (lb)</label><input id="wt" type="number" min="1" value="40"></div>
    </div>
    <div class="row">
      <div><label>Ready by</label><input id="ready" type="time" value="10:00"></div>
      <div><label>Close time</label><input id="close" type="time" value="17:00"></div>
    </div>
    <label>Where are the boxes?</label>
    <select id="loc"><option value="FRONT">Front of building</option><option value="REAR">Rear / dock</option><option value="SIDE">Side door</option><option value="NONE">Not specified</option></select>
    <button class="ghost" onclick="checkAvail()">Check availability first</button>
    <button onclick="schedule()">Schedule pickup</button>
    <div id="pout" class="out"></div>
  </div>

  <div class="card">
    <h2>📍 Track returns</h2>
    <p class="muted">Paste FedEx tracking #s (comma or space separated) to see what's delivered.</p>
    <input id="nums" placeholder="794..., 795...">
    <button class="ghost" onclick="track()">Track</button>
    <div id="tout" class="out"></div>
  </div>
</div>

<script>
const FN='/.netlify/functions';
function pw(){ try{ return localStorage.getItem('ant_office_pw')||''; }catch(_){ return ''; } }
async function verify(p){ try{ const r=await fetch('/.netlify/functions/office-verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})}); const d=await r.json(); return d&&d.success===true; }catch(_){ return false; } }
async function unlock(){ const v=document.getElementById('pw').value.trim(); if(!v)return; document.getElementById('gerr').textContent='Checking…'; if(await verify(v)){ try{localStorage.setItem('ant_office_pw',v);}catch(_){}; show(); } else document.getElementById('gerr').textContent='Wrong password'; }
function show(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; const d=new Date(Date.now()+86400000); document.getElementById('date').value=d.toISOString().slice(0,10); cfgCheck(); envCheck(); }
let ENV='';
async function envCheck(){ const b=document.getElementById('envbadge'); try{ const d=await post('diag',{}); ENV=(d&&d.env)||''; if(ENV==='production'){ b.textContent='🔴 LIVE'; b.style.background='#3a0d0d'; b.style.color='#ff8a8a'; } else if(ENV==='sandbox'){ b.textContent='🧪 TEST'; b.style.background='#0e2a3a'; b.style.color='#8ad0ff'; } else { b.textContent=''; } }catch(_){ b.textContent=''; } }
async function post(action,body){ const r=await fetch(FN+'/fedex-pickup',{method:'POST',headers:{'Content-Type':'application/json','X-Office-Pw':pw()},body:JSON.stringify(Object.assign({action:action,pw:pw()},body||{}))}); return r.json(); }
async function cfgCheck(){ const d=await post('availability',{date:document.getElementById('date').value}).catch(()=>({})); if(d&&d.configured===false){ document.getElementById('cfgbanner').innerHTML='<div class="banner">⚙️ FedEx isn’t connected yet — add your API keys in the vault (FEDEX_CLIENT_ID / FEDEX_CLIENT_SECRET / FEDEX_ACCOUNT_NUMBER) and this lights up. The page + buttons are ready.</div>'; } }
async function checkAvail(){ const o=document.getElementById('pout'); o.innerHTML='Checking…'; const d=await post('availability',{date:document.getElementById('date').value,readyTime:document.getElementById('ready').value+':00',closeTime:document.getElementById('close').value+':00'}); if(d.configured===false){ o.innerHTML='<span class="err">Not connected yet — add FedEx keys in the vault.</span>'; return;} o.innerHTML= d.ok? '<span class="ok">✓ Available.</span> '+summ(d.result) : '<span class="err">'+(d.error||'No windows returned')+'</span>'; }
async function schedule(){ const o=document.getElementById('pout'); const msg=(ENV==='production'?'🔴 LIVE — this sends a REAL FedEx driver to the shop (3137 Skinner Dr) on '+document.getElementById('date').value+'. Book it?':'Schedule a FedEx pickup for '+document.getElementById('date').value+'?'); if(!confirm(msg))return; o.innerHTML='Scheduling…'; const d=await post('schedule',{date:document.getElementById('date').value,packageCount:+document.getElementById('pkgs').value,weightLbs:+document.getElementById('wt').value,readyTime:document.getElementById('ready').value+':00',closeTime:document.getElementById('close').value+':00',packageLocation:document.getElementById('loc').value,actor:'office'}); if(d.configured===false){ o.innerHTML='<span class="err">Not connected yet — add FedEx keys in the vault.</span>'; return;} if(d.ok){ o.innerHTML='<div class="conf">✅ Pickup scheduled!'+(d.confirmation?('<br>Confirmation: '+d.confirmation):'')+'</div>'; } else { o.innerHTML='<span class="err">'+(d.error||'Could not schedule')+'</span>'; } }
function summ(r){ try{ return '<span class="muted">'+JSON.stringify(r&&r.output? (r.output.options||r.output):r).slice(0,180)+'</span>'; }catch(_){ return ''; } }
async function track(){ const o=document.getElementById('tout'); const nums=(document.getElementById('nums').value||'').split(/[\s,]+/).filter(Boolean); if(!nums.length){o.innerHTML='<span class="err">Enter tracking #s</span>';return;} o.innerHTML='Tracking…'; const r=await fetch(FN+'/fedex-track?secret='+encodeURIComponent('tn-vapi-admin-9f83b1c4e7a206d5'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:nums})}); const d=await r.json(); if(d.configured===false){ o.innerHTML='<span class="err">Not connected yet.</span>'; return;} if(!d.ok){ o.innerHTML='<span class="err">'+(d.error||'track failed')+'</span>'; return;} o.innerHTML='<b>'+d.delivered+' of '+d.count+' delivered</b><br>'+(d.results||[]).map(function(x){return (x.delivered?'✅ ':'🚚 ')+x.tracking+' — '+x.status;}).join('<br>'); }
(function(){ if(pw()){ verify(pw()).then(function(ok){ if(ok) show(); }); } })();
</script>
</body></html>
