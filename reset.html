<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Refreshing Ant…</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #16233a 0%, #0b0f18 60%);
    color: #e6e9f0; display: flex; align-items: center; justify-content: center;
    padding: 28px calc(20px + env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-right));
    text-align: center;
  }
  .card { max-width: 420px; width: 100%; }
  .ant { font-size: 46px; line-height: 1; margin-bottom: 14px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; letter-spacing: .01em; }
  p { font-size: 15px; line-height: 1.5; color: #a7b0c4; margin: 0 0 22px; }
  .spinner {
    width: 42px; height: 42px; margin: 0 auto 20px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.14); border-top-color: #4ad991;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  #steps { font-size: 13px; color: #7f8aa3; min-height: 20px; font-weight: 600; }
  #go {
    display: none; margin-top: 6px; width: 100%; padding: 15px 18px; border: 0;
    border-radius: 14px; background: linear-gradient(135deg, #10b981, #047857);
    color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ant">🐜</div>
    <div class="spinner" id="sp"></div>
    <h1>Refreshing your Ant app</h1>
    <p>Clearing the old version and loading the newest one. This takes a few seconds — don't close the page.</p>
    <div id="steps">Starting…</div>
    <button id="go">Open Ant now →</button>
  </div>
<script>
(function () {
  'use strict';
  // Where to land after the wipe. ?to= lets Teddy point it anywhere; default = the tech app.
  var DEST = '/tech';
  try {
    var to = new URLSearchParams(location.search).get('to');
    if (to && /^\/[A-Za-z0-9_./?=&#-]*$/.test(to)) DEST = to;
  } catch (_) {}

  var stepsEl = document.getElementById('steps');
  function step(t) { if (stepsEl) stepsEl.textContent = t; }

  function goNow() {
    var url = DEST + (DEST.indexOf('?') === -1 ? '?' : '&') + '_fresh=' + Date.now();
    try { location.replace(url); } catch (_) { location.href = url; }
  }

  async function wipe() {
    // 1) Unregister EVERY service worker so nothing old can intercept the reload.
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        step('Removing the old app…');
        var regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); }));
      }
    } catch (_) {}
    // 2) Delete EVERY cache bucket (all versions).
    try {
      if (window.caches && caches.keys) {
        step('Clearing saved files…');
        var keys = await caches.keys();
        await Promise.all(keys.map(function (k) { return caches.delete(k).catch(function () {}); }));
      }
    } catch (_) {}
    step('Done — loading the new version…');
    // Small beat so the wipe settles, then land on a fresh, cache-busted page.
    setTimeout(goNow, 700);
  }

  // If anything hangs (weird browser), show a manual button after 6s so Jimmy is never stuck.
  var fallback = setTimeout(function () {
    var sp = document.getElementById('sp'); if (sp) sp.style.display = 'none';
    var go = document.getElementById('go'); if (go) { go.style.display = 'block'; go.onclick = goNow; }
    step('Tap the button to finish.');
  }, 6000);

  wipe().finally(function () { clearTimeout(fallback); });
})();
</script>
</body>
</html>
