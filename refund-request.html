<style>
  :root { --bg: #0b0d10; --card: #161a1f; --line: #2a2f37; --text: #e6e8eb; --muted: #8b919c; --accent: #4ad991; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 18px 80px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .tag { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    background: #0d1014; border: 1px solid var(--line); color: var(--text);
    font: inherit; font-size: 14px;
  }
  textarea { min-height: 80px; resize: vertical; }
  button { margin-top: 20px; width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--accent); color: #0b1414; font-weight: 700; font-size: 15px; cursor: pointer; }
  .status { margin-top: 16px; padding: 14px; border-radius: 10px; font-size: 13px; }
  .status.muted { background: rgba(139,145,156,0.1); border: 1px solid rgba(139,145,156,0.2); color: var(--muted); }
  .status.success { background: rgba(74,217,145,0.1); border: 1px solid rgba(74,217,145,0.3); color: var(--accent); }
  .status.fail { background: rgba(239,106,106,0.1); border: 1px solid rgba(239,106,106,0.3); color: #ef6a6a; }
  .help { color: var(--muted); font-size: 12px; margin-top: 4px; }
</style>

<body>
<script src="/office-nav.js?v=20260604-pills-readable"></script>
<div class="wrap">
  <h1>💸 Refund Request</h1>
  <p class="tag">Log a customer refund request. Teddy gets an SMS with policy classification. Decision comes back ASAP.</p>
  <div class="card">
    <label for="job-id">Job ID</label>
    <input id="job-id" type="number" placeholder="e.g. 18537" />

    <label for="amount">Amount (dollars)</label>
    <input id="amount" type="number" step="0.01" placeholder="e.g. 125.00" />
    <div class="help">Policy: warranty jobs ≤ $25 auto-recommended approve · &gt; $200 flagged high-value · else standard review</div>

    <label for="reason">Reason (1 sentence)</label>
    <input id="reason" type="text" placeholder="e.g. tech missed appointment, customer paid for diagnostic" />

    <label for="customer">Customer name</label>
    <input id="customer" type="text" placeholder="e.g. Sarah Johnson" />

    <label for="notes">Additional notes (optional)</label>
    <textarea id="notes" placeholder="Anything else Teddy needs to know"></textarea>

    <button id="submit">Submit Refund Request</button>
    <div id="status" class="status muted" style="display:none;"></div>
  </div>
</div>
<script>
const BASE = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
const params = new URLSearchParams(location.search);
if (params.get('job_id')) document.getElementById('job-id').value = params.get('job_id');
document.getElementById('submit').addEventListener('click', async () => {
  const jobId = Number(document.getElementById('job-id').value);
  const amount = Number(document.getElementById('amount').value);
  const reason = document.getElementById('reason').value.trim();
  if (!jobId || !amount || !reason) { setStatus('Fill in job ID, amount, and reason.', 'fail'); return; }
  const payload = {
    job_id: jobId,
    amount_cents: Math.round(amount * 100),
    reason_short: reason,
    customer_first_name: document.getElementById('customer').value.trim() || undefined,
    notes: document.getElementById('notes').value.trim() || undefined,
    requested_by: 'office_ui',
  };
  setStatus('Sending…', 'muted');
  try {
    const r = await fetch(`${BASE}/record_refund_request`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const d = await r.json();
    if (d.success) setStatus(`${d.amount_dollar} classified as ${d.classification}. ${d.note || ''}`, 'success');
    else setStatus(`Failed: ${d.message || JSON.stringify(d)}`, 'fail');
  } catch (e) { setStatus(`Error: ${e.message}`, 'fail'); }
});
function setStatus(text, kind) {
  const el = document.getElementById('status');
  el.style.display = 'block';
  el.className = 'status ' + kind;
  el.textContent = text;
}
</script>
