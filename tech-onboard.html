<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1118; color: #e8edf5; min-height: 100vh; padding: 24px 18px; max-width: 540px; margin: 0 auto; }
  :root { --orange:#f5a623; --green:#00d68f; --muted:#8a93aa; --panel:#131720; --border:#2a3040; --bg:#0e1118; }
  .header { text-align: center; padding: 6px 0 22px; }
  .header .ant { font-size: 32px; }
  .header h1 { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
  label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: #e8edf5; font-size: 16px; outline: none; }
  input:focus { border-color: var(--orange); }
  button { width: 100%; padding: 14px; background: var(--orange); color: #1a1208; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 18px; font-size: 14px; }
  .msg { margin-top: 14px; padding: 10px; border-radius: 6px; display: none; font-size: 13px; }
  .msg.show { display: block; }
  .msg.ok { background: rgba(0,214,143,0.10); color: var(--green); border: 1px solid var(--green); }
  .msg.err { background: rgba(255,107,107,0.10); color: #ff6b6b; border: 1px solid #ff6b6b; }
  .auth { position: fixed; inset: 0; background: rgba(14,17,24,0.96); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .auth-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; max-width: 360px; text-align: center; }
  .auth-card input { margin: 12px 0; }

<body>

<div id="auth" class="auth">
  <div class="auth-card">
    <div style="font-size:36px">🐜</div>
    <div style="font-size:18px;font-weight:700">Office Access</div>
    <input id="pw" type="password" placeholder="office password">
    <button id="pwBtn">Unlock</button>
    <div id="pwErr" style="color:#ff6b6b;font-size:12px;margin-top:8px"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header"><div class="ant">🐜</div><h1>Onboard New Tech</h1></div>
  <div class="card">
    <label>First name</label><input id="first" type="text">
    <label>Last name</label><input id="last" type="text">
    <label>Phone (E.164 or 10 digits)</label><input id="phone" type="tel" placeholder="+16152802949">
    <label>Email (optional)</label><input id="email" type="email">
    <label>Commission rate (0-1, default 0.40)</label><input id="commission" type="number" step="0.05" value="0.40">
    <label>Tool-pack minutes (default 8)</label><input id="tool" type="number" value="8">
    <button id="goBtn">Onboard Tech</button>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
(function() {
  const XANO = 'https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA';
  const AUTH_KEY = 'tn_office_auth_v1';
    async function __verifyOfficePassword(pw){if(!pw)return false;try{const r=await fetch('https://xbtp-g9bh-ditq.n7e.xano.io/api:3e_TffpA/verify_office_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});const d=await r.json();return d&&d.success===true;}catch{return false;}}
const $ = (id) => document.getElementById(id);

  if (localStorage.getItem(AUTH_KEY) === '1') unlock();
  \.addEventListener('click', async () => {
    if ($('pw').value === OFFICE_PASSWORD) { localStorage.setItem(AUTH_KEY, '1'); unlock(); }
    else { $('pwErr').textContent = 'wrong password'; }
  });
  function unlock() { $('auth').style.display = 'none'; $('app').style.display = 'block'; }

  $('goBtn').addEventListener('click', async () => {
    const first = $('first').value.trim();
    const last = $('last').value.trim();
    const phone = $('phone').value.trim();
    if (!first || !last || !phone) { showMsg('err', 'first + last + phone required'); return; }
    $('goBtn').disabled = true; showMsg('', 'creating...');
    try {
      const res = await fetch(`${XANO}/onboard_tech`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          first_name: first, last_name: last, phone,
          email: $('email').value.trim(),
          commission_rate: parseFloat($('commission').value) || 0.40,
          tool_pack_minutes: parseInt($('tool').value, 10) || 8,
        })
      });
      const d = await res.json();
      if (!d || !d.success) throw new Error((d && d.message) || 'failed');
      showMsg('ok', `✓ tech #${d.tech_id} created. Welcome SMS sent. Remember to set their PIN.`);
      ['first','last','phone','email'].forEach(id => $(id).value = '');
    } catch (e) { showMsg('err', 'fail: ' + (e.message || e)); }
    $('goBtn').disabled = false;
  });

  function showMsg(cls, txt) {
    $('msg').className = 'msg show' + (cls ? ' ' + cls : '');
    $('msg').textContent = txt;
  }
})();
</script>
